- ref: S.1:1
  ar: بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  trl: '*Bi-smi llāhi r-raḥmāni r-raḥīm*'
  trad: Par le nom d'Allaah, ar-raḥmān, ar-raḥīm.
- ref: S.1:2
  ar: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
  trl: '*Al-ḥamdu li-llāhi rabbi l-ʿālamīn*'
  trad: La *ḥamd* appartient à Allaah, Rabb des *ʿālamīn*.
- ref: S.1:3
  ar: الرَّحْمَٰنِ الرَّحِيمِ
  trl: '*Ar-raḥmāni r-raḥīm*'
  trad: Ar-raḥmān, ar-raḥīm.
- ref: S.1:4
  ar: مَالِكِ يَوْمِ الدِّينِ
  trl: '*Māliki yawmi d-dīn*'
  trad: Maître du Jour du *dīn*.
- ref: S.1:5
  ar: إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ
  trl: '*Iyyāka naʿbudu wa-iyyāka nastaʿīn*'
  trad: Toi seul nous servons, et Toi seul nous implorons l'aide.
- ref: S.1:6
  ar: اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ
  trl: '*Ihdinā ṣ-ṣirāṭa l-mustaqīm*'
  trad: Oriente-nous sur le chemin droit.
- ref: S.1:7
  ar: صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ
  trl: '*Ṣirāṭa lladhīna anʿamta ʿalayhim, ghayri l-maghḍūbi ʿalayhim wa-lā ḍ-ḍāllīn*'
  trad: Le chemin de ceux que Tu as comblés de bienfaits — non de ceux sur qui s'abat le *ghaḍab*, ni des *ḍāllīn*.
