- ref: S.19:1
  ar: كهيعص
  trl: Kāf hā yā ʿayn ṣād
  trad: Kāf. Hā. Yā. ʿAyn. Ṣād.
- ref: S.19:2–3
  ar: ذِكْرُ رَحْمَتِ رَبِّكَ عَبْدَهُ زَكَرِيَّا إِذْ نَادَىٰ رَبَّهُ نِدَاءً خَفِيًّا
  trl: Dhikru raḥmati rabbika ʿabdahu zakariyyā idh nādā rabbahu nidāʾan khafiyyā
  trad: Rappel (dhikr) de la raḥma de ton Rabb envers Son ʿabd Zakariyyā — quand il appela son Rabb d'un appel discret (khafiyy).
- ref: S.19:4–6
  ar: قَالَ رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي وَاشْتَعَلَ الرَّأْسُ شَيْبًا وَلَمْ أَكُنْ بِدُعَائِكَ رَبِّ شَقِيًّا وَإِنِّي خِفْتُ الْمَوَالِيَ مِنْ وَرَائِي وَكَانَتِ امْرَأَتِي عَاقِرًا فَهَبْ لِي مِنْ لَدُنْكَ وَلِيًّا يَرِثُنِي وَيَرِثُ مِنْ آلِ يَعْقُوبَ ۖ وَاجْعَلْهُ رَبِّ رَضِيًّا
  trl: Qāla rabbi innī wahana l-ʿaẓmu minnī wa-shtaʿala r-raʾsu shaybā wa-lam akun bi-duʿāʾika rabbi shaqiyyā — wa-innī khiftu l-mawāliya min warāʾī wa-kānati mraʾatī ʿāqiran fa-hab lī min ladunka waliyyā — yarithunī wa-yarithu min āli yaʿqūba wa-jʿalhu rabbi raḍiyyā
  trad: 'Il dit : « Mon Rabb, mes os se sont affaiblis (wahana), et ma tête s''est embrasée de blancheur (ishtaʿala … shayban) — et jamais mon invocation (duʿāʾ) vers Toi, mon Rabb, ne m''a laissé malheureux (shaqiyy). Et je redoute mes proches héritiers (al-mawāliya) après moi, alors que ma femme est stérile (ʿāqir) — accorde-moi donc, de Ta proximité (min ladunka), un héritier (waliyy), qui hérite de moi et hérite de la famille (āl) de Yaʿqūb — et fais de lui, mon Rabb, quelqu''un d''agréé (raḍiyy). »'
- ref: S.19:7
  ar: يَا زَكَرِيَّا إِنَّا نُبَشِّرُكَ بِغُلَامٍ اسْمُهُ يَحْيَىٰ لَمْ نَجْعَلْ لَهُ مِنْ قَبْلُ سَمِيًّا
  trl: Yā zakariyyā innā nubashshiruka bi-ghulāmin ismuhu yaḥyā lam najʿal lahu min qablu samiyyā
  trad: « Ô Zakariyyā, Nous t'annonçons un garçon (ghulām) dont le nom est Yaḥyā — Nous ne lui avons donné, avant lui, aucun homonyme (samiyy). »
- ref: S.19:8–9
  ar: قَالَ رَبِّ أَنَّىٰ يَكُونُ لِي غُلَامٌ وَكَانَتِ امْرَأَتِي عَاقِرًا وَقَدْ بَلَغْتُ مِنَ الْكِبَرِ عِتِيًّا قَالَ كَذَٰلِكَ قَالَ رَبُّكَ هُوَ عَلَيَّ هَيِّنٌ وَقَدْ خَلَقْتُكَ مِنْ قَبْلُ وَلَمْ تَكُ شَيْئًا
  trl: Qāla rabbi annā yakūnu lī ghulāmun wa-kānati mraʾatī ʿāqiran wa-qad balaghtu mina l-kibari ʿitiyyā — qāla kadhālika qāla rabbuka huwa ʿalayya hayyinun wa-qad khalaqtuka min qablu wa-lam taku shayʾā
  trad: 'Il dit : « Mon Rabb, comment aurais-je un garçon, alors que ma femme est stérile, et que j''ai atteint, dans la vieillesse, un âge extrême (ʿitiyy) ? » Il dit : « Il en est ainsi ; ton Rabb a dit : “Cela M''est aisé (hayyin) — Je t''ai créé auparavant, alors que tu n''étais rien.” »'
- ref: S.19:10–11
  ar: قَالَ رَبِّ اجْعَلْ لِي آيَةً ۚ قَالَ آيَتُكَ أَلَّا تُكَلِّمَ النَّاسَ ثَلَاثَ لَيَالٍ سَوِيًّا فَخَرَجَ عَلَىٰ قَوْمِهِ مِنَ الْمِحْرَابِ فَأَوْحَىٰ إِلَيْهِمْ أَنْ سَبِّحُوا بُكْرَةً وَعَشِيًّا
  trl: Qāla rabbi jʿal lī āyatan qāla āyatuka allā tukallima n-nāsa thalātha layālin sawiyyā — fa-kharaja ʿalā qawmihi mina l-miḥrābi fa-awḥā ilayhim an sabbiḥū bukratan wa-ʿashiyyā
  trad: 'Il dit : « Mon Rabb, place pour moi un signe (āya). » Il dit : « Ton signe est que tu ne parleras pas aux gens durant trois nuits, tout en étant en parfaite santé (sawiyy). » Il sortit alors vers son peuple depuis al-miḥrāb, et leur communiqua par signes (fa-awḥā) de déclarer la transcendance (sabbiḥū) au matin et au soir.'
- ref: S.19:12–15
  ar: يَا يَحْيَىٰ خُذِ الْكِتَابَ بِقُوَّةٍ ۖ وَآتَيْنَاهُ الْحُكْمَ صَبِيًّا وَحَنَانًا مِنْ لَدُنَّا وَزَكَاةً ۖ وَكَانَ تَقِيًّا وَبَرًّا بِوَالِدَيْهِ وَلَمْ يَكُنْ جَبَّارًا عَصِيًّا وَسَلَامٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّا
  trl: Yā yaḥyā khudhi l-kitāba bi-quwwatin wa-ātaynāhu l-ḥukma ṣabiyyā — wa-ḥanānan min ladunnā wa-zakātan wa-kāna taqiyyā — wa-barran bi-wālidayhi wa-lam yakun jabbāran ʿaṣiyyā — wa-salāmun ʿalayhi yawma wulida wa-yawma yamūtu wa-yawma yubʿathu ḥayyā
  trad: « Ô Yaḥyā, prends le Kitāb avec force ! » — et Nous lui avons donné le ḥukm alors qu'il était encore enfant (ṣabiyy), et une tendresse (ḥanān) venue de Notre proximité, et une pureté [de cœur] (zakāt) — et il était empreint de taqwā (taqiyy), et dévoué envers ses deux parents (birr), et il n'était ni tyrannique (jabbār) ni rebelle (ʿaṣiyy). Et paix sur lui, le jour où il naquit, le jour où il meurt, et le jour où il sera ressuscité vivant.
- ref: S.19:16–17
  ar: وَاذْكُرْ فِي الْكِتَابِ مَرْيَمَ إِذِ انْتَبَذَتْ مِنْ أَهْلِهَا مَكَانًا شَرْقِيًّا فَاتَّخَذَتْ مِنْ دُونِهِمْ حِجَابًا فَأَرْسَلْنَا إِلَيْهَا رُوحَنَا فَتَمَثَّلَ لَهَا بَشَرًا سَوِيًّا
  trl: Wa-dhkur fi l-kitābi maryama idhi ntabadhat min ahlihā makānan sharqiyyā — fa-ttakhadhat min dūnihim ḥijāban fa-arsalnā ilayhā rūḥanā fa-tamaththala lahā basharan sawiyyā
  trad: Et rappelle, dans le Kitāb, Maryam, quand elle se retira des siens en un lieu oriental (sharqiyy). Elle mit alors, entre elle et eux, un voile (ḥijāb) ; Nous envoyâmes vers elle Notre rūḥ, qui se présenta à elle sous l'apparence d'un être humain accompli (basharan sawiyyan).
- ref: S.19:18–19
  ar: قَالَتْ إِنِّي أَعُوذُ بِالرَّحْمَٰنِ مِنْكَ إِنْ كُنْتَ تَقِيًّا قَالَ إِنَّمَا أَنَا رَسُولُ رَبِّكِ لِأَهَبَ لَكِ غُلَامًا زَكِيًّا
  trl: Qālat innī aʿūdhu bi-r-raḥmāni minka in kunta taqiyyā — qāla innamā anā rasūlu rabbiki li-ahaba laki ghulāman zakiyyā
  trad: 'Elle dit : « Je cherche refuge auprès d''ar-Raḥmān contre toi, si tu es empreint de taqwā (taqiyy). » Il dit : « Je ne suis qu''un rasūl de ton Rabb, [venu] pour te faire don d''un garçon pur (zakiyy). »'
- ref: S.19:20–21
  ar: قَالَتْ أَنَّىٰ يَكُونُ لِي غُلَامٌ وَلَمْ يَمْسَسْنِي بَشَرٌ وَلَمْ أَكُ بَغِيًّا قَالَ كَذَٰلِكِ قَالَ رَبُّكِ هُوَ عَلَيَّ هَيِّنٌ ۖ وَلِنَجْعَلَهُ آيَةً لِلنَّاسِ وَرَحْمَةً مِنَّا ۚ وَكَانَ أَمْرًا مَقْضِيًّا
  trl: Qālat annā yakūnu lī ghulāmun wa-lam yamsasnī basharun wa-lam aku baghiyyā — qāla kadhāliki qāla rabbuki huwa ʿalayya hayyinun wa-li-najʿalahu āyatan li-n-nāsi wa-raḥmatan minnā wa-kāna amran maqḍiyyā
  trad: 'Elle dit : « Comment aurais-je un garçon, alors qu''aucun être humain ne m''a touchée, et que je n''ai jamais eu une conduite dépravée (baghiyy) ? » Il dit : « Il en est ainsi ; ton Rabb a dit : “Cela M''est aisé” — et [cela,] pour que Nous fassions de lui un signe (āya) pour les gens et une raḥma venue de Nous. C''était une affaire déjà décrétée (amran maqḍiyyan). »'
- ref: S.19:22–26
  ar: ۞ فَحَمَلَتْهُ فَانْتَبَذَتْ بِهِ مَكَانًا قَصِيًّا فَأَجَاءَهَا الْمَخَاضُ إِلَىٰ جِذْعِ النَّخْلَةِ قَالَتْ يَا لَيْتَنِي مِتُّ قَبْلَ هَٰذَا وَكُنْتُ نَسْيًا مَنْسِيًّا فَنَادَاهَا مِنْ تَحْتِهَا أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ تُسَاقِطْ عَلَيْكِ رُطَبًا جَنِيًّا فَكُلِي وَاشْرَبِي وَقَرِّي عَيْنًا ۖ فَإِمَّا تَرَيِنَّ مِنَ الْبَشَرِ أَحَدًا فَقُولِي إِنِّي نَذَرْتُ لِلرَّحْمَٰنِ صَوْمًا فَلَنْ أُكَلِّمَ الْيَوْمَ إِنْسِيًّا
  trl: Fa-ḥamalathu fa-ntabadhat bihi makānan qaṣiyyā — fa-ajāʾahā l-makhāḍu ilā jidhʿi n-nakhlati qālat yā laytanī mittu qabla hādhā wa-kuntu nasyan mansiyyā — fa-nādāhā min taḥtihā allā taḥzanī qad jaʿala rabbuki taḥtaki sariyyā — wa-huzzī ilayki bi-jidhʿi n-nakhlati tusāqiṭ ʿalayki ruṭaban janiyyā — fa-kulī wa-shrabī wa-qarrī ʿaynan fa-immā tarayinna mina l-bashari aḥadan fa-qūlī innī nadhartu li-r-raḥmāni ṣawman fa-lan ukallima l-yawma insiyyā
  trad: 'Elle le porta alors, et se retira avec lui en un lieu éloigné (qaṣiyy). Les douleurs de l''enfantement (al-makhāḍ) la conduisirent au tronc du palmier (jidhʿ an-nakhla) ; elle dit : « Ah, si seulement j''étais morte avant cela, et si j''étais devenue une chose oubliée, tout à fait effacée (nasyan mansiyyā) ! » Alors on l''appela d''au-dessous d''elle : « Ne t''afflige pas — ton Rabb a placé sous toi un [ruisseau] (sariyy). Secoue vers toi le tronc du palmier : il fera tomber sur toi des dattes fraîches, prêtes à cueillir (ruṭaban janiyyā). Mange donc, bois, et que ton cœur s''apaise (qarrī ʿaynan) — et si jamais tu vois quelque être humain, dis : “J''ai voué (nadhartu) au Raḥmān un ṣawm ; je ne parlerai aujourd''hui à personne (insiyy).” »'
- ref: S.19:27–29
  ar: فَأَتَتْ بِهِ قَوْمَهَا تَحْمِلُهُ ۖ قَالُوا يَا مَرْيَمُ لَقَدْ جِئْتِ شَيْئًا فَرِيًّا يَا أُخْتَ هَارُونَ مَا كَانَ أَبُوكِ امْرَأَ سَوْءٍ وَمَا كَانَتْ أُمُّكِ بَغِيًّا فَأَشَارَتْ إِلَيْهِ ۖ قَالُوا كَيْفَ نُكَلِّمُ مَنْ كَانَ فِي الْمَهْدِ صَبِيًّا
  trl: Fa-atat bihi qawmahā taḥmiluhu qālū yā maryamu laqad jiʾti shayʾan fariyyā — yā ukhta hārūna mā kāna abūki mraʾa sawʾin wa-mā kānat ummuki baghiyyā — fa-ashārat ilayhi qālū kayfa nukallimu man kāna fi l-mahdi ṣabiyyā
  trad: 'Elle vint donc vers son peuple en le portant. Ils dirent : « Ô Maryam, tu as commis là une chose monstrueuse (fariyy) ! Ô sœur de Hārūn, ton père n''était pas un homme de mal, et ta mère n''était pas dépravée (baghiyy). » Elle fit alors un signe vers lui (fa-ashārat ilayhi). Ils dirent : « Comment parlerions-nous à qui est encore, dans le berceau (mahd), un tout jeune enfant (ṣabiyy) ? »'
- ref: S.19:30–33
  ar: قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا وَجَعَلَنِي مُبَارَكًا أَيْنَ مَا كُنْتُ وَأَوْصَانِي بِالصَّلَاةِ وَالزَّكَاةِ مَا دُمْتُ حَيًّا وَبَرًّا بِوَالِدَتِي وَلَمْ يَجْعَلْنِي جَبَّارًا شَقِيًّا وَالسَّلَامُ عَلَيَّ يَوْمَ وُلِدْتُ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيًّا
  trl: Qāla innī ʿabdu llāhi ātāniya l-kitāba wa-jaʿalanī nabiyyā — wa-jaʿalanī mubārakan ayna mā kuntu wa-awṣānī bi-ṣ-ṣalāti wa-z-zakāti mā dumtu ḥayyā — wa-barran bi-wālidatī wa-lam yajʿalnī jabbāran shaqiyyā — wa-s-salāmu ʿalayya yawma wulidtu wa-yawma amūtu wa-yawma ubʿathu ḥayyā
  trad: 'Il dit : « Je suis le ʿabd d''Allaah ; Il m''a donné le Kitāb et a fait de moi un nabī. Il a fait de moi quelqu''un mubārak où que je sois, et Il m''a enjoint la ṣalāt et la zakāt tant que je vivrai, et [Il m''a fait] dévoué envers ma mère (birr) ; et Il ne m''a pas fait tyrannique (jabbār), malheureux (shaqiyy). Et paix sur moi, le jour où je suis né, le jour où je meurs, et le jour où je serai ressuscité vivant. »'
- ref: S.19:34
  ar: ذَٰلِكَ عِيسَى ابْنُ مَرْيَمَ ۚ قَوْلَ الْحَقِّ الَّذِي فِيهِ يَمْتَرُونَ
  trl: Dhālika ʿīsā bnu maryama qawla l-ḥaqqi lladhī fīhi yamtarūn
  trad: Voilà ʿĪsā, fils de Maryam — la parole du ḥaqq (qawl al-ḥaqq) au sujet de laquelle ils doutent (yamtarūn).
- ref: S.19:35
  ar: مَا كَانَ لِلَّهِ أَنْ يَتَّخِذَ مِنْ وَلَدٍ ۖ سُبْحَانَهُ ۚ إِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُنْ فَيَكُونُ
  trl: Mā kāna lillāhi an yattakhidha min waladin subḥānahu — idhā qaḍā amran fa-innamā yaqūlu lahu kun fa-yakūn
  trad: 'Il n''appartient pas à Allaah de S''attribuer un enfant (waladin) — Il est dégagé de toute imperfection (subḥānahu). Quand Il décrète une chose, Il lui dit seulement : « Sois » — et cela est.'
- ref: S.19:36
  ar: وَإِنَّ اللَّهَ رَبِّي وَرَبُّكُمْ فَاعْبُدُوهُ ۚ هَٰذَا صِرَاطٌ مُسْتَقِيمٌ
  trl: Wa-inna llāha rabbī wa-rabbukum fa-ʿbudūhu — hādhā ṣirāṭun mustaqīm
  trad: Et Allaah est mon Rabb et votre Rabb — adorez-Le donc. Voilà un chemin droit (ṣirāṭ mustaqīm).
- ref: S.19:37
  ar: فَاخْتَلَفَ الْأَحْزَابُ مِنْ بَيْنِهِمْ ۖ فَوَيْلٌ لِلَّذِينَ كَفَرُوا مِنْ مَشْهَدِ يَوْمٍ عَظِيمٍ
  trl: Fa-khtalafa l-aḥzābu min baynihim — fa-waylun lilladhīna kafarū min mashhadi yawmin ʿaẓīm
  trad: Les factions (al-aḥzāb) se sont alors divisées entre elles — *waylun* à ceux qui ont mécru, devant la scène (mashhad) d'un jour immense !
- ref: S.19:38
  ar: أَسْمِعْ بِهِمْ وَأَبْصِرْ يَوْمَ يَأْتُونَنَا ۖ لَٰكِنِ الظَّالِمُونَ الْيَوْمَ فِي ضَلَالٍ مُبِينٍ
  trl: Asmiʿ bihim wa-abṣir yawma yaʾtūnanā — lākini ẓ-ẓālimūna l-yawma fī ḍalālin mubīn
  trad: Comme ils entendront bien et verront bien, le jour où ils viendront à Nous ! Mais les injustes (aẓ-ẓālimūn) sont, aujourd'hui, dans un égarement manifeste (ḍalāl mubīn).
- ref: S.19:39
  ar: وَأَنْذِرْهُمْ يَوْمَ الْحَسْرَةِ إِذْ قُضِيَ الْأَمْرُ وَهُمْ فِي غَفْلَةٍ وَهُمْ لَا يُؤْمِنُونَ
  trl: Wa-andhirhum yawma l-ḥasrati idh quḍiya l-amru wa-hum fī ghaflatin wa-hum lā yuʾminūn
  trad: Et avertis-les du jour du regret (yawm al-ḥasra), quand l'affaire sera tranchée (quḍiya l-amru) — alors qu'ils sont dans l'insouciance (ghafla), et qu'ils ne croient pas.
- ref: S.19:40
  ar: إِنَّا نَحْنُ نَرِثُ الْأَرْضَ وَمَنْ عَلَيْهَا وَإِلَيْنَا يُرْجَعُونَ
  trl: Innā naḥnu narithu l-arḍa wa-man ʿalayhā wa-ilaynā yurjaʿūn
  trad: C'est Nous, Nous seul, qui hériterons (narithu) de la terre et de qui s'y trouve — et c'est à Nous qu'ils seront ramenés.
- ref: S.19:41
  ar: وَاذْكُرْ فِي الْكِتَابِ إِبْرَاهِيمَ ۚ إِنَّهُ كَانَ صِدِّيقًا نَبِيًّا
  trl: Wa-dhkur fi l-kitābi ibrāhīma innahu kāna ṣiddīqan nabiyyā
  trad: Et rappelle, dans le Kitāb, Ibrāhīm — il était ṣiddīq, nabī.
- ref: S.19:42–45
  ar: إِذْ قَالَ لِأَبِيهِ يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنْكَ شَيْئًا يَا أَبَتِ إِنِّي قَدْ جَاءَنِي مِنَ الْعِلْمِ مَا لَمْ يَأْتِكَ فَاتَّبِعْنِي أَهْدِكَ صِرَاطًا سَوِيًّا يَا أَبَتِ لَا تَعْبُدِ الشَّيْطَانَ ۖ إِنَّ الشَّيْطَانَ كَانَ لِلرَّحْمَٰنِ عَصِيًّا يَا أَبَتِ إِنِّي أَخَافُ أَنْ يَمَسَّكَ عَذَابٌ مِنَ الرَّحْمَٰنِ فَتَكُونَ لِلشَّيْطَانِ وَلِيًّا
  trl: Idh qāla li-abīhi yā abati lima taʿbudu mā lā yasmaʿu wa-lā yubṣiru wa-lā yughnī ʿanka shayʾā — yā abati innī qad jāʾanī mina l-ʿilmi mā lam yaʾtika fa-ttabiʿnī ahdika ṣirāṭan sawiyyā — yā abati lā taʿbudi sh-shayṭāna inna sh-shayṭāna kāna li-r-raḥmāni ʿaṣiyyā — yā abati innī akhāfu an yamassaka ʿadhābun mina r-raḥmāni fa-takūna li-sh-shayṭāni waliyyā
  trad: 'Quand il dit à son père : « Ô mon père, pourquoi adores-tu ce qui n''entend pas, ne voit pas, et ne te profite en rien (lā yughnī ʿanka shayʾā) ? Ô mon père, il m''est venu, de la science (al-ʿilm), ce qui ne t''est pas venu — suis-moi donc, je te guiderai vers un chemin droit et sûr (ṣirāṭan sawiyyā). Ô mon père, n''adore pas ash-shayṭān — ash-shayṭān a toujours été rebelle (ʿaṣiyy) envers ar-Raḥmān. Ô mon père, je crains qu''un châtiment venant d''ar-Raḥmān ne te touche, et que tu ne deviennes alors un allié (walī) pour ash-shayṭān. »'
- ref: S.19:46
  ar: قَالَ أَرَاغِبٌ أَنْتَ عَنْ آلِهَتِي يَا إِبْرَاهِيمُ ۖ لَئِنْ لَمْ تَنْتَهِ لَأَرْجُمَنَّكَ ۖ وَاهْجُرْنِي مَلِيًّا
  trl: Qāla a-rāghibun anta ʿan ālihatī yā ibrāhīmu la-in lam tantahi la-arjumannaka wa-hjurnī maliyyā
  trad: 'Il dit : « Éprouves-tu du dégoût (rāghib) pour mes dieux (ālihatī), ô Ibrāhīm ? Si tu ne cesses pas, je te lapiderai assurément (la-arjumannaka) — éloigne-toi de moi, pour longtemps (maliyyā). »'
- ref: S.19:47
  ar: قَالَ سَلَامٌ عَلَيْكَ ۖ سَأَسْتَغْفِرُ لَكَ رَبِّي ۖ إِنَّهُ كَانَ بِي حَفِيًّا
  trl: Qāla salāmun ʿalayka sa-astaghfiru laka rabbī innahu kāna bī ḥafiyyā
  trad: 'Il dit : « Paix (salām) sur toi — je demanderai pardon pour toi (sa-astaghfiru laka) à mon Rabb ; Il a toujours été, envers moi, ḥafiyy. »'
- ref: S.19:48
  ar: وَأَعْتَزِلُكُمْ وَمَا تَدْعُونَ مِنْ دُونِ اللَّهِ وَأَدْعُو رَبِّي عَسَىٰ أَلَّا أَكُونَ بِدُعَاءِ رَبِّي شَقِيًّا
  trl: Wa-aʿtazilukum wa-mā tadʿūna min dūni llāhi wa-adʿū rabbī ʿasā allā akūna bi-duʿāʾi rabbī shaqiyyā
  trad: Et je m'écarte de vous (aʿtazilukum), et de ce que vous invoquez en dehors d'Allaah, et j'invoque mon Rabb — peut-être ne serai-je pas malheureux (shaqiyy) dans mon invocation à mon Rabb.
- ref: S.19:49–50
  ar: فَلَمَّا اعْتَزَلَهُمْ وَمَا يَعْبُدُونَ مِنْ دُونِ اللَّهِ وَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ ۖ وَكُلًّا جَعَلْنَا نَبِيًّا وَوَهَبْنَا لَهُمْ مِنْ رَحْمَتِنَا وَجَعَلْنَا لَهُمْ لِسَانَ صِدْقٍ عَلِيًّا
  trl: Fa-lammā ʿtazalahum wa-mā yaʿbudūna min dūni llāhi wahabnā lahu isḥāqa wa-yaʿqūba wa-kullan jaʿalnā nabiyyā — wa-wahabnā lahum min raḥmatinā wa-jaʿalnā lahum lisāna ṣidqin ʿaliyyā
  trad: Quand il se fut écarté d'eux et de ce qu'ils adoraient en dehors d'Allaah, Nous lui fîmes don (wahabnā) d'Isḥāq et de Yaʿqūb, et de chacun Nous fîmes un nabī — et Nous leur fîmes don de Notre raḥma, et Nous leur donnâmes une renommée de vérité élevée (lisāna ṣidqin ʿaliyyā).
- ref: S.19:51
  ar: وَاذْكُرْ فِي الْكِتَابِ مُوسَىٰ ۚ إِنَّهُ كَانَ مُخْلَصًا وَكَانَ رَسُولًا نَبِيًّا
  trl: Wa-dhkur fi l-kitābi mūsā innahu kāna mukhlaṣan wa-kāna rasūlan nabiyyā
  trad: Et rappelle, dans le Kitāb, Mūsā — il était rendu pur (mukhlaṣ), et il était rasūl, nabī.
- ref: S.19:52
  ar: وَنَادَيْنَاهُ مِنْ جَانِبِ الطُّورِ الْأَيْمَنِ وَقَرَّبْنَاهُ نَجِيًّا
  trl: Wa-nādaynāhu min jānibi ṭ-ṭūri l-aymani wa-qarrabnāhu najiyyā
  trad: Et Nous l'avons appelé du côté droit du Ṭūr (jānib aṭ-ṭūr al-ayman), et Nous l'avons rapproché en confidence (qarrabnāhu najiyyā).
- ref: S.19:53
  ar: وَوَهَبْنَا لَهُ مِنْ رَحْمَتِنَا أَخَاهُ هَارُونَ نَبِيًّا
  trl: Wa-wahabnā lahu min raḥmatinā akhāhu hārūna nabiyyā
  trad: Et Nous lui fîmes don, de Notre raḥma, de son frère Hārūn, [comme] nabī.
- ref: S.19:54–55
  ar: وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ ۚ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ وَكَانَ رَسُولًا نَبِيًّا وَكَانَ يَأْمُرُ أَهْلَهُ بِالصَّلَاةِ وَالزَّكَاةِ وَكَانَ عِنْدَ رَبِّهِ مَرْضِيًّا
  trl: Wa-dhkur fi l-kitābi ismāʿīla innahu kāna ṣādiqa l-waʿdi wa-kāna rasūlan nabiyyā — wa-kāna yaʾmuru ahlahu bi-ṣ-ṣalāti wa-z-zakāti wa-kāna ʿinda rabbihi marḍiyyā
  trad: Et rappelle, dans le Kitāb, Ismāʿīl — il était véridique dans sa promesse (ṣādiq al-waʿd), et il était rasūl, nabī — et il ordonnait à sa famille (ahlahu) la ṣalāt et la zakāt, et il était, auprès de son Rabb, agréé (marḍiyy).
- ref: S.19:56–57
  ar: وَاذْكُرْ فِي الْكِتَابِ إِدْرِيسَ ۚ إِنَّهُ كَانَ صِدِّيقًا نَبِيًّا وَرَفَعْنَاهُ مَكَانًا عَلِيًّا
  trl: Wa-dhkur fi l-kitābi idrīsa innahu kāna ṣiddīqan nabiyyā — wa-rafaʿnāhu makānan ʿaliyyā
  trad: Et rappelle, dans le Kitāb, Idrīs — il était ṣiddīq, nabī — et Nous l'avons élevé en un lieu élevé (rafaʿnāhu makānan ʿaliyyā).
- ref: S.19:58
  ar: أُولَٰئِكَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِمْ مِنَ النَّبِيِّينَ مِنْ ذُرِّيَّةِ آدَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍ وَمِنْ ذُرِّيَّةِ إِبْرَاهِيمَ وَإِسْرَائِيلَ وَمِمَّنْ هَدَيْنَا وَاجْتَبَيْنَا ۚ إِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُ الرَّحْمَٰنِ خَرُّوا سُجَّدًا وَبُكِيًّا ۩
  trl: Ulāʾika lladhīna anʿama llāhu ʿalayhim mina n-nabiyyīna min dhurriyyati ādama wa-mimman ḥamalnā maʿa nūḥin wa-min dhurriyyati ibrāhīma wa-isrāʾīla wa-mimman hadaynā wa-jtabaynā — idhā tutlā ʿalayhim āyātu r-raḥmāni kharrū sujjadan wa-bukiyyā
  trad: Voilà ceux qu'Allaah a comblés (anʿama) parmi les nabiyyīn — de la descendance (dhurriyya) d'Ādam, de ceux que Nous avons portés (ḥamalnā) avec Nūḥ, de la descendance d'Ibrāhīm et d'Isrāʾīl, et de ceux que Nous avons guidés et choisis (ijtabaynā) — quand les āyāt d'ar-Raḥmān leur sont récitées, ils tombent, prosternés (sujjadan) et en pleurs (bukiyyā).
- ref: S.19:59–60
  ar: ۞ فَخَلَفَ مِنْ بَعْدِهِمْ خَلْفٌ أَضَاعُوا الصَّلَاةَ وَاتَّبَعُوا الشَّهَوَاتِ ۖ فَسَوْفَ يَلْقَوْنَ غَيًّا إِلَّا مَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا فَأُولَٰئِكَ يَدْخُلُونَ الْجَنَّةَ وَلَا يُظْلَمُونَ شَيْئًا
  trl: Fa-khalafa min baʿdihim khalfun aḍāʿū ṣ-ṣalāta wa-ttabaʿū sh-shahawāti fa-sawfa yalqawna ghayyā — illā man tāba wa-āmana wa-ʿamila ṣāliḥan fa-ulāʾika yadkhulūna l-jannata wa-lā yuẓlamūna shayʾā
  trad: 'Puis leur succéda (khalafa) une postérité (khalf) qui délaissa (aḍāʿū) la ṣalāt et suivit les *shahawāt* (désirs) — ils rencontreront donc l''égarement (ghayy) — sauf celui qui revient (tāba), croit, et agit droitement (ʿamila ṣāliḥan) : ceux-là entreront dans la Janna, et ne subiront aucune injustice (lā yuẓlamūna shayʾā).'
- ref: S.19:61–62
  ar: جَنَّاتِ عَدْنٍ الَّتِي وَعَدَ الرَّحْمَٰنُ عِبَادَهُ بِالْغَيْبِ ۚ إِنَّهُ كَانَ وَعْدُهُ مَأْتِيًّا لَا يَسْمَعُونَ فِيهَا لَغْوًا إِلَّا سَلَامًا ۖ وَلَهُمْ رِزْقُهُمْ فِيهَا بُكْرَةً وَعَشِيًّا
  trl: Jannāti ʿadnin allatī waʿada r-raḥmānu ʿibādahu bi-l-ghaybi innahu kāna waʿduhu maʾtiyyā — lā yasmaʿūna fīhā laghwan illā salāman wa-lahum rizquhum fīhā bukratan wa-ʿashiyyā
  trad: '[Ce sont] les jannāt d''ʿAdn qu''ar-Raḥmān a promises à Ses ʿibād, [en dehors de toute vision directe] (bi-l-ghayb) — Sa promesse est certes tenue (maʾtiyy, littéralement : à laquelle on parvient). Ils n''y entendent nulle parole vaine (laghw), sauf salām — et ils y ont leur subsistance (rizq), à chaque instant (bukratan wa-ʿashiyyā).'
- ref: S.19:63
  ar: تِلْكَ الْجَنَّةُ الَّتِي نُورِثُ مِنْ عِبَادِنَا مَنْ كَانَ تَقِيًّا
  trl: Tilka l-jannatu llatī nūrithu min ʿibādinā man kāna taqiyyā
  trad: Voilà la Janna que Nous faisons hériter (nūrithu) à celui, parmi Nos ʿibād, qui était empreint de taqwā (taqiyy).
- ref: S.19:64
  ar: وَمَا نَتَنَزَّلُ إِلَّا بِأَمْرِ رَبِّكَ ۖ لَهُ مَا بَيْنَ أَيْدِينَا وَمَا خَلْفَنَا وَمَا بَيْنَ ذَٰلِكَ ۚ وَمَا كَانَ رَبُّكَ نَسِيًّا
  trl: Wa-mā natanazzalu illā bi-amri rabbika lahu mā bayna aydīnā wa-mā khalfanā wa-mā bayna dhālika wa-mā kāna rabbuka nasiyyā
  trad: « Et nous ne descendons (natanazzalu) que par l'ordre de ton Rabb — à Lui appartient ce qui est devant nous, ce qui est derrière nous, et ce qui est entre les deux — et ton Rabb n'oublie jamais (nasiyy). »
- ref: S.19:65
  ar: رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا فَاعْبُدْهُ وَاصْطَبِرْ لِعِبَادَتِهِ ۚ هَلْ تَعْلَمُ لَهُ سَمِيًّا
  trl: Rabbu s-samāwāti wa-l-arḍi wa-mā baynahumā fa-ʿbudhu wa-ṣṭabir li-ʿibādatihi hal taʿlamu lahu samiyyā
  trad: Rabb des cieux et de la terre, et de ce qui est entre eux — adore-Le donc, et sois constant (iṣṭabir) dans Son adoration. Lui connais-tu un homonyme (samiyy) ?
- ref: S.19:66
  ar: وَيَقُولُ الْإِنْسَانُ أَإِذَا مَا مِتُّ لَسَوْفَ أُخْرَجُ حَيًّا
  trl: Wa-yaqūlu l-insānu a-idhā mā mittu la-sawfa ukhraju ḥayyā
  trad: 'Et l''humain (al-insān) dit : « Une fois mort, serai-je vraiment fait sortir vivant ? »'
- ref: S.19:67
  ar: أَوَلَا يَذْكُرُ الْإِنْسَانُ أَنَّا خَلَقْنَاهُ مِنْ قَبْلُ وَلَمْ يَكُ شَيْئًا
  trl: A-wa-lā yadhkuru l-insānu annā khalaqnāhu min qablu wa-lam yaku shayʾā
  trad: L'humain ne se rappelle-t-il donc pas que Nous l'avons créé auparavant, alors qu'il n'était rien ?
- ref: S.19:68–70
  ar: فَوَرَبِّكَ لَنَحْشُرَنَّهُمْ وَالشَّيَاطِينَ ثُمَّ لَنُحْضِرَنَّهُمْ حَوْلَ جَهَنَّمَ جِثِيًّا ثُمَّ لَنَنْزِعَنَّ مِنْ كُلِّ شِيعَةٍ أَيُّهُمْ أَشَدُّ عَلَى الرَّحْمَٰنِ عِتِيًّا ثُمَّ لَنَحْنُ أَعْلَمُ بِالَّذِينَ هُمْ أَوْلَىٰ بِهَا صِلِيًّا
  trl: Fa-wa-rabbika la-naḥshurannahum wa-sh-shayāṭīna thumma la-nuḥḍirannahum ḥawla jahannama jithiyyā — thumma la-nanziʿanna min kulli shīʿatin ayyuhum ashaddu ʿalā r-raḥmāni ʿitiyyā — thumma la-naḥnu aʿlamu bi-lladhīna hum awlā bihā ṣiliyyā
  trad: Par ton Rabb, Nous les rassemblerons assurément — eux et les shayāṭīn — puis Nous les amènerons assurément autour de Jahannam, agenouillés (jithiyyā). Puis Nous arracherons assurément, de chaque groupe (shīʿa), celui d'entre eux qui aura été le plus extrême dans la rébellion (ʿitiyy) envers ar-Raḥmān. Puis c'est Nous qui savons le mieux qui, parmi eux, mérite le plus d'y être brûlé (ṣiliyy).
- ref: S.19:71–72
  ar: وَإِنْ مِنْكُمْ إِلَّا وَارِدُهَا ۚ كَانَ عَلَىٰ رَبِّكَ حَتْمًا مَقْضِيًّا ثُمَّ نُنَجِّي الَّذِينَ اتَّقَوْا وَنَذَرُ الظَّالِمِينَ فِيهَا جِثِيًّا
  trl: Wa-in minkum illā wāriduhā — kāna ʿalā rabbika ḥatman maqḍiyyā — thumma nunajjī lladhīna ttaqaw wa-nadharu ẓ-ẓālimīna fīhā jithiyyā
  trad: Il n'est personne parmi vous qui ne soit wārid d'elle [Jahannam] — cela est, pour ton Rabb, une décision arrêtée et irrévocable (ḥatman maqḍiyyā). Puis Nous délivrons (nunajjī) ceux qui se sont prémunis (ittaqaw), et Nous laissons les injustes (aẓ-ẓālimīn) y demeurer, agenouillés (jithiyyā).
- ref: S.19:73
  ar: وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ قَالَ الَّذِينَ كَفَرُوا لِلَّذِينَ آمَنُوا أَيُّ الْفَرِيقَيْنِ خَيْرٌ مَقَامًا وَأَحْسَنُ نَدِيًّا
  trl: Wa-idhā tutlā ʿalayhim āyātunā bayyinātin qāla lladhīna kafarū lilladhīna āmanū ayyu l-farīqayni khayrun maqāman wa-aḥsanu nadiyyā
  trad: 'Et quand Nos āyāt leur sont récitées, clairement énoncées (bayyināt), ceux qui ont mécru disent à ceux qui ont cru : « Lequel des deux groupes est le mieux placé (khayrun maqāman), et tient la plus belle assemblée (nadiyy) ? »'
- ref: S.19:74
  ar: وَكَمْ أَهْلَكْنَا قَبْلَهُمْ مِنْ قَرْنٍ هُمْ أَحْسَنُ أَثَاثًا وَرِئْيًا
  trl: Wa-kam ahlaknā qablahum min qarnin hum aḥsanu athāthan wa-riʾyā
  trad: Et combien avons-Nous détruit, avant eux, de générations (qarn) qui les surpassaient en biens (athāth) et en apparence (riʾy) !
- ref: S.19:75
  ar: قُلْ مَنْ كَانَ فِي الضَّلَالَةِ فَلْيَمْدُدْ لَهُ الرَّحْمَٰنُ مَدًّا ۚ حَتَّىٰ إِذَا رَأَوْا مَا يُوعَدُونَ إِمَّا الْعَذَابَ وَإِمَّا السَّاعَةَ فَسَيَعْلَمُونَ مَنْ هُوَ شَرٌّ مَكَانًا وَأَضْعَفُ جُنْدًا
  trl: Qul man kāna fi ḍ-ḍalālati fa-l-yamdud lahu r-raḥmānu maddan — ḥattā idhā raʾaw mā yūʿadūna immā l-ʿadhāba wa-immā s-sāʿata fa-sa-yaʿlamūna man huwa sharrun makānan wa-aḍʿafu jundā
  trad: 'Dis : « Que celui qui est dans l''égarement (aḍ-ḍalāla), ar-Raḥmān lui accorde un délai prolongé (fa-l-yamdud ... maddan) ! » — jusqu''à ce que, voyant ce qui leur est promis, soit le châtiment, soit l''Heure, ils sachent alors qui est le pire en position et le plus faible en troupe (jund).'
- ref: S.19:76
  ar: وَيَزِيدُ اللَّهُ الَّذِينَ اهْتَدَوْا هُدًى ۗ وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِنْدَ رَبِّكَ ثَوَابًا وَخَيْرٌ مَرَدًّا
  trl: Wa-yazīdu llāhu lladhīna htadaw hudan — wa-l-bāqiyātu ṣ-ṣāliḥātu khayrun ʿinda rabbika thawāban wa-khayrun maraddā
  trad: Et Allaah accroît en guidance (hudan) ceux qui se sont [déjà] guidés — et ce qui demeure des œuvres droites (al-bāqiyāt aṣ-ṣāliḥāt) est meilleur, auprès de ton Rabb, en rétribution (thawāb), et meilleur en retour (maradd).
- ref: S.19:77–80
  ar: أَفَرَأَيْتَ الَّذِي كَفَرَ بِآيَاتِنَا وَقَالَ لَأُوتَيَنَّ مَالًا وَوَلَدًا أَطَّلَعَ الْغَيْبَ أَمِ اتَّخَذَ عِنْدَ الرَّحْمَٰنِ عَهْدًا كَلَّا ۚ سَنَكْتُبُ مَا يَقُولُ وَنَمُدُّ لَهُ مِنَ الْعَذَابِ مَدًّا وَنَرِثُهُ مَا يَقُولُ وَيَأْتِينَا فَرْدًا
  trl: A-fa-raʾayta lladhī kafara bi-āyātinā wa-qāla la-ūtayanna mālan wa-waladā — a-ṭṭalaʿa l-ghayba ami ttakhadha ʿinda r-raḥmāni ʿahdā — kallā sa-naktubu mā yaqūlu wa-namuddu lahu mina l-ʿadhābi maddan — wa-narithuhu mā yaqūlu wa-yaʾtīnā fardā
  trad: 'As-tu vu celui qui a mécru en Nos āyāt et qui a dit : « On me donnera assurément des biens et une descendance (walad) » ? A-t-il pris connaissance de l''inaccessible (al-ghayb), ou a-t-il pris, auprès d''ar-Raḥmān, un engagement (ʿahd) ? Bien au contraire ! Nous consignerons (sa-naktubu) ce qu''il dit, et Nous prolongerons pour lui le châtiment, prolongation sur prolongation (namuddu ... maddan). Et Nous hériterons (narithuhu) de ce qu''il dit [de ses biens et de sa descendance], et il viendra à Nous seul (fardan).'
- ref: S.19:81–82
  ar: وَاتَّخَذُوا مِنْ دُونِ اللَّهِ آلِهَةً لِيَكُونُوا لَهُمْ عِزًّا كَلَّا ۚ سَيَكْفُرُونَ بِعِبَادَتِهِمْ وَيَكُونُونَ عَلَيْهِمْ ضِدًّا
  trl: Wa-ttakhadhū min dūni llāhi ālihatan li-yakūnū lahum ʿizzā — kallā sa-yakfurūna bi-ʿibādatihim wa-yakūnūna ʿalayhim ḍiddā
  trad: Et ils ont pris, en dehors d'Allaah, des ālihah, pour qu'elles leur soient une force (ʿizz). Bien au contraire ! Elles renieront leur adoration (sa-yakfurūna bi-ʿibādatihim), et elles seront, contre eux, des opposants (ḍidd).
- ref: S.19:83–84
  ar: أَلَمْ تَرَ أَنَّا أَرْسَلْنَا الشَّيَاطِينَ عَلَى الْكَافِرِينَ تَؤُزُّهُمْ أَزًّا فَلَا تَعْجَلْ عَلَيْهِمْ ۖ إِنَّمَا نَعُدُّ لَهُمْ عَدًّا
  trl: A-lam tara annā arsalnā sh-shayāṭīna ʿalā l-kāfirīna taʾuzzuhum azzā — fa-lā taʿjal ʿalayhim innamā naʿuddu lahum ʿaddā
  trad: Ne vois-tu pas que Nous avons envoyé les shayāṭīn contre les kāfirūn, les excitant avec insistance (taʾuzzuhum azzā) ? Ne te hâte donc pas contre eux — Nous ne faisons que compter pour eux un compte exact (naʿuddu lahum ʿaddā).
- ref: S.19:85–87
  ar: يَوْمَ نَحْشُرُ الْمُتَّقِينَ إِلَى الرَّحْمَٰنِ وَفْدًا وَنَسُوقُ الْمُجْرِمِينَ إِلَىٰ جَهَنَّمَ وِرْدًا لَا يَمْلِكُونَ الشَّفَاعَةَ إِلَّا مَنِ اتَّخَذَ عِنْدَ الرَّحْمَٰنِ عَهْدًا
  trl: Yawma naḥshuru l-muttaqīna ilā r-raḥmāni wafdan — wa-nasūqu l-mujrimīna ilā jahannama wirdan — lā yamlikūna sh-shafāʿata illā mani ttakhadha ʿinda r-raḥmāni ʿahdā
  trad: Le jour où Nous rassemblerons les muttaqūn vers ar-Raḥmān, en délégation honorée (wafdan) — et où Nous pousserons les mujrimūn vers Jahannam, comme on pousse un troupeau à l'abreuvoir (wirdan) — ils ne détiendront pas la shafāʿa, sauf celui qui aura pris, auprès d'ar-Raḥmān, un engagement (ʿahd).
- ref: S.19:88–89
  ar: وَقَالُوا اتَّخَذَ الرَّحْمَٰنُ وَلَدًا لَقَدْ جِئْتُمْ شَيْئًا إِدًّا
  trl: Wa-qālū ttakhadha r-raḥmānu waladan — laqad jiʾtum shayʾan iddā
  trad: 'Et ils ont dit : « Ar-Raḥmān S''est attribué un enfant (walad). » Vous avez commis là une chose monstrueuse (idd).'
- ref: S.19:90–91
  ar: تَكَادُ السَّمَاوَاتُ يَتَفَطَّرْنَ مِنْهُ وَتَنْشَقُّ الْأَرْضُ وَتَخِرُّ الْجِبَالُ هَدًّا أَنْ دَعَوْا لِلرَّحْمَٰنِ وَلَدًا
  trl: Takādu s-samāwātu yatafaṭṭarna minhu wa-tanshaqqu l-arḍu wa-takhirru l-jibālu haddan — an daʿaw li-r-raḥmāni waladā
  trad: Peu s'en faut que les cieux ne se fendent (yatafaṭṭarna) à cause de cela, que la terre ne se déchire (tanshaqqu), et que les montagnes ne s'effondrent, réduites en débris (takhirru ... haddan) — parce qu'ils ont attribué (daʿaw) à ar-Raḥmān un enfant.
- ref: S.19:92–93
  ar: وَمَا يَنْبَغِي لِلرَّحْمَٰنِ أَنْ يَتَّخِذَ وَلَدًا إِنْ كُلُّ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ إِلَّا آتِي الرَّحْمَٰنِ عَبْدًا
  trl: Wa-mā yanbaghī li-r-raḥmāni an yattakhidha waladan — in kullu man fi s-samāwāti wa-l-arḍi illā ātī r-raḥmāni ʿabdā
  trad: Et il ne convient pas (mā yanbaghī) à ar-Raḥmān de S'attribuer un enfant. Il n'est personne, dans les cieux et sur la terre, qui ne vienne à ar-Raḥmān qu'en tant que ʿabd.
- ref: S.19:94–95
  ar: لَقَدْ أَحْصَاهُمْ وَعَدَّهُمْ عَدًّا وَكُلُّهُمْ آتِيهِ يَوْمَ الْقِيَامَةِ فَرْدًا
  trl: Laqad aḥṣāhum wa-ʿaddahum ʿaddan — wa-kulluhum ātīhi yawma l-qiyāmati fardā
  trad: Il les a certes dénombrés (aḥṣāhum) et comptés d'un compte exact (ʿaddahum ʿaddan). Et chacun d'eux viendra à Lui, au Jour de la Résurrection, seul (fardan).
- ref: S.19:96
  ar: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَيَجْعَلُ لَهُمُ الرَّحْمَٰنُ وُدًّا
  trl: Inna lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti sa-yajʿalu lahumu r-raḥmānu wuddā
  trad: Ceux qui ont cru et ont accompli les œuvres droites (ṣāliḥāt), ar-Raḥmān placera pour eux un wudd.
- ref: S.19:97–98
  ar: فَإِنَّمَا يَسَّرْنَاهُ بِلِسَانِكَ لِتُبَشِّرَ بِهِ الْمُتَّقِينَ وَتُنْذِرَ بِهِ قَوْمًا لُدًّا وَكَمْ أَهْلَكْنَا قَبْلَهُمْ مِنْ قَرْنٍ هَلْ تُحِسُّ مِنْهُمْ مِنْ أَحَدٍ أَوْ تَسْمَعُ لَهُمْ رِكْزًا
  trl: Fa-innamā yassarnāhu bi-lisānika li-tubashshira bihi l-muttaqīna wa-tundhira bihi qawman luddan — wa-kam ahlaknā qablahum min qarnin hal tuḥissu minhum min aḥadin aw tasmaʿu lahum rikzā
  trad: Nous ne l'avons rendu aisé (yassarnāhu), dans ta langue, que pour que tu annonces par lui une bonne nouvelle aux muttaqūn, et que tu avertisses par lui un peuple acharné dans la dispute (qawman luddan). Et combien avons-Nous détruit, avant eux, de générations ! En perçois-tu un seul, ou en entends-tu le moindre murmure (rikz) ?
