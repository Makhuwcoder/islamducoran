- ref: S.9:1
  ar: بَرَاءَةٌ مِنَ اللَّهِ وَرَسُولِهِ إِلَى الَّذِينَ عَاهَدْتُمْ مِنَ الْمُشْرِكِينَ
  trl: Barāʾatun mina llāhi wa-rasūlihi ilā lladhīna ʿāhadtum mina l-mushrikīn
  trad: Un désengagement (barāʾa), de la part d'Allaah et de Son rasūl, à l'adresse de ceux des mushrikūn avec qui vous avez conclu un ʿahd.
- ref: S.9:2
  ar: فَسِيحُوا فِي الْأَرْضِ أَرْبَعَةَ أَشْهُرٍ وَاعْلَمُوا أَنَّكُمْ غَيْرُ مُعْجِزِي اللَّهِ ۙ وَأَنَّ اللَّهَ مُخْزِي الْكَافِرِينَ
  trl: Fa-sīḥū fi l-arḍi arbaʿata ashhurin wa-ʿlamū annakum ghayru muʿjizī llāhi wa-anna llāha mukhzī l-kāfirīn
  trad: Parcourez donc la terre librement durant quatre mois, et sachez que vous ne pouvez réduire Allaah à l'impuissance, et qu'Allaah couvre de honte les kāfirūn.
- ref: S.9:3
  ar: وَأَذَانٌ مِنَ اللَّهِ وَرَسُولِهِ إِلَى النَّاسِ يَوْمَ الْحَجِّ الْأَكْبَرِ أَنَّ اللَّهَ بَرِيءٌ مِنَ الْمُشْرِكِينَ ۙ وَرَسُولُهُ ۚ فَإِنْ تُبْتُمْ فَهُوَ خَيْرٌ لَكُمْ ۖ وَإِنْ تَوَلَّيْتُمْ فَاعْلَمُوا أَنَّكُمْ غَيْرُ مُعْجِزِي اللَّهِ ۗ وَبَشِّرِ الَّذِينَ كَفَرُوا بِعَذَابٍ أَلِيمٍ
  trl: Wa-adhānun mina llāhi wa-rasūlihi ilā n-nāsi yawma l-ḥajji l-akbari anna llāha barīʾun mina l-mushrikīna wa-rasūluhu — fa-in tubtum fa-huwa khayrun lakum wa-in tawallaytum fa-ʿlamū annakum ghayru muʿjizī llāhi — wa-bashshiri lladhīna kafarū bi-ʿadhābin alīm
  trad: 'Et une proclamation (adhān), d''Allaah et de Son rasūl, à l''adresse des hommes, au jour du Ḥajj al-Akbar : Allaah est dégagé (barīʾ) des mushrikūn, et Son rasūl aussi. Si donc vous vous repentez, c''est meilleur pour vous ; et si vous vous détournez, sachez que vous ne pouvez réduire Allaah à l''impuissance. Annonce à ceux qui sont kāfirūn un châtiment douloureux.'
- ref: S.9:4
  ar: إِلَّا الَّذِينَ عَاهَدْتُمْ مِنَ الْمُشْرِكِينَ ثُمَّ لَمْ يَنْقُصُوكُمْ شَيْئًا وَلَمْ يُظَاهِرُوا عَلَيْكُمْ أَحَدًا فَأَتِمُّوا إِلَيْهِمْ عَهْدَهُمْ إِلَىٰ مُدَّتِهِمْ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَّقِينَ
  trl: Illā lladhīna ʿāhadtum mina l-mushrikīna thumma lam yanquṣūkum shayʾan wa-lam yuẓāhirū ʿalaykum aḥadan fa-atimmū ilayhim ʿahdahum ilā muddatihim — inna llāha yuḥibbu l-muttaqīn
  trad: 'Exceptés ceux des mushrikūn avec qui vous avez conclu un ʿahd, et qui ensuite ne vous ont manqué en rien et n''ont prêté appui à personne contre vous : remplissez pleinement envers eux leur ʿahd jusqu''à son terme. Allaah honore les muttaqīn.'
- ref: S.9:5
  ar: فَإِذَا انْسَلَخَ الْأَشْهُرُ الْحُرُمُ فَاقْتُلُوا الْمُشْرِكِينَ حَيْثُ وَجَدْتُمُوهُمْ وَخُذُوهُمْ وَاحْصُرُوهُمْ وَاقْعُدُوا لَهُمْ كُلَّ مَرْصَدٍ ۚ فَإِنْ تَابُوا وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ فَخَلُّوا سَبِيلَهُمْ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Fa-idhā nsalakha l-ashhuru l-ḥurumu fa-qtulū l-mushrikīna ḥaythu wajadtumūhum wa-khudhūhum wa-ḥṣurūhum wa-qʿudū lahum kulla marṣadin — fa-in tābū wa-aqāmū ṣ-ṣalāta wa-ātawū z-zakāta fa-khallū sabīlahum — inna llāha ghafūrun raḥīm
  trad: Puis, quand les mois sacrés se seront écoulés, combattez les mushrikūn où que vous les trouviez, saisissez-les, assiégez-les, et postez-vous pour eux à tout poste de guet. Mais s'ils se repentent, établissent la ṣalāt et donnent la zakāt, laissez-leur alors la voie libre. Allaah est, assurément, Ghafūr, Raḥīm.
- ref: S.9:6
  ar: وَإِنْ أَحَدٌ مِنَ الْمُشْرِكِينَ اسْتَجَارَكَ فَأَجِرْهُ حَتَّىٰ يَسْمَعَ كَلَامَ اللَّهِ ثُمَّ أَبْلِغْهُ مَأْمَنَهُ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌ لَا يَعْلَمُونَ
  trl: Wa-in aḥadun mina l-mushrikīna staʾjāraka fa-ajirhu ḥattā yasmaʿa kalāma llāhi thumma abligh-hu maʾmanahu — dhālika bi-annahum qawmun lā yaʿlamūn
  trad: Et si l'un des mushrikūn te demande protection, accorde-lui protection jusqu'à ce qu'il entende la Parole (kalām) d'Allaah, puis fais-le parvenir à son lieu de sécurité. Cela, parce que ce sont des gens qui ne savent pas.
- ref: S.9:7–8
  ar: كَيْفَ يَكُونُ لِلْمُشْرِكِينَ عَهْدٌ عِنْدَ اللَّهِ وَعِنْدَ رَسُولِهِ إِلَّا الَّذِينَ عَاهَدْتُمْ عِنْدَ الْمَسْجِدِ الْحَرَامِ ۖ فَمَا اسْتَقَامُوا لَكُمْ فَاسْتَقِيمُوا لَهُمْ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَّقِينَ ۝ كَيْفَ وَإِنْ يَظْهَرُوا عَلَيْكُمْ لَا يَرْقُبُوا فِيكُمْ إِلًّا وَلَا ذِمَّةً ۚ يُرْضُونَكُمْ بِأَفْوَاهِهِمْ وَتَأْبَىٰ قُلُوبُهُمْ وَأَكْثَرُهُمْ فَاسِقُونَ
  trl: Kayfa yakūnu li-l-mushrikīna ʿahdun ʿinda llāhi wa-ʿinda rasūlihi illā lladhīna ʿāhadtum ʿinda l-masjidi l-ḥarāmi — fa-mā staqāmū lakum fa-staqīmū lahum — inna llāha yuḥibbu l-muttaqīn — kayfa wa-in yaẓharū ʿalaykum lā yarqubū fīkum illan wa-lā dhimmah — yurḍūnakum bi-afwāhihim wa-taʾbā qulūbuhum wa-aktharuhum fāsiqūn
  trad: 'Comment y aurait-il, pour les mushrikūn, un ʿahd auprès d''Allaah et auprès de Son rasūl — excepté ceux avec qui vous avez conclu un pacte près du Masjid al-Ḥarām ? Tant qu''ils se tiennent droit envers vous, tenez-vous droit envers eux : Allaah honore les muttaqīn. Comment, alors que s''ils l''emportaient sur vous, ils ne respecteraient à votre égard ni lien (ill) ni garantie (dhimma) ? Ils vous satisfont de leurs bouches, tandis que leurs cœurs s''y refusent — et la plupart d''entre eux sont des fāsiqūn.'
- ref: S.9:9–10
  ar: اشْتَرَوْا بِآيَاتِ اللَّهِ ثَمَنًا قَلِيلًا فَصَدُّوا عَنْ سَبِيلِهِ ۚ إِنَّهُمْ سَاءَ مَا كَانُوا يَعْمَلُونَ ۝ لَا يَرْقُبُونَ فِي مُؤْمِنٍ إِلًّا وَلَا ذِمَّةً ۚ وَأُولَٰئِكَ هُمُ الْمُعْتَدُونَ
  trl: Ishtaraw bi-āyāti llāhi thamanan qalīlan fa-ṣaddū ʿan sabīlihi — innahum sāʾa mā kānū yaʿmalūn — lā yarqubūna fī muʾminin illan wa-lā dhimmatan — wa-ulāʾika humu l-muʿtadūn
  trad: Ils ont vendu les āyāt d'Allaah à vil prix, et ont détourné de Son sabīl — combien est mauvais ce qu'ils faisaient ! Ils ne respectent, à l'égard d'aucun muʾmin, ni lien ni garantie — ceux-là sont les muʿtadūn.
- ref: S.9:11–12
  ar: فَإِنْ تَابُوا وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ فَإِخْوَانُكُمْ فِي الدِّينِ ۗ وَنُفَصِّلُ الْآيَاتِ لِقَوْمٍ يَعْلَمُونَ ۝ وَإِنْ نَكَثُوا أَيْمَانَهُمْ مِنْ بَعْدِ عَهْدِهِمْ وَطَعَنُوا فِي دِينِكُمْ فَقَاتِلُوا أَئِمَّةَ الْكُفْرِ ۙ إِنَّهُمْ لَا أَيْمَانَ لَهُمْ لَعَلَّهُمْ يَنْتَهُونَ
  trl: Fa-in tābū wa-aqāmū ṣ-ṣalāta wa-ātawū z-zakāta fa-ikhwānukum fi d-dīn — wa-nufaṣṣilu l-āyāti li-qawmin yaʿlamūn — wa-in nakathū aymānahum min baʿdi ʿahdihim wa-ṭaʿanū fī dīnikum fa-qātilū aʾimmata l-kufri — innahum lā aymāna lahum laʿallahum yantahūn
  trad: S'ils se repentent, établissent la ṣalāt et donnent la zakāt, alors ils sont vos frères dans le dīn — Nous exposons en détail les āyāt pour un peuple qui sait. Mais s'ils rompent leurs serments après leur ʿahd et attaquent votre dīn, alors combattez les meneurs (aʾimma) du kufr — ils n'ont, en vérité, aucun serment qui tienne — peut-être cesseront-ils.
- ref: S.9:13–15
  ar: أَلَا تُقَاتِلُونَ قَوْمًا نَكَثُوا أَيْمَانَهُمْ وَهَمُّوا بِإِخْرَاجِ الرَّسُولِ وَهُمْ بَدَءُوكُمْ أَوَّلَ مَرَّةٍ ۚ أَتَخْشَوْنَهُمْ ۚ فَاللَّهُ أَحَقُّ أَنْ تَخْشَوْهُ إِنْ كُنْتُمْ مُؤْمِنِينَ ۝ قَاتِلُوهُمْ يُعَذِّبْهُمُ اللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنْصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍ مُؤْمِنِينَ ۝ وَيُذْهِبْ غَيْظَ قُلُوبِهِمْ ۗ وَيَتُوبُ اللَّهُ عَلَىٰ مَنْ يَشَاءُ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: A-lā tuqātilūna qawman nakathū aymānahum wa-hammū bi-ikhrāji r-rasūli wa-hum badaʾūkum awwala marratin — a-takhshawnahum — fa-llāhu aḥaqqu an takhshawhu in kuntum muʾminīn — qātilūhum yuʿadhdhibhumu llāhu bi-aydīkum wa-yukhzihim wa-yanṣurkum ʿalayhim wa-yashfi ṣudūra qawmin muʾminīn — wa-yudhhib ghayẓa qulūbihim — wa-yatūbu llāhu ʿalā man yashāʾ — wa-llāhu ʿalīmun ḥakīm
  trad: 'Ne combattrez-vous pas des gens qui ont rompu leurs serments, ont résolu d''expulser le rasūl, et qui vous ont attaqués les premiers ? Les craignez-vous ? Allaah est plus digne que vous Le craigniez, si vous êtes croyants. Combattez-les : Allaah les châtiera par vos mains, les couvrira de honte, vous donnera la victoire sur eux, guérira les poitrines d''un peuple croyant, et fera partir la colère de leurs cœurs. Allaah revient vers qui Il veut. Allaah est, assurément, ʿAlīm, Ḥakīm.'
- ref: S.9:16
  ar: أَمْ حَسِبْتُمْ أَنْ تُتْرَكُوا وَلَمَّا يَعْلَمِ اللَّهُ الَّذِينَ جَاهَدُوا مِنْكُمْ وَلَمْ يَتَّخِذُوا مِنْ دُونِ اللَّهِ وَلَا رَسُولِهِ وَلَا الْمُؤْمِنِينَ وَلِيجَةً ۚ وَاللَّهُ خَبِيرٌ بِمَا تَعْمَلُونَ
  trl: Am ḥasibtum an tutrakū wa-lammā yaʿlami llāhu lladhīna jāhadū minkum wa-lam yattakhidhū min dūni llāhi wa-lā rasūlihi wa-lā l-muʾminīna walījah — wa-llāhu khabīrun bi-mā taʿmalūn
  trad: Ou bien pensiez-vous être laissés [sans épreuve], alors qu'Allaah n'a pas encore distingué ceux d'entre vous qui se sont engagés dans le jihād et n'ont pris, en dehors d'Allaah, de Son rasūl et des muʾminūn, aucune walīja ? Allaah est parfaitement informé de ce que vous faites.
- ref: S.9:17–18
  ar: مَا كَانَ لِلْمُشْرِكِينَ أَنْ يَعْمُرُوا مَسَاجِدَ اللَّهِ شَاهِدِينَ عَلَىٰ أَنْفُسِهِمْ بِالْكُفْرِ ۚ أُولَٰئِكَ حَبِطَتْ أَعْمَالُهُمْ وَفِي النَّارِ هُمْ خَالِدُونَ ۝ إِنَّمَا يَعْمُرُ مَسَاجِدَ اللَّهِ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَأَقَامَ الصَّلَاةَ وَآتَى الزَّكَاةَ وَلَمْ يَخْشَ إِلَّا اللَّهَ ۖ فَعَسَىٰ أُولَٰئِكَ أَنْ يَكُونُوا مِنَ الْمُهْتَدِينَ
  trl: Mā kāna li-l-mushrikīna an yaʿmurū masājida llāhi shāhidīna ʿalā anfusihim bi-l-kufr — ulāʾika ḥabiṭat aʿmāluhum wa-fi n-nāri hum khālidūn — innamā yaʿmuru masājida llāhi man āmana billāhi wa-l-yawmi l-ākhiri wa-aqāma ṣ-ṣalāta wa-ātā z-zakāta wa-lam yakhsha illā llāh — fa-ʿasā ulāʾika an yakūnū mina l-muhtadīn
  trad: Il n'appartenait pas aux mushrikūn d'entretenir les mosquées d'Allaah, témoignant contre eux-mêmes du kufr — ceux-là, leurs œuvres se sont effondrées, et dans le Feu ils demeurent. N'entretient les mosquées d'Allaah que celui qui croit en Allaah et au Jour Dernier, établit la ṣalāt, donne la zakāt et ne craint qu'Allaah — ceux-là, peut-être seront-ils parmi les muhtadūn.
- ref: S.9:19–20
  ar: ۞ أَجَعَلْتُمْ سِقَايَةَ الْحَاجِّ وَعِمَارَةَ الْمَسْجِدِ الْحَرَامِ كَمَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَجَاهَدَ فِي سَبِيلِ اللَّهِ ۚ لَا يَسْتَوُونَ عِنْدَ اللَّهِ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ ۝ الَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ أَعْظَمُ دَرَجَةً عِنْدَ اللَّهِ ۚ وَأُولَٰئِكَ هُمُ الْفَائِزُونَ
  trl: A-jaʿaltum siqāyata l-ḥājji wa-ʿimārata l-masjidi l-ḥarāmi ka-man āmana billāhi wa-l-yawmi l-ākhiri wa-jāhada fī sabīli llāh — lā yastawūna ʿinda llāh — wa-llāhu lā yahdi l-qawma ẓ-ẓālimīn — alladhīna āmanū wa-hājarū wa-jāhadū fī sabīli llāhi bi-amwālihim wa-anfusihim aʿẓamu darajatan ʿinda llāh — wa-ulāʾika humu l-fāʾizūn
  trad: Avez-vous fait de l'approvisionnement en eau du pèlerin et de l'entretien du Masjid al-Ḥarām l'équivalent de la foi en Allaah et au Jour Dernier, et du jihād sur le sabīl d'Allaah ? Ils ne sont pas égaux auprès d'Allaah — Allaah ne guide pas le peuple des ẓālimūn. Ceux qui ont cru, ont émigré et se sont engagés sur le sabīl d'Allaah par leurs biens et par eux-mêmes ont un degré plus grand auprès d'Allaah — ceux-là sont les fāʾizūn.
- ref: S.9:21–22
  ar: يُبَشِّرُهُمْ رَبُّهُمْ بِرَحْمَةٍ مِنْهُ وَرِضْوَانٍ وَجَنَّاتٍ لَهُمْ فِيهَا نَعِيمٌ مُقِيمٌ ۝ خَالِدِينَ فِيهَا أَبَدًا ۚ إِنَّ اللَّهَ عِنْدَهُ أَجْرٌ عَظِيمٌ
  trl: Yubashshiruhum rabbuhum bi-raḥmatin minhu wa-riḍwānin wa-jannātin lahum fīhā naʿīmun muqīm — khālidīna fīhā abadan — inna llāha ʿindahu ajrun ʿaẓīm
  trad: Leur Rabb leur annonce une raḥma venant de Lui, un riḍwān, et des jardins où, pour eux, il y a un naʿīm durable, où ils demeurent à jamais. Auprès d'Allaah, assurément, il y a une rétribution immense.
- ref: S.9:23
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا آبَاءَكُمْ وَإِخْوَانَكُمْ أَوْلِيَاءَ إِنِ اسْتَحَبُّوا الْكُفْرَ عَلَى الْإِيمَانِ ۚ وَمَنْ يَتَوَلَّهُمْ مِنْكُمْ فَأُولَٰئِكَ هُمُ الظَّالِمُونَ
  trl: Yā ayyuhā lladhīna āmanū lā tattakhidhū ābāʾakum wa-ikhwānakum awliyāʾa ini staḥabbū l-kufra ʿalā l-īmān — wa-man yatawallahum minkum fa-ulāʾika humu ẓ-ẓālimūn
  trad: Ô vous qui avez cru, ne prenez pas vos pères et vos frères comme awliyāʾ s'ils préfèrent le kufr à la foi. Quiconque, parmi vous, se tourne vers eux comme walī — ceux-là sont les ẓālimūn.
- ref: S.9:24
  ar: قُلْ إِنْ كَانَ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ وَإِخْوَانُكُمْ وَأَزْوَاجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَالٌ اقْتَرَفْتُمُوهَا وَتِجَارَةٌ تَخْشَوْنَ كَسَادَهَا وَمَسَاكِنُ تَرْضَوْنَهَا أَحَبَّ إِلَيْكُمْ مِنَ اللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّىٰ يَأْتِيَ اللَّهُ بِأَمْرِهِ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ
  trl: Qul in kāna ābāʾukum wa-abnāʾukum wa-ikhwānukum wa-azwājukum wa-ʿashīratukum wa-amwālun iqtaraftumūhā wa-tijāratun takhshawna kasādahā wa-masākinu tarḍawnahā aḥabba ilaykum mina llāhi wa-rasūlihi wa-jihādin fī sabīlihi fa-tarabbaṣū ḥattā yaʾtiya llāhu bi-amrihi — wa-llāhu lā yahdi l-qawma l-fāsiqīn
  trad: 'Dis : « Si vos pères, vos fils, vos frères, vos épouses, votre ʿashīra, les biens que vous avez acquis, un commerce dont vous redoutez le déclin, et des demeures qui vous agréent, vous sont plus chers qu''Allaah, Son rasūl et un jihād sur Son sabīl, alors attendez qu''Allaah fasse venir Son ordre. » Allaah ne guide pas le peuple des fāsiqūn.'
- ref: S.9:25
  ar: لَقَدْ نَصَرَكُمُ اللَّهُ فِي مَوَاطِنَ كَثِيرَةٍ ۙ وَيَوْمَ حُنَيْنٍ ۙ إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ فَلَمْ تُغْنِ عَنْكُمْ شَيْئًا وَضَاقَتْ عَلَيْكُمُ الْأَرْضُ بِمَا رَحُبَتْ ثُمَّ وَلَّيْتُمْ مُدْبِرِينَ
  trl: La-qad naṣarakumu llāhu fī mawāṭina kathīratin wa-yawma ḥunaynin idh aʿjabatkum kathratukum fa-lam tughni ʿankum shayʾan wa-ḍāqat ʿalaykumu l-arḍu bi-mā raḥubat thumma wallaytum mudbirīn
  trad: Allaah vous a certes secourus en de nombreux lieux, et au jour de Ḥunayn, quand votre nombre vous a rendus admiratifs de vous-mêmes, sans qu'il ne vous serve à rien, et que la terre, malgré son étendue, s'est resserrée sur vous — puis vous avez tourné le dos en fuyant.
- ref: S.9:26–27
  ar: ثُمَّ أَنْزَلَ اللَّهُ سَكِينَتَهُ عَلَىٰ رَسُولِهِ وَعَلَى الْمُؤْمِنِينَ وَأَنْزَلَ جُنُودًا لَمْ تَرَوْهَا وَعَذَّبَ الَّذِينَ كَفَرُوا ۚ وَذَٰلِكَ جَزَاءُ الْكَافِرِينَ ۝ ثُمَّ يَتُوبُ اللَّهُ مِنْ بَعْدِ ذَٰلِكَ عَلَىٰ مَنْ يَشَاءُ ۗ وَاللَّهُ غَفُورٌ رَحِيمٌ
  trl: Thumma anzala llāhu sakīnatahu ʿalā rasūlihi wa-ʿalā l-muʾminīna wa-anzala junūdan lam tarawhā wa-ʿadhdhaba lladhīna kafarū — wa-dhālika jazāʾu l-kāfirīn — thumma yatūbu llāhu min baʿdi dhālika ʿalā man yashāʾ — wa-llāhu ghafūrun raḥīm
  trad: Puis Allaah a fait descendre Sa sakīna sur Son rasūl et sur les muʾminūn, a fait descendre des junūd que vous ne voyiez pas, et a châtié ceux qui étaient kāfirūn — telle est la rétribution des kāfirūn. Puis Allaah revient, après cela, vers qui Il veut. Allaah est, assurément, Ghafūr, Raḥīm.
- ref: S.9:28
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْمُشْرِكُونَ نَجَسٌ فَلَا يَقْرَبُوا الْمَسْجِدَ الْحَرَامَ بَعْدَ عَامِهِمْ هَٰذَا ۚ وَإِنْ خِفْتُمْ عَيْلَةً فَسَوْفَ يُغْنِيكُمُ اللَّهُ مِنْ فَضْلِهِ إِنْ شَاءَ ۚ إِنَّ اللَّهَ عَلِيمٌ حَكِيمٌ
  trl: Yā ayyuhā lladhīna āmanū innamā l-mushrikūna najasun fa-lā yaqrabū l-masjida l-ḥarāma baʿda ʿāmihim hādhā — wa-in khiftum ʿaylatan fa-sawfa yughnīkumu llāhu min faḍlihi in shāʾ — inna llāha ʿalīmun ḥakīm
  trad: 'Ô vous qui avez cru, les mushrikūn ne sont que najas : qu''ils ne s''approchent donc plus du Masjid al-Ḥarām après cette année qui est la leur. Et si vous craignez l''indigence, Allaah vous enrichira de Sa faveur, s''Il le veut. Allaah est, assurément, ʿAlīm, Ḥakīm.'
- ref: S.9:29
  ar: قَاتِلُوا الَّذِينَ لَا يُؤْمِنُونَ بِاللَّهِ وَلَا بِالْيَوْمِ الْآخِرِ وَلَا يُحَرِّمُونَ مَا حَرَّمَ اللَّهُ وَرَسُولُهُ وَلَا يَدِينُونَ دِينَ الْحَقِّ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ حَتَّىٰ يُعْطُوا الْجِزْيَةَ عَنْ يَدٍ وَهُمْ صَاغِرُونَ
  trl: Qātilū lladhīna lā yuʾminūna billāhi wa-lā bi-l-yawmi l-ākhiri wa-lā yuḥarrimūna mā ḥarrama llāhu wa-rasūluhu wa-lā yadīnūna dīna l-ḥaqqi mina lladhīna ūtū l-kitāba ḥattā yuʿṭū l-jizyata ʿan yadin wa-hum ṣāghirūn
  trad: Combattez ceux qui ne croient ni en Allaah ni au Jour Dernier, qui ne déclarent pas ḥarām ce qu'Allaah et Son rasūl ont déclaré ḥarām, et qui ne pratiquent pas le dīn du ḥaqq, parmi ceux à qui le Kitāb a été donné — jusqu'à ce qu'ils remettent la jizya, de leur main, en étant ṣāghirūn.
- ref: S.9:30
  ar: وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ وَقَالَتِ النَّصَارَى الْمَسِيحُ ابْنُ اللَّهِ ۖ ذَٰلِكَ قَوْلُهُمْ بِأَفْوَاهِهِمْ ۖ يُضَاهِئُونَ قَوْلَ الَّذِينَ كَفَرُوا مِنْ قَبْلُ ۚ قَاتَلَهُمُ اللَّهُ ۚ أَنَّىٰ يُؤْفَكُونَ
  trl: Wa-qālati l-yahūdu ʿuzayrun ibnu llāhi wa-qālati n-naṣārā l-masīḥu bnu llāhi — dhālika qawluhum bi-afwāhihim — yuḍāhiʾūna qawla lladhīna kafarū min qablu — qātalahumu llāhu — annā yuʾfakūn
  trad: 'Les Juifs ont dit : « ʿUzayr est fils d''Allaah » ; et les Chrétiens ont dit : « al-Masīḥ est fils d''Allaah. » Telle est leur parole, dans leurs bouches — ils font écho à la parole de ceux qui ont commis le kufr auparavant. Qu''Allaah les anéantisse ! Comment sont-ils détournés [de la vérité] ?'
- ref: S.9:31
  ar: اتَّخَذُوا أَحْبَارَهُمْ وَرُهْبَانَهُمْ أَرْبَابًا مِنْ دُونِ اللَّهِ وَالْمَسِيحَ ابْنَ مَرْيَمَ وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا إِلَٰهًا وَاحِدًا ۖ لَا إِلَٰهَ إِلَّا هُوَ ۚ سُبْحَانَهُ عَمَّا يُشْرِكُونَ
  trl: Ittakhadhū aḥbārahum wa-ruhbānahum arbāban min dūni llāhi wa-l-masīḥa bna maryama wa-mā umirū illā li-yaʿbudū ilāhan wāḥidan — lā ilāha illā huwa — subḥānahu ʿammā yushrikūn
  trad: 'Ils ont pris leurs aḥbār et leurs ruhbān comme arbāb en dehors d''Allaah, et al-Masīḥ fils de Maryam — alors qu''il ne leur avait été commandé que d''adorer un ilāh unique. Il n''y a d''ilāh que Lui. Gloire à Lui : Il est exempt de ce qu''ils Lui associent (yushrikūn).'
- ref: S.9:32
  ar: يُرِيدُونَ أَنْ يُطْفِئُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ وَيَأْبَى اللَّهُ إِلَّا أَنْ يُتِمَّ نُورَهُ وَلَوْ كَرِهَ الْكَافِرُونَ
  trl: Yurīdūna an yuṭfiʾū nūra llāhi bi-afwāhihim wa-yaʾbā llāhu illā an yutimma nūrahu wa-law kariha l-kāfirūn
  trad: Ils veulent éteindre la lumière (nūr) d'Allaah avec leurs bouches, et Allaah refuse tout, sinon de porter Sa lumière à son plein achèvement — même si cela déplaît aux kāfirūn.
- ref: S.9:33
  ar: هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَىٰ وَدِينِ الْحَقِّ لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ الْمُشْرِكُونَ
  trl: Huwa lladhī arsala rasūlahu bi-l-hudā wa-dīni l-ḥaqqi li-yuẓhirahu ʿalā d-dīni kullihi wa-law kariha l-mushrikūn
  trad: C'est Ce qui a envoyé Son rasūl avec la guidance (hudā) et le dīn du ḥaqq, pour le faire prévaloir sur le dīn tout entier — même si cela déplaît aux mushrikūn.
- ref: S.9:34
  ar: ۞ يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّ كَثِيرًا مِنَ الْأَحْبَارِ وَالرُّهْبَانِ لَيَأْكُلُونَ أَمْوَالَ النَّاسِ بِالْبَاطِلِ وَيَصُدُّونَ عَنْ سَبِيلِ اللَّهِ ۗ وَالَّذِينَ يَكْنِزُونَ الذَّهَبَ وَالْفِضَّةَ وَلَا يُنْفِقُونَهَا فِي سَبِيلِ اللَّهِ فَبَشِّرْهُمْ بِعَذَابٍ أَلِيمٍ
  trl: Yā ayyuhā lladhīna āmanū inna kathīran mina l-aḥbāri wa-r-ruhbāni la-yaʾkulūna amwāla n-nāsi bi-l-bāṭili wa-yaṣuddūna ʿan sabīli llāhi — wa-lladhīna yaknizūna dh-dhahaba wa-l-fiḍḍata wa-lā yunfiqūnahā fī sabīli llāhi fa-bashshirhum bi-ʿadhābin alīm
  trad: Ô vous qui avez cru, nombre d'aḥbār et de ruhbān mangent, assurément, les biens des gens à tort (bi-l-bāṭil), et détournent du sabīl d'Allaah. Et ceux qui thésaurisent (yaknizūna) l'or et l'argent, et ne les dépensent pas sur le sabīl d'Allaah — annonce-leur un châtiment douloureux.
- ref: S.9:35
  ar: يَوْمَ يُحْمَىٰ عَلَيْهَا فِي نَارِ جَهَنَّمَ فَتُكْوَىٰ بِهَا جِبَاهُهُمْ وَجُنُوبُهُمْ وَظُهُورُهُمْ ۖ هَٰذَا مَا كَنَزْتُمْ لِأَنْفُسِكُمْ فَذُوقُوا مَا كُنْتُمْ تَكْنِزُونَ
  trl: Yawma yuḥmā ʿalayhā fī nāri jahannama fa-tukwā bihā jibāhuhum wa-junūbuhum wa-ẓuhūruhum — hādhā mā kanaztum li-anfusikum fa-dhūqū mā kuntum taknizūn
  trad: 'Le jour où cela sera chauffé dans le feu de Jahannam, et qu''en seront marqués (tukwā) leurs fronts, leurs flancs et leurs dos : « Voici ce que vous thésaurisiez pour vous-mêmes — goûtez donc ce que vous thésaurisiez. »'
- ref: S.9:36
  ar: إِنَّ عِدَّةَ الشُّهُورِ عِنْدَ اللَّهِ اثْنَا عَشَرَ شَهْرًا فِي كِتَابِ اللَّهِ يَوْمَ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ مِنْهَا أَرْبَعَةٌ حُرُمٌ ۚ ذَٰلِكَ الدِّينُ الْقَيِّمُ ۚ فَلَا تَظْلِمُوا فِيهِنَّ أَنْفُسَكُمْ ۚ وَقَاتِلُوا الْمُشْرِكِينَ كَافَّةً كَمَا يُقَاتِلُونَكُمْ كَافَّةً ۚ وَاعْلَمُوا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ
  trl: Inna ʿiddata sh-shuhūri ʿinda llāhi thnā ʿashara shahran fī kitābi llāhi yawma khalaqa s-samāwāti wa-l-arḍa minhā arbaʿatun ḥurumun — dhālika d-dīnu l-qayyimu — fa-lā taẓlimū fīhinna anfusakum — wa-qātilū l-mushrikīna kāffatan kamā yuqātilūnakum kāffatan — wa-ʿlamū anna llāha maʿa l-muttaqīn
  trad: Le compte des mois, auprès d'Allaah, est de douze mois — dans le Kitāb d'Allaah, depuis le jour où Il a créé les cieux et la terre — dont quatre sont sacrés (ḥurum). Voilà le dīn droit (al-qayyim). Ne vous faites donc pas de tort, en ces mois, à vous-mêmes. Et combattez les mushrikūn tous ensemble, comme ils vous combattent tous ensemble. Sachez qu'Allaah est avec les muttaqīn.
- ref: S.9:37
  ar: إِنَّمَا النَّسِيءُ زِيَادَةٌ فِي الْكُفْرِ ۖ يُضَلُّ بِهِ الَّذِينَ كَفَرُوا يُحِلُّونَهُ عَامًا وَيُحَرِّمُونَهُ عَامًا لِيُوَاطِئُوا عِدَّةَ مَا حَرَّمَ اللَّهُ فَيُحِلُّوا مَا حَرَّمَ اللَّهُ ۚ زُيِّنَ لَهُمْ سُوءُ أَعْمَالِهِمْ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ
  trl: Innamā n-nasīʾu ziyādatun fi l-kufri — yuḍallu bihi lladhīna kafarū yuḥillūnahu ʿāman wa-yuḥarrimūnahu ʿāman li-yuwāṭiʾū ʿiddata mā ḥarrama llāhu fa-yuḥillū mā ḥarrama llāhu — zuyyina lahum sūʾu aʿmālihim — wa-llāhu lā yahdi l-qawma l-kāfirīn
  trad: 'Le nasīʾ n''est qu''un surplus dans le kufr, par lequel sont égarés ceux qui commettent le kufr : ils le déclarent licite une année et interdit une autre, pour faire correspondre le compte de ce qu''Allaah a déclaré sacré, et ainsi rendre licite ce qu''Allaah a déclaré interdit. Le mal de leurs actes leur a été enjolivé (zuyyina). Allaah ne guide pas le peuple des kāfirūn.'
- ref: S.9:38–39
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا مَا لَكُمْ إِذَا قِيلَ لَكُمُ انْفِرُوا فِي سَبِيلِ اللَّهِ اثَّاقَلْتُمْ إِلَى الْأَرْضِ ۚ أَرَضِيتُمْ بِالْحَيَاةِ الدُّنْيَا مِنَ الْآخِرَةِ ۚ فَمَا مَتَاعُ الْحَيَاةِ الدُّنْيَا فِي الْآخِرَةِ إِلَّا قَلِيلٌ ۝ إِلَّا تَنْفِرُوا يُعَذِّبْكُمْ عَذَابًا أَلِيمًا وَيَسْتَبْدِلْ قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّوهُ شَيْئًا ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Yā ayyuhā lladhīna āmanū mā lakum idhā qīla lakumu nfirū fī sabīli llāhi thāqaltum ila l-arḍi — a-raḍītum bi-l-ḥayāti d-dunyā mina l-ākhirati — fa-mā matāʿu l-ḥayāti d-dunyā fi l-ākhirati illā qalīlun — illā tanfirū yuʿadhdhibkum ʿadhāban alīman wa-yastabdil qawman ghayrakum wa-lā taḍurrūhu shayʾan — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: Ô vous qui avez cru, qu'avez-vous, quand il vous est dit « partez sur le sabīl d'Allaah », à vous alourdir vers la terre ? Vous satisfaites-vous de la vie de ce bas monde plutôt que de l'Ākhira ? La jouissance de la vie de ce bas monde, face à l'Ākhira, n'est que peu de chose. Si vous ne partez pas, Il vous châtiera d'un châtiment douloureux, et fera venir à votre place un autre peuple que vous — et vous ne Lui nuirez en rien. Allaah, sur toute chose, est Qadīr.
- ref: S.9:40
  ar: إِلَّا تَنْصُرُوهُ فَقَدْ نَصَرَهُ اللَّهُ إِذْ أَخْرَجَهُ الَّذِينَ كَفَرُوا ثَانِيَ اثْنَيْنِ إِذْ هُمَا فِي الْغَارِ إِذْ يَقُولُ لِصَاحِبِهِ لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا ۖ فَأَنْزَلَ اللَّهُ سَكِينَتَهُ عَلَيْهِ وَأَيَّدَهُ بِجُنُودٍ لَمْ تَرَوْهَا وَجَعَلَ كَلِمَةَ الَّذِينَ كَفَرُوا السُّفْلَىٰ ۗ وَكَلِمَةُ اللَّهِ هِيَ الْعُلْيَا ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ
  trl: Illā tanṣurūhu fa-qad naṣarahu llāhu idh akhrajahu lladhīna kafarū thāniya thnayni idh humā fi l-ghāri idh yaqūlu li-ṣāḥibihi lā taḥzan inna llāha maʿanā — fa-anzala llāhu sakīnatahu ʿalayhi wa-ayyadahu bi-junūdin lam tarawhā wa-jaʿala kalimata lladhīna kafarū s-suflā — wa-kalimatu llāhi hiya l-ʿulyā — wa-llāhu ʿazīzun ḥakīm
  trad: 'Si vous ne lui portez pas secours, Allaah l''a déjà secouru, quand ceux qui commettaient le kufr l''ont fait sortir, lui, le second de deux, tous deux dans la grotte, quand il disait à son compagnon : « Ne t''afflige pas, Allaah est avec nous. » Allaah fit alors descendre Sa sakīna sur lui, le renforça de junūd que vous ne voyiez pas, et fit de la parole de ceux qui commettaient le kufr la plus basse — tandis que la parole d''Allaah, elle, l''emporte. Allaah est, assurément, ʿAzīz, Ḥakīm.'
- ref: S.9:41–42
  ar: انْفِرُوا خِفَافًا وَثِقَالًا وَجَاهِدُوا بِأَمْوَالِكُمْ وَأَنْفُسِكُمْ فِي سَبِيلِ اللَّهِ ۚ ذَٰلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ ۝ لَوْ كَانَ عَرَضًا قَرِيبًا وَسَفَرًا قَاصِدًا لَاتَّبَعُوكَ وَلَٰكِنْ بَعُدَتْ عَلَيْهِمُ الشُّقَّةُ ۚ وَسَيَحْلِفُونَ بِاللَّهِ لَوِ اسْتَطَعْنَا لَخَرَجْنَا مَعَكُمْ يُهْلِكُونَ أَنْفُسَهُمْ وَاللَّهُ يَعْلَمُ إِنَّهُمْ لَكَاذِبُونَ
  trl: Infirū khifāfan wa-thiqālan wa-jāhidū bi-amwālikum wa-anfusikum fī sabīli llāhi — dhālikum khayrun lakum in kuntum taʿlamūn — law kāna ʿaraḍan qarīban wa-safaran qāṣidan la-ttabaʿūka wa-lākin buʿidat ʿalayhimu sh-shuqqatu — wa-sa-yaḥlifūna billāhi lawi staṭaʿnā la-kharajnā maʿakum yuhlikūna anfusahum wa-llāhu yaʿlamu innahum la-kādhibūn
  trad: 'Partez, légers ou lourds, et luttez (jāhidū) par vos biens et vous-mêmes sur le sabīl d''Allaah — cela est meilleur pour vous, si seulement vous saviez. Si cela avait été un gain proche et un voyage sans détour, ils t''auraient suivi ; mais la distance leur a paru longue. Ils jureront par Allaah : « Si nous avions pu, nous serions sortis avec vous » — ils se perdent eux-mêmes ; Allaah sait qu''ils sont, assurément, menteurs.'
- ref: S.9:43
  ar: عَفَا اللَّهُ عَنْكَ لِمَ أَذِنْتَ لَهُمْ حَتَّىٰ يَتَبَيَّنَ لَكَ الَّذِينَ صَدَقُوا وَتَعْلَمَ الْكَاذِبِينَ
  trl: ʿAfā llāhu ʿanka lima adhinta lahum ḥattā yatabayyana laka lladhīna ṣadaqū wa-taʿlama l-kādhibīn
  trad: Allaah a effacé pour toi (ʿafā) — pourquoi leur as-tu donné permission avant que ne te soit devenu clair qui, parmi eux, disait vrai, et que tu saches qui étaient les menteurs ?
- ref: S.9:44–45
  ar: لَا يَسْتَأْذِنُكَ الَّذِينَ يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ أَنْ يُجَاهِدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ ۗ وَاللَّهُ عَلِيمٌ بِالْمُتَّقِينَ ۝ إِنَّمَا يَسْتَأْذِنُكَ الَّذِينَ لَا يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَارْتَابَتْ قُلُوبُهُمْ فَهُمْ فِي رَيْبِهِمْ يَتَرَدَّدُونَ
  trl: Lā yastaʾdhinuka lladhīna yuʾminūna billāhi wa-l-yawmi l-ākhiri an yujāhidū bi-amwālihim wa-anfusihim — wa-llāhu ʿalīmun bi-l-muttaqīn — innamā yastaʾdhinuka lladhīna lā yuʾminūna billāhi wa-l-yawmi l-ākhiri wa-rtābat qulūbuhum fa-hum fī raybihim yataraddadūn
  trad: Ceux qui croient en Allaah et au Jour Dernier ne te demandent pas dispense de lutter par leurs biens et eux-mêmes. Allaah connaît parfaitement les muttaqīn. Ne te demandent dispense que ceux qui ne croient pas en Allaah ni au Jour Dernier, et dont les cœurs sont saisis du doute (irtāba) — et les voilà, dans leur doute, qui hésitent (yataraddadūn).
- ref: S.9:46
  ar: ۞ وَلَوْ أَرَادُوا الْخُرُوجَ لَأَعَدُّوا لَهُ عُدَّةً وَلَٰكِنْ كَرِهَ اللَّهُ انْبِعَاثَهُمْ فَثَبَّطَهُمْ وَقِيلَ اقْعُدُوا مَعَ الْقَاعِدِينَ
  trl: Wa-law arādū l-khurūja la-aʿaddū lahu ʿuddatan wa-lākin kariha llāhu nbiʿāthahum fa-thabbaṭahum wa-qīla qʿudū maʿa l-qāʿidīn
  trad: 'Et s''ils avaient voulu sortir, ils s''y seraient préparés — mais Allaah a rejeté (kariha) leur mise en marche (inbiʿāth), et Il les a retenus (thabbaṭa) : « Restez avec ceux qui restent. »'
- ref: S.9:47–48
  ar: لَوْ خَرَجُوا فِيكُمْ مَا زَادُوكُمْ إِلَّا خَبَالًا وَلَأَوْضَعُوا خِلَالَكُمْ يَبْغُونَكُمُ الْفِتْنَةَ وَفِيكُمْ سَمَّاعُونَ لَهُمْ ۗ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ ۝ لَقَدِ ابْتَغَوُا الْفِتْنَةَ مِنْ قَبْلُ وَقَلَّبُوا لَكَ الْأُمُورَ حَتَّىٰ جَاءَ الْحَقُّ وَظَهَرَ أَمْرُ اللَّهِ وَهُمْ كَارِهُونَ
  trl: Law kharajū fīkum mā zādūkum illā khabālan wa-la-awḍaʿū khilālakum yabghūnakumu l-fitnata wa-fīkum sammāʿūna lahum — wa-llāhu ʿalīmun bi-ẓ-ẓālimīn — la-qadi btaghawu l-fitnata min qablu wa-qallabū laka l-umūra ḥattā jāʾa l-ḥaqqu wa-ẓahara amru llāhi wa-hum kārihūn
  trad: S'ils étaient sortis parmi vous, ils n'auraient fait qu'accroître pour vous le trouble (khabāl), et se seraient précipités au milieu de vous, cherchant à vous jeter dans la fitna — et il y a, parmi vous, des gens à leur écoute. Allaah connaît parfaitement les ẓālimūn. Ils ont déjà, auparavant, cherché la fitna, et retourné les affaires contre toi, jusqu'à ce que vienne le ḥaqq et qu'apparaisse (ẓahara) l'ordre d'Allaah — alors même que cela leur déplaisait.
- ref: S.9:49–50
  ar: وَمِنْهُمْ مَنْ يَقُولُ ائْذَنْ لِي وَلَا تَفْتِنِّي ۚ أَلَا فِي الْفِتْنَةِ سَقَطُوا ۗ وَإِنَّ جَهَنَّمَ لَمُحِيطَةٌ بِالْكَافِرِينَ ۝ إِنْ تُصِبْكَ حَسَنَةٌ تَسُؤْهُمْ ۖ وَإِنْ تُصِبْكَ مُصِيبَةٌ يَقُولُوا قَدْ أَخَذْنَا أَمْرَنَا مِنْ قَبْلُ وَيَتَوَلَّوْا وَهُمْ فَرِحُونَ
  trl: Wa-minhum man yaqūlu adhan lī wa-lā taftinnī — a-lā fi l-fitnati saqaṭū — wa-inna jahannama la-muḥīṭatun bi-l-kāfirīn — in tuṣibka ḥasanatun tasuʾhum wa-in tuṣibka muṣībatun yaqūlū qad akhadhnā amranā min qablu wa-yatawallaw wa-hum fariḥūn
  trad: 'Et parmi eux, il en est qui dit : « Donne-moi permission, et ne me mets pas à l''épreuve (lā taftinnī). » — N''est-ce pas dans la fitna qu''ils sont déjà tombés (saqaṭū) ? Jahannam, assurément, encercle (muḥīṭa) les kāfirūn. Qu''un bien te touche, cela les afflige ; qu''un malheur te touche, ils disent : « Nous avions déjà pris nos précautions » — et ils se détournent, tout joyeux (fariḥūn).'
- ref: S.9:51–52
  ar: قُلْ لَنْ يُصِيبَنَا إِلَّا مَا كَتَبَ اللَّهُ لَنَا هُوَ مَوْلَانَا ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ ۝ قُلْ هَلْ تَرَبَّصُونَ بِنَا إِلَّا إِحْدَى الْحُسْنَيَيْنِ ۖ وَنَحْنُ نَتَرَبَّصُ بِكُمْ أَنْ يُصِيبَكُمُ اللَّهُ بِعَذَابٍ مِنْ عِنْدِهِ أَوْ بِأَيْدِينَا ۖ فَتَرَبَّصُوا إِنَّا مَعَكُمْ مُتَرَبِّصُونَ
  trl: Qul lan yuṣībanā illā mā kataba llāhu lanā huwa mawlānā — wa-ʿalā llāhi fa-l-yatawakkali l-muʾminūn — qul hal tarabbaṣūna binā illā iḥdā l-ḥusnayayni — wa-naḥnu natarabbaṣu bikum an yuṣībakumu llāhu bi-ʿadhābin min ʿindihi aw bi-aydīnā — fa-tarabbaṣū innā maʿakum mutarabbiṣūn
  trad: 'Dis : « Rien ne nous touchera, sinon ce qu''Allaah a écrit (kataba) pour nous. C''est Lui notre mawlā. » — Sur Allaah, que s''appuient (fa-l-yatawakkal) les muʾminūn. Dis : « Attendez-vous pour nous autre chose que l''une des deux plus belles choses (iḥdā l-ḥusnayayni) ? Nous, nous attendons pour vous qu''Allaah vous touche d''un châtiment venant de Lui, ou par nos mains. Attendez donc — nous attendons, nous aussi, avec vous. »'
- ref: S.9:53–54
  ar: قُلْ أَنْفِقُوا طَوْعًا أَوْ كَرْهًا لَنْ يُتَقَبَّلَ مِنْكُمْ ۖ إِنَّكُمْ كُنْتُمْ قَوْمًا فَاسِقِينَ ۝ وَمَا مَنَعَهُمْ أَنْ تُقْبَلَ مِنْهُمْ نَفَقَاتُهُمْ إِلَّا أَنَّهُمْ كَفَرُوا بِاللَّهِ وَبِرَسُولِهِ وَلَا يَأْتُونَ الصَّلَاةَ إِلَّا وَهُمْ كُسَالَىٰ وَلَا يُنْفِقُونَ إِلَّا وَهُمْ كَارِهُونَ
  trl: Qul anfiqū ṭawʿan aw karhan lan yutaqabbala minkum — innakum kuntum qawman fāsiqīn — wa-mā manaʿahum an tuqbala minhum nafaqātuhum illā annahum kafarū billāhi wa-bi-rasūlihi wa-lā yaʾtūna ṣ-ṣalāta illā wa-hum kusālā wa-lā yunfiqūna illā wa-hum kārihūn
  trad: 'Dis : « Dépensez de bon gré ou à contrecœur, cela ne sera jamais accepté de vous — vous êtes, assurément, des fāsiqūn. » Et rien n''a empêché que leurs dépenses soient acceptées d''eux, sinon qu''ils ont commis le kufr envers Allaah et envers Son rasūl, qu''ils ne viennent à la ṣalāt qu''avec paresse (kusālā), et qu''ils ne dépensent qu''à contrecœur (kārihūn).'
- ref: S.9:55–57
  ar: فَلَا تُعْجِبْكَ أَمْوَالُهُمْ وَلَا أَوْلَادُهُمْ ۚ إِنَّمَا يُرِيدُ اللَّهُ لِيُعَذِّبَهُمْ بِهَا فِي الْحَيَاةِ الدُّنْيَا وَتَزْهَقَ أَنْفُسُهُمْ وَهُمْ كَافِرُونَ ۝ وَيَحْلِفُونَ بِاللَّهِ إِنَّهُمْ لَمِنْكُمْ وَمَا هُمْ مِنْكُمْ وَلَٰكِنَّهُمْ قَوْمٌ يَفْرَقُونَ ۝ لَوْ يَجِدُونَ مَلْجَأً أَوْ مَغَارَاتٍ أَوْ مُدَّخَلًا لَوَلَّوْا إِلَيْهِ وَهُمْ يَجْمَحُونَ
  trl: Fa-lā tuʿjibka amwāluhum wa-lā awlāduhum — innamā yurīdu llāhu li-yuʿadhdhibahum bihā fi l-ḥayāti d-dunyā wa-tazhaqa anfusuhum wa-hum kāfirūn — wa-yaḥlifūna billāhi innahum la-minkum wa-mā hum minkum wa-lākinnahum qawmun yafraqūn — law yajidūna maljaʾan aw maghārātin aw muddakhalan la-wallaw ilayhi wa-hum yajmaḥūn
  trad: Que ne t'émerveillent donc ni leurs biens ni leurs enfants — Allaah ne veut que les châtier par eux dans la vie de ce bas monde, et que leurs nafs périssent (tazhaqa) alors qu'ils sont kāfirūn. Ils jurent par Allaah qu'ils sont bien des vôtres — mais ils ne sont pas des vôtres ; ce sont des gens qui ont peur (yafraqūn). S'ils trouvaient un refuge, des grottes, ou une entrée où se faufiler, ils s'y précipiteraient en débandade (yajmaḥūn).
- ref: S.9:58–59
  ar: وَمِنْهُمْ مَنْ يَلْمِزُكَ فِي الصَّدَقَاتِ فَإِنْ أُعْطُوا مِنْهَا رَضُوا وَإِنْ لَمْ يُعْطَوْا مِنْهَا إِذَا هُمْ يَسْخَطُونَ ۝ وَلَوْ أَنَّهُمْ رَضُوا مَا آتَاهُمُ اللَّهُ وَرَسُولُهُ وَقَالُوا حَسْبُنَا اللَّهُ سَيُؤْتِينَا اللَّهُ مِنْ فَضْلِهِ وَرَسُولُهُ إِنَّا إِلَى اللَّهِ رَاغِبُونَ
  trl: Wa-minhum man yalmizuka fi ṣ-ṣadaqāti fa-in uʿṭū minhā raḍū wa-in lam yuʿṭaw minhā idhā hum yaskhaṭūn — wa-law annahum raḍū mā ātāhumu llāhu wa-rasūluhu wa-qālū ḥasbunā llāhu sa-yuʾtīnā llāhu min faḍlihi wa-rasūluhu innā ila llāhi rāghibūn
  trad: 'Et parmi eux, il en est qui te critique (yalmizuka) au sujet des ṣadaqāt : si on leur en donne, ils sont satisfaits ; si on ne leur en donne pas, les voilà qui manifestent le sakhaṭ. S''ils s''étaient satisfaits de ce qu''Allaah et Son rasūl leur avaient donné, et avaient dit : « Allaah nous suffit (ḥasbunā llāh), Allaah va nous donner de Sa faveur, et Son rasūl aussi — c''est vers Allaah que nous aspirons (rāghibūn) » [cela aurait été meilleur pour eux].'
- ref: S.9:60
  ar: ۞ إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ وَالْعَامِلِينَ عَلَيْهَا وَالْمُؤَلَّفَةِ قُلُوبُهُمْ وَفِي الرِّقَابِ وَالْغَارِمِينَ وَفِي سَبِيلِ اللَّهِ وَابْنِ السَّبِيلِ ۖ فَرِيضَةً مِنَ اللَّهِ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Innamā ṣ-ṣadaqātu li-l-fuqarāʾi wa-l-masākīni wa-l-ʿāmilīna ʿalayhā wa-l-muʾallafati qulūbuhum wa-fī r-riqābi wa-l-ghārimīna wa-fī sabīli llāhi wa-bni s-sabīli — farīḍatan mina llāhi — wa-llāhu ʿalīmun ḥakīm
  trad: Les ṣadaqāt ne sont destinées qu'aux fuqarāʾ, aux masākīn, à ceux qui en assurent la gestion, à ceux dont les cœurs sont en voie d'être rapprochés, à la libération des personnes en servitude (fi r-riqāb), aux ghārimūn écrasés de dettes, à ce qui est sur le sabīl d'Allaah, et au voyageur en rupture de ressources (ibn as-sabīl) — une obligation prescrite par Allaah (farīḍatan mina llāh). Allaah est, assurément, ʿAlīm, Ḥakīm.
- ref: S.9:61
  ar: وَمِنْهُمُ الَّذِينَ يُؤْذُونَ النَّبِيَّ وَيَقُولُونَ هُوَ أُذُنٌ ۚ قُلْ أُذُنُ خَيْرٍ لَكُمْ يُؤْمِنُ بِاللَّهِ وَيُؤْمِنُ لِلْمُؤْمِنِينَ وَرَحْمَةٌ لِلَّذِينَ آمَنُوا مِنْكُمْ ۚ وَالَّذِينَ يُؤْذُونَ رَسُولَ اللَّهِ لَهُمْ عَذَابٌ أَلِيمٌ
  trl: Wa-minhumu lladhīna yuʾdhūna n-nabiyya wa-yaqūlūna huwa udhunun — qul udhunu khayrin lakum yuʾminu billāhi wa-yuʾminu li-l-muʾminīna wa-raḥmatun lilladhīna āmanū minkum — wa-lladhīna yuʾdhūna rasūla llāhi lahum ʿadhābun alīm
  trad: 'Et parmi eux, il en est qui font du tort au nabī, et disent : « Il n''est qu''une oreille [prête à tout croire]. » Dis : « Une oreille tournée vers le bien, pour vous — il croit en Allaah, et il fait confiance aux muʾminūn, et il est une raḥma pour ceux d''entre vous qui ont cru. » Et ceux qui font du tort au rasūl d''Allaah auront un châtiment douloureux.'
- ref: S.9:62–63
  ar: يَحْلِفُونَ بِاللَّهِ لَكُمْ لِيُرْضُوكُمْ وَاللَّهُ وَرَسُولُهُ أَحَقُّ أَنْ يُرْضُوهُ إِنْ كَانُوا مُؤْمِنِينَ ۝ أَلَمْ يَعْلَمُوا أَنَّهُ مَنْ يُحَادِدِ اللَّهَ وَرَسُولَهُ فَأَنَّ لَهُ نَارَ جَهَنَّمَ خَالِدًا فِيهَا ۚ ذَٰلِكَ الْخِزْيُ الْعَظِيمُ
  trl: Yaḥlifūna billāhi lakum li-yurḍūkum wa-llāhu wa-rasūluhu aḥaqqu an yurḍūhu in kānū muʾminīn — a-lam yaʿlamū annahu man yuḥādidi llāha wa-rasūlahu fa-anna lahu nāra jahannama khālidan fīhā — dhālika l-khizyu l-ʿaẓīm
  trad: Ils jurent par Allaah, devant vous, pour vous satisfaire — alors qu'Allaah et Son rasūl sont plus en droit qu'ils cherchent à Les satisfaire, s'ils sont réellement muʾminūn. Ne savent-ils pas que quiconque s'oppose frontalement (yuḥādid) à Allaah et à Son rasūl aura, assurément, le feu de Jahannam, où il demeurera — voilà l'humiliation (al-khizy) immense ?
- ref: S.9:64–65
  ar: يَحْذَرُ الْمُنَافِقُونَ أَنْ تُنَزَّلَ عَلَيْهِمْ سُورَةٌ تُنَبِّئُهُمْ بِمَا فِي قُلُوبِهِمْ ۚ قُلِ اسْتَهْزِئُوا إِنَّ اللَّهَ مُخْرِجٌ مَا تَحْذَرُونَ ۝ وَلَئِنْ سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُ ۚ قُلْ أَبِاللَّهِ وَآيَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِئُونَ
  trl: Yaḥdharu l-munāfiqūna an tunazzala ʿalayhim sūratun tunabbiʾuhum bimā fī qulūbihim — quli stahziʾū inna llāha mukhrijun mā taḥdharūn — wa-la-in saʾaltahum la-yaqūlunna innamā kunnā nakhūḍu wa-nalʿab — qul a-billāhi wa-āyātihi wa-rasūlihi kuntum tastahziʾūn
  trad: 'Les munāfiqūn craignent qu''une sourate ne descende sur eux, qui leur annonce ce qu''il y a dans leurs cœurs. Dis : « Raillez tant que vous voulez — Allaah va faire sortir au grand jour ce que vous redoutez. » Et si tu les interroges, ils diront, assurément : « Nous ne faisions que plonger dans un discours vain (nakhūḍu) et jouer (nalʿab). » Dis : « Est-ce d''Allaah, de Ses āyāt et de Son rasūl que vous vous moquiez ? »'
- ref: S.9:66
  ar: لَا تَعْتَذِرُوا قَدْ كَفَرْتُمْ بَعْدَ إِيمَانِكُمْ ۚ إِنْ نَعْفُ عَنْ طَائِفَةٍ مِنْكُمْ نُعَذِّبْ طَائِفَةً بِأَنَّهُمْ كَانُوا مُجْرِمِينَ
  trl: Lā taʿtadhirū qad kafartum baʿda īmānikum — in naʿfu ʿan ṭāʾifatin minkum nuʿadhdhib ṭāʾifatan bi-annahum kānū mujrimīn
  trad: 'Ne vous excusez pas : vous avez commis le kufr après votre foi (īmān). Si Nous effaçons pour un groupe d''entre vous, Nous en châtierons un autre, parce qu''ils étaient, assurément, mujrimūn.'
- ref: S.9:67–68
  ar: الْمُنَافِقُونَ وَالْمُنَافِقَاتُ بَعْضُهُمْ مِنْ بَعْضٍ ۚ يَأْمُرُونَ بِالْمُنْكَرِ وَيَنْهَوْنَ عَنِ الْمَعْرُوفِ وَيَقْبِضُونَ أَيْدِيَهُمْ ۚ نَسُوا اللَّهَ فَنَسِيَهُمْ ۗ إِنَّ الْمُنَافِقِينَ هُمُ الْفَاسِقُونَ ۝ وَعَدَ اللَّهُ الْمُنَافِقِينَ وَالْمُنَافِقَاتِ وَالْكُفَّارَ نَارَ جَهَنَّمَ خَالِدِينَ فِيهَا ۚ هِيَ حَسْبُهُمْ ۚ وَلَعَنَهُمُ اللَّهُ ۖ وَلَهُمْ عَذَابٌ مُقِيمٌ
  trl: Al-munāfiqūna wa-l-munāfiqātu baʿḍuhum min baʿḍin — yaʾmurūna bi-l-munkari wa-yanhawna ʿani l-maʿrūfi wa-yaqbiḍūna aydiyahum — nasū llāha fa-nasiyahum — inna l-munāfiqīna humu l-fāsiqūn — waʿada llāhu l-munāfiqīna wa-l-munāfiqāti wa-l-kuffāra nāra jahannama khālidīna fīhā — hiya ḥasbuhum — wa-laʿanahumu llāhu — wa-lahum ʿadhābun muqīm
  trad: Les munāfiqūn et les munāfiqātu relèvent les uns des autres — ils ordonnent le munkar (le blâmable) et interdisent le maʿrūf (le convenable), et referment leurs mains [sur leurs biens]. Ils ont délaissé Allaah — Il les a donc délaissés en retour. Les munāfiqūn sont, assurément, les fāsiqūn. Allaah a promis aux munāfiqūn, aux munāfiqātu et aux kuffār le feu de Jahannam, où ils demeureront — cela leur suffit (ḥasbuhum). Allaah les a exclus de Sa miséricorde (laʿanahum), et à eux un châtiment qui perdure.
- ref: S.9:69
  ar: كَالَّذِينَ مِنْ قَبْلِكُمْ كَانُوا أَشَدَّ مِنْكُمْ قُوَّةً وَأَكْثَرَ أَمْوَالًا وَأَوْلَادًا فَاسْتَمْتَعُوا بِخَلَاقِهِمْ فَاسْتَمْتَعْتُمْ بِخَلَاقِكُمْ كَمَا اسْتَمْتَعَ الَّذِينَ مِنْ قَبْلِكُمْ بِخَلَاقِهِمْ وَخُضْتُمْ كَالَّذِي خَاضُوا ۚ أُولَٰئِكَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ ۖ وَأُولَٰئِكَ هُمُ الْخَاسِرُونَ
  trl: Ka-lladhīna min qablikum kānū ashadda minkum quwwatan wa-akthara amwālan wa-awlādan fa-stamtaʿū bi-khalāqihim fa-stamtaʿtum bi-khalāqikum kamā stamtaʿa lladhīna min qablikum bi-khalāqihim wa-khuḍtum ka-lladhī khāḍū — ulāʾika ḥabiṭat aʿmāluhum fi d-dunyā wa-l-ākhirati — wa-ulāʾika humu l-khāsirūn
  trad: 'Comme ceux d''avant vous, plus forts que vous en puissance (quwwa), plus riches en biens et en enfants : ils ont joui de leur part (khalāq), et vous avez joui de votre part comme ceux d''avant vous ont joui de la leur — et vous avez plongé [dans le discours vain] comme ils y ont plongé. Ceux-là, leurs actes se sont annulés (ḥabiṭat) dans ce bas monde et dans l''Ākhira, et ceux-là sont les khāsirūn.'
- ref: S.9:70
  ar: أَلَمْ يَأْتِهِمْ نَبَأُ الَّذِينَ مِنْ قَبْلِهِمْ قَوْمِ نُوحٍ وَعَادٍ وَثَمُودَ وَقَوْمِ إِبْرَاهِيمَ وَأَصْحَابِ مَدْيَنَ وَالْمُؤْتَفِكَاتِ ۚ أَتَتْهُمْ رُسُلُهُمْ بِالْبَيِّنَاتِ ۖ فَمَا كَانَ اللَّهُ لِيَظْلِمَهُمْ وَلَٰكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ
  trl: A-lam yaʾtihim nabaʾu lladhīna min qablihim qawmi nūḥin wa-ʿādin wa-thamūda wa-qawmi ibrāhīma wa-aṣḥābi madyana wa-l-muʾtafikāti — atathum rusuluhum bi-l-bayyināti — fa-mā kāna llāhu li-yaẓlimahum wa-lākin kānū anfusahum yaẓlimūn
  trad: La nouvelle (nabaʾ) de ceux d'avant eux ne leur est-elle pas parvenue — le peuple de Nūḥ, ʿĀd, Thamūd, le peuple d'Ibrāhīm, les gens de Madyan, et les cités renversées (al-muʾtafikāt) ? Leurs rusul leur étaient venus avec les preuves manifestes (al-bayyināt) — Allaah n'était pas de nature à leur faire du tort ; mais c'est à eux-mêmes qu'ils ont fait du tort.
- ref: S.9:71–72
  ar: وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَيُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَيُطِيعُونَ اللَّهَ وَرَسُولَهُ ۚ أُولَٰئِكَ سَيَرْحَمُهُمُ اللَّهُ ۗ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ ۝ وَعَدَ اللَّهُ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَمَسَاكِنَ طَيِّبَةً فِي جَنَّاتِ عَدْنٍ ۚ وَرِضْوَانٌ مِنَ اللَّهِ أَكْبَرُ ۚ ذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ
  trl: Wa-l-muʾminūna wa-l-muʾminātu baʿḍuhum awliyāʾu baʿḍin — yaʾmurūna bi-l-maʿrūfi wa-yanhawna ʿani l-munkari wa-yuqīmūna ṣ-ṣalāta wa-yuʾtūna z-zakāta wa-yuṭīʿūna llāha wa-rasūlahu — ulāʾika sa-yarḥamuhumu llāhu — inna llāha ʿazīzun ḥakīm — waʿada llāhu l-muʾminīna wa-l-muʾmināti jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā wa-masākina ṭayyibatan fī jannāti ʿadnin — wa-riḍwānun mina llāhi akbaru — dhālika huwa l-fawzu l-ʿaẓīm
  trad: 'Les muʾminūn et les muʾminātu sont awliyāʾ les uns des autres — ils ordonnent le maʿrūf et interdisent le munkar, accomplissent la ṣalāt, s''acquittent de la zakāt, et obéissent à Allaah et à Son rasūl. Ceux-là, Allaah va leur faire raḥma. Allaah est, assurément, ʿAzīz, Ḥakīm. Allaah a promis aux muʾminūn et aux muʾminātu des jardins sous lesquels coulent les rivières, où ils demeureront, et des demeures bonnes dans les jardins d''ʿAdn — et un riḍwān venant d''Allaah, plus grand encore : voilà le fawz immense.'
- ref: S.9:73
  ar: يَا أَيُّهَا النَّبِيُّ جَاهِدِ الْكُفَّارَ وَالْمُنَافِقِينَ وَاغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَاهُمْ جَهَنَّمُ ۖ وَبِئْسَ الْمَصِيرُ
  trl: Yā ayyuhā n-nabiyyu jāhidi l-kuffāra wa-l-munāfiqīna wa-ghluẓ ʿalayhim — wa-maʾwāhum jahannamu — wa-biʾsa l-maṣīr
  trad: Ô nabī, lutte (jāhid) contre les kuffār et les munāfiqūn, et sois ferme (ughluẓ) envers eux — leur refuge (maʾwā) est Jahannam, et quelle détestable destination (al-maṣīr) !
- ref: S.9:74
  ar: يَحْلِفُونَ بِاللَّهِ مَا قَالُوا وَلَقَدْ قَالُوا كَلِمَةَ الْكُفْرِ وَكَفَرُوا بَعْدَ إِسْلَامِهِمْ وَهَمُّوا بِمَا لَمْ يَنَالُوا ۚ وَمَا نَقَمُوا إِلَّا أَنْ أَغْنَاهُمُ اللَّهُ وَرَسُولُهُ مِنْ فَضْلِهِ ۚ فَإِنْ يَتُوبُوا يَكُ خَيْرًا لَهُمْ ۖ وَإِنْ يَتَوَلَّوْا يُعَذِّبْهُمُ اللَّهُ عَذَابًا أَلِيمًا فِي الدُّنْيَا وَالْآخِرَةِ ۚ وَمَا لَهُمْ فِي الْأَرْضِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ
  trl: Yaḥlifūna billāhi mā qālū wa-la-qad qālū kalimata l-kufri wa-kafarū baʿda islāmihim wa-hammū bimā lam yanālū — wa-mā naqamū illā an aghnāhumu llāhu wa-rasūluhu min faḍlihi — fa-in yatūbū yaku khayran lahum wa-in yatawallaw yuʿadhdhibhumu llāhu ʿadhāban alīman fi d-dunyā wa-l-ākhirati — wa-mā lahum fi l-arḍi min waliyyin wa-lā naṣīr
  trad: Ils jurent par Allaah qu'ils n'ont rien dit — et pourtant ils ont dit la parole du kufr, et ont commis le kufr après leur islām (leur soumission déclarée), et ont visé (hammū) ce qu'ils n'ont pas atteint. Ils n'ont rien reproché (naqamū), sinon qu'Allaah les ait enrichis, et Son rasūl, par Sa faveur (faḍl). S'ils reviennent (tawba), ce sera meilleur pour eux ; s'ils se détournent, Allaah les châtiera d'un châtiment douloureux, dans ce bas monde et dans l'Ākhira — et ils n'auront, sur la terre, ni walī ni secoureur (naṣīr).
- ref: S.9:75–77
  ar: ۞ وَمِنْهُمْ مَنْ عَاهَدَ اللَّهَ لَئِنْ آتَانَا مِنْ فَضْلِهِ لَنَصَّدَّقَنَّ وَلَنَكُونَنَّ مِنَ الصَّالِحِينَ ۝ فَلَمَّا آتَاهُمْ مِنْ فَضْلِهِ بَخِلُوا بِهِ وَتَوَلَّوْا وَهُمْ مُعْرِضُونَ ۝ فَأَعْقَبَهُمْ نِفَاقًا فِي قُلُوبِهِمْ إِلَىٰ يَوْمِ يَلْقَوْنَهُ بِمَا أَخْلَفُوا اللَّهَ مَا وَعَدُوهُ وَبِمَا كَانُوا يَكْذِبُونَ
  trl: Wa-minhum man ʿāhada llāha la-in ātānā min faḍlihi la-naṣṣaddaqanna wa-la-nakūnanna mina ṣ-ṣāliḥīn — fa-lammā ātāhum min faḍlihi bakhilū bihi wa-tawallaw wa-hum muʿriḍūn — fa-aʿqabahum nifāqan fī qulūbihim ilā yawmi yalqawnahu bimā akhlafū llāha mā waʿadūhu wa-bimā kānū yakdhibūn
  trad: 'Et parmi eux, il en est qui avait pris engagement (ʿāhada) envers Allaah : « Si Tu nous donnes de Ta faveur, nous ferons, assurément, la ṣadaqa, et nous serons, assurément, du nombre des ṣāliḥīn. » Mais quand Il leur donna de Sa faveur, ils s''en montrèrent avares (bakhilū), et se détournèrent en se dérobant. Il fit donc succéder, dans leurs cœurs, un nifāq [qui durera] jusqu''au jour où ils Le rencontreront — parce qu''ils ont manqué à Allaah ce qu''ils Lui avaient promis, et parce qu''ils mentaient.'
- ref: S.9:78
  ar: أَلَمْ يَعْلَمُوا أَنَّ اللَّهَ يَعْلَمُ سِرَّهُمْ وَنَجْوَاهُمْ وَأَنَّ اللَّهَ عَلَّامُ الْغُيُوبِ
  trl: A-lam yaʿlamū anna llāha yaʿlamu sirrahum wa-najwāhum wa-anna llāha ʿallāmu l-ghuyūb
  trad: Ne savent-ils pas qu'Allaah connaît leur secret (sirr) et leurs conciliabules (najwā), et qu'Allaah connaît parfaitement (ʿallām) les ghuyūb (ce qui échappe à la perception) ?
- ref: S.9:79
  ar: الَّذِينَ يَلْمِزُونَ الْمُطَّوِّعِينَ مِنَ الْمُؤْمِنِينَ فِي الصَّدَقَاتِ وَالَّذِينَ لَا يَجِدُونَ إِلَّا جُهْدَهُمْ فَيَسْخَرُونَ مِنْهُمْ ۙ سَخِرَ اللَّهُ مِنْهُمْ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Alladhīna yalmizūna l-muṭṭawwiʿīna mina l-muʾminīna fi ṣ-ṣadaqāti wa-lladhīna lā yajidūna illā juhdahum fa-yaskharūna minhum — sakhira llāhu minhum wa-lahum ʿadhābun alīm
  trad: Ceux qui critiquent (yalmizūna) les muṭṭawwiʿūn parmi les muʾminūn au sujet des ṣadaqāt, ainsi que ceux qui ne trouvent que leur effort le plus modeste (juhdahum) à donner, et qui les tournent en dérision — Allaah les rend dérisoires à Son tour, et à eux un châtiment douloureux.
- ref: S.9:80
  ar: اسْتَغْفِرْ لَهُمْ أَوْ لَا تَسْتَغْفِرْ لَهُمْ إِنْ تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةً فَلَنْ يَغْفِرَ اللَّهُ لَهُمْ ۚ ذَٰلِكَ بِأَنَّهُمْ كَفَرُوا بِاللَّهِ وَرَسُولِهِ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ
  trl: Istaghfir lahum aw lā tastaghfir lahum in tastaghfir lahum sabʿīna marratan fa-lan yaghfira llāhu lahum — dhālika bi-annahum kafarū billāhi wa-rasūlihi — wa-llāhu lā yahdi l-qawma l-fāsiqīn
  trad: Que tu demandes pardon pour eux, ou que tu ne le demandes pas — même si tu demandais pardon pour eux soixante-dix fois, Allaah ne leur pardonnera jamais. Cela, parce qu'ils ont commis le kufr envers Allaah et Son rasūl. Allaah ne guide pas le peuple des fāsiqūn.
- ref: S.9:81–82
  ar: فَرِحَ الْمُخَلَّفُونَ بِمَقْعَدِهِمْ خِلَافَ رَسُولِ اللَّهِ وَكَرِهُوا أَنْ يُجَاهِدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ فِي سَبِيلِ اللَّهِ وَقَالُوا لَا تَنْفِرُوا فِي الْحَرِّ ۗ قُلْ نَارُ جَهَنَّمَ أَشَدُّ حَرًّا ۚ لَوْ كَانُوا يَفْقَهُونَ ۝ فَلْيَضْحَكُوا قَلِيلًا وَلْيَبْكُوا كَثِيرًا جَزَاءً بِمَا كَانُوا يَكْسِبُونَ
  trl: Fariḥa l-mukhallafūna bi-maqʿadihim khilāfa rasūli llāhi wa-karihū an yujāhidū bi-amwālihim wa-anfusihim fī sabīli llāhi wa-qālū lā tanfirū fi l-ḥarri — qul nāru jahannama ashaddu ḥarran law kānū yafqahūn — fa-l-yaḍḥakū qalīlan wa-l-yabkū kathīran jazāʾan bimā kānū yaksibūn
  trad: 'Ceux qui furent laissés en arrière (al-mukhallafūn) se sont réjouis de leur position assise, après (ou : en s''opposant à) le départ du rasūl d''Allaah, et ont rejeté (karihū) l''idée de lutter par leurs biens et eux-mêmes sur le sabīl d''Allaah, et ont dit : « Ne partez pas dans la chaleur (ḥarr). » Dis : « Le feu de Jahannam est plus intense encore en chaleur » — s''ils pouvaient seulement comprendre (yafqahūn). Qu''ils rient donc peu, et qu''ils pleurent beaucoup, en rétribution de ce qu''ils se sont acquis.'
- ref: S.9:83–84
  ar: فَإِنْ رَجَعَكَ اللَّهُ إِلَىٰ طَائِفَةٍ مِنْهُمْ فَاسْتَأْذَنُوكَ لِلْخُرُوجِ فَقُلْ لَنْ تَخْرُجُوا مَعِيَ أَبَدًا وَلَنْ تُقَاتِلُوا مَعِيَ عَدُوًّا ۖ إِنَّكُمْ رَضِيتُمْ بِالْقُعُودِ أَوَّلَ مَرَّةٍ فَاقْعُدُوا مَعَ الْخَالِفِينَ ۝ وَلَا تُصَلِّ عَلَىٰ أَحَدٍ مِنْهُمْ مَاتَ أَبَدًا وَلَا تَقُمْ عَلَىٰ قَبْرِهِ ۖ إِنَّهُمْ كَفَرُوا بِاللَّهِ وَرَسُولِهِ وَمَاتُوا وَهُمْ فَاسِقُونَ
  trl: Fa-in rajaʿaka llāhu ilā ṭāʾifatin minhum fa-staʾdhanūka li-l-khurūji fa-qul lan takhrujū maʿiya abadan wa-lan tuqātilū maʿiya ʿaduwwan — innakum raḍītum bi-l-quʿūdi awwala marratin fa-qʿudū maʿa l-khālifīn — wa-lā tuṣalli ʿalā aḥadin minhum māta abadan wa-lā taqum ʿalā qabrihi — innahum kafarū billāhi wa-rasūlihi wa-mātū wa-hum fāsiqūn
  trad: 'Si Allaah te ramène vers un groupe d''entre eux, et qu''ils te demandent permission de sortir [avec toi la fois suivante], dis : « Vous ne sortirez plus jamais avec moi, et vous ne combattrez plus jamais d''ennemi avec moi. Vous vous êtes satisfaits de rester assis la première fois — restez donc avec ceux qui restent en arrière (al-khālifīn). » Et ne prie (tuṣalli) jamais sur aucun d''entre eux qui meurt, et ne te tiens pas debout sur sa tombe (qabrihi) — ils ont commis le kufr envers Allaah et Son rasūl, et sont morts en étant fāsiqūn.'
- ref: S.9:85
  ar: وَلَا تُعْجِبْكَ أَمْوَالُهُمْ وَأَوْلَادُهُمْ ۚ إِنَّمَا يُرِيدُ اللَّهُ أَنْ يُعَذِّبَهُمْ بِهَا فِي الدُّنْيَا وَتَزْهَقَ أَنْفُسُهُمْ وَهُمْ كَافِرُونَ
  trl: Wa-lā tuʿjibka amwāluhum wa-awlāduhum — innamā yurīdu llāhu an yuʿadhdhibahum bihā fi d-dunyā wa-tazhaqa anfusuhum wa-hum kāfirūn
  trad: Que ne t'émerveillent donc ni leurs biens ni leurs enfants — Allaah ne veut que les châtier par eux dans ce bas monde, et que leurs nafs périssent (tazhaqa) alors qu'ils sont kāfirūn.
- ref: S.9:86–87
  ar: وَإِذَا أُنْزِلَتْ سُورَةٌ أَنْ آمِنُوا بِاللَّهِ وَجَاهِدُوا مَعَ رَسُولِهِ اسْتَأْذَنَكَ أُولُو الطَّوْلِ مِنْهُمْ وَقَالُوا ذَرْنَا نَكُنْ مَعَ الْقَاعِدِينَ ۝ رَضُوا بِأَنْ يَكُونُوا مَعَ الْخَوَالِفِ وَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ
  trl: Wa-idhā unzilat sūratun an āminū billāhi wa-jāhidū maʿa rasūlihi staʾdhanaka ulū ṭ-ṭawli minhum wa-qālū dharnā nakun maʿa l-qāʿidīn — raḍū bi-an yakūnū maʿa l-khawālifi wa-ṭubiʿa ʿalā qulūbihim fa-hum lā yafqahūn
  trad: 'Et quand une sourate descend [qui commande] : « Croyez en Allaah et luttez aux côtés de Son rasūl » — ceux d''entre eux qui ont les moyens (ulū ṭ-ṭawli) te demandent permission [de rester], et disent : « Laisse-nous, que nous soyons avec ceux qui restent assis. » Ils se sont satisfaits d''être avec ceux qui restent en arrière (al-khawālif), et un sceau a été posé sur leurs cœurs (ṭubiʿa), si bien qu''ils ne comprennent pas.'
- ref: S.9:88–89
  ar: لَٰكِنِ الرَّسُولُ وَالَّذِينَ آمَنُوا مَعَهُ جَاهَدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ ۚ وَأُولَٰئِكَ لَهُمُ الْخَيْرَاتُ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ ۝ أَعَدَّ اللَّهُ لَهُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا ۚ ذَٰلِكَ الْفَوْزُ الْعَظِيمُ
  trl: Lākini r-rasūlu wa-lladhīna āmanū maʿahu jāhadū bi-amwālihim wa-anfusihim — wa-ulāʾika lahumu l-khayrātu — wa-ulāʾika humu l-muflihūn — aʿadda llāhu lahum jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā — dhālika l-fawzu l-ʿaẓīm
  trad: Mais le rasūl et ceux qui ont cru avec lui ont lutté par leurs biens et eux-mêmes — ceux-là ont pour eux les khayrāt (les biens excellents), et ceux-là sont les muflihūn (ceux qui aboutissent, dans le bien). Allaah leur a préparé des jardins sous lesquels coulent les rivières, où ils demeureront — voilà le fawz immense.
- ref: S.9:90
  ar: وَجَاءَ الْمُعَذِّرُونَ مِنَ الْأَعْرَابِ لِيُؤْذَنَ لَهُمْ وَقَعَدَ الَّذِينَ كَذَبُوا اللَّهَ وَرَسُولَهُ ۚ سَيُصِيبُ الَّذِينَ كَفَرُوا مِنْهُمْ عَذَابٌ أَلِيمٌ
  trl: Wa-jāʾa l-muʿadhdhirūna mina l-aʿrābi li-yuʾdhana lahum wa-qaʿada lladhīna kadhabū llāha wa-rasūlahu — sa-yuṣību lladhīna kafarū minhum ʿadhābun alīm
  trad: Et les excuseurs (al-muʿadhdhirūn), parmi les aʿrāb, sont venus pour qu'on leur accorde permission [de rester] — et ceux qui ont menti à Allaah et à Son rasūl [n'ont même pas cherché à s'excuser :] ils sont restés assis. Un châtiment douloureux atteindra ceux d'entre eux qui ont commis le kufr.
- ref: S.9:91–92
  ar: لَيْسَ عَلَى الضُّعَفَاءِ وَلَا عَلَى الْمَرْضَىٰ وَلَا عَلَى الَّذِينَ لَا يَجِدُونَ مَا يُنْفِقُونَ حَرَجٌ إِذَا نَصَحُوا لِلَّهِ وَرَسُولِهِ ۚ مَا عَلَى الْمُحْسِنِينَ مِنْ سَبِيلٍ ۚ وَاللَّهُ غَفُورٌ رَحِيمٌ ۝ وَلَا عَلَى الَّذِينَ إِذَا مَا أَتَوْكَ لِتَحْمِلَهُمْ قُلْتَ لَا أَجِدُ مَا أَحْمِلُكُمْ عَلَيْهِ تَوَلَّوْا وَأَعْيُنُهُمْ تَفِيضُ مِنَ الدَّمْعِ حَزَنًا أَلَّا يَجِدُوا مَا يُنْفِقُونَ
  trl: Laysa ʿalā ḍ-ḍuʿafāʾi wa-lā ʿalā l-marḍā wa-lā ʿalā lladhīna lā yajidūna mā yunfiqūna ḥarajun idhā naṣaḥū lillāhi wa-rasūlihi — mā ʿalā l-muḥsinīna min sabīlin — wa-llāhu ghafūrun raḥīm — wa-lā ʿalā lladhīna idhā mā atawka li-taḥmilahum qulta lā ajidu mā aḥmilukum ʿalayhi tawallaw wa-aʿyunuhum tafīḍu mina d-damʿi ḥazanan allā yajidū mā yunfiqūn
  trad: 'Nulle gêne (ḥaraj) sur les faibles, ni sur les malades, ni sur ceux qui ne trouvent pas de quoi dépenser [pour la lutte] — s''ils sont sincères (naṣaḥū) envers Allaah et Son rasūl. Il n''y a, contre les muḥsinūn, aucune voie [de reproche] — Allaah est Ghafūr, Raḥīm. Ni sur ceux qui, venus vers toi pour que tu les transportes [au combat], et à qui tu as dit : « Je ne trouve pas de quoi vous transporter » — se sont détournés, les yeux débordant de larmes, affligés (ḥazanan) de ne pas trouver de quoi dépenser.'
- ref: S.9:93
  ar: ۞ إِنَّمَا السَّبِيلُ عَلَى الَّذِينَ يَسْتَأْذِنُونَكَ وَهُمْ أَغْنِيَاءُ ۚ رَضُوا بِأَنْ يَكُونُوا مَعَ الْخَوَالِفِ وَطَبَعَ اللَّهُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَعْلَمُونَ
  trl: Innamā s-sabīlu ʿalā lladhīna yastaʾdhinūnaka wa-hum aghniyāʾu — raḍū bi-an yakūnū maʿa l-khawālifi wa-ṭabaʿa llāhu ʿalā qulūbihim fa-hum lā yaʿlamūn
  trad: Le reproche (as-sabīl) ne porte que sur ceux qui te demandent permission [de rester] alors qu'ils sont riches (aghniyāʾ) — ils se sont satisfaits d'être avec ceux qui restent en arrière (al-khawālif), et Allaah a posé un sceau sur leurs cœurs (ṭabaʿa), si bien qu'ils ne savent pas.
- ref: S.9:94
  ar: يَعْتَذِرُونَ إِلَيْكُمْ إِذَا رَجَعْتُمْ إِلَيْهِمْ ۚ قُلْ لَا تَعْتَذِرُوا لَنْ نُؤْمِنَ لَكُمْ قَدْ نَبَّأَنَا اللَّهُ مِنْ أَخْبَارِكُمْ ۚ وَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ ثُمَّ تُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Yaʿtadhirūna ilaykum idhā rajaʿtum ilayhim — qul lā taʿtadhirū lan nuʾmina lakum qad nabbaʾanā llāhu min akhbārikum — wa-sayarā llāhu ʿamalakum wa-rasūluhu thumma turaddūna ilā ʿālimi l-ghaybi wa-sh-shahādati fa-yunabbiʾukum bi-mā kuntum taʿmalūn
  trad: 'Ils s''excusent auprès de vous, quand vous revenez vers eux. Dis : « Ne vous excusez pas — nous n''accorderons pas foi à votre parole (lan nuʾmina lakum) : Allaah nous a déjà informés de votre situation (min akhbārikum). Allaah va voir votre agir, et Son rasūl [le verra aussi] — puis vous serez ramenés vers Ce qui connaît le ghayb et le témoigné, et Il vous informera de ce que vous faisiez. »'
- ref: S.9:95–96
  ar: سَيَحْلِفُونَ بِاللَّهِ لَكُمْ إِذَا انْقَلَبْتُمْ إِلَيْهِمْ لِتُعْرِضُوا عَنْهُمْ ۖ فَأَعْرِضُوا عَنْهُمْ ۖ إِنَّهُمْ رِجْسٌ ۖ وَمَأْوَاهُمْ جَهَنَّمُ جَزَاءً بِمَا كَانُوا يَكْسِبُونَ ۝ يَحْلِفُونَ لَكُمْ لِتَرْضَوْا عَنْهُمْ ۖ فَإِنْ تَرْضَوْا عَنْهُمْ فَإِنَّ اللَّهَ لَا يَرْضَىٰ عَنِ الْقَوْمِ الْفَاسِقِينَ
  trl: Sa-yaḥlifūna billāhi lakum idhā nqalabtum ilayhim li-tuʿriḍū ʿanhum — fa-aʿriḍū ʿanhum — innahum rijsun — wa-maʾwāhum jahannamu jazāʾan bi-mā kānū yaksibūn — yaḥlifūna lakum li-tarḍaw ʿanhum — fa-in tarḍaw ʿanhum fa-inna llāha lā yarḍā ʿani l-qawmi l-fāsiqīn
  trad: 'Ils vont jurer par Allaah, devant vous, quand vous serez revenus vers eux, pour que vous vous détourniez d''eux — détournez-vous donc d''eux : ils sont un rijs (une souillure), et leur refuge (maʾwā) est Jahannam, en rétribution de ce qu''ils se sont acquis. Ils jurent devant vous pour que vous soyez satisfaits d''eux — mais même si vous étiez satisfaits d''eux, Allaah, Lui, n''est pas satisfait du peuple des fāsiqūn.'
- ref: S.9:97
  ar: الْأَعْرَابُ أَشَدُّ كُفْرًا وَنِفَاقًا وَأَجْدَرُ أَلَّا يَعْلَمُوا حُدُودَ مَا أَنْزَلَ اللَّهُ عَلَىٰ رَسُولِهِ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Al-aʿrābu ashaddu kufran wa-nifāqan wa-ajdaru allā yaʿlamū ḥudūda mā anzala llāhu ʿalā rasūlihi — wa-llāhu ʿalīmun ḥakīm
  trad: Les aʿrāb sont plus intenses en kufr et en nifāq, et plus portés (ajdaru) à ne pas connaître les limites (ḥudūd) de ce qu'Allaah a fait descendre sur Son rasūl. Allaah est ʿAlīm, Ḥakīm.
- ref: S.9:98
  ar: وَمِنَ الْأَعْرَابِ مَنْ يَتَّخِذُ مَا يُنْفِقُ مَغْرَمًا وَيَتَرَبَّصُ بِكُمُ الدَّوَائِرَ ۚ عَلَيْهِمْ دَائِرَةُ السَّوْءِ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Wa-mina l-aʿrābi man yattakhidhu mā yunfiqu maghraman wa-yatarabbaṣu bikumu d-dawāʾira — ʿalayhim dāʾiratu s-sawʾi — wa-llāhu samīʿun ʿalīm
  trad: Et parmi les aʿrāb, il en est qui considère ce qu'il dépense comme une perte forcée (maghraman), et qui attend, à votre sujet, les revers de fortune (ad-dawāʾir) — sur eux [retombera] le revers funeste (dāʾiratu s-sūʾ). Allaah est Samīʿ, ʿAlīm.
- ref: S.9:99
  ar: وَمِنَ الْأَعْرَابِ مَنْ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَيَتَّخِذُ مَا يُنْفِقُ قُرُبَاتٍ عِنْدَ اللَّهِ وَصَلَوَاتِ الرَّسُولِ ۚ أَلَا إِنَّهَا قُرْبَةٌ لَهُمْ ۚ سَيُدْخِلُهُمُ اللَّهُ فِي رَحْمَتِهِ ۗ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Wa-mina l-aʿrābi man yuʾminu billāhi wa-l-yawmi l-ākhiri wa-yattakhidhu mā yunfiqu qurubātin ʿinda llāhi wa-ṣalawāti r-rasūli — alā innahā qurbatun lahum — sa-yudkhiluhumu llāhu fī raḥmatihi — inna llāha ghafūrun raḥīm
  trad: Et parmi les aʿrāb, il en est qui croit en Allaah et au Jour Dernier, et qui considère ce qu'il dépense comme des rapprochements (qurubāt) auprès d'Allaah, et [une occasion] des invocations du rasūl (ṣalawāt ar-rasūl) — cela est, assurément, un rapprochement (qurba) pour eux. Allaah va les faire entrer dans Sa raḥma — Allaah est, assurément, Ghafūr, Raḥīm.
- ref: S.9:100
  ar: وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنْصَارِ وَالَّذِينَ اتَّبَعُوهُمْ بِإِحْسَانٍ رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ وَأَعَدَّ لَهُمْ جَنَّاتٍ تَجْرِي تَحْتَهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۚ ذَٰلِكَ الْفَوْزُ الْعَظِيمُ
  trl: Wa-s-sābiqūna l-awwalūna mina l-muhājirīna wa-l-anṣāri wa-lladhīna ttabaʿūhum bi-iḥsānin raḍiya llāhu ʿanhum wa-raḍū ʿanhu wa-aʿadda lahum jannātin tajrī taḥtahā l-anhāru khālidīna fīhā abadan — dhālika l-fawzu l-ʿaẓīm
  trad: Et les précédents, les premiers (as-sābiqūna l-awwalūn), parmi les Muhājirūn et les Anṣār, et ceux qui les ont suivis avec excellence (bi-iḥsān) — Allaah est satisfait d'eux, et ils sont satisfaits de Lui, et Il leur a préparé des jardins sous lesquels coulent les rivières, où ils demeureront pour toujours (abadan) — voilà le fawz immense.
- ref: S.9:101
  ar: وَمِمَّنْ حَوْلَكُمْ مِنَ الْأَعْرَابِ مُنَافِقُونَ ۖ وَمِنْ أَهْلِ الْمَدِينَةِ ۖ مَرَدُوا عَلَى النِّفَاقِ لَا تَعْلَمُهُمْ ۖ نَحْنُ نَعْلَمُهُمْ ۚ سَنُعَذِّبُهُمْ مَرَّتَيْنِ ثُمَّ يُرَدُّونَ إِلَىٰ عَذَابٍ عَظِيمٍ
  trl: Wa-mimman ḥawlakum mina l-aʿrābi munāfiqūna — wa-min ahli l-madīnati — maradū ʿalā n-nifāqi lā taʿlamuhum — naḥnu naʿlamuhum — sa-nuʿadhdhibuhum marratayni thumma yuraddūna ilā ʿadhābin ʿaẓīm
  trad: 'Et parmi ceux qui vous entourent, parmi les aʿrāb, il y a des munāfiqūn — et parmi les gens de Médine [aussi] : ils se sont endurcis dans le nifāq — tu ne les connais pas, Nous, Nous les connaissons. Nous les châtierons deux fois, puis ils seront ramenés vers un châtiment immense.'
- ref: S.9:102
  ar: وَآخَرُونَ اعْتَرَفُوا بِذُنُوبِهِمْ خَلَطُوا عَمَلًا صَالِحًا وَآخَرَ سَيِّئًا عَسَى اللَّهُ أَنْ يَتُوبَ عَلَيْهِمْ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Wa-ākharūna ʿtarafū bi-dhunūbihim khalaṭū ʿamalan ṣāliḥan wa-ākhara sayyiʾan ʿasā llāhu an yatūba ʿalayhim — inna llāha ghafūrun raḥīm
  trad: Et d'autres ont reconnu (iʿtarafū) leurs fautes, ayant mêlé (khalaṭū) une action ṣāliḥa à une autre mauvaise (sayyiʾan) — il se peut (ʿasā) qu'Allaah accueille leur retour — Allaah est, assurément, Ghafūr, Raḥīm.
- ref: S.9:103
  ar: خُذْ مِنْ أَمْوَالِهِمْ صَدَقَةً تُطَهِّرُهُمْ وَتُزَكِّيهِمْ بِهَا وَصَلِّ عَلَيْهِمْ ۖ إِنَّ صَلَاتَكَ سَكَنٌ لَهُمْ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Khudh min amwālihim ṣadaqatan tuṭahhiruhum wa-tuzakkīhim bihā wa-ṣalli ʿalayhim — inna ṣalātaka sakanun lahum — wa-llāhu samīʿun ʿalīm
  trad: Prends, de leurs biens, une ṣadaqa qui les purifie (tuṭahhiruhum) et les élève (tuzakkīhim) par elle, et invoque pour eux (ṣalli ʿalayhim) — ton invocation (ṣalātaka) est un apaisement (sakan) pour eux. Allaah est Samīʿ, ʿAlīm.
- ref: S.9:104
  ar: أَلَمْ يَعْلَمُوا أَنَّ اللَّهَ هُوَ يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَأْخُذُ الصَّدَقَاتِ وَأَنَّ اللَّهَ هُوَ التَّوَّابُ الرَّحِيمُ
  trl: A-lam yaʿlamū anna llāha huwa yaqbalu t-tawbata ʿan ʿibādihi wa-yaʾkhudhu ṣ-ṣadaqāti wa-anna llāha huwa t-tawwābu r-raḥīm
  trad: Ne savent-ils pas qu'Allaah — Lui-même — accueille la tawba de Ses ʿibād, et prend les ṣadaqāt, et qu'Allaah est, Lui, at-Tawwāb, ar-Raḥīm ?
- ref: S.9:105
  ar: وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ ۖ وَسَتُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Wa-quli ʿmalū fa-sayarā llāhu ʿamalakum wa-rasūluhu wa-l-muʾminūna — wa-saturaddūna ilā ʿālimi l-ghaybi wa-sh-shahādati fa-yunabbiʾukum bi-mā kuntum taʿmalūn
  trad: 'Et dis : « Agissez — Allaah va voir votre agir, ainsi que Son rasūl et les muʾminūn — puis vous serez ramenés vers Ce qui connaît le ghayb et le témoigné, et Il vous informera de ce que vous faisiez. »'
- ref: S.9:106
  ar: وَآخَرُونَ مُرْجَوْنَ لِأَمْرِ اللَّهِ إِمَّا يُعَذِّبُهُمْ وَإِمَّا يَتُوبُ عَلَيْهِمْ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Wa-ākharūna murjawna li-amri llāhi immā yuʿadhdhibuhum wa-immā yatūbu ʿalayhim — wa-llāhu ʿalīmun ḥakīm
  trad: Et d'autres sont laissés en suspens (murjawn), [dans l'attente] de l'ordre (amr) d'Allaah — soit Il les châtiera, soit Il accueillera leur retour. Allaah est ʿAlīm, Ḥakīm.
- ref: S.9:107
  ar: وَالَّذِينَ اتَّخَذُوا مَسْجِدًا ضِرَارًا وَكُفْرًا وَتَفْرِيقًا بَيْنَ الْمُؤْمِنِينَ وَإِرْصَادًا لِمَنْ حَارَبَ اللَّهَ وَرَسُولَهُ مِنْ قَبْلُ ۚ وَلَيَحْلِفُنَّ إِنْ أَرَدْنَا إِلَّا الْحُسْنَىٰ ۖ وَاللَّهُ يَشْهَدُ إِنَّهُمْ لَكَاذِبُونَ
  trl: Wa-lladhīna ttakhadhū masjidan ḍirāran wa-kufran wa-tafrīqan bayna l-muʾminīna wa-irṣādan li-man ḥāraba llāha wa-rasūlahu min qablu — wa-la-yaḥlifunna in aradnā illā l-ḥusnā — wa-llāhu yashhadu innahum la-kādhibūn
  trad: 'Et ceux qui ont pris pour eux une masjid par nuisance (ḍirāran), par kufr, par division (tafrīqan) entre les muʾminūn, et comme poste d''attente (irṣādan) pour qui a fait la guerre à Allaah et à Son rasūl auparavant — et ils jureront, assurément : « Nous ne voulions que le bien (al-ḥusnā). » Allaah témoigne qu''ils sont, assurément, des menteurs.'
- ref: S.9:108
  ar: لَا تَقُمْ فِيهِ أَبَدًا ۚ لَمَسْجِدٌ أُسِّسَ عَلَى التَّقْوَىٰ مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَنْ تَقُومَ فِيهِ ۚ فِيهِ رِجَالٌ يُحِبُّونَ أَنْ يَتَطَهَّرُوا ۚ وَاللَّهُ يُحِبُّ الْمُطَّهِّرِينَ
  trl: Lā taqum fīhi abadan — la-masjidun ussisa ʿalā t-taqwā min awwali yawmin aḥaqqu an taqūma fīhi — fīhi rijālun yuḥibbūna an yataṭahharū — wa-llāhu yuḥibbu l-muṭahharīn
  trad: Ne t'y tiens jamais debout. Une masjid fondée (ussisa) sur la taqwā depuis le premier jour est plus digne (aḥaqqu) que tu t'y tiennes debout. On y trouve des hommes qui aiment se purifier (yataṭahharū) — et Allaah honore (yuḥibbu) ceux qui se purifient (al-muṭahharīn).
- ref: S.9:109
  ar: أَفَمَنْ أَسَّسَ بُنْيَانَهُ عَلَىٰ تَقْوَىٰ مِنَ اللَّهِ وَرِضْوَانٍ خَيْرٌ أَمْ مَنْ أَسَّسَ بُنْيَانَهُ عَلَىٰ شَفَا جُرُفٍ هَارٍ فَانْهَارَ بِهِ فِي نَارِ جَهَنَّمَ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ
  trl: A-fa-man assasa bunyānahu ʿalā taqwā mina llāhi wa-riḍwānin khayrun am man assasa bunyānahu ʿalā shafā jurufin hārin fa-nhāra bihi fī nāri jahannama — wa-llāhu lā yahdi l-qawma ẕ-ẕālimīn
  trad: Celui qui a fondé son édifice (bunyānahu) sur une taqwā venant d'Allaah et un riḍwān, est-il meilleur — ou celui qui a fondé son édifice sur le bord (shafā) d'une falaise crevassée et menaçant de s'effondrer (jurufin hārin), si bien qu'elle s'effondre avec lui (fa-nhāra bihi) dans le feu de Jahannam ? Allaah ne guide pas le peuple des ẕālimīn (ceux qui commettent le ẕulm).
- ref: S.9:110
  ar: لَا يَزَالُ بُنْيَانُهُمُ الَّذِي بَنَوْا رِيبَةً فِي قُلُوبِهِمْ إِلَّا أَنْ تَقَطَّعَ قُلُوبُهُمْ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Lā yazālu bunyānuhumu lladhī banaw rībatan fī qulūbihim illā an taqaṭṭaʿa qulūbuhum — wa-llāhu ʿalīmun ḥakīm
  trad: Leur édifice, qu'ils ont construit, ne cesse d'être un doute (rība) dans leurs cœurs — à moins que leurs cœurs ne se disloquent (taqaṭṭaʿa). Allaah est ʿAlīm, Ḥakīm.
- ref: S.9:111
  ar: ۞ إِنَّ اللَّهَ اشْتَرَىٰ مِنَ الْمُؤْمِنِينَ أَنْفُسَهُمْ وَأَمْوَالَهُمْ بِأَنَّ لَهُمُ الْجَنَّةَ ۚ يُقَاتِلُونَ فِي سَبِيلِ اللَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ ۖ وَعْدًا عَلَيْهِ حَقًّا فِي التَّوْرَاةِ وَالْإِنْجِيلِ وَالْقُرْآنِ ۚ وَمَنْ أَوْفَىٰ بِعَهْدِهِ مِنَ اللَّهِ ۚ فَاسْتَبْشِرُوا بِبَيْعِكُمُ الَّذِي بَايَعْتُمْ بِهِ ۚ وَذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ
  trl: Inna llāha shtarā mina l-muʾminīna anfusahum wa-amwālahum bi-anna lahumu l-jannata — yuqātilūna fī sabīli llāhi fa-yaqtulūna wa-yuqtalūna — waʿdan ʿalayhi ḥaqqan fi t-tawrāti wa-l-injīli wa-l-qurʾāni — wa-man awfā bi-ʿahdihi mina llāhi — fa-stabshirū bi-bayʿikumu lladhī bāyaʿtum bihi — wa-dhālika huwa l-fawzu l-ʿaẓīm
  trad: 'Allaah a acheté (ishtarā) aux muʾminūn leurs propres personnes et leurs biens, moyennant que la Janna leur revienne : ils combattent dans le sabīl d''Allaah, tuent et sont tués — un engagement dont Il répond (waʿdan ʿalayhi), véridique, [inscrit] dans la Tawrāh, l''Injīl et le Qurʾān. Et qui donc tient mieux son engagement (awfā bi-ʿahdihi) qu''Allaah ? Réjouissez-vous donc de ce marché (bayʿikum) que vous avez conclu — voilà le fawz immense.'
- ref: S.9:112
  ar: التَّائِبُونَ الْعَابِدُونَ الْحَامِدُونَ السَّائِحُونَ الرَّاكِعُونَ السَّاجِدُونَ الْآمِرُونَ بِالْمَعْرُوفِ وَالنَّاهُونَ عَنِ الْمُنْكَرِ وَالْحَافِظُونَ لِحُدُودِ اللَّهِ ۗ وَبَشِّرِ الْمُؤْمِنِينَ
  trl: At-tāʾibūna l-ʿābidūna l-ḥāmidūna s-sāʾiḥūna r-rākiʿūna s-sājidūna l-āmirūna bi-l-maʿrūfi wa-n-nāhūna ʿani l-munkari wa-l-ḥāfiẓūna li-ḥudūdi llāhi — wa-bashshiri l-muʾminīn
  trad: Ceux qui reviennent sans cesse (at-tāʾibūn), ceux qui adorent (al-ʿābidūn), ceux qui louent (al-ḥāmidūn), ceux qui parcourent (as-sāʾiḥūn), ceux qui s'inclinent (ar-rākiʿūn), ceux qui se prosternent (as-sājidūn), ceux qui ordonnent le maʿrūf et interdisent le munkar, ceux qui gardent les limites (ḥudūd) d'Allaah — annonce une bonne nouvelle aux muʾminūn.
- ref: S.9:113
  ar: مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ آمَنُوا أَنْ يَسْتَغْفِرُوا لِلْمُشْرِكِينَ وَلَوْ كَانُوا أُولِي قُرْبَىٰ مِنْ بَعْدِ مَا تَبَيَّنَ لَهُمْ أَنَّهُمْ أَصْحَابُ الْجَحِيمِ
  trl: Mā kāna li-n-nabiyyi wa-lladhīna āmanū an yastaghfirū li-l-mushrikīna wa-law kānū ulī qurbā min baʿdi mā tabayyana lahum annahum aṣḥābu l-jaḥīm
  trad: Il n'appartenait pas au nabī, ni à ceux qui ont cru, de demander pardon (yastaghfirū) pour les mushrikūn, fussent-ils de proche parenté (ulī qurbā), une fois qu'il leur est devenu clair (tabayyana) que ceux-ci sont les compagnons du Feu ardent (al-jaḥīm).
- ref: S.9:114
  ar: وَمَا كَانَ اسْتِغْفَارُ إِبْرَاهِيمَ لِأَبِيهِ إِلَّا عَنْ مَوْعِدَةٍ وَعَدَهَا إِيَّاهُ فَلَمَّا تَبَيَّنَ لَهُ أَنَّهُ عَدُوٌّ لِلَّهِ تَبَرَّأَ مِنْهُ ۚ إِنَّ إِبْرَاهِيمَ لَأَوَّاهٌ حَلِيمٌ
  trl: Wa-mā kāna stighfāru ibrāhīma li-abīhi illā ʿan mawʿidatin waʿadahā iyyāhu fa-lammā tabayyana lahu annahu ʿaduwwun lillāhi tabarraʾa minhu — inna ibrāhīma la-awwāhun ḥalīm
  trad: Et la demande de pardon (istighfār) d'Ibrāhīm pour son père ne fut due qu'à une promesse (mawʿida) qu'il lui avait faite — mais lorsqu'il lui devint clair que celui-ci était un ennemi d'Allaah, il s'en désavoua (tabarraʾa). Ibrāhīm était certes plein de soupirs suppliants (la-awwāhun), longanime (ḥalīm).
- ref: S.9:115
  ar: وَمَا كَانَ اللَّهُ لِيُضِلَّ قَوْمًا بَعْدَ إِذْ هَدَاهُمْ حَتَّىٰ يُبَيِّنَ لَهُمْ مَا يَتَّقُونَ ۚ إِنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Wa-mā kāna llāhu li-yuḍilla qawman baʿda idh hadāhum ḥattā yubayyina lahum mā yattaqūna — inna llāha bi-kulli shayʾin ʿalīm
  trad: Et il n'appartenait pas à Allaah d'égarer un peuple après l'avoir guidé, avant de leur avoir rendu clair (yubayyina) ce dont ils doivent se prémunir (yattaqūn). Allaah est, de toute chose, pleinement informé (ʿalīm).
- ref: S.9:116
  ar: إِنَّ اللَّهَ لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۖ يُحْيِي وَيُمِيتُ ۚ وَمَا لَكُمْ مِنْ دُونِ اللَّهِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ
  trl: Inna llāha lahu mulku s-samāwāti wa-l-arḍi — yuḥyī wa-yumītu — wa-mā lakum min dūni llāhi min waliyyin wa-lā naṣīr
  trad: À Allaah appartient la royauté (mulk) des cieux et de la terre — Il fait vivre et fait mourir — et vous n'avez, en dehors d'Allaah, ni protecteur (walī) ni secoureur (naṣīr).
- ref: S.9:117
  ar: لَقَدْ تَابَ اللَّهُ عَلَى النَّبِيِّ وَالْمُهَاجِرِينَ وَالْأَنْصَارِ الَّذِينَ اتَّبَعُوهُ فِي سَاعَةِ الْعُسْرَةِ مِنْ بَعْدِ مَا كَادَ يَزِيغُ قُلُوبُ فَرِيقٍ مِنْهُمْ ثُمَّ تَابَ عَلَيْهِمْ ۚ إِنَّهُ بِهِمْ رَءُوفٌ رَحِيمٌ
  trl: La-qad tāba llāhu ʿalā n-nabiyyi wa-l-muhājirīna wa-l-anṣāri lladhīna ttabaʿūhu fī sāʿati l-ʿusrati min baʿdi mā kāda yazīghu qulūbu farīqin minhum thumma tāba ʿalayhim — innahu bihim raʾūfun raḥīm
  trad: 'Allaah a certes accueilli le retour (tāba) du nabī, des Muhājirūn et des Anṣār qui l''ont suivi à l''heure de la difficulté (sāʿat al-ʿusra), après que le cœur d''une partie d''entre eux avait failli dévier (kāda yazīghu) — puis Il a accueilli leur retour : Il est, envers eux, Raʾūf, Raḥīm.'
- ref: S.9:118
  ar: وَعَلَى الثَّلَاثَةِ الَّذِينَ خُلِّفُوا حَتَّىٰ إِذَا ضَاقَتْ عَلَيْهِمُ الْأَرْضُ بِمَا رَحُبَتْ وَضَاقَتْ عَلَيْهِمْ أَنْفُسُهُمْ وَظَنُّوا أَنْ لَا مَلْجَأَ مِنَ اللَّهِ إِلَّا إِلَيْهِ ثُمَّ تَابَ عَلَيْهِمْ لِيَتُوبُوا ۚ إِنَّ اللَّهَ هُوَ التَّوَّابُ الرَّحِيمُ
  trl: Wa-ʿalā th-thalāthati lladhīna khullifū ḥattā idhā ḍāqat ʿalayhimu l-arḍu bimā raḥubat wa-ḍāqat ʿalayhim anfusuhum wa-ẓannū an lā maljaʾa mina llāhi illā ilayhi thumma tāba ʿalayhim li-yatūbū — inna llāha huwa t-tawwābu r-raḥīm
  trad: 'Et [Il a accueilli aussi le retour] des trois dont le cas fut différé (khullifū) — au point que la terre, malgré son étendue, leur devint étroite, que leurs propres personnes leur devinrent étroites, et qu''ils surent, d''une certitude sans faille, qu''il n''est de refuge (maljaʾ) contre Allaah qu''auprès de Lui — puis Il a accueilli leur retour, pour qu''ils reviennent [à Lui] : Allaah, Lui, est at-Tawwāb, ar-Raḥīm.'
- ref: S.9:119
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ
  trl: Yā ayyuhā lladhīna āmanū ttaqū llāha wa-kūnū maʿa ṣ-ṣādiqīn
  trad: Ô vous qui croyez, prémunissez-vous (ittaqū) d'Allaah, et soyez avec les véridiques (aṣ-ṣādiqīn).
- ref: S.9:120
  ar: مَا كَانَ لِأَهْلِ الْمَدِينَةِ وَمَنْ حَوْلَهُمْ مِنَ الْأَعْرَابِ أَنْ يَتَخَلَّفُوا عَنْ رَسُولِ اللَّهِ وَلَا يَرْغَبُوا بِأَنْفُسِهِمْ عَنْ نَفْسِهِ ۚ ذَٰلِكَ بِأَنَّهُمْ لَا يُصِيبُهُمْ ظَمَأٌ وَلَا نَصَبٌ وَلَا مَخْمَصَةٌ فِي سَبِيلِ اللَّهِ وَلَا يَطَئُونَ مَوْطِئًا يَغِيظُ الْكُفَّارَ وَلَا يَنَالُونَ مِنْ عَدُوٍّ نَيْلًا إِلَّا كُتِبَ لَهُمْ بِهِ عَمَلٌ صَالِحٌ ۚ إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ
  trl: Mā kāna li-ahli l-madīnati wa-man ḥawlahum mina l-aʿrābi an yatakhallafū ʿan rasūli llāhi wa-lā yarghabū bi-anfusihim ʿan nafsihi — dhālika bi-annahum lā yuṣībuhum ẓamaʾun wa-lā naṣabun wa-lā makhmaṣatun fī sabīli llāhi wa-lā yaṭaʾūna mawṭiʾan yaghīẓu l-kuffāra wa-lā yanālūna min ʿaduwwin naylan illā kutiba lahum bihi ʿamalun ṣāliḥun — inna llāha lā yuḍīʿu ajra l-muḥsinīn
  trad: Il n'appartenait pas aux gens de Médine, ni aux aʿrāb qui les entourent, de rester en arrière du rasūl d'Allaah (an yatakhallafū), ni de préférer leurs propres personnes à la sienne — car nulle soif (ẓamaʾ), nulle fatigue (naṣab), nulle faim (makhmaṣa) ne les atteint dans le sabīl d'Allaah, et ils ne posent aucun pas qui irrite les kuffār, et n'infligent à un ennemi aucune atteinte, sans que cela ne leur soit inscrit comme une œuvre saine (ʿamal ṣāliḥ) — Allaah ne laisse pas se perdre la récompense (ajr) des muḥsinūn.
- ref: S.9:121
  ar: وَلَا يُنْفِقُونَ نَفَقَةً صَغِيرَةً وَلَا كَبِيرَةً وَلَا يَقْطَعُونَ وَادِيًا إِلَّا كُتِبَ لَهُمْ لِيَجْزِيَهُمُ اللَّهُ أَحْسَنَ مَا كَانُوا يَعْمَلُونَ
  trl: Wa-lā yunfiqūna nafaqatan ṣaghīratan wa-lā kabīratan wa-lā yaqṭaʿūna wādiyan illā kutiba lahum li-yajziyahumu llāhu aḥsana mā kānū yaʿmalūn
  trad: Et ils ne font aucune dépense, petite ou grande, ni ne traversent une vallée, sans que cela ne leur soit inscrit — afin qu'Allaah les rétribue mieux que ce qu'ils faisaient.
- ref: S.9:122
  ar: ۞ وَمَا كَانَ الْمُؤْمِنُونَ لِيَنْفِرُوا كَافَّةً ۚ فَلَوْلَا نَفَرَ مِنْ كُلِّ فِرْقَةٍ مِنْهُمْ طَائِفَةٌ لِيَتَفَقَّهُوا فِي الدِّينِ وَلِيُنْذِرُوا قَوْمَهُمْ إِذَا رَجَعُوا إِلَيْهِمْ لَعَلَّهُمْ يَحْذَرُونَ
  trl: Wa-mā kāna l-muʾminūna li-yanfirū kāffatan — fa-law-lā nafara min kulli firqatin minhum ṭāʾifatun li-yatafaqqahū fi d-dīni wa-li-yundhirū qawmahum idhā rajaʿū ilayhim laʿallahum yaḥdharūn
  trad: Et il n'appartenait pas aux muʾminūn de sortir tous ensemble (kāffatan) — que ne se détache donc, de chaque groupe d'entre eux, une partie (ṭāʾifa), pour approfondir leur science du dīn (yatafaqqahū) et avertir leur peuple à leur retour — peut-être se prémuniront-ils (yaḥdharūn).
- ref: S.9:123
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا قَاتِلُوا الَّذِينَ يَلُونَكُمْ مِنَ الْكُفَّارِ وَلْيَجِدُوا فِيكُمْ غِلْظَةً ۚ وَاعْلَمُوا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ
  trl: Yā ayyuhā lladhīna āmanū qātilū lladhīna yalūnakum mina l-kuffāri wa-l-yajidū fīkum ghilẓatan — wa-ʿlamū anna llāha maʿa l-muttaqīn
  trad: Ô vous qui croyez, combattez ceux des kuffār qui sont proches de vous (yalūnakum), et qu'ils trouvent en vous de la rudesse (ghilẓa) — et sachez qu'Allaah est avec les muttaqīn.
- ref: S.9:124
  ar: وَإِذَا مَا أُنْزِلَتْ سُورَةٌ فَمِنْهُمْ مَنْ يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا ۚ فَأَمَّا الَّذِينَ آمَنُوا فَزَادَتْهُمْ إِيمَانًا وَهُمْ يَسْتَبْشِرُونَ
  trl: Wa-idhā mā unzilat sūratun fa-minhum man yaqūlu ayyukum zādathu hādhihi īmānan — fa-ammā lladhīna āmanū fa-zādathum īmānan wa-hum yastabshirūn
  trad: 'Et lorsqu''une sourate est descendue, il en est parmi eux qui dit : « Lequel d''entre vous cela a-t-il augmenté en foi ? » — quant à ceux qui ont cru, cela les augmente en foi, et ils s''en réjouissent (yastabshirūn).'
- ref: S.9:125
  ar: وَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ فَزَادَتْهُمْ رِجْسًا إِلَىٰ رِجْسِهِمْ وَمَاتُوا وَهُمْ كَافِرُونَ
  trl: Wa-ammā lladhīna fī qulūbihim maraḍun fa-zādathum rijsan ilā rijsihim wa-mātū wa-hum kāfirūn
  trad: Quant à ceux dont le cœur porte une maladie (maraḍ), cela ajoute une souillure (rijs) à leur souillure, et ils meurent alors qu'ils sont kāfirūn.
- ref: S.9:126
  ar: أَوَلَا يَرَوْنَ أَنَّهُمْ يُفْتَنُونَ فِي كُلِّ عَامٍ مَرَّةً أَوْ مَرَّتَيْنِ ثُمَّ لَا يَتُوبُونَ وَلَا هُمْ يَذَّكَّرُونَ
  trl: A-wa-lā yarawna annahum yuftanūna fī kulli ʿāmin marratan aw marratayni thumma lā yatūbūna wa-lā hum yadhdhakkarūn
  trad: Ne voient-ils donc pas qu'ils sont éprouvés (yuftanūna) chaque année, une fois ou deux ? Puis ils ne reviennent pas (lā yatūbūn) et ne se rappellent pas (lā yadhdhakkarūn).
- ref: S.9:127
  ar: وَإِذَا مَا أُنْزِلَتْ سُورَةٌ نَظَرَ بَعْضُهُمْ إِلَىٰ بَعْضٍ هَلْ يَرَاكُمْ مِنْ أَحَدٍ ثُمَّ انْصَرَفُوا ۚ صَرَفَ اللَّهُ قُلُوبَهُمْ بِأَنَّهُمْ قَوْمٌ لَا يَفْقَهُونَ
  trl: Wa-idhā mā unzilat sūratun naẓara baʿḍuhum ilā baʿḍin hal yarākum min aḥadin thumma nṣarafū — ṣarafa llāhu qulūbahum bi-annahum qawmun lā yafqahūn
  trad: 'Et lorsqu''une sourate est descendue, ils se regardent les uns les autres : « Quelqu''un vous voit-il ? » — puis ils se détournent (inṣarafū). Allaah a détourné (ṣarafa) leurs cœurs, parce que ce sont des gens qui ne saisissent pas (lā yafqahūn).'
- ref: S.9:128
  ar: لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ
  trl: La-qad jāʾakum rasūlun min anfusikum ʿazīzun ʿalayhi mā ʿanittum ḥarīṣun ʿalaykum bi-l-muʾminīna raʾūfun raḥīm
  trad: 'Un rasūl vous est certes venu, issu de vous-mêmes (min anfusikum) : il lui est pénible (ʿazīzun ʿalayhi) ce qui vous accable, il est ardemment soucieux de vous (ḥarīṣun ʿalaykum), et envers les muʾminūn plein de sollicitude et de compassion (raʾūfun raḥīm).'
- ref: S.9:129
  ar: فَإِنْ تَوَلَّوْا فَقُلْ حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ
  trl: Fa-in tawallaw fa-qul ḥasbiya llāhu lā ilāha illā huwa — ʿalayhi tawakkaltu — wa-huwa rabbu l-ʿarshi l-ʿaẓīm
  trad: 'S''ils se détournent, dis alors : « Allaah me suffit (ḥasbiya llāh) — nul ilāh que Lui — sur Lui je m''en remets (tawakkaltu) — et c''est Lui le Rabb du ʿArsh immense. »'
