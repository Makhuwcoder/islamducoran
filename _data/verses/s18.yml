- ref: S.18:1
  ar: الْحَمْدُ لِلَّهِ الَّذِي أَنْزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَلْ لَهُ عِوَجًا ۜ
  trl: Al-ḥamdu lillāhi lladhī anzala ʿalā ʿabdihi l-kitāba wa-lam yajʿal lahu ʿiwajā
  trad: La ḥamd est à Allaah, Ce qui a fait descendre sur Son ʿabd le Kitāb, et n'y a placé aucun détour (ʿiwaj).
- ref: S.18:2–3
  ar: قَيِّمًا لِيُنْذِرَ بَأْسًا شَدِيدًا مِنْ لَدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا ۝ مَاكِثِينَ فِيهِ أَبَدًا
  trl: Qayyiman li-yundhira baʾsan shadīdan min ladunhu wa-yubashshira l-muʾminīna lladhīna yaʿmalūna ṣ-ṣāliḥāti anna lahum ajran ḥasanā — mākithīna fīhi abadā
  trad: '[Il l''a rendu] droit et rectificateur (qayyimā), pour avertir d''une rigueur sévère (baʾs) venant directement de Lui (min ladunhu), et pour annoncer aux muʾminūn qui accomplissent les œuvres droites (aṣ-ṣāliḥāt) qu''il y a pour eux une belle rétribution (ajr), où ils demeureront (mākithīn) éternellement.'
- ref: S.18:4–5
  ar: وَيُنْذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا ۝ مَا لَهُمْ بِهِ مِنْ عِلْمٍ وَلَا لِآبَائِهِمْ ۚ كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ أَفْوَاهِهِمْ ۚ إِنْ يَقُولُونَ إِلَّا كَذِبًا
  trl: Wa-yundhira lladhīna qālū ttakhadha llāhu waladā — mā lahum bihi min ʿilmin wa-lā li-ābāʾihim kaburat kalimatan takhruju min afwāhihim in yaqūlūna illā kadhibā
  trad: 'Et pour avertir ceux qui ont dit : « Allaah a pris un enfant (walad) » — ils n''en ont aucune connaissance (ʿilm), ni leurs pères (ābāʾ) avant eux. Combien est énorme, comme parole (kalima), ce qui sort de leurs bouches (afwāhihim) ! Ils ne disent rien d''autre qu''un mensonge (kadhib).'
- ref: S.18:6
  ar: فَلَعَلَّكَ بَاخِعٌ نَفْسَكَ عَلَىٰ آثَارِهِمْ إِنْ لَمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا
  trl: Fa-laʿallaka bākhiʿun nafsaka ʿalā āthārihim in lam yuʾminū bi-hādhā l-ḥadīthi asafā
  trad: Peut-être vas-tu te consumer toi-même (bākhiʿun nafsaka), sur leurs traces (āthārihim), de chagrin (asaf), s'ils ne croient pas en ce récit (al-ḥadīth).
- ref: S.18:7–8
  ar: إِنَّا جَعَلْنَا مَا عَلَى الْأَرْضِ زِينَةً لَهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا ۝ وَإِنَّا لَجَاعِلُونَ مَا عَلَيْهَا صَعِيدًا جُرُزًا
  trl: Innā jaʿalnā mā ʿala l-arḏi zīnatan lahā li-nabluwahum ayyuhum aḥsanu ʿamalā — wa-innā la-jāʿilūna mā ʿalayhā ṣaʿīdan juruzā
  trad: Nous avons fait de ce qui est sur la terre un ornement (zīna) pour elle, afin de les éprouver (li-nabluwahum), [et de savoir] lequel d'entre eux est le meilleur en œuvre (ʿamal) — et Nous ferons certainement de ce qui s'y trouve une surface (ṣaʿīd) nue et aride (juruz).
- ref: S.18:9
  ar: أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ آيَاتِنَا عَجَبًا
  trl: Am ḥasibta anna aṣḥāba l-kahfi wa-r-raqīmi kānū min āyātinā ʿajabā
  trad: Ou bien as-tu estimé (ḥasibta) que les compagnons (aṣḥāb) de la Caverne (al-kahf) et d'ar-Raqīm étaient, parmi Nos āyāt, un prodige étonnant (ʿajab) ?
- ref: S.18:10
  ar: إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا
  trl: Idh awa l-fityatu ila l-kahfi fa-qālū rabbanā ātinā min ladunka raḥmatan wa-hayyiʾ lanā min amrinā rashadā
  trad: 'Quand les jeunes gens (al-fitya) se réfugièrent (awā) dans la Caverne, et dirent : « Notre Rabb, donne-nous, de Ta part (min ladunka), une raḥma, et arrange pour nous, dans notre affaire (amr), une rectitude de conduite (rashad). »'
- ref: S.18:11–12
  ar: فَضَرَبْنَا عَلَىٰ آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا ۝ ثُمَّ بَعَثْنَاهُمْ لِنَعْلَمَ أَيُّ الْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوا أَمَدًا
  trl: Fa-ḍarabnā ʿalā ādhānihim fi l-kahfi sinīna ʿadadā — thumma baʿathnāhum li-naʿlama ayyu l-ḥizbayni aḥṣā li-mā labithū amadā
  trad: Nous avons alors mis un voile sur leurs oreilles (ḍarabnā ʿalā ādhānihim), dans la Caverne, pour un nombre d'années compté (sinīna ʿadadā) — puis Nous les avons réveillés (baʿathnāhum), pour faire apparaître lequel des deux groupes (al-ḥizbayn) évaluerait le mieux (aḥṣā) la durée (amad) de leur séjour.
- ref: S.18:13
  ar: نَحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُمْ بِالْحَقِّ ۚ إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى
  trl: Naḥnu naquṣṣu ʿalayka nabaʾahum bi-l-ḥaqqi innahum fityatun āmanū bi-rabbihim wa-zidnāhum hudā
  trad: Nous te racontons (naquṣṣu) leur récit (nabaʾ) par le ḥaqq — ce sont des jeunes gens qui ont cru en leur Rabb, et Nous leur avons ajouté une guidance (hudā).
- ref: S.18:14–15
  ar: وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا فَقَالُوا رَبُّنَا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ لَنْ نَدْعُوَ مِنْ دُونِهِ إِلَٰهًا ۖ لَقَدْ قُلْنَا إِذًا شَطَطًا ۝ هَٰؤُلَاءِ قَوْمُنَا اتَّخَذُوا مِنْ دُونِهِ آلِهَةً ۖ لَوْلَا يَأْتُونَ عَلَيْهِمْ بِسُلْطَانٍ بَيِّنٍ ۖ فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا
  trl: Wa-rabaṭnā ʿalā qulūbihim idh qāmū fa-qālū rabbunā rabbu s-samāwāti wa-l-arḏi lan nadʿuwa min dūnihi ilāhan la-qad qulnā idhan shaṭaṭā — hāʾulāʾi qawmunā ttakhadhū min dūnihi ālihatan lawlā yaʾtūna ʿalayhim bi-sulṭānin bayyinin fa-man aẓlamu mimmani ftarā ʿala llāhi kadhibā
  trad: 'Et Nous avons affermi (rabaṭnā) leurs cœurs, quand ils se levèrent et dirent : « Notre Rabb est le Rabb des cieux et de la terre — jamais nous n''invoquerons, en dehors de Lui, un ilāh ; nous aurions alors assurément prononcé une parole excessive et injuste (shaṭaṭ). Ceux-ci, notre peuple, ont pris, en dehors de Lui, des āliha — que ne produisent-ils, à leur sujet, une preuve manifeste (sulṭān bayyin) ? Qui donc est plus injuste que celui qui forge un mensonge contre Allaah ? »'
- ref: S.18:16
  ar: وَإِذِ اعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا اللَّهَ فَأْوُوا إِلَى الْكَهْفِ يَنْشُرْ لَكُمْ رَبُّكُمْ مِنْ رَحْمَتِهِ وَيُهَيِّئْ لَكُمْ مِنْ أَمْرِكُمْ مِرْفَقًا
  trl: Wa-idhi ʿtazaltumūhum wa-mā yaʿbudūna illā llāha fa-ʾwū ila l-kahfi yanshur lakum rabbukum min raḥmatihi wa-yuhayyiʾ lakum min amrikum mirfaqā
  trad: '« Et puisque vous vous êtes séparés (iʿtazaltum) d''eux et de ce qu''ils adorent en dehors d''Allaah, réfugiez-vous donc dans la Caverne : votre Rabb déploiera (yanshur) pour vous, de Sa raḥma, et arrangera pour vous, dans votre affaire (amr), un soutien favorable (mirfaq). »'
- ref: S.18:17
  ar: ۞ وَتَرَى الشَّمْسَ إِذَا طَلَعَتْ تَزَاوَرُ عَنْ كَهْفِهِمْ ذَاتَ الْيَمِينِ وَإِذَا غَرَبَتْ تَقْرِضُهُمْ ذَاتَ الشِّمَالِ وَهُمْ فِي فَجْوَةٍ مِنْهُ ۚ ذَٰلِكَ مِنْ آيَاتِ اللَّهِ ۗ مَنْ يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ ۖ وَمَنْ يُضْلِلْ فَلَنْ تَجِدَ لَهُ وَلِيًّا مُرْشِدًا
  trl: Wa-tara sh-shamsa idhā ṭalaʿat tazāwaru ʿan kahfihim dhāta l-yamīni wa-idhā gharabat taqriḍuhum dhāta sh-shimāli wa-hum fī fajwatin minhu dhālika min āyāti llāhi man yahdi llāhu fa-huwa l-muhtadi wa-man yuḍlil fa-lan tajida lahu waliyyan murshidā
  trad: 'Et tu aurais vu le soleil, quand il se lève, s''écarter (tazāwaru) de leur Caverne vers la droite, et quand il se couche, les délaisser (taqriḍuhum) vers la gauche, tandis qu''eux se trouvaient dans un espace ouvert (fajwa) de celle-ci. Cela fait partie des āyāt d''Allaah : quiconque Allaah guide, celui-là est bien guidé (al-muhtad) ; et quiconque Il égare, tu ne trouveras pour lui aucun walī qui guide (murshid).'
- ref: S.18:18
  ar: وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ ۚ وَنُقَلِّبُهُمْ ذَاتَ الْيَمِينِ وَذَاتَ الشِّمَالِ ۖ وَكَلْبُهُمْ بَاسِطٌ ذِرَاعَيْهِ بِالْوَصِيدِ ۚ لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا
  trl: Wa-taḥsabuhum ayqāẓan wa-hum ruqūdun wa-nuqallibuhum dhāta l-yamīni wa-dhāta sh-shimāli wa-kalbuhum bāsiṭun dhirāʿayhi bi-l-waṣīdi lawi ṭṭalaʿta ʿalayhim la-wallayta minhum firāran wa-la-muliʾta minhum ruʿbā
  trad: Et tu les aurais estimés éveillés (ayqāẓ), alors qu'ils étaient endormis (ruqūd) ; et Nous les retournions (nuqallibuhum) vers la droite et vers la gauche, tandis que leur chien (kalb) avait les deux pattes avant étendues (bāsiṭun dhirāʿayhi) sur le seuil (al-waṣīd). Si tu les avais aperçus, tu leur aurais tourné le dos en fuyant, et tu aurais été rempli d'épouvante (ruʿb) à cause d'eux.
- ref: S.18:19
  ar: وَكَذَٰلِكَ بَعَثْنَاهُمْ لِيَتَسَاءَلُوا بَيْنَهُمْ ۚ قَالَ قَائِلٌ مِنْهُمْ كَمْ لَبِثْتُمْ ۖ قَالُوا لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍ ۚ قَالُوا رَبُّكُمْ أَعْلَمُ بِمَا لَبِثْتُمْ فَابْعَثُوا أَحَدَكُمْ بِوَرِقِكُمْ هَٰذِهِ إِلَى الْمَدِينَةِ فَلْيَنْظُرْ أَيُّهَا أَزْكَىٰ طَعَامًا فَلْيَأْتِكُمْ بِرِزْقٍ مِنْهُ وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ أَحَدًا
  trl: Wa-kadhālika baʿathnāhum li-yatasāʾalū baynahum qāla qāʾilun minhum kam labithtum qālū labithnā yawman aw baʿḏa yawmin qālū rabbukum aʿlamu bi-mā labithtum fa-bʿathū aḥadakum bi-wariqikum hādhihi ila l-madīnati fa-l-yanẓur ayyuhā azkā ṭaʿāman fa-l-yaʾtikum bi-rizqin minhu wa-l-yatalaṭṭaf wa-lā yushʿiranna bikum aḥadā
  trad: 'Et c''est ainsi que Nous les avons réveillés, pour qu''ils s''interrogent entre eux. L''un d''eux dit : « Combien de temps êtes-vous restés ? » Ils dirent : « Nous sommes restés un jour, ou une partie d''un jour. » Ils dirent [encore] : « Votre Rabb sait mieux combien de temps vous êtes restés — envoyez donc l''un de vous, avec cette pièce d''argent (wariq) que voici, à la cité (al-madīna) ; qu''il regarde laquelle de ses nourritures est la plus pure (azkā), et qu''il vous en apporte une provision (rizq) ; qu''il agisse avec délicatesse (yatalaṭṭaf), et qu''il ne fasse en aucun cas remarquer votre présence à quiconque. »'
- ref: S.18:20
  ar: إِنَّهُمْ إِنْ يَظْهَرُوا عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِي مِلَّتِهِمْ وَلَنْ تُفْلِحُوا إِذًا أَبَدًا
  trl: Innahum in yaẓharū ʿalaykum yarjumūkum aw yuʿīdūkum fī millatihim wa-lan tufliḥū idhan abadā
  trad: « Car s'ils vous découvrent (yaẓharū ʿalaykum), ils vous lapideront (yarjumūkum), ou vous feront revenir dans leur milla — et alors, vous ne réussirez (tufliḥū) plus jamais. »
- ref: S.18:21
  ar: وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوا أَنَّ وَعْدَ اللَّهِ حَقٌّ وَأَنَّ السَّاعَةَ لَا رَيْبَ فِيهَا إِذْ يَتَنَازَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا ابْنُوا عَلَيْهِمْ بُنْيَانًا ۖ رَبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ الَّذِينَ غَلَبُوا عَلَىٰ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِمْ مَسْجِدًا
  trl: Wa-kadhālika aʿtharnā ʿalayhim li-yaʿlamū anna waʿda llāhi ḥaqqun wa-anna s-sāʿata lā rayba fīhā idh yatanāzaʿūna baynahum amrahum fa-qālu bnū ʿalayhim bunyānan rabbuhum aʿlamu bihim qāla lladhīna ghalabū ʿalā amrihim la-nattakhidhanna ʿalayhim masjidā
  trad: 'Et c''est ainsi que Nous avons fait connaître leur découverte (aʿtharnā ʿalayhim), afin qu''ils sachent que la promesse d''Allaah est vraie (ḥaqq), et que l''Heure — nul doute n''a de place à son sujet. [Ce fut] quand ils se disputaient (yatanāzaʿūna) entre eux à leur sujet : certains dirent : « Bâtissez sur eux un édifice (bunyān) » — leur Rabb les connaît mieux — ceux qui l''emportèrent (ghalabū) dans cette affaire dirent : « Nous prendrons assurément sur eux un masjid. »'
- ref: S.18:22
  ar: سَيَقُولُونَ ثَلَاثَةٌ رَابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌ سَادِسُهُمْ كَلْبُهُمْ رَجْمًا بِالْغَيْبِ ۖ وَيَقُولُونَ سَبْعَةٌ وَثَامِنُهُمْ كَلْبُهُمْ ۚ قُلْ رَبِّي أَعْلَمُ بِعِدَّتِهِمْ مَا يَعْلَمُهُمْ إِلَّا قَلِيلٌ ۗ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَاءً ظَاهِرًا وَلَا تَسْتَفْتِ فِيهِمْ مِنْهُمْ أَحَدًا
  trl: Sa-yaqūlūna thalāthatun rābiʿuhum kalbuhum wa-yaqūlūna khamsatun sādisuhum kalbuhum rajman bi-l-ghaybi wa-yaqūlūna sabʿatun wa-thāminuhum kalbuhum qul rabbī aʿlamu bi-ʿiddatihim mā yaʿlamuhum illā qalīlun fa-lā tumāri fīhim illā mirāʾan ẓāhiran wa-lā tastafti fīhim minhum aḥadā
  trad: 'Ils diront : « Trois, leur quatrième étant leur chien » ; et ils diront : « Cinq, leur sixième étant leur chien » — conjecture à l''aveugle sur l''invisible (rajman bi-l-ghayb) ; et ils diront : « Sept, et leur huitième était leur chien. » Dis : « Mon Rabb connaît mieux leur nombre (ʿidda) ; ne les connaissent qu''un petit nombre. » N''engage donc, à leur sujet, qu''une discussion superficielle (mirāʾan ẓāhirā), et ne consulte personne d''entre eux à leur sujet (lā tastafti).'
- ref: S.18:23–24
  ar: وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَٰلِكَ غَدًا ۝ إِلَّا أَنْ يَشَاءَ اللَّهُ ۚ وَاذْكُرْ رَبَّكَ إِذَا نَسِيتَ وَقُلْ عَسَىٰ أَنْ يَهْدِيَنِ رَبِّي لِأَقْرَبَ مِنْ هَٰذَا رَشَدًا
  trl: Wa-lā taqūlanna li-shayʾin innī fāʿilun dhālika ghadā — illā an yashāʾa llāhu wa-dhkur rabbaka idhā nasīta wa-qul ʿasā an yahdiyani rabbī li-aqraba min hādhā rashadā
  trad: 'Et ne dis jamais, à propos d''une chose : « Je ferai cela demain », sans [ajouter] : « à moins qu''Allaah ne le veuille » — et invoque ton Rabb quand tu l''as oublié [de le dire], et dis : « Il se peut que mon Rabb me guide vers plus proche que ceci en rectitude (rashad). »'
- ref: S.18:25
  ar: وَلَبِثُوا فِي كَهْفِهِمْ ثَلَاثَ مِائَةٍ سِنِينَ وَازْدَادُوا تِسْعًا
  trl: Wa-labithū fī kahfihim thalātha miʾatin sinīna wa-zdādū tisʿā
  trad: Et ils demeurèrent dans leur Caverne trois cents ans, et y ajoutèrent neuf [années].
- ref: S.18:26
  ar: قُلِ اللَّهُ أَعْلَمُ بِمَا لَبِثُوا ۖ لَهُ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ ۖ أَبْصِرْ بِهِ وَأَسْمِعْ ۚ مَا لَهُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلَا يُشْرِكُ فِي حُكْمِهِ أَحَدًا
  trl: Quli llāhu aʿlamu bi-mā labithū lahu ghaybu s-samāwāti wa-l-arḏi abṣir bihi wa-asmiʿ mā lahum min dūnihi min waliyyin wa-lā yushriku fī ḥukmihi aḥadā
  trad: 'Dis : « Allaah sait mieux combien de temps ils sont demeurés — à Lui appartient le ghayb des cieux et de la terre. Comme Il voit ! Comme Il entend ! » Ils n''ont, en dehors de Lui, aucun walī, et Il n''associe personne à Son jugement (ḥukm).'
- ref: S.18:27
  ar: وَاتْلُ مَا أُوحِيَ إِلَيْكَ مِنْ كِتَابِ رَبِّكَ ۖ لَا مُبَدِّلَ لِكَلِمَاتِهِ وَلَنْ تَجِدَ مِنْ دُونِهِ مُلْتَحَدًا
  trl: Wa-tlu mā ūḥiya ilayka min kitābi rabbika lā mubaddila li-kalimātihi wa-lan tajida min dūnihi multaḥadā
  trad: Et récite (utlu) ce qui t'a été révélé (ūḥiya) du Kitāb de ton Rabb — nul ne peut changer (mubaddil) Ses paroles (kalimāt) — et tu ne trouveras, en dehors de Lui, aucun refuge (multaḥad).
- ref: S.18:28
  ar: وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُمْ بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا ۖ وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَنْ ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا
  trl: Wa-ṣbir nafsaka maʿa lladhīna yadʿūna rabbahum bi-l-ghadāti wa-l-ʿashiyyi yurīdūna wajhahu wa-lā taʿdu ʿaynāka ʿanhum turīdu zīnata l-ḥayāti d-dunyā wa-lā tuṭiʿ man aghfalnā qalbahu ʿan dhikrinā wa-ttabaʿa hawāhu wa-kāna amruhu furuṭā
  trad: Et endure-toi (iṣbir nafsaka) avec ceux qui invoquent leur Rabb, matin (ghadāt) et soir (ʿashiyy), ne visant que Lui-même (yurīdūna wajhahu) — et ne détourne pas tes yeux d'eux, recherchant l'ornement (zīna) de la vie d'ici-bas — et n'obéis pas à celui dont Nous avons rendu le cœur négligent (aghfalnā qalbahu) de Notre rappel (dhikr), qui a suivi son désir propre (hawā), et dont l'affaire est démesure (furuṭ).
- ref: S.18:29
  ar: وَقُلِ الْحَقُّ مِنْ رَبِّكُمْ ۖ فَمَنْ شَاءَ فَلْيُؤْمِنْ وَمَنْ شَاءَ فَلْيَكْفُرْ ۚ إِنَّا أَعْتَدْنَا لِلظَّالِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا ۚ وَإِنْ يَسْتَغِيثُوا يُغَاثُوا بِمَاءٍ كَالْمُهْلِ يَشْوِي الْوُجُوهَ ۚ بِئْسَ الشَّرَابُ وَسَاءَتْ مُرْتَفَقًا
  trl: Wa-quli l-ḥaqqu min rabbikum fa-man shāʾa fa-l-yuʾmin wa-man shāʾa fa-l-yakfur innā aʿtadnā li-ẓ-ẓālimīna nāran aḥāṭa bihim surādiquhā wa-in yastaghīthū yughāthū bi-māʾin ka-l-muhli yashwi l-wujūha biʾsa sh-sharābu wa-sāʾat murtafaqā
  trad: 'Et dis : « Al-ḥaqq vient de votre Rabb — quiconque veut, qu''il croie ; quiconque veut, qu''il mécroie. » Nous avons préparé, pour les ẓālimūn, un Feu dont les tentures (surādiq) les cernent de toutes parts. Et s''ils appellent au secours, ils seront secourus par une eau semblable au métal en fusion (al-muhl), qui brûle les visages. Quelle détestable boisson ! Quel mauvais lieu de repos (murtafaq) !'
- ref: S.18:30–31
  ar: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا أُولَٰئِكَ لَهُمْ جَنَّاتُ عَدْنٍ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ يُحَلَّوْنَ فِيهَا مِنْ أَسَاوِرَ مِنْ ذَهَبٍ وَيَلْبَسُونَ ثِيَابًا خُضْرًا مِنْ سُنْدُسٍ وَإِسْتَبْرَقٍ مُتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ ۚ نِعْمَ الثَّوَابُ وَحَسُنَتْ مُرْتَفَقًا
  trl: Inna lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti innā lā nuḍīʿu ajra man aḥsana ʿamalā — ulāʾika lahum jannātu ʿadnin tajrī min taḥtihimu l-anhāru yuḥallawna fīhā min asāwira min dhahabin wa-yalbasūna thiyāban khuḍran min sundusin wa-istabraqin muttakiʾīna fīhā ʿala l-arāʾiki niʿma th-thawābu wa-ḥasunat murtafaqā
  trad: Ceux qui ont cru et accompli les œuvres droites (ṣāliḥāt) — Nous ne laissons pas perdre la récompense (ajr) de qui agit bien — ceux-là ont les jardins d'Eden (jannātu ʿadn), sous eux coulent les rivières ; ils y sont parés de bracelets d'or, vêtus d'habits verts de soie fine (sundus) et de brocart épais (istabraq), accoudés sur des divans (arāʾik). Quelle bonne récompense ! Quel bon lieu de repos !
- ref: S.18:32
  ar: ۞ وَاضْرِبْ لَهُمْ مَثَلًا رَجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنْ أَعْنَابٍ وَحَفَفْنَاهُمَا بِنَخْلٍ وَجَعَلْنَا بَيْنَهُمَا زَرْعًا
  trl: Wa-ḍrib lahum mathalan rajulayni jaʿalnā li-aḥadihimā jannatayni min aʿnābin wa-ḥafafnāhumā bi-nakhlin wa-jaʿalnā baynahumā zarʿā
  trad: 'Et donne-leur en exemple (mathal) deux hommes : à l''un d''eux Nous avons donné deux jardins de vignes (aʿnāb), que Nous avons entourés de palmiers (nakhl), et entre lesquels Nous avons placé des cultures (zarʿ).'
- ref: S.18:33
  ar: كِلْتَا الْجَنَّتَيْنِ آتَتْ أُكُلَهَا وَلَمْ تَظْلِمْ مِنْهُ شَيْئًا ۚ وَفَجَّرْنَا خِلَالَهُمَا نَهَرًا
  trl: Kilta l-jannatayni ātat ukulahā wa-lam taẓlim minhu shayʾan wa-fajjarnā khilālahumā naharā
  trad: Chacun des deux jardins donna sa récolte (ukul) sans en rien retrancher (lam taẓlim minhu shayʾā), et Nous fîmes jaillir entre eux (khilālahumā) une rivière.
- ref: S.18:34
  ar: وَكَانَ لَهُ ثَمَرٌ فَقَالَ لِصَاحِبِهِ وَهُوَ يُحَاوِرُهُ أَنَا أَكْثَرُ مِنْكَ مَالًا وَأَعَزُّ نَفَرًا
  trl: Wa-kāna lahu thamarun fa-qāla li-ṣāḥibihi wa-huwa yuḥāwiruhu anā aktharu minka mālan wa-aʿazzu nafarā
  trad: 'Il eut des fruits (thamar), et dit à son compagnon (ṣāḥib), tout en dialoguant avec lui (yuḥāwiruhu) : « Je suis plus riche que toi en biens, et plus fort en hommes (nafar). »'
- ref: S.18:35–36
  ar: وَدَخَلَ جَنَّتَهُ وَهُوَ ظَالِمٌ لِنَفْسِهِ قَالَ مَا أَظُنُّ أَنْ تَبِيدَ هَٰذِهِ أَبَدًا ۝ وَمَا أَظُنُّ السَّاعَةَ قَائِمَةً وَلَئِنْ رُدِدْتُ إِلَىٰ رَبِّي لَأَجِدَنَّ خَيْرًا مِنْهَا مُنْقَلَبًا
  trl: Wa-dakhala jannatahu wa-huwa ẓālimun li-nafsihi qāla mā aẓunnu an tabīda hādhihi abadā — wa-mā aẓunnu s-sāʿata qāʾimatan wa-la-in rudidtu ilā rabbī la-ajidanna khayran minhā munqalabā
  trad: 'Et il entra dans son jardin, injuste envers lui-même (ẓālimun li-nafsihi), disant : « Je ne pense pas que ceci périsse (tabīda) jamais — et je ne pense pas que l''Heure soit établie ; et même si je suis ramené à mon Rabb, je trouverai assurément meilleur que cela comme retour (munqalab). »'
- ref: S.18:37
  ar: قَالَ لَهُ صَاحِبُهُ وَهُوَ يُحَاوِرُهُ أَكَفَرْتَ بِالَّذِي خَلَقَكَ مِنْ تُرَابٍ ثُمَّ مِنْ نُطْفَةٍ ثُمَّ سَوَّاكَ رَجُلًا
  trl: Qāla lahu ṣāḥibuhu wa-huwa yuḥāwiruhu a-kafarta bi-lladhī khalaqaka min turābin thumma min nuṭfatin thumma sawwāka rajulā
  trad: 'Son compagnon lui dit, tout en dialoguant avec lui : « As-tu mécru en Ce qui t''a créé de terre (turāb), puis d''une goutte [germinale] (nuṭfa), puis t''a façonné (sawwāka) en homme ?'
- ref: S.18:38
  ar: لَٰكِنَّا هُوَ اللَّهُ رَبِّي وَلَا أُشْرِكُ بِرَبِّي أَحَدًا
  trl: Lākinnā huwa llāhu rabbī wa-lā ushriku bi-rabbī aḥadā
  trad: Mais quant à moi, c'est Allaah, mon Rabb, et je n'associe personne à mon Rabb.
- ref: S.18:39–41
  ar: وَلَوْلَا إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ ۚ إِنْ تَرَنِ أَنَا أَقَلَّ مِنْكَ مَالًا وَوَلَدًا فَعَسَىٰ رَبِّي أَنْ يُؤْتِيَنِ خَيْرًا مِنْ جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًا مِنَ السَّمَاءِ فَتُصْبِحَ صَعِيدًا زَلَقًا أَوْ يُصْبِحَ مَاؤُهَا غَوْرًا فَلَنْ تَسْتَطِيعَ لَهُ طَلَبًا
  trl: Wa-lawlā idh dakhalta jannataka qulta mā shāʾa llāhu lā quwwata illā billāhi in tarani anā aqalla minka mālan wa-waladā — fa-ʿasā rabbī an yuʾtiyani khayran min jannatika wa-yursila ʿalayhā ḥusbānan mina s-samāʾi fa-tuṣbiḥa ṣaʿīdan zalaqā — aw yuṣbiḥa māʾuhā ghawran fa-lan tastaṭīʿa lahu ṭalabā
  trad: 'Pourquoi, quand tu es entré dans ton jardin, n''as-tu pas dit : « Ce qu''Allaah a voulu (mā shāʾa llāh) ! Nulle force sinon par Allaah (lā quwwata illā billāh) ! » Si tu me vois moins riche que toi en biens et en enfants (walad), il se peut que mon Rabb me donne meilleur que ton jardin, et envoie sur lui un calcul (ḥusbān) venu du ciel, de sorte qu''il devienne une surface glissante (ṣaʿīd zalaq) — ou que son eau s''enfonce (ghawr), et tu ne pourras alors la rechercher (ṭalab).'
- ref: S.18:42
  ar: وَأُحِيطَ بِثَمَرِهِ فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلَىٰ مَا أَنْفَقَ فِيهَا وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَا لَيْتَنِي لَمْ أُشْرِكْ بِرَبِّي أَحَدًا
  trl: Wa-uḥīṭa bi-thamarihi fa-aṣbaḥa yuqallibu kaffayhi ʿalā mā anfaqa fīhā wa-hiya khāwiyatun ʿalā ʿurūshihā wa-yaqūlu yā laytanī lam ushrik bi-rabbī aḥadā
  trad: 'Et ses fruits (thamar) furent détruits (uḥīṭa bi-thamarihi), et il se mit à retourner ses paumes (yuqallibu kaffayhi) sur ce qu''il y avait dépensé, tandis qu''elle était effondrée sur ses treillis (ʿurūsh), disant : « Si seulement je n''avais associé personne à mon Rabb ! »'
- ref: S.18:43
  ar: وَلَمْ تَكُنْ لَهُ فِئَةٌ يَنْصُرُونَهُ مِنْ دُونِ اللَّهِ وَمَا كَانَ مُنْتَصِرًا
  trl: Wa-lam takun lahu fiʾatun yanṣurūnahu min dūni llāhi wa-mā kāna muntaṣirā
  trad: Et il n'eut aucun groupe (fiʾa) pour le secourir en dehors d'Allaah, et il ne fut pas secouru lui-même (muntaṣir).
- ref: S.18:44
  ar: هُنَالِكَ الْوَلَايَةُ لِلَّهِ الْحَقِّ ۚ هُوَ خَيْرٌ ثَوَابًا وَخَيْرٌ عُقْبًا
  trl: Hunālika l-walāyatu lillāhi l-ḥaqqi huwa khayrun thawāban wa-khayrun ʿuqbā
  trad: En cela, la walāya appartient à Allaah, al-Ḥaqq — Il est meilleur en récompense (thawāb), et meilleur en issue (ʿuqbā).
- ref: S.18:45
  ar: وَاضْرِبْ لَهُمْ مَثَلَ الْحَيَاةِ الدُّنْيَا كَمَاءٍ أَنْزَلْنَاهُ مِنَ السَّمَاءِ فَاخْتَلَطَ بِهِ نَبَاتُ الْأَرْضِ فَأَصْبَحَ هَشِيمًا تَذْرُوهُ الرِّيَاحُ ۗ وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُقْتَدِرًا
  trl: Wa-ḍrib lahum mathala l-ḥayāti d-dunyā ka-māʾin anzalnāhu mina s-samāʾi fa-khtalaṭa bihi nabātu l-arḍi fa-aṣbaḥa hashīman tadhrūhu r-riyāḥu wa-kāna llāhu ʿalā kulli shayʾin muqtadirā
  trad: 'Et donne-leur en exemple la vie d''ici-bas : comme une eau que Nous avons fait descendre du ciel, à laquelle se mêle la végétation de la terre, puis elle devient des débris épars (hashīm) que dispersent les vents. Et Allaah est, sur toute chose, Muqtadir.'
- ref: S.18:46
  ar: الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا ۖ وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِنْدَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا
  trl: Al-mālu wa-l-banūna zīnatu l-ḥayāti d-dunyā wa-l-bāqiyātu ṣ-ṣāliḥātu khayrun ʿinda rabbika thawāban wa-khayrun amalā
  trad: Les biens et les fils sont l'ornement (zīna) de la vie d'ici-bas ; mais ce qui demeure (al-bāqiyāt) des œuvres droites (ṣāliḥāt) est meilleur, auprès de ton Rabb, en récompense, et meilleur en espérance (amal).
- ref: S.18:47
  ar: وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْأَرْضَ بَارِزَةً وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا
  trl: Wa-yawma nusayyiru l-jibāla wa-tara l-arḍa bārizatan wa-ḥasharnāhum fa-lam nughādir minhum aḥadā
  trad: Et le jour où Nous ferons marcher les montagnes, et tu verras la terre apparente (bāriza) ; Nous les aurons rassemblés, sans en laisser échapper aucun.
- ref: S.18:48
  ar: وَعُرِضُوا عَلَىٰ رَبِّكَ صَفًّا لَقَدْ جِئْتُمُونَا كَمَا خَلَقْنَاكُمْ أَوَّلَ مَرَّةٍ ۚ بَلْ زَعَمْتُمْ أَلَّنْ نَجْعَلَ لَكُمْ مَوْعِدًا
  trl: Wa-ʿuriḍū ʿalā rabbika ṣaffan la-qad jiʾtumūnā kamā khalaqnākum awwala marratin bal zaʿamtum allan najʿala lakum mawʿidā
  trad: 'Et ils seront présentés devant ton Rabb en rangs (ṣaff) : « Vous voici venus à Nous comme Nous vous avons créés la première fois ; mais vous prétendiez que Nous ne fixerions jamais pour vous de rendez-vous (mawʿid). »'
- ref: S.18:49
  ar: وَوُضِعَ الْكِتَابُ فَتَرَى الْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِ وَيَقُولُونَ يَا وَيْلَتَنَا مَالِ هَٰذَا الْكِتَابِ لَا يُغَادِرُ صَغِيرَةً وَلَا كَبِيرَةً إِلَّا أَحْصَاهَا ۚ وَوَجَدُوا مَا عَمِلُوا حَاضِرًا ۗ وَلَا يَظْلِمُ رَبُّكَ أَحَدًا
  trl: Wa-wuḍiʿa l-kitābu fa-tara l-mujrimīna mushfiqīna mimmā fīhi wa-yaqūlūna yā waylatanā māli hādhā l-kitābi lā yughādiru ṣaghīratan wa-lā kabīratan illā aḥṣāhā wa-wajadū mā ʿamilū ḥāḍiran wa-lā yaẓlimu rabbuka aḥadā
  trad: 'Et le Kitāb sera déposé ; tu verras les coupables (mujrimūn) craintifs (mushfiqīn) de ce qui s''y trouve, disant : « Malheur à nous ! Qu''a donc ce Kitāb, il ne laisse échapper ni petite ni grande chose sans les avoir comptées (aḥṣāhā) ! » Et ils trouveront présent ce qu''ils ont fait ; et ton Rabb ne fait de tort à personne.'
- ref: S.18:50
  ar: وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كَانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ ۗ أَفَتَتَّخِذُونَهُ وَذُرِّيَّتَهُ أَوْلِيَاءَ مِنْ دُونِي وَهُمْ لَكُمْ عَدُوٌّ ۚ بِئْسَ لِلظَّالِمِينَ بَدَلًا
  trl: Wa-idh qulnā li-l-malāʾikati sjudū li-ādama fa-sajadū illā iblīsa kāna mina l-jinni fa-fasaqa ʿan amri rabbihi a-fa-tattakhidhūnahu wa-dhurriyyatahu awliyāʾa min dūnī wa-hum lakum ʿaduwwun biʾsa li-ẓ-ẓālimīna badalā
  trad: 'Et [rappelle] quand Nous avons dit aux malāʾika : « Prosternez-vous devant Ādam » — ils se prosternèrent, sauf Iblīs : il était du jinn, et il s''écarta (fasaqa) de l''ordre de son Rabb. Allez-vous donc le prendre, lui et sa descendance (dhurriyya), pour walī en dehors de Moi, alors qu''ils sont pour vous un ennemi ? Quel mauvais échange (badal) pour les ẓālimūn !'
- ref: S.18:51
  ar: ۞ مَا أَشْهَدْتُهُمْ خَلْقَ السَّمَاوَاتِ وَالْأَرْضِ وَلَا خَلْقَ أَنْفُسِهِمْ وَمَا كُنْتُ مُتَّخِذَ الْمُضِلِّينَ عَضُدًا
  trl: Mā ashhadtuhum khalqa s-samāwāti wa-l-arḍi wa-lā khalqa anfusihim wa-mā kuntu muttakhidha l-muḍillīna ʿaḍudā
  trad: Je ne les ai pas fait témoins (mā ashhadtuhum) de la création des cieux et de la terre, ni de leur propre création ; et Je n'ai jamais pris comme soutien (ʿaḍud) ceux qui égarent (muḍillīn).
- ref: S.18:52–53
  ar: وَيَوْمَ يَقُولُ نَادُوا شُرَكَائِيَ الَّذِينَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا لَهُمْ وَجَعَلْنَا بَيْنَهُمْ مَوْبِقًا وَرَأَى الْمُجْرِمُونَ النَّارَ فَظَنُّوا أَنَّهُمْ مُوَاقِعُوهَا وَلَمْ يَجِدُوا عَنْهَا مَصْرِفًا
  trl: Wa-yawma yaqūlu nādū shurakāʾiya lladhīna zaʿamtum fa-daʿawhum fa-lam yastajībū lahum wa-jaʿalnā baynahum mawbiqā — wa-raʾa l-mujrimūna n-nāra fa-ẓannū annahum muwāqiʿūhā wa-lam yajidū ʿanhā maṣrifā
  trad: 'Et le jour où Il dira : « Appelez Mes associés (shurakāʾ) que vous prétendiez [exister] » — ils les appelleront, mais ceux-ci ne leur répondront pas ; et Nous placerons entre eux un abîme de perdition (mawbiq). Et les coupables verront le Feu, et sauront qu''ils vont y tomber (muwāqiʿūhā), sans trouver d''échappatoire (maṣrif).'
- ref: S.18:54
  ar: وَلَقَدْ صَرَّفْنَا فِي هَٰذَا الْقُرْآنِ لِلنَّاسِ مِنْ كُلِّ مَثَلٍ ۚ وَكَانَ الْإِنْسَانُ أَكْثَرَ شَيْءٍ جَدَلًا
  trl: Wa-la-qad ṣarrafnā fī hādha l-qurʾāni li-n-nāsi min kulli mathalin wa-kāna l-insānu akthara shayʾin jadalā
  trad: Et Nous avons diversifié (ṣarrafnā), dans ce Qurʾān, pour les gens, toute sorte d'exemple (mathal) ; mais l'humain est la plus disputeuse (jadal) des choses.
- ref: S.18:55
  ar: وَمَا مَنَعَ النَّاسَ أَنْ يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ وَيَسْتَغْفِرُوا رَبَّهُمْ إِلَّا أَنْ تَأْتِيَهُمْ سُنَّةُ الْأَوَّلِينَ أَوْ يَأْتِيَهُمُ الْعَذَابُ قُبُلًا
  trl: Wa-mā manaʿa n-nāsa an yuʾminū idh jāʾahumu l-hudā wa-yastaghfirū rabbahum illā an taʾtiyahum sunnatu l-awwalīna aw yaʾtiyahumu l-ʿadhābu qubulā
  trad: Et rien n'a empêché les gens de croire, quand la guidance (hudā) leur est venue, et de demander pardon à leur Rabb, si ce n'est qu'ils attendent que leur arrive la sunna des premiers (al-awwalīn), ou que leur vienne le châtiment en face (qubul).
- ref: S.18:56
  ar: وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنْذِرِينَ ۚ وَيُجَادِلُ الَّذِينَ كَفَرُوا بِالْبَاطِلِ لِيُدْحِضُوا بِهِ الْحَقَّ ۖ وَاتَّخَذُوا آيَاتِي وَمَا أُنْذِرُوا هُزُوًا
  trl: Wa-mā nursilu l-mursalīna illā mubashshirīna wa-mundhirīna wa-yujādilu lladhīna kafarū bi-l-bāṭili li-yudḥiḍū bihi l-ḥaqqa wa-ttakhadhū āyātī wa-mā undhirū huzuwā
  trad: Et Nous n'envoyons les mursalūn que comme annonciateurs (mubashshirīn) et avertisseurs (mundhirīn) ; et ceux qui ont mécru disputent (yujādilu) par le faux (bāṭil), afin de réfuter (li-yudḥiḍū) par lui al-ḥaqq ; et ils ont pris Mes āyāt, et ce dont ils ont été avertis, en dérision (huzuw).
- ref: S.18:57
  ar: وَمَنْ أَظْلَمُ مِمَّنْ ذُكِّرَ بِآيَاتِ رَبِّهِ فَأَعْرَضَ عَنْهَا وَنَسِيَ مَا قَدَّمَتْ يَدَاهُ ۚ إِنَّا جَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَنْ يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْرًا ۖ وَإِنْ تَدْعُهُمْ إِلَى الْهُدَىٰ فَلَنْ يَهْتَدُوا إِذًا أَبَدًا
  trl: Wa-man aẓlamu mimman dhukkira bi-āyāti rabbihi fa-aʿraḍa ʿanhā wa-nasiya mā qaddamat yadāhu innā jaʿalnā ʿalā qulūbihim akinnatan an yafqahūhu wa-fī ādhānihim waqran wa-in tadʿuhum ila l-hudā fa-lan yahtadū idhan abadā
  trad: Et qui est plus injuste que celui à qui on a rappelé les āyāt de son Rabb, et qui s'en détourne (aʿraḍa), et oublie ce que ses mains ont avancé ? Nous avons placé, sur leurs cœurs, des enveloppes (akinna) [qui les empêchent] de le comprendre, et dans leurs oreilles une surdité (waqr) ; et si tu les appelles à la guidance, ils ne seront alors jamais guidés.
- ref: S.18:58
  ar: وَرَبُّكَ الْغَفُورُ ذُو الرَّحْمَةِ ۖ لَوْ يُؤَاخِذُهُمْ بِمَا كَسَبُوا لَعَجَّلَ لَهُمُ الْعَذَابَ ۚ بَلْ لَهُمْ مَوْعِدٌ لَنْ يَجِدُوا مِنْ دُونِهِ مَوْئِلًا
  trl: Wa-rabbuka l-ghafūru dhū r-raḥmati law yuʾākhidhuhum bi-mā kasabū la-ʿajjala lahumu l-ʿadhāba bal lahum mawʿidun lan yajidū min dūnihi mawʾilā
  trad: Et ton Rabb est al-Ghafūr, détenteur de la raḥma ; s'Il les saisissait (yuʾākhidhuhum) pour ce qu'ils ont acquis, Il hâterait pour eux le châtiment. Mais ils ont un rendez-vous (mawʿid), dont ils ne trouveront, en dehors de lui, aucun refuge (mawʾil).
- ref: S.18:59
  ar: وَتِلْكَ الْقُرَىٰ أَهْلَكْنَاهُمْ لَمَّا ظَلَمُوا وَجَعَلْنَا لِمَهْلِكِهِمْ مَوْعِدًا
  trl: Wa-tilka l-qurā ahlaknāhum lammā ẓalamū wa-jaʿalnā li-mahlikihim mawʿidā
  trad: Et ces cités (qurā), Nous les avons détruites (ahlaknāhum) quand elles ont été injustes, et Nous avons fixé, pour leur destruction (mahlik), un rendez-vous (mawʿid).
- ref: S.18:60
  ar: وَإِذْ قَالَ مُوسَىٰ لِفَتَاهُ لَا أَبْرَحُ حَتَّىٰ أَبْلُغَ مَجْمَعَ الْبَحْرَيْنِ أَوْ أَمْضِيَ حُقُبًا
  trl: Wa-idh qāla mūsā li-fatāhu lā abraḥu ḥattā ablugha majmaʿa l-baḥrayni aw amḍiya ḥuqubā
  trad: 'Et [rappelle] quand Mūsā dit à son jeune serviteur (fatā) : « Je ne cesserai [de marcher] (lā abraḥu) avant d''atteindre le confluent des deux mers (majmaʿ al-baḥrayn), ou de poursuivre ma route (amḍiya) durant de longues années (ḥuqub). »'
- ref: S.18:61
  ar: فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ سَرَبًا
  trl: Fa-lammā balaghā majmaʿa baynihimā nasiyā ḥūtahumā fa-ttakhadha sabīlahu fi l-baḥri sarabā
  trad: Puis, lorsqu'ils eurent atteint le confluent entre les deux (mers), ils oublièrent leur poisson (ḥūt), qui prit son propre chemin dans la mer comme un passage (sarab).
- ref: S.18:62
  ar: فَلَمَّا جَاوَزَا قَالَ لِفَتَاهُ آتِنَا غَدَاءَنَا لَقَدْ لَقِينَا مِنْ سَفَرِنَا هَٰذَا نَصَبًا
  trl: Fa-lammā jāwazā qāla li-fatāhu ātinā ghadāʾanā la-qad laqīnā min safarinā hādhā naṣabā
  trad: 'Puis, lorsqu''ils eurent dépassé (ce lieu), il dit à son jeune serviteur : « Apporte-nous notre repas (ghadāʾ) ; nous avons certes rencontré, dans ce voyage-ci, une grande fatigue (naṣab). »'
- ref: S.18:63
  ar: قَالَ أَرَأَيْتَ إِذْ أَوَيْنَا إِلَى الصَّخْرَةِ فَإِنِّي نَسِيتُ الْحُوتَ وَمَا أَنْسَانِيهُ إِلَّا الشَّيْطَانُ أَنْ أَذْكُرَهُ ۚ وَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ عَجَبًا
  trl: Qāla a-raʾayta idh awaynā ila ṣ-ṣakhrati fa-innī nasītu l-ḥūta wa-mā ansānīhu illā sh-shayṭānu an adhkurahu wa-ttakhadha sabīlahu fi l-baḥri ʿajabā
  trad: 'Il dit : « As-tu vu ? Quand nous nous sommes réfugiés (awaynā) près du rocher (ṣakhra), j''ai oublié le poisson — et seul le Shayṭān m''a fait oublier de le mentionner (an adhkurahu) — il a pris son propre chemin dans la mer, chose étonnante (ʿajab). »'
- ref: S.18:64
  ar: قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ ۚ فَارْتَدَّا عَلَىٰ آثَارِهِمَا قَصَصًا
  trl: Qāla dhālika mā kunnā nabghi fa-rtaddā ʿalā āthārihimā qaṣaṣā
  trad: 'Il dit : « Voilà ce que nous cherchions (nabghi) ! » — et ils rebroussèrent chemin sur leurs propres traces (āthārihimā), en revenant pas à pas (qaṣaṣ).'
- ref: S.18:65
  ar: فَوَجَدَا عَبْدًا مِنْ عِبَادِنَا آتَيْنَاهُ رَحْمَةً مِنْ عِنْدِنَا وَعَلَّمْنَاهُ مِنْ لَدُنَّا عِلْمًا
  trl: Fa-wajadā ʿabdan min ʿibādinā ātaynāhu raḥmatan min ʿindinā wa-ʿallamnāhu min ladunnā ʿilmā
  trad: Ils trouvèrent alors un serviteur (ʿabd) parmi Nos serviteurs, à qui Nous avions donné une raḥma venue de Nous (min ʿindinā), et à qui Nous avions enseigné, directement de Nous (min ladunnā), une science (ʿilm).
- ref: S.18:66
  ar: قَالَ لَهُ مُوسَىٰ هَلْ أَتَّبِعُكَ عَلَىٰ أَنْ تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًا
  trl: Qāla lahu mūsā hal attabiʿuka ʿalā an tuʿallimani mimmā ʿullimta rushdā
  trad: 'Mūsā lui dit : « Puis-je te suivre, à condition que tu m''enseignes, de ce qui t''a été enseigné, un juste discernement (rushd) ? »'
- ref: S.18:67–68
  ar: قَالَ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِ خُبْرًا
  trl: Qāla innaka lan tastaṭīʿa maʿiya ṣabrā — wa-kayfa taṣbiru ʿalā mā lam tuḥiṭ bihi khubrā
  trad: 'Il dit : « Tu ne pourras pas, avec moi, garder patience (ṣabr). Et comment endurerais-tu (taṣbiru) ce que tu n''embrasses pas par une connaissance directe (khubr) ? »'
- ref: S.18:69
  ar: قَالَ سَتَجِدُنِي إِنْ شَاءَ اللَّهُ صَابِرًا وَلَا أَعْصِي لَكَ أَمْرًا
  trl: Qāla sa-tajidunī in shāʾa llāhu ṣābiran wa-lā aʿṣī laka amrā
  trad: 'Il dit : « Tu me trouveras, si Allaah le veut (in shāʾa llāh), patient, et je ne désobéirai à aucun de tes ordres (amr). »'
- ref: S.18:70
  ar: قَالَ فَإِنِ اتَّبَعْتَنِي فَلَا تَسْأَلْنِي عَنْ شَيْءٍ حَتَّىٰ أُحْدِثَ لَكَ مِنْهُ ذِكْرًا
  trl: Qāla fa-ini ttabaʿtanī fa-lā tasʾalnī ʿan shayʾin ḥattā uḥditha laka minhu dhikrā
  trad: 'Il dit : « Si donc tu me suis, ne m''interroge sur rien, jusqu''à ce que moi-même je t''en fasse mention (uḥditha laka minhu dhikrā). »'
- ref: S.18:71
  ar: فَانْطَلَقَا حَتَّىٰ إِذَا رَكِبَا فِي السَّفِينَةِ خَرَقَهَا ۖ قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْئًا إِمْرًا
  trl: Fa-nṭalaqā ḥattā idhā rakibā fi s-safīnati kharaqahā qāla a-kharaqtahā li-tughriqa ahlahā la-qad jiʾta shayʾan imrā
  trad: 'Ils partirent tous deux ; puis, lorsqu''ils furent montés sur le bateau (safīna), il y fit un trou (kharaqahā). [Mūsā] dit : « L''as-tu percé pour noyer (li-tughriqa) ses occupants ? Tu as fait là une chose grave (imr). »'
- ref: S.18:72
  ar: قَالَ أَلَمْ أَقُلْ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا
  trl: Qāla a-lam aqul innaka lan tastaṭīʿa maʿiya ṣabrā
  trad: 'Il dit : « Ne t''avais-je pas dit que tu ne pourrais pas, avec moi, garder patience ? »'
- ref: S.18:73
  ar: قَالَ لَا تُؤَاخِذْنِي بِمَا نَسِيتُ وَلَا تُرْهِقْنِي مِنْ أَمْرِي عُسْرًا
  trl: Qāla lā tuʾākhidhnī bi-mā nasītu wa-lā turhiqnī min amrī ʿusrā
  trad: '[Mūsā] dit : « Ne me tiens pas rigueur (lā tuʾākhidhnī) de ce que j''ai oublié, et ne m''accable pas (lā turhiqnī), dans mon affaire (amrī), d''une difficulté excessive (ʿusr). »'
- ref: S.18:74
  ar: فَانْطَلَقَا حَتَّىٰ إِذَا لَقِيَا غُلَامًا فَقَتَلَهُ قَالَ أَقَتَلْتَ نَفْسًا زَكِيَّةً بِغَيْرِ نَفْسٍ لَقَدْ جِئْتَ شَيْئًا نُكْرًا
  trl: Fa-nṭalaqā ḥattā idhā laqiyā ghulāman fa-qatalahu qāla a-qatalta nafsan zakiyyatan bi-ghayri nafsin la-qad jiʾta shayʾan nukrā
  trad: 'Ils repartirent ; puis, lorsqu''ils rencontrèrent un jeune garçon (ghulām), il le tua. [Mūsā] dit : « As-tu tué une âme pure (nafsan zakiyya), qui n''a tué personne (bi-ghayri nafs) ? Tu as fait là une chose détestable (nukr). »'
- ref: S.18:75
  ar: ۞ قَالَ أَلَمْ أَقُلْ لَكَ إِنَّكَ لَنْ تَسْتَطِيعَ مَعِيَ صَبْرًا
  trl: Qāla a-lam aqul laka innaka lan tastaṭīʿa maʿiya ṣabrā
  trad: 'Il dit : « Ne t''avais-je pas dit que tu ne pourrais pas, avec moi, garder patience ? »'
- ref: S.18:76
  ar: قَالَ إِنْ سَأَلْتُكَ عَنْ شَيْءٍ بَعْدَهَا فَلَا تُصَاحِبْنِي ۖ قَدْ بَلَغْتَ مِنْ لَدُنِّي عُذْرًا
  trl: Qāla in saʾaltuka ʿan shayʾin baʿdahā fa-lā tuṣāḥibnī qad balaghta min ladunnī ʿudhrā
  trad: '[Mūsā] dit : « Si je t''interroge encore sur quoi que ce soit après cela, ne m''accompagne plus ; tu auras alors atteint, de ma part (min ladunnī), une excuse (ʿudhr). »'
- ref: S.18:77
  ar: فَانْطَلَقَا حَتَّىٰ إِذَا أَتَيَا أَهْلَ قَرْيَةٍ اسْتَطْعَمَا أَهْلَهَا فَأَبَوْا أَنْ يُضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَارًا يُرِيدُ أَنْ يَنْقَضَّ فَأَقَامَهُ ۖ قَالَ لَوْ شِئْتَ لَاتَّخَذْتَ عَلَيْهِ أَجْرًا
  trl: Fa-nṭalaqā ḥattā idhā atayā ahla qaryatin istaṭʿamā ahlahā fa-abaw an yuḍayyifūhumā fa-wajadā fīhā jidāran yurīdu an yanqaḍḍa fa-aqāmahu qāla law shiʾta la-ttakhadhta ʿalayhi ajrā
  trad: 'Ils repartirent tous deux ; puis, lorsqu''ils arrivèrent auprès des gens d''une cité (qarya), ils leur demandèrent de la nourriture (istaṭʿamā), mais ceux-ci refusèrent de les recevoir en hôtes (an yuḍayyifūhumā). Ils y trouvèrent un mur (jidār) qui menaçait de s''effondrer (yurīdu an yanqaḍḍa), et il le redressa (aqāmahu). [Mūsā] dit : « Si tu l''avais voulu, tu aurais pu prendre pour cela un salaire (ajr). »'
- ref: S.18:78
  ar: قَالَ هَٰذَا فِرَاقُ بَيْنِي وَبَيْنِكَ ۚ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِعْ عَلَيْهِ صَبْرًا
  trl: Qāla hādhā firāqu baynī wa-baynika sa-unabbiʾuka bi-taʾwīli mā lam tastaṭiʿ ʿalayhi ṣabrā
  trad: 'Il dit : « Ceci est la séparation (firāq) entre moi et toi. Je vais t''annoncer l''aboutissement (taʾwīl) de ce que tu n''as pu supporter avec patience. »'
- ref: S.18:79
  ar: أَمَّا السَّفِينَةُ فَكَانَتْ لِمَسَاكِينَ يَعْمَلُونَ فِي الْبَحْرِ فَأَرَدْتُ أَنْ أَعِيبَهَا وَكَانَ وَرَاءَهُمْ مَلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا
  trl: Ammā s-safīnatu fa-kānat li-masākīna yaʿmalūna fi l-baḥri fa-aradtu an aʿībahā wa-kāna warāʾahum malikun yaʾkhudhu kulla safīnatin ghaṣbā
  trad: « Quant au bateau, il appartenait à des gens démunis (masākīn) qui travaillaient en mer ; j'ai voulu (aradtu) le rendre défectueux (an aʿībahā), car il y avait, au-devant d'eux (warāʾahum), un roi (malik) qui s'emparait de tout bateau [en bon état] par la force (ghaṣb). »
- ref: S.18:80–81
  ar: وَأَمَّا الْغُلَامُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَا أَنْ يُرْهِقَهُمَا طُغْيَانًا وَكُفْرًا فَأَرَدْنَا أَنْ يُبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِنْهُ زَكَاةً وَأَقْرَبَ رُحْمًا
  trl: Wa-ammā l-ghulāmu fa-kāna abawāhu muʾminayni fa-khashīnā an yurhiqahumā ṭughyānan wa-kufrā — fa-aradnā an yubdilahumā rabbuhumā khayran minhu zakātan wa-aqraba ruḥmā
  trad: « Et quant au jeune garçon, ses parents (abawāhu) étaient croyants ; Nous avons craint (khashīnā) qu'il ne les accable (yurhiqahumā) d'une transgression insolente (ṭughyān) et d'un rejet (kufr). Nous avons donc voulu (fa-aradnā) que leur Rabb leur donne, en échange (yubdilahumā), meilleur que lui en pureté (zakāt), et plus proche en tendresse (ruḥm). »
- ref: S.18:82
  ar: وَأَمَّا الْجِدَارُ فَكَانَ لِغُلَامَيْنِ يَتِيمَيْنِ فِي الْمَدِينَةِ وَكَانَ تَحْتَهُ كَنْزٌ لَهُمَا وَكَانَ أَبُوهُمَا صَالِحًا فَأَرَادَ رَبُّكَ أَنْ يَبْلُغَا أَشُدَّهُمَا وَيَسْتَخْرِجَا كَنْزَهُمَا رَحْمَةً مِنْ رَبِّكَ ۚ وَمَا فَعَلْتُهُ عَنْ أَمْرِي ۚ ذَٰلِكَ تَأْوِيلُ مَا لَمْ تَسْطِعْ عَلَيْهِ صَبْرًا
  trl: Wa-ammā l-jidāru fa-kāna li-ghulāmayni yatīmayni fi l-madīnati wa-kāna taḥtahu kanzun lahumā wa-kāna abūhumā ṣāliḥan fa-arāda rabbuka an yablughā ashuddahumā wa-yastakhrijā kanzahumā raḥmatan min rabbika wa-mā faʿaltuhu ʿan amrī dhālika taʾwīlu mā lam tasṭiʿ ʿalayhi ṣabrā
  trad: « Et quant au mur, il appartenait à deux jeunes garçons orphelins (yatīmayni) de la cité ; sous lui se trouvait un trésor (kanz) qui leur revenait, et leur père avait été droit (ṣāliḥ) ; ton Rabb a donc voulu (fa-arāda rabbuka) qu'ils atteignent leur pleine maturité (ashuddahumā) et qu'ils fassent sortir leur trésor — par raḥma venue de ton Rabb. Et je ne l'ai pas fait de mon propre chef (ʿan amrī). Voilà l'aboutissement (taʾwīl) de ce que tu n'as pu supporter avec patience. »
- ref: S.18:83
  ar: وَيَسْأَلُونَكَ عَنْ ذِي الْقَرْنَيْنِ ۖ قُلْ سَأَتْلُو عَلَيْكُمْ مِنْهُ ذِكْرًا
  trl: Wa-yasʾalūnaka ʿan dhi l-qarnayni qul sa-atlū ʿalaykum minhu dhikrā
  trad: 'Et ils t''interrogent au sujet de Dhū l-Qarnayn. Dis : « Je vais vous réciter, à son sujet, un rappel (dhikr). »'
- ref: S.18:84
  ar: إِنَّا مَكَّنَّا لَهُ فِي الْأَرْضِ وَآتَيْنَاهُ مِنْ كُلِّ شَيْءٍ سَبَبًا
  trl: Innā makkannā lahu fi l-arḍi wa-ātaynāhu min kulli shayʾin sababā
  trad: Nous l'avons établi fermement (makkannā) sur la terre, et Nous lui avons donné, de toute chose, un moyen (sabab) [d'y parvenir].
- ref: S.18:85–86
  ar: فَأَتْبَعَ سَبَبًا حَتَّىٰ إِذَا بَلَغَ مَغْرِبَ الشَّمْسِ وَجَدَهَا تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ وَوَجَدَ عِنْدَهَا قَوْمًا ۗ قُلْنَا يَا ذَا الْقَرْنَيْنِ إِمَّا أَنْ تُعَذِّبَ وَإِمَّا أَنْ تَتَّخِذَ فِيهِمْ حُسْنًا
  trl: Fa-atbaʿa sababan ḥattā idhā balagha maghriba sh-shamsi wajadahā taghrubu fī ʿaynin ḥamiʾatin wa-wajada ʿindahā qawman qulnā yā dha l-qarnayni immā an tuʿadhdhiba wa-immā an tattakhidha fīhim ḥusnā
  trad: 'Il suivit alors une voie (sabab), jusqu''à ce qu''il atteignît le lieu où se couche le soleil (maghrib ash-shams) : il la trouva se couchant dans une source d''eau bourbeuse (ʿaynin ḥamiʾah), et trouva auprès d''elle un peuple. Nous dîmes : « Ô Dhū l-Qarnayn, soit tu les châties, soit tu adoptes envers eux une belle conduite (ḥusn). »'
- ref: S.18:87–88
  ar: قَالَ أَمَّا مَنْ ظَلَمَ فَسَوْفَ نُعَذِّبُهُ ثُمَّ يُرَدُّ إِلَىٰ رَبِّهِ فَيُعَذِّبُهُ عَذَابًا نُكْرًا وَأَمَّا مَنْ آمَنَ وَعَمِلَ صَالِحًا فَلَهُ جَزَاءً الْحُسْنَىٰ ۖ وَسَنَقُولُ لَهُ مِنْ أَمْرِنَا يُسْرًا
  trl: Qāla ammā man ẓalama fa-sawfa nuʿadhdhibuhu thumma yuraddu ilā rabbihi fa-yuʿadhdhibuhu ʿadhāban nukrā — wa-ammā man āmana wa-ʿamila ṣāliḥan fa-lahu jazāʾan al-ḥusnā wa-sa-naqūlu lahu min amrinā yusrā
  trad: 'Il dit : « Quant à celui qui commet le ẓulm, nous le châtierons ; puis il sera ramené à son Rabb, qui le châtiera d''un châtiment détestable (nukr). Et quant à celui qui croit et accomplit une œuvre droite, il aura, en rétribution, le meilleur (al-ḥusnā), et nous lui dirons, dans ce que nous lui prescrivons (min amrinā), une parole de facilité (yusr). »'
- ref: S.18:89–91
  ar: ثُمَّ أَتْبَعَ سَبَبًا حَتَّىٰ إِذَا بَلَغَ مَطْلِعَ الشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍ لَمْ نَجْعَلْ لَهُمْ مِنْ دُونِهَا سِتْرًا كَذَٰلِكَ وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًا
  trl: Thumma atbaʿa sababan ḥattā idhā balagha maṭliʿa sh-shamsi wajadahā taṭluʿu ʿalā qawmin lam najʿal lahum min dūnihā sitrā — kadhālika wa-qad aḥaṭnā bimā ladayhi khubrā
  trad: 'Puis il suivit une autre voie, jusqu''à ce qu''il atteignît le lieu où se lève le soleil (maṭliʿ ash-shams) : il la trouva se levant sur un peuple à qui Nous n''avions donné, contre elle, aucun abri (sitr). Il en fut ainsi ; et Nous embrassions déjà, par une connaissance directe (khubr), ce qui était en sa possession.'
- ref: S.18:92–94
  ar: ثُمَّ أَتْبَعَ سَبَبًا حَتَّىٰ إِذَا بَلَغَ بَيْنَ السَّدَّيْنِ وَجَدَ مِنْ دُونِهِمَا قَوْمًا لَا يَكَادُونَ يَفْقَهُونَ قَوْلًا قَالُوا يَا ذَا الْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِي الْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰ أَنْ تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّا
  trl: Thumma atbaʿa sababan ḥattā idhā balagha bayna s-saddayni wajada min dūnihimā qawman lā yakādūna yafqahūna qawlā — qālū yā dha l-qarnayni inna yaʾjūja wa-maʾjūja mufsidūna fi l-arḍi fa-hal najʿalu laka kharjan ʿalā an tajʿala baynanā wa-baynahum saddā
  trad: 'Puis il suivit une autre voie, jusqu''à ce qu''il atteignît l''espace entre les deux montagnes (as-saddayn) : il trouva, en deçà d''elles, un peuple qui ne comprenait presque aucun discours (qawl). Ils dirent : « Ô Dhū l-Qarnayn, Yaʾjūj et Maʾjūj sèment le fasād sur la terre ; t''établirons-nous un tribut (kharj), à condition que tu places entre nous et eux une barrière (sadd) ? »'
- ref: S.18:95–96
  ar: قَالَ مَا مَكَّنِّي فِيهِ رَبِّي خَيْرٌ فَأَعِينُونِي بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا آتُونِي زُبَرَ الْحَدِيدِ ۖ حَتَّىٰ إِذَا سَاوَىٰ بَيْنَ الصَّدَفَيْنِ قَالَ انْفُخُوا ۖ حَتَّىٰ إِذَا جَعَلَهُ نَارًا قَالَ آتُونِي أُفْرِغْ عَلَيْهِ قِطْرًا
  trl: Qāla mā makkannī fīhi rabbī khayrun fa-aʿīnūnī bi-quwwatin ajʿal baynakum wa-baynahum radmā — ātūnī zubara l-ḥadīdi ḥattā idhā sāwā bayna ṣ-ṣadafayni qāla nfukhū ḥattā idhā jaʿalahu nāran qāla ātūnī ufrigh ʿalayhi qiṭrā
  trad: 'Il dit : « Ce en quoi mon Rabb m''a établi (makkannī) est meilleur ; aidez-moi seulement avec force (quwwa), et je placerai entre vous et eux un rempart (radm). Apportez-moi des blocs de fer (zubar al-ḥadīd). » Puis, quand il eut nivelé (sāwā) l''espace entre les deux flancs (aṣ-ṣadafayn), il dit : « Soufflez (infukhū). » Puis, quand il l''eut rendu incandescent, il dit : « Apportez-moi [de quoi] verser sur lui du métal en fusion (qiṭr). »'
- ref: S.18:97–98
  ar: فَمَا اسْطَاعُوا أَنْ يَظْهَرُوهُ وَمَا اسْتَطَاعُوا لَهُ نَقْبًا قَالَ هَٰذَا رَحْمَةٌ مِنْ رَبِّي ۖ فَإِذَا جَاءَ وَعْدُ رَبِّي جَعَلَهُ دَكَّاءَ ۖ وَكَانَ وَعْدُ رَبِّي حَقًّا
  trl: Fa-ma-sṭāʿū an yaẓharūhu wa-ma-staṭāʿū lahu naqbā — qāla hādhā raḥmatun min rabbī fa-idhā jāʾa waʿdu rabbī jaʿalahu dakkāʾa wa-kāna waʿdu rabbī ḥaqqā
  trad: 'Ils ne purent (mā-sṭāʿū) le franchir par-dessus, ni ne purent (mā-staṭāʿū) y percer un trou (naqb). Il dit : « Ceci est une raḥma venue de mon Rabb ; mais quand viendra la promesse (waʿd) de mon Rabb, Il le réduira en une chose nivelée (dakkāʾ) — et la promesse de mon Rabb est vraie (ḥaqq). »'
- ref: S.18:99
  ar: ۞ وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍ يَمُوجُ فِي بَعْضٍ ۖ وَنُفِخَ فِي الصُّورِ فَجَمَعْنَاهُمْ جَمْعًا
  trl: Wa-taraknā baʿḍahum yawmaʾidhin yamūju fī baʿḍin wa-nufikha fi ṣ-ṣūri fa-jamaʿnāhum jamʿā
  trad: Et Nous les laisserons, ce jour-là (yawmaʾidhin), déferler (yamūju) les uns dans les autres ; et il sera soufflé dans la Trompe (aṣ-ṣūr), et Nous les rassemblerons alors tous ensemble (jamʿan).
- ref: S.18:100–101
  ar: وَعَرَضْنَا جَهَنَّمَ يَوْمَئِذٍ لِلْكَافِرِينَ عَرْضًا الَّذِينَ كَانَتْ أَعْيُنُهُمْ فِي غِطَاءٍ عَنْ ذِكْرِي وَكَانُوا لَا يَسْتَطِيعُونَ سَمْعًا
  trl: Wa-ʿaraḍnā jahannama yawmaʾidhin li-l-kāfirīna ʿarḍā — alladhīna kānat aʿyunuhum fī ghiṭāʾin ʿan dhikrī wa-kānū lā yastaṭīʿūna samʿā
  trad: Et Nous présenterons, ce jour-là, Jahannam, à découvert (ʿarḍan), aux kāfirūn — ceux dont les yeux étaient dans un voile (ghiṭāʾ) loin de Mon dhikr, et qui ne pouvaient supporter de l'entendre (samʿ).
- ref: S.18:102
  ar: أَفَحَسِبَ الَّذِينَ كَفَرُوا أَنْ يَتَّخِذُوا عِبَادِي مِنْ دُونِي أَوْلِيَاءَ ۚ إِنَّا أَعْتَدْنَا جَهَنَّمَ لِلْكَافِرِينَ نُزُلًا
  trl: A-fa-ḥasiba lladhīna kafarū an yattakhidhū ʿibādī min dūnī awliyāʾa innā aʿtadnā jahannama li-l-kāfirīna nuzulā
  trad: Ceux qui sont kāfirūn ont-ils estimé (ḥasiba) qu'ils pourraient prendre Mes ʿibād, en dehors de Moi, pour awliyāʾ ? Nous avons préparé (aʿtadnā) Jahannam, pour les kāfirūn, en accueil (nuzul).
- ref: S.18:103–104
  ar: قُلْ هَلْ نُنَبِّئُكُمْ بِالْأَخْسَرِينَ أَعْمَالًا الَّذِينَ ضَلَّ سَعْيُهُمْ فِي الْحَيَاةِ الدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا
  trl: Qul hal nunabbiʾukum bi-l-akhsarīna aʿmālā — alladhīna ḍalla saʿyuhum fi l-ḥayāti d-dunyā wa-hum yaḥsabūna annahum yuḥsinūna ṣunʿā
  trad: 'Dis : « Vous informerai-Je de ceux qui sont les plus grands perdants (al-akhsarīn) en œuvres ? — ceux dont l''effort (saʿy) s''est égaré (ḍalla) dans la vie d''ici-bas, alors même qu''ils estiment accomplir une belle œuvre (yuḥsinūna ṣunʿā). »'
- ref: S.18:105
  ar: أُولَٰئِكَ الَّذِينَ كَفَرُوا بِآيَاتِ رَبِّهِمْ وَلِقَائِهِ فَحَبِطَتْ أَعْمَالُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ الْقِيَامَةِ وَزْنًا
  trl: Ulāʾika lladhīna kafarū bi-āyāti rabbihim wa-liqāʾihi fa-ḥabiṭat aʿmāluhum fa-lā nuqīmu lahum yawma l-qiyāmati waznā
  trad: Ceux-là sont ceux qui ont nié les āyāt de leur Rabb et Sa Rencontre (liqāʾ) — leurs œuvres sont devenues vaines (ḥabiṭat), et Nous ne leur accorderons, au Jour de la Résurrection, aucun poids (wazn).
- ref: S.18:106
  ar: ذَٰلِكَ جَزَاؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا وَاتَّخَذُوا آيَاتِي وَرُسُلِي هُزُوًا
  trl: Dhālika jazāʾuhum jahannamu bimā kafarū wa-ttakhadhū āyātī wa-rusulī huzuwā
  trad: 'Voilà leur rétribution : Jahannam, pour avoir été kāfirūn, et pour avoir pris Mes āyāt et Mes rusul en dérision (huzuwā).'
- ref: S.18:107–108
  ar: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا خَالِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلًا
  trl: Inna lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti kānat lahum jannātu l-firdawsi nuzulā — khālidīna fīhā lā yabghūna ʿanhā ḥiwalā
  trad: Ceux qui croient et accomplissent les œuvres droites ont, pour eux, les jardins du Firdaws en accueil (nuzul) — y demeurant à jamais (khālidīn), sans désirer s'en écarter par aucun changement (ḥiwal).
- ref: S.18:109
  ar: قُلْ لَوْ كَانَ الْبَحْرُ مِدَادًا لِكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَنْ تَنْفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا
  trl: Qul law kāna l-baḥru midādan li-kalimāti rabbī la-nafida l-baḥru qabla an tanfada kalimātu rabbī wa-law jiʾnā bi-mithlihi madadā
  trad: 'Dis : « Si la mer était de l''encre (midād) pour les Paroles (kalimāt) de mon Rabb, la mer s''épuiserait (la-nafida) avant que ne s''épuisent les Paroles de mon Rabb — même si Nous en apportions l''équivalent en renfort (madad). »'
- ref: S.18:110
  ar: قُلْ إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ فَمَنْ كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا
  trl: Qul innamā anā basharun mithlukum yūḥā ilayya annamā ilāhukum ilāhun wāḥidun fa-man kāna yarjū liqāʾa rabbihi fa-l-yaʿmal ʿamalan ṣāliḥan wa-lā yushrik bi-ʿibādati rabbihi aḥadā
  trad: 'Dis : « Je ne suis qu''un être humain (bashar) comme vous ; il m''est révélé (yūḥā ilayya) que votre ilāh est un ilāh unique (wāḥid). Quiconque espère la Rencontre (liqāʾ) de son Rabb, qu''il accomplisse une œuvre droite, et qu''il n''associe personne dans le culte (ʿibāda) rendu à son Rabb ! »'
