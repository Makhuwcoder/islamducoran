- ref: S.10:1
  ar: الر ۚ تِلْكَ آيَاتُ الْكِتَابِ الْحَكِيمِ
  trl: Alif · Lām · Rāʾ — tilka āyātu l-kitābi l-ḥakīm
  trad: Alif, Lām, Rāʾ. Voilà les āyāt du Kitāb empreint de ḥikma.
- ref: S.10:2
  ar: أَكَانَ لِلنَّاسِ عَجَبًا أَنْ أَوْحَيْنَا إِلَىٰ رَجُلٍ مِنْهُمْ أَنْ أَنْذِرِ النَّاسَ وَبَشِّرِ الَّذِينَ آمَنُوا أَنَّ لَهُمْ قَدَمَ صِدْقٍ عِنْدَ رَبِّهِمْ ۗ قَالَ الْكَافِرُونَ إِنَّ هَٰذَا لَسَاحِرٌ مُبِينٌ
  trl: A-kāna li-n-nāsi ʿajaban an awḥaynā ilā rajulin minhum an andhiri n-nāsa wa-bashshiri lladhīna āmanū anna lahum qadama ṣidqin ʿinda rabbihim — qāla l-kāfirūna inna hādhā la-sāḥirun mubīn
  trad: 'Était-ce, pour les hommes, un étonnement que Nous ayons révélé à un homme parmi eux : « Avertis les hommes, et annonce à ceux qui ont cru qu''ils ont, auprès de leur Rabb, un acquis de sincérité » ? Ceux qui sont *kāfirūn* dirent : « Celui-ci est certainement un sorcier manifeste. »'
- ref: S.10:3
  ar: إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ ۖ يُدَبِّرُ الْأَمْرَ ۖ مَا مِنْ شَفِيعٍ إِلَّا مِنْ بَعْدِ إِذْنِهِ ۚ ذَٰلِكُمُ اللَّهُ رَبُّكُمْ فَاعْبُدُوهُ ۚ أَفَلَا تَذَكَّرُونَ
  trl: Inna rabbakumu llāhu lladhī khalaqa s-samāwāti wa-l-arḍa fī sittati ayyāmin thumma-stawā ʿalā l-ʿarshi yudabbiru l-amra — mā min shafīʿin illā min baʿdi idhnihi — dhālikumu llāhu rabbukum fa-ʿbudūhu — a-fa-lā tadhakkarūn
  trad: 'Votre Rabb, c''est Allaah — Ce qui a créé les cieux et la terre en six jours, puis a pris pleinement possession du *ʿArsh* : Il administre l''affaire [de toute chose]. Nul *shafīʿ* si ce n''est après Son autorisation (*idhn*). Voilà Allaah, votre Rabb — adorez-Le donc. Ne vous rappelez-vous donc pas ?'
- ref: S.10:4
  ar: إِلَيْهِ مَرْجِعُكُمْ جَمِيعًا ۖ وَعْدَ اللَّهِ حَقًّا ۚ إِنَّهُ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ لِيَجْزِيَ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ بِالْقِسْطِ ۚ وَالَّذِينَ كَفَرُوا لَهُمْ شَرَابٌ مِنْ حَمِيمٍ وَعَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْفُرُونَ
  trl: Ilayhi marjiʿukum jamīʿan waʿda llāhi ḥaqqan — innahu yabdaʾu l-khalqa thumma yuʿīduhu li-yajziya lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti bi-l-qisṭi — wa-lladhīna kafarū lahum sharābun min ḥamīmin wa-ʿadhābun alīmun bi-mā kānū yakfurūn
  trad: Vers Lui est votre retour, tous ensemble — promesse d'Allaah, en toute vérité. Il fait exister la création une première fois, puis Il la refait, pour rétribuer selon le *qisṭ* ceux qui ont cru et fait les œuvres bonnes — tandis que ceux qui sont *kāfirūn* auront une boisson d'eau bouillante et un châtiment douloureux, pour le *kufr* qu'ils commettaient.
- ref: S.10:5
  ar: هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِيَاءً وَالْقَمَرَ نُورًا وَقَدَّرَهُ مَنَازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسَابَ ۚ مَا خَلَقَ اللَّهُ ذَٰلِكَ إِلَّا بِالْحَقِّ ۚ يُفَصِّلُ الْآيَاتِ لِقَوْمٍ يَعْلَمُونَ
  trl: Huwa lladhī jaʿala sh-shamsa ḍiyāʾan wa-l-qamara nūran wa-qaddarahu manāzila li-taʿlamū ʿadada s-sinīna wa-l-ḥisāb — mā khalaqa llāhu dhālika illā bi-l-ḥaqqi — yufaṣṣilu l-āyāti li-qawmin yaʿlamūn
  trad: C'est Lui qui a fait du soleil une clarté [rayonnante] et de la lune une lumière [réfléchie], et Il lui a déterminé des stations, pour que vous connaissiez le nombre des années et le calcul [du temps]. Allaah n'a créé cela que porté par le *ḥaqq* — Il détaille les *āyāt* pour un peuple qui sait.
- ref: S.10:6
  ar: إِنَّ فِي اخْتِلَافِ اللَّيْلِ وَالنَّهَارِ وَمَا خَلَقَ اللَّهُ فِي السَّمَاوَاتِ وَالْأَرْضِ لَآيَاتٍ لِقَوْمٍ يَتَّقُونَ
  trl: Inna fi khtilāfi l-layli wa-n-nahāri wa-mā khalaqa llāhu fi s-samāwāti wa-l-arḍi la-āyātin li-qawmin yattaqūn
  trad: Dans l'alternance de la nuit et du jour, et dans ce qu'Allaah a créé dans les cieux et sur la terre, il y a certes des *āyāt* pour un peuple qui se prémunit.
- ref: S.10:7
  ar: إِنَّ الَّذِينَ لَا يَرْجُونَ لِقَاءَنَا وَرَضُوا بِالْحَيَاةِ الدُّنْيَا وَاطْمَأَنُّوا بِهَا وَالَّذِينَ هُمْ عَنْ آيَاتِنَا غَافِلُونَ
  trl: Inna lladhīna lā yarjūna liqāʾanā wa-raḍū bi-l-ḥayāti d-dunyā wa-ṭmaʾannū bihā wa-lladhīna hum ʿan āyātinā ghāfilūn
  trad: Ceux qui ne comptent pas sur Notre Rencontre, qui se sont satisfaits de la vie d'ici-bas et s'y sont installés dans une sécurité tranquille, et ceux qui sont insouciants de Nos *āyāt* —
- ref: S.10:8
  ar: أُولَٰئِكَ مَأْوَاهُمُ النَّارُ بِمَا كَانُوا يَكْسِبُونَ
  trl: Ulāʾika maʾwāhumu n-nāru bi-mā kānū yaksibūn
  trad: ceux-là, leur refuge (*maʾwā*) est le Feu, pour ce qu'ils acquéraient.
- ref: S.10:9
  ar: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ يَهْدِيهِمْ رَبُّهُمْ بِإِيمَانِهِمْ ۖ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ فِي جَنَّاتِ النَّعِيمِ
  trl: Inna lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti yahdīhim rabbuhum bi-īmānihim — tajrī min taḥtihimu l-anhāru fī jannāti n-naʿīm
  trad: Ceux qui ont cru et fait les œuvres bonnes, leur Rabb les guide par leur foi même — sous eux courent les rivières, dans les jardins du délice (*naʿīm*).
- ref: S.10:10
  ar: دَعْوَاهُمْ فِيهَا سُبْحَانَكَ اللَّهُمَّ وَتَحِيَّتُهُمْ فِيهَا سَلَامٌ ۚ وَآخِرُ دَعْوَاهُمْ أَنِ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
  trl: Daʿwāhum fīhā subḥānaka allāhumma wa-taḥiyyatuhum fīhā salāmun — wa-ākhiru daʿwāhum ani l-ḥamdu li-llāhi rabbi l-ʿālamīn
  trad: 'Leur invocation, là, est : « Gloire à Toi, ô Allaah ! » et leur salutation, là, est *salām* — et le dernier mot de leur invocation est : « La *ḥamd* appartient à Allaah, Rabb des mondes. »'
- ref: S.10:11
  ar: ۞ وَلَوْ يُعَجِّلُ اللَّهُ لِلنَّاسِ الشَّرَّ اسْتِعْجَالَهُمْ بِالْخَيْرِ لَقُضِيَ إِلَيْهِمْ أَجَلُهُمْ ۖ فَنَذَرُ الَّذِينَ لَا يَرْجُونَ لِقَاءَنَا فِي طُغْيَانِهِمْ يَعْمَهُونَ
  trl: Wa-law yuʿajjilu llāhu li-n-nāsi sh-sharra stiʿjālahum bi-l-khayri la-quḍiya ilayhim ajaluhum — fa-nadharu lladhīna lā yarjūna liqāʾanā fī ṭughyānihim yaʿmahūn
  trad: Et si Allaah hâtait pour les hommes le mal comme ils hâtent [la venue] du bien, leur terme aurait déjà été décidé pour eux — mais Nous laissons ceux qui ne comptent pas sur Notre Rencontre errer aveuglément (*yaʿmahūn*) dans leur *ṭughyān*.
- ref: S.10:12
  ar: وَإِذَا مَسَّ الْإِنْسَانَ الضُّرُّ دَعَانَا لِجَنْبِهِ أَوْ قَاعِدًا أَوْ قَائِمًا فَلَمَّا كَشَفْنَا عَنْهُ ضُرَّهُ مَرَّ كَأَنْ لَمْ يَدْعُنَا إِلَىٰ ضُرٍّ مَسَّهُ ۚ كَذَٰلِكَ زُيِّنَ لِلْمُسْرِفِينَ مَا كَانُوا يَعْمَلُونَ
  trl: Wa-idhā massa l-insāna ḍ-ḍurru daʿānā li-janbihi aw qāʿidan aw qāʾiman — fa-lammā kashafnā ʿanhu ḍurrahu marra ka-an lam yadʿunā ilā ḍurrin massahu — kadhālika zuyyina li-l-musrifīna mā kānū yaʿmalūn
  trad: Et quand l'affliction (*ḍurr*) touche l'humain, il Nous invoque, allongé sur le côté, ou assis, ou debout — puis, quand Nous levons de lui son affliction, il poursuit son chemin comme s'il ne Nous avait jamais invoqués pour une affliction qui l'avait touché. C'est ainsi qu'est rendu attrayant, pour les *musrifūn*, ce qu'ils faisaient.
- ref: S.10:13
  ar: وَلَقَدْ أَهْلَكْنَا الْقُرُونَ مِنْ قَبْلِكُمْ لَمَّا ظَلَمُوا ۙ وَجَاءَتْهُمْ رُسُلُهُمْ بِالْبَيِّنَاتِ وَمَا كَانُوا لِيُؤْمِنُوا ۚ كَذَٰلِكَ نَجْزِي الْقَوْمَ الْمُجْرِمِينَ
  trl: Wa-la-qad ahlaknā l-qurūna min qablikum lammā ẕalamū — wa-jāʾathum rusuluhum bi-l-bayyināti wa-mā kānū li-yuʾminū — kadhālika najzī l-qawma l-mujrimīn
  trad: Nous avons anéanti les générations d'avant vous quand elles ont commis le *ẕulm* — leurs *rusul* leur étaient venus avec les preuves manifestes, et elles n'étaient pas disposées à croire. C'est ainsi que Nous rétribuons le peuple des *mujrimūn*.
- ref: S.10:14
  ar: ثُمَّ جَعَلْنَاكُمْ خَلَائِفَ فِي الْأَرْضِ مِنْ بَعْدِهِمْ لِنَنْظُرَ كَيْفَ تَعْمَلُونَ
  trl: Thumma jaʿalnākum khalāʾifa fi l-arḍi min baʿdihim li-nanẕura kayfa taʿmalūn
  trad: Puis Nous vous avons établis, après elles, comme successeurs sur la terre, pour qu'il devienne manifeste comment vous agissez.
- ref: S.10:15
  ar: وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ ۙ قَالَ الَّذِينَ لَا يَرْجُونَ لِقَاءَنَا ائْتِ بِقُرْآنٍ غَيْرِ هَٰذَا أَوْ بَدِّلْهُ ۚ قُلْ مَا يَكُونُ لِي أَنْ أُبَدِّلَهُ مِنْ تِلْقَاءِ نَفْسِي ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰ إِلَيَّ ۖ إِنِّي أَخَافُ إِنْ عَصَيْتُ رَبِّي عَذَابَ يَوْمٍ عَظِيمٍ
  trl: Wa-idhā tutlā ʿalayhim āyātunā bayyinātin qāla lladhīna lā yarjūna liqāʾanā i'ti bi-qurʾānin ghayri hādhā aw baddilhu — qul mā yakūnu lī an ubaddilahu min tilqāʾi nafsī — in attabiʿu illā mā yūḥā ilayya — innī akhāfu in ʿaṣaytu rabbī ʿadhāba yawmin ʿaẕīm
  trad: 'Et quand Nos *āyāt* leur sont récitées, manifestes, ceux qui ne comptent pas sur Notre Rencontre disent : « Apporte un Qurʾān autre que celui-ci, ou change-le. » Dis : « Il ne m''appartient pas de le changer de mon propre chef (*min tilqāʾi nafsī*) — je ne fais que suivre ce qui m''est révélé. Je crains, si je désobéissais à mon Rabb, le châtiment d''un jour immense. »'
- ref: S.10:16
  ar: قُلْ لَوْ شَاءَ اللَّهُ مَا تَلَوْتُهُ عَلَيْكُمْ وَلَا أَدْرَاكُمْ بِهِ ۖ فَقَدْ لَبِثْتُ فِيكُمْ عُمُرًا مِنْ قَبْلِهِ ۚ أَفَلَا تَعْقِلُونَ
  trl: Qul law shāʾa llāhu mā talawtuhu ʿalaykum wa-lā adrākum bihi — fa-qad labithtu fīkum ʿumuran min qablihi — a-fa-lā taʿqilūn
  trad: 'Dis : « Si Allaah avait voulu, je ne vous l''aurais pas récité, et Il ne vous en aurait pas fait prendre connaissance (*adrākum*). J''ai pourtant demeuré parmi vous toute une vie avant lui — ne raisonnez-vous donc pas ? »'
- ref: S.10:17
  ar: فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا أَوْ كَذَّبَ بِآيَاتِهِ ۚ إِنَّهُ لَا يُفْلِحُ الْمُجْرِمُونَ
  trl: Fa-man aẕlamu mimmani ftarā ʿalā llāhi kadhiban aw kadhdhaba bi-āyātihi — innahu lā yufliḥu l-mujrimūn
  trad: Qui donc est plus injuste que celui qui forge (*iftarā*) un mensonge contre Allaah, ou dément Ses *āyāt* ? Les *mujrimūn* ne réussissent certainement pas (*lā yufliḥu*).
- ref: S.10:18
  ar: وَيَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنْفَعُهُمْ وَيَقُولُونَ هَٰؤُلَاءِ شُفَعَاؤُنَا عِنْدَ اللَّهِ ۚ قُلْ أَتُنَبِّئُونَ اللَّهَ بِمَا لَا يَعْلَمُ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ ۚ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ
  trl: Wa-yaʿbudūna min dūni llāhi mā lā yaḍurruhum wa-lā yanfaʿuhum wa-yaqūlūna hāʾulāʾi shufaʿāʾunā ʿinda llāh — qul a-tunabbiʾūna llāha bimā lā yaʿlamu fi s-samāwāti wa-lā fi l-arḍi — subḥānahu wa-taʿālā ʿammā yushrikūn
  trad: 'Et ils adorent, en dehors d''Allaah, ce qui ne peut ni leur nuire ni leur être utile, et ils disent : « Ceux-ci sont nos *shafīʿ* auprès d''Allaah. » Dis : « Informez-vous Allaah de ce qu''Il ne sait pas dans les cieux ni sur la terre ? » Gloire à Lui — Ce qui transcende ce qu''ils Lui associent.'
- ref: S.10:19
  ar: وَمَا كَانَ النَّاسُ إِلَّا أُمَّةً وَاحِدَةً فَاخْتَلَفُوا ۚ وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِنْ رَبِّكَ لَقُضِيَ بَيْنَهُمْ فِيمَا فِيهِ يَخْتَلِفُونَ
  trl: Wa-mā kāna n-nāsu illā ummatan wāḥidatan fa-khtalafū — wa-lawlā kalimatun sabaqat min rabbika la-quḍiya baynahum fīmā fīhi yakhtalifūn
  trad: Les hommes n'étaient qu'une seule *umma*, puis ils se sont mis en désaccord. Et sans une parole (*kalima*) déjà arrêtée de ton Rabb, il aurait déjà été tranché entre eux sur ce en quoi ils sont en désaccord.
- ref: S.10:20
  ar: وَيَقُولُونَ لَوْلَا أُنْزِلَ عَلَيْهِ آيَةٌ مِنْ رَبِّهِ ۖ فَقُلْ إِنَّمَا الْغَيْبُ لِلَّهِ فَانْتَظِرُوا إِنِّي مَعَكُمْ مِنَ الْمُنْتَظِرِينَ
  trl: Wa-yaqūlūna lawlā unzila ʿalayhi āyatun min rabbihi — fa-qul innamā l-ghaybu li-llāhi fa-ntaẕirū innī maʿakum mina l-muntaẕirīn
  trad: 'Et ils disent : « Que ne fait-on pas descendre sur lui un signe (*āya*) de son Rabb ! » Dis alors : « Le *ghayb* n''appartient qu''à Allaah — attendez donc, je suis avec vous parmi ceux qui attendent. »'
- ref: S.10:21
  ar: وَإِذَا أَذَقْنَا النَّاسَ رَحْمَةً مِنْ بَعْدِ ضَرَّاءَ مَسَّتْهُمْ إِذَا لَهُمْ مَكْرٌ فِي آيَاتِنَا ۚ قُلِ اللَّهُ أَسْرَعُ مَكْرًا ۚ إِنَّ رُسُلَنَا يَكْتُبُونَ مَا تَمْكُرُونَ
  trl: Wa-idhā adhaqnā n-nāsa raḥmatan min baʿdi ḍarrāʾa massathum idhā lahum makrun fī āyātinā — quli llāhu asraʿu makran — inna rusulanā yaktubūna mā tamkurūn
  trad: 'Et quand Nous faisons goûter aux hommes une miséricorde après une affliction (*ḍarrāʾ*) qui les avait touchés, voici qu’ils usent d’une manœuvre (*makr*) à l’égard de Nos *āyāt*. Dis : « Allaah est plus prompt en manœuvre. » Nos mandatés (*rusulunā*) consignent par écrit ce que vous manœuvrez.'
- ref: S.10:22
  ar: هُوَ الَّذِي يُسَيِّرُكُمْ فِي الْبَرِّ وَالْبَحْرِ ۖ حَتَّىٰ إِذَا كُنْتُمْ فِي الْفُلْكِ وَجَرَيْنَ بِهِمْ بِرِيحٍ طَيِّبَةٍ وَفَرِحُوا بِهَا جَاءَتْهَا رِيحٌ عَاصِفٌ وَجَاءَهُمُ الْمَوْجُ مِنْ كُلِّ مَكَانٍ وَظَنُّوا أَنَّهُمْ أُحِيطَ بِهِمْ ۙ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ لَئِنْ أَنْجَيْتَنَا مِنْ هَٰذِهِ لَنَكُونَنَّ مِنَ الشَّاكِرِينَ
  trl: Huwa lladhī yusayyirukum fi l-barri wa-l-baḥri ḥattā idhā kuntum fi l-fulki wa-jarayna bihim bi-rīḥin ṭayyibatin wa-fariḥū bihā jāʾathā rīḥun ʿāṣifun wa-jāʾahumu l-mawju min kulli makānin wa-ẓannū annahum uḥīṭa bihim daʿawu llāha mukhliṣīna lahu d-dīna la-in anjaytanā min hādhihi la-nakūnanna mina sh-shākirīn
  trad: 'C’est Lui qui vous fait aller sur la terre ferme et sur la mer — jusqu’à ce que, alors que vous êtes dans le navire, que les navires les emportent par un vent agréable et qu’ils s’en réjouissent, un vent violent leur vienne, que la houle leur vienne de tout endroit, et qu’ils pensent qu’ils sont cernés sans échappatoire (*uḥīṭa bihim*) — ils invoquent Allaah, Lui vouant le *dīn* en toute exclusivité : « Si Tu nous sauves de ceci, nous serons certainement parmi les reconnaissants. »'
- ref: S.10:23
  ar: فَلَمَّا أَنْجَاهُمْ إِذَا هُمْ يَبْغُونَ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ ۗ يَا أَيُّهَا النَّاسُ إِنَّمَا بَغْيُكُمْ عَلَىٰ أَنْفُسِكُمْ ۖ مَتَاعَ الْحَيَاةِ الدُّنْيَا ۖ ثُمَّ إِلَيْنَا مَرْجِعُكُمْ فَنُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Fa-lammā anjāhum idhā hum yabghūna fi l-arḍi bi-ghayri l-ḥaqqi — yā ayyuhā n-nāsu innamā baghyukum ʿalā anfusikum — matāʿa l-ḥayāti d-dunyā — thumma ilaynā marjiʿukum fa-nunabbiʾukum bi-mā kuntum taʿmalūn
  trad: Puis, quand Il les a sauvés, voici qu’ils commettent l’excès (*baghy*) sur la terre, sans droit. Ô hommes, votre excès ne retombe que sur vous-mêmes — jouissance (*matāʿ*) de la vie d’ici-bas — puis c’est vers Nous votre retour, et Nous vous informerons de ce que vous faisiez.
- ref: S.10:24
  ar: إِنَّمَا مَثَلُ الْحَيَاةِ الدُّنْيَا كَمَاءٍ أَنْزَلْنَاهُ مِنَ السَّمَاءِ فَاخْتَلَطَ بِهِ نَبَاتُ الْأَرْضِ مِمَّا يَأْكُلُ النَّاسُ وَالْأَنْعَامُ حَتَّىٰ إِذَا أَخَذَتِ الْأَرْضُ زُخْرُفَهَا وَازَّيَّنَتْ وَظَنَّ أَهْلُهَا أَنَّهُمْ قَادِرُونَ عَلَيْهَا أَتَاهَا أَمْرُنَا لَيْلًا أَوْ نَهَارًا فَجَعَلْنَاهَا حَصِيدًا كَأَنْ لَمْ تَغْنَ بِالْأَمْسِ ۚ كَذَٰلِكَ نُفَصِّلُ الْآيَاتِ لِقَوْمٍ يَتَفَكَّرُونَ
  trl: Innamā mathalu l-ḥayāti d-dunyā ka-māʾin anzalnāhu mina s-samāʾi fa-khtalaṭa bihi nabātu l-arḍi mimmā yaʾkulu n-nāsu wa-l-anʿām ḥattā idhā akhadhati l-arḍu zukhrufahā wa-zzayyanat wa-ẓanna ahluhā annahum qādirūna ʿalayhā atāhā amrunā laylan aw nahāran fa-jaʿalnāhā ḥaṣīdan ka-an lam taghna bi-l-amsi — kadhālika nufaṣṣilu l-āyāti li-qawmin yatafakkarūn
  trad: L’exemple (*mathal*) de la vie d’ici-bas n’est que comme une eau que Nous faisons descendre du ciel, à laquelle se mêle la végétation de la terre dont mangent les hommes et le bétail — jusqu’à ce que, quand la terre a revêtu sa parure (*zukhruf*) et s’est embellie, et que ses habitants pensent qu’ils en ont pleine maîtrise (*qādirūna*), Notre ordre lui vienne, de nuit ou de jour, et que Nous en fassions une moisson fauchée, comme si elle n’avait pas été florissante la veille. C’est ainsi que Nous détaillons les *āyāt* pour un peuple qui réfléchit (*yatafakkarūn*).
- ref: S.10:25
  ar: وَاللَّهُ يَدْعُو إِلَىٰ دَارِ السَّلَامِ وَيَهْدِي مَنْ يَشَاءُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Wa-llāhu yadʿū ilā dāri s-salāmi wa-yahdī man yashāʾu ilā ṣirāṭin mustaqīm
  trad: Et Allaah appelle vers la Demeure de la *Salām*, et guide qui Il veut vers un chemin (*ṣirāṭ*) rectiligne.
- ref: S.10:26
  ar: ۞ لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ ۖ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌ وَلَا ذِلَّةٌ ۚ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Li-lladhīna aḥsanū l-ḥusnā wa-ziyādatun wa-lā yarhaqu wujūhahum qatarun wa-lā dhillatun — ulāʾika aṣḥābu l-jannati hum fīhā khālidūn
  trad: À ceux qui ont fait le bien (*aḥsanū*) revient *al-ḥusnā* — le meilleur — et un surcroît (*ziyādah*) ; nulle grisaille (*qatar*) ni nul avilissement (*dhilla*) ne recouvre leurs visages. Ceux-là sont les compagnons de la Jannah, ils y demeurent à jamais (*khālidūn*).
- ref: S.10:27
  ar: وَالَّذِينَ كَسَبُوا السَّيِّئَاتِ جَزَاءُ سَيِّئَةٍ بِمِثْلِهَا وَتَرْهَقُهُمْ ذِلَّةٌ ۖ مَا لَهُمْ مِنَ اللَّهِ مِنْ عَاصِمٍ ۖ كَأَنَّمَا أُغْشِيَتْ وُجُوهُهُمْ قِطَعًا مِنَ اللَّيْلِ مُظْلِمًا ۚ أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Wa-lladhīna kasabū s-sayyiʾāti jazāʾu sayyiʾatin bi-mithlihā wa-tarhaquhum dhillatun — mā lahum mina llāhi min ʿāṣimin — ka-annamā ughshiyat wujūhuhum qiṭaʿan mina l-layli muẓliman — ulāʾika aṣḥābu n-nāri hum fīhā khālidūn
  trad: 'Et ceux qui ont acquis les mauvaises actions — rétribution d’une mauvaise action à sa mesure — un avilissement (*dhilla*) les recouvre : nul protecteur (*ʿāṣim*) pour eux contre Allaah. C’est comme si leurs visages étaient recouverts de pans de nuit ténébreuse. Ceux-là sont les compagnons du Feu, ils y demeurent à jamais.'
- ref: S.10:28
  ar: وَيَوْمَ نَحْشُرُهُمْ جَمِيعًا ثُمَّ نَقُولُ لِلَّذِينَ أَشْرَكُوا مَكَانَكُمْ أَنْتُمْ وَشُرَكَاؤُكُمْ ۚ فَزَيَّلْنَا بَيْنَهُمْ ۖ وَقَالَ شُرَكَاؤُهُمْ مَا كُنْتُمْ إِيَّانَا تَعْبُدُونَ فَكَفَىٰ بِاللَّهِ شَهِيدًا بَيْنَنَا وَبَيْنَكُمْ إِنْ كُنَّا عَنْ عِبَادَتِكُمْ لَغَافِلِينَ
  trl: Wa-yawma naḥshuruhum jamīʿan thumma naqūlu li-lladhīna ashrakū makānakum antum wa-shurakāʾukum — fa-zayyalnā baynahum — wa-qāla shurakāʾuhum mā kuntum iyyānā taʿbudūn — fa-kafā bi-llāhi shahīdan baynanā wa-baynakum in kunnā ʿan ʿibādatikum la-ghāfilīn
  trad: 'Et le Jour où Nous les rassemblerons tous ensemble, puis Nous dirons à ceux qui ont pratiqué le *shirk* : « À votre place, vous et vos associés (*shurakāʾ*) ! » — Nous les séparerons alors (*fa-zayyalnā baynahum*), et leurs associés diront : « Ce n’est pas nous que vous adoriez. Allaah suffit comme témoin entre nous et vous — nous étions certes insouciants (*ghāfilīn*) de votre adoration. »'
- ref: S.10:30
  ar: هُنَالِكَ تَبْلُو كُلُّ نَفْسٍ مَا أَسْلَفَتْ ۚ وَرُدُّوا إِلَى اللَّهِ مَوْلَاهُمُ الْحَقِّ ۖ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ
  trl: Hunālika tablū kullu nafsin mā aslafat — wa-ruddū ila llāhi mawlāhumu l-ḥaqqi — wa-ḍalla ʿanhum mā kānū yaftarūn
  trad: Là, chaque âme éprouve (*tablū*) ce qu’elle a accompli par avance (*aslafat*) — et ils sont ramenés vers Allaah, leur Mawlā, le Vrai (*al-Ḥaqq*) — et ce qu’ils forgeaient (*yaftarūn*) s’égare loin d’eux.
- ref: S.10:31
  ar: قُلْ مَنْ يَرْزُقُكُمْ مِنَ السَّمَاءِ وَالْأَرْضِ أَمَّنْ يَمْلِكُ السَّمْعَ وَالْأَبْصَارَ وَمَنْ يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَيُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَمَنْ يُدَبِّرُ الْأَمْرَ ۚ فَسَيَقُولُونَ اللَّهُ ۚ فَقُلْ أَفَلَا تَتَّقُونَ فَذَٰلِكُمُ اللَّهُ رَبُّكُمُ الْحَقُّ ۖ فَمَاذَا بَعْدَ الْحَقِّ إِلَّا الضَّلَالُ ۖ فَأَنَّىٰ تُصْرَفُونَ
  trl: Qul man yarzuqukum mina s-samāʾi wa-l-arḍi amman yamliku s-samʿa wa-l-abṣāra wa-man yukhriju l-ḥayya mina l-mayyiti wa-yukhriju l-mayyita mina l-ḥayyi wa-man yudabbiru l-amra — fa-sa-yaqūlūna llāhu — fa-qul a-fa-lā tattaqūn — fa-dhālikumu llāhu rabbukumu l-ḥaqqu — fa-mādhā baʿda l-ḥaqqi illā ḍ-ḍalālu — fa-annā tuṣrafūn
  trad: 'Dis : « Qui vous pourvoit (*yarzuqukum*) depuis le ciel et la terre ? Ou qui détient (*yamliku*) l’ouïe et les regards ? Et qui fait sortir le vivant du mort, et fait sortir le mort du vivant ? Et qui administre l’affaire (*yudabbiru l-amr*) ? » Ils diront alors : « Allaah. » Dis alors : « Ne vous prémunissez-vous donc pas ? » Voilà donc Allaah, votre Rabb, le Vrai (*al-Ḥaqq*). Que reste-t-il, après le Vrai, sinon l’égarement ? Comment donc êtes-vous détournés ?'
- ref: S.10:33
  ar: كَذَٰلِكَ حَقَّتْ كَلِمَتُ رَبِّكَ عَلَى الَّذِينَ فَسَقُوا أَنَّهُمْ لَا يُؤْمِنُونَ
  trl: Kadhālika ḥaqqat kalimatu rabbika ʿalā lladhīna fasaqū annahum lā yuʾminūn
  trad: 'Ainsi s’est accomplie (*ḥaqqat*) la parole (*kalima*) de ton Rabb contre ceux qui ont commis le *fisq* (*fasaqū*) : ils ne croient pas.'
- ref: S.10:34
  ar: قُلْ هَلْ مِنْ شُرَكَائِكُمْ مَنْ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ ۚ قُلِ اللَّهُ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ ۖ فَأَنَّىٰ تُؤْفَكُونَ قُلْ هَلْ مِنْ شُرَكَائِكُمْ مَنْ يَهْدِي إِلَى الْحَقِّ ۚ قُلِ اللَّهُ يَهْدِي لِلْحَقِّ ۗ أَفَمَنْ يَهْدِي إِلَى الْحَقِّ أَحَقُّ أَنْ يُتَّبَعَ أَمَّنْ لَا يَهِدِّي إِلَّا أَنْ يُهْدَىٰ ۖ فَمَا لَكُمْ كَيْفَ تَحْكُمُونَ
  trl: Qul hal min shurakāʾikum man yabdaʾu l-khalqa thumma yuʿīduhu — quli llāhu yabdaʾu l-khalqa thumma yuʿīduhu — fa-annā tuʾfakūn — qul hal min shurakāʾikum man yahdī ila l-ḥaqqi — quli llāhu yahdī li-l-ḥaqqi — a-fa-man yahdī ila l-ḥaqqi aḥaqqu an yuttabaʿa amman lā yahiddī illā an yuhdā — fa-mā lakum kayfa taḥkumūn
  trad: 'Dis : « Parmi vos associés (*shurakāʾ*), en est-il qui commence la création (*yabdaʾu l-khalq*) puis la refait (*yuʿīduhu*) ? » Dis : « Allaah commence la création puis la refait. Comment donc êtes-vous détournés par le mensonge (*tuʾfakūn*) ? » Dis : « Parmi vos associés, en est-il qui guide vers le Vrai ? » Dis : « Allaah guide vers le Vrai. » Qui donc est le plus digne d’être suivi : qui guide vers le Vrai, ou ce qui ne se guide lui-même qu’à condition d’être guidé ? Qu’avez-vous donc ? Comment jugez-vous ?'
- ref: S.10:36
  ar: وَمَا يَتَّبِعُ أَكْثَرُهُمْ إِلَّا ظَنًّا ۚ إِنَّ الظَّنَّ لَا يُغْنِي مِنَ الْحَقِّ شَيْئًا ۚ إِنَّ اللَّهَ عَلِيمٌ بِمَا يَفْعَلُونَ
  trl: Wa-mā yattabiʿu aktharuhum illā ẓannan — inna ẓ-ẓanna lā yughnī mina l-ḥaqqi shayʾan — inna llāha ʿalīmun bi-mā yafʿalūn
  trad: Et la plupart d’entre eux ne suivent qu’une conjecture (*ẓann*) — or la conjecture ne dispense en rien du Vrai — Allaah est *ʿAlīm* de ce qu’ils font.
- ref: S.10:37
  ar: وَمَا كَانَ هَٰذَا الْقُرْآنُ أَنْ يُفْتَرَىٰ مِنْ دُونِ اللَّهِ وَلَٰكِنْ تَصْدِيقَ الَّذِي بَيْنَ يَدَيْهِ وَتَفْصِيلَ الْكِتَابِ لَا رَيْبَ فِيهِ مِنْ رَبِّ الْعَالَمِينَ أَمْ يَقُولُونَ افْتَرَاهُ ۖ قُلْ فَأْتُوا بِسُورَةٍ مِثْلِهِ وَادْعُوا مَنِ اسْتَطَعْتُمْ مِنْ دُونِ اللَّهِ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Wa-mā kāna hādhā l-qurʾānu an yuftarā min dūni llāhi wa-lākin taṣdīqa lladhī bayna yadayhi wa-tafṣīla l-kitābi lā rayba fīhi min rabbi l-ʿālamīn — am yaqūlūna ftarāhu — qul fa-ʾtū bi-sūratin mithlihi wa-dʿū mani staṭaʿtum min dūni llāhi in kuntum ṣādiqīn
  trad: 'Ce Qurʾān n’est pas de nature à être forgé (*yuftarā*) en dehors d’Allaah — mais il est confirmation (*taṣdīq*) de ce qui le précède, et détail (*tafṣīl*) du Livre, sans aucun doute (*rayb*) possible à son sujet, venant du Rabb des mondes. Ou bien disent-ils : « Il l’a forgé » ? Dis : « Apportez donc une *sūra* semblable à lui, et appelez qui vous pourrez en dehors d’Allaah, si vous êtes véridiques. »'
- ref: S.10:39
  ar: بَلْ كَذَّبُوا بِمَا لَمْ يُحِيطُوا بِعِلْمِهِ وَلَمَّا يَأْتِهِمْ تَأْوِيلُهُ ۚ كَذَٰلِكَ كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ ۖ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الظَّالِمِينَ
  trl: Bal kadhdhabū bimā lam yuḥīṭū bi-ʿilmihi wa-lammā yaʾtihim taʾwīluhu — kadhālika kadhdhaba lladhīna min qablihim — fa-nẓur kayfa kāna ʿāqibatu ẓ-ẓālimīn
  trad: Ils ont plutôt démenti ce dont ils n’ont pas embrassé la science (*lam yuḥīṭū bi-ʿilmihi*), et dont l’aboutissement (*taʾwīl*) ne leur est pas encore venu. C’est ainsi que démentaient ceux d’avant eux — regarde donc ce qu’il est advenu (*ʿāqiba*) des *ẓālimūn*.
- ref: S.10:40
  ar: وَمِنْهُمْ مَنْ يُؤْمِنُ بِهِ وَمِنْهُمْ مَنْ لَا يُؤْمِنُ بِهِ ۚ وَرَبُّكَ أَعْلَمُ بِالْمُفْسِدِينَ
  trl: Wa-minhum man yuʾminu bihi wa-minhum man lā yuʾminu bihi — wa-rabbuka aʿlamu bi-l-mufsidīn
  trad: Et parmi eux, il en est qui y croient, et parmi eux, il en est qui n’y croient pas — et ton Rabb connaît mieux les *mufsidūn*.
- ref: S.10:41
  ar: وَإِنْ كَذَّبُوكَ فَقُلْ لِي عَمَلِي وَلَكُمْ عَمَلُكُمْ ۖ أَنْتُمْ بَرِيئُونَ مِمَّا أَعْمَلُ وَأَنَا بَرِيءٌ مِمَّا تَعْمَلُونَ
  trl: Wa-in kadhdhabūka fa-qul lī ʿamalī wa-lakum ʿamalukum — antum barīʾūna mimmā aʿmalu wa-anā barīʾun mimmā taʿmalūn
  trad: 'Et s''ils te démentent, dis : « À moi mon œuvre, à vous la vôtre — vous êtes exempts (*barīʾūn*) de ce que je fais, et je suis exempt (*barīʾ*) de ce que vous faites. »'
- ref: S.10:42
  ar: وَمِنْهُمْ مَنْ يَسْتَمِعُونَ إِلَيْكَ ۚ أَفَأَنْتَ تُسْمِعُ الصُّمَّ وَلَوْ كَانُوا لَا يَعْقِلُونَ
  trl: Wa-minhum man yastamiʿūna ilayka — a-fa-anta tusmiʿu ṣ-ṣumma wa-law kānū lā yaʿqilūn
  trad: Et parmi eux, il en est qui te prêtent l'écoute (*yastamiʿūna*) — est-ce donc toi qui ferais entendre les sourds, même s'ils ne raisonnent pas (*yaʿqilūn*) ?
- ref: S.10:43
  ar: وَمِنْهُمْ مَنْ يَنْظُرُ إِلَيْكَ ۚ أَفَأَنْتَ تَهْدِي الْعُمْيَ وَلَوْ كَانُوا لَا يُبْصِرُونَ
  trl: Wa-minhum man yanẕuru ilayka — a-fa-anta tahdī l-ʿumya wa-law kānū lā yubṣirūn
  trad: Et parmi eux, il en est qui te regardent (*yanẕuru*) — est-ce donc toi qui guiderais les aveugles, même s'ils ne perçoivent pas (*yubṣirūn*) ?
- ref: S.10:44
  ar: إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنْفُسَهُمْ يَظْلِمُونَ
  trl: Inna llāha lā yaẕlimu n-nāsa shayʾan wa-lākinna n-nāsa anfusahum yaẕlimūn
  trad: Allaah ne lèse (*yaẕlimu*) en rien les hommes — mais ce sont les hommes qui se lèsent eux-mêmes.
- ref: S.10:45
  ar: وَيَوْمَ يَحْشُرُهُمْ كَأَنْ لَمْ يَلْبَثُوا إِلَّا سَاعَةً مِنَ النَّهَارِ يَتَعَارَفُونَ بَيْنَهُمْ ۚ قَدْ خَسِرَ الَّذِينَ كَذَّبُوا بِلِقَاءِ اللَّهِ وَمَا كَانُوا مُهْتَدِينَ
  trl: Wa-yawma yaḥshuruhum ka-an lam yalbathū illā sāʿatan mina n-nahāri yataʿārafūna baynahum — qad khasira lladhīna kadhdhabū bi-liqāʾi llāhi wa-mā kānū muhtadīn
  trad: Et le Jour où Il les rassemblera, ce sera comme s'ils n'avaient demeuré qu'une heure du jour, se reconnaissant entre eux (*yataʿārafūna*) — ils ont certes perdu (*khasira*), ceux qui ont démenti la Rencontre d'Allaah (*liqāʾ Allaah*), et n'ont pas été guidés.
- ref: S.10:46
  ar: وَإِمَّا نُرِيَنَّكَ بَعْضَ الَّذِي نَعِدُهُمْ أَوْ نَتَوَفَّيَنَّكَ فَإِلَيْنَا مَرْجِعُهُمْ ثُمَّ اللَّهُ شَهِيدٌ عَلَىٰ مَا يَفْعَلُونَ
  trl: Wa-immā nuriyannaka baʿḑa lladhī naʿiduhum aw natawaffayannaka fa-ilaynā marjiʿuhum thumma llāhu shahīdun ʿalā mā yafʿalūn
  trad: Et que Nous te fassions voir une part de ce que Nous leur promettons, ou que Nous te reprenions (*natawaffayannaka*) [avant] — c'est vers Nous qu'est leur retour ; puis Allaah est témoin (*shahīd*) de ce qu'ils font.
- ref: S.10:47
  ar: وَلِكُلِّ أُمَّةٍ رَسُولٌ ۖ فَإِذَا جَاءَ رَسُولُهُمْ قُضِيَ بَيْنَهُمْ بِالْقِسْطِ وَهُمْ لَا يُظْلَمُونَ
  trl: Wa-li-kulli ummatin rasūlun — fa-idhā jāʾa rasūluhum quḑiya baynahum bi-l-qisṭi wa-hum lā yuẕlamūn
  trad: Et à chaque *umma* un *rasūl* — et quand leur *rasūl* est venu, il est tranché entre eux selon le *qisṭ*, et ils ne sont pas lésés.
- ref: S.10:48
  ar: وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Wa-yaqūlūna matā hādhā l-waʿdu in kuntum ṣādiqīn
  trad: 'Et ils disent : « Quand [se réalisera] cette promesse, si vous êtes véridiques ? »'
- ref: S.10:49
  ar: قُلْ لَا أَمْلِكُ لِنَفْسِي ضَرًّا وَلَا نَفْعًا إِلَّا مَا شَاءَ اللَّهُ ۗ لِكُلِّ أُمَّةٍ أَجَلٌ ۚ إِذَا جَاءَ أَجَلُهُمْ فَلَا يَسْتَأْخِرُونَ سَاعَةً ۖ وَلَا يَسْتَقْدِمُونَ
  trl: Qul lā amliku li-nafsī ḑarran wa-lā nafʿan illā mā shāʾa llāhu — li-kulli ummatin ajalun — idhā jāʾa ajaluhum fa-lā yastaʾkhirūna sāʿatan wa-lā yastaqdimūn
  trad: 'Dis : « Je ne détiens pour moi-même ni tort (*ḑarr*) ni profit, sauf ce que veut Allaah. À chaque *umma* un terme (*ajal*) — quand leur terme vient, ils ne le retardent ni ne l''avancent d''une heure. »'
- ref: S.10:50
  ar: قُلْ أَرَأَيْتُمْ إِنْ أَتَاكُمْ عَذَابُهُ بَيَاتًا أَوْ نَهَارًا مَاذَا يَسْتَعْجِلُ مِنْهُ الْمُجْرِمُونَ
  trl: Qul a-raʾaytum in atākum ʿadhābuhu bayātan aw nahāran mādhā yastaʿjilu minhu l-mujrimūn
  trad: 'Dis : « Voyez-vous ? Si Son châtiment vous vient de nuit ou de jour, qu''est-ce que les *mujrimūn* en hâtent (*yastaʿjilu*) tant ? »'
- ref: S.10:51
  ar: أَثُمَّ إِذَا مَا وَقَعَ آمَنْتُمْ بِهِ ۚ آلْآنَ وَقَدْ كُنْتُمْ بِهِ تَسْتَعْجِلُونَ
  trl: A-thumma idhā mā waqaʿa āmantum bihi — al-āna wa-qad kuntum bihi tastaʿjilūn
  trad: Est-ce donc seulement quand [le châtiment] survient que vous y croyez ? — Maintenant [seulement] ? — alors que vous cherchiez à le hâter (*tastaʿjilūn*) !
- ref: S.10:52
  ar: ثُمَّ قِيلَ لِلَّذِينَ ظَلَمُوا ذُوقُوا عَذَابَ الْخُلْدِ هَلْ تُجْزَوْنَ إِلَّا بِمَا كُنْتُمْ تَكْسِبُونَ
  trl: Thumma qīla li-lladhīna ẕalamū dhūqū ʿadhāba l-khuldi hal tujzawna illā bi-mā kuntum taksibūn
  trad: 'Puis il sera dit à ceux qui ont commis le *ẕulm* : « Goûtez le châtiment de la perpétuité (*khuld*) — n''êtes-vous rétribués que selon ce que vous acquériez ? »'
- ref: S.10:53
  ar: ۞ وَيَسْتَنْبِئُونَكَ أَحَقٌّ هُوَ ۖ قُلْ إِي وَرَبِّي إِنَّهُ لَحَقٌّ ۖ وَمَا أَنْتُمْ بِمُعْجِزِينَ
  trl: Wa-yastanbiʾūnaka a-ḥaqqun huwa — qul ī wa-rabbī innahu la-ḥaqqun — wa-mā antum bi-muʿjizīn
  trad: 'Et ils te demandent de les informer (*yastanbiʾūnaka*) : « Est-ce vrai ? » Dis : « Oui, par mon Rabb, c''est certes vrai — et vous ne pouvez vous y soustraire (*muʿjizīn*). »'
- ref: S.10:54
  ar: وَلَوْ أَنَّ لِكُلِّ نَفْسٍ ظَلَمَتْ مَا فِي الْأَرْضِ لَافْتَدَتْ بِهِ ۗ وَأَسَرُّوا النَّدَامَةَ لَمَّا رَأَوُا الْعَذَابَ ۖ وَقُضِيَ بَيْنَهُمْ بِالْقِسْطِ ۚ وَهُمْ لَا يُظْلَمُونَ
  trl: Wa-law anna li-kulli nafsin ẕalamat mā fi l-arḑi la-ftadat bihi — wa-asarrū n-nadāmata lammā raʾawu l-ʿadhāba — wa-quḑiya baynahum bi-l-qisṭi wa-hum lā yuẕlamūn
  trad: Et si chaque âme qui a commis le *ẕulm* possédait tout ce qui est sur la terre, elle le donnerait certes en rançon (*iftadat*). Ils dissimulent le regret (*asarrū n-nadāma*) quand ils voient le châtiment — et il est tranché entre eux selon le *qisṭ*, et ils ne sont pas lésés.
- ref: S.10:55
  ar: أَلَا إِنَّ لِلَّهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۗ أَلَا إِنَّ وَعْدَ اللَّهِ حَقٌّ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
  trl: A-lā inna li-llāhi mā fi s-samāwāti wa-l-arḑi — a-lā inna waʿda llāhi ḥaqqun wa-lākinna aktharahum lā yaʿlamūn
  trad: N'est-ce pas qu'à Allaah appartient ce qui est dans les cieux et sur la terre ? N'est-ce pas que la promesse d'Allaah est vraie ? — mais la plupart d'entre eux ne savent pas.
- ref: S.10:56
  ar: هُوَ يُحْيِي وَيُمِيتُ وَإِلَيْهِ تُرْجَعُونَ
  trl: Huwa yuḥyī wa-yumītu wa-ilayhi turjaʿūn
  trad: C'est Lui qui donne la vie et donne la mort — et c'est vers Lui que vous serez ramenés.
- ref: S.10:57
  ar: يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ
  trl: Yā ayyuhā n-nāsu qad jāʾatkum mawʿiẓatun min rabbikum wa-shifāʾun li-mā fī ṣ-ṣudūri wa-hudan wa-raḥmatun li-l-muʾminīn
  trad: Ô hommes, un rappel (*mawʿiẓa*) vous est certes venu de votre Rabb, une guérison (*shifāʾ*) pour ce qui est dans les poitrines, une guidance (*hudā*) et une miséricorde (*raḥma*) pour les croyants.
- ref: S.10:58
  ar: قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ
  trl: Qul bi-faḑli llāhi wa-bi-raḥmatihi fa-bi-dhālika fa-l-yafraḥū huwa khayrun mimmā yajmaʿūn
  trad: 'Dis : « Par la faveur (*faḑl*) d''Allaah et par Sa miséricorde — que de cela ils se réjouissent. Cela est meilleur que ce qu''ils amassent. »'
- ref: S.10:59
  ar: قُلْ أَرَأَيْتُمْ مَا أَنْزَلَ اللَّهُ لَكُمْ مِنْ رِزْقٍ فَجَعَلْتُمْ مِنْهُ حَرَامًا وَحَلَالًا قُلْ آللَّهُ أَذِنَ لَكُمْ ۖ أَمْ عَلَى اللَّهِ تَفْتَرُونَ
  trl: Qul a-raʾaytum mā anzala llāhu lakum min rizqin fa-jaʿaltum minhu ḥarāman wa-ḥalālan — qul āllāhu adhina lakum am ʿalā llāhi taftarūn
  trad: 'Dis : « Voyez-vous ce qu''Allaah a fait descendre pour vous comme subsistance (*rizq*), et que vous en avez fait *ḥarām* et *ḥalāl* ? » Dis : « Est-ce Allaah qui vous l''a autorisé (*adhina*), ou forgez-vous (*taftarūn*) un mensonge contre Allaah ? »'
- ref: S.10:60
  ar: وَمَا ظَنُّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ يَوْمَ الْقِيَامَةِ ۗ إِنَّ اللَّهَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَ
  trl: Wa-mā ẓannu lladhīna yaftarūna ʿalā llāhi l-kadhiba yawma l-qiyāmati — inna llāha la-dhū faḍlin ʿalā n-nāsi wa-lākinna aktharahum lā yashkurūn
  trad: Et quelle est donc la pensée (*ẕann*) de ceux qui forgent le mensonge contre Allaah, au Jour de la Résurrection (*yawm al-qiyāma*) ? — Allaah est certes détenteur de *faḑl* envers les hommes, mais la plupart d'entre eux ne sont pas reconnaissants (*yashkurūn*).
- ref: S.10:61
  ar: وَمَا تَكُونُ فِي شَأْنٍ وَمَا تَتْلُو مِنْهُ مِنْ قُرْآنٍ وَلَا تَعْمَلُونَ مِنْ عَمَلٍ إِلَّا كُنَّا عَلَيْكُمْ شُهُودًا إِذْ تُفِيضُونَ فِيهِ ۚ وَمَا يَعْزُبُ عَنْ رَبِّكَ مِنْ مِثْقَالِ ذَرَّةٍ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَلَا أَصْغَرَ مِنْ ذَٰلِكَ وَلَا أَكْبَرَ إِلَّا فِي كِتَابٍ مُبِينٍ
  trl: Wa-mā takūnu fī shaʾnin wa-mā tatlū minhu min qurʾānin wa-lā taʿmalūna min ʿamalin illā kunnā ʿalaykum shuhūdan idh tufīḑūna fīhi — wa-mā yaʿzubu ʿan rabbika min mithqāli dharratin fi l-arḑi wa-lā fi s-samāʾi wa-lā aṣghara min dhālika wa-lā akbara illā fī kitābin mubīn
  trad: Et tu ne te trouves dans aucune situation (*shaʾn*), tu ne récites de lui aucun *qurʾān*, vous n'accomplissez aucune œuvre, sans que Nous soyons témoins sur vous au moment où vous vous y engagez (*tufīḑūna*) — et rien n'échappe (*yaʿzubu*) à ton Rabb, pas même le poids d'un atome (*mithqāl dharra*), sur la terre ni dans le ciel, rien de plus petit ni de plus grand que cela, qui ne soit dans un Kitāb manifeste.
- ref: S.10:62
  ar: أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: A-lā inna awliyāʾa llāhi lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: N'est-ce pas que les *awliyāʾ* d'Allaah n'ont aucune crainte (*khawf*) sur eux, et ne sont pas non plus attristés (*yaḥzanūn*) ?
- ref: S.10:63
  ar: الَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ
  trl: Alladhīna āmanū wa-kānū yattaqūn
  trad: Ceux qui ont cru et se prémunissaient (*yattaqūn*).
- ref: S.10:64
  ar: لَهُمُ الْبُشْرَىٰ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ ۚ لَا تَبْدِيلَ لِكَلِمَاتِ اللَّهِ ۚ ذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ
  trl: Lahumu l-bushrā fi l-ḥayāti d-dunyā wa-fi l-ākhirati — lā tabdīla li-kalimāti llāhi — dhālika huwa l-fawzu l-ʿaẕīm
  trad: À eux la bonne annonce (*bushrā*), dans la vie d'ici-bas et dans l'Au-delà — nul changement (*tabdīl*) aux paroles (*kalimāt*) d'Allaah — voilà le succès immense (*al-fawz al-ʿaẕīm*).
- ref: S.10:65
  ar: وَلَا يَحْزُنْكَ قَوْلُهُمْ ۘ إِنَّ الْعِزَّةَ لِلَّهِ جَمِيعًا ۚ هُوَ السَّمِيعُ الْعَلِيمُ
  trl: Wa-lā yaḥzunka qawluhum — inna l-ʿizzata li-llāhi jamīʿan — huwa s-Samīʿu l-ʿAlīm
  trad: Et que leur parole ne t'attriste pas (*lā yaḥzunka*) — l'*ʿizza* appartient à Allaah tout entière — Il est *as-Samīʿ*, *al-ʿAlīm*.
- ref: S.10:66
  ar: أَلَا إِنَّ لِلَّهِ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ ۗ وَمَا يَتَّبِعُ الَّذِينَ يَدْعُونَ مِنْ دُونِ اللَّهِ شُرَكَاءَ ۚ إِنْ يَتَّبِعُونَ إِلَّا الظَّنَّ وَإِنْ هُمْ إِلَّا يَخْرُصُونَ
  trl: A-lā inna li-llāhi man fi s-samāwāti wa-man fi l-arḑi — wa-mā yattabiʿu lladhīna yadʿūna min dūni llāhi shurakāʾa — in yattabiʿūna illā ẓ-ẓanna wa-in hum illā yakhruṣūn
  trad: N'est-ce pas qu'à Allaah appartient qui est dans les cieux et qui est sur la terre ? Et ceux qui invoquent des associés (*shurakāʾ*) en dehors d'Allaah ne suivent rien de réel — ils ne suivent que la conjecture (*ẕann*), et ils ne font que spéculer sans fondement (*yakhruṣūn*).
- ref: S.10:67
  ar: هُوَ الَّذِي جَعَلَ لَكُمُ اللَّيْلَ لِتَسْكُنُوا فِيهِ وَالنَّهَارَ مُبْصِرًا ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَسْمَعُونَ
  trl: Huwa lladhī jaʿala lakumu l-layla li-taskunū fīhi wa-n-nahāra mubṣiran — inna fī dhālika la-āyātin li-qawmin yasmaʿūn
  trad: C'est Lui qui a fait pour vous la nuit pour que vous vous y reposiez (*li-taskunū*), et le jour pour voir (*mubṣiran*) — il y a certes en cela des *āyāt* pour un peuple qui entend.
- ref: S.10:68
  ar: قَالُوا اتَّخَذَ اللَّهُ وَلَدًا ۗ سُبْحَانَهُ ۖ هُوَ الْغَنِيُّ ۖ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۚ إِنْ عِنْدَكُمْ مِنْ سُلْطَانٍ بِهَٰذَا ۚ أَتَقُولُونَ عَلَى اللَّهِ مَا لَا تَعْلَمُونَ
  trl: Qālū ttakhadha llāhu waladan — subḥānahu — huwa l-Ghaniyyu — lahu mā fi s-samāwāti wa-mā fi l-arḑi — in ʿindakum min sulṭānin bi-hādhā — a-taqūlūna ʿalā llāhi mā lā taʿlamūn
  trad: 'Ils disent : « Allaah a pris un enfant (*walad*). » Gloire à Lui (*subḥānahu*) — Il est *al-Ghaniyy* — à Lui ce qui est dans les cieux et ce qui est sur la terre. Vous n''avez aucune autorité (*sulṭān*) pour cela — dites-vous sur Allaah ce que vous ne savez pas ?'
- ref: S.10:69
  ar: قُلْ إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ لَا يُفْلِحُونَ
  trl: Qul inna lladhīna yaftarūna ʿalā llāhi l-kadhiba lā yufliḥūn
  trad: 'Dis : « Ceux qui forgent le mensonge contre Allaah ne réussissent pas (*lā yufliḥūn*). »'
- ref: S.10:70
  ar: مَتَاعٌ فِي الدُّنْيَا ثُمَّ إِلَيْنَا مَرْجِعُهُمْ ثُمَّ نُذِيقُهُمُ الْعَذَابَ الشَّدِيدَ بِمَا كَانُوا يَكْفُرُونَ
  trl: Matāʿun fi d-dunyā thumma ilaynā marjiʿuhum thumma nudhīquhumu l-ʿadhāba sh-shadīda bi-mā kānū yakfurūn
  trad: Jouissance (*matāʿ*) limitée ici-bas — puis c'est vers Nous leur retour — puis Nous leur faisons goûter le châtiment sévère, pour le *kufr* qu'ils commettaient.
- ref: S.10:71
  ar: ۞ وَاتْلُ عَلَيْهِمْ نَبَأَ نُوحٍ إِذْ قَالَ لِقَوْمِهِ يَا قَوْمِ إِنْ كَانَ كَبُرَ عَلَيْكُمْ مَقَامِي وَتَذْكِيرِي بِآيَاتِ اللَّهِ فَعَلَى اللَّهِ تَوَكَّلْتُ فَأَجْمِعُوا أَمْرَكُمْ وَشُرَكَاءَكُمْ ثُمَّ لَا يَكُنْ أَمْرُكُمْ عَلَيْكُمْ غُمَّةً ثُمَّ اقْضُوا إِلَيَّ وَلَا تُنْظِرُونِ
  trl: Wa-tlu ʿalayhim nabaʾa nūḥin idh qāla li-qawmihi yā qawmi in kāna kabura ʿalaykum maqāmī wa-tadhkīrī bi-āyāti llāhi fa-ʿalā llāhi tawakkaltu fa-ajmiʿū amrakum wa-shurakāʾakum thumma lā yakun amrukum ʿalaykum ghummatan thumma qḑū ilayya wa-lā tunẕirūn
  trad: 'Et récite-leur le récit (*nabaʾ*) de Nūḥ, quand il dit à son peuple : « Ô mon peuple, si ma présence (*maqāmī*) et mon rappel (*tadhkīrī*) par les *āyāt* d''Allaah vous pèsent (*kabura ʿalaykum*), c''est sur Allaah que je me suis appuyé (*tawakkaltu*) — réunissez donc votre affaire, vous et vos associés (*shurakāʾakum*), que votre affaire ne soit plus ensuite pour vous une chose indistincte (*ghumma*), puis décidez à mon sujet, et ne m''accordez aucun délai. »'
- ref: S.10:72
  ar: فَإِنْ تَوَلَّيْتُمْ فَمَا سَأَلْتُكُمْ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَى اللَّهِ ۖ وَأُمِرْتُ أَنْ أَكُونَ مِنَ الْمُسْلِمِينَ
  trl: Fa-in tawallaytum fa-mā saʾaltukum min ajrin — in ajriya illā ʿalā llāhi — wa-umirtu an akūna mina l-muslimīn
  trad: Et si vous vous détournez (*tawallaytum*), je ne vous ai demandé aucun salaire (*ajr*) — mon salaire n'incombe qu'à Allaah — et il m'a été ordonné d'être du nombre des *muslimīn*. »
- ref: S.10:73
  ar: فَكَذَّبُوهُ فَنَجَّيْنَاهُ وَمَنْ مَعَهُ فِي الْفُلْكِ وَجَعَلْنَاهُمْ خَلَائِفَ وَأَغْرَقْنَا الَّذِينَ كَذَّبُوا بِآيَاتِنَا ۖ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُنْذَرِينَ
  trl: Fa-kadhdhabūhu fa-najjaynāhu wa-man maʿahu fi l-fulki wa-jaʿalnāhum khalāʾifa wa-aghraqnā lladhīna kadhdhabū bi-āyātinā — fa-nẕur kayfa kāna ʿāqibatu l-munẕarīn
  trad: Ils le traitèrent de menteur — Nous le sauvâmes (*najjaynāhu*), lui et ceux qui étaient avec lui, dans l'arche (*al-fulk*), et Nous fîmes d'eux des successeurs (*khalāʾif*) — et Nous noyâmes ceux qui avaient traité Nos *āyāt* de mensonge — regarde donc quelle fut la fin de ceux qui avaient été avertis (*al-munẕarīn*).
- ref: S.10:74
  ar: ثُمَّ بَعَثْنَا مِنْ بَعْدِهِ رُسُلًا إِلَىٰ قَوْمِهِمْ فَجَاءُوهُمْ بِالْبَيِّنَاتِ فَمَا كَانُوا لِيُؤْمِنُوا بِمَا كَذَّبُوا بِهِ مِنْ قَبْلُ ۚ كَذَٰلِكَ نَطْبَعُ عَلَىٰ قُلُوبِ الْمُعْتَدِينَ
  trl: Thumma baʿathnā min baʿdihi rusulan ilā qawmihim fa-jāʾūhum bi-l-bayyināti fa-mā kānū li-yuʾminū bi-mā kadhdhabū bihi min qablu — ka-dhālika naṭbaʿu ʿalā qulūbi l-muʿtadīn
  trad: 'Puis Nous envoyâmes après lui des *rusul* vers leurs peuples respectifs — ils leur vinrent avec les preuves manifestes (*al-bayyināt*), mais ils n''étaient pas disposés à croire en ce qu''ils avaient auparavant démenti : ainsi Nous scellons (*naṭbaʿu*) les cœurs des transgresseurs (*al-muʿtadīn*).'
- ref: S.10:75
  ar: ثُمَّ بَعَثْنَا مِنْ بَعْدِهِمْ مُوسَىٰ وَهَارُونَ إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ بِآيَاتِنَا فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُجْرِمِينَ
  trl: Thumma baʿathnā min baʿdihim mūsā wa-hārūna ilā firʿawna wa-malaʾihi bi-āyātinā fa-stakbarū wa-kānū qawman mujrimīn
  trad: Puis Nous envoyâmes après eux Mūsā et Hārūn vers Firʿawn et son assemblée (*malaʾ*), avec Nos *āyāt* — ils s'enorgueillirent (*istakbarū*) et furent un peuple de *mujrimūn*.
- ref: S.10:76
  ar: فَلَمَّا جَاءَهُمُ الْحَقُّ مِنْ عِنْدِنَا قَالُوا إِنَّ هَٰذَا لَسِحْرٌ مُبِينٌ
  trl: Fa-lammā jāʾahumu l-ḥaqqu min ʿindinā qālū inna hādhā la-siḥrun mubīn
  trad: 'Et quand le *ḥaqq* leur vint de Notre part, ils dirent : « Voilà bien une magie (*siḥr*) manifeste. »'
- ref: S.10:77
  ar: قَالَ مُوسَىٰ أَتَقُولُونَ لِلْحَقِّ لَمَّا جَاءَكُمْ ۖ أَسِحْرٌ هَٰذَا وَلَا يُفْلِحُ السَّاحِرُونَ
  trl: Qāla mūsā a-taqūlūna li-l-ḥaqqi lammā jāʾakum — a-siḥrun hādhā — wa-lā yufliḥu s-sāḥirūn
  trad: 'Mūsā dit : « Dites-vous cela du *ḥaqq*, une fois qu''il vous est venu ? Est-ce là de la magie ? — Or les magiciens (*as-sāḥirūn*) ne réussissent pas (*lā yufliḥu*). »'
- ref: S.10:78
  ar: قَالُوا أَجِئْتَنَا لِتَلْفِتَنَا عَمَّا وَجَدْنَا عَلَيْهِ آبَاءَنَا وَتَكُونَ لَكُمَا الْكِبْرِيَاءُ فِي الْأَرْضِ وَمَا نَحْنُ لَكُمَا بِمُؤْمِنِينَ
  trl: Qālū a-jiʾtanā li-talfitanā ʿammā wajadnā ʿalayhi ābāʾanā wa-takūna lakumā l-kibriyāʾu fi l-arḑi wa-mā naḥnu lakumā bi-muʾminīn
  trad: 'Ils dirent : « Es-tu venu à nous pour nous détourner (*li-talfitanā*) de ce sur quoi nous avons trouvé nos pères, et pour que la domination orgueilleuse (*al-kibriyāʾ*) revienne à vous deux sur la terre ? Nous ne sommes pas croyants en vous deux. »'
- ref: S.10:79
  ar: وَقَالَ فِرْعَوْنُ ائْتُونِي بِكُلِّ سَاحِرٍ عَلِيمٍ
  trl: Wa-qāla firʿawnu ītūnī bi-kulli sāḥirin ʿalīm
  trad: 'Et Firʿawn dit : « Amenez-moi tout magicien savant (*ʿalīm*). »'
- ref: S.10:80
  ar: فَلَمَّا جَاءَ السَّحَرَةُ قَالَ لَهُمْ مُوسَىٰ أَلْقُوا مَا أَنْتُمْ مُلْقُونَ
  trl: Fa-lammā jāʾa s-saḥaratu qāla lahum mūsā alqū mā antum mulqūn
  trad: 'Et quand les magiciens (*as-saḥara*) vinrent, Mūsā leur dit : « Jetez ce que vous avez à jeter. »'
- ref: S.10:81
  ar: فَلَمَّا أَلْقَوْا قَالَ مُوسَىٰ مَا جِئْتُمْ بِهِ السِّحْرُ ۖ إِنَّ اللَّهَ سَيُبْطِلُهُ ۖ إِنَّ اللَّهَ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ
  trl: Fa-lammā alqaw qāla mūsā mā jiʾtum bihi s-siḥru — inna llāha sa-yubṭiluhu — inna llāha lā yuṣliḥu ʿamala l-mufsidīn
  trad: 'Et quand ils eurent jeté, Mūsā dit : « Ce que vous avez apporté est la magie (*as-siḥr*) — Allaah va certes l''annuler (*sa-yubṭiluhu*) — Allaah ne fait pas prospérer (*lā yuṣliḥu*) l''œuvre des *mufsidīn*. »'
- ref: S.10:82
  ar: وَيُحِقُّ اللَّهُ الْحَقَّ بِكَلِمَاتِهِ وَلَوْ كَرِهَ الْمُجْرِمُونَ
  trl: Wa-yuḥiqqu llāhu l-ḥaqqa bi-kalimātihi wa-law kariha l-mujrimūn
  trad: Et Allaah établit fermement (*yuḥiqqu*) le *ḥaqq* par Ses paroles (*bi-kalimātihi*), même si les *mujrimūn* le détestent (*kariha*).
- ref: S.10:83
  ar: فَمَا آمَنَ لِمُوسَىٰ إِلَّا ذُرِّيَّةٌ مِنْ قَوْمِهِ عَلَىٰ خَوْفٍ مِنْ فِرْعَوْنَ وَمَلَئِهِمْ أَنْ يَفْتِنَهُمْ ۚ وَإِنَّ فِرْعَوْنَ لَعَالٍ فِي الْأَرْضِ وَإِنَّهُ لَمِنَ الْمُسْرِفِينَ
  trl: Fa-mā āmana li-mūsā illā dhurriyyatun min qawmihi ʿalā khawfin min firʿawna wa-malaʾihim an yaftinahum — wa-inna firʿawna la-ʿālin fi l-arḑi wa-innahu la-mina l-musrifīn
  trad: Nul ne crut en Mūsā, sinon une descendance (*dhurriyya*) de son peuple, dans la crainte que Firʿawn et leur assemblée ne les éprouve (*yaftinahum*) — Firʿawn était certes dominateur (*la-ʿālin*) sur la terre, et il était certes du nombre des excessifs (*al-musrifīn*).
- ref: S.10:84
  ar: وَقَالَ مُوسَىٰ يَا قَوْمِ إِنْ كُنْتُمْ آمَنْتُمْ بِاللَّهِ فَعَلَيْهِ تَوَكَّلُوا إِنْ كُنْتُمْ مُسْلِمِينَ
  trl: Wa-qāla mūsā yā qawmi in kuntum āmantum bi-llāhi fa-ʿalayhi tawakkalū in kuntum muslimīn
  trad: 'Mūsā dit : « Ô mon peuple, si vous croyez en Allaah, appuyez-vous (*tawakkalū*) sur Lui, si vous êtes *muslimīn*. »'
- ref: S.10:85
  ar: فَقَالُوا عَلَى اللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلْقَوْمِ الظَّالِمِينَ
  trl: Fa-qālū ʿalā llāhi tawakkalnā rabbanā lā tajʿalnā fitnatan li-l-qawmi ẕ-ẕālimīn
  trad: 'Ils dirent : « Sur Allaah nous nous appuyons (*tawakkalnā*) — notre Rabb, ne fais pas de nous une épreuve (*fitna*) pour le peuple *ẕālim*. »'
- ref: S.10:86
  ar: وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ
  trl: Wa-najjinā bi-raḥmatika mina l-qawmi l-kāfirīn
  trad: « Et sauve-nous, par Ta *raḥma*, du peuple *kāfir*. »
- ref: S.10:87
  ar: وَأَوْحَيْنَا إِلَىٰ مُوسَىٰ وَأَخِيهِ أَنْ تَبَوَّآ لِقَوْمِكُمَا بِمِصْرَ بُيُوتًا وَاجْعَلُوا بُيُوتَكُمْ قِبْلَةً وَأَقِيمُوا الصَّلَاةَ ۗ وَبَشِّرِ الْمُؤْمِنِينَ
  trl: Wa-awḥaynā ilā mūsā wa-akhīhi an tabawwaʾā li-qawmikumā bi-miṣra buyūtan wa-jʿalū buyūtakum qiblatan wa-aqīmū ṣ-ṣalāta — wa-bashshiri l-muʾminīn
  trad: 'Et Nous révélâmes (*awḥaynā*) à Mūsā et à son frère : « Établissez (*tabawwaʾā*), pour votre peuple, en Égypte (*bi-miṣra*), des demeures ; faites de vos demeures un point d''orientation (*qibla*), et accomplissez la *ṣalāt* » — et annonce [une bonne nouvelle] aux croyants.'
- ref: S.10:88
  ar: وَقَالَ مُوسَىٰ رَبَّنَا إِنَّكَ آتَيْتَ فِرْعَوْنَ وَمَلَأَهُ زِينَةً وَأَمْوَالًا فِي الْحَيَاةِ الدُّنْيَا رَبَّنَا لِيُضِلُّوا عَنْ سَبِيلِكَ ۖ رَبَّنَا اطْمِسْ عَلَىٰ أَمْوَالِهِمْ وَاشْدُدْ عَلَىٰ قُلُوبِهِمْ فَلَا يُؤْمِنُوا حَتَّىٰ يَرَوُا الْعَذَابَ الْأَلِيمَ
  trl: Wa-qāla mūsā rabbanā innaka ātayta firʿawna wa-malaʾahu zīnatan wa-amwālan fi l-ḥayāti d-dunyā rabbanā li-yuḑillū ʿan sabīlika — rabbanā ṭmis ʿalā amwālihim wa-shdud ʿalā qulūbihim fa-lā yuʾminū ḥattā yarawu l-ʿadhāba l-alīm
  trad: 'Mūsā dit : « Notre Rabb, Tu as donné à Firʿawn et à son assemblée parure (*zīna*) et biens (*amwāl*) dans la vie d''ici-bas — notre Rabb — [de sorte qu'']ils égarent loin de Ton chemin — notre Rabb, efface (*ṭmis*) leurs biens, et endurcis (*ashdud*) leurs cœurs, en sorte qu''ils ne croient pas avant de voir le châtiment douloureux. »'
- ref: S.10:89
  ar: قَالَ قَدْ أُجِيبَتْ دَعْوَتُكُمَا فَاسْتَقِيمَا وَلَا تَتَّبِعَانِّ سَبِيلَ الَّذِينَ لَا يَعْلَمُونَ
  trl: Qāla qad ujībat daʿwatukumā fa-staqīmā wa-lā tattabiʿānni sabīla lladhīna lā yaʿlamūn
  trad: 'Il dit : « Votre invocation (*daʿwatukumā*) est certes exaucée (*ujībat*) — restez donc fermes (*fa-staqīmā*), vous deux, et ne suivez pas, tous deux, le chemin de ceux qui ne savent pas. »'
- ref: S.10:90
  ar: ۞ وَجَاوَزْنَا بِبَنِي إِسْرَائِيلَ الْبَحْرَ فَأَتْبَعَهُمْ فِرْعَوْنُ وَجُنُودُهُ بَغْيًا وَعَدْوًا ۖ حَتَّىٰ إِذَا أَدْرَكَهُ الْغَرَقُ قَالَ آمَنْتُ أَنَّهُ لَا إِلَٰهَ إِلَّا الَّذِي آمَنَتْ بِهِ بَنُو إِسْرَائِيلَ وَأَنَا مِنَ الْمُسْلِمِينَ
  trl: Wa-jāwaznā bi-banī isrāʾīla l-baḥra fa-atbaʿahum firʿawnu wa-junūduhu baghyan wa-ʿadwan ḥattā idhā adrakahu l-gharaqu qāla āmantu annahu lā ilāha illā lladhī āmanat bihi banū isrāʾīla wa-anā mina l-muslimīn
  trad: 'Et Nous fîmes traverser la mer aux Banū Isrāʾīl — Firʿawn et ses armées (*junūduhu*) les poursuivirent, par excès (*baghyan*) et hostilité (*ʿadwan*) — jusqu''à ce que la noyade (*al-gharaq*) l''eût atteint (*adrakahu*), il dit : « Je crois (*āmantu*) qu''il n''y a nul *ilāh* sinon Ce en quoi ont cru les Banū Isrāʾīl, et je suis du nombre des *muslimīn*. »'
- ref: S.10:91
  ar: آلْآنَ وَقَدْ عَصَيْتَ قَبْلُ وَكُنْتَ مِنَ الْمُفْسِدِينَ
  trl: Āl-āna wa-qad ʿaṣayta qablu wa-kunta mina l-mufsidīn
  trad: « Maintenant ? — alors que tu avais désobéi (*ʿaṣayta*) auparavant, et que tu étais du nombre des *mufsidīn*. »
- ref: S.10:92
  ar: فَالْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ آيَةً ۚ وَإِنَّ كَثِيرًا مِنَ النَّاسِ عَنْ آيَاتِنَا لَغَافِلُونَ
  trl: Fa-l-yawma nunajjīka bi-badanika li-takūna li-man khalfaka āyatan wa-inna kathīran mina n-nāsi ʿan āyātinā la-ghāfilūn
  trad: « Aujourd'hui donc, Nous te sauvons (*nunajjīka*), [en préservant] ton corps (*bi-badanika*), pour que tu sois un signe (*āya*) pour ceux qui viendront après toi (*li-man khalfaka*) — beaucoup, parmi les gens, sont certes insouciants (*ghāfilūn*) de Nos *āyāt*. »
- ref: S.10:93
  ar: وَلَقَدْ بَوَّأْنَا بَنِي إِسْرَائِيلَ مُبَوَّأَ صِدْقٍ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ فَمَا اخْتَلَفُوا حَتَّىٰ جَاءَهُمُ الْعِلْمُ ۚ إِنَّ رَبَّكَ يَقْضِي بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ
  trl: Wa-la-qad bawwaʾnā banī isrāʾīla mubawwaʾa ṣidqin wa-razaqnāhum mina ṭ-ṭayyibāti fa-mā khtalafū ḥattā jāʾahumu l-ʿilmu — inna rabbaka yaqḑī baynahum yawma l-qiyāmati fīmā kānū fīhi yakhtalifūn
  trad: Et Nous avons certes établi (*bawwaʾnā*) les Banū Isrāʾīl dans une installation de vérité (*mubawwaʾa ṣidq*), et Nous les avons pourvus (*razaqnāhum*) des bonnes choses (*aṭ-ṭayyibāt*) — ils ne divergèrent (*ikhtalafū*) qu'après que le savoir (*al-ʿilm*) leur fut venu — ton Rabb tranchera (*yaqḑī*) certes entre eux, au Jour de la Résurrection, sur ce en quoi ils divergeaient.
- ref: S.10:94
  ar: فَإِنْ كُنْتَ فِي شَكٍّ مِمَّا أَنْزَلْنَا إِلَيْكَ فَاسْأَلِ الَّذِينَ يَقْرَءُونَ الْكِتَابَ مِنْ قَبْلِكَ ۚ لَقَدْ جَاءَكَ الْحَقُّ مِنْ رَبِّكَ فَلَا تَكُونَنَّ مِنَ الْمُمْتَرِينَ
  trl: Fa-in kunta fī shakkin mimmā anzalnā ilayka fa-sʾali lladhīna yaqraʾūna l-kitāba min qablika — la-qad jāʾaka l-ḥaqqu min rabbika fa-lā takūnanna mina l-mumtarīn
  trad: Et si tu es dans le doute (*shakk*) au sujet de ce que Nous avons fait descendre vers toi, interroge donc ceux qui lisent le Kitāb avant toi — le *ḥaqq* t'est certes venu de ton Rabb, ne sois donc pas du nombre de ceux qui doutent avec insistance (*al-mumtarīn*).
- ref: S.10:95
  ar: وَلَا تَكُونَنَّ مِنَ الَّذِينَ كَذَّبُوا بِآيَاتِ اللَّهِ فَتَكُونَ مِنَ الْخَاسِرِينَ
  trl: Wa-lā takūnanna mina lladhīna kadhdhabū bi-āyāti llāhi fa-takūna mina l-khāsirīn
  trad: 'Et ne sois pas de ceux qui ont traité les *āyāt* d''Allaah de mensonge : tu serais alors du nombre des perdants (*al-khāsirīn*).'
- ref: S.10:96
  ar: إِنَّ الَّذِينَ حَقَّتْ عَلَيْهِمْ كَلِمَتُ رَبِّكَ لَا يُؤْمِنُونَ
  trl: Inna lladhīna ḥaqqat ʿalayhim kalimatu rabbika lā yuʾminūn
  trad: Ceux sur qui la parole (*kalima*) de ton Rabb s'est avérée (*ḥaqqat*) ne croient pas.
- ref: S.10:97
  ar: وَلَوْ جَاءَتْهُمْ كُلُّ آيَةٍ حَتَّىٰ يَرَوُا الْعَذَابَ الْأَلِيمَ
  trl: Wa-law jāʾathum kullu āyatin ḥattā yarawu l-ʿadhāba l-alīm
  trad: Même si tout signe (*āya*) leur venait — jusqu'à ce qu'ils voient le châtiment douloureux.
- ref: S.10:98
  ar: فَلَوْلَا كَانَتْ قَرْيَةٌ آمَنَتْ فَنَفَعَهَا إِيمَانُهَا إِلَّا قَوْمَ يُونُسَ لَمَّا آمَنُوا كَشَفْنَا عَنْهُمْ عَذَابَ الْخِزْيِ فِي الْحَيَاةِ الدُّنْيَا وَمَتَّعْنَاهُمْ إِلَىٰ حِينٍ
  trl: Fa-lawlā kānat qaryatun āmanat fa-nafaʿahā īmānuhā illā qawma yūnusa — lammā āmanū kashafnā ʿanhum ʿadhāba l-khizyi fi l-ḥayāti d-dunyā wa-mattaʿnāhum ilā ḥīn
  trad: 'Or, nulle cité n''a cru de sorte que sa foi (*īmānuhā*) lui profite (*nafaʿahā*) [une fois le châtiment déjà là] — sinon le peuple de Yūnus : quand ils crurent, Nous levâmes d''eux le châtiment de l''humiliation (*al-khizy*) dans la vie d''ici-bas, et Nous leur accordâmes une jouissance (*mattaʿnāhum*) jusqu''à un terme (*ilā ḥīn*).'
- ref: S.10:99
  ar: وَلَوْ شَاءَ رَبُّكَ لَآمَنَ مَنْ فِي الْأَرْضِ كُلُّهُمْ جَمِيعًا ۚ أَفَأَنْتَ تُكْرِهُ النَّاسَ حَتَّىٰ يَكُونُوا مُؤْمِنِينَ
  trl: Wa-law shāʾa rabbuka la-āmana man fi l-arḑi kulluhum jamīʿan — a-fa-anta tukrihu n-nāsa ḥattā yakūnū muʾminīn
  trad: Et si ton Rabb l'avait voulu (*law shāʾa*), tous ceux qui sont sur la terre auraient cru, absolument tous — est-ce donc toi qui contraindrais (*tukrihu*) les gens jusqu'à ce qu'ils soient croyants ?
- ref: S.10:100
  ar: وَمَا كَانَ لِنَفْسٍ أَنْ تُؤْمِنَ إِلَّا بِإِذْنِ اللَّهِ ۚ وَيَجْعَلُ الرِّجْسَ عَلَى الَّذِينَ لَا يَعْقِلُونَ
  trl: Wa-mā kāna li-nafsin an tuʾmina illā bi-idhni llāhi wa-yajʿalu r-rijsa ʿalā lladhīna lā yaʿqilūn
  trad: Il n'appartient à aucun *nafs* de croire, sinon par l'autorisation (*idhn*) d'Allaah — et Il place le *rijs* sur ceux qui ne raisonnent pas (*lā yaʿqilūn*).
- ref: S.10:101
  ar: قُلِ انْظُرُوا مَاذَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ وَمَا تُغْنِي الْآيَاتُ وَالنُّذُرُ عَنْ قَوْمٍ لَا يُؤْمِنُونَ
  trl: Quli nẕurū mādhā fi s-samāwāti wa-l-arḑi wa-mā tughnī l-āyātu wa-n-nudhuru ʿan qawmin lā yuʾminūn
  trad: 'Dis : « Regardez ce qui est dans les cieux et sur la terre » — mais les *āyāt* et les avertisseurs (*an-nudhur*) ne sont d''aucune utilité (*mā tughnī*) pour un peuple qui ne croit pas.'
- ref: S.10:102
  ar: فَهَلْ يَنْتَظِرُونَ إِلَّا مِثْلَ أَيَّامِ الَّذِينَ خَلَوْا مِنْ قَبْلِهِمْ ۚ قُلْ فَانْتَظِرُوا إِنِّي مَعَكُمْ مِنَ الْمُنْتَظِرِينَ
  trl: Fa-hal yantaẕirūna illā mithla ayyāmi lladhīna khalaw min qablihim quli fa-ntaẕirū innī maʿakum mina l-muntaẕirīn
  trad: 'Qu''attendent-ils donc, sinon l''équivalent des jours de ceux qui ont disparu (*khalaw*) avant eux ? Dis : « Attendez donc, je suis, avec vous, du nombre de ceux qui attendent. »'
- ref: S.10:103
  ar: ثُمَّ نُنَجِّي رُسُلَنَا وَالَّذِينَ آمَنُوا ۚ كَذَٰلِكَ حَقًّا عَلَيْنَا نُنْجِ الْمُؤْمِنِينَ
  trl: Thumma nunajjī rusulanā wa-lladhīna āmanū — ka-dhālika ḥaqqan ʿalaynā nunji l-muʾminīn
  trad: 'Puis Nous sauvons (*nunajjī*) Nos *rusul* et ceux qui ont cru — c''est ainsi : il Nous incombe, en toute vérité (*ḥaqqan*), de sauver les croyants.'
- ref: S.10:104
  ar: قُلْ يَا أَيُّهَا النَّاسُ إِنْ كُنْتُمْ فِي شَكٍّ مِنْ دِينِي فَلَا أَعْبُدُ الَّذِينَ تَعْبُدُونَ مِنْ دُونِ اللَّهِ وَلَٰكِنْ أَعْبُدُ اللَّهَ الَّذِي يَتَوَفَّاكُمْ ۖ وَأُمِرْتُ أَنْ أَكُونَ مِنَ الْمُؤْمِنِينَ
  trl: Qul yā ayyuhā n-nāsu in kuntum fī shakkin min dīnī fa-lā aʿbudu lladhīna taʿbudūna min dūni llāhi wa-lākin aʿbudu llāha lladhī yatawaffākum wa-umirtu an akūna mina l-muʾminīn
  trad: 'Dis : « Ô les gens, si vous êtes dans le doute (*shakk*) au sujet de mon *dīn*, alors je ne sers pas ce que vous servez en dehors d''Allaah — mais je sers Allaah, Ce qui vous reprend (*yatawaffākum*) — et il m''a été ordonné d''être du nombre des *muʾminūn*. »'
- ref: S.10:105
  ar: وَأَنْ أَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا وَلَا تَكُونَنَّ مِنَ الْمُشْرِكِينَ
  trl: Wa-an aqim wajhaka li-d-dīni ḥanīfan wa-lā takūnanna mina l-mushrikīn
  trad: « — et établis fermement ton être (*aqim wajhaka*) pour le *dīn*, en *ḥanīf* — et ne sois surtout pas du nombre des *mushrikūn*. »
- ref: S.10:106
  ar: وَلَا تَدْعُ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُكَ وَلَا يَضُرُّكَ ۖ فَإِنْ فَعَلْتَ فَإِنَّكَ إِذًا مِنَ الظَّالِمِينَ
  trl: Wa-lā tadʿu min dūni llāhi mā lā yanfaʿuka wa-lā yaḍurruka fa-in faʿalta fa-innaka idhan mina ẓ-ẓālimīn
  trad: Et n'invoque pas, en dehors d'Allaah, ce qui ne te profite pas (*lā yanfaʿuka*) et ne te nuit pas (*lā yaḍurruka*) — si tu le faisais, tu serais alors certes du nombre des *ẓālimīn*.
- ref: S.10:107
  ar: وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ ۖ وَإِنْ يُرِدْكَ بِخَيْرٍ فَلَا رَادَّ لِفَضْلِهِ ۚ يُصِيبُ بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ ۚ وَهُوَ الْغَفُورُ الرَّحِيمُ
  trl: Wa-in yamsaska llāhu bi-ḍurrin fa-lā kāshifa lahu illā huwa wa-in yuridka bi-khayrin fa-lā rādda li-faḍlihi yuṣību bihi man yashāʾu min ʿibādihi wa-huwa l-Ghafūru r-Raḥīm
  trad: Et si Allaah te touche d'un tort (*ḍurr*), nul ne peut le lever (*kāshif*) sinon Lui ; et s'Il te destine (*yuridka*) un bien, nul ne peut repousser Son *faḍl* — Il le fait atteindre à qui Il veut, parmi Ses *ʿibād* — et Il est *al-Ghafūr*, *ar-Raḥīm*.
- ref: S.10:108
  ar: قُلْ يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُمُ الْحَقُّ مِنْ رَبِّكُمْ ۖ فَمَنِ اهْتَدَىٰ فَإِنَّمَا يَهْتَدِي لِنَفْسِهِ ۖ وَمَنْ ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا ۖ وَمَا أَنَا عَلَيْكُمْ بِوَكِيلٍ
  trl: Qul yā ayyuhā n-nāsu qad jāʾakumu l-ḥaqqu min rabbikum fa-mani htadā fa-innamā yahtadī li-nafsihi wa-man ḍalla fa-innamā yaḍillu ʿalayhā wa-mā anā ʿalaykum bi-wakīl
  trad: 'Dis : « Ô les gens, le *ḥaqq* vous est certes venu de votre Rabb — quiconque se laisse guider (*ihtadā*) ne se guide que pour son propre *nafs*, et quiconque s''égare (*ḍalla*) ne s''égare qu''à ses propres dépens — et je ne suis pas, sur vous, un *wakīl*. »'
- ref: S.10:109
  ar: وَاتَّبِعْ مَا يُوحَىٰ إِلَيْكَ وَاصْبِرْ حَتَّىٰ يَحْكُمَ اللَّهُ ۚ وَهُوَ خَيْرُ الْحَاكِمِينَ
  trl: Wa-ttabiʿ mā yūḥā ilayka wa-ṣbir ḥattā yaḥkuma llāhu wa-huwa khayru l-ḥākimīn
  trad: Et suis ce qui t'est révélé (*yūḥā*), et sois patient (*iṣbir*) jusqu'à ce qu'Allaah juge (*yaḥkuma*) — Il est le meilleur des juges (*khayru l-ḥākimīn*).
