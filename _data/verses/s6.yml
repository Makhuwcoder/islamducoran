- ref: S.6:1
  ar: الْحَمْدُ لِلَّهِ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَجَعَلَ الظُّلُمَاتِ وَالنُّورَ ۖ ثُمَّ الَّذِينَ كَفَرُوا بِرَبِّهِمْ يَعْدِلُونَ
  trl: Al-ḥamdu li-llāhi lladhī khalaqa s-samāwāti wa-l-arḍa wa-jaʿala ẓ-ẓulumāti wa-n-nūra — thumma lladhīna kafarū bi-rabbihim yaʿdilūn
  trad: La *ḥamd* appartient à Allaah, Ce qui a créé les cieux et la terre, et a établi les ténèbres et la lumière — pourtant ceux qui ont commis le *kufr* envers leur *Rabb* Lui égalent [des associés].
- ref: S.6:2
  ar: هُوَ الَّذِي خَلَقَكُمْ مِنْ طِينٍ ثُمَّ قَضَىٰ أَجَلًا ۖ وَأَجَلٌ مُسَمًّى عِنْدَهُ ۖ ثُمَّ أَنْتُمْ تَمْتَرُونَ
  trl: Huwa lladhī khalaqakum min ṭīnin thumma qaḍā ajalan — wa-ajalun musamman ʿindahu — thumma antum tamtarūn
  trad: Il est Ce qui vous a créés à partir du *ṭīn* (l'argile), puis a fixé un terme (*ajal*) — et un terme nommément déterminé (*musamman*) demeure auprès de Lui — pourtant vous, vous en doutez (*tamtarūn*).
- ref: S.6:3
  ar: وَهُوَ اللَّهُ فِي السَّمَاوَاتِ وَفِي الْأَرْضِ ۖ يَعْلَمُ سِرَّكُمْ وَجَهْرَكُمْ وَيَعْلَمُ مَا تَكْسِبُونَ
  trl: Wa-huwa llāhu fī s-samāwāti wa-fī l-arḍi — yaʿlamu sirrakum wa-jahrakum wa-yaʿlamu mā taksibūn
  trad: Et Il est Allaah, tout autant dans les cieux que sur la terre — Il connaît votre secret et votre manifeste, et Il sait ce que vous acquérez.
- ref: S.6:4
  ar: وَمَا تَأْتِيهِمْ مِنْ آيَةٍ مِنْ آيَاتِ رَبِّهِمْ إِلَّا كَانُوا عَنْهَا مُعْرِضِينَ
  trl: Wa-mā taʾtīhim min āyatin min āyāti rabbihim illā kānū ʿanhā muʿriḍīn
  trad: Or, pas un signe (*āya*) parmi les signes de leur *Rabb* ne leur vient sans qu'ils ne s'en détournent (*muʿriḍīn*).
- ref: S.6:5
  ar: فَقَدْ كَذَّبُوا بِالْحَقِّ لَمَّا جَاءَهُمْ ۖ فَسَوْفَ يَأْتِيهِمْ أَنْبَاءُ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ
  trl: Fa-qad kadhdhabū bi-l-ḥaqqi lammā jāʾahum — fa-sawfa yaʾtīhim anbāʾu mā kānū bihi yastahziʾūn
  trad: Ils ont ainsi démenti *al-ḥaqq* dès qu'il leur est venu — les nouvelles (*anbāʾ*) de ce dont ils se sont moqués leur parviendront donc bientôt.
- ref: S.6:6
  ar: أَلَمْ يَرَوْا كَمْ أَهْلَكْنَا مِنْ قَبْلِهِمْ مِنْ قَرْنٍ مَكَّنَّاهُمْ فِي الْأَرْضِ مَا لَمْ نُمَكِّنْ لَكُمْ وَأَرْسَلْنَا السَّمَاءَ عَلَيْهِمْ مِدْرَارًا وَجَعَلْنَا الْأَنْهَارَ تَجْرِي مِنْ تَحْتِهِمْ فَأَهْلَكْنَاهُمْ بِذُنُوبِهِمْ وَأَنْشَأْنَا مِنْ بَعْدِهِمْ قَرْنًا آخَرِينَ
  trl: A-lam yarawu kam ahlaknā min qablihim min qarnin makkannāhum fi l-arḍi mā lam numakkin lakum wa-arsalnā s-samāʾa ʿalayhim midrāran wa-jaʿalnā l-anhāra tajrī min taḥtihim fa-ahlaknāhum bi-dhunūbihim wa-anshaʾnā min baʿdihim qarnan ākharīn
  trad: N'ont-ils pas vu combien de générations (*qarn*) Nous avons détruites avant eux ? Nous les avions établies (*makkannāhum*) sur la terre d'une manière que Nous ne vous avons pas établis, Nous avions envoyé sur elles le ciel en pluies abondantes (*midrārā*), et fait courir sous elles les rivières — puis Nous les avons détruites pour leurs fautes (*dhunūb*), et fait naître après elles une autre génération.
- ref: S.6:7
  ar: وَلَوْ نَزَّلْنَا عَلَيْكَ كِتَابًا فِي قِرْطَاسٍ فَلَمَسُوهُ بِأَيْدِيهِمْ لَقَالَ الَّذِينَ كَفَرُوا إِنْ هَٰذَا إِلَّا سِحْرٌ مُبِينٌ
  trl: Wa-law nazzalnā ʿalayka kitāban fī qirṭāsin fa-lamasūhu bi-aydīhim la-qāla lladhīna kafarū in hādhā illā siḥrun mubīn
  trad: 'Et si Nous avions fait descendre sur toi une écriture (*kitāb*) sur un support de parchemin (*qirṭās*), qu''ils auraient touchée de leurs propres mains, ceux qui ont commis le *kufr* auraient certainement dit : « Cela n''est rien d''autre qu''une magie manifeste (*siḥrun mubīn*). »'
- ref: S.6:8
  ar: وَقَالُوا لَوْلَا أُنْزِلَ عَلَيْهِ مَلَكٌ ۖ وَلَوْ أَنْزَلْنَا مَلَكًا لَقُضِيَ الْأَمْرُ ثُمَّ لَا يُنْظَرُونَ
  trl: Wa-qālū lawlā unzila ʿalayhi malakun — wa-law anzalnā malakan la-quḍiya l-amru thumma lā yunẓarūn
  trad: 'Et ils ont dit : « Pourquoi ne fait-on pas descendre sur lui un *malak* ? » Or, si Nous avions fait descendre un *malak*, l''affaire aurait été tranchée (*quḍiya l-amr*) sans plus attendre, et il ne leur aurait plus été accordé de délai (*yunẓarūn*).'
- ref: S.6:9
  ar: وَلَوْ جَعَلْنَاهُ مَلَكًا لَجَعَلْنَاهُ رَجُلًا وَلَلَبَسْنَا عَلَيْهِمْ مَا يَلْبِسُونَ
  trl: Wa-law jaʿalnāhu malakan la-jaʿalnāhu rajulan wa-la-labasnā ʿalayhim mā yalbisūn
  trad: Et si Nous en avions fait un *malak*, Nous l'aurions fait sous une apparence d'homme (*rajul*) — et Nous aurions ainsi entretenu chez eux la même confusion (*labs*) qu'ils entretiennent [déjà].
- ref: S.6:10
  ar: وَلَقَدِ اسْتُهْزِئَ بِرُسُلٍ مِنْ قَبْلِكَ فَحَاقَ بِالَّذِينَ سَخِرُوا مِنْهُمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ
  trl: Wa-la-qadi stuhziʾa bi-rusulin min qablika fa-ḥāqa bi-lladhīna sakhirū minhum mā kānū bihi yastahziʾūn
  trad: Et certes, des *rusul* avant toi ont déjà été raillés (*istuhziʾa*) — alors s'est abattu sur ceux qui les ont ridiculisés (*sakhirū*) ce dont ils se moquaient (*yastahziʾūn*).
- ref: S.6:11
  ar: قُلْ سِيرُوا فِي الْأَرْضِ ثُمَّ انْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُكَذِّبِينَ
  trl: Qul sīrū fi l-arḍi thumma nẓurū kayfa kāna ʿāqibatu l-mukadhdhibīn
  trad: 'Dis : « Parcourez la terre, puis regardez quelle a été la fin (*ʿāqiba*) de ceux qui ont démenti (*al-mukadhdhibīn*). »'
- ref: S.6:12
  ar: قُلْ لِمَنْ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ قُلْ لِلَّهِ ۚ كَتَبَ عَلَىٰ نَفْسِهِ الرَّحْمَةَ ۚ لَيَجْمَعَنَّكُمْ إِلَىٰ يَوْمِ الْقِيَامَةِ لَا رَيْبَ فِيهِ ۚ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ فَهُمْ لَا يُؤْمِنُونَ
  trl: Qul li-man mā fi s-samāwāti wa-l-arḍi — qul li-llāhi — kataba ʿalā nafsihi r-raḥmata — la-yajmaʿannakum ilā yawmi l-qiyāmati lā rayba fīhi — al-ladhīna khasirū anfusahum fa-hum lā yuʾminūn
  trad: 'Dis : « À qui appartient ce qui est dans les cieux et sur la terre ? » Dis : « À Allaah. » Il a inscrit sur Lui-même la *raḥma* (*kataba ʿalā nafsihi r-raḥmata*) — Il vous rassemblera très certainement jusqu''au jour de la résurrection (*yawm al-qiyāma*), nul doute (*rayb*) en cela. Ceux qui ont fait perdre leurs propres *nafs* (*khasirū anfusahum*), ceux-là ne croient pas.'
- ref: S.6:13
  ar: ۞ وَلَهُ مَا سَكَنَ فِي اللَّيْلِ وَالنَّهَارِ ۚ وَهُوَ السَّمِيعُ الْعَلِيمُ
  trl: Wa-lahu mā sakana fi l-layli wa-n-nahāri — wa-huwa s-samīʿu l-ʿalīm
  trad: Et à Lui appartient ce qui repose (*sakana*) dans la nuit et le jour — Il est *as-Samīʿ*, *al-ʿAlīm*.
- ref: S.6:14
  ar: قُلْ أَغَيْرَ اللَّهِ أَتَّخِذُ وَلِيًّا فَاطِرِ السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ يُطْعِمُ وَلَا يُطْعَمُ ۗ قُلْ إِنِّي أُمِرْتُ أَنْ أَكُونَ أَوَّلَ مَنْ أَسْلَمَ ۖ وَلَا تَكُونَنَّ مِنَ الْمُشْرِكِينَ
  trl: Qul a-ghayra llāhi attakhidhu waliyyan fāṭira s-samāwāti wa-l-arḍi wa-huwa yuṭʿimu wa-lā yuṭʿam — qul innī umirtu an akūna awwala man aslama wa-lā takūnanna mina l-mushrikīn
  trad: 'Dis : « Prendrai-je un *walī* autre qu''Allaah, Ce qui a fait éclore (*Fāṭir*) les cieux et la terre, et Ce qui nourrit sans être nourri (*yuṭʿimu wa-lā yuṭʿam*) ? » Dis : « Il m''a été ordonné d''être le premier de ceux qui se sont soumis (*awwala man aslama*) — et ne sois surtout pas parmi les *mushrikūn*. »'
- ref: S.6:15
  ar: قُلْ إِنِّي أَخَافُ إِنْ عَصَيْتُ رَبِّي عَذَابَ يَوْمٍ عَظِيمٍ
  trl: Qul innī akhāfu in ʿaṣaytu rabbī ʿadhāba yawmin ʿaẓīm
  trad: 'Dis : « Je crains, si je désobéis à mon *Rabb*, le châtiment d''un jour immense. »'
- ref: S.6:16
  ar: مَنْ يُصْرَفْ عَنْهُ يَوْمَئِذٍ فَقَدْ رَحِمَهُ ۚ وَذَٰلِكَ الْفَوْزُ الْمُبِينُ
  trl: Man yuṣraf ʿanhu yawmaʾidhin fa-qad raḥimahu — wa-dhālika l-fawzu l-mubīn
  trad: Quiconque en est détourné (*yuṣraf*), ce jour-là, Allaah lui aura certainement fait *raḥma* — et cela est le succès manifeste (*al-fawz al-mubīn*).
- ref: S.6:17
  ar: وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ ۖ وَإِنْ يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Wa-in yamsaska llāhu bi-ḍurrin fa-lā kāshifa lahu illā huwa — wa-in yamsaska bi-khayrin fa-huwa ʿalā kulli shayʾin qadīr
  trad: Si Allaah te touche d'un tort (*ḍurr*), nul ne peut le lever (*kāshif*) sinon Lui ; et s'Il te touche d'un bien, Il est, sur toute chose, en pleine capacité (*qadīr*).
- ref: S.6:18
  ar: وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ ۚ وَهُوَ الْحَكِيمُ الْخَبِيرُ
  trl: Wa-huwa l-qāhiru fawqa ʿibādihi — wa-huwa l-ḥakīmu l-khabīr
  trad: Et Il prévaut, en pleine maîtrise (*al-qāhir*), sur Ses *ʿibād* — et Il est *al-Ḥakīm*, *al-Khabīr*.
- ref: S.6:19
  ar: قُلْ أَيُّ شَيْءٍ أَكْبَرُ شَهَادَةً ۖ قُلِ اللَّهُ ۖ شَهِيدٌ بَيْنِي وَبَيْنَكُمْ ۚ وَأُوحِيَ إِلَيَّ هَٰذَا الْقُرْآنُ لِأُنْذِرَكُمْ بِهِ وَمَنْ بَلَغَ ۚ أَئِنَّكُمْ لَتَشْهَدُونَ أَنَّ مَعَ اللَّهِ آلِهَةً أُخْرَىٰ ۚ قُلْ لَا أَشْهَدُ ۚ قُلْ إِنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَإِنَّنِي بَرِيءٌ مِمَّا تُشْرِكُونَ
  trl: Qul ayyu shayʾin akbaru shahādatan — qulillāhu shahīdun baynī wa-baynakum — wa-ūḥiya ilayya hādhā l-qurʾānu li-undhirakum bihi wa-man balagh — a-innakum la-tashhadūna anna maʿa llāhi ālihatan ukhrā — qul lā ashhadu — qul innamā huwa ilāhun wāḥidun wa-innanī barīʾun mimmā tushrikūn
  trad: 'Dis : « Quelle chose est la plus grande en témoignage (*shahāda*) ? » Dis : « Allaah — Ce qui témoigne (*shahīd*) entre moi et vous. » Et ce *qurʾān* m''a été révélé pour que je vous avertisse par lui, ainsi que quiconque il atteint (*man balagh*). Témoigneriez-vous vraiment qu''il existe, avec Allaah, d''autres *ālihah* (dieux) ? Dis : « Je n''en témoigne pas. » Dis : « Il n''est qu''un *ilāh* unique (*wāḥid*), et je me désolidarise (*barīʾ*) de ce que vous associez [à Lui]. »'
- ref: S.6:20
  ar: الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَعْرِفُونَهُ كَمَا يَعْرِفُونَ أَبْنَاءَهُمُ ۘ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ فَهُمْ لَا يُؤْمِنُونَ
  trl: Alladhīna ātaynāhumu l-kitāba yaʿrifūnahu ka-mā yaʿrifūna abnāʾahum — alladhīna khasirū anfusahum fa-hum lā yuʾminūn
  trad: Ceux à qui Nous avons donné le Kitāb le reconnaissent comme ils reconnaissent leurs propres fils. Ceux qui ont fait perdre leurs propres *nafs* (*khasirū anfusahum*), ceux-là ne croient pas.
- ref: S.6:21
  ar: وَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا أَوْ كَذَّبَ بِآيَاتِهِ ۗ إِنَّهُ لَا يُفْلِحُ الظَّالِمُونَ
  trl: Wa-man aẓlamu mimmani ftarā ʿalā llāhi kadhiban aw kadhdhaba bi-āyātihi — innahu lā yufliḥu ẓ-ẓālimūn
  trad: Et qui est plus *ẓālim* que celui qui forge (*iftarā*) un mensonge contre Allaah, ou qui dément Ses *āyāt* ? Certes, les *ẓālimūn* ne réussissent pas (*lā yufliḥ*).
- ref: S.6:22
  ar: وَيَوْمَ نَحْشُرُهُمْ جَمِيعًا ثُمَّ نَقُولُ لِلَّذِينَ أَشْرَكُوا أَيْنَ شُرَكَاؤُكُمُ الَّذِينَ كُنْتُمْ تَزْعُمُونَ
  trl: Wa-yawma naḥshuruhum jamīʿan thumma naqūlu li-lladhīna ashrakū ayna shurakāʾukumu lladhīna kuntum tazʿumūn
  trad: 'Et le jour où Nous les rassemblerons tous, Nous dirons ensuite à ceux qui ont pratiqué le *shirk* : « Où sont vos associés (*shurakāʾ*), ceux que vous prétendiez (*tazʿumūn*) ? »'
- ref: S.6:23
  ar: ثُمَّ لَمْ تَكُنْ فِتْنَتُهُمْ إِلَّا أَنْ قَالُوا وَاللَّهِ رَبِّنَا مَا كُنَّا مُشْرِكِينَ
  trl: Thumma lam takun fitnatuhum illā an qālū wa-llāhi rabbinā mā kunnā mushrikīn
  trad: 'Alors, leur seule réponse sous l''épreuve (*fitna*) sera de dire : « Par Allaah, notre *Rabb*, nous n''étions pas des *mushrikūn* ! »'
- ref: S.6:24
  ar: انْظُرْ كَيْفَ كَذَبُوا عَلَىٰ أَنْفُسِهِمْ ۚ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ
  trl: Unẓur kayfa kadhabū ʿalā anfusihim wa-ḍalla ʿanhum mā kānū yaftarūn
  trad: Regarde comment ils mentent contre eux-mêmes — et s'est égaré loin d'eux ce qu'ils inventaient (*yaftarūn*).
- ref: S.6:25
  ar: وَمِنْهُمْ مَنْ يَسْتَمِعُ إِلَيْكَ ۖ وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَنْ يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْرًا ۚ وَإِنْ يَرَوْا كُلَّ آيَةٍ لَا يُؤْمِنُوا بِهَا ۚ حَتَّىٰ إِذَا جَاءُوكَ يُجَادِلُونَكَ يَقُولُ الَّذِينَ كَفَرُوا إِنْ هَٰذَا إِلَّا أَسَاطِيرُ الْأَوَّلِينَ
  trl: Wa-minhum man yastamiʿu ilayka wa-jaʿalnā ʿalā qulūbihim akinnatan an yafqahūhu wa-fī ādhānihim waqran wa-in yaraw kulla āyatin lā yuʾminū bihā ḥattā idhā jāʾūka yujādilūnaka yaqūlu lladhīna kafarū in hādhā illā asāṭīru l-awwalīn
  trad: 'Et parmi eux, il en est qui prêtent l''oreille vers toi — mais Nous avons placé sur leurs cœurs des voiles (*akinna*) qui les empêchent de le comprendre, et dans leurs oreilles une lourdeur (*waqr*). Et même s''ils voyaient tout signe (*āya*), ils n''y croiraient pas — au point que, lorsqu''ils viennent à toi pour te contester, ceux qui ont commis le *kufr* disent : « Cela n''est rien d''autre que des légendes des anciens (*asāṭīru l-awwalīn*). »'
- ref: S.6:26
  ar: وَهُمْ يَنْهَوْنَ عَنْهُ وَيَنْأَوْنَ عَنْهُ ۖ وَإِنْ يُهْلِكُونَ إِلَّا أَنْفُسَهُمْ وَمَا يَشْعُرُونَ
  trl: Wa-hum yanhawna ʿanhu wa-yanʾawna ʿanhu wa-in yuhlikūna illā anfusahum wa-mā yashʿurūn
  trad: Et ils interdisent (*yanhawna*) [aux autres] cela, tout en s'en éloignant (*yanʾawna*) eux-mêmes — ils ne détruisent qu'eux-mêmes, sans en avoir conscience (*wa-mā yashʿurūn*).
- ref: S.6:27
  ar: وَلَوْ تَرَىٰ إِذْ وُقِفُوا عَلَى النَّارِ فَقَالُوا يَا لَيْتَنَا نُرَدُّ وَلَا نُكَذِّبَ بِآيَاتِ رَبِّنَا وَنَكُونَ مِنَ الْمُؤْمِنِينَ
  trl: Wa-law tarā idh wuqifū ʿalā n-nāri fa-qālū yā laytanā nuraddu wa-lā nukadhdhiba bi-āyāti rabbinā wa-nakūna mina l-muʾminīn
  trad: 'Et si tu voyais, lorsqu''ils seront placés debout devant le Feu — ils diront alors : « Si seulement (*yā laytanā*) nous étions renvoyés, nous ne démentirions plus les *āyāt* de notre *Rabb*, et nous serions parmi les *muʾminūn* ! »'
- ref: S.6:28
  ar: بَلْ بَدَا لَهُمْ مَا كَانُوا يُخْفُونَ مِنْ قَبْلُ ۖ وَلَوْ رُدُّوا لَعَادُوا لِمَا نُهُوا عَنْهُ وَإِنَّهُمْ لَكَاذِبُونَ
  trl: Bal badā lahum mā kānū yukhfūna min qablu wa-law ruddū la-ʿādū li-mā nuhū ʿanhu wa-innahum la-kādhibūn
  trad: Non — ce qu'ils dissimulaient auparavant leur est devenu visible (*badā*). Et s'ils étaient renvoyés, ils retourneraient à cela même dont il leur avait été interdit — ils sont assurément des menteurs.
- ref: S.6:29
  ar: وَقَالُوا إِنْ هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا وَمَا نَحْنُ بِمَبْعُوثِينَ
  trl: Wa-qālū in hiya illā ḥayātunā d-dunyā wa-mā naḥnu bi-mabʿūthīn
  trad: 'Et ils disent : « Il n''y a que notre vie d''ici-bas, et nous ne serons pas ressuscités (*mabʿūthīn*). »'
- ref: S.6:30
  ar: وَلَوْ تَرَىٰ إِذْ وُقِفُوا عَلَىٰ رَبِّهِمْ ۚ قَالَ أَلَيْسَ هَٰذَا بِالْحَقِّ ۚ قَالُوا بَلَىٰ وَرَبِّنَا ۚ قَالَ فَذُوقُوا الْعَذَابَ بِمَا كُنْتُمْ تَكْفُرُونَ
  trl: Wa-law tarā idh wuqifū ʿalā rabbihim qāla a-laysa hādhā bi-l-ḥaqqi qālū balā wa-rabbinā qāla fa-dhūqū l-ʿadhāba bi-mā kuntum takfurūn
  trad: 'Et si tu voyais, lorsqu''ils seront placés debout devant leur *Rabb* — Il dira : « Cela n''est-il pas *al-ḥaqq* ? » Ils diront : « Si, par notre *Rabb* ! » Il dira : « Goûtez donc le châtiment pour le *kufr* que vous commettiez. »'
- ref: S.6:31
  ar: قَدْ خَسِرَ الَّذِينَ كَذَّبُوا بِلِقَاءِ اللَّهِ ۖ حَتَّىٰ إِذَا جَاءَتْهُمُ السَّاعَةُ بَغْتَةً قَالُوا يَا حَسْرَتَنَا عَلَىٰ مَا فَرَّطْنَا فِيهَا وَهُمْ يَحْمِلُونَ أَوْزَارَهُمْ عَلَىٰ ظُهُورِهِمْ ۚ أَلَا سَاءَ مَا يَزِرُونَ
  trl: Qad khasira lladhīna kadhdhabū bi-liqāʾi llāhi ḥattā idhā jāʾathumu s-sāʿatu baghtatan qālū yā ḥasratanā ʿalā mā farraṭnā fīhā wa-hum yaḥmilūna awzārahum ʿalā ẓuhūrihim alā sāʾa mā yazirūn
  trad: 'Ils ont déjà perdu, ceux qui ont démenti la Rencontre d''Allaah (*liqāʾu llāh*) — jusqu''à ce que l''Heure leur vienne soudainement, ils diront alors : « Quel regret amer (*yā ḥasratanā*) pour ce que nous avons négligé (*farraṭnā*) à son sujet ! » — tandis qu''ils porteront leurs fardeaux (*awzār*) sur leur dos. Combien est mauvais ce qu''ils portent (*yazirūn*) !'
- ref: S.6:32
  ar: وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ ۖ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ ۗ أَفَلَا تَعْقِلُونَ
  trl: Wa-mā l-ḥayātu d-dunyā illā laʿibun wa-lahwun wa-la-d-dāru l-ākhiratu khayrun li-lladhīna yattaqūn a-fa-lā taʿqilūn
  trad: Et la vie d'ici-bas n'est que jeu (*laʿib*) et divertissement (*lahw*) — tandis que la demeure de l'*ākhira* est meilleure pour ceux qui se prémunissent (*yattaqūn*). Ne raisonnez-vous donc pas (*a-fa-lā taʿqilūn*) ?
- ref: S.6:33
  ar: قَدْ نَعْلَمُ إِنَّهُ لَيَحْزُنُكَ الَّذِي يَقُولُونَ ۖ فَإِنَّهُمْ لَا يُكَذِّبُونَكَ وَلَٰكِنَّ الظَّالِمِينَ بِآيَاتِ اللَّهِ يَجْحَدُونَ
  trl: Qad naʿlamu innahu la-yaḥzunuka lladhī yaqūlūna fa-innahum lā yukadhdhibūnaka wa-lākinna ẓ-ẓālimīna bi-āyāti llāhi yajḥadūn
  trad: Nous savons déjà que ce qu'ils disent t'attriste (*la-yaḥzunuka*) certainement — or ce n'est pas toi qu'ils démentent (*lā yukadhdhibūnaka*), mais les *ẓālimūn* qui rejettent en le sachant (*yajḥadūn*) les *āyāt* d'Allaah.
- ref: S.6:34
  ar: وَلَقَدْ كُذِّبَتْ رُسُلٌ مِنْ قَبْلِكَ فَصَبَرُوا عَلَىٰ مَا كُذِّبُوا وَأُوذُوا حَتَّىٰ أَتَاهُمْ نَصْرُنَا ۚ وَلَا مُبَدِّلَ لِكَلِمَاتِ اللَّهِ ۚ وَلَقَدْ جَاءَكَ مِنْ نَبَإِ الْمُرْسَلِينَ
  trl: Wa-la-qad kudhdhibat rusulun min qablika fa-ṣabarū ʿalā mā kudhdhibū wa-ūdhū ḥattā atāhum naṣrunā wa-lā mubaddila li-kalimāti llāhi wa-la-qad jāʾaka min nabaʾi l-mursalīn
  trad: Et certes, des *rusul* ont déjà été démentis avant toi — ils ont enduré (*ṣabarū*) le démenti et le tort subis, jusqu'à ce que Notre secours (*naṣr*) leur vienne. Et nul ne peut altérer (*mubaddil*) les paroles d'Allaah (*kalimāt Allaah*) — et certes, t'est déjà parvenue une part des nouvelles (*naba'*) des *mursalūn*.
- ref: S.6:35
  ar: وَإِنْ كَانَ كَبُرَ عَلَيْكَ إِعْرَاضُهُمْ فَإِنِ اسْتَطَعْتَ أَنْ تَبْتَغِيَ نَفَقًا فِي الْأَرْضِ أَوْ سُلَّمًا فِي السَّمَاءِ فَتَأْتِيَهُمْ بِآيَةٍ ۚ وَلَوْ شَاءَ اللَّهُ لَجَمَعَهُمْ عَلَى الْهُدَىٰ ۚ فَلَا تَكُونَنَّ مِنَ الْجَاهِلِينَ
  trl: Wa-in kāna kabura ʿalayka iʿrāḍuhum fa-ini staṭaʿta an tabtaghiya nafaqan fi l-arḍi aw sullaman fi s-samāʾi fa-taʾtiyahum bi-āyatin wa-law shāʾa llāhu la-jamaʿahum ʿalā l-hudā fa-lā takūnanna mina l-jāhilīn
  trad: Et si leur détournement (*iʿrāḍ*) t'est pénible, alors, si tu en as la capacité, cherche un tunnel (*nafaq*) dans la terre ou une échelle (*sullam*) vers le ciel pour leur apporter un signe [cela ne changerait rien] — car si Allaah avait voulu, Il les aurait certainement réunis sur la guidance (*hudā*). Ne sois donc surtout pas parmi les *jāhilīn* (ceux qui ignorent).
- ref: S.6:36
  ar: ۞ إِنَّمَا يَسْتَجِيبُ الَّذِينَ يَسْمَعُونَ ۘ وَالْمَوْتَىٰ يَبْعَثُهُمُ اللَّهُ ثُمَّ إِلَيْهِ يُرْجَعُونَ
  trl: Innamā yastajību lladhīna yasmaʿūn wa-l-mawtā yabʿathuhumu llāhu thumma ilayhi yurjaʿūn
  trad: Seuls répondent (*yastajību*) ceux qui entendent [véritablement] (*yasmaʿūn*) — et les morts (*al-mawtā*), Allaah les ressuscite (*yabʿathuhum*), puis c'est vers Lui qu'ils seront ramenés.
- ref: S.6:37
  ar: وَقَالُوا لَوْلَا نُزِّلَ عَلَيْهِ آيَةٌ مِنْ رَبِّهِ ۚ قُلْ إِنَّ اللَّهَ قَادِرٌ عَلَىٰ أَنْ يُنَزِّلَ آيَةً وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
  trl: Wa-qālū lawlā nuzzila ʿalayhi āyatun min rabbihi qul inna llāha qādirun ʿalā an yunazzila āyatan wa-lākinna aktharahum lā yaʿlamūn
  trad: 'Et ils ont dit : « Pourquoi ne fait-on pas descendre sur lui un signe (*āya*) venant de son *Rabb* ? » Dis : « Allaah a pleinement la capacité (*qādir*) de faire descendre un signe » — mais la plupart d''entre eux ne savent pas.'
- ref: S.6:38
  ar: وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ ۚ مَا فَرَّطْنَا فِي الْكِتَابِ مِنْ شَيْءٍ ۚ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ
  trl: Wa-mā min dābbatin fi l-arḍi wa-lā ṭāʾirin yaṭīru bi-janāḥayhi illā umamun amthālukum mā farraṭnā fi l-kitābi min shayʾin thumma ilā rabbihim yuḥsharūn
  trad: Il n'y a pas de créature qui se meut (*dābba*) sur la terre, ni d'oiseau qui vole de ses deux ailes, qui ne forme des *umam* (communautés) semblables à vous (*amthālukum*). Nous n'avons rien négligé (*farraṭnā*) dans le Kitāb — puis c'est vers leur *Rabb* qu'ils seront rassemblés.
- ref: S.6:39
  ar: وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا صُمٌّ وَبُكْمٌ فِي الظُّلُمَاتِ ۗ مَنْ يَشَإِ اللَّهُ يُضْلِلْهُ وَمَنْ يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Wa-lladhīna kadhdhabū bi-āyātinā ṣummun wa-bukmun fi ẓ-ẓulumāti man yashaʾi llāhu yuḍlilhu wa-man yashaʾ yajʿalhu ʿalā ṣirāṭin mustaqīm
  trad: Et ceux qui ont démenti Nos *āyāt* sont sourds (*ṣumm*) et muets (*bukm*) dans les ténèbres (*ẓulumāt*) — quiconque Allaah veut, Il l'égare (*yuḍlilhu*), et quiconque Il veut, Il le place sur un chemin droit (*ṣirāṭ mustaqīm*).
- ref: S.6:40
  ar: قُلْ أَرَأَيْتَكُمْ إِنْ أَتَاكُمْ عَذَابُ اللَّهِ أَوْ أَتَتْكُمُ السَّاعَةُ أَغَيْرَ اللَّهِ تَدْعُونَ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Qul araʾaytakum in atākum ʿadhābu llāhi aw atatkumu s-sāʿatu a-ghayra llāhi tadʿūna in kuntum ṣādiqīn
  trad: 'Dis : « Considérez-vous (*araʾaytakum*) — si le châtiment d''Allaah vous venait, ou si l''Heure vous venait, est-ce un autre qu''Allaah que vous invoqueriez, si vous êtes véridiques ? »'
- ref: S.6:41
  ar: بَلْ إِيَّاهُ تَدْعُونَ فَيَكْشِفُ مَا تَدْعُونَ إِلَيْهِ إِنْ شَاءَ وَتَنْسَوْنَ مَا تُشْرِكُونَ
  trl: Bal iyyāhu tadʿūna fa-yakshifu mā tadʿūna ilayhi in shāʾa wa-tansawna mā tushrikūn
  trad: Non — c'est Lui seul (*iyyāhu*) que vous invoqueriez, et Il lèverait (*yakshifu*) ce pour quoi vous L'invoquez, s'Il le voulait — et vous oublieriez ce que vous associez [à Lui].
- ref: S.6:42
  ar: وَلَقَدْ أَرْسَلْنَا إِلَىٰ أُمَمٍ مِنْ قَبْلِكَ فَأَخَذْنَاهُمْ بِالْبَأْسَاءِ وَالضَّرَّاءِ لَعَلَّهُمْ يَتَضَرَّعُونَ
  trl: Wa-la-qad arsalnā ilā umamin min qablika fa-akhadhnāhum bi-l-baʾsāʾi wa-ḍ-ḍarrāʾi laʿallahum yataḍarraʿūn
  trad: Et certes, Nous avons envoyé [des *rusul*] à des *umam* avant toi — puis Nous les avons saisies par le malheur (*baʾsāʾ*) et le dommage (*ḍarrāʾ*), afin qu'elles s'humilient en suppliant (*yataḍarraʿūn*).
- ref: S.6:43
  ar: فَلَوْلَا إِذْ جَاءَهُمْ بَأْسُنَا تَضَرَّعُوا وَلَٰكِنْ قَسَتْ قُلُوبُهُمْ وَزَيَّنَ لَهُمُ الشَّيْطَانُ مَا كَانُوا يَعْمَلُونَ
  trl: Fa-lawlā idh jāʾahum baʾsunā taḍarraʿū wa-lākin qasat qulūbuhum wa-zayyana lahumu sh-shayṭānu mā kānū yaʿmalūn
  trad: Pourquoi donc, lorsque Notre malheur (*baʾs*) leur est venu, ne se sont-ils pas humiliés en suppliant ? Mais leurs cœurs se sont endurcis (*qasat*), et le *shayṭān* leur a embelli (*zayyana*) ce qu'ils faisaient.
- ref: S.6:44
  ar: فَلَمَّا نَسُوا مَا ذُكِّرُوا بِهِ فَتَحْنَا عَلَيْهِمْ أَبْوَابَ كُلِّ شَيْءٍ حَتَّىٰ إِذَا فَرِحُوا بِمَا أُوتُوا أَخَذْنَاهُمْ بَغْتَةً فَإِذَا هُمْ مُبْلِسُونَ
  trl: Fa-lammā nasū mā dhukkirū bihi fataḥnā ʿalayhim abwāba kulli shayʾin ḥattā idhā fariḥū bi-mā ūtū akhadhnāhum baghtatan fa-idhā hum mublisūn
  trad: Puis, lorsqu'ils ont oublié ce qui leur avait été rappelé, Nous leur avons ouvert les portes de toute chose — jusqu'à ce que, se réjouissant de ce qui leur avait été donné, Nous les saisissions soudainement (*baghtatan*), et les voilà plongés dans un désespoir muet (*mublisūn*).
- ref: S.6:45
  ar: فَقُطِعَ دَابِرُ الْقَوْمِ الَّذِينَ ظَلَمُوا ۚ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ
  trl: Fa-quṭiʿa dābiru l-qawmi lladhīna ẓalamū wa-l-ḥamdu li-llāhi rabbi l-ʿālamīn
  trad: Ainsi fut tranchée la racine (*dābir*) du peuple *ẓālim* — et la *ḥamd* appartient à Allaah, *Rabb* des mondes (*al-ʿālamīn*).
- ref: S.6:46
  ar: قُلْ أَرَأَيْتُمْ إِنْ أَخَذَ اللَّهُ سَمْعَكُمْ وَأَبْصَارَكُمْ وَخَتَمَ عَلَىٰ قُلُوبِكُمْ مَنْ إِلَٰهٌ غَيْرُ اللَّهِ يَأْتِيكُمْ بِهِ ۗ انْظُرْ كَيْفَ نُصَرِّفُ الْآيَاتِ ثُمَّ هُمْ يَصْدِفُونَ
  trl: Qul araʾaytum in akhadha llāhu samʿakum wa-abṣārakum wa-khatama ʿalā qulūbikum man ilāhun ghayru llāhi yaʾtīkum bihi unẓur kayfa nuṣarrifu l-āyāti thumma hum yaṣdifūn
  trad: 'Dis : « Considérez-vous (*araʾaytum*) — si Allaah reprenait votre ouïe et vos vues, et scellait (*khatama*) vos cœurs, quel *ilāh* autre qu''Allaah vous les rendrait ? » Regarde comment Nous diversifions (*nuṣarrifu*) les *āyāt* — et pourtant ils s''en détournent (*yaṣdifūn*).'
- ref: S.6:47
  ar: قُلْ أَرَأَيْتَكُمْ إِنْ أَتَاكُمْ عَذَابُ اللَّهِ بَغْتَةً أَوْ جَهْرَةً هَلْ يُهْلَكُ إِلَّا الْقَوْمُ الظَّالِمُونَ
  trl: Qul araʾaytakum in atākum ʿadhābu llāhi baghtatan aw jahratan hal yuhlaku illā l-qawmu ẓ-ẓālimūn
  trad: 'Dis : « Considérez-vous — si le châtiment d''Allaah vous venait soudainement (*baghtatan*) ou ouvertement (*jahratan*) — qui d''autre serait détruit (*yuhlaku*), sinon le peuple *ẓālim* ? »'
- ref: S.6:48
  ar: وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنْذِرِينَ ۖ فَمَنْ آمَنَ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: Wa-mā nursilu l-mursalīna illā mubashshirīna wa-mundhirīna fa-man āmana wa-aṣlaḥa fa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: Or, Nous n'envoyons les *mursalūn* que comme annonciateurs (*mubashshirīn*) et avertisseurs (*mundhirīn*) — quiconque croit et se réforme (*aṣlaḥa*), nulle crainte sur eux, et ils ne seront pas attristés.
- ref: S.6:49
  ar: وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا يَمَسُّهُمُ الْعَذَابُ بِمَا كَانُوا يَفْسُقُونَ
  trl: Wa-lladhīna kadhdhabū bi-āyātinā yamassuhumu l-ʿadhābu bi-mā kānū yafsuqūn
  trad: Et ceux qui ont démenti Nos *āyāt*, le châtiment les touchera pour le *fisq* qu'ils commettaient (*yafsuqūn*).
- ref: S.6:50
  ar: قُلْ لَا أَقُولُ لَكُمْ عِنْدِي خَزَائِنُ اللَّهِ وَلَا أَعْلَمُ الْغَيْبَ وَلَا أَقُولُ لَكُمْ إِنِّي مَلَكٌ ۖ إِنْ أَتَّبِعُ إِلَّا مَا يُوحَىٰ إِلَيَّ ۚ قُلْ هَلْ يَسْتَوِي الْأَعْمَىٰ وَالْبَصِيرُ ۚ أَفَلَا تَتَفَكَّرُونَ
  trl: Qul lā aqūlu lakum ʿindī khazāʾinu llāhi wa-lā aʿlamu l-ghayba wa-lā aqūlu lakum innī malakun in attabiʿu illā mā yūḥā ilayya qul hal yastawī l-aʿmā wa-l-baṣīru a-fa-lā tatafakkarūn
  trad: 'Dis : « Je ne vous dis pas que j''ai auprès de moi les trésors (*khazāʾin*) d''Allaah, ni que je connais le *ghayb*, ni que je suis un *malak* — je ne suis que ce qui m''est révélé (*yūḥā*). » Dis : « L''aveugle et le voyant sont-ils égaux (*yastawī*) ? » Ne réfléchissez-vous donc pas ?'
- ref: S.6:51
  ar: وَأَنْذِرْ بِهِ الَّذِينَ يَخَافُونَ أَنْ يُحْشَرُوا إِلَىٰ رَبِّهِمْ ۙ لَيْسَ لَهُمْ مِنْ دُونِهِ وَلِيٌّ وَلَا شَفِيعٌ لَعَلَّهُمْ يَتَّقُونَ
  trl: Wa-andhir bihi lladhīna yakhāfūna an yuḥsharū ilā rabbihim laysa lahum min dūnihi waliyyun wa-lā shafīʿun laʿallahum yattaqūn
  trad: Et avertis, par lui, ceux qui craignent d'être rassemblés vers leur *Rabb* — ils n'ont, en dehors de Lui, ni *walī* ni *shafīʿ* — puisse-t-il en résulter qu'ils se prémunissent (*yattaqūn*).
- ref: S.6:52
  ar: وَلَا تَطْرُدِ الَّذِينَ يَدْعُونَ رَبَّهُمْ بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ مَا عَلَيْكَ مِنْ حِسَابِهِمْ مِنْ شَيْءٍ وَمَا مِنْ حِسَابِكَ عَلَيْهِمْ مِنْ شَيْءٍ فَتَطْرُدَهُمْ فَتَكُونَ مِنَ الظَّالِمِينَ
  trl: Wa-lā taṭrudi lladhīna yadʿūna rabbahum bi-l-ghadāti wa-l-ʿashiyyi yurīdūna wajhahu mā ʿalayka min ḥisābihim min shayʾin wa-mā min ḥisābika ʿalayhim min shayʾin fa-taṭrudahum fa-takūna mina ẓ-ẓālimīn
  trad: Et ne repousse (*taṭrud*) pas ceux qui invoquent leur *Rabb*, matin (*ghadāt*) et soir (*ʿashiyy*), ne visant que Lui-même (*yurīdūna wajhahu*). Tu n'as rien à voir avec leur reddition de comptes, ni eux avec la tienne — que tu les repousses, et tu serais alors du nombre des *ẓālimūn*.
- ref: S.6:53
  ar: وَكَذَٰلِكَ فَتَنَّا بَعْضَهُمْ بِبَعْضٍ لِيَقُولُوا أَهَٰؤُلَاءِ مَنَّ اللَّهُ عَلَيْهِمْ مِنْ بَيْنِنَا ۗ أَلَيْسَ اللَّهُ بِأَعْلَمَ بِالشَّاكِرِينَ
  trl: Wa-kadhālika fatannā baʿḍahum bi-baʿḍin li-yaqūlū a-hāʾulāʾi manna llāhu ʿalayhim min bayninā a-laysa llāhu bi-aʿlama bi-sh-shākirīn
  trad: 'Et ainsi Nous éprouvons (*fatannā*) les uns par les autres, si bien qu''ils disent : « Serait-ce ceux-là qu''Allaah aurait favorisés (*manna*) parmi nous ? » Allaah n''est-Il pas le plus connaissant de ceux qui rendent grâce (*shākirīn*) ?'
- ref: S.6:54
  ar: وَإِذَا جَاءَكَ الَّذِينَ يُؤْمِنُونَ بِآيَاتِنَا فَقُلْ سَلَامٌ عَلَيْكُمْ ۖ كَتَبَ رَبُّكُمْ عَلَىٰ نَفْسِهِ الرَّحْمَةَ ۖ أَنَّهُ مَنْ عَمِلَ مِنْكُمْ سُوءًا بِجَهَالَةٍ ثُمَّ تَابَ مِنْ بَعْدِهِ وَأَصْلَحَ فَأَنَّهُ غَفُورٌ رَحِيمٌ
  trl: Wa-idhā jāʾaka lladhīna yuʾminūna bi-āyātinā fa-qul salāmun ʿalaykum kataba rabbukum ʿalā nafsihi r-raḥmata annahu man ʿamila minkum sūʾan bi-jahālatin thumma tāba min baʿdihi wa-aṣlaḥa fa-annahu ghafūrun raḥīm
  trad: 'Et lorsque viennent à toi ceux qui croient en Nos *āyāt*, dis : « Paix sur vous ! » Votre *Rabb* a inscrit sur Lui-même la *raḥma* — quiconque parmi vous a commis un mal par ignorance (*jahāla*), puis s''est repenti (*tāba*) après cela et s''est réformé (*aṣlaḥa*), alors Il est *Ghafūr*, *Raḥīm*.'
- ref: S.6:55
  ar: وَكَذَٰلِكَ نُفَصِّلُ الْآيَاتِ وَلِتَسْتَبِينَ سَبِيلُ الْمُجْرِمِينَ
  trl: Wa-kadhālika nufaṣṣilu l-āyāti wa-li-tastabīna sabīlu l-mujrimīn
  trad: Et ainsi Nous détaillons (*nufaṣṣilu*) les *āyāt*, afin que devienne manifeste (*tastabīna*) la voie des *mujrimūn*.
- ref: S.6:56
  ar: قُلْ إِنِّي نُهِيتُ أَنْ أَعْبُدَ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللَّهِ ۚ قُلْ لَا أَتَّبِعُ أَهْوَاءَكُمْ ۙ قَدْ ضَلَلْتُ إِذًا وَمَا أَنَا مِنَ الْمُهْتَدِينَ
  trl: Qul innī nuhītu an aʿbuda lladhīna tadʿūna min dūni llāhi qul lā attabiʿu ahwāʾakum qad ḍalaltu idhan wa-mā anā mina l-muhtadīn
  trad: 'Dis : « Il m''a été interdit (*nuhītu*) d''adorer ceux que vous invoquez en dehors d''Allaah. » Dis : « Je ne suis pas vos *ahwāʾ* (désirs propres) — je me serais alors égaré, et je ne serais pas du nombre des bien-guidés (*al-muhtadīn*). »'
- ref: S.6:57
  ar: قُلْ إِنِّي عَلَىٰ بَيِّنَةٍ مِنْ رَبِّي وَكَذَّبْتُمْ بِهِ ۚ مَا عِنْدِي مَا تَسْتَعْجِلُونَ بِهِ ۚ إِنِ الْحُكْمُ إِلَّا لِلَّهِ ۖ يَقُصُّ الْحَقَّ ۖ وَهُوَ خَيْرُ الْفَاصِلِينَ
  trl: Qul innī ʿalā bayyinatin min rabbī wa-kadhdhabtum bihi mā ʿindī mā tastaʿjilūna bihi ini l-ḥukmu illā li-llāhi yaquṣṣu l-ḥaqqa wa-huwa khayru l-fāṣilīn
  trad: 'Dis : « Je m''appuie sur une preuve claire (*bayyina*) venant de mon *Rabb*, et vous l''avez démentie. Je n''ai pas ce que vous cherchez à hâter (*tastaʿjilūn*) — le *ḥukm* n''appartient qu''à Allaah. Il relate (*yaquṣṣu*) *al-ḥaqq*, et Il est le meilleur de ceux qui tranchent (*al-fāṣilīn*). »'
- ref: S.6:58
  ar: قُلْ لَوْ أَنَّ عِنْدِي مَا تَسْتَعْجِلُونَ بِهِ لَقُضِيَ الْأَمْرُ بَيْنِي وَبَيْنَكُمْ ۗ وَاللَّهُ أَعْلَمُ بِالظَّالِمِينَ
  trl: Qul law anna ʿindī mā tastaʿjilūna bihi la-quḍiya l-amru baynī wa-baynakum wa-llāhu aʿlamu bi-ẓ-ẓālimīn
  trad: 'Dis : « Si j''avais ce que vous cherchez à hâter, l''affaire aurait déjà été tranchée (*la-quḍiya l-amr*) entre moi et vous. » Et Allaah connaît le mieux les *ẓālimūn*.'
- ref: S.6:59
  ar: ۞ وَعِنْدَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ ۚ وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ ۚ وَمَا تَسْقُطُ مِنْ وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُبِينٍ
  trl: Wa-ʿindahu mafātiḥu l-ghaybi lā yaʿlamuhā illā huwa wa-yaʿlamu mā fi l-barri wa-l-baḥri wa-mā tasquṭu min waraqatin illā yaʿlamuhā wa-lā ḥabbatin fī ẓulumāti l-arḍi wa-lā raṭbin wa-lā yābisin illā fī kitābin mubīn
  trad: 'Et auprès de Lui sont les clefs (*mafātiḥ*) du *ghayb* : nul ne les connaît sinon Lui. Il sait ce qui est sur la terre ferme et dans la mer — et pas une feuille ne tombe sans qu''Il le sache, ni un grain dans les ténèbres (*ẓulumāt*) de la terre, ni rien d''humide ni de sec, sans que cela soit dans un Kitāb manifeste (*mubīn*).'
- ref: S.6:60
  ar: وَهُوَ الَّذِي يَتَوَفَّاكُمْ بِاللَّيْلِ وَيَعْلَمُ مَا جَرَحْتُمْ بِالنَّهَارِ ثُمَّ يَبْعَثُكُمْ فِيهِ لِيُقْضَىٰ أَجَلٌ مُسَمًّى ۖ ثُمَّ إِلَيْهِ مَرْجِعُكُمْ ثُمَّ يُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Wa-huwa lladhī yatawaffākum bi-l-layli wa-yaʿlamu mā jaraḥtum bi-n-nahāri thumma yabʿathukum fīhi li-yuqḍā ajalun musamman thumma ilayhi marjiʿukum thumma yunabbiʾukum bi-mā kuntum taʿmalūn
  trad: Et Il est Ce qui vous reprend pleinement (*yatawaffākum*) la nuit, et sait ce que vous avez acquis (*jaraḥtum*) le jour — puis Il vous réveille (*yabʿathukum*) en ce jour, afin que s'accomplisse un terme nommément fixé — puis c'est vers Lui votre retour, puis Il vous informera de ce que vous faisiez.
- ref: S.6:61
  ar: وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ ۖ وَيُرْسِلُ عَلَيْكُمْ حَفَظَةً حَتَّىٰ إِذَا جَاءَ أَحَدَكُمُ الْمَوْتُ تَوَفَّتْهُ رُسُلُنَا وَهُمْ لَا يُفَرِّطُونَ
  trl: Wa-huwa l-qāhiru fawqa ʿibādihi wa-yursilu ʿalaykum ḥafaẓatan ḥattā idhā jāʾa aḥadakumu l-mawtu tawaffathu rusulunā wa-hum lā yufarriṭūn
  trad: 'Et Il prévaut, en pleine maîtrise (*al-qāhir*), sur Ses *ʿibād* — et Il envoie sur vous des gardiens (*ḥafaẓa*), jusqu''à ce que la mort vienne à l''un de vous : Nos *rusul* le reprennent alors pleinement (*tawaffathu*), sans qu''ils ne négligent rien (*lā yufarriṭūn*).'
- ref: S.6:62
  ar: ثُمَّ رُدُّوا إِلَى اللَّهِ مَوْلَاهُمُ الْحَقِّ ۚ أَلَا لَهُ الْحُكْمُ وَهُوَ أَسْرَعُ الْحَاسِبِينَ
  trl: Thumma ruddū ilā llāhi mawlāhumu l-ḥaqqi alā lahu l-ḥukmu wa-huwa asraʿu l-ḥāsibīn
  trad: Puis ils sont ramenés à Allaah, leur *Mawlā* véritable (*al-ḥaqq*) — n'est-ce pas à Lui qu'appartient le *ḥukm* ? — et Il est le plus prompt de ceux qui tiennent le compte (*al-ḥāsibīn*).
- ref: S.6:63
  ar: قُلْ مَنْ يُنَجِّيكُمْ مِنْ ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ تَدْعُونَهُ تَضَرُّعًا وَخُفْيَةً لَئِنْ أَنْجَانَا مِنْ هَٰذِهِ لَنَكُونَنَّ مِنَ الشَّاكِرِينَ
  trl: Qul man yunajjīkum min ẓulumāti l-barri wa-l-baḥri tadʿūnahu taḍarruʿan wa-khufyatan la-in anjānā min hādhihi la-nakūnanna mina sh-shākirīn
  trad: 'Dis : « Qui vous sauve (*yunajjīkum*) des ténèbres de la terre et de la mer ? » — vous L''invoquez avec humilité suppliante (*taḍarruʿan*) et en secret (*khufyatan*) : « S''Il nous sauve de celle-ci, nous serons assurément parmi ceux qui rendent grâce ! »'
- ref: S.6:64
  ar: قُلِ اللَّهُ يُنَجِّيكُمْ مِنْهَا وَمِنْ كُلِّ كَرْبٍ ثُمَّ أَنْتُمْ تُشْرِكُونَ
  trl: Quli llāhu yunajjīkum minhā wa-min kulli karbin thumma antum tushrikūn
  trad: 'Dis : « Allaah vous en sauve, ainsi que de toute angoisse (*karb*) — et pourtant vous associez [des partenaires] (*tushrikūn*). »'
- ref: S.6:65
  ar: قُلْ هُوَ الْقَادِرُ عَلَىٰ أَنْ يَبْعَثَ عَلَيْكُمْ عَذَابًا مِنْ فَوْقِكُمْ أَوْ مِنْ تَحْتِ أَرْجُلِكُمْ أَوْ يَلْبِسَكُمْ شِيَعًا وَيُذِيقَ بَعْضَكُمْ بَأْسَ بَعْضٍ ۗ انْظُرْ كَيْفَ نُصَرِّفُ الْآيَاتِ لَعَلَّهُمْ يَفْقَهُونَ
  trl: Qul huwa l-qādiru ʿalā an yabʿatha ʿalaykum ʿadhāban min fawqikum aw min taḥti arjulikum aw yalbisakum shiyaʿan wa-yudhīqa baʿḍakum baʾsa baʿḍin unẓur kayfa nuṣarrifu l-āyāti laʿallahum yafqahūn
  trad: 'Dis : « Il est en pleine capacité (*al-qādir*) d''envoyer sur vous un châtiment d''en haut ou de sous vos pieds, ou de vous confondre (*yalbisakum*) en sectes (*shiyaʿan*) rivales, et de faire goûter aux uns la violence des autres. » Regarde comment Nous diversifions les *āyāt*, puissent-ils comprendre (*yafqahūn*) !'
- ref: S.6:66
  ar: وَكَذَّبَ بِهِ قَوْمُكَ وَهُوَ الْحَقُّ ۚ قُلْ لَسْتُ عَلَيْكُمْ بِوَكِيلٍ
  trl: Wa-kadhdhaba bihi qawmuka wa-huwa l-ḥaqqu qul lastu ʿalaykum bi-wakīl
  trad: 'Et ton peuple (*qawmuka*) l''a démenti, alors que c''est *al-ḥaqq*. Dis : « Je ne suis pas, sur vous, un *wakīl* (garant chargé de veiller). »'
- ref: S.6:67
  ar: لِكُلِّ نَبَإٍ مُسْتَقَرٌّ ۚ وَسَوْفَ تَعْلَمُونَ
  trl: Li-kulli nabaʾin mustaqarrun wa-sawfa taʿlamūn
  trad: À chaque nouvelle (*naba'*) son terme d'établissement (*mustaqarr*) — et vous saurez bientôt.
- ref: S.6:68
  ar: وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ ۚ وَإِمَّا يُنْسِيَنَّكَ الشَّيْطَانُ فَلَا تَقْعُدْ بَعْدَ الذِّكْرَىٰ مَعَ الْقَوْمِ الظَّالِمِينَ
  trl: Wa-idhā raʾayta lladhīna yakhūḍūna fī āyātinā fa-aʿriḍ ʿanhum ḥattā yakhūḍū fī ḥadīthin ghayrihi wa-immā yunsiyannaka sh-shayṭānu fa-lā taqʿud baʿda dh-dhikrā maʿa l-qawmi ẓ-ẓālimīn
  trad: Et lorsque tu vois ceux qui se plongent (*yakhūḍūna*) dans [la moquerie de] Nos *āyāt*, détourne-toi (*aʿriḍ*) d'eux jusqu'à ce qu'ils se tournent vers un autre propos. Et si le *shayṭān* venait à te le faire oublier, ne reste pas assis, une fois le rappel revenu, avec le peuple *ẓālim*.
- ref: S.6:69
  ar: وَمَا عَلَى الَّذِينَ يَتَّقُونَ مِنْ حِسَابِهِمْ مِنْ شَيْءٍ وَلَٰكِنْ ذِكْرَىٰ لَعَلَّهُمْ يَتَّقُونَ
  trl: Wa-mā ʿalā lladhīna yattaqūna min ḥisābihim min shayʾin wa-lākin dhikrā laʿallahum yattaqūn
  trad: Et ceux qui se prémunissent (*yattaqūn*) ne portent rien de la reddition de comptes [de ces gens-là] — mais [seulement] un rappel (*dhikrā*), puissent-ils s'en prémunir.
- ref: S.6:70
  ar: وَذَرِ الَّذِينَ اتَّخَذُوا دِينَهُمْ لَعِبًا وَلَهْوًا وَغَرَّتْهُمُ الْحَيَاةُ الدُّنْيَا ۚ وَذَكِّرْ بِهِ أَنْ تُبْسَلَ نَفْسٌ بِمَا كَسَبَتْ لَيْسَ لَهَا مِنْ دُونِ اللَّهِ وَلِيٌّ وَلَا شَفِيعٌ وَإِنْ تَعْدِلْ كُلَّ عَدْلٍ لَا يُؤْخَذْ مِنْهَا ۗ أُولَٰئِكَ الَّذِينَ أُبْسِلُوا بِمَا كَسَبُوا ۖ لَهُمْ شَرَابٌ مِنْ حَمِيمٍ وَعَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْفُرُونَ
  trl: Wa-dhari lladhīna ttakhadhū dīnahum laʿiban wa-lahwan wa-gharrathumu l-ḥayātu d-dunyā wa-dhakkir bihi an tubsala nafsun bi-mā kasabat laysa lahā min dūni llāhi waliyyun wa-lā shafīʿun wa-in taʿdil kulla ʿadlin lā yuʾkhadh minhā ulāʾika lladhīna ubsilū bi-mā kasabū lahum sharābun min ḥamīmin wa-ʿadhābun alīmun bi-mā kānū yakfurūn
  trad: Et laisse (*dhari*) ceux qui ont pris leur *dīn* comme jeu et divertissement, et que la vie d'ici-bas a dupés (*gharrat*) — mais rappelle, par lui, qu'une *nafs* pourrait être livrée à sa ruine (*tubsala*) pour ce qu'elle a acquis, sans avoir, en dehors d'Allaah, ni *walī* ni *shafīʿ* ; et même si elle offrait toute compensation possible (*taʿdil kulla ʿadl*), elle ne serait pas acceptée d'elle. Voilà ceux qui sont livrés à leur ruine (*ubsilū*) pour ce qu'ils ont acquis — pour eux, une boisson d'eau bouillante (*ḥamīm*) et un châtiment douloureux, pour le *kufr* qu'ils commettaient.
- ref: S.6:71
  ar: قُلْ أَنَدْعُو مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُنَا وَلَا يَضُرُّنَا وَنُرَدُّ عَلَىٰ أَعْقَابِنَا بَعْدَ إِذْ هَدَانَا اللَّهُ كَالَّذِي اسْتَهْوَتْهُ الشَّيَاطِينُ فِي الْأَرْضِ حَيْرَانَ لَهُ أَصْحَابٌ يَدْعُونَهُ إِلَى الْهُدَى ائْتِنَا ۗ قُلْ إِنَّ هُدَى اللَّهِ هُوَ الْهُدَىٰ ۖ وَأُمِرْنَا لِنُسْلِمَ لِرَبِّ الْعَالَمِينَ
  trl: Qul anadʿū min dūni llāhi mā lā yanfaʿunā wa-lā yaḍurrunā wa-nuraddu ʿalā aʿqābinā baʿda idh hadānā llāhu ka-lladhi stahwathu sh-shayāṭīnu fi l-arḍi ḥayrāna lahu aṣḥābun yadʿūnahu ilā l-hudā iʾtinā qul inna hudā llāhi huwa l-hudā wa-umirnā li-nuslima li-rabbi l-ʿālamīn
  trad: 'Dis : « Invoquerions-nous, en dehors d''Allaah, ce qui ne nous est ni utile ni nuisible, et serions-nous ramenés sur nos talons (*nuraddu ʿalā aʿqābinā*) après qu''Allaah nous a guidés — comme celui que les *shayāṭīn* ont fait choir et égarer (*istahwathu*) sur la terre, désorienté (*ḥayrān*), tandis que des compagnons l''appellent vers la guidance : « Viens à nous ! » » Dis : « La guidance d''Allaah, voilà *la* guidance — et il nous a été ordonné de nous soumettre (*nuslima*) au *Rabb* des mondes. »'
- ref: S.6:72
  ar: وَأَنْ أَقِيمُوا الصَّلَاةَ وَاتَّقُوهُ ۚ وَهُوَ الَّذِي إِلَيْهِ تُحْشَرُونَ
  trl: Wa-an aqīmū ṣ-ṣalāta wa-ttaqūhu wa-huwa lladhī ilayhi tuḥsharūn
  trad: Et [il nous a été ordonné] d'établir la *ṣalāt* et de nous prémunir de Lui (*wa-ttaqūhu*) — et Il est Ce vers quoi vous serez rassemblés.
- ref: S.6:73
  ar: وَهُوَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ ۖ وَيَوْمَ يَقُولُ كُنْ فَيَكُونُ ۚ قَوْلُهُ الْحَقُّ ۚ وَلَهُ الْمُلْكُ يَوْمَ يُنْفَخُ فِي الصُّورِ ۚ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۚ وَهُوَ الْحَكِيمُ الْخَبِيرُ
  trl: Wa-huwa lladhī khalaqa s-samāwāti wa-l-arḍa bi-l-ḥaqqi wa-yawma yaqūlu kun fa-yakūnu qawluhu l-ḥaqqu wa-lahu l-mulku yawma yunfakhu fī ṣ-ṣūri ʿālimu l-ghaybi wa-sh-shahādati wa-huwa l-ḥakīmu l-khabīr
  trad: Et Il est Ce qui a créé les cieux et la terre en toute vérité (*bi-l-ḥaqq*) — et le jour où Il dit « Sois » (*kun*), et cela est (*fa-yakūn*) — Sa parole est *al-ḥaqq* — et à Lui appartient la royauté (*al-mulk*) le jour où il sera soufflé dans le *Ṣūr* — Ce qui connaît l'invisible (*al-ghayb*) et le visible (*ash-shahāda*) — et Il est *al-Ḥakīm*, *al-Khabīr*.
- ref: S.6:74
  ar: ۞ وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ آزَرَ أَتَتَّخِذُ أَصْنَامًا آلِهَةً ۖ إِنِّي أَرَاكَ وَقَوْمَكَ فِي ضَلَالٍ مُبِينٍ
  trl: Wa-idh qāla ibrāhīmu li-abīhi āzara a-tattakhidhu aṣnāman ālihatan innī arāka wa-qawmaka fī ḍalālin mubīn
  trad: 'Et lorsque Ibrāhīm dit à son père, Āzar : « Prendrais-tu des idoles (*aṣnām*) comme *ilāh* ? Je te vois, toi et ton peuple, dans un égarement manifeste. »'
- ref: S.6:75
  ar: وَكَذَٰلِكَ نُرِي إِبْرَاهِيمَ مَلَكُوتَ السَّمَاوَاتِ وَالْأَرْضِ وَلِيَكُونَ مِنَ الْمُوقِنِينَ
  trl: Wa-kadhālika nurī ibrāhīma malakūta s-samāwāti wa-l-arḍi wa-li-yakūna mina l-mūqinīn
  trad: Et ainsi Nous montrons à Ibrāhīm le *malakūt* des cieux et de la terre, afin qu'il soit du nombre de ceux qui possèdent la *yaqīn* (*al-mūqinīn*).
- ref: S.6:76
  ar: فَلَمَّا جَنَّ عَلَيْهِ اللَّيْلُ رَأَىٰ كَوْكَبًا ۖ قَالَ هَٰذَا رَبِّي ۖ فَلَمَّا أَفَلَ قَالَ لَا أُحِبُّ الْآفِلِينَ
  trl: Fa-lammā janna ʿalayhi l-laylu raʾā kawkaban qāla hādhā rabbī fa-lammā afala qāla lā uḥibbu l-āfilīn
  trad: 'Lorsque la nuit l''enveloppa (*jannā*), il vit un astre (*kawkab*) et dit : « Voici mon *rabb* » — puis, quand celui-ci déclina (*afala*), il dit : « Je n''affectionne pas ce qui décline. »'
- ref: S.6:77
  ar: فَلَمَّا رَأَى الْقَمَرَ بَازِغًا قَالَ هَٰذَا رَبِّي ۖ فَلَمَّا أَفَلَ قَالَ لَئِنْ لَمْ يَهْدِنِي رَبِّي لَأَكُونَنَّ مِنَ الْقَوْمِ الضَّالِّينَ
  trl: Fa-lammā raʾa l-qamara bāzighan qāla hādhā rabbī fa-lammā afala qāla la-in lam yahdinī rabbī la-akūnanna mina l-qawmi ḍ-ḍāllīn
  trad: 'Puis, voyant la lune se lever (*bāzighan*), il dit : « Voici mon *rabb* » — mais quand elle déclina, il dit : « Si mon *Rabb* ne me guide pas, je serai assurément du nombre du peuple égaré. »'
- ref: S.6:78
  ar: فَلَمَّا رَأَى الشَّمْسَ بَازِغَةً قَالَ هَٰذَا رَبِّي هَٰذَا أَكْبَرُ ۖ فَلَمَّا أَفَلَتْ قَالَ يَا قَوْمِ إِنِّي بَرِيءٌ مِمَّا تُشْرِكُونَ
  trl: Fa-lammā raʾa sh-shamsa bāzighatan qāla hādhā rabbī hādhā akbar fa-lammā afalat qāla yā qawmi innī barīʾun mimmā tushrikūn
  trad: 'Puis, voyant le soleil se lever, il dit : « Voici mon *rabb*, celui-ci est plus grand (*akbar*) » — mais quand il déclina, il dit : « Ô mon peuple, je suis exempt (*barīʾ*) de ce que vous associez. »'
- ref: S.6:79
  ar: إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا ۖ وَمَا أَنَا مِنَ الْمُشْرِكِينَ
  trl: Innī wajjahtu wajhiya li-lladhī faṭara s-samāwāti wa-l-arḍa ḥanīfan wa-mā anā mina l-mushrikīn
  trad: Je tourne mon être tout entier (*wajjahtu wajhiya*) vers Ce qui a fait exister (*faṭara*) les cieux et la terre, en *ḥanīf* — et je ne suis pas du nombre des *mushrikūn*.
- ref: S.6:80
  ar: وَحَاجَّهُ قَوْمُهُ ۚ قَالَ أَتُحَاجُّونِّي فِي اللَّهِ وَقَدْ هَدَانِ ۚ وَلَا أَخَافُ مَا تُشْرِكُونَ بِهِ إِلَّا أَنْ يَشَاءَ رَبِّي شَيْئًا ۗ وَسِعَ رَبِّي كُلَّ شَيْءٍ عِلْمًا ۗ أَفَلَا تَتَذَكَّرُونَ
  trl: Wa-ḥājjahu qawmuhu qāla a-tuḥājjūnnī fi llāhi wa-qad hadāni wa-lā akhāfu mā tushrikūna bihi illā an yashāʾa rabbī shayʾan wasiʿa rabbī kulla shayʾin ʿilman a-fa-lā tatadhakkarūn
  trad: 'Et son peuple entra en controverse (*ḥājja*) avec lui — il dit : « Discutez-vous avec moi au sujet d''Allaah, alors qu''Il m''a déjà guidé ? Je ne crains pas ce que vous Lui associez, sauf si mon *Rabb* veut quelque chose [de particulier] — mon *Rabb* embrasse toute chose en connaissance (*wasiʿa … ʿilman*) — ne vous rappelez-vous donc pas ? »'
- ref: S.6:81
  ar: وَكَيْفَ أَخَافُ مَا أَشْرَكْتُمْ وَلَا تَخَافُونَ أَنَّكُمْ أَشْرَكْتُمْ بِاللَّهِ مَا لَمْ يُنَزِّلْ بِهِ عَلَيْكُمْ سُلْطَانًا ۚ فَأَيُّ الْفَرِيقَيْنِ أَحَقُّ بِالْأَمْنِ ۖ إِنْ كُنْتُمْ تَعْلَمُونَ
  trl: Wa-kayfa akhāfu mā ashraktum wa-lā takhāfūna annakum ashraktum bi-llāhi mā lam yunazzil bihi ʿalaykum sulṭānan fa-ayyu l-farīqayni aḥaqqu bi-l-amni in kuntum taʿlamūn
  trad: Et comment craindrais-je ce que vous avez associé, alors que vous ne craignez pas d'avoir associé à Allaah ce sur quoi Il n'a fait descendre sur vous aucun *sulṭān* ? Lequel des deux camps (*al-farīqayn*) est donc le plus digne de la sécurité (*al-amn*), si vous savez ? »
- ref: S.6:82
  ar: الَّذِينَ آمَنُوا وَلَمْ يَلْبِسُوا إِيمَانَهُمْ بِظُلْمٍ أُولَٰئِكَ لَهُمُ الْأَمْنُ وَهُمْ مُهْتَدُونَ
  trl: Alladhīna āmanū wa-lam yalbisū īmānahum bi-ẓulmin ulāʾika lahumu l-amnu wa-hum muhtadūn
  trad: Ceux qui ont cru et n'ont pas recouvert (*lam yalbisū*) leur foi d'injustice (*ẓulm*), voilà ceux à qui revient la sécurité — et ce sont eux les bien-guidés (*al-muhtadūn*).
- ref: S.6:83
  ar: وَتِلْكَ حُجَّتُنَا آتَيْنَاهَا إِبْرَاهِيمَ عَلَىٰ قَوْمِهِ ۚ نَرْفَعُ دَرَجَاتٍ مَنْ نَشَاءُ ۗ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٌ
  trl: Wa-tilka ḥujjatunā ātaynāhā ibrāhīma ʿalā qawmihi narfaʿu darajātin man nashāʾu inna rabbaka ḥakīmun ʿalīm
  trad: Et voilà Notre *ḥujja*, que Nous avons donnée à Ibrāhīm contre son peuple — Nous élevons en degrés (*darajāt*) qui Nous voulons — ton *Rabb* est certes *Ḥakīm*, *ʿAlīm*.
- ref: S.6:84
  ar: وَوَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ ۚ كُلًّا هَدَيْنَا ۚ وَنُوحًا هَدَيْنَا مِنْ قَبْلُ ۖ وَمِنْ ذُرِّيَّتِهِ دَاوُودَ وَسُلَيْمَانَ وَأَيُّوبَ وَيُوسُفَ وَمُوسَىٰ وَهَارُونَ ۚ وَكَذَٰلِكَ نَجْزِي الْمُحْسِنِينَ
  trl: Wa-wahabnā lahu isḥāqa wa-yaʿqūba kullan hadaynā wa-nūḥan hadaynā min qablu wa-min dhurriyyatihi dāwūda wa-sulaymāna wa-ayyūba wa-yūsufa wa-mūsā wa-hārūna wa-kadhālika najzī l-muḥsinīn
  trad: 'Et Nous lui avons fait don d''Isḥāq et de Yaʿqūb — chacun, Nous l''avons guidé — et Nūḥ, Nous l''avions guidé auparavant — et parmi sa descendance (*min dhurriyyatihi*) : Dāwūd, Sulaymān, Ayyūb, Yūsuf, Mūsā et Hārūn — ainsi rétribuons-Nous (*najzī*) les *muḥsinūn*.'
- ref: S.6:85
  ar: وَزَكَرِيَّا وَيَحْيَىٰ وَعِيسَىٰ وَإِلْيَاسَ ۖ كُلٌّ مِنَ الصَّالِحِينَ
  trl: Wa-zakariyyā wa-yaḥyā wa-ʿīsā wa-ilyāsa kullun mina ṣ-ṣāliḥīn
  trad: Et Zakariyyā, Yaḥyā, ʿĪsā et Ilyās — tous parmi les *ṣāliḥūn*.
- ref: S.6:86
  ar: وَإِسْمَاعِيلَ وَالْيَسَعَ وَيُونُسَ وَلُوطًا ۚ وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ
  trl: Wa-ismāʿīla wa-l-yasaʿa wa-yūnusa wa-lūṭan wa-kullan faḍḍalnā ʿala l-ʿālamīn
  trad: Et Ismāʿīl, al-Yasaʿ, Yūnus et Lūṭ — et chacun, Nous l'avons favorisé (*faḍḍalnā*) sur les mondes.
- ref: S.6:87
  ar: وَمِنْ آبَائِهِمْ وَذُرِّيَّاتِهِمْ وَإِخْوَانِهِمْ ۖ وَاجْتَبَيْنَاهُمْ وَهَدَيْنَاهُمْ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Wa-min ābāʾihim wa-dhurriyyātihim wa-ikhwānihim wa-jtabaynāhum wa-hadaynāhum ilā ṣirāṭin mustaqīm
  trad: 'Et parmi leurs pères, leurs descendances et leurs frères : Nous les avons élus (*ijtabaynāhum*) et guidés vers un *ṣirāṭ* droit.'
- ref: S.6:88
  ar: ذَٰلِكَ هُدَى اللَّهِ يَهْدِي بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ ۚ وَلَوْ أَشْرَكُوا لَحَبِطَ عَنْهُمْ مَا كَانُوا يَعْمَلُونَ
  trl: Dhālika hudā llāhi yahdī bihi man yashāʾu min ʿibādihi wa-law ashrakū la-ḥabiṭa ʿanhum mā kānū yaʿmalūn
  trad: Voilà la guidance d'Allaah, par laquelle Il guide qui Il veut parmi Ses *ʿibād* — et s'ils avaient associé, ce qu'ils faisaient se serait effondré (*la-ḥabiṭa*) loin d'eux.
- ref: S.6:89
  ar: أُولَٰئِكَ الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ وَالْحُكْمَ وَالنُّبُوَّةَ ۚ فَإِنْ يَكْفُرْ بِهَا هَٰؤُلَاءِ فَقَدْ وَكَّلْنَا بِهَا قَوْمًا لَيْسُوا بِهَا بِكَافِرِينَ
  trl: Ulāʾika lladhīna ātaynāhumu l-kitāba wa-l-ḥukma wa-n-nubuwwata fa-in yakfur bihā hāʾulāʾi fa-qad wakkalnā bihā qawman laysū bihā bi-kāfirīn
  trad: Voilà ceux à qui Nous avons donné le Kitāb, le *ḥukm* et la *nubuwwa* — si ceux-ci [vos contemporains] les rejettent (*yakfur*), Nous en avons déjà chargé (*wakkalnā*) un peuple qui ne les rejette pas.
- ref: S.6:90
  ar: أُولَٰئِكَ الَّذِينَ هَدَى اللَّهُ ۖ فَبِهُدَاهُمُ اقْتَدِهْ ۗ قُلْ لَا أَسْأَلُكُمْ عَلَيْهِ أَجْرًا ۖ إِنْ هُوَ إِلَّا ذِكْرَىٰ لِلْعَالَمِينَ
  trl: Ulāʾika lladhīna hadā llāhu fa-bi-hudāhumu qtadih qul lā asʾalukum ʿalayhi ajran in huwa illā dhikrā li-l-ʿālamīn
  trad: 'Voilà ceux qu''Allaah a guidés — suis donc leur guidance (*fa-bi-hudāhumu qtadih*). Dis : « Je ne vous demande pour cela aucun salaire (*ajr*) — ce n''est qu''un rappel (*dhikrā*) pour les mondes. »'
- ref: S.6:91
  ar: وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ إِذْ قَالُوا مَا أَنْزَلَ اللَّهُ عَلَىٰ بَشَرٍ مِنْ شَيْءٍ ۗ قُلْ مَنْ أَنْزَلَ الْكِتَابَ الَّذِي جَاءَ بِهِ مُوسَىٰ نُورًا وَهُدًى لِلنَّاسِ ۖ تَجْعَلُونَهُ قَرَاطِيسَ تُبْدُونَهَا وَتُخْفُونَ كَثِيرًا ۖ وَعُلِّمْتُمْ مَا لَمْ تَعْلَمُوا أَنْتُمْ وَلَا آبَاؤُكُمْ ۖ قُلِ اللَّهُ ۖ ثُمَّ ذَرْهُمْ فِي خَوْضِهِمْ يَلْعَبُونَ
  trl: Wa-mā qadarū llāha ḥaqqa qadrihi idh qālū mā anzala llāhu ʿalā basharin min shayʾin qul man anzala l-kitāba lladhī jāʾa bihi mūsā nūran wa-hudan li-n-nāsi tajʿalūnahu qarāṭīsa tubdūnahā wa-tukhfūna kathīran wa-ʿullimtum mā lam taʿlamū antum wa-lā ābāʾukum quli llāhu thumma dharhum fī khawḍihim yalʿabūn
  trad: 'Ils n''ont pas estimé Allaah à Sa juste mesure (*mā qadarū llāha ḥaqqa qadrihi*), lorsqu''ils ont dit : « Allaah n''a rien fait descendre sur aucun être humain (*bashar*). » Dis : « Qui a fait descendre le Kitāb qu''a apporté Mūsā, lumière (*nūr*) et guidance (*hudā*) pour les gens ? Vous en faites des feuillets (*qarāṭīs*) que vous montrez, tout en en cachant beaucoup — et vous avez été instruits de ce que vous ne saviez pas, ni vous ni vos pères. » Dis : « Allaah. » Puis laisse-les se divertir dans leur digression (*khawḍ*).'
- ref: S.6:92
  ar: وَهَٰذَا كِتَابٌ أَنْزَلْنَاهُ مُبَارَكٌ مُصَدِّقُ الَّذِي بَيْنَ يَدَيْهِ وَلِتُنْذِرَ أُمَّ الْقُرَىٰ وَمَنْ حَوْلَهَا ۚ وَالَّذِينَ يُؤْمِنُونَ بِالْآخِرَةِ يُؤْمِنُونَ بِهِ ۖ وَهُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَ
  trl: Wa-hādhā kitābun anzalnāhu mubārakun muṣaddiqu lladhī bayna yadayhi wa-li-tundhira umma l-qurā wa-man ḥawlahā wa-lladhīna yuʾminūna bi-l-ākhirati yuʾminūna bihi wa-hum ʿalā ṣalātihim yuḥāfiẓūn
  trad: Et voici un Kitāb que Nous avons fait descendre, béni (*mubārak*), confirmant (*muṣaddiq*) ce qui le précède, et pour que tu avertisses *Umm al-Qurā* et ceux qui l'entourent. Ceux qui croient en l'Ultime (*al-ākhira*) y croient — et ils préservent (*yuḥāfiẓūn*) leur *ṣalāt*.
- ref: S.6:93
  ar: وَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا أَوْ قَالَ أُوحِيَ إِلَيَّ وَلَمْ يُوحَ إِلَيْهِ شَيْءٌ وَمَنْ قَالَ سَأُنْزِلُ مِثْلَ مَا أَنْزَلَ اللَّهُ ۗ وَلَوْ تَرَىٰ إِذِ الظَّالِمُونَ فِي غَمَرَاتِ الْمَوْتِ وَالْمَلَائِكَةُ بَاسِطُو أَيْدِيهِمْ أَخْرِجُوا أَنْفُسَكُمُ ۖ الْيَوْمَ تُجْزَوْنَ عَذَابَ الْهُونِ بِمَا كُنْتُمْ تَقُولُونَ عَلَى اللَّهِ غَيْرَ الْحَقِّ وَكُنْتُمْ عَنْ آيَاتِهِ تَسْتَكْبِرُونَ
  trl: Wa-man aẓlamu mimmani ftarā ʿala llāhi kadhiban aw qāla ūḥiya ilayya wa-lam yūḥa ilayhi shayʾun wa-man qāla sa-unzilu mithla mā anzala llāhu wa-law tarā idhi ẓ-ẓālimūna fī ghamarāti l-mawti wa-l-malāʾikatu bāsiṭū aydīhim akhrijū anfusakumu l-yawma tujzawna ʿadhāba l-hūni bi-mā kuntum taqūlūna ʿala llāhi ghayra l-ḥaqqi wa-kuntum ʿan āyātihi tastakbirūn
  trad: 'Et qui est plus injuste que celui qui forge (*iftarā*) un mensonge contre Allaah, ou dit : « Il m''a été révélé », alors que rien ne lui a été révélé, ou celui qui dit : « Je vais faire descendre le pareil de ce qu''Allaah a fait descendre » ? Si tu voyais les injustes dans les affres de la mort (*ghamarāt al-mawt*), les *malāʾika* leurs mains tendues (*bāsiṭū aydīhim*) : « Faites sortir vos *nafs* — aujourd''hui vous êtes rétribués du châtiment de l''humiliation (*ʿadhāb al-hūn*), pour avoir dit sur Allaah autre chose que *al-ḥaqq*, et pour vous être détournés avec hauteur (*tastakbirūn*) de Ses *āyāt*. »'
- ref: S.6:94
  ar: وَلَقَدْ جِئْتُمُونَا فُرَادَىٰ كَمَا خَلَقْنَاكُمْ أَوَّلَ مَرَّةٍ وَتَرَكْتُمْ مَا خَوَّلْنَاكُمْ وَرَاءَ ظُهُورِكُمْ ۖ وَمَا نَرَىٰ مَعَكُمْ شُفَعَاءَكُمُ الَّذِينَ زَعَمْتُمْ أَنَّهُمْ فِيكُمْ شُرَكَاءُ ۚ لَقَدْ تَقَطَّعَ بَيْنَكُمْ وَضَلَّ عَنْكُمْ مَا كُنْتُمْ تَزْعُمُونَ
  trl: Wa-la-qad jiʾtumūnā furādā kamā khalaqnākum awwala marratin wa-taraktum mā khawwalnākum warāʾa ẓuhūrikum wa-mā narā maʿakum shufaʿāʾakumu lladhīna zaʿamtum annahum fīkum shurakāʾu la-qad taqaṭṭaʿa baynakum wa-ḍalla ʿankum mā kuntum tazʿumūn
  trad: Et certes, vous voici venus à Nous seuls, isolément (*furādā*), comme Nous vous avons créés la première fois, et vous avez laissé derrière votre dos ce dont Nous vous avions pourvus (*khawwalnākum*) — et Nous ne voyons pas avec vous vos intercesseurs (*shufaʿāʾ*) que vous prétendiez être, parmi vous, des associés (*shurakāʾ*) — les liens entre vous sont rompus (*taqaṭṭaʿa*), et s'est égaré loin de vous ce que vous prétendiez.
- ref: S.6:95
  ar: ۞ إِنَّ اللَّهَ فَالِقُ الْحَبِّ وَالنَّوَىٰ ۖ يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَمُخْرِجُ الْمَيِّتِ مِنَ الْحَيِّ ۚ ذَٰلِكُمُ اللَّهُ ۖ فَأَنَّىٰ تُؤْفَكُونَ
  trl: Inna llāha fāliqu l-ḥabbi wa-n-nawā yukhriju l-ḥayya mina l-mayyiti wa-mukhriju l-mayyiti mina l-ḥayyi dhālikumu llāhu fa-annā tuʾfakūn
  trad: Allaah est certes Ce qui fend (*fāliq*) le grain et le noyau (*al-ḥabb wa-n-nawā*) — Il fait sortir le vivant du mort, et fait sortir le mort du vivant. Voilà Allaah — comment donc vous détourne-t-on (*tuʾfakūn*) ?
- ref: S.6:96
  ar: فَالِقُ الْإِصْبَاحِ وَجَعَلَ اللَّيْلَ سَكَنًا وَالشَّمْسَ وَالْقَمَرَ حُسْبَانًا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ
  trl: Fāliqu l-iṣbāḥi wa-jaʿala l-layla sakanan wa-sh-shamsa wa-l-qamara ḥusbānan dhālika taqdīru l-ʿazīzi l-ʿalīm
  trad: Ce qui fend l'aube (*fāliq al-iṣbāḥ*), et a fait de la nuit un repos (*sakan*), et du soleil et de la lune un moyen de calcul (*ḥusbān*) — voilà la détermination précise (*taqdīr*) d'*al-ʿAzīz*, *al-ʿAlīm*.
- ref: S.6:97
  ar: وَهُوَ الَّذِي جَعَلَ لَكُمُ النُّجُومَ لِتَهْتَدُوا بِهَا فِي ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ ۗ قَدْ فَصَّلْنَا الْآيَاتِ لِقَوْمٍ يَعْلَمُونَ
  trl: Wa-huwa lladhī jaʿala lakumu n-nujūma li-tahtadū bihā fī ẓulumāti l-barri wa-l-baḥri qad faṣṣalna l-āyāti li-qawmin yaʿlamūn
  trad: Et Ce qui a fait pour vous les étoiles, afin que vous soyez guidés par elles dans les ténèbres (*ẓulumāt*) de la terre ferme et de la mer — Nous avons certes détaillé (*faṣṣalnā*) les *āyāt* pour un peuple qui sait.
- ref: S.6:98
  ar: وَهُوَ الَّذِي أَنْشَأَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ فَمُسْتَقَرٌّ وَمُسْتَوْدَعٌ ۗ قَدْ فَصَّلْنَا الْآيَاتِ لِقَوْمٍ يَفْقَهُونَ
  trl: Wa-huwa lladhī anshaʾakum min nafsin wāḥidatin fa-mustaqarrun wa-mustawdaʿun qad faṣṣalna l-āyāti li-qawmin yafqahūn
  trad: Et Ce qui vous a fait naître (*anshaʾa*) d'un *nafs* unique — puis un lieu d'établissement stable (*mustaqarr*) et un lieu de dépôt confié (*mustawdaʿ*) — Nous avons certes détaillé les *āyāt* pour un peuple qui comprend (*yafqahūn*).
- ref: S.6:99
  ar: وَهُوَ الَّذِي أَنْزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجْنَا بِهِ نَبَاتَ كُلِّ شَيْءٍ فَأَخْرَجْنَا مِنْهُ خَضِرًا نُخْرِجُ مِنْهُ حَبًّا مُتَرَاكِبًا وَمِنَ النَّخْلِ مِنْ طَلْعِهَا قِنْوَانٌ دَانِيَةٌ وَجَنَّاتٍ مِنْ أَعْنَابٍ وَالزَّيْتُونَ وَالرُّمَّانَ مُشْتَبِهًا وَغَيْرَ مُتَشَابِهٍ ۗ انْظُرُوا إِلَىٰ ثَمَرِهِ إِذَا أَثْمَرَ وَيَنْعِهِ ۚ إِنَّ فِي ذَٰلِكُمْ لَآيَاتٍ لِقَوْمٍ يُؤْمِنُونَ
  trl: Wa-huwa lladhī anzala mina s-samāʾi māʾan fa-akhrajnā bihi nabāta kulli shayʾin fa-akhrajnā minhu khaḍiran nukhriju minhu ḥabban mutarākiban wa-mina n-nakhli min ṭalʿihā qinwānun dāniyatun wa-jannātin min aʿnābin wa-z-zaytūna wa-r-rummāna mushtabihan wa-ghayra mutashābihin unẓurū ilā thamarihi idhā athmara wa-yanʿihi inna fī dhālikum la-āyātin li-qawmin yuʾminūn
  trad: Et Ce qui a fait descendre du ciel une eau — Nous en avons fait sortir la végétation de toute chose ; Nous en avons fait sortir une verdure (*khaḍir*) d'où Nous faisons sortir un grain disposé en couches superposées (*mutarākib*), et du palmier, de sa spathe (*ṭalʿ*), des grappes rapprochées (*qinwān dāniya*), et des jardins de vignes, l'olivier et le grenadier, semblables et dissemblables (*mushtabih wa-ghayr mutashābih*) — regardez son fruit quand il fructifie, et sa maturation (*yanʿ*) — il y a certes en cela des *āyāt* pour un peuple qui croit.
- ref: S.6:100
  ar: وَجَعَلُوا لِلَّهِ شُرَكَاءَ الْجِنَّ وَخَلَقَهُمْ ۖ وَخَرَقُوا لَهُ بَنِينَ وَبَنَاتٍ بِغَيْرِ عِلْمٍ ۚ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يَصِفُونَ
  trl: Wa-jaʿalū li-llāhi shurakāʾa l-jinna wa-khalaqahum wa-kharaqū lahu banīna wa-banātin bi-ghayri ʿilmin subḥānahu wa-taʿālā ʿammā yaṣifūn
  trad: Et ils ont fait des jinn des associés (*shurakāʾ*) pour Allaah, alors que c'est Lui qui les a créés — et ils Lui ont forgé (*kharaqū*) des fils et des filles sans aucun savoir. Gloire à Lui (*subḥānahu*) — Ce qui transcende (*taʿālā*) ce qu'ils décrivent.
- ref: S.6:101
  ar: بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ ۖ أَنَّىٰ يَكُونُ لَهُ وَلَدٌ وَلَمْ تَكُنْ لَهُ صَاحِبَةٌ ۖ وَخَلَقَ كُلَّ شَيْءٍ ۖ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Badīʿu s-samāwāti wa-l-arḍi annā yakūnu lahu waladun wa-lam takun lahu ṣāḥibatun wa-khalaqa kulla shayʾin wa-huwa bi-kulli shayʾin ʿalīm
  trad: Ce qui a fait exister sans modèle antérieur (*badīʿ*) les cieux et la terre — comment aurait-Il un *walad*, alors qu'Il n'a jamais eu de compagne (*ṣāḥiba*) ? — Il a créé toute chose, et Il est, de toute chose, connaissant.
- ref: S.6:102
  ar: ذَٰلِكُمُ اللَّهُ رَبُّكُمْ ۖ لَا إِلَٰهَ إِلَّا هُوَ ۖ خَالِقُ كُلِّ شَيْءٍ فَاعْبُدُوهُ ۚ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ
  trl: Dhālikumu llāhu rabbukum lā ilāha illā huwa khāliqu kulli shayʾin fa-ʿbudūhu wa-huwa ʿalā kulli shayʾin wakīl
  trad: Voilà Allaah, votre *Rabb* — nul *ilāh* si ce n'est Lui, créateur (*khāliq*) de toute chose — adorez-Le donc. Et Il est, sur toute chose, *wakīl*.
- ref: S.6:103
  ar: لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ ۖ وَهُوَ اللَّطِيفُ الْخَبِيرُ
  trl: Lā tudrikuhu l-abṣāru wa-huwa yudriku l-abṣāra wa-huwa l-laṭīfu l-khabīr
  trad: Les vues (*al-abṣār*) ne Le saisissent pas (*lā tudrikuhu*), et c'est Lui qui saisit toute vue — et Il est *al-Laṭīf*, *al-Khabīr*.
- ref: S.6:104
  ar: قَدْ جَاءَكُمْ بَصَائِرُ مِنْ رَبِّكُمْ ۖ فَمَنْ أَبْصَرَ فَلِنَفْسِهِ ۖ وَمَنْ عَمِيَ فَعَلَيْهَا ۚ وَمَا أَنَا عَلَيْكُمْ بِحَفِيظٍ
  trl: Qad jāʾakum baṣāʾiru min rabbikum fa-man abṣara fa-li-nafsihi wa-man ʿamiya fa-ʿalayhā wa-mā anā ʿalaykum bi-ḥafīẓ
  trad: Des clairvoyances (*baṣāʾir*) vous sont certes venues de votre *Rabb* — quiconque voit clair (*abṣara*), c'est pour son propre *nafs* ; quiconque reste aveugle (*ʿamiya*), c'est contre lui. Et je ne suis pas, sur vous, un gardien (*ḥafīẓ*).
- ref: S.6:105
  ar: وَكَذَٰلِكَ نُصَرِّفُ الْآيَاتِ وَلِيَقُولُوا دَرَسْتَ وَلِنُبَيِّنَهُ لِقَوْمٍ يَعْلَمُونَ
  trl: Wa-kadhālika nuṣarrifu l-āyāti wa-li-yaqūlū darasta wa-li-nubayyinahu li-qawmin yaʿlamūn
  trad: 'Et ainsi Nous diversifions (*nuṣarrifu*) les *āyāt* — [de sorte] qu''ils disent : « Tu as étudié (*darasta*) » — et pour que Nous le rendions clair pour un peuple qui sait.'
- ref: S.6:106
  ar: اتَّبِعْ مَا أُوحِيَ إِلَيْكَ مِنْ رَبِّكَ ۖ لَا إِلَٰهَ إِلَّا هُوَ ۖ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ
  trl: Ittabiʿ mā ūḥiya ilayka min rabbika lā ilāha illā huwa wa-aʿriḍ ʿani l-mushrikīn
  trad: Suis ce qui t'a été révélé de ton *Rabb* — nul *ilāh* si ce n'est Lui — et détourne-toi (*aʿriḍ*) des *mushrikūn*.
- ref: S.6:107
  ar: وَلَوْ شَاءَ اللَّهُ مَا أَشْرَكُوا ۗ وَمَا جَعَلْنَاكَ عَلَيْهِمْ حَفِيظًا ۖ وَمَا أَنْتَ عَلَيْهِمْ بِوَكِيلٍ
  trl: Wa-law shāʾa llāhu mā ashrakū wa-mā jaʿalnāka ʿalayhim ḥafīẓan wa-mā anta ʿalayhim bi-wakīl
  trad: Et si Allaah avait voulu, ils n'auraient pas commis le *shirk* — Nous ne t'avons pas fait, sur eux, un gardien (*ḥafīẓ*), et tu n'es pas, sur eux, un *wakīl*.
- ref: S.6:108
  ar: وَلَا تَسُبُّوا الَّذِينَ يَدْعُونَ مِنْ دُونِ اللَّهِ فَيَسُبُّوا اللَّهَ عَدْوًا بِغَيْرِ عِلْمٍ ۗ كَذَٰلِكَ زَيَّنَّا لِكُلِّ أُمَّةٍ عَمَلَهُمْ ثُمَّ إِلَىٰ رَبِّهِمْ مَرْجِعُهُمْ فَيُنَبِّئُهُمْ بِمَا كَانُوا يَعْمَلُونَ
  trl: Wa-lā tasubbū lladhīna yadʿūna min dūni llāhi fa-yasubbu llāha ʿadwan bi-ghayri ʿilmin kadhālika zayyannā li-kulli ummatin ʿamalahum thumma ilā rabbihim marjiʿuhum fa-yunabbiʾuhum bi-mā kānū yaʿmalūn
  trad: Et n'insultez pas (*lā tasubbū*) ceux qu'ils invoquent en dehors d'Allaah, de peur qu'ils n'insultent Allaah par hostilité (*ʿadwan*), sans aucun savoir. Ainsi avons-Nous rendu belle (*zayyannā*), pour chaque communauté (*umma*), son œuvre — puis c'est vers leur *Rabb* qu'est leur retour, et Il les informera de ce qu'ils faisaient.
- ref: S.6:109
  ar: وَأَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ لَئِنْ جَاءَتْهُمْ آيَةٌ لَيُؤْمِنُنَّ بِهَا ۚ قُلْ إِنَّمَا الْآيَاتُ عِنْدَ اللَّهِ ۖ وَمَا يُشْعِرُكُمْ أَنَّهَا إِذَا جَاءَتْ لَا يُؤْمِنُونَ
  trl: Wa-aqsamū bi-llāhi jahda aymānihim la-in jāʾathum āyatun la-yuʾminunna bihā qul innamā l-āyātu ʿinda llāhi wa-mā yushʿirukum annahā idhā jāʾat lā yuʾminūn
  trad: 'Et ils ont juré par Allaah, avec l''intensité extrême de leurs serments (*jahda aymānihim*), que si un signe (*āya*) leur venait, ils y croiraient assurément. Dis : « Les *āyāt* ne dépendent que d''Allaah. » Et qu''est-ce qui vous fait percevoir (*yushʿirukum*) que, même venu, ils n''y croiraient pas ?'
- ref: S.6:110
  ar: وَنُقَلِّبُ أَفْئِدَتَهُمْ وَأَبْصَارَهُمْ كَمَا لَمْ يُؤْمِنُوا بِهِ أَوَّلَ مَرَّةٍ وَنَذَرُهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ
  trl: Wa-nuqallibu afʾidatahum wa-abṣārahum kamā lam yuʾminū bihi awwala marratin wa-nadharuhum fī ṭughyānihim yaʿmahūn
  trad: Et Nous retournons (*nuqallibu*) leurs *afʾida* et leurs regards, comme ils n'y ont pas cru la première fois — et Nous les laissons dans leur débordement (*ṭughyān*), errer sans direction (*yaʿmahūn*).
- ref: S.6:111
  ar: ۞ وَلَوْ أَنَّنَا نَزَّلْنَا إِلَيْهِمُ الْمَلَائِكَةَ وَكَلَّمَهُمُ الْمَوْتَىٰ وَحَشَرْنَا عَلَيْهِمْ كُلَّ شَيْءٍ قُبُلًا مَا كَانُوا لِيُؤْمِنُوا إِلَّا أَنْ يَشَاءَ اللَّهُ وَلَٰكِنَّ أَكْثَرَهُمْ يَجْهَلُونَ
  trl: Wa-law annanā nazzalnā ilayhimu l-malāʾikata wa-kallamahumu l-mawtā wa-ḥasharnā ʿalayhim kulla shayʾin qubulan mā kānū li-yuʾminū illā an yashāʾa llāhu wa-lākinna aktharahum yajhalūn
  trad: Et même si Nous avions fait descendre vers eux les *malāʾika*, si les morts leur avaient parlé, et si Nous avions rassemblé devant eux toute chose face à face (*qubulan*), ils n'auraient pas cru — sauf si Allaah l'avait voulu. Mais la plupart d'entre eux ignorent.
- ref: S.6:112
  ar: وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِيٍّ عَدُوًّا شَيَاطِينَ الْإِنْسِ وَالْجِنِّ يُوحِي بَعْضُهُمْ إِلَىٰ بَعْضٍ زُخْرُفَ الْقَوْلِ غُرُورًا ۚ وَلَوْ شَاءَ رَبُّكَ مَا فَعَلُوهُ ۖ فَذَرْهُمْ وَمَا يَفْتَرُونَ
  trl: Wa-kadhālika jaʿalnā li-kulli nabiyyin ʿaduwwan shayāṭīna l-insi wa-l-jinni yūḥī baʿḍuhum ilā baʿḍin zukhrufa l-qawli ghurūran wa-law shāʾa rabbuka mā faʿalūhu fa-dharhum wa-mā yaftarūn
  trad: Et ainsi avons-Nous établi, pour chaque *nabī*, un ennemi (*ʿaduww*) — les *shayāṭīn* de l'espèce humaine (*ins*) et des jinn — qui s'insufflent (*yūḥī*) les uns aux autres une parole enjolivée (*zukhruf al-qawl*), en tromperie (*ghurūr*). Et si ton Rabb avait voulu, ils ne l'auraient pas fait — laisse-les donc, avec ce qu'ils forgent (*yaftarūn*).
- ref: S.6:113
  ar: وَلِتَصْغَىٰ إِلَيْهِ أَفْئِدَةُ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ وَلِيَرْضَوْهُ وَلِيَقْتَرِفُوا مَا هُمْ مُقْتَرِفُونَ
  trl: Wa-li-taṣghā ilayhi afʾidatu lladhīna lā yuʾminūna bi-l-ākhirati wa-li-yarḍawhu wa-li-yaqtarifū mā hum muqtarifūn
  trad: Pour que s'y inclinent (*taṣghā*) les *afʾida* de ceux qui ne croient pas en l'Ultime (*al-ākhira*), qu'ils l'agréent, et qu'ils perpètrent (*yaqtarifū*) ce qu'ils perpètrent.
- ref: S.6:114
  ar: أَفَغَيْرَ اللَّهِ أَبْتَغِي حَكَمًا وَهُوَ الَّذِي أَنْزَلَ إِلَيْكُمُ الْكِتَابَ مُفَصَّلًا ۚ وَالَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَعْلَمُونَ أَنَّهُ مُنَزَّلٌ مِنْ رَبِّكَ بِالْحَقِّ ۖ فَلَا تَكُونَنَّ مِنَ الْمُمْتَرِينَ
  trl: A-fa-ghayra llāhi abtaghī ḥakaman wa-huwa lladhī anzala ilaykumu l-kitāba mufaṣṣalan wa-lladhīna ātaynāhumu l-kitāba yaʿlamūna annahu munazzalun min rabbika bi-l-ḥaqqi fa-lā takūnanna mina l-mumtarīn
  trad: Chercherais-je (*abtaghī*) un autre qu'Allaah comme juge (*ḥakam*), alors qu'Il est Ce qui a fait descendre vers vous le Kitāb en détail (*mufaṣṣal*) ? Et ceux à qui Nous avons donné le Kitāb savent qu'il est descendu de ton Rabb en toute vérité (*bi-l-ḥaqq*) — ne sois donc en aucun cas parmi ceux qui doutent (*al-mumtarīn*).
- ref: S.6:115
  ar: وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًا وَعَدْلًا ۚ لَا مُبَدِّلَ لِكَلِمَاتِهِ ۚ وَهُوَ السَّمِيعُ الْعَلِيمُ
  trl: Wa-tammat kalimatu rabbika ṣidqan wa-ʿadlan lā mubaddila li-kalimātihi wa-huwa s-samīʿu l-ʿalīm
  trad: Et la parole de ton Rabb s'est accomplie (*tammat*), en véracité (*ṣidq*) et en justice (*ʿadl*) — nul ne modifie (*mubaddil*) Ses paroles — et Il est *as-Samīʿ*, *al-ʿAlīm*.
- ref: S.6:116
  ar: وَإِنْ تُطِعْ أَكْثَرَ مَنْ فِي الْأَرْضِ يُضِلُّوكَ عَنْ سَبِيلِ اللَّهِ ۚ إِنْ يَتَّبِعُونَ إِلَّا الظَّنَّ وَإِنْ هُمْ إِلَّا يَخْرُصُونَ
  trl: Wa-in tuṭiʿ akthara man fi l-arḍi yuḍillūka ʿan sabīli llāhi in yattabiʿūna illā ẓ-ẓanna wa-in hum illā yakhruṣūn
  trad: Et si tu obéissais à la majorité de ceux qui sont sur terre, ils t'égareraient (*yuḍillūka*) du chemin d'Allaah — ils ne suivent que la conjecture (*aẓ-ẓann*), et ils ne font que supposer à tort (*yakhruṣūn*).
- ref: S.6:117
  ar: إِنَّ رَبَّكَ هُوَ أَعْلَمُ مَنْ يَضِلُّ عَنْ سَبِيلِهِ ۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ
  trl: Inna rabbaka huwa aʿlamu man yaḍillu ʿan sabīlihi wa-huwa aʿlamu bi-l-muhtadīn
  trad: Ton Rabb sait certes mieux qui s'égare de Son chemin — et Il sait mieux les bien-guidés (*al-muhtadīn*).
- ref: S.6:118
  ar: فَكُلُوا مِمَّا ذُكِرَ اسْمُ اللَّهِ عَلَيْهِ إِنْ كُنْتُمْ بِآيَاتِهِ مُؤْمِنِينَ
  trl: Fa-kulū mimmā dhukira smu llāhi ʿalayhi in kuntum bi-āyātihi muʾminīn
  trad: Mangez donc de ce sur quoi le nom d'Allaah a été mentionné (*dhukira smu llāhi ʿalayhi*), si vous êtes croyants en Ses *āyāt*.
- ref: S.6:119
  ar: وَمَا لَكُمْ أَلَّا تَأْكُلُوا مِمَّا ذُكِرَ اسْمُ اللَّهِ عَلَيْهِ وَقَدْ فَصَّلَ لَكُمْ مَا حَرَّمَ عَلَيْكُمْ إِلَّا مَا اضْطُرِرْتُمْ إِلَيْهِ ۗ وَإِنَّ كَثِيرًا لَيُضِلُّونَ بِأَهْوَائِهِمْ بِغَيْرِ عِلْمٍ ۗ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِالْمُعْتَدِينَ
  trl: Wa-mā lakum allā taʾkulū mimmā dhukira smu llāhi ʿalayhi wa-qad faṣṣala lakum mā ḥarrama ʿalaykum illā ma ḍṭurirtum ilayhi wa-inna kathīran la-yuḍillūna bi-ahwāʾihim bi-ghayri ʿilmin inna rabbaka huwa aʿlamu bi-l-muʿtadīn
  trad: Et qu'avez-vous à ne pas manger de ce sur quoi le nom d'Allaah a été mentionné, alors qu'Il vous a détaillé (*faṣṣala*) ce qu'Il vous a interdit (*ḥarrama*) — sauf ce à quoi vous êtes contraints (*ḍṭurirtum*) ? Beaucoup égarent certes par leurs passions (*ahwāʾ*), sans savoir — ton Rabb connaît certes mieux les transgresseurs (*al-muʿtadīn*).
- ref: S.6:120
  ar: وَذَرُوا ظَاهِرَ الْإِثْمِ وَبَاطِنَهُ ۚ إِنَّ الَّذِينَ يَكْسِبُونَ الْإِثْمَ سَيُجْزَوْنَ بِمَا كَانُوا يَقْتَرِفُونَ
  trl: Wa-dharū ẓāhira l-ithmi wa-bāṭinahu inna lladhīna yaksibūna l-ithma sa-yujzawna bi-mā kānū yaqtarifūn
  trad: Et délaissez le péché (*ithm*) apparent (*ẓāhir*) et son aspect caché (*bāṭin*) — ceux qui acquièrent (*yaksibūna*) le péché seront certes rétribués de ce qu'ils perpétraient (*yaqtarifūn*).
- ref: S.6:121
  ar: وَلَا تَأْكُلُوا مِمَّا لَمْ يُذْكَرِ اسْمُ اللَّهِ عَلَيْهِ وَإِنَّهُ لَفِسْقٌ ۗ وَإِنَّ الشَّيَاطِينَ لَيُوحُونَ إِلَىٰ أَوْلِيَائِهِمْ لِيُجَادِلُوكُمْ ۖ وَإِنْ أَطَعْتُمُوهُمْ إِنَّكُمْ لَمُشْرِكُونَ
  trl: Wa-lā taʾkulū mimmā lam yudhkari smu llāhi ʿalayhi wa-innahu la-fisqun wa-inna sh-shayāṭīna la-yūḥūna ilā awliyāʾihim li-yujādilūkum wa-in aṭaʿtumūhum innakum la-mushrikūn
  trad: Et ne mangez pas de ce sur quoi le nom d'Allaah n'a pas été mentionné — cela est certes un *fisq*. Et les *shayāṭīn* insufflent (*la-yūḥūna*) certes à leurs *awliyāʾ* pour qu'ils disputent (*li-yujādilūkum*) avec vous — et si vous leur obéissiez, vous seriez certes des *mushrikūn*.
- ref: S.6:122
  ar: أَوَمَنْ كَانَ مَيْتًا فَأَحْيَيْنَاهُ وَجَعَلْنَا لَهُ نُورًا يَمْشِي بِهِ فِي النَّاسِ كَمَنْ مَثَلُهُ فِي الظُّلُمَاتِ لَيْسَ بِخَارِجٍ مِنْهَا ۚ كَذَٰلِكَ زُيِّنَ لِلْكَافِرِينَ مَا كَانُوا يَعْمَلُونَ
  trl: A-wa-man kāna maytan fa-aḥyaynāhu wa-jaʿalnā lahu nūran yamshī bihi fi n-nāsi ka-man mathaluhu fi ẓ-ẓulumāti laysa bi-khārijin minhā ka-dhālika zuyyina li-l-kāfirīna mā kānū yaʿmalūn
  trad: Celui qui était mort (*mayt*), et à qui Nous avons donné la vie (*aḥyaynāhu*), et à qui Nous avons donné une lumière (*nūr*) pour marcher parmi les gens, est-il comme celui dont l'exemple (*mathal*) est dans les ténèbres (*ẓulumāt*), sans en sortir ? Ainsi a été rendu beau (*zuyyina*) pour les *kāfirūn* ce qu'ils faisaient.
- ref: S.6:123
  ar: وَكَذَٰلِكَ جَعَلْنَا فِي كُلِّ قَرْيَةٍ أَكَابِرَ مُجْرِمِيهَا لِيَمْكُرُوا فِيهَا ۖ وَمَا يَمْكُرُونَ إِلَّا بِأَنْفُسِهِمْ وَمَا يَشْعُرُونَ
  trl: Wa-kadhālika jaʿalnā fī kulli qaryatin akābira mujrimīhā li-yamkurū fīhā wa-mā yamkurūna illā bi-anfusihim wa-mā yashʿurūn
  trad: Et ainsi avons-Nous établi, dans chaque cité (*qarya*), les grands (*akābir*) de ses criminels (*mujrimūn*), pour qu'ils y trament (*yamkurū*) — mais ils ne trament que contre leurs propres *nafs*, sans le percevoir (*yashʿurūn*).
- ref: S.6:124
  ar: وَإِذَا جَاءَتْهُمْ آيَةٌ قَالُوا لَنْ نُؤْمِنَ حَتَّىٰ نُؤْتَىٰ مِثْلَ مَا أُوتِيَ رُسُلُ اللَّهِ ۘ اللَّهُ أَعْلَمُ حَيْثُ يَجْعَلُ رِسَالَتَهُ ۗ سَيُصِيبُ الَّذِينَ أَجْرَمُوا صَغَارٌ عِنْدَ اللَّهِ وَعَذَابٌ شَدِيدٌ بِمَا كَانُوا يَمْكُرُونَ
  trl: Wa-idhā jāʾathum āyatun qālū lan nuʾmina ḥattā nuʾtā mithla mā ūtiya rusulu llāhi allāhu aʿlamu ḥaythu yajʿalu risālatahu sa-yuṣību lladhīna ajramū ṣaghārun ʿinda llāhi wa-ʿadhābun shadīdun bi-mā kānū yamkurūn
  trad: 'Et quand un signe leur vient, ils disent : « Nous ne croirons pas avant qu''il nous soit donné le pareil de ce qui a été donné aux *rusul* d''Allaah. » Allaah sait mieux où placer Sa mission (*risāla*) — un abaissement (*ṣaghār*) auprès d''Allaah atteindra ceux qui ont commis le crime (*ajramū*), ainsi qu''un châtiment sévère, pour ce qu''ils tramaient (*yamkurūn*).'
- ref: S.6:125
  ar: فَمَنْ يُرِدِ اللَّهُ أَنْ يَهْدِيَهُ يَشْرَحْ صَدْرَهُ لِلْإِسْلَامِ ۖ وَمَنْ يُرِدْ أَنْ يُضِلَّهُ يَجْعَلْ صَدْرَهُ ضَيِّقًا حَرَجًا كَأَنَّمَا يَصَّعَّدُ فِي السَّمَاءِ ۚ كَذَٰلِكَ يَجْعَلُ اللَّهُ الرِّجْسَ عَلَى الَّذِينَ لَا يُؤْمِنُونَ
  trl: Fa-man yuridi llāhu an yahdiyahu yashraḥ ṣadrahu li-l-islāmi wa-man yurid an yuḍillahu yajʿal ṣadrahu ḍayyiqan ḥarajan ka-annamā yaṣṣaʿʿadu fi s-samāʾi ka-dhālika yajʿalu llāhu r-rijsa ʿalā lladhīna lā yuʾminūn
  trad: Celui qu'Allaah veut guider, Il lui ouvre largement (*yashraḥ*) la poitrine (*ṣadr*) à l'*islām* ; et celui qu'Il veut égarer, Il lui rend la poitrine étroite (*ḍayyiq*), oppressée (*ḥaraj*), comme s'il s'efforçait de monter dans le ciel. Ainsi Allaah place le *rijs* sur ceux qui ne croient pas.
- ref: S.6:126
  ar: وَهَٰذَا صِرَاطُ رَبِّكَ مُسْتَقِيمًا ۗ قَدْ فَصَّلْنَا الْآيَاتِ لِقَوْمٍ يَذَّكَّرُونَ
  trl: Wa-hādhā ṣirāṭu rabbika mustaqīman qad faṣṣalna l-āyāti li-qawmin yadhdhakkarūn
  trad: Et ceci est le chemin (*ṣirāṭ*) de ton Rabb, droit (*mustaqīm*) — Nous avons certes détaillé les *āyāt* pour un peuple qui se rappelle (*yadhdhakkarūn*).
- ref: S.6:127
  ar: ۞ لَهُمْ دَارُ السَّلَامِ عِنْدَ رَبِّهِمْ ۖ وَهُوَ وَلِيُّهُمْ بِمَا كَانُوا يَعْمَلُونَ
  trl: Lahum dāru s-salāmi ʿinda rabbihim wa-huwa waliyyuhum bi-mā kānū yaʿmalūn
  trad: À eux la demeure de la paix (*dār as-salām*), auprès de leur Rabb — et Il est leur *walī*, pour ce qu'ils faisaient.
- ref: S.6:128
  ar: وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا يَا مَعْشَرَ الْجِنِّ قَدِ اسْتَكْثَرْتُمْ مِنَ الْإِنْسِ ۖ وَقَالَ أَوْلِيَاؤُهُمْ مِنَ الْإِنْسِ رَبَّنَا اسْتَمْتَعَ بَعْضُنَا بِبَعْضٍ وَبَلَغْنَا أَجَلَنَا الَّذِي أَجَّلْتَ لَنَا ۚ قَالَ النَّارُ مَثْوَاكُمْ خَالِدِينَ فِيهَا إِلَّا مَا شَاءَ اللَّهُ ۗ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٌ
  trl: Wa-yawma yaḥshuruhum jamīʿan yā maʿshara l-jinni qadi stakthartum mina l-insi wa-qāla awliyāʾuhum mina l-insi rabbanā stamtaʿa baʿḍunā bi-baʿḍin wa-balaghnā ajalanā lladhī ajjalta lanā qāla n-nāru mathwākum khālidīna fīhā illā mā shāʾa llāhu inna rabbaka ḥakīmun ʿalīm
  trad: 'Et le jour où Il les rassemblera tous : « Ô assemblée des jinn (*maʿshar al-jinn*), vous avez certes tiré profit en abondance (*istakthartum*) des humains. » Et leurs *awliyāʾ* parmi les humains diront : « Notre Rabb, nous avons joui les uns des autres (*istamtaʿa baʿḍunā bi-baʿḍin*), et nous avons atteint notre terme (*ajal*) que Tu nous avais assigné. » Il dira : « Le Feu est votre séjour (*mathwā*), y demeurant — sauf ce qu''Allaah voudra. » Ton Rabb est certes *Ḥakīm*, *ʿAlīm*.'
- ref: S.6:129
  ar: وَكَذَٰلِكَ نُوَلِّي بَعْضَ الظَّالِمِينَ بَعْضًا بِمَا كَانُوا يَكْسِبُونَ
  trl: Wa-kadhālika nuwallī baʿḍa ẓ-ẓālimīna baʿḍan bi-mā kānū yaksibūn
  trad: Et ainsi Nous donnons autorité (*nuwallī*) à certains injustes sur d'autres, pour ce qu'ils s'acquéraient (*yaksibūn*).
- ref: S.6:130
  ar: يَا مَعْشَرَ الْجِنِّ وَالْإِنْسِ أَلَمْ يَأْتِكُمْ رُسُلٌ مِنْكُمْ يَقُصُّونَ عَلَيْكُمْ آيَاتِي وَيُنْذِرُونَكُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا ۚ قَالُوا شَهِدْنَا عَلَىٰ أَنْفُسِنَا ۖ وَغَرَّتْهُمُ الْحَيَاةُ الدُّنْيَا وَشَهِدُوا عَلَىٰ أَنْفُسِهِمْ أَنَّهُمْ كَانُوا كَافِرِينَ
  trl: Yā maʿshara l-jinni wa-l-insi a-lam yaʾtikum rusulun minkum yaquṣṣūna ʿalaykum āyātī wa-yundhirūnakum liqāʾa yawmikum hādhā qālū shahidnā ʿalā anfusinā wa-gharrat'humu l-ḥayātu d-dunyā wa-shahidū ʿalā anfusihim annahum kānū kāfirīn
  trad: '« Ô assemblée des jinn et des humains, des *rusul* issus de vous (*minkum*) ne vous sont-ils pas venus, qui vous racontaient Mes *āyāt* et vous avertissaient de la rencontre (*liqāʾ*) de ce jour-ci ? » Ils diront : « Nous témoignons contre nous-mêmes (*shahidnā ʿalā anfusinā*). » Et la vie de ce monde les a trompés (*gharrat''humu*) — et ils témoignèrent contre eux-mêmes qu''ils étaient certes *kāfirūn*.'
- ref: S.6:131
  ar: ذَٰلِكَ أَنْ لَمْ يَكُنْ رَبُّكَ مُهْلِكَ الْقُرَىٰ بِظُلْمٍ وَأَهْلُهَا غَافِلُونَ
  trl: Dhālika allam yakun rabbuka muhlika l-qurā bi-ẓulmin wa-ahluhā ghāfilūn
  trad: Cela, parce que ton Rabb ne détruit pas (*muhlik*) les cités injustement, alors que leurs habitants seraient sans avertissement (*ghāfilūn*).
- ref: S.6:132
  ar: وَلِكُلٍّ دَرَجَاتٌ مِمَّا عَمِلُوا ۚ وَمَا رَبُّكَ بِغَافِلٍ عَمَّا يَعْمَلُونَ
  trl: Wa-li-kullin darajātun mimmā ʿamilū wa-mā rabbuka bi-ghāfilin ʿammā yaʿmalūn
  trad: Et à chacun des rangs (*darajāt*) selon ce qu'ils ont fait — et ton Rabb n'est pas sans avertissement (*ghāfil*) de ce qu'ils font.
- ref: S.6:133
  ar: وَرَبُّكَ الْغَنِيُّ ذُو الرَّحْمَةِ ۚ إِنْ يَشَأْ يُذْهِبْكُمْ وَيَسْتَخْلِفْ مِنْ بَعْدِكُمْ مَا يَشَاءُ كَمَا أَنْشَأَكُمْ مِنْ ذُرِّيَّةِ قَوْمٍ آخَرِينَ
  trl: Wa-rabbuka l-ghaniyyu dhu r-raḥmati in yashaʾ yudhhibkum wa-yastakhlif min baʿdikum mā yashāʾu kamā anshaʾakum min dhurriyyati qawmin ākharīn
  trad: Et ton Rabb est *al-Ghanī*, détenteur de la *raḥma* (*dhū r-raḥma*) — s'Il voulait, Il vous ferait disparaître et ferait succéder (*yastakhlif*) après vous ce qu'Il veut, comme Il vous a fait naître (*anshaʾakum*) de la descendance (*dhurriyya*) d'un autre peuple.
- ref: S.6:134
  ar: إِنَّ مَا تُوعَدُونَ لَآتٍ ۖ وَمَا أَنْتُمْ بِمُعْجِزِينَ
  trl: Inna mā tūʿadūna la-ātin wa-mā antum bi-muʿjizīn
  trad: Ce qui vous est promis (*tūʿadūn*) va certes venir — et vous n'êtes pas de ceux qui peuvent y échapper (*bi-muʿjizīn*).
- ref: S.6:135
  ar: قُلْ يَا قَوْمِ اعْمَلُوا عَلَىٰ مَكَانَتِكُمْ إِنِّي عَامِلٌ ۖ فَسَوْفَ تَعْلَمُونَ مَنْ تَكُونُ لَهُ عَاقِبَةُ الدَّارِ ۗ إِنَّهُ لَا يُفْلِحُ الظَّالِمُونَ
  trl: Qul yā qawmi ʿmalū ʿalā makānatikum innī ʿāmilun fa-sawfa taʿlamūna man takūnu lahu ʿāqibatu d-dāri innahu lā yufliḥu ẓ-ẓālimūn
  trad: 'Dis : « Ô mon peuple, agissez selon votre position (*makāna*) — moi aussi j''agis. Vous saurez bientôt à qui revient l''issue ultime de la demeure (*ʿāqibat ad-dār*). » Les injustes, certes, ne réussissent pas (*lā yufliḥu ẓ-ẓālimūn*).'
- ref: S.6:136
  ar: وَجَعَلُوا لِلَّهِ مِمَّا ذَرَأَ مِنَ الْحَرْثِ وَالْأَنْعَامِ نَصِيبًا فَقَالُوا هَٰذَا لِلَّهِ بِزَعْمِهِمْ وَهَٰذَا لِشُرَكَائِنَا ۖ فَمَا كَانَ لِشُرَكَائِهِمْ فَلَا يَصِلُ إِلَى اللَّهِ ۖ وَمَا كَانَ لِلَّهِ فَهُوَ يَصِلُ إِلَىٰ شُرَكَائِهِمْ ۗ سَاءَ مَا يَحْكُمُونَ
  trl: Wa-jaʿalū li-llāhi mimmā dharaʾa mina l-ḥarthi wa-l-anʿāmi naṣīban fa-qālū hādhā li-llāhi bi-zaʿmihim wa-hādhā li-shurakāʾinā fa-mā kāna li-shurakāʾihim fa-lā yaṣilu ilā llāhi wa-mā kāna li-llāhi fa-huwa yaṣilu ilā shurakāʾihim sāʾa mā yaḥkumūn
  trad: 'Et ils ont établi pour Allaah, de ce qu''Il a fait proliférer (*dharaʾa*) par la culture et le bétail, une part (*naṣīb*) — et ils ont dit, selon leur prétention (*bi-zaʿmihim*) : « Ceci pour Allaah, et ceci pour nos associés (*shurakāʾ*). » Ce qui revient à leurs associés ne parvient pas (*lā yaṣilu*) à Allaah ; mais ce qui revient à Allaah, cela parvient à leurs associés. Combien est mauvais ce qu''ils jugent (*yaḥkumūn*) !'
- ref: S.6:137
  ar: وَكَذَٰلِكَ زَيَّنَ لِكَثِيرٍ مِنَ الْمُشْرِكِينَ قَتْلَ أَوْلَادِهِمْ شُرَكَاؤُهُمْ لِيُرْدُوهُمْ وَلِيَلْبِسُوا عَلَيْهِمْ دِينَهُمْ ۖ وَلَوْ شَاءَ اللَّهُ مَا فَعَلُوهُ ۖ فَذَرْهُمْ وَمَا يَفْتَرُونَ
  trl: Wa-kadhālika zayyana li-kathīrin mina l-mushrikīna qatla awlādihim shurakāʾuhum li-yurdūhum wa-li-yalbisū ʿalayhim dīnahum wa-law shāʾa llāhu mā faʿalūhu fa-dharhum wa-mā yaftarūn
  trad: Et ainsi leurs associés (*shurakāʾ*) ont rendu belle (*zayyana*), pour beaucoup de *mushrikūn*, la mise à mort de leurs enfants — pour les perdre (*li-yurdūhum*) et pour brouiller (*li-yalbisū*) sur eux leur *dīn*. Et si Allaah avait voulu, ils ne l'auraient pas fait — laisse-les donc, avec ce qu'ils forgent (*yaftarūn*).
- ref: S.6:138
  ar: وَقَالُوا هَٰذِهِ أَنْعَامٌ وَحَرْثٌ حِجْرٌ لَا يَطْعَمُهَا إِلَّا مَنْ نَشَاءُ بِزَعْمِهِمْ وَأَنْعَامٌ حُرِّمَتْ ظُهُورُهَا وَأَنْعَامٌ لَا يَذْكُرُونَ اسْمَ اللَّهِ عَلَيْهَا افْتِرَاءً عَلَيْهِ ۚ سَيَجْزِيهِمْ بِمَا كَانُوا يَفْتَرُونَ
  trl: Wa-qālū hādhihi anʿāmun wa-ḥarthun ḥijrun lā yaṭʿamuhā illā man nashāʾu bi-zaʿmihim wa-anʿāmun ḥurrimat ẓuhūruhā wa-anʿāmun lā yadhkurūna sma llāhi ʿalayhā iftirāʾan ʿalayhi sa-yajzīhim bi-mā kānū yaftarūn
  trad: 'Et ils dirent : « Ceci est du bétail et de la culture protégés (*ḥijr*) — n''en mange que qui nous voulons », selon leur prétention. Et du bétail dont le dos a été déclaré interdit (*ḥurrimat ẓuhūruhā*), et du bétail sur lequel ils ne mentionnent pas le nom d''Allaah — invention (*iftirāʾ*) contre Lui. Il les rétribuera pour ce qu''ils inventaient.'
- ref: S.6:139
  ar: وَقَالُوا مَا فِي بُطُونِ هَٰذِهِ الْأَنْعَامِ خَالِصَةٌ لِذُكُورِنَا وَمُحَرَّمٌ عَلَىٰ أَزْوَاجِنَا ۖ وَإِنْ يَكُنْ مَيْتَةً فَهُمْ فِيهِ شُرَكَاءُ ۚ سَيَجْزِيهِمْ وَصْفَهُمْ ۚ إِنَّهُ حَكِيمٌ عَلِيمٌ
  trl: Wa-qālū mā fī buṭūni hādhihi l-anʿāmi khāliṣatun li-dhukūrinā wa-muḥarramun ʿalā azwājinā wa-in yakun maytatan fa-hum fīhi shurakāʾu sa-yajzīhim waṣfahum innahu ḥakīmun ʿalīm
  trad: 'Et ils dirent : « Ce qui est dans les ventres de ce bétail est réservé exclusivement (*khāliṣatun*) à nos mâles, et interdit à nos épouses. » Mais si cela naît mort (*maytatan*), ils y sont tous associés. Il les rétribuera pour leur qualification (*waṣfahum*) — Ce qui est *Ḥakīm*, *ʿAlīm*.'
- ref: S.6:140
  ar: قَدْ خَسِرَ الَّذِينَ قَتَلُوا أَوْلَادَهُمْ سَفَهًا بِغَيْرِ عِلْمٍ وَحَرَّمُوا مَا رَزَقَهُمُ اللَّهُ افْتِرَاءً عَلَى اللَّهِ ۚ قَدْ ضَلُّوا وَمَا كَانُوا مُهْتَدِينَ
  trl: Qad khasira lladhīna qatalū awlādahum safahan bi-ghayri ʿilmin wa-ḥarramū mā razaqahumu llāhu iftirāʾan ʿalā llāhi qad ḍallū wa-mā kānū muhtadīn
  trad: Ils sont certes perdants (*khasira*), ceux qui ont tué leurs enfants par légèreté d'esprit (*safahan*), sans savoir — et qui ont interdit ce qu'Allaah leur a attribué comme subsistance (*razaqahumu*), invention contre Allaah. Ils se sont certes égarés, et n'étaient pas bien-guidés.
- ref: S.6:141
  ar: ۞ وَهُوَ الَّذِي أَنْشَأَ جَنَّاتٍ مَعْرُوشَاتٍ وَغَيْرَ مَعْرُوشَاتٍ وَالنَّخْلَ وَالزَّرْعَ مُخْتَلِفًا أُكُلُهُ وَالزَّيْتُونَ وَالرُّمَّانَ مُتَشَابِهًا وَغَيْرَ مُتَشَابِهٍ ۚ كُلُوا مِنْ ثَمَرِهِ إِذَا أَثْمَرَ وَآتُوا حَقَّهُ يَوْمَ حَصَادِهِ ۖ وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ
  trl: Wa-huwa lladhī anshaʾa jannātin maʿrūshātin wa-ghayra maʿrūshātin wa-n-nakhla wa-z-zarʿa mukhtalifan ukuluhu wa-z-zaytūna wa-r-rummāna mutashābihan wa-ghayra mutashābihin kulū min thamarihi idhā athmara wa-ātū ḥaqqahu yawma ḥaṣādihi wa-lā tusrifū innahu lā yuḥibbu l-musrifīn
  trad: 'Et Ce qui a fait exister (*anshaʾa*) des jardins treillagés (*maʿrūshāt*) et non treillagés, le palmier, la culture aux fruits (*ukul*) variés, l''olivier et le grenadier, se ressemblant et ne se ressemblant pas — mangez de son fruit quand il fructifie, et donnez son dû (*ḥaqqahu*) le jour de sa récolte (*yawma ḥaṣādihi*) — et ne gaspillez pas (*lā tusrifū*) : Il n''honore pas (*lā yuḥibbu*) les gaspilleurs (*al-musrifīn*).'
- ref: S.6:142
  ar: وَمِنَ الْأَنْعَامِ حَمُولَةً وَفَرْشًا ۚ كُلُوا مِمَّا رَزَقَكُمُ اللَّهُ وَلَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ
  trl: Wa-mina l-anʿāmi ḥamūlatan wa-farshan kulū mimmā razaqakumu llāhu wa-lā tattabiʿū khuṭuwāti sh-shayṭāni innahu lakum ʿaduwwun mubīn
  trad: 'Et parmi le bétail, des bêtes de charge (*ḥamūla*) et du petit élevage (*farsh*) — mangez de ce qu''Allaah vous a attribué comme subsistance, et ne suivez pas les pas (*khuṭuwāt*) du *shayṭān* : il est pour vous un ennemi déclaré.'
- ref: S.6:143
  ar: ثَمَانِيَةَ أَزْوَاجٍ ۖ مِنَ الضَّأْنِ اثْنَيْنِ وَمِنَ الْمَعْزِ اثْنَيْنِ ۗ قُلْ آلذَّكَرَيْنِ حَرَّمَ أَمِ الْأُنْثَيَيْنِ أَمَّا اشْتَمَلَتْ عَلَيْهِ أَرْحَامُ الْأُنْثَيَيْنِ ۖ نَبِّئُونِي بِعِلْمٍ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Thamāniyata azwājin mina ḍ-ḍaʾni thnayni wa-mina l-maʿzi thnayni qul ā-dh-dhakarayni ḥarrama ami l-unthayayni amma shtamalat ʿalayhi arḥāmu l-unthayayni nabbiʾūnī bi-ʿilmin in kuntum ṣādiqīn
  trad: 'Huit couples (*azwāj*) — du mouton (*ḍaʾn*), deux ; de la chèvre (*maʿz*), deux. Dis : « Est-ce les deux mâles qu''Il a interdits, ou les deux femelles, ou ce que renferment (*ishtamalat*) les matrices (*arḥām*) des deux femelles ? Informez-moi avec savoir (*bi-ʿilm*), si vous êtes véridiques. »'
- ref: S.6:144
  ar: وَمِنَ الْإِبِلِ اثْنَيْنِ وَمِنَ الْبَقَرِ اثْنَيْنِ ۗ قُلْ آلذَّكَرَيْنِ حَرَّمَ أَمِ الْأُنْثَيَيْنِ أَمَّا اشْتَمَلَتْ عَلَيْهِ أَرْحَامُ الْأُنْثَيَيْنِ ۖ أَمْ كُنْتُمْ شُهَدَاءَ إِذْ وَصَّاكُمُ اللَّهُ بِهَٰذَا ۚ فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا لِيُضِلَّ النَّاسَ بِغَيْرِ عِلْمٍ ۗ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ
  trl: Wa-mina l-ibili thnayni wa-mina l-baqari thnayni qul ā-dh-dhakarayni ḥarrama ami l-unthayayni amma shtamalat ʿalayhi arḥāmu l-unthayayni am kuntum shuhadāʾa idh waṣṣākumu llāhu bihādhā fa-man aẓlamu mimmani ftarā ʿalā llāhi kadhiban li-yuḍilla n-nāsa bi-ghayri ʿilmin inna llāha lā yahdi l-qawma ẓ-ẓālimīn
  trad: 'Et du chameau (*ibil*), deux ; et du bœuf (*baqar*), deux. Dis : « Est-ce les deux mâles qu''Il a interdits, ou les deux femelles, ou ce que renferment les matrices des deux femelles ? Ou étiez-vous témoins (*shuhadāʾ*) quand Allaah vous a enjoint (*waṣṣākumu*) cela ? » Qui est plus injuste que celui qui invente (*iftarā*) un mensonge contre Allaah, pour égarer les gens sans savoir ? Allaah ne guide certes pas le peuple des injustes (*aẓ-ẓālimīn*).'
- ref: S.6:145
  ar: قُلْ لَا أَجِدُ فِي مَا أُوحِيَ إِلَيَّ مُحَرَّمًا عَلَىٰ طَاعِمٍ يَطْعَمُهُ إِلَّا أَنْ يَكُونَ مَيْتَةً أَوْ دَمًا مَسْفُوحًا أَوْ لَحْمَ خِنْزِيرٍ فَإِنَّهُ رِجْسٌ أَوْ فِسْقًا أُهِلَّ لِغَيْرِ اللَّهِ بِهِ ۚ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَإِنَّ رَبَّكَ غَفُورٌ رَحِيمٌ
  trl: Qul lā ajidu fī mā ūḥiya ilayya muḥarraman ʿalā ṭāʿimin yaṭʿamuhu illā an yakūna maytatan aw daman masfūḥan aw laḥma khinzīrin fa-innahu rijsun aw fisqan uhilla li-ghayri llāhi bihi fa-mani ḍṭurra ghayra bāghin wa-lā ʿādin fa-inna rabbaka ghafūrun raḥīm
  trad: 'Dis : « Je ne trouve, dans ce qui m''a été insufflé (*ūḥiya ilayya*), rien d''interdit à quiconque le mange, sauf que ce soit une bête morte d''elle-même (*maytatan*), ou du sang répandu, ou de la chair de porc — car cela est un *rijs* — ou un *fisq* sur lequel un autre nom qu''Allaah a été invoqué. Mais quiconque y est contraint, sans transgression volontaire (*ghayra bāghin*) ni excès, ton Rabb est certes *Ghafūr*, *Raḥīm*. »'
- ref: S.6:146
  ar: وَعَلَى الَّذِينَ هَادُوا حَرَّمْنَا كُلَّ ذِي ظُفُرٍ ۖ وَمِنَ الْبَقَرِ وَالْغَنَمِ حَرَّمْنَا عَلَيْهِمْ شُحُومَهُمَا إِلَّا مَا حَمَلَتْ ظُهُورُهُمَا أَوِ الْحَوَايَا أَوْ مَا اخْتَلَطَ بِعَظْمٍ ۚ ذَٰلِكَ جَزَيْنَاهُمْ بِبَغْيِهِمْ ۖ وَإِنَّا لَصَادِقُونَ
  trl: Wa-ʿalā lladhīna hādū ḥarramnā kulla dhī ẓufurin wa-mina l-baqari wa-l-ghanami ḥarramnā ʿalayhim shuḥūmahumā illā mā ḥamalat ẓuhūruhumā awi l-ḥawāyā aw ma khtalaṭa bi-ʿaẓmin dhālika jazaynāhum bi-baghyihim wa-innā la-ṣādiqūn
  trad: Et à ceux qui se sont judaïsés (*hādū*), Nous avons interdit tout ce qui a un ongle (*ẓufur*) ; et du bœuf et du mouton, Nous leur avons interdit les graisses (*shuḥūm*), sauf ce que portent leurs dos, ou les entrailles (*ḥawāyā*), ou ce qui est mêlé à un os. Cela, Nous les avons rétribués (*jazaynāhum*) pour leur excès (*baghyihim*) — et Nous sommes certes véridiques.
- ref: S.6:147
  ar: فَإِنْ كَذَّبُوكَ فَقُلْ رَبُّكُمْ ذُو رَحْمَةٍ وَاسِعَةٍ وَلَا يُرَدُّ بَأْسُهُ عَنِ الْقَوْمِ الْمُجْرِمِينَ
  trl: Fa-in kadhdhabūka fa-qul rabbukum dhū raḥmatin wāsiʿatin wa-lā yuraddu baʾsuhu ʿani l-qawmi l-mujrimīn
  trad: 'Et s''ils te traitent de menteur, dis : « Votre Rabb est détenteur d''une *raḥma* vaste (*wāsiʿa*) — et Sa rigueur (*baʾs*) n''est pas repoussée du peuple des criminels (*al-mujrimīn*). »'
- ref: S.6:148
  ar: سَيَقُولُ الَّذِينَ أَشْرَكُوا لَوْ شَاءَ اللَّهُ مَا أَشْرَكْنَا وَلَا آبَاؤُنَا وَلَا حَرَّمْنَا مِنْ شَيْءٍ ۚ كَذَٰلِكَ كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ حَتَّىٰ ذَاقُوا بَأْسَنَا ۗ قُلْ هَلْ عِنْدَكُمْ مِنْ عِلْمٍ فَتُخْرِجُوهُ لَنَا ۖ إِنْ تَتَّبِعُونَ إِلَّا الظَّنَّ وَإِنْ أَنْتُمْ إِلَّا تَخْرُصُونَ
  trl: Sa-yaqūlu lladhīna ashrakū law shāʾa llāhu mā ashraknā wa-lā ābāʾunā wa-lā ḥarramnā min shayʾin kadhālika kadhdhaba lladhīna min qablihim ḥattā dhāqū baʾsanā qul hal ʿindakum min ʿilmin fa-tukhrijūhu lanā in tattabiʿūna illā ẓ-ẓanna wa-in antum illā takhruṣūn
  trad: 'Ceux qui ont pratiqué le *shirk* diront : « Si Allaah avait voulu, nous n''aurions pas pratiqué le *shirk*, ni nos pères, et nous n''aurions rien interdit. » Ainsi ceux d''avant eux ont traité de menteur, jusqu''à ce qu''ils goûtent Notre rigueur. Dis : « Avez-vous quelque savoir, que vous puissiez nous produire ? Vous ne suivez que la conjecture (*aẓ-ẓann*), et vous ne faites que supposer à tort (*takhruṣūn*). »'
- ref: S.6:149
  ar: قُلْ فَلِلَّهِ الْحُجَّةُ الْبَالِغَةُ ۖ فَلَوْ شَاءَ لَهَدَاكُمْ أَجْمَعِينَ
  trl: Qul fa-li-llāhi l-ḥujjatu l-bālighatu fa-law shāʾa la-hadākum ajmaʿīn
  trad: 'Dis : « L''argument décisif (*al-ḥujja al-bāligha*) appartient à Allaah — s''Il avait voulu, Il vous aurait guidés tous ensemble. »'
- ref: S.6:150
  ar: قُلْ هَلُمَّ شُهَدَاءَكُمُ الَّذِينَ يَشْهَدُونَ أَنَّ اللَّهَ حَرَّمَ هَٰذَا ۖ فَإِنْ شَهِدُوا فَلَا تَشْهَدْ مَعَهُمْ ۚ وَلَا تَتَّبِعْ أَهْوَاءَ الَّذِينَ كَذَّبُوا بِآيَاتِنَا وَالَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ وَهُمْ بِرَبِّهِمْ يَعْدِلُونَ
  trl: Qul halumma shuhadāʾakumu lladhīna yashhadūna anna llāha ḥarrama hādhā fa-in shahidū fa-lā tashhad maʿahum wa-lā tattabiʿ ahwāʾa lladhīna kadhdhabū bi-āyātinā wa-lladhīna lā yuʾminūna bi-l-ākhirati wa-hum bi-rabbihim yaʿdilūn
  trad: 'Dis : « Amenez vos témoins qui témoignent qu''Allaah a interdit ceci. » S''ils témoignent, ne témoigne pas avec eux — et ne suis pas les passions (*ahwāʾ*) de ceux qui ont traité Nos *āyāt* de mensonge, et de ceux qui ne croient pas en l''Ultime, et qui égalent (*yaʿdilūn*) [d''autres] à leur Rabb.'
- ref: S.6:151
  ar: ۞ قُلْ تَعَالَوْا أَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمْ ۖ أَلَّا تُشْرِكُوا بِهِ شَيْئًا ۖ وَبِالْوَالِدَيْنِ إِحْسَانًا ۖ وَلَا تَقْتُلُوا أَوْلَادَكُمْ مِنْ إِمْلَاقٍ ۖ نَحْنُ نَرْزُقُكُمْ وَإِيَّاهُمْ ۖ وَلَا تَقْرَبُوا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ ۖ وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ ۚ ذَٰلِكُمْ وَصَّاكُمْ بِهِ لَعَلَّكُمْ تَعْقِلُونَ
  trl: Qul taʿālaw atlu mā ḥarrama rabbukum ʿalaykum allā tushrikū bihi shayʾan wa-bi-l-wālidayni iḥsānan wa-lā taqtulū awlādakum min imlāqin naḥnu narzuqukum wa-iyyāhum wa-lā taqrabū l-fawāḥisha mā ẓahara minhā wa-mā baṭana wa-lā taqtulū n-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqqi dhālikum waṣṣākum bihi laʿallakum taʿqilūn
  trad: 'Dis : « Venez, je réciterai (*atlu*) ce que votre Rabb vous a interdit : ne rien Lui associer (*shirk*) ; la bienfaisance (*iḥsān*) envers les deux parents ; ne pas tuer vos enfants par crainte de la pauvreté (*min imlāq*) — c''est Nous qui vous attribuons subsistance, à vous et à eux ; ne pas approcher les turpitudes (*al-fawāḥish*), apparentes ou cachées ; ne pas tuer le *nafs* qu''Allaah a rendu inviolable, sauf en toute légitimité (*bi-l-ḥaqq*). Voilà ce qu''Il vous a enjoint (*waṣṣākum bihi*), peut-être raisonnerez-vous (*taʿqilūn*). »'
- ref: S.6:152
  ar: وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُ ۖ وَأَوْفُوا الْكَيْلَ وَالْمِيزَانَ بِالْقِسْطِ ۖ لَا نُكَلِّفُ نَفْسًا إِلَّا وُسْعَهَا ۖ وَإِذَا قُلْتُمْ فَاعْدِلُوا وَلَوْ كَانَ ذَا قُرْبَىٰ ۖ وَبِعَهْدِ اللَّهِ أَوْفُوا ۚ ذَٰلِكُمْ وَصَّاكُمْ بِهِ لَعَلَّكُمْ تَذَكَّرُونَ
  trl: Wa-lā taqrabū māla l-yatīmi illā bi-llatī hiya aḥsanu ḥattā yablugha ashuddahu wa-awfū l-kayla wa-l-mīzāna bi-l-qisṭi lā nukallifu nafsan illā wusʿahā wa-idhā qultum fa-ʿdilū wa-law kāna dhā qurbā wa-bi-ʿahdi llāhi awfū dhālikum waṣṣākum bihi laʿallakum tadhakkarūn
  trad: 'Et n''approchez le bien de l''orphelin (*al-yatīm*) que de la meilleure façon, jusqu''à ce qu''il atteigne sa pleine maturité (*ashuddahu*) — et donnez pleine mesure (*al-kayl*) et plein poids (*al-mīzān*) avec équité (*bi-l-qisṭ*) : Nous ne chargeons aucun *nafs* au-delà de sa capacité (*wusʿahā*) — et quand vous parlez, soyez justes (*ʿdilū*), fût-ce envers un proche — et le pacte d''Allaah (*ʿahda llāh*), tenez-le. Voilà ce qu''Il vous a enjoint, peut-être vous rappellerez-vous (*tadhakkarūn*).'
- ref: S.6:153
  ar: وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَنْ سَبِيلِهِ ۚ ذَٰلِكُمْ وَصَّاكُمْ بِهِ لَعَلَّكُمْ تَتَّقُونَ
  trl: Wa-anna hādhā ṣirāṭī mustaqīman fa-ttabiʿūhu wa-lā tattabiʿū s-subula fa-tafarraqa bikum ʿan sabīlihi dhālikum waṣṣākum bihi laʿallakum tattaqūn
  trad: Et que ceci est Mon chemin (*ṣirāṭī*), droit — suivez-le donc, et ne suivez pas les sentiers (*as-subul*), qui vous disperseraient (*fa-tafarraqa*) loin de Son chemin. Voilà ce qu'Il vous a enjoint, peut-être vous prémunirez-vous (*tattaqūn*).
- ref: S.6:154
  ar: ثُمَّ آتَيْنَا مُوسَى الْكِتَابَ تَمَامًا عَلَى الَّذِي أَحْسَنَ وَتَفْصِيلًا لِكُلِّ شَيْءٍ وَهُدًى وَرَحْمَةً لَعَلَّهُمْ بِلِقَاءِ رَبِّهِمْ يُؤْمِنُونَ
  trl: Thumma ātaynā mūsā l-kitāba tamāman ʿalā lladhī aḥsana wa-tafṣīlan li-kulli shayʾin wa-hudan wa-raḥmatan laʿallahum bi-liqāʾi rabbihim yuʾminūn
  trad: Puis Nous avons donné à Mūsā le Kitāb, en achèvement (*tamāman*) sur ce qui excelle, en détail (*tafṣīlan*) pour toute chose, guidance et *raḥma* — peut-être croiraient-ils en la Rencontre (*liqāʾ*) de leur Rabb.
- ref: S.6:155
  ar: وَهَٰذَا كِتَابٌ أَنْزَلْنَاهُ مُبَارَكٌ فَاتَّبِعُوهُ وَاتَّقُوا لَعَلَّكُمْ تُرْحَمُونَ
  trl: Wa-hādhā kitābun anzalnāhu mubārakun fa-ttabiʿūhu wa-ttaqū laʿallakum turḥamūn
  trad: Et ceci est un Kitāb que Nous avons fait descendre, béni (*mubārak*) — suivez-le donc, et prémunissez-vous (*ttaqū*), peut-être vous sera-t-il fait *raḥma* (*turḥamūn*).
- ref: S.6:156
  ar: أَنْ تَقُولُوا إِنَّمَا أُنْزِلَ الْكِتَابُ عَلَىٰ طَائِفَتَيْنِ مِنْ قَبْلِنَا وَإِنْ كُنَّا عَنْ دِرَاسَتِهِمْ لَغَافِلِينَ
  trl: An taqūlū innamā unzila l-kitābu ʿalā ṭāʾifatayni min qablinā wa-in kunnā ʿan dirāsatihim la-ghāfilīn
  trad: 'De crainte que vous ne disiez : « Le Kitāb n''a été descendu que sur deux communautés (*ṭāʾifatayni*) avant nous, et nous étions certes inattentifs (*la-ghāfilīn*) à leur étude (*dirāsa*). »'
- ref: S.6:157
  ar: أَوْ تَقُولُوا لَوْ أَنَّا أُنْزِلَ عَلَيْنَا الْكِتَابُ لَكُنَّا أَهْدَىٰ مِنْهُمْ ۚ فَقَدْ جَاءَكُمْ بَيِّنَةٌ مِنْ رَبِّكُمْ وَهُدًى وَرَحْمَةٌ ۚ فَمَنْ أَظْلَمُ مِمَّنْ كَذَّبَ بِآيَاتِ اللَّهِ وَصَدَفَ عَنْهَا ۗ سَنَجْزِي الَّذِينَ يَصْدِفُونَ عَنْ آيَاتِنَا سُوءَ الْعَذَابِ بِمَا كَانُوا يَصْدِفُونَ
  trl: Aw taqūlū law annā unzila ʿalaynā l-kitābu la-kunnā ahdā minhum fa-qad jāʾakum bayyinatun min rabbikum wa-hudan wa-raḥmatun fa-man aẓlamu mimman kadhdhaba bi-āyāti llāhi wa-ṣadafa ʿanhā sa-najzī lladhīna yaṣdifūna ʿan āyātinā sūʾa l-ʿadhābi bi-mā kānū yaṣdifūn
  trad: 'Ou que vous ne disiez : « Si le Kitāb était descendu sur nous, nous aurions certes été mieux guidés qu''eux. » Une preuve manifeste (*bayyina*) vous est certes venue de votre Rabb, ainsi qu''une guidance et une *raḥma*. Qui est plus injuste que celui qui traite de mensonge les *āyāt* d''Allaah et s''en détourne (*ṣadafa*) ? Nous rétribuerons ceux qui se détournent de Nos *āyāt* du pire châtiment, pour ce dont ils se détournaient.'
- ref: S.6:158
  ar: هَلْ يَنْظُرُونَ إِلَّا أَنْ تَأْتِيَهُمُ الْمَلَائِكَةُ أَوْ يَأْتِيَ رَبُّكَ أَوْ يَأْتِيَ بَعْضُ آيَاتِ رَبِّكَ ۗ يَوْمَ يَأْتِي بَعْضُ آيَاتِ رَبِّكَ لَا يَنْفَعُ نَفْسًا إِيمَانُهَا لَمْ تَكُنْ آمَنَتْ مِنْ قَبْلُ أَوْ كَسَبَتْ فِي إِيمَانِهَا خَيْرًا ۗ قُلِ انْتَظِرُوا إِنَّا مُنْتَظِرُونَ
  trl: Hal yanẓurūna illā an taʾtiyahumu l-malāʾikatu aw yaʾtiya rabbuka aw yaʾtiya baʿḍu āyāti rabbika yawma yaʾtī baʿḍu āyāti rabbika lā yanfaʿu nafsan īmānuhā lam takun āmanat min qablu aw kasabat fī īmānihā khayran quli ntaẓirū innā muntaẓirūn
  trad: 'N''attendent-ils sinon que les *malāʾika* leur viennent, ou que ce qui est ton Rabb survienne (*yaʾtiya rabbuka*), ou que surviennent certains des *āyāt* de ton Rabb ? Le jour où surviendront certains des *āyāt* de ton Rabb, la foi (*īmān*) d''un *nafs* ne lui sera d''aucune utilité, si elle n''avait pas cru auparavant, ou n''avait acquis aucun bien dans sa foi. Dis : « Attendez, nous attendons aussi. »'
- ref: S.6:159
  ar: إِنَّ الَّذِينَ فَرَّقُوا دِينَهُمْ وَكَانُوا شِيَعًا لَسْتَ مِنْهُمْ فِي شَيْءٍ ۚ إِنَّمَا أَمْرُهُمْ إِلَى اللَّهِ ثُمَّ يُنَبِّئُهُمْ بِمَا كَانُوا يَفْعَلُونَ
  trl: Inna lladhīna farraqū dīnahum wa-kānū shiyaʿan lasta minhum fī shayʾin innamā amruhum ilā llāhi thumma yunabbiʾuhum bi-mā kānū yafʿalūn
  trad: Ceux qui ont divisé (*farraqū*) leur *dīn* et sont devenus des sectes (*shiyaʿan*), tu n'es en rien des leurs — leur affaire ne revient qu'à Allaah ; puis Il les informera de ce qu'ils faisaient.
- ref: S.6:160
  ar: مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا ۖ وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ
  trl: Man jāʾa bi-l-ḥasanati fa-lahu ʿashru amthālihā wa-man jāʾa bi-s-sayyiʾati fa-lā yujzā illā mithlahā wa-hum lā yuẓlamūn
  trad: Quiconque vient avec une bonne action (*ḥasana*) en a dix fois l'équivalent (*ʿashru amthālihā*) ; et quiconque vient avec une mauvaise action (*sayyiʾa*) n'est rétribué que de son équivalent — et ils ne sont pas lésés (*lā yuẓlamūn*).
- ref: S.6:161
  ar: قُلْ إِنَّنِي هَدَانِي رَبِّي إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ دِينًا قِيَمًا مِلَّةَ إِبْرَاهِيمَ حَنِيفًا ۚ وَمَا كَانَ مِنَ الْمُشْرِكِينَ
  trl: Qul innanī hadānī rabbī ilā ṣirāṭin mustaqīmin dīnan qiyaman millata ibrāhīma ḥanīfan wa-mā kāna mina l-mushrikīn
  trad: 'Dis : « Mon Rabb m''a guidé (*hadānī*) vers un chemin droit, un *dīn* droit et établi (*qiyaman*), la *milla* d''Ibrāhīm, *ḥanīf* — et il n''était pas parmi les *mushrikūn*. »'
- ref: S.6:162
  ar: قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ
  trl: Qul inna ṣalātī wa-nusukī wa-maḥyāya wa-mamātī li-llāhi rabbi l-ʿālamīn
  trad: 'Dis : « Ma *ṣalāt*, mon rite (*nusuk*), ma vie (*maḥyāya*) et ma mort (*mamātī*) sont pour Allaah, Rabb des mondes (*al-ʿālamīn*). »'
- ref: S.6:163
  ar: لَا شَرِيكَ لَهُ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ
  trl: Lā sharīka lahu wa-bi-dhālika umirtu wa-ana awwalu l-muslimīn
  trad: Nul associé (*sharīk*) à Lui — et c'est de cela qu'il m'a été ordonné, et je suis le premier des *muslimūn*.
- ref: S.6:164
  ar: قُلْ أَغَيْرَ اللَّهِ أَبْغِي رَبًّا وَهُوَ رَبُّ كُلِّ شَيْءٍ ۚ وَلَا تَكْسِبُ كُلُّ نَفْسٍ إِلَّا عَلَيْهَا ۚ وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ ۚ ثُمَّ إِلَىٰ رَبِّكُمْ مَرْجِعُكُمْ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ فِيهِ تَخْتَلِفُونَ
  trl: Qul a-ghayra llāhi abghī rabban wa-huwa rabbu kulli shayʾin wa-lā taksibu kullu nafsin illā ʿalayhā wa-lā taziru wāziratun wizra ukhrā thumma ilā rabbikum marjiʿukum fa-yunabbiʾukum bi-mā kuntum fīhi takhtalifūn
  trad: 'Dis : « Chercherais-je (*abghī*) un autre Rabb qu''Allaah, alors qu''Il est le Rabb de toute chose ? » Et chaque *nafs* n''acquiert (*taksibu*) que contre elle-même — et nulle âme chargée (*wāzira*) ne porte le fardeau (*wizr*) d''une autre. Puis c''est vers votre Rabb qu''est votre retour (*marjiʿ*) ; Il vous informera de ce en quoi vous divergiez (*takhtalifūn*).'
- ref: S.6:165
  ar: وَهُوَ الَّذِي جَعَلَكُمْ خَلَائِفَ الْأَرْضِ وَرَفَعَ بَعْضَكُمْ فَوْقَ بَعْضٍ دَرَجَاتٍ لِيَبْلُوَكُمْ فِي مَا آتَاكُمْ ۗ إِنَّ رَبَّكَ سَرِيعُ الْعِقَابِ وَإِنَّهُ لَغَفُورٌ رَحِيمٌ
  trl: Wa-huwa lladhī jaʿalakum khalāʾifa l-arḍi wa-rafaʿa baʿḍakum fawqa baʿḍin darajātin li-yabluwakum fī mā ātākum inna rabbaka sarīʿu l-ʿiqābi wa-innahu la-ghafūrun raḥīm
  trad: Et Ce qui a fait de vous des successeurs (*khalāʾif*) de la terre, et a élevé certains d'entre vous au-dessus (*fawqa*) d'autres, par rangs (*darajāt*), pour vous éprouver (*li-yabluwakum*) dans ce qu'Il vous a donné — ton Rabb est certes prompt dans la rétribution (*sarīʿu l-ʿiqāb*), et Il est certes *Ghafūr*, *Raḥīm*.
