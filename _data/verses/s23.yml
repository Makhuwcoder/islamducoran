- ref: S.23:1–2
  ar: قَدْ أَفْلَحَ الْمُؤْمِنُونَ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ
  trl: Qad aflaḥa l-muʾminūn — alladhīna hum fī ṣalātihim khāshiʿūn
  trad: Certes, les *muʾminūn* ont atteint le *falāḥ* — ceux qui, dans leur *ṣalāt*, sont *khāshiʿūn*.
- ref: S.23:3
  ar: وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ
  trl: Wa-lladhīna hum ʿani l-laghwi muʿriḍūn
  trad: Et ceux qui, du *laghw*, se détournent (*muʿriḍūn*).
- ref: S.23:4
  ar: وَالَّذِينَ هُمْ لِلزَّكَاةِ فَاعِلُونَ
  trl: Wa-lladhīna hum li-z-zakāti fāʿilūn
  trad: Et ceux qui, pour la *zakāt*, agissent (*fāʿilūn*).
- ref: S.23:5–7
  ar: وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ إِلَّا عَلَىٰ أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ فَمَنِ ابْتَغَىٰ وَرَاءَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْعَادُونَ
  trl: Wa-lladhīna hum li-furūjihim ḥāfiẓūn — illā ʿalā azwājihim aw mā malakat aymānuhum fa-innahum ghayru malūmīn — fa-mani btaghā warāʾa dhālika fa-ulāʾika humu l-ʿādūn
  trad: 'Et ceux qui, de leurs *furūj*, sont gardiens (*ḥāfiẓūn*) — sauf avec leurs épouses, ou *mā malakat aymānuhum* : ils ne sont alors nullement blâmés. Mais quiconque cherche au-delà de cela — ceux-là sont les transgresseurs (*al-ʿādūn*).'
- ref: S.23:8
  ar: وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ
  trl: Wa-lladhīna hum li-amānātihim wa-ʿahdihim rāʿūn
  trad: Et ceux qui, de leurs *amānāt* et de leur pacte (*ʿahd*), sont gardiens attentifs (*rāʿūn*).
- ref: S.23:9
  ar: وَالَّذِينَ هُمْ عَلَىٰ صَلَوَاتِهِمْ يُحَافِظُونَ
  trl: Wa-lladhīna hum ʿalā ṣalawātihim yuḥāfiẓūn
  trad: Et ceux qui, sur leurs *ṣalawāt*, veillent avec constance (*yuḥāfiẓūn*).
- ref: S.23:10–11
  ar: أُولَٰئِكَ هُمُ الْوَارِثُونَ الَّذِينَ يَرِثُونَ الْفِرْدَوْسَ هُمْ فِيهَا خَالِدُونَ
  trl: Ulāʾika humu l-wārithūn — alladhīna yarithūna l-firdawsa hum fīhā khālidūn
  trad: 'Ceux-là sont les héritiers (*al-wārithūn*) — ceux qui héritent du Firdaws : ils y demeurent à jamais (*khālidūn*).'
- ref: S.23:12
  ar: وَلَقَدْ خَلَقْنَا الْإِنْسَانَ مِنْ سُلَالَةٍ مِنْ طِينٍ
  trl: Wa-la-qad khalaqnā l-insāna min sulālatin min ṭīn
  trad: 'Et Nous avons certes créé l''humain (*al-insān*) à partir d''une *sulāla* d''argile (*ṭīn*).'
- ref: S.23:13
  ar: ثُمَّ جَعَلْنَاهُ نُطْفَةً فِي قَرَارٍ مَكِينٍ
  trl: Thumma jaʿalnāhu nuṭfatan fī qarārin makīn
  trad: 'Puis Nous l''avons fait *nuṭfa*, dans un lieu stable (*qarārin*) et solidement établi (*makīn*).'
- ref: S.23:14
  ar: ثُمَّ خَلَقْنَا النُّطْفَةَ عَلَقَةً فَخَلَقْنَا الْعَلَقَةَ مُضْغَةً فَخَلَقْنَا الْمُضْغَةَ عِظَامًا فَكَسَوْنَا الْعِظَامَ لَحْمًا ثُمَّ أَنْشَأْنَاهُ خَلْقًا آخَرَ ۚ فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ
  trl: Thumma khalaqnā n-nuṭfata ʿalaqatan fa-khalaqnā l-ʿalaqata muḍghatan fa-khalaqnā l-muḍghata ʿiẓāman fa-kasawnā l-ʿiẓāma laḥman thumma anshaʾnāhu khalqan ākhara — fa-tabāraka llāhu aḥsanu l-khāliqīn
  trad: 'Puis Nous avons créé la *nuṭfa* [en] *ʿalaqa*, puis Nous avons créé l''*ʿalaqa* [en] *muḍgha*, puis Nous avons créé la *muḍgha* [en] os, puis Nous avons revêtu (*kasawnā*) les os de chair — puis Nous l''avons fait naître (*anshaʾnāhu*) à une création autre (*khalqan ākhara*). *Tabāraka* Allaah — Ce qui est le meilleur des créateurs (*aḥsanu l-khāliqīn*).'
- ref: S.23:15–16
  ar: ثُمَّ إِنَّكُمْ بَعْدَ ذَٰلِكَ لَمَيِّتُونَ ثُمَّ إِنَّكُمْ يَوْمَ الْقِيَامَةِ تُبْعَثُونَ
  trl: Thumma innakum baʿda dhālika la-mayyitūn — thumma innakum yawma l-qiyāmati tubʿathūn
  trad: Puis, après cela, vous êtes certes voués à mourir (*la-mayyitūn*) — puis, au Jour de la Résurrection (*yawm al-qiyāma*), vous serez ressuscités (*tubʿathūn*).
- ref: S.23:17
  ar: وَلَقَدْ خَلَقْنَا فَوْقَكُمْ سَبْعَ طَرَائِقَ وَمَا كُنَّا عَنِ الْخَلْقِ غَافِلِينَ
  trl: Wa-la-qad khalaqnā fawqakum sabʿa ṭarāʾiqa wa-mā kunnā ʿani l-khalqi ghāfilīn
  trad: 'Et Nous avons certes créé, au-dessus de vous (*fawqakum*), sept *ṭarāʾiq* — et Nous n''étions pas inattentifs (*ghāfilīn*) à l''égard de la création.'
- ref: S.23:18
  ar: وَأَنْزَلْنَا مِنَ السَّمَاءِ مَاءً بِقَدَرٍ فَأَسْكَنَّاهُ فِي الْأَرْضِ ۖ وَإِنَّا عَلَىٰ ذَهَابٍ بِهِ لَقَادِرُونَ
  trl: Wa-anzalnā mina s-samāʾi māʾan bi-qadarin fa-askannāhu fi l-arḍi wa-innā ʿalā dhahābin bihi la-qādirūn
  trad: 'Et Nous avons fait descendre, du ciel, une eau selon une mesure (*bi-qadarin*), et Nous l''avons fixée (*askannāhu*) dans la terre — et Nous sommes certes, pour la faire disparaître (*dhahāb*), capables (*qādirūn*).'
- ref: S.23:19
  ar: فَأَنْشَأْنَا لَكُمْ بِهِ جَنَّاتٍ مِنْ نَخِيلٍ وَأَعْنَابٍ لَكُمْ فِيهَا فَوَاكِهُ كَثِيرَةٌ وَمِنْهَا تَأْكُلُونَ
  trl: Fa-anshaʾnā lakum bihi jannātin min nakhīlin wa-aʿnābin lakum fīhā fawākihu kathīratun wa-minhā taʾkulūn
  trad: Et Nous avons fait naître pour vous, par elle, des jardins de palmiers et de vignes — vous y avez des fruits abondants, et vous en mangez.
- ref: S.23:20
  ar: وَشَجَرَةً تَخْرُجُ مِنْ طُورِ سَيْنَاءَ تَنْبُتُ بِالدُّهْنِ وَصِبْغٍ لِلْآكِلِينَ
  trl: Wa-shajaratan takhruju min ṭūri saynāʾa tanbutu bi-d-duhni wa-ṣibghin li-l-ākilīn
  trad: 'Et un arbre qui sort du Ṭūr Saynāʾ, qui pousse avec de l''huile (*duhn*) et un assaisonnement (*ṣibgh*) pour ceux qui mangent.'
- ref: S.23:21–22
  ar: وَإِنَّ لَكُمْ فِي الْأَنْعَامِ لَعِبْرَةً ۖ نُسْقِيكُمْ مِمَّا فِي بُطُونِهَا وَلَكُمْ فِيهَا مَنَافِعُ كَثِيرَةٌ وَمِنْهَا تَأْكُلُونَ وَعَلَيْهَا وَعَلَى الْفُلْكِ تُحْمَلُونَ
  trl: Wa-inna lakum fi l-anʿāmi la-ʿibratan — nusqīkum mimmā fī buṭūnihā wa-lakum fīhā manāfiʿu kathīratun wa-minhā taʾkulūna wa-ʿalayhā wa-ʿalā l-fulki tuḥmalūn
  trad: 'Et vous avez certes, dans le bétail (*al-anʿām*), une *ʿibra* : Nous vous abreuvons de ce qui est dans leurs ventres, vous y avez des profits abondants, vous en mangez, et sur eux, comme sur l''arche (*al-fulk*), vous êtes portés.'
- ref: S.23:23
  ar: وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ فَقَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ أَفَلَا تَتَّقُونَ
  trl: Wa-la-qad arsalnā nūḥan ilā qawmihi fa-qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu a-fa-lā tattaqūn
  trad: 'Et Nous avons certes envoyé Nūḥ vers son peuple. Il dit : « Ô mon peuple, adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Ne vous prémunirez-vous (*tattaqūn*) donc pas ? »'
- ref: S.23:24
  ar: فَقَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ مَا هَٰذَا إِلَّا بَشَرٌ مِثْلُكُمْ يُرِيدُ أَنْ يَتَفَضَّلَ عَلَيْكُمْ وَلَوْ شَاءَ اللَّهُ لَأَنْزَلَ مَلَائِكَةً مَا سَمِعْنَا بِهَٰذَا فِي آبَائِنَا الْأَوَّلِينَ
  trl: Fa-qāla l-malaʾu lladhīna kafarū min qawmihi mā hādhā illā basharun mithlukum yurīdu an yatafaḍḍala ʿalaykum wa-law shāʾa llāhu la-anzala malāʾikatan mā samiʿnā bi-hādhā fī ābāʾinā l-awwalīn
  trad: 'L''assemblée (*al-malaʾ*) de son peuple, ceux qui avaient commis le *kufr*, dit alors : « Celui-ci n''est qu''un être humain ordinaire (*basharun mithlukum*), qui veut se distinguer (*yatafaḍḍala*) au-dessus de vous. Si Allaah avait voulu, Il aurait fait descendre des *malāʾika* — nous n''avons pas entendu parler de cela chez nos premiers pères (*ābāʾinā l-awwalīn*). »'
- ref: S.23:25
  ar: إِنْ هُوَ إِلَّا رَجُلٌ بِهِ جِنَّةٌ فَتَرَبَّصُوا بِهِ حَتَّىٰ حِينٍ
  trl: In huwa illā rajulun bihi jinnatun fa-tarabbaṣū bihi ḥattā ḥīn
  trad: '« Ce n''est qu''un homme atteint de *jinna* — attendez donc à son sujet, jusqu''à un temps (*ḥattā ḥīn*). »'
- ref: S.23:26
  ar: قَالَ رَبِّ انْصُرْنِي بِمَا كَذَّبُونِ
  trl: Qāla rabbi nṣurnī bi-mā kadhdhabūn
  trad: 'Il dit : « Mon Rabb, secours-moi (*unṣurnī*), pour ce qu''ils m''ont traité de menteur (*kadhdhabūn*). »'
- ref: S.23:27
  ar: فَأَوْحَيْنَا إِلَيْهِ أَنِ اصْنَعِ الْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا فَإِذَا جَاءَ أَمْرُنَا وَفَارَ التَّنُّورُ ۙ فَاسْلُكْ فِيهَا مِنْ كُلٍّ زَوْجَيْنِ اثْنَيْنِ وَأَهْلَكَ إِلَّا مَنْ سَبَقَ عَلَيْهِ الْقَوْلُ مِنْهُمْ ۖ وَلَا تُخَاطِبْنِي فِي الَّذِينَ ظَلَمُوا ۖ إِنَّهُمْ مُغْرَقُونَ
  trl: Fa-awḥaynā ilayhi ani ṣnaʿi l-fulka bi-aʿyuninā wa-waḥyinā fa-idhā jāʾa amrunā wa-fāra t-tannūru fa-sluk fīhā min kullin zawjayni thnayni wa-ahlaka illā man sabaqa ʿalayhi l-qawlu minhum wa-lā tukhāṭibnī fi lladhīna ẓalamū innahum mughraqūn
  trad: 'Nous lui révélâmes alors (*fa-awḥaynā ilayhi*) : « Construis l''arche sous Nos *aʿyun* et par Notre inspiration (*waḥyinā*) — et quand Notre ordre viendra, et que le *tannūr* débordera (*fāra*), fais entrer (*fa-sluk*) en elle, de chaque [espèce], un couple (*zawjayni thnayni*), ainsi que ta famille (*ahlaka*) — sauf celui contre qui la parole a déjà précédé (*sabaqa ʿalayhi l-qawlu*), parmi eux — et ne M''interpelle plus (*lā tukhāṭibnī*) au sujet de ceux qui ont commis l''injustice (*ẓalamū*) : ils vont être noyés (*mughraqūn*). »'
- ref: S.23:28
  ar: فَإِذَا اسْتَوَيْتَ أَنْتَ وَمَنْ مَعَكَ عَلَى الْفُلْكِ فَقُلِ الْحَمْدُ لِلَّهِ الَّذِي نَجَّانَا مِنَ الْقَوْمِ الظَّالِمِينَ
  trl: Fa-idhā stawayta anta wa-man maʿaka ʿalā l-fulki fa-quli l-ḥamdu lillāhi lladhī najjānā mina l-qawmi ẓ-ẓālimīn
  trad: '« Et quand toi et ceux qui sont avec toi vous serez pleinement installés (*stawayta*) sur l''arche, dis : la *ḥamd* est à Allaah, Ce qui nous a sauvés (*najjānā*) du peuple injuste (*aẓ-ẓālimīn*). »'
- ref: S.23:29
  ar: وَقُلْ رَبِّ أَنْزِلْنِي مُنْزَلًا مُبَارَكًا وَأَنْتَ خَيْرُ الْمُنْزِلِينَ
  trl: Wa-qul rabbi anzilnī munzalan mubārakan wa-anta khayru l-munzilīn
  trad: '« Et dis : Mon Rabb, fais-moi descendre en un lieu de débarquement *mubārak* — Tu es le meilleur de ceux qui accueillent (*khayru l-munzilīn*). »'
- ref: S.23:30
  ar: إِنَّ فِي ذَٰلِكَ لَآيَاتٍ وَإِنْ كُنَّا لَمُبْتَلِينَ
  trl: Inna fī dhālika la-āyātin wa-in kunnā la-mubtalīn
  trad: 'En cela, il y a certes des *āyāt* — et Nous étions certes, [par ce récit,] en train d''éprouver (*mubtalīn*).'
- ref: S.23:31
  ar: ثُمَّ أَنْشَأْنَا مِنْ بَعْدِهِمْ قَرْنًا آخَرِينَ
  trl: Thumma anshaʾnā min baʿdihim qarnan ākharīn
  trad: Puis Nous avons fait naître, après eux, une génération (*qarn*) autre.
- ref: S.23:32
  ar: فَأَرْسَلْنَا فِيهِمْ رَسُولًا مِنْهُمْ أَنِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ أَفَلَا تَتَّقُونَ
  trl: Fa-arsalnā fīhim rasūlan minhum ani ʿbudū llāha mā lakum min ilāhin ghayruhu a-fa-lā tattaqūn
  trad: 'Nous envoyâmes alors, parmi eux, un *rasūl* issu d''eux-mêmes [portant cet ordre] : « Adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Ne vous prémunirez-vous (*tattaqūn*) donc pas ? »'
- ref: S.23:33
  ar: وَقَالَ الْمَلَأُ مِنْ قَوْمِهِ الَّذِينَ كَفَرُوا وَكَذَّبُوا بِلِقَاءِ الْآخِرَةِ وَأَتْرَفْنَاهُمْ فِي الْحَيَاةِ الدُّنْيَا مَا هَٰذَا إِلَّا بَشَرٌ مِثْلُكُمْ يَأْكُلُ مِمَّا تَأْكُلُونَ مِنْهُ وَيَشْرَبُ مِمَّا تَشْرَبُونَ
  trl: Wa-qāla l-malaʾu min qawmihi lladhīna kafarū wa-kadhdhabū bi-liqāʾi l-ākhirati wa-atrafnāhum fi l-ḥayāti d-dunyā mā hādhā illā basharun mithlukum yaʾkulu mimmā taʾkulūna minhu wa-yashrabu mimmā tashrabūn
  trad: 'Et l''assemblée (*al-malaʾ*) de son peuple — ceux qui avaient commis le *kufr*, qui avaient démenti la rencontre de l''Ākhira (*liqāʾ al-ākhira*), et à qui Nous avions donné l''aisance (*atrafnāhum*) dans la vie d''ici-bas — dirent : « Celui-ci n''est qu''un être humain ordinaire (*basharun mithlukum*), comme vous : il mange de ce dont vous mangez, et il boit de ce dont vous buvez. »'
- ref: S.23:34
  ar: وَلَئِنْ أَطَعْتُمْ بَشَرًا مِثْلَكُمْ إِنَّكُمْ إِذًا لَخَاسِرُونَ
  trl: Wa-la-in aṭaʿtum basharan mithlakum innakum idhan la-khāsirūn
  trad: Et si vous obéissez à un être humain semblable à vous, vous serez alors certes du nombre des perdants (*al-khāsirūn*).
- ref: S.23:35
  ar: أَيَعِدُكُمْ أَنَّكُمْ إِذَا مِتُّمْ وَكُنْتُمْ تُرَابًا وَعِظَامًا أَنَّكُمْ مُخْرَجُونَ
  trl: A-yaʿidukum annakum idhā mittum wa-kuntum turāban wa-ʿiẓāman annakum mukhrajūn
  trad: Vous promet-il que, lorsque vous serez morts et que vous serez devenus terre (*turāb*) et ossements (*ʿiẓām*), vous en serez fait sortir (*mukhrajūn*) ?
- ref: S.23:36
  ar: ۞ هَيْهَاتَ هَيْهَاتَ لِمَا تُوعَدُونَ
  trl: Hayhāta hayhāta li-mā tūʿadūn
  trad: '*Hayhāta, hayhāta* — combien lointain, combien lointain, ce qui vous est promis !'
- ref: S.23:37
  ar: إِنْ هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا نَحْنُ بِمَبْعُوثِينَ
  trl: In hiya illā ḥayātunā d-dunyā namūtu wa-naḥyā wa-mā naḥnu bi-mabʿūthīn
  trad: 'Il n''y a rien d''autre que notre vie d''ici-bas : nous mourons et nous vivons, et nous ne serons jamais ressuscités (*mabʿūthīn*).'
- ref: S.23:38
  ar: إِنْ هُوَ إِلَّا رَجُلٌ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا وَمَا نَحْنُ لَهُ بِمُؤْمِنِينَ
  trl: In huwa illā rajulun iftarā ʿalā llāhi kadhiban wa-mā naḥnu lahu bi-muʾminīn
  trad: '« Ce n''est qu''un homme qui a forgé (*iftarā*) un mensonge (*kadhib*) contre Allaah, et nous ne sommes pas croyants en lui. »'
- ref: S.23:39
  ar: قَالَ رَبِّ انْصُرْنِي بِمَا كَذَّبُونِ
  trl: Qāla rabbi nṣurnī bi-mā kadhdhabūn
  trad: 'Il dit : « Mon Rabb, secours-moi (*unṣurnī*), pour ce qu''ils m''ont traité de menteur (*kadhdhabūn*). »'
- ref: S.23:40
  ar: قَالَ عَمَّا قَلِيلٍ لَيُصْبِحُنَّ نَادِمِينَ
  trl: Qāla ʿammā qalīlin la-yuṣbiḥunna nādimīn
  trad: 'Il fut dit : « Sous peu (*ʿammā qalīl*), ils seront certainement, au matin, pleins de regret (*nādimīn*). »'
- ref: S.23:41
  ar: فَأَخَذَتْهُمُ الصَّيْحَةُ بِالْحَقِّ فَجَعَلْنَاهُمْ غُثَاءً ۚ فَبُعْدًا لِلْقَوْمِ الظَّالِمِينَ
  trl: Fa-akhadhathumu ṣ-ṣayḥatu bi-l-ḥaqqi fa-jaʿalnāhum ghuthāʾan fa-buʿdan li-l-qawmi ẓ-ẓālimīn
  trad: Le Cri (*aṣ-ṣayḥa*) les saisit alors, en toute vérité (*bi-l-ḥaqq*), et Nous en avons fait des débris emportés par le flot (*ghuthāʾ*) — éloignement donc (*buʿdan*) pour le peuple injuste (*aẓ-ẓālimīn*) !
- ref: S.23:42
  ar: ثُمَّ أَنْشَأْنَا مِنْ بَعْدِهِمْ قُرُونًا آخَرِينَ
  trl: Thumma anshaʾnā min baʿdihim qurūnan ākharīn
  trad: 'Puis Nous avons fait naître, après elles, d''autres générations (*qurūn*).'
- ref: S.23:43
  ar: مَا تَسْبِقُ مِنْ أُمَّةٍ أَجَلَهَا وَمَا يَسْتَأْخِرُونَ
  trl: Mā tasbiqu min ummatin ajalahā wa-mā yastaʾkhirūn
  trad: Nulle communauté (*umma*) ne devance son terme (*ajal*), ni ne le retarde.
- ref: S.23:44
  ar: ثُمَّ أَرْسَلْنَا رُسُلَنَا تَتْرَىٰ ۖ كُلَّ مَا جَاءَ أُمَّةً رَسُولُهَا كَذَّبُوهُ ۚ فَأَتْبَعْنَا بَعْضَهُمْ بَعْضًا وَجَعَلْنَاهُمْ أَحَادِيثَ ۚ فَبُعْدًا لِقَوْمٍ لَا يُؤْمِنُونَ
  trl: Thumma arsalnā rusulanā tatrā kulla mā jāʾa ummatan rasūluhā kadhdhabūhu fa-atbaʿnā baʿḍahum baʿḍan wa-jaʿalnāhum aḥādītha fa-buʿdan li-qawmin lā yuʾminūn
  trad: 'Puis Nous avons envoyé Nos *rusul* les uns après les autres (*tatrā*) : chaque fois qu''un *rasūl* venait à une communauté, elle le traitait de menteur — alors Nous les avons fait se succéder (*atbaʿnā*) les uns aux autres, et Nous les avons réduits à n''être que des récits (*aḥādīth*) — éloignement donc pour un peuple qui ne croit pas !'
- ref: S.23:45–46
  ar: ثُمَّ أَرْسَلْنَا مُوسَىٰ وَأَخَاهُ هَارُونَ بِآيَاتِنَا وَسُلْطَانٍ مُبِينٍ إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا عَالِينَ
  trl: Thumma arsalnā mūsā wa-akhāhu hārūna bi-āyātinā wa-sulṭānin mubīnin ilā firʿawna wa-malaʾihi fa-stakbarū wa-kānū qawman ʿālīn
  trad: 'Puis Nous avons envoyé Mūsā et son frère Hārūn, avec Nos *āyāt* et une autorité manifeste (*sulṭānin mubīn*), vers Firʿawn et son assemblée (*malaʾ*) — ils s''enorgueillirent (*istakbarū*) et furent un peuple dominateur (*ʿālīn*).'
- ref: S.23:47
  ar: فَقَالُوا أَنُؤْمِنُ لِبَشَرَيْنِ مِثْلِنَا وَقَوْمُهُمَا لَنَا عَابِدُونَ
  trl: Fa-qālū a-nuʾminu li-basharayni mithlinā wa-qawmuhumā lanā ʿābidūn
  trad: 'Ils dirent : « Croirons-nous en deux êtres humains semblables à nous, alors que leur peuple est à notre service (*ʿābidūn*) ? »'
- ref: S.23:48
  ar: فَكَذَّبُوهُمَا فَكَانُوا مِنَ الْمُهْلَكِينَ
  trl: Fa-kadhdhabūhumā fa-kānū mina l-muhlakīn
  trad: Ils les traitèrent de menteurs, tous deux, et ils furent alors du nombre de ceux qui furent anéantis (*al-muhlakīn*).
- ref: S.23:49
  ar: وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ لَعَلَّهُمْ يَهْتَدُونَ
  trl: Wa-la-qad ātaynā mūsā l-kitāba laʿallahum yahtadūn
  trad: 'Et Nous avons certes donné à Mūsā le *Kitāb*, afin qu''ils soient guidés (*yahtadūn*).'
- ref: S.23:50
  ar: وَجَعَلْنَا ابْنَ مَرْيَمَ وَأُمَّهُ آيَةً وَآوَيْنَاهُمَا إِلَىٰ رَبْوَةٍ ذَاتِ قَرَارٍ وَمَعِينٍ
  trl: Wa-jaʿalnā bna maryama wa-ummahu āyatan wa-āwaynāhumā ilā rabwatin dhāti qarārin wa-maʿīn
  trad: 'Et Nous avons fait du fils de Maryam et de sa mère un signe (*āya*) — et Nous les avons abrités tous deux (*āwaynāhumā*) vers une hauteur (*rabwa*) dotée de stabilité (*qarār*) et d''une eau courante (*maʿīn*).'
- ref: S.23:51
  ar: يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا ۖ إِنِّي بِمَا تَعْمَلُونَ عَلِيمٌ
  trl: Yā ayyuhā r-rusulu kulū mina ṭ-ṭayyibāti wa-ʿmalū ṣāliḥan innī bimā taʿmalūna ʿalīm
  trad: 'Ô vous, les *rusul* : mangez des *ṭayyibāt*, et agissez droitement (*ṣāliḥan*) — Je suis, de ce que vous faites, parfaitement informé (*ʿalīm*).'
- ref: S.23:52
  ar: وَإِنَّ هَٰذِهِ أُمَّتُكُمْ أُمَّةً وَاحِدَةً وَأَنَا رَبُّكُمْ فَاتَّقُونِ
  trl: Wa-inna hādhihi ummatukum ummatan wāḥidatan wa-anā rabbukum fa-ttaqūn
  trad: 'Et ceci est votre *umma* (*ummatukum*), une *umma* unique (*ummatan wāḥidatan*) — et Je suis votre Rabb : prémunissez-vous donc envers Moi (*fa-ttaqūn*).'
- ref: S.23:53
  ar: فَتَقَطَّعُوا أَمْرَهُمْ بَيْنَهُمْ زُبُرًا ۖ كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ
  trl: Fa-taqaṭṭaʿū amrahum baynahum zuburan kullu ḥizbin bimā ladayhim fariḥūn
  trad: 'Mais ils se sont fragmentés (*taqaṭṭaʿū*), quant à leur affaire, entre eux, en factions (*zuburan*) — chaque parti (*ḥizb*), de ce qu''il détient, est satisfait (*fariḥūn*).'
- ref: S.23:54
  ar: فَذَرْهُمْ فِي غَمْرَتِهِمْ حَتَّىٰ حِينٍ
  trl: Fa-dharhum fī ghamratihim ḥattā ḥīn
  trad: 'Laisse-les donc (*fa-dharhum*) dans leur *ghamra*, jusqu''à un temps (*ḥattā ḥīn*).'
- ref: S.23:55–56
  ar: أَيَحْسَبُونَ أَنَّمَا نُمِدُّهُمْ بِهِ مِنْ مَالٍ وَبَنِينَ نُسَارِعُ لَهُمْ فِي الْخَيْرَاتِ ۚ بَلْ لَا يَشْعُرُونَ
  trl: A-yaḥsabūna annamā numidduhum bihī min mālin wa-banīna nusāriʿu lahum fi l-khayrāti bal lā yashʿurūn
  trad: Pensent-ils que ce par quoi Nous les prolongeons (*numidduhum*), en biens et en fils, [signifierait que] Nous nous empressons vers eux dans les bonnes choses (*al-khayrāt*) ? Non — ils ne perçoivent pas (*lā yashʿurūn*).
- ref: S.23:57
  ar: إِنَّ الَّذِينَ هُمْ مِنْ خَشْيَةِ رَبِّهِمْ مُشْفِقُونَ
  trl: Inna lladhīna hum min khashyati rabbihim mushfiqūn
  trad: 'Ceux qui, de la *khashya* envers leur Rabb, sont saisis d''appréhension (*mushfiqūn*)…'
- ref: S.23:58
  ar: وَالَّذِينَ هُمْ بِآيَاتِ رَبِّهِمْ يُؤْمِنُونَ
  trl: Wa-lladhīna hum bi-āyāti rabbihim yuʾminūn
  trad: …et ceux qui, aux *āyāt* de leur Rabb, croient…
- ref: S.23:59
  ar: وَالَّذِينَ هُمْ بِرَبِّهِمْ لَا يُشْرِكُونَ
  trl: Wa-lladhīna hum bi-rabbihim lā yushrikūn
  trad: '…et ceux qui, à leur Rabb, n''associent rien (*lā yushrikūna*)…'
- ref: S.23:60
  ar: وَالَّذِينَ يُؤْتُونَ مَا آتَوْا وَقُلُوبُهُمْ وَجِلَةٌ أَنَّهُمْ إِلَىٰ رَبِّهِمْ رَاجِعُونَ
  trl: Wa-lladhīna yuʾtūna mā ātaw wa-qulūbuhum wajilatun annahum ilā rabbihim rājiʿūn
  trad: '…et ceux qui donnent ce qu''ils donnent (*mā ātaw*), le cœur saisi d''appréhension (*wajilatun*) à l''idée que c''est vers leur Rabb qu''ils retournent (*rājiʿūn*)…'
- ref: S.23:61
  ar: أُولَٰئِكَ يُسَارِعُونَ فِي الْخَيْرَاتِ وَهُمْ لَهَا سَابِقُونَ
  trl: Ulāʾika yusāriʿūna fi l-khayrāti wa-hum lahā sābiqūn
  trad: Ceux-là se hâtent (*yusāriʿūna*) dans les bonnes choses (*al-khayrāt*) — et ils sont, vers elles, ceux qui devancent (*sābiqūn*).
- ref: S.23:62
  ar: وَلَا نُكَلِّفُ نَفْسًا إِلَّا وُسْعَهَا ۖ وَلَدَيْنَا كِتَابٌ يَنْطِقُ بِالْحَقِّ ۚ وَهُمْ لَا يُظْلَمُونَ
  trl: Wa-lā nukallifu nafsan illā wusʿahā wa-ladaynā kitābun yanṭiqu bi-l-ḥaqqi wa-hum lā yuẓlamūn
  trad: Et Nous ne chargeons aucune *nafs* au-delà de sa capacité (*wusʿahā*) — et Nous avons, auprès de Nous, un *Kitāb* qui énonce le *ḥaqq* (*yanṭiqu bi-l-ḥaqq*) — et ils ne sont pas lésés (*lā yuẓlamūn*).
- ref: S.23:63
  ar: بَلْ قُلُوبُهُمْ فِي غَمْرَةٍ مِنْ هَٰذَا وَلَهُمْ أَعْمَالٌ مِنْ دُونِ ذَٰلِكَ هُمْ لَهَا عَامِلُونَ
  trl: Bal qulūbuhum fī ghamratin min hādhā wa-lahum aʿmālun min dūni dhālika hum lahā ʿāmilūn
  trad: 'Mais leurs cœurs sont dans une *ghamra* à l''égard de ceci (*hādhā*) — et ils ont des actes, en dehors de cela, qu''ils ne cessent d''accomplir (*ʿāmilūn*).'
- ref: S.23:64
  ar: حَتَّىٰ إِذَا أَخَذْنَا مُتْرَفِيهِمْ بِالْعَذَابِ إِذَا هُمْ يَجْأَرُونَ
  trl: Ḥattā idhā akhadhnā mutrafīhim bi-l-ʿadhābi idhā hum yajʾarūn
  trad: '…jusqu''à ce que, quand Nous saisissons leurs *mutrafūn* (gens dans l''aisance) par le châtiment — les voilà qui crient (*yajʾarūn*).'
- ref: S.23:65
  ar: لَا تَجْأَرُوا الْيَوْمَ ۖ إِنَّكُمْ مِنَّا لَا تُنْصَرُونَ
  trl: Lā tajʾarū l-yawma innakum minnā lā tunṣarūn
  trad: '« Ne criez pas (*lā tajʾarū*) aujourd''hui : vous ne serez, de Notre part, pas secourus (*lā tunṣarūn*). »'
- ref: S.23:66–67
  ar: قَدْ كَانَتْ آيَاتِي تُتْلَىٰ عَلَيْكُمْ فَكُنْتُمْ عَلَىٰ أَعْقَابِكُمْ تَنْكِصُونَ مُسْتَكْبِرِينَ بِهِ سَامِرًا تَهْجُرُونَ
  trl: Qad kānat āyātī tutlā ʿalaykum fa-kuntum ʿalā aʿqābikum tankiṣūn mustakbirīna bihi sāmiran tahjurūn
  trad: '« Mes *āyāt* vous étaient certes récitées, mais vous reveniez sur vos talons (*tankiṣūn*), vous enflant d''orgueil (*mustakbirīn*) à leur sujet, tenant à leur propos, en veillées nocturnes (*sāmiran*), des propos insensés (*tahjurūn*). »'
- ref: S.23:68
  ar: أَفَلَمْ يَدَّبَّرُوا الْقَوْلَ أَمْ جَاءَهُمْ مَا لَمْ يَأْتِ آبَاءَهُمُ الْأَوَّلِينَ
  trl: A-fa-lam yaddabbarū l-qawla am jāʾahum mā lam yaʾti ābāʾahumu l-awwalīn
  trad: 'N''ont-ils donc pas médité (*yaddabbarū*) la Parole (*al-qawl*) ? Ou bien leur est-il venu ce qui n''est pas venu à leurs premiers pères (*ābāʾahumu l-awwalīn*) ?'
- ref: S.23:69
  ar: أَمْ لَمْ يَعْرِفُوا رَسُولَهُمْ فَهُمْ لَهُ مُنْكِرُونَ
  trl: Am lam yaʿrifū rasūlahum fa-hum lahu munkirūn
  trad: 'Ou bien n''ont-ils pas reconnu (*yaʿrifū*) leur *rasūl*, de sorte qu''ils le renient (*munkirūn*) ?'
- ref: S.23:70
  ar: أَمْ يَقُولُونَ بِهِ جِنَّةٌ ۚ بَلْ جَاءَهُمْ بِالْحَقِّ وَأَكْثَرُهُمْ لِلْحَقِّ كَارِهُونَ
  trl: Am yaqūlūna bihi jinnatun bal jāʾahum bi-l-ḥaqqi wa-aktharuhum li-l-ḥaqqi kārihūn
  trad: 'Ou bien disent-ils qu''il est atteint de *jinna* ? Non — il leur est venu avec le *ḥaqq*, mais la plupart d''entre eux, pour le *ḥaqq*, sont aversifs (*kārihūn*).'
- ref: S.23:71
  ar: وَلَوِ اتَّبَعَ الْحَقُّ أَهْوَاءَهُمْ لَفَسَدَتِ السَّمَاوَاتُ وَالْأَرْضُ وَمَنْ فِيهِنَّ ۚ بَلْ أَتَيْنَاهُمْ بِذِكْرِهِمْ فَهُمْ عَنْ ذِكْرِهِمْ مُعْرِضُونَ
  trl: Wa-lawi ttabaʿa l-ḥaqqu ahwāʾahum la-fasadati s-samāwātu wa-l-arḍu wa-man fīhinna bal ataynāhum bi-dhikrihim fa-hum ʿan dhikrihim muʿriḍūn
  trad: 'Et si le *ḥaqq* avait suivi leurs désirs (*ahwāʾahum*), les cieux, la terre et quiconque s''y trouve se seraient corrompus (*fasadat*) — Nous leur avons plutôt apporté leur *dhikr*, mais eux, de leur *dhikr*, se détournent (*muʿriḍūn*).'
- ref: S.23:72
  ar: أَمْ تَسْأَلُهُمْ خَرْجًا فَخَرَاجُ رَبِّكَ خَيْرٌ ۖ وَهُوَ خَيْرُ الرَّازِقِينَ
  trl: Am tasʾaluhum kharjan fa-kharāju rabbika khayrun wa-huwa khayru r-rāziqīn
  trad: Ou bien leur demandes-tu un tribut (*kharjan*) ? Le tribut de ton Rabb est meilleur — et Il est le meilleur des pourvoyeurs (*khayru r-rāziqīn*).
- ref: S.23:73
  ar: وَإِنَّكَ لَتَدْعُوهُمْ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Wa-innaka la-tadʿūhum ilā ṣirāṭin mustaqīm
  trad: Et toi, tu les appelles certes vers un *ṣirāṭ* droit (*mustaqīm*).
- ref: S.23:74
  ar: وَإِنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ عَنِ الصِّرَاطِ لَنَاكِبُونَ
  trl: Wa-inna lladhīna lā yuʾminūna bi-l-ākhirati ʿani ṣ-ṣirāṭi la-nākibūn
  trad: 'Et ceux qui ne croient pas en l''Ākhira, du *ṣirāṭ*, sont certes déviants (*nākibūn*).'
- ref: S.23:75
  ar: ۞ وَلَوْ رَحِمْنَاهُمْ وَكَشَفْنَا مَا بِهِمْ مِنْ ضُرٍّ لَلَجُّوا فِي طُغْيَانِهِمْ يَعْمَهُونَ
  trl: Wa-law raḥimnāhum wa-kashafnā mā bihim min ḍurrin la-lajjū fī ṭughyānihim yaʿmahūn
  trad: Et si Nous leur avions fait miséricorde (*raḥimnāhum*) et avions levé (*kashafnā*) ce qui, chez eux, est détresse (*ḍurr*), ils persisteraient certes (*la-lajjū*) dans leur *ṭughyān*, errant sans repère (*yaʿmahūn*).
- ref: S.23:76
  ar: وَلَقَدْ أَخَذْنَاهُمْ بِالْعَذَابِ فَمَا اسْتَكَانُوا لِرَبِّهِمْ وَمَا يَتَضَرَّعُونَ
  trl: Wa-la-qad akhadhnāhum bi-l-ʿadhābi fa-mā stakānū li-rabbihim wa-mā yataḍarraʿūn
  trad: 'Et Nous les avons certes saisis par le châtiment — mais ils ne se sont pas humiliés (*istakānū*) envers leur Rabb, et ils n''ont pas imploré (*yataḍarraʿūn*).'
- ref: S.23:77
  ar: حَتَّىٰ إِذَا فَتَحْنَا عَلَيْهِمْ بَابًا ذَا عَذَابٍ شَدِيدٍ إِذَا هُمْ فِيهِ مُبْلِسُونَ
  trl: Ḥattā idhā fataḥnā ʿalayhim bāban dhā ʿadhābin shadīdin idhā hum fīhi mublisūn
  trad: '…jusqu''à ce que, quand Nous ouvrons sur eux une porte à châtiment sévère (*bāban dhā ʿadhābin shadīd*) — les voilà, en elle, plongés dans le désespoir (*mublisūn*).'
- ref: S.23:78
  ar: وَهُوَ الَّذِي أَنْشَأَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۚ قَلِيلًا مَا تَشْكُرُونَ
  trl: Wa-huwa lladhī anshaʾa lakumu s-samʿa wa-l-abṣāra wa-l-afʾidata qalīlan mā tashkurūn
  trad: 'Et Il est Ce qui a fait naître (anshaʾa) pour vous l''ouïe (as-samʿ), les regards (al-abṣār) et les afʾida — combien peu vous êtes reconnaissants (qalīlan mā tashkurūn) !'
- ref: S.23:79
  ar: وَهُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ
  trl: Wa-huwa lladhī dharaʾakum fi l-arḍi wa-ilayhi tuḥsharūn
  trad: 'Et Il est Ce qui vous a répandus (dharaʾakum) sur la terre — et c''est vers Lui que vous serez rassemblés (tuḥsharūn).'
- ref: S.23:80
  ar: وَهُوَ الَّذِي يُحْيِي وَيُمِيتُ وَلَهُ اخْتِلَافُ اللَّيْلِ وَالنَّهَارِ ۚ أَفَلَا تَعْقِلُونَ
  trl: Wa-huwa lladhī yuḥyī wa-yumītu wa-lahu khtilāfu l-layli wa-n-nahāri a-fa-lā taʿqilūn
  trad: 'Et Il est Ce qui fait vivre et fait mourir, et à Lui appartient l''alternance de la nuit et du jour (ikhtilāf al-layl wa-n-nahār) — ne raisonnez-vous donc pas (a-fa-lā taʿqilūn) ?'
- ref: S.23:81
  ar: بَلْ قَالُوا مِثْلَ مَا قَالَ الْأَوَّلُونَ
  trl: Bal qālū mithla mā qāla l-awwalūn
  trad: 'Mais ils dirent la pareille (mithla) de ce qu''avaient dit les premiers (al-awwalūn).'
- ref: S.23:82
  ar: قَالُوا أَإِذَا مِتْنَا وَكُنَّا تُرَابًا وَعِظَامًا أَإِنَّا لَمَبْعُوثُونَ
  trl: Qālū a-idhā mitnā wa-kunnā turāban wa-ʿiẓāman a-innā la-mabʿūthūn
  trad: 'Ils dirent : « Quand nous serons morts, et que nous serons poussière (turāb) et ossements (ʿiẓām), serons-nous vraiment ressuscités (la-mabʿūthūn) ? »'
- ref: S.23:83
  ar: لَقَدْ وُعِدْنَا نَحْنُ وَآبَاؤُنَا هَٰذَا مِنْ قَبْلُ إِنْ هَٰذَا إِلَّا أَسَاطِيرُ الْأَوَّلِينَ
  trl: La-qad wuʿidnā naḥnu wa-ābāʾunā hādhā min qablu in hādhā illā asāṭīru l-awwalīn
  trad: 'Cela nous a certes déjà été promis, à nous et à nos pères, auparavant — ce n''est rien d''autre que des légendes des anciens (asāṭīru l-awwalīn).'
- ref: S.23:84–85
  ar: قُلْ لِمَنِ الْأَرْضُ وَمَنْ فِيهَا إِنْ كُنْتُمْ تَعْلَمُونَ ۝ سَيَقُولُونَ لِلَّهِ ۚ قُلْ أَفَلَا تَذَكَّرُونَ
  trl: Qul limani l-arḍu wa-man fīhā in kuntum taʿlamūn — sa-yaqūlūna lillāhi qul a-fa-lā tadhakkarūn
  trad: 'Dis : « À qui appartient la terre, et quiconque s''y trouve, si vous savez ? » Ils diront : « À Allaah. » Dis : « Ne vous rappelez-vous donc pas (a-fa-lā tadhakkarūn) ? »'
- ref: S.23:86–87
  ar: قُلْ مَنْ رَبُّ السَّمَاوَاتِ السَّبْعِ وَرَبُّ الْعَرْشِ الْعَظِيمِ ۝ سَيَقُولُونَ لِلَّهِ ۚ قُلْ أَفَلَا تَتَّقُونَ
  trl: Qul man rabbu s-samāwāti s-sabʿi wa-rabbu l-ʿarshi l-ʿaẕīmi — sa-yaqūlūna lillāhi qul a-fa-lā tattaqūn
  trad: 'Dis : « Qui est le Rabb des sept cieux, et le Rabb du ʿArsh immense ? » Ils diront : « À Allaah. » Dis : « Ne vous prémunissez-vous donc pas (a-fa-lā tattaqūn) ? »'
- ref: S.23:88–89
  ar: قُلْ مَنْ بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَهُوَ يُجِيرُ وَلَا يُجَارُ عَلَيْهِ إِنْ كُنْتُمْ تَعْلَمُونَ ۝ سَيَقُولُونَ لِلَّهِ ۚ قُلْ فَأَنَّىٰ تُسْحَرُونَ
  trl: Qul man bi-yadihi malakūtu kulli shayʾin wa-huwa yujīru wa-lā yujāru ʿalayhi in kuntum taʿlamūn — sa-yaqūlūna lillāhi qul fa-annā tusḥarūn
  trad: 'Dis : « Qui détient dans Sa main le malakūt de toute chose, et qui accorde protection (yujīru) sans que nul ne puisse être protégé contre Lui (lā yujāru ʿalayhi), si vous savez ? » Ils diront : « À Allaah. » Dis : « Comment donc êtes-vous ensorcelés (fa-annā tusḥarūn) ? »'
- ref: S.23:90
  ar: بَلْ أَتَيْنَاهُمْ بِالْحَقِّ وَإِنَّهُمْ لَكَاذِبُونَ
  trl: Bal ataynāhum bi-l-ḥaqqi wa-innahum la-kādhibūn
  trad: Non — Nous leur avons apporté le ḥaqq, et ils sont certes menteurs (la-kādhibūn).
- ref: S.23:91
  ar: مَا اتَّخَذَ اللَّهُ مِنْ وَلَدٍ وَمَا كَانَ مَعَهُ مِنْ إِلَٰهٍ ۚ إِذًا لَذَهَبَ كُلُّ إِلَٰهٍ بِمَا خَلَقَ وَلَعَلَا بَعْضُهُمْ عَلَىٰ بَعْضٍ ۚ سُبْحَانَ اللَّهِ عَمَّا يَصِفُونَ
  trl: Mā ttakhadha llāhu min waladin wa-mā kāna maʿahu min ilāhin idhan la-dhahaba kullu ilāhin bimā khalaqa wa-la-ʿalā baʿḍuhum ʿalā baʿḍin subḥāna llāhi ʿammā yaṣifūn
  trad: 'Allaah n''a pris aucun walad, et il n''y eut avec Lui aucun ilāh — car alors, chaque ilāh serait parti avec ce qu''il aurait créé, et certains d''entre eux auraient dominé les autres. Il est dégagé de toute imperfection (subḥāna llāh), au-delà de ce qu''ils décrivent (yaṣifūn).'
- ref: S.23:92
  ar: عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَتَعَالَىٰ عَمَّا يُشْرِكُونَ
  trl: ʿĀlimi l-ghaybi wa-sh-shahādati fa-taʿālā ʿammā yushrikūn
  trad: 'Ce qui connaît le ghayb et le témoigné (ash-shahāda) — Il transcende (taʿālā) ce qu''ils Lui associent.'
- ref: S.23:93–94
  ar: قُلْ رَبِّ إِمَّا تُرِيَنِّي مَا يُوعَدُونَ ۝ رَبِّ فَلَا تَجْعَلْنِي فِي الْقَوْمِ الظَّالِمِينَ
  trl: Qul rabbi immā turiyannī mā yūʿadūna — rabbi fa-lā tajʿalnī fi l-qawmi ẕ-ẕālimīn
  trad: 'Dis : « Mon Rabb, si Tu dois me faire voir ce qui leur est promis (mā yūʿadūn) — mon Rabb, alors ne me place pas parmi le peuple des injustes (aẕ-ẕālimīn). »'
- ref: S.23:95
  ar: وَإِنَّا عَلَىٰ أَنْ نُرِيَكَ مَا نَعِدُهُمْ لَقَادِرُونَ
  trl: Wa-innā ʿalā an nuriyaka mā naʿiduhum la-qādirūn
  trad: Et Nous sommes certes capables (la-qādirūn) de te faire voir ce que Nous leur promettons.
- ref: S.23:96
  ar: ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ السَّيِّئَةَ ۚ نَحْنُ أَعْلَمُ بِمَا يَصِفُونَ
  trl: Idfaʿ bi-llatī hiya aḥsanu s-sayyiʾata naḥnu aʿlamu bimā yaṣifūn
  trad: 'Repousse (idfaʿ) par ce qui est le meilleur (allatī hiya aḥsan) le mal (as-sayyiʾa) — Nous savons mieux ce qu''ils décrivent (yaṣifūn).'
- ref: S.23:97–98
  ar: وَقُلْ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ
  trl: Wa-qul rabbi aʿūdhu bika min hamazāti sh-shayāṭīni — wa-aʿūdhu bika rabbi an yaḥḍurūn
  trad: 'Et dis : « Mon Rabb, je cherche refuge (aʿūdhu) en Toi contre les hamazāt des shayāṭīn — et je cherche refuge en Toi, Rabb, contre le fait qu''ils soient présents auprès de moi (an yaḥḍurūn). »'
- ref: S.23:99–100
  ar: حَتَّىٰ إِذَا جَاءَ أَحَدَهُمُ الْمَوْتُ قَالَ رَبِّ ارْجِعُونِ ۝ لَعَلِّي أَعْمَلُ صَالِحًا فِيمَا تَرَكْتُ ۚ كَلَّا ۚ إِنَّهَا كَلِمَةٌ هُوَ قَائِلُهَا ۖ وَمِنْ وَرَائِهِمْ بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ
  trl: Ḥattā idhā jāʾa aḥadahumu l-mawtu qāla rabbi rjiʿūni — laʿallī aʿmalu ṣāliḥan fīmā taraktu kallā innahā kalimatun huwa qāʾiluhā wa-min warāʾihim barzakhun ilā yawmi yubʿathūn
  trad: '…jusqu''à ce que, quand la mort vient à l''un d''eux, il dise : « Mon Rabb, faites-moi revenir (arjiʿūni) ! Peut-être accomplirai-je ce qui est droit (ṣāliḥan) dans ce que j''ai laissé. » — Non (kallā). Ce n''est qu''une parole qu''il profère lui-même (huwa qāʾiluhā) — et derrière eux, un barzakh, jusqu''au jour où ils seront ressuscités (ilā yawmi yubʿathūn).'
- ref: S.23:101
  ar: فَإِذَا نُفِخَ فِي الصُّورِ فَلَا أَنْسَابَ بَيْنَهُمْ يَوْمَئِذٍ وَلَا يَتَسَاءَلُونَ
  trl: Fa-idhā nufikha fi ṣ-ṣūri fa-lā ansāba baynahum yawmaʾidhin wa-lā yatasāʾalūn
  trad: 'Alors, quand il sera soufflé dans le Ṣūr — il n''y aura plus, entre eux, ce jour-là (yawmaʾidhin), aucun lien de parenté (ansāb), et ils ne s''interrogeront pas les uns les autres (lā yatasāʾalūn).'
- ref: S.23:102–103
  ar: فَمَنْ ثَقُلَتْ مَوَازِينُهُ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ ۝ وَمَنْ خَفَّتْ مَوَازِينُهُ فَأُولَٰئِكَ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ فِي جَهَنَّمَ خَالِدُونَ
  trl: Fa-man thaqulat mawāzīnuhu fa-ulāʾika humu l-mufliḥūn — wa-man khaffat mawāzīnuhu fa-ulāʾika lladhīna khasirū anfusahum fī jahannama khālidūn
  trad: Quiconque a ses balances (mawāzīn) lourdes (thaqulat) — ceux-là sont eux-mêmes les mufliḥūn (ceux qui ont atteint le falāḥ). Et quiconque a ses balances légères (khaffat) — ceux-là sont ceux qui se sont perdus eux-mêmes (khasirū anfusahum), demeurant (khālidūn) dans Jahannam.
- ref: S.23:104–105
  ar: تَلْفَحُ وُجُوهَهُمُ النَّارُ وَهُمْ فِيهَا كَالِحُونَ ۝ أَلَمْ تَكُنْ آيَاتِي تُتْلَىٰ عَلَيْكُمْ فَكُنْتُمْ بِهَا تُكَذِّبُونَ
  trl: Talfaḥu wujūhahumu n-nāru wa-hum fīhā kāliḥūn — a-lam takun āyātī tutlā ʿalaykum fa-kuntum bihā tukadhdhibūn
  trad: Le Feu scorche (talfaḥu) leurs visages, et ils sont, en lui, les lèvres crispées et rétractées (kāliḥūn). « Mes āyāt ne vous étaient-elles pas récitées, et vous les traitiez de mensonge (tukadhdhibūn) ? »
- ref: S.23:106–107
  ar: قَالُوا رَبَّنَا غَلَبَتْ عَلَيْنَا شِقْوَتُنَا وَكُنَّا قَوْمًا ضَالِّينَ ۝ رَبَّنَا أَخْرِجْنَا مِنْهَا فَإِنْ عُدْنَا فَإِنَّا ظَالِمُونَ
  trl: Qālū rabbanā ghalabat ʿalaynā shiqwatunā wa-kunnā qawman ḍāllīn — rabbanā akhrijnā minhā fa-in ʿudnā fa-innā ẕālimūn
  trad: 'Ils dirent : « Notre Rabb, notre shiqwa nous a dominés (ghalabat ʿalaynā), et nous étions un peuple égaré (ḍāllīn). Notre Rabb, fais-nous sortir de là (akhrijnā minhā) — si nous y retournons, alors nous serons certes injustes (ẕālimūn). »'
- ref: S.23:108
  ar: قَالَ اخْسَئُوا فِيهَا وَلَا تُكَلِّمُونِ
  trl: Qāla khsaʾū fīhā wa-lā tukallimūn
  trad: 'Il fut répondu : « Demeurez-y, abaissés (ikhsaʾū), et ne Me parlez plus (lā tukallimūni). »'
- ref: S.23:109–111
  ar: إِنَّهُ كَانَ فَرِيقٌ مِنْ عِبَادِي يَقُولُونَ رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الرَّاحِمِينَ ۝ فَاتَّخَذْتُمُوهُمْ سِخْرِيًّا حَتَّىٰ أَنْسَوْكُمْ ذِكْرِي وَكُنْتُمْ مِنْهُمْ تَضْحَكُونَ ۝ إِنِّي جَزَيْتُهُمُ الْيَوْمَ بِمَا صَبَرُوا أَنَّهُمْ هُمُ الْفَائِزُونَ
  trl: Innahu kāna farīqun min ʿibādī yaqūlūna rabbanā āmannā fa-ghfir lanā wa-rḥamnā wa-anta khayru r-rāḥimīn — fa-ttakhadhtumūhum sikhriyyan ḥattā ansawkum dhikrī wa-kuntum minhum taḍḥakūn — innī jazaytuhumu l-yawma bimā ṣabarū annahum humu l-fāʾizūn
  trad: 'Il y eut certes, parmi Mes ʿibād, un groupe (farīq) qui disait : « Notre Rabb, nous avons cru (āmannā) — pardonne-nous et fais-nous miséricorde — Tu es le meilleur de ceux qui font miséricorde (khayru r-rāḥimīn) ! » Mais vous les avez pris en moquerie (sikhriyyan), jusqu''à ce qu''ils vous aient fait oublier (ansawkum) Mon dhikr, et vous vous moquiez (taḍḥakūn) d''eux. Je les ai certes récompensés (jazaytuhumu), aujourd''hui, pour ce qu''ils ont enduré avec patience (ṣabarū) : ce sont eux, les triomphants (al-fāʾizūn).'
- ref: S.23:112–114
  ar: قَالَ كَمْ لَبِثْتُمْ فِي الْأَرْضِ عَدَدَ سِنِينَ ۝ قَالُوا لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍ فَاسْأَلِ الْعَادِّينَ ۝ قَالَ إِنْ لَبِثْتُمْ إِلَّا قَلِيلًا ۖ لَوْ أَنَّكُمْ كُنْتُمْ تَعْلَمُونَ
  trl: Qāla kam labithtum fi l-arḍi ʿadada sinīn — qālū labithnā yawman aw baʿḍa yawmin fa-sʾali l-ʿāddīn — qāla in labithtum illā qalīlan law annakum kuntum taʿlamūn
  trad: 'Il dit : « Combien de temps avez-vous demeuré sur terre, en nombre d''années ? » Ils dirent : « Nous avons demeuré un jour, ou une partie d''un jour — interroge donc ceux qui comptent (al-ʿāddīn). » Il dit : « Vous n''avez demeuré que peu — si seulement vous saviez ! »'
- ref: S.23:115
  ar: أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ
  trl: A-fa-ḥasibtum annamā khalaqnākum ʿabathan wa-annakum ilaynā lā turjaʿūn
  trad: Avez-vous donc pensé (ḥasibtum) que Nous vous avions créés en pure futilité (ʿabathan), et que vous ne seriez pas ramenés (turjaʿūn) vers Nous ?
- ref: S.23:116
  ar: فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ ۖ لَا إِلَٰهَ إِلَّا هُوَ رَبُّ الْعَرْشِ الْكَرِيمِ
  trl: Fa-taʿālā llāhu l-maliku l-ḥaqqu lā ilāha illā huwa rabbu l-ʿarshi l-karīm
  trad: 'Il transcende (taʿālā) — Allaah, al-Malik, al-Ḥaqq. Nul ilāh que Lui, Rabb de l''ʿArsh, al-Karīm.'
- ref: S.23:117
  ar: وَمَنْ يَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ لَا بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِنْدَ رَبِّهِ ۚ إِنَّهُ لَا يُفْلِحُ الْكَافِرُونَ
  trl: Wa-man yadʿu maʿa llāhi ilāhan ākhara lā burhāna lahu bihi fa-innamā ḥisābuhu ʿinda rabbihi innahu lā yufliḥu l-kāfirūn
  trad: 'Et quiconque invoque, avec Allaah, un autre ilāh — sans avoir, pour cela, aucune preuve (burhān) — son compte (ḥisāb) n''est qu''auprès de son Rabb. Les kāfirūn, certes, ne réussissent pas (lā yufliḥu).'
- ref: S.23:118
  ar: وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ
  trl: Wa-qul rabbi ghfir wa-rḥam wa-anta khayru r-rāḥimīn
  trad: 'Et dis : « Mon Rabb, pardonne et fais miséricorde — Tu es le meilleur de ceux qui font miséricorde ! »'
