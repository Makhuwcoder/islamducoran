- ref: S.13:1
  ar: المر ۚ تِلْكَ آيَاتُ الْكِتَابِ ۗ وَالَّذِي أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ الْحَقُّ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يُؤْمِنُونَ
  trl: Alif · Lām · Mīm · Rāʾ — tilka āyātu l-kitābi wa-lladhī unzila ilayka min rabbika l-ḥaqqu wa-lākinna akthara n-nāsi lā yuʾminūn
  trad: Alif, Lām, Mīm, Rāʾ. Voilà les āyāt du Kitāb — et ce qui a été fait descendre vers toi de la part de ton Rabb est al-Ḥaqq ; mais la plupart des gens ne croient pas.
- ref: S.13:2
  ar: اللَّهُ الَّذِي رَفَعَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا ۖ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ ۖ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ ۖ كُلٌّ يَجْرِي لِأَجَلٍ مُسَمًّى ۚ يُدَبِّرُ الْأَمْرَ يُفَصِّلُ الْآيَاتِ لَعَلَّكُمْ بِلِقَاءِ رَبِّكُمْ تُوقِنُونَ
  trl: Allāhu lladhī rafaʿa s-samāwāti bi-ghayri ʿamadin tarawnahā thumma-stawā ʿalā l-ʿarshi wa-sakhkhara sh-shamsa wa-l-qamara kullun yajrī li-ajalin musamman yudabbiru l-amra yufaṣṣilu l-āyāti laʿallakum bi-liqāʾi rabbikum tūqinūn
  trad: Allaah est Ce qui a élevé les cieux sans piliers que vous puissiez voir — puis a pris pleinement possession (istawā) du ʿArsh — et a assujetti (sakhkhara) le soleil et la lune, chacun courant vers un terme fixé (li-ajalin musamman). Il administre l'affaire (yudabbiru l-amr), Il détaille (yufaṣṣilu) les āyāt, afin que vous soyez certains (tūqinūn) de la Rencontre de votre Rabb.
- ref: S.13:3
  ar: وَهُوَ الَّذِي مَدَّ الْأَرْضَ وَجَعَلَ فِيهَا رَوَاسِيَ وَأَنْهَارًا ۖ وَمِنْ كُلِّ الثَّمَرَاتِ جَعَلَ فِيهَا زَوْجَيْنِ اثْنَيْنِ ۖ يُغْشِي اللَّيْلَ النَّهَارَ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَتَفَكَّرُونَ
  trl: Wa-huwa lladhī madda l-arḍa wa-jaʿala fīhā rawāsiya wa-anhāran wa-min kulli th-thamarāti jaʿala fīhā zawjayni thnayni yughshi l-layla n-nahāra inna fī dhālika la-āyātin li-qawmin yatafakkarūn
  trad: Et Ce qui a étendu (madda) la terre, y a placé des ancrages fermes (rawāsiya) et des rivières, et de tous les fruits y a placé des couples de deux (zawjayni thnayni). Il enveloppe (yughshī) le jour de la nuit. Il y a certes en cela des āyāt pour un peuple qui réfléchit.
- ref: S.13:4
  ar: وَفِي الْأَرْضِ قِطَعٌ مُتَجَاوِرَاتٌ وَجَنَّاتٌ مِنْ أَعْنَابٍ وَزَرْعٌ وَنَخِيلٌ صِنْوَانٌ وَغَيْرُ صِنْوَانٍ يُسْقَىٰ بِمَاءٍ وَاحِدٍ وَنُفَضِّلُ بَعْضَهَا عَلَىٰ بَعْضٍ فِي الْأُكُلِ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَعْقِلُونَ
  trl: Wa-fi l-arḍi qiṭaʿun mutajāwirātun wa-jannātun min aʿnābin wa-zarʿun wa-nakhīlun ṣinwānun wa-ghayru ṣinwānin yusqā bi-māʾin wāḥidin wa-nufaḍḍilu baʿḍahā ʿalā baʿḍin fi l-akli inna fī dhālika la-āyātin li-qawmin yaʿqilūn
  trad: Et il y a, sur la terre, des parcelles voisines (qiṭaʿun mutajāwirāt), des jardins de vignes, des cultures et des palmiers issus d'une même souche (ṣinwān) ou séparés (ghayr ṣinwān), arrosés d'une seule et même eau — et Nous favorisons (nufaḍḍilu) les uns par rapport aux autres quant au goût (al-akl). Il y a certes en cela des āyāt pour un peuple qui raisonne.
- ref: S.13:5
  ar: ۞ وَإِنْ تَعْجَبْ فَعَجَبٌ قَوْلُهُمْ أَإِذَا كُنَّا تُرَابًا أَإِنَّا لَفِي خَلْقٍ جَدِيدٍ ۗ أُولَٰئِكَ الَّذِينَ كَفَرُوا بِرَبِّهِمْ ۖ وَأُولَٰئِكَ الْأَغْلَالُ فِي أَعْنَاقِهِمْ ۖ وَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Wa-in taʿjab fa-ʿajabun qawluhum a-idhā kunnā turāban a-innā la-fī khalqin jadīdin ulāʾika lladhīna kafarū bi-rabbihim wa-ulāʾika l-aghlālu fī aʿnāqihim wa-ulāʾika aṣḥābu n-nāri hum fīhā khālidūn
  trad: 'Et si tu t''étonnes, alors ce qui est étonnant, c''est bien leur propos : « Quand nous serons poussière, serons-nous vraiment dans une création nouvelle ? » Ceux-là sont ceux qui ont commis le kufr envers leur Rabb ; ceux-là ont les entraves (al-aghlāl) à leur cou ; ceux-là sont les compagnons du Feu, où ils demeurent (khālidūn).'
- ref: S.13:6
  ar: وَيَسْتَعْجِلُونَكَ بِالسَّيِّئَةِ قَبْلَ الْحَسَنَةِ وَقَدْ خَلَتْ مِنْ قَبْلِهِمُ الْمَثُلَاتُ ۗ وَإِنَّ رَبَّكَ لَذُو مَغْفِرَةٍ لِلنَّاسِ عَلَىٰ ظُلْمِهِمْ ۖ وَإِنَّ رَبَّكَ لَشَدِيدُ الْعِقَابِ
  trl: Wa-yastaʿjilūnaka bi-s-sayyiʾati qabla l-ḥasanati wa-qad khalat min qablihimu l-mathulātu wa-inna rabbaka la-dhū maghfiratin li-n-nāsi ʿalā ẓulmihim wa-inna rabbaka la-shadīdu l-ʿiqāb
  trad: Et ils te réclament de hâter (yastaʿjilūnaka) le mal (as-sayyiʾa) avant le bien (al-ḥasana), alors que les exemples de châtiment (al-mathulāt) sont déjà passés avant eux. Ton Rabb est certes détenteur d'un pardon (maghfira) pour les gens malgré leur ẓulm — et ton Rabb est certes sévère en rétribution (shadīdu l-ʿiqāb).
- ref: S.13:7
  ar: وَيَقُولُ الَّذِينَ كَفَرُوا لَوْلَا أُنْزِلَ عَلَيْهِ آيَةٌ مِنْ رَبِّهِ ۗ إِنَّمَا أَنْتَ مُنْذِرٌ ۖ وَلِكُلِّ قَوْمٍ هَادٍ
  trl: Wa-yaqūlu lladhīna kafarū lawlā unzila ʿalayhi āyatun min rabbihi innamā anta mundhirun wa-li-kulli qawmin hād
  trad: 'Et ceux qui sont kāfirūn disent : « Que n''a-t-on fait descendre sur lui un signe (āya) de son Rabb ! » Tu n''es qu''un avertisseur (mundhir) — et à chaque peuple, un guide (hād).'
- ref: S.13:8
  ar: اللَّهُ يَعْلَمُ مَا تَحْمِلُ كُلُّ أُنْثَىٰ وَمَا تَغِيضُ الْأَرْحَامُ وَمَا تَزْدَادُ ۖ وَكُلُّ شَيْءٍ عِنْدَهُ بِمِقْدَارٍ
  trl: Allāhu yaʿlamu mā taḥmilu kullu unthā wa-mā taghīḍu l-arḥāmu wa-mā tazdādu wa-kullu shayʾin ʿindahu bi-miqdār
  trad: Allaah sait ce que porte chaque femelle (unthā), ce que les matrices (al-arḥām) retranchent (taghīḍu) et ce qu'elles ajoutent (tazdādu) — et toute chose, auprès de Lui, est selon une mesure (bi-miqdār).
- ref: S.13:9
  ar: عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرُ الْمُتَعَالِ
  trl: ʿĀlimu l-ghaybi wa-sh-shahādati l-Kabīru l-Mutaʿāl
  trad: Ce qui connaît le ghayb et le témoignage [ce qui est manifeste] (ash-shahāda) — al-Kabīr, al-Mutaʿāl.
- ref: S.13:10
  ar: سَوَاءٌ مِنْكُمْ مَنْ أَسَرَّ الْقَوْلَ وَمَنْ جَهَرَ بِهِ وَمَنْ هُوَ مُسْتَخْفٍ بِاللَّيْلِ وَسَارِبٌ بِالنَّهَارِ
  trl: Sawāʾun minkum man asarra l-qawla wa-man jahara bihi wa-man huwa mustakhfin bi-l-layli wa-sāribun bi-n-nahār
  trad: Il est égal (sawāʾ), parmi vous, que l'un dissimule sa parole ou la déclare ouvertement (jahara bihi), et que l'un se cache (mustakhfin) dans la nuit ou s'avance à découvert (sāribun) de jour.
- ref: S.13:11
  ar: لَهُ مُعَقِّبَاتٌ مِنْ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ يَحْفَظُونَهُ مِنْ أَمْرِ اللَّهِ ۗ إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنْفُسِهِمْ ۗ وَإِذَا أَرَادَ اللَّهُ بِقَوْمٍ سُوءًا فَلَا مَرَدَّ لَهُ ۚ وَمَا لَهُمْ مِنْ دُونِهِ مِنْ وَالٍ
  trl: Lahu muʿaqqibātun min bayni yadayhi wa-min khalfihi yaḥfaẓūnahu min amri llāhi inna llāha lā yughayyiru mā bi-qawmin ḥattā yughayyirū mā bi-anfusihim wa-idhā arāda llāhu bi-qawmin sūʾan fa-lā maradda lahu wa-mā lahum min dūnihi min wāl
  trad: Chacun a des relayeurs (muʿaqqibāt) devant lui et derrière lui, qui le préservent selon l'ordre d'Allaah (min amri llāh). Allaah ne change rien de ce qui est chez un peuple jusqu'à ce qu'ils changent ce qui est en eux-mêmes (mā bi-anfusihim). Et quand Allaah veut du mal pour un peuple, nul ne peut le repousser (fa-lā maradda lahu) — et ils n'ont, en dehors de Lui, aucun protecteur (wāl).
- ref: S.13:12
  ar: هُوَ الَّذِي يُرِيكُمُ الْبَرْقَ خَوْفًا وَطَمَعًا وَيُنْشِئُ السَّحَابَ الثِّقَالَ
  trl: Huwa lladhī yurīkumu l-barqa khawfan wa-ṭamaʿan wa-yunshiʾu s-saḥāba th-thiqāl
  trad: Ce qui vous montre l'éclair (al-barq), suscitant crainte (khawf) et espoir (ṭamaʿ), et qui fait naître (yunshiʾu) les nuées lourdes (as-saḥāb ath-thiqāl).
- ref: S.13:13
  ar: وَيُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ وَيُرْسِلُ الصَّوَاعِقَ فَيُصِيبُ بِهَا مَنْ يَشَاءُ وَهُمْ يُجَادِلُونَ فِي اللَّهِ وَهُوَ شَدِيدُ الْمِحَالِ
  trl: Wa-yusabbiḥu r-raʿdu bi-ḥamdihi wa-l-malāʾikatu min khīfatihi wa-yursilu ṣ-ṣawāʿiqa fa-yuṣību bihā man yashāʾu wa-hum yujādilūna fi llāhi wa-huwa shadīdu l-miḥāl
  trad: Et le tonnerre (ar-raʿd) glorifie par Sa louange (bi-ḥamdihi), ainsi que les malāʾika, par crainte de Lui (min khīfatihi). Il envoie les foudres (aṣ-ṣawāʿiq) et en frappe qui Il veut, alors qu'eux disputent au sujet d'Allaah — et Il est ferme dans Sa manœuvre (shadīdu l-miḥāl).
- ref: S.13:14
  ar: لَهُ دَعْوَةُ الْحَقِّ ۖ وَالَّذِينَ يَدْعُونَ مِنْ دُونِهِ لَا يَسْتَجِيبُونَ لَهُمْ بِشَيْءٍ إِلَّا كَبَاسِطِ كَفَّيْهِ إِلَى الْمَاءِ لِيَبْلُغَ فَاهُ وَمَا هُوَ بِبَالِغِهِ ۚ وَمَا دُعَاءُ الْكَافِرِينَ إِلَّا فِي ضَلَالٍ
  trl: Lahu daʿwatu l-ḥaqqi wa-lladhīna yadʿūna min dūnihi lā yastajībūna lahum bi-shayʾin illā ka-bāsiṭi kaffayhi ilā l-māʾi li-yablugha fāhu wa-mā huwa bi-bālighihi wa-mā duʿāʾu l-kāfirīna illā fī ḍalāl
  trad: À Lui la véritable invocation (daʿwatu l-ḥaqq) — et ceux qu'ils invoquent en dehors de Lui ne leur répondent en rien, si ce n'est à la manière de celui qui tend ses deux paumes (bāsiṭu kaffayhi) vers l'eau pour qu'elle atteigne sa bouche, alors qu'elle ne l'atteindra jamais. Et l'invocation des kāfirūn n'est que dans l'égarement (ḍalāl).
- ref: S.13:15
  ar: وَلِلَّهِ يَسْجُدُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ طَوْعًا وَكَرْهًا وَظِلَالُهُمْ بِالْغُدُوِّ وَالْآصَالِ ۩
  trl: Wa-li-llāhi yasjudu man fi s-samāwāti wa-l-arḍi ṭawʿan wa-karhan wa-ẓilāluhum bi-l-ghuduwwi wa-l-āṣāl
  trad: Et c'est à Allaah que se prosterne (yasjudu) qui est dans les cieux et sur la terre, de gré ou de force (ṭawʿan wa-karhan), ainsi que leurs ombres (ẓilāl), au matin et au soir (bi-l-ghuduwwi wa-l-āṣāl).
- ref: S.13:16
  ar: قُلْ مَنْ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ قُلِ اللَّهُ ۚ قُلْ أَفَاتَّخَذْتُمْ مِنْ دُونِهِ أَوْلِيَاءَ لَا يَمْلِكُونَ لِأَنْفُسِهِمْ نَفْعًا وَلَا ضَرًّا ۚ قُلْ هَلْ يَسْتَوِي الْأَعْمَىٰ وَالْبَصِيرُ أَمْ هَلْ تَسْتَوِي الظُّلُمَاتُ وَالنُّورُ ۗ أَمْ جَعَلُوا لِلَّهِ شُرَكَاءَ خَلَقُوا كَخَلْقِهِ فَتَشَابَهَ الْخَلْقُ عَلَيْهِمْ ۚ قُلِ اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ الْوَاحِدُ الْقَهَّارُ
  trl: Qul man rabbu s-samāwāti wa-l-arḍi quli llāhu qul afa-ttakhadhtum min dūnihi awliyāʾa lā yamlikūna li-anfusihim nafʿan wa-lā ḍarran qul hal yastawi l-aʿmā wa-l-baṣīru am hal tastawi ẓ-ẓulumātu wa-n-nūru am jaʿalū li-llāhi shurakāʾa khalaqū ka-khalqihi fa-tashābaha l-khalqu ʿalayhim quli llāhu khāliqu kulli shayʾin wa-huwa l-Wāḥidu l-Qahhār
  trad: 'Dis : « Qui est le Rabb des cieux et de la terre ? » Dis : « Allaah. » Dis : « Avez-vous donc pris, en dehors de Lui, des awliyāʾ qui ne possèdent pour eux-mêmes ni profit (nafʿ) ni dommage (ḍarr) ? » Dis : « L''aveugle et le voyant sont-ils égaux (hal yastawī), ou les ténèbres (aẓ-ẓulumāt) et la lumière (an-nūr) sont-elles égales ? Ou ont-ils attribué à Allaah des associés (shurakāʾ) qui auraient créé comme Sa création, en sorte que la création leur serait apparue semblable (fa-tashābaha l-khalqu ʿalayhim) ? » Dis : « Allaah est le créateur (khāliq) de toute chose, et Il est al-Wāḥid, al-Qahhār. »'
- ref: S.13:17
  ar: أَنْزَلَ مِنَ السَّمَاءِ مَاءً فَسَالَتْ أَوْدِيَةٌ بِقَدَرِهَا فَاحْتَمَلَ السَّيْلُ زَبَدًا رَابِيًا ۚ وَمِمَّا يُوقِدُونَ عَلَيْهِ فِي النَّارِ ابْتِغَاءَ حِلْيَةٍ أَوْ مَتَاعٍ زَبَدٌ مِثْلُهُ ۚ كَذَٰلِكَ يَضْرِبُ اللَّهُ الْحَقَّ وَالْبَاطِلَ ۚ فَأَمَّا الزَّبَدُ فَيَذْهَبُ جُفَاءً ۖ وَأَمَّا مَا يَنْفَعُ النَّاسَ فَيَمْكُثُ فِي الْأَرْضِ ۚ كَذَٰلِكَ يَضْرِبُ اللَّهُ الْأَمْثَالَ
  trl: Anzala mina s-samāʾi māʾan fa-sālat awdiyatun bi-qadarihā fa-ḥtamala s-saylu zabadan rābiyan wa-mimmā yūqidūna ʿalayhi fi n-nāri btighāʾa ḥilyatin aw matāʿin zabadun mithluhu kadhālika yaḍribu llāhu l-ḥaqqa wa-l-bāṭila fa-ammā z-zabadu fa-yadhhabu jufāʾan wa-ammā mā yanfaʿu n-nāsa fa-yamkuthu fi l-arḍi kadhālika yaḍribu llāhu l-amthāl
  trad: 'Il fait descendre du ciel une eau, et des vallées se mettent à couler selon leur mesure (bi-qadarihā) — le flot (as-sayl) charrie alors une écume (zabad) qui s''enfle (rābiyan). Et de ce que l''on chauffe au feu, en quête d''une parure (ḥilya) ou d''un objet utile (matāʿ), sort de même une écume semblable (zabadun mithluhu). C''est ainsi qu''Allaah frappe l''exemple (yaḍribu) du ḥaqq et du bāṭil : quant à l''écume, elle s''en va, rejetée (jufāʾan) ; quant à ce qui profite (yanfaʿu) aux gens, cela demeure (yamkuthu) sur la terre. C''est ainsi qu''Allaah frappe les exemples (al-amthāl).'
- ref: S.13:18
  ar: لِلَّذِينَ اسْتَجَابُوا لِرَبِّهِمُ الْحُسْنَىٰ ۚ وَالَّذِينَ لَمْ يَسْتَجِيبُوا لَهُ لَوْ أَنَّ لَهُمْ مَا فِي الْأَرْضِ جَمِيعًا وَمِثْلَهُ مَعَهُ لَافْتَدَوْا بِهِ ۚ أُولَٰئِكَ لَهُمْ سُوءُ الْحِسَابِ وَمَأْوَاهُمْ جَهَنَّمُ ۖ وَبِئْسَ الْمِهَادُ
  trl: Li-lladhīna stajābū li-rabbihimu l-ḥusnā wa-lladhīna lam yastajībū lahu law anna lahum mā fi l-arḍi jamīʿan wa-mithlahu maʿahu la-ftadaw bihi ulāʾika lahum sūʾu l-ḥisābi wa-maʾwāhum jahannamu wa-biʾsa l-mihād
  trad: 'Pour ceux qui ont répondu (istajābū) à leur Rabb, la meilleure part (al-ḥusnā) ; et ceux qui ne Lui ont pas répondu — s''ils possédaient tout ce qui est sur la terre, et autant encore avec, ils s''en rachèteraient (la-ftadaw bihi) — ceux-là auront le pire des comptes (sūʾu l-ḥisāb), et leur refuge (maʾwā) est Jahannam : combien est misérable ce lit d''accueil (al-mihād) !'
- ref: S.13:19
  ar: ۞ أَفَمَنْ يَعْلَمُ أَنَّمَا أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ الْحَقُّ كَمَنْ هُوَ أَعْمَىٰ ۚ إِنَّمَا يَتَذَكَّرُ أُولُو الْأَلْبَابِ
  trl: Afa-man yaʿlamu annamā unzila ilayka min rabbika l-ḥaqqu ka-man huwa aʿmā innamā yatadhakkaru ulū l-albāb
  trad: Celui qui sait que ce qui a été fait descendre vers toi, de la part de ton Rabb, est al-Ḥaqq, est-il comparable à celui qui est aveugle ? Seuls se remémorent (yatadhakkaru) ceux qui sont dotés du minimum de raison (ulū l-albāb).
- ref: S.13:20
  ar: الَّذِينَ يُوفُونَ بِعَهْدِ اللَّهِ وَلَا يَنْقُضُونَ الْمِيثَاقَ
  trl: Alladhīna yūfūna bi-ʿahdi llāhi wa-lā yanquḍūna l-mīthāq
  trad: '[ce sont] ceux qui honorent pleinement (yūfūna) le pacte (ʿahd) d''Allaah, et ne rompent pas (lā yanquḍūna) l''engagement solennel (al-mīthāq).'
- ref: S.13:21
  ar: وَالَّذِينَ يَصِلُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ وَيَخْشَوْنَ رَبَّهُمْ وَيَخَافُونَ سُوءَ الْحِسَابِ
  trl: Wa-lladhīna yaṣilūna mā amara llāhu bihi an yūṣala wa-yakhshawna rabbahum wa-yakhāfūna sūʾa l-ḥisāb
  trad: et ceux qui relient (yaṣilūna) ce qu'Allaah a commandé d'être relié (mā amara llāhu bihi an yūṣal), qui éprouvent la khashya envers leur Rabb, et redoutent (yakhāfūna) le pire des comptes (sūʾ al-ḥisāb).
- ref: S.13:22
  ar: وَالَّذِينَ صَبَرُوا ابْتِغَاءَ وَجْهِ رَبِّهِمْ وَأَقَامُوا الصَّلَاةَ وَأَنْفَقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً وَيَدْرَءُونَ بِالْحَسَنَةِ السَّيِّئَةَ أُولَٰئِكَ لَهُمْ عُقْبَى الدَّارِ
  trl: Wa-lladhīna ṣabarū btighāʾa wajhi rabbihim wa-aqāmū ṣ-ṣalāta wa-anfaqū mimmā razaqnāhum sirran wa-ʿalāniyatan wa-yadraʾūna bi-l-ḥasanati s-sayyiʾata ulāʾika lahum ʿuqbā d-dār
  trad: 'et ceux qui ont enduré (ṣabarū) dans la seule quête de leur Rabb Lui-même (ibtighāʾa wajhi rabbihim), ont dressé la ṣalāt, dépensé de ce que Nous leur avons attribué (razaqnāhum) — secrètement et ouvertement — et repoussent le mal par le bien (yadraʾūna bi-l-ḥasanati s-sayyiʾah) : ceux-là ont pour eux l''issue de la Demeure (ʿuqbā d-dār).'
- ref: S.13:23
  ar: جَنَّاتُ عَدْنٍ يَدْخُلُونَهَا وَمَنْ صَلَحَ مِنْ آبَائِهِمْ وَأَزْوَاجِهِمْ وَذُرِّيَّاتِهِمْ ۖ وَالْمَلَائِكَةُ يَدْخُلُونَ عَلَيْهِمْ مِنْ كُلِّ بَابٍ
  trl: Jannātu ʿadnin yadkhulūnahā wa-man ṣalaḥa min ābāʾihim wa-azwājihim wa-dhurriyyātihim wa-l-malāʾikatu yadkhulūna ʿalayhim min kulli bāb
  trad: les jannāt d'ʿAdn (jannātu ʿadn), où ils entreront, ainsi que ceux qui, parmi leurs pères, leurs épouses et leurs descendances, auront agi dans la droiture (ṣalaḥa) — et les malāʾika entreront auprès d'eux par chaque porte (bāb).
- ref: S.13:24
  ar: سَلَامٌ عَلَيْكُمْ بِمَا صَبَرْتُمْ ۚ فَنِعْمَ عُقْبَى الدَّارِ
  trl: Salāmun ʿalaykum bimā ṣabartum fa-niʿma ʿuqbā d-dār
  trad: « Paix (salām) sur vous, pour ce que vous avez enduré (ṣabartum) » — que l'issue de la Demeure est donc excellente !
- ref: S.13:25
  ar: وَالَّذِينَ يَنْقُضُونَ عَهْدَ اللَّهِ مِنْ بَعْدِ مِيثَاقِهِ وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَنْ يُوصَلَ وَيُفْسِدُونَ فِي الْأَرْضِ ۙ أُولَٰئِكَ لَهُمُ اللَّعْنَةُ وَلَهُمْ سُوءُ الدَّارِ
  trl: Wa-lladhīna yanquḍūna ʿahda llāhi min baʿdi mīthāqihi wa-yaqṭaʿūna mā amara llāhu bihi an yūṣala wa-yufsidūna fi l-arḍi ulāʾika lahumu l-laʿnatu wa-lahum sūʾu d-dār
  trad: Et ceux qui rompent le pacte d'Allaah après l'avoir solidement scellé (min baʿdi mīthāqihi), qui rompent (yaqṭaʿūna) ce qu'Allaah a commandé d'être relié, et qui sèment la corruption sur la terre (yufsidūna fi l-arḍ) — ceux-là ont pour eux la laʿna, et pour eux le pire de la Demeure (sūʾ ad-dār).
- ref: S.13:26
  ar: اللَّهُ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ وَيَقْدِرُ ۚ وَفَرِحُوا بِالْحَيَاةِ الدُّنْيَا وَمَا الْحَيَاةُ الدُّنْيَا فِي الْآخِرَةِ إِلَّا مَتَاعٌ
  trl: Allāhu yabsuṭu r-rizqa li-man yashāʾu wa-yaqdiru wa-fariḥū bi-l-ḥayāti d-dunyā wa-mā l-ḥayātu d-dunyā fi l-ākhirati illā matāʿ
  trad: Allaah étend (yabsuṭu) le rizq pour qui Il veut, ou Il le resserre (yaqdiru) — et ils se sont réjouis de la vie d'ici-bas (al-ḥayāt ad-dunyā), alors que la vie d'ici-bas, en regard de l'Ākhira, n'est qu'un objet de jouissance passagère (matāʿ).
- ref: S.13:27
  ar: وَيَقُولُ الَّذِينَ كَفَرُوا لَوْلَا أُنْزِلَ عَلَيْهِ آيَةٌ مِنْ رَبِّهِ ۗ قُلْ إِنَّ اللَّهَ يُضِلُّ مَنْ يَشَاءُ وَيَهْدِي إِلَيْهِ مَنْ أَنَابَ
  trl: Wa-yaqūlu lladhīna kafarū lawlā unzila ʿalayhi āyatun min rabbihi qul inna llāha yuḍillu man yashāʾu wa-yahdī ilayhi man anāb
  trad: 'Et ceux qui sont kāfirūn disent : « Que n''a-t-on fait descendre sur lui un signe (āya) de la part de son Rabb ! » Dis : « Allaah égare (yuḍillu) qui Il veut, et guide vers Lui quiconque s''est tourné en repentir (anāba). »'
- ref: S.13:28
  ar: الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُمْ بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ
  trl: Alladhīna āmanū wa-taṭmaʾinnu qulūbuhum bi-dhikri llāh alā bi-dhikri llāhi taṭmaʾinnu l-qulūb
  trad: Ceux qui ont cru, et dont les cœurs s'apaisent (taṭmaʾinnu) par le dhikr d'Allaah — n'est-ce pas par le dhikr d'Allaah que les cœurs s'apaisent ?
- ref: S.13:29
  ar: الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَآبٍ
  trl: Alladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti ṭūbā lahum wa-ḥusnu maʾāb
  trad: 'Ceux qui ont cru et accompli les œuvres droites (ʿamilū ṣ-ṣāliḥāt) : à eux ṭūbā, et un bon retour (ḥusn maʾāb).'
- ref: S.13:30
  ar: كَذَٰلِكَ أَرْسَلْنَاكَ فِي أُمَّةٍ قَدْ خَلَتْ مِنْ قَبْلِهَا أُمَمٌ لِتَتْلُوَ عَلَيْهِمُ الَّذِي أَوْحَيْنَا إِلَيْكَ وَهُمْ يَكْفُرُونَ بِالرَّحْمَٰنِ ۚ قُلْ هُوَ رَبِّي لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ مَتَابِ
  trl: Kadhālika arsalnāka fī ummatin qad khalat min qablihā umamun li-tatluwa ʿalayhimu lladhī awḥaynā ilayka wa-hum yakfurūna bi-r-Raḥmāni qul huwa rabbī lā ilāha illā huwa ʿalayhi tawakkaltu wa-ilayhi matāb
  trad: 'C''est ainsi que Nous t''avons envoyé au sein d''une communauté (umma) avant laquelle d''autres communautés sont déjà passées (khalat), pour que tu leur récites ce que Nous t''avons révélé (awḥaynā) — alors qu''ils commettent le kufr envers ar-Raḥmān. Dis : « Il est mon Rabb, nul ilāh que Lui : sur Lui je m''en remets (tawakkaltu), et vers Lui est mon retour (matāb). »'
- ref: S.13:31
  ar: وَلَوْ أَنَّ قُرْآنًا سُيِّرَتْ بِهِ الْجِبَالُ أَوْ قُطِّعَتْ بِهِ الْأَرْضُ أَوْ كُلِّمَ بِهِ الْمَوْتَىٰ ۗ بَلْ لِلَّهِ الْأَمْرُ جَمِيعًا ۗ أَفَلَمْ يَيْأَسِ الَّذِينَ آمَنُوا أَنْ لَوْ يَشَاءُ اللَّهُ لَهَدَى النَّاسَ جَمِيعًا ۗ وَلَا يَزَالُ الَّذِينَ كَفَرُوا تُصِيبُهُمْ بِمَا صَنَعُوا قَارِعَةٌ أَوْ تَحُلُّ قَرِيبًا مِنْ دَارِهِمْ حَتَّىٰ يَأْتِيَ وَعْدُ اللَّهِ ۚ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ
  trl: Wa-law anna qurʾānan suyyirat bihi l-jibālu aw quṭṭiʿat bihi l-arḍu aw kullima bihi l-mawtā bal li-llāhi l-amru jamīʿan afa-lam yayʾasi lladhīna āmanū an law yashāʾu llāhu la-hadā n-nāsa jamīʿan wa-lā yazālu lladhīna kafarū tuṣībuhum bi-mā ṣanaʿū qāriʿatun aw taḥullu qarīban min dārihim ḥattā yaʾtiya waʿdu llāhi inna llāha lā yukhlifu l-mīʿād
  trad: Et si un Qurʾān devait déplacer les montagnes (suyyirat bihi l-jibāl), ou fendre la terre (quṭṭiʿat bihi l-arḍ), ou faire parler les morts (kullima bihi l-mawtā) — [ce serait celui-ci] — mais l'affaire (al-amr) appartient tout entière à Allaah. Ceux qui ont cru n'ont-ils donc pas compris que si Allaah avait voulu, Il aurait guidé les gens tous ensemble ? Et ceux qui sont kāfirūn ne cessent d'être atteints, pour ce qu'ils ont fait, par un choc soudain (qāriʿa), ou [ce choc] s'abat près de leur demeure — jusqu'à ce que vienne la promesse d'Allaah (waʿdu llāh). Allaah ne manque jamais à Sa promesse (al-mīʿād).
- ref: S.13:32
  ar: وَلَقَدِ اسْتُهْزِئَ بِرُسُلٍ مِنْ قَبْلِكَ فَأَمْلَيْتُ لِلَّذِينَ كَفَرُوا ثُمَّ أَخَذْتُهُمْ ۖ فَكَيْفَ كَانَ عِقَابِ
  trl: Wa-la-qadi stuhziʾa bi-rusulin min qablika fa-amlaytu li-lladhīna kafarū thumma akhadhtuhum fa-kayfa kāna ʿiqāb
  trad: Et certes on s'est moqué (stuhziʾa) de rusul avant toi — J'ai accordé un délai (amlaytu) à ceux qui sont kāfirūn, puis Je les ai saisis (akhadhtuhum) — et combien fut Ma rétribution (ʿiqāb) !
- ref: S.13:33
  ar: أَفَمَنْ هُوَ قَائِمٌ عَلَىٰ كُلِّ نَفْسٍ بِمَا كَسَبَتْ ۗ وَجَعَلُوا لِلَّهِ شُرَكَاءَ قُلْ سَمُّوهُمْ ۚ أَمْ تُنَبِّئُونَهُ بِمَا لَا يَعْلَمُ فِي الْأَرْضِ أَمْ بِظَاهِرٍ مِنَ الْقَوْلِ ۗ بَلْ زُيِّنَ لِلَّذِينَ كَفَرُوا مَكْرُهُمْ وَصُدُّوا عَنِ السَّبِيلِ ۗ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ
  trl: Afa-man huwa qāʾimun ʿalā kulli nafsin bi-mā kasabat wa-jaʿalū li-llāhi shurakāʾa qul sammūhum am tunabbiʾūnahu bi-mā lā yaʿlamu fi l-arḍi am bi-ẓāhirin mina l-qawli bal zuyyina li-lladhīna kafarū makruhum wa-ṣuddū ʿani s-sabīli wa-man yuḍlili llāhu fa-mā lahu min hād
  trad: 'Ce qui est en charge (qāʾim ʿalā) de chaque être (nafs) selon ce qu''il a acquis (kasabat) — [serait-Il comparable à qui n''a aucun pouvoir] ? Or ils ont attribué à Allaah des associés (shurakāʾ). Dis : « Nommez-les ! Ou bien voulez-vous L''informer (tunabbiʾūnahu) de quelque chose qu''Il ne connaîtrait pas sur la terre — ou n''est-ce là qu''une parole en apparence (ẓāhir min al-qawl) ? » Bien au contraire, leur manœuvre (makr) a été parée à leurs yeux (zuyyina) pour ceux qui sont kāfirūn, et ils ont été détournés du chemin (aṣ-ṣabīl). Et quiconque Allaah égare n''a plus aucun guide (hād).'
- ref: S.13:34
  ar: لَهُمْ عَذَابٌ فِي الْحَيَاةِ الدُّنْيَا ۖ وَلَعَذَابُ الْآخِرَةِ أَشَقُّ ۖ وَمَا لَهُمْ مِنَ اللَّهِ مِنْ وَاقٍ
  trl: Lahum ʿadhābun fi l-ḥayāti d-dunyā wa-la-ʿadhābu l-ākhirati ashaqqu wa-mā lahum mina llāhi min wāq
  trad: Pour eux un châtiment (ʿadhāb) dans la vie d'ici-bas — et le châtiment de l'Ākhira est certes plus rude (ashaqq) — et ils n'ont, contre Allaah, aucun protecteur (wāq).
- ref: S.13:35
  ar: ۞ مَثَلُ الْجَنَّةِ الَّتِي وُعِدَ الْمُتَّقُونَ ۖ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ۖ أُكُلُهَا دَائِمٌ وَظِلُّهَا ۚ تِلْكَ عُقْبَى الَّذِينَ اتَّقَوْا ۖ وَعُقْبَى الْكَافِرِينَ النَّارُ
  trl: Mathalu l-jannati llatī wuʿida l-muttaqūna tajrī min taḥtihā l-anhāru ukuluhā dāʾimun wa-ẓilluhā tilka ʿuqbā lladhīna ttaqaw wa-ʿuqbā l-kāfirīna n-nār
  trad: 'L''exemple (mathal) de la janna promise aux muttaqūn : sous elle coulent les rivières, son goût (ukul) est permanent (dāʾim), ainsi que son ombre (ẓill) — telle est l''issue de ceux qui se sont prémunis (ittaqaw) ; et l''issue des kāfirūn est le Feu.'
- ref: S.13:36
  ar: وَالَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَفْرَحُونَ بِمَا أُنْزِلَ إِلَيْكَ ۖ وَمِنَ الْأَحْزَابِ مَنْ يُنْكِرُ بَعْضَهُ ۚ قُلْ إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ وَلَا أُشْرِكَ بِهِ ۚ إِلَيْهِ أَدْعُو وَإِلَيْهِ مَآبِ
  trl: Wa-lladhīna ātaynāhumu l-kitāba yafraḥūna bi-mā unzila ilayka wa-mina l-aḥzābi man yunkiru baʿḍahu qul innamā umirtu an aʿbuda llāha wa-lā ushrika bihi ilayhi adʿū wa-ilayhi maʾāb
  trad: 'Et ceux à qui Nous avons donné le Kitāb se réjouissent (yafraḥūna) de ce qui a été fait descendre vers toi — mais, parmi les factions (al-aḥzāb), certains en renient (yunkiru) une partie. Dis : « Il m''est seulement ordonné d''adorer (aʿbuda) Allaah et de ne rien Lui associer (lā ushrika bihi) — c''est vers Lui que j''appelle (adʿū), et vers Lui est mon retour (maʾāb). »'
- ref: S.13:37
  ar: وَكَذَٰلِكَ أَنْزَلْنَاهُ حُكْمًا عَرَبِيًّا ۚ وَلَئِنِ اتَّبَعْتَ أَهْوَاءَهُمْ بَعْدَمَا جَاءَكَ مِنَ الْعِلْمِ مَا لَكَ مِنَ اللَّهِ مِنْ وَلِيٍّ وَلَا وَاقٍ
  trl: Wa-kadhālika anzalnāhu ḥukman ʿarabiyyan wa-la-ini ttabaʿta ahwāʾahum baʿdamā jāʾaka mina l-ʿilmi mā laka mina llāhi min waliyyin wa-lā wāq
  trad: Et c'est ainsi que Nous l'avons fait descendre comme un jugement (ḥukm) en langue arabe — et si tu suivais leurs penchants (ahwāʾahum) après que la connaissance te soit venue, tu n'aurais, contre Allaah, ni walī ni protecteur (wāq).
- ref: S.13:38
  ar: وَلَقَدْ أَرْسَلْنَا رُسُلًا مِنْ قَبْلِكَ وَجَعَلْنَا لَهُمْ أَزْوَاجًا وَذُرِّيَّةً ۚ وَمَا كَانَ لِرَسُولٍ أَنْ يَأْتِيَ بِآيَةٍ إِلَّا بِإِذْنِ اللَّهِ ۗ لِكُلِّ أَجَلٍ كِتَابٌ
  trl: Wa-la-qad arsalnā rusulan min qablika wa-jaʿalnā lahum azwājan wa-dhurriyyatan wa-mā kāna li-rasūlin an yaʾtiya bi-āyatin illā bi-idhni llāhi li-kulli ajalin kitāb
  trad: 'Et Nous avons certes envoyé des rusul avant toi, et Nous leur avons donné des épouses (azwāj) et une descendance (dhurriyya) — et il n''appartenait à aucun rasūl d''apporter un signe (āya) si ce n''est avec la permission d''Allaah (bi-idhni llāh) : à chaque terme (ajal) son écrit (kitāb).'
- ref: S.13:39
  ar: يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ ۖ وَعِنْدَهُ أُمُّ الْكِتَابِ
  trl: Yamḥū llāhu mā yashāʾu wa-yuthbitu wa-ʿindahu ummu l-kitāb
  trad: Allaah efface (yamḥū) ce qu'Il veut, et Il confirme (yuthbitu) — et auprès de Lui se trouve la Mère du Livre (umm al-kitāb).
- ref: S.13:40
  ar: وَإِنْ مَا نُرِيَنَّكَ بَعْضَ الَّذِي نَعِدُهُمْ أَوْ نَتَوَفَّيَنَّكَ فَإِنَّمَا عَلَيْكَ الْبَلَاغُ وَعَلَيْنَا الْحِسَابُ
  trl: Wa-in mā nuriyannaka baʿḍa lladhī naʿiduhum aw natawaffayannaka fa-innamā ʿalayka l-balāghu wa-ʿalaynā l-ḥisāb
  trad: Et soit Nous te montrons une partie de ce que Nous leur promettons [comme châtiment], soit Nous te rappelons à Nous (natawaffayannaka) — il ne t'incombe, dans tous les cas, que la transmission menée à son terme (al-balāgh) ; le compte (al-ḥisāb) Nous incombe.
- ref: S.13:41
  ar: أَوَلَمْ يَرَوْا أَنَّا نَأْتِي الْأَرْضَ نَنْقُصُهَا مِنْ أَطْرَافِهَا ۚ وَاللَّهُ يَحْكُمُ لَا مُعَقِّبَ لِحُكْمِهِ ۚ وَهُوَ سَرِيعُ الْحِسَابِ
  trl: Awalam yaraw annā naʾti l-arḍa nanquṣuhā min aṭrāfihā wa-llāhu yaḥkumu lā muʿaqqiba li-ḥukmihi wa-huwa sarīʿu l-ḥisāb
  trad: N'ont-ils donc pas vu que Nous venons à la terre, la réduisant (nanquṣuhā) par ses extrémités (aṭrāf) ? Allaah juge (yaḥkumu), et nul ne peut faire revenir Son jugement (lā muʿaqqiba li-ḥukmihi) — et Il est prompt en compte (sarīʿ al-ḥisāb).
- ref: S.13:42
  ar: وَقَدْ مَكَرَ الَّذِينَ مِنْ قَبْلِهِمْ فَلِلَّهِ الْمَكْرُ جَمِيعًا ۖ يَعْلَمُ مَا تَكْسِبُ كُلُّ نَفْسٍ ۗ وَسَيَعْلَمُ الْكُفَّارُ لِمَنْ عُقْبَى الدَّارِ
  trl: Wa-qad makara lladhīna min qablihim fa-li-llāhi l-makru jamīʿan yaʿlamu mā taksibu kullu nafsin wa-sa-yaʿlamu l-kuffāru li-man ʿuqbā d-dār
  trad: 'Et certes, ceux d''avant eux ont usé de manœuvre (makara) — mais la manœuvre (al-makr) appartient tout entière à Allaah : Il sait ce que chaque être (nafs) acquiert — et les kuffār sauront bientôt à qui revient l''issue de la Demeure (ʿuqbā d-dār).'
- ref: S.13:43
  ar: وَيَقُولُ الَّذِينَ كَفَرُوا لَسْتَ مُرْسَلًا ۚ قُلْ كَفَىٰ بِاللَّهِ شَهِيدًا بَيْنِي وَبَيْنَكُمْ وَمَنْ عِنْدَهُ عِلْمُ الْكِتَابِ
  trl: Wa-yaqūlu lladhīna kafarū lasta mursalan qul kafā bi-llāhi shahīdan baynī wa-baynakum wa-man ʿindahu ʿilmu l-kitāb
  trad: 'Et ceux qui sont kāfirūn disent : « Tu n''es pas mursal (envoyé). » Dis : « Allaah suffit comme shahīd (témoin) entre moi et vous — ainsi que quiconque détient la science du Kitāb (man ʿindahu ʿilmu l-kitāb). »'
