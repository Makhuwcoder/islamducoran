- ref: S.3:1
  ar: الٓمٓ
  trl: Alif · Lām · Mīm
  trad: Lettres séparées — ḥurūf muqaṭṭaʿāt.
- ref: S.3:2
  ar: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ
  trl: Allāhu lā ilāha illā huwa l-Ḥayyu l-Qayyūm
  trad: Allaah — nul ilāh que Lui, al-Ḥayy, al-Qayyūm.
- ref: S.3:3–4
  ar: نَزَّلَ عَلَيْكَ الْكِتَابَ بِالْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ وَأَنزَلَ التَّوْرَاةَ وَالْإِنجِيلَ ۝ مِن قَبْلُ هُدًى لِّلنَّاسِ وَأَنزَلَ الْفُرْقَانَ ۗ إِنَّ الَّذِينَ كَفَرُوا بِآيَاتِ اللَّهِ لَهُمْ عَذَابٌ شَدِيدٌ ۗ وَاللَّهُ عَزِيزٌ ذُو انتِقَامٍ
  trl: Nazzala ʿalayka l-kitāba bi-l-ḥaqqi muṣaddiqan li-mā bayna yadayhi wa-anzala l-tawrāta wa-l-injīl — min qablu hudan li-l-nāsi wa-anzala l-furqān — inna lladhīna kafarū bi-āyāti llāhi lahum ʿadhābun shadīd — wa-llāhu ʿazīzun dhū ntiqām
  trad: Il a fait descendre sur toi le Livre porteur du ḥaqq, confirmant ce qui le précède — et Il a fait descendre la Tawrāh et l'Injīl, auparavant, en guidance pour les gens — et Il a fait descendre al-Furqān. Ceux qui couvrent leur reconnaissance des āyāt d'Allaah, à eux un châtiment sévère. Allaah est ʿAzīz, détenteur d'intiqām.
- ref: S.3:5–6
  ar: إِنَّ اللَّهَ لَا يَخْفَىٰ عَلَيْهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ۝ هُوَ الَّذِي يُصَوِّرُكُمْ فِي الْأَرْحَامِ كَيْفَ يَشَاءُ ۚ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ
  trl: Inna llāha lā yakhfā ʿalayhi shayʾun fi l-arḍi wa-lā fi l-samāʾ — huwa lladhī yuṣawwirukum fi l-arḥāmi kayfa yashāʾ — lā ilāha illā huwa l-ʿAzīzu l-Ḥakīm
  trad: Rien, sur la terre ni dans le ciel, n'échappe à Allaah — Ce qui vous façonne dans les matrices comme Il veut. Nul ilāh que Lui, al-ʿAzīz, al-Ḥakīm.
- ref: S.3:7
  ar: هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ وَابْتِغَاءَ تَأْوِيلِهِ ۗ وَمَا يَعْلَمُ تَأْوِيلَهُ إِلَّا اللَّهُ ۗ وَالرَّاسِخُونَ فِي الْعِلْمِ يَقُولُونَ آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا ۗ وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ
  trl: Huwa lladhī anzala ʿalayka l-kitāba minhu āyātun muḥkamātun hunna ummu l-kitābi wa-ukharu mutashābihāt — fa-ammā lladhīna fī qulūbihim zayghun fa-yattabiʿūna mā tashābaha minhu btighāʾa l-fitnati wa-btighāʾa taʾwīlih — wa-mā yaʿlamu taʾwīlahu illā llāh — wa-l-rāsikhūna fi l-ʿilmi yaqūlūna āmannā bihi kullun min ʿindi rabbinā — wa-mā yadhdhakkaru illā ulū l-albāb
  trad: 'Ce qui a fait descendre sur toi le Livre — dont certains signes sont muḥkamāt, ils sont la mère du Livre, et d''autres mutashābihāt. Ceux dont le cœur porte une déviation suivent alors ce qui, en lui, se ressemble, recherchant le trouble et recherchant son aboutissement. Or son aboutissement, nul ne le connaît sauf Allaah — et les rāsikhūna fī l-ʿilm disent : « Nous y croyons, tout provient de notre Seigneur. » Et seuls s''en souviennent ceux qui sont dotés du minimum de raison.'
- ref: S.3:8–9
  ar: رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ ۝ رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَّا رَيْبَ فِيهِ ۚ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ
  trl: Rabbanā lā tuzigh qulūbanā baʿda idh hadaytanā wa-hab lanā min ladunka raḥmah — innaka anta l-Wahhāb — Rabbanā innaka jāmiʿu l-nāsi li-yawmin lā rayba fīh — inna llāha lā yukhlifu l-mīʿād
  trad: Notre Seigneur, ne fais pas dévier nos cœurs après nous avoir guidés, et accorde-nous, de Ta part, une raḥma — c'est Toi al-Wahhāb. Notre Seigneur, c'est Toi qui rassembles les gens pour un jour où nul doute n'a de place — Allaah ne manque jamais à Sa promesse.
- ref: S.3:10–12
  ar: إِنَّ الَّذِينَ كَفَرُوا لَن تُغْنِيَ عَنْهُمْ أَمْوَالُهُمْ وَلَا أَوْلَادُهُم مِّنَ اللَّهِ شَيْئًا ۖ وَأُولَٰئِكَ هُمْ وَقُودُ النَّارِ ۝ كَدَأْبِ آلِ فِرْعَوْنَ وَالَّذِينَ مِن قَبْلِهِمْ ۚ كَذَّبُوا بِآيَاتِنَا فَأَخَذَهُمُ اللَّهُ بِذُنُوبِهِمْ ۗ وَاللَّهُ شَدِيدُ الْعِقَابِ ۝ قُل لِّلَّذِينَ كَفَرُوا سَتُغْلَبُونَ وَتُحْشَرُونَ إِلَىٰ جَهَنَّمَ ۚ وَبِئْسَ الْمِهَادُ
  trl: Inna lladhīna kafarū lan tughniya ʿanhum amwāluhum wa-lā awlāduhum mina llāhi shayʾā — wa-ulāʾika hum waqūdu l-nār — ka-daʾbi āli firʿawna wa-lladhīna min qablihim — kadhdhabū bi-āyātinā fa-akhadhahumu llāhu bi-dhunūbihim — wa-llāhu shadīdu l-ʿiqāb — qul li-lladhīna kafarū sa-tughlabūna wa-tuḥsharūna ilā jahannam — wa-biʾsa l-mihād
  trad: 'Ceux qui couvrent leur reconnaissance — leurs biens ni leurs enfants ne leur seront d''aucune utilité face à Allaah. Ceux-là sont le combustible du feu — comme la manière d''être de la famille de Firʿawn et de ceux d''avant eux : ils ont démenti Nos āyāt, alors Allaah les a saisis pour leurs fautes — Allaah est sévère dans la sanction. Dis à ceux qui couvrent leur reconnaissance : « Vous serez vaincus et rassemblés vers Jahannam » — quelle détestable couche de repos.'
- ref: S.3:13
  ar: قَدْ كَانَ لَكُمْ آيَةٌ فِي فِئَتَيْنِ الْتَقَتَا ۖ فِئَةٌ تُقَاتِلُ فِي سَبِيلِ اللَّهِ وَأُخْرَىٰ كَافِرَةٌ يَرَوْنَهُم مِّثْلَيْهِمْ رَأْيَ الْعَيْنِ ۚ وَاللَّهُ يُؤَيِّدُ بِنَصْرِهِ مَن يَشَاءُ ۗ إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّأُولِي الْأَبْصَارِ
  trl: Qad kāna lakum āyatun fī fiʾatayni ltaqatā — fiʾatun tuqātilu fī sabīli llāhi wa-ukhrā kāfiratun yarawnahum mithlayhim raʾya l-ʿayn — wa-llāhu yuʾayyidu bi-naṣrihi man yashāʾ — inna fī dhālika la-ʿibratan li-ulī l-abṣār
  trad: Il y eut certes pour vous un signe dans deux troupes qui se sont rencontrées — une troupe combattant sur la voie d'Allaah, et une autre couvrant sa reconnaissance, qui les voyait deux fois plus nombreux, à vue d'œil. Allaah appuie par Son secours qui Il veut. En cela il y a certes une leçon pour ceux qui ont une vue pénétrante.
- ref: S.3:14–15
  ar: زُيِّنَ لِلنَّاسِ حُبُّ الشَّهَوَاتِ مِنَ النِّسَاءِ وَالْبَنِينَ وَالْقَنَاطِيرِ الْمُقَنطَرَةِ مِنَ الذَّهَبِ وَالْفِضَّةِ وَالْخَيْلِ الْمُسَوَّمَةِ وَالْأَنْعَامِ وَالْحَرْثِ ۗ ذَٰلِكَ مَتَاعُ الْحَيَاةِ الدُّنْيَا ۖ وَاللَّهُ عِندَهُ حُسْنُ الْمَآبِ ۝ قُلْ أَؤُنَبِّئُكُم بِخَيْرٍ مِّن ذَٰلِكُمْ ۚ لِلَّذِينَ اتَّقَوْا عِندَ رَبِّهِمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَأَزْوَاجٌ مُّطَهَّرَةٌ وَرِضْوَانٌ مِّنَ اللَّهِ ۗ وَاللَّهُ بَصِيرٌ بِالْعِبَادِ
  trl: Zuyyina li-l-nāsi ḥubbu l-shahawāti mina l-nisāʾi wa-l-banīna wa-l-qanāṭīri l-muqanṭarati mina l-dhahabi wa-l-fiḍḍati wa-l-khayli l-musawwamati wa-l-anʿāmi wa-l-ḥarth — dhālika matāʿu l-ḥayāti l-dunyā — wa-llāhu ʿindahu ḥusnu l-maʾāb — qul a-unabbiʾukum bi-khayrin min dhālikum — li-lladhīna ttaqaw ʿinda rabbihim jannātun tajrī min taḥtihā l-anhāru khālidīna fīhā wa-azwājun muṭahharatun wa-riḍwānun mina llāh — wa-llāhu baṣīrun bi-l-ʿibād
  trad: 'A été rendu séduisant pour les gens l''amour des shahawāt — femmes, fils, monceaux amoncelés d''or et d''argent, chevaux de race, bétail et terres cultivées : cela est jouissance de la vie de ce monde ; c''est auprès d''Allaah qu''est le beau lieu de retour. Dis : « Vous informerai-je de meilleur que cela ? » A ceux qui se sont prémunis, auprès de leur Seigneur, des jardins sous lesquels courent les rivières, où ils demeurent, des épouses purifiées, et un riḍwān venant d''Allaah. Allaah voit parfaitement les ʿibād.'
- ref: S.3:16–17
  ar: الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ ۝ الصَّابِرِينَ وَالصَّادِقِينَ وَالْقَانِتِينَ وَالْمُنفِقِينَ وَالْمُسْتَغْفِرِينَ بِالْأَسْحَارِ
  trl: Alladhīna yaqūlūna rabbanā innanā āmannā fa-ghfir lanā dhunūbanā wa-qinā ʿadhāba l-nār — al-ṣābirīna wa-l-ṣādiqīna wa-l-qānitīna wa-l-munfiqīna wa-l-mustaghfirīna bi-l-asḥār
  trad: 'Ceux qui disent : « Notre Seigneur, nous avons cru — pardonne-nous nos fautes et préserve-nous du châtiment du feu » — les endurants, les véridiques, ceux qui se tiennent dans la soumission constante, ceux qui dépensent, ceux qui implorent le pardon aux dernières heures de la nuit.'
- ref: S.3:18
  ar: شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ قَائِمًا بِالْقِسْطِ ۚ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ
  trl: Shahida llāhu annahu lā ilāha illā huwa wa-l-malāʾikatu wa-ulū l-ʿilmi qāʾiman bi-l-qisṭ — lā ilāha illā huwa l-ʿAzīzu l-Ḥakīm
  trad: Allaah atteste — ainsi que les malāʾika et ceux qui possèdent le savoir — qu'il n'y a nul ilāh que Lui, se maintenant dans l'équité. Nul ilāh que Lui, al-ʿAzīz, al-Ḥakīm.
- ref: S.3:19
  ar: إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ ۗ وَمَا اخْتَلَفَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَهُمُ الْعِلْمُ بَغْيًا بَيْنَهُمْ ۗ وَمَن يَكْفُرْ بِآيَاتِ اللَّهِ فَإِنَّ اللَّهَ سَرِيعُ الْحِسَابِ
  trl: Inna l-dīna ʿinda llāhi l-islām — wa-mā khtalafa lladhīna ūtu l-kitāba illā min baʿdi mā jāʾahumu l-ʿilmu baghyan baynahum — wa-man yakfur bi-āyāti llāhi fa-inna llāha sarīʿu l-ḥisāb
  trad: Le dīn, dans le registre d'Allaah, est l'islām — et ceux à qui le Livre a été donné n'ont divergé qu'après que le savoir leur soit parvenu, par rivalité entre eux. Quiconque couvre sa reconnaissance des āyāt d'Allaah — Allaah est prompt dans le compte.
- ref: S.3:20
  ar: فَإِنْ حَاجُّوكَ فَقُلْ أَسْلَمْتُ وَجْهِيَ لِلَّهِ وَمَنِ اتَّبَعَنِ ۗ وَقُل لِّلَّذِينَ أُوتُوا الْكِتَابَ وَالْأُمِّيِّينَ أَأَسْلَمْتُمْ ۚ فَإِنْ أَسْلَمُوا فَقَدِ اهْتَدَوا ۖ وَّإِن تَوَلَّوْا فَإِنَّمَا عَلَيْكَ الْبَلَاغُ ۗ وَاللَّهُ بَصِيرٌ بِالْعِبَادِ
  trl: Fa-in ḥājjūka fa-qul aslamtu wajhiya lillāhi wa-mani ttabaʿan — wa-qul li-lladhīna ūtu l-kitāba wa-l-ummiyyīna a-aslamtum — fa-in aslamū fa-qadi htadaw — wa-in tawallaw fa-innamā ʿalayka l-balāgh — wa-llāhu baṣīrun bi-l-ʿibād
  trad: 'S''ils argumentent avec toi, dis : « J''ai remis mon wajh à Allaah, ainsi que quiconque m''a suivi. » Et dis à ceux à qui le Livre a été donné, et aux ummiyyīn : « Avez-vous remis [votre wajh] ? » S''ils l''ont remis, ils sont alors bien guidés ; s''ils se détournent, il ne t''incombe que la transmission. Allaah voit parfaitement les ʿibād.'
- ref: S.3:21–22
  ar: إِنَّ الَّذِينَ يَكْفُرُونَ بِآيَاتِ اللَّهِ وَيَقْتُلُونَ النَّبِيِّينَ بِغَيْرِ حَقٍّ وَيَقْتُلُونَ الَّذِينَ يَأْمُرُونَ بِالْقِسْطِ مِنَ النَّاسِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ ۝ أُولَٰئِكَ الَّذِينَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ وَمَا لَهُم مِّن نَّاصِرِينَ
  trl: Inna lladhīna yakfurūna bi-āyāti llāhi wa-yaqtulūna l-nabiyyīna bi-ghayri ḥaqqin wa-yaqtulūna lladhīna yaʾmurūna bi-l-qisṭi mina l-nāsi fa-bashshirhum bi-ʿadhābin alīm — ulāʾika lladhīna ḥabiṭat aʿmāluhum fi l-dunyā wa-l-ākhirati wa-mā lahum min nāṣirīn
  trad: Ceux qui couvrent leur reconnaissance des āyāt d'Allaah, tuent les nabiyyūn sans droit, et tuent ceux qui, parmi les gens, ordonnent l'équité — annonce-leur un châtiment douloureux. Ceux-là sont ceux dont les œuvres se sont annulées, dans ce monde et dans l'ākhira, et il n'est pour eux aucun secoureur.
- ref: S.3:23–25
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يُدْعَوْنَ إِلَىٰ كِتَابِ اللَّهِ لِيَحْكُمَ بَيْنَهُمْ ثُمَّ يَتَوَلَّىٰ فَرِيقٌ مِّنْهُمْ وَهُم مُّعْرِضُونَ ۝ ذَٰلِكَ بِأَنَّهُمْ قَالُوا لَن تَمَسَّنَا النَّارُ إِلَّا أَيَّامًا مَّعْدُودَاتٍ ۖ وَغَرَّهُمْ فِي دِينِهِم مَّا كَانُوا يَفْتَرُونَ ۝ فَكَيْفَ إِذَا جَمَعْنَاهُمْ لِيَوْمٍ لَّا رَيْبَ فِيهِ وَوُفِّيَتْ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
  trl: A-lam tara ila lladhīna ūtū naṣīban mina l-kitābi yudʿawna ilā kitābi llāhi li-yaḥkuma baynahum thumma yatawallā farīqun minhum wa-hum muʿriḍūn — dhālika bi-annahum qālū lan tamassana l-nāru illā ayyāman maʿdūdāt — wa-gharrahum fī dīnihim mā kānū yaftarūn — fa-kayfa idhā jamaʿnāhum li-yawmin lā rayba fīhi wa-wuffiyat kullu nafsin mā kasabat wa-hum lā yuẓlamūn
  trad: 'N''as-tu pas considéré ceux à qui une part du Livre a été donnée, appelés au Livre d''Allaah pour qu''il tranche entre eux, puis un groupe d''entre eux se détourne, s''écartant ? Cela parce qu''ils ont dit : « Le feu ne nous touchera que des jours comptés » — et ce qu''ils inventaient les a trompés dans leur dīn. Qu''en sera-t-il donc lorsque Nous les aurons rassemblés pour un jour où nul doute n''a de place, et que chaque nafs recevra intégralement ce qu''elle a acquis, sans qu''ils soient lésés ?'
- ref: S.3:26–27
  ar: قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ ۖ بِيَدِكَ الْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ۝ تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ ۖ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ ۖ وَتَرْزُقُ مَن تَشَاءُ بِغَيْرِ حِسَابٍ
  trl: Quli llāhumma mālika l-mulki tuʾti l-mulka man tashāʾu wa-tanziʿu l-mulka mimman tashāʾu wa-tuʿizzu man tashāʾu wa-tudhillu man tashāʾ — bi-yadika l-khayr — innaka ʿalā kulli shayʾin qadīr — tūliju l-layla fi l-nahāri wa-tūliju l-nahāra fi l-layl — wa-tukhriju l-ḥayya mina l-mayyiti wa-tukhriju l-mayyita mina l-ḥayy — wa-tarzuqu man tashāʾu bi-ghayri ḥisāb
  trad: 'Dis : « Ô Allaah, Mālik al-Mulk, Tu donnes le mulk à qui Tu veux et Tu arraches le mulk à qui Tu veux ; Tu honores qui Tu veux et Tu abaisses qui Tu veux — dans Ta main est le bien — Tu es capable de toute chose. Tu fais pénétrer la nuit dans le jour et le jour dans la nuit ; Tu fais sortir le vivant du mort et le mort du vivant ; et Tu pourvois qui Tu veux sans compte. »'
- ref: S.3:28–29
  ar: لَّا يَتَّخِذِ الْمُؤْمِنُونَ الْكَافِرِينَ أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ اللَّهِ فِي شَيْءٍ إِلَّا أَن تَتَّقُوا مِنْهُمْ تُقَاةً ۗ وَيُحَذِّرُكُمُ اللَّهُ نَفْسَهُ ۗ وَإِلَى اللَّهِ الْمَصِيرُ ۝ قُلْ إِن تُخْفُوا مَا فِي صُدُورِكُمْ أَوْ تُبْدُوهُ يَعْلَمْهُ اللَّهُ ۗ وَيَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Lā yattakhidhi l-muʾminūna l-kāfirīna awliyāʾa min dūni l-muʾminīn — wa-man yafʿal dhālika fa-laysa mina llāhi fī shayʾin illā an tattaqū minhum tuqāh — wa-yuḥadhdhirukumu llāhu nafsah — wa-ila llāhi l-maṣīr — qul in tukhfū mā fī ṣudūrikum aw tubdūhu yaʿlamhu llāh — wa-yaʿlamu mā fi l-samāwāti wa-mā fi l-arḍ — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: 'Que les croyants ne prennent pas les kāfirūn comme walī à la place des croyants — quiconque agit ainsi n''a plus rien avec Allaah — sauf si vous vous prémunissez d''eux par une prémunition véritable. Allaah vous met en garde de Lui-même — et c''est vers Allaah qu''est le devenir. Dis : « Que vous dissimuliez ce qui est dans vos poitrines ou que vous le rendiez visible, Allaah le sait » — et Il sait ce qui est dans les cieux et ce qui est sur la terre. Allaah est capable de toute chose.'
- ref: S.3:30–32
  ar: يَوْمَ تَجِدُ كُلُّ نَفْسٍ مَّا عَمِلَتْ مِنْ خَيْرٍ مُّحْضَرًا وَمَا عَمِلَتْ مِن سُوءٍ تَوَدُّ لَوْ أَنَّ بَيْنَهَا وَبَيْنَهُ أَمَدًا بَعِيدًا ۗ وَيُحَذِّرُكُمُ اللَّهُ نَفْسَهُ ۗ وَاللَّهُ رَءُوفٌ بِالْعِبَادِ ۝ قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَاللَّهُ غَفُورٌ رَّحِيمٌ ۝ قُلْ أَطِيعُوا اللَّهَ وَالرَّسُولَ ۖ فَإِن تَوَلَّوْا فَإِنَّ اللَّهَ لَا يُحِبُّ الْكَافِرِينَ
  trl: Yawma tajidu kullu nafsin mā ʿamilat min khayrin muḥḍaran wa-mā ʿamilat min sūʾin tawaddu law anna baynahā wa-baynahu amadan baʿīdā — wa-yuḥadhdhirukumu llāhu nafsah — wa-llāhu Raʾūfun bi-l-ʿibād — qul in kuntum tuḥibbūna llāha fa-ttabiʿūnī yuḥbibkumu llāhu wa-yaghfir lakum dhunūbakum — wa-llāhu Ghafūrun Raḥīm — qul aṭīʿū llāha wa-l-rasūl — fa-in tawallaw fa-inna llāha lā yuḥibbu l-kāfirīn
  trad: 'Le jour où chaque nafs trouvera présent ce qu''elle a fait de bien, et ce qu''elle a fait de mal — elle voudrait qu''il y ait entre elle et cela une distance immense. Allaah vous met en garde de Lui-même. Allaah est Raʾūf envers les ʿibād. Dis : « Si vous aimez Allaah, suivez-moi, Allaah vous aimera et vous pardonnera vos fautes » — Allaah est Ghafūr, Raḥīm. Dis : « Obéissez à Allaah et au rasūl » — s''ils se détournent, Allaah n''honore pas les kāfirūn.'
- ref: S.3:33–34
  ar: إِنَّ ٱللَّهَ ٱصْطَفَىٰٓ ءَادَمَ وَنُوحًا وَءَالَ إِبْرَٰهِيمَ وَءَالَ عِمْرَٰنَ عَلَى ٱلْعَـٰلَمِينَ ۝ ذُرِّيَّةًۢ بَعْضُهَا مِنۢ بَعْضٍ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Inna llāha ṣṭafā Ādama wa-Nūḥan wa-Āla Ibrāhīma wa-Āla ʿImrāna ʿala l-ʿālamīn — dhurriyyatan baʿḍuhā min baʿḍ — wa-llāhu Samīʿun ʿAlīm
  trad: Allaah a élu Ādam, Nūḥ, la famille d'Ibrāhīm et la famille de ʿImrān, au-dessus des mondes — une descendance, les uns issus des autres — Allaah est Samīʿ, ʿAlīm.
- ref: S.3:35
  ar: إِذْ قَالَتِ ٱمْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّى نَذَرْتُ لَكَ مَا فِى بَطْنِى مُحَرَّرًا فَتَقَبَّلْ مِنِّىٓ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ
  trl: Idh qālati mraʾatu ʿImrāna rabbi innī nadhartu laka mā fī baṭnī muḥarraran fa-taqabbal minnī — innaka anta l-Samīʿu l-ʿAlīm
  trad: 'Quand la femme de ʿImrān dit : « Mon Seigneur, j''ai voué pour Toi ce qui est dans mon ventre, entièrement consacré — accepte-le donc de moi. C''est Toi, Toi, al-Samīʿ, al-ʿAlīm. »'
- ref: S.3:36
  ar: فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّى وَضَعْتُهَآ أُنثَىٰ وَٱللَّهُ أَعْلَمُ بِمَا وَضَعَتْ وَلَيْسَ ٱلذَّكَرُ كَٱلْأُنثَىٰ ۖ وَإِنِّى سَمَّيْتُهَا مَرْيَمَ وَإِنِّىٓ أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ ٱلشَّيْطَـٰنِ ٱلرَّجِيمِ
  trl: Fa-lammā waḍaʿathā qālat rabbi innī waḍaʿtuhā unthā wa-llāhu aʿlamu bi-mā waḍaʿat wa-laysa l-dhakaru ka-l-unthā — wa-innī sammaytuhā Maryama wa-innī uʿīdhuhā bika wa-dhurriyyatahā mina l-shayṭāni l-rajīm
  trad: 'Puis, quand elle l''eut mise au monde, elle dit : « Mon Seigneur, je l''ai mise au monde, une fille » — et Allaah sait mieux ce qu''elle a mis au monde — « et le garçon n''est pas comme la fille — je l''ai nommée Maryam, et je la place sous Ta protection, elle et sa descendance, contre le shayṭān banni. »'
- ref: S.3:37
  ar: فَتَقَبَّلَهَا رَبُّهَا بِقَبُولٍ حَسَنٍ وَأَنۢبَتَهَا نَبَاتًا حَسَنًا وَكَفَّلَهَا زَكَرِيَّا ۖ كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا ٱلْمِحْرَابَ وَجَدَ عِندَهَا رِزْقًا ۖ قَالَ يَـٰمَرْيَمُ أَنَّىٰ لَكِ هَـٰذَا ۖ قَالَتْ هُوَ مِنْ عِندِ ٱللَّهِ ۖ إِنَّ ٱللَّهَ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍ
  trl: Fa-taqabbalahā Rabbuhā bi-qabūlin ḥasanin wa-anbatahā nabātan ḥasanan wa-kaffalahā Zakariyyā — kullamā dakhala ʿalayhā Zakariyyā l-miḥrāba wajada ʿindahā rizqan — qāla yā-Maryamu annā laki hādhā — qālat huwa min ʿindi llāh — inna llāha yarzuqu man yashāʾu bi-ghayri ḥisāb
  trad: 'Son Seigneur l''accueillit d''un accueil digne, la fit croître d''une croissance digne, et en confia la charge à Zakariyyā — chaque fois que Zakariyyā entrait auprès d''elle dans al-miḥrāb, il y trouvait une provision — il dit : « Ô Maryam, d''où te vient cela ? » — elle dit : « Cela vient d''auprès d''Allaah — Allaah pourvoit qui Il veut, sans compte. »'
- ref: S.3:38
  ar: هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ ۖ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ ٱلدُّعَآءِ
  trl: Hunālika daʿā Zakariyyā Rabbahu — qāla rabbi hab lī min ladunka dhurriyyatan ṭayyibatan — innaka Samīʿu l-duʿāʾ
  trad: 'Là, Zakariyyā invoqua son Seigneur — il dit : « Mon Seigneur, accorde-moi, de Ta part, une descendance ṭayyiba — c''est Toi qui entends l''invocation (al-duʿāʾ). »'
- ref: S.3:39
  ar: فَنَادَتْهُ ٱلْمَلَـٰٓئِكَةُ وَهُوَ قَآئِمٌ يُصَلِّى فِى ٱلْمِحْرَابِ أَنَّ ٱللَّهَ يُبَشِّرُكَ بِيَحْيَىٰ مُصَدِّقًۢا بِكَلِمَةٍ مِّنَ ٱللَّهِ وَسَيِّدًا وَحَصُورًا وَنَبِيًّا مِّنَ ٱلصَّـٰلِحِينَ
  trl: Fa-nādathu l-malāʾikatu wa-huwa qāʾimun yuṣallī fi l-miḥrābi anna llāha yubashshiruka bi-Yaḥyā muṣaddiqan bi-kalimatin mina llāhi wa-sayyidan wa-ḥaṣūran wa-nabiyyan mina l-ṣāliḥīn
  trad: 'Les malāʾika l''appelèrent, alors qu''il se tenait debout à accomplir la ṣalāt dans al-miḥrāb : « Allaah t''annonce Yaḥyā, confirmant une parole venue d''Allaah, notable, à la retenue totale, et nabī parmi les ṣāliḥūn. »'
- ref: S.3:40–41
  ar: قَالَ رَبِّ أَنَّىٰ يَكُونُ لِى غُلَـٰمٌ وَقَدْ بَلَغَنِىَ ٱلْكِبَرُ وَٱمْرَأَتِى عَاقِرٌ ۖ قَالَ كَذَٰلِكَ ٱللَّهُ يَفْعَلُ مَا يَشَآءُ ۝ قَالَ رَبِّ ٱجْعَل لِّىٓ ءَايَةً ۖ قَالَ ءَايَتُكَ أَلَّا تُكَلِّمَ ٱلنَّاسَ ثَلَـٰثَةَ أَيَّامٍ إِلَّا رَمْزًا ۗ وَٱذْكُر رَّبَّكَ كَثِيرًا وَسَبِّحْ بِٱلْعَشِىِّ وَٱلْإِبْكَـٰرِ
  trl: Qāla rabbi annā yakūnu lī ghulāmun wa-qad balaghaniya l-kibaru wa-mraʾatī ʿāqir — qāla ka-dhālika llāhu yafʿalu mā yashāʾ — qāla rabbi jʿal lī āyatan — qāla āyatuka allā tukallima l-nāsa thalāthata ayyāmin illā ramzan — wa-dhkur rabbaka kathīran wa-sabbiḥ bi-l-ʿashiyyi wa-l-ibkār
  trad: 'Il dit : « Mon Seigneur, comment aurai-je un garçon, alors que la vieillesse m''a atteint et que ma femme est stérile ? » — Il dit : « Ainsi — Allaah fait ce qu''Il veut. » Il dit : « Mon Seigneur, place pour moi un signe. » — Il dit : « Ton signe est que tu ne parleras pas aux gens pendant trois jours, sinon par geste — mentionne beaucoup ton Seigneur, et déclare Sa transcendance (sabbiḥ) au soir et au matin. »'
- ref: S.3:42–43
  ar: وَإِذْ قَالَتِ ٱلْمَلَـٰٓئِكَةُ يَـٰمَرْيَمُ إِنَّ ٱللَّهَ ٱصْطَفَىٰكِ وَطَهَّرَكِ وَٱصْطَفَىٰكِ عَلَىٰ نِسَآءِ ٱلْعَـٰلَمِينَ ۝ يَـٰمَرْيَمُ ٱقْنُتِى لِرَبِّكِ وَٱسْجُدِى وَٱرْكَعِى مَعَ ٱلرَّٰكِعِينَ
  trl: Wa-idh qālati l-malāʾikatu yā-Maryamu inna llāha ṣṭafāki wa-ṭahharaki wa-ṣṭafāki ʿalā nisāʾi l-ʿālamīn — yā-Maryamu qnutī li-rabbiki wa-sjudī wa-rkaʿī maʿa l-rākiʿīn
  trad: 'Et quand les malāʾika dirent : « Ô Maryam, Allaah t''a élue et t''a purifiée, et t''a élue au-dessus des femmes des mondes. Ô Maryam, tiens-toi dans le qunūt pour ton Seigneur, prosterne-toi et incline-toi avec ceux qui s''inclinent. »'
- ref: S.3:44
  ar: ذَٰلِكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهِ إِلَيْكَ ۚ وَمَا كُنتَ لَدَيْهِمْ إِذْ يُلْقُونَ أَقْلَـٰمَهُمْ أَيُّهُمْ يَكْفُلُ مَرْيَمَ وَمَا كُنتَ لَدَيْهِمْ إِذْ يَخْتَصِمُونَ
  trl: Dhālika min anbāʾi l-ghaybi nūḥīhi ilayka — wa-mā kunta ladayhim idh yulqūna aqlāmahum ayyuhum yakfulu Maryama wa-mā kunta ladayhim idh yakhtaṣimūn
  trad: Cela fait partie des récits de l'ghayb que Nous te révélons — tu n'étais pas auprès d'eux quand ils jetaient leurs calames pour savoir lequel d'entre eux se chargerait de Maryam, et tu n'étais pas auprès d'eux quand ils se disputaient.
- ref: S.3:45–46
  ar: إِذْ قَالَتِ ٱلْمَلَـٰٓئِكَةُ يَـٰمَرْيَمُ إِنَّ ٱللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ ٱسْمُهُ ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ وَجِيهًا فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمِنَ ٱلْمُقَرَّبِينَ ۝ وَيُكَلِّمُ ٱلنَّاسَ فِى ٱلْمَهْدِ وَكَهْلًا وَمِنَ ٱلصَّـٰلِحِينَ
  trl: Idh qālati l-malāʾikatu yā-Maryamu inna llāha yubashshiruki bi-kalimatin minhu smuhu l-Masīḥu ʿĪsā-bnu Maryama wajīhan fi l-dunyā wa-l-ākhirati wa-mina l-muqarrabīn — wa-yukallimu l-nāsa fi l-mahdi wa-kahlan wa-mina l-ṣāliḥīn
  trad: 'Quand les malāʾika dirent : « Ô Maryam, Allaah t''annonce une parole venue de Lui, dont le nom est al-Masīḥ, ʿĪsā fils de Maryam, éminent dans ce monde et dans l''ākhira, et parmi les rapprochés. Il parlera aux gens depuis le berceau et à l''âge mûr, et il sera parmi les ṣāliḥūn. »'
- ref: S.3:47
  ar: قَالَتْ رَبِّ أَنَّىٰ يَكُونُ لِى وَلَدٌ وَلَمْ يَمْسَسْنِى بَشَرٌ ۖ قَالَ كَذَٰلِكِ ٱللَّهُ يَخْلُقُ مَا يَشَآءُ ۚ إِذَا قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ
  trl: Qālat rabbi annā yakūnu lī waladun wa-lam yamsasnī bashar — qāla ka-dhāliki llāhu yakhluqu mā yashāʾ — idhā qaḍā amran fa-innamā yaqūlu lahu kun fa-yakūn
  trad: 'Elle dit : « Mon Seigneur, comment aurai-je un enfant, alors qu''aucun être humain (bashar) ne m''a touchée ? » — Il dit : « Ainsi — Allaah crée ce qu''Il veut ; quand Il décide d''une chose, Il lui dit seulement : ‹ Sois › — et elle est. »'
- ref: S.3:48–50
  ar: وَيُعَلِّمُهُ ٱلْكِتَـٰبَ وَٱلْحِكْمَةَ وَٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ ۝ وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ ۖ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ ۖ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ ۖ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ۝ وَمُصَدِّقًا لِّمَا بَيْنَ يَدَىَّ مِنَ ٱلتَّوْرَىٰةِ وَلِأُحِلَّ لَكُم بَعْضَ ٱلَّذِى حُرِّمَ عَلَيْكُمْ ۚ وَجِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ فَٱتَّقُوا۟ ٱللَّهَ وَأَطِيعُونِ
  trl: Wa-yuʿallimuhu l-kitāba wa-l-ḥikmata wa-l-tawrāta wa-l-injīl — wa-rasūlan ilā banī Isrāʾīla annī qad jiʾtukum bi-āyatin min rabbikum — annī akhluqu lakum mina l-ṭīni ka-hayʾati l-ṭayri fa-anfukhu fīhi fa-yakūnu ṭayran bi-idhni llāh — wa-ubriʾu l-akmaha wa-l-abraṣa wa-uḥyi l-mawtā bi-idhni llāh — wa-unabbiʾukum bi-mā taʾkulūna wa-mā taddakhirūna fī buyūtikum — inna fī dhālika la-āyatan lakum in kuntum muʾminīn — wa-muṣaddiqan li-mā bayna yadayya mina l-tawrāti wa-li-uḥilla lakum baʿḍa lladhī ḥurrima ʿalaykum — wa-jiʾtukum bi-āyatin min rabbikum fa-ttaqū llāha wa-aṭīʿūn
  trad: 'Et Il lui enseigne le Kitāb, la ḥikma, la Tawrāh et l''Injīl — et comme rasūl envers les Banū Isrāʾīl : « Je vous ai apporté un signe venant de votre Seigneur — je façonne pour vous, à partir de l''argile, une forme d''oiseau, puis j''y souffle et elle devient un oiseau, par la permission d''Allaah — je guéris l''aveugle-né et le lépreux, et je redonne vie aux morts, par la permission d''Allaah — et je vous informe de ce que vous mangez et de ce que vous amassez dans vos maisons. En cela, il y a certes un signe pour vous, si vous êtes muʾminūn — et confirmant ce qui, de la Tawrāh, est entre mes mains — et pour rendre licite pour vous une partie de ce qui vous était interdit — je vous ai apporté un signe venant de votre Seigneur ; prémunissez-vous donc d''Allaah et obéissez-moi. »'
- ref: S.3:51
  ar: إِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۗ هَـٰذَا صِرَٰطٌ مُّسْتَقِيمٌ
  trl: Inna llāha rabbī wa-rabbukum fa-ʿbudūhu — hādhā ṣirāṭun mustaqīm
  trad: Allaah est mon Seigneur et votre Seigneur ; servez-Le donc. Voilà un chemin droit.
- ref: S.3:52–53
  ar: ۞ فَلَمَّآ أَحَسَّ عِيسَىٰ مِنْهُمُ ٱلْكُفْرَ قَالَ مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ ۖ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ أَنصَارُ ٱللَّهِ ءَامَنَّا بِٱللَّهِ وَٱشْهَدْ بِأَنَّا مُسْلِمُونَ ۝ رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّـٰهِدِينَ
  trl: Fa-lammā aḥassa ʿĪsā minhumu l-kufra qāla man anṣārī ila llāh — qāla l-ḥawāriyyūna naḥnu anṣāru llāhi āmannā bi-llāhi wa-shhad bi-annā muslimūn — rabbanā āmannā bi-mā anzalta wa-ttabaʿnā l-rasūla fa-ktubnā maʿa l-shāhidīn
  trad: 'Puis, quand ʿĪsā perçut chez eux le kufr, il dit : « Qui sont mes secoureurs vers Allaah ? » — les ḥawāriyyūn dirent : « Nous sommes les secoureurs d''Allaah, nous avons cru en Allaah, et atteste que nous sommes muslimūn. Notre Seigneur, nous avons cru en ce que Tu as fait descendre, et nous avons suivi le rasūl — inscris-nous donc parmi les témoins (al-shāhidīn). »'
- ref: S.3:54
  ar: وَمَكَرُوا۟ وَمَكَرَ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَـٰكِرِينَ
  trl: Wa-makarū wa-makara llāhu wa-llāhu khayru l-mākirīn
  trad: Ils ont usé de manœuvre, et Allaah a usé de manœuvre — Allaah est le meilleur en matière de manœuvre.
- ref: S.3:55
  ar: إِذْ قَالَ ٱللَّهُ يَـٰعِيسَىٰٓ إِنِّى مُتَوَفِّيكَ وَرَافِعُكَ إِلَىَّ وَمُطَهِّرُكَ مِنَ ٱلَّذِينَ كَفَرُوا۟ وَجَاعِلُ ٱلَّذِينَ ٱتَّبَعُوكَ فَوْقَ ٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ ۖ ثُمَّ إِلَىَّ مَرْجِعُكُمْ فَأَحْكُمُ بَيْنَكُمْ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ
  trl: Idh qāla llāhu yā-ʿĪsā innī mutawaffīka wa-rāfiʿuka ilayya wa-muṭahhiruka mina lladhīna kafarū wa-jāʿilu lladhīna ttabaʿūka fawqa lladhīna kafarū ilā yawmi l-qiyāmati — thumma ilayya marjiʿukum fa-aḥkumu baynakum fīmā kuntum fīhi takhtalifūn
  trad: 'Quand Allaah dit : « Ô ʿĪsā, Je te reprends en pleine mesure, et Je t''élève vers Moi, et Je te purifie de ceux qui couvrent leur reconnaissance, et Je place ceux qui t''ont suivi au-dessus de ceux qui couvrent leur reconnaissance, jusqu''au Jour de la Résurrection — puis c''est vers Moi votre retour, et Je jugerai entre vous sur ce en quoi vous divergiez. »'
- ref: S.3:56–57
  ar: فَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَأُعَذِّبُهُمْ عَذَابًا شَدِيدًا فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمَا لَهُم مِّن نَّـٰصِرِينَ ۝ وَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ فَيُوَفِّيهِمْ أُجُورَهُمْ ۗ وَٱللَّهُ لَا يُحِبُّ ٱلظَّـٰلِمِينَ
  trl: Fa-ammā lladhīna kafarū fa-uʿadhdhibuhum ʿadhāban shadīdan fi l-dunyā wa-l-ākhirati wa-mā lahum min nāṣirīn — wa-ammā lladhīna āmanū wa-ʿamilū l-ṣāliḥāti fa-yuwaffīhim ujūrahum — wa-llāhu lā yuḥibbu l-ẓālimīn
  trad: Quant à ceux qui couvrent leur reconnaissance, Je les châtierai d'un châtiment sévère, dans ce monde et dans l'ākhira, et ils n'auront aucun secoureur. Quant à ceux qui ont cru et ont accompli les œuvres ṣāliḥa, Il leur rendra intégralement leurs rétributions — Allaah n'aime pas les ẓālimūn.
- ref: S.3:58
  ar: ذَٰلِكَ نَتْلُوهُ عَلَيْكَ مِنَ ٱلْـَٔايَـٰتِ وَٱلذِّكْرِ ٱلْحَكِيمِ
  trl: Dhālika natlūhu ʿalayka mina l-āyāti wa-l-dhikri l-ḥakīm
  trad: Cela, Nous te le récitons, parmi les āyāt et le dhikr empreint de justesse.
- ref: S.3:59–60
  ar: إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ ۖ خَلَقَهُۥ مِن تُرَابٍ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ ۝ ٱلْحَقُّ مِن رَّبِّكَ فَلَا تَكُن مِّنَ ٱلْمُمْتَرِينَ
  trl: Inna mathala ʿĪsā ʿinda llāhi ka-mathali Ādama — khalaqahu min turābin thumma qāla lahu kun fa-yakūn — al-ḥaqqu min rabbika fa-lā takun mina l-mumtarīn
  trad: 'L''exemple d''ʿĪsā, dans le registre d''Allaah, est comme l''exemple d''Ādam : Il le créa de terre, puis Il lui dit : « Sois » — et il fut. Le ḥaqq vient de ton Seigneur ; ne sois donc pas parmi ceux qui doutent.'
- ref: S.3:61
  ar: فَمَنْ حَآجَّكَ فِيهِ مِنۢ بَعْدِ مَا جَآءَكَ مِنَ ٱلْعِلْمِ فَقُلْ تَعَالَوْا۟ نَدْعُ أَبْنَآءَنَا وَأَبْنَآءَكُمْ وَنِسَآءَنَا وَنِسَآءَكُمْ وَأَنفُسَنَا وَأَنفُسَكُمْ ثُمَّ نَبْتَهِلْ فَنَجْعَل لَّعْنَتَ ٱللَّهِ عَلَى ٱلْكَـٰذِبِينَ
  trl: Fa-man ḥājjaka fīhi min baʿdi mā jāʾaka mina l-ʿilmi fa-qul taʿālaw nadʿu abnāʾanā wa-abnāʾakum wa-nisāʾanā wa-nisāʾakum wa-anfusanā wa-anfusakum thumma nabtahil fa-najʿal laʿnata llāhi ʿalā l-kādhibīn
  trad: 'Quiconque argumente avec toi à ce sujet, après que le savoir te soit parvenu, dis alors : « Venez, appelons nos fils et vos fils, nos femmes et vos femmes, nous-mêmes et vous-mêmes, puis invoquons ensemble avec ferveur, et plaçons la malédiction d''Allaah sur les menteurs. »'
- ref: S.3:62–63
  ar: إِنَّ هَـٰذَا لَهُوَ ٱلْقَصَصُ ٱلْحَقُّ ۚ وَمَا مِنْ إِلَـٰهٍ إِلَّا ٱللَّهُ ۚ وَإِنَّ ٱللَّهَ لَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ۝ فَإِن تَوَلَّوْا۟ فَإِنَّ ٱللَّهَ عَلِيمٌۢ بِٱلْمُفْسِدِينَ
  trl: Inna hādhā la-huwa l-qaṣaṣu l-ḥaqq — wa-mā min ilāhin illā llāh — wa-inna llāha la-huwa l-ʿAzīzu l-Ḥakīm — fa-in tawallaw fa-inna llāha ʿAlīmun bi-l-mufsidīn
  trad: Ceci est certes le qaṣaṣ véridique — il n'y a nul ilāh sinon Allaah — et Allaah est certes al-ʿAzīz, al-Ḥakīm. S'ils se détournent, alors Allaah connaît parfaitement les mufsidūn.
