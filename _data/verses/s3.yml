- ref: S.3:1
  ar: الٓمٓ
  trl: Alif · Lām · Mīm
  trad: Lettres séparées — ḥurūf muqaṭṭaʿāt.
- ref: S.3:2
  ar: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ
  trl: Allāhu lā ilāha illā huwa l-Ḥayyu l-Qayyūm
  trad: Allaah — nul ilāh que Lui, al-Ḥayy, al-Qayyūm.
- ref: S.3:3–4
  ar: نَزَّلَ عَلَيْكَ الْكِتَابَ بِالْحَقِّ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ وَأَنزَلَ التَّوْرَاةَ وَالْإِنجِيلَ ۝ مِن قَبْلُ هُدًى لِّلنَّاسِ وَأَنزَلَ الْفُرْقَانَ ۗ إِنَّ الَّذِينَ كَفَرُوا بِآيَاتِ اللَّهِ لَهُمْ عَذَابٌ شَدِيدٌ ۗ وَاللَّهُ عَزِيزٌ ذُو انتِقَامٍ
  trl: Nazzala ʿalayka l-kitāba bi-l-ḥaqqi muṣaddiqan li-mā bayna yadayhi wa-anzala l-tawrāta wa-l-injīl — min qablu hudan li-l-nāsi wa-anzala l-furqān — inna lladhīna kafarū bi-āyāti llāhi lahum ʿadhābun shadīd — wa-llāhu ʿazīzun dhū ntiqām
  trad: Il a fait descendre sur toi le Livre porteur du ḥaqq, confirmant ce qui le précède — et Il a fait descendre la Tawrāh et l'Injīl, auparavant, en guidance pour les gens — et Il a fait descendre al-Furqān. Ceux qui sont kāfirūn envers les āyāt d'Allaah, à eux un châtiment sévère. Allaah est ʿAzīz, détenteur d'intiqām.
- ref: S.3:5–6
  ar: إِنَّ اللَّهَ لَا يَخْفَىٰ عَلَيْهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ۝ هُوَ الَّذِي يُصَوِّرُكُمْ فِي الْأَرْحَامِ كَيْفَ يَشَاءُ ۚ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ
  trl: Inna llāha lā yakhfā ʿalayhi shayʾun fi l-arḍi wa-lā fi l-samāʾ — huwa lladhī yuṣawwirukum fi l-arḥāmi kayfa yashāʾ — lā ilāha illā huwa l-ʿAzīzu l-Ḥakīm
  trad: Rien, sur la terre ni dans le ciel, n'échappe à Allaah — Ce qui vous façonne dans les matrices comme Il veut. Nul ilāh que Lui, al-ʿAzīz, al-Ḥakīm.
- ref: S.3:7
  ar: هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ وَابْتِغَاءَ تَأْوِيلِهِ ۗ وَمَا يَعْلَمُ تَأْوِيلَهُ إِلَّا اللَّهُ ۗ وَالرَّاسِخُونَ فِي الْعِلْمِ يَقُولُونَ آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا ۗ وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ
  trl: Huwa lladhī anzala ʿalayka l-kitāba minhu āyātun muḥkamātun hunna ummu l-kitābi wa-ukharu mutashābihāt — fa-ammā lladhīna fī qulūbihim zayghun fa-yattabiʿūna mā tashābaha minhu btighāʾa l-fitnati wa-btighāʾa taʾwīlih — wa-mā yaʿlamu taʾwīlahu illā llāh — wa-l-rāsikhūna fi l-ʿilmi yaqūlūna āmannā bihi kullun min ʿindi rabbinā — wa-mā yadhdhakkaru illā ulū l-albāb
  trad: 'Ce qui a fait descendre sur toi le Livre — dont certains ayah sont muḥkamāt, ils sont la mère du Livre, et d''autres mutashābihāt. Ceux dont le cœur porte une déviation suivent alors ce qui, en lui, se ressemble, recherchant le trouble et recherchant son aboutissement. Or son aboutissement, nul ne le connaît sauf Allaah — et les rāsikhūna fī l-ʿilm disent : « Nous y croyons, tout provient de notre Rabb. » Et seuls s''en souviennent ceux qui sont dotés du minimum de raison.'
- ref: S.3:8–9
  ar: رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ ۝ رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَّا رَيْبَ فِيهِ ۚ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ
  trl: Rabbanā lā tuzigh qulūbanā baʿda idh hadaytanā wa-hab lanā min ladunka raḥmah — innaka anta l-Wahhāb — Rabbanā innaka jāmiʿu l-nāsi li-yawmin lā rayba fīh — inna llāha lā yukhlifu l-mīʿād
  trad: Notre Rabb, ne fais pas dévier nos cœurs après nous avoir guidés, et accorde-nous, de Ta part, une raḥma — c'est Toi al-Wahhāb. Notre Rabb, c'est Toi qui rassembles les gens pour un jour où nul doute n'a de place — Allaah ne manque jamais à Sa promesse.
- ref: S.3:10–12
  ar: إِنَّ الَّذِينَ كَفَرُوا لَن تُغْنِيَ عَنْهُمْ أَمْوَالُهُمْ وَلَا أَوْلَادُهُم مِّنَ اللَّهِ شَيْئًا ۖ وَأُولَٰئِكَ هُمْ وَقُودُ النَّارِ ۝ كَدَأْبِ آلِ فِرْعَوْنَ وَالَّذِينَ مِن قَبْلِهِمْ ۚ كَذَّبُوا بِآيَاتِنَا فَأَخَذَهُمُ اللَّهُ بِذُنُوبِهِمْ ۗ وَاللَّهُ شَدِيدُ الْعِقَابِ ۝ قُل لِّلَّذِينَ كَفَرُوا سَتُغْلَبُونَ وَتُحْشَرُونَ إِلَىٰ جَهَنَّمَ ۚ وَبِئْسَ الْمِهَادُ
  trl: Inna lladhīna kafarū lan tughniya ʿanhum amwāluhum wa-lā awlāduhum mina llāhi shayʾā — wa-ulāʾika hum waqūdu l-nār — ka-daʾbi āli firʿawna wa-lladhīna min qablihim — kadhdhabū bi-āyātinā fa-akhadhahumu llāhu bi-dhunūbihim — wa-llāhu shadīdu l-ʿiqāb — qul li-lladhīna kafarū sa-tughlabūna wa-tuḥsharūna ilā jahannam — wa-biʾsa l-mihād
  trad: 'Ceux qui sont kāfirūn — leurs biens ni leurs enfants ne leur seront d''aucun secours contre ce qui vient d''Allaah. Ceux-là sont le combustible du feu — comme la manière d''être de la famille de Firʿawn et de ceux d''avant eux : ils ont démenti Nos āyāt, alors Allaah les a saisis pour leurs fautes — Allaah est sévère dans la sanction. Dis à ceux qui sont kāfirūn : « Vous serez vaincus et rassemblés vers Jahannam » — quelle détestable couche de repos.'
- ref: S.3:13
  ar: قَدْ كَانَ لَكُمْ آيَةٌ فِي فِئَتَيْنِ الْتَقَتَا ۖ فِئَةٌ تُقَاتِلُ فِي سَبِيلِ اللَّهِ وَأُخْرَىٰ كَافِرَةٌ يَرَوْنَهُم مِّثْلَيْهِمْ رَأْيَ الْعَيْنِ ۚ وَاللَّهُ يُؤَيِّدُ بِنَصْرِهِ مَن يَشَاءُ ۗ إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّأُولِي الْأَبْصَارِ
  trl: Qad kāna lakum āyatun fī fiʾatayni ltaqatā — fiʾatun tuqātilu fī sabīli llāhi wa-ukhrā kāfiratun yarawnahum mithlayhim raʾya l-ʿayn — wa-llāhu yuʾayyidu bi-naṣrihi man yashāʾ — inna fī dhālika la-ʿibratan li-ulī l-abṣār
  trad: Il y eut certes pour vous une ayah dans deux troupes qui se sont rencontrées — une troupe combattant sur la voie d'Allaah, et une autre, kāfira, qui les voyait deux fois plus nombreux, à vue d'œil. Allaah appuie par Son secours qui Il veut. En cela il y a certes une leçon pour ceux doués de clairvoyance.
- ref: S.3:14–15
  ar: زُيِّنَ لِلنَّاسِ حُبُّ الشَّهَوَاتِ مِنَ النِّسَاءِ وَالْبَنِينَ وَالْقَنَاطِيرِ الْمُقَنطَرَةِ مِنَ الذَّهَبِ وَالْفِضَّةِ وَالْخَيْلِ الْمُسَوَّمَةِ وَالْأَنْعَامِ وَالْحَرْثِ ۗ ذَٰلِكَ مَتَاعُ الْحَيَاةِ الدُّنْيَا ۖ وَاللَّهُ عِندَهُ حُسْنُ الْمَآبِ ۝ قُلْ أَؤُنَبِّئُكُم بِخَيْرٍ مِّن ذَٰلِكُمْ ۚ لِلَّذِينَ اتَّقَوْا عِندَ رَبِّهِمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَأَزْوَاجٌ مُّطَهَّرَةٌ وَرِضْوَانٌ مِّنَ اللَّهِ ۗ وَاللَّهُ بَصِيرٌ بِالْعِبَادِ
  trl: Zuyyina li-l-nāsi ḥubbu l-shahawāti mina l-nisāʾi wa-l-banīna wa-l-qanāṭīri l-muqanṭarati mina l-dhahabi wa-l-fiḍḍati wa-l-khayli l-musawwamati wa-l-anʿāmi wa-l-ḥarth — dhālika matāʿu l-ḥayāti l-dunyā — wa-llāhu ʿindahu ḥusnu l-maʾāb — qul a-unabbiʾukum bi-khayrin min dhālikum — li-lladhīna ttaqaw ʿinda rabbihim jannātun tajrī min taḥtihā l-anhāru khālidīna fīhā wa-azwājun muṭahharatun wa-riḍwānun mina llāh — wa-llāhu baṣīrun bi-l-ʿibād
  trad: 'A été rendu séduisant pour les gens l''amour des shahawāt — femmes, fils, monceaux amoncelés d''or et d''argent, chevaux de race, bétail et terres cultivées : cela est jouissance de la vie de ce monde ; c''est auprès d''Allaah qu''est le beau lieu de retour. Dis : « Vous informerai-je de meilleur que cela ? » A ceux qui se sont constitué une taqwā, auprès de leur Rabb, des jardins sous lesquels courent les rivières, où ils demeurent, des épouses purifiées, et un riḍwān venant d''Allaah. Allaah voit parfaitement les ʿibād.'
- ref: S.3:16–17
  ar: الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ ۝ الصَّابِرِينَ وَالصَّادِقِينَ وَالْقَانِتِينَ وَالْمُنفِقِينَ وَالْمُسْتَغْفِرِينَ بِالْأَسْحَارِ
  trl: Alladhīna yaqūlūna rabbanā innanā āmannā fa-ghfir lanā dhunūbanā wa-qinā ʿadhāba l-nār — al-ṣābirīna wa-l-ṣādiqīna wa-l-qānitīna wa-l-munfiqīna wa-l-mustaghfirīna bi-l-asḥār
  trad: 'Ceux qui disent : « Notre Rabb, nous avons cru — pardonne-nous nos fautes et préserve-nous du châtiment du feu » — les endurants, les véridiques, ceux qui se tiennent dans la soumission constante, ceux qui dépensent, ceux qui implorent le pardon aux dernières heures de la nuit.'
- ref: S.3:18
  ar: شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ قَائِمًا بِالْقِسْطِ ۚ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ
  trl: Shahida llāhu annahu lā ilāha illā huwa wa-l-malāʾikatu wa-ulū l-ʿilmi qāʾiman bi-l-qisṭ — lā ilāha illā huwa l-ʿAzīzu l-Ḥakīm
  trad: Allaah atteste — ainsi que les malāʾika et ceux qui possèdent le savoir — qu'il n'y a nul ilāh que Lui, se maintenant dans l'équité. Nul ilāh que Lui, al-ʿAzīz, al-Ḥakīm.
- ref: S.3:19
  ar: إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ ۗ وَمَا اخْتَلَفَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَهُمُ الْعِلْمُ بَغْيًا بَيْنَهُمْ ۗ وَمَن يَكْفُرْ بِآيَاتِ اللَّهِ فَإِنَّ اللَّهَ سَرِيعُ الْحِسَابِ
  trl: Inna l-dīna ʿinda llāhi l-islām — wa-mā khtalafa lladhīna ūtu l-kitāba illā min baʿdi mā jāʾahumu l-ʿilmu baghyan baynahum — wa-man yakfur bi-āyāti llāhi fa-inna llāha sarīʿu l-ḥisāb
  trad: Le dīn, dans le registre d'Allaah, est l'islām — et ceux à qui le Livre a été donné n'ont divergé qu'après que le savoir leur soit parvenu, par rivalité entre eux. Quiconque est kāfir envers les āyāt d'Allaah — Allaah est prompt dans le compte.
- ref: S.3:20
  ar: فَإِنْ حَاجُّوكَ فَقُلْ أَسْلَمْتُ وَجْهِيَ لِلَّهِ وَمَنِ اتَّبَعَنِ ۗ وَقُل لِّلَّذِينَ أُوتُوا الْكِتَابَ وَالْأُمِّيِّينَ أَأَسْلَمْتُمْ ۚ فَإِنْ أَسْلَمُوا فَقَدِ اهْتَدَوا ۖ وَّإِن تَوَلَّوْا فَإِنَّمَا عَلَيْكَ الْبَلَاغُ ۗ وَاللَّهُ بَصِيرٌ بِالْعِبَادِ
  trl: Fa-in ḥājjūka fa-qul aslamtu wajhiya lillāhi wa-mani ttabaʿan — wa-qul li-lladhīna ūtu l-kitāba wa-l-ummiyyīna a-aslamtum — fa-in aslamū fa-qadi htadaw — wa-in tawallaw fa-innamā ʿalayka l-balāgh — wa-llāhu baṣīrun bi-l-ʿibād
  trad: 'S''ils argumentent avec toi, dis : « Je me suis voué, tout entier et sans partage, à Allaah — ainsi que quiconque m''a suivi. » Et dis à ceux à qui le Livre a été donné, et aux ummiyyīn : « Vous êtes-vous voués de même ? » S''ils se sont ainsi voués, ils sont alors bien guidés ; s''ils se détournent, il ne t''incombe que la transmission. Allaah voit parfaitement les ʿibād.'
- ref: S.3:21–22
  ar: إِنَّ الَّذِينَ يَكْفُرُونَ بِآيَاتِ اللَّهِ وَيَقْتُلُونَ النَّبِيِّينَ بِغَيْرِ حَقٍّ وَيَقْتُلُونَ الَّذِينَ يَأْمُرُونَ بِالْقِسْطِ مِنَ النَّاسِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ ۝ أُولَٰئِكَ الَّذِينَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ وَمَا لَهُم مِّن نَّاصِرِينَ
  trl: Inna lladhīna yakfurūna bi-āyāti llāhi wa-yaqtulūna l-nabiyyīna bi-ghayri ḥaqqin wa-yaqtulūna lladhīna yaʾmurūna bi-l-qisṭi mina l-nāsi fa-bashshirhum bi-ʿadhābin alīm — ulāʾika lladhīna ḥabiṭat aʿmāluhum fi l-dunyā wa-l-ākhirati wa-mā lahum min nāṣirīn
  trad: Ceux qui sont kāfirūn envers les āyāt d'Allaah, tuent les nabiyyūn sans droit, et tuent ceux qui, parmi les gens, ordonnent l'équité — annonce-leur un châtiment douloureux. Ceux-là sont ceux dont les œuvres se sont annulées, dans ce monde et dans l'ākhira, et il n'est pour eux aucun secoureur.
- ref: S.3:23–25
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يُدْعَوْنَ إِلَىٰ كِتَابِ اللَّهِ لِيَحْكُمَ بَيْنَهُمْ ثُمَّ يَتَوَلَّىٰ فَرِيقٌ مِّنْهُمْ وَهُم مُّعْرِضُونَ ۝ ذَٰلِكَ بِأَنَّهُمْ قَالُوا لَن تَمَسَّنَا النَّارُ إِلَّا أَيَّامًا مَّعْدُودَاتٍ ۖ وَغَرَّهُمْ فِي دِينِهِم مَّا كَانُوا يَفْتَرُونَ ۝ فَكَيْفَ إِذَا جَمَعْنَاهُمْ لِيَوْمٍ لَّا رَيْبَ فِيهِ وَوُفِّيَتْ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
  trl: A-lam tara ila lladhīna ūtū naṣīban mina l-kitābi yudʿawna ilā kitābi llāhi li-yaḥkuma baynahum thumma yatawallā farīqun minhum wa-hum muʿriḍūn — dhālika bi-annahum qālū lan tamassana l-nāru illā ayyāman maʿdūdāt — wa-gharrahum fī dīnihim mā kānū yaftarūn — fa-kayfa idhā jamaʿnāhum li-yawmin lā rayba fīhi wa-wuffiyat kullu nafsin mā kasabat wa-hum lā yuẓlamūn
  trad: 'N''as-tu pas considéré ceux à qui une part du Livre a été donnée, appelés au Livre d''Allaah pour qu''il tranche entre eux, puis un groupe d''entre eux se détourne, s''écartant ? Cela parce qu''ils ont dit : « Le feu ne nous touchera que quelques jours comptés » — et ce qu''ils inventaient les a trompés dans leur dīn. Qu''en sera-t-il donc lorsque Nous les aurons rassemblés pour un jour où nul doute n''a de place, et que chaque nafs recevra intégralement ce qu''elle a acquis, sans qu''ils soient lésés ?'
- ref: S.3:26–27
  ar: قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ ۖ بِيَدِكَ الْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ۝ تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ ۖ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ ۖ وَتَرْزُقُ مَن تَشَاءُ بِغَيْرِ حِسَابٍ
  trl: Quli llāhumma mālika l-mulki tuʾti l-mulka man tashāʾu wa-tanziʿu l-mulka mimman tashāʾu wa-tuʿizzu man tashāʾu wa-tudhillu man tashāʾ — bi-yadika l-khayr — innaka ʿalā kulli shayʾin qadīr — tūliju l-layla fi l-nahāri wa-tūliju l-nahāra fi l-layl — wa-tukhriju l-ḥayya mina l-mayyiti wa-tukhriju l-mayyita mina l-ḥayy — wa-tarzuqu man tashāʾu bi-ghayri ḥisāb
  trad: 'Dis : « Ô Allaah, Mālik al-Mulk, Tu donnes le mulk à qui Tu veux et Tu arraches le mulk à qui Tu veux ; Tu honores qui Tu veux et Tu abaisses qui Tu veux — dans Ta Yad est le bien — Tu es capable de toute chose. Tu fais pénétrer la nuit dans le jour et le jour dans la nuit ; Tu fais sortir le vivant du mort et le mort du vivant ; et Tu pourvois qui Tu veux sans compte. »'
  notes:
    - bloc: bloc1
      anchor: yad-s3-27
      label: "« Yad » conservé en translittération — note de méthode"
- ref: S.3:28–29
  ar: لَّا يَتَّخِذِ الْمُؤْمِنُونَ الْكَافِرِينَ أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ ۖ وَمَن يَفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ اللَّهِ فِي شَيْءٍ إِلَّا أَن تَتَّقُوا مِنْهُمْ تُقَاةً ۗ وَيُحَذِّرُكُمُ اللَّهُ نَفْسَهُ ۗ وَإِلَى اللَّهِ الْمَصِيرُ ۝ قُلْ إِن تُخْفُوا مَا فِي صُدُورِكُمْ أَوْ تُبْدُوهُ يَعْلَمْهُ اللَّهُ ۗ وَيَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Lā yattakhidhi l-muʾminūna l-kāfirīna awliyāʾa min dūni l-muʾminīn — wa-man yafʿal dhālika fa-laysa mina llāhi fī shayʾin illā an tattaqū minhum tuqāh — wa-yuḥadhdhirukumu llāhu nafsah — wa-ila llāhi l-maṣīr — qul in tukhfū mā fī ṣudūrikum aw tubdūhu yaʿlamhu llāh — wa-yaʿlamu mā fi l-samāwāti wa-mā fi l-arḍ — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: 'Que les croyants ne prennent pas les kāfirūn comme walī à la place des croyants — quiconque agit ainsi n''a plus rien avec Allaah — sauf si vous vous gardez d''eux par une réelle mise à l''abri. Allaah vous met en garde de Lui-même — et c''est vers Allaah qu''est le devenir. Dis : « Que vous dissimuliez ce qui est dans vos poitrines ou que vous le rendiez visible, Allaah le sait » — et Il sait ce qui est dans les cieux et ce qui est sur la terre. Allaah est capable de toute chose.'
- ref: S.3:30–32
  ar: يَوْمَ تَجِدُ كُلُّ نَفْسٍ مَّا عَمِلَتْ مِنْ خَيْرٍ مُّحْضَرًا وَمَا عَمِلَتْ مِن سُوءٍ تَوَدُّ لَوْ أَنَّ بَيْنَهَا وَبَيْنَهُ أَمَدًا بَعِيدًا ۗ وَيُحَذِّرُكُمُ اللَّهُ نَفْسَهُ ۗ وَاللَّهُ رَءُوفٌ بِالْعِبَادِ ۝ قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ ۗ وَاللَّهُ غَفُورٌ رَّحِيمٌ ۝ قُلْ أَطِيعُوا اللَّهَ وَالرَّسُولَ ۖ فَإِن تَوَلَّوْا فَإِنَّ اللَّهَ لَا يُحِبُّ الْكَافِرِينَ
  trl: Yawma tajidu kullu nafsin mā ʿamilat min khayrin muḥḍaran wa-mā ʿamilat min sūʾin tawaddu law anna baynahā wa-baynahu amadan baʿīdā — wa-yuḥadhdhirukumu llāhu nafsah — wa-llāhu Raʾūfun bi-l-ʿibād — qul in kuntum tuḥibbūna llāha fa-ttabiʿūnī yuḥbibkumu llāhu wa-yaghfir lakum dhunūbakum — wa-llāhu Ghafūrun Raḥīm — qul aṭīʿū llāha wa-l-rasūl — fa-in tawallaw fa-inna llāha lā yuḥibbu l-kāfirīn
  trad: 'Le jour où chaque nafs trouvera présent ce qu''elle a fait de bien, et ce qu''elle a fait de mal — elle voudrait qu''il y ait entre elle et cela une distance immense. Allaah vous met en garde de Lui-même. Allaah est Raʾūf envers les ʿibād. Dis : « Si vous aimez Allaah, suivez-moi, Allaah vous aimera et vous pardonnera vos fautes » — Allaah est Ghafūr, Raḥīm. Dis : « Obéissez à Allaah et au rasūl » — s''ils se détournent, Allaah n''honore pas les kāfirūn.'
- ref: S.3:33–34
  ar: إِنَّ ٱللَّهَ ٱصْطَفَىٰٓ ءَادَمَ وَنُوحًا وَءَالَ إِبْرَٰهِيمَ وَءَالَ عِمْرَٰنَ عَلَى ٱلْعَـٰلَمِينَ ۝ ذُرِّيَّةًۢ بَعْضُهَا مِنۢ بَعْضٍ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Inna llāha ṣṭafā Ādama wa-Nūḥan wa-Āla Ibrāhīma wa-Āla ʿImrāna ʿala l-ʿālamīn — dhurriyyatan baʿḍuhā min baʿḍ — wa-llāhu Samīʿun ʿAlīm
  trad: Allaah a élu Ādam, Nūḥ, la famille d'Ibrāhīm et la famille de ʿImrān, au-dessus des mondes — une descendance, les uns issus des autres — Allaah est Samīʿ, ʿAlīm.
- ref: S.3:35
  ar: إِذْ قَالَتِ ٱمْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّى نَذَرْتُ لَكَ مَا فِى بَطْنِى مُحَرَّرًا فَتَقَبَّلْ مِنِّىٓ ۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلْعَلِيمُ
  trl: Idh qālati mraʾatu ʿImrāna rabbi innī nadhartu laka mā fī baṭnī muḥarraran fa-taqabbal minnī — innaka anta l-Samīʿu l-ʿAlīm
  trad: 'Quand la femme de ʿImrān dit : « Mon Rabb, j''ai voué pour Toi ce qui est dans mon ventre, entièrement consacré — accepte-le donc de moi. C''est Toi, Toi, al-Samīʿ, al-ʿAlīm. »'
- ref: S.3:36
  ar: فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّى وَضَعْتُهَآ أُنثَىٰ وَٱللَّهُ أَعْلَمُ بِمَا وَضَعَتْ وَلَيْسَ ٱلذَّكَرُ كَٱلْأُنثَىٰ ۖ وَإِنِّى سَمَّيْتُهَا مَرْيَمَ وَإِنِّىٓ أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ ٱلشَّيْطَـٰنِ ٱلرَّجِيمِ
  trl: Fa-lammā waḍaʿathā qālat rabbi innī waḍaʿtuhā unthā wa-llāhu aʿlamu bi-mā waḍaʿat wa-laysa l-dhakaru ka-l-unthā — wa-innī sammaytuhā Maryama wa-innī uʿīdhuhā bika wa-dhurriyyatahā mina l-shayṭāni l-rajīm
  trad: 'Puis, quand elle l''eut mise au monde, elle dit : « Mon Rabb, je l''ai mise au monde, une fille » — et Allaah sait mieux ce qu''elle a mis au monde — « et le garçon n''est pas comme la fille — je l''ai nommée Maryam, et je la place sous Ta protection, elle et sa descendance, contre le shayṭān banni. »'
- ref: S.3:37
  ar: فَتَقَبَّلَهَا رَبُّهَا بِقَبُولٍ حَسَنٍ وَأَنۢبَتَهَا نَبَاتًا حَسَنًا وَكَفَّلَهَا زَكَرِيَّا ۖ كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا ٱلْمِحْرَابَ وَجَدَ عِندَهَا رِزْقًا ۖ قَالَ يَـٰمَرْيَمُ أَنَّىٰ لَكِ هَـٰذَا ۖ قَالَتْ هُوَ مِنْ عِندِ ٱللَّهِ ۖ إِنَّ ٱللَّهَ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍ
  trl: Fa-taqabbalahā Rabbuhā bi-qabūlin ḥasanin wa-anbatahā nabātan ḥasanan wa-kaffalahā Zakariyyā — kullamā dakhala ʿalayhā Zakariyyā l-miḥrāba wajada ʿindahā rizqan — qāla yā-Maryamu annā laki hādhā — qālat huwa min ʿindi llāh — inna llāha yarzuqu man yashāʾu bi-ghayri ḥisāb
  trad: 'Son Rabb l''accueillit d''un accueil digne, la fit croître d''une croissance digne, et en confia la charge à Zakariyyā — chaque fois que Zakariyyā entrait auprès d''elle dans al-miḥrāb, il y trouvait une provision — il dit : « Ô Maryam, d''où te vient cela ? » — elle dit : « Cela vient d''auprès d''Allaah — Allaah pourvoit qui Il veut, sans compte. »'
- ref: S.3:38
  ar: هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُۥ ۖ قَالَ رَبِّ هَبْ لِى مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ ٱلدُّعَآءِ
  trl: Hunālika daʿā Zakariyyā Rabbahu — qāla rabbi hab lī min ladunka dhurriyyatan ṭayyibatan — innaka Samīʿu l-duʿāʾ
  trad: 'Là, Zakariyyā invoqua son Rabb — il dit : « Mon Rabb, accorde-moi, de Ta part, une descendance ṭayyiba — c''est Toi qui entends l''invocation (al-duʿāʾ). »'
- ref: S.3:39
  ar: فَنَادَتْهُ ٱلْمَلَـٰٓئِكَةُ وَهُوَ قَآئِمٌ يُصَلِّى فِى ٱلْمِحْرَابِ أَنَّ ٱللَّهَ يُبَشِّرُكَ بِيَحْيَىٰ مُصَدِّقًۢا بِكَلِمَةٍ مِّنَ ٱللَّهِ وَسَيِّدًا وَحَصُورًا وَنَبِيًّا مِّنَ ٱلصَّـٰلِحِينَ
  trl: Fa-nādathu l-malāʾikatu wa-huwa qāʾimun yuṣallī fi l-miḥrābi anna llāha yubashshiruka bi-Yaḥyā muṣaddiqan bi-kalimatin mina llāhi wa-sayyidan wa-ḥaṣūran wa-nabiyyan mina l-ṣāliḥīn
  trad: 'Les malāʾika l''appelèrent, alors qu''il se tenait debout à accomplir la ṣalāt dans al-miḥrāb : « Allaah t''annonce Yaḥyā, confirmant une parole venue d''Allaah, notable, à la retenue totale, et nabī parmi les ṣāliḥūn. »'
- ref: S.3:40–41
  ar: قَالَ رَبِّ أَنَّىٰ يَكُونُ لِى غُلَـٰمٌ وَقَدْ بَلَغَنِىَ ٱلْكِبَرُ وَٱمْرَأَتِى عَاقِرٌ ۖ قَالَ كَذَٰلِكَ ٱللَّهُ يَفْعَلُ مَا يَشَآءُ ۝ قَالَ رَبِّ ٱجْعَل لِّىٓ ءَايَةً ۖ قَالَ ءَايَتُكَ أَلَّا تُكَلِّمَ ٱلنَّاسَ ثَلَـٰثَةَ أَيَّامٍ إِلَّا رَمْزًا ۗ وَٱذْكُر رَّبَّكَ كَثِيرًا وَسَبِّحْ بِٱلْعَشِىِّ وَٱلْإِبْكَـٰرِ
  trl: Qāla rabbi annā yakūnu lī ghulāmun wa-qad balaghaniya l-kibaru wa-mraʾatī ʿāqir — qāla ka-dhālika llāhu yafʿalu mā yashāʾ — qāla rabbi jʿal lī āyatan — qāla āyatuka allā tukallima l-nāsa thalāthata ayyāmin illā ramzan — wa-dhkur rabbaka kathīran wa-sabbiḥ bi-l-ʿashiyyi wa-l-ibkār
  trad: 'Il dit : « Mon Rabb, comment aurai-je un garçon, alors que la vieillesse m''a atteint et que ma femme est stérile ? » — Il dit : « Ainsi — Allaah fait ce qu''Il veut. » Il dit : « Mon Rabb, place pour moi un signe. » — Il dit : « Ton signe est que tu ne parleras pas aux gens pendant trois jours, sinon par geste — mentionne beaucoup ton Rabb, et déclare Sa transcendance (sabbiḥ) au soir et au matin. »'
- ref: S.3:42–43
  ar: وَإِذْ قَالَتِ ٱلْمَلَـٰٓئِكَةُ يَـٰمَرْيَمُ إِنَّ ٱللَّهَ ٱصْطَفَىٰكِ وَطَهَّرَكِ وَٱصْطَفَىٰكِ عَلَىٰ نِسَآءِ ٱلْعَـٰلَمِينَ ۝ يَـٰمَرْيَمُ ٱقْنُتِى لِرَبِّكِ وَٱسْجُدِى وَٱرْكَعِى مَعَ ٱلرَّٰكِعِينَ
  trl: Wa-idh qālati l-malāʾikatu yā-Maryamu inna llāha ṣṭafāki wa-ṭahharaki wa-ṣṭafāki ʿalā nisāʾi l-ʿālamīn — yā-Maryamu qnutī li-rabbiki wa-sjudī wa-rkaʿī maʿa l-rākiʿīn
  trad: 'Et quand les malāʾika dirent : « Ô Maryam, Allaah t''a élue et t''a purifiée, et t''a élue au-dessus des femmes des mondes. Ô Maryam, tiens-toi dans le qunūt pour ton Rabb, prosterne-toi et incline-toi avec ceux qui s''inclinent. »'
- ref: S.3:44
  ar: ذَٰلِكَ مِنْ أَنۢبَآءِ ٱلْغَيْبِ نُوحِيهِ إِلَيْكَ ۚ وَمَا كُنتَ لَدَيْهِمْ إِذْ يُلْقُونَ أَقْلَـٰمَهُمْ أَيُّهُمْ يَكْفُلُ مَرْيَمَ وَمَا كُنتَ لَدَيْهِمْ إِذْ يَخْتَصِمُونَ
  trl: Dhālika min anbāʾi l-ghaybi nūḥīhi ilayka — wa-mā kunta ladayhim idh yulqūna aqlāmahum ayyuhum yakfulu Maryama wa-mā kunta ladayhim idh yakhtaṣimūn
  trad: Cela fait partie des récits de l'ghayb que Nous te révélons — tu n'étais pas auprès d'eux quand ils jetaient leurs calames pour savoir lequel d'entre eux se chargerait de Maryam, et tu n'étais pas auprès d'eux quand ils se disputaient.
- ref: S.3:45–46
  ar: إِذْ قَالَتِ ٱلْمَلَـٰٓئِكَةُ يَـٰمَرْيَمُ إِنَّ ٱللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ ٱسْمُهُ ٱلْمَسِيحُ عِيسَى ٱبْنُ مَرْيَمَ وَجِيهًا فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمِنَ ٱلْمُقَرَّبِينَ ۝ وَيُكَلِّمُ ٱلنَّاسَ فِى ٱلْمَهْدِ وَكَهْلًا وَمِنَ ٱلصَّـٰلِحِينَ
  trl: Idh qālati l-malāʾikatu yā-Maryamu inna llāha yubashshiruki bi-kalimatin minhu smuhu l-Masīḥu ʿĪsā-bnu Maryama wajīhan fi l-dunyā wa-l-ākhirati wa-mina l-muqarrabīn — wa-yukallimu l-nāsa fi l-mahdi wa-kahlan wa-mina l-ṣāliḥīn
  trad: 'Quand les malāʾika dirent : « Ô Maryam, Allaah t''annonce une parole venue de Lui, dont le nom est al-Masīḥ, ʿĪsā fils de Maryam, éminent dans ce monde et dans l''ākhira, et parmi les rapprochés. Il parlera aux gens depuis le berceau et à l''âge mûr, et il sera parmi les ṣāliḥūn. »'
- ref: S.3:47
  ar: قَالَتْ رَبِّ أَنَّىٰ يَكُونُ لِى وَلَدٌ وَلَمْ يَمْسَسْنِى بَشَرٌ ۖ قَالَ كَذَٰلِكِ ٱللَّهُ يَخْلُقُ مَا يَشَآءُ ۚ إِذَا قَضَىٰٓ أَمْرًا فَإِنَّمَا يَقُولُ لَهُۥ كُن فَيَكُونُ
  trl: Qālat rabbi annā yakūnu lī waladun wa-lam yamsasnī bashar — qāla ka-dhāliki llāhu yakhluqu mā yashāʾ — idhā qaḍā amran fa-innamā yaqūlu lahu kun fa-yakūn
  trad: 'Elle dit : « Mon Rabb, comment aurai-je un enfant, alors qu''aucun être humain (bashar) ne m''a touchée ? » — Il dit : « Ainsi — Allaah crée ce qu''Il veut ; quand Il décide d''une chose, Il lui dit seulement : ‹ Sois › — et elle est. »'
- ref: S.3:48–50
  ar: وَيُعَلِّمُهُ ٱلْكِتَـٰبَ وَٱلْحِكْمَةَ وَٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ ۝ وَرَسُولًا إِلَىٰ بَنِىٓ إِسْرَٰٓءِيلَ أَنِّى قَدْ جِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ ۖ أَنِّىٓ أَخْلُقُ لَكُم مِّنَ ٱلطِّينِ كَهَيْـَٔةِ ٱلطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًۢا بِإِذْنِ ٱللَّهِ ۖ وَأُبْرِئُ ٱلْأَكْمَهَ وَٱلْأَبْرَصَ وَأُحْىِ ٱلْمَوْتَىٰ بِإِذْنِ ٱللَّهِ ۖ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِى بُيُوتِكُمْ ۚ إِنَّ فِى ذَٰلِكَ لَـَٔايَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ ۝ وَمُصَدِّقًا لِّمَا بَيْنَ يَدَىَّ مِنَ ٱلتَّوْرَىٰةِ وَلِأُحِلَّ لَكُم بَعْضَ ٱلَّذِى حُرِّمَ عَلَيْكُمْ ۚ وَجِئْتُكُم بِـَٔايَةٍ مِّن رَّبِّكُمْ فَٱتَّقُوا۟ ٱللَّهَ وَأَطِيعُونِ
  trl: Wa-yuʿallimuhu l-kitāba wa-l-ḥikmata wa-l-tawrāta wa-l-injīl — wa-rasūlan ilā banī Isrāʾīla annī qad jiʾtukum bi-āyatin min rabbikum — annī akhluqu lakum mina l-ṭīni ka-hayʾati l-ṭayri fa-anfukhu fīhi fa-yakūnu ṭayran bi-idhni llāh — wa-ubriʾu l-akmaha wa-l-abraṣa wa-uḥyi l-mawtā bi-idhni llāh — wa-unabbiʾukum bi-mā taʾkulūna wa-mā taddakhirūna fī buyūtikum — inna fī dhālika la-āyatan lakum in kuntum muʾminīn — wa-muṣaddiqan li-mā bayna yadayya mina l-tawrāti wa-li-uḥilla lakum baʿḍa lladhī ḥurrima ʿalaykum — wa-jiʾtukum bi-āyatin min rabbikum fa-ttaqū llāha wa-aṭīʿūn
  trad: 'Et Il lui enseigne le Kitāb, la ḥikma, la Tawrāh et l''Injīl — et comme rasūl envers les Banū Isrāʾīl : « Je vous ai apporté un signe venant de votre Rabb — je façonne pour vous, à partir de l''argile, une forme d''oiseau, puis j''y souffle et elle devient un oiseau, par la permission d''Allaah — je guéris l''aveugle-né et le lépreux, et je redonne vie aux morts, par la permission d''Allaah — et je vous informe de ce que vous mangez et de ce que vous amassez dans vos maisons. En cela, il y a certes un signe pour vous, si vous êtes muʾminūn — et confirmant ce qui, de la Tawrāh, est entre mes mains — et pour rendre licite pour vous une partie de ce qui vous était interdit — je vous ai apporté un signe venant de votre Rabb ; constituez-vous donc une taqwā d''Allaah et obéissez-moi. »'
- ref: S.3:51
  ar: إِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۗ هَـٰذَا صِرَٰطٌ مُّسْتَقِيمٌ
  trl: Inna llāha rabbī wa-rabbukum fa-ʿbudūhu — hādhā ṣirāṭun mustaqīm
  trad: Allaah est mon Rabb et votre Rabb ; servez-Le donc. Voilà un chemin droit.
- ref: S.3:52–53
  ar: ۞ فَلَمَّآ أَحَسَّ عِيسَىٰ مِنْهُمُ ٱلْكُفْرَ قَالَ مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ ۖ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ أَنصَارُ ٱللَّهِ ءَامَنَّا بِٱللَّهِ وَٱشْهَدْ بِأَنَّا مُسْلِمُونَ ۝ رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَٱتَّبَعْنَا ٱلرَّسُولَ فَٱكْتُبْنَا مَعَ ٱلشَّـٰهِدِينَ
  trl: Fa-lammā aḥassa ʿĪsā minhumu l-kufra qāla man anṣārī ila llāh — qāla l-ḥawāriyyūna naḥnu anṣāru llāhi āmannā bi-llāhi wa-shhad bi-annā muslimūn — rabbanā āmannā bi-mā anzalta wa-ttabaʿnā l-rasūla fa-ktubnā maʿa l-shāhidīn
  trad: 'Puis, quand ʿĪsā perçut chez eux le kufr, il dit : « Qui sont mes secoureurs vers Allaah ? » — les ḥawāriyyūn dirent : « Nous sommes les secoureurs d''Allaah, nous avons cru en Allaah, et atteste que nous sommes muslimūn. Notre Rabb, nous avons cru en ce que Tu as fait descendre, et nous avons suivi le rasūl — inscris-nous donc parmi les témoins (al-shāhidīn). »'
- ref: S.3:54
  ar: وَمَكَرُوا۟ وَمَكَرَ ٱللَّهُ ۖ وَٱللَّهُ خَيْرُ ٱلْمَـٰكِرِينَ
  trl: Wa-makarū wa-makara llāhu wa-llāhu khayru l-mākirīn
  trad: Ils ont usé de manœuvre, et Allaah a usé de manœuvre — Allaah est le meilleur en matière de manœuvre.
- ref: S.3:55
  ar: إِذْ قَالَ ٱللَّهُ يَـٰعِيسَىٰٓ إِنِّى مُتَوَفِّيكَ وَرَافِعُكَ إِلَىَّ وَمُطَهِّرُكَ مِنَ ٱلَّذِينَ كَفَرُوا۟ وَجَاعِلُ ٱلَّذِينَ ٱتَّبَعُوكَ فَوْقَ ٱلَّذِينَ كَفَرُوٓا۟ إِلَىٰ يَوْمِ ٱلْقِيَـٰمَةِ ۖ ثُمَّ إِلَىَّ مَرْجِعُكُمْ فَأَحْكُمُ بَيْنَكُمْ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَ
  trl: Idh qāla llāhu yā-ʿĪsā innī mutawaffīka wa-rāfiʿuka ilayya wa-muṭahhiruka mina lladhīna kafarū wa-jāʿilu lladhīna ttabaʿūka fawqa lladhīna kafarū ilā yawmi l-qiyāmati — thumma ilayya marjiʿukum fa-aḥkumu baynakum fīmā kuntum fīhi takhtalifūn
  trad: 'Quand Allaah dit : « Ô ʿĪsā, Je te reprends en pleine mesure, et Je t''élève vers Moi, et Je te purifie de ceux qui sont kāfirūn, et Je place ceux qui t''ont suivi au-dessus de ceux qui sont kāfirūn, jusqu''au Jour de la Résurrection — puis c''est vers Moi votre retour, et Je jugerai entre vous sur ce en quoi vous divergiez. »'
- ref: S.3:56–57
  ar: فَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَأُعَذِّبُهُمْ عَذَابًا شَدِيدًا فِى ٱلدُّنْيَا وَٱلْـَٔاخِرَةِ وَمَا لَهُم مِّن نَّـٰصِرِينَ ۝ وَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ فَيُوَفِّيهِمْ أُجُورَهُمْ ۗ وَٱللَّهُ لَا يُحِبُّ ٱلظَّـٰلِمِينَ
  trl: Fa-ammā lladhīna kafarū fa-uʿadhdhibuhum ʿadhāban shadīdan fi l-dunyā wa-l-ākhirati wa-mā lahum min nāṣirīn — wa-ammā lladhīna āmanū wa-ʿamilū l-ṣāliḥāti fa-yuwaffīhim ujūrahum — wa-llāhu lā yuḥibbu l-ẓālimīn
  trad: Quant à ceux qui sont kāfirūn, Je les châtierai d'un châtiment sévère, dans ce monde et dans l'ākhira, et ils n'auront aucun secoureur. Quant à ceux qui ont cru et ont accompli les œuvres ṣāliḥa, Il leur rendra intégralement leurs rétributions — Allaah n'aime pas les ẓālimūn.
- ref: S.3:58
  ar: ذَٰلِكَ نَتْلُوهُ عَلَيْكَ مِنَ ٱلْـَٔايَـٰتِ وَٱلذِّكْرِ ٱلْحَكِيمِ
  trl: Dhālika natlūhu ʿalayka mina l-āyāti wa-l-dhikri l-ḥakīm
  trad: Cela, Nous te le récitons, parmi les āyāt et le dhikr empreint de justesse.
- ref: S.3:59–60
  ar: إِنَّ مَثَلَ عِيسَىٰ عِندَ ٱللَّهِ كَمَثَلِ ءَادَمَ ۖ خَلَقَهُۥ مِن تُرَابٍ ثُمَّ قَالَ لَهُۥ كُن فَيَكُونُ ۝ ٱلْحَقُّ مِن رَّبِّكَ فَلَا تَكُن مِّنَ ٱلْمُمْتَرِينَ
  trl: Inna mathala ʿĪsā ʿinda llāhi ka-mathali Ādama — khalaqahu min turābin thumma qāla lahu kun fa-yakūn — al-ḥaqqu min rabbika fa-lā takun mina l-mumtarīn
  trad: 'L''exemple d''ʿĪsā, dans le registre d''Allaah, est comme l''exemple d''Ādam : Il le créa de terre, puis Il lui dit : « Sois » — et il fut. Le ḥaqq vient de ton Rabb ; ne sois donc pas parmi ceux qui doutent.'
- ref: S.3:61
  ar: فَمَنْ حَآجَّكَ فِيهِ مِنۢ بَعْدِ مَا جَآءَكَ مِنَ ٱلْعِلْمِ فَقُلْ تَعَالَوْا۟ نَدْعُ أَبْنَآءَنَا وَأَبْنَآءَكُمْ وَنِسَآءَنَا وَنِسَآءَكُمْ وَأَنفُسَنَا وَأَنفُسَكُمْ ثُمَّ نَبْتَهِلْ فَنَجْعَل لَّعْنَتَ ٱللَّهِ عَلَى ٱلْكَـٰذِبِينَ
  trl: Fa-man ḥājjaka fīhi min baʿdi mā jāʾaka mina l-ʿilmi fa-qul taʿālaw nadʿu abnāʾanā wa-abnāʾakum wa-nisāʾanā wa-nisāʾakum wa-anfusanā wa-anfusakum thumma nabtahil fa-najʿal laʿnata llāhi ʿalā l-kādhibīn
  trad: 'Quiconque argumente avec toi à ce sujet, après que le savoir te soit parvenu, dis alors : « Venez, appelons nos fils et vos fils, nos femmes et vos femmes, nous-mêmes et vous-mêmes, puis invoquons ensemble avec ferveur, et plaçons la malédiction d''Allaah sur les menteurs. »'
- ref: S.3:62–63
  ar: إِنَّ هَـٰذَا لَهُوَ ٱلْقَصَصُ ٱلْحَقُّ ۚ وَمَا مِنْ إِلَـٰهٍ إِلَّا ٱللَّهُ ۚ وَإِنَّ ٱللَّهَ لَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ ۝ فَإِن تَوَلَّوْا۟ فَإِنَّ ٱللَّهَ عَلِيمٌۢ بِٱلْمُفْسِدِينَ
  trl: Inna hādhā la-huwa l-qaṣaṣu l-ḥaqq — wa-mā min ilāhin illā llāh — wa-inna llāha la-huwa l-ʿAzīzu l-Ḥakīm — fa-in tawallaw fa-inna llāha ʿAlīmun bi-l-mufsidīn
  trad: Ceci est certes le qaṣaṣ véridique — il n'y a nul ilāh sinon Allaah — et Allaah est certes al-ʿAzīz, al-Ḥakīm. S'ils se détournent, alors Allaah connaît parfaitement les mufsidūn.
- ref: S.3:64
  ar: قُلْ يَـٰٓأَهْلَ ٱلْكِتَـٰبِ تَعَالَوْا۟ إِلَىٰ كَلِمَةٍ سَوَآءٍۭ بَيْنَنَا وَبَيْنَكُمْ أَلَّا نَعْبُدَ إِلَّا ٱللَّهَ وَلَا نُشْرِكَ بِهِۦ شَيْـًٔا وَلَا يَتَّخِذَ بَعْضُنَا بَعْضًا أَرْبَابًا مِّن دُونِ ٱللَّهِ ۚ فَإِن تَوَلَّوْا۟ فَقُولُوا۟ ٱشْهَدُوا۟ بِأَنَّا مُسْلِمُونَ
  trl: Qul yā-ahla l-kitābi taʿālaw ilā kalimatin sawāʾin baynanā wa-baynakum allā naʿbuda illā llāha wa-lā nushrika bihi shayʾan wa-lā yattakhidha baʿḍunā baʿḍan arbāban min dūni llāh — fa-in tawallaw fa-qūlū shhadū bi-annā muslimūn
  trad: 'Dis : « Ô Ahl al-Kitāb, venez à une parole commune entre nous et vous : que nous ne servions qu''Allaah, que nous ne Lui associions rien, et qu''aucun de nous ne prenne les autres comme arbāb en dehors d''Allaah. » S''ils se détournent, dites alors : « Attestez que nous sommes muslimūn. »'
- ref: S.3:65–66
  ar: يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تُحَآجُّونَ فِىٓ إِبْرَٰهِيمَ وَمَآ أُنزِلَتِ ٱلتَّوْرَىٰةُ وَٱلْإِنجِيلُ إِلَّا مِنۢ بَعْدِهِۦٓ ۚ أَفَلَا تَعْقِلُونَ ۝ هَـٰٓأَنتُمْ هَـٰٓؤُلَآءِ حَـٰجَجْتُمْ فِيمَا لَكُم بِهِۦ عِلْمٌ فَلِمَ تُحَآجُّونَ فِيمَا لَيْسَ لَكُم بِهِۦ عِلْمٌ ۚ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ
  trl: Yā-ahla l-kitābi lima tuḥājjūna fī Ibrāhīma wa-mā unzilati l-tawrātu wa-l-injīlu illā min baʿdihi — a-fa-lā taʿqilūn — hā-antum hāʾulāʾi ḥājajtum fīmā lakum bihi ʿilmun fa-lima tuḥājjūna fīmā laysa lakum bihi ʿilm — wa-llāhu yaʿlamu wa-antum lā taʿlamūn
  trad: Ô Ahl al-Kitāb, pourquoi argumentez-vous au sujet d'Ibrāhīm, alors que la Tawrāh et l'Injīl ne sont descendues qu'après lui ? Ne raisonnez-vous donc pas ? Vous voilà, vous avez argumenté sur ce dont vous avez connaissance — pourquoi argumentez-vous sur ce dont vous n'avez pas connaissance ? Allaah sait, et vous ne savez pas.
- ref: S.3:67
  ar: مَا كَانَ إِبْرَٰهِيمُ يَهُودِيًّا وَلَا نَصْرَانِيًّا وَلَـٰكِن كَانَ حَنِيفًا مُّسْلِمًا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ
  trl: Mā kāna Ibrāhīmu yahūdiyyan wa-lā naṣrāniyyan wa-lākin kāna ḥanīfan musliman wa-mā kāna mina l-mushrikīn
  trad: Ibrāhīm n'était ni juif ni naṣrānī, mais il était ḥanīf, muslim — et il n'était pas parmi les mushrikūn.
- ref: S.3:68
  ar: إِنَّ أَوْلَى ٱلنَّاسِ بِإِبْرَٰهِيمَ لَلَّذِينَ ٱتَّبَعُوهُ وَهَـٰذَا ٱلنَّبِىُّ وَٱلَّذِينَ ءَامَنُوا۟ ۗ وَٱللَّهُ وَلِىُّ ٱلْمُؤْمِنِينَ
  trl: Inna awla l-nāsi bi-Ibrāhīma la-lladhīna ttabaʿūhu wa-hādhā l-nabiyyu wa-lladhīna āmanū — wa-llāhu waliyyu l-muʾminīn
  trad: Les gens les plus proches d'Ibrāhīm sont certes ceux qui l'ont suivi, ainsi que ce nabī et ceux qui ont cru — Allaah est le walī des muʾminūn.
- ref: S.3:69
  ar: وَدَّت طَّآئِفَةٌ مِّنْ أَهْلِ ٱلْكِتَـٰبِ لَوْ يُضِلُّونَكُمْ وَمَا يُضِلُّونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَ
  trl: Waddat ṭāʾifatun min ahli l-kitābi law yuḍillūnakum wa-mā yuḍillūna illā anfusahum wa-mā yashʿurūn
  trad: Une partie des Ahl al-Kitāb aurait voulu vous égarer — mais ils n'égarent qu'eux-mêmes, sans en avoir conscience.
- ref: S.3:70–71
  ar: يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَكْفُرُونَ بِـَٔايَـٰتِ ٱللَّهِ وَأَنتُمْ تَشْهَدُونَ ۝ يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَلْبِسُونَ ٱلْحَقَّ بِٱلْبَـٰطِلِ وَتَكْتُمُونَ ٱلْحَقَّ وَأَنتُمْ تَعْلَمُونَ
  trl: Yā-ahla l-kitābi lima takfurūna bi-āyāti llāhi wa-antum tashhadūn — yā-ahla l-kitābi lima talbisūna l-ḥaqqa bi-l-bāṭili wa-taktumūna l-ḥaqqa wa-antum taʿlamūn
  trad: Ô Ahl al-Kitāb, pourquoi refusez-vous de reconnaître les āyāt d'Allaah, alors que vous en êtes témoins ? Ô Ahl al-Kitāb, pourquoi habillez-vous le ḥaqq du bāṭil, et dissimulez-vous le ḥaqq, alors que vous savez ?
- ref: S.3:72
  ar: وَقَالَت طَّآئِفَةٌ مِّنْ أَهْلِ ٱلْكِتَـٰبِ ءَامِنُوا۟ بِٱلَّذِىٓ أُنزِلَ عَلَى ٱلَّذِينَ ءَامَنُوا۟ وَجْهَ ٱلنَّهَارِ وَٱكْفُرُوٓا۟ ءَاخِرَهُۥ لَعَلَّهُمْ يَرْجَعُونَ
  trl: Wa-qālat ṭāʾifatun min ahli l-kitābi āminū bi-lladhī unzila ʿala lladhīna āmanū wajha l-nahāri wa-kfurū ākhirahu laʿallahum yarjiʿūn
  trad: 'Une partie des Ahl al-Kitāb dit : « Croyez à ce qui est descendu sur ceux qui ont cru, au début du jour, et soyez kāfirūn à sa fin — peut-être reviendront-ils [sur leur foi]. »'
- ref: S.3:73–74
  ar: وَلَا تُؤْمِنُوٓا۟ إِلَّا لِمَن تَبِعَ دِينَكُمْ قُلْ إِنَّ ٱلْهُدَىٰ هُدَى ٱللَّهِ أَن يُؤْتَىٰٓ أَحَدٌ مِّثْلَ مَآ أُوتِيتُمْ أَوْ يُحَآجُّوكُمْ عِندَ رَبِّكُمْ ۗ قُلْ إِنَّ ٱلْفَضْلَ بِيَدِ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ ۝ يَخْتَصُّ بِرَحْمَتِهِۦ مَن يَشَآءُ ۗ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ
  trl: Wa-lā tuʾminū illā li-man tabiʿa dīnakum qul inna l-hudā hudā llāhi an yuʾtā aḥadun mithla mā ūtītum aw yuḥājjūkum ʿinda rabbikum — qul inna l-faḍla bi-yadi llāhi yuʾtīhi man yashāʾ — wa-llāhu wāsiʿun ʿalīm — yakhtaṣṣu bi-raḥmatihi man yashāʾ — wa-llāhu dhū l-faḍli l-ʿaẓīm
  trad: '« Et ne croyez qu''en celui qui suit votre dīn » — dis : « Le guide est le guide d''Allaah » — [ils redoutent] qu''un autre reçoive comme ce que vous avez reçu, ou qu''ils argumentent contre vous auprès de votre Rabb. Dis : « Le faḍl est dans la Yad d''Allaah, Il le donne à qui Il veut — Allaah est Wāsiʿ, ʿAlīm. » Il réserve Sa raḥma à qui Il veut — Allaah est doté d''un faḍl immense.'
  notes:
    - bloc: bloc3
      anchor: yad-s3-73
      label: "« Yad » conservé en translittération — note de méthode"
- ref: S.3:75
  ar: وَمِنْ أَهْلِ ٱلْكِتَـٰبِ مَنْ إِن تَأْمَنْهُ بِقِنطَارٍ يُؤَدِّهِۦٓ إِلَيْكَ وَمِنْهُم مَّنْ إِن تَأْمَنْهُ بِدِينَارٍ لَّا يُؤَدِّهِۦٓ إِلَيْكَ إِلَّا مَا دُمْتَ عَلَيْهِ قَآئِمًا ۗ ذَٰلِكَ بِأَنَّهُمْ قَالُوا۟ لَيْسَ عَلَيْنَا فِى ٱلْأُمِّيِّـۧنَ سَبِيلٌ وَيَقُولُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ وَهُمْ يَعْلَمُونَ
  trl: Wa-min ahli l-kitābi man in taʾmanhu bi-qinṭārin yuʾaddihi ilayka wa-minhum man in taʾmanhu bi-dīnārin lā yuʾaddihi ilayka illā mā dumta ʿalayhi qāʾiman — dhālika bi-annahum qālū laysa ʿalaynā fi l-ummiyyīna sabīlun wa-yaqūlūna ʿala llāhi l-kadhiba wa-hum yaʿlamūn
  trad: 'Parmi les Ahl al-Kitāb, il en est qui, si tu lui confies un qinṭār, te le rend — et il en est qui, si tu lui confies un dīnār, ne te le rend pas, sauf si tu restes sans relâche à le réclamer. Cela, parce qu''ils ont dit : « Il n''y a pour nous aucune voie [de reproche] à l''égard des ummiyyīn » — et ils disent le mensonge sur Allaah, alors qu''ils savent.'
- ref: S.3:76–77
  ar: بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِۦ وَٱتَّقَىٰ فَإِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَّقِينَ ۝ إِنَّ ٱلَّذِينَ يَشْتَرُونَ بِعَهْدِ ٱللَّهِ وَأَيْمَـٰنِهِمْ ثَمَنًا قَلِيلًا أُو۟لَـٰٓئِكَ لَا خَلَـٰقَ لَهُمْ فِى ٱلْـَٔاخِرَةِ وَلَا يُكَلِّمُهُمُ ٱللَّهُ وَلَا يَنظُرُ إِلَيْهِمْ يَوْمَ ٱلْقِيَـٰمَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Balā man awfā bi-ʿahdihi wa-ttaqā fa-inna llāha yuḥibbu l-muttaqīn — inna lladhīna yashtarūna bi-ʿahdi llāhi wa-aymānihim thamanan qalīlan ulāʾika lā khalāqa lahum fi l-ākhirati wa-lā yukallimuhumu llāhu wa-lā yanẓuru ilayhim yawma l-qiyāmati wa-lā yuzakkīhim wa-lahum ʿadhābun alīm
  trad: 'Bien au contraire : quiconque est fidèle à son engagement et se constitue une taqwā — Allaah aime les muttaqūn. Ceux qui échangent l''engagement d''Allaah et leurs serments contre un prix dérisoire, ceux-là n''ont aucune part dans l''ākhira — Allaah ne leur parlera pas et ne les regardera pas au Jour de la Résurrection, ne les purifiera pas — et pour eux, un châtiment douloureux.'
- ref: S.3:78
  ar: وَإِنَّ مِنْهُمْ لَفَرِيقًا يَلْوُۥنَ أَلْسِنَتَهُم بِٱلْكِتَـٰبِ لِتَحْسَبُوهُ مِنَ ٱلْكِتَـٰبِ وَمَا هُوَ مِنَ ٱلْكِتَـٰبِ وَيَقُولُونَ هُوَ مِنْ عِندِ ٱللَّهِ وَمَا هُوَ مِنْ عِندِ ٱللَّهِ وَيَقُولُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ وَهُمْ يَعْلَمُونَ
  trl: Wa-inna minhum la-farīqan yalwūna alsinatahum bi-l-kitābi li-taḥsabūhu mina l-kitābi wa-mā huwa mina l-kitābi wa-yaqūlūna huwa min ʿindi llāhi wa-mā huwa min ʿindi llāhi wa-yaqūlūna ʿala llāhi l-kadhiba wa-hum yaʿlamūn
  trad: 'Et parmi eux, il y a certes un groupe qui tord sa langue avec le Kitāb, pour que vous le comptiez comme faisant partie du Kitāb, alors qu''il n''en fait pas partie — et ils disent : « Cela vient d''auprès d''Allaah », alors que cela ne vient pas d''auprès d''Allaah — et ils disent le mensonge sur Allaah, alors qu''ils savent.'
- ref: S.3:79
  ar: مَا كَانَ لِبَشَرٍ أَن يُؤْتِيَهُ ٱللَّهُ ٱلْكِتَـٰبَ وَٱلْحُكْمَ وَٱلنُّبُوَّةَ ثُمَّ يَقُولَ لِلنَّاسِ كُونُوا۟ عِبَادًا لِّى مِن دُونِ ٱللَّهِ وَلَـٰكِن كُونُوا۟ رَبَّـٰنِيِّـۧنَ بِمَا كُنتُمْ تُعَلِّمُونَ ٱلْكِتَـٰبَ وَبِمَا كُنتُمْ تَدْرُسُونَ
  trl: Mā kāna li-basharin an yuʾtiyahu llāhu l-kitāba wa-l-ḥukma wa-l-nubuwwata thumma yaqūla li-l-nāsi kūnū ʿibādan lī min dūni llāhi wa-lākin kūnū rabbāniyyīna bi-mā kuntum tuʿallimūna l-kitāba wa-bi-mā kuntum tadrusūn
  trad: 'Il n''appartient à aucun être humain à qui Allaah aurait donné le Kitāb, le ḥukm et la nubuwwa, de dire ensuite aux gens : « Soyez des ʿibād pour moi, en dehors d''Allaah » — mais plutôt : « Soyez des rabbāniyyūn, par ce que vous enseignez du Kitāb et par ce que vous étudiez. »'
- ref: S.3:80
  ar: وَلَا يَأْمُرَكُمْ أَن تَتَّخِذُوا۟ ٱلْمَلَـٰٓئِكَةَ وَٱلنَّبِيِّـۧنَ أَرْبَابًا ۗ أَيَأْمُرُكُم بِٱلْكُفْرِ بَعْدَ إِذْ أَنتُم مُّسْلِمُونَ
  trl: Wa-lā yaʾmurakum an tattakhidhū l-malāʾikata wa-l-nabiyyīna arbāban — a-yaʾmurukum bi-l-kufri baʿda idh antum muslimūn
  trad: Et il ne vous ordonne pas de prendre les malāʾika et les nabiyyūn comme arbāb — vous ordonnerait-il le kufr après que vous êtes muslimūn ?
- ref: S.3:81
  ar: وَإِذْ أَخَذَ ٱللَّهُ مِيثَـٰقَ ٱلنَّبِيِّـۧنَ لَمَآ ءَاتَيْتُكُم مِّن كِتَـٰبٍ وَحِكْمَةٍ ثُمَّ جَآءَكُمْ رَسُولٌ مُّصَدِّقٌ لِّمَا مَعَكُمْ لَتُؤْمِنُنَّ بِهِۦ وَلَتَنصُرُنَّهُۥ ۚ قَالَ ءَأَقْرَرْتُمْ وَأَخَذْتُمْ عَلَىٰ ذَٰلِكُمْ إِصْرِى ۖ قَالُوٓا۟ أَقْرَرْنَا ۚ قَالَ فَٱشْهَدُوا۟ وَأَنَا۠ مَعَكُم مِّنَ ٱلشَّـٰهِدِينَ
  trl: Wa-idh akhadha llāhu mīthāqa l-nabiyyīna lamā ātaytukum min kitābin wa-ḥikmatin thumma jāʾakum rasūlun muṣaddiqun li-mā maʿakum la-tuʾminunna bihi wa-la-tanṣurunnahu — qāla a-aqrartum wa-akhadhtum ʿalā dhālikum iṣrī — qālū aqrarnā — qāla fa-shhadū wa-ana maʿakum mina l-shāhidīn
  trad: 'Et quand Allaah prit l''engagement des nabiyyūn : « Ce que Je vous ai donné de Kitāb et de ḥikma, puis un rasūl venant confirmer ce qui est avec vous — vous devrez certainement croire en lui et le secourir. » Il dit : « Avez-vous reconnu, et pris sur cela Mon engagement contraignant ? » Ils dirent : « Nous avons reconnu. » Il dit : « Attestez donc, et Je suis avec vous parmi les témoins. »'
- ref: S.3:82
  ar: فَمَن تَوَلَّىٰ بَعْدَ ذَٰلِكَ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْفَـٰسِقُونَ
  trl: Fa-man tawallā baʿda dhālika fa-ulāʾika humu l-fāsiqūn
  trad: Quiconque se détourne après cela, ceux-là sont les fāsiqūn.
- ref: S.3:83
  ar: أَفَغَيْرَ دِينِ ٱللَّهِ يَبْغُونَ وَلَهُۥٓ أَسْلَمَ مَن فِى ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ طَوْعًا وَكَرْهًا وَإِلَيْهِ يُرْجَعُونَ
  trl: A-fa-ghayra dīni llāhi yabghūna wa-lahu aslama man fi l-samāwāti wa-l-arḍi ṭawʿan wa-karhan wa-ilayhi yurjaʿūn
  trad: Rechercheraient-ils un dīn autre que celui d'Allaah, alors que c'est à Lui que s'est remis tout ce qui est dans les cieux et sur la terre, de gré ou de force, et c'est vers Lui qu'ils retournent ?
- ref: S.3:84–85
  ar: قُلْ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ عَلَيْنَا وَمَآ أُنزِلَ عَلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَـٰعِيلَ وَإِسْحَـٰقَ وَيَعْقُوبَ وَٱلْأَسْبَاطِ وَمَآ أُوتِىَ مُوسَىٰ وَعِيسَىٰ وَٱلنَّبِيُّونَ مِن رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْهُمْ وَنَحْنُ لَهُۥ مُسْلِمُونَ ۝ وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَـٰمِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْـَٔاخِرَةِ مِنَ ٱلْخَـٰسِرِينَ
  trl: Qul āmannā bi-llāhi wa-mā unzila ʿalaynā wa-mā unzila ʿalā Ibrāhīma wa-Ismāʿīla wa-Isḥāqa wa-Yaʿqūba wa-l-asbāṭi wa-mā ūtiya Mūsā wa-ʿĪsā wa-l-nabiyyūna min rabbihim lā nufarriqu bayna aḥadin minhum wa-naḥnu lahu muslimūn — wa-man yabtaghi ghayra l-islāmi dīnan fa-lan yuqbala minhu wa-huwa fi l-ākhirati mina l-khāsirīn
  trad: 'Dis : « Nous avons cru en Allaah, en ce qui est descendu sur nous, en ce qui est descendu sur Ibrāhīm, Ismāʿīl, Isḥāq, Yaʿqūb et les asbāṭ, en ce qui a été donné à Mūsā, à ʿĪsā et aux nabiyyūn, venant de leur Rabb — nous ne distinguons pas entre eux, et nous Lui sommes muslimūn. » Et quiconque recherche un dīn autre que al-islām, cela ne sera jamais accepté de lui, et il sera, dans l''ākhira, parmi les perdants.'
- ref: S.3:86–89
  ar: كَيْفَ يَهْدِى ٱللَّهُ قَوْمًا كَفَرُوا۟ بَعْدَ إِيمَـٰنِهِمْ وَشَهِدُوٓا۟ أَنَّ ٱلرَّسُولَ حَقٌّ وَجَآءَهُمُ ٱلْبَيِّنَـٰتُ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّـٰلِمِينَ ۝ أُو۟لَـٰٓئِكَ جَزَآؤُهُمْ أَنَّ عَلَيْهِمْ لَعْنَةَ ٱللَّهِ وَٱلْمَلَـٰٓئِكَةِ وَٱلنَّاسِ أَجْمَعِينَ ۝ خَـٰلِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ ٱلْعَذَابُ وَلَا هُمْ يُنظَرُونَ ۝ إِلَّا ٱلَّذِينَ تَابُوا۟ مِنۢ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Kayfa yahdi llāhu qawman kafarū baʿda īmānihim wa-shahidū anna l-rasūla ḥaqqun wa-jāʾahumu l-bayyinātu — wa-llāhu lā yahdi l-qawma l-ẓālimīn — ulāʾika jazāʾuhum anna ʿalayhim laʿnata llāhi wa-l-malāʾikati wa-l-nāsi ajmaʿīn — khālidīna fīhā lā yukhaffafu ʿanhumu l-ʿadhābu wa-lā hum yunẓarūn — illā lladhīna tābū min baʿdi dhālika wa-aṣlaḥū fa-inna llāha Ghafūrun Raḥīm
  trad: 'Comment Allaah guiderait-Il des gens qui ont refusé de reconnaître après avoir cru, après avoir attesté que le rasūl est ḥaqq, et après que les bayyināt leur sont parvenues ? Allaah ne guide pas les gens ẓālimūn. Ceux-là, leur rétribution est que pèse sur eux la malédiction d''Allaah, des malāʾika et de tous les gens réunis — ils y demeurent, le châtiment ne leur sera pas allégé, et aucun répit ne leur sera accordé — sauf ceux qui reviennent après cela et se réforment : Allaah est certes Ghafūr, Raḥīm.'
- ref: S.3:90–91
  ar: إِنَّ ٱلَّذِينَ كَفَرُوا۟ بَعْدَ إِيمَـٰنِهِمْ ثُمَّ ٱزْدَادُوا۟ كُفْرًا لَّن تُقْبَلَ تَوْبَتُهُمْ وَأُو۟لَـٰٓئِكَ هُمُ ٱلضَّآلُّونَ ۝ إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَمَاتُوا۟ وَهُمْ كُفَّارٌ فَلَن يُقْبَلَ مِنْ أَحَدِهِم مِّلْءُ ٱلْأَرْضِ ذَهَبًا وَلَوِ ٱفْتَدَىٰ بِهِۦٓ ۗ أُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ أَلِيمٌ وَمَا لَهُم مِّن نَّـٰصِرِينَ
  trl: Inna lladhīna kafarū baʿda īmānihim thumma zdādū kufran lan tuqbala tawbatuhum wa-ulāʾika humu l-ḍāllūn — inna lladhīna kafarū wa-mātū wa-hum kuffārun fa-lan yuqbala min aḥadihim milʾu l-arḍi dhahaban wa-law iftadā bihi — ulāʾika lahum ʿadhābun alīmun wa-mā lahum min nāṣirīn
  trad: Ceux qui ont refusé de reconnaître après avoir cru, puis s'enfoncent davantage dans le kufr — jamais leur retour ne sera accepté, et ceux-là sont les égarés. Ceux qui sont kāfirūn et meurent alors qu'ils sont kuffār, jamais il ne sera accepté de l'un d'eux, même s'il rançonnait par un plein de terre d'or — ceux-là ont un châtiment douloureux, et ils n'ont aucun secoureur.
- ref: S.3:92
  ar: لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ ۚ وَمَا تُنفِقُوا۟ مِن شَىْءٍ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ
  trl: Lan tanālu l-birra ḥattā tunfiqū mimmā tuḥibbūn — wa-mā tunfiqū min shayʾin fa-inna llāha bihi ʿalīm
  trad: Vous n'atteindrez jamais al-birr tant que vous ne dépensez pas de ce que vous aimez — et quoi que vous dépensiez, Allaah le sait parfaitement.
- ref: S.3:93
  ar: كُلُّ ٱلطَّعَامِ كَانَ حِلًّا لِّبَنِىٓ إِسْرَٰٓءِيلَ إِلَّا مَا حَرَّمَ إِسْرَٰٓءِيلُ عَلَىٰ نَفْسِهِۦ مِن قَبْلِ أَن تُنَزَّلَ ٱلتَّوْرَىٰةُ ۗ قُلْ فَأْتُوا۟ بِٱلتَّوْرَىٰةِ فَٱتْلُوهَآ إِن كُنتُمْ صَـٰدِقِينَ
  trl: Kullu l-ṭaʿāmi kāna ḥillan li-banī Isrāʾīla illā mā ḥarrama Isrāʾīlu ʿalā nafsihi min qabli an tunazzala l-tawrātu — qul fa-ʾtū bi-l-tawrāti fa-tlūhā in kuntum ṣādiqīn
  trad: 'Toute nourriture était licite pour les Banū Isrāʾīl, sauf ce qu''Isrāʾīl [Yaʿqūb] s''est lui-même interdit, avant que la Tawrāh ne soit descendue. Dis : « Apportez donc la Tawrāh et récitez-la, si vous êtes véridiques. »'
- ref: S.3:94–95
  ar: فَمَنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ ٱلْكَذِبَ مِنۢ بَعْدِ ذَٰلِكَ فَأُو۟لَـٰٓئِكَ هُمُ ٱلظَّـٰلِمُونَ ۝ قُلْ صَدَقَ ٱللَّهُ ۗ فَٱتَّبِعُوا۟ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًا وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ
  trl: Fa-mani ftarā ʿala llāhi l-kadhiba min baʿdi dhālika fa-ulāʾika humu l-ẓālimūn — qul ṣadaqa llāhu — fa-ttabiʿū millata Ibrāhīma ḥanīfan wa-mā kāna mina l-mushrikīn
  trad: 'Quiconque invente alors un mensonge sur Allaah après cela, ceux-là sont les ẓālimūn. Dis : « Allaah a dit vrai » — suivez donc la milla d''Ibrāhīm, ḥanīf — et il n''était pas parmi les mushrikūn.'
- ref: S.3:96–97
  ar: إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِى بِبَكَّةَ مُبَارَكًا وَهُدًى لِّلْعَـٰلَمِينَ ۝ فِيهِ ءَايَـٰتٌۢ بَيِّنَـٰتٌ مَّقَامُ إِبْرَٰهِيمَ ۖ وَمَن دَخَلَهُۥ كَانَ ءَامِنًا ۗ وَلِلَّهِ عَلَى ٱلنَّاسِ حِجُّ ٱلْبَيْتِ مَنِ ٱسْتَطَاعَ إِلَيْهِ سَبِيلًا ۚ وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِىٌّ عَنِ ٱلْعَـٰلَمِينَ
  trl: Inna awwala baytin wuḍiʿa li-l-nāsi la-lladhī bi-Bakkata mubārakan wa-hudan li-l-ʿālamīn — fīhi āyātun bayyinātun maqāmu Ibrāhīma — wa-man dakhalahu kāna āminan — wa-lillāhi ʿala l-nāsi ḥijju l-bayti mani staṭāʿa ilayhi sabīlan — wa-man kafara fa-inna llāha Ghaniyyun ʿani l-ʿālamīn
  trad: La première Maison établie pour les gens est certes celle qui est à Bakka, bénie et hudā pour les mondes. S'y trouvent des āyāt bayyināt, le Maqām d'Ibrāhīm — quiconque y entre est en sécurité — et il incombe aux gens, envers Allaah, le ḥajj de la Maison, pour quiconque en a les moyens sur le chemin — et quiconque est kāfir, Allaah Se suffit à Lui-même à l'égard des mondes.
- ref: S.3:98–99
  ar: قُلْ يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَكْفُرُونَ بِـَٔايَـٰتِ ٱللَّهِ وَٱللَّهُ شَهِيدٌ عَلَىٰ مَا تَعْمَلُونَ ۝ قُلْ يَـٰٓأَهْلَ ٱلْكِتَـٰبِ لِمَ تَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ تَبْغُونَهَا عِوَجًا وَأَنتُمْ شُهَدَآءُ ۗ وَمَا ٱللَّهُ بِغَـٰفِلٍ عَمَّا تَعْمَلُونَ
  trl: Qul yā-ahla l-kitābi lima takfurūna bi-āyāti llāhi wa-llāhu shahīdun ʿalā mā taʿmalūn — qul yā-ahla l-kitābi lima taṣuddūna ʿan sabīli llāhi man āmana tabghūnahā ʿiwajan wa-antum shuhadāʾu — wa-mā llāhu bi-ghāfilin ʿammā taʿmalūn
  trad: 'Dis : « Ô Ahl al-Kitāb, pourquoi êtes-vous kāfirūn envers les āyāt d''Allaah, alors qu''Allaah est shahīd sur ce que vous faites ? » Dis : « Ô Ahl al-Kitāb, pourquoi détournez-vous du chemin d''Allaah celui qui a cru, en cherchant à le rendre tortueux, alors que vous en êtes témoins ? Allaah n''est pas inattentif à ce que vous faites. »'
- ref: S.3:100
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تُطِيعُوا۟ فَرِيقًا مِّنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَـٰبَ يَرُدُّوكُم بَعْدَ إِيمَـٰنِكُمْ كَـٰفِرِينَ
  trl: Yā-ayyuhā lladhīna āmanū in tuṭīʿū farīqan mina lladhīna ūtu l-kitāba yaruddūkum baʿda īmānikum kāfirīn
  trad: Ô vous qui avez cru, si vous obéissez à un groupe parmi ceux à qui le Kitāb a été donné, ils vous feront revenir, après votre foi, à refuser de reconnaître.
- ref: S.3:101
  ar: وَكَيْفَ تَكْفُرُونَ وَأَنتُمْ تُتْلَىٰ عَلَيْكُمْ ءَايَـٰتُ ٱللَّهِ وَفِيكُمْ رَسُولُهُۥ ۗ وَمَن يَعْتَصِم بِٱللَّهِ فَقَدْ هُدِىَ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
  trl: Wa-kayfa takfurūna wa-antum tutlā ʿalaykum āyātu llāhi wa-fīkum rasūluh — wa-man yaʿtaṣim billāhi fa-qad hudiya ilā ṣirāṭin mustaqīm
  trad: Et comment refuseriez-vous de reconnaître, alors qu'on vous récite les āyāt d'Allaah, et que Son rasūl est parmi vous ? Quiconque s'attache fermement à Allaah est certes guidé vers un chemin droit.
- ref: S.3:102
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ حَقَّ تُقَاتِهِۦ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ
  trl: Yā-ayyuhā lladhīna āmanū ttaqu llāha ḥaqqa tuqātihi wa-lā tamūtunna illā wa-antum muslimūn
  trad: Ô vous qui avez cru, constituez-vous, envers Allaah, la taqwā qui Lui est due, et ne mourez qu'en étant muslimūn.
- ref: S.3:103
  ar: وَٱعْتَصِمُوا۟ بِحَبْلِ ٱللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا۟ ۚ وَٱذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَآءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰنًا وَكُنتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِّنَ ٱلنَّارِ فَأَنقَذَكُم مِّنْهَا ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَـٰتِهِۦ لَعَلَّكُمْ تَهْتَدُونَ
  trl: Wa-ʿtaṣimū bi-ḥabli llāhi jamīʿan wa-lā tafarraqū — wa-dhkurū niʿmata llāhi ʿalaykum idh kuntum aʿdāʾan fa-allafa bayna qulūbikum fa-aṣbaḥtum bi-niʿmatihi ikhwānan wa-kuntum ʿalā shafā ḥufratin mina l-nāri fa-anqadhakum minhā — ka-dhālika yubayyinu llāhu lakum āyātihi laʿallakum tahtadūn
  trad: 'Attachez-vous fermement, tous ensemble, au lien d''Allaah, et ne vous divisez pas — rappelez-vous le bienfait d''Allaah sur vous : vous étiez ennemis, et Il a réuni vos cœurs, si bien que vous êtes devenus, par Son bienfait, des frères — vous étiez au bord d''une fosse de feu, et Il vous en a sauvés. Ainsi Allaah vous rend manifestes Ses āyāt — peut-être serez-vous guidés.'
- ref: S.3:104–105
  ar: وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى ٱلْخَيْرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ ۚ وَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ ۝ وَلَا تَكُونُوا۟ كَٱلَّذِينَ تَفَرَّقُوا۟ وَٱخْتَلَفُوا۟ مِنۢ بَعْدِ مَا جَآءَهُمُ ٱلْبَيِّنَـٰتُ ۚ وَأُو۟لَـٰٓئِكَ لَهُمْ عَذَابٌ عَظِيمٌ
  trl: Wa-l-takun minkum ummatun yadʿūna ila l-khayri wa-yaʾmurūna bi-l-maʿrūfi wa-yanhawna ʿani l-munkari — wa-ulāʾika humu l-mufliḥūn — wa-lā takūnū ka-lladhīna tafarraqū wa-khtalafū min baʿdi mā jāʾahumu l-bayyinātu — wa-ulāʾika lahum ʿadhābun ʿaẓīm
  trad: Que se constitue parmi vous une umma qui appelle vers le khayr, qui ordonne le maʿrūf et interdit le munkar — ceux-là sont les mufliḥūn. Et ne soyez pas comme ceux qui se sont divisés et sont entrés en désaccord après que les bayyināt leur sont parvenues — ceux-là ont un châtiment immense.
- ref: S.3:106–107
  ar: يَوْمَ تَبْيَضُّ وُجُوهٌ وَتَسْوَدُّ وُجُوهٌ ۚ فَأَمَّا ٱلَّذِينَ ٱسْوَدَّتْ وُجُوهُهُمْ أَكَفَرْتُم بَعْدَ إِيمَـٰنِكُمْ فَذُوقُوا۟ ٱلْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَ ۝ وَأَمَّا ٱلَّذِينَ ٱبْيَضَّتْ وُجُوهُهُمْ فَفِى رَحْمَةِ ٱللَّهِ هُمْ فِيهَا خَـٰلِدُونَ
  trl: Yawma tabyaḍḍu wujūhun wa-taswaddu wujūh — fa-ammā lladhīna swaddat wujūhuhum a-kafartum baʿda īmānikum fa-dhūqu l-ʿadhāba bi-mā kuntum takfurūn — wa-ammā lladhīna byaḍḍat wujūhuhum fa-fī raḥmati llāhi hum fīhā khālidūn
  trad: 'Le jour où des visages blanchiront et des visages noirciront — quant à ceux dont les visages auront noirci : « Avez-vous refusé de reconnaître après votre foi ? Goûtez donc le châtiment pour avoir refusé de reconnaître. » Quant à ceux dont les visages auront blanchi, ils seront dans la raḥma d''Allaah, y demeurant.'
- ref: S.3:108–109
  ar: تِلْكَ ءَايَـٰتُ ٱللَّهِ نَتْلُوهَا عَلَيْكَ بِٱلْحَقِّ ۗ وَمَا ٱللَّهُ يُرِيدُ ظُلْمًا لِّلْعَـٰلَمِينَ ۝ وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ وَإِلَىٰ ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ
  trl: Tilka āyātu llāhi natlūhā ʿalayka bi-l-ḥaqq — wa-mā llāhu yurīdu ẓulman li-l-ʿālamīn — wa-lillāhi mā fi l-samāwāti wa-mā fi l-arḍi — wa-ila llāhi turjaʿu l-umūr
  trad: Voilà les āyāt d'Allaah, Nous te les récitons avec le ḥaqq — Allaah ne veut aucune injustice pour les mondes. À Allaah appartient ce qui est dans les cieux et ce qui est sur la terre — c'est vers Allaah que reviennent toutes les affaires.
- ref: S.3:110
  ar: كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِٱلْمَعْرُوفِ وَتَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَتُؤْمِنُونَ بِٱللَّهِ ۗ وَلَوْ ءَامَنَ أَهْلُ ٱلْكِتَـٰبِ لَكَانَ خَيْرًا لَّهُم ۚ مِّنْهُمُ ٱلْمُؤْمِنُونَ وَأَكْثَرُهُمُ ٱلْفَـٰسِقُونَ
  trl: Kuntum khayra ummatin ukhrijat li-l-nāsi taʾmurūna bi-l-maʿrūfi wa-tanhawna ʿani l-munkari wa-tuʾminūna billāh — wa-law āmana ahlu l-kitābi la-kāna khayran lahum — minhumu l-muʾminūna wa-aktharuhumu l-fāsiqūn
  trad: 'Vous êtes la meilleure umma jamais fait sortir pour les gens : vous ordonnez le maʿrūf, interdisez le munkar, et croyez en Allaah — et si les Ahl al-Kitāb avaient cru, cela aurait certes été meilleur pour eux ; parmi eux il y a des muʾminūn, mais la plupart d''entre eux sont fāsiqūn.'
- ref: S.3:111–112
  ar: لَن يَضُرُّوكُمْ إِلَّآ أَذًى ۖ وَإِن يُقَـٰتِلُوكُمْ يُوَلُّوكُمُ ٱلْأَدْبَارَ ثُمَّ لَا يُنصَرُونَ ۝ ضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ أَيْنَ مَا ثُقِفُوٓا۟ إِلَّا بِحَبْلٍ مِّنَ ٱللَّهِ وَحَبْلٍ مِّنَ ٱلنَّاسِ وَبَآءُو بِغَضَبٍ مِّنَ ٱللَّهِ وَضُرِبَتْ عَلَيْهِمُ ٱلْمَسْكَنَةُ ۚ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَـٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ
  trl: Lan yaḍurrūkum illā adhā — wa-in yuqātilūkum yuwallūkumu l-adbāra thumma lā yunṣarūn — ḍuribat ʿalayhimu l-dhillatu ayna mā thuqifū illā bi-ḥablin mina llāhi wa-ḥablin mina l-nāsi wa-bāʾū bi-ghaḍabin mina llāhi wa-ḍuribat ʿalayhimu l-maskanatu — dhālika bi-annahum kānū yakfurūna bi-āyāti llāhi wa-yaqtulūna l-anbiyāʾa bi-ghayri ḥaqq — dhālika bi-mā ʿaṣaw wa-kānū yaʿtadūn
  trad: Ils ne vous nuiront que d'une nuisance légère — et s'ils vous combattent, ils vous tourneront le dos, puis ne seront pas secourus. L'abaissement s'est abattu sur eux, où qu'ils se trouvent, sauf par un lien venant d'Allaah et un lien venant des gens — ils sont retournés chargés de la colère d'Allaah, et la détresse s'est abattue sur eux. Cela, parce qu'ils étaient kāfirūn envers les āyāt d'Allaah et tuaient les anbiyāʾ sans droit — cela, parce qu'ils désobéissaient et transgressaient.
- ref: S.3:113–115
  ar: لَيْسُوا۟ سَوَآءً ۗ مِّنْ أَهْلِ ٱلْكِتَـٰبِ أُمَّةٌ قَآئِمَةٌ يَتْلُونَ ءَايَـٰتِ ٱللَّهِ ءَانَآءَ ٱلَّيْلِ وَهُمْ يَسْجُدُونَ ۝ يُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ وَيَأْمُرُونَ بِٱلْمَعْرُوفِ وَيَنْهَوْنَ عَنِ ٱلْمُنكَرِ وَيُسَـٰرِعُونَ فِى ٱلْخَيْرَٰتِ وَأُو۟لَـٰٓئِكَ مِنَ ٱلصَّـٰلِحِينَ ۝ وَمَا يَفْعَلُوا۟ مِنْ خَيْرٍ فَلَن يُكْفَرُوهُ ۗ وَٱللَّهُ عَلِيمٌۢ بِٱلْمُتَّقِينَ
  trl: Laysū sawāʾan — min ahli l-kitābi ummatun qāʾimatun yatlūna āyāti llāhi ānāʾa l-layli wa-hum yasjudūn — yuʾminūna billāhi wa-l-yawmi l-ākhiri wa-yaʾmurūna bi-l-maʿrūfi wa-yanhawna ʿani l-munkari wa-yusāriʿūna fi l-khayrāti wa-ulāʾika mina l-ṣāliḥīn — wa-mā yafʿalū min khayrin fa-lan yukfarūh — wa-llāhu ʿalīmun bi-l-muttaqīn
  trad: 'Ils ne sont pas tous égaux : parmi les Ahl al-Kitāb, il y a une umma droite qui récite les āyāt d''Allaah aux heures de la nuit, en se prosternant. Ils croient en Allaah et au Jour Dernier, ordonnent le maʿrūf, interdisent le munkar, et se hâtent vers les khayrāt — ceux-là sont parmi les ṣāliḥūn. Et le bien qu''ils font ne sera jamais recouvert — Allaah connaît parfaitement les muttaqūn.'
- ref: S.3:116–117
  ar: إِنَّ ٱلَّذِينَ كَفَرُوا۟ لَن تُغْنِىَ عَنْهُمْ أَمْوَٰلُهُمْ وَلَآ أَوْلَـٰدُهُم مِّنَ ٱللَّهِ شَيْـًٔا ۖ وَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ ۚ هُمْ فِيهَا خَـٰلِدُونَ ۝ مَثَلُ مَا يُنفِقُونَ فِى هَـٰذِهِ ٱلْحَيَوٰةِ ٱلدُّنْيَا كَمَثَلِ رِيحٍ فِيهَا صِرٌّ أَصَابَتْ حَرْثَ قَوْمٍ ظَلَمُوٓا۟ أَنفُسَهُمْ فَأَهْلَكَتْهُ ۚ وَمَا ظَلَمَهُمُ ٱللَّهُ وَلَـٰكِنْ أَنفُسَهُمْ يَظْلِمُونَ
  trl: Inna lladhīna kafarū lan tughniya ʿanhum amwāluhum wa-lā awlāduhum mina llāhi shayʾan — wa-ulāʾika aṣḥābu l-nāri hum fīhā khālidūn — mathalu mā yunfiqūna fī hādhihi l-ḥayāti l-dunyā ka-mathali rīḥin fīhā ṣirrun aṣābat ḥartha qawmin ẓalamū anfusahum fa-ahlakathu — wa-mā ẓalamahumu llāhu wa-lākin anfusahum yaẓlimūn
  trad: Ceux qui sont kāfirūn, ni leurs biens ni leurs enfants ne leur seront d'aucun secours contre ce qui vient d'Allaah — ceux-là sont les gens du Feu, ils y demeurent. L'exemple de ce qu'ils dépensent dans cette vie d'ici-bas est comme l'exemple d'un vent chargé de froid glacial qui atteint la récolte d'un peuple qui s'est fait tort à lui-même, et la détruit — Allaah ne leur a fait aucun tort, mais c'est à eux-mêmes qu'ils font tort.
- ref: S.3:118
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ بِطَانَةً مِّن دُونِكُمْ لَا يَأْلُونَكُمْ خَبَالًا وَدُّوا۟ مَا عَنِتُّمْ قَدْ بَدَتِ ٱلْبَغْضَآءُ مِنْ أَفْوَٰهِهِمْ وَمَا تُخْفِى صُدُورُهُمْ أَكْبَرُ ۚ قَدْ بَيَّنَّا لَكُمُ ٱلْـَٔايَـٰتُ ۖ إِن كُنتُمْ تَعْقِلُونَ
  trl: Yā-ayyuhā lladhīna āmanū lā tattakhidhū biṭānatan min dūnikum lā yaʾlūnakum khabālan waddū mā ʿanittum qad badati l-baghḍāʾu min afwāhihim wa-mā tukhfī ṣudūruhum akbar — qad bayyannā lakumu l-āyātu in kuntum taʿqilūn
  trad: 'Ô vous qui avez cru, ne prenez pas comme confidents intimes (biṭāna) des gens en dehors de vous : ils ne vous épargnent aucun effort pour vous corrompre, ils voudraient votre perte — la haine est déjà apparue de leurs bouches, et ce que dissimulent leurs poitrines est plus grand encore. Nous vous avons déjà rendu les āyāt manifestes, si vous raisonnez.'
- ref: S.3:119
  ar: هَـٰٓأَنتُمْ أُو۟لَآءِ تُحِبُّونَهُمْ وَلَا يُحِبُّونَكُمْ وَتُؤْمِنُونَ بِٱلْكِتَـٰبِ كُلِّهِۦ وَإِذَا لَقُوكُمْ قَالُوٓا۟ ءَامَنَّا وَإِذَا خَلَوْا۟ عَضُّوا۟ عَلَيْكُمُ ٱلْأَنَامِلَ مِنَ ٱلْغَيْظِ ۚ قُلْ مُوتُوا۟ بِغَيْظِكُمْ ۗ إِنَّ ٱللَّهَ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
  trl: Hā-antum ulāʾi tuḥibbūnahum wa-lā yuḥibbūnakum wa-tuʾminūna bi-l-kitābi kullihi wa-idhā laqūkum qālū āmannā wa-idhā khalaw ʿaḍḍū ʿalaykumu l-anāmila mina l-ghayẓi — qul mūtū bi-ghayẓikum — inna llāha ʿalīmun bi-dhāti l-ṣudūr
  trad: 'Vous voilà, vous les aimez, et ils ne vous aiment pas — vous croyez en tout le Kitāb, et quand ils vous rencontrent ils disent : « Nous avons cru », et quand ils se retrouvent seuls, ils se mordent les doigts de rage contre vous. Dis : « Mourez de votre rage. » Allaah connaît parfaitement ce que renferment les poitrines.'
- ref: S.3:120
  ar: إِن تَمْسَسْكُمْ حَسَنَةٌ تَسُؤْهُمْ وَإِن تُصِبْكُمْ سَيِّئَةٌ يَفْرَحُوا۟ بِهَا ۖ وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ لَا يَضُرُّكُمْ كَيْدُهُمْ شَيْـًٔا ۗ إِنَّ ٱللَّهَ بِمَا يَعْمَلُونَ مُحِيطٌ
  trl: In tamsaskum ḥasanatun tasuʾhum wa-in tuṣibkum sayyiʾatun yafraḥū bihā — wa-in taṣbirū wa-tattaqū lā yaḍurrukum kayduhum shayʾan — inna llāha bi-mā yaʿmalūna muḥīṭ
  trad: Si un bien vous atteint, cela les attriste ; si un mal vous atteint, ils s'en réjouissent — mais si vous êtes patients et vous constituez une taqwā, leur manœuvre ne vous nuira en rien. Allaah embrasse totalement ce qu'ils font.
- ref: S.3:121–122
  ar: وَإِذْ غَدَوْتَ مِنْ أَهْلِكَ تُبَوِّئُ ٱلْمُؤْمِنِينَ مَقَـٰعِدَ لِلْقِتَالِ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ ۝ إِذْ هَمَّت طَّآئِفَتَانِ مِنكُمْ أَن تَفْشَلَا وَٱللَّهُ وَلِيُّهُمَا ۗ وَعَلَىٰ ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
  trl: Wa-idh ghadawta min ahlika tubawwiʾu l-muʾminīna maqāʿida li-l-qitāl — wa-llāhu Samīʿun ʿAlīm — idh hammat ṭāʾifatāni minkum an tafshalā wa-llāhu waliyyuhumā — wa-ʿala llāhi fa-l-yatawakkali l-muʾminūn
  trad: Et quand tu partis au matin, de chez toi, pour assigner aux muʾminūn des postes de combat — Allaah est Samīʿ, ʿAlīm. Quand deux groupes parmi vous faillirent perdre courage, alors qu'Allaah était leur walī — c'est sur Allaah que les muʾminūn doivent s'en remettre.
- ref: S.3:123
  ar: وَلَقَدْ نَصَرَكُمُ ٱللَّهُ بِبَدْرٍ وَأَنتُمْ أَذِلَّةٌ ۖ فَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تَشْكُرُونَ
  trl: Wa-la-qad naṣarakumu llāhu bi-Badrin wa-antum adhillatun — fa-ttaqu llāha laʿallakum tashkurūn
  trad: Allaah vous a certes secourus à Badr, alors que vous étiez faibles — constituez-vous donc une taqwā d'Allaah, peut-être serez-vous reconnaissants.
- ref: S.3:124–126
  ar: إِذْ تَقُولُ لِلْمُؤْمِنِينَ أَلَن يَكْفِيَكُمْ أَن يُمِدَّكُمْ رَبُّكُم بِثَلَـٰثَةِ ءَالَـٰفٍ مِّنَ ٱلْمَلَـٰٓئِكَةِ مُنزَلِينَ ۝ بَلَىٰٓ ۚ إِن تَصْبِرُوا۟ وَتَتَّقُوا۟ وَيَأْتُوكُم مِّن فَوْرِهِمْ هَـٰذَا يُمْدِدْكُمْ رَبُّكُم بِخَمْسَةِ ءَالَـٰفٍ مِّنَ ٱلْمَلَـٰٓئِكَةِ مُسَوِّمِينَ ۝ وَمَا جَعَلَهُ ٱللَّهُ إِلَّا بُشْرَىٰ لَكُمْ وَلِتَطْمَئِنَّ قُلُوبُكُم بِهِۦ ۗ وَمَا ٱلنَّصْرُ إِلَّا مِنْ عِندِ ٱللَّهِ ٱلْعَزِيزِ ٱلْحَكِيمِ
  trl: Idh taqūlu li-l-muʾminīna a-lan yakfiyakum an yumiddakum rabbukum bi-thalāthati ālāfin mina l-malāʾikati munzalīn — balā — in taṣbirū wa-tattaqū wa-yaʾtūkum min fawrihim hādhā yumdidkum rabbukum bi-khamsati ālāfin mina l-malāʾikati musawwimīn — wa-mā jaʿalahu llāhu illā bushrā lakum wa-li-taṭmaʾinna qulūbukum bihi — wa-mā l-naṣru illā min ʿindi llāhi l-ʿAzīzi l-Ḥakīm
  trad: 'Quand tu disais aux muʾminūn : « Ne vous suffit-il pas que votre Rabb vous assiste de trois mille malāʾika descendus ? » Bien plus : si vous êtes patients et vous constituez une taqwā, et qu''ils viennent contre vous à l''instant même, votre Rabb vous assistera de cinq mille malāʾika marqués distinctement. Allaah n''a fait cela que comme une bonne annonce pour vous, et pour que vos cœurs s''apaisent par cela — le secours ne vient que d''auprès d''Allaah, al-ʿAzīz, al-Ḥakīm.'
- ref: S.3:127–129
  ar: لِيَقْطَعَ طَرَفًا مِّنَ ٱلَّذِينَ كَفَرُوٓا۟ أَوْ يَكْبِتَهُمْ فَيَنقَلِبُوا۟ خَآئِبِينَ ۝ لَيْسَ لَكَ مِنَ ٱلْأَمْرِ شَىْءٌ أَوْ يَتُوبَ عَلَيْهِمْ أَوْ يُعَذِّبَهُمْ فَإِنَّهُمْ ظَـٰلِمُونَ ۝ وَلِلَّهِ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌ رَّحِيمٌ
  trl: Li-yaqṭaʿa ṭarafan mina lladhīna kafarū aw yakbitahum fa-yanqalibū khāʾibīn — laysa laka mina l-amri shayʾun aw yatūba ʿalayhim aw yuʿadhdhibahum fa-innahum ẓālimūn — wa-lillāhi mā fi l-samāwāti wa-mā fi l-arḍi — yaghfiru li-man yashāʾu wa-yuʿadhdhibu man yashāʾ — wa-llāhu Ghafūrun Raḥīm
  trad: Afin de retrancher une partie de ceux qui sont kāfirūn, ou de les humilier et qu'ils s'en retournent déçus. Tu n'as, dans cette affaire, aucune part — qu'Il revienne vers eux [en pardon] ou qu'Il les châtie, ils sont certes ẓālimūn. À Allaah appartient ce qui est dans les cieux et ce qui est sur la terre — Il pardonne à qui Il veut et châtie qui Il veut — Allaah est Ghafūr, Raḥīm.
- ref: S.3:130–132
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَأْكُلُوا۟ ٱلرِّبَوٰٓا۟ أَضْعَـٰفًا مُّضَـٰعَفَةً ۖ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ ۝ وَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِىٓ أُعِدَّتْ لِلْكَـٰفِرِينَ ۝ وَأَطِيعُوا۟ ٱللَّهَ وَٱلرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ
  trl: Yā-ayyuhā lladhīna āmanū lā taʾkulu l-ribā aḍʿāfan muḍāʿafatan — wa-ttaqu llāha laʿallakum tufliḥūn — wa-ttaqu l-nāra llatī uʿiddat li-l-kāfirīn — wa-aṭīʿu llāha wa-l-rasūla laʿallakum turḥamūn
  trad: Ô vous qui avez cru, ne dévorez pas le ribā, en multiples redoublés — constituez-vous une taqwā d'Allaah, peut-être serez-vous parmi les mufliḥūn. Gardez-vous du Feu, préparé pour les kāfirūn. Obéissez à Allaah et au rasūl, peut-être bénéficierez-vous de la raḥma.
- ref: S.3:133–134
  ar: ۞ وَسَارِعُوٓا۟ إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا ٱلسَّمَـٰوَٰتُ وَٱلْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ ۝ ٱلَّذِينَ يُنفِقُونَ فِى ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلْكَـٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ
  trl: Wa-sāriʿū ilā maghfiratin min rabbikum wa-jannatin ʿarḍuhā l-samāwātu wa-l-arḍu uʿiddat li-l-muttaqīn — alladhīna yunfiqūna fi l-sarrāʾi wa-l-ḍarrāʾi wa-l-kāẓimīna l-ghayẓa wa-l-ʿāfīna ʿani l-nāsi — wa-llāhu yuḥibbu l-muḥsinīn
  trad: Hâtez-vous vers un pardon de votre Rabb, et un jardin dont la largeur est les cieux et la terre, préparé pour les muttaqūn — ceux qui dépensent dans l'aisance comme dans l'adversité, qui contiennent leur colère et pardonnent aux gens — Allaah aime les muḥsinūn.
- ref: S.3:135–136
  ar: وَٱلَّذِينَ إِذَا فَعَلُوا۟ فَـٰحِشَةً أَوْ ظَلَمُوٓا۟ أَنفُسَهُمْ ذَكَرُوا۟ ٱللَّهَ فَٱسْتَغْفَرُوا۟ لِذُنُوبِهِمْ وَمَن يَغْفِرُ ٱلذُّنُوبَ إِلَّا ٱللَّهُ وَلَمْ يُصِرُّوا۟ عَلَىٰ مَا فَعَلُوا۟ وَهُمْ يَعْلَمُونَ ۝ أُو۟لَـٰٓئِكَ جَزَآؤُهُم مَّغْفِرَةٌ مِّن رَّبِّهِمْ وَجَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا ۚ وَنِعْمَ أَجْرُ ٱلْعَـٰمِلِينَ
  trl: Wa-lladhīna idhā faʿalū fāḥishatan aw ẓalamū anfusahum dhakaru llāha fa-staghfarū li-dhunūbihim wa-man yaghfiru l-dhunūba illā llāhu wa-lam yuṣirrū ʿalā mā faʿalū wa-hum yaʿlamūn — ulāʾika jazāʾuhum maghfiratun min rabbihim wa-jannātun tajrī min taḥtihā l-anhāru khālidīna fīhā — wa-niʿma ajru l-ʿāmilīn
  trad: 'Et ceux qui, lorsqu''ils commettent une fāḥisha ou se font tort à eux-mêmes, se souviennent d''Allaah et implorent le pardon de leurs fautes — et qui d''autre qu''Allaah pardonne les fautes ? — et qui ne persistent pas sciemment dans ce qu''ils ont fait — ceux-là, leur rétribution est un pardon de leur Rabb, et des jardins sous lesquels coulent les rivières, y demeurant : quelle excellente rétribution pour ceux qui agissent !'
- ref: S.3:137–138
  ar: قَدْ خَلَتْ مِن قَبْلِكُمْ سُنَنٌ فَسِيرُوا۟ فِى ٱلْأَرْضِ فَٱنظُرُوا۟ كَيْفَ كَانَ عَـٰقِبَةُ ٱلْمُكَذِّبِينَ ۝ هَـٰذَا بَيَانٌ لِّلنَّاسِ وَهُدًى وَمَوْعِظَةٌ لِّلْمُتَّقِينَ
  trl: Qad khalat min qablikum sunanun fa-sīrū fi l-arḍi fa-nẓurū kayfa kāna ʿāqibatu l-mukadhdhibīn — hādhā bayānun li-l-nāsi wa-hudan wa-mawʿiẓatun li-l-muttaqīn
  trad: Des sunan vous ont précédés — parcourez donc la terre et observez quelle a été l'issue de ceux qui ont démenti. Ceci est un bayān pour les gens, un hudā et une exhortation pour les muttaqūn.
- ref: S.3:139
  ar: وَلَا تَهِنُوا۟ وَلَا تَحْزَنُوا۟ وَأَنتُمُ ٱلْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ
  trl: Wa-lā tahinū wa-lā taḥzanū wa-antumu l-aʿlawna in kuntum muʾminīn
  trad: Ne faiblissez pas et ne vous affligez pas — vous êtes les plus élevés, si vous êtes muʾminūn.
- ref: S.3:140–141
  ar: إِن يَمْسَسْكُمْ قَرْحٌ فَقَدْ مَسَّ ٱلْقَوْمَ قَرْحٌ مِّثْلُهُۥ ۚ وَتِلْكَ ٱلْأَيَّامُ نُدَاوِلُهَا بَيْنَ ٱلنَّاسِ وَلِيَعْلَمَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَيَتَّخِذَ مِنكُمْ شُهَدَآءَ ۗ وَٱللَّهُ لَا يُحِبُّ ٱلظَّـٰلِمِينَ ۝ وَلِيُمَحِّصَ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ وَيَمْحَقَ ٱلْكَـٰفِرِينَ
  trl: In yamsaskum qarḥun fa-qad massa l-qawma qarḥun mithluh — wa-tilka l-ayyāmu nudāwiluhā bayna l-nāsi wa-li-yaʿlama llāhu lladhīna āmanū wa-yattakhidha minkum shuhadāʾ — wa-llāhu lā yuḥibbu l-ẓālimīn — wa-li-yumaḥḥiṣa llāhu lladhīna āmanū wa-yamḥaqa l-kāfirīn
  trad: Si une blessure vous atteint, une blessure semblable a atteint l'autre camp — ces jours, Nous les faisons alterner parmi les gens, afin qu'Allaah distingue ceux qui ont cru, et qu'Il prenne parmi vous des témoins — Allaah n'aime pas les ẓālimūn. Et afin qu'Allaah trie ceux qui ont cru, et efface les kāfirūn.
- ref: S.3:142–143
  ar: أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا يَعْلَمِ ٱللَّهُ ٱلَّذِينَ جَـٰهَدُوا۟ مِنكُمْ وَيَعْلَمَ ٱلصَّـٰبِرِينَ ۝ وَلَقَدْ كُنتُمْ تَمَنَّوْنَ ٱلْمَوْتَ مِن قَبْلِ أَن تَلْقَوْهُ فَقَدْ رَأَيْتُمُوهُ وَأَنتُمْ تَنظُرُونَ
  trl: Am ḥasibtum an tadkhulu l-jannata wa-lammā yaʿlami llāhu lladhīna jāhadū minkum wa-yaʿlama l-ṣābirīn — wa-la-qad kuntum tamannawna l-mawta min qabli an talqawhu fa-qad raʾaytumūhu wa-antum tanẓurūn
  trad: Ou avez-vous pensé entrer au jardin, alors qu'Allaah n'a pas encore distingué ceux qui, parmi vous, ont fourni l'effort, et distingué les ṣābirūn ? Vous souhaitiez certes la mort avant de la rencontrer — vous l'avez maintenant vue de vos propres yeux.
- ref: S.3:144
  ar: وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ ٱلرُّسُلُ ۚ أَفَإِي۟ن مَّاتَ أَوْ قُتِلَ ٱنقَلَبْتُمْ عَلَىٰٓ أَعْقَـٰبِكُمْ ۚ وَمَن يَنقَلِبْ عَلَىٰ عَقِبَيْهِ فَلَن يَضُرَّ ٱللَّهَ شَيْـًٔا ۗ وَسَيَجْزِى ٱللَّهُ ٱلشَّـٰكِرِينَ
  trl: Wa-mā Muḥammadun illā rasūlun qad khalat min qablihi l-rusulu — a-fa-in māta aw qutila nqalabtum ʿalā aʿqābikum — wa-man yanqalib ʿalā ʿaqibayhi fa-lan yaḍurra llāha shayʾan — wa-sa-yajzī llāhu l-shākirīn
  trad: Muḥammad n'est qu'un rasūl — des rusul l'ont précédé. S'il venait à mourir ou à être tué, retourneriez-vous sur vos talons ? Quiconque retourne sur ses talons ne nuira en rien à Allaah — et Allaah rétribuera les shākirūn.
- ref: S.3:145
  ar: وَمَا كَانَ لِنَفْسٍ أَن تَمُوتَ إِلَّا بِإِذْنِ ٱللَّهِ كِتَـٰبًا مُّؤَجَّلًا ۗ وَمَن يُرِدْ ثَوَابَ ٱلدُّنْيَا نُؤْتِهِۦ مِنْهَا وَمَن يُرِدْ ثَوَابَ ٱلْـَٔاخِرَةِ نُؤْتِهِۦ مِنْهَا ۚ وَسَنَجْزِى ٱلشَّـٰكِرِينَ
  trl: Wa-mā kāna li-nafsin an tamūta illā bi-idhni llāhi kitāban muʾajjalā — wa-man yurid thawāba l-dunyā nuʾtihi minhā wa-man yurid thawāba l-ākhirati nuʾtihi minhā — wa-sa-najzi l-shākirīn
  trad: Il n'appartient à aucune âme de mourir, si ce n'est par la permission d'Allaah, selon une prescription à terme fixé — quiconque veut la rétribution de ce monde, Nous la lui donnons ; quiconque veut la rétribution de l'ākhira, Nous la lui donnons — Nous rétribuerons les shākirūn.
- ref: S.3:146–148
  ar: وَكَأَيِّن مِّن نَّبِىٍّ قَـٰتَلَ مَعَهُۥ رِبِّيُّونَ كَثِيرٌ فَمَا وَهَنُوا۟ لِمَآ أَصَابَهُمْ فِى سَبِيلِ ٱللَّهِ وَمَا ضَعُفُوا۟ وَمَا ٱسْتَكَانُوا۟ ۗ وَٱللَّهُ يُحِبُّ ٱلصَّـٰبِرِينَ ۝ وَمَا كَانَ قَوْلَهُمْ إِلَّآ أَن قَالُوا۟ رَبَّنَا ٱغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِىٓ أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ ۝ فَـَٔاتَىٰهُمُ ٱللَّهُ ثَوَابَ ٱلدُّنْيَا وَحُسْنَ ثَوَابِ ٱلْـَٔاخِرَةِ ۗ وَٱللَّهُ يُحِبُّ ٱلْمُحْسِنِينَ
  trl: Wa-kaʾayyin min nabiyyin qātala maʿahu ribbiyyūna kathīrun fa-mā wahanū li-mā aṣābahum fī sabīli llāhi wa-mā ḍaʿufū wa-mā stakānū — wa-llāhu yuḥibbu l-ṣābirīn — wa-mā kāna qawlahum illā an qālū rabbanā ghfir lanā dhunūbanā wa-isrāfanā fī amrinā wa-thabbit aqdāmanā wa-nṣurnā ʿala l-qawmi l-kāfirīn — fa-ātāhumu llāhu thawāba l-dunyā wa-ḥusna thawābi l-ākhirati — wa-llāhu yuḥibbu l-muḥsinīn
  trad: 'Que de nabī ont combattu, accompagnés de nombreux ribbiyyūn, qui n''ont ni faibli devant ce qui les a atteints sur le chemin d''Allaah, ni fléchi, ni cédé — Allaah aime les ṣābirūn. Leur seule parole était : « Notre Rabb, pardonne-nous nos fautes et notre excès dans notre affaire, affermis nos pas, et secours-nous contre les gens kāfirūn. » Allaah leur donna la rétribution de ce monde, et la belle rétribution de l''ākhira — Allaah aime les muḥsinūn.'
- ref: S.3:149–150
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِن تُطِيعُوا۟ ٱلَّذِينَ كَفَرُوا۟ يَرُدُّوكُمْ عَلَىٰٓ أَعْقَـٰبِكُمْ فَتَنقَلِبُوا۟ خَـٰسِرِينَ ۝ بَلِ ٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ خَيْرُ ٱلنَّـٰصِرِينَ
  trl: Yā-ayyuhā lladhīna āmanū in tuṭīʿu lladhīna kafarū yaruddūkum ʿalā aʿqābikum fa-tanqalibū khāsirīn — bali llāhu mawlākum wa-huwa khayru l-nāṣirīn
  trad: Ô vous qui avez cru, si vous obéissez à ceux qui sont kāfirūn, ils vous feront retourner sur vos talons, et vous reviendrez perdants. Allaah est plutôt votre mawlā — Il est le meilleur des secoureurs.
- ref: S.3:151
  ar: سَنُلْقِى فِى قُلُوبِ ٱلَّذِينَ كَفَرُوا۟ ٱلرُّعْبَ بِمَآ أَشْرَكُوا۟ بِٱللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَـٰنًا ۖ وَمَأْوَىٰهُمُ ٱلنَّارُ ۚ وَبِئْسَ مَثْوَى ٱلظَّـٰلِمِينَ
  trl: Sa-nulqī fī qulūbi lladhīna kafarū l-ruʿba bi-mā ashrakū bi-llāhi mā lam yunazzil bihi sulṭānan — wa-maʾwāhumu l-nāru — wa-biʾsa mathwā l-ẓālimīn
  trad: 'Nous jetterons l''effroi dans les cœurs de ceux qui sont kāfirūn, pour avoir associé à Allaah ce sur quoi Il n''a fait descendre aucun sulṭān — leur refuge est le Feu : quel détestable séjour pour les ẓālimūn.'
- ref: S.3:152
  ar: وَلَقَدْ صَدَقَكُمُ ٱللَّهُ وَعْدَهُۥٓ إِذْ تَحُسُّونَهُم بِإِذْنِهِۦ ۖ حَتَّىٰٓ إِذَا فَشِلْتُمْ وَتَنَـٰزَعْتُمْ فِى ٱلْأَمْرِ وَعَصَيْتُم مِّنۢ بَعْدِ مَآ أَرَىٰكُم مَّا تُحِبُّونَ ۚ مِنكُم مَّن يُرِيدُ ٱلدُّنْيَا وَمِنكُم مَّن يُرِيدُ ٱلْـَٔاخِرَةَ ۚ ثُمَّ صَرَفَكُمْ عَنْهُمْ لِيَبْتَلِيَكُمْ ۖ وَلَقَدْ عَفَا عَنكُمْ ۗ وَٱللَّهُ ذُو فَضْلٍ عَلَى ٱلْمُؤْمِنِينَ
  trl: Wa-la-qad ṣadaqakumu llāhu waʿdahu idh taḥussūnahum bi-idhnih — ḥattā idhā fashiltum wa-tanāzaʿtum fi l-amri wa-ʿaṣaytum min baʿdi mā arākum mā tuḥibbūn — minkum man yurīdu l-dunyā wa-minkum man yurīdu l-ākhirah — thumma ṣarafakum ʿanhum li-yabtaliyakum — wa-la-qad ʿafā ʿankum — wa-llāhu dhū faḍlin ʿalā l-muʾminīn
  trad: Allaah vous a tenu Sa promesse, lorsque vous les abattiez par Sa permission — jusqu'au moment où vous avez faibli, où vous vous êtes disputés au sujet de l'affaire, et où vous avez désobéi, après qu'Il vous eut montré ce que vous aimiez. Parmi vous, certains voulaient ce bas monde, et parmi vous, certains voulaient l'ākhira. Puis Il vous a détournés d'eux pour vous éprouver — et Il vous a certes pardonné. Allaah dispose de faḍl envers les muʾminūn.
- ref: S.3:153
  ar: إِذْ تُصْعِدُونَ وَلَا تَلْوُۥنَ عَلَىٰٓ أَحَدٍ وَٱلرَّسُولُ يَدْعُوكُمْ فِىٓ أُخْرَىٰكُمْ فَأَثَـٰبَكُمْ غَمًّۢا بِغَمٍّ لِّكَيْلَا تَحْزَنُوا۟ عَلَىٰ مَا فَاتَكُمْ وَلَا مَآ أَصَـٰبَكُمْ ۗ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ
  trl: Idh tuṣʿidūna wa-lā talwūna ʿalā aḥadin wa-l-rasūlu yadʿūkum fī ukhrākum fa-athābakum ghamman bi-ghammin li-kaylā taḥzanū ʿalā mā fātakum wa-lā mā aṣābakum — wa-llāhu khabīrun bi-mā taʿmalūn
  trad: Lorsque vous fuyiez sans vous retourner vers personne, tandis que le rasūl vous appelait, à l'arrière de vous, Il vous a alors rétribué d'un chagrin après un chagrin, afin que vous ne vous affligiez ni pour ce qui vous a échappé ni pour ce qui vous a atteints — Allaah est parfaitement informé de ce que vous faites.
- ref: S.3:154
  ar: ثُمَّ أَنزَلَ عَلَيْكُم مِّنۢ بَعْدِ ٱلْغَمِّ أَمَنَةً نُّعَاسًا يَغْشَىٰ طَآئِفَةً مِّنكُمْ ۖ وَطَآئِفَةٌ قَدْ أَهَمَّتْهُمْ أَنفُسُهُمْ يَظُنُّونَ بِٱللَّهِ غَيْرَ ٱلْحَقِّ ظَنَّ ٱلْجَـٰهِلِيَّةِ ۖ يَقُولُونَ هَل لَّنَا مِنَ ٱلْأَمْرِ مِن شَىْءٍ ۗ قُلْ إِنَّ ٱلْأَمْرَ كُلَّهُۥ لِلَّهِ ۗ يُخْفُونَ فِىٓ أَنفُسِهِم مَّا لَا يُبْدُونَ لَكَ ۖ يَقُولُونَ لَوْ كَانَ لَنَا مِنَ ٱلْأَمْرِ شَىْءٌ مَّا قُتِلْنَا هَـٰهُنَا ۗ قُل لَّوْ كُنتُمْ فِى بُيُوتِكُمْ لَبَرَزَ ٱلَّذِينَ كُتِبَ عَلَيْهِمُ ٱلْقَتْلُ إِلَىٰ مَضَاجِعِهِمْ ۖ وَلِيَبْتَلِىَ ٱللَّهُ مَا فِى صُدُورِكُمْ وَلِيُمَحِّصَ مَا فِى قُلُوبِكُمْ ۗ وَٱللَّهُ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ
  trl: Thumma anzala ʿalaykum min baʿdi l-ghammi amanatan nuʿāsan yaghshā ṭāʾifatan minkum — wa-ṭāʾifatun qad ahammathum anfusuhum yaẓunnūna bi-llāhi ghayra l-ḥaqqi ẓanna l-jāhiliyyah — yaqūlūna hal lanā mina l-amri min shayʾ — qul inna l-amra kullahu li-llāh — yukhfūna fī anfusihim mā lā yubdūna lak — yaqūlūna law kāna lanā mina l-amri shayʾun mā qutilnā hāhunā — qul law kuntum fī buyūtikum la-baraza lladhīna kutiba ʿalayhimu l-qatlu ilā maḍājiʿihim — wa-li-yabtaliya llāhu mā fī ṣudūrikum wa-li-yumaḥḥiṣa mā fī qulūbikum — wa-llāhu ʿalīmun bi-dhāti l-ṣudūr
  trad: 'Puis Il a fait descendre sur vous, après le chagrin, un apaisement — un assoupissement qui enveloppait une partie d''entre vous, tandis qu''une autre partie, préoccupée d''elle-même, pensait d''Allaah ce qui n''est pas vrai — une pensée d''ignorance — disant : « Avons-nous quelque chose à dire dans l''affaire ? » Dis : « L''affaire tout entière appartient à Allaah. » Ils cachent en eux-mêmes ce qu''ils ne te dévoilent pas, disant : « Si nous avions eu quelque chose à dire dans l''affaire, nous n''aurions pas été tués ici. » Dis : « Même si vous étiez restés dans vos maisons, ceux pour qui la mort était prescrite se seraient certainement rendus vers leurs lieux de chute » — afin qu''Allaah éprouve ce qu''il y a dans vos poitrines, et qu''Il trie ce qu''il y a dans vos cœurs. Allaah connaît parfaitement le contenu des poitrines.'
- ref: S.3:155
  ar: إِنَّ ٱلَّذِينَ تَوَلَّوْا۟ مِنكُمْ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ إِنَّمَا ٱسْتَزَلَّهُمُ ٱلشَّيْطَـٰنُ بِبَعْضِ مَا كَسَبُوا۟ ۖ وَلَقَدْ عَفَا ٱللَّهُ عَنْهُمْ ۗ إِنَّ ٱللَّهَ غَفُورٌ حَلِيمٌ
  trl: Inna lladhīna tawallaw minkum yawma ltaqā l-jamʿāni innamā stazallahumu l-shayṭānu bi-baʿḍi mā kasabū — wa-la-qad ʿafā llāhu ʿanhum — inna llāha ghafūrun ḥalīm
  trad: 'Ceux d''entre vous qui se sont détournés, le jour où les deux groupes se sont rencontrés, le Shayṭān les a fait glisser à cause d''une partie de ce qu''ils avaient acquis — et Allaah leur a certes pardonné : Allaah est ghafūr, ḥalīm.'
- ref: S.3:156
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَكُونُوا۟ كَٱلَّذِينَ كَفَرُوا۟ وَقَالُوا۟ لِإِخْوَٰنِهِمْ إِذَا ضَرَبُوا۟ فِى ٱلْأَرْضِ أَوْ كَانُوا۟ غُزًّى لَّوْ كَانُوا۟ عِندَنَا مَا مَاتُوا۟ وَمَا قُتِلُوا۟ لِيَجْعَلَ ٱللَّهُ ذَٰلِكَ حَسْرَةً فِى قُلُوبِهِمْ ۗ وَٱللَّهُ يُحْىِۦ وَيُمِيتُ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
  trl: Yā-ayyuhā lladhīna āmanū lā takūnū ka-lladhīna kafarū wa-qālū li-ikhwānihim idhā ḍarabū fi l-arḍi aw kānū ghuzzan law kānū ʿindanā mā mātū wa-mā qutilū li-yajʿala llāhu dhālika ḥasratan fī qulūbihim — wa-llāhu yuḥyī wa-yumīt — wa-llāhu bi-mā taʿmalūna baṣīr
  trad: 'Ô vous qui avez cru, ne soyez pas comme ceux qui sont kāfirūn et qui disent de leurs frères, lorsqu''ils voyagent sur terre ou partent en expédition : « S''ils étaient restés auprès de nous, ils ne seraient pas morts et n''auraient pas été tués » — afin qu''Allaah fasse de cela un regret amer dans leurs cœurs. C''est Allaah qui fait vivre et fait mourir — Allaah voit parfaitement ce que vous faites.'
- ref: S.3:157–158
  ar: وَلَئِن قُتِلْتُمْ فِى سَبِيلِ ٱللَّهِ أَوْ مُتُّمْ لَمَغْفِرَةٌ مِّنَ ٱللَّهِ وَرَحْمَةٌ خَيْرٌ مِّمَّا يَجْمَعُونَ ۝ وَلَئِن مُّتُّمْ أَوْ قُتِلْتُمْ لَإِلَى ٱللَّهِ تُحْشَرُونَ
  trl: Wa-la-in qutiltum fī sabīli llāhi aw muttum la-maghfiratun mina llāhi wa-raḥmatun khayrun mimmā yajmaʿūn — wa-la-in muttum aw qutiltum la-ilā llāhi tuḥsharūn
  trad: Si vous êtes tués sur le chemin d'Allaah ou si vous mourez, un pardon d'Allaah et une raḥma valent mieux que ce qu'ils amassent. Que vous mouriez ou soyez tués, c'est vers Allaah que vous serez rassemblés.
- ref: S.3:159
  ar: فَبِمَا رَحْمَةٍ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ ۖ فَٱعْفُ عَنْهُمْ وَٱسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِى ٱلْأَمْرِ ۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى ٱللَّهِ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُتَوَكِّلِينَ
  trl: Fa-bi-mā raḥmatin mina llāhi linta lahum — wa-law kunta fażżan ghalīẓa l-qalbi la-nfaḍḍū min ḥawlik — fa-ʿfu ʿanhum wa-staghfir lahum wa-shāwirhum fi l-amr — fa-idhā ʿazamta fa-tawakkal ʿalā llāh — inna llāha yuḥibbu l-mutawakkilīn
  trad: C'est par une raḥma venue d'Allaah que tu as été doux envers eux — si tu avais été rude, au cœur dur, ils se seraient dispersés loin de toi. Pardonne-leur donc, implore le pardon pour eux, et consulte-les sur l'affaire ; puis, une fois ta décision arrêtée, place ta confiance en Allaah — Allaah aime ceux qui placent leur confiance en Lui.
- ref: S.3:160
  ar: إِن يَنصُرْكُمُ ٱللَّهُ فَلَا غَالِبَ لَكُمْ ۖ وَإِن يَخْذُلْكُمْ فَمَن ذَا ٱلَّذِى يَنصُرُكُم مِّنۢ بَعْدِهِۦ ۗ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ
  trl: In yanṣurkumu llāhu fa-lā ghāliba lakum — wa-in yakhdhulkum fa-man dhā lladhī yanṣurukum min baʿdih — wa-ʿalā llāhi fa-l-yatawakkali l-muʾminūn
  trad: Si Allaah vous secourt, nul ne peut vous vaincre ; s'Il vous abandonne, qui donc pourrait vous secourir après Lui ? Que les muʾminūn placent leur confiance en Allaah seul.
- ref: S.3:161
  ar: وَمَا كَانَ لِنَبِىٍّ أَن يَغُلَّ ۚ وَمَن يَغْلُلْ يَأْتِ بِمَا غَلَّ يَوْمَ ٱلْقِيَـٰمَةِ ۚ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
  trl: Wa-mā kāna li-nabiyyin an yaghulla — wa-man yaghlul yaʾti bi-mā ghalla yawma l-qiyāmah — thumma tuwaffā kullu nafsin mā kasabat wa-hum lā yuẓlamūn
  trad: Il n'appartient à aucun nabī de commettre un ghulūl — quiconque commet un ghulūl viendra, au jour de la résurrection, avec ce qu'il a soustrait. Puis chaque âme recevra en plein ce qu'elle a acquis, sans qu'aucune tort ne lui soit fait.
- ref: S.3:162–163
  ar: أَفَمَنِ ٱتَّبَعَ رِضْوَٰنَ ٱللَّهِ كَمَنۢ بَآءَ بِسَخَطٍ مِّنَ ٱللَّهِ وَمَأْوَىٰهُ جَهَنَّمُ ۚ وَبِئْسَ ٱلْمَصِيرُ ۝ هُمْ دَرَجَـٰتٌ عِندَ ٱللَّهِ ۗ وَٱللَّهُ بَصِيرٌۢ بِمَا يَعْمَلُونَ
  trl: A-fa-mani ttabaʿa riḍwāna llāhi ka-man bāʾa bi-sakhaṭin mina llāhi wa-maʾwāhu jahannam — wa-biʾsa l-maṣīr — hum darajātun ʿinda llāh — wa-llāhu baṣīrun bi-mā yaʿmalūn
  trad: Celui qui a suivi l'agrément d'Allaah est-il comparable à celui qui est revenu chargé d'un courroux d'Allaah, et dont le refuge est jahannam — quelle détestable destination ? Ils sont des degrés auprès d'Allaah — Allaah voit parfaitement ce qu'ils font.
- ref: S.3:164
  ar: لَقَدْ مَنَّ ٱللَّهُ عَلَى ٱلْمُؤْمِنِينَ إِذْ بَعَثَ فِيهِمْ رَسُولًا مِّنْ أَنفُسِهِمْ يَتْلُوا۟ عَلَيْهِمْ ءَايَـٰتِهِۦ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ ٱلْكِتَـٰبَ وَٱلْحِكْمَةَ وَإِن كَانُوا۟ مِن قَبْلُ لَفِى ضَلَـٰلٍ مُّبِينٍ
  trl: La-qad manna llāhu ʿala l-muʾminīna idh baʿatha fīhim rasūlan min anfusihim yatlū ʿalayhim āyātihi wa-yuzakkīhim wa-yuʿallimuhumu l-kitāba wa-l-ḥikmata wa-in kānū min qablu la-fī ḍalālin mubīn
  trad: Allaah a certes accordé une faveur aux muʾminūn en suscitant parmi eux un rasūl issu d'eux-mêmes, qui leur récite Ses signes, les fait croître en pureté, et leur enseigne le kitāb et la ḥikma — alors qu'ils étaient auparavant dans un égarement manifeste.
- ref: S.3:165
  ar: أَوَلَمَّآ أَصَـٰبَتْكُم مُّصِيبَةٌ قَدْ أَصَبْتُم مِّثْلَيْهَا قُلْتُمْ أَنَّىٰ هَـٰذَا ۖ قُلْ هُوَ مِنْ عِندِ أَنفُسِكُمْ ۗ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
  trl: A-wa-lammā aṣābatkum muṣībatun qad aṣabtum mithlayhā qultum annā hādhā — qul huwa min ʿindi anfusikum — inna llāha ʿalā kulli shayʾin qadīr
  trad: 'Est-ce que, lorsqu''un malheur vous atteint après que vous en avez infligé le double, vous dites : « D''où cela vient-il ? » Dis : « Cela vient de vous-mêmes. » Allaah a pouvoir sur toute chose.'
- ref: S.3:166–167
  ar: وَمَآ أَصَـٰبَكُمْ يَوْمَ ٱلْتَقَى ٱلْجَمْعَانِ فَبِإِذْنِ ٱللَّهِ وَلِيَعْلَمَ ٱلْمُؤْمِنِينَ ۝ وَلِيَعْلَمَ ٱلَّذِينَ نَافَقُوا۟ ۚ وَقِيلَ لَهُمْ تَعَالَوْا۟ قَـٰتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَوِ ٱدْفَعُوا۟ ۖ قَالُوا۟ لَوْ نَعْلَمُ قِتَالًا لَّٱتَّبَعْنَـٰكُمْ ۗ هُمْ لِلْكُفْرِ يَوْمَئِذٍ أَقْرَبُ مِنْهُمْ لِلْإِيمَـٰنِ ۚ يَقُولُونَ بِأَفْوَٰهِهِم مَّا لَيْسَ فِى قُلُوبِهِمْ ۗ وَٱللَّهُ أَعْلَمُ بِمَا يَكْتُمُونَ
  trl: Wa-mā aṣābakum yawma ltaqā l-jamʿāni fa-bi-idhni llāhi wa-li-yaʿlama l-muʾminīn — wa-li-yaʿlama lladhīna nāfaqū — wa-qīla lahum taʿālaw qātilū fī sabīli llāhi awi dfaʿū — qālū law naʿlamu qitālan la-ttabaʿnākum — hum li-l-kufri yawmaʾidhin aqrabu minhum li-l-īmān — yaqūlūna bi-afwāhihim mā laysa fī qulūbihim — wa-llāhu aʿlamu bi-mā yaktumūn
  trad: 'Ce qui vous a atteints le jour où les deux groupes se sont rencontrés l''a été par la permission d''Allaah, et afin qu''Il distingue les muʾminūn — et qu''Il distingue ceux qui ont pratiqué le nifāq. Il leur fut dit : « Venez, combattez sur le chemin d''Allaah, ou du moins repoussez [l''ennemi]. » Ils dirent : « Si nous savions qu''il y aurait combat, nous vous suivrions. » Ils étaient ce jour-là plus proches du kufr que de la foi, disant de leurs bouches ce qui n''était pas dans leurs cœurs — Allaah connaît parfaitement ce qu''ils dissimulent.'
- ref: S.3:168
  ar: ٱلَّذِينَ قَالُوا۟ لِإِخْوَٰنِهِمْ وَقَعَدُوا۟ لَوْ أَطَاعُونَا مَا قُتِلُوا۟ ۗ قُلْ فَٱدْرَءُوا۟ عَنْ أَنفُسِكُمُ ٱلْمَوْتَ إِن كُنتُمْ صَـٰدِقِينَ
  trl: Alladhīna qālū li-ikhwānihim wa-qaʿadū law aṭāʿūnā mā qutilū — qul fa-drāʾū ʿan anfusikumu l-mawta in kuntum ṣādiqīn
  trad: 'Ceux qui ont dit de leurs frères, tout en restant assis : « S''ils nous avaient obéi, ils n''auraient pas été tués » — dis : « Écartez donc la mort de vous-mêmes, si vous êtes véridiques. »'
- ref: S.3:169–171
  ar: وَلَا تَحْسَبَنَّ ٱلَّذِينَ قُتِلُوا۟ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتًۢا ۚ بَلْ أَحْيَآءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ ۝ فَرِحِينَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ وَيَسْتَبْشِرُونَ بِٱلَّذِينَ لَمْ يَلْحَقُوا۟ بِهِم مِّنْ خَلْفِهِمْ أَلَّا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ۝ يَسْتَبْشِرُونَ بِنِعْمَةٍ مِّنَ ٱللَّهِ وَفَضْلٍ وَأَنَّ ٱللَّهَ لَا يُضِيعُ أَجْرَ ٱلْمُؤْمِنِينَ
  trl: Wa-lā taḥsabanna lladhīna qutilū fī sabīli llāhi amwātan — bal aḥyāʾun ʿinda rabbihim yurzaqūn — fariḥīna bi-mā ātāhumu llāhu min faḍlih wa-yastabshirūna bi-lladhīna lam yalḥaqū bihim min khalfihim allā khawfun ʿalayhim wa-lā hum yaḥzanūn — yastabshirūna bi-niʿmatin mina llāhi wa-faḍlin wa-anna llāha lā yuḍīʿu ajra l-muʾminīn
  trad: 'Ne considère pas ceux qui sont tués sur le chemin d''Allaah comme morts — bien au contraire, vivants, auprès de leur Rabb, pourvus. Se réjouissant de ce qu''Allaah leur a donné de Sa faveur, et se réjouissant par avance au sujet de ceux qui ne les ont pas encore rejoints, venant après eux : aucune crainte sur eux, et ils ne s''affligeront pas. Ils se réjouissent d''un bienfait d''Allaah et d''une faveur, et de ce qu''Allaah ne laisse pas se perdre la rétribution des muʾminūn.'
- ref: S.3:172–173
  ar: ٱلَّذِينَ ٱسْتَجَابُوا۟ لِلَّهِ وَٱلرَّسُولِ مِنۢ بَعْدِ مَآ أَصَابَهُمُ ٱلْقَرْحُ ۚ لِلَّذِينَ أَحْسَنُوا۟ مِنْهُمْ وَٱتَّقَوْا۟ أَجْرٌ عَظِيمٌ ۝ ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَـٰنًا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ
  trl: Alladhīna stajābū li-llāhi wa-l-rasūli min baʿdi mā aṣābahumu l-qarḥ — li-lladhīna aḥsanū minhum wa-ttaqaw ajrun ʿaẓīm — alladhīna qāla lahumu l-nāsu inna l-nāsa qad jamaʿū lakum fa-khshawhum fa-zādahum īmānan wa-qālū ḥasbunā llāhu wa-niʿma l-wakīl
  trad: 'Ceux qui ont répondu à Allaah et au rasūl après que la blessure les eut atteints — pour ceux d''entre eux qui ont agi avec excellence et se sont constitué une taqwā, une rétribution immense. Ceux à qui les gens dirent : « Les gens se sont rassemblés contre vous, craignez-les » — cela ne fit qu''accroître leur foi, et ils dirent : « Allaah nous suffit — quel excellent mandataire ! »'
- ref: S.3:174–175
  ar: فَٱنقَلَبُوا۟ بِنِعْمَةٍ مِّنَ ٱللَّهِ وَفَضْلٍ لَّمْ يَمْسَسْهُمْ سُوٓءٌ وَٱتَّبَعُوا۟ رِضْوَٰنَ ٱللَّهِ ۗ وَٱللَّهُ ذُو فَضْلٍ عَظِيمٍ ۝ إِنَّمَا ذَٰلِكُمُ ٱلشَّيْطَـٰنُ يُخَوِّفُ أَوْلِيَآءَهُۥ فَلَا تَخَافُوهُمْ وَخَافُونِ إِن كُنتُم مُّؤْمِنِينَ
  trl: Fa-nqalabū bi-niʿmatin mina llāhi wa-faḍlin lam yamsashum sūʾun wa-ttabaʿū riḍwāna llāh — wa-llāhu dhū faḍlin ʿaẓīm — innamā dhālikumu l-shayṭānu yukhawwifu awliyāʾahu fa-lā takhāfūhum wa-khāfūni in kuntum muʾminīn
  trad: Ils s'en revinrent avec un bienfait d'Allaah et une faveur, sans qu'aucun mal ne les eût touchés, et ils suivirent l'agrément d'Allaah — Allaah dispose d'une faveur immense. Ce n'est que le Shayṭān qui effraie ses alliés — ne les craignez donc pas, et craignez-Moi, si vous êtes muʾminūn.
- ref: S.3:176–177
  ar: وَلَا يَحْزُنكَ ٱلَّذِينَ يُسَـٰرِعُونَ فِى ٱلْكُفْرِ ۚ إِنَّهُمْ لَن يَضُرُّوا۟ ٱللَّهَ شَيْـًٔا ۗ يُرِيدُ ٱللَّهُ أَلَّا يَجْعَلَ لَهُمْ حَظًّا فِى ٱلْـَٔاخِرَةِ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌ ۝ إِنَّ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلْكُفْرَ بِٱلْإِيمَـٰنِ لَن يَضُرُّوا۟ ٱللَّهَ شَيْـًٔا وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Wa-lā yaḥzunka lladhīna yusāriʿūna fi l-kufr — innahum lan yaḍurrū llāha shayʾā — yurīdu llāhu allā yajʿala lahum ḥaẓẓan fi l-ākhirati wa-lahum ʿadhābun ʿaẓīm — inna lladhīna shtarawu l-kufra bi-l-īmāni lan yaḍurrū llāha shayʾan wa-lahum ʿadhābun alīm
  trad: Que ne t'afflige pas ceux qui se hâtent vers le kufr — ils ne nuiront en rien à Allaah. Allaah veut ne leur accorder aucune part dans l'ākhira, et pour eux un châtiment immense. Ceux qui ont acheté le kufr au prix de l'īmān ne nuiront en rien à Allaah, et pour eux un châtiment douloureux.
- ref: S.3:178
  ar: وَلَا يَحْسَبَنَّ ٱلَّذِينَ كَفَرُوٓا۟ أَنَّمَا نُمْلِى لَهُمْ خَيْرٌ لِّأَنفُسِهِمْ ۚ إِنَّمَا نُمْلِى لَهُمْ لِيَزْدَادُوٓا۟ إِثْمًا ۚ وَلَهُمْ عَذَابٌ مُّهِينٌ
  trl: Wa-lā yaḥsabanna lladhīna kafarū annamā numlī lahum khayrun li-anfusihim — innamā numlī lahum li-yazdādū ithman — wa-lahum ʿadhābun muhīn
  trad: Que ceux qui sont kāfirūn ne pensent pas que le délai que Nous leur accordons soit un bien pour eux-mêmes — Nous ne leur accordons ce délai que pour qu'ils s'accroissent en faute — et pour eux un châtiment humiliant.
- ref: S.3:179
  ar: مَّا كَانَ ٱللَّهُ لِيَذَرَ ٱلْمُؤْمِنِينَ عَلَىٰ مَآ أَنتُمْ عَلَيْهِ حَتَّىٰ يَمِيزَ ٱلْخَبِيثَ مِنَ ٱلطَّيِّبِ ۗ وَمَا كَانَ ٱللَّهُ لِيُطْلِعَكُمْ عَلَى ٱلْغَيْبِ وَلَـٰكِنَّ ٱللَّهُ يَجْتَبِى مِن رُّسُلِهِۦ مَن يَشَآءُ ۖ فَـَٔامِنُوا۟ بِٱللَّهِ وَرُسُلِهِۦ ۚ وَإِن تُؤْمِنُوا۟ وَتَتَّقُوا۟ فَلَكُمْ أَجْرٌ عَظِيمٌ
  trl: Mā kāna llāhu li-yadhara l-muʾminīna ʿalā mā antum ʿalayhi ḥattā yamīza l-khabītha mina l-ṭayyib — wa-mā kāna llāhu li-yuṭliʿakum ʿala l-ghaybi wa-lākinna llāha yajtabī min rusulihi man yashāʾ — fa-āminū bi-llāhi wa-rusulih — wa-in tuʾminū wa-tattaqū fa-lakum ajrun ʿaẓīm
  trad: Allaah n'est pas de nature à laisser les muʾminūn dans l'état où vous êtes, sans distinguer le vicié du bon — Allaah n'est pas de nature à vous faire accéder au ghayb, mais Allaah choisit, parmi Ses rusul, qui Il veut. Croyez donc en Allaah et en Ses rusul — si vous croyez et vous constituez une taqwā, une rétribution immense vous revient.
- ref: S.3:180
  ar: وَلَا يَحْسَبَنَّ ٱلَّذِينَ يَبْخَلُونَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ هُوَ خَيْرًا لَّهُم ۖ بَلْ هُوَ شَرٌّ لَّهُمْ ۖ سَيُطَوَّقُونَ مَا بَخِلُوا۟ بِهِۦ يَوْمَ ٱلْقِيَـٰمَةِ ۗ وَلِلَّهِ مِيرَٰثُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ
  trl: Wa-lā yaḥsabanna lladhīna yabkhalūna bi-mā ātāhumu llāhu min faḍlihi huwa khayran lahum — bal huwa sharrun lahum — sa-yuṭawwaqūna mā bakhilū bihi yawma l-qiyāmah — wa-li-llāhi mīrāthu l-samāwāti wa-l-arḍ — wa-llāhu bi-mā taʿmalūna khabīr
  trad: 'Que ceux qui font preuve d''avarice concernant ce qu''Allaah leur a donné de Sa faveur ne pensent pas que cela soit un bien pour eux — c''est au contraire un mal pour eux : ce dont ils ont été avares leur sera mis en collier au jour de la résurrection. À Allaah revient l''héritage des cieux et de la terre — Allaah est parfaitement informé de ce que vous faites.'
- ref: S.3:181–182
  ar: لَّقَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَآءُ ۘ سَنَكْتُبُ مَا قَالُوا۟ وَقَتْلَهُمُ ٱلْأَنۢبِيَآءَ بِغَيْرِ حَقٍّ وَنَقُولُ ذُوقُوا۟ عَذَابَ ٱلْحَرِيقِ ۝ ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ ٱللَّهَ لَيْسَ بِظَلَّامٍ لِّلْعَبِيدِ
  trl: La-qad samiʿa llāhu qawla lladhīna qālū inna llāha faqīrun wa-naḥnu aghniyāʾ — sa-naktubu mā qālū wa-qatlahumu l-anbiyāʾa bi-ghayri ḥaqqin wa-naqūlu dhūqū ʿadhāba l-ḥarīq — dhālika bi-mā qaddamat aydīkum wa-anna llāha laysa bi-ẓallāmin li-l-ʿabīd
  trad: 'Allaah a certes entendu la parole de ceux qui ont dit : « Allaah est pauvre, et nous sommes riches. » Nous consignerons ce qu''ils ont dit, ainsi que leur meurtre des nabiyyūn sans droit, et Nous dirons : « Goûtez le châtiment de l''embrasement. » Cela, à cause de ce que vos mains ont avancé — Allaah n''est en rien injuste envers les serviteurs.'
- ref: S.3:183–184
  ar: ٱلَّذِينَ قَالُوٓا۟ إِنَّ ٱللَّهَ عَهِدَ إِلَيْنَآ أَلَّا نُؤْمِنَ لِرَسُولٍ حَتَّىٰ يَأْتِيَنَا بِقُرْبَانٍ تَأْكُلُهُ ٱلنَّارُ ۗ قُلْ قَدْ جَآءَكُمْ رُسُلٌ مِّن قَبْلِى بِٱلْبَيِّنَـٰتِ وَبِٱلَّذِى قُلْتُمْ فَلِمَ قَتَلْتُمُوهُمْ إِن كُنتُمْ صَـٰدِقِينَ ۝ فَإِن كَذَّبُوكَ فَقَدْ كُذِّبَ رُسُلٌ مِّن قَبْلِكَ جَآءُو بِٱلْبَيِّنَـٰتِ وَٱلزُّبُرِ وَٱلْكِتَـٰبِ ٱلْمُنِيرِ
  trl: Alladhīna qālū inna llāha ʿahida ilaynā allā nuʾmina li-rasūlin ḥattā yaʾtiyanā bi-qurbānin taʾkuluhu l-nār — qul qad jāʾakum rusulun min qablī bi-l-bayyināti wa-bi-lladhī qultum fa-lima qataltumūhum in kuntum ṣādiqīn — fa-in kadhdhabūka fa-qad kudhdhiba rusulun min qablika jāʾū bi-l-bayyināti wa-l-zuburi wa-l-kitābi l-munīr
  trad: 'Ceux qui ont dit : « Allaah nous a engagés à ne croire aucun rasūl avant qu''il ne nous apporte une offrande que le feu consume. » Dis : « Des rusul sont venus avant moi avec les bayyināt, et avec ce que vous dites — pourquoi donc les avez-vous tués, si vous êtes véridiques ? » S''ils te démentent, des rusul avant toi ont été démentis, qui étaient venus avec les bayyināt, les zubur et le kitāb éclairant.'
- ref: S.3:185
  ar: كُلُّ نَفْسٍ ذَآئِقَةُ ٱلْمَوْتِ ۗ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ ٱلْقِيَـٰمَةِ ۖ فَمَن زُحْزِحَ عَنِ ٱلنَّارِ وَأُدْخِلَ ٱلْجَنَّةَ فَقَدْ فَازَ ۗ وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا مَتَـٰعُ ٱلْغُرُورِ
  trl: Kullu nafsin dhāʾiqatu l-mawt — wa-innamā tuwaffawna ujūrakum yawma l-qiyāmah — fa-man zuḥziḥa ʿani l-nāri wa-udkhila l-jannata fa-qad fāz — wa-mā l-ḥayātu l-dunyā illā matāʿu l-ghurūr
  trad: Toute âme goûte la mort — vous recevrez vos rétributions en plein, au jour de la résurrection. Quiconque est écarté du Feu et introduit dans le jardin a certes réussi — la vie d'ici-bas n'est que jouissance qui leurre.
- ref: S.3:186
  ar: لَتُبْلَوُنَّ فِىٓ أَمْوَٰلِكُمْ وَأَنفُسِكُمْ وَلَتَسْمَعُنَّ مِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَـٰبَ مِن قَبْلِكُمْ وَمِنَ ٱلَّذِينَ أَشْرَكُوٓا۟ أَذًى كَثِيرًا ۚ وَإِن تَصْبِرُوا۟ وَتَتَّقُوا۟ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ ٱلْأُمُورِ
  trl: La-tublawunna fī amwālikum wa-anfusikum wa-la-tasmaʿunna mina lladhīna ūtu l-kitāba min qablikum wa-mina lladhīna ashrakū adhan kathīrā — wa-in taṣbirū wa-tattaqū fa-inna dhālika min ʿazmi l-umūr
  trad: Vous serez certainement éprouvés dans vos biens et vos personnes, et vous entendrez certainement, de la part de ceux à qui le Kitāb a été donné avant vous et de la part de ceux qui ont associé, un tort abondant. Mais si vous êtes ṣābirūn et vous constituez une taqwā, cela relève des affaires qui exigent une résolution ferme.
- ref: S.3:187
  ar: وَإِذْ أَخَذَ ٱللَّهُ مِيثَـٰقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَـٰبَ لَتُبَيِّنُنَّهُۥ لِلنَّاسِ وَلَا تَكْتُمُونَهُۥ فَنَبَذُوهُ وَرَآءَ ظُهُورِهِمْ وَٱشْتَرَوْا۟ بِهِۦ ثَمَنًا قَلِيلًا ۖ فَبِئْسَ مَا يَشْتَرُونَ
  trl: Wa-idh akhadha llāhu mīthāqa lladhīna ūtu l-kitāba la-tubayyinunnahu li-l-nāsi wa-lā taktumūnahu fa-nabadhūhu warāʾa ẓuhūrihim wa-shtaraw bihi thamanan qalīlan — fa-biʾsa mā yashtarūn
  trad: 'Et lorsqu''Allaah a pris l''engagement de ceux à qui le Kitāb a été donné : « Vous le rendrez certainement manifeste aux gens, et vous ne le dissimulerez pas » — ils l''ont alors jeté derrière leur dos, et l''ont échangé contre un prix dérisoire : quel détestable échange.'
- ref: S.3:188
  ar: لَا تَحْسَبَنَّ ٱلَّذِينَ يَفْرَحُونَ بِمَآ أَتَوا۟ وَّيُحِبُّونَ أَن يُحْمَدُوا۟ بِمَا لَمْ يَفْعَلُوا۟ فَلَا تَحْسَبَنَّهُم بِمَفَازَةٍ مِّنَ ٱلْعَذَابِ ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Lā taḥsabanna lladhīna yafraḥūna bi-mā ataw wa-yuḥibbūna an yuḥmadū bi-mā lam yafʿalū fa-lā taḥsabannahum bi-mafāzatin mina l-ʿadhāb — wa-lahum ʿadhābun alīm
  trad: 'Ne pense pas que ceux qui se réjouissent de ce qu''ils ont apporté et aiment être loués pour ce qu''ils n''ont pas fait — ne pense pas qu''ils échapperont au châtiment : pour eux un châtiment douloureux.'
- ref: S.3:189–191
  ar: وَلِلَّهِ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ ۝ إِنَّ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَـَٔايَـٰتٍ لِّأُو۟لِى ٱلْأَلْبَـٰبِ ۝ ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَـٰمًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَـٰذَا بَـٰطِلًا سُبْحَـٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ
  trl: Wa-li-llāhi mulku l-samāwāti wa-l-arḍ — wa-llāhu ʿalā kulli shayʾin qadīr — inna fī khalqi l-samāwāti wa-l-arḍi wa-khtilāfi l-layli wa-l-nahāri la-āyātin li-ulī l-albāb — alladhīna yadhkurūna llāha qiyāman wa-quʿūdan wa-ʿalā junūbihim wa-yatafakkarūna fī khalqi l-samāwāti wa-l-arḍ rabbanā mā khalaqta hādhā bāṭilan subḥānaka fa-qinā ʿadhāba l-nār
  trad: 'À Allaah appartient le mulk des cieux et de la terre — Allaah a pouvoir sur toute chose. Dans la création des cieux et de la terre, et l''alternance de la nuit et du jour, il y a certes des signes pour les ūlū l-albāb — ceux qui se souviennent d''Allaah debout, assis, et sur leurs côtés, et qui réfléchissent sur la création des cieux et de la terre : « Notre Rabb, Tu n''as pas créé cela en vain — gloire à Toi, préserve-nous du châtiment du Feu. »'
- ref: S.3:192–194
  ar: رَبَّنَآ إِنَّكَ مَن تُدْخِلِ ٱلنَّارَ فَقَدْ أَخْزَيْتَهُۥ ۖ وَمَا لِلظَّـٰلِمِينَ مِنْ أَنصَارٍ ۝ رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِى لِلْإِيمَـٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا ۚ رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ ۝ رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَـٰمَةِ ۗ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ
  trl: Rabbanā innaka man tudkhili l-nāra fa-qad akhzaytah — wa-mā li-l-ẓālimīna min anṣār — rabbanā innanā samiʿnā munādiyan yunādī li-l-īmāni an āminū bi-rabbikum fa-āmannā — rabbanā fa-ghfir lanā dhunūbanā wa-kaffir ʿannā sayyiʾātinā wa-tawaffanā maʿa l-abrār — rabbanā wa-ātinā mā waʿadtanā ʿalā rusulika wa-lā tukhzinā yawma l-qiyāmah — innaka lā tukhlifu l-mīʿād
  trad: '« Notre Rabb, quiconque Tu fais entrer dans le Feu, Tu l''as certes couvert de honte — et pour les ẓālimūn, aucun secoureur. Notre Rabb, nous avons entendu un appelant qui appelait à la foi : ‹ Croyez en votre Rabb › — et nous avons cru. Notre Rabb, pardonne-nous nos fautes, efface de nous nos mauvaises actions, et fais-nous mourir avec les abrār. Notre Rabb, donne-nous ce que Tu nous as promis par Tes rusul, et ne nous couvre pas de honte au jour de la résurrection — Tu ne manques jamais à Ta promesse. »'
- ref: S.3:195
  ar: فَٱسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّى لَآ أُضِيعُ عَمَلَ عَـٰمِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَىٰ ۖ بَعْضُكُم مِّنۢ بَعْضٍ ۖ فَٱلَّذِينَ هَاجَرُوا۟ وَأُخْرِجُوا۟ مِن دِيَـٰرِهِمْ وَأُوذُوا۟ فِى سَبِيلِى وَقَـٰتَلُوا۟ وَقُتِلُوا۟ لَأُكَفِّرَنَّ عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَأُدْخِلَنَّهُمْ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ثَوَابًا مِّنْ عِندِ ٱللَّهِ ۗ وَٱللَّهُ عِندَهُۥ حُسْنُ ٱلثَّوَابِ
  trl: Fa-stajāba lahum rabbuhum annī lā uḍīʿu ʿamala ʿāmilin minkum min dhakarin aw unthā — baʿḍukum min baʿḍ — fa-lladhīna hājarū wa-ukhrijū min diyārihim wa-ūdhū fī sabīlī wa-qātalū wa-qutilū la-ukaffiranna ʿanhum sayyiʾātihim wa-la-udkhilannahum jannātin tajrī min taḥtihā l-anhāru thawāban min ʿindi llāh — wa-llāhu ʿindahu ḥusnu l-thawāb
  trad: 'Leur Rabb leur a répondu : « Je ne laisse se perdre l''œuvre d''aucun agissant parmi vous, homme ou femme — vous relevez les uns des autres. Ceux qui ont émigré, qui ont été expulsés de leurs demeures, qui ont subi un tort sur Mon chemin, qui ont combattu et ont été tués, J''effacerai certainement leurs mauvaises actions, et Je les ferai certainement entrer dans des jardins sous lesquels coulent les rivières, en rétribution venant d''Allaah — auprès d''Allaah se trouve la plus belle des rétributions. »'
- ref: S.3:196–198
  ar: لَا يَغُرَّنَّكَ تَقَلُّبُ ٱلَّذِينَ كَفَرُوا۟ فِى ٱلْبِلَـٰدِ ۝ مَتَـٰعٌ قَلِيلٌ ثُمَّ مَأْوَىٰهُمْ جَهَنَّمُ ۚ وَبِئْسَ ٱلْمِهَادُ ۝ لَـٰكِنِ ٱلَّذِينَ ٱتَّقَوْا۟ رَبَّهُمْ لَهُمْ جَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا نُزُلًا مِّنْ عِندِ ٱللَّهِ ۗ وَمَا عِندَ ٱللَّهِ خَيْرٌ لِّلْأَبْرَارِ
  trl: Lā yaghurrannaka taqallubu lladhīna kafarū fi l-bilād — matāʿun qalīlun thumma maʾwāhum jahannam — wa-biʾsa l-mihād — lākini lladhīna ttaqaw rabbahum lahum jannātun tajrī min taḥtihā l-anhāru khālidīna fīhā nuzulan min ʿindi llāh — wa-mā ʿinda llāhi khayrun li-l-abrār
  trad: 'Que ne te leurre pas l''aisance de ceux qui sont kāfirūn, allant et venant dans le pays — une jouissance passagère, puis leur refuge est jahannam : quel détestable lieu de repos. Mais ceux qui se sont constitué une taqwā envers leur Rabb ont des jardins sous lesquels coulent les rivières, y demeurant, en accueil venant d''Allaah — ce qui est auprès d''Allaah est meilleur pour les abrār.'
- ref: S.3:199
  ar: وَإِنَّ مِنْ أَهْلِ ٱلْكِتَـٰبِ لَمَن يُؤْمِنُ بِٱللَّهِ وَمَآ أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَـٰشِعِينَ لِلَّهِ لَا يَشْتَرُونَ بِـَٔايَـٰتِ ٱللَّهِ ثَمَنًا قَلِيلًا ۗ أُو۟لَـٰٓئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ ۗ إِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ
  trl: Wa-inna min ahli l-kitābi la-man yuʾminu bi-llāhi wa-mā unzila ilaykum wa-mā unzila ilayhim khāshiʿīna li-llāhi lā yashtarūna bi-āyāti llāhi thamanan qalīlā — ulāʾika lahum ajruhum ʿinda rabbihim — inna llāha sarīʿu l-ḥisāb
  trad: 'Et il y a certes, parmi les Gens du Livre, ceux qui croient en Allaah, à ce qui a été descendu vers vous et à ce qui a été descendu vers eux, s''inclinant devant Allaah, n''échangeant pas les āyāt d''Allaah contre un prix dérisoire — ceux-là ont leur rétribution auprès de leur Rabb : Allaah est prompt à faire le compte.'
- ref: S.3:200
  ar: يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱصْبِرُوا۟ وَصَابِرُوا۟ وَرَابِطُوا۟ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ
  trl: Yā-ayyuhā lladhīna āmanū ṣbirū wa-ṣābirū wa-rābiṭū wa-ttaqu llāha laʿallakum tufliḥūn
  trad: Ô vous qui avez cru, tenez ferme, tenez ferme face à l'adversité, restez attachés en position, et constituez-vous une taqwā d'Allaah — peut-être serez-vous parmi les mufliḥūn.
