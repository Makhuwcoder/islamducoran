- ref: 'S.27:1'
  ar: 'طس ۚ تِلْكَ آيَاتُ الْقُرْآنِ وَكِتَابٍ مُبِينٍ'
  trl: 'Ṭā-Sīn — tilka āyātu l-qurʾāni wa-kitābin mubīn'
  trad: 'Ṭā. Sīn. Voilà les āyāt du Qurʾān, et d''un Kitāb manifeste (mubīn).'
- ref: 'S.27:2–3'
  ar: 'هُدًى وَبُشْرَىٰ لِلْمُؤْمِنِينَ الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ بِالْآخِرَةِ هُمْ يُوقِنُونَ'
  trl: 'Hudan wa-bushrā li-l-muʾminīn — alladhīna yuqīmūna ṣ-ṣalāta wa-yuʾtūna z-zakāta wa-hum bi-l-ākhirati hum yūqinūn'
  trad: 'Guidance (hudan) et bonne annonce (bushrā) pour les muʾminūn — ceux qui établissent la ṣalāt, donnent la zakāt, et qui, de l''au-delà (al-ākhira), ont la certitude (yūqinūn).'
- ref: 'S.27:4–5'
  ar: 'إِنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ زَيَّنَّا لَهُمْ أَعْمَالَهُمْ فَهُمْ يَعْمَهُونَ أُولَٰئِكَ الَّذِينَ لَهُمْ سُوءُ الْعَذَابِ وَهُمْ فِي الْآخِرَةِ هُمُ الْأَخْسَرُونَ'
  trl: 'Inna lladhīna lā yuʾminūna bi-l-ākhirati zayyannā lahum aʿmālahum fa-hum yaʿmahūn — ulāʾika lladhīna lahum sūʾu l-ʿadhābi wa-hum fi l-ākhirati humu l-akhsarūn'
  trad: 'Quant à ceux qui ne croient pas en l''au-delà, Nous avons embelli pour eux leurs actions (zayyannā lahum aʿmālahum) — ils errent donc aveuglément (yaʿmahūn). Voilà ceux pour qui est le pire du châtiment — et ce sont eux, dans l''au-delà, les plus grands perdants (al-akhsarūn).'
- ref: 'S.27:6'
  ar: 'وَإِنَّكَ لَتُلَقَّى الْقُرْآنَ مِنْ لَدُنْ حَكِيمٍ عَلِيمٍ'
  trl: 'Wa-innaka la-tulaqqā l-qurʾāna min ladun ḥakīmin ʿalīm'
  trad: 'Et toi, tu reçois certainement (la-tulaqqā) le Qurʾān, de la part de Ce qui est parfaitement sage et parfaitement savant (ḥakīmin ʿalīm).'
- ref: 'S.27:7'
  ar: 'إِذْ قَالَ مُوسَىٰ لِأَهْلِهِ إِنِّي آنَسْتُ نَارًا سَآتِيكُمْ مِنْهَا بِخَبَرٍ أَوْ آتِيكُمْ بِشِهَابٍ قَبَسٍ لَعَلَّكُمْ تَصْطَلُونَ'
  trl: 'Idh qāla mūsā li-ahlihi innī ānastu nāran sa-ātīkum minhā bi-khabarin aw ātīkum bi-shihābin qabasin laʿallakum taṣṭalūn'
  trad: '[Rappelle] quand Mūsā dit aux siens (li-ahlihi) : « J''ai distinctement perçu (ānastu) un feu — je vous en apporterai une nouvelle (khabar), ou je vous apporterai un tison enflammé (shihābin qabasin), afin que vous vous réchauffiez (taṣṭalūn). »'
- ref: 'S.27:8'
  ar: 'فَلَمَّا جَاءَهَا نُودِيَ أَنْ بُورِكَ مَنْ فِي النَّارِ وَمَنْ حَوْلَهَا وَسُبْحَانَ اللَّهِ رَبِّ الْعَالَمِينَ'
  trl: 'Fa-lammā jāʾahā nūdiya an būrika man fi n-nāri wa-man ḥawlahā wa-subḥāna llāhi rabbi l-ʿālamīn'
  trad: 'Puis, lorsqu''il y parvint, il fut appelé (nūdiya) : « Béni (būrika) soit qui est dans ce feu, et qui est autour de lui — et Allaah, Rabb des ʿālamīn, est dégagé de toute imperfection (subḥāna). »'
- ref: 'S.27:9'
  ar: 'يَا مُوسَىٰ إِنَّهُ أَنَا اللَّهُ الْعَزِيزُ الْحَكِيمُ'
  trl: 'Yā mūsā innahu anā llāhu l-ʿazīzu l-ḥakīm'
  trad: '« Ô Mūsā, c''est Moi, en vérité — Allaah, al-ʿAzīz, al-Ḥakīm. »'
- ref: 'S.27:10'
  ar: 'وَأَلْقِ عَصَاكَ ۚ فَلَمَّا رَآهَا تَهْتَزُّ كَأَنَّهَا جَانٌّ وَلَّىٰ مُدْبِرًا وَلَمْ يُعَقِّبْ ۚ يَا مُوسَىٰ لَا تَخَفْ إِنِّي لَا يَخَافُ لَدَيَّ الْمُرْسَلُونَ'
  trl: 'Wa-alqi ʿaṣāka — fa-lammā raʾāhā tahtazzu ka-annahā jānnun wallā mudbiran wa-lam yuʿaqqib — yā mūsā lā takhaf innī lā yakhāfu ladayya l-mursalūn'
  trad: '« Et jette ton bâton (ʿaṣāka). » Puis, quand il le vit s''agiter (tahtazzu) comme s''il était un jānn, il tourna le dos en fuyant (wallā mudbiran) et ne revint pas sur ses pas (lam yuʿaqqib). « Ô Mūsā, ne crains rien (lā takhaf) : en vérité, auprès de Moi (ladayya), les mursalūn ne craignent pas. »'
- ref: 'S.27:11'
  ar: 'إِلَّا مَنْ ظَلَمَ ثُمَّ بَدَّلَ حُسْنًا بَعْدَ سُوءٍ فَإِنِّي غَفُورٌ رَحِيمٌ'
  trl: 'Illā man ẓalama thumma baddala ḥusnan baʿda sūʾin fa-innī ghafūrun raḥīm'
  trad: '— sauf celui qui a commis une injustice (ẓalama), puis a substitué le bien après le mal (baddala ḥusnan baʿda sūʾin) : alors, Moi, Je suis Ghafūr, Raḥīm.'
- ref: 'S.27:12'
  ar: 'وَأَدْخِلْ يَدَكَ فِي جَيْبِكَ تَخْرُجْ بَيْضَاءَ مِنْ غَيْرِ سُوءٍ ۖ فِي تِسْعِ آيَاتٍ إِلَىٰ فِرْعَوْنَ وَقَوْمِهِ ۚ إِنَّهُمْ كَانُوا قَوْمًا فَاسِقِينَ'
  trl: 'Wa-adkhil yadaka fī jaybika takhruj bayḍāʾa min ghayri sūʾin fī tisʿi āyātin ilā firʿawna wa-qawmihi innahum kānū qawman fāsiqīn'
  trad: '« Et introduis ta main (yadaka) dans l''ouverture de ton vêtement (jaybika) : elle en sortira blanche, sans mal aucun (bayḍāʾa min ghayri sūʾin) — [cela,] parmi neuf āyāt, [destinées] à Firʿawn et à son peuple : ils sont certes un peuple qui transgresse (fāsiqīn). »'
- ref: 'S.27:13'
  ar: 'فَلَمَّا جَاءَتْهُمْ آيَاتُنَا مُبْصِرَةً قَالُوا هَٰذَا سِحْرٌ مُبِينٌ'
  trl: 'Fa-lammā jāʾat-hum āyātunā mubṣiratan qālū hādhā siḥrun mubīn'
  trad: 'Puis, lorsque Nos āyāt leur vinrent, donnant à voir clairement (mubṣiratan), ils dirent : « Ceci est une sorcellerie manifeste (siḥrun mubīn). »'
- ref: 'S.27:14'
  ar: 'وَجَحَدُوا بِهَا وَاسْتَيْقَنَتْهَا أَنْفُسُهُمْ ظُلْمًا وَعُلُوًّا ۚ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُفْسِدِينَ'
  trl: 'Wa-jaḥadū bihā wa-stayqanat-hā anfusuhum ẓulman wa-ʿuluwwan fa-nẕur kayfa kāna ʿāqibatu l-mufsidīn'
  trad: 'Et ils les renièrent (jaḥadū), alors que leurs âmes en avaient la certitude intérieure (istayqanat-hā anfusuhum) — par injustice (ẓulman) et par orgueil (ʿuluwwan). Regarde donc ce qu''il advint de la fin (ʿāqiba) de ceux qui sèment le trouble (al-mufsidīn).'
- ref: 'S.27:15'
  ar: 'وَلَقَدْ آتَيْنَا دَاوُودَ وَسُلَيْمَانَ عِلْمًا ۖ وَقَالَا الْحَمْدُ لِلَّهِ الَّذِي فَضَّلَنَا عَلَىٰ كَثِيرٍ مِنْ عِبَادِهِ الْمُؤْمِنِينَ'
  trl: 'Wa-la-qad ātaynā dāwūda wa-sulaymāna ʿilman wa-qālā l-ḥamdu lillāhi lladhī faḍḍalanā ʿalā kathīrin min ʿibādihi l-muʾminīn'
  trad: 'Et Nous avons certes donné à Dāwūd et à Sulaymān une science (ʿilman) — et tous deux dirent : « La ḥamd est à Allaah, Ce qui nous a favorisés (faḍḍalanā) au-dessus de beaucoup de Ses ʿibād muʾminūn. »'
- ref: 'S.27:16'
  ar: 'وَوَرِثَ سُلَيْمَانُ دَاوُودَ ۖ وَقَالَ يَا أَيُّهَا النَّاسُ عُلِّمْنَا مَنْطِقَ الطَّيْرِ وَأُوتِينَا مِنْ كُلِّ شَيْءٍ ۖ إِنَّ هَٰذَا لَهُوَ الْفَضْلُ الْمُبِينُ'
  trl: 'Wa-waritha sulaymānu dāwūda wa-qāla yā ayyuhā n-nāsu ʿullimnā manṭiqa ṭ-ṭayri wa-ūtīnā min kulli shayʾin inna hādhā la-huwa l-faḍlu l-mubīn'
  trad: 'Et Sulaymān hérita de (waritha) Dāwūd, et dit : « Ô vous, les gens (an-nās) ! On nous a enseigné le langage des oiseaux (manṭiqa ṭ-ṭayr), et on nous a donné de toute chose — ceci est assurément la faveur manifeste (al-faḍlu l-mubīn). »'
- ref: 'S.27:17'
  ar: 'وَحُشِرَ لِسُلَيْمَانَ جُنُودُهُ مِنَ الْجِنِّ وَالْإِنْسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَ'
  trl: 'Wa-ḥushira li-sulaymāna junūduhu mina l-jinni wa-l-insi wa-ṭ-ṭayri fa-hum yūzaʿūn'
  trad: 'Et furent rassemblées (ḥushira), pour Sulaymān, ses armées (junūduhu) — parmi les jinn, les humains (al-ins), et les oiseaux — et elles étaient tenues en ordre, contenues (yūzaʿūn).'
- ref: 'S.27:18'
  ar: 'حَتَّىٰ إِذَا أَتَوْا عَلَىٰ وَادِ النَّمْلِ قَالَتْ نَمْلَةٌ يَا أَيُّهَا النَّمْلُ ادْخُلُوا مَسَاكِنَكُمْ لَا يَحْطِمَنَّكُمْ سُلَيْمَانُ وَجُنُودُهُ وَهُمْ لَا يَشْعُرُونَ'
  trl: 'Ḥattā idhā ataw ʿalā wādi n-namli qālat namlatun yā ayyuhā n-namlu dkhulū masākinakum lā yaḥṭimannakum sulaymānu wa-junūduhu wa-hum lā yashʿurūn'
  trad: '— jusqu''à ce que, parvenus à la vallée des fourmis (wādi n-naml), une fourmi (namlatun) dît : « Ô fourmis ! Entrez dans vos demeures (masākinakum), de peur que Sulaymān et ses armées ne vous écrasent (yaḥṭimannakum) sans s''en apercevoir (wa-hum lā yashʿurūn). »'
- ref: 'S.27:19'
  ar: 'فَتَبَسَّمَ ضَاحِكًا مِنْ قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ'
  trl: 'Fa-tabassama ḍāḥikan min qawlihā wa-qāla rabbi awziʿnī an ashkura niʿmataka llatī anʿamta ʿalayya wa-ʿalā wālidayya wa-an aʿmala ṣāliḥan tarḍāhu wa-adkhilnī bi-raḥmatika fī ʿibādika ṣ-ṣāliḥīn'
  trad: 'Il sourit, amusé (ḍāḥikan) par sa parole, et dit : « Mon Rabb, dispose-moi (awziʿnī) à être reconnaissant (ashkura) pour Ton bienfait (niʿmataka), celui dont Tu m''as comblé, moi et mes deux parents, et à accomplir une œuvre juste (ṣāliḥan) qui T''agrée (tarḍāhu) — et fais-moi entrer, par Ta raḥma, parmi Tes ʿibād justes (aṣ-ṣāliḥīn). »'
- ref: 'S.27:20–21'
  ar: 'وَتَفَقَّدَ الطَّيْرَ فَقَالَ مَا لِيَ لَا أَرَى الْهُدْهُدَ أَمْ كَانَ مِنَ الْغَائِبِينَ لَأُعَذِّبَنَّهُ عَذَابًا شَدِيدًا أَوْ لَأَذْبَحَنَّهُ أَوْ لَيَأْتِيَنِّي بِسُلْطَانٍ مُبِينٍ'
  trl: 'Wa-tafaqqada ṭ-ṭayra fa-qāla mā liya lā arā l-hudhuda am kāna mina l-ghāʾibīn — la-uʿadhdhibannahu ʿadhāban shadīdan aw la-adhbaḥannahu aw la-yaʾtiyannī bi-sulṭānin mubīn'
  trad: 'Et il passa en revue les oiseaux (tafaqqada ṭ-ṭayr), et dit : « Qu''ai-je à ne pas voir le hudhud ? Serait-il du nombre des absents (al-ghāʾibīn) ? Je le châtierai certainement d''un châtiment sévère, ou je l''égorgerai (adhbaḥannahu), à moins qu''il ne m''apporte une justification manifeste (sulṭānin mubīn). »'
- ref: 'S.27:22'
  ar: 'فَمَكَثَ غَيْرَ بَعِيدٍ فَقَالَ أَحَطْتُ بِمَا لَمْ تُحِطْ بِهِ وَجِئْتُكَ مِنْ سَبَإٍ بِنَبَإٍ يَقِينٍ'
  trl: 'Fa-makatha ghayra baʿīdin fa-qāla aḥaṭtu bimā lam tuḥiṭ bihi wa-jiʾtuka min sabaʾin bi-nabaʾin yaqīn'
  trad: 'Il [le hudhud] ne tarda pas longtemps (makatha ghayra baʿīd), et dit : « J''ai cerné (aḥaṭtu) ce que tu n''as pas cerné (lam tuḥiṭ bihi), et je t''apporte, de Sabaʾ, une nouvelle certaine (nabaʾin yaqīn). »'
- ref: 'S.27:23'
  ar: 'إِنِّي وَجَدْتُ امْرَأَةً تَمْلِكُهُمْ وَأُوتِيَتْ مِنْ كُلِّ شَيْءٍ وَلَهَا عَرْشٌ عَظِيمٌ'
  trl: 'Innī wajadtu mraʾatan tamlikuhum wa-ūtiyat min kulli shayʾin wa-lahā ʿarshun ʿaẓīm'
  trad: '« J''ai trouvé une femme qui règne sur eux (tamlikuhum), à qui tout a été donné, et qui possède un trône immense. »'
- ref: 'S.27:24'
  ar: 'وَجَدْتُهَا وَقَوْمَهَا يَسْجُدُونَ لِلشَّمْسِ مِنْ دُونِ اللَّهِ وَزَيَّنَ لَهُمُ الشَّيْطَانُ أَعْمَالَهُمْ فَصَدَّهُمْ عَنِ السَّبِيلِ فَهُمْ لَا يَهْتَدُونَ'
  trl: 'Wajadtuhā wa-qawmahā yasjudūna li-sh-shamsi min dūni llāhi wa-zayyana lahumu sh-shayṭānu aʿmālahum fa-ṣaddahum ʿani s-sabīli fa-hum lā yahtadūn'
  trad: '« Je l''ai trouvée, elle et son peuple, se prosternant devant le soleil, en dehors d''Allaah — le shayṭān leur a embelli (zayyana lahum) leurs actions, et les a détournés du chemin (ṣaddahum ʿani s-sabīl) : ils ne sont donc pas guidés (lā yahtadūn). »'
- ref: 'S.27:25'
  ar: 'أَلَّا يَسْجُدُوا لِلَّهِ الَّذِي يُخْرِجُ الْخَبْءَ فِي السَّمَاوَاتِ وَالْأَرْضِ وَيَعْلَمُ مَا تُخْفُونَ وَمَا تُعْلِنُونَ'
  trl: 'Allā yasjudū lillāhi lladhī yukhriju l-khabʾa fi s-samāwāti wa-l-arḍi wa-yaʿlamu mā tukhfūna wa-mā tuʿlinūn'
  trad: '— afin qu''ils ne se prosternent pas devant Allaah, Ce qui fait sortir ce qui est caché (al-khabʾ) dans les cieux et la terre, et qui sait ce que vous cachez et ce que vous divulguez.'
- ref: 'S.27:26'
  ar: 'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ رَبُّ الْعَرْشِ الْعَظِيمِ'
  trl: 'Allāhu lā ilāha illā huwa rabbu l-ʿarshi l-ʿaẓīm'
  trad: 'Allaah — nul ilāh que Lui, Rabb du ʿArsh immense.'
- ref: 'S.27:27'
  ar: '۞ قَالَ سَنَنْظُرُ أَصَدَقْتَ أَمْ كُنْتَ مِنَ الْكَاذِبِينَ'
  trl: 'Qāla sananẕuru a-ṣadaqta am kunta mina l-kādhibīn'
  trad: 'Il [Sulaymān] dit : « Nous allons voir (sananẕuru) si tu as dit vrai (a-ṣadaqta), ou si tu es du nombre des menteurs (al-kādhibīn). »'
- ref: 'S.27:28'
  ar: 'اذْهَبْ بِكِتَابِي هَٰذَا فَأَلْقِهْ إِلَيْهِمْ ثُمَّ تَوَلَّ عَنْهُمْ فَانْظُرْ مَاذَا يَرْجِعُونَ'
  trl: 'Idhhab bi-kitābī hādhā fa-alqih ilayhim thumma tawalla ʿanhum fa-nẕur mādhā yarjiʿūn'
  trad: '« Va, avec cette lettre qui est mienne (kitābī hādhā), et jette-la vers eux (fa-alqih ilayhim) ; puis détourne-toi d''eux (tawalla ʿanhum), et regarde ce qu''ils rapporteront en réponse (mādhā yarjiʿūn). »'
- ref: 'S.27:29–31'
  ar: 'قَالَتْ يَا أَيُّهَا الْمَلَأُ إِنِّي أُلْقِيَ إِلَيَّ كِتَابٌ كَرِيمٌ إِنَّهُ مِنْ سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَلَّا تَعْلُوا عَلَيَّ وَأْتُونِي مُسْلِمِينَ'
  trl: 'Qālat yā ayyuhā l-malaʾu innī ulqiya ilayya kitābun karīm — innahu min sulaymāna wa-innahu bismi llāhi r-raḥmāni r-raḥīm — allā taʿlū ʿalayya wa-ʾtūnī muslimīn'
  trad: 'Elle dit : « Ô vous, l''assemblée (al-malaʾ) ! Une lettre noble (kitābun karīm) m''a été jetée (ulqiya ilayya). Elle vient de Sulaymān, et elle est : "Au nom d''Allaah, ar-Raḥmān, ar-Raḥīm — ne vous exaltez pas contre moi (allā taʿlū ʿalayya), et venez à moi en vous soumettant (wa-ʾtūnī muslimīn)." »'
- ref: 'S.27:32'
  ar: 'قَالَتْ يَا أَيُّهَا الْمَلَأُ أَفْتُونِي فِي أَمْرِي مَا كُنْتُ قَاطِعَةً أَمْرًا حَتَّىٰ تَشْهَدُونِ'
  trl: 'Qālat yā ayyuhā l-malaʾu aftūnī fī amrī mā kuntu qāṭiʿatan amran ḥattā tashhadūn'
  trad: 'Elle dit : « Ô vous, l''assemblée ! Donnez-moi votre avis (aftūnī) dans mon affaire (fī amrī) — je ne suis pas de celles qui tranchent une affaire (qāṭiʿatan amran) sans que vous n''en soyez témoins (ḥattā tashhadūn). »'
- ref: 'S.27:33'
  ar: 'قَالُوا نَحْنُ أُولُو قُوَّةٍ وَأُولُو بَأْسٍ شَدِيدٍ وَالْأَمْرُ إِلَيْكِ فَانْظُرِي مَاذَا تَأْمُرِينَ'
  trl: 'Qālū naḥnu ulū quwwatin wa-ulū baʾsin shadīdin wa-l-amru ilayki fa-nẕurī mādhā taʾmurīn'
  trad: 'Ils dirent : « Nous sommes détenteurs de force (ulū quwwatin), et détenteurs d''une rigueur redoutable (ulū baʾsin shadīd) — mais l''affaire te revient (wa-l-amru ilayki) : regarde donc ce que tu ordonnes (mādhā taʾmurīn). »'
- ref: 'S.27:34–35'
  ar: 'قَالَتْ إِنَّ الْمُلُوكَ إِذَا دَخَلُوا قَرْيَةً أَفْسَدُوهَا وَجَعَلُوا أَعِزَّةَ أَهْلِهَا أَذِلَّةً ۖ وَكَذَٰلِكَ يَفْعَلُونَ وَإِنِّي مُرْسِلَةٌ إِلَيْهِمْ بِهَدِيَّةٍ فَنَاظِرَةٌ بِمَ يَرْجِعُ الْمُرْسَلُونَ'
  trl: 'Qālat inna l-mulūka idhā dakhalū qaryatan afsadūhā wa-jaʿalū aʿizzata ahlihā adhillatan wa-kadhālika yafʿalūn — wa-innī mursilatun ilayhim bi-hadiyyatin fa-nāẕiratun bima yarjiʿu l-mursalūn'
  trad: 'Elle dit : « Les rois (al-mulūk), quand ils entrent dans une cité (qaryatan), la corrompent (afsadūhā), et réduisent les honorés de ses habitants (aʿizzata ahlihā) à l''humiliation (adhillatan) — et c''est ainsi qu''ils agissent. Et moi, je leur envoie un présent (mursilatun … bi-hadiyyatin), et j''observerai (fa-nāẕiratun) ce que les envoyés rapporteront en réponse (bima yarjiʿu l-mursalūn). »'
- ref: 'S.27:36'
  ar: 'فَلَمَّا جَاءَ سُلَيْمَانَ قَالَ أَتُمِدُّونَنِ بِمَالٍ فَمَا آتَانِيَ اللَّهُ خَيْرٌ مِمَّا آتَاكُمْ بَلْ أَنْتُمْ بِهَدِيَّتِكُمْ تَفْرَحُونَ'
  trl: 'Fa-lammā jāʾa sulaymāna qāla a-tumiddūnani bi-mālin fa-mā ātāniya llāhu khayrun mimmā ātākum bal antum bi-hadiyyatikum tafraḥūn'
  trad: 'Puis, lorsque [l''envoyé] parvint à Sulaymān, celui-ci dit : « Me pourvoyez-vous de richesse (a-tumiddūnani bi-mālin) ? Ce qu''Allaah m''a donné est meilleur que ce qu''Il vous a donné — c''est plutôt vous qui, de votre présent, vous réjouissez (tafraḥūn). »'
- ref: 'S.27:37'
  ar: 'ارْجِعْ إِلَيْهِمْ فَلَنَأْتِيَنَّهُمْ بِجُنُودٍ لَا قِبَلَ لَهُمْ بِهَا وَلَنُخْرِجَنَّهُمْ مِنْهَا أَذِلَّةً وَهُمْ صَاغِرُونَ'
  trl: 'Irjiʿ ilayhim fa-la-naʾtiyannahum bi-junūdin lā qibala lahum bihā wa-la-nukhrijannahum minhā adhillatan wa-hum ṣāghirūn'
  trad: '« Retourne vers eux (irjiʿ ilayhim) : nous leur apporterons certainement des armées (bijunūdin) à qui ils ne pourront résister (lā qibala lahum bihā), et nous les en ferons sortir, humiliés (adhillatan), et ils seront rendus petits (ṣāghirūn). »'
- ref: 'S.27:38'
  ar: 'قَالَ يَا أَيُّهَا الْمَلَأُ أَيُّكُمْ يَأْتِينِي بِعَرْشِهَا قَبْلَ أَنْ يَأْتُونِي مُسْلِمِينَ'
  trl: 'Qāla yā ayyuhā l-malaʾu ayyukum yaʾtīnī bi-ʿarshihā qabla an yaʾtūnī muslimīn'
  trad: 'Il dit : « Ô vous, l''assemblée ! Lequel de vous m''apportera son trône, avant qu''ils ne viennent à moi en se soumettant (muslimīn) ? »'
- ref: 'S.27:39'
  ar: 'قَالَ عِفْرِيتٌ مِنَ الْجِنِّ أَنَا آتِيكَ بِهِ قَبْلَ أَنْ تَقُومَ مِنْ مَقَامِكَ ۖ وَإِنِّي عَلَيْهِ لَقَوِيٌّ أَمِينٌ'
  trl: 'Qāla ʿifrītun mina l-jinni anā ātīka bihi qabla an taqūma min maqāmika wa-innī ʿalayhi la-qawiyyun amīn'
  trad: 'Un ʿifrīt parmi les jinn dit : « Moi, je te l''apporterai avant que tu ne te lèves de ta place (maqāmika) — et je suis certes, pour cela, fort (qawiyyun), digne de confiance (amīn). »'
- ref: 'S.27:40'
  ar: 'قَالَ الَّذِي عِنْدَهُ عِلْمٌ مِنَ الْكِتَابِ أَنَا آتِيكَ بِهِ قَبْلَ أَنْ يَرْتَدَّ إِلَيْكَ طَرْفُكَ ۚ فَلَمَّا رَآهُ مُسْتَقِرًّا عِنْدَهُ قَالَ هَٰذَا مِنْ فَضْلِ رَبِّي لِيَبْلُوَنِي أَأَشْكُرُ أَمْ أَكْفُرُ ۖ وَمَنْ شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ ۖ وَمَنْ كَفَرَ فَإِنَّ رَبِّي غَنِيٌّ كَرِيمٌ'
  trl: 'Qāla lladhī ʿindahu ʿilmun mina l-kitābi anā ātīka bihi qabla an yartadda ilayka ṭarfuka — fa-lammā raʾāhu mustaqirran ʿindahu qāla hādhā min faḍli rabbī li-yabluwanī a-ashkuru am akfuru — wa-man shakara fa-innamā yashkuru li-nafsihi wa-man kafara fa-inna rabbī ghaniyyun karīm'
  trad: 'Celui qui avait une science venant du Kitāb dit : « Moi, je te l''apporterai avant que ton regard ne revienne à toi (qabla an yartadda ilayka ṭarfuka). » Puis, quand [Sulaymān] le vit installé devant lui (mustaqirran ʿindahu), il dit : « Ceci est de la faveur de mon Rabb (min faḍli rabbī), pour m''éprouver (li-yabluwanī) : serai-je reconnaissant (a-ashkuru), ou serai-je ingrat (am akfuru) ? Quiconque est reconnaissant (shakara) ne l''est que pour lui-même (li-nafsihi) ; et quiconque est ingrat (kafara) — mon Rabb est certes Ghaniyy, Karīm. »'
- ref: 'S.27:41'
  ar: 'قَالَ نَكِّرُوا لَهَا عَرْشَهَا نَنْظُرْ أَتَهْتَدِي أَمْ تَكُونُ مِنَ الَّذِينَ لَا يَهْتَدُونَ'
  trl: 'Qāla nakkirū lahā ʿarshahā nanẕur a-tahtadī am takūnu mina lladhīna lā yahtadūn'
  trad: 'Il dit : « Rendez-lui son trône méconnaissable (nakkirū lahā ʿarshahā) ; nous verrons si elle reconnaît le chemin (a-tahtadī), ou si elle est du nombre de ceux qui ne le reconnaissent pas (min alladhīna lā yahtadūn). »'
- ref: 'S.27:42'
  ar: 'فَلَمَّا جَاءَتْ قِيلَ أَهَٰكَذَا عَرْشُكِ ۖ قَالَتْ كَأَنَّهُ هُوَ ۚ وَأُوتِينَا الْعِلْمَ مِنْ قَبْلِهَا وَكُنَّا مُسْلِمِينَ'
  trl: 'Fa-lammā jāʾat qīla a-hākadhā ʿarshuki qālat ka-annahu huwa — wa-ūtīnā l-ʿilma min qablihā wa-kunnā muslimīn'
  trad: 'Puis, lorsqu''elle vint, il lui fut dit : « Est-ce ainsi ton trône ? » Elle dit : « C''est comme si c''était lui (ka-annahu huwa). » — « Et on nous a donné la science avant cela (wa-ūtīnā l-ʿilma min qablihā), et nous étions déjà de ceux qui se soumettent (wa-kunnā muslimīn). »'
- ref: 'S.27:43'
  ar: 'وَصَدَّهَا مَا كَانَتْ تَعْبُدُ مِنْ دُونِ اللَّهِ ۖ إِنَّهَا كَانَتْ مِنْ قَوْمٍ كَافِرِينَ'
  trl: 'Wa-ṣaddahā mā kānat taʿbudu min dūni llāhi innahā kānat min qawmin kāfirīn'
  trad: 'Et ce qu''elle adorait en dehors d''Allaah l''avait détournée (ṣaddahā) : elle était certes d''un peuple qui commettait le kufr (kāfirīn).'
- ref: 'S.27:44'
  ar: 'قِيلَ لَهَا ادْخُلِي الصَّرْحَ ۖ فَلَمَّا رَأَتْهُ حَسِبَتْهُ لُجَّةً وَكَشَفَتْ عَنْ سَاقَيْهَا ۚ قَالَ إِنَّهُ صَرْحٌ مُمَرَّدٌ مِنْ قَوَارِيرَ ۗ قَالَتْ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي وَأَسْلَمْتُ مَعَ سُلَيْمَانَ لِلَّهِ رَبِّ الْعَالَمِينَ'
  trl: 'Qīla lahā dkhulī ṣ-ṣarḥa fa-lammā raʾathu ḥasibathu lujjatan wa-kashafat ʿan sāqayhā — qāla innahu ṣarḥun mumarradun min qawārīra — qālat rabbi innī ẕalamtu nafsī wa-aslamtu maʿa sulaymāna lillāhi rabbi l-ʿālamīn'
  trad: 'Il lui fut dit : « Entre dans le palais (udkhulī ṣ-ṣarḥ). » Puis, lorsqu''elle le vit, elle le prit pour une étendue d''eau profonde (ḥasibathu lujjatan), et elle découvrit ses jambes (wa-kashafat ʿan sāqayhā). Il dit : « C''est un palais poli, fait de verre (ṣarḥun mumarradun min qawārīr). » Elle dit : « Mon Rabb, je me suis fait du tort à moi-même (ẕalamtu nafsī), et je me soumets (aslamtu), avec Sulaymān, à Allaah, Rabb des ʿālamīn. »'
- ref: 'S.27:45'
  ar: 'وَلَقَدْ أَرْسَلْنَا إِلَىٰ ثَمُودَ أَخَاهُمْ صَالِحًا أَنِ اعْبُدُوا اللَّهَ فَإِذَا هُمْ فَرِيقَانِ يَخْتَصِمُونَ'
  trl: 'Wa-la-qad arsalnā ilā thamūda akhāhum ṣāliḥan ani ʿbudū llāha fa-idhā hum farīqāni yakhtaṣimūn'
  trad: 'Et Nous avons certes envoyé vers Thamūd leur frère Ṣāliḥ : « Adorez Allaah. » — et voilà qu''ils sont deux factions (farīqāni) qui s''opposent (yakhtaṣimūn).'
- ref: 'S.27:46'
  ar: 'قَالَ يَا قَوْمِ لِمَ تَسْتَعْجِلُونَ بِالسَّيِّئَةِ قَبْلَ الْحَسَنَةِ ۖ لَوْلَا تَسْتَغْفِرُونَ اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ'
  trl: 'Qāla yā qawmi lima tastaʿjilūna bi-s-sayyiʾati qabla l-ḥasanati law-lā tastaghfirūna llāha laʿallakum turḥamūn'
  trad: 'Il dit : « Ô mon peuple, pourquoi hâtez-vous (tastaʿjilūna) le mal (as-sayyiʾa) avant le bien (al-ḥasana) ? Si seulement vous demandiez pardon à Allaah (tastaghfirūna), peut-être feriez-vous l''objet de la raḥma (turḥamūn). »'
- ref: 'S.27:47'
  ar: 'قَالُوا اطَّيَّرْنَا بِكَ وَبِمَنْ مَعَكَ ۚ قَالَ طَائِرُكُمْ عِنْدَ اللَّهِ ۖ بَلْ أَنْتُمْ قَوْمٌ تُفْتَنُونَ'
  trl: 'Qālū iṭṭayyarnā bika wa-bi-man maʿaka qāla ṭāʾirukum ʿinda llāhi bal antum qawmun tuftanūn'
  trad: 'Ils dirent : « Nous voyons, à cause de toi et de ceux qui sont avec toi, un mauvais présage (iṭṭayyarnā). » Il dit : « Votre sort (ṭāʾirukum) est auprès d''Allaah — vous êtes plutôt un peuple mis à l''épreuve (tuftanūn). »'
- ref: 'S.27:48'
  ar: 'وَكَانَ فِي الْمَدِينَةِ تِسْعَةُ رَهْطٍ يُفْسِدُونَ فِي الْأَرْضِ وَلَا يُصْلِحُونَ'
  trl: 'Wa-kāna fi l-madīnati tisʿatu rahṭin yufsidūna fi l-arḑi wa-lā yuṣliḥūn'
  trad: 'Et il y avait, dans la cité, neuf hommes d''un même clan (tisʿatu rahṭin), qui semaient le désordre (yufsidūna) sur la terre et ne la remettaient pas en bon ordre (lā yuṣliḥūn).'
- ref: 'S.27:49'
  ar: 'قَالُوا تَقَاسَمُوا بِاللَّهِ لَنُبَيِّتَنَّهُ وَأَهْلَهُ ثُمَّ لَنَقُولَنَّ لِوَلِيِّهِ مَا شَهِدْنَا مَهْلِكَ أَهْلِهِ وَإِنَّا لَصَادِقُونَ'
  trl: 'Qālū taqāsamū billāhi la-nubayyitannahu wa-ahlahu thumma la-naqūlanna li-waliyyihi mā shahidnā mahlika ahlihi wa-innā la-ṣādiqūn'
  trad: 'Ils dirent : « Jurez-vous mutuellement par Allaah (taqāsamū) que nous l''attaquerons certainement de nuit (la-nubayyitannahu), lui et sa famille — puis nous dirons certainement à son allié (waliyyihi) : nous n''avons pas été témoins de la destruction de sa famille (mahlika ahlihi), et nous sommes assurément véridiques. »'
- ref: 'S.27:50–51'
  ar: 'وَمَكَرُوا مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَاهُمْ وَقَوْمَهُمْ أَجْمَعِينَ'
  trl: 'Wa-makarū makran wa-makarnā makran wa-hum lā yashʿurūn — fa-nẕur kayfa kāna ʿāqibatu makrihim annā dammarnāhum wa-qawmahum ajmaʿīn'
  trad: 'Et ils usèrent d''une manœuvre (makarū makran), et Nous usâmes d''une manœuvre (makarnā makran), sans qu''ils s''en aperçoivent (wa-hum lā yashʿurūn). Regarde donc quelle fut la fin de leur manœuvre (ʿāqibatu makrihim) : Nous les avons anéantis (dammarnāhum), eux et leur peuple, tous ensemble (ajmaʿīn).'
- ref: 'S.27:52'
  ar: 'فَتِلْكَ بُيُوتُهُمْ خَاوِيَةً بِمَا ظَلَمُوا ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً لِقَوْمٍ يَعْلَمُونَ'
  trl: 'Fa-tilka buyūtuhum khāwiyatan bimā ẕalamū inna fī dhālika la-āyatan li-qawmin yaʿlamūn'
  trad: 'Voilà donc leurs maisons, laissées vides (khāwiyatan), pour prix de leur ẕulm (bimā ẕalamū) — il y a certes en cela un signe (āya) pour un peuple qui sait.'
- ref: 'S.27:53'
  ar: 'وَأَنْجَيْنَا الَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ'
  trl: 'Wa-anjaynā lladhīna āmanū wa-kānū yattaqūn'
  trad: 'Et Nous avons sauvé ceux qui avaient cru (āmanū) et qui se prémunissaient (yattaqūn).'
- ref: 'S.27:54'
  ar: 'وَلُوطًا إِذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَةَ وَأَنْتُمْ تُبْصِرُونَ'
  trl: 'Wa-lūṭan idh qāla li-qawmihi a-taʾtūna l-fāḥishata wa-antum tubṣirūn'
  trad: 'Et Lūṭ — quand il dit à son peuple : « Commettez-vous la fāḥisha, alors que vous voyez clairement (wa-antum tubṣirūn) ? »'
- ref: 'S.27:55'
  ar: 'أَئِنَّكُمْ لَتَأْتُونَ الرِّجَالَ شَهْوَةً مِنْ دُونِ النِّسَاءِ ۚ بَلْ أَنْتُمْ قَوْمٌ تَجْهَلُونَ'
  trl: 'A-innakum la-taʾtūna r-rijāla shahwatan min dūni n-nisāʾi bal antum qawmun tajhalūn'
  trad: '« Allez-vous donc, par désir (shahwatan), aux hommes, en dehors des femmes ? Vous êtes plutôt un peuple qui ignore (tajhalūn). »'
- ref: 'S.27:56'
  ar: '۞ فَمَا كَانَ جَوَابَ قَوْمِهِ إِلَّا أَنْ قَالُوا أَخْرِجُوا آلَ لُوطٍ مِنْ قَرْيَتِكُمْ ۖ إِنَّهُمْ أُنَاسٌ يَتَطَهَّرُونَ'
  trl: 'Fa-mā kāna jawāba qawmihi illā an qālū akhrijū āla lūṭin min qaryatikum innahum unāsun yataṭahharūn'
  trad: 'Et la seule réponse de son peuple fut de dire : « Expulsez la famille de Lūṭ (āla lūṭin) de votre cité — ce sont des gens qui se donnent pour purs (yataṭahharūn) ! »'
- ref: 'S.27:57'
  ar: 'فَأَنْجَيْنَاهُ وَأَهْلَهُ إِلَّا امْرَأَتَهُ قَدَّرْنَاهَا مِنَ الْغَابِرِينَ'
  trl: 'Fa-anjaynāhu wa-ahlahu illā mraʾatahu qaddarnāhā mina l-ghābirīn'
  trad: 'Nous le sauvâmes, lui et sa famille (ahlahu), sauf son épouse : Nous l''avions destinée (qaddarnāhā) à être du nombre de ceux qui restent en arrière (al-ghābirīn).'
- ref: 'S.27:58'
  ar: 'وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا ۖ فَسَاءَ مَطَرُ الْمُنْذَرِينَ'
  trl: 'Wa-amṭarnā ʿalayhim maṭaran fa-sāʾa maṭaru l-mundharīn'
  trad: 'Et Nous avons fait pleuvoir sur eux une pluie (maṭaran) — combien mauvaise fut la pluie de ceux qui avaient été avertis (al-mundharīn) !'
- ref: 'S.27:59'
  ar: 'قُلِ الْحَمْدُ لِلَّهِ وَسَلَامٌ عَلَىٰ عِبَادِهِ الَّذِينَ اصْطَفَىٰ ۗ آللَّهُ خَيْرٌ أَمَّا يُشْرِكُونَ'
  trl: 'Quli l-ḥamdu lillāhi wa-salāmun ʿalā ʿibādihi lladhīna ṣṭafā āllāhu khayrun amma yushrikūn'
  trad: 'Dis : « La ḥamd est à Allaah, et paix (salām) sur Ses ʿibād qu''Il a élus (iṣṭafā) ! Allaah est-Il meilleur, ou ce qu''ils [Lui] associent ? »'
- ref: 'S.27:60'
  ar: 'أَمَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَأَنْزَلَ لَكُمْ مِنَ السَّمَاءِ مَاءً فَأَنْبَتْنَا بِهِ حَدَائِقَ ذَاتَ بَهْجَةٍ مَا كَانَ لَكُمْ أَنْ تُنْبِتُوا شَجَرَهَا ۗ أَإِلَٰهٌ مَعَ اللَّهِ ۚ بَلْ هُمْ قَوْمٌ يَعْدِلُونَ'
  trl: 'Amman khalaqa s-samāwāti wa-l-arḍa wa-anzala lakum mina s-samāʾi māʾan fa-anbatnā bihi ḥadāʾiqa dhāta bahjatin mā kāna lakum an tunbitū shajarahā a-ilāhun maʿa llāhi bal hum qawmun yaʿdilūn'
  trad: 'Ou bien, qui a créé les cieux et la terre, et a fait descendre pour vous, du ciel, une eau — et Nous en avons fait germer des jardins pleins d''éclat (ḥadāʾiqa dhāta bahjatin), dont il n''était pas en votre pouvoir de faire germer les arbres ? Y a-t-il un ilāh avec Allaah ? Ils sont plutôt un peuple qui dévie (yaʿdilūn).'
- ref: 'S.27:61'
  ar: 'أَمَّنْ جَعَلَ الْأَرْضَ قَرَارًا وَجَعَلَ خِلَالَهَا أَنْهَارًا وَجَعَلَ لَهَا رَوَاسِيَ وَجَعَلَ بَيْنَ الْبَحْرَيْنِ حَاجِزًا ۗ أَإِلَٰهٌ مَعَ اللَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ'
  trl: 'Amman jaʿala l-arḍa qarāran wa-jaʿala khilālahā anhāran wa-jaʿala lahā rawāsiya wa-jaʿala bayna l-baḥrayni ḥājizan a-ilāhun maʿa llāhi bal aktharuhum lā yaʿlamūn'
  trad: 'Ou bien, qui a fait de la terre une assise stable (qarāran), y a placé des rivières en son sein (khilālahā), y a placé des montagnes-ancrages (rawāsiya), et a placé entre les deux mers une barrière (ḥājizan) ? Y a-t-il un ilāh avec Allaah ? Ils sont plutôt, pour la plupart, dans l''ignorance.'
- ref: 'S.27:62'
  ar: 'أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ ۗ أَإِلَٰهٌ مَعَ اللَّهِ ۚ قَلِيلًا مَا تَذَكَّرُونَ'
  trl: 'Amman yujību l-muḍṭarra idhā daʿāhu wa-yakshifu s-sūʾa wa-yajʿalukum khulafāʾa l-arḍi a-ilāhun maʿa llāhi qalīlan mā tadhakkarūn'
  trad: 'Ou bien, qui répond à celui que l''extrême détresse contraint (al-muḍṭarr), quand il L''invoque, qui lève le mal (yakshifu s-sūʾa), et qui vous établit comme successeurs de la terre (khulafāʾa l-arḍ) ? Y a-t-il un ilāh avec Allaah ? Combien peu vous vous rappelez (tadhakkarūn) !'
- ref: 'S.27:63'
  ar: 'أَمَّنْ يَهْدِيكُمْ فِي ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ وَمَنْ يُرْسِلُ الرِّيَاحَ بُشْرًا بَيْنَ يَدَيْ رَحْمَتِهِ ۗ أَإِلَٰهٌ مَعَ اللَّهِ ۚ تَعَالَى اللَّهُ عَمَّا يُشْرِكُونَ'
  trl: 'Amman yahdīkum fī ẕulumāti l-barri wa-l-baḥri wa-man yursilu r-riyāḥa bushran bayna yaday raḥmatihi a-ilāhun maʿa llāhi taʿāla llāhu ʿammā yushrikūn'
  trad: 'Ou bien, qui vous guide dans les ténèbres (ẕulumāt) de la terre ferme et de la mer, et qui envoie les vents en annonce (bushran), devant Sa raḥma (bayna yaday raḥmatihi) ? Y a-t-il un ilāh avec Allaah ? Allaah transcende (taʿālā) ce qu''ils Lui associent.'
- ref: 'S.27:64'
  ar: 'أَمَّنْ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَمَنْ يَرْزُقُكُمْ مِنَ السَّمَاءِ وَالْأَرْضِ ۗ أَإِلَٰهٌ مَعَ اللَّهِ ۚ قُلْ هَاتُوا بُرْهَانَكُمْ إِنْ كُنْتُمْ صَادِقِينَ'
  trl: 'Amman yabdaʾu l-khalqa thumma yuʿīduhu wa-man yarzuqukum mina s-samāʾi wa-l-arḍi a-ilāhun maʿa llāhi qul hātū burhānakum in kuntum ṣādiqīn'
  trad: 'Ou bien, qui fait exister la création une première fois (yabdaʾu l-khalqa), puis la refait (yuʿīduhu), et qui vous pourvoit (yarzuqukum), du ciel et de la terre ? Y a-t-il un ilāh avec Allaah ? Dis : « Apportez votre preuve (hātū burhānakum), si vous êtes véridiques ! »'
- ref: 'S.27:65'
  ar: 'قُلْ لَا يَعْلَمُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ ۚ وَمَا يَشْعُرُونَ أَيَّانَ يُبْعَثُونَ'
  trl: 'Qul lā yaʿlamu man fī s-samāwāti wa-l-arḍi l-ghayba illā llāhu wa-mā yashʿurūna ayyāna yubʿathūn'
  trad: 'Dis : « Nul, dans les cieux et sur la terre, ne connaît le ghayb, sauf Allaah — et ils ne perçoivent pas (yashʿurūn) quand ils seront ressuscités (yubʿathūn). »'
- ref: 'S.27:66'
  ar: 'بَلِ ادَّارَكَ عِلْمُهُمْ فِي الْآخِرَةِ ۚ بَلْ هُمْ فِي شَكٍّ مِنْهَا ۖ بَلْ هُمْ مِنْهَا عَمُونَ'
  trl: 'Bali ddāraka ʿilmuhum fi l-ākhirati bal hum fī shakkin minhā bal hum minhā ʿamūn'
  trad: 'Leur savoir a-t-il donc convergé (iddāraka), au sujet de l''Ākhira ? Ils sont plutôt dans le doute (shakk) à son égard — ils sont plutôt, à son égard, aveugles (ʿamūn).'
- ref: 'S.27:67–68'
  ar: 'وَقَالَ الَّذِينَ كَفَرُوا أَإِذَا كُنَّا تُرَابًا وَآبَاؤُنَا أَئِنَّا لَمُخْرَجُونَ لَقَدْ وُعِدْنَا هَٰذَا نَحْنُ وَآبَاؤُنَا مِنْ قَبْلُ إِنْ هَٰذَا إِلَّا أَسَاطِيرُ الْأَوَّلِينَ'
  trl: 'Wa-qāla lladhīna kafarū a-idhā kunnā turāban wa-ābāʾunā a-innā la-mukhrajūn — la-qad wuʿidnā hādhā naḥnu wa-ābāʾunā min qablu in hādhā illā asāṭīru l-awwalīn'
  trad: 'Et ceux qui ont commis le kufr dirent : « Quand nous serons poussière (turāban), nous et nos pères, serons-nous vraiment fait sortir (la-mukhrajūn) ? Cela nous a déjà été promis (wuʿidnā), à nous et à nos pères, auparavant — ce n''est rien d''autre que des légendes des anciens (asāṭīru l-awwalīn). »'
- ref: 'S.27:69'
  ar: 'قُلْ سِيرُوا فِي الْأَرْضِ فَانْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُجْرِمِينَ'
  trl: 'Qul sīrū fi l-arḍi fa-nẕurū kayfa kāna ʿāqibatu l-mujrimīn'
  trad: 'Dis : « Parcourez la terre, puis regardez quelle a été la fin des mujrimūn. »'
- ref: 'S.27:70'
  ar: 'وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُنْ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ'
  trl: 'Wa-lā taḥzan ʿalayhim wa-lā takun fī ḍayqin mimmā yamkurūn'
  trad: 'Et ne t''attriste pas (lā taḥzan) à leur sujet, et ne sois pas dans l''oppression (ḍayq) à cause de ce qu''ils manigancent (yamkurūn).'
- ref: 'S.27:71–72'
  ar: 'وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ قُلْ عَسَىٰ أَنْ يَكُونَ رَدِفَ لَكُمْ بَعْضُ الَّذِي تَسْتَعْجِلُونَ'
  trl: 'Wa-yaqūlūna matā hādhā l-waʿdu in kuntum ṣādiqīn — qul ʿasā an yakūna radifa lakum baʿḑu lladhī tastaʿjilūn'
  trad: 'Et ils disent : « Quand [se réalisera] cette promesse (al-waʿd), si vous êtes véridiques ? » Dis : « Il se peut qu''une partie de ce que vous cherchez à hâter (tastaʿjilūn) soit déjà sur vos talons (radifa lakum). »'
- ref: 'S.27:73'
  ar: 'وَإِنَّ رَبَّكَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَ'
  trl: 'Wa-inna rabbaka la-dhū faḍlin ʿalā n-nāsi wa-lākinna aktharahum lā yashkurūn'
  trad: 'Et ton Rabb est certes détenteur d''une faveur (la-dhū faḍlin) envers les humains (an-nās) — mais la plupart d''entre eux ne sont pas reconnaissants (lā yashkurūn).'
- ref: 'S.27:74'
  ar: 'وَإِنَّ رَبَّكَ لَيَعْلَمُ مَا تُكِنُّ صُدُورُهُمْ وَمَا يُعْلِنُونَ'
  trl: 'Wa-inna rabbaka la-yaʿlamu mā tukinnu ṣudūruhum wa-mā yuʿlinūn'
  trad: 'Et ton Rabb sait certainement ce que leurs poitrines (ṣudūruhum) renferment (tukinnu), et ce qu''ils divulguent (yuʿlinūn).'
- ref: 'S.27:75'
  ar: 'وَمَا مِنْ غَائِبَةٍ فِي السَّمَاءِ وَالْأَرْضِ إِلَّا فِي كِتَابٍ مُبِينٍ'
  trl: 'Wa-mā min ghāʾibatin fi s-samāʾi wa-l-arḍi illā fī kitābin mubīn'
  trad: 'Et il n''y a rien de caché (ghāʾibatin) dans le ciel et la terre, qui ne soit dans un Kitāb manifeste (mubīn).'
- ref: 'S.27:76–77'
  ar: 'إِنَّ هَٰذَا الْقُرْآنَ يَقُصُّ عَلَىٰ بَنِي إِسْرَائِيلَ أَكْثَرَ الَّذِي هُمْ فِيهِ يَخْتَلِفُونَ وَإِنَّهُ لَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ'
  trl: 'Inna hādhā l-qurʾāna yaquṣṣu ʿalā banī isrāʾīla akthara lladhī hum fīhi yakhtalifūn — wa-innahu la-hudan wa-raḥmatun li-l-muʾminīn'
  trad: 'En vérité, ce Qurʾān relate (yaquṣṣu) aux banī Isrāʾīl l''essentiel de ce en quoi ils sont en désaccord (yakhtalifūn) — et il est assurément hudā [guidance] et raḥma pour les muʾminūn.'
- ref: 'S.27:78–79'
  ar: 'إِنَّ رَبَّكَ يَقْضِي بَيْنَهُمْ بِحُكْمِهِ ۚ وَهُوَ الْعَزِيزُ الْعَلِيمُ فَتَوَكَّلْ عَلَى اللَّهِ ۖ إِنَّكَ عَلَى الْحَقِّ الْمُبِينِ'
  trl: 'Inna rabbaka yaqḍī baynahum bi-ḥukmihi wa-huwa l-ʿazīzu l-ʿalīm — fa-tawakkal ʿalā llāhi innaka ʿalā l-ḥaqqi l-mubīn'
  trad: 'Ton Rabb décide (yaqḍī) assurément entre eux par Son ḥukm — et Il est al-ʿAzīz, al-ʿAlīm. Remets-toi donc (fa-tawakkal) à Allaah : tu es certes sur le ḥaqq manifeste (al-ḥaqq al-mubīn).'
- ref: 'S.27:80–81'
  ar: 'إِنَّكَ لَا تُسْمِعُ الْمَوْتَىٰ وَلَا تُسْمِعُ الصُّمَّ الدُّعَاءَ إِذَا وَلَّوْا مُدْبِرِينَ وَمَا أَنْتَ بِهَادِي الْعُمْيِ عَنْ ضَلَالَتِهِمْ ۖ إِنْ تُسْمِعُ إِلَّا مَنْ يُؤْمِنُ بِآيَاتِنَا فَهُمْ مُسْلِمُونَ'
  trl: 'Innaka lā tusmiʿu l-mawtā wa-lā tusmiʿu ṣ-ṣumma d-duʿāʾa idhā wallaw mudbirīn — wa-mā anta bi-hādi l-ʿumyi ʿan ḍalālatihim in tusmiʿu illā man yuʾminu bi-āyātinā fa-hum muslimūn'
  trad: 'Tu ne fais pas entendre les morts, et tu ne fais pas entendre l''appel (ad-duʿāʾ) aux sourds (aṣ-ṣumm), lorsqu''ils tournent le dos en se détournant (wallaw mudbirīn). Et tu n''es pas davantage celui qui guide (bi-hādī) les aveugles (al-ʿumy) hors de leur égarement (ḍalālatihim) — tu ne fais entendre que celui qui croit en Nos āyāt : ceux-là s''en remettent pleinement (muslimūn).'
- ref: 'S.27:82'
  ar: 'وَإِذَا وَقَعَ الْقَوْلُ عَلَيْهِمْ أَخْرَجْنَا لَهُمْ دَابَّةً مِنَ الْأَرْضِ تُكَلِّمُهُمْ أَنَّ النَّاسَ كَانُوا بِآيَاتِنَا لَا يُوقِنُونَ'
  trl: 'Wa-idhā waqaʿa l-qawlu ʿalayhim akhrajnā lahum dābbatan mina l-arḍi tukallimuhum anna n-nāsa kānū bi-āyātinā lā yūqinūn'
  trad: 'Et quand la Parole (al-qawl) s''abattra sur eux, Nous ferons sortir pour eux, de la terre, une dābba qui leur parlera (tukallimuhum) — [signe] que les humains ne tenaient pas pour certain (lā yūqinūn) Nos āyāt.'
- ref: 'S.27:83'
  ar: 'وَيَوْمَ نَحْشُرُ مِنْ كُلِّ أُمَّةٍ فَوْجًا مِمَّنْ يُكَذِّبُ بِآيَاتِنَا فَهُمْ يُوزَعُونَ'
  trl: 'Wa-yawma naḥshuru min kulli ummatin fawjan mimman yukadhdhibu bi-āyātinā fa-hum yūzaʿūn'
  trad: 'Et [rappelle] le jour où Nous rassemblerons (naḥshuru), de chaque umma, une troupe (fawjan) parmi ceux qui démentaient Nos āyāt — et ils seront contenus en rangs (yūzaʿūn).'
- ref: 'S.27:84'
  ar: 'حَتَّىٰ إِذَا جَاءُوا قَالَ أَكَذَّبْتُمْ بِآيَاتِي وَلَمْ تُحِيطُوا بِهَا عِلْمًا أَمَّاذَا كُنْتُمْ تَعْمَلُونَ'
  trl: 'Ḥattā idhā jāʾū qāla a-kadhdhabtum bi-āyātī wa-lam tuḥīṭū bihā ʿilman am-mādhā kuntum taʿmalūn'
  trad: 'Jusqu''à ce que, lorsqu''ils seront venus, Il dira : « Avez-vous démenti Mes āyāt sans les avoir embrassées d''une connaissance [certaine] (tuḥīṭū bihā ʿilman) ? Ou que faisiez-vous donc ? »'
- ref: 'S.27:85'
  ar: 'وَوَقَعَ الْقَوْلُ عَلَيْهِمْ بِمَا ظَلَمُوا فَهُمْ لَا يَنْطِقُونَ'
  trl: 'Wa-waqaʿa l-qawlu ʿalayhim bi-mā ẕalamū fa-hum lā yanṭiqūn'
  trad: 'Et la Parole s''est abattue (waqaʿa) sur eux en raison du ẕulm qu''ils ont commis (bi-mā ẕalamū) — et ils ne peuvent plus parler (lā yanṭiqūn).'
- ref: 'S.27:86'
  ar: 'أَلَمْ يَرَوْا أَنَّا جَعَلْنَا اللَّيْلَ لِيَسْكُنُوا فِيهِ وَالنَّهَارَ مُبْصِرًا ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يُؤْمِنُونَ'
  trl: 'A-lam yarawā annā jaʿalnā l-layla li-yaskunū fīhi wa-n-nahāra mubṣiran inna fī dhālika la-āyātin li-qawmin yuʾminūn'
  trad: 'N''ont-ils pas vu que Nous avons fait de la nuit [un temps] pour qu''ils y trouvent le repos (li-yaskunū fīhi), et du jour ce qui donne à voir (mubṣiran) ? Il y a assurément là des āyāt pour un peuple qui croit (yuʾminūn).'
- ref: 'S.27:87'
  ar: 'وَيَوْمَ يُنْفَخُ فِي الصُّورِ فَفَزِعَ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ إِلَّا مَنْ شَاءَ اللَّهُ ۚ وَكُلٌّ أَتَوْهُ دَاخِرِينَ'
  trl: 'Wa-yawma yunfakhu fi ṣ-ṣūri fa-faziʿa man fi s-samāwāti wa-man fi l-arḍi illā man shāʾa llāhu wa-kullun atawhu dākhirīn'
  trad: 'Et [rappelle] le jour où il sera soufflé dans le Ṣūr : alors seront saisis d''effroi (faziʿa) ceux qui sont dans les cieux et ceux qui sont sur la terre, sauf qui Allaah veut — et tous viendront à Lui, humblement soumis (dākhirīn).'
- ref: 'S.27:88'
  ar: 'وَتَرَى الْجِبَالَ تَحْسَبُهَا جَامِدَةً وَهِيَ تَمُرُّ مَرَّ السَّحَابِ ۚ صُنْعَ اللَّهِ الَّذِي أَتْقَنَ كُلَّ شَيْءٍ ۚ إِنَّهُ خَبِيرٌ بِمَا تَفْعَلُونَ'
  trl: 'Wa-tarā l-jibāla taḥsabuhā jāmidatan wa-hiya tamurru marra s-saḥābi ṣunʿa llāhi lladhī atqana kulla shayʾin innahu khabīrun bi-mā tafʿalūn'
  trad: 'Et tu verras les montagnes, que tu croirais figées (jāmidatan), alors qu''elles passent comme passent les nuées (tamurru marra s-saḥāb) — façonnement (ṣunʿ) d''Allaah, Ce qui a tout maîtrisé avec exactitude (atqana kulla shayʾin). Il est certes Khabīr de ce que vous faites.'
- ref: 'S.27:89'
  ar: 'مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ خَيْرٌ مِنْهَا وَهُمْ مِنْ فَزَعٍ يَوْمَئِذٍ آمِنُونَ'
  trl: 'Man jāʾa bi-l-ḥasanati fa-lahu khayrun minhā wa-hum min fazaʿin yawmaʾidhin āminūn'
  trad: 'Quiconque viendra avec une ḥasana [bonne action] aura une récompense meilleure qu''elle (khayrun minhā) — et ils seront, ce jour-là, en sécurité contre tout fazaʿ [effroi].'
- ref: 'S.27:90'
  ar: 'وَمَنْ جَاءَ بِالسَّيِّئَةِ فَكُبَّتْ وُجُوهُهُمْ فِي النَّارِ هَلْ تُجْزَوْنَ إِلَّا مَا كُنْتُمْ تَعْمَلُونَ'
  trl: 'Wa-man jāʾa bi-s-sayyiʾati fa-kubbat wujūhuhum fi n-nāri hal tujzawna illā mā kuntum taʿmalūn'
  trad: 'Et quiconque viendra avec une sayyiʾa [mauvaise action], leurs visages seront précipités, renversés (kubbat) dans le Feu — « Serez-vous rétribués autrement que selon ce que vous faisiez ? »'
- ref: 'S.27:91'
  ar: 'إِنَّمَا أُمِرْتُ أَنْ أَعْبُدَ رَبَّ هَٰذِهِ الْبَلْدَةِ الَّذِي حَرَّمَهَا وَلَهُ كُلُّ شَيْءٍ ۖ وَأُمِرْتُ أَنْ أَكُونَ مِنَ الْمُسْلِمِينَ'
  trl: 'Innamā umirtu an aʿbuda rabba hādhihi l-baldati lladhī ḥarramahā wa-lahu kullu shayʾin wa-umirtu an akūna mina l-muslimīn'
  trad: 'Il m''est seulement ordonné (umirtu) d''adorer le Rabb de cette balda (hādhihi l-baldati), Ce qui l''a rendue sacrée (ḥarramahā) — et à Lui toute chose appartient — et il m''est ordonné d''être du nombre des muslimūn.'
- ref: 'S.27:92'
  ar: 'وَأَنْ أَتْلُوَ الْقُرْآنَ ۖ فَمَنِ اهْتَدَىٰ فَإِنَّمَا يَهْتَدِي لِنَفْسِهِ ۖ وَمَنْ ضَلَّ فَقُلْ إِنَّمَا أَنَا مِنَ الْمُنْذِرِينَ'
  trl: 'Wa-an atluwa l-qurʾāna fa-mani htadā fa-innamā yahtadī li-nafsihi wa-man ḍalla fa-qul innamā anā mina l-mundhirīn'
  trad: '— et de réciter (atluwa) le Qurʾān. Quiconque se guide (ihtadā) ne se guide que pour lui-même (li-nafsihi) ; et quiconque s''égare (ḍalla), dis [alors] : « Je ne suis que du nombre de ceux qui avertissent (al-mundhirīn). »'
- ref: 'S.27:93'
  ar: 'وَقُلِ الْحَمْدُ لِلَّهِ سَيُرِيكُمْ آيَاتِهِ فَتَعْرِفُونَهَا ۚ وَمَا رَبُّكَ بِغَافِلٍ عَمَّا تَعْمَلُونَ'
  trl: 'Wa-quli l-ḥamdu lillāhi sa-yurīkum āyātihi fa-taʿrifūnahā wa-mā rabbuka bi-ghāfilin ʿammā taʿmalūn'
  trad: 'Et dis : « La ḥamd est à Allaah ! Il vous montrera Ses āyāt, et vous les reconnaîtrez (taʿrifūnahā). » Et ton Rabb n''est pas inattentif (bi-ghāfilin) à ce que vous faites.'
