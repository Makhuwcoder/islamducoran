- ref: S.22:1
  ar: يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمْ ۚ إِنَّ زَلْزَلَةَ السَّاعَةِ شَيْءٌ عَظِيمٌ
  trl: Yā ayyuha n-nāsu ttaqū rabbakum inna zalzalata s-sāʿati shayʾun ʿaẓīm
  trad: Ô les humains, prémunissez-vous (ittaqū) de votre Rabb — l'ébranlement (zalzala) de l'Heure est certes une chose immense.
- ref: S.22:2
  ar: يَوْمَ تَرَوْنَهَا تَذْهَلُ كُلُّ مُرْضِعَةٍ عَمَّا أَرْضَعَتْ وَتَضَعُ كُلُّ ذَاتِ حَمْلٍ حَمْلَهَا وَتَرَى النَّاسَ سُكَارَىٰ وَمَا هُمْ بِسُكَارَىٰ وَلَٰكِنَّ عَذَابَ اللَّهِ شَدِيدٌ
  trl: Yawma tarawnahā tadhhalu kullu murḍiʿatin ʿammā arḍaʿat wa-taḍaʿu kullu dhāti ḥamlin ḥamlahā wa-tara n-nāsa sukārā wa-mā hum bi-sukārā wa-lākinna ʿadhāba llāhi shadīd
  trad: 'Le jour où vous la verrez, toute nourrice (murḍiʿa) sera distraite au point d''oublier (tadhhalu) ce qu''elle allaitait, et toute femme enceinte déposera son fardeau [avant terme] — et tu verras les gens ivres (sukārā), alors qu''ils ne sont pas ivres : c''est que le châtiment d''Allaah est sévère.'
- ref: S.22:3
  ar: وَمِنَ النَّاسِ مَنْ يُجَادِلُ فِي اللَّهِ بِغَيْرِ عِلْمٍ وَيَتَّبِعُ كُلَّ شَيْطَانٍ مَرِيدٍ
  trl: Wa-mina n-nāsi man yujādilu fi llāhi bi-ghayri ʿilmin wa-yattabiʿu kulla shayṭānin marīd
  trad: Et parmi les gens, il en est qui dispute (yujādilu) au sujet d'Allaah sans science, et qui suit tout *shayṭān* rebelle (marīd).
- ref: S.22:4
  ar: كُتِبَ عَلَيْهِ أَنَّهُ مَنْ تَوَلَّاهُ فَأَنَّهُ يُضِلُّهُ وَيَهْدِيهِ إِلَىٰ عَذَابِ السَّعِيرِ
  trl: Kutiba ʿalayhi annahu man tawallāhu fa-annahu yuḍilluhu wa-yahdīhi ilā ʿadhābi s-saʿīr
  trad: Il a été prescrit (kutiba), à son sujet [de ce *shayṭān*], que quiconque le prend pour allié (tawallāhu) — il l'égarera (yuḍilluhu) et le conduira (yahdīhi) jusqu'au châtiment du Brasier (as-saʿīr).
- ref: S.22:5
  ar: يَا أَيُّهَا النَّاسُ إِنْ كُنْتُمْ فِي رَيْبٍ مِنَ الْبَعْثِ فَإِنَّا خَلَقْنَاكُمْ مِنْ تُرَابٍ ثُمَّ مِنْ نُطْفَةٍ ثُمَّ مِنْ عَلَقَةٍ ثُمَّ مِنْ مُضْغَةٍ مُخَلَّقَةٍ وَغَيْرِ مُخَلَّقَةٍ لِنُبَيِّنَ لَكُمْ ۚ وَنُقِرُّ فِي الْأَرْحَامِ مَا نَشَاءُ إِلَىٰ أَجَلٍ مُسَمًّى ثُمَّ نُخْرِجُكُمْ طِفْلًا ثُمَّ لِتَبْلُغُوا أَشُدَّكُمْ ۖ وَمِنْكُمْ مَنْ يُتَوَفَّىٰ وَمِنْكُمْ مَنْ يُرَدُّ إِلَىٰ أَرْذَلِ الْعُمُرِ لِكَيْلَا يَعْلَمَ مِنْ بَعْدِ عِلْمٍ شَيْئًا ۚ وَتَرَى الْأَرْضَ هَامِدَةً فَإِذَا أَنْزَلْنَا عَلَيْهَا الْمَاءَ اهْتَزَّتْ وَرَبَتْ وَأَنْبَتَتْ مِنْ كُلِّ زَوْجٍ بَهِيجٍ
  trl: Yā ayyuha n-nāsu in kuntum fī raybin mina l-baʿthi fa-innā khalaqnākum min turābin thumma min nuṭfatin thumma min ʿalaqatin thumma min muḍghatin mukhallaqatin wa-ghayri mukhallaqatin li-nubayyina lakum wa-nuqirru fi l-arḥāmi mā nashāʾu ilā ajalin musamman thumma nukhrijukum ṭiflan thumma li-tablughū ashuddakum wa-minkum man yutawaffā wa-minkum man yuraddu ilā ardhali l-ʿumuri li-kay-lā yaʿlama min baʿdi ʿilmin shayʾan wa-tara l-arḍa hāmidatan fa-idhā anzalnā ʿalayhā l-māʾa htazzat wa-rabat wa-anbatat min kulli zawjin bahīj
  trad: Ô les humains, si vous êtes dans le doute (rayb) au sujet de la résurrection (al-baʿth) — Nous vous avons créés de terre (turāb), puis d'une goutte germinale (nuṭfa), puis d'une adhérence (ʿalaqa), puis d'un embryon mâché (muḍgha) — configuré ou non configuré encore — afin de rendre cela clair pour vous. Et Nous maintenons (nuqirru) dans les matrices (al-arḥām) ce que Nous voulons, jusqu'à un terme fixé ; puis Nous vous faisons sortir petit enfant (ṭiflan) ; puis [Nous vous laissons croître] pour que vous atteigniez votre pleine maturité (ashuddakum). Et parmi vous il en est qui est rappelé à Lui (yutawaffā), et parmi vous il en est qui est ramené à l'âge le plus vil (arḏal al-ʿumur), de sorte qu'il ne sache plus rien après avoir su. Et tu vois la terre éteinte (hāmida) — puis, quand Nous faisons descendre l'eau sur elle, elle s'ébranle, se gonfle, et fait pousser toute espèce radieuse (zawj bahīj).
- ref: S.22:6
  ar: ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّهُ يُحْيِي الْمَوْتَىٰ وَأَنَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Dhālika bi-anna llāha huwa l-ḥaqqu wa-annahu yuḥyi l-mawtā wa-annahu ʿalā kulli shayʾin qadīr
  trad: Cela, parce qu'Allaah, c'est Lui al-Ḥaqq, et qu'Il fait revivre les morts, et qu'Il est, sur toute chose, Qadīr.
- ref: S.22:7
  ar: وَأَنَّ السَّاعَةَ آتِيَةٌ لَا رَيْبَ فِيهَا وَأَنَّ اللَّهَ يَبْعَثُ مَنْ فِي الْقُبُورِ
  trl: Wa-anna s-sāʿata ātiyatun lā rayba fīhā wa-anna llāha yabʿathu man fi l-qubūr
  trad: — et que l'Heure vient, sans doute possible à son sujet, et qu'Allaah ressuscitera (yabʿathu) qui est dans les tombes (al-qubūr).
- ref: S.22:8
  ar: وَمِنَ النَّاسِ مَنْ يُجَادِلُ فِي اللَّهِ بِغَيْرِ عِلْمٍ وَلَا هُدًى وَلَا كِتَابٍ مُنِيرٍ
  trl: Wa-mina n-nāsi man yujādilu fi llāhi bi-ghayri ʿilmin wa-lā hudan wa-lā kitābin munīr
  trad: Et parmi les gens, il en est qui dispute au sujet d'Allaah sans science, ni guidance (hudan), ni Livre éclairant (munīr).
- ref: S.22:9
  ar: ثَانِيَ عِطْفِهِ لِيُضِلَّ عَنْ سَبِيلِ اللَّهِ ۖ لَهُ فِي الدُّنْيَا خِزْيٌ ۖ وَنُذِيقُهُ يَوْمَ الْقِيَامَةِ عَذَابَ الْحَرِيقِ
  trl: Thāniya ʿiṭfihi li-yuḍilla ʿan sabīli llāhi lahu fi d-dunyā khizyun wa-nudhīquhu yawma l-qiyāmati ʿadhāba l-ḥarīq
  trad: — détournant son flanc (thāniya ʿiṭfihi) avec dédain, pour égarer les gens du chemin d'Allaah — pour lui, dans ce monde, un opprobre (khizy), et Nous lui ferons goûter, le Jour de la Résurrection, le châtiment de l'Embrasement (al-ḥarīq).
- ref: S.22:10
  ar: ذَٰلِكَ بِمَا قَدَّمَتْ يَدَاكَ وَأَنَّ اللَّهَ لَيْسَ بِظَلَّامٍ لِلْعَبِيدِ
  trl: Dhālika bimā qaddamat yadāka wa-anna llāha laysa bi-ẓallāmin li-l-ʿabīd
  trad: Cela, pour ce que tes deux mains ont avancé (qaddamat yadāka) — et parce qu'Allaah n'est, en rien, injuste (ẓallām) envers les ʿabīd.
- ref: S.22:11
  ar: وَمِنَ النَّاسِ مَنْ يَعْبُدُ اللَّهَ عَلَىٰ حَرْفٍ ۖ فَإِنْ أَصَابَهُ خَيْرٌ اطْمَأَنَّ بِهِ ۖ وَإِنْ أَصَابَتْهُ فِتْنَةٌ انْقَلَبَ عَلَىٰ وَجْهِهِ خَسِرَ الدُّنْيَا وَالْآخِرَةَ ۚ ذَٰلِكَ هُوَ الْخُسْرَانُ الْمُبِينُ
  trl: Wa-mina n-nāsi man yaʿbudu llāha ʿalā ḥarfin fa-in aṣābahu khayrun iṭmaʾanna bihi wa-in aṣābathu fitnatun inqalaba ʿalā wajhihi khasira d-dunyā wa-l-ākhirata dhālika huwa l-khusrānu l-mubīn
  trad: 'Et parmi les gens, il en est qui adore Allaah sur un bord (ʿalā ḥarf) : si un bien l''atteint, il s''en apaise (iṭmaʾanna) ; mais si une épreuve (fitna) l''atteint, il se retourne complètement (inqalaba ʿalā wajhihi), perdant (khasira) ce monde et l''Ākhira — cela, c''est la perte manifeste (al-khusrān al-mubīn).'
- ref: S.22:12
  ar: يَدْعُو مِنْ دُونِ اللَّهِ مَا لَا يَضُرُّهُ وَمَا لَا يَنْفَعُهُ ۚ ذَٰلِكَ هُوَ الضَّلَالُ الْبَعِيدُ
  trl: Yadʿū min dūni llāhi mā lā yaḍurruhu wa-mā lā yanfaʿuhu dhālika huwa ḍ-ḍalālu l-baʿīd
  trad: Il invoque, en dehors d'Allaah, ce qui ne lui nuit (yaḍurruhu) ni ne lui profite (yanfaʿuhu) — cela, c'est l'égarement lointain (aḍ-ḍalāl al-baʿīd).
- ref: S.22:13
  ar: يَدْعُو لَمَنْ ضَرُّهُ أَقْرَبُ مِنْ نَفْعِهِ ۚ لَبِئْسَ الْمَوْلَىٰ وَلَبِئْسَ الْعَشِيرُ
  trl: Yadʿū la-man ḍarruhu aqrabu min nafʿihi la-biʾsa l-mawlā wa-la-biʾsa l-ʿashīr
  trad: Il invoque certes celui dont le tort (ḍarruhu) est plus proche que le profit (nafʿuhu) — quel détestable allié (al-mawlā), quel détestable compagnon (al-ʿashīr) !
- ref: S.22:14
  ar: إِنَّ اللَّهَ يُدْخِلُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ۚ إِنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ
  trl: Inna llāha yudkhilu lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti jannātin tajrī min taḥtihā l-anhāru inna llāha yafʿalu mā yurīd
  trad: Allaah fait certes entrer ceux qui ont cru et accompli les œuvres droites dans des jardins sous lesquels coulent les rivières — Allaah fait certes ce qu'Il veut (yafʿalu mā yurīd).
- ref: S.22:15
  ar: مَنْ كَانَ يَظُنُّ أَنْ لَنْ يَنْصُرَهُ اللَّهُ فِي الدُّنْيَا وَالْآخِرَةِ فَلْيَمْدُدْ بِسَبَبٍ إِلَى السَّمَاءِ ثُمَّ لْيَقْطَعْ فَلْيَنْظُرْ هَلْ يُذْهِبَنَّ كَيْدُهُ مَا يَغِيظُ
  trl: Man kāna yaẓunnu an lan yanṣurahu llāhu fi d-dunyā wa-l-ākhirati fa-l-yamdud bi-sababin ila s-samāʾi thumma l-yaqṭaʿ fa-l-yanẓur hal yudhhibanna kayduhu mā yaghīẓ
  trad: Quiconque estime qu'Allaah ne le secourra (yanṣurahu) jamais, ni dans ce monde ni dans l'Ākhira — qu'il tende une corde (sabab) jusqu'au ciel, puis qu'il la coupe, et qu'il voie si son stratagème (kayduhu) fera disparaître ce qui l'enrage (mā yaghīẓu).
- ref: S.22:16
  ar: وَكَذَٰلِكَ أَنْزَلْنَاهُ آيَاتٍ بَيِّنَاتٍ وَأَنَّ اللَّهَ يَهْدِي مَنْ يُرِيدُ
  trl: Wa-ka-dhālika anzalnāhu āyātin bayyinātin wa-anna llāha yahdī man yurīd
  trad: Et c'est ainsi que Nous l'avons fait descendre en signes évidents (āyātin bayyinātin) — et qu'Allaah guide qui Il veut.
- ref: S.22:17
  ar: إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالصَّابِئِينَ وَالنَّصَارَىٰ وَالْمَجُوسَ وَالَّذِينَ أَشْرَكُوا إِنَّ اللَّهَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ
  trl: Inna lladhīna āmanū wa-lladhīna hādū wa-ṣ-ṣābiʾīna wa-n-naṣārā wa-l-majūsa wa-lladhīna ashrakū inna llāha yafṣilu baynahum yawma l-qiyāmati inna llāha ʿalā kulli shayʾin shahīd
  trad: 'Ceux qui ont cru, ceux qui ont pratiqué le judaïsme, les ṣābiʾūn, les naṣārā, les Majūs, et ceux qui ont pratiqué le shirk — Allaah tranchera certes entre eux (yafṣilu baynahum) le Jour de la Résurrection : Allaah est certes, sur toute chose, témoin (shahīd).'
- ref: S.22:18
  ar: أَلَمْ تَرَ أَنَّ اللَّهَ يَسْجُدُ لَهُ مَنْ فِي السَّمَاوَاتِ وَمَنْ فِي الْأَرْضِ وَالشَّمْسُ وَالْقَمَرُ وَالنُّجُومُ وَالْجِبَالُ وَالشَّجَرُ وَالدَّوَابُّ وَكَثِيرٌ مِنَ النَّاسِ ۖ وَكَثِيرٌ حَقَّ عَلَيْهِ الْعَذَابُ ۗ وَمَنْ يُهِنِ اللَّهُ فَمَا لَهُ مِنْ مُكْرِمٍ ۚ إِنَّ اللَّهَ يَفْعَلُ مَا يَشَاءُ ۩
  trl: A-lam tara anna llāha yasjudu lahu man fi s-samāwāti wa-man fi l-arḍi wa-sh-shamsu wa-l-qamaru wa-n-nujūmu wa-l-jibālu wa-sh-shajaru wa-d-dawābbu wa-kathīrun mina n-nāsi wa-kathīrun ḥaqqa ʿalayhi l-ʿadhābu wa-man yuhini llāhu fa-mā lahu min mukrimin inna llāha yafʿalu mā yashāʾ
  trad: N'as-tu pas vu que c'est devant Allaah que se prosterne (yasjudu) qui est dans les cieux et qui est sur la terre, le soleil, la lune, les étoiles, les montagnes, les arbres, les êtres en mouvement (ad-dawābb), et beaucoup de gens — tandis que, pour beaucoup, le châtiment s'est avéré (ḥaqqa) ? Et quiconque Allaah humilie (yuhin), nul ne peut l'honorer (mukrim) — Allaah fait certes ce qu'Il veut.
- ref: S.22:19
  ar: ۞ هَٰذَانِ خَصْمَانِ اخْتَصَمُوا فِي رَبِّهِمْ ۖ فَالَّذِينَ كَفَرُوا قُطِّعَتْ لَهُمْ ثِيَابٌ مِنْ نَارٍ يُصَبُّ مِنْ فَوْقِ رُءُوسِهِمُ الْحَمِيمُ
  trl: Hādhāni khaṣmāni khtaṣamū fī rabbihim fa-lladhīna kafarū quṭṭiʿat lahum thiyābun min nārin yuṣabbu min fawqi ruʾūsihimu l-ḥamīm
  trad: 'Voici deux groupes adversaires (khaṣmāni) qui se sont disputés (ikhtaṣamū) au sujet de leur Rabb : ceux qui ont commis le kufr — des vêtements de feu (thiyābun min nār) leur seront taillés (quṭṭiʿat), et l''on versera, par-dessus leurs têtes, une eau bouillante (al-ḥamīm).'
- ref: S.22:20
  ar: يُصْهَرُ بِهِ مَا فِي بُطُونِهِمْ وَالْجُلُودُ
  trl: Yuṣharu bihi mā fī buṭūnihim wa-l-julūd
  trad: Par elle sera fondu (yuṣharu) ce qui est dans leurs ventres (buṭūn), ainsi que leurs peaux (al-julūd).
- ref: S.22:21
  ar: وَلَهُمْ مَقَامِعُ مِنْ حَدِيدٍ
  trl: Wa-lahum maqāmiʿu min ḥadīd
  trad: Et pour eux, des maillets de fer (maqāmiʿ min ḥadīd).
- ref: S.22:22
  ar: كُلَّمَا أَرَادُوا أَنْ يَخْرُجُوا مِنْهَا مِنْ غَمٍّ أُعِيدُوا فِيهَا وَذُوقُوا عَذَابَ الْحَرِيقِ
  trl: Kullamā arādū an yakhrujū minhā min ghammin uʿīdū fīhā wa-dhūqū ʿadhāba l-ḥarīq
  trad: 'Chaque fois qu''ils voudront en sortir, [poussés] par l''angoisse (ghamm), ils y seront ramenés (uʿīdū) : « Goûtez le châtiment de l''Embrasement ! »'
- ref: S.22:23
  ar: إِنَّ اللَّهَ يُدْخِلُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ يُحَلَّوْنَ فِيهَا مِنْ أَسَاوِرَ مِنْ ذَهَبٍ وَلُؤْلُؤًا ۖ وَلِبَاسُهُمْ فِيهَا حَرِيرٌ
  trl: Inna llāha yudkhilu lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti jannātin tajrī min taḥtihā l-anhāru yuḥallawna fīhā min asāwira min dhahabin wa-luʾluʾan wa-libāsuhum fīhā ḥarīr
  trad: Allaah fait certes entrer ceux qui ont cru et accompli les œuvres droites dans des jardins sous lesquels coulent les rivières ; ils y seront parés de bracelets (asāwir) d'or et de perles (luʾluʾ), et leur vêtement y sera de soie (ḥarīr).
- ref: S.22:24
  ar: وَهُدُوا إِلَى الطَّيِّبِ مِنَ الْقَوْلِ وَهُدُوا إِلَىٰ صِرَاطِ الْحَمِيدِ
  trl: Wa-hudū ila ṭ-ṭayyibi mina l-qawli wa-hudū ilā ṣirāṭi l-ḥamīd
  trad: Et ils auront été guidés vers la bonne parole (aṭ-ṭayyib mina l-qawl), et guidés vers le chemin d'al-Ḥamīd.
- ref: S.22:25
  ar: إِنَّ الَّذِينَ كَفَرُوا وَيَصُدُّونَ عَنْ سَبِيلِ اللَّهِ وَالْمَسْجِدِ الْحَرَامِ الَّذِي جَعَلْنَاهُ لِلنَّاسِ سَوَاءً الْعَاكِفُ فِيهِ وَالْبَادِ ۚ وَمَنْ يُرِدْ فِيهِ بِإِلْحَادٍ بِظُلْمٍ نُذِقْهُ مِنْ عَذَابٍ أَلِيمٍ
  trl: Inna lladhīna kafarū wa-yaṣuddūna ʿan sabīli llāhi wa-l-masjidi l-ḥarāmi lladhī jaʿalnāhu li-n-nāsi sawāʾan al-ʿākifu fīhi wa-l-bādi wa-man yurid fīhi bi-ilḥādin bi-ẓulmin nudhiqhu min ʿadhābin alīm
  trad: Ceux qui ont commis le *kufr*, et qui détournent du chemin d'Allaah et du Masjid al-Ḥarām — que Nous avons établi pour les gens à égalité (sawāʾ), aussi bien celui qui y réside (al-ʿākif) que celui qui y vient de l'extérieur (al-bādi) — et quiconque y vise une déviation (ilḥād) par *ẓulm*, Nous lui ferons goûter un *ʿadhāb* douloureux.
- ref: S.22:26
  ar: وَإِذْ بَوَّأْنَا لِإِبْرَاهِيمَ مَكَانَ الْبَيْتِ أَنْ لَا تُشْرِكْ بِي شَيْئًا وَطَهِّرْ بَيْتِيَ لِلطَّائِفِينَ وَالْقَائِمِينَ وَالرُّكَّعِ السُّجُودِ
  trl: Wa-idh bawwaʾnā li-ibrāhīma makāna l-bayti an lā tushrik bī shayʾan wa-ṭahhir baytiya li-ṭ-ṭāʾifīna wa-l-qāʾimīna wa-r-rukkaʿi s-sujūd
  trad: 'Et [rappelle] quand Nous avons établi (bawwaʾnā) pour Ibrāhīm l''emplacement du Bayt — [en lui disant] : « Ne M''associe rien, et purifie Mon Bayt pour ceux qui l''entourent (aṭ-ṭāʾifīn), ceux qui s''y tiennent debout (al-qāʾimīn), et ceux qui s''inclinent et se prosternent (ar-rukkaʿ as-sujūd). »'
- ref: S.22:27
  ar: وَأَذِّنْ فِي النَّاسِ بِالْحَجِّ يَأْتُوكَ رِجَالًا وَعَلَىٰ كُلِّ ضَامِرٍ يَأْتِينَ مِنْ كُلِّ فَجٍّ عَمِيقٍ
  trl: Wa-adhdhin fi n-nāsi bi-l-ḥajji yaʾtūka rijālan wa-ʿalā kulli ḍāmirin yaʾtīna min kulli fajjin ʿamīq
  trad: 'Et appelle (adhdhin) les gens au Ḥajj : ils viendront à toi à pied (rijālan), et sur toute monture amaigrie [par la route] (ḍāmir), venant de tout chemin de montagne profondément encaissé (fajj ʿamīq).'
- ref: S.22:28
  ar: لِيَشْهَدُوا مَنَافِعَ لَهُمْ وَيَذْكُرُوا اسْمَ اللَّهِ فِي أَيَّامٍ مَعْلُومَاتٍ عَلَىٰ مَا رَزَقَهُمْ مِنْ بَهِيمَةِ الْأَنْعَامِ ۖ فَكُلُوا مِنْهَا وَأَطْعِمُوا الْبَائِسَ الْفَقِيرَ
  trl: Li-yashhadū manāfiʿa lahum wa-yadhkurū sma llāhi fī ayyāmin maʿlūmātin ʿalā mā razaqahum min bahīmati l-anʿāmi fa-kulū minhā wa-aṭʿimū l-bāʾisa l-faqīr
  trad: — afin qu'ils soient témoins (li-yashhadū) de bienfaits (manāfiʿ) pour eux, et qu'ils invoquent le Nom d'Allaah, en des jours comptés (ayyām maʿlūmāt), sur ce qu'Il leur a attribué comme subsistance (razaqahum) parmi le bétail des troupeaux (bahīmat al-anʿām) — mangez-en donc, et nourrissez le misérable et l'indigent (al-bāʾis al-faqīr).
- ref: S.22:29
  ar: ثُمَّ لْيَقْضُوا تَفَثَهُمْ وَلْيُوفُوا نُذُورَهُمْ وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ
  trl: Thumma l-yaqḍū tafathahum wa-l-yūfū nudhūrahum wa-l-yaṭṭawwafū bi-l-bayti l-ʿatīq
  trad: Puis qu'ils accomplissent (li-yaqḍū) ce qui reste de leur *tafath*, qu'ils s'acquittent pleinement (li-yūfū) de leurs vœux (nudhūr), et qu'ils accomplissent le *ṭawāf* autour du Bayt al-ʿAtīq (l'Ancienne Demeure).
- ref: S.22:30
  ar: ذَٰلِكَ وَمَنْ يُعَظِّمْ حُرُمَاتِ اللَّهِ فَهُوَ خَيْرٌ لَهُ عِنْدَ رَبِّهِ ۗ وَأُحِلَّتْ لَكُمُ الْأَنْعَامُ إِلَّا مَا يُتْلَىٰ عَلَيْكُمْ ۖ فَاجْتَنِبُوا الرِّجْسَ مِنَ الْأَوْثَانِ وَاجْتَنِبُوا قَوْلَ الزُّورِ
  trl: Dhālika wa-man yuʿaẓẓim ḥurumāti llāhi fa-huwa khayrun lahu ʿinda rabbihi wa-uḥillat lakumu l-anʿāmu illā mā yutlā ʿalaykum fa-jtanibū r-rijsa mina l-awthāni wa-jtanibū qawla z-zūr
  trad: Voilà. Et quiconque magnifie (yuʿaẓẓim) les ḥurumāt d'Allaah — cela est meilleur pour lui auprès de son Rabb. Et vous est rendu licite le bétail (al-anʿām), à l'exception de ce qui vous sera récité [par ailleurs] — évitez donc le *rijs* (la souillure) des idoles (al-awthān), et évitez la parole mensongère (qawl az-zūr).
- ref: S.22:31
  ar: حُنَفَاءَ لِلَّهِ غَيْرَ مُشْرِكِينَ بِهِ ۚ وَمَنْ يُشْرِكْ بِاللَّهِ فَكَأَنَّمَا خَرَّ مِنَ السَّمَاءِ فَتَخْطَفُهُ الطَّيْرُ أَوْ تَهْوِي بِهِ الرِّيحُ فِي مَكَانٍ سَحِيقٍ
  trl: Ḥunafāʾa li-llāhi ghayra mushrikīna bihi wa-man yushrik bi-llāhi fa-ka-annamā kharra mina s-samāʾi fa-takhṭafuhu ṭ-ṭayru aw tahwī bihi r-rīḥu fī makānin saḥīq
  trad: '— [étant] *ḥunafāʾ* envers Allaah, ne Lui associant rien : et quiconque associe à Allaah, c''est comme s''il était tombé (kharra) du ciel, et que les oiseaux l''arrachaient (takhṭafuhu), ou que le vent le précipitait (tahwī bihi) en un lieu lointain et profond (makān saḥīq).'
- ref: S.22:32
  ar: ذَٰلِكَ وَمَنْ يُعَظِّمْ شَعَائِرَ اللَّهِ فَإِنَّهَا مِنْ تَقْوَى الْقُلُوبِ
  trl: Dhālika wa-man yuʿaẓẓim shaʿāʾira llāhi fa-innahā min taqwā l-qulūb
  trad: Voilà. Et quiconque magnifie les *shaʿāʾir* d'Allaah — cela relève certes de la *taqwā* des cœurs.
- ref: S.22:33
  ar: لَكُمْ فِيهَا مَنَافِعُ إِلَىٰ أَجَلٍ مُسَمًّى ثُمَّ مَحِلُّهَا إِلَى الْبَيْتِ الْعَتِيقِ
  trl: Lakum fīhā manāfiʿu ilā ajalin musamman thumma maḥilluhā ila l-bayti l-ʿatīq
  trad: Pour vous, en elles [ces bêtes], des bienfaits (manāfiʿ) jusqu'à un terme fixé (ajal musamman) — puis leur lieu d'accomplissement (maḥill) est vers le Bayt al-ʿAtīq.
- ref: S.22:34
  ar: وَلِكُلِّ أُمَّةٍ جَعَلْنَا مَنْسَكًا لِيَذْكُرُوا اسْمَ اللَّهِ عَلَىٰ مَا رَزَقَهُمْ مِنْ بَهِيمَةِ الْأَنْعَامِ ۗ فَإِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ فَلَهُ أَسْلِمُوا ۗ وَبَشِّرِ الْمُخْبِتِينَ
  trl: Wa-li-kulli ummatin jaʿalnā mansakan li-yadhkurū sma llāhi ʿalā mā razaqahum min bahīmati l-anʿāmi fa-ilāhukum ilāhun wāḥidun fa-lahu aslimū wa-bashshiri l-mukhbitīn
  trad: 'Et pour chaque *umma*, Nous avons établi un *mansak*, afin qu''ils invoquent le Nom d''Allaah sur ce qu''Il leur a attribué comme subsistance parmi le bétail des troupeaux — votre ilāh est un ilāh unique : soumettez-vous donc (aslimū) à Lui. Et annonce une bonne nouvelle aux *mukhbitīn*.'
- ref: S.22:35
  ar: الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَالصَّابِرِينَ عَلَىٰ مَا أَصَابَهُمْ وَالْمُقِيمِي الصَّلَاةِ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ
  trl: Alladhīna idhā dhukira llāhu wajilat qulūbuhum wa-ṣ-ṣābirīna ʿalā mā aṣābahum wa-l-muqīmi ṣ-ṣalāti wa-mimmā razaqnāhum yunfiqūn
  trad: — ceux dont les cœurs sont saisis d'effroi (wajilat) quand Allaah est évoqué, ceux qui sont constants (aṣ-ṣābirīn) devant ce qui les atteint, ceux qui accomplissent la *ṣalāt*, et qui dépensent de ce que Nous leur avons attribué comme subsistance.
- ref: S.22:36
  ar: وَالْبُدْنَ جَعَلْنَاهَا لَكُمْ مِنْ شَعَائِرِ اللَّهِ لَكُمْ فِيهَا خَيْرٌ ۖ فَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهَا صَوَافَّ ۖ فَإِذَا وَجَبَتْ جُنُوبُهَا فَكُلُوا مِنْهَا وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ ۚ كَذَٰلِكَ سَخَّرْنَاهَا لَكُمْ لَعَلَّكُمْ تَشْكُرُونَ
  trl: Wa-l-budna jaʿalnāhā lakum min shaʿāʾiri llāhi lakum fīhā khayrun fa-dhkuru sma llāhi ʿalayhā ṣawāffa fa-idhā wajabat junūbuhā fa-kulū minhā wa-aṭʿimū l-qāniʿa wa-l-muʿtarra ka-dhālika sakhkharnāhā lakum laʿallakum tashkurūn
  trad: Et les *budn* (grands animaux de sacrifice), Nous les avons établies pour vous parmi les *shaʿāʾir* d'Allaah — pour vous, en elles, un bienfait (khayr). Invoquez donc le Nom d'Allaah sur elles, alignées (ṣawāff) ; et quand leurs flancs se sont abattus (wajabat junūbuhā), mangez-en, et nourrissez-en celui qui se contente sans demander (al-qāniʿ) et celui qui demande (al-muʿtarr). C'est ainsi que Nous vous les avons assujetties (sakhkharnāhā), afin que vous soyez reconnaissants (tashkurūn).
- ref: S.22:37
  ar: لَنْ يَنَالَ اللَّهَ لُحُومُهَا وَلَا دِمَاؤُهَا وَلَٰكِنْ يَنَالُهُ التَّقْوَىٰ مِنْكُمْ ۚ كَذَٰلِكَ سَخَّرَهَا لَكُمْ لِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ ۗ وَبَشِّرِ الْمُحْسِنِينَ
  trl: Lan yanāla llāha luḥūmuhā wa-lā dimāʾuhā wa-lākin yanāluhu t-taqwā minkum ka-dhālika sakhkharahā lakum li-tukabbirū llāha ʿalā mā hadākum wa-bashshiri l-muḥsinīn
  trad: Ni leurs chairs ni leurs sangs n'atteindront jamais (lan yanāla) Allaah — mais c'est la *taqwā*, de votre part, qui L'atteint. C'est ainsi qu'Il vous les a assujetties, afin que vous proclamiez la grandeur (li-tukabbirū) d'Allaah pour vous avoir guidés — et annonce une bonne nouvelle aux *muḥsinīn*.
- ref: S.22:38
  ar: ۞ إِنَّ اللَّهَ يُدَافِعُ عَنِ الَّذِينَ آمَنُوا ۗ إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ خَوَّانٍ كَفُورٍ
  trl: Inna llāha yudāfiʿu ʿani lladhīna āmanū inna llāha lā yuḥibbu kulla khawwānin kafūr
  trad: Allaah défend certes ceux qui ont cru — Allaah n'honore (lā yuḥibbu) certes pas tout traître (khawwān) mécréant (kafūr).
- ref: S.22:39
  ar: أُذِنَ لِلَّذِينَ يُقَاتَلُونَ بِأَنَّهُمْ ظُلِمُوا ۚ وَإِنَّ اللَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌ
  trl: Udhina li-lladhīna yuqātalūna bi-annahum ẓulimū wa-inna llāha ʿalā naṣrihim la-qadīr
  trad: Permission est donnée à ceux à qui l'on fait la guerre (yuqātalūna), parce qu'ils ont subi un *ẓulm* — et Allaah, sur leur secours, est certes Qadīr.
- ref: S.22:40
  ar: الَّذِينَ أُخْرِجُوا مِنْ دِيَارِهِمْ بِغَيْرِ حَقٍّ إِلَّا أَنْ يَقُولُوا رَبُّنَا اللَّهُ ۗ وَلَوْلَا دَفْعُ اللَّهِ النَّاسَ بَعْضَهُمْ بِبَعْضٍ لَهُدِّمَتْ صَوَامِعُ وَبِيَعٌ وَصَلَوَاتٌ وَمَسَاجِدُ يُذْكَرُ فِيهَا اسْمُ اللَّهِ كَثِيرًا ۗ وَلَيَنْصُرَنَّ اللَّهُ مَنْ يَنْصُرُهُ ۗ إِنَّ اللَّهَ لَقَوِيٌّ عَزِيزٌ
  trl: Alladhīna ukhrijū min diyārihim bi-ghayri ḥaqqin illā an yaqūlū rabbunā llāhu wa-lawlā dafʿu llāhi n-nāsa baʿḍahum bi-baʿḍin la-huddimat ṣawāmiʿu wa-biyaʿun wa-ṣalawātun wa-masājidu yudhkaru fīhā smu llāhi kathīran wa-la-yanṣuranna llāhu man yanṣuruhu inna llāha la-qawiyyun ʿazīz
  trad: '— ceux qui ont été chassés de leurs demeures sans droit (bi-ghayri ḥaqq), seulement parce qu''ils disaient : « Notre Rabb est Allaah. » Et si Allaah ne repoussait pas les gens (dafʿu llāhi n-nāsa) les uns par les autres, auraient été démolis des ermitages (ṣawāmiʿ), des églises (biyaʿ), des lieux de prière (ṣalawāt), et des mosquées (masājid) où le Nom d''Allaah est invoqué abondamment. Et Allaah secourt certes (la-yanṣuranna) qui Le secourt (man yanṣuruhu) — Allaah est certes Qawiyy, ʿAzīz.'
- ref: S.22:41
  ar: الَّذِينَ إِنْ مَكَّنَّاهُمْ فِي الْأَرْضِ أَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ وَأَمَرُوا بِالْمَعْرُوفِ وَنَهَوْا عَنِ الْمُنْكَرِ ۗ وَلِلَّهِ عَاقِبَةُ الْأُمُورِ
  trl: Alladhīna in makkannāhum fi l-arḍi aqāmu ṣ-ṣalāta wa-ātawu z-zakāta wa-amarū bi-l-maʿrūfi wa-nahaw ʿani l-munkari wa-li-llāhi ʿāqibatu l-umūr
  trad: — ceux qui, si Nous les établissons fermement (makkannāhum) sur la terre, accomplissent la *ṣalāt*, s'acquittent de la *zakāt*, ordonnent le *maʿrūf* et interdisent le *munkar* — et c'est à Allaah qu'appartient l'issue finale de toute chose (ʿāqibat al-umūr).
- ref: S.22:42
  ar: وَإِنْ يُكَذِّبُوكَ فَقَدْ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ وَعَادٌ وَثَمُودُ
  trl: Wa-in yukadhdhibūka fa-qad kadhdhabat qablahum qawmu nūḥin wa-ʿādun wa-thamūd
  trad: Et s'ils te traitent de menteur, le peuple de Nūḥ, ʿĀd et Thamūd ont déjà traité de menteurs [leurs envoyés] avant eux.
- ref: S.22:43
  ar: وَقَوْمُ إِبْرَاهِيمَ وَقَوْمُ لُوطٍ
  trl: Wa-qawmu ibrāhīma wa-qawmu lūṭ
  trad: — ainsi que le peuple d'Ibrāhīm et le peuple de Lūṭ.
- ref: S.22:44
  ar: وَأَصْحَابُ مَدْيَنَ ۖ وَكُذِّبَ مُوسَىٰ فَأَمْلَيْتُ لِلْكَافِرِينَ ثُمَّ أَخَذْتُهُمْ ۖ فَكَيْفَ كَانَ نَكِيرِ
  trl: Wa-aṣḥābu madyana wa-kudhdhiba mūsā fa-amlaytu li-l-kāfirīna thumma akhadhtuhum fa-kayfa kāna nakīr
  trad: — et les compagnons de Madyan. Et Mūsā fut traité de menteur. J'ai accordé un délai (amlaytu) aux *kāfirūn*, puis Je les ai saisis (akhadhtuhum) — et quel fut Mon désaveu (nakīr) !
- ref: S.22:45
  ar: فَكَأَيِّنْ مِنْ قَرْيَةٍ أَهْلَكْنَاهَا وَهِيَ ظَالِمَةٌ فَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَبِئْرٍ مُعَطَّلَةٍ وَقَصْرٍ مَشِيدٍ
  trl: Fa-ka-ayyin min qaryatin ahlaknāhā wa-hiya ẓālimatun fa-hiya khāwiyatun ʿalā ʿurūshihā wa-biʾrin muʿaṭṭalatin wa-qaṣrin mashīd
  trad: Combien de cités (qarya) avons-Nous détruites, alors qu'elles étaient *ẓālima* — les voilà effondrées sur leurs propres charpentes (khāwiyatun ʿalā ʿurūshihā), ainsi qu'un puits laissé à l'abandon (biʾr muʿaṭṭala), et un palais élevé (qaṣr mashīd).
- ref: S.22:46
  ar: أَفَلَمْ يَسِيرُوا فِي الْأَرْضِ فَتَكُونَ لَهُمْ قُلُوبٌ يَعْقِلُونَ بِهَا أَوْ آذَانٌ يَسْمَعُونَ بِهَا ۖ فَإِنَّهَا لَا تَعْمَى الْأَبْصَارُ وَلَٰكِنْ تَعْمَى الْقُلُوبُ الَّتِي فِي الصُّدُورِ
  trl: A-fa-lam yasīrū fi l-arḍi fa-takūna lahum qulūbun yaʿqilūna bihā aw ādhānun yasmaʿūna bihā fa-innahā lā taʿma l-abṣāru wa-lākin taʿma l-qulūbu llatī fi ṣ-ṣudūr
  trad: N'ont-ils donc pas parcouru la terre, pour avoir des cœurs par lesquels ils raisonneraient, ou des oreilles par lesquelles ils entendraient ? Car ce ne sont pas les yeux (al-abṣār) qui s'aveuglent — ce sont les cœurs, qui sont dans les poitrines, qui s'aveuglent.
- ref: S.22:47
  ar: وَيَسْتَعْجِلُونَكَ بِالْعَذَابِ وَلَنْ يُخْلِفَ اللَّهُ وَعْدَهُ ۚ وَإِنَّ يَوْمًا عِنْدَ رَبِّكَ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ
  trl: Wa-yastaʿjilūnaka bi-l-ʿadhābi wa-lan yukhlifa llāhu waʿdahu wa-inna yawman ʿinda rabbika ka-alfi sanatin mimmā taʿuddūn
  trad: Et ils te pressent (yastaʿjilūnaka) au sujet du châtiment — alors qu'Allaah ne manquera jamais (lan yukhlifa) à Sa promesse. Et un jour auprès de ton Rabb est certes comme mille ans de ce que vous comptez (mimmā taʿuddūn).
- ref: S.22:48
  ar: وَكَأَيِّنْ مِنْ قَرْيَةٍ أَمْلَيْتُ لَهَا وَهِيَ ظَالِمَةٌ ثُمَّ أَخَذْتُهَا وَإِلَيَّ الْمَصِيرُ
  trl: Wa-ka-ayyin min qaryatin amlaytu lahā wa-hiya ẓālimatun thumma akhadhtuhā wa-ilayya l-maṣīr
  trad: 'Et combien de cités auxquelles J''ai accordé un délai, alors qu''elles étaient *ẓālima* — puis Je les ai saisies : et c''est vers Moi le devenir final (al-maṣīr).'
- ref: S.22:49
  ar: قُلْ يَا أَيُّهَا النَّاسُ إِنَّمَا أَنَا لَكُمْ نَذِيرٌ مُبِينٌ
  trl: Qul yā ayyuhā n-nāsu innamā anā lakum nadhīrun mubīn
  trad: 'Dis : « Ô les humains, je ne suis pour vous qu''un avertisseur (nadhīr) manifeste (mubīn). »'
- ref: S.22:50
  ar: فَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ مَغْفِرَةٌ وَرِزْقٌ كَرِيمٌ
  trl: Fa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti lahum maghfiratun wa-rizqun karīm
  trad: Ceux qui ont cru et accompli les œuvres droites ont un pardon (maghfira) et un *rizq* généreux (karīm).
- ref: S.22:51
  ar: وَالَّذِينَ سَعَوْا فِي آيَاتِنَا مُعَاجِزِينَ أُولَٰئِكَ أَصْحَابُ الْجَحِيمِ
  trl: Wa-lladhīna saʿaw fī āyātinā muʿājizīna ulāʾika aṣḥābu l-jaḥīm
  trad: Et ceux qui se sont évertués (saʿaw) contre Nos signes, cherchant à Nous rendre impuissants (muʿājizīn) — ceux-là sont les compagnons de la Jaḥīm.
- ref: S.22:52
  ar: وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ مِنْ رَسُولٍ وَلَا نَبِيٍّ إِلَّا إِذَا تَمَنَّىٰ أَلْقَى الشَّيْطَانُ فِي أُمْنِيَّتِهِ فَيَنْسَخُ اللَّهُ مَا يُلْقِي الشَّيْطَانُ ثُمَّ يُحْكِمُ اللَّهُ آيَاتِهِ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Wa-mā arsalnā min qablika min rasūlin wa-lā nabiyyin illā idhā tamannā alqa sh-shayṭānu fī umniyyatihi fa-yansakhu llāhu mā yulqi sh-shayṭānu thumma yuḥkimu llāhu āyātihi wa-llāhu ʿalīmun ḥakīm
  trad: 'Et Nous n''avons envoyé avant toi aucun *rasūl* ni aucun *nabī* sans que, lorsqu''il *tamannā*, le *shayṭān* n''ait jeté (alqā) quelque chose dans son *umniyyah* — mais Allaah efface (fa-yansakhu) ce que le *shayṭān* jette, puis Allaah consolide (yuḥkimu) Ses signes de façon définitive : Allaah est ʿAlīm, Ḥakīm.'
- ref: S.22:53
  ar: لِيَجْعَلَ مَا يُلْقِي الشَّيْطَانُ فِتْنَةً لِلَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ وَالْقَاسِيَةِ قُلُوبُهُمْ ۗ وَإِنَّ الظَّالِمِينَ لَفِي شِقَاقٍ بَعِيدٍ
  trl: Li-yajʿala mā yulqi sh-shayṭānu fitnatan li-lladhīna fī qulūbihim maraḍun wa-l-qāsiyati qulūbuhum wa-inna ẓ-ẓālimīna la-fī shiqāqin baʿīd
  trad: — afin qu'Il fasse de ce que jette le *shayṭān* une *fitna* pour ceux qui ont une maladie (maraḍ) au cœur et dont les cœurs sont endurcis (al-qāsiya qulūbuhum) — et les *ẓālimūn* sont certes dans une rupture profonde (shiqāq baʿīd).
- ref: S.22:54
  ar: وَلِيَعْلَمَ الَّذِينَ أُوتُوا الْعِلْمَ أَنَّهُ الْحَقُّ مِنْ رَبِّكَ فَيُؤْمِنُوا بِهِ فَتُخْبِتَ لَهُ قُلُوبُهُمْ ۗ وَإِنَّ اللَّهَ لَهَادِ الَّذِينَ آمَنُوا إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Wa-li-yaʿlama lladhīna ūtu l-ʿilma annahu l-ḥaqqu min rabbika fa-yuʾminū bihi fa-tukhbita lahu qulūbuhum wa-inna llāha la-hādi lladhīna āmanū ilā ṣirāṭin mustaqīm
  trad: — et afin que ceux à qui la science a été donnée sachent que c'est le *ḥaqq* venant de ton Rabb, qu'ils y croient, et que leurs cœurs s'en apaisent dans l'humilité (fa-tukhbita) — et Ce qui guide (la-hādi) ceux qui ont cru, c'est certes Allaah, vers un chemin droit (ṣirāṭ mustaqīm).
- ref: S.22:55
  ar: وَلَا يَزَالُ الَّذِينَ كَفَرُوا فِي مِرْيَةٍ مِنْهُ حَتَّىٰ تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً أَوْ يَأْتِيَهُمْ عَذَابُ يَوْمٍ عَقِيمٍ
  trl: Wa-lā yazālu lladhīna kafarū fī miryatin minhu ḥattā taʾtiyahumu s-sāʿatu baghtatan aw yaʾtiyahum ʿadhābu yawmin ʿaqīm
  trad: Et ceux qui ont commis le *kufr* ne cesseront d'être dans un doute (*mirya*) à son sujet, jusqu'à ce que l'Heure (*as-sāʿa*) leur vienne soudainement (*baghtatan*), ou que leur vienne le châtiment d'un jour stérile (*yawm ʿaqīm*).
- ref: S.22:56
  ar: الْمُلْكُ يَوْمَئِذٍ لِلَّهِ يَحْكُمُ بَيْنَهُمْ ۚ فَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فِي جَنَّاتِ النَّعِيمِ
  trl: Al-mulku yawmaʾidhin li-llāhi yaḥkumu baynahum fa-lladhīna āmanū wa-ʿamilu ṣ-ṣāliḥāti fī jannāti n-naʿīm
  trad: 'La royauté (*al-mulk*), ce Jour-là, est à Allaah : Il juge (*yaḥkumu*) entre eux — ceux qui ont cru et accompli les œuvres droites seront dans les jardins du délice (*jannāt an-naʿīm*).'
- ref: S.22:57
  ar: وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا فَأُولَٰئِكَ لَهُمْ عَذَابٌ مُهِينٌ
  trl: Wa-lladhīna kafarū wa-kadhdhabū bi-āyātinā fa-ulāʾika lahum ʿadhābun muhīn
  trad: Et ceux qui ont commis le *kufr* et démenti Nos *āyāt* — ceux-là auront un *ʿadhāb* humiliant (*muhīn*).
- ref: S.22:58
  ar: وَالَّذِينَ هَاجَرُوا فِي سَبِيلِ اللَّهِ ثُمَّ قُتِلُوا أَوْ مَاتُوا لَيَرْزُقَنَّهُمُ اللَّهُ رِزْقًا حَسَنًا ۚ وَإِنَّ اللَّهَ لَهُوَ خَيْرُ الرَّازِقِينَ
  trl: Wa-lladhīna hājarū fī sabīli llāhi thumma qutilū aw mātū la-yarzuqannahumu llāhu rizqan ḥasanan wa-inna llāha la-huwa khayru r-rāziqīn
  trad: 'Et ceux qui ont émigré (*hājarū*) dans le *sabīl* d''Allaah, puis ont été tués ou sont morts — Allaah leur attribuera assurément (*la-yarzuqannahum*) un *rizq* généreux (*ḥasan*) : Allaah est certes le meilleur de ceux qui attribuent la subsistance (*khayr ar-rāziqīn*).'
- ref: S.22:59
  ar: لَيُدْخِلَنَّهُمْ مُدْخَلًا يَرْضَوْنَهُ ۗ وَإِنَّ اللَّهَ لَعَلِيمٌ حَلِيمٌ
  trl: La-yudkhilannahum mudkhalan yarḍawnahu wa-inna llāha la-ʿalīmun ḥalīm
  trad: Il les fera assurément entrer en une entrée (*mudkhal*) qu'ils agréeront (*yarḍawnahu*) — Allaah est certes *ʿAlīm*, *Ḥalīm*.
- ref: S.22:60
  ar: ۞ ذَٰلِكَ وَمَنْ عَاقَبَ بِمِثْلِ مَا عُوقِبَ بِهِ ثُمَّ بُغِيَ عَلَيْهِ لَيَنْصُرَنَّهُ اللَّهُ ۗ إِنَّ اللَّهَ لَعَفُوٌّ غَفُورٌ
  trl: Dhālika wa-man ʿāqaba bi-mithli mā ʿūqiba bihi thumma bughiya ʿalayhi la-yanṣurannahu llāhu inna llāha la-ʿafuwwun ghafūr
  trad: 'Voilà. Et quiconque répond (*ʿāqaba*) à la mesure exacte de ce qui lui a été infligé (*bi-mithli mā ʿūqiba bihi*), puis subit de nouveau une injustice (*bughiya ʿalayhi*) — Allaah le secourra assurément (*la-yanṣurannahu*) : Allaah est certes *ʿAfuww*, *Ghafūr*.'
- ref: S.22:61
  ar: ذَٰلِكَ بِأَنَّ اللَّهَ يُولِجُ اللَّيْلَ فِي النَّهَارِ وَيُولِجُ النَّهَارَ فِي اللَّيْلِ وَأَنَّ اللَّهَ سَمِيعٌ بَصِيرٌ
  trl: Dhālika bi-anna llāha yūliju l-layla fi n-nahāri wa-yūliju n-nahāra fi l-layli wa-anna llāha samīʿun baṣīr
  trad: Voilà, parce qu'Allaah insère (*yūliju*) la nuit dans le jour, et insère le jour dans la nuit, et parce qu'Allaah est *Samīʿ*, *Baṣīr*.
- ref: S.22:62
  ar: ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّ مَا يَدْعُونَ مِنْ دُونِهِ هُوَ الْبَاطِلُ وَأَنَّ اللَّهَ هُوَ الْعَلِيُّ الْكَبِيرُ
  trl: Dhālika bi-anna llāha huwa l-ḥaqqu wa-anna mā yadʿūna min dūnihi huwa l-bāṭilu wa-anna llāha huwa l-ʿaliyyu l-kabīr
  trad: Voilà, parce qu'Allaah est le *Ḥaqq*, et que ce qu'ils invoquent en dehors de Lui est le *bāṭil* (ce qui est sans fondement), et parce qu'Allaah est *al-ʿAliyy*, *al-Kabīr*.
- ref: S.22:63
  ar: أَلَمْ تَرَ أَنَّ اللَّهَ أَنْزَلَ مِنَ السَّمَاءِ مَاءً فَتُصْبِحُ الْأَرْضُ مُخْضَرَّةً ۗ إِنَّ اللَّهَ لَطِيفٌ خَبِيرٌ
  trl: A-lam tara anna llāha anzala mina s-samāʾi māʾan fa-tuṣbiḥu l-arḍu mukhḍarratan inna llāha laṭīfun khabīr
  trad: N'as-tu pas vu qu'Allaah a fait descendre du ciel une eau, et que la terre, dès lors, devient verdoyante (*mukhḍarra*) ? Allaah est certes *Laṭīf*, *Khabīr*.
- ref: S.22:64
  ar: لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَإِنَّ اللَّهَ لَهُوَ الْغَنِيُّ الْحَمِيدُ
  trl: Lahu mā fi s-samāwāti wa-mā fi l-arḍi wa-inna llāha la-huwa l-ghaniyyu l-ḥamīd
  trad: À Lui appartient ce qui est dans les cieux et ce qui est sur la terre — Allaah est certes *al-Ghaniyy*, *al-Ḥamīd*.
- ref: S.22:65
  ar: أَلَمْ تَرَ أَنَّ اللَّهَ سَخَّرَ لَكُمْ مَا فِي الْأَرْضِ وَالْفُلْكَ تَجْرِي فِي الْبَحْرِ بِأَمْرِهِ وَيُمْسِكُ السَّمَاءَ أَنْ تَقَعَ عَلَى الْأَرْضِ إِلَّا بِإِذْنِهِ ۗ إِنَّ اللَّهَ بِالنَّاسِ لَرَءُوفٌ رَحِيمٌ
  trl: A-lam tara anna llāha sakhkhara lakum mā fi l-arḍi wa-l-fulka tajrī fi l-baḥri bi-amrihi wa-yumsiku s-samāʾa an taqaʿa ʿalā l-arḍi illā bi-idhnihi inna llāha bi-n-nāsi la-raʾūfun raḥīm
  trad: N'as-tu pas vu qu'Allaah vous a assujetti (*sakhkhara*) ce qui est sur la terre, et le navire (*al-fulk*), qui vogue en mer par Son ordre (*bi-amrihi*) ? Et Il retient (*yumsiku*) le ciel pour qu'il ne s'abatte pas sur la terre, si ce n'est par Sa permission (*illā bi-idhnihi*) — Allaah est certes, envers les gens, *Raʾūf*, *Raḥīm*.
- ref: S.22:66
  ar: وَهُوَ الَّذِي أَحْيَاكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ۗ إِنَّ الْإِنْسَانَ لَكَفُورٌ
  trl: Wa-huwa lladhī aḥyākum thumma yumītukum thumma yuḥyīkum inna l-insāna la-kafūr
  trad: Et c'est Ce qui vous a fait vivre (*aḥyākum*), puis vous fera mourir, puis vous fera revivre — l'être humain est certes porté au *kufr* (*la-kafūr*).
- ref: S.22:67
  ar: لِكُلِّ أُمَّةٍ جَعَلْنَا مَنْسَكًا هُمْ نَاسِكُوهُ ۖ فَلَا يُنَازِعُنَّكَ فِي الْأَمْرِ ۚ وَادْعُ إِلَىٰ رَبِّكَ ۖ إِنَّكَ لَعَلَىٰ هُدًى مُسْتَقِيمٍ
  trl: Li-kulli ummatin jaʿalnā mansakan hum nāsikūhu fa-lā yunāziʿunnaka fi l-amri wa-dʿu ilā rabbika innaka la-ʿalā hudan mustaqīm
  trad: 'Pour chaque *umma*, Nous avons établi un *mansak* qu''elle accomplit (*hum nāsikūhu*) — qu''ils ne te disputent donc pas l''affaire (*fa-lā yunāziʿunnaka fi l-amr*) : appelle vers ton *Rabb*, tu es certes sur une guidance droite (*hudan mustaqīm*).'
- ref: S.22:68
  ar: وَإِنْ جَادَلُوكَ فَقُلِ اللَّهُ أَعْلَمُ بِمَا تَعْمَلُونَ
  trl: Wa-in jādalūka fa-quli llāhu aʿlamu bimā taʿmalūn
  trad: 'Et s''ils te contestent (*jādalūka*), dis : « Allaah sait mieux (*aʿlam*) ce que vous faites. »'
- ref: S.22:69
  ar: اللَّهُ يَحْكُمُ بَيْنَكُمْ يَوْمَ الْقِيَامَةِ فِيمَا كُنْتُمْ فِيهِ تَخْتَلِفُونَ
  trl: Allāhu yaḥkumu baynakum yawma l-qiyāmati fīmā kuntum fīhi takhtalifūn
  trad: Allaah jugera (*yaḥkumu*) entre vous, au Jour de la Résurrection, sur ce en quoi vous étiez en désaccord (*takhtalifūn*).
- ref: S.22:70
  ar: أَلَمْ تَعْلَمْ أَنَّ اللَّهَ يَعْلَمُ مَا فِي السَّمَاءِ وَالْأَرْضِ ۗ إِنَّ ذَٰلِكَ فِي كِتَابٍ ۚ إِنَّ ذَٰلِكَ عَلَى اللَّهِ يَسِيرٌ
  trl: A-lam taʿlam anna llāha yaʿlamu mā fi s-samāʾi wa-l-arḍi inna dhālika fī kitābin inna dhālika ʿalā llāhi yasīr
  trad: Ne sais-tu pas qu'Allaah sait ce qui est dans le ciel et sur la terre ? Cela est certes dans un *Kitāb* — cela est certes, pour Allaah, chose aisée (*yasīr*).
- ref: S.22:71
  ar: وَيَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَمْ يُنَزِّلْ بِهِ سُلْطَانًا وَمَا لَيْسَ لَهُمْ بِهِ عِلْمٌ ۗ وَمَا لِلظَّالِمِينَ مِنْ نَصِيرٍ
  trl: Wa-yaʿbudūna min dūni llāhi mā lam yunazzil bihi sulṭānan wa-mā laysa lahum bihi ʿilmun wa-mā li-ẓ-ẓālimīna min naṣīr
  trad: Et ils adorent, en dehors d'Allaah, ce pour quoi Il n'a fait descendre aucune autorité (*sulṭān*), et ce dont ils n'ont aucune science — et il n'y a, pour les *ẓālimūn*, nul secours (*naṣīr*).
- ref: S.22:72
  ar: وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ تَعْرِفُ فِي وُجُوهِ الَّذِينَ كَفَرُوا الْمُنْكَرَ ۖ يَكَادُونَ يَسْطُونَ بِالَّذِينَ يَتْلُونَ عَلَيْهِمْ آيَاتِنَا ۗ قُلْ أَفَأُنَبِّئُكُمْ بِشَرٍّ مِنْ ذَٰلِكُمُ ۗ النَّارُ وَعَدَهَا اللَّهُ الَّذِينَ كَفَرُوا ۖ وَبِئْسَ الْمَصِيرُ
  trl: Wa-idhā tutlā ʿalayhim āyātunā bayyinātin taʿrifu fī wujūhi lladhīna kafaru l-munkara yakādūna yasṭūna bi-lladhīna yatlūna ʿalayhim āyātinā qul a-fa-unabbiʾukum bi-sharrin min dhālikumu n-nāru waʿadahā llāhu lladhīna kafarū wa-biʾsa l-maṣīr
  trad: 'Et quand Nos *āyāt* évidentes (*bayyināt*) leur sont récitées, tu reconnais (*taʿrifu*), sur le visage de ceux qui ont commis le *kufr*, le *munkar* (le rejet manifeste) — ils sont sur le point de se jeter (*yakādūna yasṭūna*) sur ceux qui leur récitent Nos *āyāt*. Dis : « Vous informerai-je de quelque chose de pire que cela ? Le Feu — Allaah l''a promis à ceux qui ont commis le *kufr* — et quelle détestable destination (*biʾsa l-maṣīr*) ! »'
- ref: S.22:73
  ar: يَا أَيُّهَا النَّاسُ ضُرِبَ مَثَلٌ فَاسْتَمِعُوا لَهُ ۚ إِنَّ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللَّهِ لَنْ يَخْلُقُوا ذُبَابًا وَلَوِ اجْتَمَعُوا لَهُ ۖ وَإِنْ يَسْلُبْهُمُ الذُّبَابُ شَيْئًا لَا يَسْتَنْقِذُوهُ مِنْهُ ۚ ضَعُفَ الطَّالِبُ وَالْمَطْلُوبُ
  trl: Yā ayyuhā n-nāsu ḍuriba mathalun fa-stamiʿū lahu inna lladhīna tadʿūna min dūni llāhi lan yakhluqū dhubāban wa-law-i jtamaʿū lahu wa-in yaslubhumu dh-dhubābu shayʾan lā yastanqidhūhu minhu ḍaʿufa ṭ-ṭālibu wa-l-maṭlūb
  trad: 'Ô les humains, une parabole (*mathal*) a été frappée (*ḍuriba*) : écoutez-la. Ceux que vous invoquez en dehors d''Allaah ne créeront jamais (*lan yakhluqū*) une mouche (*dhubāb*), même s''ils s''unissaient tous pour cela — et si la mouche leur ravit (*yaslub*) quelque chose, ils ne pourraient le lui reprendre (*lā yastanqidhūhu*) : faible est celui qui cherche, et faible est celui qui est cherché (*ḍaʿufa ṭ-ṭālibu wa-l-maṭlūb*).'
- ref: S.22:74
  ar: مَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ ۗ إِنَّ اللَّهَ لَقَوِيٌّ عَزِيزٌ
  trl: Mā qadaru llāha ḥaqqa qadrihi inna llāha la-qawiyyun ʿazīz
  trad: Ils n'ont pas estimé Allaah à Sa juste mesure (*mā qadaru llāha ḥaqqa qadrihi*) — Allaah est certes *Qawiyy*, *ʿAzīz*.
- ref: S.22:75
  ar: اللَّهُ يَصْطَفِي مِنَ الْمَلَائِكَةِ رُسُلًا وَمِنَ النَّاسِ ۚ إِنَّ اللَّهَ سَمِيعٌ بَصِيرٌ
  trl: Allāhu yaṣṭafī mina l-malāʾikati rusulan wa-mina n-nāsi inna llāha samīʿun baṣīr
  trad: Allaah élit (*yaṣṭafī*) des messagers (*rusul*) parmi les *malāʾika*, et parmi les humains — Allaah est certes *Samīʿ*, *Baṣīr*.
- ref: S.22:76
  ar: يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۗ وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ
  trl: Yaʿlamu mā bayna aydīhim wa-mā khalfahum wa-ilā llāhi turjaʿu l-umūr
  trad: Ce qui sait ce qui est devant eux (*mā bayna aydīhim*) et ce qui est derrière eux (*mā khalfahum*) — et c'est vers Allaah que toute chose fait retour (*turjaʿu l-umūr*).
- ref: S.22:77
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ ۩
  trl: Yā ayyuhā lladhīna āmanu rkaʿū wa-sjudū wa-ʿbudū rabbakum wa-fʿalu l-khayra laʿallakum tufliḥūn
  trad: Ô vous qui avez cru, inclinez-vous (*irkaʿū*), prosternez-vous (*usjudū*), adorez votre *Rabb*, et faites le bien (*al-khayr*) — ainsi, peut-être, réussirez-vous (*tufliḥūn*).
- ref: S.22:78
  ar: وَجَاهِدُوا فِي اللَّهِ حَقَّ جِهَادِهِ ۚ هُوَ اجْتَبَاكُمْ وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ ۚ مِلَّةَ أَبِيكُمْ إِبْرَاهِيمَ ۚ هُوَ سَمَّاكُمُ الْمُسْلِمِينَ مِنْ قَبْلُ وَفِي هَٰذَا لِيَكُونَ الرَّسُولُ شَهِيدًا عَلَيْكُمْ وَتَكُونُوا شُهَدَاءَ عَلَى النَّاسِ ۚ فَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَاعْتَصِمُوا بِاللَّهِ هُوَ مَوْلَاكُمْ ۖ فَنِعْمَ الْمَوْلَىٰ وَنِعْمَ النَّصِيرُ
  trl: Wa-jāhidū fi llāhi ḥaqqa jihādihi huwa jtabākum wa-mā jaʿala ʿalaykum fi d-dīni min ḥarajin millata abīkum ibrāhīma huwa sammākumu l-muslimīna min qablu wa-fī hādhā li-yakūna r-rasūlu shahīdan ʿalaykum wa-takūnū shuhadāʾa ʿalā n-nāsi fa-aqīmu ṣ-ṣalāta wa-ātu z-zakāta wa-ʿtaṣimū bi-llāhi huwa mawlākum fa-niʿma l-mawlā wa-niʿma n-naṣīr
  trad: 'Et évertuez-vous (*jāhidū*) pour Allaah (*fi llāhi*) de la juste mesure de cet effort (*ḥaqqa jihādihi*) — c''est Lui qui vous a élus (*huwa jtabākum*), et Il n''a placé sur vous, dans le *dīn*, nulle gêne (*ḥaraj*) — la *milla* de votre père Ibrāhīm. C''est Lui qui vous a nommés *muslimūn*, auparavant (*min qablu*) et dans ceci [le Qurʾān] — afin que le *rasūl* soit témoin sur vous, et que vous soyez témoins sur les gens. Accomplissez donc la *ṣalāt*, acquittez-vous de la *zakāt*, et attachez-vous fermement à Allaah (*wa-ʿtaṣimū bi-llāhi*) : c''est Lui votre *mawlā* — quel excellent *mawlā*, et quel excellent secours (*fa-niʿma l-mawlā wa-niʿma n-naṣīr*) !'
