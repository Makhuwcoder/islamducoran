- ref: 'S.32:1-3'
  ar: 'الم ۝ تَنْزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِنْ رَبِّ الْعَالَمِينَ ۝ أَمْ يَقُولُونَ افْتَرَاهُ ۚ بَلْ هُوَ الْحَقُّ مِنْ رَبِّكَ لِتُنْذِرَ قَوْمًا مَا أَتَاهُمْ مِنْ نَذِيرٍ مِنْ قَبْلِكَ لَعَلَّهُمْ يَهْتَدُونَ'
  trl: 'Alif-Lām-Mīm — Tanzīlu l-kitābi lā rayba fīhi min rabbi l-ʿālamīn — Am yaqūlūna aftarāhu bal huwa l-ḥaqqu min rabbika li-tundhira qawman mā atāhum min nadhīrin min qablika laʿallahum yahtadūn'
  trad: 'Alif. Lām. Mīm. — La descente (tanzīl) du Kitāb — nul doute (rayb) en lui — venant du Rabb des mondes (al-ʿālamīn). — Ou bien disent-ils qu''il [le rasūl] l''a inventé (aftarāhu) ? Non — il est al-Ḥaqq, venant de ton Rabb, pour que tu avertisses (li-tundhira) un peuple à qui nul nadhīr n''est venu avant toi — peut-être seront-ils guidés (yahtadūn).'
- ref: 'S.32:4'
  ar: 'اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ ۖ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلَا شَفِيعٍ ۚ أَفَلَا تَتَذَكَّرُونَ'
  trl: 'Allāhu lladhī khalaqa s-samāwāti wa-l-arḑa wa-mā baynahumā fī sittati ayyāmin thumma-stawā ʿalā l-ʿarshi mā lakum min dūnihi min waliyyin wa-lā shafīʿin a-fa-lā tatadhakkarūn'
  trad: 'Allaah — Ce qui a créé les cieux et la terre, et ce qui est entre les deux, en six jours (sittati ayyāmin), puis a pris pleinement possession (istawā) du ʿArsh — vous n''avez, en dehors de Lui (min dūnihi), ni walī [protecteur] ni intercesseur (shafīʿ) — ne vous rappellerez-vous donc pas (a-fa-lā tatadhakkarūn) ?'
- ref: 'S.32:5'
  ar: 'يُدَبِّرُ الْأَمْرَ مِنَ السَّمَاءِ إِلَى الْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ'
  trl: 'Yudabbiru l-amra mina s-samāʾi ila l-arḑi thumma yaʿruju ilayhi fī yawmin kāna miqdāruhu alfa sanatin mimmā taʿuddūn'
  trad: 'Il administre l''affaire (yudabbiru l-amr) depuis le ciel vers la terre — puis elle [l''affaire] s''élève (yaʿruju) vers Lui, en un jour dont la mesure (miqdār) est de mille années (alfa sana) selon votre calcul (mimmā taʿuddūn).'
- ref: 'S.32:6'
  ar: 'ذَٰلِكَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Dhālika ʿālimu l-ghaybi wa-sh-shahādati l-ʿazīzu r-raḥīm'
  trad: 'Voilà [Celui qui vient d''être décrit] — ʿĀlim du ghayb et de la shahāda [ce qui échappe à la perception et ce qui est manifeste] — al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.32:7'
  ar: 'الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ ۖ وَبَدَأَ خَلْقَ الْإِنْسَانِ مِنْ طِينٍ'
  trl: 'Alladhī aḥsana kulla shayʾin khalaqahu wa-badaʾa khalqa l-insāni min ṭīn'
  trad: 'Ce qui a parfaitement accompli (aḥsana) toute chose qu''Il a créée, et qui a commencé (badaʾa) la création de l''humain à partir d''une argile (ṭīn).'
- ref: 'S.32:8'
  ar: 'ثُمَّ جَعَلَ نَسْلَهُ مِنْ سُلَالَةٍ مِنْ مَاءٍ مَهِينٍ'
  trl: 'Thumma jaʿala naslahu min sulālatin min māʾin mahīn'
  trad: 'Puis Il a fait sa descendance (naslahu) à partir d''une sulāla [une part extraite] d''une eau de peu de valeur (māʾin mahīn).'
- ref: 'S.32:9'
  ar: 'ثُمَّ سَوَّاهُ وَنَفَخَ فِيهِ مِنْ رُوحِهِ ۖ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۚ قَلِيلًا مَا تَشْكُرُونَ'
  trl: 'Thumma sawwāhu wa-nafakha fīhi min rūḥihi wa-jaʿala lakumu s-samʿa wa-l-abṣāra wa-l-afʾidata qalīlan mā tashkurūn'
  trad: 'Puis Il l''a mis en forme achevée (sawwāhu) et a insufflé en lui de Son rūḥ (min rūḥihi) — et Il vous a donné l''ouïe (as-samʿ), les regards (al-abṣār) et les afʾida — bien peu êtes-vous reconnaissants (qalīlan mā tashkurūn).'
- ref: 'S.32:10'
  ar: 'وَقَالُوا أَإِذَا ضَلَلْنَا فِي الْأَرْضِ أَإِنَّا لَفِي خَلْقٍ جَدِيدٍ ۚ بَلْ هُمْ بِلِقَاءِ رَبِّهِمْ كَافِرُونَ'
  trl: 'Wa-qālū a-idhā ḑalalnā fi l-arḑi a-innā la-fī khalqin jadīdin bal hum bi-liqāʾi rabbihim kāfirūn'
  trad: 'Et ils disent : « Quand nous serons perdus (ḑalalnā) dans la terre, serons-nous vraiment dans une création nouvelle (khalqin jadīd) ? » Non — ils rejettent (kāfirūn) la rencontre (liqāʾ) de leur Rabb.'
- ref: 'S.32:11'
  ar: '۞ قُلْ يَتَوَفَّاكُمْ مَلَكُ الْمَوْتِ الَّذِي وُكِّلَ بِكُمْ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ'
  trl: 'Qul yatawaffākum malaku l-mawti lladhī wukkila bikum thumma ilā rabbikum turjaʿūn'
  trad: 'Dis : « Le malak al-mawt, qui a été commis à votre égard (wukkila bikum), vous reprend pleinement (yatawaffākum) — puis c''est vers votre Rabb que vous serez ramenés. »'
- ref: 'S.32:12'
  ar: 'وَلَوْ تَرَىٰ إِذِ الْمُجْرِمُونَ نَاكِسُو رُءُوسِهِمْ عِنْدَ رَبِّهِمْ رَبَّنَا أَبْصَرْنَا وَسَمِعْنَا فَارْجِعْنَا نَعْمَلْ صَالِحًا إِنَّا مُوقِنُونَ'
  trl: 'Wa-law tarā idhi l-mujrimūna nākisū ruʾūsihim ʿinda rabbihim rabbanā abṣarnā wa-samiʿnā fa-rjiʿnā naʿmal ṣāliḥan innā mūqinūn'
  trad: 'Et si tu voyais les mujrimūn, têtes basses (nākisū ruʾūsihim) devant leur Rabb [disant] : « Notre Rabb, nous avons vu et entendu — fais-nous donc revenir (fa-rjiʿnā), nous accomplirons une œuvre droite — nous voilà désormais pleinement certains (mūqinūn) ! »'
- ref: 'S.32:13'
  ar: 'وَلَوْ شِئْنَا لَآتَيْنَا كُلَّ نَفْسٍ هُدَاهَا وَلَٰكِنْ حَقَّ الْقَوْلُ مِنِّي لَأَمْلَأَنَّ جَهَنَّمَ مِنَ الْجِنَّةِ وَالنَّاسِ أَجْمَعِينَ'
  trl: 'Wa-law shiʾnā la-ātaynā kulla nafsin hudāhā wa-lākin ḥaqqa l-qawlu minnī la-amlaʾanna jahannama mina l-jinnati wa-n-nāsi ajmaʿīn'
  trad: 'Et si Nous l''avions voulu, Nous aurions donné à chaque âme sa guidance (hudāhā) — mais la parole, venant de Moi, s''est accomplie (ḥaqqa l-qawl) : « J''emplirai certes Jahannam de jinn et d''humains, tous ensemble. »'
- ref: 'S.32:14'
  ar: 'فَذُوقُوا بِمَا نَسِيتُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا إِنَّا نَسِينَاكُمْ ۖ وَذُوقُوا عَذَابَ الْخُلْدِ بِمَا كُنْتُمْ تَعْمَلُونَ'
  trl: 'Fa-dhūqū bi-mā nasītum liqāʾa yawmikum hādhā innā nasīnākum wa-dhūqū ʿadhāba l-khuldi bi-mā kuntum taʿmalūn'
  trad: '« Goûtez donc, pour avoir oublié (nasītum) la rencontre de ce jour qui est le vôtre — Nous vous avons oubliés (nasīnākum) à Notre tour — et goûtez le châtiment de la perpétuité (al-khuld), pour ce que vous faisiez. »'
- ref: 'S.32:15'
  ar: 'إِنَّمَا يُؤْمِنُ بِآيَاتِنَا الَّذِينَ إِذَا ذُكِّرُوا بِهَا خَرُّوا سُجَّدًا وَسَبَّحُوا بِحَمْدِ رَبِّهِمْ وَهُمْ لَا يَسْتَكْبِرُونَ ۩'
  trl: 'Innamā yuʾminu bi-āyātinā lladhīna idhā dhukkirū bihā kharrū sujjadan wa-sabbaḥū bi-ḥamdi rabbihim wa-hum lā yastakbirūn'
  trad: 'Ne croient (yuʾmin) en Nos āyāt, en réalité, que ceux qui, lorsqu''on leur en fait rappel (dhukkirū bihā), tombent prosternés (kharrū sujjadan), et déclarent la pureté absolue (sabbaḥū) de leur Rabb en Lui rendant louange (bi-ḥamdihi), sans se montrer orgueilleux (lā yastakbirūn).'
- ref: 'S.32:16'
  ar: 'تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ'
  trl: 'Tatajāfā junūbuhum ʿani l-maḑājiʿi yadʿūna rabbahum khawfan wa-ṭamaʿan wa-mimmā razaqnāhum yunfiqūn'
  trad: 'Leurs flancs (junūb) s''écartent (tatajāfā) des lieux de couchage (al-maḑājiʿ) — ils invoquent leur Rabb par crainte (khawf) et par espoir (ṭamaʿ) — et de ce que Nous leur avons accordé comme rizq, ils dépensent (yunfiqūn).'
- ref: 'S.32:17'
  ar: 'فَلَا تَعْلَمُ نَفْسٌ مَا أُخْفِيَ لَهُمْ مِنْ قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونَ'
  trl: 'Fa-lā taʿlamu nafsun mā ukhfiya lahum min qurrati aʿyunin jazāʾan bi-mā kānū yaʿmalūn'
  trad: 'Nulle âme ne sait ce qui leur est caché (ukhfiya) comme fraîcheur des yeux (qurrati aʿyun) — rétribution (jazāʾ) pour ce qu''ils faisaient.'
- ref: 'S.32:18'
  ar: 'أَفَمَنْ كَانَ مُؤْمِنًا كَمَنْ كَانَ فَاسِقًا ۚ لَا يَسْتَوُونَ'
  trl: 'A-fa-man kāna muʾminan ka-man kāna fāsiqan lā yastawūn'
  trad: 'Celui qui est muʾmin est-il donc comme celui qui est fāsiq ? Ils ne sont pas égaux (lā yastawūn).'
- ref: 'S.32:19-20'
  ar: 'أَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ جَنَّاتُ الْمَأْوَىٰ نُزُلًا بِمَا كَانُوا يَعْمَلُونَ ۝ وَأَمَّا الَّذِينَ فَسَقُوا فَمَأْوَاهُمُ النَّارُ ۖ كُلَّمَا أَرَادُوا أَنْ يَخْرُجُوا مِنْهَا أُعِيدُوا فِيهَا وَقِيلَ لَهُمْ ذُوقُوا عَذَابَ النَّارِ الَّذِي كُنْتُمْ بِهِ تُكَذِّبُونَ'
  trl: 'Ammā lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti fa-lahum jannātu l-maʾwā nuzulan bi-mā kānū yaʿmalūn — Wa-ammā lladhīna fasaqū fa-maʾwāhumu n-nāru kullamā arādū an yakhrujū minhā uʿīdū fīhā wa-qīla lahum dhūqū ʿadhāba n-nāri lladhī kuntum bihi tukadhdhibūn'
  trad: 'Quant à ceux qui ont cru et accompli les œuvres droites — à eux les jardins du maʾwā [le refuge], en accueil (nuzul) pour ce qu''ils faisaient. — Et quant à ceux qui ont commis le fisq (fasaqū) — leur refuge (maʾwā) est le Feu : chaque fois qu''ils voudront en sortir, ils y seront ramenés (uʿīdū), et il leur sera dit : « Goûtez le châtiment du Feu que vous traitiez de mensonge (tukadhdhibūn). »'
- ref: 'S.32:21'
  ar: 'وَلَنُذِيقَنَّهُمْ مِنَ الْعَذَابِ الْأَدْنَىٰ دُونَ الْعَذَابِ الْأَكْبَرِ لَعَلَّهُمْ يَرْجِعُونَ'
  trl: 'Wa-la-nudhīqannahum mina l-ʿadhābi l-adnā dūna l-ʿadhābi l-akbari laʿallahum yarjiʿūn'
  trad: 'Et Nous leur ferons certainement goûter du châtiment le plus proche (al-ʿadhāb al-adnā), en deçà du châtiment le plus grand (al-ʿadhāb al-akbar) — peut-être reviendront-ils (yarjiʿūn).'
- ref: 'S.32:22'
  ar: 'وَمَنْ أَظْلَمُ مِمَّنْ ذُكِّرَ بِآيَاتِ رَبِّهِ ثُمَّ أَعْرَضَ عَنْهَا ۚ إِنَّا مِنَ الْمُجْرِمِينَ مُنْتَقِمُونَ'
  trl: 'Wa-man aẕlamu mimman dhukkira bi-āyāti rabbihi thumma aʿraḑa ʿanhā innā mina l-mujrimīna muntaqimūn'
  trad: 'Et qui est plus injuste (aẕlamu) que celui à qui on a rappelé les āyāt de son Rabb, et qui ensuite s''en est détourné (aʿraḑa ʿanhā) ? Nous sommes certes, envers les mujrimūn, Ce qui se venge pleinement (muntaqimūn).'
- ref: 'S.32:23'
  ar: 'وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ فَلَا تَكُنْ فِي مِرْيَةٍ مِنْ لِقَائِهِ ۖ وَجَعَلْنَاهُ هُدًى لِبَنِي إِسْرَائِيلَ'
  trl: 'Wa-la-qad ātaynā mūsā l-kitāba fa-lā takun fī miryatin min liqāʾihi wa-jaʿalnāhu hudan li-banī isrāʾīl'
  trad: 'Et Nous avons certes donné à Mūsā le Kitāb — ne sois donc pas dans le doute (mirya) à son sujet (min liqāʾihi) — et Nous l''avons fait guidance (hudā) pour les Banī Isrāʾīl.'
- ref: 'S.32:24'
  ar: 'وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُوا ۖ وَكَانُوا بِآيَاتِنَا يُوقِنُونَ'
  trl: 'Wa-jaʿalnā minhum aʾimmatan yahdūna bi-amrinā lammā ṣabarū wa-kānū bi-āyātinā yūqinūn'
  trad: 'Et Nous avons fait d''eux des imams (aʾimma) qui guident par Notre amr, parce qu''ils ont enduré (lammā ṣabarū) — et ils avaient, de Nos āyāt, la certitude (yūqinūn).'
- ref: 'S.32:25'
  ar: 'إِنَّ رَبَّكَ هُوَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ'
  trl: 'Inna rabbaka huwa yafṣilu baynahum yawma l-qiyāmati fīmā kānū fīhi yakhtalifūn'
  trad: 'Ton Rabb, c''est Lui qui tranche (yafṣilu) entre eux, au Jour de la Résurrection, sur ce en quoi ils étaient en désaccord (yakhtalifūn).'
- ref: 'S.32:26'
  ar: 'أَوَلَمْ يَهْدِ لَهُمْ كَمْ أَهْلَكْنَا مِنْ قَبْلِهِمْ مِنَ الْقُرُونِ يَمْشُونَ فِي مَسَاكِنِهِمْ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ ۖ أَفَلَا يَسْمَعُونَ'
  trl: 'A-wa-lam yahdi lahum kam ahlaknā min qablihim mina l-qurūni yamshūna fī masākinihim inna fī dhālika la-āyātin a-fa-lā yasmaʿūn'
  trad: 'Cela ne les a-t-il donc pas guidés (a-wa-lam yahdi lahum), [de voir] combien Nous avons détruit, avant eux, de générations (al-qurūn), dans les demeures desquelles ils marchent eux-mêmes ? Il y a certes là des āyāt — n''entendent-ils donc pas (a-fa-lā yasmaʿūn) ?'
- ref: 'S.32:27'
  ar: 'أَوَلَمْ يَرَوْا أَنَّا نَسُوقُ الْمَاءَ إِلَى الْأَرْضِ الْجُرُزِ فَنُخْرِجُ بِهِ زَرْعًا تَأْكُلُ مِنْهُ أَنْعَامُهُمْ وَأَنْفُسُهُمْ ۖ أَفَلَا يُبْصِرُونَ'
  trl: 'A-wa-lam yarawu annā nasūqu l-māʾa ila l-arḑi l-juruzi fa-nukhriju bihi zarʿan taʾkulu minhu anʿāmuhum wa-anfusuhum a-fa-lā yubṣirūn'
  trad: 'Ne voient-ils donc pas que Nous menons (nasūqu) l''eau vers la terre aride et nue (al-arḑi l-juruz), et qu''il en sort, par elle, une culture (zarʿ) dont se nourrissent leur bétail et eux-mêmes ? Ne voient-ils donc pas (a-fa-lā yubṣirūn) ?'
- ref: 'S.32:28-30'
  ar: 'وَيَقُولُونَ مَتَىٰ هَٰذَا الْفَتْحُ إِنْ كُنْتُمْ صَادِقِينَ ۝ قُلْ يَوْمَ الْفَتْحِ لَا يَنْفَعُ الَّذِينَ كَفَرُوا إِيمَانُهُمْ وَلَا هُمْ يُنْظَرُونَ ۝ فَأَعْرِضْ عَنْهُمْ وَانْتَظِرْ إِنَّهُمْ مُنْتَظِرُونَ'
  trl: 'Wa-yaqūlūna matā hādhā l-fatḥu in kuntum ṣādiqīn — Qul yawma l-fatḥi lā yanfaʿu lladhīna kafarū īmānuhum wa-lā hum yunẕarūn — Fa-aʿriḑ ʿanhum wa-ntaẕir innahum muntaẕirūn'
  trad: 'Et ils disent : « Quand [viendra] cette ouverture (al-fatḥ), si vous êtes véridiques ? » — Dis : « Le jour de l''ouverture, il ne profitera (lā yanfaʿu) à ceux qui ont rejeté [les āyāt] d''avoir la foi (īmānuhum), et il ne leur sera accordé aucun délai (lā hum yunẕarūn). » — Détourne-toi donc d''eux (fa-aʿriḑ ʿanhum), et attends (wa-ntaẕir) — ils attendent, eux aussi (muntaẕirūn).'
