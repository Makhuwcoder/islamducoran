- ref: 'S.28:1–2'
  ar: 'طسم ۝ تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ'
  trl: 'Ṭā-Sīn-Mīm — tilka āyātu l-kitābi l-mubīn'
  trad: 'Ṭā. Sīn. Mīm. Voilà les āyāt d''un Kitāb manifeste (al-mubīn).'
- ref: 'S.28:3'
  ar: 'نَتْلُو عَلَيْكَ مِنْ نَبَإِ مُوسَىٰ وَفِرْعَوْنَ بِالْحَقِّ لِقَوْمٍ يُؤْمِنُونَ'
  trl: 'Natlū ʿalayka min nabaʾi mūsā wa-firʿawna bi-l-ḥaqqi li-qawmin yuʾminūn'
  trad: 'Nous te récitons (natlū), de l''histoire (nabaʾ) de Mūsā et de Firʿawn, par le ḥaqq, pour un peuple qui croit.'
- ref: 'S.28:4'
  ar: 'إِنَّ فِرْعَوْنَ عَلَا فِي الْأَرْضِ وَجَعَلَ أَهْلَهَا شِيَعًا يَسْتَضْعِفُ طَائِفَةً مِنْهُمْ يُذَبِّحُ أَبْنَاءَهُمْ وَيَسْتَحْيِي نِسَاءَهُمْ ۚ إِنَّهُ كَانَ مِنَ الْمُفْسِدِينَ'
  trl: 'Inna firʿawna ʿalā fi l-arḍi wa-jaʿala ahlahā shiyaʿan yastaḍʿifu ṭāʾifatan minhum yudhabbiḥu abnāʾahum wa-yastaḥyī nisāʾahum — innahu kāna mina l-mufsidīn'
  trad: 'Firʿawn s''est certes élevé avec démesure (ʿalā) sur la terre, et il fit de ses habitants des factions (shiyaʿan) — il maintenait dans la faiblesse (yastaḍʿifu) une partie d''entre eux, égorgeant (yudhabbiḥu) leurs fils et laissant vivre leurs femmes : il était certes de ceux qui sèment le trouble (al-mufsidīn).'
- ref: 'S.28:5–6'
  ar: 'وَنُرِيدُ أَنْ نَمُنَّ عَلَى الَّذِينَ اسْتُضْعِفُوا فِي الْأَرْضِ وَنَجْعَلَهُمْ أَئِمَّةً وَنَجْعَلَهُمُ الْوَارِثِينَ ۝ وَنُمَكِّنَ لَهُمْ فِي الْأَرْضِ وَنُرِيَ فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا مِنْهُمْ مَا كَانُوا يَحْذَرُونَ'
  trl: 'Wa-nurīdu an namunna ʿalā lladhīna stuḍʿifū fi l-arḍi wa-najʿalahum aʾimmatan wa-najʿalahumu l-wārithīn — wa-numakkina lahum fi l-arḍi wa-nuriya firʿawna wa-hāmāna wa-junūdahumā minhum mā kānū yaḥdharūn'
  trad: 'Et Nous voulons combler d''un bienfait (an namunna) ceux qui ont été maintenus dans la faiblesse sur la terre, faire d''eux des aʾimma [ceux qu''on suit, en tête] et faire d''eux les héritiers (al-wārithīn) — les affermir (numakkina) sur la terre, et faire voir à Firʿawn, à Hāmān et à leurs armées, par eux, ce qu''ils redoutaient (yaḥdharūn).'
- ref: 'S.28:7'
  ar: 'وَأَوْحَيْنَا إِلَىٰ أُمِّ مُوسَىٰ أَنْ أَرْضِعِيهِ ۖ فَإِذَا خِفْتِ عَلَيْهِ فَأَلْقِيهِ فِي الْيَمِّ وَلَا تَخَافِي وَلَا تَحْزَنِي ۖ إِنَّا رَادُّوهُ إِلَيْكِ وَجَاعِلُوهُ مِنَ الْمُرْسَلِينَ'
  trl: 'Wa-awḥaynā ilā ummi mūsā an arḍiʿīhi — fa-idhā khifti ʿalayhi fa-alqīhi fi l-yammi wa-lā takhāfī wa-lā taḥzanī — innā rāddūhu ilayki wa-jāʿilūhu mina l-mursalīn'
  trad: 'Et Nous avons inspiré (awḥaynā) à la mère de Mūsā : « Allaite-le (arḍiʿīhi) ; puis, quand tu craindras pour lui, jette-le (alqīhi) dans le yamm — et ne crains rien, et ne t''afflige pas : Nous te le rendrons (rāddūhu) certainement, et Nous ferons de lui l''un des mursalīn. »'
- ref: 'S.28:8'
  ar: 'فَالْتَقَطَهُ آلُ فِرْعَوْنَ لِيَكُونَ لَهُمْ عَدُوًّا وَحَزَنًا ۗ إِنَّ فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا كَانُوا خَاطِئِينَ'
  trl: 'Fa-ltaqaṭahu ālu firʿawna li-yakūna lahum ʿaduwwan wa-ḥazanan — inna firʿawna wa-hāmāna wa-junūdahumā kānū khāṭiʾīn'
  trad: 'La maison de Firʿawn (āl firʿawn) le recueillit (fa-ltaqaṭahu), pour qu''il devienne pour eux un ennemi et un sujet d''affliction (ḥazanan) — Firʿawn, Hāmān et leurs armées étaient certes fautifs (khāṭiʾīn).'
- ref: 'S.28:9'
  ar: 'وَقَالَتِ امْرَأَتُ فِرْعَوْنَ قُرَّتُ عَيْنٍ لِي وَلَكَ ۖ لَا تَقْتُلُوهُ عَسَىٰ أَنْ يَنْفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا وَهُمْ لَا يَشْعُرُونَ'
  trl: 'Wa-qālati mraʾatu firʿawna qurratu ʿaynin lī wa-laka — lā taqtulūhu ʿasā an yanfaʿanā aw nattakhidhahu waladan wa-hum lā yashʿurūn'
  trad: 'La femme de Firʿawn dit : « [Voici] un apaisement du regard (qurratu ʿaynin) pour moi et pour toi — ne le tuez pas ; peut-être nous sera-t-il utile, ou le prendrons-nous comme walad [enfant adopté] » — sans qu''ils en aient conscience (wa-hum lā yashʿurūn).'
- ref: 'S.28:10'
  ar: 'وَأَصْبَحَ فُؤَادُ أُمِّ مُوسَىٰ فَارِغًا ۖ إِنْ كَادَتْ لَتُبْدِي بِهِ لَوْلَا أَنْ رَبَطْنَا عَلَىٰ قَلْبِهَا لِتَكُونَ مِنَ الْمُؤْمِنِينَ'
  trl: 'Wa-aṣbaḥa fuʾādu ummi mūsā fārighan — in kādat la-tubdī bihi lawlā an rabaṭnā ʿalā qalbihā li-takūna mina l-muʾminīn'
  trad: 'Et le fuʾād [le siège intérieur du ressenti] de la mère de Mūsā devint vide (fārighan) — elle fut certes sur le point de le révéler (tubdī bihi), si Nous n''avions pas affermi (rabaṭnā) son qalb, pour qu''elle soit du nombre des muʾminīn.'
- ref: 'S.28:11'
  ar: 'وَقَالَتْ لِأُخْتِهِ قُصِّيهِ ۖ فَبَصُرَتْ بِهِ عَنْ جُنُبٍ وَهُمْ لَا يَشْعُرُونَ'
  trl: 'Wa-qālat li-ukhtihi quṣṣīhi — fa-baṣurat bihi ʿan junubin wa-hum lā yashʿurūn'
  trad: 'Elle dit à sa sœur : « Suis sa trace (quṣṣīhi) » — et elle l''aperçut de loin (ʿan junubin), sans qu''ils en aient conscience.'
- ref: 'S.28:12'
  ar: 'وَحَرَّمْنَا عَلَيْهِ الْمَرَاضِعَ مِنْ قَبْلُ فَقَالَتْ هَلْ أَدُلُّكُمْ عَلَىٰ أَهْلِ بَيْتٍ يَكْفُلُونَهُ لَكُمْ وَهُمْ لَهُ نَاصِحُونَ'
  trl: 'Wa-ḥarramnā ʿalayhi l-marāḍiʿa min qablu fa-qālat hal adullukum ʿalā ahli baytin yakfulūnahu lakum wa-hum lahu nāṣiḥūn'
  trad: 'Et Nous lui avions, auparavant, interdit (ḥarramnā) les nourrices (al-marāḍiʿ) — elle [la sœur] dit : « Puis-je vous indiquer une maisonnée (ahl bayt) qui se chargera de lui pour vous, et qui lui sera sincèrement dévouée (nāṣiḥūn) ? »'
- ref: 'S.28:13'
  ar: 'فَرَدَدْنَاهُ إِلَىٰ أُمِّهِ كَيْ تَقَرَّ عَيْنُهَا وَلَا تَحْزَنَ وَلِتَعْلَمَ أَنَّ وَعْدَ اللَّهِ حَقٌّ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ'
  trl: 'Fa-radadnāhu ilā ummihi kay taqarra ʿaynuhā wa-lā taḥzana wa-li-taʿlama anna waʿda llāhi ḥaqqun wa-lākinna aktharahum lā yaʿlamūn'
  trad: 'Ainsi Nous l''avons rendu à sa mère, pour que son regard s''apaise (taqarra ʿaynuhā) et qu''elle ne s''afflige pas, et pour qu''elle sache que la promesse (waʿd) d''Allaah est ḥaqq — mais la plupart d''entre eux ne savent pas.'
- ref: 'S.28:14'
  ar: 'وَلَمَّا بَلَغَ أَشُدَّهُ وَاسْتَوَىٰ آتَيْنَاهُ حُكْمًا وَعِلْمًا ۚ وَكَذَٰلِكَ نَجْزِي الْمُحْسِنِينَ'
  trl: 'Wa-lammā balagha ashuddahu wa-stawā ātaynāhu ḥukman wa-ʿilman — wa-kadhālika najzī l-muḥsinīn'
  trad: 'Et quand il eut atteint sa pleine maturité (ashuddahu) et se fut pleinement développé (wa-stawā), Nous lui avons donné un ḥukm et un ʿilm — ainsi rétribuons-Nous les muḥsinūn.'
- ref: 'S.28:15'
  ar: 'وَدَخَلَ الْمَدِينَةَ عَلَىٰ حِينِ غَفْلَةٍ مِنْ أَهْلِهَا فَوَجَدَ فِيهَا رَجُلَيْنِ يَقْتَتِلَانِ هَٰذَا مِنْ شِيعَتِهِ وَهَٰذَا مِنْ عَدُوِّهِ ۖ فَاسْتَغَاثَهُ الَّذِي مِنْ شِيعَتِهِ عَلَى الَّذِي مِنْ عَدُوِّهِ فَوَكَزَهُ مُوسَىٰ فَقَضَىٰ عَلَيْهِ ۖ قَالَ هَٰذَا مِنْ عَمَلِ الشَّيْطَانِ ۖ إِنَّهُ عَدُوٌّ مُضِلٌّ مُبِينٌ'
  trl: 'Wa-dakhala l-madīnata ʿalā ḥīni ghaflatin min ahlihā fa-wajada fīhā rajulayni yaqtatilāni hādhā min shīʿatihi wa-hādhā min ʿaduwwihi — fa-staghāthahu lladhī min shīʿatihi ʿalā lladhī min ʿaduwwihi fa-wakazahu mūsā fa-qaḍā ʿalayhi — qāla hādhā min ʿamali sh-shayṭāni — innahu ʿaduwwun muḍillun mubīn'
  trad: 'Il entra dans la ville à un moment d''inattention (ghafla) de ses habitants, et y trouva deux hommes qui se battaient (yaqtatilāni) — celui-ci de son propre shīʿa [clan], celui-là de son ennemi (ʿaduwwihi). Celui de son clan appela son secours (fa-staghāthahu) contre celui de son ennemi, et Mūsā le frappa d''un coup (wakazahu) — et il en mourut (fa-qaḍā ʿalayhi). Il dit : « Ceci relève de l''œuvre du shayṭān — il est un ennemi qui égare (muḍill), manifeste. »'
- ref: 'S.28:16'
  ar: 'قَالَ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي فَغَفَرَ لَهُ ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ'
  trl: 'Qāla rabbi innī ẓalamtu nafsī fa-ghfir lī fa-ghafara lahu — innahu huwa l-ghafūru r-raḥīm'
  trad: 'Il dit : « Mon Rabb, je me suis fait tort à moi-même (ẓalamtu nafsī) — pardonne-moi » — et Il lui pardonna ; c''est Lui, al-Ghafūr, ar-Raḥīm.'
- ref: 'S.28:17'
  ar: 'قَالَ رَبِّ بِمَا أَنْعَمْتَ عَلَيَّ فَلَنْ أَكُونَ ظَهِيرًا لِلْمُجْرِمِينَ'
  trl: 'Qāla rabbi bimā anʿamta ʿalayya fa-lan akūna ẓahīran li-l-mujrimīn'
  trad: 'Il dit : « Mon Rabb, par le bienfait que Tu m''as accordé, jamais plus je ne serai un soutien (ẓahīran) pour les mujrimūn. »'
- ref: 'S.28:18'
  ar: 'فَأَصْبَحَ فِي الْمَدِينَةِ خَائِفًا يَتَرَقَّبُ فَإِذَا الَّذِي اسْتَنْصَرَهُ بِالْأَمْسِ يَسْتَصْرِخُهُ ۚ قَالَ لَهُ مُوسَىٰ إِنَّكَ لَغَوِيٌّ مُبِينٌ'
  trl: 'Fa-aṣbaḥa fi l-madīnati khāʾifan yataraqqabu fa-idhā lladhī stanṣarahu bi-l-amsi yastaṣrikhuhu — qāla lahu mūsā innaka la-ghawiyyun mubīn'
  trad: 'Il se retrouva dans la ville, craintif, surveillant [les alentours] (yataraqqabu) — et voici que celui qui avait demandé son secours la veille (bi-l-amsi) l''appelait de nouveau à grands cris (yastaṣrikhuhu). Mūsā lui dit : « Tu es certes quelqu''un qui s''égare (ghawiyy) de façon manifeste. »'
- ref: 'S.28:19'
  ar: 'فَلَمَّا أَنْ أَرَادَ أَنْ يَبْطِشَ بِالَّذِي هُوَ عَدُوٌّ لَهُمَا قَالَ يَا مُوسَىٰ أَتُرِيدُ أَنْ تَقْتُلَنِي كَمَا قَتَلْتَ نَفْسًا بِالْأَمْسِ ۖ إِنْ تُرِيدُ إِلَّا أَنْ تَكُونَ جَبَّارًا فِي الْأَرْضِ وَمَا تُرِيدُ أَنْ تَكُونَ مِنَ الْمُصْلِحِينَ'
  trl: 'Fa-lammā an arāda an yabṭisha bi-lladhī huwa ʿaduwwun lahumā qāla yā mūsā a-turīdu an taqtulanī kamā qatalta nafsan bi-l-amsi — in turīdu illā an takūna jabbāran fi l-arḍi wa-mā turīdu an takūna mina l-muṣliḥīn'
  trad: 'Puis, quand il voulut s''en saisir violemment (yabṭisha) contre celui qui était leur ennemi commun, celui-ci dit : « Ô Mūsā, veux-tu me tuer (taqtulanī) comme tu as tué une âme hier (bi-l-amsi) ? Tu ne veux rien d''autre que d''être un jabbār sur la terre, et tu ne veux pas être du nombre des muṣliḥīn. »'
- ref: 'S.28:20'
  ar: 'وَجَاءَ رَجُلٌ مِنْ أَقْصَى الْمَدِينَةِ يَسْعَىٰ قَالَ يَا مُوسَىٰ إِنَّ الْمَلَأَ يَأْتَمِرُونَ بِكَ لِيَقْتُلُوكَ فَاخْرُجْ إِنِّي لَكَ مِنَ النَّاصِحِينَ'
  trl: 'Wa-jāʾa rajulun min aqṣā l-madīnati yasʿā qāla yā mūsā inna l-malaʾa yaʾtamirūna bika li-yaqtulūka fa-khruj innī laka mina n-nāṣiḥīn'
  trad: 'Un homme vint de l''extrémité de la ville, en hâte (yasʿā), et dit : « Ô Mūsā, l''assemblée (al-malaʾ) délibère à ton sujet (yaʾtamirūna bika) pour te tuer — sors donc ; je suis certes, pour toi, du nombre de ceux qui te conseillent sincèrement (an-nāṣiḥīn). »'
- ref: 'S.28:21'
  ar: 'فَخَرَجَ مِنْهَا خَائِفًا يَتَرَقَّبُ ۖ قَالَ رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ'
  trl: 'Fa-kharaja minhā khāʾifan yataraqqabu — qāla rabbi najjinī mina l-qawmi ẕ-ẕālimīn'
  trad: 'Il en sortit, craintif, surveillant [les alentours] (yataraqqabu), et dit : « Mon Rabb, sauve-moi (najjinī) du peuple injuste (aẕ-ẕālimīn). »'
- ref: 'S.28:22'
  ar: 'وَلَمَّا تَوَجَّهَ تِلْقَاءَ مَدْيَنَ قَالَ عَسَىٰ رَبِّي أَنْ يَهْدِيَنِي سَوَاءَ السَّبِيلِ'
  trl: 'Wa-lammā tawajjaha tilqāʾa madyana qāla ʿasā rabbī an yahdiyanī sawāʾa s-sabīl'
  trad: 'Et lorsqu''il se dirigea (tawajjaha) vers Madyan (tilqāʾa madyana), il dit : « Peut-être mon Rabb me guidera-t-Il vers le droit chemin (sawāʾa s-sabīl). »'
- ref: 'S.28:23'
  ar: 'وَلَمَّا وَرَدَ مَاءَ مَدْيَنَ وَجَدَ عَلَيْهِ أُمَّةً مِنَ النَّاسِ يَسْقُونَ وَوَجَدَ مِنْ دُونِهِمُ امْرَأَتَيْنِ تَذُودَانِ ۖ قَالَ مَا خَطْبُكُمَا ۖ قَالَتَا لَا نَسْقِي حَتَّىٰ يُصْدِرَ الرِّعَاءُ ۖ وَأَبُونَا شَيْخٌ كَبِيرٌ'
  trl: 'Wa-lammā warada māʾa madyana wajada ʿalayhi ummatan mina n-nāsi yasqūna wa-wajada min dūnihimu mraʾatayni tadhūdāni qāla mā khaṭbukumā qālatā lā nasqī ḥattā yuṣdira r-riʿāʾu wa-abūnā shaykhun kabīr'
  trad: 'Et lorsqu''il parvint au point d''eau de Madyan, il y trouva un groupe de gens (ummatan mina n-nās) faisant boire [leurs bêtes], et il trouva, en retrait d''eux, deux femmes qui retenaient [les leurs] (tadhūdāni). Il dit : « Quelle est donc votre affaire (mā khaṭbukumā) ? » Elles dirent : « Nous ne faisons boire qu''une fois que les bergers (ar-riʿāʾ) se seront retirés (yuṣdira) — et notre père est un vieillard très âgé (shaykhun kabīr). »'
- ref: 'S.28:24'
  ar: 'فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ'
  trl: 'Fa-saqā lahumā thumma tawallā ila ẕ-ẕilli fa-qāla rabbi innī li-mā anzalta ilayya min khayrin faqīr'
  trad: 'Il abreuva donc leurs bêtes pour elles (fa-saqā lahumā), puis se retira vers l''ombre (tawallā ila ẕ-ẕill), et dit : « Mon Rabb, pour tout bien que Tu ferais descendre vers moi, je suis dans le besoin (faqīr). »'
- ref: 'S.28:25'
  ar: 'فَجَاءَتْهُ إِحْدَاهُمَا تَمْشِي عَلَى اسْتِحْيَاءٍ قَالَتْ إِنَّ أَبِي يَدْعُوكَ لِيَجْزِيَكَ أَجْرَ مَا سَقَيْتَ لَنَا ۚ فَلَمَّا جَاءَهُ وَقَصَّ عَلَيْهِ الْقَصَصَ قَالَ لَا تَخَفْ ۖ نَجَوْتَ مِنَ الْقَوْمِ الظَّالِمِينَ'
  trl: 'Fa-jāʾathu iḥdāhumā tamshī ʿalā stiḥyāʾin qālat inna abī yadʿūka li-yajziyaka ajra mā saqayta lanā fa-lammā jāʾahu wa-qaṣṣa ʿalayhi l-qaṣaṣa qāla lā takhaf najawta mina l-qawmi ẕ-ẕālimīn'
  trad: 'L''une des deux femmes vint alors à lui, marchant avec une pudeur retenue (tamshī ʿalā stiḥyāʾin) ; elle dit : « Mon père t''appelle, pour te rétribuer le prix (ajr) de ce que tu as fait boire pour nous. » Puis, lorsqu''il vint à lui et lui raconta le récit (qaṣṣa ʿalayhi l-qaṣaṣa), il [le père] dit : « Ne crains rien — tu as échappé au peuple injuste. »'
- ref: 'S.28:26'
  ar: 'قَالَتْ إِحْدَاهُمَا يَا أَبَتِ اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ'
  trl: 'Qālat iḥdāhumā yā abati staʾjirhu inna khayra mani staʾjarta l-qawiyyu l-amīn'
  trad: 'L''une des deux dit : « Ô mon père, embauche-le (staʾjirhu) — le meilleur à embaucher est certes celui qui est fort et digne de confiance (al-qawiyyu l-amīn). »'
- ref: 'S.28:27'
  ar: 'قَالَ إِنِّي أُرِيدُ أَنْ أُنْكِحَكَ إِحْدَى ابْنَتَيَّ هَاتَيْنِ عَلَىٰ أَنْ تَأْجُرَنِي ثَمَانِيَ حِجَجٍ ۖ فَإِنْ أَتْمَمْتَ عَشْرًا فَمِنْ عِنْدِكَ ۖ وَمَا أُرِيدُ أَنْ أَشُقَّ عَلَيْكَ ۚ سَتَجِدُنِي إِنْ شَاءَ اللَّهُ مِنَ الصَّالِحِينَ'
  trl: 'Qāla innī urīdu an unkiḥaka iḥdā btanatayya hātayni ʿalā an taʾjuranī thamāniya ḥijajin fa-in atmamta ʿashran fa-min ʿindika wa-mā urīdu an ashuqqa ʿalayka sa-tajidunī in shāʾa llāhu mina ṣ-ṣāliḥīn'
  trad: 'Il dit : « Je veux te marier (unkiḥaka) à l''une de ces deux filles qui sont les miennes, à condition que tu me serves (taʾjuranī) huit années (thamāniya ḥijajin) ; et si tu en accomplis dix, cela viendra de toi (fa-min ʿindika) — je ne veux rien t''imposer de pénible (an ashuqqa ʿalayka). Tu me trouveras, si Allaah le veut, du nombre des gens droits (aṣ-ṣāliḥīn). »'
- ref: 'S.28:28'
  ar: 'قَالَ ذَٰلِكَ بَيْنِي وَبَيْنَكَ ۖ أَيَّمَا الْأَجَلَيْنِ قَضَيْتُ فَلَا عُدْوَانَ عَلَيَّ ۖ وَاللَّهُ عَلَىٰ مَا نَقُولُ وَكِيلٌ'
  trl: 'Qāla dhālika baynī wa-baynaka ayyamā l-ajalayni qaḍaytu falā ʿudwāna ʿalayya wa-llāhu ʿalā mā naqūlu wakīl'
  trad: 'Il [Mūsā] dit : « Que cela soit entre toi et moi — quel que soit celui des deux termes (al-ajalayni) que j''accomplisse (qaḍaytu), qu''aucun tort ne me soit fait (falā ʿudwāna ʿalayya) ; et Allaah est garant (wakīl) de ce que nous disons. »'
- ref: 'S.28:29'
  ar: '۞ فَلَمَّا قَضَىٰ مُوسَى الْأَجَلَ وَسَارَ بِأَهْلِهِ آنَسَ مِنْ جَانِبِ الطُّورِ نَارًا قَالَ لِأَهْلِهِ امْكُثُوا إِنِّي آنَسْتُ نَارًا لَعَلِّي آتِيكُمْ مِنْهَا بِخَبَرٍ أَوْ جَذْوَةٍ مِنَ النَّارِ لَعَلَّكُمْ تَصْطَلُونَ'
  trl: 'Fa-lammā qaḍā mūsā l-ajala wa-sāra bi-ahlihi ānasa min jānibi ṭ-ṭūri nāran qāla li-ahlihi mkuthū innī ānastu nāran laʿallī ātīkum minhā bi-khabarin aw jadhwatin mina n-nāri laʿallakum taṣṭalūn'
  trad: 'Puis, lorsque Mūsā eut accompli le terme et qu''il partit avec sa famille (sāra bi-ahlihi), il perçut distinctement (ānasa) un feu du côté du Ṭūr (jānibi ṭ-ṭūr). Il dit aux siens : « Demeurez [ici] — j''ai distinctement perçu un feu ; peut-être vous en apporterai-je une nouvelle, ou un tison du feu (jadhwatin mina n-nāri), afin que vous vous réchauffiez. »'
- ref: 'S.28:30'
  ar: 'فَلَمَّا أَتَاهَا نُودِيَ مِنْ شَاطِئِ الْوَادِ الْأَيْمَنِ فِي الْبُقْعَةِ الْمُبَارَكَةِ مِنَ الشَّجَرَةِ أَنْ يَا مُوسَىٰ إِنِّي أَنَا اللَّهُ رَبُّ الْعَالَمِينَ'
  trl: 'Fa-lammā atāhā nūdiya min shāṭiʾi l-wādi l-aymani fi l-buqʿati l-mubārakati mina sh-shajarati an yā mūsā innī anā llāhu rabbu l-ʿālamīn'
  trad: 'Puis, lorsqu''il y parvint, il fut appelé (nūdiya), depuis le flanc droit de la vallée (min shāṭiʾi l-wādi l-aymani), dans le lieu béni (fi l-buqʿati l-mubārakati), depuis l''arbre (mina sh-shajarati) : « Ô Mūsā, c''est Moi, en vérité — Allaah, Rabb des ʿālamīn. »'
- ref: 'S.28:31'
  ar: 'وَأَنْ أَلْقِ عَصَاكَ ۖ فَلَمَّا رَآهَا تَهْتَزُّ كَأَنَّهَا جَانٌّ وَلَّىٰ مُدْبِرًا وَلَمْ يُعَقِّبْ ۚ يَا مُوسَىٰ أَقْبِلْ وَلَا تَخَفْ ۖ إِنَّكَ مِنَ الْآمِنِينَ'
  trl: 'Wa-an alqi ʿaṣāka fa-lammā raʾāhā tahtazzu ka-annahā jānnun wallā mudbiran wa-lam yuʿaqqib yā mūsā aqbil wa-lā takhaf innaka mina l-āminīn'
  trad: '« Et jette ton bâton (ʿaṣāka). » Puis, quand il le vit s''agiter (tahtazzu) comme s''il était un jānn, il tourna le dos en fuyant (wallā mudbiran) et ne revint pas sur ses pas (lam yuʿaqqib). « Ô Mūsā, avance (aqbil), et ne crains rien : tu es certes du nombre de ceux qui sont en sécurité (al-āminīn). »'
- ref: 'S.28:32'
  ar: 'اسْلُكْ يَدَكَ فِي جَيْبِكَ تَخْرُجْ بَيْضَاءَ مِنْ غَيْرِ سُوءٍ وَاضْمُمْ إِلَيْكَ جَنَاحَكَ مِنَ الرَّهْبِ ۖ فَذَانِكَ بُرْهَانَانِ مِنْ رَبِّكَ إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ ۚ إِنَّهُمْ كَانُوا قَوْمًا فَاسِقِينَ'
  trl: 'Usluk yadaka fī jaybika takhruj bayḍāʾa min ghayri sūʾin wa-ḍmum ilayka janāḥaka mina r-rahbi fa-dhānika burhānāni min rabbika ilā firʿawna wa-malaʾihi innahum kānū qawman fāsiqīn'
  trad: '« Introduis ta main dans l''ouverture de ton vêtement (jaybika) : elle en sortira blanche, sans mal aucun. Et serre contre toi ton bras (janāḥaka), pour te délivrer de la frayeur (mina r-rahbi) — voilà deux preuves (burhānāni) venant de ton Rabb, pour Firʿawn et son assemblée (malaʾihi) : ils sont certes un peuple qui transgresse. »'
- ref: 'S.28:33'
  ar: 'قَالَ رَبِّ إِنِّي قَتَلْتُ مِنْهُمْ نَفْسًا فَأَخَافُ أَنْ يَقْتُلُونِ'
  trl: 'Qāla rabbi innī qataltu minhum nafsan fa-akhāfu an yaqtulūni'
  trad: 'Il dit : « Mon Rabb, j''ai tué (qataltu) une âme parmi eux, et je crains donc qu''ils ne me tuent. »'
- ref: 'S.28:34'
  ar: 'وَأَخِي هَارُونُ هُوَ أَفْصَحُ مِنِّي لِسَانًا فَأَرْسِلْهُ مَعِيَ رِدْءًا يُصَدِّقُنِي ۖ إِنِّي أَخَافُ أَنْ يُكَذِّبُونِ'
  trl: 'Wa-akhī hārūnu huwa afṣaḥu minnī lisānan fa-arsilhu maʿiya ridʾan yuṣaddiqunī innī akhāfu an yukadhdhibūn'
  trad: '« Et mon frère Hārūn est plus éloquent que moi (afṣaḥu) en matière de langage (lisānan) — envoie-le donc avec moi comme soutien (ridʾan) qui confirmera ma parole (yuṣaddiqunī) : je crains en effet qu''ils ne me démentent. »'
- ref: 'S.28:35'
  ar: 'قَالَ سَنَشُدُّ عَضُدَكَ بِأَخِيكَ وَنَجْعَلُ لَكُمَا سُلْطَانًا فَلَا يَصِلُونَ إِلَيْكُمَا ۚ بِآيَاتِنَا أَنْتُمَا وَمَنِ اتَّبَعَكُمَا الْغَالِبُونَ'
  trl: 'Qāla sa-nashuddu ʿaḍudaka bi-akhīka wa-najʿalu lakumā sulṭānan falā yaṣilūna ilaykumā bi-āyātinā antumā wa-mani ttabaʿakumā l-ghālibūn'
  trad: 'Il dit : « Nous affermirons ton bras (sa-nashuddu ʿaḍudaka) par ton frère, et Nous vous donnerons à tous deux une autorité (sulṭānan), de sorte qu''ils ne pourront vous atteindre — par Nos signes, vous deux et quiconque vous suivra serez les victorieux (al-ghālibūn). »'
- ref: 'S.28:36'
  ar: 'فَلَمَّا جَاءَهُمْ مُوسَىٰ بِآيَاتِنَا بَيِّنَاتٍ قَالُوا مَا هَٰذَا إِلَّا سِحْرٌ مُفْتَرًى وَمَا سَمِعْنَا بِهَٰذَا فِي آبَائِنَا الْأَوَّلِينَ'
  trl: 'Fa-lammā jāʾahum mūsā bi-āyātinā bayyinātin qālū mā hādhā illā siḥrun muftaran wa-mā samiʿnā bi-hādhā fī ābāʾinā l-awwalīn'
  trad: 'Puis, lorsque Mūsā vint à eux avec Nos signes manifestes (āyātinā bayyinātin), ils dirent : « Ceci n''est qu''une sorcellerie inventée (siḥrun muftaran) — nous n''avons jamais entendu cela chez nos tout premiers pères (ābāʾinā l-awwalīn). »'
- ref: 'S.28:37'
  ar: 'وَقَالَ مُوسَىٰ رَبِّي أَعْلَمُ بِمَنْ جَاءَ بِالْهُدَىٰ مِنْ عِنْدِهِ وَمَنْ تَكُونُ لَهُ عَاقِبَةُ الدَّارِ ۖ إِنَّهُ لَا يُفْلِحُ الظَّالِمُونَ'
  trl: 'Wa-qāla mūsā rabbī aʿlamu bi-man jāʾa bi-l-hudā min ʿindihi wa-man takūnu lahu ʿāqibatu d-dāri innahu lā yufliḥu ẕ-ẕālimūn'
  trad: 'Et Mūsā dit : « Mon Rabb sait mieux qui vient avec la guidance de Sa part, et à qui reviendra l''issue favorable de la demeure (ʿāqibatu d-dār) — les injustes, certes, ne réussissent pas (lā yufliḥu ẕ-ẕālimūn). »'
- ref: 'S.28:38'
  ar: 'وَقَالَ فِرْعَوْنُ يَا أَيُّهَا الْمَلَأُ مَا عَلِمْتُ لَكُمْ مِنْ إِلَٰهٍ غَيْرِي فَأَوْقِدْ لِي يَا هَامَانُ عَلَى الطِّينِ فَاجْعَلْ لِي صَرْحًا لَعَلِّي أَطَّلِعُ إِلَىٰ إِلَٰهِ مُوسَىٰ وَإِنِّي لَأَظُنُّهُ مِنَ الْكَاذِبِينَ'
  trl: 'Wa-qāla firʿawnu yā ayyuha l-malaʾu mā ʿalimtu lakum min ilāhin ghayrī fa-awqid lī yā hāmānu ʿala ṭ-ṭīni fa-jʿal lī ṣarḥan laʿallī aṭṭaliʿu ilā ilāhi mūsā wa-innī la-aẕunnuhu mina l-kādhibīn'
  trad: 'Et Firʿawn dit : « Ô assemblée (al-malaʾ), je ne connais pour vous aucun ilāh en dehors de moi — allume-moi donc [un feu], ô Hāmān, sur l''argile (ʿala ṭ-ṭīni), et fais-moi une tour (ṣarḥan), afin que je monte voir (aṭṭaliʿu) l''ilāh de Mūsā — car je pense assurément qu''il est du nombre des menteurs. »'
- ref: 'S.28:39'
  ar: 'وَاسْتَكْبَرَ هُوَ وَجُنُودُهُ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَظَنُّوا أَنَّهُمْ إِلَيْنَا لَا يُرْجَعُونَ'
  trl: 'Wa-stakbara huwa wa-junūduhu fi l-arḍi bi-ghayri l-ḥaqqi wa-ẕannū annahum ilaynā lā yurjaʿūn'
  trad: 'Il s''enfla d''orgueil (istakbara), lui et ses armées, sur la terre, sans aucun droit — et ils pensèrent qu''ils ne seraient jamais ramenés vers Nous.'
- ref: 'S.28:40'
  ar: 'فَأَخَذْنَاهُ وَجُنُودَهُ فَنَبَذْنَاهُمْ فِي الْيَمِّ ۖ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الظَّالِمِينَ'
  trl: 'Fa-akhadhnāhu wa-junūdahu fa-nabadhnāhum fi l-yammi fa-nẕur kayfa kāna ʿāqibatu ẕ-ẕālimīn'
  trad: 'Nous le saisîmes donc, lui et ses armées, et Nous les jetâmes (nabadhnāhum) dans le yamm — regarde donc ce qu''il advint de la fin des injustes.'
- ref: 'S.28:41'
  ar: 'وَجَعَلْنَاهُمْ أَئِمَّةً يَدْعُونَ إِلَى النَّارِ ۖ وَيَوْمَ الْقِيَامَةِ لَا يُنْصَرُونَ'
  trl: 'Wa-jaʿalnāhum aʾimmatan yadʿūna ila n-nāri wa-yawma l-qiyāmati lā yunṣarūn'
  trad: 'Et Nous avons fait d''eux des aʾimma qui appellent au Feu — et au Jour de la Résurrection (yawma l-qiyāmati), ils ne seront pas secourus (lā yunṣarūn).'
- ref: 'S.28:42'
  ar: 'وَأَتْبَعْنَاهُمْ فِي هَٰذِهِ الدُّنْيَا لَعْنَةً ۖ وَيَوْمَ الْقِيَامَةِ هُمْ مِنَ الْمَقْبُوحِينَ'
  trl: 'Wa-atbaʿnāhum fī hādhihi d-dunyā laʿnatan wa-yawma l-qiyāmati hum mina l-maqbūḥīn'
  trad: 'Et Nous avons fait qu''une malédiction (laʿnatan) les suive dans cette vie d''ici-bas (ad-dunyā) — et au Jour de la Résurrection, ils seront du nombre des maqbūḥīn [ceux voués au rejet, à la laideur].'
- ref: 'S.28:43'
  ar: 'وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ مِنْ بَعْدِ مَا أَهْلَكْنَا الْقُرُونَ الْأُولَىٰ بَصَائِرَ لِلنَّاسِ وَهُدًى وَرَحْمَةً لَعَلَّهُمْ يَتَذَكَّرُونَ'
  trl: 'Wa-la-qad ātaynā mūsa l-kitāba min baʿdi mā ahlaknā l-qurūna l-ūlā baṣāʾira li-n-nāsi wa-hudan wa-raḥmatan laʿallahum yatadhakkarūn'
  trad: 'Et Nous avons certes donné à Mūsā le Kitāb, après avoir anéanti les générations antérieures (al-qurūna l-ūlā) — comme moyens de discernement (baṣāʾira) pour les gens, comme guidance et comme raḥma, afin qu''ils se rappellent (yatadhakkarūn).'
- ref: 'S.28:44'
  ar: 'وَمَا كُنْتَ بِجَانِبِ الْغَرْبِيِّ إِذْ قَضَيْنَا إِلَىٰ مُوسَى الْأَمْرَ وَمَا كُنْتَ مِنَ الشَّاهِدِينَ'
  trl: 'Wa-mā kunta bi-jānibi l-gharbiyyi idh qaḍaynā ilā mūsa l-amra wa-mā kunta mina sh-shāhidīn'
  trad: 'Et tu n''étais pas sur le flanc occidental (bi-jānibi l-gharbiyyi) lorsque Nous avons signifié à Mūsā l''ordonnance (qaḍaynā ilā mūsa l-amra) — et tu n''étais pas non plus du nombre des témoins (ash-shāhidīn).'
- ref: 'S.28:45'
  ar: 'وَلَٰكِنَّا أَنْشَأْنَا قُرُونًا فَتَطَاوَلَ عَلَيْهِمُ الْعُمُرُ ۚ وَمَا كُنْتَ ثَاوِيًا فِي أَهْلِ مَدْيَنَ تَتْلُو عَلَيْهِمْ آيَاتِنَا وَلَٰكِنَّا كُنَّا مُرْسِلِينَ'
  trl: 'Wa-lākinnā anshaʾnā qurūnan fa-taṭāwala ʿalayhimu l-ʿumuru wa-mā kunta thāwiyan fī ahli madyana tatlū ʿalayhim āyātinā wa-lākinnā kunnā mursilīn'
  trad: 'Mais Nous avons fait naître des générations (qurūnan), et la durée s''est prolongée sur elles (fa-taṭāwala ʿalayhimu l-ʿumuru) — et tu n''étais pas non plus demeurant (thāwiyan) parmi les gens de Madyan, leur récitant Nos signes ; mais c''est Nous qui envoyions (mursilīn).'
- ref: 'S.28:46'
  ar: 'وَمَا كُنْتَ بِجَانِبِ الطُّورِ إِذْ نَادَيْنَا وَلَٰكِنْ رَحْمَةً مِنْ رَبِّكَ لِتُنْذِرَ قَوْمًا مَا أَتَاهُمْ مِنْ نَذِيرٍ مِنْ قَبْلِكَ لَعَلَّهُمْ يَتَذَكَّرُونَ'
  trl: 'Wa-mā kunta bi-jānibi ṭ-ṭūri idh nādaynā wa-lākin raḥmatan min rabbika li-tundhira qawman mā atāhum min nadhīrin min qablika laʿallahum yatadhakkarūn'
  trad: 'Et tu n''étais pas non plus sur le flanc du Ṭūr lorsque Nous avons appelé (nādaynā) — mais cela, comme une raḥma venant de ton Rabb, pour que tu avertisses (li-tundhira) un peuple à qui n''était venu aucun avertisseur (nadhīr) avant toi, afin qu''ils se rappellent (yatadhakkarūn).'
- ref: 'S.28:47'
  ar: 'وَلَوْلَا أَنْ تُصِيبَهُمْ مُصِيبَةٌ بِمَا قَدَّمَتْ أَيْدِيهِمْ فَيَقُولُوا رَبَّنَا لَوْلَا أَرْسَلْتَ إِلَيْنَا رَسُولًا فَنَتَّبِعَ آيَاتِكَ وَنَكُونَ مِنَ الْمُؤْمِنِينَ'
  trl: 'Wa-lawlā an tuṣībahum muṣībatun bimā qaddamat aydīhim fa-yaqūlū rabbanā lawlā arsalta ilaynā rasūlan fa-nattabiʿa āyātika wa-nakūna mina l-muʾminīn'
  trad: 'Et n''était [la crainte] qu''un malheur (muṣībatun) ne les atteigne pour ce que leurs mains ont avancé (bimā qaddamat aydīhim), en sorte qu''ils diraient : « Notre Rabb, pourquoi ne nous as-Tu pas envoyé de rasūl ? Nous aurions alors suivi Tes signes, et aurions été du nombre des croyants » — [nul rasūl ne leur aurait été envoyé].'
- ref: 'S.28:48'
  ar: 'فَلَمَّا جَاءَهُمُ الْحَقُّ مِنْ عِنْدِنَا قَالُوا لَوْلَا أُوتِيَ مِثْلَ مَا أُوتِيَ مُوسَىٰ ۚ أَوَلَمْ يَكْفُرُوا بِمَا أُوتِيَ مُوسَىٰ مِنْ قَبْلُ ۖ قَالُوا سِحْرَانِ تَظَاهَرَا وَقَالُوا إِنَّا بِكُلٍّ كَافِرُونَ'
  trl: 'Fa-lammā jāʾahumu l-ḥaqqu min ʿindinā qālū lawlā ūtiya mithla mā ūtiya mūsā awalam yakfurū bimā ūtiya mūsā min qablu qālū siḥrāni taẓāharā wa-qālū innā bikullin kāfirūn'
  trad: 'Mais lorsque le ḥaqq leur vint de Notre part, ils dirent : « Pourquoi ne lui a-t-il pas été donné le semblable de ce qui fut donné à Mūsā ? » — Mais n''avaient-ils pas déjà fait le kufr envers ce qui fut donné à Mūsā auparavant ? Ils dirent : « Deux sorcelleries qui se soutiennent mutuellement (siḥrāni tazāharā) ! » et ils dirent : « Nous sommes, de toutes deux, négateurs (kāfirūn). »'
- ref: 'S.28:49'
  ar: 'قُلْ فَأْتُوا بِكِتَابٍ مِنْ عِنْدِ اللَّهِ هُوَ أَهْدَىٰ مِنْهُمَا أَتَّبِعْهُ إِنْ كُنْتُمْ صَادِقِينَ'
  trl: 'Qul fa-ʾtū bi-kitābin min ʿindi llāhi huwa ahdā minhumā attabiʿhu in kuntum ṣādiqīn'
  trad: 'Dis : « Apportez donc un Kitāb venant d''Allaah qui soit mieux guidant (ahdā) que ces deux-là (minhumā) — je le suivrai, si vous êtes véridiques (ṣādiqīn). »'
- ref: 'S.28:50'
  ar: 'فَإِنْ لَمْ يَسْتَجِيبُوا لَكَ فَاعْلَمْ أَنَّمَا يَتَّبِعُونَ أَهْوَاءَهُمْ ۚ وَمَنْ أَضَلُّ مِمَّنِ اتَّبَعَ هَوَاهُ بِغَيْرِ هُدًى مِنَ اللَّهِ ۚ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ'
  trl: 'Fa-in lam yastajībū laka fa-ʿlam annamā yattabiʿūna ahwāʾahum wa-man aḍallu mimmani ttabaʿa hawāhu bi-ghayri hudan mina llāhi inna llāha lā yahdī l-qawma ẓ-ẓālimīn'
  trad: 'Mais s''ils ne te répondent pas, sache alors qu''ils ne font que suivre leurs désirs (ahwāʾahum) — et qui est plus égaré que celui qui suit son désir (hawāhu) sans guidance venant d''Allaah ? Allaah, certes, ne guide pas le peuple injuste.'
- ref: 'S.28:51'
  ar: '۞ وَلَقَدْ وَصَّلْنَا لَهُمُ الْقَوْلَ لَعَلَّهُمْ يَتَذَكَّرُونَ'
  trl: 'Wa-laqad waṣṣalnā lahumu l-qawla laʿallahum yatadhakkarūn'
  trad: 'Et Nous avons certes fait parvenir jusqu''à eux la Parole (al-qawl), en l''enchaînant [par segments liés les uns aux autres] (waṣṣalnā) — afin qu''ils se rappellent (yatadhakkarūn).'
- ref: 'S.28:52'
  ar: 'الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ مِنْ قَبْلِهِ هُمْ بِهِ يُؤْمِنُونَ'
  trl: 'Alladhīna ātaynāhumu l-kitāba min qablihi hum bihi yuʾminūn'
  trad: 'Ceux à qui Nous avons donné le Kitāb avant lui (min qablihi) — ceux-là y croient.'
- ref: 'S.28:53'
  ar: 'وَإِذَا يُتْلَىٰ عَلَيْهِمْ قَالُوا آمَنَّا بِهِ إِنَّهُ الْحَقُّ مِنْ رَبِّنَا إِنَّا كُنَّا مِنْ قَبْلِهِ مُسْلِمِينَ'
  trl: 'Wa-idhā yutlā ʿalayhim qālū āmannā bihi innahu l-ḥaqqu min rabbinā innā kunnā min qablihi muslimīn'
  trad: 'Et quand il leur est récité, ils disent : « Nous y croyons ; c''est certes le ḥaqq venant de notre Rabb ; nous étions déjà, avant lui, muslimūn. »'
- ref: 'S.28:54'
  ar: 'أُولَٰئِكَ يُؤْتَوْنَ أَجْرَهُمْ مَرَّتَيْنِ بِمَا صَبَرُوا وَيَدْرَءُونَ بِالْحَسَنَةِ السَّيِّئَةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ'
  trl: 'Ulāʾika yuʾtawna ajrahum marratayni bimā ṣabarū wa-yadraʾūna bi-l-ḥasanati s-sayyiʾata wa-mimmā razaqnāhum yunfiqūn'
  trad: 'Ceux-là reçoivent leur rétribution (ajrahum) deux fois, pour ce qu''ils ont enduré (ṣabarū) ; et ils repoussent le mal par le bien (yadraʾūna bi-l-ḥasanati s-sayyiʾata) ; et de ce que Nous leur avons attribué comme rizq, ils dépensent (yunfiqūn).'
- ref: 'S.28:55'
  ar: 'وَإِذَا سَمِعُوا اللَّغْوَ أَعْرَضُوا عَنْهُ وَقَالُوا لَنَا أَعْمَالُنَا وَلَكُمْ أَعْمَالُكُمْ سَلَامٌ عَلَيْكُمْ لَا نَبْتَغِي الْجَاهِلِينَ'
  trl: 'Wa-idhā samiʿū l-laghwa aʿraḍū ʿanhu wa-qālū lanā aʿmālunā wa-lakum aʿmālukum salāmun ʿalaykum lā nabtaghī l-jāhilīn'
  trad: 'Et quand ils entendent la parole vaine (al-laghw), ils s''en détournent (aʿraḍū ʿanhu), et disent : « À nous nos actes, à vous vos actes ; paix sur vous (salāmun ʿalaykum) ; nous ne recherchons pas [la compagnie] des ignorants (al-jāhilīn). »'
- ref: 'S.28:56'
  ar: 'إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ ۚ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ'
  trl: 'Innaka lā tahdī man aḥbabta wa-lākinna llāha yahdī man yashāʾu wa-huwa aʿlamu bi-l-muhtadīn'
  trad: 'Tu ne guides pas qui tu as aimé (man aḥbabta) — mais Allaah guide qui Il veut (man yashāʾu) ; et Il connaît mieux [que quiconque] ceux qui sont guidés (al-muhtadīn).'
- ref: 'S.28:57'
  ar: 'وَقَالُوا إِنْ نَتَّبِعِ الْهُدَىٰ مَعَكَ نُتَخَطَّفْ مِنْ أَرْضِنَا ۚ أَوَلَمْ نُمَكِّنْ لَهُمْ حَرَمًا آمِنًا يُجْبَىٰ إِلَيْهِ ثَمَرَاتُ كُلِّ شَيْءٍ رِزْقًا مِنْ لَدُنَّا وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ'
  trl: 'Wa-qālū in nattabiʿi l-hudā maʿaka nutakhaṭṭaf min arḍinā awalam numakkin lahum ḥaraman āminan yujbā ilayhi thamarātu kulli shayʾin rizqan min ladunnā wa-lākinna aktharahum lā yaʿlamūn'
  trad: 'Et ils dirent : « Si nous suivons la guidance (al-hudā) avec toi, nous serons arrachés (nutakhaṭṭaf) de notre terre » — ne les avons-Nous pas établis fermement (numakkin) dans un ḥaram sûr (ḥaraman āminan), où sont apportés (yujbā) les fruits de toute chose, comme rizq venant de Nous-mêmes (min ladunnā) ? Mais la plupart d''entre eux ne savent pas.'
- ref: 'S.28:58'
  ar: 'وَكَمْ أَهْلَكْنَا مِنْ قَرْيَةٍ بَطِرَتْ مَعِيشَتَهَا ۖ فَتِلْكَ مَسَاكِنُهُمْ لَمْ تُسْكَنْ مِنْ بَعْدِهِمْ إِلَّا قَلِيلًا ۖ وَكُنَّا نَحْنُ الْوَارِثِينَ'
  trl: 'Wa-kam ahlaknā min qaryatin baṭirat maʿīshatahā fa-tilka masākinuhum lam tuskan min baʿdihim illā qalīlan wa-kunnā naḥnu l-wārithīn'
  trad: 'Et combien de cités (qaryatin) avons-Nous détruites (ahlaknā), qui s''étaient laissé griser, jusqu''à l''ingratitude, par leur propre aisance de vie (baṭirat maʿīshatahā) ! Voici leurs demeures (masākinuhum) : elles ne furent plus habitées après eux, sinon un peu (illā qalīlan) ; et c''est Nous qui fûmes les héritiers (al-wārithīn).'
- ref: 'S.28:59'
  ar: 'وَمَا كَانَ رَبُّكَ مُهْلِكَ الْقُرَىٰ حَتَّىٰ يَبْعَثَ فِي أُمِّهَا رَسُولًا يَتْلُو عَلَيْهِمْ آيَاتِنَا ۚ وَمَا كُنَّا مُهْلِكِي الْقُرَىٰ إِلَّا وَأَهْلُهَا ظَالِمُونَ'
  trl: 'Wa-mā kāna rabbuka muhlika l-qurā ḥattā yabʿatha fī ummihā rasūlan yatlū ʿalayhim āyātinā wa-mā kunnā muhlikī l-qurā illā wa-ahluhā ẓālimūn'
  trad: 'Et ton Rabb n''a jamais été destructeur (muhlik) des cités (al-qurā) avant d''avoir envoyé, dans leur [cité-]mère (fī ummihā), un rasūl qui leur récite Nos āyāt — et Nous n''avons jamais détruit les cités, sinon lorsque leurs habitants étaient injustes (ẓālimūn).'
- ref: 'S.28:60'
  ar: 'وَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَزِينَتُهَا ۚ وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ ۚ أَفَلَا تَعْقِلُونَ'
  trl: 'Wa-mā ūtītum min shayʾin fa-matāʿu l-ḥayāti d-dunyā wa-zīnatuhā wa-mā ʿinda llāhi khayrun wa-abqā a-fa-lā taʿqilūn'
  trad: 'Et ce qui vous a été donné, quelle que soit la chose, n''est que jouissance passagère (matāʿ) de la vie d''ici-bas (al-ḥayāt ad-dunyā) et sa parure (zīnatuhā) — et ce qui est auprès d''Allaah (mā ʿinda llāh) est meilleur et plus durable (abqā). Ne raisonnez-vous donc pas ?'
- ref: 'S.28:61'
  ar: 'أَفَمَنْ وَعَدْنَاهُ وَعْدًا حَسَنًا فَهُوَ لَاقِيهِ كَمَنْ مَتَّعْنَاهُ مَتَاعَ الْحَيَاةِ الدُّنْيَا ثُمَّ هُوَ يَوْمَ الْقِيَامَةِ مِنَ الْمُحْضَرِينَ'
  trl: 'A-fa-man waʿadnāhu waʿdan ḥasanan fa-huwa lāqīhi ka-man mattaʿnāhu matāʿa l-ḥayāti d-dunyā thumma huwa yawma l-qiyāmati mina l-muḥḑarīn'
  trad: 'Celui à qui Nous avons fait une belle promesse (waʿdan ḥasanan), et qui va la rencontrer (lāqīhi), est-il donc comme celui à qui Nous avons donné la jouissance passagère de la vie d''ici-bas, et qui sera ensuite, au Jour de la Résurrection, du nombre de ceux qui seront produits [devant le jugement] (al-muḥḑarīn) ?'
- ref: 'S.28:62'
  ar: 'وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ تَزْعُمُونَ'
  trl: 'Wa-yawma yunādīhim fa-yaqūlu ayna shurakāʾiya lladhīna kuntum tazʿumūn'
  trad: 'Et [rappelle] le Jour où Il les appellera, et dira : « Où sont Mes associés (shurakāʾiya), que vous prétendiez (tazʿumūn) [exister] ? »'
- ref: 'S.28:63'
  ar: 'قَالَ الَّذِينَ حَقَّ عَلَيْهِمُ الْقَوْلُ رَبَّنَا هَٰؤُلَاءِ الَّذِينَ أَغْوَيْنَا أَغْوَيْنَاهُمْ كَمَا غَوَيْنَا ۖ تَبَرَّأْنَا إِلَيْكَ ۖ مَا كَانُوا إِيَّانَا يَعْبُدُونَ'
  trl: 'Qāla lladhīna ḥaqqa ʿalayhimu l-qawlu rabbanā hāʾulāʾi lladhīna aghwaynā aghwaynāhum ka-mā ghawaynā tabarraʾnā ilayka mā kānū iyyānā yaʿbudūn'
  trad: 'Ceux sur qui la Parole s''est avérée [vraie] (ḥaqqa ʿalayhimu l-qawl) diront : « Notre Rabb, ceux-ci sont ceux que nous avons égarés (aghwaynā) — nous les avons égarés comme nous-mêmes nous avons été égarés (ghawaynā). Nous nous dégageons [de toute responsabilité], devant Toi (tabarraʾnā ilayka) — ce n''est pas nous qu''ils adoraient. »'
- ref: 'S.28:64'
  ar: 'وَقِيلَ ادْعُوا شُرَكَاءَكُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا لَهُمْ وَرَأَوُا الْعَذَابَ ۚ لَوْ أَنَّهُمْ كَانُوا يَهْتَدُونَ'
  trl: 'Wa-qīla dʿū shurakāʾakum fa-daʿawhum fa-lam yastajībū lahum wa-raʾawu l-ʿadhāba law annahum kānū yahtadūn'
  trad: 'Et il leur sera dit : « Appelez vos associés ! » — ils les appelleront alors, mais ceux-ci ne leur répondront pas (lam yastajībū), et ils verront le châtiment — [ils voudraient] qu''ils eussent été guidés !'
- ref: 'S.28:65'
  ar: 'وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ مَاذَا أَجَبْتُمُ الْمُرْسَلِينَ'
  trl: 'Wa-yawma yunādīhim fa-yaqūlu mādhā ajabtumu l-mursalīn'
  trad: 'Et [rappelle] le Jour où Il les appellera, et dira : « Qu''avez-vous répondu (mādhā ajabtum) aux mursalūn ? »'
- ref: 'S.28:66'
  ar: 'فَعَمِيَتْ عَلَيْهِمُ الْأَنْبَاءُ يَوْمَئِذٍ فَهُمْ لَا يَتَسَاءَلُونَ'
  trl: 'Fa-ʿamiyat ʿalayhimu l-anbāʾu yawmaʾidhin fa-hum lā yatasāʾalūn'
  trad: 'Les récits (al-anbāʾ) deviendront alors opaques pour eux (ʿamiyat), ce Jour-là — si bien qu''ils ne s''interrogeront plus entre eux (lā yatasāʾalūn).'
- ref: 'S.28:67'
  ar: 'فَأَمَّا مَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا فَعَسَىٰ أَنْ يَكُونَ مِنَ الْمُفْلِحِينَ'
  trl: 'Fa-ammā man tāba wa-āmana wa-ʿamila ṣāliḥan fa-ʿasā an yakūna mina l-mufliḥīn'
  trad: 'Quant à celui qui est revenu (tāba), a cru, et a agi droitement (ʿamila ṣāliḥan) — il se peut qu''il soit du nombre de ceux qui réussissent (al-mufliḥīn).'
- ref: 'S.28:68'
  ar: 'وَرَبُّكَ يَخْلُقُ مَا يَشَاءُ وَيَخْتَارُ ۗ مَا كَانَ لَهُمُ الْخِيَرَةُ ۚ سُبْحَانَ اللَّهِ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ'
  trl: 'Wa-rabbuka yakhluqu mā yashāʾu wa-yakhtāru mā kāna lahumu l-khiyaratu subḥāna llāhi wa-taʿālā ʿammā yushrikūn'
  trad: 'Et ton Rabb crée ce qu''Il veut, et Il choisit (yakhtāru) — nul choix (al-khiyara) ne leur appartient. Il est dégagé de toute imperfection (subḥāna llāh), et Il transcende (taʿālā) ce qu''ils Lui associent.'
- ref: 'S.28:69'
  ar: 'وَرَبُّكَ يَعْلَمُ مَا تُكِنُّ صُدُورُهُمْ وَمَا يُعْلِنُونَ'
  trl: 'Wa-rabbuka yaʿlamu mā tukinnu ṣudūruhum wa-mā yuʿlinūn'
  trad: 'Et ton Rabb sait ce que leurs poitrines (ṣudūruhum) cachent (tukinnu), et ce qu''ils déclarent (yuʿlinūn).'
- ref: 'S.28:70'
  ar: 'وَهُوَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ لَهُ الْحَمْدُ فِي الْأُولَىٰ وَالْآخِرَةِ ۖ وَلَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ'
  trl: 'Wa-huwa llāhu lā ilāha illā huwa lahu l-ḥamdu fi l-ūlā wa-l-ākhirati wa-lahu l-ḥukmu wa-ilayhi turjaʿūn'
  trad: 'Et c''est Lui, Allaah — nul ilāh que Lui. À Lui la ḥamd, dans la première [vie] comme dans la dernière (fi l-ūlā wa-l-ākhira) — à Lui le jugement (al-ḥukm), et c''est à Lui que vous retournez (turjaʿūn).'
- ref: 'S.28:71–72'
  ar: 'قُلْ أَرَأَيْتُمْ إِنْ جَعَلَ اللَّهُ عَلَيْكُمُ اللَّيْلَ سَرْمَدًا إِلَىٰ يَوْمِ الْقِيَامَةِ مَنْ إِلَٰهٌ غَيْرُ اللَّهِ يَأْتِيكُمْ بِضِيَاءٍ ۖ أَفَلَا تَسْمَعُونَ ۝ قُلْ أَرَأَيْتُمْ إِنْ جَعَلَ اللَّهُ عَلَيْكُمُ النَّهَارَ سَرْمَدًا إِلَىٰ يَوْمِ الْقِيَامَةِ مَنْ إِلَٰهٌ غَيْرُ اللَّهِ يَأْتِيكُمْ بِلَيْلٍ تَسْكُنُونَ فِيهِ ۖ أَفَلَا تُبْصِرُونَ'
  trl: 'Qul a-raʾaytum in jaʿala llāhu ʿalaykumu l-layla sarmadan ilā yawmi l-qiyāmati man ilāhun ghayru llāhi yaʾtīkum bi-ḑiyāʾin a-fa-lā tasmaʿūn — qul a-raʾaytum in jaʿala llāhu ʿalaykumu n-nahāra sarmadan ilā yawmi l-qiyāmati man ilāhun ghayru llāhi yaʾtīkum bi-laylin taskunūna fīhi a-fa-lā tubṣirūn'
  trad: 'Dis : « Avez-vous considéré (a-raʾaytum) : si Allaah faisait pour vous la nuit perpétuelle (sarmadan) jusqu''au Jour de la Résurrection, quel ilāh, autre qu''Allaah, vous apporterait une clarté (ḑiyāʾ) ? N''entendez-vous donc pas ? » Dis : « Avez-vous considéré : si Allaah faisait pour vous le jour perpétuel jusqu''au Jour de la Résurrection, quel ilāh, autre qu''Allaah, vous apporterait une nuit où vous reposer (taskunūna fīhi) ? Ne voyez-vous donc pas ? »'
- ref: 'S.28:73'
  ar: 'وَمِنْ رَحْمَتِهِ جَعَلَ لَكُمُ اللَّيْلَ وَالنَّهَارَ لِتَسْكُنُوا فِيهِ وَلِتَبْتَغُوا مِنْ فَضْلِهِ وَلَعَلَّكُمْ تَشْكُرُونَ'
  trl: 'Wa-min raḥmatihi jaʿala lakumu l-layla wa-n-nahāra li-taskunū fīhi wa-li-tabtaghū min faḑlihi wa-laʿallakum tashkurūn'
  trad: 'Et c''est de Sa raḥma qu''Il a fait pour vous la nuit et le jour : pour que vous vous reposiez dans l''une, et que vous recherchiez de Son faḑl dans l''autre — et afin que, peut-être, vous soyez reconnaissants (tashkurūn).'
- ref: 'S.28:74'
  ar: 'وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ تَزْعُمُونَ'
  trl: 'Wa-yawma yunādīhim fa-yaqūlu ayna shurakāʾiya lladhīna kuntum tazʿumūn'
  trad: 'Et [rappelle] le Jour où Il les appellera, et dira : « Où sont Mes associés, que vous prétendiez [exister] ? »'
- ref: 'S.28:75'
  ar: 'وَنَزَعْنَا مِنْ كُلِّ أُمَّةٍ شَهِيدًا فَقُلْنَا هَاتُوا بُرْهَانَكُمْ فَعَلِمُوا أَنَّ الْحَقَّ لِلَّهِ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ'
  trl: 'Wa-nazaʿnā min kulli ummatin shahīdan fa-qulnā hātū burhānakum fa-ʿalimū anna l-ḥaqqa li-llāhi wa-ḑalla ʿanhum mā kānū yaftarūn'
  trad: 'Et Nous aurons tiré (nazaʿnā), de chaque umma, un témoin (shahīd), et Nous dirons : « Apportez votre preuve (hātū burhānakum) ! » Ils sauront alors que le ḥaqq appartient à Allaah, et ce qu''ils inventaient (yaftarūn) se sera égaré loin d''eux (ḑalla ʿanhum).'
- ref: 'S.28:76'
  ar: '۞ إِنَّ قَارُونَ كَانَ مِنْ قَوْمِ مُوسَىٰ فَبَغَىٰ عَلَيْهِمْ ۖ وَآتَيْنَاهُ مِنَ الْكُنُوزِ مَا إِنَّ مَفَاتِحَهُ لَتَنُوءُ بِالْعُصْبَةِ أُولِي الْقُوَّةِ إِذْ قَالَ لَهُ قَوْمُهُ لَا تَفْرَحْ ۖ إِنَّ اللَّهَ لَا يُحِبُّ الْفَرِحِينَ'
  trl: 'Inna qārūna kāna min qawmi mūsā fa-baghā ʿalayhim wa-ātaynāhu mina l-kunūzi mā inna mafātiḥahu la-tanūʾu bi-l-ʿuṣbati ulī l-quwwati idh qāla lahu qawmuhu lā tafraḥ inna llāha lā yuḥibbu l-fariḥīn'
  trad: 'Qārūn était certes du peuple de Mūsā, et il dépassa la mesure contre eux (fa-baghā ʿalayhim). Et Nous lui avions donné, des trésors (al-kunūz), de quoi les seules clés (mafātiḥahu) pèseraient lourdement (la-tanūʾu) sur une troupe d''hommes de force (al-ʿuṣbati ulī l-quwwati) — quand son peuple lui dit : « Ne te réjouis pas avec excès (lā tafraḥ) ; Allaah n''honore pas ceux qui se réjouissent avec excès (al-fariḥīn). »'
- ref: 'S.28:77'
  ar: 'وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ ۖ وَلَا تَنْسَ نَصِيبَكَ مِنَ الدُّنْيَا ۖ وَأَحْسِنْ كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ ۖ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ ۖ إِنَّ اللَّهَ لَا يُحِبُّ الْمُفْسِدِينَ'
  trl: 'Wa-btaghi fī-mā ātāka llāhu d-dāra l-ākhirata wa-lā tansa naṣībaka mina d-dunyā wa-aḥsin ka-mā aḥsana llāhu ilayka wa-lā tabghi l-fasāda fi l-arḑi inna llāha lā yuḥibbu l-mufsidīn'
  trad: 'Et recherche (wa-btaghi), par ce qu''Allaah t''a donné, la Demeure dernière (ad-dāra l-ākhira) — et n''oublie pas ta part (naṣībaka) d''ici-bas — et fais le bien (aḥsin) comme Allaah t''a fait le bien — et ne recherche pas le fasād sur la terre : Allaah n''honore pas les mufsidūn.'
- ref: 'S.28:78'
  ar: 'قَالَ إِنَّمَا أُوتِيتُهُ عَلَىٰ عِلْمٍ عِنْدِي ۚ أَوَلَمْ يَعْلَمْ أَنَّ اللَّهَ قَدْ أَهْلَكَ مِنْ قَبْلِهِ مِنَ الْقُرُونِ مَنْ هُوَ أَشَدُّ مِنْهُ قُوَّةً وَأَكْثَرُ جَمْعًا ۚ وَلَا يُسْأَلُ عَنْ ذُنُوبِهِمُ الْمُجْرِمُونَ'
  trl: 'Qāla innamā ūtītuhu ʿalā ʿilmin ʿindī a-wa-lam yaʿlam anna llāha qad ahlaka min qablihi mina l-qurūni man huwa ashaddu minhu quwwatan wa-aktharu jamʿan wa-lā yusʾalu ʿan dhunūbihimu l-mujrimūn'
  trad: 'Il dit : « Cela ne m''a été donné que sur une science qui est mienne (ʿalā ʿilmin ʿindī). » — Ne savait-il donc pas qu''Allaah avait déjà détruit, parmi les générations (al-qurūn) qui l''avaient précédé, [des hommes] plus forts que lui en puissance et plus riches en biens amassés (aktharu jamʿan) ? — et les mujrimūn ne seront pas interrogés sur leurs péchés [avant d''être jugés].'
- ref: 'S.28:79'
  ar: 'فَخَرَجَ عَلَىٰ قَوْمِهِ فِي زِينَتِهِ ۖ قَالَ الَّذِينَ يُرِيدُونَ الْحَيَاةَ الدُّنْيَا يَا لَيْتَ لَنَا مِثْلَ مَا أُوتِيَ قَارُونُ إِنَّهُ لَذُو حَظٍّ عَظِيمٍ'
  trl: 'Fa-kharaja ʿalā qawmihi fī zīnatihi qāla lladhīna yurīdūna l-ḥayāta d-dunyā yā layta lanā mithla mā ūtiya qārūnu innahu la-dhū ḥaẕẕin ʿaẕīm'
  trad: 'Il sortit alors devant son peuple, dans sa parure (fī zīnatihi). Ceux qui désiraient la vie d''ici-bas dirent : « Que n''avons-nous le pareil de ce qui a été donné à Qārūn ! Il est certes pourvu d''une immense part [de fortune] (la-dhū ḥaẕẕin ʿaẕīm). »'
- ref: 'S.28:80'
  ar: 'وَقَالَ الَّذِينَ أُوتُوا الْعِلْمَ وَيْلَكُمْ ثَوَابُ اللَّهِ خَيْرٌ لِمَنْ آمَنَ وَعَمِلَ صَالِحًا وَلَا يُلَقَّاهَا إِلَّا الصَّابِرُونَ'
  trl: 'Wa-qāla lladhīna ūtu l-ʿilma waylakum thawābu llāhi khayrun li-man āmana wa-ʿamila ṣāliḥan wa-lā yulaqqāhā illā ṣ-ṣābirūn'
  trad: 'Et ceux à qui la science avait été donnée dirent : « Malheur à vous (waylakum) ! La rétribution d''Allaah (thawābu llāh) est meilleure, pour qui a cru et agi droitement — et nul n''y parvient (lā yulaqqāhā), sinon les ṣābirūn. »'
- ref: 'S.28:81'
  ar: 'فَخَسَفْنَا بِهِ وَبِدَارِهِ الْأَرْضَ فَمَا كَانَ لَهُ مِنْ فِئَةٍ يَنْصُرُونَهُ مِنْ دُونِ اللَّهِ وَمَا كَانَ مِنَ الْمُنْتَصِرِينَ'
  trl: 'Fa-khasafnā bihi wa-bi-dārihi l-arḑa fa-mā kāna lahu min fiʾatin yanṣurūnahu min dūni llāhi wa-mā kāna mina l-muntaṣirīn'
  trad: 'Nous fîmes alors engloutir (khasafnā) par la terre, lui et sa demeure — il n''eut, en dehors d''Allaah, aucune troupe (fiʾa) pour le secourir, et il ne fut pas du nombre de ceux qui trouvent secours eux-mêmes (al-muntaṣirīn).'
- ref: 'S.28:82'
  ar: 'وَأَصْبَحَ الَّذِينَ تَمَنَّوْا مَكَانَهُ بِالْأَمْسِ يَقُولُونَ وَيْكَأَنَّ اللَّهَ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ ۖ لَوْلَا أَنْ مَنَّ اللَّهُ عَلَيْنَا لَخَسَفَ بِنَا ۖ وَيْكَأَنَّهُ لَا يُفْلِحُ الْكَافِرُونَ'
  trl: 'Wa-aṣbaḥa lladhīna tamannaw makānahu bi-l-amsi yaqūlūna wayka''anna llāha yabsuṭu r-rizqa li-man yashāʾu min ʿibādihi wa-yaqdiru law-lā an manna llāhu ʿalaynā la-khasafa binā wayka''annahu lā yufliḥu l-kāfirūn'
  trad: 'Et ceux qui, hier encore, souhaitaient être à sa place (tamannaw makānahu) se mirent à dire, comme soudain dessillés (wayka''anna) : « Allaah étend le rizq pour qui Il veut, parmi Ses ʿibād, ou Il le resserre (wa-yaqdiru) ! Si Allaah ne nous avait pas comblés d''une faveur [en nous épargnant] (law-lā an manna llāhu ʿalaynā), Il nous aurait engloutis comme lui ! Comme c''est clair, à présent (wayka''annahu) : les kāfirūn ne réussissent pas. »'
- ref: 'S.28:83'
  ar: 'تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا ۚ وَالْعَاقِبَةُ لِلْمُتَّقِينَ'
  trl: 'Tilka d-dāru l-ākhiratu najʿaluhā lilladhīna lā yurīdūna ʿuluwwan fi l-arḑi wa-lā fasādan wa-l-ʿāqibatu li-l-muttaqīn'
  trad: 'Voilà la Demeure dernière (ad-dāru l-ākhira) : Nous la réservons à ceux qui ne recherchent ni domination (ʿuluwwan) sur la terre, ni fasād — et l''issue favorable (al-ʿāqiba) revient aux muttaqīn.'
- ref: 'S.28:84'
  ar: 'مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ خَيْرٌ مِنْهَا ۖ وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَى الَّذِينَ عَمِلُوا السَّيِّئَاتِ إِلَّا مَا كَانُوا يَعْمَلُونَ'
  trl: 'Man jāʾa bi-l-ḥasanati fa-lahu khayrun minhā wa-man jāʾa bi-s-sayyiʾati fa-lā yujzā lladhīna ʿamilū s-sayyiʾāti illā mā kānū yaʿmalūn'
  trad: 'Qui vient avec une bonne action (al-ḥasana) aura mieux qu''elle (khayrun minhā) — et qui vient avec une mauvaise action (as-sayyiʾa), ceux qui ont commis les mauvaises actions ne seront rétribués (lā yujzā) qu''à la mesure de ce qu''ils faisaient.'
- ref: 'S.28:85'
  ar: 'إِنَّ الَّذِي فَرَضَ عَلَيْكَ الْقُرْآنَ لَرَادُّكَ إِلَىٰ مَعَادٍ ۚ قُلْ رَبِّي أَعْلَمُ مَنْ جَاءَ بِالْهُدَىٰ وَمَنْ هُوَ فِي ضَلَالٍ مُبِينٍ'
  trl: 'Inna lladhī faraḑa ʿalayka l-qurʾāna la-rādduka ilā maʿādin qul rabbī aʿlamu man jāʾa bi-l-hudā wa-man huwa fī ḑalālin mubīn'
  trad: 'Ce qui t''a imposé (faraḑa) le Qurʾān te ramènera assurément (la-rādduka) vers un maʿād. Dis : « Mon Rabb sait mieux qui vient avec la guidance (al-hudā), et qui est dans un égarement manifeste (ḑalālin mubīn). »'
- ref: 'S.28:86'
  ar: 'وَمَا كُنْتَ تَرْجُو أَنْ يُلْقَىٰ إِلَيْكَ الْكِتَابُ إِلَّا رَحْمَةً مِنْ رَبِّكَ ۖ فَلَا تَكُونَنَّ ظَهِيرًا لِلْكَافِرِينَ'
  trl: 'Wa-mā kunta tarjū an yulqā ilayka l-kitābu illā raḥmatan min rabbika fa-lā takūnanna ẕahīran li-l-kāfirīn'
  trad: 'Et tu n''espérais (tarjū) nullement que le Kitāb te soit déposé (yulqā ilayka) — sinon comme raḥma venant de ton Rabb. Ne sois donc jamais un soutien (ẕahīran) pour les kāfirūn.'
- ref: 'S.28:87'
  ar: 'وَلَا يَصُدُّنَّكَ عَنْ آيَاتِ اللَّهِ بَعْدَ إِذْ أُنْزِلَتْ إِلَيْكَ ۖ وَادْعُ إِلَىٰ رَبِّكَ ۖ وَلَا تَكُونَنَّ مِنَ الْمُشْرِكِينَ'
  trl: 'Wa-lā yaṣuddannaka ʿan āyāti llāhi baʿda idh unzilat ilayka wa-dʿu ilā rabbika wa-lā takūnanna mina l-mushrikīn'
  trad: 'Et que personne ne te détourne (lā yaṣuddannaka) des āyāt d''Allaah, après qu''elles t''ont été descendues — appelle vers ton Rabb, et ne sois jamais du nombre des mushrikīn.'
- ref: 'S.28:88'
  ar: 'وَلَا تَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ ۘ لَا إِلَٰهَ إِلَّا هُوَ ۚ كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ ۚ لَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ'
  trl: 'Wa-lā tadʿu maʿa llāhi ilāhan ākhara lā ilāha illā huwa kullu shayʾin hālikun illā wajhahu lahu l-ḥukmu wa-ilayhi turjaʿūn'
  trad: 'Et n''invoque, avec Allaah, aucun autre ilāh — nul ilāh que Lui. Toute chose est périssable (hālikun), sinon Son wajh — à Lui le jugement, et c''est à Lui que vous retournez.'
