- ref: S.24:1
  ar: سُورَةٌ أَنْزَلْنَاهَا وَفَرَضْنَاهَا وَأَنْزَلْنَا فِيهَا آيَاتٍ بَيِّنَاتٍ لَعَلَّكُمْ تَذَكَّرُونَ
  trl: Sūratun anzalnāhā wa-faraḍnāhā wa-anzalnā fīhā āyātin bayyinātin laʿallakum tadhakkarūn
  trad: Une sourate (sūra) que Nous avons fait descendre, et que Nous avons rendue obligation fixée (faraḍnāhā) — et Nous avons fait descendre en elle des āyāt manifestes (bayyinātin), afin que vous vous rappeliez (tadhakkarūn).
- ref: S.24:2
  ar: الزَّانِيَةُ وَالزَّانِي فَاجْلِدُوا كُلَّ وَاحِدٍ مِنْهُمَا مِائَةَ جَلْدَةٍ ۖ وَلَا تَأْخُذْكُمْ بِهِمَا رَأْفَةٌ فِي دِينِ اللَّهِ إِنْ كُنْتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۖ وَلْيَشْهَدْ عَذَابَهُمَا طَائِفَةٌ مِنَ الْمُؤْمِنِينَ
  trl: Az-zāniyatu wa-z-zānī fa-jlidū kulla wāḥidin minhumā miʾata jaldatin — wa-lā taʾkhudhkum bihimā raʾfatun fī dīni llāhi in kuntum tuʾminūna bi-llāhi wa-l-yawmi l-ākhir — wa-l-yashhad ʿadhābahumā ṭāʾifatun mina l-muʾminīn
  trad: 'La femme qui commet la zinā et l''homme qui commet la zinā — fouettez (fa-jlidū) chacun des deux de cent coups (miʾata jaldatin). Et qu''aucune raʾfa (compassion attendrie) ne vous saisisse à leur sujet, dans le dīn d''Allaah, si vous croyez en Allaah et au Jour dernier. Et que soit témoin de leur châtiment un groupe (ṭāʾifa) pris parmi les croyants.'
- ref: S.24:3
  ar: الزَّانِي لَا يَنْكِحُ إِلَّا زَانِيَةً أَوْ مُشْرِكَةً وَالزَّانِيَةُ لَا يَنْكِحُهَا إِلَّا زَانٍ أَوْ مُشْرِكٌ ۚ وَحُرِّمَ ذَٰلِكَ عَلَى الْمُؤْمِنِينَ
  trl: Az-zānī lā yankiḥu illā zāniyatan aw mushrikatan — wa-z-zāniyatu lā yankiḥuhā illā zānin aw mushrikun — wa-ḥurrima dhālika ʿalā l-muʾminīn
  trad: 'Celui qui commet la zinā ne s''unit [véritablement], ou : ne doit épouser, qu''à une femme qui commet la zinā ou à une mushrika ; et celle qui commet la zinā, nul ne s''unit [véritablement] à elle, ou : ne doit l''épouser, sinon un homme qui commet la zinā ou un mushrik. Et cela est interdit (ḥurrima) aux croyants.'
- ref: S.24:4
  ar: وَالَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ ثُمَّ لَمْ يَأْتُوا بِأَرْبَعَةِ شُهَدَاءَ فَاجْلِدُوهُمْ ثَمَانِينَ جَلْدَةً وَلَا تَقْبَلُوا لَهُمْ شَهَادَةً أَبَدًا ۚ وَأُولَٰئِكَ هُمُ الْفَاسِقُونَ
  trl: Wa-lladhīna yarmūna l-muḥṣanāti thumma lam yaʾtū bi-arbaʿati shuhadāʾa fa-jlidūhum thamānīna jaldatan wa-lā taqbalū lahum shahādatan abadan — wa-ulāʾika humu l-fāsiqūn
  trad: 'Et ceux qui accusent (yarmūna) les muḥṣanāt, puis ne produisent pas quatre témoins (shuhadāʾ) — fouettez-les de quatre-vingts coups, et n''acceptez plus jamais (abadan) leur témoignage : ceux-là sont eux-mêmes les fāsiqūn.'
- ref: S.24:5
  ar: إِلَّا الَّذِينَ تَابُوا مِنْ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Illā lladhīna tābū min baʿdi dhālika wa-aṣlaḥū fa-inna llāha ghafūrun raḥīm
  trad: '— excepté ceux qui reviennent (tābū) après cela et se réforment (aṣlaḥū) : Allaah est, certes, Ghafūr, Raḥīm.'
- ref: S.24:6–7
  ar: وَالَّذِينَ يَرْمُونَ أَزْوَاجَهُمْ وَلَمْ يَكُنْ لَهُمْ شُهَدَاءُ إِلَّا أَنْفُسُهُمْ فَشَهَادَةُ أَحَدِهِمْ أَرْبَعُ شَهَادَاتٍ بِاللَّهِ ۙ إِنَّهُ لَمِنَ الصَّادِقِينَ وَالْخَامِسَةُ أَنَّ لَعْنَتَ اللَّهِ عَلَيْهِ إِنْ كَانَ مِنَ الْكَاذِبِينَ
  trl: Wa-lladhīna yarmūna azwājahum wa-lam yakun lahum shuhadāʾu illā anfusuhum fa-shahādatu aḥadihim arbaʿu shahādātin bi-llāhi innahu la-mina ṣ-ṣādiqīn — wa-l-khāmisatu anna laʿnata llāhi ʿalayhi in kāna mina l-kādhibīn
  trad: 'Et ceux qui accusent (yarmūna) leurs épouses (azwājahum), sans avoir d''autres témoins qu''eux-mêmes — le témoignage (shahāda) de l''un d''eux sera quatre témoignages (shahādāt) par Allaah, [affirmant] qu''il est assurément parmi les véridiques (ṣādiqīn) — et le cinquième [témoignage affirmant] que la laʿna d''Allaah soit sur lui s''il est parmi les menteurs (kādhibīn).'
- ref: S.24:8–9
  ar: وَيَدْرَأُ عَنْهَا الْعَذَابَ أَنْ تَشْهَدَ أَرْبَعَ شَهَادَاتٍ بِاللَّهِ ۙ إِنَّهُ لَمِنَ الْكَاذِبِينَ وَالْخَامِسَةَ أَنَّ غَضَبَ اللَّهِ عَلَيْهَا إِنْ كَانَ مِنَ الصَّادِقِينَ
  trl: Wa-yadraʾu ʿanhā l-ʿadhāba an tashhada arbaʿa shahādātin bi-llāhi innahu la-mina l-kādhibīn — wa-l-khāmisata anna ghaḍaba llāhi ʿalayhā in kāna mina ṣ-ṣādiqīn
  trad: 'Et ce qui écarte (yadraʾu) d''elle le châtiment, c''est qu''elle témoigne quatre témoignages par Allaah qu''il est assurément parmi les menteurs — et le cinquième [témoignage affirmant] que le ghaḍab d''Allaah soit sur elle s''il est parmi les véridiques.'
- ref: S.24:10
  ar: وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ وَأَنَّ اللَّهَ تَوَّابٌ حَكِيمٌ
  trl: Wa-lawlā faḍlu llāhi ʿalaykum wa-raḥmatuhu wa-anna llāha tawwābun ḥakīm
  trad: 'Et sans la faveur (faḍl) d''Allaah sur vous, et Sa raḥma, et sans qu''Allaah soit at-Tawwāb, al-Ḥakīm...'
- ref: S.24:11
  ar: إِنَّ الَّذِينَ جَاءُوا بِالْإِفْكِ عُصْبَةٌ مِنْكُمْ ۚ لَا تَحْسَبُوهُ شَرًّا لَكُمْ ۖ بَلْ هُوَ خَيْرٌ لَكُمْ ۚ لِكُلِّ امْرِئٍ مِنْهُمْ مَا اكْتَسَبَ مِنَ الْإِثْمِ ۚ وَالَّذِي تَوَلَّىٰ كِبْرَهُ مِنْهُمْ لَهُ عَذَابٌ عَظِيمٌ
  trl: Inna lladhīna jāʾū bi-l-ifki ʿuṣbatun minkum — lā taḥsabūhu sharran lakum bal huwa khayrun lakum — li-kulli mriʾin minhum mā ktasaba mina l-ithmi — wa-lladhī tawallā kibrahu minhum lahu ʿadhābun ʿaẕīm
  trad: 'Certes, ceux qui sont venus avec l''ifk (al-ifk) [sont] une ʿuṣba (groupe soudé) parmi vous. Ne le comptez pas comme un mal pour vous — il est au contraire un bien pour vous. À chacun d''eux [revient] ce qu''il a acquis (mā ktasaba) comme ithm (faute) ; et celui qui, parmi eux, en a assumé la plus grande part (tawallā kibrahu), à lui un châtiment immense.'
- ref: S.24:12–13
  ar: لَوْلَا إِذْ سَمِعْتُمُوهُ ظَنَّ الْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بِأَنْفُسِهِمْ خَيْرًا وَقَالُوا هَٰذَا إِفْكٌ مُبِينٌ لَوْلَا جَاءُوا عَلَيْهِ بِأَرْبَعَةِ شُهَدَاءَ ۚ فَإِذْ لَمْ يَأْتُوا بِالشُّهَدَاءِ فَأُولَٰئِكَ عِنْدَ اللَّهِ هُمُ الْكَاذِبُونَ
  trl: Lawlā idh samiʿtumūhu ẕanna l-muʾminūna wa-l-muʾminātu bi-anfusihim khayran wa-qālū hādhā ifkun mubīn — lawlā jāʾū ʿalayhi bi-arbaʿati shuhadāʾa — fa-idh lam yaʾtū bi-sh-shuhadāʾi fa-ulāʾika ʿinda llāhi humu l-kādhibūn
  trad: 'Que n''ont-ils pas, lorsque vous l''avez entendu, présumé bien d''eux-mêmes (ẕanna ... bi-anfusihim khayran), les croyants et les croyantes, et dit : « Ceci est un ifk manifeste » ? Que n''ont-ils pas produit, à son sujet, quatre shuhadāʾ (témoins) ? Puisqu''ils n''ont pas produit les shuhadāʾ, ceux-là sont, auprès d''Allaah, eux-mêmes les menteurs (al-kādhibūn).'
- ref: S.24:14
  ar: وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ فِي الدُّنْيَا وَالْآخِرَةِ لَمَسَّكُمْ فِي مَا أَفَضْتُمْ فِيهِ عَذَابٌ عَظِيمٌ
  trl: Wa-lawlā faḍlu llāhi ʿalaykum wa-raḥmatuhu fi d-dunyā wa-l-ākhirati la-massakum fī mā afaḑtum fīhi ʿadhābun ʿaẕīm
  trad: 'Et sans la faḑl (faveur) d''Allaah sur vous, et Sa raḥma, dans la vie d''ici-bas et dans l''Au-delà, un châtiment immense vous aurait touchés (la-massakum) pour ce dans quoi vous vous êtes répandus (afaḑtum fīhi).'
- ref: S.24:15
  ar: إِذْ تَلَقَّوْنَهُ بِأَلْسِنَتِكُمْ وَتَقُولُونَ بِأَفْوَاهِكُمْ مَا لَيْسَ لَكُمْ بِهِ عِلْمٌ وَتَحْسَبُونَهُ هَيِّنًا وَهُوَ عِنْدَ اللَّهِ عَظِيمٌ
  trl: Idh talaqqawnahu bi-alsinatikum wa-taqūlūna bi-afwāhikum mā laysa lakum bihi ʿilmun wa-taḥsabūnahu hayyinan wa-huwa ʿinda llāhi ʿaẕīm
  trad: 'Lorsque vous le receviez de bouche à bouche (talaqqawnahu bi-alsinatikum), et que vous disiez de vos bouches ce dont vous n''aviez aucune ʿilm (connaissance) — et vous le comptiez comme hayyin (léger, sans gravité), alors qu''il est, auprès d''Allaah, immense.'
- ref: S.24:16
  ar: وَلَوْلَا إِذْ سَمِعْتُمُوهُ قُلْتُمْ مَا يَكُونُ لَنَا أَنْ نَتَكَلَّمَ بِهَٰذَا سُبْحَانَكَ هَٰذَا بُهْتَانٌ عَظِيمٌ
  trl: Wa-lawlā idh samiʿtumūhu qultum mā yakūnu lanā an natakallama bi-hādhā subḥānaka hādhā buhtānun ʿaẕīm
  trad: 'Et que n''avez-vous pas dit, lorsque vous l''avez entendu : « Il ne nous appartient pas de parler de cela — Subḥānaka (Toi dont on dit que Tu es entièrement dégagé de toute imperfection) ! Ceci est un buhtān (accusation sans fondement) immense » ?'
- ref: S.24:17–18
  ar: يَعِظُكُمُ اللَّهُ أَنْ تَعُودُوا لِمِثْلِهِ أَبَدًا إِنْ كُنْتُمْ مُؤْمِنِينَ وَيُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ ۚ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Yaʿiẕukumu llāhu an taʿūdū li-mithlihi abadan in kuntum muʾminīn — wa-yubayyinu llāhu lakumu l-āyāti — wa-llāhu ʿalīmun ḥakīm
  trad: Allaah vous met en garde (yaʿiẕukum) de ne jamais revenir à son pareil, si vous êtes croyants. Et Allaah rend pour vous les āyāt manifestes (yubayyinu) — Allaah est ʿAlīm (Ce qui sait), Ḥakīm (Ce qui ajuste avec exactitude).
- ref: S.24:19
  ar: إِنَّ الَّذِينَ يُحِبُّونَ أَنْ تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ ۚ وَاللَّهُ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ
  trl: Inna lladhīna yuḥibbūna an tashīʿa l-fāḥishatu fi lladhīna āmanū lahum ʿadhābun alīmun fi d-dunyā wa-l-ākhirati — wa-llāhu yaʿlamu wa-antum lā taʿlamūn
  trad: 'Certes, ceux qui aiment (yuḥibbūna) que la fāḥisha se répande (tashīʿa) parmi ceux qui ont cru auront un châtiment douloureux, dans la vie d''ici-bas et dans l''Au-delà. Et Allaah sait, tandis que vous ne savez pas.'
- ref: S.24:20
  ar: وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ وَأَنَّ اللَّهَ رَءُوفٌ رَحِيمٌ
  trl: Wa-lawlā faḍlu llāhi ʿalaykum wa-raḥmatuhu wa-anna llāha raʾūfun raḥīm
  trad: 'Et sans la faḑl (faveur) d''Allaah sur vous, et Sa raḥma, et sans qu''Allaah soit Raʾūf, Raḥīm...'
- ref: S.24:21
  ar: ۞ يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ وَمَنْ يَتَّبِعْ خُطُوَاتِ الشَّيْطَانِ فَإِنَّهُ يَأْمُرُ بِالْفَحْشَاءِ وَالْمُنْكَرِ ۚ وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ مَا زَكَىٰ مِنْكُمْ مِنْ أَحَدٍ أَبَدًا وَلَٰكِنَّ اللَّهَ يُزَكِّي مَنْ يَشَاءُ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū lā tattabiʿū khuṭuwāti sh-shayṭān — wa-man yattabiʿ khuṭuwāti sh-shayṭāni fa-innahu yaʾmuru bi-l-faḥshāʾi wa-l-munkar — wa-lawlā faḑlu llāhi ʿalaykum wa-raḥmatuhu mā zakā minkum min aḥadin abadan wa-lākinna llāha yuzakkī man yashāʾ — wa-llāhu samīʿun ʿalīm
  trad: 'Ô vous qui avez cru, ne suivez pas les pas (khuṭuwāt) du shayṭān. Quiconque suit les pas du shayṭān — celui-ci lui ordonne la fāḥisha et le munkar. Et sans la faḑl (faveur) d''Allaah sur vous, et Sa raḥma, pas un seul d''entre vous ne se serait jamais purifié (mā zakā) — mais Allaah purifie (yuzakkī) qui Il veut. Allaah est Samīʿ, ʿAlīm.'
- ref: S.24:22
  ar: وَلَا يَأْتَلِ أُولُو الْفَضْلِ مِنْكُمْ وَالسَّعَةِ أَنْ يُؤْتُوا أُولِي الْقُرْبَىٰ وَالْمَسَاكِينَ وَالْمُهَاجِرِينَ فِي سَبِيلِ اللَّهِ ۖ وَلْيَعْفُوا وَلْيَصْفَحُوا ۗ أَلَا تُحِبُّونَ أَنْ يَغْفِرَ اللَّهُ لَكُمْ ۗ وَاللَّهُ غَفُورٌ رَحِيمٌ
  trl: Wa-lā yaʾtali ūlū l-faḑli minkum wa-s-saʿati an yuʾtū ūlī l-qurbā wa-l-masākīna wa-l-muhājirīna fī sabīli llāh — wa-l-yaʿfū wa-l-yaṣfaḥū — a-lā tuḥibbūna an yaghfira llāhu lakum — wa-llāhu ghafūrun raḥīm
  trad: 'Que les gens de faḑl (abondance) et d''aisance (as-saʿa) parmi vous ne se retiennent pas (lā yaʾtali) de donner à ceux de proche parenté (ūlī l-qurbā), aux miséreux (al-masākīn) et à ceux qui ont émigré (al-muhājirīn) dans le sabīl d''Allaah. Qu''ils pardonnent (yaʿfū) et qu''ils passent outre (yaṣfaḥū) ! N''aimez-vous pas qu''Allaah vous pardonne ? Allaah est Ghafūr, Raḥīm.'
- ref: S.24:23
  ar: إِنَّ الَّذِينَ يَرْمُونَ الْمُحْصَنَاتِ الْغَافِلَاتِ الْمُؤْمِنَاتِ لُعِنُوا فِي الدُّنْيَا وَالْآخِرَةِ وَلَهُمْ عَذَابٌ عَظِيمٌ
  trl: Inna lladhīna yarmūna l-muḥṣanāti l-ghāfilāti l-muʾmināti luʿinū fi d-dunyā wa-l-ākhirati wa-lahum ʿadhābun ʿaẕīm
  trad: 'Certes, ceux qui accusent (yarmūna) les muḥṣanāt (femmes protégées par un lien), ghāfilāt (sans méfiance, innocentes), muʾmināt, sont maudits (luʿinū) dans la vie d''ici-bas et dans l''Au-delà — et à eux un châtiment immense.'
- ref: S.24:24–25
  ar: يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُمْ بِمَا كَانُوا يَعْمَلُونَ يَوْمَئِذٍ يُوَفِّيهِمُ اللَّهُ دِينَهُمُ الْحَقَّ وَيَعْلَمُونَ أَنَّ اللَّهَ هُوَ الْحَقُّ الْمُبِينُ
  trl: Yawma tashhadu ʿalayhim alsinatuhum wa-aydīhim wa-arjuluhum bi-mā kānū yaʿmalūn — yawmaʾidhin yuwaffīhimu llāhu dīnahumu l-ḥaqqa wa-yaʿlamūna anna llāha huwa l-ḥaqqu l-mubīn
  trad: 'Le jour où leurs langues, leurs mains et leurs pieds témoigneront contre eux (ʿalayhim) de ce qu''ils faisaient. Ce jour-là, Allaah leur acquittera pleinement (yuwaffīhim) leur dīn exact (al-ḥaqq), et ils sauront qu''Allaah, Lui, est al-Ḥaqq, al-Mubīn (la Vérité manifeste).'
- ref: S.24:26
  ar: الْخَبِيثَاتُ لِلْخَبِيثِينَ وَالْخَبِيثُونَ لِلْخَبِيثَاتِ ۖ وَالطَّيِّبَاتُ لِلطَّيِّبِينَ وَالطَّيِّبُونَ لِلطَّيِّبَاتِ ۚ أُولَٰئِكَ مُبَرَّءُونَ مِمَّا يَقُولُونَ ۖ لَهُمْ مَغْفِرَةٌ وَرِزْقٌ كَرِيمٌ
  trl: Al-khabīthātu li-l-khabīthīna wa-l-khabīthūna li-l-khabīthāt — wa-ṭ-ṭayyibātu li-ṭ-ṭayyibīna wa-ṭ-ṭayyibūna li-ṭ-ṭayyibāt — ulāʾika mubarraʾūna mimmā yaqūlūna lahum maghfiratun wa-rizqun karīm
  trad: 'Les khabīthāt [reviennent] aux khabīthīn, et les khabīthūn [reviennent] aux khabīthāt ; et les ṭayyibāt [reviennent] aux ṭayyibīn, et les ṭayyibūn [reviennent] aux ṭayyibāt. Ceux-là sont déclarés innocents (mubarraʾūn) de ce qu''on dit [contre eux] — à eux pardon (maghfira) et une subsistance (rizq) généreuse (karīm).'
- ref: S.24:27–28
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَدْخُلُوا بُيُوتًا غَيْرَ بُيُوتِكُمْ حَتَّىٰ تَسْتَأْنِسُوا وَتُسَلِّمُوا عَلَىٰ أَهْلِهَا ۚ ذَٰلِكُمْ خَيْرٌ لَكُمْ لَعَلَّكُمْ تَذَكَّرُونَ فَإِنْ لَمْ تَجِدُوا فِيهَا أَحَدًا فَلَا تَدْخُلُوهَا حَتَّىٰ يُؤْذَنَ لَكُمْ ۖ وَإِنْ قِيلَ لَكُمُ ارْجِعُوا فَارْجِعُوا ۖ هُوَ أَزْكَىٰ لَكُمْ ۚ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū lā tadkhulū buyūtan ghayra buyūtikum ḥattā tastaʾnisū wa-tusallimū ʿalā ahlihā — dhālikum khayrun lakum laʿallakum tadhakkarūn — fa-in lam tajidū fīhā aḥadan fa-lā tadkhulūhā ḥattā yuʾdhana lakum — wa-in qīla lakumu rjiʿū fa-rjiʿū — huwa azkā lakum — wa-llāhu bi-mā taʿmalūna ʿalīm
  trad: 'Ô vous qui avez cru, n''entrez pas dans des maisons autres que les vôtres avant d''avoir recherché un accueil (tastaʾnisū) et salué leurs habitants (ahlihā) — cela est meilleur pour vous, puissiez-vous vous en souvenir. Et si vous n''y trouvez personne, n''y entrez pas avant qu''une idhn (autorisation) ne vous soit donnée (yuʾdhana). Et si l''on vous dit : « Retournez », retournez — cela est plus purifiant (azkā) pour vous. Allaah est, de ce que vous faites, ʿAlīm.'
- ref: S.24:29
  ar: لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَدْخُلُوا بُيُوتًا غَيْرَ مَسْكُونَةٍ فِيهَا مَتَاعٌ لَكُمْ ۚ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ
  trl: Laysa ʿalaykum junāḥun an tadkhulū buyūtan ghayra maskūnatin fīhā matāʿun lakum — wa-llāhu yaʿlamu mā tubdūna wa-mā taktumūn
  trad: 'Nulle junāḥ (inclinaison vers la faute) sur vous d''entrer dans des maisons inhabitées où se trouve, pour vous, un matāʿ (bien d''usage). Allaah sait ce que vous montrez et ce que vous cachez.'
- ref: S.24:30
  ar: قُلْ لِلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ۚ ذَٰلِكَ أَزْكَىٰ لَهُمْ ۗ إِنَّ اللَّهَ خَبِيرٌ بِمَا يَصْنَعُونَ
  trl: Qul li-l-muʾminīna yaghuḑḑū min abṣārihim wa-yaḥfaẕū furūjahum — dhālika azkā lahum — inna llāha khabīrun bi-mā yaṣnaʿūn
  trad: 'Dis aux muʾminīn qu''ils restreignent quelque chose de leurs regards (yaghuḑḑū min abṣārihim) et qu''ils gardent (yaḥfaẕū) leurs furūj — cela est plus purifiant (azkā) pour eux. Allaah est Khabīr (Ce qui est informé en détail) de ce qu''ils fabriquent (yaṣnaʿūn).'
- ref: S.24:31
  ar: وَقُلْ لِلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا ۖ وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ ۖ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ آبَائِهِنَّ أَوْ آبَاءِ بُعُولَتِهِنَّ أَوْ أَبْنَائِهِنَّ أَوْ أَبْنَاءِ بُعُولَتِهِنَّ أَوْ إِخْوَانِهِنَّ أَوْ بَنِي إِخْوَانِهِنَّ أَوْ بَنِي أَخَوَاتِهِنَّ أَوْ نِسَائِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَانُهُنَّ أَوِ التَّابِعِينَ غَيْرِ أُولِي الْإِرْبَةِ مِنَ الرِّجَالِ أَوِ الطِّفْلِ الَّذِينَ لَمْ يَظْهَرُوا عَلَىٰ عَوْرَاتِ النِّسَاءِ ۖ وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِنْ زِينَتِهِنَّ ۚ وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَ الْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ
  trl: Wa-qul li-l-muʾmināti yaghḑuḑna min abṣārihinna wa-yaḥfaẕna furūjahunna wa-lā yubdīna zīnatahunna illā mā ẕahara minhā — wa-l-yaḑribna bi-khumurihinna ʿalā juyūbihinna — wa-lā yubdīna zīnatahunna illā li-buʿūlatihinna aw ābāʾihinna aw ābāʾi buʿūlatihinna aw abnāʾihinna aw abnāʾi buʿūlatihinna aw ikhwānihinna aw banī ikhwānihinna aw banī akhawātihinna aw nisāʾihinna aw mā malakat aymānuhunna awi t-tābiʿīna ghayri ulī l-irbati mina r-rijāli awi ṭ-ṭifli lladhīna lam yaẕharū ʿalā ʿawrāti n-nisāʾ — wa-lā yaḑribna bi-arjulihinna li-yuʿlama mā yukhfīna min zīnatihinna — wa-tūbū ilā llāhi jamīʿan ayyuhā l-muʾminūna laʿallakum tufliḥūn
  trad: 'Et dis aux muʾmināt qu''elles restreignent quelque chose de leurs regards et qu''elles gardent leurs furūj, et qu''elles ne manifestent pas leur zīna (parure), si ce n''est ce qui en paraît (mā ẕahara minhā) — et qu''elles disposent leurs khumur sur leurs juyūb (l''ouverture de leur vêtement, à l''encolure) — et qu''elles ne manifestent pas leur zīna, si ce n''est à leurs époux, ou à leurs pères, ou aux pères de leurs époux, ou à leurs fils, ou aux fils de leurs époux, ou à leurs frères, ou aux fils de leurs frères, ou aux fils de leurs sœurs, ou à leurs femmes, ou à mā malakat aymānuhunna, ou aux suivants dépourvus d''irba (désir) parmi les hommes, ou à l''enfant qui n''a pas encore atteint la conscience des ʿawrāt des femmes — et qu''elles ne frappent pas du pied pour faire connaître ce qu''elles cachent de leur zīna. Et revenez tous vers Allaah en tawba, ô muʾminūn, puissiez-vous atteindre le falāḥ.'
- ref: S.24:32
  ar: وَأَنْكِحُوا الْأَيَامَىٰ مِنْكُمْ وَالصَّالِحِينَ مِنْ عِبَادِكُمْ وَإِمَائِكُمْ ۚ إِنْ يَكُونُوا فُقَرَاءَ يُغْنِهِمُ اللَّهُ مِنْ فَضْلِهِ ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ
  trl: Wa-ankiḥū l-ayāmā minkum wa-ṣ-ṣāliḥīna min ʿibādikum wa-imāʾikum — in yakūnū fuqarāʾa yughnihimu llāhu min faḑlihi — wa-llāhu wāsiʿun ʿalīm
  trad: 'Et mariez (ankiḥū) les ayāmā (les personnes sans conjoint) parmi vous, ainsi que les ṣāliḥīn parmi vos ʿibād (captifs) et vos imāʾ (captives). S''ils sont pauvres, Allaah les enrichira de Sa faḑl — Allaah est Wāsiʿ (Ce qui embrasse largement), ʿAlīm.'
- ref: S.24:33
  ar: وَلْيَسْتَعْفِفِ الَّذِينَ لَا يَجِدُونَ نِكَاحًا حَتَّىٰ يُغْنِيَهُمُ اللَّهُ مِنْ فَضْلِهِ ۗ وَالَّذِينَ يَبْتَغُونَ الْكِتَابَ مِمَّا مَلَكَتْ أَيْمَانُكُمْ فَكَاتِبُوهُمْ إِنْ عَلِمْتُمْ فِيهِمْ خَيْرًا ۖ وَآتُوهُمْ مِنْ مَالِ اللَّهِ الَّذِي آتَاكُمْ ۚ وَلَا تُكْرِهُوا فَتَيَاتِكُمْ عَلَى الْبِغَاءِ إِنْ أَرَدْنَ تَحَصُّنًا لِتَبْتَغُوا عَرَضَ الْحَيَاةِ الدُّنْيَا ۚ وَمَنْ يُكْرِهْهُنَّ فَإِنَّ اللَّهَ مِنْ بَعْدِ إِكْرَاهِهِنَّ غَفُورٌ رَحِيمٌ
  trl: Wa-l-yastaʿfifi lladhīna lā yajidūna nikāḥan ḥattā yughniyahumu llāhu min faḑlihi — wa-lladhīna yabtaghūna l-kitāba mimmā malakat aymānukum fa-kātibūhum in ʿalimtum fīhim khayran — wa-ātūhum min māli llāhi lladhī ātākum — wa-lā tukrihū fatayātikum ʿalā l-bighāʾi in aradna taḥaṣṣunan li-tabtaghū ʿaraḑa l-ḥayāti d-dunyā — wa-man yukrihhunna fa-inna llāha min baʿdi ikrāhihinna ghafūrun raḥīm
  trad: 'Et que ceux qui ne trouvent pas de nikāḥ (union) pratiquent l''istiʿfāf (la retenue) jusqu''à ce qu''Allaah les enrichisse de Sa faḑl. Et ceux de vos captifs qui recherchent al-kitāb (le contrat), concluez-le avec eux (fa-kātibūhum) si vous reconnaissez en eux du bien — et donnez-leur sur les biens d''Allaah qu''Il vous a accordés. Et ne contraignez pas vos jeunes captives (fatayātikum) à al-bighāʾ (la prostitution) si elles veulent se préserver (taḥaṣṣunan), pour rechercher [par cela] un bien passager de la vie d''ici-bas — et quiconque les y contraint, alors, après ce qui leur a été infligé par cette contrainte (ikrāhihinna), Allaah est Ghafūr, Raḥīm.'
- ref: S.24:34
  ar: وَلَقَدْ أَنْزَلْنَا إِلَيْكُمْ آيَاتٍ مُبَيِّنَاتٍ وَمَثَلًا مِنَ الَّذِينَ خَلَوْا مِنْ قَبْلِكُمْ وَمَوْعِظَةً لِلْمُتَّقِينَ
  trl: Wa-la-qad anzalnā ilaykum āyātin mubayyinātin wa-mathalan mina lladhīna khalaw min qablikum wa-mawʿiẕatan li-l-muttaqīn
  trad: Et Nous avons certes fait descendre vers vous des āyāt mubayyināt (clarifiantes), un mathal (exemple) de ceux qui ont vécu avant vous (khalaw min qablikum), et une mawʿiẕa (mise en garde) pour les muttaqīn.
- ref: S.24:35
  ar: ۞ اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ ۚ مَثَلُ نُورِهِ كَمِشْكَاةٍ فِيهَا مِصْبَاحٌ ۖ الْمِصْبَاحُ فِي زُجَاجَةٍ ۖ الزُّجَاجَةُ كَأَنَّهَا كَوْكَبٌ دُرِّيٌّ يُوقَدُ مِنْ شَجَرَةٍ مُبَارَكَةٍ زَيْتُونَةٍ لَا شَرْقِيَّةٍ وَلَا غَرْبِيَّةٍ يَكَادُ زَيْتُهَا يُضِيءُ وَلَوْ لَمْ تَمْسَسْهُ نَارٌ ۚ نُورٌ عَلَىٰ نُورٍ ۗ يَهْدِي اللَّهُ لِنُورِهِ مَنْ يَشَاءُ ۚ وَيَضْرِبُ اللَّهُ الْأَمْثَالَ لِلنَّاسِ ۗ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Allāhu nūru s-samāwāti wa-l-arḍi — mathalu nūrihi ka-mishkātin fīhā miṣbāḥun — al-miṣbāḥu fī zujājatin — az-zujājatu ka-annahā kawkabun durriyyun yūqadu min shajaratin mubārakatin zaytūnatin lā sharqiyyatin wa-lā gharbiyyatin yakādu zaytuhā yuḑīʾu wa-law lam tamsashu nārun — nūrun ʿalā nūrin — yahdī llāhu li-nūrihi man yashāʾu — wa-yaḑribu llāhu l-amthāla li-n-nāsi — wa-llāhu bi-kulli shayʾin ʿalīm
  trad: 'Allaah [est] Nūr des cieux et de la terre. La parabole (mathal) de Son Nūr est comme une mishkāh (niche) où se trouve un miṣbāḥ (luminaire) — ce miṣbāḥ est dans une zujāja (un verre) — cette zujāja est comme un kawkabun durriyy (un astre d''un éclat de perle) — allumé à partir d''un arbre béni (shajaratin mubārakatin), un olivier (zaytūna), ni oriental (sharqiyya) ni occidental (gharbiyya) : son huile est sur le point d''illuminer, même si aucun feu ne l''a touchée. Nūr sur Nūr. Allaah guide vers Son Nūr qui Il veut, et Allaah frappe les paraboles (al-amthāl) pour les gens — et Allaah est, de toute chose, ʿAlīm.'
- ref: S.24:36
  ar: فِي بُيُوتٍ أَذِنَ اللَّهُ أَنْ تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ يُسَبِّحُ لَهُ فِيهَا بِالْغُدُوِّ وَالْآصَالِ
  trl: Fī buyūtin adhina llāhu an turfaʿa wa-yudhkara fīhā smuhu — yusabbiḥu lahu fīhā bi-l-ghuduwwi wa-l-āṣāl
  trad: 'Dans des maisons (buyūt) qu''Allaah a autorisées (adhina) à être élevées (turfaʿa), et où Son nom est rappelé (yudhkara) — on Lui accomplit, dans ces maisons, le tasbīḥ, au ghuduww (le commencement du jour) et aux āṣāl (la fin de l''après-midi).'
- ref: S.24:37
  ar: رِجَالٌ لَا تُلْهِيهِمْ تِجَارَةٌ وَلَا بَيْعٌ عَنْ ذِكْرِ اللَّهِ وَإِقَامِ الصَّلَاةِ وَإِيتَاءِ الزَّكَاةِ ۙ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالْأَبْصَارُ
  trl: Rijālun lā tulhīhim tijāratun wa-lā bayʿun ʿan dhikri llāhi wa-iqāmi ṣ-ṣalāti wa-ītāʾi z-zakāti — yakhāfūna yawman tataqallabu fīhi l-qulūbu wa-l-abṣār
  trad: 'Des hommes (rijāl) que ni le négoce (tijāra) ni la vente (bayʿ) ne distraient (lā tulhīhim) du dhikr d''Allaah, de l''établissement de la ṣalāt et du versement de la zakāt — ils craignent un jour où les cœurs et les regards seront bouleversés (tataqallabu).'
- ref: S.24:38
  ar: لِيَجْزِيَهُمُ اللَّهُ أَحْسَنَ مَا عَمِلُوا وَيَزِيدَهُمْ مِنْ فَضْلِهِ ۗ وَاللَّهُ يَرْزُقُ مَنْ يَشَاءُ بِغَيْرِ حِسَابٍ
  trl: Li-yajziyahumu llāhu aḥsana mā ʿamilū wa-yazīdahum min faḑlihi — wa-llāhu yarzuqu man yashāʾu bi-ghayri ḥisāb
  trad: 'Afin qu''Allaah les rétribue (li-yajziyahum) du meilleur de ce qu''ils ont fait, et qu''Il leur ajoute, de Sa faḑl — Allaah pourvoit (yarzuqu) qui Il veut, sans compte (bi-ghayri ḥisāb).'
- ref: S.24:39
  ar: وَالَّذِينَ كَفَرُوا أَعْمَالُهُمْ كَسَرَابٍ بِقِيعَةٍ يَحْسَبُهُ الظَّمْآنُ مَاءً حَتَّىٰ إِذَا جَاءَهُ لَمْ يَجِدْهُ شَيْئًا وَوَجَدَ اللَّهَ عِنْدَهُ فَوَفَّاهُ حِسَابَهُ ۗ وَاللَّهُ سَرِيعُ الْحِسَابِ
  trl: Wa-lladhīna kafarū aʿmāluhum ka-sarābin bi-qīʿatin yaḥsabuhu ẕ-ẕamʾānu māʾan ḥattā idhā jāʾahu lam yajidhu shayʾan wa-wajada llāha ʿindahu fa-waffāhu ḥisābahu — wa-llāhu sarīʿu l-ḥisāb
  trad: 'Et ceux qui ont commis le kufr — leurs œuvres sont comme un sarāb (mirage) sur une qīʿa (plaine nue) : l''assoiffé (aẕ-ẕamʾān) le prend pour de l''eau, jusqu''à ce que, l''ayant atteint, il n''y trouve rien — mais il trouve Allaah auprès de lui (ʿindahu), qui lui règle alors pleinement son compte (fa-waffāhu ḥisābahu). Allaah est prompt dans le compte (sarīʿu l-ḥisāb).'
- ref: S.24:40
  ar: أَوْ كَظُلُمَاتٍ فِي بَحْرٍ لُجِّيٍّ يَغْشَاهُ مَوْجٌ مِنْ فَوْقِهِ مَوْجٌ مِنْ فَوْقِهِ سَحَابٌ ۚ ظُلُمَاتٌ بَعْضُهَا فَوْقَ بَعْضٍ إِذَا أَخْرَجَ يَدَهُ لَمْ يَكَدْ يَرَاهَا ۗ وَمَنْ لَمْ يَجْعَلِ اللَّهُ لَهُ نُورًا فَمَا لَهُ مِنْ نُورٍ
  trl: Aw ka-ẕulumātin fī baḥrin lujjiyyin yaghshāhu mawjun min fawqihi mawjun min fawqihi saḥābun — ẕulumātun baʿḑuhā fawqa baʿḑin idhā akhraja yadahu lam yakad yarāhā — wa-man lam yajʿali llāhu lahu nūran fa-mā lahu min nūr
  trad: 'Ou encore comme des ẕulumāt (ténèbres) en une mer profonde et houleuse (baḥrin lujjiyy) : une vague la recouvre, surmontée d''une autre vague, surmontée d''un nuage — des ténèbres superposées les unes aux autres. Que l''on sorte sa main (yadahu), on ne la voit presque pas. Et à qui Allaah n''a assigné nul nūr, celui-là n''a nul nūr.'
- ref: S.24:41
  ar: أَلَمْ تَرَ أَنَّ اللَّهَ يُسَبِّحُ لَهُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ وَالطَّيْرُ صَافَّاتٍ ۖ كُلٌّ قَدْ عَلِمَ صَلَاتَهُ وَتَسْبِيحَهُ ۗ وَاللَّهُ عَلِيمٌ بِمَا يَفْعَلُونَ
  trl: A-lam tara anna llāha yusabbiḥu lahu man fi s-samāwāti wa-l-arḑi wa-ṭ-ṭayru ṣāffātin — kullun qad ʿalima ṣalātahu wa-tasbīḥahu — wa-llāhu ʿalīmun bi-mā yafʿalūn
  trad: 'N''as-tu pas vu que c''est à Allaah que rendent le tasbīḥ ce qui est dans les cieux et sur la terre, et les oiseaux déployant leurs ailes (ṣāffāt) ? Chacun a déjà connu sa ṣalāt et son tasbīḥ. Allaah est, de ce qu''ils font, ʿAlīm.'
- ref: S.24:42
  ar: وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۖ وَإِلَى اللَّهِ الْمَصِيرُ
  trl: Wa-lillāhi mulku s-samāwāti wa-l-arḑi — wa-ilā llāhi l-maṣīr
  trad: 'À Allaah [appartient] la royauté (mulk) des cieux et de la terre, et c''est vers Allaah qu''est l''aboutissement (al-maṣīr).'
- ref: S.24:43
  ar: أَلَمْ تَرَ أَنَّ اللَّهَ يُزْجِي سَحَابًا ثُمَّ يُؤَلِّفُ بَيْنَهُ ثُمَّ يَجْعَلُهُ رُكَامًا فَتَرَى الْوَدْقَ يَخْرُجُ مِنْ خِلَالِهِ وَيُنَزِّلُ مِنَ السَّمَاءِ مِنْ جِبَالٍ فِيهَا مِنْ بَرَدٍ فَيُصِيبُ بِهِ مَنْ يَشَاءُ وَيَصْرِفُهُ عَنْ مَنْ يَشَاءُ ۖ يَكَادُ سَنَا بَرْقِهِ يَذْهَبُ بِالْأَبْصَارِ
  trl: A-lam tara anna llāha yuzjī saḥāban thumma yuʾallifu baynahu thumma yajʿaluhu rukāman fa-tarā l-wadqa yakhruju min khilālihi wa-yunazzilu mina s-samāʾi min jibālin fīhā min baradin fa-yuṣību bihi man yashāʾu wa-yaṣrifuhu ʿan man yashāʾu — yakādu sanā barqihi yadhhabu bi-l-abṣār
  trad: 'N''as-tu pas vu qu''Allaah fait doucement avancer (yuzjī) des nuées, puis les assemble (yuʾallifu baynahu), puis en fait une masse amoncelée (rukām) — alors tu vois la pluie fine (al-wadq) sortir de leurs interstices (khilāl) ? Et Il fait descendre du ciel, de montagnes [de nuées] où se trouve de la grêle (barad) — Il en atteint qui Il veut, et Il la détourne de qui Il veut. L''éclat de son éclair (sanā barqihi) est sur le point d''emporter les regards.'
- ref: S.24:44
  ar: يُقَلِّبُ اللَّهُ اللَّيْلَ وَالنَّهَارَ ۚ إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِأُولِي الْأَبْصَارِ
  trl: Yuqallibu llāhu l-layla wa-n-nahāra — inna fī dhālika la-ʿibratan li-ulī l-abṣār
  trad: Allaah fait alterner (yuqallibu) la nuit et le jour — il y a assurément en cela une ʿibra (leçon) pour ceux qui ont des regards (ulī l-abṣār).
- ref: S.24:45
  ar: وَاللَّهُ خَلَقَ كُلَّ دَابَّةٍ مِنْ مَاءٍ ۖ فَمِنْهُمْ مَنْ يَمْشِي عَلَىٰ بَطْنِهِ وَمِنْهُمْ مَنْ يَمْشِي عَلَىٰ رِجْلَيْنِ وَمِنْهُمْ مَنْ يَمْشِي عَلَىٰ أَرْبَعٍ ۚ يَخْلُقُ اللَّهُ مَا يَشَاءُ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Wa-llāhu khalaqa kulla dābbatin min māʾin — fa-minhum man yamshī ʿalā baṭnihi wa-minhum man yamshī ʿalā rijlayni wa-minhum man yamshī ʿalā arbaʿin — yakhluqu llāhu mā yashāʾu — inna llāha ʿalā kulli shayʾin qadīr
  trad: 'Et Allaah a créé toute dābba à partir de l''eau — parmi elles, il en est qui marche sur son ventre (baṭnihi), il en est qui marche sur deux pattes (rijlayn), il en est qui marche sur quatre (arbaʿ). Allaah crée ce qu''Il veut — Allaah est, sur toute chose, Qadīr.'
- ref: S.24:46
  ar: لَقَدْ أَنْزَلْنَا آيَاتٍ مُبَيِّنَاتٍ ۚ وَاللَّهُ يَهْدِي مَنْ يَشَاءُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: La-qad anzalnā āyātin mubayyinātin — wa-llāhu yahdī man yashāʾu ilā ṣirāṭin mustaqīm
  trad: Nous avons certes fait descendre des āyāt mubayyināt (clarifiantes), et Allaah guide vers un ṣirāṭ mustaqīm (chemin droit) qui Il veut.
- ref: S.24:47
  ar: وَيَقُولُونَ آمَنَّا بِاللَّهِ وَبِالرَّسُولِ وَأَطَعْنَا ثُمَّ يَتَوَلَّىٰ فَرِيقٌ مِنْهُمْ مِنْ بَعْدِ ذَٰلِكَ ۚ وَمَا أُولَٰئِكَ بِالْمُؤْمِنِينَ
  trl: Wa-yaqūlūna āmannā bi-llāhi wa-bi-r-rasūli wa-aṭaʿnā thumma yatawallā farīqun minhum min baʿdi dhālika — wa-mā ulāʾika bi-l-muʾminīn
  trad: 'Et ils disent : « Nous avons cru en Allaah et au rasūl, et nous avons obéi » — puis un groupe (farīq) parmi eux se détourne après cela. Et ceux-là ne sont pas des muʾminūn.'
- ref: S.24:48–49
  ar: وَإِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ إِذَا فَرِيقٌ مِنْهُمْ مُعْرِضُونَ وَإِنْ يَكُنْ لَهُمُ الْحَقُّ يَأْتُوا إِلَيْهِ مُذْعِنِينَ
  trl: Wa-idhā duʿū ilā llāhi wa-rasūlihi li-yaḥkuma baynahum idhā farīqun minhum muʿriḍūn — wa-in yakun lahumu l-ḥaqqu yaʾtū ilayhi mudhʿinīn
  trad: 'Et quand ils sont appelés (duʿū) vers Allaah et Son rasūl pour qu''il juge (li-yaḥkuma) entre eux, voilà qu''un groupe parmi eux se détourne (muʿriḍūn). Mais si le droit (al-ḥaqq) est en leur faveur, ils viennent à lui en toute soumission empressée (mudhʿinīn).'
- ref: S.24:50
  ar: أَفِي قُلُوبِهِمْ مَرَضٌ أَمِ ارْتَابُوا أَمْ يَخَافُونَ أَنْ يَحِيفَ اللَّهُ عَلَيْهِمْ وَرَسُولُهُ ۚ بَلْ أُولَٰئِكَ هُمُ الظَّالِمُونَ
  trl: A-fī qulūbihim maraḍun ami rtābū am yakhāfūna an yaḥīfa llāhu ʿalayhim wa-rasūluhu — bal ulāʾika humu ẓ-ẓālimūn
  trad: 'Y a-t-il une maladie (maraḍ) dans leurs cœurs ? Ou ont-ils vacillé dans le doute (irtābū) ? Ou craignent-ils qu''Allaah et Son rasūl ne les lèsent par un ḥayf (une déviation injuste) ? Non — ce sont eux les ẓālimūn.'
- ref: S.24:51
  ar: إِنَّمَا كَانَ قَوْلَ الْمُؤْمِنِينَ إِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ أَنْ يَقُولُوا سَمِعْنَا وَأَطَعْنَا ۚ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ
  trl: Innamā kāna qawla l-muʾminīna idhā duʿū ilā llāhi wa-rasūlihi li-yaḥkuma baynahum an yaqūlū samiʿnā wa-aṭaʿnā — wa-ulāʾika humu l-mufliḥūn
  trad: 'La seule parole des muʾminūn, quand ils sont appelés vers Allaah et Son rasūl pour qu''il juge entre eux, est de dire : « Nous avons entendu, et nous avons obéi. » Et ceux-là sont les muflihūn.'
- ref: S.24:52
  ar: وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَٰئِكَ هُمُ الْفَائِزُونَ
  trl: Wa-man yuṭiʿi llāha wa-rasūlahu wa-yakhsha llāha wa-yattaqhi fa-ulāʾika humu l-fāʾizūn
  trad: Et quiconque obéit à Allaah et à Son rasūl, craint (yakhsha) Allaah et se prémunit (yattaqhi) de Lui — ceux-là sont les fāʾizūn (les gagnants).
- ref: S.24:53
  ar: ۞ وَأَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ لَئِنْ أَمَرْتَهُمْ لَيَخْرُجُنَّ ۖ قُلْ لَا تُقْسِمُوا ۖ طَاعَةٌ مَعْرُوفَةٌ ۚ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ
  trl: Wa-aqsamū bi-llāhi jahda aymānihim la-in amartahum la-yakhrujunna — qul lā tuqsimū — ṭāʿatun maʿrūfatun — inna llāha khabīrun bi-mā taʿmalūn
  trad: 'Et ils ont juré par Allaah, avec l''intensité extrême de leurs serments (jahda aymānihim), que si tu les ordonnais, ils sortiraient assurément. Dis : « Ne jurez pas — une obéissance reconnue (ṭāʿatun maʿrūfatun) [suffit]. » Allaah est Khabīr de ce que vous faites.'
- ref: S.24:54
  ar: قُلْ أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ ۖ فَإِنْ تَوَلَّوْا فَإِنَّمَا عَلَيْهِ مَا حُمِّلَ وَعَلَيْكُمْ مَا حُمِّلْتُمْ ۖ وَإِنْ تُطِيعُوهُ تَهْتَدُوا ۚ وَمَا عَلَى الرَّسُولِ إِلَّا الْبَلَاغُ الْمُبِينُ
  trl: Qul aṭīʿu llāha wa-aṭīʿu r-rasūla — fa-in tawallaw fa-innamā ʿalayhi mā ḥummila wa-ʿalaykum mā ḥummiltum — wa-in tuṭīʿūhu tahtadū — wa-mā ʿalā r-rasūli illā l-balāghu l-mubīn
  trad: 'Dis : « Obéissez à Allaah, et obéissez au rasūl. » S''ils se détournent, alors sur lui [pèse] ce dont il a été chargé (mā ḥummila), et sur vous ce dont vous avez été chargés. Et si vous lui obéissez, vous serez guidés (tahtadū). Et le rasūl n''a de charge que le balāgh mubīn (la communication manifeste).'
- ref: S.24:55
  ar: وَعَدَ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَعَمِلُوا الصَّالِحَاتِ لَيَسْتَخْلِفَنَّهُمْ فِي الْأَرْضِ كَمَا اسْتَخْلَفَ الَّذِينَ مِنْ قَبْلِهِمْ وَلَيُمَكِّنَنَّ لَهُمْ دِينَهُمُ الَّذِي ارْتَضَىٰ لَهُمْ وَلَيُبَدِّلَنَّهُمْ مِنْ بَعْدِ خَوْفِهِمْ أَمْنًا ۚ يَعْبُدُونَنِي لَا يُشْرِكُونَ بِي شَيْئًا ۚ وَمَنْ كَفَرَ بَعْدَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْفَاسِقُونَ
  trl: Waʿada llāhu lladhīna āmanū minkum wa-ʿamilū ṣ-ṣāliḥāti la-yastakhlifannahum fi l-arḍi kamā stakhlafa lladhīna min qablihim wa-la-yumakkinanna lahum dīnahumu lladhi rtaḍā lahum wa-la-yubaddilannahum min baʿdi khawfihim amnan — yaʿbudūnanī lā yushrikūna bī shayʾan — wa-man kafara baʿda dhālika fa-ulāʾika humu l-fāsiqūn
  trad: 'Allaah a promis (waʿada) à ceux qui, parmi vous, ont cru et ont accompli les œuvres droites, qu''Il les établira certainement comme successeurs (la-yastakhlifannahum) sur la terre, comme Il a établi comme successeurs ceux d''avant eux ; qu''Il affermira (la-yumakkinanna) pour eux leur dīn, celui qu''Il a agréé (irtaḍā) pour eux ; et qu''Il leur substituera certainement, après leur peur, une sécurité (amn) — à condition qu''ils M''adorent, sans rien M''associer. Et quiconque, après cela, commet le kufr, ceux-là sont les fāsiqūn.'
- ref: S.24:56
  ar: وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَأَطِيعُوا الرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ
  trl: Wa-aqīmu ṣ-ṣalāta wa-ātu z-zakāta wa-aṭīʿu r-rasūla laʿallakum turḥamūn
  trad: 'Et établissez la ṣalāt, et donnez la zakāt, et obéissez au rasūl — puissiez-vous faire l''objet de la raḥma (turḥamūn).'
- ref: S.24:57
  ar: لَا تَحْسَبَنَّ الَّذِينَ كَفَرُوا مُعْجِزِينَ فِي الْأَرْضِ ۚ وَمَأْوَاهُمُ النَّارُ ۖ وَلَبِئْسَ الْمَصِيرُ
  trl: Lā taḥsabanna lladhīna kafarū muʿjizīna fi l-arḍi wa-maʾwāhumu n-nāru wa-la-biʾsa l-maṣīr
  trad: 'Ne pense surtout pas que ceux qui ont commis le kufr réduiront [Allaah] à l''impuissance (muʿjizīn) sur la terre — leur refuge (maʾwā) est le Feu, et quel détestable aboutissement (maṣīr) !'
- ref: S.24:58
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لِيَسْتَأْذِنْكُمُ الَّذِينَ مَلَكَتْ أَيْمَانُكُمْ وَالَّذِينَ لَمْ يَبْلُغُوا الْحُلُمَ مِنْكُمْ ثَلَاثَ مَرَّاتٍ ۚ مِنْ قَبْلِ صَلَاةِ الْفَجْرِ وَحِينَ تَضَعُونَ ثِيَابَكُمْ مِنَ الظَّهِيرَةِ وَمِنْ بَعْدِ صَلَاةِ الْعِشَاءِ ۚ ثَلَاثُ عَوْرَاتٍ لَكُمْ ۚ لَيْسَ عَلَيْكُمْ وَلَا عَلَيْهِمْ جُنَاحٌ بَعْدَهُنَّ ۚ طَوَّافُونَ عَلَيْكُمْ بَعْضُكُمْ عَلَىٰ بَعْضٍ ۚ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Yā ayyuhā lladhīna āmanū li-yastaʾdhinkumu lladhīna malakat aymānukum wa-lladhīna lam yablughū l-ḥuluma minkum thalātha marrātin — min qabli ṣalāti l-fajri wa-ḥīna taḍaʿūna thiyābakum mina ẓ-ẕahīrati wa-min baʿdi ṣalāti l-ʿishāʾi — thalāthu ʿawrātin lakum — laysa ʿalaykum wa-lā ʿalayhim junāḥun baʿdahunna — ṭawwāfūna ʿalaykum baʿḑukum ʿalā baʿḑin — kadhālika yubayyinu llāhu lakumu l-āyāti — wa-llāhu ʿalīmun ḥakīm
  trad: 'Ô vous qui avez cru, que vous demandent la permission (li-yastaʾdhinkum) ceux de mā malakat aymānukum, et ceux parmi vous qui n''ont pas atteint le ḥulum (la puberté), à trois moments : avant la ṣalāt al-fajr, et quand vous retirez vos vêtements à la ẓahīra (le milieu du jour), et après la ṣalāt al-ʿishāʾ — trois ʿawrāt (moments d''intimité) pour vous. Nulle gêne (junāḥ) sur vous ni sur eux en dehors de ces moments : vous circulez (ṭawwāfūn) les uns auprès des autres [à tout autre moment]. Ainsi Allaah vous clarifie les āyāt — Allaah est ʿAlīm, Ḥakīm.'
- ref: S.24:59
  ar: وَإِذَا بَلَغَ الْأَطْفَالُ مِنْكُمُ الْحُلُمَ فَلْيَسْتَأْذِنُوا كَمَا اسْتَأْذَنَ الَّذِينَ مِنْ قَبْلِهِمْ ۚ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Wa-idhā balagha l-aṭfālu minkumu l-ḥuluma fa-l-yastaʾdhinū kamā staʾdhana lladhīna min qablihim — kadhālika yubayyinu llāhu lakum āyātihi — wa-llāhu ʿalīmun ḥakīm
  trad: 'Et quand les enfants parmi vous atteignent le ḥulum, qu''ils demandent alors la permission comme l''ont demandée ceux qui les ont précédés. Ainsi Allaah vous clarifie Ses āyāt — Allaah est ʿAlīm, Ḥakīm.'
- ref: S.24:60
  ar: وَالْقَوَاعِدُ مِنَ النِّسَاءِ اللَّاتِي لَا يَرْجُونَ نِكَاحًا فَلَيْسَ عَلَيْهِنَّ جُنَاحٌ أَنْ يَضَعْنَ ثِيَابَهُنَّ غَيْرَ مُتَبَرِّجَاتٍ بِزِينَةٍ ۖ وَأَنْ يَسْتَعْفِفْنَ خَيْرٌ لَهُنَّ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Wa-l-qawāʿidu mina n-nisāʾi llātī lā yarjūna nikāḥan fa-laysa ʿalayhinna junāḥun an yaḑaʿna thiyābahunna ghayra mutabarrijātin bi-zīnatin — wa-an yastaʿfifna khayrun lahunna — wa-llāhu samīʿun ʿalīm
  trad: 'Et les qawāʿid (les femmes retirées de l''espérance d''un nikāḥ) parmi les femmes, celles qui n''espèrent plus de mariage — nulle gêne sur elles à retirer leurs vêtements [extérieurs], sans faire étalage (ghayra mutabarrijātin) d''une zīna. Mais qu''elles se gardent (yastaʿfifna) est meilleur pour elles. Allaah est Samīʿ, ʿAlīm.'
- ref: S.24:61
  ar: لَيْسَ عَلَى الْأَعْمَىٰ حَرَجٌ وَلَا عَلَى الْأَعْرَجِ حَرَجٌ وَلَا عَلَى الْمَرِيضِ حَرَجٌ وَلَا عَلَىٰ أَنْفُسِكُمْ أَنْ تَأْكُلُوا مِنْ بُيُوتِكُمْ أَوْ بُيُوتِ آبَائِكُمْ أَوْ بُيُوتِ أُمَّهَاتِكُمْ أَوْ بُيُوتِ إِخْوَانِكُمْ أَوْ بُيُوتِ أَخَوَاتِكُمْ أَوْ بُيُوتِ أَعْمَامِكُمْ أَوْ بُيُوتِ عَمَّاتِكُمْ أَوْ بُيُوتِ أَخْوَالِكُمْ أَوْ بُيُوتِ خَالَاتِكُمْ أَوْ مَا مَلَكْتُمْ مَفَاتِحَهُ أَوْ صَدِيقِكُمْ ۚ لَيْسَ عَلَيْكُمْ جُنَاحٌ أَنْ تَأْكُلُوا جَمِيعًا أَوْ أَشْتَاتًا ۚ فَإِذَا دَخَلْتُمْ بُيُوتًا فَسَلِّمُوا عَلَىٰ أَنْفُسِكُمْ تَحِيَّةً مِنْ عِنْدِ اللَّهِ مُبَارَكَةً طَيِّبَةً ۚ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ لَعَلَّكُمْ تَعْقِلُونَ
  trl: Laysa ʿalā l-aʿmā ḥarajun wa-lā ʿalā l-aʿraji ḥarajun wa-lā ʿalā l-marīḑi ḥarajun wa-lā ʿalā anfusikum an taʾkulū min buyūtikum aw buyūti ābāʾikum aw buyūti ummahātikum aw buyūti ikhwānikum aw buyūti akhawātikum aw buyūti aʿmāmikum aw buyūti ʿammātikum aw buyūti akhwālikum aw buyūti khālātikum aw mā malaktum mafātiḥahu aw ṣadīqikum — laysa ʿalaykum junāḥun an taʾkulū jamīʿan aw ashtātan — fa-idhā dakhaltum buyūtan fa-sallimū ʿalā anfusikum taḥiyyatan min ʿindi llāhi mubārakatan ṭayyibatan — kadhālika yubayyinu llāhu lakumu l-āyāti laʿallakum taʿqilūn
  trad: 'Nulle gêne (ḥaraj) sur l''aveugle (al-aʿmā), nulle gêne sur le boiteux (al-aʿraj), nulle gêne sur le malade (al-marīḑ), ni sur vous-mêmes, à manger dans vos propres maisons, ou les maisons de vos pères, ou les maisons de vos mères, ou les maisons de vos frères, ou les maisons de vos sœurs, ou les maisons de vos oncles paternels, ou les maisons de vos tantes paternelles, ou les maisons de vos oncles maternels, ou les maisons de vos tantes maternelles, ou ce dont vous possédez les clés (mā malaktum mafātiḥahu), ou [la maison] de votre ami (ṣadīq). Nulle gêne sur vous à manger ensemble ou séparément. Et quand vous entrez dans des maisons, saluez-vous les uns les autres (sallimū ʿalā anfusikum) d''une salutation (taḥiyya) venant d''auprès d''Allaah (min ʿindi llāh), bénie (mubāraka) et bonne (ṭayyiba). Ainsi Allaah vous clarifie les āyāt, puissiez-vous raisonner.'
- ref: S.24:62
  ar: إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ وَإِذَا كَانُوا مَعَهُ عَلَىٰ أَمْرٍ جَامِعٍ لَمْ يَذْهَبُوا حَتَّىٰ يَسْتَأْذِنُوهُ ۚ إِنَّ الَّذِينَ يَسْتَأْذِنُونَكَ أُولَٰئِكَ الَّذِينَ يُؤْمِنُونَ بِاللَّهِ وَرَسُولِهِ ۚ فَإِذَا اسْتَأْذَنُوكَ لِبَعْضِ شَأْنِهِمْ فَأْذَنْ لِمَنْ شِئْتَ مِنْهُمْ وَاسْتَغْفِرْ لَهُمُ اللَّهَ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Innamā l-muʾminūna lladhīna āmanū bi-llāhi wa-rasūlihi wa-idhā kānū maʿahu ʿalā amrin jāmiʿin lam yadhhabū ḥattā yastaʾdhinūhu — inna lladhīna yastaʾdhinūnaka ulāʾika lladhīna yuʾminūna bi-llāhi wa-rasūlihi — fa-idhā staʾdhanūka li-baʿḑi shaʾnihim fa-ʾdhan li-man shiʾta minhum wa-staghfir lahumu llāha — inna llāha ghafūrun raḥīm
  trad: 'Les muʾminūn ne sont que ceux qui ont cru en Allaah et en Son rasūl, et qui, lorsqu''ils sont avec lui sur une affaire commune (amrin jāmiʿin), ne partent pas avant de lui avoir demandé la permission. Ceux qui te demandent la permission, ceux-là sont ceux qui croient en Allaah et en Son rasūl. Et s''ils te demandent la permission pour une de leurs affaires (baʿḑi shaʾnihim), donne permission à qui tu veux parmi eux, et demande pardon pour eux à Allaah : Allaah est Ghafūr, Raḥīm.'
- ref: S.24:63
  ar: لَا تَجْعَلُوا دُعَاءَ الرَّسُولِ بَيْنَكُمْ كَدُعَاءِ بَعْضِكُمْ بَعْضًا ۚ قَدْ يَعْلَمُ اللَّهُ الَّذِينَ يَتَسَلَّلُونَ مِنْكُمْ لِوَاذًا ۚ فَلْيَحْذَرِ الَّذِينَ يُخَالِفُونَ عَنْ أَمْرِهِ أَنْ تُصِيبَهُمْ فِتْنَةٌ أَوْ يُصِيبَهُمْ عَذَابٌ أَلِيمٌ
  trl: Lā tajʿalū duʿāʾa r-rasūli baynakum ka-duʿāʾi baʿḑikum baʿḑan — qad yaʿlamu llāhu lladhīna yatasallalūna minkum liwādhan — fa-l-yaḥdhari lladhīna yukhālifūna ʿan amrihi an tuṣībahum fitnatun aw yuṣībahum ʿadhābun alīm
  trad: 'Ne traitez pas l''appel du rasūl, entre vous, comme l''appel de certains d''entre vous à d''autres. Allaah connaît assurément (qad yaʿlamu) ceux d''entre vous qui se dérobent furtivement (yatasallalūna … liwādhan). Que ceux qui s''opposent à son ordre (yukhālifūna ʿan amrihi) prennent garde qu''une fitna ne les atteigne, ou qu''un châtiment douloureux (ʿadhābun alīm) ne les atteigne.'
- ref: S.24:64
  ar: أَلَا إِنَّ لِلَّهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ قَدْ يَعْلَمُ مَا أَنْتُمْ عَلَيْهِ وَيَوْمَ يُرْجَعُونَ إِلَيْهِ فَيُنَبِّئُهُمْ بِمَا عَمِلُوا ۗ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Alā inna li-llāhi mā fi s-samāwāti wa-l-arḑi — qad yaʿlamu mā antum ʿalayhi wa-yawma yurjaʿūna ilayhi fa-yunabbiʾuhum bi-mā ʿamilū — wa-llāhu bi-kulli shayʾin ʿalīm
  trad: 'N''est-ce pas ? À Allaah [appartient] ce qui est dans les cieux et sur la terre. Il sait assurément (qad yaʿlamu) ce sur quoi vous êtes ; et le jour où ils seront ramenés (yurjaʿūna) vers Lui, Il les informera (fa-yunabbiʾuhum) de ce qu''ils ont fait. Allaah est, de toute chose, ʿAlīm.'
