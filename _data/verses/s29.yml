- ref: 'S.29:1'
  ar: 'الم'
  trl: 'Alif-Lām-Mīm'
  trad: 'Alif. Lām. Mīm.'
- ref: 'S.29:2'
  ar: 'أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ'
  trl: 'A-ḥasiba n-nāsu an yutrakū an yaqūlū āmannā wa-hum lā yuftanūn'
  trad: 'Les gens pensent-ils (a-ḥasiba) qu''il leur suffira de dire : « Nous croyons », pour qu''on les laisse (yutrakū) sans qu''ils soient éprouvés (lā yuftanūn) ?'
- ref: 'S.29:3'
  ar: 'وَلَقَدْ فَتَنَّا الَّذِينَ مِنْ قَبْلِهِمْ ۖ فَلَيَعْلَمَنَّ اللَّهُ الَّذِينَ صَدَقُوا وَلَيَعْلَمَنَّ الْكَاذِبِينَ'
  trl: 'Wa-la-qad fatannā lladhīna min qablihim — fa-la-yaʿlamanna llāhu lladhīna ṣadaqū wa-la-yaʿlamanna l-kādhibīn'
  trad: 'Et Nous avons certes éprouvé (fatannā) ceux qui les ont précédés — Allaah saura très certainement qui a été véridique (ṣadaqū), et Il saura très certainement qui sont les menteurs (al-kādhibīn).'
- ref: 'S.29:4'
  ar: 'أَمْ حَسِبَ الَّذِينَ يَعْمَلُونَ السَّيِّئَاتِ أَنْ يَسْبِقُونَا ۚ سَاءَ مَا يَحْكُمُونَ'
  trl: 'Am ḥasiba lladhīna yaʿmalūna s-sayyiʾāti an yasbiqūnā — sāʾa mā yaḥkumūn'
  trad: 'Ou bien ceux qui commettent les mauvaises actions (as-sayyiʾāt) pensent-ils Nous devancer (an yasbiqūnā) ? Combien est mauvais ce qu''ils jugent (mā yaḥkumūn) !'
- ref: 'S.29:5–6'
  ar: 'مَنْ كَانَ يَرْجُو لِقَاءَ اللَّهِ فَإِنَّ أَجَلَ اللَّهِ لَآتٍ ۚ وَهُوَ السَّمِيعُ الْعَلِيمُ وَمَنْ جَاهَدَ فَإِنَّمَا يُجَاهِدُ لِنَفْسِهِ ۚ إِنَّ اللَّهَ لَغَنِيٌّ عَنِ الْعَالَمِينَ'
  trl: 'Man kāna yarjū liqāʾa llāhi fa-inna ajala llāhi la-ātin — wa-huwa s-samīʿu l-ʿalīm — wa-man jāhada fa-innamā yujāhidu li-nafsihi — inna llāha la-ghaniyyun ʿani l-ʿālamīn'
  trad: 'Quiconque espère la rencontre (liqāʾ) d''Allaah — le terme (ajal) fixé par Allaah vient certainement. Il est as-Samīʿ, al-ʿAlīm. Et quiconque s''évertue (jāhada) ne s''évertue que pour lui-même — Allaah Se suffit à Lui-même (ghaniyy), sans besoin des ʿālamīn.'
- ref: 'S.29:7'
  ar: 'وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَنُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلَنَجْزِيَنَّهُمْ أَحْسَنَ الَّذِي كَانُوا يَعْمَلُونَ'
  trl: 'Wa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti la-nukaffiranna ʿanhum sayyiʾātihim wa-la-najziyannahum aḥsana lladhī kānū yaʿmalūn'
  trad: 'Et ceux qui ont cru et accompli les œuvres droites (aṣ-ṣāliḥāt) — Nous effacerons certainement loin d''eux (la-nukaffiranna ʿanhum) leurs mauvaises actions, et Nous les rétribuerons certainement du meilleur de ce qu''ils faisaient.'
- ref: 'S.29:8'
  ar: 'وَوَصَّيْنَا الْإِنْسَانَ بِوَالِدَيْهِ حُسْنًا ۖ وَإِنْ جَاهَدَاكَ لِتُشْرِكَ بِي مَا لَيْسَ لَكَ بِهِ عِلْمٌ فَلَا تُطِعْهُمَا ۚ إِلَيَّ مَرْجِعُكُمْ فَأُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ'
  trl: 'Wa-waṣṣaynā l-insāna bi-wālidayhi ḥusnan — wa-in jāhadāka li-tushrika bī mā laysa laka bihi ʿilmun fa-lā tuṭiʿhumā — ilayya marjiʿukum fa-unabbiʾukum bi-mā kuntum taʿmalūn'
  trad: 'Et Nous avons enjoint (waṣṣaynā) à l''humain (al-insān), envers ses deux parents (wālidayhi), la bienveillance (ḥusnan). Mais s''ils s''évertuent contre toi (jāhadāka) pour que tu M''associes (li-tushrika bī) ce dont tu n''as aucun ʿilm — ne leur obéis pas. C''est vers Moi qu''est votre retour (marjiʿukum), et Je vous informerai alors de ce que vous faisiez.'
- ref: 'S.29:9'
  ar: 'وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَنُدْخِلَنَّهُمْ فِي الصَّالِحِينَ'
  trl: 'Wa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti la-nudkhilannahum fi ṣ-ṣāliḥīn'
  trad: 'Et ceux qui ont cru et accompli les œuvres droites — Nous les ferons certainement entrer parmi les ṣāliḥūn.'
- ref: 'S.29:10'
  ar: 'وَمِنَ النَّاسِ مَنْ يَقُولُ آمَنَّا بِاللَّهِ فَإِذَا أُوذِيَ فِي اللَّهِ جَعَلَ فِتْنَةَ النَّاسِ كَعَذَابِ اللَّهِ وَلَئِنْ جَاءَ نَصْرٌ مِنْ رَبِّكَ لَيَقُولُنَّ إِنَّا كُنَّا مَعَكُمْ ۚ أَوَلَيْسَ اللَّهُ بِأَعْلَمَ بِمَا فِي صُدُورِ الْعَالَمِينَ'
  trl: 'Wa-mina n-nāsi man yaqūlu āmannā bi-llāhi fa-idhā ūdhiya fi llāhi jaʿala fitnata n-nāsi ka-ʿadhābi llāhi — wa-la-in jāʾa naṣrun min rabbika la-yaqūlunna innā kunnā maʿakum — awa laysa llāhu bi-aʿlama bi-mā fī ṣudūri l-ʿālamīn'
  trad: 'Et parmi les gens, il en est qui disent : « Nous croyons en Allaah » — mais si on lui fait du tort (ūdhiya) pour la cause d''Allaah, il place la fitna des gens au même rang que le châtiment d''Allaah. Et si un secours (naṣr) vient de ton Rabb, ils diront très certainement : « Nous étions avec vous. » Allaah n''est-Il donc pas le plus savant (bi-aʿlama) de ce qui est dans les poitrines (ṣudūr) des ʿālamīn ?'
- ref: 'S.29:11'
  ar: 'وَلَيَعْلَمَنَّ اللَّهُ الَّذِينَ آمَنُوا وَلَيَعْلَمَنَّ الْمُنَافِقِينَ'
  trl: 'Wa-la-yaʿlamanna llāhu lladhīna āmanū wa-la-yaʿlamanna l-munāfiqīn'
  trad: 'Et Allaah saura très certainement qui sont ceux qui ont cru, et Il saura très certainement qui sont les munāfiqūn.'
- ref: 'S.29:12'
  ar: 'وَقَالَ الَّذِينَ كَفَرُوا لِلَّذِينَ آمَنُوا اتَّبِعُوا سَبِيلَنَا وَلْنَحْمِلْ خَطَايَاكُمْ وَمَا هُمْ بِحَامِلِينَ مِنْ خَطَايَاهُمْ مِنْ شَيْءٍ ۖ إِنَّهُمْ لَكَاذِبُونَ'
  trl: 'Wa-qāla lladhīna kafarū li-lladhīna āmanū ttabiʿū sabīlanā wa-l-naḥmil khaṭāyākum — wa-mā hum bi-ḥāmilīna min khaṭāyāhum min shayʾin — innahum la-kādhibūn'
  trad: 'Et ceux qui ont commis le kufr dirent à ceux qui ont cru : « Suivez notre chemin, et nous porterons vos fautes (khaṭāyā) » — alors qu''ils ne porteront rien de leurs fautes (khaṭāyāhum) : ils sont certes des menteurs (kādhibūn).'
- ref: 'S.29:13'
  ar: 'وَلَيَحْمِلُنَّ أَثْقَالَهُمْ وَأَثْقَالًا مَعَ أَثْقَالِهِمْ ۖ وَلَيُسْأَلُنَّ يَوْمَ الْقِيَامَةِ عَمَّا كَانُوا يَفْتَرُونَ'
  trl: 'Wa-la-yaḥmilunna athqālahum wa-athqālan maʿa athqālihim — wa-la-yusʾalunna yawma l-qiyāmati ʿammā kānū yaftarūn'
  trad: 'Ils porteront très certainement leurs propres fardeaux (athqāl), et des fardeaux ajoutés à leurs fardeaux — et ils seront très certainement questionnés, au Jour de la Résurrection, sur ce qu''ils avaient inventé (yaftarūn).'
- ref: 'S.29:14'
  ar: 'وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا فَأَخَذَهُمُ الطُّوفَانُ وَهُمْ ظَالِمُونَ'
  trl: 'Wa-la-qad arsalnā nūḥan ilā qawmihi fa-labitha fīhim alfa sanatin illā khamsīna ʿāman fa-akhadhahumu ṭ-ṭūfānu wa-hum ẕālimūn'
  trad: 'Et Nous avons certes envoyé Nūḥ vers son peuple (qawmihi) ; il demeura (labitha) parmi eux mille ans, moins cinquante années — puis le ṭūfān les saisit (akhadhahumu), alors qu''ils étaient ẕālimūn (injustes).'
- ref: 'S.29:15'
  ar: 'فَأَنْجَيْنَاهُ وَأَصْحَابَ السَّفِينَةِ وَجَعَلْنَاهَا آيَةً لِلْعَالَمِينَ'
  trl: 'Fa-anjaynāhu wa-aṣḥāba s-safīnati wa-jaʿalnāhā āyatan li-l-ʿālamīn'
  trad: 'Nous le sauvâmes alors (anjaynāhu), lui et les occupants du bateau (aṣḥāba s-safīnati), et Nous fîmes de celui-ci un signe (āya) pour les ʿālamīn.'
- ref: 'S.29:16'
  ar: 'وَإِبْرَاهِيمَ إِذْ قَالَ لِقَوْمِهِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ ۖ ذَٰلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ'
  trl: 'Wa-ibrāhīma idh qāla li-qawmihi ʿbudū llāha wa-ttaqūhu — dhālikum khayrun lakum in kuntum taʿlamūn'
  trad: 'Et Ibrāhīm, quand il dit à son peuple : « Adorez (ʿbudū) Allaah, et prémunissez-vous (wa-ttaqūhu) de Lui — cela est meilleur pour vous, si vous le savez (taʿlamūn). »'
- ref: 'S.29:17'
  ar: 'إِنَّمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ أَوْثَانًا وَتَخْلُقُونَ إِفْكًا ۚ إِنَّ الَّذِينَ تَعْبُدُونَ مِنْ دُونِ اللَّهِ لَا يَمْلِكُونَ لَكُمْ رِزْقًا فَابْتَغُوا عِنْدَ اللَّهِ الرِّزْقَ وَاعْبُدُوهُ وَاشْكُرُوا لَهُ ۖ إِلَيْهِ تُرْجَعُونَ'
  trl: 'Innamā taʿbudūna min dūni llāhi awthānan wa-takhluqūna ifkan — inna lladhīna taʿbudūna min dūni llāhi lā yamlikūna lakum rizqan fa-btaghū ʿinda llāhi r-rizqa wa-ʿbudūhu wa-shkurū lahu — ilayhi turjaʿūn'
  trad: 'Vous n''adorez, en dehors d''Allaah, que des idoles (awthān), et vous fabriquez (takhluqūna) un ifk (un mensonge forgé par inversion du vrai). Ceux que vous adorez en dehors d''Allaah ne possèdent (lā yamlikūna) pour vous aucun rizq — recherchez donc (fa-btaghū) le rizq auprès d''Allaah, adorez-Le, et soyez-Lui reconnaissants (wa-shkurū) : c''est vers Lui que vous serez ramenés (turjaʿūn).'
- ref: 'S.29:18'
  ar: 'وَإِنْ تُكَذِّبُوا فَقَدْ كَذَّبَ أُمَمٌ مِنْ قَبْلِكُمْ ۖ وَمَا عَلَى الرَّسُولِ إِلَّا الْبَلَاغُ الْمُبِينُ'
  trl: 'Wa-in tukadhdhibū fa-qad kadhdhaba umamun min qablikum — wa-mā ʿalā r-rasūli illā l-balāghu l-mubīn'
  trad: 'Et si vous démentez (tukadhdhibū), d''autres nations (umam) ont déjà démenti avant vous — et il n''incombe au rasūl que la transmission manifeste (al-balāgh al-mubīn).'
- ref: 'S.29:19–20'
  ar: 'أَوَلَمْ يَرَوْا كَيْفَ يُبْدِئُ اللَّهُ الْخَلْقَ ثُمَّ يُعِيدُهُ ۚ إِنَّ ذَٰلِكَ عَلَى اللَّهِ يَسِيرٌ قُلْ سِيرُوا فِي الْأَرْضِ فَانْظُرُوا كَيْفَ بَدَأَ الْخَلْقَ ۚ ثُمَّ اللَّهُ يُنْشِئُ النَّشْأَةَ الْآخِرَةَ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ'
  trl: 'A-wa-lam yarau kayfa yubdiʾu llāhu l-khalqa thumma yuʿīduhu — inna dhālika ʿalā llāhi yasīr — qul sīrū fi l-arḑi fa-nẕurū kayfa badaʾa l-khalqa — thumma llāhu yunshiʾu n-nashʾata l-ākhirata — inna llāha ʿalā kulli shayʾin qadīr'
  trad: 'N''ont-ils donc pas vu comment Allaah commence (yubdiʾu) la création (al-khalq), puis la répète (yuʿīduhu) ? Cela est certes facile (yasīr) pour Allaah. Dis : « Parcourez la terre, et voyez comment Il a commencé (badaʾa) la création » — ensuite Allaah fera naître l''autre genèse (yunshiʾu n-nashʾata l-ākhirata). Allaah a pouvoir (qadīr) sur toute chose.'
- ref: 'S.29:21'
  ar: 'يُعَذِّبُ مَنْ يَشَاءُ وَيَرْحَمُ مَنْ يَشَاءُ ۖ وَإِلَيْهِ تُقْلَبُونَ'
  trl: 'Yuʿadhdhibu man yashāʾu wa-yarḥamu man yashāʾu — wa-ilayhi tuqlabūn'
  trad: 'Il châtie (yuʿadhdhibu) qui Il veut, et Il fait miséricorde (yarḥamu) à qui Il veut — et c''est vers Lui que vous serez retournés (tuqlabūn).'
- ref: 'S.29:22'
  ar: 'وَمَا أَنْتُمْ بِمُعْجِزِينَ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ۖ وَمَا لَكُمْ مِنْ دُونِ اللَّهِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ'
  trl: 'Wa-mā antum bi-muʿjizīna fi l-arḑi wa-lā fi s-samāʾi — wa-mā lakum min dūni llāhi min waliyyin wa-lā naṣīr'
  trad: 'Et vous n''êtes pas de ceux qui peuvent échapper (bi-muʿjizīna), ni dans la terre ni dans le ciel — et vous n''avez, en dehors d''Allaah, ni walī (allié protecteur) ni naṣīr (secoureur).'
- ref: 'S.29:23'
  ar: 'وَالَّذِينَ كَفَرُوا بِآيَاتِ اللَّهِ وَلِقَائِهِ أُولَٰئِكَ يَئِسُوا مِنْ رَحْمَتِي وَأُولَٰئِكَ لَهُمْ عَذَابٌ أَلِيمٌ'
  trl: 'Wa-lladhīna kafarū bi-āyāti llāhi wa-liqāʾihi ulāʾika yaʾisū min raḥmatī wa-ulāʾika lahum ʿadhābun alīm'
  trad: 'Et ceux qui rejettent (kafarū) les āyāt d''Allaah et Sa rencontre (liqāʾ) — ceux-là désespèrent (yaʾisū) de Ma raḥma, et ceux-là ont un châtiment (ʿadhāb) douloureux (alīm).'
- ref: 'S.29:24'
  ar: 'فَمَا كَانَ جَوَابَ قَوْمِهِ إِلَّا أَنْ قَالُوا اقْتُلُوهُ أَوْ حَرِّقُوهُ فَأَنْجَاهُ اللَّهُ مِنَ النَّارِ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يُؤْمِنُونَ'
  trl: 'Fa-mā kāna jawāba qawmihi illā an qālū qtulūhu aw ḥarriqūhu fa-anjāhu llāhu mina n-nāri — inna fī dhālika la-āyātin li-qawmin yuʾminūn'
  trad: 'La réponse (jawāb) de son peuple ne fut alors que de dire : « Tuez-le (qtulūhu), ou brûlez-le (ḥarriqūhu) ! » — mais Allaah le sauva (anjāhu) du feu. Il y a certes là des āyāt pour un peuple qui croit (yuʾminūn).'
- ref: 'S.29:25'
  ar: 'وَقَالَ إِنَّمَا اتَّخَذْتُمْ مِنْ دُونِ اللَّهِ أَوْثَانًا مَوَدَّةَ بَيْنِكُمْ فِي الْحَيَاةِ الدُّنْيَا ۖ ثُمَّ يَوْمَ الْقِيَامَةِ يَكْفُرُ بَعْضُكُمْ بِبَعْضٍ وَيَلْعَنُ بَعْضُكُمْ بَعْضًا وَمَأْوَاكُمُ النَّارُ وَمَا لَكُمْ مِنْ نَاصِرِينَ'
  trl: 'Wa-qāla innamā ttakhadhtum min dūni llāhi awthānan mawaddata baynikum fi l-ḥayāti d-dunyā — thumma yawma l-qiyāmati yakfuru baʿḑukum bi-baʿḑin wa-yalʿanu baʿḑukum baʿḑan wa-maʾwākumu n-nāru wa-mā lakum min nāṣirīn'
  trad: 'Et il dit : « Vous n''avez pris, en dehors d''Allaah, des idoles (awthān) que pour une affection (mawadda) entre vous, dans la vie d''ici-bas — puis, au Jour de la Résurrection, les uns d''entre vous renieront les autres (yakfuru baʿḑukum bi-baʿḑin), et les uns maudiront les autres (yalʿanu baʿḑukum baʿḑan) ; votre refuge (maʾwā) sera le Feu, et vous n''aurez aucun secoureur (nāṣirīn). »'
- ref: 'S.29:26'
  ar: 'فَآمَنَ لَهُ لُوطٌ ۘ وَقَالَ إِنِّي مُهَاجِرٌ إِلَىٰ رَبِّي ۖ إِنَّهُ هُوَ الْعَزِيزُ الْحَكِيمُ'
  trl: 'Fa-āmana lahu lūṭun — wa-qāla innī muhājirun ilā rabbī — innahu huwa l-ʿazīzu l-ḥakīm'
  trad: 'Lūṭ crut alors en lui (āmana lahu) ; et [Ibrāhīm] dit : « Je suis un émigré (muhājir) vers mon Rabb — c''est Lui, al-ʿAzīz, al-Ḥakīm. »'
- ref: 'S.29:27'
  ar: 'وَوَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ وَجَعَلْنَا فِي ذُرِّيَّتِهِ النُّبُوَّةَ وَالْكِتَابَ وَآتَيْنَاهُ أَجْرَهُ فِي الدُّنْيَا ۖ وَإِنَّهُ فِي الْآخِرَةِ لَمِنَ الصَّالِحِينَ'
  trl: 'Wa-wahabnā lahu isḥāqa wa-yaʿqūba wa-jaʿalnā fī dhurriyyatihi n-nubuwwata wa-l-kitāba wa-ātaynāhu ajrahu fi d-dunyā — wa-innahu fi l-ākhirati la-mina ṣ-ṣāliḥīn'
  trad: 'Et Nous lui avons fait don (wahabnā) d''Isḥāq et de Yaʿqūb, et Nous avons placé, dans sa descendance (dhurriyyatihi), la nubuwwa et le Kitāb ; et Nous lui avons donné sa rétribution (ajrahu) dans la vie d''ici-bas — et il est certes, dans l''Au-delà (al-ākhira), parmi les ṣāliḥūn.'
- ref: 'S.29:28'
  ar: 'وَلُوطًا إِذْ قَالَ لِقَوْمِهِ إِنَّكُمْ لَتَأْتُونَ الْفَاحِشَةَ مَا سَبَقَكُمْ بِهَا مِنْ أَحَدٍ مِنَ الْعَالَمِينَ'
  trl: 'Wa-lūṭan idh qāla li-qawmihi innakum la-taʾtūna l-fāḥishata mā sabaqakum bihā min aḥadin mina l-ʿālamīn'
  trad: 'Et Lūṭ — quand il dit à son peuple : « Vous commettez certainement la fāḥisha ; nul, parmi les ʿālamīn, ne vous y a précédés (mā sabaqakum bihā min aḥadin). »'
- ref: 'S.29:29'
  ar: 'أَئِنَّكُمْ لَتَأْتُونَ الرِّجَالَ وَتَقْطَعُونَ السَّبِيلَ وَتَأْتُونَ فِي نَادِيكُمُ الْمُنْكَرَ ۖ فَمَا كَانَ جَوَابَ قَوْمِهِ إِلَّا أَنْ قَالُوا ائْتِنَا بِعَذَابِ اللَّهِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ'
  trl: 'A-innakum la-taʾtūna r-rijāla wa-taqṭaʿūna s-sabīla wa-taʾtūna fī nādīkumu l-munkara — fa-mā kāna jawāba qawmihi illā an qālū ʾtinā bi-ʿadhābi llāhi in kunta mina ṣ-ṣādiqīn'
  trad: '« Allez-vous donc aux hommes (ar-rijāl), interceptez-vous la voie (taqṭaʿūna s-sabīl), et commettez-vous, dans votre assemblée (nādīkum), le munkar ? » La réponse (jawāb) de son peuple ne fut alors que de dire : « Apporte-nous le châtiment d''Allaah, si tu es du nombre des véridiques (aṣ-ṣādiqīn) ! »'
- ref: 'S.29:30'
  ar: 'قَالَ رَبِّ انْصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ'
  trl: 'Qāla rabbi nṣurnī ʿalā l-qawmi l-mufsidīn'
  trad: 'Il dit : « Mon Rabb, secours-moi (unṣurnī) contre le peuple corrupteur (al-qawm al-mufsidīn). »'
- ref: 'S.29:31'
  ar: 'وَلَمَّا جَاءَتْ رُسُلُنَا إِبْرَاهِيمَ بِالْبُشْرَىٰ قَالُوا إِنَّا مُهْلِكُو أَهْلِ هَذِهِ الْقَرْيَةِ ۖ إِنَّ أَهْلَهَا كَانُوا ظَالِمِينَ'
  trl: 'Wa-lammā jāʾat rusulunā ibrāhīma bi-l-bushrā qālū innā muhlikū ahli hādhihi l-qaryati inna ahlahā kānū ẕālimīn'
  trad: 'Et lorsque Nos envoyés (rusulunā) vinrent à Ibrāhīm avec l''heureuse annonce (al-bushrā), ils dirent : « Nous allons certes détruire (muhlikū) les habitants de cette cité (hādhihi l-qarya) — ses habitants sont certes ẕālimūn. »'
- ref: 'S.29:32'
  ar: 'قَالَ إِنَّ فِيهَا لُوطًا ۚ قَالُوا نَحْنُ أَعْلَمُ بِمَنْ فِيهَا ۖ لَنُنَجِّيَنَّهُ وَأَهْلَهُ إِلَّا امْرَأَتَهُ كَانَتْ مِنَ الْغَابِرِينَ'
  trl: 'Qāla inna fīhā lūṭan qālū naḥnu aʿlamu bi-man fīhā la-nunajjiyannahu wa-ahlahu illā mraʾatahu kānat mina l-ghābirīn'
  trad: 'Il dit : « Lūṭ est certes en elle. » Ils dirent : « Nous savons mieux (naḥnu aʿlamu) qui s''y trouve — Nous le sauverons certainement (la-nunajjiyannahu), lui et sa famille, sauf son épouse : elle est du nombre de ceux qui restent en arrière (al-ghābirīn). »'
- ref: 'S.29:33'
  ar: 'وَلَمَّا أَنْ جَاءَتْ رُسُلُنَا لُوطًا سِيءَ بِهِمْ وَضَاقَ بِهِمْ ذَرْعًا وَقَالُوا لَا تَخَفْ وَلَا تَحْزَنْ ۖ إِنَّا مُنَجُّوكَ وَأَهْلَكَ إِلَّا امْرَأَتَكَ كَانَتْ مِنَ الْغَابِرِينَ'
  trl: 'Wa-lammā an jāʾat rusulunā lūṭan sīʾa bihim wa-ḑāqa bihim dharʿan wa-qālū lā takhaf wa-lā taḥzan innā munajjūka wa-ahlaka illā mraʾataka kānat mina l-ghābirīn'
  trad: 'Et lorsque Nos envoyés vinrent à Lūṭ, il fut affligé (sīʾa) à cause d''eux, et sa capacité s''en trouva resserrée (ḑāqa bihim dharʿan) ; ils dirent : « Ne crains pas, et ne t''afflige pas (lā taḥzan) — nous te sauverons certainement, toi et ta famille, sauf ton épouse : elle est du nombre de ceux qui restent en arrière. »'
- ref: 'S.29:34'
  ar: 'إِنَّا مُنْزِلُونَ عَلَىٰ أَهْلِ هَذِهِ الْقَرْيَةِ رِجْزًا مِنَ السَّمَاءِ بِمَا كَانُوا يَفْسُقُونَ'
  trl: 'Innā munzilūna ʿalā ahli hādhihi l-qaryati rijzan mina s-samāʾi bi-mā kānū yafsuqūn'
  trad: '« Nous ferons descendre sur les habitants de cette cité un rijz [fléau] venu du ciel, à cause de ce qu''ils commettaient comme fisq. »'
- ref: 'S.29:35'
  ar: 'وَلَقَدْ تَرَكْنَا مِنْهَا آيَةً بَيِّنَةً لِقَوْمٍ يَعْقِلُونَ'
  trl: 'Wa-la-qad taraknā minhā āyatan bayyinatan li-qawmin yaʿqilūn'
  trad: 'Et Nous avons certes laissé, d''elle, un signe (āya) manifeste (bayyina) pour un peuple qui raisonne (yaʿqilūn).'
- ref: 'S.29:36'
  ar: 'وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا فَقَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ وَارْجُوا الْيَوْمَ الْآخِرَ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ'
  trl: 'Wa-ilā madyana akhāhum shuʿayban fa-qāla yā qawmi ʿbudū llāha wa-rjū l-yawma l-ākhira wa-lā taʿthaw fi l-arḑi mufsidīn'
  trad: 'Et à Madyan [Nous avons envoyé] leur frère (akhāhum) Shuʿayb ; il dit : « Ô mon peuple, adorez Allaah, espérez (wa-rjū) le Jour Dernier, et ne répandez pas le désordre (lā taʿthaw) sur la terre en mufsidīn. »'
- ref: 'S.29:37'
  ar: 'فَكَذَّبُوهُ فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي دَارِهِمْ جَاثِمِينَ'
  trl: 'Fa-kadhdhabūhu fa-akhadhathumu r-rajfatu fa-aṣbaḥū fī dārihim jāthimīn'
  trad: 'Ils le traitèrent de menteur — la secousse (ar-rajfa) les saisit alors, et ils se retrouvèrent, dans leur demeure, gisant à terre, immobiles (jāthimīn).'
- ref: 'S.29:38'
  ar: 'وَعَادًا وَثَمُودَ وَقَدْ تَبَيَّنَ لَكُمْ مِنْ مَسَاكِنِهِمْ ۖ وَزَيَّنَ لَهُمُ الشَّيْطَانُ أَعْمَالَهُمْ فَصَدَّهُمْ عَنِ السَّبِيلِ وَكَانُوا مُسْتَبْصِرِينَ'
  trl: 'Wa-ʿādan wa-thamūda wa-qad tabayyana lakum min masākinihim wa-zayyana lahumu sh-shayṭānu aʿmālahum fa-ṣaddahum ʿani s-sabīli wa-kānū mustabṣirīn'
  trad: 'Et ʿĀd et Thamūd — cela vous est certes devenu manifeste (tabayyana) par leurs demeures (masākinihim) ; le shayṭān leur a embelli (zayyana) leurs actions, et les a détournés du chemin (ṣaddahum ʿani s-sabīl), alors qu''ils étaient pourtant doués de clairvoyance (mustabṣirīn).'
- ref: 'S.29:39'
  ar: 'وَقَارُونَ وَفِرْعَوْنَ وَهَامَانَ ۖ وَلَقَدْ جَاءَهُمْ مُوسَىٰ بِالْبَيِّنَاتِ فَاسْتَكْبَرُوا فِي الْأَرْضِ وَمَا كَانُوا سَابِقِينَ'
  trl: 'Wa-qāruna wa-firʿawna wa-hāmāna wa-la-qad jāʾahum mūsā bi-l-bayyināti fa-stakbarū fi l-arḑi wa-mā kānū sābiqīn'
  trad: 'Et Qārūn, Firʿawn et Hāmān — Mūsā leur vint certes avec les preuves manifestes (al-bayyināt), mais ils s''enflèrent d''orgueil (fa-stakbarū) sur la terre ; et ils ne furent pas de ceux qui échappent (sābiqīn).'
- ref: 'S.29:40'
  ar: 'فَكُلًّا أَخَذْنَا بِذَنْبِهِ ۖ فَمِنْهُمْ مَنْ أَرْسَلْنَا عَلَيْهِ حَاصِبًا وَمِنْهُمْ مَنْ أَخَذَتْهُ الصَّيْحَةُ وَمِنْهُمْ مَنْ خَسَفْنَا بِهِ الْأَرْضَ وَمِنْهُمْ مَنْ أَغْرَقْنَا ۚ وَمَا كَانَ اللَّهُ لِيَظْلِمَهُمْ وَلَكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ'
  trl: 'Fa-kullan akhadhnā bi-dhanbihi fa-minhum man arsalnā ʿalayhi ḥāṣiban wa-minhum man akhadhathu ṣ-ṣayḥatu wa-minhum man khasafnā bihi l-arḑa wa-minhum man aghraqnā wa-mā kāna llāhu li-yaẕlimahum wa-lākin kānū anfusahum yaẕlimūn'
  trad: 'Chacun, Nous l''avons saisi pour sa faute (bi-dhanbihi) : parmi eux, qui Nous avons fait frapper par une tempête de pierres (ḥāṣib) ; parmi eux, qui le Cri (aṣ-ṣayḥa) a saisi ; parmi eux, qui Nous avons fait engloutir par la terre (khasafnā bihi l-arḑ) ; et parmi eux, qui Nous avons noyé (aghraqnā). Et Allaah n''était pas de nature à leur faire subir un ẕulm — mais c''étaient eux-mêmes qui se faisaient subir ce ẕulm.'
- ref: 'S.29:41'
  ar: 'مَثَلُ الَّذِينَ اتَّخَذُوا مِنْ دُونِ اللَّهِ أَوْلِيَاءَ كَمَثَلِ الْعَنْكَبُوتِ اتَّخَذَتْ بَيْتًا ۖ وَإِنَّ أَوْهَنَ الْبُيُوتِ لَبَيْتُ الْعَنْكَبُوتِ ۖ لَوْ كَانُوا يَعْلَمُونَ'
  trl: 'Mathalu lladhīna ttakhadhū min dūni llāhi awliyāʾa ka-mathali l-ʿankabūti ttakhadhat baytan wa-inna awhana l-buyūti la-baytu l-ʿankabūti law kānū yaʿlamūn'
  trad: 'La parabole (mathal) de ceux qui ont pris, en dehors d''Allaah, des awliyāʾ [protecteurs] est semblable à la parabole de l''araignée (al-ʿankabūt), qui se prend une maison (baytan) — et la plus fragile (awhan) des maisons est certes la maison de l''araignée, s''ils savaient !'
- ref: 'S.29:42'
  ar: 'إِنَّ اللَّهَ يَعْلَمُ مَا يَدْعُونَ مِنْ دُونِهِ مِنْ شَيْءٍ ۚ وَهُوَ الْعَزِيزُ الْحَكِيمُ'
  trl: 'Inna llāha yaʿlamu mā yadʿūna min dūnihi min shayʾin wa-huwa l-ʿazīzu l-ḥakīm'
  trad: 'Allaah sait certes ce qu''ils invoquent, en dehors de Lui, quelle que soit la chose (min shayʾin) — et Il est al-ʿAzīz, al-Ḥakīm.'
- ref: 'S.29:43'
  ar: 'وَتِلْكَ الْأَمْثَالُ نَضْرِبُهَا لِلنَّاسِ ۖ وَمَا يَعْقِلُهَا إِلَّا الْعَالِمُونَ'
  trl: 'Wa-tilka l-amthālu naḑribuhā li-n-nāsi wa-mā yaʿqiluhā illā l-ʿālimūn'
  trad: 'Et ces paraboles (al-amthāl), Nous les proposons (naḑribuhā) aux gens — mais seuls les détenteurs du savoir (al-ʿālimūn) en saisissent le sens (yaʿqiluhā).'
- ref: 'S.29:44'
  ar: 'خَلَقَ اللَّهُ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ ۚ إِنَّ فِي ذَٰلِكَ لَآيَةً لِلْمُؤْمِنِينَ'
  trl: 'Khalaqa llāhu s-samāwāti wa-l-arḑa bi-l-ḥaqqi inna fī dhālika la-āyatan li-l-muʾminīn'
  trad: 'Allaah a créé (khalaqa) les cieux et la terre avec le ḥaqq (bi-l-ḥaqq) — il y a certes là un signe (āya) pour les muʾminūn.'
- ref: 'S.29:45'
  ar: 'اتْلُ مَا أُوحِيَ إِلَيْكَ مِنَ الْكِتَابِ وَأَقِمِ الصَّلَاةَ ۖ إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ ۗ وَلَذِكْرُ اللَّهِ أَكْبَرُ ۗ وَاللَّهُ يَعْلَمُ مَا تَصْنَعُونَ'
  trl: 'Utlu mā ūḥiya ilayka mina l-kitābi wa-aqimi ṣ-ṣalāta inna ṣ-ṣalāta tanhā ʿani l-faḥshāʾi wa-l-munkari wa-la-dhikru llāhi akbaru wa-llāhu yaʿlamu mā taṣnaʿūn'
  trad: 'Récite (utlu) ce qui t''a été révélé (ūḥiya) du Kitāb, et accomplis la ṣalāt — la ṣalāt interdit (tanhā) la fāḥisha et le munkar — et le dhikr [rappel] d''Allaah est plus grand (akbar) — et Allaah sait ce que vous faites (taṣnaʿūn).'
- ref: 'S.29:46'
  ar: '۞ وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ ۖ وَقُولُوا آمَنَّا بِالَّذِي أُنْزِلَ إِلَيْنَا وَأُنْزِلَ إِلَيْكُمْ وَإِلَٰهُنَا وَإِلَٰهُكُمْ وَاحِدٌ وَنَحْنُ لَهُ مُسْلِمُونَ'
  trl: 'Wa-lā tujādilū ahla l-kitābi illā bi-llatī hiya aḥsanu illā lladhīna ẕalamū minhum wa-qūlū āmannā bi-lladhī unzila ilaynā wa-unzila ilaykum wa-ilāhunā wa-ilāhukum wāḥidun wa-naḥnu lahu muslimūn'
  trad: 'Et ne disputez (lā tujādilū) avec les Ahl al-Kitāb [les gens auxquels un Kitāb a été donné] que par la manière la meilleure (bi-llatī hiya aḥsan) — sauf ceux d''entre eux qui commettent le ẕulm — et dites : « Nous croyons en ce qui nous a été descendu et en ce qui vous a été descendu ; notre ilāh et votre ilāh sont un seul (wāḥid), et nous Lui sommes soumis (muslimūn). »'
- ref: 'S.29:47'
  ar: 'وَكَذَٰلِكَ أَنْزَلْنَا إِلَيْكَ الْكِتَابَ ۚ فَالَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يُؤْمِنُونَ بِهِ ۖ وَمِنْ هَٰؤُلَاءِ مَنْ يُؤْمِنُ بِهِ ۚ وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا الْكَافِرُونَ'
  trl: 'Wa-ka-dhālika anzalnā ilayka l-kitāba fa-lladhīna ātaynāhumu l-kitāba yuʾminūna bihi wa-min hāʾulāʾi man yuʾminu bihi wa-mā yajḥadu bi-āyātinā illā l-kāfirūn'
  trad: 'Et c''est ainsi (ka-dhālika) que Nous avons fait descendre vers toi le Kitāb — ceux à qui Nous avons donné le Kitāb y croient, et parmi ceux-ci (hāʾulāʾi), il en est qui y croient — et seuls les kāfirūn renient (yajḥadu) Nos āyāt.'
- ref: 'S.29:48'
  ar: 'وَمَا كُنْتَ تَتْلُو مِنْ قَبْلِهِ مِنْ كِتَابٍ وَلَا تَخُطُّهُ بِيَمِينِكَ ۖ إِذًا لَارْتَابَ الْمُبْطِلُونَ'
  trl: 'Wa-mā kunta tatlū min qablihi min kitābin wa-lā takhuṭṭuhu bi-yamīnika idhan la-rtāba l-mubṭilūn'
  trad: 'Et tu ne récitais (tatlū) aucun kitāb avant lui (min qablihi), et tu ne l''écrivais (takhuṭṭuhu) pas de ta main droite (bi-yamīnika) — autrement (idhan), les mubṭilūn [ceux qui tiennent pour vain/faux] auraient certainement douté (la-rtāba).'
- ref: 'S.29:49'
  ar: 'بَلْ هُوَ آيَاتٌ بَيِّنَاتٌ فِي صُدُورِ الَّذِينَ أُوتُوا الْعِلْمَ ۚ وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا الظَّالِمُونَ'
  trl: 'Bal huwa āyātun bayyinātun fī ṣudūri lladhīna ūtū l-ʿilma wa-mā yajḥadu bi-āyātinā illā ẕ-ẕālimūn'
  trad: 'Il est plutôt (bal) des āyāt bayyināt [manifestes], dans les poitrines (ṣudūr) de ceux à qui le ʿilm a été donné — et seuls les ẕālimūn renient Nos āyāt.'
- ref: 'S.29:50'
  ar: 'وَقَالُوا لَوْلَا أُنْزِلَ عَلَيْهِ آيَاتٌ مِنْ رَبِّهِ ۖ قُلْ إِنَّمَا الْآيَاتُ عِنْدَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُبِينٌ'
  trl: 'Wa-qālū law-lā unzila ʿalayhi āyātun min rabbihi qul innamā l-āyātu ʿinda llāhi wa-innamā ana nadhīrun mubīn'
  trad: 'Et ils dirent : « Si seulement (law-lā) des āyāt lui avaient été descendues, de son Rabb ! » Dis : « Les āyāt ne sont qu''auprès d''Allaah (ʿinda llāh), et je ne suis qu''un nadhīr mubīn [avertisseur manifeste]. »'
- ref: 'S.29:51'
  ar: 'أَوَلَمْ يَكْفِهِمْ أَنَّا أَنْزَلْنَا عَلَيْكَ الْكِتَابَ يُتْلَىٰ عَلَيْهِمْ ۚ إِنَّ فِي ذَٰلِكَ لَرَحْمَةً وَذِكْرَىٰ لِقَوْمٍ يُؤْمِنُونَ'
  trl: 'A-wa-lam yakfihim annā anzalnā ʿalayka l-kitāba yutlā ʿalayhim inna fī dhālika la-raḥmatan wa-dhikrā li-qawmin yuʾminūn'
  trad: 'Ne leur suffit-il donc pas (a-wa-lam yakfihim) que Nous ayons fait descendre sur toi le Kitāb, récité (yutlā) sur eux ? Il y a certes là une raḥma et un rappel (dhikrā) pour un peuple qui croit.'
- ref: 'S.29:52'
  ar: 'قُلْ كَفَىٰ بِاللَّهِ بَيْنِي وَبَيْنَكُمْ شَهِيدًا ۖ يَعْلَمُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۗ وَالَّذِينَ آمَنُوا بِالْبَاطِلِ وَكَفَرُوا بِاللَّهِ أُولَٰئِكَ هُمُ الْخَاسِرُونَ'
  trl: 'Qul kafā bi-llāhi baynī wa-baynakum shahīdan yaʿlamu mā fī s-samāwāti wa-l-arḑi wa-lladhīna āmanū bi-l-bāṭili wa-kafarū bi-llāhi ulāʾika humu l-khāsirūn'
  trad: 'Dis : « Allaah suffit (kafā) comme témoin (shahīd) entre moi et vous. » Il sait ce qui est dans les cieux et la terre. Et ceux qui croient au bāṭil et commettent le kufr envers Allaah, ceux-là sont les khāsirūn [perdants].'
- ref: 'S.29:53'
  ar: 'وَيَسْتَعْجِلُونَكَ بِالْعَذَابِ ۚ وَلَوْلَا أَجَلٌ مُسَمًّى لَجَاءَهُمُ الْعَذَابُ وَلَيَأْتِيَنَّهُمْ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ'
  trl: 'Wa-yastaʿjilūnaka bi-l-ʿadhābi wa-law-lā ajalun musamman la-jāʾahumu l-ʿadhābu wa-la-yaʾtiyannahum baghtatan wa-hum lā yashʿurūn'
  trad: 'Et ils te demandent de hâter (yastaʿjilūnaka) le châtiment — et si un terme fixé (ajalun musamman) n''existait pas, le châtiment leur serait déjà venu ; et il leur viendra très certainement de façon soudaine (baghtatan), sans qu''ils en aient conscience (lā yashʿurūn).'
- ref: 'S.29:54'
  ar: 'يَسْتَعْجِلُونَكَ بِالْعَذَابِ وَإِنَّ جَهَنَّمَ لَمُحِيطَةٌ بِالْكَافِرِينَ'
  trl: 'Yastaʿjilūnaka bi-l-ʿadhābi wa-inna jahannama la-muḥīṭatun bi-l-kāfirīn'
  trad: 'Ils te demandent de hâter le châtiment — et Jahannam cerne certainement (la-muḥīṭatun) déjà les kāfirūn.'
- ref: 'S.29:55'
  ar: 'يَوْمَ يَغْشَاهُمُ الْعَذَابُ مِنْ فَوْقِهِمْ وَمِنْ تَحْتِ أَرْجُلِهِمْ وَيَقُولُ ذُوقُوا مَا كُنْتُمْ تَعْمَلُونَ'
  trl: 'Yawma yaghshāhumu l-ʿadhābu min fawqihim wa-min taḥti arjulihim wa-yaqūlu dhūqū mā kuntum taʿmalūn'
  trad: 'Le jour où le châtiment les enveloppera (yaghshāhum) d''au-dessus d''eux et de sous leurs pieds, et qu''il sera dit : « Goûtez (dhūqū) ce que vous faisiez ! »'
- ref: 'S.29:56'
  ar: 'يَا عِبَادِيَ الَّذِينَ آمَنُوا إِنَّ أَرْضِي وَاسِعَةٌ فَإِيَّايَ فَاعْبُدُونِ'
  trl: 'Yā ʿibādiya lladhīna āmanū inna arḑī wāsiʿatun fa-iyyāya fa-ʿbudūn'
  trad: 'Ô Mes ʿibād [serviteurs] qui avez cru, Ma terre (arḑī) est certes vaste (wāsiʿa) — adorez-Moi donc, Moi seul (fa-iyyāya fa-ʿbudūn).'
- ref: 'S.29:57'
  ar: 'كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ۖ ثُمَّ إِلَيْنَا تُرْجَعُونَ'
  trl: 'Kullu nafsin dhāʾiqatu l-mawti thumma ilaynā turjaʿūn'
  trad: 'Toute âme (nafs) goûtera (dhāʾiqatu) la mort — puis c''est vers Nous que vous serez ramenés (turjaʿūn).'
- ref: 'S.29:58'
  ar: 'وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَنُبَوِّئَنَّهُمْ مِنَ الْجَنَّةِ غُرَفًا تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا ۚ نِعْمَ أَجْرُ الْعَامِلِينَ'
  trl: 'Wa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti la-nubawwiʾannahum mina l-jannati ghurafan tajrī min taḥtihā l-anhāru khālidīna fīhā niʿma ajru l-ʿāmilīn'
  trad: 'Et ceux qui ont cru et accompli les œuvres droites (aṣ-ṣāliḥāt) — Nous les installerons certainement (la-nubawwiʾannahum), de la Jannah, dans des chambres hautes (ghurafan) sous lesquelles coulent les rivières, demeurant (khālidīn) en elles pour toujours — combien est bonne (niʿma) la rétribution (ajr) de ceux qui agissent (al-ʿāmilīn) !'
- ref: 'S.29:59'
  ar: 'الَّذِينَ صَبَرُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ'
  trl: 'Al-ladhīna ṣabarū wa-ʿalā rabbihim yatawakkalūn'
  trad: 'Ceux qui ont été patients (ṣabarū) et qui s''en remettent (yatawakkalūn) à leur Rabb.'
- ref: 'S.29:60'
  ar: 'وَكَأَيِّنْ مِنْ دَابَّةٍ لَا تَحْمِلُ رِزْقَهَا اللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ ۚ وَهُوَ السَّمِيعُ الْعَلِيمُ'
  trl: 'Wa-kaʾayyin min dābbatin lā taḥmilu rizqahā llāhu yarzuquhā wa-iyyākum wa-huwa s-samīʿu l-ʿalīm'
  trad: 'Et combien de dābba [créature qui se meut] ne portent pas (lā taḥmilu) leur propre rizq — Allaah la nourrit (yarzuquhā), elle et vous — et Il est as-Samīʿ, al-ʿAlīm.'
- ref: 'S.29:61'
  ar: 'وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ ۖ فَأَنَّىٰ يُؤْفَكُونَ'
  trl: 'Wa-la-in saʾaltahum man khalaqa s-samāwāti wa-l-arḑa wa-sakhkhara sh-shamsa wa-l-qamara la-yaqūlunna llāhu fa-annā yuʾfakūn'
  trad: 'Et si tu leur demandes : « Qui a créé les cieux et la terre, et asservi (sakhkhara) le soleil et la lune ? » ils diront très certainement : « Allaah. » Comment donc se laissent-ils détourner (yuʾfakūn) ?'
- ref: 'S.29:62'
  ar: 'اللَّهُ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ لَهُ ۚ إِنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ'
  trl: 'Allāhu yabsuṭu r-rizqa li-man yashāʾu min ʿibādihi wa-yaqdiru lahu inna llāha bi-kulli shayʾin ʿalīm'
  trad: 'Allaah étend (yabsuṭu) le rizq à qui Il veut parmi Ses ʿibād, et Il le mesure strictement (yaqdiru lahu) — Allaah est, de toute chose, ʿAlīm.'
- ref: 'S.29:63'
  ar: 'وَلَئِنْ سَأَلْتَهُمْ مَنْ نَزَّلَ مِنَ السَّمَاءِ مَاءً فَأَحْيَا بِهِ الْأَرْضَ مِنْ بَعْدِ مَوْتِهَا لَيَقُولُنَّ اللَّهُ ۚ قُلِ الْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْقِلُونَ'
  trl: 'Wa-la-in saʾaltahum man nazzala mina s-samāʾi māʾan fa-aḥyā bihi l-arḑa min baʿdi mawtihā la-yaqūlunna llāhu quli l-ḥamdu lillāhi bal aktharuhum lā yaʿqilūn'
  trad: 'Et si tu leur demandes : « Qui a fait descendre, du ciel, une eau, puis a fait vivre (aḥyā) par elle la terre après sa mort ? » ils diront très certainement : « Allaah. » Dis : « al-Ḥamdu lillāh [la louange est à Allaah] ! » Mais la plupart d''entre eux ne raisonnent pas (lā yaʿqilūn).'
- ref: 'S.29:64'
  ar: 'وَمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا إِلَّا لَهْوٌ وَلَعِبٌ ۚ وَإِنَّ الدَّارَ الْآخِرَةَ لَهِيَ الْحَيَوَانُ ۚ لَوْ كَانُوا يَعْلَمُونَ'
  trl: 'Wa-mā hādhihi l-ḥayātu d-dunyā illā lahwun wa-laʿibun wa-inna d-dāra l-ākhirata la-hiya l-ḥayawānu law kānū yaʿlamūn'
  trad: 'Et cette vie d''ici-bas (al-ḥayāt ad-dunyā) n''est que divertissement (lahw) et jeu (laʿib) — et la Demeure dernière (ad-dār al-ākhira) est certes, elle, al-Ḥayawān [la vie véritable, dans sa plénitude] — s''ils savaient !'
- ref: 'S.29:65'
  ar: 'فَإِذَا رَكِبُوا فِي الْفُلْكِ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ فَلَمَّا نَجَّاهُمْ إِلَى الْبَرِّ إِذَا هُمْ يُشْرِكُونَ'
  trl: 'Fa-idhā rakibū fi l-fulki daʿawu llāha mukhliṣīna lahu d-dīna fa-lammā najjāhum ilā l-barri idhā hum yushrikūn'
  trad: 'Et quand ils embarquent (rakibū) sur le bateau (al-fulk), ils invoquent Allaah en Lui rendant exclusif (mukhliṣīna) le dīn — puis, lorsqu''Il les a sauvés (najjāhum) vers la terre ferme (al-barr), voilà qu''ils commettent le shirk (yushrikūn).'
- ref: 'S.29:66'
  ar: 'لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ وَلِيَتَمَتَّعُوا ۖ فَسَوْفَ يَعْلَمُونَ'
  trl: 'Li-yakfurū bi-mā ātaynāhum wa-li-yatamattaʿū fa-sawfa yaʿlamūn'
  trad: 'Pour qu''ils renient (li-yakfurū) ce que Nous leur avons donné, et qu''ils jouissent (li-yatamattaʿū) — ils sauront bientôt (fa-sawfa yaʿlamūn).'
- ref: 'S.29:67'
  ar: 'أَوَلَمْ يَرَوْا أَنَّا جَعَلْنَا حَرَمًا آمِنًا وَيُتَخَطَّفُ النَّاسُ مِنْ حَوْلِهِمْ ۚ أَفَبِالْبَاطِلِ يُؤْمِنُونَ وَبِنِعْمَةِ اللَّهِ يَكْفُرُونَ'
  trl: 'A-wa-lam yarau annā jaʿalnā ḥaraman āminan wa-yutakhaṭṭafu n-nāsu min ḥawlihim a-fa-bi-l-bāṭili yuʾminūna wa-bi-niʿmati llāhi yakfurūn'
  trad: 'N''ont-ils donc pas vu que Nous avons fait un ḥaram [lieu déclaré protégé] sûr (āminan), alors que les gens sont arrachés (yutakhaṭṭafu) autour d''eux ? Croient-ils donc au bāṭil, et renient-ils le bienfait (niʿma) d''Allaah ?'
- ref: 'S.29:68'
  ar: 'وَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا أَوْ كَذَّبَ بِالْحَقِّ لَمَّا جَاءَهُ ۚ أَلَيْسَ فِي جَهَنَّمَ مَثْوًى لِلْكَافِرِينَ'
  trl: 'Wa-man aẕlamu mimmani ftarā ʿalā llāhi kadhiban aw kadhdhaba bi-l-ḥaqqi lammā jāʾahu a-laysa fī jahannama mathwan li-l-kāfirīn'
  trad: 'Et qui est plus injuste (aẕlamu) que celui qui invente (iftarā) un mensonge contre Allaah, ou qui dément le ḥaqq dès qu''il lui parvient (lammā jāʾahu) ? N''y a-t-il pas, dans Jahannam, un lieu de séjour (mathwā) pour les kāfirūn ?'
- ref: 'S.29:69'
  ar: 'وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ'
  trl: 'Wa-lladhīna jāhadū fīnā la-nahdiyannahum subulanā wa-inna llāha la-maʿa l-muḥsinīn'
  trad: 'Et ceux qui se sont évertués (jāhadū) pour Nous (fīnā) — Nous les guiderons certainement (la-nahdiyannahum) vers Nos chemins (subulanā) — et Allaah est certes avec (la-maʿa) les muḥsinūn.'
