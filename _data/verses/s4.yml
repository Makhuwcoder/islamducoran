- ref: S.4:1
  ar: يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُم مِّن نَّفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَاءً ۚ وَاتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ ۚ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا
  trl: Yā ayyuhā n-nāsu ttaqū rabbakumu lladhī khalaqakum min nafsin wāḥidatin wa-khalaqa minhā zawjahā wa-baththa minhumā rijālan kathīran wa-nisāʾā — wa-ttaqu llāha lladhī tasāʾalūna bihi wa-l-arḥām — inna llāha kāna ʿalaykum raqībā
  trad: Ô *al-nās* ! Prémunissez-vous de votre *Rabb*, Ce qui vous a créés d'un *nafs* unique et a créé de lui son conjoint (*zawj*), et a disséminé, à partir des deux, de nombreux hommes et femmes — prémunissez-vous d'Allaah, au nom duquel vous vous interpellez les uns les autres, et [prémunissez-vous à l'égard] des *arḥām* — Allaah est, sur vous, *Raqīb* (Ce qui observe et surveille de près).
- ref: S.4:2
  ar: وَآتُوا الْيَتَامَىٰ أَمْوَالَهُمْ ۖ وَلَا تَتَبَدَّلُوا الْخَبِيثَ بِالطَّيِّبِ ۖ وَلَا تَأْكُلُوا أَمْوَالَهُمْ إِلَىٰ أَمْوَالِكُمْ ۚ إِنَّهُ كَانَ حُوبًا كَبِيرًا
  trl: Wa-ātu l-yatāmā amwālahum — wa-lā tatabaddalu l-khabītha bi-ṭ-ṭayyib — wa-lā taʾkulū amwālahum ilā amwālikum — innahu kāna ḥūban kabīrā
  trad: 'Donnez aux *yatāmā* (orphelins) leurs biens — n''échangez pas le *khabīth* (le vicié) contre le *ṭayyib* (le pur, le bon) — et ne dévorez pas leurs biens en les mêlant aux vôtres : cela est, certes, un *ḥūb* immense (une faute grave).'
- ref: S.4:3
  ar: وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا فِي الْيَتَامَىٰ فَانكِحُوا مَا طَابَ لَكُم مِّنَ النِّسَاءِ مَثْنَىٰ وَثُلَاثَ وَرُبَاعَ ۖ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا فَوَاحِدَةً أَوْ مَا مَلَكَتْ أَيْمَانُكُمْ ۚ ذَٰلِكَ أَدْنَىٰ أَلَّا تَعُولُوا
  trl: Wa-in khiftum allā tuqsiṭū fi l-yatāmā fa-nkiḥū mā ṭāba lakum mina n-nisāʾi mathnā wa-thulātha wa-rubāʿ — fa-in khiftum allā taʿdilū fa-wāḥidatan aw mā malakat aymānukum — dhālika adnā allā taʿūlū
  trad: 'Et si vous craignez de ne pas agir avec *qisṭ* envers les orphelines, épousez alors, parmi les femmes, ce qui vous est bon (*mā ṭāba lakum*) : deux, trois, ou quatre. Mais si vous craignez de ne pas être équitables (*taʿdilū*), alors une seule — ou ce que vos mains droites possèdent. Cela est plus proche pour que vous ne *taʿūlū* pas.'
- ref: S.4:4
  ar: وَآتُوا النِّسَاءَ صَدُقَاتِهِنَّ نِحْلَةً ۚ فَإِن طِبْنَ لَكُمْ عَن شَيْءٍ مِّنْهُ نَفْسًا فَكُلُوهُ هَنِيئًا مَّرِيئًا
  trl: Wa-ātu n-nisāʾa ṣaduqātihinna niḥlatan — fa-in ṭibna lakum ʿan shayʾin minhu nafsan fa-kulūhu hanīʾan marīʾā
  trad: Donnez aux femmes leurs *ṣaduqāt* (dots) comme *niḥla* (don gratuit). Si elles vous cèdent volontiers, de leur propre disposition intérieure (*nafsan*), une partie de celle-ci, alors consommez-la en toute quiétude et bienfait.
- ref: S.4:5
  ar: وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ الَّتِي جَعَلَ اللَّهُ لَكُمْ قِيَامًا وَارْزُقُوهُمْ فِيهَا وَاكْسُوهُمْ وَقُولُوا لَهُمْ قَوْلًا مَّعْرُوفًا
  trl: Wa-lā tuʾtu s-sufahāʾa amwālakumu llatī jaʿala llāhu lakum qiyāman wa-rzuqūhum fīhā wa-ksūhum wa-qūlū lahum qawlan maʿrūfā
  trad: Ne remettez pas aux *sufahāʾ* les biens qu'Allaah a assignés comme *qiyām* (assise stable) pour vous — nourrissez-les et vêtissez-les à même ces biens, et adressez-leur une parole *maʿrūf* (reconnue comme bonne).
- ref: S.4:6
  ar: وَابْتَلُوا الْيَتَامَىٰ حَتَّىٰ إِذَا بَلَغُوا النِّكَاحَ فَإِنْ آنَسْتُم مِّنْهُمْ رُشْدًا فَادْفَعُوا إِلَيْهِمْ أَمْوَالَهُمْ ۖ وَلَا تَأْكُلُوهَا إِسْرَافًا وَبِدَارًا أَن يَكْبَرُوا ۚ وَمَن كَانَ غَنِيًّا فَلْيَسْتَعْفِفْ ۖ وَمَن كَانَ فَقِيرًا فَلْيَأْكُلْ بِالْمَعْرُوفِ ۚ فَإِذَا دَفَعْتُمْ إِلَيْهِمْ أَمْوَالَهُمْ فَأَشْهِدُوا عَلَيْهِمْ ۚ وَكَفَىٰ بِاللَّهِ حَسِيبًا
  trl: Wa-btalu l-yatāmā ḥattā idhā balaghu n-nikāḥa fa-in ānastum minhum rushdan fa-dfaʿū ilayhim amwālahum — wa-lā taʾkulūhā isrāfan wa-bidāran an yakbarū — wa-man kāna ghaniyyan fa-l-yastaʿfif wa-man kāna faqīran fa-l-yaʾkul bi-l-maʿrūf — fa-idhā dafaʿtum ilayhim amwālahum fa-shhidū ʿalayhim — wa-kafā bi-llāhi ḥasībā
  trad: Éprouvez les orphelins jusqu'à ce qu'ils atteignent l'âge du mariage (*balaghu n-nikāḥ*) ; si vous discernez alors chez eux un *rushd* (maturité de jugement droit), remettez-leur leurs biens. Ne les dévorez pas par *isrāf* (excès) ni par *bidār* (hâte), de peur qu'ils ne grandissent. Que celui qui est aisé s'abstienne totalement (*yastaʿfif*), et que celui qui est dans le besoin en consomme selon le *maʿrūf*. Et lorsque vous leur remettez leurs biens, prenez des témoins sur eux — Allaah suffit comme *Ḥasīb* (Ce qui tient le compte exact).
- ref: S.4:7
  ar: لِّلرِّجَالِ نَصِيبٌ مِّمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ وَلِلنِّسَاءِ نَصِيبٌ مِّمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ مِمَّا قَلَّ مِنْهُ أَوْ كَثُرَ ۚ نَصِيبًا مَّفْرُوضًا
  trl: Li-r-rijāli naṣībun mimmā taraka l-wālidāni wa-l-aqrabūna wa-li-n-nisāʾi naṣībun mimmā taraka l-wālidāni wa-l-aqrabūna mimmā qalla minhu aw kathur — naṣīban mafrūḍā
  trad: 'Aux hommes une part (*naṣīb*) de ce qu''ont laissé les deux parents et les proches, et aux femmes une part de ce qu''ont laissé les deux parents et les proches — que cela soit peu ou abondant : une part *farḍ* (fixée avec obligation).'
- ref: S.4:8
  ar: وَإِذَا حَضَرَ الْقِسْمَةَ أُولُو الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينُ فَارْزُقُوهُم مِّنْهُ وَقُولُوا لَهُمْ قَوْلًا مَّعْرُوفًا
  trl: Wa-idhā ḥaḍara l-qismata ūlu l-qurbā wa-l-yatāmā wa-l-masākīnu fa-rzuqūhum minhu wa-qūlū lahum qawlan maʿrūfā
  trad: Et si, lors du partage, sont présents des proches (*ūlū l-qurbā*), des orphelins et des indigents (*masākīn*), donnez-leur en une part, et adressez-leur une parole *maʿrūf*.
- ref: S.4:9
  ar: وَلْيَخْشَ الَّذِينَ لَوْ تَرَكُوا مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَافًا خَافُوا عَلَيْهِمْ فَلْيَتَّقُوا اللَّهَ وَلْيَقُولُوا قَوْلًا سَدِيدًا
  trl: Wa-l-yakhsha lladhīna law tarakū min khalfihim dhurriyyatan ḍiʿāfan khāfū ʿalayhim fa-l-yattaqu llāha wa-l-yaqūlū qawlan sadīdā
  trad: Que redoutent [cette situation] ceux qui, s'ils laissaient derrière eux une descendance (*dhurriyya*) vulnérable, craindraient pour elle — qu'ils se prémunissent donc d'Allaah et disent une parole *sadīd* (juste, sans faille).
- ref: S.4:10
  ar: إِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَىٰ ظُلْمًا إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَارًا ۖ وَسَيَصْلَوْنَ سَعِيرًا
  trl: Inna lladhīna yaʾkulūna amwāla l-yatāmā ẓulman innamā yaʾkulūna fī buṭūnihim nāran wa-sa-yaṣlawna saʿīrā
  trad: Ceux qui dévorent les biens des orphelins par *ẓulm* ne dévorent, dans leurs ventres, que du feu — et ils brûleront bientôt dans un *saʿīr* (brasier).
- ref: S.4:11
  ar: يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ ۚ فَإِن كُنَّ نِسَاءً فَوْقَ اثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَ ۖ وَإِن كَانَتْ وَاحِدَةً فَلَهَا النِّصْفُ ۚ وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُ وَلَدٌ ۚ فَإِن لَّمْ يَكُن لَّهُ وَلَدٌ وَوَرِثَهُ أَبَوَاهُ فَلِأُمِّهِ الثُّلُثُ ۚ فَإِن كَانَ لَهُ إِخْوَةٌ فَلِأُمِّهِ السُّدُسُ ۚ مِن بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ ۗ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ لَا تَدْرُونَ أَيُّهُمْ أَقْرَبُ لَكُمْ نَفْعًا ۚ فَرِيضَةً مِّنَ اللَّهِ ۗ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا
  trl: Yūṣīkumu llāhu fī awlādikum — li-dh-dhakari mithlu ḥaẓẓi l-unthayayn — fa-in kunna nisāʾan fawqa thnatayni fa-lahunna thuluthā mā taraka — wa-in kānat wāḥidatan fa-lahā n-niṣf — wa-li-abawayhi li-kulli wāḥidin minhumā s-sudusu mimmā taraka in kāna lahu walad — fa-in lam yakun lahu waladun wa-warithahu abawāhu fa-li-ummihi th-thuluth — fa-in kāna lahu ikhwatun fa-li-ummihi s-sudus — min baʿdi waṣiyyatin yūṣī bihā aw dayn — ābāʾukum wa-abnāʾukum lā tadrūna ayyuhum aqrabu lakum nafʿan — farīḍatan mina llāh — inna llāha kāna ʿalīman ḥakīmā
  trad: 'Allaah vous prescrit, au sujet de vos enfants (*awlād*) : au garçon (*dhakar*) l''équivalent de la part de deux filles. S''il y a plus de deux filles, à elles les deux tiers de ce qui est laissé ; s''il n''y en a qu''une, à elle la moitié. Et pour ses deux parents, à chacun d''eux le sixième de ce qui est laissé, s''il [le défunt] a un *walad* (enfant). S''il n''a pas de *walad* et que ses deux parents héritent de lui, à sa mère le tiers. S''il a des *ikhwa* (frères et sœurs), à sa mère le sixième — après [exécution] d''un legs (*waṣiyya*) qu''il aurait ordonné, ou d''une dette. Vos pères et vos fils — vous ne savez pas lesquels d''entre eux vous sont les plus proches en utilité. [Ceci est] une prescription fixée (*farīḍa*) venant d''Allaah — Allaah est, certes, *ʿAlīm* (Savant), *Ḥakīm* (Sage).'
- ref: S.4:12
  ar: وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٌ ۚ فَإِن كَانَ لَهُنَّ وَلَدٌ فَلَكُمُ الرُّبُعُ مِمَّا تَرَكْنَ ۚ مِن بَعْدِ وَصِيَّةٍ يُوصِينَ بِهَا أَوْ دَيْنٍ ۚ وَلَهُنَّ الرُّبُعُ مِمَّا تَرَكْتُمْ إِن لَّمْ يَكُن لَّكُمْ وَلَدٌ ۚ فَإِن كَانَ لَكُمْ وَلَدٌ فَلَهُنَّ الثُّمُنُ مِمَّا تَرَكْتُم ۚ مِّن بَعْدِ وَصِيَّةٍ تُوصُونَ بِهَا أَوْ دَيْنٍ ۗ وَإِن كَانَ رَجُلٌ يُورَثُ كَلَالَةً أَوِ امْرَأَةٌ وَلَهُ أَخٌ أَوْ أُخْتٌ فَلِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ ۚ فَإِن كَانُوا أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَاءُ فِي الثُّلُثِ ۚ مِن بَعْدِ وَصِيَّةٍ يُوصَىٰ بِهَا أَوْ دَيْنٍ غَيْرَ مُضَارٍّ ۚ وَصِيَّةً مِّنَ اللَّهِ ۗ وَاللَّهُ عَلِيمٌ حَلِيمٌ
  trl: Wa-lakum niṣfu mā taraka azwājukum in lam yakun lahunna walad — fa-in kāna lahunna waladun fa-lakumu r-rubuʿu mimmā tarakna — min baʿdi waṣiyyatin yūṣīna bihā aw dayn — wa-lahunna r-rubuʿu mimmā taraktum in lam yakun lakum walad — fa-in kāna lakum waladun fa-lahunna th-thumunu mimmā taraktum — min baʿdi waṣiyyatin tūṣūna bihā aw dayn — wa-in kāna rajulun yūrathu kalālatan awi mraʾatun wa-lahu akhun aw ukhtun fa-li-kulli wāḥidin minhumā s-sudus — fa-in kānū akthara min dhālika fa-hum shurakāʾu fi th-thuluth — min baʿdi waṣiyyatin yūṣā bihā aw daynin ghayra muḍārr — waṣiyyatan mina llāh — wa-llāhu ʿalīmun ḥalīm
  trad: À vous [les époux], la moitié de ce que laissent vos épouses, si elles n'ont pas de *walad* ; si elles ont un *walad*, à vous le quart de ce qu'elles laissent — après [exécution] d'un legs qu'elles auraient ordonné, ou d'une dette. Et à elles le quart de ce que vous laissez, si vous n'avez pas de *walad* ; si vous avez un *walad*, à elles le huitième de ce que vous laissez — après [exécution] d'un legs que vous auriez ordonné, ou d'une dette. Et si un homme dont on hérite [meurt] en *kalāla*, ou une femme [de même], et qu'il ou elle a un frère ou une sœur, à chacun des deux le sixième ; s'ils sont plus nombreux que cela, ils sont associés (*shurakāʾ*) dans le tiers — après [exécution] d'un legs qui aurait été ordonné, ou d'une dette, sans préjudice causé (*ghayra muḍārr*) — prescription venant d'Allaah. Allaah est *ʿAlīm* (Savant), *Ḥalīm* (Longanime).
- ref: S.4:13
  ar: تِلْكَ حُدُودُ اللَّهِ ۚ وَمَن يُطِعِ اللَّهَ وَرَسُولَهُ يُدْخِلْهُ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا ۚ وَذَٰلِكَ الْفَوْزُ الْعَظِيمُ
  trl: Tilka ḥudūdu llāh — wa-man yuṭiʿi llāha wa-rasūlahu yudkhilhu jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā — wa-dhālika l-fawzu l-ʿaẓīm
  trad: Voilà les *ḥudūd* (limites) d'Allaah. Quiconque obéit à Allaah et à Son *rasūl*, Il le fera entrer dans des jardins sous lesquels coulent des rivières, où il demeurera éternellement — et voilà le *fawz* (succès) immense.
- ref: S.4:14
  ar: وَمَن يَعْصِ اللَّهَ وَرَسُولَهُ وَيَتَعَدَّ حُدُودَهُ يُدْخِلْهُ نَارًا خَالِدًا فِيهَا وَلَهُ عَذَابٌ مُّهِينٌ
  trl: Wa-man yaʿṣi llāha wa-rasūlahu wa-yataʿadda ḥudūdahu yudkhilhu nāran khālidan fīhā wa-lahu ʿadhābun muhīn
  trad: Et quiconque désobéit à Allaah et à Son *rasūl*, et transgresse Ses limites, Il le fera entrer dans un feu où il demeurera éternellement — à lui un châtiment humiliant.
- ref: S.4:15
  ar: وَاللَّاتِي يَأْتِينَ الْفَاحِشَةَ مِن نِّسَائِكُمْ فَاسْتَشْهِدُوا عَلَيْهِنَّ أَرْبَعَةً مِّنكُمْ ۖ فَإِن شَهِدُوا فَأَمْسِكُوهُنَّ فِي الْبُيُوتِ حَتَّىٰ يَتَوَفَّاهُنَّ الْمَوْتُ أَوْ يَجْعَلَ اللَّهُ لَهُنَّ سَبِيلًا
  trl: Wa-llātī yaʾtīna l-fāḥishata min nisāʾikum fa-stashhidū ʿalayhinna arbaʿatan minkum — fa-in shahidū fa-amsikūhunna fi l-buyūti ḥattā yatawaffāhunna l-mawtu aw yajʿala llāhu lahunna sabīlā
  trad: 'Celles de vos femmes qui commettent la *fāḥisha* : faites témoigner contre elles quatre d''entre vous. S''ils témoignent, retenez-les dans les demeures jusqu''à ce que la mort les rappelle, ou qu''Allaah leur assigne une issue (*sabīl*).'
- ref: S.4:16
  ar: وَاللَّذَانِ يَأْتِيَانِهَا مِنكُمْ فَآذُوهُمَا ۖ فَإِن تَابَا وَأَصْلَحَا فَأَعْرِضُوا عَنْهُمَا ۗ إِنَّ اللَّهَ كَانَ تَوَّابًا رَّحِيمًا
  trl: Wa-lladhāni yaʾtiyānihā minkum fa-ādhūhumā — fa-in tābā wa-aṣlaḥā fa-aʿriḍū ʿanhumā — inna llāha kāna tawwāban raḥīmā
  trad: Et les deux d'entre vous qui la commettent, importunez-les (*ādhūhumā*) tous les deux ; mais s'ils reviennent (*tābā*) et se réforment (*aṣlaḥā*), détournez-vous d'eux — Allaah est, certes, *at-Tawwāb* (Ce qui accueille sans cesse le retour), *ar-Raḥīm*.
- ref: S.4:17
  ar: إِنَّمَا التَّوْبَةُ عَلَى اللَّهِ لِلَّذِينَ يَعْمَلُونَ السُّوءَ بِجَهَالَةٍ ثُمَّ يَتُوبُونَ مِن قَرِيبٍ فَأُولَٰئِكَ يَتُوبُ اللَّهُ عَلَيْهِمْ ۗ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا
  trl: Innamā t-tawbatu ʿalā llāhi li-lladhīna yaʿmalūna s-sūʾa bi-jahālatin thumma yatūbūna min qarībin fa-ulāʾika yatūbu llāhu ʿalayhim — wa-kāna llāhu ʿalīman ḥakīmā
  trad: Le retour [accueilli] ne revient qu'à Allaah, pour ceux qui commettent le mal par *jahāla* puis reviennent (*yatūbūn*) sans délai (*min qarīb*) — ceux-là, Allaah accueille leur retour. Allaah est *ʿAlīm*, *Ḥakīm*.
- ref: S.4:18
  ar: وَلَيْسَتِ التَّوْبَةُ لِلَّذِينَ يَعْمَلُونَ السَّيِّئَاتِ حَتَّىٰ إِذَا حَضَرَ أَحَدَهُمُ الْمَوْتُ قَالَ إِنِّي تُبْتُ الْآنَ وَلَا الَّذِينَ يَمُوتُونَ وَهُمْ كُفَّارٌ ۚ أُولَٰئِكَ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًا
  trl: Wa-laysati t-tawbatu li-lladhīna yaʿmalūna s-sayyiʾāti ḥattā idhā ḥaḍara aḥadahumu l-mawtu qāla innī tubtu l-āna wa-lā lladhīna yamūtūna wa-hum kuffārun — ulāʾika aʿtadnā lahum ʿadhāban alīmā
  trad: 'Et il n''y a pas de retour [accueilli] pour ceux qui commettent les fautes jusqu''à ce que, la mort se présentant à l''un d''eux, il dise : « Je reviens maintenant » — ni pour ceux qui meurent alors qu''ils sont *kuffār*. À ceux-là, Nous avons préparé un châtiment douloureux.'
- ref: S.4:19
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا يَحِلُّ لَكُمْ أَن تَرِثُوا النِّسَاءَ كَرْهًا ۖ وَلَا تَعْضُلُوهُنَّ لِتَذْهَبُوا بِبَعْضِ مَا آتَيْتُمُوهُنَّ إِلَّا أَن يَأْتِينَ بِفَاحِشَةٍ مُّبَيِّنَةٍ ۚ وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ ۚ فَإِن كَرِهْتُمُوهُنَّ فَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَيَجْعَلَ اللَّهُ فِيهِ خَيْرًا كَثِيرًا
  trl: Yā ayyuhā lladhīna āmanū lā yaḥillu lakum an tarithu n-nisāʾa karhan — wa-lā taʿḍulūhunna li-tadhhabū bi-baʿḍi mā ātaytumūhunna illā an yaʾtīna bi-fāḥishatin mubayyinah — wa-ʿāshirūhunna bi-l-maʿrūf — fa-in karihtumūhunna fa-ʿasā an takrahū shayʾan wa-yajʿala llāhu fīhi khayran kathīrā
  trad: Ô vous qui avez cru, il ne vous est pas licite d'hériter des femmes contre leur gré (*karhan*), ni de leur faire obstruction (*taʿḍulūhunna*) pour reprendre une partie de ce que vous leur aviez donné — sauf si elles commettent une *fāḥisha* manifeste (*mubayyina*). Vivez avec elles selon le *maʿrūf*. Et si vous les prenez en aversion, il se peut que vous ayez de l'aversion pour une chose dans laquelle Allaah place un bien abondant.
- ref: S.4:20
  ar: وَإِنْ أَرَدتُّمُ اسْتِبْدَالَ زَوْجٍ مَّكَانَ زَوْجٍ وَآتَيْتُمْ إِحْدَاهُنَّ قِنطَارًا فَلَا تَأْخُذُوا مِنْهُ شَيْئًا ۚ أَتَأْخُذُونَهُ بُهْتَانًا وَإِثْمًا مُّبِينًا
  trl: Wa-in aradtumu stibdāla zawjin makāna zawjin wa-ātaytum iḥdāhunna qinṭāran fa-lā taʾkhudhū minhu shayʾā — a-taʾkhudhūnahu buhtānan wa-ithman mubīnā
  trad: Et si vous voulez substituer une épouse à une autre, et que vous aviez donné à l'une d'elles un *qinṭār* (une somme considérable), n'en reprenez rien. Allez-vous le reprendre par *buhtān* (accusation infondée) et faute manifeste ?
- ref: S.4:21
  ar: وَكَيْفَ تَأْخُذُونَهُ وَقَدْ أَفْضَىٰ بَعْضُكُمْ إِلَىٰ بَعْضٍ وَأَخَذْنَ مِنكُم مِّيثَاقًا غَلِيظًا
  trl: Wa-kayfa taʾkhudhūnahu wa-qad afḍā baʿḍukum ilā baʿḍin wa-akhadhna minkum mīthāqan ghalīẓā
  trad: Et comment le reprendriez-vous, alors que vous vous êtes accordés intimement l'un à l'autre (*afḍā baʿḍukum ilā baʿḍ*), et qu'elles ont pris de vous un *mīthāq ghalīẓ* (engagement solennel et robuste) ?
- ref: S.4:22
  ar: وَلَا تَنكِحُوا مَا نَكَحَ آبَاؤُكُم مِّنَ النِّسَاءِ إِلَّا مَا قَدْ سَلَفَ ۚ إِنَّهُ كَانَ فَاحِشَةً وَمَقْتًا وَسَاءَ سَبِيلًا
  trl: Wa-lā tankiḥū mā nakaḥa ābāʾukum mina n-nisāʾi illā mā qad salaf — innahu kāna fāḥishatan wa-maqtan wa-sāʾa sabīlā
  trad: N'épousez pas celles que vos pères ont épousées parmi les femmes — sauf ce qui est déjà passé (*mā qad salaf*). Cela est, certes, une *fāḥisha*, un *maqt* (objet d'aversion intense), et un chemin détestable.
- ref: S.4:23
  ar: حُرِّمَتْ عَلَيْكُمْ أُمَّهَاتُكُمْ وَبَنَاتُكُمْ وَأَخَوَاتُكُمْ وَعَمَّاتُكُمْ وَخَالَاتُكُمْ وَبَنَاتُ الْأَخِ وَبَنَاتُ الْأُخْتِ وَأُمَّهَاتُكُمُ اللَّاتِي أَرْضَعْنَكُمْ وَأَخَوَاتُكُم مِّنَ الرَّضَاعَةِ وَأُمَّهَاتُ نِسَائِكُمْ وَرَبَائِبُكُمُ اللَّاتِي فِي حُجُورِكُم مِّن نِّسَائِكُمُ اللَّاتِي دَخَلْتُم بِهِنَّ فَإِن لَّمْ تَكُونُوا دَخَلْتُم بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْ وَحَلَائِلُ أَبْنَائِكُمُ الَّذِينَ مِنْ أَصْلَابِكُمْ وَأَن تَجْمَعُوا بَيْنَ الْأُخْتَيْنِ إِلَّا مَا قَدْ سَلَفَ ۗ إِنَّ اللَّهَ كَانَ غَفُورًا رَّحِيمًا
  trl: Ḥurrimat ʿalaykum ummahātukum wa-banātukum wa-akhawātukum wa-ʿammātukum wa-khālātukum wa-banātu l-akhi wa-banātu l-ukhti wa-ummahātukumu llātī arḍaʿnakum wa-akhawātukum mina r-raḍāʿati wa-ummahātu nisāʾikum wa-rabāʾibukumu llātī fī ḥujūrikum min nisāʾikumu llātī dakhaltum bihinna fa-in lam takūnū dakhaltum bihinna fa-lā junāḥa ʿalaykum wa-ḥalāʾilu abnāʾikumu lladhīna min aṣlābikum wa-an tajmaʿū bayna l-ukhtayni illā mā qad salaf — inna llāha kāna ghafūran raḥīmā
  trad: 'Vous sont interdites : vos mères, vos filles, vos sœurs, vos tantes paternelles, vos tantes maternelles, les filles de votre frère, les filles de votre sœur, vos mères qui vous ont allaités, vos sœurs de lait (*mina r-raḍāʿa*), les mères de vos épouses, vos belles-filles (*rabāʾib*) qui sont sous votre garde (*fī ḥujūrikum*), nées des épouses avec lesquelles vous avez consommé le mariage — mais si vous n''avez pas consommé avec elles, nulle faute sur vous [de les épouser] — les épouses de vos fils issus de vos reins (*min aṣlābikum*), et le fait de réunir deux sœurs [dans le même lien] — sauf ce qui est déjà passé. Allaah est, certes, *Ghafūr* (Pardonnant), *Raḥīm*.'
- ref: S.4:24
  ar: وَالْمُحْصَنَاتُ مِنَ النِّسَاءِ إِلَّا مَا مَلَكَتْ أَيْمَانُكُمْ ۖ كِتَابَ اللَّهِ عَلَيْكُمْ ۚ وَأُحِلَّ لَكُم مَّا وَرَاءَ ذَٰلِكُمْ أَن تَبْتَغُوا بِأَمْوَالِكُم مُّحْصِنِينَ غَيْرَ مُسَافِحِينَ ۚ فَمَا اسْتَمْتَعْتُم بِهِ مِنْهُنَّ فَآتُوهُنَّ أُجُورَهُنَّ فَرِيضَةً ۚ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَاضَيْتُم بِهِ مِن بَعْدِ الْفَرِيضَةِ ۚ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا
  trl: Wa-l-muḥṣanātu mina n-nisāʾi illā mā malakat aymānukum — kitāba llāhi ʿalaykum — wa-uḥilla lakum mā warāʾa dhālikum an tabtaghū bi-amwālikum muḥṣinīna ghayra musāfiḥīn — fa-mā stamtaʿtum bihi minhunna fa-ātūhunna ujūrahunna farīḍatan — wa-lā junāḥa ʿalaykum fīmā tarāḍaytum bihi min baʿdi l-farīḍah — inna llāha kāna ʿalīman ḥakīmā
  trad: '[Sont interdites] les *muḥṣanāt* (femmes déjà engagées dans un lien) parmi les femmes — sauf ce que possèdent vos mains droites [dans les conditions déjà posées] : prescription d''Allaah pour vous. Vous est rendu licite, au-delà de cela, de rechercher [des épouses] par vos biens, en *muḥṣinīn* (dans une visée d''engagement protégé), non en *musāfiḥīn* (dans une visée de débauche). Ce dont vous avez joui (*istamtaʿtum*) auprès d''elles, donnez-leur leurs *ujūr* (rétributions) comme *farīḍa* (obligation fixée). Nulle faute sur vous concernant ce dont vous vous seriez accordés mutuellement au-delà de la *farīḍa*. Allaah est, certes, *ʿAlīm*, *Ḥakīm*.'
- ref: S.4:25
  ar: وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلًا أَن يَنكِحَ الْمُحْصَنَاتِ الْمُؤْمِنَاتِ فَمِن مَّا مَلَكَتْ أَيْمَانُكُم مِّن فَتَيَاتِكُمُ الْمُؤْمِنَاتِ ۚ وَاللَّهُ أَعْلَمُ بِإِيمَانِكُم ۚ بَعْضُكُم مِّن بَعْضٍ ۚ فَانكِحُوهُنَّ بِإِذْنِ أَهْلِهِنَّ وَآتُوهُنَّ أُجُورَهُنَّ بِالْمَعْرُوفِ مُحْصَنَاتٍ غَيْرَ مُسَافِحَاتٍ وَلَا مُتَّخِذَاتِ أَخْدَانٍ ۚ فَإِذَا أُحْصِنَّ فَإِنْ أَتَيْنَ بِفَاحِشَةٍ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى الْمُحْصَنَاتِ مِنَ الْعَذَابِ ۚ ذَٰلِكَ لِمَنْ خَشِيَ الْعَنَتَ مِنكُمْ ۚ وَأَن تَصْبِرُوا خَيْرٌ لَّكُمْ ۗ وَاللَّهُ غَفُورٌ رَّحِيمٌ
  trl: Wa-man lam yastaṭiʿ minkum ṭawlan an yankiḥa l-muḥṣanāti l-muʾmināti fa-min mā malakat aymānukum min fatayātikumu l-muʾmināt — wa-llāhu aʿlamu bi-īmānikum — baʿḍukum min baʿḍin — fa-nkiḥūhunna bi-idhni ahlihinna wa-ātūhunna ujūrahunna bi-l-maʿrūfi muḥṣanātin ghayra musāfiḥātin wa-lā muttakhidhāti akhdān — fa-idhā uḥṣinna fa-in atayna bi-fāḥishatin fa-ʿalayhinna niṣfu mā ʿalā l-muḥṣanāti mina l-ʿadhāb — dhālika li-man khashiya l-ʿanata minkum — wa-an taṣbirū khayrun lakum — wa-llāhu ghafūrun raḥīm
  trad: Et quiconque parmi vous n'a pas les moyens (*ṭawlan*) d'épouser des *muḥṣanāt* croyantes, [qu'il épouse] parmi ce que possèdent vos mains droites, d'entre vos jeunes femmes (*fatayāt*) croyantes — Allaah connaît mieux votre foi. Vous êtes les uns des autres [d'une même origine]. Épousez-les donc avec la permission de leur *ahl* (proches), et donnez-leur leurs *ujūr* selon le *maʿrūf*, [étant] *muḥṣanāt*, non *musāfiḥāt*, ni prenant des *akhdān* (amants secrets). Si, une fois engagées [par le mariage], elles commettent une *fāḥisha*, à elles la moitié de ce qui [serait imposé] aux *muḥṣanāt* comme châtiment. Cela est pour qui craint parmi vous le *ʿanat* (la détresse qui pousse à la faute) — et que vous patientiez est meilleur pour vous. Allaah est *Ghafūr*, *Raḥīm*.
- ref: S.4:26
  ar: يُرِيدُ اللَّهُ لِيُبَيِّنَ لَكُمْ وَيَهْدِيَكُمْ سُنَنَ الَّذِينَ مِن قَبْلِكُمْ وَيَتُوبَ عَلَيْكُمْ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Yurīdu llāhu li-yubayyina lakum wa-yahdiyakum sunana lladhīna min qablikum wa-yatūba ʿalaykum — wa-llāhu ʿalīmun ḥakīm
  trad: Allaah veut vous rendre les choses manifestes (*li-yubayyina lakum*), vous guider selon les *sunan* (voies suivies) de ceux d'avant vous, et accueillir votre retour — Allaah est *ʿAlīm*, *Ḥakīm*.
- ref: S.4:27
  ar: وَاللَّهُ يُرِيدُ أَن يَتُوبَ عَلَيْكُمْ وَيُرِيدُ الَّذِينَ يَتَّبِعُونَ الشَّهَوَاتِ أَن تَمِيلُوا مَيْلًا عَظِيمًا
  trl: Wa-llāhu yurīdu an yatūba ʿalaykum wa-yurīdu lladhīna yattabiʿūna sh-shahawāti an tamīlū maylan ʿaẓīmā
  trad: Allaah veut accueillir votre retour, tandis que ceux qui suivent les *shahawāt* (désirs) veulent que vous déviiez d'une déviation immense.
- ref: S.4:28
  ar: يُرِيدُ اللَّهُ أَن يُخَفِّفَ عَنكُمْ ۚ وَخُلِقَ الْإِنسَانُ ضَعِيفًا
  trl: Yurīdu llāhu an yukhaffifa ʿankum — wa-khuliqa l-insānu ḍaʿīfā
  trad: Allaah veut alléger [Sa charge] sur vous — et l'humain (*al-insān*) a été créé faible (*ḍaʿīf*).
- ref: S.4:29
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ ۚ وَلَا تَقْتُلُوا أَنفُسَكُمْ ۚ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا
  trl: Yā ayyuhā lladhīna āmanū lā taʾkulū amwālakum baynakum bi-l-bāṭili illā an takūna tijāratan ʿan tarāḍin minkum — wa-lā taqtulū anfusakum — inna llāha kāna bikum raḥīmā
  trad: Ô vous qui avez cru, ne dévorez pas vos biens entre vous par *al-bāṭil* (le sans-fondement) — sauf s'il s'agit d'un commerce (*tijāra*) par consentement mutuel entre vous (*ʿan tarāḍin*) — et ne vous tuez pas vous-mêmes (*lā taqtulū anfusakum*) — Allaah est, envers vous, *Raḥīm*.
- ref: S.4:30
  ar: وَمَن يَفْعَلْ ذَٰلِكَ عُدْوَانًا وَظُلْمًا فَسَوْفَ نُصْلِيهِ نَارًا ۚ وَكَانَ ذَٰلِكَ عَلَى اللَّهِ يَسِيرًا
  trl: Wa-man yafʿal dhālika ʿudwānan wa-ẓulman fa-sawfa nuṣlīhi nārā — wa-kāna dhālika ʿalā llāhi yasīrā
  trad: Et quiconque fait cela par *ʿudwān* (transgression hostile) et *ẓulm*, Nous le ferons bientôt brûler dans un feu — et cela est, pour Allaah, chose aisée.
- ref: S.4:31
  ar: إِن تَجْتَنِبُوا كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُم مُّدْخَلًا كَرِيمًا
  trl: In tajtanibū kabāʾira mā tunhawna ʿanhu nukaffir ʿankum sayyiʾātikum wa-nudkhilkum mudkhalan karīmā
  trad: Si vous évitez les *kabāʾir* (fautes majeures) qui vous sont interdites, Nous effacerons vos *sayyiʾāt* (fautes) et vous ferons entrer dans une entrée (*mudkhal*) noble.
- ref: S.4:32
  ar: وَلَا تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَىٰ بَعْضٍ ۚ لِّلرِّجَالِ نَصِيبٌ مِّمَّا اكْتَسَبُوا ۖ وَلِلنِّسَاءِ نَصِيبٌ مِّمَّا اكْتَسَبْنَ ۚ وَاسْأَلُوا اللَّهَ مِن فَضْلِهِ ۗ إِنَّ اللَّهَ كَانَ بِكُلِّ شَيْءٍ عَلِيمًا
  trl: Wa-lā tatamannaw mā faḍḍala llāhu bihi baʿḍakum ʿalā baʿḍin — li-r-rijāli naṣībun mimmā ktasabū wa-li-n-nisāʾi naṣībun mimmā ktasabna — wa-sʾalu llāha min faḍlihi — inna llāha kāna bi-kulli shayʾin ʿalīmā
  trad: Ne convoitez pas (*lā tatamannaw*) ce par quoi Allaah a favorisé certains d'entre vous par rapport à d'autres. Aux hommes une part de ce qu'ils ont acquis (*iktasabū*), et aux femmes une part de ce qu'elles ont acquis (*iktasabna*). Demandez à Allaah de Son *faḍl* (surcroît) — Allaah est, de toute chose, *ʿAlīm*.
- ref: S.4:33
  ar: وَلِكُلٍّ جَعَلْنَا مَوَالِيَ مِمَّا تَرَكَ الْوَالِدَانِ وَالْأَقْرَبُونَ ۚ وَالَّذِينَ عَقَدَتْ أَيْمَانُكُمْ فَآتُوهُمْ نَصِيبَهُمْ ۚ إِنَّ اللَّهَ كَانَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدًا
  trl: Wa-li-kullin jaʿalnā mawāliya mimmā taraka l-wālidāni wa-l-aqrabūn — wa-lladhīna ʿaqadat aymānukum fa-ātūhum naṣībahum — inna llāha kāna ʿalā kulli shayʾin shahīdā
  trad: Et à chacun Nous avons assigné des *mawālī* (ayants droit) pour ce qu'ont laissé les deux parents et les proches. Et ceux avec qui vos mains droites ont conclu un pacte (*ʿaqadat aymānukum*), donnez-leur leur part. Allaah est, sur toute chose, *Shahīd* (Témoin).
- ref: S.4:34
  ar: الرِّجَالُ قَوَّامُونَ عَلَى النِّسَاءِ بِمَا فَضَّلَ اللَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٍ وَبِمَا أَنفَقُوا مِنْ أَمْوَالِهِمْ ۚ فَالصَّالِحَاتُ قَانِتَاتٌ حَافِظَاتٌ لِّلْغَيْبِ بِمَا حَفِظَ اللَّهُ ۚ وَاللَّاتِي تَخَافُونَ نُشُوزَهُنَّ فَعِظُوهُنَّ وَاهْجُرُوهُنَّ فِي الْمَضَاجِعِ وَاضْرِبُوهُنَّ ۖ فَإِنْ أَطَعْنَكُمْ فَلَا تَبْغُوا عَلَيْهِنَّ سَبِيلًا ۗ إِنَّ اللَّهَ كَانَ عَلِيًّا كَبِيرًا
  trl: Al-rijālu qawwāmūna ʿalā n-nisāʾi bimā faḍḍala llāhu baʿḍahum ʿalā baʿḍin wa-bimā anfaqū min amwālihim — fa-ṣ-ṣāliḥātu qānitātun ḥāfiẓātun li-l-ghaybi bimā ḥafiẓa llāh — wa-llātī takhāfūna nushūzahunna fa-ʿiẓūhunna wa-hjurūhunna fi l-maḍājiʿi wa-ḍribūhunna — fa-in aṭaʿnakum fa-lā tabghū ʿalayhinna sabīlā — inna llāha kāna ʿaliyyan kabīrā
  trad: Les hommes sont *qawwāmūn* (en charge, tenant fermement leur rôle) envers les femmes, en raison de ce par quoi Allaah a favorisé certains d'entre eux par rapport à d'autres, et en raison de ce qu'ils dépensent (*anfaqū*) de leurs biens. Les femmes *ṣāliḥāt* (droites) sont *qānitāt* (dévouées), gardiennes (*ḥāfiẓāt*) de ce qui est absent (*al-ghayb*) par ce qu'Allaah a gardé. Et celles dont vous craignez le *nushūz*, admonestez-les (*ʿiẓūhunna*) ; [puis] délaissez-les dans les couches (*wa-hjurūhunna fi l-maḍājiʿ*) ; [puis] *ḍribūhunna*. Si elles vous obéissent, ne cherchez pas de voie contre elles (*fa-lā tabghū ʿalayhinna sabīlā*). Allaah est, certes, *ʿAliyy*, *Kabīr*.
- ref: S.4:35
  ar: وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا فَابْعَثُوا حَكَمًا مِّنْ أَهْلِهِ وَحَكَمًا مِّنْ أَهْلِهَا إِن يُرِيدَا إِصْلَاحًا يُوَفِّقِ اللَّهُ بَيْنَهُمَا ۗ إِنَّ اللَّهَ كَانَ عَلِيمًا خَبِيرًا
  trl: Wa-in khiftum shiqāqa baynihimā fa-bʿathū ḥakaman min ahlihi wa-ḥakaman min ahlihā — in yurīdā iṣlāḥan yuwaffiqi llāhu baynahumā — inna llāha kāna ʿalīman khabīrā
  trad: Et si vous craignez un *shiqāq* (rupture, scission) entre les deux, envoyez un *ḥakam* (arbitre) de la famille de l'un et un *ḥakam* de la famille de l'autre. S'ils veulent tous deux un *iṣlāḥ* (réconciliation), Allaah accordera l'harmonie entre eux — Allaah est *ʿAlīm*, *Khabīr*.
- ref: S.4:36
  ar: وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا ۖ وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنبِ وَابْنِ السَّبِيلِ وَمَا مَلَكَتْ أَيْمَانُكُمْ ۗ إِنَّ اللَّهَ لَا يُحِبُّ مَن كَانَ مُخْتَالًا فَخُورًا
  trl: Wa-ʿbudu llāha wa-lā tushrikū bihi shayʾā — wa-bi-l-wālidayni iḥsānā wa-bi-dhi l-qurbā wa-l-yatāmā wa-l-masākīni wa-l-jāri dhi l-qurbā wa-l-jāri l-junubi wa-ṣ-ṣāḥibi bi-l-janbi wa-bni s-sabīli wa-mā malakat aymānukum — inna llāha lā yuḥibbu man kāna mukhtālan fakhūrā
  trad: Adorez Allaah et ne Lui associez rien — et [agissez avec] *iḥsān* envers les deux parents, les proches (*dhi l-qurbā*), les orphelins, les indigents, le voisin proche (*al-jāri dhi l-qurbā*), le voisin éloigné (*al-jāri l-junub*), le compagnon proche (*aṣ-ṣāḥib bi-l-janb*), le voyageur (*ibn as-sabīl*), et ce que possèdent vos mains droites — Allaah n'aime pas quiconque est *mukhtāl* (arrogant dans sa démarche), *fakhūr* (vantard).
- ref: S.4:37
  ar: الَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ النَّاسَ بِالْبُخْلِ وَيَكْتُمُونَ مَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ ۗ وَأَعْتَدْنَا لِلْكَافِرِينَ عَذَابًا مُّهِينًا
  trl: Alladhīna yabkhalūna wa-yaʾmurūna n-nāsa bi-l-bukhli wa-yaktumūna mā ātāhumu llāhu min faḍlih — wa-aʿtadnā li-l-kāfirīna ʿadhāban muhīnā
  trad: Ceux qui sont avares (*yabkhalūn*), ordonnent aux gens l'avarice, et dissimulent ce qu'Allaah leur a donné de Son *faḍl* — Nous avons préparé pour les *kāfirīn* un châtiment humiliant.
- ref: S.4:38
  ar: وَالَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ رِئَاءَ النَّاسِ وَلَا يُؤْمِنُونَ بِاللَّهِ وَلَا بِالْيَوْمِ الْآخِرِ ۗ وَمَن يَكُنِ الشَّيْطَانُ لَهُ قَرِينًا فَسَاءَ قَرِينًا
  trl: Wa-lladhīna yunfiqūna amwālahum riʾāʾa n-nāsi wa-lā yuʾminūna bi-llāhi wa-lā bi-l-yawmi l-ākhir — wa-man yakuni sh-shayṭānu lahu qarīnan fa-sāʾa qarīnā
  trad: Et ceux qui dépensent leurs biens par *riʾāʾ* (ostentation devant les gens), sans croire en Allaah ni au Jour dernier — et quiconque a pour compagnon (*qarīn*) le *shayṭān*, quel détestable compagnon.
- ref: S.4:39
  ar: وَمَاذَا عَلَيْهِمْ لَوْ آمَنُوا بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَأَنفَقُوا مِمَّا رَزَقَهُمُ اللَّهُ ۚ وَكَانَ اللَّهُ بِهِمْ عَلِيمًا
  trl: Wa-mādhā ʿalayhim law āmanū bi-llāhi wa-l-yawmi l-ākhiri wa-anfaqū mimmā razaqahumu llāh — wa-kāna llāhu bihim ʿalīmā
  trad: Et qu'aurait-ce été pour eux s'ils avaient cru en Allaah et au Jour dernier, et avaient dépensé de ce dont Allaah les a pourvus ? Allaah est, à leur sujet, *ʿAlīm*.
- ref: S.4:40
  ar: إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ ۖ وَإِن تَكُ حَسَنَةً يُضَاعِفْهَا وَيُؤْتِ مِن لَّدُنْهُ أَجْرًا عَظِيمًا
  trl: Inna llāha lā yaẓlimu mithqāla dharratin — wa-in taku ḥasanatan yuḍāʿifhā wa-yuʾti min ladunhu ajran ʿaẓīmā
  trad: Allaah ne lèse pas [même] du poids d'une *dharra* (particule infime) — et s'il s'agit d'une *ḥasana* (bonne action), Il la multiplie et accorde, de Sa part, une récompense immense.
- ref: S.4:41
  ar: فَكَيْفَ إِذَا جِئْنَا مِن كُلِّ أُمَّةٍ بِشَهِيدٍ وَجِئْنَا بِكَ عَلَىٰ هَٰؤُلَاءِ شَهِيدًا
  trl: Fa-kayfa idhā jiʾnā min kulli ummatin bi-shahīdin wa-jiʾnā bika ʿalā hāʾulāʾi shahīdā
  trad: Comment sera-ce, lorsque Nous ferons venir, de chaque *umma*, un témoin, et que Nous te ferons venir, toi, comme témoin sur ceux-ci ?
- ref: S.4:42
  ar: يَوْمَئِذٍ يَوَدُّ الَّذِينَ كَفَرُوا وَعَصَوُا الرَّسُولَ لَوْ تُسَوَّىٰ بِهِمُ الْأَرْضُ وَلَا يَكْتُمُونَ اللَّهَ حَدِيثًا
  trl: Yawmaʾidhin yawaddu lladhīna kafarū wa-ʿaṣawu r-rasūla law tusawwā bihimu l-arḍu wa-lā yaktumūna llāha ḥadīthā
  trad: Ce jour-là, ceux qui ont commis le *kufr* et désobéi au *rasūl* voudraient que la terre soit aplanie sur eux — et ils ne pourront rien dissimuler à Allaah.
- ref: S.4:43
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقْرَبُوا الصَّلَاةَ وَأَنتُمْ سُكَارَىٰ حَتَّىٰ تَعْلَمُوا مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِي سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا ۚ وَإِن كُنتُم مَّرْضَىٰ أَوْ عَلَىٰ سَفَرٍ أَوْ جَاءَ أَحَدٌ مِّنكُم مِّنَ الْغَائِطِ أَوْ لَامَسْتُمُ النِّسَاءَ فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ ۗ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا
  trl: Yā ayyuhā lladhīna āmanū lā taqrabu ṣ-ṣalāta wa-antum sukārā ḥattā taʿlamū mā taqūlūna wa-lā junuban illā ʿābirī sabīlin ḥattā taghtasilū — wa-in kuntum marḍā aw ʿalā safarin aw jāʾa aḥadun minkum mina l-ghāʾiṭi aw lāmastumu n-nisāʾa fa-lam tajidū māʾan fa-tayammamū ṣaʿīdan ṭayyiban fa-msaḥū bi-wujūhikum wa-aydīkum — inna llāha kāna ʿafuwwan ghafūrā
  trad: Ô vous qui avez cru, ne vous approchez pas de la *ṣalāt* alors que vous êtes *sukārā* (dans un état d'ivresse), jusqu'à ce que vous sachiez ce que vous dites — ni en état de *junub* (impureté majeure), sauf en simples passants (*ʿābirī sabīl*), jusqu'à ce que vous vous laviez entièrement (*taghtasilū*). Et si vous êtes malades, ou en voyage, ou que l'un de vous revient du *ghāʾiṭ* (lieu retiré, besoin naturel), ou que vous avez eu un contact avec les femmes (*lāmastumu n-nisāʾ*), et que vous ne trouvez pas d'eau, alors recourez au *tayammum* sur une surface pure (*ṣaʿīd ṭayyib*), et passez-en sur vos visages et vos mains — Allaah est, certes, *ʿAfuww* (Ce qui efface), *Ghafūr*.
- ref: S.4:44
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يَشْتَرُونَ الضَّلَالَةَ وَيُرِيدُونَ أَن تَضِلُّوا السَّبِيلَ
  trl: A-lam tara ilā lladhīna ūtū naṣīban mina l-kitābi yashtarūna ḍ-ḍalālata wa-yurīdūna an taḍillū s-sabīl
  trad: 'N''as-tu pas considéré ceux à qui a été donnée une part (*naṣīb*) du Livre : ils achètent l''égarement (*aḍ-ḍalāla*) et veulent que vous vous égariez du chemin (*as-sabīl*).'
- ref: S.4:45
  ar: وَاللَّهُ أَعْلَمُ بِأَعْدَائِكُمْ ۚ وَكَفَىٰ بِاللَّهِ وَلِيًّا وَكَفَىٰ بِاللَّهِ نَصِيرًا
  trl: Wa-llāhu aʿlamu bi-aʿdāʾikum — wa-kafā bi-llāhi walīyyan wa-kafā bi-llāhi naṣīrā
  trad: Allaah connaît mieux vos ennemis. Allaah suffit comme *walī* (protecteur), et Allaah suffit comme *naṣīr* (secours).
- ref: S.4:46
  ar: مِّنَ الَّذِينَ هَادُوا يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ وَيَقُولُونَ سَمِعْنَا وَعَصَيْنَا وَاسْمَعْ غَيْرَ مُسْمَعٍ وَرَاعِنَا لَيًّا بِأَلْسِنَتِهِمْ وَطَعْنًا فِي الدِّينِ ۚ وَلَوْ أَنَّهُمْ قَالُوا سَمِعْنَا وَأَطَعْنَا وَاسْمَعْ وَانظُرْنَا لَكَانَ خَيْرًا لَّهُمْ وَأَقْوَمَ وَلَـٰكِن لَّعَنَهُمُ اللَّهُ بِكُفْرِهِمْ فَلَا يُؤْمِنُونَ إِلَّا قَلِيلًا
  trl: Mina lladhīna hādū yuḥarrifūna l-kalima ʿan mawāḍiʿihi wa-yaqūlūna samiʿnā wa-ʿaṣaynā wa-smaʿ ghayra musmaʿin wa-rāʿinā layyan bi-alsinatihim wa-ṭaʿnan fī d-dīn — wa-law annahum qālū samiʿnā wa-aṭaʿnā wa-smaʿ wa-nẓurnā la-kāna khayran lahum wa-aqwama wa-lākin laʿanahumu llāhu bi-kufrihim fa-lā yuʾminūna illā qalīlā
  trad: 'Parmi ceux qui pratiquent le judaïsme (*min alladhīna hādū*), il en est qui détournent la parole (*al-kalim*) de ses emplacements (*ʿan mawāḍiʿihi*), et disent : « Nous avons entendu et nous avons désobéi », et « Écoute — sans être fait d''entendre », et « *rāʿinā* », tordant [le sens] avec leurs langues et portant atteinte au *dīn*. S''ils avaient dit : « Nous avons entendu et nous avons obéi », et « Écoute », et « *unẓurnā* », cela aurait été meilleur pour eux et plus droit — mais Allaah les a éloignés (*laʿana*) pour leur *kufr*, et ils ne croient que peu.'
- ref: S.4:47
  ar: يَا أَيُّهَا الَّذِينَ أُوتُوا الْكِتَابَ آمِنُوا بِمَا نَزَّلْنَا مُصَدِّقًا لِّمَا مَعَكُم مِّن قَبْلِ أَن نَّطْمِسَ وُجُوهًا فَنَرُدَّهَا عَلَىٰ أَدْبَارِهَا أَوْ نَلْعَنَهُمْ كَمَا لَعَنَّا أَصْحَابَ السَّبْتِ ۚ وَكَانَ أَمْرُ اللَّهِ مَفْعُولًا
  trl: Yā ayyuhā lladhīna ūtū l-kitāba āminū bi-mā nazzalnā muṣaddiqan li-mā maʿakum min qabli an naṭmisa wujūhan fa-naruddahā ʿalā adbārihā aw nalʿanahum ka-mā laʿannā aṣḥāba s-sabt — wa-kāna amru llāhi mafʿūlā
  trad: Ô vous à qui a été donné le Livre, croyez en ce que Nous avons fait descendre, confirmant ce qui est avec vous, avant que Nous n'effacions des visages pour les retourner en arrière, ou que Nous les éloignions comme Nous avons éloigné les compagnons du *sabt*. L'ordre d'Allaah est chose accomplie.
- ref: S.4:48
  ar: إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ ۚ وَمَن يُشْرِكْ بِاللَّهِ فَقَدِ افْتَرَىٰ إِثْمًا عَظِيمًا
  trl: Inna llāha lā yaghfiru an yushraka bihi wa-yaghfiru mā dūna dhālika li-man yashāʾu — wa-man yushrik bi-llāhi fa-qadi ftarā ithman ʿaẓīmā
  trad: Allaah ne pardonne pas qu'on Lui associe (*yushraka bihi*) — mais Il pardonne, en-dehors de cela, à qui Il veut. Quiconque associe (*yushrik*) à Allaah a fabriqué (*iftarā*) une faute immense.
- ref: S.4:49
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ يُزَكُّونَ أَنفُسَهُم ۚ بَلِ اللَّهُ يُزَكِّي مَن يَشَاءُ وَلَا يُظْلَمُونَ فَتِيلًا
  trl: A-lam tara ilā lladhīna yuzakkūna anfusahum — bali llāhu yuzakkī man yashāʾu wa-lā yuẓlamūna fatīlā
  trad: N'as-tu pas considéré ceux qui s'attribuent à eux-mêmes la pureté (*yuzakkūna anfusahum*) ? C'est Allaah plutôt qui purifie (*yuzakkī*) qui Il veut, et ils ne seront lésés d'un *fatīl*.
- ref: S.4:50
  ar: انظُرْ كَيْفَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ ۖ وَكَفَىٰ بِهِ إِثْمًا مُّبِينًا
  trl: Unẓur kayfa yaftarūna ʿalā llāhi l-kadhiba — wa-kafā bihi ithman mubīnā
  trad: Regarde comme ils fabriquent (*yaftarūna*) le mensonge sur Allaah — cela suffit comme faute manifeste.
- ref: S.4:51
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يُؤْمِنُونَ بِالْجِبْتِ وَالطَّاغُوتِ وَيَقُولُونَ لِلَّذِينَ كَفَرُوا هَـٰؤُلَاءِ أَهْدَىٰ مِنَ الَّذِينَ آمَنُوا سَبِيلًا
  trl: A-lam tara ilā lladhīna ūtū naṣīban mina l-kitābi yuʾminūna bi-l-jibti wa-ṭ-ṭāghūti wa-yaqūlūna li-lladhīna kafarū hāʾulāʾi ahdā mina lladhīna āmanū sabīlā
  trad: 'N''as-tu pas considéré ceux à qui a été donnée une part du Livre : ils croient au *jibt* et au *ṭāghūt*, et disent de ceux qui ont commis le *kufr* : « Ceux-là sont plus guidés en chemin que ceux qui ont cru. »'
- ref: S.4:52
  ar: أُولَـٰئِكَ الَّذِينَ لَعَنَهُمُ اللَّهُ ۖ وَمَن يَلْعَنِ اللَّهُ فَلَن تَجِدَ لَهُ نَصِيرًا
  trl: Ulāʾika lladhīna laʿanahumu llāhu — wa-man yalʿani llāhu fa-lan tajida lahu naṣīrā
  trad: Ceux-là sont ceux qu'Allaah a éloignés — et quiconque Allaah éloigne, tu ne lui trouveras jamais de *naṣīr*.
- ref: S.4:53
  ar: أَمْ لَهُمْ نَصِيبٌ مِّنَ الْمُلْكِ فَإِذًا لَّا يُؤْتُونَ النَّاسَ نَقِيرًا
  trl: Am lahum naṣībun mina l-mulki fa-idhan lā yuʾtūna n-nāsa naqīrā
  trad: Ont-ils une part du *mulk* ? Alors ils ne donneraient pas aux gens même un *naqīr*.
- ref: S.4:54
  ar: أَمْ يَحْسُدُونَ النَّاسَ عَلَىٰ مَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ ۖ فَقَدْ آتَيْنَا آلَ إِبْرَاهِيمَ الْكِتَابَ وَالْحِكْمَةَ وَآتَيْنَاهُم مُّلْكًا عَظِيمًا
  trl: Am yaḥsudūna n-nāsa ʿalā mā ātāhumu llāhu min faḍlihi — fa-qad ātaynā āla ibrāhīma l-kitāba wa-l-ḥikmata wa-ātaynāhum mulkan ʿaẓīmā
  trad: Ou envient-ils les gens pour ce qu'Allaah leur a donné de Sa faveur (*faḍl*) ? Nous avons pourtant donné à la famille d'Ibrāhīm le Livre et la *ḥikma*, et Nous leur avons donné un *mulk* immense.
- ref: S.4:55
  ar: فَمِنْهُم مَّنْ آمَنَ بِهِ وَمِنْهُم مَّن صَدَّ عَنْهُ ۚ وَكَفَىٰ بِجَهَنَّمَ سَعِيرًا
  trl: Fa-minhum man āmana bihi wa-minhum man ṣadda ʿanhu — wa-kafā bi-jahannama saʿīrā
  trad: Parmi eux, il en est qui ont cru en lui, et parmi eux il en est qui s'en sont détournés (*ṣadda ʿanhu*) — Jahannam suffit comme brasier (*saʿīr*).
- ref: S.4:56
  ar: إِنَّ الَّذِينَ كَفَرُوا بِآيَاتِنَا سَوْفَ نُصْلِيهِمْ نَارًا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَاهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا الْعَذَابَ ۗ إِنَّ اللَّهَ كَانَ عَزِيزًا حَكِيمًا
  trl: Inna lladhīna kafarū bi-āyātinā sawfa nuṣlīhim nāran kullamā naḍijat julūduhum baddalnāhum julūdan ghayrahā li-yadhūqū l-ʿadhāb — inna llāha kāna ʿazīzan ḥakīmā
  trad: Ceux qui ont commis le *kufr* envers Nos *āyāt*, Nous les ferons brûler dans un feu. Chaque fois que leurs peaux seront consumées, Nous leur en substituerons d'autres, afin qu'ils goûtent le châtiment. Allaah est, certes, *ʿazīz*, *ḥakīm*.
- ref: S.4:57
  ar: وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَنُدْخِلُهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ لَّهُمْ فِيهَا أَزْوَاجٌ مُّطَهَّرَةٌ ۖ وَنُدْخِلُهُمْ ظِلًّا ظَلِيلًا
  trl: Wa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti sa-nudkhiluhum jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā abadan — lahum fīhā azwājun muṭahharatun wa-nudkhiluhum ẓillan ẓalīlā
  trad: Et ceux qui ont cru et ont accompli les œuvres droites (*aṣ-ṣāliḥāt*), Nous les ferons entrer dans des jardins sous lesquels coulent les rivières, y demeurant fixement, à jamais. Pour eux là des épouses purifiées (*azwāj muṭahhara*), et Nous les ferons entrer dans une ombre pleinement ombreuse.
- ref: S.4:58
  ar: ۞ إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ ۚ إِنَّ اللَّهَ نِعِمَّا يَعِظُكُم بِهِ ۗ إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا
  trl: Inna llāha yaʾmurukum an tuʾaddū l-amānāti ilā ahlihā wa-idhā ḥakamtum bayna n-nāsi an taḥkumū bi-l-ʿadl — inna llāha niʿimmā yaʿiẓukum bihi — inna llāha kāna samīʿan baṣīrā
  trad: Allaah vous ordonne de restituer les *amānāt* (les charges confiées) à leurs ayants droit, et, quand vous jugez entre les gens, de juger avec *al-ʿadl*. Ce à quoi Allaah vous exhorte est excellent. Allaah est, certes, *Samīʿ*, *Baṣīr*.
- ref: S.4:59
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ ۖ فَإِن تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۚ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا
  trl: Yā ayyuhā lladhīna āmanū aṭīʿū llāha wa-aṭīʿū r-rasūla wa-ūlī l-amri minkum — fa-in tanāzaʿtum fī shayʾin fa-ruddūhu ilā llāhi wa-r-rasūli in kuntum tuʾminūna bi-llāhi wa-l-yawmi l-ākhir — dhālika khayrun wa-aḥsanu taʾwīlā
  trad: Ô vous qui avez cru, obéissez à Allaah, et obéissez au *rasūl* et à ceux détenteurs de l'*amr* parmi vous. Et si vous êtes en litige sur une chose, renvoyez-la à Allaah et au *rasūl*, si vous croyez en Allaah et au Jour dernier — cela est meilleur, et de plus belle interprétation (*taʾwīl*).
- ref: S.4:60
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ يَزْعُمُونَ أَنَّهُمْ آمَنُوا بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ يُرِيدُونَ أَن يَتَحَاكَمُوا إِلَى الطَّاغُوتِ وَقَدْ أُمِرُوا أَن يَكْفُرُوا بِهِ وَيُرِيدُ الشَّيْطَانُ أَن يُضِلَّهُمْ ضَلَالًا بَعِيدًا
  trl: A-lam tara ilā lladhīna yazʿumūna annahum āmanū bi-mā unzila ilayka wa-mā unzila min qablika yurīdūna an yataḥākamū ilā ṭ-ṭāghūti wa-qad umirū an yakfurū bihi wa-yurīdu sh-shayṭānu an yuḍillahum ḍalālan baʿīdā
  trad: 'N''as-tu pas considéré ceux qui prétendent (*yazʿumūna*) avoir cru à ce qui t''a été descendu et à ce qui a été descendu avant toi : ils veulent porter leur litige (*yataḥākamū*) devant le *ṭāghūt*, alors qu''il leur a été ordonné de le renier — et le *shayṭān* veut les égarer d''un égarement lointain.'
- ref: S.4:61
  ar: وَإِذَا قِيلَ لَهُمْ تَعَالَوْا إِلَىٰ مَا أَنزَلَ اللَّهُ وَإِلَى الرَّسُولِ رَأَيْتَ الْمُنَافِقِينَ يَصُدُّونَ عَنكَ صُدُودًا
  trl: Wa-idhā qīla lahum taʿālaw ilā mā anzala llāhu wa-ilā r-rasūli raʾayta l-munāfiqīna yaṣuddūna ʿanka ṣudūdā
  trad: 'Et quand il leur est dit : « Venez vers ce qu''a fait descendre Allaah, et vers le *rasūl* », tu vois les *munāfiqūn* se détourner de toi d''un détournement complet.'
- ref: S.4:62–63
  ar: فَكَيْفَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ بِمَا قَدَّمَتْ أَيْدِيهِمْ ثُمَّ جَاءُوكَ يَحْلِفُونَ بِاللَّهِ إِنْ أَرَدْنَا إِلَّا إِحْسَانًا وَتَوْفِيقًا ۝ أُولَـٰئِكَ الَّذِينَ يَعْلَمُ اللَّهُ مَا فِي قُلُوبِهِمْ فَأَعْرِضْ عَنْهُمْ وَعِظْهُمْ وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا
  trl: Fa-kayfa idhā aṣābathum muṣībatun bi-mā qaddamat aydīhim thumma jāʾūka yaḥlifūna bi-llāhi in aradnā illā iḥsānan wa-tawfīqā · Ulāʾika lladhīna yaʿlamu llāhu mā fī qulūbihim fa-aʿriḍ ʿanhum wa-ʿiẓhum wa-qul lahum fī anfusihim qawlan balīghā
  trad: 'Qu''en sera-t-il donc, quand un malheur les atteindra pour ce que leurs mains ont préparé, puis qu''ils viendront à toi jurant par Allaah : « Nous n''avons voulu que bienfaisance et concordance » ? — Ceux-là, Allaah sait ce qu''il y a dans leurs cœurs. Détourne-toi d''eux, exhorte-les, et dis-leur, à propos d''eux-mêmes, une parole pénétrante (*balīgh*).'
- ref: S.4:64
  ar: وَمَا أَرْسَلْنَا مِن رَّسُولٍ إِلَّا لِيُطَاعَ بِإِذْنِ اللَّهِ ۚ وَلَوْ أَنَّهُمْ إِذ ظَّلَمُوا أَنفُسَهُمْ جَاءُوكَ فَاسْتَغْفَرُوا اللَّهَ وَاسْتَغْفَرَ لَهُمُ الرَّسُولُ لَوَجَدُوا اللَّهَ تَوَّابًا رَّحِيمًا
  trl: Wa-mā arsalnā min rasūlin illā li-yuṭāʿa bi-idhni llāh — wa-law annahum idh ẓalamū anfusahum jāʾūka fa-staghfarū llāha wa-staghfara lahumu r-rasūlu la-wajadū llāha tawwāban raḥīmā
  trad: Nous n'avons envoyé aucun *rasūl* si ce n'est pour qu'il soit obéi, par la permission d'Allaah. S'ils étaient venus à toi, quand ils se sont fait tort à eux-mêmes, pour demander pardon à Allaah, et que le *rasūl* eût demandé pardon pour eux, ils auraient trouvé Allaah *Tawwāb*, *Raḥīm*.
- ref: S.4:65
  ar: فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا
  trl: Fa-lā wa-rabbika lā yuʾminūna ḥattā yuḥakkimūka fīmā shajara baynahum thumma lā yajidū fī anfusihim ḥarajan mimmā qaḍayta wa-yusallimū taslīmā
  trad: Non — par ton *Rabb* — ils ne croient pas tant qu'ils ne t'auront pas pris pour arbitre dans ce qui les divise, puis ne trouveront en eux-mêmes aucune gêne (*ḥaraj*) de ce que tu auras tranché, et se soumettront (*yusallimū*) pleinement.
- ref: S.4:66–68
  ar: وَلَوْ أَنَّا كَتَبْنَا عَلَيْهِمْ أَنِ اقْتُلُوا أَنفُسَكُمْ أَوِ اخْرُجُوا مِن دِيَارِكُم مَّا فَعَلُوهُ إِلَّا قَلِيلٌ مِّنْهُمْ ۖ وَلَوْ أَنَّهُمْ فَعَلُوا مَا يُوعَظُونَ بِهِ لَكَانَ خَيْرًا لَّهُمْ وَأَشَدَّ تَثْبِيتًا ۝ وَإِذًا لَّآتَيْنَاهُم مِّن لَّدُنَّا أَجْرًا عَظِيمًا ۝ وَلَهَدَيْنَاهُمْ صِرَاطًا مُّسْتَقِيمًا
  trl: Wa-law annā katabnā ʿalayhim ani qtulū anfusakum awi khrujū min diyārikum mā faʿalūhu illā qalīlun minhum — wa-law annahum faʿalū mā yūʿaẓūna bihi la-kāna khayran lahum wa-ashadda tathbītā · Wa-idhan la-ātaynāhum min ladunnā ajran ʿaẓīmā · Wa-la-hadaynāhum ṣirāṭan mustaqīmā
  trad: 'Et si Nous leur avions prescrit : « Tuez-vous vous-mêmes » ou « Sortez de vos demeures », ils ne l''auraient fait, sauf un petit nombre d''entre eux. Et s''ils avaient fait ce à quoi ils sont exhortés, cela aurait été meilleur pour eux et d''un affermissement plus grand. Et alors, Nous leur aurions donné, de Notre part, une rétribution immense. Et Nous les aurions guidés vers un chemin droit.'
- ref: S.4:69–70
  ar: وَمَن يُطِعِ اللَّهَ وَالرَّسُولَ فَأُولَـٰئِكَ مَعَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِم مِّنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ ۚ وَحَسُنَ أُولَـٰئِكَ رَفِيقًا ۝ ذَٰلِكَ الْفَضْلُ مِنَ اللَّهِ ۚ وَكَفَىٰ بِاللَّهِ عَلِيمًا
  trl: Wa-man yuṭiʿi llāha wa-r-rasūla fa-ulāʾika maʿa lladhīna anʿama llāhu ʿalayhim mina n-nabiyyīna wa-ṣ-ṣiddīqīna wa-sh-shuhadāʾi wa-ṣ-ṣāliḥīn — wa-ḥasuna ulāʾika rafīqā · Dhālika l-faḍlu mina llāh — wa-kafā bi-llāhi ʿalīmā
  trad: Et quiconque obéit à Allaah et au *rasūl*, ceux-là seront avec ceux qu'Allaah a comblés de Sa faveur parmi les *nabiyyīn*, les *ṣiddīqīn*, les *shuhadāʾ* et les *ṣāliḥīn* — et quelle excellente compagnie (*rafīq*) que ceux-là ! Cela est la faveur (*faḍl*) venant d'Allaah — et Allaah suffit comme *ʿAlīm*.
- ref: S.4:71
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا خُذُوا حِذْرَكُمْ فَانفِرُوا ثُبَاتٍ أَوِ انفِرُوا جَمِيعًا
  trl: Yā ayyuhā lladhīna āmanū khudhū ḥidhrakum fa-nfirū thubātin awi nfirū jamīʿā
  trad: Ô vous qui avez cru, prenez vos précautions (*ḥidhr*), puis avancez par groupes, ou avancez tous ensemble.
- ref: S.4:72–73
  ar: وَإِنَّ مِنكُمْ لَمَن لَّيُبَطِّئَنَّ فَإِنْ أَصَابَتْكُم مُّصِيبَةٌ قَالَ قَدْ أَنْعَمَ اللَّهُ عَلَيَّ إِذْ لَمْ أَكُن مَّعَهُمْ شَهِيدًا ۝ وَلَئِنْ أَصَابَكُمْ فَضْلٌ مِّنَ اللَّهِ لَيَقُولَنَّ كَأَن لَّمْ تَكُن بَيْنَكُمْ وَبَيْنَهُ مَوَدَّةٌ يَا لَيْتَنِي كُنتُ مَعَهُمْ فَأَفُوزَ فَوْزًا عَظِيمًا
  trl: Wa-inna minkum la-man la-yubaṭṭiʾanna fa-in aṣābatkum muṣībatun qāla qad anʿama llāhu ʿalayya idh lam akun maʿahum shahīdā · Wa-la-in aṣābakum faḍlun mina llāhi la-yaqūlanna ka-an lam takun baynakum wa-baynahu mawaddatun yā laytanī kuntu maʿahum fa-afūza fawzan ʿaẓīmā
  trad: 'Et il en est certes, parmi vous, qui traînera assurément [en arrière] : si un malheur vous atteint, il dira : « Allaah m''a comblé, du fait que je n''étais pas témoin avec eux. » Et si une faveur d''Allaah vous atteint, il dira assurément — comme s''il n''y avait entre vous et lui nulle affection — « Que n''étais-je avec eux, j''aurais alors obtenu un succès immense ! »'
- ref: S.4:74
  ar: ۞ فَلْيُقَاتِلْ فِي سَبِيلِ اللَّهِ الَّذِينَ يَشْرُونَ الْحَيَاةَ الدُّنْيَا بِالْآخِرَةِ ۚ وَمَن يُقَاتِلْ فِي سَبِيلِ اللَّهِ فَيُقْتَلْ أَوْ يَغْلِبْ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا
  trl: Fa-l-yuqātil fī sabīli llāhi lladhīna yashrūna l-ḥayāta d-dunyā bi-l-ākhirah — wa-man yuqātil fī sabīli llāhi fa-yuqtal aw yaghlib fa-sawfa nuʾtīhi ajran ʿaẓīmā
  trad: Que combattent donc dans le *sabīl* d'Allaah ceux qui échangent (*yashrūna*) la vie de ce bas monde contre l'au-delà. Et quiconque combat dans le *sabīl* d'Allaah, qu'il soit tué ou qu'il soit vainqueur, Nous lui donnerons une rétribution immense.
- ref: S.4:75–76
  ar: وَمَا لَكُمْ لَا تُقَاتِلُونَ فِي سَبِيلِ اللَّهِ وَالْمُسْتَضْعَفِينَ مِنَ الرِّجَالِ وَالنِّسَاءِ وَالْوِلْدَانِ الَّذِينَ يَقُولُونَ رَبَّنَا أَخْرِجْنَا مِنْ هَـٰذِهِ الْقَرْيَةِ الظَّالِمِ أَهْلُهَا وَاجْعَل لَّنَا مِن لَّدُنكَ وَلِيًّا وَاجْعَل لَّنَا مِن لَّدُنكَ نَصِيرًا ۝ الَّذِينَ آمَنُوا يُقَاتِلُونَ فِي سَبِيلِ اللَّهِ ۖ وَالَّذِينَ كَفَرُوا يُقَاتِلُونَ فِي سَبِيلِ الطَّاغُوتِ فَقَاتِلُوا أَوْلِيَاءَ الشَّيْطَانِ ۖ إِنَّ كَيْدَ الشَّيْطَانِ كَانَ ضَعِيفًا
  trl: Wa-mā lakum lā tuqātilūna fī sabīli llāhi wa-l-mustaḍʿafīna mina r-rijāli wa-n-nisāʾi wa-l-wildāni lladhīna yaqūlūna rabbanā akhrijnā min hādhihi l-qaryati ẓ-ẓālimi ahluhā wa-jʿal lanā min ladunka walīyyan wa-jʿal lanā min ladunka naṣīrā · Alladhīna āmanū yuqātilūna fī sabīli llāh — wa-lladhīna kafarū yuqātilūna fī sabīli ṭ-ṭāghūt — fa-qātilū awliyāʾa sh-shayṭān — inna kayda sh-shayṭāni kāna ḍaʿīfā
  trad: 'Et qu''avez-vous à ne pas combattre dans le *sabīl* d''Allaah, et pour les *mustaḍʿafīn* (rendus faibles) parmi les hommes, les femmes et les enfants, qui disent : « Notre *Rabb*, fais-nous sortir de cette cité dont les habitants sont injustes, et donne-nous, de Ta part, un *walī*, et donne-nous, de Ta part, un *naṣīr* » ? Ceux qui ont cru combattent dans le *sabīl* d''Allaah, et ceux qui ont commis le *kufr* combattent dans le *sabīl* du *ṭāghūt* — combattez donc les *awliyāʾ* du *shayṭān* : la ruse (*kayd*) du *shayṭān* est certes faible.'
- ref: S.4:77
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ قِيلَ لَهُمْ كُفُّوا أَيْدِيَكُمْ وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ فَلَمَّا كُتِبَ عَلَيْهِمُ الْقِتَالُ إِذَا فَرِيقٌ مِّنْهُمْ يَخْشَوْنَ النَّاسَ كَخَشْيَةِ اللَّهِ أَوْ أَشَدَّ خَشْيَةً ۚ وَقَالُوا رَبَّنَا لِمَ كَتَبْتَ عَلَيْنَا الْقِتَالَ لَوْلَا أَخَّرْتَنَا إِلَىٰ أَجَلٍ قَرِيبٍ ۗ قُلْ مَتَاعُ الدُّنْيَا قَلِيلٌ وَالْآخِرَةُ خَيْرٌ لِّمَنِ اتَّقَىٰ وَلَا تُظْلَمُونَ فَتِيلًا
  trl: A-lam tara ilā lladhīna qīla lahum kuffū aydiyakum wa-aqīmū ṣ-ṣalāta wa-ātū z-zakāta fa-lammā kutiba ʿalayhimu l-qitālu idhā farīqun minhum yakhshawna n-nāsa ka-khashyati llāhi aw ashadda khashyah — wa-qālū rabbanā lima katabta ʿalaynā l-qitāla lawlā akhkhartanā ilā ajalin qarīb — qul matāʿu d-dunyā qalīlun wa-l-ākhiratu khayrun li-mani ttaqā wa-lā tuẓlamūna fatīlā
  trad: 'N''as-tu pas considéré ceux à qui il a été dit : « Retenez vos mains, accomplissez la *ṣalāt* et acquittez-vous de la *zakāt* » ? Puis, quand le *qitāl* leur a été prescrit, voilà qu''une partie d''entre eux redoute les gens comme on redoute Allaah, ou d''une crainte plus forte encore. Et ils dirent : « Notre *Rabb*, pourquoi nous as-Tu prescrit le *qitāl* ? Que ne nous as-Tu accordé un délai proche ! » Dis : « La jouissance de ce bas monde est peu de chose, et l''au-delà est meilleur pour qui se prémunit — et vous ne serez pas lésés d''un *fatīl*. »'
- ref: S.4:78–79
  ar: أَيْنَمَا تَكُونُوا يُدْرِككُّمُ الْمَوْتُ وَلَوْ كُنتُمْ فِي بُرُوجٍ مُّشَيَّدَةٍ ۗ وَإِن تُصِبْهُمْ حَسَنَةٌ يَقُولُوا هَـٰذِهِ مِنْ عِندِ اللَّهِ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌ يَقُولُوا هَـٰذِهِ مِنْ عِندِكَ ۚ قُلْ كُلٌّ مِّنْ عِندِ اللَّهِ ۖ فَمَالِ هَـٰؤُلَاءِ الْقَوْمِ لَا يَكَادُونَ يَفْقَهُونَ حَدِيثًا ۝ مَّا أَصَابَكَ مِنْ حَسَنَةٍ فَمِنَ اللَّهِ ۖ وَمَا أَصَابَكَ مِن سَيِّئَةٍ فَمِن نَّفْسِكَ ۚ وَأَرْسَلْنَاكَ لِلنَّاسِ رَسُولًا ۚ وَكَفَىٰ بِاللَّهِ شَهِيدًا
  trl: Aynamā takūnū yudrikkumu l-mawtu wa-law kuntum fī burūjin mushayyadah — wa-in tuṣibhum ḥasanatun yaqūlū hādhihi min ʿindi llāh — wa-in tuṣibhum sayyiʾatun yaqūlū hādhihi min ʿindik — qul kullun min ʿindi llāh — fa-māli hāʾulāʾi l-qawmi lā yakādūna yafqahūna ḥadīthā · Mā aṣābaka min ḥasanatin fa-mina llāh — wa-mā aṣābaka min sayyiʾatin fa-min nafsik — wa-arsalnāka li-n-nāsi rasūlā — wa-kafā bi-llāhi shahīdā
  trad: 'Où que vous soyez, la mort vous atteindra, fussiez-vous dans des tours élevées. Et si un bien les atteint, ils disent : « Ceci vient d''Allaah » ; et si un mal les atteint, ils disent : « Ceci vient de toi. » Dis : « Tout vient d''Allaah. » Qu''ont donc ces gens à ne presque rien comprendre à un propos ? Ce qui t''atteint de bien vient d''Allaah, et ce qui t''atteint de mal vient de toi-même. Nous t''avons envoyé aux gens comme *rasūl* — Allaah suffit comme *shahīd*.'
- ref: S.4:80
  ar: مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ ۖ وَمَن تَوَلَّىٰ فَمَا أَرْسَلْنَاكَ عَلَيْهِمْ حَفِيظًا
  trl: Man yuṭiʿi r-rasūla fa-qad aṭāʿa llāh — wa-man tawallā fa-mā arsalnāka ʿalayhim ḥafīẓā
  trad: Quiconque obéit au *rasūl* a donc obéi à Allaah. Et quiconque se détourne — Nous ne t'avons pas envoyé comme *ḥafīẓ* (gardien) sur eux.
- ref: S.4:81
  ar: وَيَقُولُونَ طَاعَةٌ فَإِذَا بَرَزُوا مِنْ عِندِكَ بَيَّتَ طَائِفَةٌ مِّنْهُمْ غَيْرَ الَّذِي تَقُولُ ۖ وَاللَّهُ يَكْتُبُ مَا يُبَيِّتُونَ ۖ فَأَعْرِضْ عَنْهُمْ وَتَوَكَّلْ عَلَى اللَّهِ ۚ وَكَفَىٰ بِاللَّهِ وَكِيلًا
  trl: Wa-yaqūlūna ṭāʿatun fa-idhā barazū min ʿindika bayyata ṭāʾifatun minhum ghayra lladhī taqūl — wa-llāhu yaktubu mā yubayyitūn — fa-aʿriḍ ʿanhum wa-tawakkal ʿalā llāh — wa-kafā bi-llāhi wakīlā
  trad: 'Et ils disent : « Obéissance » ; puis, quand ils sortent de chez toi, un groupe d''entre eux complote de nuit (*bayyata*) autre chose que ce que tu dis — et Allaah inscrit ce qu''ils complotent ainsi. Détourne-toi d''eux, et repose-toi sur Allaah (*tawakkal*) : Allaah suffit comme *wakīl*.'
- ref: S.4:82
  ar: أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ ۚ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا
  trl: A-fa-lā yatadabbarūna l-qurʾāna wa-law kāna min ʿindi ghayri llāhi la-wajadū fīhi khtilāfan kathīrā
  trad: Ne méditent-ils donc pas sur le Coran ? Si ce livre venait d'un autre qu'Allaah, ils y trouveraient de nombreuses contradictions.
- ref: S.4:83
  ar: وَإِذَا جَاءَهُمْ أَمْرٌ مِّنَ الْأَمْنِ أَوِ الْخَوْفِ أَذَاعُوا بِهِ ۖ وَلَوْ رَدُّوهُ إِلَى الرَّسُولِ وَإِلَىٰ أُولِي الْأَمْرِ مِنْهُمْ لَعَلِمَهُ الَّذِينَ يَسْتَنبِطُونَهُ مِنْهُمْ ۗ وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ لَاتَّبَعْتُمُ الشَّيْطَانَ إِلَّا قَلِيلًا
  trl: Wa-idhā jāʾahum amrun mina l-amni awi l-khawfi adhāʿū bih — wa-law raddūhu ilā r-rasūli wa-ilā ūlī l-amri minhum la-ʿalimahu lladhīna yastanbiṭūnahu minhum — wa-lawlā faḍlu llāhi ʿalaykum wa-raḥmatuhu la-ttabaʿtumu sh-shayṭāna illā qalīlā
  trad: Et quand leur parvient une nouvelle concernant la sécurité ou la crainte, ils la propagent. Et s'ils l'avaient renvoyée au *rasūl* et aux *ūlī l-amr* parmi eux, ceux d'entre eux capables d'en tirer les conclusions l'auraient su. Et sans la faveur d'Allaah sur vous et Sa *raḥma*, vous auriez suivi le *shayṭān*, sauf un petit nombre.
- ref: S.4:84
  ar: فَقَاتِلْ فِي سَبِيلِ اللَّهِ لَا تُكَلَّفُ إِلَّا نَفْسَكَ ۚ وَحَرِّضِ الْمُؤْمِنِينَ ۖ عَسَى اللَّهُ أَن يَكُفَّ بَأْسَ الَّذِينَ كَفَرُوا ۚ وَاللَّهُ أَشَدُّ بَأْسًا وَأَشَدُّ تَنكِيلًا
  trl: Fa-qātil fī sabīli llāhi lā tukallafu illā nafsaka — wa-ḥarriḍi l-muʾminīn — ʿasā llāhu an yakuffa baʾsa lladhīna kafarū — wa-llāhu ashaddu baʾsan wa-ashaddu tankīlā
  trad: Combats donc dans le *sabīl* d'Allaah — tu n'es chargé que de toi-même — et incite (*ḥarriḍ*) les croyants [au combat]. Il se peut qu'Allaah retienne la force de ceux qui ont commis le *kufr* — et Allaah est plus fort en force et plus fort en châtiment exemplaire (*tankīl*).
- ref: S.4:85
  ar: مَّن يَشْفَعْ شَفَاعَةً حَسَنَةً يَكُن لَّهُ نَصِيبٌ مِّنْهَا ۖ وَمَن يَشْفَعْ شَفَاعَةً سَيِّئَةً يَكُن لَّهُ كِفْلٌ مِّنْهَا ۗ وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقِيتًا
  trl: Man yashfaʿ shafāʿatan ḥasanatan yakun lahu naṣībun minhā — wa-man yashfaʿ shafāʿatan sayyiʾatan yakun lahu kiflun minhā — wa-kāna llāhu ʿalā kulli shayʾin muqītā
  trad: Quiconque intercède (*yashfaʿ*) d'une intercession bonne en aura une part ; et quiconque intercède d'une intercession mauvaise en portera une charge (*kifl*). Allaah est, sur toute chose, *Muqīt*.
- ref: S.4:86
  ar: وَإِذَا حُيِّيتُم بِتَحِيَّةٍ فَحَيُّوا بِأَحْسَنَ مِنْهَا أَوْ رُدُّوهَا ۗ إِنَّ اللَّهَ كَانَ عَلَىٰ كُلِّ شَيْءٍ حَسِيبًا
  trl: Wa-idhā ḥuyyītum bi-taḥiyyatin fa-ḥayyū bi-aḥsana minhā aw ruddūhā — inna llāha kāna ʿalā kulli shayʾin ḥasībā
  trad: Et quand on vous salue d'une salutation, saluez d'une meilleure, ou rendez-la [de façon équivalente]. Allaah est, certes, sur toute chose, *Ḥasīb*.
- ref: S.4:87
  ar: اللَّهُ لَا إِلَـٰهَ إِلَّا هُوَ ۚ لَيَجْمَعَنَّكُمْ إِلَىٰ يَوْمِ الْقِيَامَةِ لَا رَيْبَ فِيهِ ۗ وَمَنْ أَصْدَقُ مِنَ اللَّهِ حَدِيثًا
  trl: Allāhu lā ilāha illā huwa — la-yajmaʿannakum ilā yawmi l-qiyāmati lā rayba fīh — wa-man aṣdaqu mina llāhi ḥadīthā
  trad: Allaah — nulle *ilāh* si ce n'est Lui — Il vous rassemblera certes vers le Jour de la Résurrection, sans doute possible en cela. Et qui est plus véridique qu'Allaah en parole ?
- ref: S.4:88
  ar: ۞ فَمَا لَكُمْ فِي الْمُنَافِقِينَ فِئَتَيْنِ وَاللَّهُ أَرْكَسَهُم بِمَا كَسَبُوا ۚ أَتُرِيدُونَ أَن تَهْدُوا مَنْ أَضَلَّ اللَّهُ ۖ وَمَن يُضْلِلِ اللَّهُ فَلَن تَجِدَ لَهُ سَبِيلًا
  trl: Fa-mā lakum fī l-munāfiqīna fiʾatayni wa-llāhu arkasahum bi-mā kasabū — a-turīdūna an tahdū man aḍalla llāh — wa-man yuḍlili llāhu fa-lan tajida lahu sabīlā
  trad: Qu'avez-vous donc, à propos des *munāfiqūn*, à former deux camps, alors qu'Allaah les a fait retourner (*arkasa*) [à leur point de départ] pour ce qu'ils ont acquis ? Voulez-vous guider celui qu'Allaah a laissé s'égarer ? Et celui qu'Allaah laisse s'égarer, tu ne lui trouveras jamais de chemin.
- ref: S.4:89
  ar: وَدُّوا لَوْ تَكْفُرُونَ كَمَا كَفَرُوا فَتَكُونُونَ سَوَاءً ۖ فَلَا تَتَّخِذُوا مِنْهُمْ أَوْلِيَاءَ حَتَّىٰ يُهَاجِرُوا فِي سَبِيلِ اللَّهِ ۚ فَإِن تَوَلَّوْا فَخُذُوهُمْ وَاقْتُلُوهُمْ حَيْثُ وَجَدتُّمُوهُمْ ۖ وَلَا تَتَّخِذُوا مِنْهُمْ وَلِيًّا وَلَا نَصِيرًا
  trl: Waddū law takfurūna ka-mā kafarū fa-takūnūna sawāʾan — fa-lā tattakhidhū minhum awliyāʾa ḥattā yuhājirū fī sabīli llāh — fa-in tawallaw fa-khudhūhum wa-qtulūhum ḥaythu wajadtumūhum — wa-lā tattakhidhū minhum walīyyan wa-lā naṣīrā
  trad: Ils voudraient que vous commettiez le *kufr* comme ils l'ont commis, afin que vous soyez égaux [à eux]. Ne prenez donc pas d'*awliyāʾ* parmi eux, jusqu'à ce qu'ils émigrent (*yuhājirū*) dans le *sabīl* d'Allaah. S'ils se détournent [de cette condition], alors saisissez-les et tuez-les où que vous les trouviez — et ne prenez, parmi eux, ni *walī* ni *naṣīr*.
- ref: S.4:90
  ar: إِلَّا الَّذِينَ يَصِلُونَ إِلَىٰ قَوْمٍ بَيْنَكُمْ وَبَيْنَهُم مِّيثَاقٌ أَوْ جَاءُوكُمْ حَصِرَتْ صُدُورُهُمْ أَن يُقَاتِلُوكُمْ أَوْ يُقَاتِلُوا قَوْمَهُمْ ۚ وَلَوْ شَاءَ اللَّهُ لَسَلَّطَهُمْ عَلَيْكُمْ فَلَقَاتَلُوكُمْ ۚ فَإِنِ اعْتَزَلُوكُمْ فَلَمْ يُقَاتِلُوكُمْ وَأَلْقَوْا إِلَيْكُمُ السَّلَمَ فَمَا جَعَلَ اللَّهُ لَكُمْ عَلَيْهِمْ سَبِيلًا
  trl: Illā lladhīna yaṣilūna ilā qawmin baynakum wa-baynahum mīthāqun aw jāʾūkum ḥaṣirat ṣudūruhum an yuqātilūkum aw yuqātilū qawmahum — wa-law shāʾa llāhu la-sallaṭahum ʿalaykum fa-la-qātalūkum — fa-ini ʿtazalūkum fa-lam yuqātilūkum wa-alqaw ilaykumu s-salama fa-mā jaʿala llāhu lakum ʿalayhim sabīlā
  trad: Sauf ceux qui rejoignent un peuple avec qui vous avez un *mīthāq*, ou qui viennent à vous, la poitrine serrée à l'idée de vous combattre ou de combattre leur propre peuple. Et si Allaah avait voulu, Il leur aurait donné pouvoir sur vous, et ils vous auraient combattus. Si donc ils se retirent de vous, ne vous combattent pas, et vous offrent la paix (*as-salam*), alors Allaah ne vous a fait aucun chemin contre eux.
- ref: S.4:91
  ar: سَتَجِدُونَ آخَرِينَ يُرِيدُونَ أَن يَأْمَنُوكُمْ وَيَأْمَنُوا قَوْمَهُمْ كُلَّ مَا رُدُّوا إِلَى الْفِتْنَةِ أُرْكِسُوا فِيهَا ۚ فَإِن لَّمْ يَعْتَزِلُوكُمْ وَيُلْقُوا إِلَيْكُمُ السَّلَمَ وَيَكُفُّوا أَيْدِيَهُمْ فَخُذُوهُمْ وَاقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ ۚ وَأُولَـٰئِكُمْ جَعَلْنَا لَكُمْ عَلَيْهِمْ سُلْطَانًا مُّبِينًا
  trl: Sa-tajidūna ākharīna yurīdūna an yaʾmanūkum wa-yaʾmanū qawmahum — kulla mā ruddū ilā l-fitnati urkisū fīhā — fa-in lam yaʿtazilūkum wa-yulqū ilaykumu s-salama wa-yakuffū aydiyahum fa-khudhūhum wa-qtulūhum ḥaythu thaqiftumūhum — wa-ulāʾikum jaʿalnā lakum ʿalayhim sulṭānan mubīnā
  trad: 'Vous trouverez d''autres qui veulent être en sécurité avec vous et en sécurité avec leur propre peuple : chaque fois qu''ils sont ramenés à la *fitna*, ils y replongent. S''ils ne se retirent pas de vous, ne vous offrent pas la paix, et ne retiennent pas leurs mains, alors saisissez-les et tuez-les où que vous les rencontriez — et ceux-là, Nous vous avons donné sur eux une autorité manifeste (*sulṭān mubīn*).'
- ref: S.4:92
  ar: وَمَا كَانَ لِمُؤْمِنٍ أَن يَقْتُلَ مُؤْمِنًا إِلَّا خَطَأً ۚ وَمَن قَتَلَ مُؤْمِنًا خَطَأً فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ وَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ إِلَّا أَن يَصَّدَّقُوا ۚ فَإِن كَانَ مِن قَوْمٍ عَدُوٍّ لَّكُمْ وَهُوَ مُؤْمِنٌ فَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ ۖ وَإِن كَانَ مِن قَوْمٍ بَيْنَكُمْ وَبَيْنَهُم مِّيثَاقٌ فَدِيَةٌ مُّسَلَّمَةٌ إِلَىٰ أَهْلِهِ وَتَحْرِيرُ رَقَبَةٍ مُّؤْمِنَةٍ ۖ فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةً مِّنَ اللَّهِ ۗ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا
  trl: Wa-mā kāna li-muʾminin an yaqtula muʾminan illā khaṭaʾā — wa-man qatala muʾminan khaṭaʾan fa-taḥrīru raqabatin muʾminatin wa-diyatun musallamatun ilā ahlihi illā an yaṣṣaddaqū — fa-in kāna min qawmin ʿaduwwin lakum wa-huwa muʾminun fa-taḥrīru raqabatin muʾminah — wa-in kāna min qawmin baynakum wa-baynahum mīthāqun fa-diyatun musallamatun ilā ahlihi wa-taḥrīru raqabatin muʾminah — fa-man lam yajid fa-ṣiyāmu shahrayni mutatābiʿayni tawbatan mina llāh — wa-kāna llāhu ʿalīman ḥakīmā
  trad: 'Il n''appartient pas à un croyant de tuer un croyant, si ce n''est par erreur (*khaṭaʾ*). Quiconque tue un croyant par erreur : affranchir un captif (*taḥrīr raqaba*) croyant, et une *diya* (compensation) remise à sa famille, à moins qu''ils n''y renoncent par générosité (*yaṣṣaddaqū*). S''il appartenait à un peuple ennemi pour vous, mais était lui-même croyant : affranchir un captif croyant [seul]. Et s''il appartenait à un peuple avec qui vous avez un *mīthāq* : une *diya* remise à sa famille, et affranchir un captif croyant. Qui n''en trouve pas les moyens : jeûner deux mois consécutifs, comme retour (*tawba*) vers Allaah. Allaah est *ʿAlīm*, *Ḥakīm*.'
- ref: S.4:93
  ar: وَمَن يَقْتُلْ مُؤْمِنًا مُّتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ خَالِدًا فِيهَا وَغَضِبَ اللَّهُ عَلَيْهِ وَلَعَنَهُ وَأَعَدَّ لَهُ عَذَابًا عَظِيمًا
  trl: Wa-man yaqtul muʾminan mutaʿammidan fa-jazāʾuhu jahannamu khālidan fīhā wa-ghaḍiba llāhu ʿalayhi wa-laʿanahu wa-aʿadda lahu ʿadhāban ʿaẓīmā
  trad: Et quiconque tue un croyant intentionnellement (*mutaʿammidan*), sa rétribution est Jahannam, y demeurant fixement ; Allaah s'est courroucé contre lui, l'a éloigné (*laʿana*), et lui a préparé un châtiment immense.
- ref: S.4:94
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا ضَرَبْتُمْ فِي سَبِيلِ اللَّهِ فَتَبَيَّنُوا وَلَا تَقُولُوا لِمَنْ أَلْقَىٰ إِلَيْكُمُ السَّلَامَ لَسْتَ مُؤْمِنًا تَبْتَغُونَ عَرَضَ الْحَيَاةِ الدُّنْيَا فَعِندَ اللَّهِ مَغَانِمُ كَثِيرَةٌ ۚ كَذَٰلِكَ كُنتُم مِّن قَبْلُ فَمَنَّ اللَّهُ عَلَيْكُمْ فَتَبَيَّنُوا ۚ إِنَّ اللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا
  trl: Yā ayyuhā lladhīna āmanū idhā ḍarabtum fī sabīli llāhi fa-tabayyanū wa-lā taqūlū li-man alqā ilaykumu s-salāma lasta muʾminan tabtaghūna ʿaraḍa l-ḥayāti d-dunyā fa-ʿinda llāhi maghānimu kathīrah — ka-dhālika kuntum min qablu fa-manna llāhu ʿalaykum fa-tabayyanū — inna llāha kāna bi-mā taʿmalūna khabīrā
  trad: 'Ô vous qui avez cru, quand vous partez dans le *sabīl* d''Allaah, vérifiez (*tabayyanū*) — et ne dites pas à qui vous offre la paix (*alqā ilaykumu s-salām*) : « Tu n''es pas croyant », convoitant les biens de la vie de ce bas monde. Auprès d''Allaah se trouvent d''abondants butins (*maghānim*). Ainsi étiez-vous auparavant, puis Allaah vous a comblés — vérifiez donc. Allaah est, de ce que vous faites, *Khabīr*.'
- ref: S.4:95–96
  ar: لَّا يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ غَيْرُ أُولِي الضَّرَرِ وَالْمُجَاهِدُونَ فِي سَبِيلِ اللَّهِ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ ۚ فَضَّلَ اللَّهُ الْمُجَاهِدِينَ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ عَلَى الْقَاعِدِينَ دَرَجَةً ۚ وَكُلًّا وَعَدَ اللَّهُ الْحُسْنَىٰ ۚ وَفَضَّلَ اللَّهُ الْمُجَاهِدِينَ عَلَى الْقَاعِدِينَ أَجْرًا عَظِيمًا ۝ دَرَجَاتٍ مِّنْهُ وَمَغْفِرَةً وَرَحْمَةً ۚ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا
  trl: Lā yastawī l-qāʿidūna mina l-muʾminīna ghayru ūlī ḍ-ḍarari wa-l-mujāhidūna fī sabīli llāhi bi-amwālihim wa-anfusihim — faḍḍala llāhu l-mujāhidīna bi-amwālihim wa-anfusihim ʿalā l-qāʿidīna darajah — wa-kullan waʿada llāhu l-ḥusnā — wa-faḍḍala llāhu l-mujāhidīna ʿalā l-qāʿidīna ajran ʿaẓīmā · Darajātin minhu wa-maghfiratan wa-raḥmah — wa-kāna llāhu ghafūran raḥīmā
  trad: 'Ne sont pas égaux ceux des croyants qui restent assis (*al-qāʿidūn*) — hors ceux touchés d''un empêchement (*ghayru ūlī ḍ-ḍarar*) — et ceux qui s''efforcent (*al-mujāhidūn*) dans le *sabīl* d''Allaah par leurs biens et leurs personnes. Allaah a placé ceux qui s''efforcent par leurs biens et leurs personnes un degré au-dessus de ceux qui restent assis. À chacun Allaah a promis le meilleur (*al-ḥusnā*) — mais Allaah a placé ceux qui s''efforcent au-dessus de ceux qui restent assis d''une rétribution immense : des degrés venant de Lui, un pardon et une *raḥma*. Allaah est *Ghafūr*, *Raḥīm*.'
- ref: S.4:97
  ar: إِنَّ الَّذِينَ تَوَفَّاهُمُ الْمَلَائِكَةُ ظَالِمِي أَنفُسِهِمْ قَالُوا فِيمَ كُنتُمْ ۖ قَالُوا كُنَّا مُسْتَضْعَفِينَ فِي الْأَرْضِ ۚ قَالُوا أَلَمْ تَكُنْ أَرْضُ اللَّهِ وَاسِعَةً فَتُهَاجِرُوا فِيهَا ۚ فَأُولَـٰئِكَ مَأْوَاهُمْ جَهَنَّمُ ۖ وَسَاءَتْ مَصِيرًا
  trl: Inna lladhīna tawaffāhumu l-malāʾikatu ẓālimī anfusihim qālū fīma kuntum — qālū kunnā mustaḍʿafīna fī l-arḍ — qālū a-lam takun arḍu llāhi wāsiʿatan fa-tuhājirū fīhā — fa-ulāʾika maʾwāhum jahannam — wa-sāʾat maṣīrā
  trad: 'Ceux que les anges font mourir alors qu''ils se sont fait tort à eux-mêmes, [les anges] leur disent : « Dans quelle situation étiez-vous ? » Ils disent : « Nous étions rendus faibles (*mustaḍʿafīn*) sur la terre. » [Les anges] disent : « La terre d''Allaah n''était-elle pas assez vaste pour que vous y émigriez ? » Ceux-là, leur refuge est Jahannam — et quelle mauvaise destination !'
- ref: S.4:98–99
  ar: إِلَّا الْمُسْتَضْعَفِينَ مِنَ الرِّجَالِ وَالنِّسَاءِ وَالْوِلْدَانِ لَا يَسْتَطِيعُونَ حِيلَةً وَلَا يَهْتَدُونَ سَبِيلًا ۝ فَأُولَـٰئِكَ عَسَى اللَّهُ أَن يَعْفُوَ عَنْهُمْ ۚ وَكَانَ اللَّهُ عَفُوًّا غَفُورًا
  trl: Illā l-mustaḍʿafīna mina r-rijāli wa-n-nisāʾi wa-l-wildāni lā yastaṭīʿūna ḥīlatan wa-lā yahtadūna sabīlā · Fa-ulāʾika ʿasā llāhu an yaʿfuwa ʿanhum — wa-kāna llāhu ʿafuwwan ghafūrā
  trad: Sauf les *mustaḍʿafīn* parmi les hommes, les femmes et les enfants, qui ne peuvent trouver aucun moyen (*ḥīla*) ni ne trouvent de chemin. Ceux-là, il se peut qu'Allaah les efface (*yaʿfuwa*) — Allaah est *ʿAfuww*, *Ghafūr*.
- ref: S.4:100
  ar: ۞ وَمَن يُهَاجِرْ فِي سَبِيلِ اللَّهِ يَجِدْ فِي الْأَرْضِ مُرَاغَمًا كَثِيرًا وَسَعَةً ۚ وَمَن يَخْرُجْ مِن بَيْتِهِ مُهَاجِرًا إِلَى اللَّهِ وَرَسُولِهِ ثُمَّ يُدْرِكْهُ الْمَوْتُ فَقَدْ وَقَعَ أَجْرُهُ عَلَى اللَّهِ ۗ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا
  trl: Wa-man yuhājir fī sabīli llāhi yajid fī l-arḍi murāghaman kathīran wa-saʿah — wa-man yakhruj min baytihi muhājiran ilā llāhi wa-rasūlihi thumma yudrikhu l-mawtu fa-qad waqaʿa ajruhu ʿalā llāh — wa-kāna llāhu ghafūran raḥīmā
  trad: Et quiconque émigre dans le *sabīl* d'Allaah trouvera sur la terre un large refuge (*murāgham*) et une aisance (*saʿa*). Et quiconque sort de sa demeure en émigrant vers Allaah et Son *rasūl*, puis que la mort l'atteint [en chemin], sa rétribution incombe alors à Allaah. Allaah est *Ghafūr*, *Raḥīm*.
- ref: S.4:101
  ar: وَإِذَا ضَرَبْتُمْ فِي الْأَرْضِ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَقْصُرُوا مِنَ الصَّلَاةِ إِنْ خِفْتُمْ أَن يَفْتِنَكُمُ الَّذِينَ كَفَرُوا ۚ إِنَّ الْكَافِرِينَ كَانُوا لَكُمْ عَدُوًّا مُّبِينًا
  trl: Wa-idhā ḍarabtum fī l-arḍi fa-laysa ʿalaykum junāḥun an taqṣurū mina ṣ-ṣalāti in khiftum an yaftinakumu lladhīna kafarū — inna l-kāfirīna kānū lakum ʿaduwwan mubīnā
  trad: Et quand vous parcourez la terre, nulle faute sur vous à raccourcir (*taqṣurū*) la *ṣalāt*, si vous craignez que ceux qui ont commis le *kufr* ne vous mettent à l'épreuve (*yaftinakum*) — les *kāfirūn* sont pour vous un ennemi manifeste.
- ref: S.4:102
  ar: وَإِذَا كُنتَ فِيهِمْ فَأَقَمْتَ لَهُمُ الصَّلَاةَ فَلْتَقُمْ طَائِفَةٌ مِّنْهُم مَّعَكَ وَلْيَأْخُذُوا أَسْلِحَتَهُمْ فَإِذَا سَجَدُوا فَلْيَكُونُوا مِن وَرَائِكُمْ وَلْتَأْتِ طَائِفَةٌ أُخْرَىٰ لَمْ يُصَلُّوا فَلْيُصَلُّوا مَعَكَ وَلْيَأْخُذُوا حِذْرَهُمْ وَأَسْلِحَتَهُمْ ۗ وَدَّ الَّذِينَ كَفَرُوا لَوْ تَغْفُلُونَ عَنْ أَسْلِحَتِكُمْ وَأَمْتِعَتِكُمْ فَيَمِيلُونَ عَلَيْكُم مَّيْلَةً وَاحِدَةً ۚ وَلَا جُنَاحَ عَلَيْكُمْ إِن كَانَ بِكُمْ أَذًى مِّن مَّطَرٍ أَوْ كُنتُم مَّرْضَىٰ أَن تَضَعُوا أَسْلِحَتَكُمْ ۖ وَخُذُوا حِذْرَكُمْ ۗ إِنَّ اللَّهَ أَعَدَّ لِلْكَافِرِينَ عَذَابًا مُّهِينًا
  trl: Wa-idhā kunta fīhim fa-aqamta lahumu ṣ-ṣalāta fa-l-taqum ṭāʾifatun minhum maʿaka wa-l-yaʾkhudhū asliḥatahum fa-idhā sajadū fa-l-yakūnū min warāʾikum wa-l-taʾti ṭāʾifatun ukhrā lam yuṣallū fa-l-yuṣallū maʿaka wa-l-yaʾkhudhū ḥidhrahum wa-asliḥatahum — wadda lladhīna kafarū law taghfulūna ʿan asliḥatikum wa-amtiʿatikum fa-yamīlūna ʿalaykum maylatan wāḥidah — wa-lā junāḥa ʿalaykum in kāna bikum adhan min maṭarin aw kuntum marḍā an taḍaʿū asliḥatakum — wa-khudhū ḥidhrakum — inna llāha aʿadda li-l-kāfirīna ʿadhāban muhīnā
  trad: Et quand tu te trouves parmi eux et que tu leur diriges la *ṣalāt*, qu'un groupe d'entre eux se tienne avec toi et prenne ses armes ; quand ils se sont prosternés, qu'ils passent derrière vous, et qu'un autre groupe qui n'a pas encore prié vienne prier avec toi, prenant ses précautions et ses armes. Ceux qui ont commis le *kufr* voudraient que vous négligiez vos armes et vos biens, pour fondre sur vous en une seule fois. Nulle faute sur vous, s'il y a chez vous une gêne due à la pluie ou si vous êtes malades, à déposer vos armes — mais prenez vos précautions. Allaah a préparé pour les *kāfirūn* un châtiment humiliant.
- ref: S.4:103
  ar: فَإِذَا قَضَيْتُمُ الصَّلَاةَ فَاذْكُرُوا اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِكُمْ ۚ فَإِذَا اطْمَأْنَنتُمْ فَأَقِيمُوا الصَّلَاةَ ۚ إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا
  trl: Fa-idhā qaḍaytumu ṣ-ṣalāta fa-dhkurū llāha qiyāman wa-quʿūdan wa-ʿalā junūbikum — fa-idhā ṭmaʾnantum fa-aqīmū ṣ-ṣalāh — inna ṣ-ṣalāta kānat ʿalā l-muʾminīna kitāban mawqūtā
  trad: Puis, quand vous avez accompli la *ṣalāt*, rappelez-vous d'Allaah, debout, assis, ou sur vos côtés. Puis, quand vous êtes rassurés, accomplissez la *ṣalāt* [pleinement]. La *ṣalāt* est, pour les croyants, une prescription à temps fixé (*kitāban mawqūtā*).
- ref: S.4:104
  ar: وَلَا تَهِنُوا فِي ابْتِغَاءِ الْقَوْمِ ۖ إِن تَكُونُوا تَأْلَمُونَ فَإِنَّهُمْ يَأْلَمُونَ كَمَا تَأْلَمُونَ ۖ وَتَرْجُونَ مِنَ اللَّهِ مَا لَا يَرْجُونَ ۗ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا
  trl: Wa-lā tahinū fī btighāʾi l-qawmi — in takūnū taʾlamūna fa-innahum yaʾlamūna kamā taʾlamūna — wa-tarjūna mina llāhi mā lā yarjūna — wa-kāna llāhu ʿalīman ḥakīmā
  trad: Et ne faiblissez pas dans la poursuite de ce peuple. Si vous souffrez, eux aussi souffrent comme vous souffrez — mais vous espérez d'Allaah ce qu'ils n'espèrent pas. Allaah est *ʿAlīm*, *Ḥakīm*.
- ref: S.4:105
  ar: إِنَّا أَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ لِتَحْكُمَ بَيْنَ النَّاسِ بِمَا أَرَاكَ اللَّهُ ۚ وَلَا تَكُن لِّلْخَائِنِينَ خَصِيمًا
  trl: Innā anzalnā ilayka l-kitāba bi-l-ḥaqqi li-taḥkuma bayna n-nāsi bi-mā arāka llāh — wa-lā takun li-l-khāʾinīna khaṣīmā
  trad: Nous avons fait descendre sur toi le Livre avec le *ḥaqq*, afin que tu juges entre les gens selon ce qu'Allaah t'a montré. Et ne sois pas, pour les traîtres (*al-khāʾinīn*), un défenseur (*khaṣīm*).
- ref: S.4:106–107
  ar: وَاسْتَغْفِرِ اللَّهَ ۖ إِنَّ اللَّهَ كَانَ غَفُورًا رَّحِيمًا ۝ وَلَا تُجَادِلْ عَنِ الَّذِينَ يَخْتَانُونَ أَنفُسَهُمْ ۚ إِنَّ اللَّهَ لَا يُحِبُّ مَن كَانَ خَوَّانًا أَثِيمًا
  trl: Wa-staghfiri llāh — inna llāha kāna ghafūran raḥīmā · Wa-lā tujādil ʿani lladhīna yakhtānūna anfusahum — inna llāha lā yuḥibbu man kāna khawwānan athīmā
  trad: Et demande pardon à Allaah — Allaah est *Ghafūr*, *Raḥīm*. Et ne dispute pas (*tujādil*) en faveur de ceux qui se trahissent eux-mêmes (*yakhtānūna anfusahum*) — Allaah n'aime pas qui est traître invétéré, chargé de faute.
- ref: S.4:108–109
  ar: يَسْتَخْفُونَ مِنَ النَّاسِ وَلَا يَسْتَخْفُونَ مِنَ اللَّهِ وَهُوَ مَعَهُمْ إِذْ يُبَيِّتُونَ مَا لَا يَرْضَىٰ مِنَ الْقَوْلِ ۚ وَكَانَ اللَّهُ بِمَا يَعْمَلُونَ مُحِيطًا ۝ هَا أَنتُمْ هَـٰؤُلَاءِ جَادَلْتُمْ عَنْهُمْ فِي الْحَيَاةِ الدُّنْيَا فَمَن يُجَادِلُ اللَّهَ عَنْهُمْ يَوْمَ الْقِيَامَةِ أَم مَّن يَكُونُ عَلَيْهِمْ وَكِيلًا
  trl: Yastakhfūna mina n-nāsi wa-lā yastakhfūna mina llāhi wa-huwa maʿahum idh yubayyitūna mā lā yarḍā mina l-qawl — wa-kāna llāhu bi-mā yaʿmalūna muḥīṭā · Hā antum hāʾulāʾi jādaltum ʿanhum fī l-ḥayāti d-dunyā fa-man yujādilu llāha ʿanhum yawma l-qiyāmati am man yakūnu ʿalayhim wakīlā
  trad: Ils se cachent des gens, mais ne se cachent pas d'Allaah, alors qu'Il est avec eux quand ils complotent de nuit des propos qu'Il n'agrée pas. Allaah, de ce qu'ils font, est *Muḥīṭ*. Vous voilà, vous qui avez disputé en leur faveur dans la vie de ce bas monde — mais qui disputera en leur faveur auprès d'Allaah, au Jour de la Résurrection ? Ou bien qui sera pour eux un *wakīl* ?
- ref: S.4:110–111
  ar: وَمَن يَعْمَلْ سُوءًا أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللَّهَ يَجِدِ اللَّهَ غَفُورًا رَّحِيمًا ۝ وَمَن يَكْسِبْ إِثْمًا فَإِنَّمَا يَكْسِبُهُ عَلَىٰ نَفْسِهِ ۚ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا
  trl: Wa-man yaʿmal sūʾan aw yaẓlim nafsahu thumma yastaghfiri llāha yajidi llāha ghafūran raḥīmā · Wa-man yaksib ithman fa-innamā yaksibuhu ʿalā nafsih — wa-kāna llāhu ʿalīman ḥakīmā
  trad: Et quiconque fait un mal, ou se fait tort à lui-même, puis demande pardon à Allaah, trouve Allaah *Ghafūr*, *Raḥīm*. Et quiconque acquiert (*yaksib*) une faute, ne l'acquiert que contre lui-même. Allaah est *ʿAlīm*, *Ḥakīm*.
- ref: S.4:112
  ar: وَمَن يَكْسِبْ خَطِيئَةً أَوْ إِثْمًا ثُمَّ يَرْمِ بِهِ بَرِيئًا فَقَدِ احْتَمَلَ بُهْتَانًا وَإِثْمًا مُّبِينًا
  trl: Wa-man yaksib khaṭīʾatan aw ithman thumma yarmi bihi barīʾan fa-qadi ḥtamala buhtānan wa-ithman mubīnā
  trad: Et quiconque acquiert une faute ou un péché, puis en accuse un innocent, porte alors une calomnie (*buhtān*) et une faute manifeste.
- ref: S.4:113
  ar: وَلَوْلَا فَضْلُ اللَّهِ عَلَيْكَ وَرَحْمَتُهُ لَهَمَّت طَّائِفَةٌ مِّنْهُمْ أَن يُضِلُّوكَ وَمَا يُضِلُّونَ إِلَّا أَنفُسَهُمْ ۖ وَمَا يَضُرُّونَكَ مِن شَيْءٍ ۚ وَأَنزَلَ اللَّهُ عَلَيْكَ الْكِتَابَ وَالْحِكْمَةَ وَعَلَّمَكَ مَا لَمْ تَكُن تَعْلَمُ ۚ وَكَانَ فَضْلُ اللَّهِ عَلَيْكَ عَظِيمًا
  trl: Wa-lawlā faḍlu llāhi ʿalayka wa-raḥmatuhu la-hammat ṭāʾifatun minhum an yuḍillūka wa-mā yuḍillūna illā anfusahum — wa-mā yaḍurrūnaka min shayʾ — wa-anzala llāhu ʿalayka l-kitāba wa-l-ḥikmata wa-ʿallamaka mā lam takun taʿlam — wa-kāna faḍlu llāhi ʿalayka ʿaẓīmā
  trad: Et sans la faveur d'Allaah sur toi et Sa *raḥma*, un groupe d'entre eux aurait résolu de t'égarer — mais ils n'égarent qu'eux-mêmes, et ne te nuisent en rien. Allaah a fait descendre sur toi le Livre et la *ḥikma*, et t'a enseigné ce que tu ne savais pas. La faveur d'Allaah sur toi est immense.
- ref: S.4:114
  ar: ۞ لَّا خَيْرَ فِي كَثِيرٍ مِّن نَّجْوَاهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَاحٍ بَيْنَ النَّاسِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ ابْتِغَاءَ مَرْضَاتِ اللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا
  trl: Lā khayra fī kathīrin min najwāhum illā man amara bi-ṣadaqatin aw maʿrūfin aw iṣlāḥin bayna n-nās — wa-man yafʿal dhālika btighāʾa marḍāti llāhi fa-sawfa nuʾtīhi ajran ʿaẓīmā
  trad: Nul bien dans la plupart de leurs conciliabules (*najwā*), sauf pour qui ordonne une *ṣadaqa*, ou un acte *maʿrūf*, ou une réconciliation (*iṣlāḥ*) entre les gens. Quiconque fait cela en recherchant l'agrément d'Allaah, Nous lui donnerons une rétribution immense.
- ref: S.4:115
  ar: وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ نُوَلِّهِ مَا تَوَلَّىٰ وَنُصْلِهِ جَهَنَّمَ ۖ وَسَاءَتْ مَصِيرًا
  trl: Wa-man yushāqiqi r-rasūla min baʿdi mā tabayyana lahu l-hudā wa-yattabiʿ ghayra sabīli l-muʾminīna nuwallihi mā tawallā wa-nuṣlihi jahannam — wa-sāʾat maṣīrā
  trad: Et quiconque se met en rupture (*yushāqiq*) avec le *rasūl*, après que la *hudā* lui est devenue claire, et suit un autre chemin que celui des croyants, Nous le laissons à ce vers quoi il s'est tourné, et Nous le ferons brûler dans Jahannam — et quelle mauvaise destination !
- ref: S.4:116
  ar: إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ ۚ وَمَن يُشْرِكْ بِاللَّهِ فَقَدْ ضَلَّ ضَلَالًا بَعِيدًا
  trl: Inna llāha lā yaghfiru an yushraka bihi wa-yaghfiru mā dūna dhālika li-man yashāʾu — wa-man yushrik bi-llāhi fa-qad ḍalla ḍalālan baʿīdā
  trad: Allaah ne pardonne pas qu'on Lui associe (*yushraka bihi*) — mais Il pardonne, en-dehors de cela, à qui Il veut. Quiconque associe (*yushrik*) à Allaah s'est égaré (*ḍalla*) d'un égarement lointain (*ḍalālan baʿīdā*).
- ref: S.4:117–118
  ar: إِن يَدْعُونَ مِن دُونِهِ إِلَّا إِنَاثًا وَإِن يَدْعُونَ إِلَّا شَيْطَانًا مَرِيدًا * لَعَنَهُ اللَّهُ ۘ وَقَالَ لَأَتَّخِذَنَّ مِنْ عِبَادِكَ نَصِيبًا مَفْرُوضًا
  trl: In yadʿūna min dūnihi illā ināthan wa-in yadʿūna illā shayṭānan marīdā * Laʿanahu llāhu wa-qāla la-attakhidhanna min ʿibādika naṣīban mafrūḍā
  trad: 'Ils n''invoquent, en dehors de Lui, que des *ināth* — ils n''invoquent qu''un *shayṭān* rebelle (*marīd*), qu''Allaah a maudit (*laʿanahu*), et qui a dit : « Je prendrai certainement, parmi Tes serviteurs, une part fixée (*naṣīban mafrūḍā*). »'
- ref: S.4:119
  ar: وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ وَلَآمُرَنَّهُمْ فَلَيُبَتِّكُنَّ آذَانَ الْأَنْعَامِ وَلَآمُرَنَّهُمْ فَلَيُغَيِّرُنَّ خَلْقَ اللَّهِ ۚ وَمَن يَتَّخِذِ الشَّيْطَانَ وَلِيًّا مِن دُونِ اللَّهِ فَقَدْ خَسِرَ خُسْرَانًا مُبِينًا
  trl: Wa-la-uḍillannahum wa-la-umanniyannahum wa-la-āmurannahum fa-la-yubattikunna ādhāna l-anʿāmi wa-la-āmurannahum fa-la-yughayyirunna khalqa llāhi — wa-man yattakhidhi sh-shayṭāna waliyyan min dūni llāhi fa-qad khasira khusrānan mubīnā
  trad: « Je les égarerai certainement, je leur ferai certainement miroiter (*umanniyannahum*), je leur ordonnerai certainement — ils fendront alors les oreilles du bétail — je leur ordonnerai certainement — ils altéreront alors la création (*khalq*) d'Allaah. » Et quiconque prend le *shayṭān* comme *walī* en dehors d'Allaah a subi une perte (*khasira*) manifeste.
- ref: S.4:120
  ar: يَعِدُهُمْ وَيُمَنِّيهِمْ ۖ وَمَا يَعِدُهُمُ الشَّيْطَانُ إِلَّا غُرُورًا
  trl: Yaʿiduhum wa-yumannīhim — wa-mā yaʿiduhumu sh-shayṭānu illā ghurūrā
  trad: Il leur promet, il leur fait miroiter — mais le *shayṭān* ne leur promet que tromperie (*ghurūr*).
- ref: S.4:121–122
  ar: أُولَٰئِكَ مَأْوَاهُمْ جَهَنَّمُ وَلَا يَجِدُونَ عَنْهَا مَحِيصًا * وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَنُدْخِلُهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ وَعْدَ اللَّهِ حَقًّا ۚ وَمَنْ أَصْدَقُ مِنَ اللَّهِ قِيلًا
  trl: Ulāʾika maʾwāhum jahannamu wa-lā yajidūna ʿanhā maḥīṣā * Wa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti sa-nudkhiluhum jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā abadan — waʿda llāhi ḥaqqan — wa-man aṣdaqu mina llāhi qīlā
  trad: Ceux-là, leur refuge (*maʾwā*) est Jahannam, et ils n'y trouveront pas d'échappatoire (*maḥīṣ*). Et ceux qui ont cru et fait ce qui est droit (*ṣāliḥāt*), Nous les ferons entrer dans des jardins sous lesquels coulent les rivières, s'y établissant (*khālidīna*) pour toujours — promesse d'Allaah, en vérité (*ḥaqqan*) — et qui est plus véridique qu'Allaah dans Sa parole (*qīl*) ?
- ref: S.4:123
  ar: لَيْسَ بِأَمَانِيِّكُمْ وَلَا أَمَانِيِّ أَهْلِ الْكِتَابِ ۗ مَن يَعْمَلْ سُوءًا يُجْزَ بِهِ وَلَا يَجِدْ لَهُ مِن دُونِ اللَّهِ وَلِيًّا وَلَا نَصِيرًا
  trl: Laysa bi-amāniyyikum wa-lā amāniyyi ahli l-kitābi — man yaʿmal sūʾan yujza bihi wa-lā yajid lahu min dūni llāhi waliyyan wa-lā naṣīrā
  trad: 'Cela ne dépend ni de vos *amānī*, ni des *amānī* des gens du Livre : quiconque fait un mal en sera rétribué (*yujzā bihi*), et ne trouvera pour lui, en dehors d''Allaah, ni *walī* ni *naṣīr*.'
- ref: S.4:124
  ar: وَمَن يَعْمَلْ مِنَ الصَّالِحَاتِ مِن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ يَدْخُلُونَ الْجَنَّةَ وَلَا يُظْلَمُونَ نَقِيرًا
  trl: Wa-man yaʿmal mina ṣ-ṣāliḥāti min dhakarin aw unthā wa-huwa muʾminun fa-ulāʾika yadkhulūna l-jannata wa-lā yuẓlamūna naqīrā
  trad: Et quiconque fait ce qui est droit (*ṣāliḥāt*), homme ou femme, tout en étant croyant — ceux-là entreront dans la *janna*, et ne subiront pas d'injustice, pas même d'un *naqīr*.
- ref: S.4:125
  ar: وَمَنْ أَحْسَنُ دِينًا مِمَّنْ أَسْلَمَ وَجْهَهُ لِلَّهِ وَهُوَ مُحْسِنٌ وَاتَّبَعَ مِلَّةَ إِبْرَاهِيمَ حَنِيفًا ۗ وَاتَّخَذَ اللَّهُ إِبْرَاهِيمَ خَلِيلًا
  trl: Wa-man aḥsanu dīnan mimman aslama wajhahu li-llāhi wa-huwa muḥsinun wa-ttabaʿa millata ibrāhīma ḥanīfā — wa-ttakhadha llāhu ibrāhīma khalīlā
  trad: Et qui est meilleur en *dīn* que celui qui remet son *wajh* à Allaah, tout en étant *muḥsin* (agissant avec excellence), et qui suit la *milla* d'Ibrāhīm en *ḥanīf* ? Et Allaah a pris Ibrāhīm comme *khalīl*.
- ref: S.4:126
  ar: وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۚ وَكَانَ اللَّهُ بِكُلِّ شَيْءٍ مُحِيطًا
  trl: Wa-li-llāhi mā fi s-samāwāti wa-mā fi l-arḍi — wa-kāna llāhu bi-kulli shayʾin muḥīṭā
  trad: À Allaah appartient ce qui est dans les cieux et ce qui est sur la terre — et Allaah est, de toute chose, *muḥīṭ* (Ce qui embrasse tout, Ce qui cerne).
- ref: S.4:127
  ar: وَيَسْتَفْتُونَكَ فِي النِّسَاءِ ۖ قُلِ اللَّهُ يُفْتِيكُمْ فِيهِنَّ وَمَا يُتْلَىٰ عَلَيْكُمْ فِي الْكِتَابِ فِي يَتَامَى النِّسَاءِ اللَّاتِي لَا تُؤْتُونَهُنَّ مَا كُتِبَ لَهُنَّ وَتَرْغَبُونَ أَن تَنكِحُوهُنَّ وَالْمُسْتَضْعَفِينَ مِنَ الْوِلْدَانِ وَأَن تَقُومُوا لِلْيَتَامَىٰ بِالْقِسْطِ ۚ وَمَا تَفْعَلُوا مِنْ خَيْرٍ فَإِنَّ اللَّهَ كَانَ بِهِ عَلِيمًا
  trl: Wa-yastaftūnaka fi n-nisāʾi — quli llāhu yuftīkum fīhinna wa-mā yutlā ʿalaykum fi l-kitābi fī yatāmā n-nisāʾi l-lātī lā tuʾtūnahunna mā kutiba lahunna wa-targhabūna an tankiḥūhunna wa-l-mustaḍʿafīna mina l-wildāni wa-an taqūmū li-l-yatāmā bi-l-qisṭi — wa-mā tafʿalū min khayrin fa-inna llāha kāna bihi ʿalīmā
  trad: 'Et ils te demandent une *fatwā* au sujet des femmes. Dis : « Allaah vous éclaire (*yuftīkum*) à leur sujet, ainsi que ce qui vous est récité dans le Livre au sujet des orphelines (*yatāmā n-nisāʾ*) auxquelles vous ne donnez pas ce qui leur a été prescrit (*mā kutiba lahunna*), tout en désirant les épouser — et au sujet des *mustaḍʿafīn* parmi les enfants — et [il vous est prescrit] de vous tenir envers les orphelins avec *qisṭ*. » Et le bien que vous faites, Allaah en est *ʿalīm* (pleinement informé).'
- ref: S.4:128
  ar: وَإِنِ امْرَأَةٌ خَافَتْ مِن بَعْلِهَا نُشُوزًا أَوْ إِعْرَاضًا فَلَا جُنَاحَ عَلَيْهِمَا أَن يُصْلِحَا بَيْنَهُمَا صُلْحًا ۚ وَالصُّلْحُ خَيْرٌ ۗ وَأُحْضِرَتِ الْأَنفُسُ الشُّحَّ ۚ وَإِن تُحْسِنُوا وَتَتَّقُوا فَإِنَّ اللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا
  trl: Wa-ini mraʾatun khāfat min baʿlihā nushūzan aw iʿrāḍan fa-lā junāḥa ʿalayhimā an yuṣliḥā baynahumā ṣulḥan — wa-ṣ-ṣulḥu khayrun — wa-uḥḍirati l-anfusu sh-shuḥḥa — wa-in tuḥsinū wa-tattaqū fa-inna llāha kāna bimā taʿmalūna khabīrā
  trad: Et si une femme craint de la part de son époux (*baʿl*) un *nushūz* ou un détournement (*iʿrāḍ*), nul grief à leur porter s'ils trouvent entre eux un arrangement (*yuṣliḥā... ṣulḥan*) — l'arrangement (*ṣulḥ*) est meilleur. Les âmes (*al-anfus*) sont portées (*uḥḍirat*) à l'avarice (*shuḥḥ*). Mais si vous agissez avec excellence (*tuḥsinū*) et craignez [Allaah], Allaah est, de ce que vous faites, *khabīr* (pleinement informé).
- ref: S.4:129
  ar: وَلَن تَسْتَطِيعُوا أَن تَعْدِلُوا بَيْنَ النِّسَاءِ وَلَوْ حَرَصْتُمْ ۖ فَلَا تَمِيلُوا كُلَّ الْمَيْلِ فَتَذَرُوهَا كَالْمُعَلَّقَةِ ۚ وَإِن تُصْلِحُوا وَتَتَّقُوا فَإِنَّ اللَّهَ كَانَ غَفُورًا رَحِيمًا
  trl: Wa-lan tastaṭīʿū an taʿdilū bayna n-nisāʾi wa-law ḥaraṣtum — fa-lā tamīlū kulla l-mayli fa-tadharūhā ka-l-muʿallaqati — wa-in tuṣliḥū wa-tattaqū fa-inna llāha kāna ghafūran raḥīmā
  trad: Vous ne pourrez jamais être équitables (*taʿdilū*) entre les femmes, même si vous y tenez (*ḥaraṣtum*) — ne penchez donc pas d'un penchant total (*kulla l-mayl*), au point de la laisser comme suspendue (*ka-l-muʿallaqa*). Et si vous trouvez un arrangement (*tuṣliḥū*) et craignez [Allaah], Allaah est *ghafūr*, *raḥīm*.
- ref: S.4:130
  ar: وَإِن يَتَفَرَّقَا يُغْنِ اللَّهُ كُلًّا مِن سَعَتِهِ ۚ وَكَانَ اللَّهُ وَاسِعًا حَكِيمًا
  trl: Wa-in yatafarraqā yughni llāhu kullan min saʿatihi — wa-kāna llāhu wāsiʿan ḥakīmā
  trad: Et s'ils se séparent (*yatafarraqā*), Allaah rendra chacun autonome (*yughni*) par Son ampleur (*saʿatihi*) — Allaah est *Wāsiʿ*, *Ḥakīm*.
- ref: S.4:131
  ar: وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَلَقَدْ وَصَّيْنَا الَّذِينَ أُوتُوا الْكِتَابَ مِن قَبْلِكُمْ وَإِيَّاكُمْ أَنِ اتَّقُوا اللَّهَ ۚ وَإِن تَكْفُرُوا فَإِنَّ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۚ وَكَانَ اللَّهُ غَنِيًّا حَمِيدًا
  trl: Wa-li-llāhi mā fi s-samāwāti wa-mā fi l-arḍi — wa-la-qad waṣṣaynā lladhīna ūtū l-kitāba min qablikum wa-iyyākum ani ttaqū llāha — wa-in takfurū fa-inna li-llāhi mā fi s-samāwāti wa-mā fi l-arḍi — wa-kāna llāhu ghaniyyan ḥamīdā
  trad: À Allaah appartient ce qui est dans les cieux et ce qui est sur la terre. Nous avons certes prescrit (*waṣṣaynā*) à ceux à qui le Livre a été donné avant vous, ainsi qu'à vous-mêmes, de craindre Allaah (*ittaqū llāh*). Et si vous *takfurū* (rejetez), à Allaah appartient ce qui est dans les cieux et ce qui est sur la terre — Allaah est *Ghaniyy* (Ce qui se suffit à Soi-même), *Ḥamīd* (Ce à quoi revient toute louange).
- ref: S.4:132
  ar: وَلِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۚ وَكَفَىٰ بِاللَّهِ وَكِيلًا
  trl: Wa-li-llāhi mā fi s-samāwāti wa-mā fi l-arḍi — wa-kafā bi-llāhi wakīlā
  trad: À Allaah appartient ce qui est dans les cieux et ce qui est sur la terre — Allaah suffit comme *wakīl*.
- ref: S.4:133
  ar: إِن يَشَأْ يُذْهِبْكُمْ أَيُّهَا النَّاسُ وَيَأْتِ بِآخَرِينَ ۚ وَكَانَ اللَّهُ عَلَىٰ ذَٰلِكَ قَدِيرًا
  trl: In yashaʾ yudhhibkum ayyuhā n-nāsu wa-yaʾti bi-ākharīn — wa-kāna llāhu ʿalā dhālika qadīrā
  trad: S'Il le veut, Il vous fera disparaître (*yudhhibkum*), ô les humains, et en fera venir d'autres — Allaah est, sur cela, *Qadīr* (Ce qui a pleine capacité).
- ref: S.4:134
  ar: مَن كَانَ يُرِيدُ ثَوَابَ الدُّنْيَا فَعِندَ اللَّهِ ثَوَابُ الدُّنْيَا وَالْآخِرَةِ ۚ وَكَانَ اللَّهُ سَمِيعًا بَصِيرًا
  trl: Man kāna yurīdu thawāba d-dunyā fa-ʿinda llāhi thawābu d-dunyā wa-l-ākhirati — wa-kāna llāhu samīʿan baṣīrā
  trad: Quiconque veut la rétribution (*thawāb*) de ce monde (*ad-dunyā*) — c'est auprès d'Allaah que se trouve la rétribution de ce monde et de l'au-delà (*al-ākhira*) — Allaah est *Samīʿ*, *Baṣīr*.
- ref: S.4:135
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ ۚ إِن يَكُنْ غَنِيًّا أَوْ فَقِيرًا فَاللَّهُ أَوْلَىٰ بِهِمَا ۖ فَلَا تَتَّبِعُوا الْهَوَىٰ أَن تَعْدِلُوا ۚ وَإِن تَلْوُوا أَوْ تُعْرِضُوا فَإِنَّ اللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا
  trl: Yā ayyuhā lladhīna āmanū kūnū qawwāmīna bi-l-qisṭi shuhadāʾa li-llāhi wa-law ʿalā anfusikum awi l-wālidayni wa-l-aqrabīna — in yakun ghaniyyan aw faqīran fa-llāhu awlā bihimā — fa-lā tattabiʿū l-hawā an taʿdilū — wa-in talwū aw tuʿriḍū fa-inna llāha kāna bimā taʿmalūna khabīrā
  trad: Ô vous qui croyez, soyez fermement établis (*qawwāmīn*) dans le *qisṭ*, témoins (*shuhadāʾ*) pour Allaah, même si c'est contre vous-mêmes, ou vos deux parents, ou vos proches. Qu'il soit riche ou pauvre, Allaah est plus proche d'eux deux (*awlā bihimā*) [que vous ne l'êtes] — ne suivez donc pas le désir (*al-hawā*) au point de ne plus être justes (*an taʿdilū*). Et si vous déviez (*talwū*) ou vous détournez (*tuʿriḍū*), Allaah est, de ce que vous faites, *Khabīr*.
- ref: S.4:136
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا آمِنُوا بِاللَّهِ وَرَسُولِهِ وَالْكِتَابِ الَّذِي نَزَّلَ عَلَىٰ رَسُولِهِ وَالْكِتَابِ الَّذِي أَنزَلَ مِن قَبْلُ ۚ وَمَن يَكْفُرْ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الْآخِرِ فَقَدْ ضَلَّ ضَلَالًا بَعِيدًا
  trl: Yā ayyuhā lladhīna āmanū āminū bi-llāhi wa-rasūlihi wa-l-kitābi lladhī nazzala ʿalā rasūlihi wa-l-kitābi lladhī anzala min qablu — wa-man yakfur bi-llāhi wa-malāʾikatihi wa-kutubihi wa-rusulihi wa-l-yawmi l-ākhiri fa-qad ḍalla ḍalālan baʿīdā
  trad: Ô vous qui croyez, croyez en Allaah, en Son *rasūl*, au Livre qu'Il a fait descendre sur Son *rasūl*, et au Livre qu'Il a fait descendre auparavant. Et quiconque rejette (*yakfur*) Allaah, Ses anges, Ses Livres, Ses *rusul* et le Jour dernier s'est égaré d'un égarement lointain.
- ref: S.4:137
  ar: إِنَّ الَّذِينَ آمَنُوا ثُمَّ كَفَرُوا ثُمَّ آمَنُوا ثُمَّ كَفَرُوا ثُمَّ ازْدَادُوا كُفْرًا لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ سَبِيلًا
  trl: Inna lladhīna āmanū thumma kafarū thumma āmanū thumma kafarū thumma zdādū kufran lam yakuni llāhu li-yaghfira lahum wa-lā li-yahdiyahum sabīlā
  trad: Ceux qui ont cru, puis ont rejeté, puis ont cru, puis ont rejeté, puis se sont accrus (*izdādū*) en rejet — Allaah ne va pas leur pardonner, ni les guider vers un chemin.
- ref: S.4:138
  ar: بَشِّرِ الْمُنَافِقِينَ بِأَنَّ لَهُمْ عَذَابًا أَلِيمًا
  trl: Bashshiri l-munāfiqīna bi-anna lahum ʿadhāban alīmā
  trad: Annonce (*bashshir*) aux *munāfiqūn* qu'il y a pour eux un châtiment douloureux.
- ref: S.4:139
  ar: الَّذِينَ يَتَّخِذُونَ الْكَافِرِينَ أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ ۚ أَيَبْتَغُونَ عِندَهُمُ الْعِزَّةَ فَإِنَّ الْعِزَّةَ لِلَّهِ جَمِيعًا
  trl: Alladhīna yattakhidhūna l-kāfirīna awliyāʾa min dūni l-muʾminīna — a-yabtaghūna ʿindahumu l-ʿizzata fa-inna l-ʿizzata li-llāhi jamīʿā
  trad: Ceux qui prennent les *kāfirīn* comme *awliyāʾ* en dehors des croyants — recherchent-ils (*a-yabtaghūna*) auprès d'eux la puissance (*al-ʿizza*) ? — l'*ʿizza* appartient à Allaah tout entière (*jamīʿā*).
- ref: S.4:140
  ar: وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا مَعَهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ ۚ إِنَّكُمْ إِذًا مِثْلُهُمْ ۗ إِنَّ اللَّهَ جَامِعُ الْمُنَافِقِينَ وَالْكَافِرِينَ فِي جَهَنَّمَ جَمِيعًا
  trl: Wa-qad nazzala ʿalaykum fi l-kitābi an idhā samiʿtum āyāti llāhi yukfaru bihā wa-yustahzaʾu bihā fa-lā taqʿudū maʿahum ḥattā yakhūḍū fī ḥadīthin ghayrihi — innakum idhan mithluhum — inna llāha jāmiʿu l-munāfiqīna wa-l-kāfirīna fī jahannama jamīʿā
  trad: Et il vous a déjà été révélé dans le Livre que, lorsque vous entendez les *āyāt* d'Allaah rejetées (*yukfaru bihā*) et raillées (*yustahzaʾu bihā*), ne restez pas assis avec eux tant qu'ils ne se tournent pas vers un autre propos — sinon vous seriez alors comme eux. Allaah rassemblera les *munāfiqūn* et les *kāfirīn* dans Jahannam, tous ensemble.
- ref: S.4:141
  ar: الَّذِينَ يَتَرَبَّصُونَ بِكُمْ فَإِن كَانَ لَكُمْ فَتْحٌ مِنَ اللَّهِ قَالُوا أَلَمْ نَكُن مَعَكُمْ وَإِن كَانَ لِلْكَافِرِينَ نَصِيبٌ قَالُوا أَلَمْ نَسْتَحْوِذْ عَلَيْكُمْ وَنَمْنَعْكُم مِنَ الْمُؤْمِنِينَ ۚ فَاللَّهُ يَحْكُمُ بَيْنَكُمْ يَوْمَ الْقِيَامَةِ ۗ وَلَن يَجْعَلَ اللَّهُ لِلْكَافِرِينَ عَلَى الْمُؤْمِنِينَ سَبِيلًا
  trl: Alladhīna yatarabbaṣūna bikum fa-in kāna lakum fatḥun mina llāhi qālū a-lam nakun maʿakum wa-in kāna li-l-kāfirīna naṣībun qālū a-lam nastaḥwidh ʿalaykum wa-namnaʿkum mina l-muʾminīna — fa-llāhu yaḥkumu baynakum yawma l-qiyāmati — wa-lan yajʿala llāhu li-l-kāfirīna ʿalā l-muʾminīna sabīlā
  trad: 'Ceux qui vous observent en attendant (*yatarabbaṣūna*) : si une victoire (*fatḥ*) venant d''Allaah vous échoit, ils disent : « N''étions-nous pas avec vous ? » — et si les *kāfirīn* ont une part, ils disent : « N''avons-nous pas pris l''avantage sur vous (*nastaḥwidh ʿalaykum*), et ne vous avons-nous pas protégés des croyants ? » Allaah jugera entre vous au Jour de la Résurrection — et Allaah ne donnera jamais aux *kāfirīn* de voie sur les croyants.'
- ref: S.4:142
  ar: إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا
  trl: Inna l-munāfiqīna yukhādiʿūna llāha wa-huwa khādiʿuhum wa-idhā qāmū ila ṣ-ṣalāti qāmū kusālā yurāʾūna n-nāsa wa-lā yadhkurūna llāha illā qalīlā
  trad: Les *munāfiqūn* cherchent à tromper (*yukhādiʿūna*) Allaah, alors que c'est Lui qui les trompe. Et lorsqu'ils se lèvent pour la *ṣalāt*, ils se lèvent paresseusement (*kusālā*), se donnant en spectacle aux gens (*yurāʾūna n-nās*), et ne se rappellent (*yadhkurūna*) Allaah que peu.
- ref: S.4:143
  ar: مُذَبْذَبِينَ بَيْنَ ذَٰلِكَ لَا إِلَىٰ هَٰؤُلَاءِ وَلَا إِلَىٰ هَٰؤُلَاءِ ۚ وَمَن يُضْلِلِ اللَّهُ فَلَن تَجِدَ لَهُ سَبِيلًا
  trl: Mudhabdhabīna bayna dhālika lā ilā hāʾulāʾi wa-lā ilā hāʾulāʾi — wa-man yuḍlili llāhu fa-lan tajida lahu sabīlā
  trad: Ballotés (*mudhabdhabīn*) entre les deux, ni vers ceux-ci ni vers ceux-là. Et quiconque Allaah égare (*yuḍlil*), tu ne lui trouveras jamais de chemin.
- ref: S.4:144
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا الْكَافِرِينَ أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ ۚ أَتُرِيدُونَ أَن تَجْعَلُوا لِلَّهِ عَلَيْكُمْ سُلْطَانًا مُبِينًا
  trl: Yā ayyuhā lladhīna āmanū lā tattakhidhū l-kāfirīna awliyāʾa min dūni l-muʾminīna — a-turīdūna an tajʿalū li-llāhi ʿalaykum sulṭānan mubīnā
  trad: Ô vous qui croyez, ne prenez pas les *kāfirīn* comme *awliyāʾ* en dehors des croyants — voulez-vous donner à Allaah, contre vous-mêmes, un *sulṭān* manifeste ?
- ref: S.4:145
  ar: إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ وَلَن تَجِدَ لَهُمْ نَصِيرًا
  trl: Inna l-munāfiqīna fi d-darki l-asfali mina n-nāri wa-lan tajida lahum naṣīrā
  trad: Les *munāfiqūn* sont dans le fond le plus bas (*ad-darak al-asfal*) du Feu, et tu ne leur trouveras jamais de *naṣīr*.
- ref: S.4:146
  ar: إِلَّا الَّذِينَ تَابُوا وَأَصْلَحُوا وَاعْتَصَمُوا بِاللَّهِ وَأَخْلَصُوا دِينَهُمْ لِلَّهِ فَأُولَٰئِكَ مَعَ الْمُؤْمِنِينَ ۖ وَسَوْفَ يُؤْتِ اللَّهُ الْمُؤْمِنِينَ أَجْرًا عَظِيمًا
  trl: Illā lladhīna tābū wa-aṣlaḥū wa-ʿtaṣamū bi-llāhi wa-akhlaṣū dīnahum li-llāhi fa-ulāʾika maʿa l-muʾminīna — wa-sawfa yuʾti llāhu l-muʾminīna ajran ʿaẓīmā
  trad: Excepté ceux qui reviennent (*tābū*), se corrigent (*aṣlaḥū*), s'accrochent fermement (*iʿtaṣamū*) à Allaah, et rendent leur *dīn* exclusif (*akhlaṣū*) pour Allaah — ceux-là sont avec les croyants, et Allaah donnera aux croyants une immense rétribution.
- ref: S.4:147
  ar: مَا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِن شَكَرْتُمْ وَآمَنتُمْ ۚ وَكَانَ اللَّهُ شَاكِرًا عَلِيمًا
  trl: Mā yafʿalu llāhu bi-ʿadhābikum in shakartum wa-āmantum — wa-kāna llāhu shākiran ʿalīmā
  trad: Que ferait Allaah de votre châtiment, si vous êtes reconnaissants (*shakartum*) et croyez ? Allaah est *Shākir* (Ce qui reconnaît pleinement ce qui Lui est rendu), *ʿAlīm*.
- ref: S.4:148
  ar: لَا يُحِبُّ اللَّهُ الْجَهْرَ بِالسُّوءِ مِنَ الْقَوْلِ إِلَّا مَن ظُلِمَ ۚ وَكَانَ اللَّهُ سَمِيعًا عَلِيمًا
  trl: Lā yuḥibbu llāhu l-jahra bi-s-sūʾi mina l-qawli illā man ẓulima — wa-kāna llāhu samīʿan ʿalīmā
  trad: Allaah n'aime pas la proclamation publique (*al-jahr*) du mal en parole (*bi-s-sūʾi mina l-qawl*), sauf pour celui qui a subi une injustice (*man ẓulima*). Allaah est *Samīʿ*, *ʿAlīm*.
- ref: S.4:149
  ar: إِن تُبْدُوا خَيْرًا أَوْ تُخْفُوهُ أَوْ تَعْفُوا عَن سُوءٍ فَإِنَّ اللَّهَ كَانَ عَفُوًّا قَدِيرًا
  trl: In tubdū khayran aw tukhfūhu aw taʿfū ʿan sūʾin fa-inna llāha kāna ʿafuwwan qadīrā
  trad: Que vous montriez un bien, que vous le cachiez, ou que vous pardonniez (*taʿfū*) un mal — Allaah est *ʿAfuww* (Ce qui efface), *Qadīr*.
- ref: S.4:150–151
  ar: إِنَّ الَّذِينَ يَكْفُرُونَ بِاللَّهِ وَرُسُلِهِ وَيُرِيدُونَ أَن يُفَرِّقُوا بَيْنَ اللَّهِ وَرُسُلِهِ وَيَقُولُونَ نُؤْمِنُ بِبَعْضٍ وَنَكْفُرُ بِبَعْضٍ وَيُرِيدُونَ أَن يَتَّخِذُوا بَيْنَ ذَٰلِكَ سَبِيلًا * أُولَٰئِكَ هُمُ الْكَافِرُونَ حَقًّا ۚ وَأَعْتَدْنَا لِلْكَافِرِينَ عَذَابًا مُهِينًا
  trl: Inna lladhīna yakfurūna bi-llāhi wa-rusulihi wa-yurīdūna an yufarriqū bayna llāhi wa-rusulihi wa-yaqūlūna nuʾminu bi-baʿḍin wa-nakfuru bi-baʿḍin wa-yurīdūna an yattakhidhū bayna dhālika sabīlā * Ulāʾika humu l-kāfirūna ḥaqqan wa-aʿtadnā li-l-kāfirīna ʿadhāban muhīnā
  trad: 'Ceux qui rejettent Allaah et Ses *rusul*, et veulent différencier (*yufarriqū*) entre Allaah et Ses *rusul*, et disent : « Nous croyons en une partie, et nous rejetons une partie », et veulent prendre entre cela un chemin — ceux-là sont les *kāfirūn* en vérité (*ḥaqqan*), et Nous avons préparé pour les *kāfirīn* un châtiment humiliant.'
- ref: S.4:152
  ar: وَالَّذِينَ آمَنُوا بِاللَّهِ وَرُسُلِهِ وَلَمْ يُفَرِّقُوا بَيْنَ أَحَدٍ مِنْهُمْ أُولَٰئِكَ سَوْفَ يُؤْتِيهِمْ أُجُورَهُمْ ۗ وَكَانَ اللَّهُ غَفُورًا رَحِيمًا
  trl: Wa-lladhīna āmanū bi-llāhi wa-rusulihi wa-lam yufarriqū bayna aḥadin minhum ulāʾika sawfa yuʾtīhim ujūrahum — wa-kāna llāhu ghafūran raḥīmā
  trad: Et ceux qui croient en Allaah et en Ses *rusul*, et ne différencient entre aucun d'eux (*lam yufarriqū bayna aḥadin minhum*) — ceux-là, Il leur donnera leurs rétributions. Allaah est *Ghafūr*, *Raḥīm*.
- ref: S.4:153
  ar: يَسْأَلُكَ أَهْلُ الْكِتَابِ أَن تُنَزِّلَ عَلَيْهِمْ كِتَابًا مِنَ السَّمَاءِ ۚ فَقَدْ سَأَلُوا مُوسَىٰ أَكْبَرَ مِنْ ذَٰلِكَ فَقَالُوا أَرِنَا اللَّهَ جَهْرَةً فَأَخَذَتْهُمُ الصَّاعِقَةُ بِظُلْمِهِمْ ۚ ثُمَّ اتَّخَذُوا الْعِجْلَ مِنْ بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَاتُ فَعَفَوْنَا عَنْ ذَٰلِكَ ۚ وَآتَيْنَا مُوسَىٰ سُلْطَانًا مُبِينًا
  trl: Yasʾaluka ahlu l-kitābi an tunazzila ʿalayhim kitāban mina s-samāʾi — fa-qad saʾalū mūsā akbara min dhālika fa-qālū arinā llāha jahratan fa-akhadhathumu ṣ-ṣāʿiqatu bi-ẓulmihim — thumma ttakhadhū l-ʿijla min baʿdi mā jāʾathumu l-bayyinātu fa-ʿafawnā ʿan dhālika — wa-ātaynā mūsā sulṭānan mubīnā
  trad: 'Les gens du Livre te demandent de faire descendre sur eux un Livre du ciel — or ils ont demandé à Mūsā plus grand que cela : ils ont dit : « Montre-nous Allaah ouvertement (*jahratan*) » — la *ṣāʿiqa* les saisit alors pour leur injustice. Puis ils prirent le veau après que les preuves manifestes (*al-bayyināt*) leur furent venues — Nous avons pardonné cela — et Nous avons donné à Mūsā un *sulṭān* manifeste.'
- ref: S.4:154–155
  ar: وَرَفَعْنَا فَوْقَهُمُ الطُّورَ بِمِيثَاقِهِمْ وَقُلْنَا لَهُمُ ادْخُلُوا الْبَابَ سُجَّدًا وَقُلْنَا لَهُمْ لَا تَعْدُوا فِي السَّبْتِ وَأَخَذْنَا مِنْهُمْ مِيثَاقًا غَلِيظًا * فَبِمَا نَقْضِهِمْ مِيثَاقَهُمْ وَكُفْرِهِمْ بِآيَاتِ اللَّهِ وَقَتْلِهِمُ الْأَنْبِيَاءَ بِغَيْرِ حَقٍّ وَقَوْلِهِمْ قُلُوبُنَا غُلْفٌ ۚ بَلْ طَبَعَ اللَّهُ عَلَيْهَا بِكُفْرِهِمْ فَلَا يُؤْمِنُونَ إِلَّا قَلِيلًا
  trl: Wa-rafaʿnā fawqahumu ṭ-ṭūra bi-mīthāqihim wa-qulnā lahumu dkhulū l-bāba sujjadan wa-qulnā lahum lā taʿdū fi s-sabti wa-akhadhnā minhum mīthāqan ghalīẓā * Fa-bimā naqḍihim mīthāqahum wa-kufrihim bi-āyāti llāhi wa-qatlihimu l-anbiyāʾa bi-ghayri ḥaqqin wa-qawlihim qulūbunā ghulfun — bal ṭabaʿa llāhu ʿalayhā bi-kufrihim fa-lā yuʾminūna illā qalīlā
  trad: 'Et Nous avons élevé au-dessus d''eux le Mont, pour leur *mīthāq*, et Nous leur avons dit : « Entrez par la porte en vous prosternant (*sujjadan*) », et Nous leur avons dit : « Ne transgressez pas (*lā taʿdū*) le *sabt* » — et Nous avons pris d''eux un *mīthāq* ferme (*ghalīẓ*). Alors, pour avoir rompu leur *mīthāq*, rejeté (*kufr*) les *āyāt* d''Allaah, tué les *anbiyāʾ* sans droit (*bi-ghayri ḥaqq*), et dit : « Nos cœurs sont *ghulf* » — c''est plutôt qu''Allaah les a scellés (*ṭabaʿa*) pour leur *kufr* : ils ne croient que peu.'
- ref: S.4:156
  ar: وَبِكُفْرِهِمْ وَقَوْلِهِمْ عَلَىٰ مَرْيَمَ بُهْتَانًا عَظِيمًا
  trl: Wa-bi-kufrihim wa-qawlihim ʿalā maryama buhtānan ʿaẓīmā
  trad: Et pour leur *kufr*, et pour avoir dit sur Maryam un *buhtān* immense.
- ref: S.4:157
  ar: وَقَوْلِهِمْ إِنَّا قَتَلْنَا الْمَسِيحَ عِيسَى ابْنَ مَرْيَمَ رَسُولَ اللَّهِ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِنْ شُبِّهَ لَهُمْ ۚ وَإِنَّ الَّذِينَ اخْتَلَفُوا فِيهِ لَفِي شَكٍّ مِنْهُ ۚ مَا لَهُمْ بِهِ مِنْ عِلْمٍ إِلَّا اتِّبَاعَ الظَّنِّ ۚ وَمَا قَتَلُوهُ يَقِينًا
  trl: Wa-qawlihim innā qatalnā l-masīḥa ʿīsā bna maryama rasūla llāhi wa-mā qatalūhu wa-mā ṣalabūhu wa-lākin shubbiha lahum — wa-inna lladhīna khtalafū fīhi la-fī shakkin minhu — mā lahum bihi min ʿilmin illā ttibāʿa ẓ-ẓanni — wa-mā qatalūhu yaqīnā
  trad: 'Et pour avoir dit : « Nous avons tué le Messie, ʿĪsā fils de Maryam, *rasūl* d''Allaah » — alors qu''ils ne l''ont pas tué et ne l''ont pas crucifié, mais cela leur a été rendu semblable (*shubbiha lahum*). Et ceux qui divergent à son sujet sont, certes, dans le doute (*shakk*) à son égard — ils n''en ont aucune connaissance, sinon de suivre la conjecture (*ẓann*) — et ils ne l''ont assurément pas tué (*yaqīnan*).'
- ref: S.4:158
  ar: بَلْ رَفَعَهُ اللَّهُ إِلَيْهِ ۚ وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا
  trl: Bal rafaʿahu llāhu ilayhi — wa-kāna llāhu ʿazīzan ḥakīmā
  trad: C'est plutôt qu'Allaah l'a élevé (*rafaʿahu*) vers Lui (*ilayhi*) — Allaah est *ʿAzīz*, *Ḥakīm*.
- ref: S.4:159
  ar: وَإِنْ مِنْ أَهْلِ الْكِتَابِ إِلَّا لَيُؤْمِنَنَّ بِهِ قَبْلَ مَوْتِهِ ۖ وَيَوْمَ الْقِيَامَةِ يَكُونُ عَلَيْهِمْ شَهِيدًا
  trl: Wa-in min ahli l-kitābi illā la-yuʾminanna bihi qabla mawtihi — wa-yawma l-qiyāmati yakūnu ʿalayhim shahīdā
  trad: Et il n'est personne parmi les gens du Livre qui ne croira en lui avant sa mort — et au Jour de la Résurrection il sera témoin (*shahīd*) contre eux.
- ref: S.4:160–161
  ar: فَبِظُلْمٍ مِنَ الَّذِينَ هَادُوا حَرَّمْنَا عَلَيْهِمْ طَيِّبَاتٍ أُحِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَنْ سَبِيلِ اللَّهِ كَثِيرًا * وَأَخْذِهِمُ الرِّبَا وَقَدْ نُهُوا عَنْهُ وَأَكْلِهِمْ أَمْوَالَ النَّاسِ بِالْبَاطِلِ ۚ وَأَعْتَدْنَا لِلْكَافِرِينَ مِنْهُمْ عَذَابًا أَلِيمًا
  trl: Fa-bi-ẓulmin mina lladhīna hādū ḥarramnā ʿalayhim ṭayyibātin uḥillat lahum wa-bi-ṣaddihim ʿan sabīli llāhi kathīrā * Wa-akhdhihimu r-ribā wa-qad nuhū ʿanhu wa-aklihim amwāla n-nāsi bi-l-bāṭili — wa-aʿtadnā li-l-kāfirīna minhum ʿadhāban alīmā
  trad: Pour l'injustice de ceux qui pratiquent le judaïsme, Nous leur avons interdit des choses bonnes (*ṭayyibāt*) qui leur étaient permises, et pour avoir beaucoup détourné (*ṣadd*) du *sabīl* d'Allaah — et pour avoir pris le *ribā* alors qu'il leur avait été interdit, et pour avoir consommé les biens des gens par le *bāṭil* — Nous avons préparé, pour les *kāfirūn* parmi eux, un châtiment douloureux.
- ref: S.4:162
  ar: لَٰكِنِ الرَّاسِخُونَ فِي الْعِلْمِ مِنْهُمْ وَالْمُؤْمِنُونَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ ۚ وَالْمُقِيمِينَ الصَّلَاةَ ۚ وَالْمُؤْتُونَ الزَّكَاةَ وَالْمُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ أُولَٰئِكَ سَنُؤْتِيهِمْ أَجْرًا عَظِيمًا
  trl: Lākini r-rāsikhūna fi l-ʿilmi minhum wa-l-muʾminūna yuʾminūna bimā unzila ilayka wa-mā unzila min qablika — wa-l-muqīmīna ṣ-ṣalāta — wa-l-muʾtūna z-zakāta wa-l-muʾminūna bi-llāhi wa-l-yawmi l-ākhiri ulāʾika sa-nuʾtīhim ajran ʿaẓīmā
  trad: Mais ceux qui sont enracinés (*rāsikhūn*) dans le savoir parmi eux, et les croyants, croient en ce qui t'a été révélé et en ce qui a été révélé avant toi — ceux qui établissent la *ṣalāt*, ceux qui donnent la *zakāt*, et les croyants en Allaah et au Jour dernier — à ceux-là Nous donnerons une immense rétribution.
- ref: S.4:163
  ar: إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَىٰ نُوحٍ وَالنَّبِيِّينَ مِنْ بَعْدِهِ ۚ وَأَوْحَيْنَا إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالْأَسْبَاطِ وَعِيسَىٰ وَأَيُّوبَ وَيُونُسَ وَهَارُونَ وَسُلَيْمَانَ ۚ وَآتَيْنَا دَاوُودَ زَبُورًا
  trl: Innā awḥaynā ilayka kamā awḥaynā ilā nūḥin wa-n-nabiyyīna min baʿdihi — wa-awḥaynā ilā ibrāhīma wa-ismāʿīla wa-isḥāqa wa-yaʿqūba wa-l-asbāṭi wa-ʿīsā wa-ayyūba wa-yūnusa wa-hārūna wa-sulaymāna — wa-ātaynā dāwūda zabūrā
  trad: Nous t'avons certes révélé, comme Nous avons révélé à Nūḥ et aux *nabiyyīn* après lui — et Nous avons révélé à Ibrāhīm, Ismāʿīl, Isḥāq, Yaʿqūb, les *asbāṭ*, ʿĪsā, Ayyūb, Yūnus, Hārūn et Sulaymān — et Nous avons donné à Dāwūd le *Zabūr*.
- ref: S.4:164–165
  ar: وَرُسُلًا قَدْ قَصَصْنَاهُمْ عَلَيْكَ مِنْ قَبْلُ وَرُسُلًا لَمْ نَقْصُصْهُمْ عَلَيْكَ ۚ وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا * رُسُلًا مُبَشِّرِينَ وَمُنْذِرِينَ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَى اللَّهِ حُجَّةٌ بَعْدَ الرُّسُلِ ۚ وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا
  trl: Wa-rusulan qad qaṣaṣnāhum ʿalayka min qablu wa-rusulan lam naqṣuṣhum ʿalayka — wa-kallama llāhu mūsā taklīmā * Rusulan mubashshirīna wa-mundhirīna li-allā yakūna li-n-nāsi ʿalā llāhi ḥujjatun baʿda r-rusuli — wa-kāna llāhu ʿazīzan ḥakīmā
  trad: Et des *rusul* dont Nous t'avons déjà fait le récit auparavant, et des *rusul* dont Nous ne t'avons pas fait le récit — et Allaah a parlé (*kallama*) à Mūsā d'une parole directe (*taklīmā*). Des *rusul* annonciateurs (*mubashshirīn*) et avertisseurs (*mundhirīn*), afin qu'il n'y ait pas, pour les gens, d'argument (*ḥujja*) contre Allaah après les *rusul* — Allaah est *ʿAzīz*, *Ḥakīm*.
- ref: S.4:166
  ar: لَٰكِنِ اللَّهُ يَشْهَدُ بِمَا أَنْزَلَ إِلَيْكَ ۖ أَنْزَلَهُ بِعِلْمِهِ ۖ وَالْمَلَائِكَةُ يَشْهَدُونَ ۚ وَكَفَىٰ بِاللَّهِ شَهِيدًا
  trl: Lākini llāhu yashhadu bimā anzala ilayka — anzalahu bi-ʿilmihi — wa-l-malāʾikatu yashhadūna — wa-kafā bi-llāhi shahīdā
  trad: Mais Allaah témoigne (*yashhadu*) de ce qu'Il a fait descendre vers toi — Il l'a fait descendre avec Sa science (*bi-ʿilmihi*) — et les anges témoignent — Allaah suffit comme *Shahīd* (Ce qui témoigne).
- ref: S.4:167–169
  ar: إِنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ قَدْ ضَلُّوا ضَلَالًا بَعِيدًا * إِنَّ الَّذِينَ كَفَرُوا وَظَلَمُوا لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ طَرِيقًا * إِلَّا طَرِيقَ جَهَنَّمَ خَالِدِينَ فِيهَا أَبَدًا ۚ وَكَانَ ذَٰلِكَ عَلَى اللَّهِ يَسِيرًا
  trl: Inna lladhīna kafarū wa-ṣaddū ʿan sabīli llāhi qad ḍallū ḍalālan baʿīdā * Inna lladhīna kafarū wa-ẓalamū lam yakuni llāhu li-yaghfira lahum wa-lā li-yahdiyahum ṭarīqā * Illā ṭarīqa jahannama khālidīna fīhā abadan — wa-kāna dhālika ʿalā llāhi yasīrā
  trad: Ceux qui ont rejeté et détourné (*ṣaddū*) du *sabīl* d'Allaah se sont égarés d'un égarement lointain. Ceux qui ont rejeté et commis l'injustice (*ẓalamū*), Allaah ne va pas leur pardonner, ni les guider vers un chemin — sinon le chemin de Jahannam, où ils demeurent pour toujours — et cela est, pour Allaah, chose aisée (*yasīr*).
- ref: S.4:170
  ar: يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُمُ الرَّسُولُ بِالْحَقِّ مِنْ رَبِّكُمْ فَآمِنُوا خَيْرًا لَكُمْ ۚ وَإِنْ تَكْفُرُوا فَإِنَّ لِلَّهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا
  trl: Yā ayyuhā n-nāsu qad jāʾakumu r-rasūlu bi-l-ḥaqqi min rabbikum fa-āminū khayran lakum — wa-in takfurū fa-inna li-llāhi mā fi s-samāwāti wa-l-arḍi — wa-kāna llāhu ʿalīman ḥakīmā
  trad: Ô les humains, le *rasūl* vous est venu avec le *ḥaqq* de la part de votre *Rabb* — croyez donc, c'est meilleur pour vous. Et si vous rejetez, à Allaah appartient ce qui est dans les cieux et la terre — Allaah est *ʿAlīm*, *Ḥakīm*.
- ref: S.4:171
  ar: يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ وَلَا تَقُولُوا عَلَى اللَّهِ إِلَّا الْحَقَّ ۚ إِنَّمَا الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ رَسُولُ اللَّهِ وَكَلِمَتُهُ أَلْقَاهَا إِلَىٰ مَرْيَمَ وَرُوحٌ مِنْهُ ۖ فَآمِنُوا بِاللَّهِ وَرُسُلِهِ ۖ وَلَا تَقُولُوا ثَلَاثَةٌ ۚ انْتَهُوا خَيْرًا لَكُمْ ۚ إِنَّمَا اللَّهُ إِلَٰهٌ وَاحِدٌ ۖ سُبْحَانَهُ أَنْ يَكُونَ لَهُ وَلَدٌ ۘ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَكَفَىٰ بِاللَّهِ وَكِيلًا
  trl: Yā ahla l-kitābi lā taghlū fī dīnikum wa-lā taqūlū ʿalā llāhi illā l-ḥaqqa — innamā l-masīḥu ʿīsā bnu maryama rasūlu llāhi wa-kalimatuhu alqāhā ilā maryama wa-rūḥun minhu — fa-āminū bi-llāhi wa-rusulihi — wa-lā taqūlū thalāthatun — ntahū khayran lakum — innamā llāhu ilāhun wāḥidun — subḥānahu an yakūna lahu waladun — lahu mā fi s-samāwāti wa-mā fi l-arḍi — wa-kafā bi-llāhi wakīlā
  trad: Ô gens du Livre, n'excédez pas (*lā taghlū*) dans votre *dīn*, et ne dites sur Allaah que le *ḥaqq*. Le Messie, ʿĪsā fils de Maryam, n'est que *rasūl* d'Allaah, Sa *kalima* qu'Il a lancée (*alqāhā*) vers Maryam, et un *rūḥ* venant de Lui (*minhu*). Croyez donc en Allaah et en Ses *rusul*, et ne dites pas « trois ». Cessez (*intahū*), c'est meilleur pour vous. Allaah n'est qu'un *ilāh* unique (*wāḥid*) — gloire à Lui (*subḥānahu*) — Il est au-dessus d'avoir un *walad*. À Lui appartient ce qui est dans les cieux et ce qui est sur la terre — Allaah suffit comme *wakīl*.
- ref: S.4:172
  ar: لَنْ يَسْتَنْكِفَ الْمَسِيحُ أَنْ يَكُونَ عَبْدًا لِلَّهِ وَلَا الْمَلَائِكَةُ الْمُقَرَّبُونَ ۚ وَمَنْ يَسْتَنْكِفْ عَنْ عِبَادَتِهِ وَيَسْتَكْبِرْ فَسَيَحْشُرُهُمْ إِلَيْهِ جَمِيعًا
  trl: Lan yastankifa l-masīḥu an yakūna ʿabdan li-llāhi wa-lā l-malāʾikatu l-muqarrabūna — wa-man yastankif ʿan ʿibādatihi wa-yastakbir fa-sa-yaḥshuruhum ilayhi jamīʿā
  trad: Jamais le Messie ne dédaignera (*lan yastankifa*) d'être *ʿabd* d'Allaah, ni les anges *muqarrabūn* (rapprochés). Et quiconque dédaigne Son *ʿibāda* et s'enorgueillit (*yastakbir*), Il les rassemblera tous vers Lui.
- ref: S.4:173
  ar: فَأَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَيُوَفِّيهِمْ أُجُورَهُمْ وَيَزِيدُهُمْ مِنْ فَضْلِهِ ۖ وَأَمَّا الَّذِينَ اسْتَنْكَفُوا وَاسْتَكْبَرُوا فَيُعَذِّبُهُمْ عَذَابًا أَلِيمًا وَلَا يَجِدُونَ لَهُمْ مِنْ دُونِ اللَّهِ وَلِيًّا وَلَا نَصِيرًا
  trl: Fa-ammā lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti fa-yuwaffīhim ujūrahum wa-yazīduhum min faḍlihi — wa-ammā lladhīna stankafū wa-stakbarū fa-yuʿadhdhibuhum ʿadhāban alīman wa-lā yajidūna lahum min dūni llāhi waliyyan wa-lā naṣīrā
  trad: Quant à ceux qui ont cru et fait ce qui est droit, Il leur versera pleinement (*yuwaffīhim*) leurs rétributions, et leur ajoutera de Sa faveur (*faḍl*). Quant à ceux qui ont dédaigné et se sont enorgueillis, Il les châtiera d'un châtiment douloureux, et ils ne trouveront pour eux, en dehors d'Allaah, ni *walī* ni *naṣīr*.
- ref: S.4:174–175
  ar: يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُمْ بُرْهَانٌ مِنْ رَبِّكُمْ وَأَنْزَلْنَا إِلَيْكُمْ نُورًا مُبِينًا * فَأَمَّا الَّذِينَ آمَنُوا بِاللَّهِ وَاعْتَصَمُوا بِهِ فَسَيُدْخِلُهُمْ فِي رَحْمَةٍ مِنْهُ وَفَضْلٍ وَيَهْدِيهِمْ إِلَيْهِ صِرَاطًا مُسْتَقِيمًا
  trl: Yā ayyuhā n-nāsu qad jāʾakum burhānun min rabbikum wa-anzalnā ilaykum nūran mubīnā * Fa-ammā lladhīna āmanū bi-llāhi wa-ʿtaṣamū bihi fa-sa-yudkhiluhum fī raḥmatin minhu wa-faḍlin wa-yahdīhim ilayhi ṣirāṭan mustaqīmā
  trad: Ô les humains, une preuve manifeste (*burhān*) vous est venue de votre *Rabb*, et Nous avons fait descendre vers vous une lumière (*nūr*) manifeste. Quant à ceux qui ont cru en Allaah et s'y sont accrochés fermement (*iʿtaṣamū bihi*), Il les fera entrer dans une *raḥma* venant de Lui et une faveur (*faḍl*), et les guidera vers Lui sur un chemin droit (*ṣirāṭan mustaqīmā*).
- ref: S.4:176
  ar: يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ ۚ إِنِ امْرُؤٌ هَلَكَ لَيْسَ لَهُ وَلَدٌ وَلَهُ أُخْتٌ فَلَهَا نِصْفُ مَا تَرَكَ ۚ وَهُوَ يَرِثُهَا إِنْ لَمْ يَكُنْ لَهَا وَلَدٌ ۚ فَإِنْ كَانَتَا اثْنَتَيْنِ فَلَهُمَا الثُّلُثَانِ مِمَّا تَرَكَ ۚ وَإِنْ كَانُوا إِخْوَةً رِجَالًا وَنِسَاءً فَلِلذَّكَرِ مِثْلُ حَظِّ الْأُنْثَيَيْنِ ۗ يُبَيِّنُ اللَّهُ لَكُمْ أَنْ تَضِلُّوا ۗ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Yastaftūnaka quli llāhu yuftīkum fi l-kalālati — ini mruʾun halaka laysa lahu waladun wa-lahu ukhtun fa-lahā niṣfu mā taraka — wa-huwa yarithuhā in lam yakun lahā waladun — fa-in kānatā thnatayni fa-lahumā th-thuluthāni mimmā taraka — wa-in kānū ikhwatan rijālan wa-nisāʾan fa-li-dh-dhakari mithlu ḥaẓẓi l-unthayayni — yubayyinu llāhu lakum an taḍillū — wa-llāhu bi-kulli shayʾin ʿalīmun
  trad: 'Ils te demandent une *fatwā*. Dis : « Allaah vous éclaire (*yuftīkum*) au sujet de la *kalāla*. Si un homme meurt sans avoir de *walad*, et qu''il a une sœur, à elle la moitié de ce qu''il laisse ; et lui hérite d''elle si elle n''a pas de *walad*. S''il y en a deux [sœurs], à elles les deux tiers de ce qu''il laisse. Et s''ils sont des frères et sœurs, hommes et femmes, alors au mâle la part de deux femelles (*mithlu ḥaẓẓi l-unthayayn*). » Allaah vous explique clairement (*yubayyinu*), afin que vous ne vous égariez pas — Allaah est, de toute chose, *ʿAlīm*.'
