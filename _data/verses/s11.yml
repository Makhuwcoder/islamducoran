- ref: S.11:1
  ar: الر ۚ كِتَابٌ أُحْكِمَتْ آيَاتُهُ ثُمَّ فُصِّلَتْ مِنْ لَدُنْ حَكِيمٍ خَبِيرٍ
  trl: Alif-Lām-Rāʾ · Kitābun uḥkimat āyātuhu thumma fuṣṣilat min ladun ḥakīmin khabīr
  trad: Alif-Lām-Rāʾ. Un Livre dont les signes (āyāt) ont été rendus fermes (uḥkimat), puis détaillés (fuṣṣilat), de la part de Ce qui est parfaitement sage et parfaitement informé (ḥakīm, khabīr).
- ref: S.11:2–4
  ar: أَلَّا تَعْبُدُوا إِلَّا اللَّهَ ۚ إِنَّنِي لَكُمْ مِنْهُ نَذِيرٌ وَبَشِيرٌ وَأَنِ اسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ يُمَتِّعْكُمْ مَتَاعًا حَسَنًا إِلَىٰ أَجَلٍ مُسَمًّى وَيُؤْتِ كُلَّ ذِي فَضْلٍ فَضْلَهُ ۖ وَإِنْ تَوَلَّوْا فَإِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ كَبِيرٍ إِلَى اللَّهِ مَرْجِعُكُمْ ۖ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Allā taʿbudū illā llāha innanī lakum minhu nadhīrun wa-bashīr · wa-ani staghfirū rabbakum thumma tūbū ilayhi yumattiʿkum matāʿan ḥasanan ilā ajalin musamman wa-yuʾti kulla dhī faḍlin faḍlahu wa-in tawallaw fa-innī akhāfu ʿalaykum ʿadhāba yawmin kabīr · ilā llāhi marjiʿukum wa-huwa ʿalā kulli shayʾin qadīr
  trad: '[Il détaille] que vous ne serviez qu''Allaah — je suis pour vous, de Sa part, nadhīr et bashīr — et que vous demandiez l''istighfār à votre Rabb, puis reveniez à Lui (tūbū) : Il vous fera jouir d''une belle jouissance (matāʿan ḥasanan) jusqu''à un terme fixé (ajal musamman), et donnera à quiconque détient un faḍl son faḍl. Et si vous vous détournez, alors je crains pour vous le châtiment d''un grand jour. Vers Allaah est votre retour (marjiʿ) — et Il est, sur toute chose, puissant (qadīr).'
- ref: S.11:5
  ar: أَلَا إِنَّهُمْ يَثْنُونَ صُدُورَهُمْ لِيَسْتَخْفُوا مِنْهُ ۚ أَلَا حِينَ يَسْتَغْشُونَ ثِيَابَهُمْ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ ۚ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ
  trl: Alā innahum yathnūna ṣudūrahum li-yastakhfū minhu alā ḥīna yastaghshūna thiyābahum yaʿlamu mā yusirrūna wa-mā yuʿlinūna innahu ʿalīmun bi-dhāti ṣ-ṣudūr
  trad: N'est-ce pas qu'ils replient leur poitrine (yathnūna ṣudūrahum) pour se dissimuler de Lui ? N'est-ce pas qu'au moment où ils se recouvrent de leurs vêtements, Il sait ce qu'ils tiennent secret et ce qu'ils rendent public ? Il est, certes, pleinement informé (ʿalīm) de ce qui est au fond des poitrines (dhāt aṣ-ṣudūr).
- ref: S.11:6
  ar: ۞ وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّ فِي كِتَابٍ مُبِينٍ
  trl: Wa-mā min dābbatin fi l-arḍi illā ʿalā llāhi rizquhā wa-yaʿlamu mustaqarrahā wa-mustawdaʿahā kullun fī kitābin mubīn
  trad: 'Et il n''est nulle créature (dābba) sur la terre dont la subsistance (rizq) n''incombe à Allaah — et Il connaît son lieu d''établissement stable (mustaqarr) et son lieu de dépôt confié (mustawdaʿ) : tout est dans un Kitāb manifeste.'
- ref: S.11:7
  ar: وَهُوَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ وَكَانَ عَرْشُهُ عَلَى الْمَاءِ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۗ وَلَئِنْ قُلْتَ إِنَّكُمْ مَبْعُوثُونَ مِنْ بَعْدِ الْمَوْتِ لَيَقُولَنَّ الَّذِينَ كَفَرُوا إِنْ هَٰذَا إِلَّا سِحْرٌ مُبِينٌ
  trl: Wa-huwa lladhī khalaqa s-samāwāti wa-l-arḍa fī sittati ayyāmin wa-kāna ʿarshuhu ʿalā l-māʾi li-yabluwakum ayyukum aḥsanu ʿamalan wa-la-in qulta innakum mabʿūthūna min baʿdi l-mawti la-yaqūlanna lladhīna kafarū in hādhā illā siḥrun mubīn
  trad: 'Et c''est Ce qui a créé les cieux et la terre en six jours — et Son ʿArsh était sur l''eau — pour vous éprouver (li-yabluwakum) : lequel de vous est le meilleur en œuvre. Et si tu dis : « Vous serez certes ressuscités après la mort », ceux qui ont commis le kufr diront à coup sûr : « Cela n''est rien d''autre qu''une magie manifeste. »'
- ref: S.11:8
  ar: وَلَئِنْ أَخَّرْنَا عَنْهُمُ الْعَذَابَ إِلَىٰ أُمَّةٍ مَعْدُودَةٍ لَيَقُولُنَّ مَا يَحْبِسُهُ ۗ أَلَا يَوْمَ يَأْتِيهِمْ لَيْسَ مَصْرُوفًا عَنْهُمْ وَحَاقَ بِهِمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ
  trl: Wa-la-in akhkharnā ʿanhumu l-ʿadhāba ilā ummatin maʿdūdatin la-yaqūlunna mā yaḥbisuhu alā yawma yaʾtīhim laysa maṣrūfan ʿanhum wa-ḥāqa bihim mā kānū bihi yastahziʾūn
  trad: 'Et si Nous ajournons (akhkharnā) loin d''eux le châtiment jusqu''à une échéance comptée (umma maʿdūda), ils diront à coup sûr : « Qu''est-ce qui le retient (yaḥbisuhu) ? » — N''est-ce pas que le jour où il leur viendra, il ne sera pas détourné (maṣrūfan) loin d''eux, et les enveloppera (ḥāqa) ce dont ils se moquaient (yastahziʾūn) ?'
- ref: S.11:9–10
  ar: وَلَئِنْ أَذَقْنَا الْإِنْسَانَ مِنَّا رَحْمَةً ثُمَّ نَزَعْنَاهَا مِنْهُ إِنَّهُ لَيَئُوسٌ كَفُورٌ وَلَئِنْ أَذَقْنَاهُ نَعْمَاءَ بَعْدَ ضَرَّاءَ مَسَّتْهُ لَيَقُولَنَّ ذَهَبَ السَّيِّئَاتُ عَنِّي ۚ إِنَّهُ لَفَرِحٌ فَخُورٌ
  trl: Wa-la-in adhaqnā l-insāna minnā raḥmatan thumma nazaʿnāhā minhu innahu la-yaʾūsun kafūr · wa-la-in adhaqnāhu naʿmāʾa baʿda ḍarrāʾa massathu la-yaqūlanna dhahaba s-sayyiʾātu ʿannī innahu la-fariḥun fakhūr
  trad: 'Et si Nous faisons goûter à l''humain une raḥma venue de Nous, puis la lui retirons (nazaʿnāhā), le voilà certes désespéré (yaʾūs), dénégateur intense (kafūr). Et si Nous lui faisons goûter un bienfait (naʿmāʾ) après une épreuve (ḍarrāʾ) qui l''a touché, il dira certes : « Les maux se sont éloignés de moi » — le voilà certes jubilant (fariḥ), vantard (fakhūr).'
- ref: S.11:11
  ar: إِلَّا الَّذِينَ صَبَرُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ كَبِيرٌ
  trl: Illā lladhīna ṣabarū wa-ʿamilū ṣ-ṣāliḥāti ulāʾika lahum maghfiratun wa-ajrun kabīr
  trad: Excepté ceux qui ont patienté (ṣabarū) et accompli les œuvres justes (ṣāliḥāt) — ceux-là ont une maghfira et une grande rétribution (ajr kabīr).
- ref: S.11:12
  ar: فَلَعَلَّكَ تَارِكٌ بَعْضَ مَا يُوحَىٰ إِلَيْكَ وَضَائِقٌ بِهِ صَدْرُكَ أَنْ يَقُولُوا لَوْلَا أُنْزِلَ عَلَيْهِ كَنْزٌ أَوْ جَاءَ مَعَهُ مَلَكٌ ۚ إِنَّمَا أَنْتَ نَذِيرٌ ۚ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ
  trl: Fa-laʿallaka tārikun baʿḍa mā yūḥā ilayka wa-ḍāʾiqun bihi ṣadruka an yaqūlū lawlā unzila ʿalayhi kanzun aw jāʾa maʿahu malakun innamā anta nadhīrun wallāhu ʿalā kulli shayʾin wakīl
  trad: 'Se pourrait-il donc que tu délaisses une partie de ce qui t''est révélé, et que ta poitrine s''en resserre (ḍāʾiqun), parce qu''ils disent : « Que ne fait-on descendre sur lui un trésor (kanz), ou que ne vient-il avec lui un ange (malak) ! » ? Tu n''es, toi, qu''un nadhīr — et Allaah, sur toute chose, est wakīl.'
- ref: S.11:13
  ar: أَمْ يَقُولُونَ افْتَرَاهُ ۖ قُلْ فَأْتُوا بِعَشْرِ سُوَرٍ مِثْلِهِ مُفْتَرَيَاتٍ وَادْعُوا مَنِ اسْتَطَعْتُمْ مِنْ دُونِ اللَّهِ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Am yaqūlūna ftarāhu qul fa-ʾtū bi-ʿashri suwarin mithlihi muftarayātin wa-dʿū mani staṭaʿtum min dūni llāhi in kuntum ṣādiqīn
  trad: 'Ou bien disent-ils : « Il l''a forgé (iftarāhu) » ? Dis : « Apportez donc dix sūra semblables à lui, forgées (muftarayāt), et appelez qui vous pourrez en dehors d''Allaah, si vous êtes véridiques ! »'
- ref: S.11:14
  ar: فَإِلَّمْ يَسْتَجِيبُوا لَكُمْ فَاعْلَمُوا أَنَّمَا أُنْزِلَ بِعِلْمِ اللَّهِ وَأَنْ لَا إِلَٰهَ إِلَّا هُوَ ۖ فَهَلْ أَنْتُمْ مُسْلِمُونَ
  trl: Fa-illam yastajībū lakum faʿlamū annamā unzila bi-ʿilmi llāhi wa-an lā ilāha illā huwa fa-hal antum muslimūn
  trad: Et s'ils ne vous répondent pas, sachez alors que ce n'est que par la science d'Allaah (bi-ʿilmi llāh) qu'il a été fait descendre, et qu'il n'est nul ilāh sinon Lui. Allez-vous donc vous soumettre (muslimūn) ?
- ref: S.11:15–16
  ar: مَنْ كَانَ يُرِيدُ الْحَيَاةَ الدُّنْيَا وَزِينَتَهَا نُوَفِّ إِلَيْهِمْ أَعْمَالَهُمْ فِيهَا وَهُمْ فِيهَا لَا يُبْخَسُونَ أُولَٰئِكَ الَّذِينَ لَيْسَ لَهُمْ فِي الْآخِرَةِ إِلَّا النَّارُ ۖ وَحَبِطَ مَا صَنَعُوا فِيهَا وَبَاطِلٌ مَا كَانُوا يَعْمَلُونَ
  trl: Man kāna yurīdu l-ḥayāta d-dunyā wa-zīnatahā nuwaffi ilayhim aʿmālahum fīhā wa-hum fīhā lā yubkhasūn · ulāʾika lladhīna laysa lahum fi l-ākhirati illā n-nāru wa-ḥabiṭa mā ṣanaʿū fīhā wa-bāṭilun mā kānū yaʿmalūn
  trad: Quiconque veut la vie d'ici-bas (al-ḥayāt ad-dunyā) et sa parure (zīna), Nous leur réglons pleinement (nuwaffī) leurs œuvres en elle, et ils n'y sont pas lésés (lā yubkhasūn). Ceux-là sont ceux à qui, dans l'ākhira, il n'y a rien d'autre que le Feu — et s'annule (ḥabiṭa) ce qu'ils ont fabriqué (ṣanaʿū) en elle, et vain (bāṭil) est ce qu'ils faisaient.
- ref: S.11:17
  ar: أَفَمَنْ كَانَ عَلَىٰ بَيِّنَةٍ مِنْ رَبِّهِ وَيَتْلُوهُ شَاهِدٌ مِنْهُ وَمِنْ قَبْلِهِ كِتَابُ مُوسَىٰ إِمَامًا وَرَحْمَةً ۚ أُولَٰئِكَ يُؤْمِنُونَ بِهِ ۚ وَمَنْ يَكْفُرْ بِهِ مِنَ الْأَحْزَابِ فَالنَّارُ مَوْعِدُهُ ۚ فَلَا تَكُ فِي مِرْيَةٍ مِنْهُ ۚ إِنَّهُ الْحَقُّ مِنْ رَبِّكَ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يُؤْمِنُونَ
  trl: Afa-man kāna ʿalā bayyinatin min rabbihi wa-yatlūhu shāhidun minhu wa-min qablihi kitābu mūsā imāman wa-raḥmatan ulāʾika yuʾminūna bihi wa-man yakfur bihi mina l-aḥzābi fa-n-nāru mawʿiduhu fa-lā taku fī miryatin minhu innahu l-ḥaqqu min rabbika wa-lākinna akthara n-nāsi lā yuʾminūn
  trad: 'Celui qui se tient sur une preuve manifeste (bayyina) venue de son Rabb, que suit un témoin (shāhid) émanant de Lui, et devant qui il y a déjà le Kitāb de Mūsā, guide (imām) et raḥma — [en irait-il de lui comme de celui qui n''a rien de tout cela] ? Ceux-là y croient. Et quiconque, parmi les factions (aḥzāb), en commet le kufr, le Feu est son rendez-vous (mawʿid). Ne sois donc pas dans le doute (mirya) à son sujet : il est le ḥaqq venu de ton Rabb — mais la plupart des gens ne croient pas.'
- ref: S.11:18
  ar: وَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا ۚ أُولَٰئِكَ يُعْرَضُونَ عَلَىٰ رَبِّهِمْ وَيَقُولُ الْأَشْهَادُ هَٰؤُلَاءِ الَّذِينَ كَذَبُوا عَلَىٰ رَبِّهِمْ ۚ أَلَا لَعْنَةُ اللَّهِ عَلَى الظَّالِمِينَ
  trl: Wa-man aẓlamu mimmani ftarā ʿalā llāhi kadhiban ulāʾika yuʿraḍūna ʿalā rabbihim wa-yaqūlu l-ashhādu hāʾulāʾi lladhīna kadhabū ʿalā rabbihim alā laʿnatu llāhi ʿalā ẓ-ẓālimīn
  trad: 'Et qui est plus injuste (aẓlam) que celui qui forge (iftarā) un mensonge contre Allaah ? Ceux-là seront présentés (yuʿraḍūna) devant leur Rabb, et les témoins (al-ashhād) diront : « Voici ceux qui ont menti sur leur Rabb. » N''est-ce pas que la malédiction d''Allaah (laʿnatu llāh) est sur les ẓālimūn ?'
- ref: S.11:19–20
  ar: الَّذِينَ يَصُدُّونَ عَنْ سَبِيلِ اللَّهِ وَيَبْغُونَهَا عِوَجًا وَهُمْ بِالْآخِرَةِ هُمْ كَافِرُونَ أُولَٰئِكَ لَمْ يَكُونُوا مُعْجِزِينَ فِي الْأَرْضِ وَمَا كَانَ لَهُمْ مِنْ دُونِ اللَّهِ مِنْ أَوْلِيَاءَ ۘ يُضَاعَفُ لَهُمُ الْعَذَابُ ۚ مَا كَانُوا يَسْتَطِيعُونَ السَّمْعَ وَمَا كَانُوا يُبْصِرُونَ
  trl: Alladhīna yaṣuddūna ʿan sabīli llāhi wa-yabghūnahā ʿiwajan wa-hum bi-l-ākhirati hum kāfirūn · ulāʾika lam yakūnū muʿjizīna fi l-arḍi wa-mā kāna lahum min dūni llāhi min awliyāʾa yuḍāʿafu lahumu l-ʿadhābu mā kānū yastaṭīʿūna s-samʿa wa-mā kānū yubṣirūn
  trad: Ceux qui barrent la voie d'Allaah (yaṣuddūna ʿan sabīli llāh) et cherchent à la rendre tortueuse (ʿiwaj), et qui, envers l'ākhira, sont dénégateurs (kāfirūn). Ceux-là n'étaient pas de force à réduire à l'impuissance (muʿjizīn) sur la terre, et ils n'avaient, en dehors d'Allaah, aucun walī. Le châtiment leur est doublé — ils n'étaient pas capables d'entendre (as-samʿ), et ils ne voyaient pas (yubṣirūn).
- ref: S.11:21–22
  ar: أُولَٰئِكَ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ لَا جَرَمَ أَنَّهُمْ فِي الْآخِرَةِ هُمُ الْأَخْسَرُونَ
  trl: Ulāʾika lladhīna khasirū anfusahum wa-ḍalla ʿanhum mā kānū yaftarūn · lā jarama annahum fi l-ākhirati humu l-akhsarūn
  trad: Ceux-là sont ceux qui ont fait perdre leurs propres nafs (khasirū anfusahum), et s'est égaré loin d'eux ce qu'ils forgeaient (yaftarūn). Nul doute (lā jarama) qu'ils sont, dans l'ākhira, les plus grands perdants (al-akhsarūn).
- ref: S.11:23
  ar: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَخْبَتُوا إِلَىٰ رَبِّهِمْ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Inna lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti wa-akhbatū ilā rabbihim ulāʾika aṣḥābu l-jannati hum fīhā khālidūn
  trad: Ceux qui ont cru, ont accompli les œuvres justes, et se sont abaissés avec humilité (akhbatū) vers leur Rabb — ceux-là sont les compagnons de la janna, ils y demeurent fixement (khālidūn).
- ref: S.11:24
  ar: ۞ مَثَلُ الْفَرِيقَيْنِ كَالْأَعْمَىٰ وَالْأَصَمِّ وَالْبَصِيرِ وَالسَّمِيعِ ۚ هَلْ يَسْتَوِيَانِ مَثَلًا ۚ أَفَلَا تَذَكَّرُونَ
  trl: Mathalu l-farīqayni kal-aʿmā wal-aṣammi wal-baṣīri was-samīʿi hal yastawiyāni mathalan afalā tadhakkarūn
  trad: L'image (mathal) des deux groupes (farīqayn) est celle de l'aveugle et du sourd, comparés au voyant et à l'entendant — sont-ils égaux (yastawiyāni) en image ? Ne vous rappellerez-vous donc pas ?
- ref: S.11:25–26
  ar: وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ إِنِّي لَكُمْ نَذِيرٌ مُبِينٌ أَنْ لَا تَعْبُدُوا إِلَّا اللَّهَ ۖ إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ أَلِيمٍ
  trl: Wa-la-qad arsalnā nūḥan ilā qawmihi innī lakum nadhīrun mubīn · an lā taʿbudū illā llāha innī akhāfu ʿalaykum ʿadhāba yawmin alīm
  trad: 'Et Nous avons certes envoyé Nūḥ vers son peuple : « Je suis pour vous un nadhīr manifeste (mubīn) — [à savoir] que vous n''adoriez qu''Allaah : je crains pour vous le châtiment d''un jour douloureux (alīm). »'
- ref: S.11:27
  ar: فَقَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ مَا نَرَاكَ إِلَّا بَشَرًا مِثْلَنَا وَمَا نَرَاكَ اتَّبَعَكَ إِلَّا الَّذِينَ هُمْ أَرَاذِلُنَا بَادِيَ الرَّأْيِ وَمَا نَرَىٰ لَكُمْ عَلَيْنَا مِنْ فَضْلٍ بَلْ نَظُنُّكُمْ كَاذِبِينَ
  trl: Fa-qāla l-malaʾu lladhīna kafarū min qawmihi mā narāka illā basharan mithlanā wa-mā narāka ttabaʿaka illā lladhīna hum arādhilunā bādiya r-raʾyi wa-mā narā lakum ʿalaynā min faḑlin bal naẕunnukum kādhibīn
  trad: 'L''assemblée (al-malaʾ) de ceux qui, parmi son peuple, avaient commis le kufr, dit : « Nous ne te voyons rien d''autre qu''un homme (bashar) comme nous ; et nous ne voyons t''avoir suivi que les plus vils d''entre nous (arādhilunā), à première vue et sans réflexion (bādiya r-raʾyi) ; et nous ne voyons en vous aucun surcroît (faḑl) sur nous — bien plutôt, nous vous croyons menteurs (kādhibīn). »'
- ref: S.11:28
  ar: قَالَ يَا قَوْمِ أَرَأَيْتُمْ إِنْ كُنْتُ عَلَىٰ بَيِّنَةٍ مِنْ رَبِّي وَآتَانِي رَحْمَةً مِنْ عِنْدِهِ فَعُمِّيَتْ عَلَيْكُمْ أَنُلْزِمُكُمُوهَا وَأَنْتُمْ لَهَا كَارِهُونَ
  trl: Qāla yā qawmi a-raʾaytum in kuntu ʿalā bayyinatin min rabbī wa-ātānī raḥmatan min ʿindihi fa-ʿummiyat ʿalaykum a-nulzimukumūhā wa-antum lahā kārihūn
  trad: 'Il dit : « Ô mon peuple, avez-vous considéré (a-raʾaytum) : si je me tiens sur une bayyina venue de mon Rabb, et qu''Il m''a donné une raḥma de Sa part restée obscure à vos yeux (fa-ʿummiyat ʿalaykum) — vous imposerais-je cela (a-nulzimukumūhā) alors que vous en avez de l''aversion (kārihūn) ? »'
- ref: S.11:29
  ar: وَيَا قَوْمِ لَا أَسْأَلُكُمْ عَلَيْهِ مَالًا ۖ إِنْ أَجْرِيَ إِلَّا عَلَى اللَّهِ ۚ وَمَا أَنَا بِطَارِدِ الَّذِينَ آمَنُوا ۚ إِنَّهُمْ مُلَاقُو رَبِّهِمْ وَلَٰكِنِّي أَرَاكُمْ قَوْمًا تَجْهَلُونَ
  trl: Wa-yā qawmi lā asʾalukum ʿalayhi mālan in ajriya illā ʿalā llāhi wa-mā anā bi-ṭāridi lladhīna āmanū innahum mulāqū rabbihim wa-lākinnī arākum qawman tajhalūn
  trad: '« Et, ô mon peuple, je ne vous demande pour cela aucun bien (māl) — mon salaire (ajr) n''incombe qu''à Allaah. Et je ne suis pas de ceux qui repoussent (bi-ṭāridi) ceux qui ont cru : ils sont ceux qui vont à la rencontre de leur Rabb (mulāqū rabbihim) — mais je vous vois, vous, un peuple qui s''installe dans l''ignorance (tajhalūn). »'
- ref: S.11:30
  ar: وَيَا قَوْمِ مَنْ يَنْصُرُنِي مِنَ اللَّهِ إِنْ طَرَدْتُهُمْ ۚ أَفَلَا تَذَكَّرُونَ
  trl: Wa-yā qawmi man yanṣurunī mina llāhi in ṭaradtuhum a-fa-lā tadhakkarūn
  trad: « Et, ô mon peuple, qui me secourrait (yanṣurunī) contre Allaah, si je les repoussais (ṭaradtuhum) ? Ne vous rappellerez-vous donc pas (a-fa-lā tadhakkarūn) ? »
- ref: S.11:31
  ar: وَلَا أَقُولُ لَكُمْ عِنْدِي خَزَائِنُ اللَّهِ وَلَا أَعْلَمُ الْغَيْبَ وَلَا أَقُولُ إِنِّي مَلَكٌ وَلَا أَقُولُ لِلَّذِينَ تَزْدَرِي أَعْيُنُكُمْ لَنْ يُؤْتِيَهُمُ اللَّهُ خَيْرًا ۖ اللَّهُ أَعْلَمُ بِمَا فِي أَنْفُسِهِمْ ۖ إِنِّي إِذًا لَمِنَ الظَّالِمِينَ
  trl: Wa-lā aqūlu lakum ʿindī khazāʾinu llāhi wa-lā aʿlamu l-ghayba wa-lā aqūlu innī malakun wa-lā aqūlu li-lladhīna tazdarī aʿyunukum lan yuʾtiyahumu llāhu khayran allāhu aʿlamu bimā fī anfusihim innī idhan la-mina ẕ-ẕālimīn
  trad: « Et je ne vous dis pas que j'ai auprès de moi les trésors (khazāʾin) d'Allaah, ni ne dis connaître le ghayb, ni ne dis être un ange (malak) ; et je ne dis pas, au sujet de ceux que vos yeux tiennent pour vils (tazdarī aʿyunukum), qu'Allaah ne leur donnera aucun bien — Allaah connaît mieux ce qui est dans leurs propres nafs. Je serais sinon (idhan), moi, du nombre des ẕālimūn. »
- ref: S.11:32
  ar: قَالُوا يَا نُوحُ قَدْ جَادَلْتَنَا فَأَكْثَرْتَ جِدَالَنَا فَأْتِنَا بِمَا تَعِدُنَا إِنْ كُنْتَ مِنَ الصَّادِقِينَ
  trl: Qālū yā nūḥu qad jādaltanā fa-aktharta jidālanā fa-ʾtinā bimā taʿidunā in kunta mina ṣ-ṣādiqīn
  trad: 'Ils dirent : « Ô Nūḥ, tu as disputé avec nous (jādaltanā), et tu as multiplié la dispute (jidālanā) — apporte-nous donc ce que tu nous promets (taʿidunā), si tu es du nombre des véridiques (ṣādiqīn). »'
- ref: S.11:33
  ar: قَالَ إِنَّمَا يَأْتِيكُمْ بِهِ اللَّهُ إِنْ شَاءَ وَمَا أَنْتُمْ بِمُعْجِزِينَ
  trl: Qāla innamā yaʾtīkum bihi llāhu in shāʾa wa-mā antum bi-muʿjizīn
  trad: 'Il dit : « C''est seulement Allaah qui vous l''apportera, s''Il veut (in shāʾa) — et vous ne serez pas de ceux capables de l''empêcher (bi-muʿjizīn). »'
- ref: S.11:34
  ar: وَلَا يَنْفَعُكُمْ نُصْحِي إِنْ أَرَدْتُ أَنْ أَنْصَحَ لَكُمْ إِنْ كَانَ اللَّهُ يُرِيدُ أَنْ يُغْوِيَكُمْ ۚ هُوَ رَبُّكُمْ وَإِلَيْهِ تُرْجَعُونَ
  trl: Wa-lā yanfaʿukum nuṣḥī in aradtu an anṣaḥa lakum in kāna llāhu yurīdu an yughwiyakum huwa rabbukum wa-ilayhi turjaʿūn
  trad: « Et mon conseil (nuṣḥī) ne vous serait d'aucune utilité, si je voulais vous conseiller, du moment qu'Allaah veut vous égarer (an yughwiyakum) — Il est votre Rabb, et c'est vers Lui que vous serez ramenés (turjaʿūn). »
- ref: S.11:35
  ar: أَمْ يَقُولُونَ افْتَرَاهُ ۖ قُلْ إِنِ افْتَرَيْتُهُ فَعَلَيَّ إِجْرَامِي وَأَنَا بَرِيءٌ مِمَّا تُجْرِمُونَ
  trl: Am yaqūlūna ftarāhu qul ini ftaraytuhu fa-ʿalayya ijrāmī wa-anā barīʾun mimmā tujrimūn
  trad: 'Ou bien disent-ils : « Il l''a forgé (iftarāhu) » ? Dis : « Si je l''ai forgé, alors sur moi retombe mon crime (ijrāmī) — et je suis innocent (barīʾ) de ce dont vous, vous vous rendez coupables (tujrimūn). »'
- ref: S.11:36
  ar: وَأُوحِيَ إِلَىٰ نُوحٍ أَنَّهُ لَنْ يُؤْمِنَ مِنْ قَوْمِكَ إِلَّا مَنْ قَدْ آمَنَ فَلَا تَبْتَئِسْ بِمَا كَانُوا يَفْعَلُونَ
  trl: Wa-ūḥiya ilā nūḥin annahu lan yuʾmina min qawmika illā man qad āmana fa-lā tabtaʾis bimā kānū yafʿalūn
  trad: 'Et il fut révélé (ūḥiya) à Nūḥ : « Nul, de ton peuple, ne croira plus, sinon celui qui a déjà cru — ne t''afflige donc pas (fa-lā tabtaʾis) de ce qu''ils faisaient. »'
- ref: S.11:37
  ar: وَاصْنَعِ الْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا وَلَا تُخَاطِبْنِي فِي الَّذِينَ ظَلَمُوا ۚ إِنَّهُمْ مُغْرَقُونَ
  trl: Wa-ṣnaʿi l-fulka bi-aʿyuninā wa-waḥyinā wa-lā tukhāṭibnī fi lladhīna ẕalamū innahum mughraqūn
  trad: '« Et construis l''arche (al-fulk) sous Nos aʿyun et par Notre inspiration (waḥyinā) — et ne M''interpelle plus (lā tukhāṭibnī) au sujet de ceux qui ont commis l''injustice (ẕalamū) : ils vont être noyés (mughraqūn). »'
- ref: S.11:38
  ar: وَيَصْنَعُ الْفُلْكَ وَكُلَّمَا مَرَّ عَلَيْهِ مَلَأٌ مِنْ قَوْمِهِ سَخِرُوا مِنْهُ ۚ قَالَ إِنْ تَسْخَرُوا مِنَّا فَإِنَّا نَسْخَرُ مِنْكُمْ كَمَا تَسْخَرُونَ
  trl: Wa-yaṣnaʿu l-fulka wa-kullamā marra ʿalayhi malaʾun min qawmihi sakhirū minhu qāla in taskharū minnā fa-innā naskharu minkum kamā taskharūn
  trad: 'Et il construisait l''arche — chaque fois qu''une assemblée (malaʾ) de son peuple passait près de lui, ils se moquaient (sakhirū) de lui. Il dit : « Si vous vous moquez de nous, nous nous moquerons de vous comme vous vous moquez. »'
- ref: S.11:39
  ar: فَسَوْفَ تَعْلَمُونَ مَنْ يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُقِيمٌ
  trl: Fa-sawfa taʿlamūna man yaʾtīhi ʿadhābun yukhzīhi wa-yaḥillu ʿalayhi ʿadhābun muqīm
  trad: « Vous saurez bientôt sur qui viendra un châtiment qui l'humilie (yukhzīhi), et sur qui s'installera un châtiment permanent (muqīm). »
- ref: S.11:40
  ar: حَتَّىٰ إِذَا جَاءَ أَمْرُنَا وَفَارَ التَّنُّورُ قُلْنَا احْمِلْ فِيهَا مِنْ كُلٍّ زَوْجَيْنِ اثْنَيْنِ وَأَهْلَكَ إِلَّا مَنْ سَبَقَ عَلَيْهِ الْقَوْلُ وَمَنْ آمَنَ ۚ وَمَا آمَنَ مَعَهُ إِلَّا قَلِيلٌ
  trl: Ḥattā idhā jāʾa amrunā wa-fāra t-tannūru qulnā ḥmil fīhā min kullin zawjayni thnayni wa-ahlaka illā man sabaqa ʿalayhi l-qawlu wa-man āmana wa-mā āmana maʿahu illā qalīl
  trad: 'Jusqu''à ce que, lorsque vint Notre ordre (amrunā) et que le tannūr déborda (fāra), Nous dîmes : « Charge en elle, de chaque espèce, un couple (zawjayni thnayni), ainsi que ta famille (ahlaka) — sauf celui contre qui la parole (al-qawl) a déjà précédé (sabaqa) — et ceux qui ont cru. » Et il ne crut avec lui qu''un petit nombre (qalīl).'
- ref: S.11:41
  ar: ۞ وَقَالَ ارْكَبُوا فِيهَا بِسْمِ اللَّهِ مَجْرَاهَا وَمُرْسَاهَا ۚ إِنَّ رَبِّي لَغَفُورٌ رَحِيمٌ
  trl: Wa-qāla rkabū fīhā bismi llāhi majrāhā wa-mursāhā inna rabbī la-ghafūrun raḥīm
  trad: 'Et il dit : « Embarquez en elle — au nom d''Allaah sa course (majrāhā) et son mouillage (mursāhā) ! Mon Rabb est certes Ghafūr, Raḥīm. »'
- ref: S.11:42
  ar: وَهِيَ تَجْرِي بِهِمْ فِي مَوْجٍ كَالْجِبَالِ وَنَادَىٰ نُوحٌ ابْنَهُ وَكَانَ فِي مَعْزِلٍ يَا بُنَيَّ ارْكَبْ مَعَنَا وَلَا تَكُنْ مَعَ الْكَافِرِينَ
  trl: Wa-hiya tajrī bihim fī mawjin ka-l-jibāli wa-nādā nūḥun ibnahu wa-kāna fī maʿzilin yā bunayya rkab maʿanā wa-lā takun maʿa l-kāfirīn
  trad: 'Et elle voguait avec eux dans une houle (mawj) semblable à des montagnes. Et Nūḥ appela son fils (ibnahu), qui était resté à l''écart (fī maʿzil) : « Ô mon petit-fils bien-aimé (yā bunayya), embarque avec nous, et ne sois pas avec les kāfirūn ! »'
- ref: S.11:43
  ar: قَالَ سَآوِي إِلَىٰ جَبَلٍ يَعْصِمُنِي مِنَ الْمَاءِ ۚ قَالَ لَا عَاصِمَ الْيَوْمَ مِنْ أَمْرِ اللَّهِ إِلَّا مَنْ رَحِمَ ۚ وَحَالَ بَيْنَهُمَا الْمَوْجُ فَكَانَ مِنَ الْمُغْرَقِينَ
  trl: Qāla sa-āwī ilā jabalin yaʿṣimunī mina l-māʾi qāla lā ʿāṣima l-yawma min amri llāhi illā man raḥima wa-ḥāla baynahumā l-mawju fa-kāna mina l-mughraqīn
  trad: 'Il dit : « Je vais me réfugier (sa-āwī) vers une montagne qui me protégera (yaʿṣimunī) de l''eau. » Il dit : « Nul protecteur (ʿāṣim) aujourd''hui contre l''ordre d''Allaah, sinon celui à qui Il fait miséricorde (raḥima). » Et la houle s''interposa (ḥāla) entre eux deux, et il fut du nombre des noyés (al-mughraqīn).'
- ref: S.11:44
  ar: وَقِيلَ يَا أَرْضُ ابْلَعِي مَاءَكِ وَيَا سَمَاءُ أَقْلِعِي وَغِيضَ الْمَاءُ وَقُضِيَ الْأَمْرُ وَاسْتَوَتْ عَلَى الْجُودِيِّ ۖ وَقِيلَ بُعْدًا لِلْقَوْمِ الظَّالِمِينَ
  trl: Wa-qīla yā arḑu blaʿī māʾaki wa-yā samāʾu qliʿī wa-ghīḑa l-māʾu wa-quḑiya l-amru wa-stawat ʿalā l-jūdiyyi wa-qīla buʿdan li-l-qawmi ẕ-ẕālimīn
  trad: 'Et il fut dit : « Ô terre, absorbe (iblaʿī) ton eau ! Ô ciel, cesse (aqliʿī) ! » Et l''eau se résorba (ghīḑa), l''ordre fut accompli (quḑiya l-amru), et elle [l''arche] se posa (istawat) sur le Jūdī. Et il fut dit : « Éloignement (buʿdan) pour le peuple des ẕālimūn ! »'
- ref: S.11:45
  ar: وَنَادَىٰ نُوحٌ رَبَّهُ فَقَالَ رَبِّ إِنَّ ابْنِي مِنْ أَهْلِي وَإِنَّ وَعْدَكَ الْحَقُّ وَأَنْتَ أَحْكَمُ الْحَاكِمِينَ
  trl: Wa-nādā nūḥun rabbahu fa-qāla rabbi inna bnī min ahlī wa-inna waʿdaka l-ḥaqqu wa-anta aḥkamu l-ḥākimīn
  trad: 'Et Nūḥ appela son Rabb, et dit : « Rabb, mon fils (ibnī) est de ma famille (ahlī) — et Ta promesse (waʿdaka) est le ḥaqq, et Tu es le plus juste des juges (aḥkamu l-ḥākimīn). »'
- ref: S.11:46
  ar: قَالَ يَا نُوحُ إِنَّهُ لَيْسَ مِنْ أَهْلِكَ ۖ إِنَّهُ عَمَلٌ غَيْرُ صَالِحٍ ۖ فَلَا تَسْأَلْنِ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۖ إِنِّي أَعِظُكَ أَنْ تَكُونَ مِنَ الْجَاهِلِينَ
  trl: Qāla yā nūḥu innahu laysa min ahlika innahu ʿamalun ghayru ṣāliḥin fa-lā tasʾalni mā laysa laka bihi ʿilmun innī aʿiẕuka an takūna mina l-jāhilīn
  trad: 'Il dit : « Ô Nūḥ, il n''est pas de ta famille (ahlika) — c''est une œuvre non droite (ʿamalun ghayru ṣāliḥ). Ne Me demande donc pas ce dont tu n''as pas connaissance (ʿilm) — Je t''exhorte (aʿiẕuka) à ne pas être du nombre des ignorants (al-jāhilīn). »'
- ref: S.11:47
  ar: قَالَ رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ ۖ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُنْ مِنَ الْخَاسِرِينَ
  trl: Qāla rabbi innī aʿūdhu bika an asʾalaka mā laysa lī bihi ʿilmun wa-illā taghfir lī wa-tarḥamnī akun mina l-khāsirīn
  trad: 'Il dit : « Rabb, je me réfugie (aʿūdhu) en Toi, pour ne pas Te demander ce dont je n''ai pas connaissance — et si Tu ne me pardonnes pas (taghfir lī) et ne me fais pas miséricorde (tarḥamnī), je serai du nombre des perdants (al-khāsirīn). »'
- ref: S.11:48
  ar: قِيلَ يَا نُوحُ اهْبِطْ بِسَلَامٍ مِنَّا وَبَرَكَاتٍ عَلَيْكَ وَعَلَىٰ أُمَمٍ مِمَّنْ مَعَكَ ۚ وَأُمَمٌ سَنُمَتِّعُهُمْ ثُمَّ يَمَسُّهُمْ مِنَّا عَذَابٌ أَلِيمٌ
  trl: Qīla yā nūḥu hbiṭ bi-salāmin minnā wa-barakātin ʿalayka wa-ʿalā umamin mimman maʿaka wa-umamun sa-numattiʿuhum thumma yamassuhum minnā ʿadhābun alīm
  trad: 'Il fut dit : « Ô Nūḥ, descends (ihbiṭ) avec un salām venu de Nous, et des bénédictions (barakāt) sur toi et sur des communautés (umam) issues de ceux qui sont avec toi ; et il y aura des communautés que Nous laisserons jouir (sa-numattiʿuhum), puis un châtiment douloureux les touchera de Notre part. »'
- ref: S.11:49
  ar: تِلْكَ مِنْ أَنْبَاءِ الْغَيْبِ نُوحِيهَا إِلَيْكَ ۖ مَا كُنْتَ تَعْلَمُهَا أَنْتَ وَلَا قَوْمُكَ مِنْ قَبْلِ هَٰذَا ۖ فَاصْبِرْ ۖ إِنَّ الْعَاقِبَةَ لِلْمُتَّقِينَ
  trl: Tilka min anbāʾi l-ghaybi nūḥīhā ilayka mā kunta taʿlamuhā anta wa-lā qawmuka min qabli hādhā fa-ṣbir inna l-ʿāqibata li-l-muttaqīn
  trad: 'Cela fait partie des récits (anbāʾ) du ghayb que Nous te révélons (nūḥīhā ilayka) — tu ne les connaissais pas, toi, ni ton peuple, avant cela. Patiente donc (fa-ṣbir) : la fin heureuse (al-ʿāqiba) est pour les muttaqīn.'
- ref: S.11:50
  ar: وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا ۚ قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ إِنْ أَنْتُمْ إِلَّا مُفْتَرُونَ
  trl: Wa-ilā ʿādin akhāhum hūdan qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu in antum illā muftarūn
  trad: 'Et vers ʿĀd, leur frère (akhāhum) Hūd — il dit : « Ô mon peuple, adorez Allaah : vous n''avez pas d''ilāh en dehors de Lui. Vous n''êtes que des inventeurs de mensonge (muftarūn). »'
- ref: S.11:51
  ar: يَا قَوْمِ لَا أَسْأَلُكُمْ عَلَيْهِ أَجْرًا ۖ إِنْ أَجْرِيَ إِلَّا عَلَى الَّذِي فَطَرَنِي ۚ أَفَلَا تَعْقِلُونَ
  trl: Yā qawmi lā asʾalukum ʿalayhi ajran in ajriya illā ʿalā lladhī faṭaranī a-fa-lā taʿqilūn
  trad: « Ô mon peuple, je ne vous demande pour cela aucun salaire (ajr) — mon salaire n'incombe qu'à Ce qui m'a fait naître à l'existence (faṭaranī) — ne raisonnerez-vous donc pas (taʿqilūn) ? »
- ref: S.11:52
  ar: وَيَا قَوْمِ اسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا وَيَزِدْكُمْ قُوَّةً إِلَىٰ قُوَّتِكُمْ وَلَا تَتَوَلَّوْا مُجْرِمِينَ
  trl: Wa-yā qawmi staghfirū rabbakum thumma tūbū ilayhi yursili s-samāʾa ʿalaykum midrāran wa-yazidkum quwwatan ilā quwwatikum wa-lā tatawallaw mujrimīn
  trad: '« Et, ô mon peuple, demandez pardon (istaghfirū) à votre Rabb, puis revenez à Lui (tūbū ilayhi) : Il enverra sur vous le ciel en pluie abondante (midrāran), et ajoutera à votre force une force supplémentaire — et ne vous détournez pas en devenant coupables (mujrimīn). »'
- ref: S.11:53
  ar: قَالُوا يَا هُودُ مَا جِئْتَنَا بِبَيِّنَةٍ وَمَا نَحْنُ بِتَارِكِي آلِهَتِنَا عَنْ قَوْلِكَ وَمَا نَحْنُ لَكَ بِمُؤْمِنِينَ
  trl: Qālū yā hūdu mā jiʾtanā bi-bayyinatin wa-mā naḥnu bi-tāriki ālihatinā ʿan qawlika wa-mā naḥnu laka bi-muʾminīn
  trad: 'Ils dirent : « Ô Hūd, tu ne nous as apporté aucune bayyina, et nous ne sommes pas de ceux qui délaisseraient nos dieux (ālihatinā) sur ta seule parole, et nous ne sommes pas croyants en toi. »'
- ref: S.11:54–55
  ar: إِنْ نَقُولُ إِلَّا اعْتَرَاكَ بَعْضُ آلِهَتِنَا بِسُوءٍ ۗ قَالَ إِنِّي أُشْهِدُ اللَّهَ وَاشْهَدُوا أَنِّي بَرِيءٌ مِمَّا تُشْرِكُونَ مِنْ دُونِهِ ۖ فَكِيدُونِي جَمِيعًا ثُمَّ لَا تُنْظِرُونِ
  trl: In naqūlu illā ʿtarāka baʿḍu ālihatinā bi-sūʾin qāla innī ushhidu llāha wa-shhadū annī barīʾun mimmā tushrikūn — min dūnihi fa-kīdūnī jamīʿan thumma lā tunẓirūn
  trad: '« Nous ne disons rien d''autre sinon que certains de nos dieux t''ont frappé (iʿtarāka) d''un mal. » Il dit : « Je prends Allaah à témoin, et soyez vous-mêmes témoins, que je suis innocent (barīʾ) de ce que vous associez, en dehors de Lui (min dūnihi) : liguez-vous donc tous contre moi (fa-kīdūnī jamīʿan), et ne m''accordez aucun répit (lā tunẓirūn). »'
- ref: S.11:56
  ar: إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُمْ ۚ مَا مِنْ دَابَّةٍ إِلَّا هُوَ آخِذٌ بِنَاصِيَتِهَا ۚ إِنَّ رَبِّي عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Innī tawakkaltu ʿalā llāhi rabbī wa-rabbikum mā min dābbatin illā huwa ākhidhun bi-nāṣiyatihā inna rabbī ʿalā ṣirāṭin mustaqīm
  trad: '« Je me suis en remis (tawakkaltu) à Allaah, mon Rabb et votre Rabb : il n''est nulle créature (dābba) qu''Il ne tienne fermement sous Son emprise (ākhidhun bi-nāṣiyatihā, litt. « la tenant par le toupet ») — mon Rabb est certes ʿalā ṣirāṭin mustaqīm. »'
- ref: S.11:57
  ar: فَإِنْ تَوَلَّوْا فَقَدْ أَبْلَغْتُكُمْ مَا أُرْسِلْتُ بِهِ إِلَيْكُمْ ۚ وَيَسْتَخْلِفُ رَبِّي قَوْمًا غَيْرَكُمْ وَلَا تَضُرُّونَهُ شَيْئًا ۚ إِنَّ رَبِّي عَلَىٰ كُلِّ شَيْءٍ حَفِيظٌ
  trl: Fa-in tawallaw fa-qad ablaghtukum mā ursiltu bihi ilaykum wa-yastakhlifu rabbī qawman ghayrakum wa-lā taḍurrūnahu shayʾan inna rabbī ʿalā kulli shayʾin ḥafīẓ
  trad: '« Si vous vous détournez, je vous ai pourtant transmis (ablaghtukum) ce avec quoi j''ai été envoyé vers vous — mon Rabb fera succéder (yastakhlifu) à votre place un autre peuple, et vous ne Lui nuirez en rien : mon Rabb est certes ḥafīẓ sur toute chose. »'
- ref: S.11:58
  ar: وَلَمَّا جَاءَ أَمْرُنَا نَجَّيْنَا هُودًا وَالَّذِينَ آمَنُوا مَعَهُ بِرَحْمَةٍ مِنَّا وَنَجَّيْنَاهُمْ مِنْ عَذَابٍ غَلِيظٍ
  trl: Wa-lammā jāʾa amrunā najjaynā hūdan wa-lladhīna āmanū maʿahu bi-raḥmatin minnā wa-najjaynāhum min ʿadhābin ghalīẓ
  trad: Et lorsque vint Notre ordre, Nous sauvâmes Hūd et ceux qui avaient cru avec lui par une raḥma venant de Nous, et Nous les sauvâmes d'un châtiment rude (ghalīẓ).
- ref: S.11:59
  ar: وَتِلْكَ عَادٌ ۖ جَحَدُوا بِآيَاتِ رَبِّهِمْ وَعَصَوْا رُسُلَهُ وَاتَّبَعُوا أَمْرَ كُلِّ جَبَّارٍ عَنِيدٍ
  trl: Wa-tilka ʿādun jaḥadū bi-āyāti rabbihim wa-ʿaṣaw rusulahu wa-ttabaʿū amra kulli jabbārin ʿanīd
  trad: 'Et voilà ʿĀd : ils ont nié (jaḥadū) les āyāt de leur Rabb, désobéi (ʿaṣaw) à Ses rusul, et suivi l''ordre de tout tyran (jabbār) obstiné (ʿanīd).'
- ref: S.11:60
  ar: وَأُتْبِعُوا فِي هَٰذِهِ الدُّنْيَا لَعْنَةً وَيَوْمَ الْقِيَامَةِ ۗ أَلَا إِنَّ عَادًا كَفَرُوا رَبَّهُمْ ۗ أَلَا بُعْدًا لِعَادٍ قَوْمِ هُودٍ
  trl: Wa-utbiʿū fī hādhihi d-dunyā laʿnatan wa-yawma l-qiyāmati alā inna ʿādan kafarū rabbahum alā buʿdan li-ʿādin qawmi hūd
  trad: 'Et ils furent poursuivis (utbiʿū), dans cette vie d''ici-bas, d''une malédiction (laʿna), et [le seront] au Jour de la Résurrection — n''est-il pas vrai qu''ʿĀd a renié (kafarū) son Rabb ? N''est-il pas vrai : éloignement (buʿdan) pour ʿĀd, le peuple de Hūd !'
- ref: S.11:61
  ar: ۞ وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَالِحًا ۚ قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ هُوَ أَنْشَأَكُمْ مِنَ الْأَرْضِ وَاسْتَعْمَرَكُمْ فِيهَا فَاسْتَغْفِرُوهُ ثُمَّ تُوبُوا إِلَيْهِ ۚ إِنَّ رَبِّي قَرِيبٌ مُجِيبٌ
  trl: Wa-ilā thamūda akhāhum ṣāliḥan qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu huwa anshaʾakum mina l-arḍi wa-staʿmarakum fīhā fa-staghfirūhu thumma tūbū ilayhi inna rabbī qarībun mujīb
  trad: 'Et vers Thamūd, leur frère Ṣāliḥ — il dit : « Ô mon peuple, adorez Allaah : vous n''avez pas d''ilāh en dehors de Lui. C''est Lui qui vous a fait naître (anshaʾakum) de la terre et vous y a établis pour la faire fructifier (istaʿmarakum) — demandez-Lui donc pardon, puis revenez à Lui : mon Rabb est certes qarīb, Ce qui répond (mujīb). »'
- ref: S.11:62
  ar: قَالُوا يَا صَالِحُ قَدْ كُنْتَ فِينَا مَرْجُوًّا قَبْلَ هَٰذَا ۖ أَتَنْهَانَا أَنْ نَعْبُدَ مَا يَعْبُدُ آبَاؤُنَا وَإِنَّنَا لَفِي شَكٍّ مِمَّا تَدْعُونَا إِلَيْهِ مُرِيبٍ
  trl: Qālū yā ṣāliḥu qad kunta fīnā marjuwwan qabla hādhā a-tanhānā an naʿbuda mā yaʿbudu ābāʾunā wa-innanā la-fī shakkin mimmā tadʿūnā ilayhi murīb
  trad: 'Ils dirent : « Ô Ṣāliḥ, tu étais certes, parmi nous, un espoir (marjuwwan) avant ceci — nous interdirais-tu (a-tanhānā) d''adorer ce qu''adoraient nos pères ? Et nous voici certes dans un doute troublant (shakkin murīb) au sujet de ce vers quoi tu nous appelles. »'
- ref: S.11:63
  ar: قَالَ يَا قَوْمِ أَرَأَيْتُمْ إِنْ كُنْتُ عَلَىٰ بَيِّنَةٍ مِنْ رَبِّي وَآتَانِي مِنْهُ رَحْمَةً فَمَنْ يَنْصُرُنِي مِنَ اللَّهِ إِنْ عَصَيْتُهُ ۖ فَمَا تَزِيدُونَنِي غَيْرَ تَخْسِيرٍ
  trl: Qāla yā qawmi a-raʾaytum in kuntu ʿalā bayyinatin min rabbī wa-ātānī minhu raḥmatan fa-man yanṣurunī mina llāhi in ʿaṣaytuhu fa-mā tazīdūnanī ghayra takhsīr
  trad: 'Il dit : « Ô mon peuple, avez-vous considéré (a-raʾaytum) : si je me tiens sur une bayyina venue de mon Rabb, et qu''Il m''a donné une raḥma de Sa part — qui donc me secourrait contre Allaah, si je Lui désobéissais ? Vous ne m''ajouteriez alors rien d''autre qu''une perte (takhsīr). »'
- ref: S.11:64
  ar: وَيَا قَوْمِ هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً فَذَرُوهَا تَأْكُلْ فِي أَرْضِ اللَّهِ وَلَا تَمَسُّوهَا بِسُوءٍ فَيَأْخُذَكُمْ عَذَابٌ قَرِيبٌ
  trl: Wa-yā qawmi hādhihi nāqatu llāhi lakum āyatan fa-dharūhā taʾkul fī arḍi llāhi wa-lā tamassūhā bi-sūʾin fa-yaʾkhudhakum ʿadhābun qarīb
  trad: « Et, ô mon peuple, voici la chamelle d'Allaah (nāqatu llāh), un signe (āya) pour vous — laissez-la donc se nourrir sur la terre d'Allaah, et ne lui faites aucun mal (sūʾ), sinon un châtiment proche vous saisirait. »
- ref: S.11:65
  ar: فَعَقَرُوهَا فَقَالَ تَمَتَّعُوا فِي دَارِكُمْ ثَلَاثَةَ أَيَّامٍ ۖ ذَٰلِكَ وَعْدٌ غَيْرُ مَكْذُوبٍ
  trl: Fa-ʿaqarūhā fa-qāla tamattaʿū fī dārikum thalāthata ayyāmin dhālika waʿdun ghayru makdhūb
  trad: 'Ils la mutilèrent (ʿaqarūhā) — il dit alors : « Jouissez (tamattaʿū) dans votre demeure trois jours : voilà une promesse (waʿd) qui n''est pas mensongère (ghayru makdhūb). »'
- ref: S.11:66
  ar: فَلَمَّا جَاءَ أَمْرُنَا نَجَّيْنَا صَالِحًا وَالَّذِينَ آمَنُوا مَعَهُ بِرَحْمَةٍ مِنَّا وَمِنْ خِزْيِ يَوْمِئِذٍ ۗ إِنَّ رَبَّكَ هُوَ الْقَوِيُّ الْعَزِيزُ
  trl: Fa-lammā jāʾa amrunā najjaynā ṣāliḥan wa-lladhīna āmanū maʿahu bi-raḥmatin minnā wa-min khizyi yawmiʾidhin inna rabbaka huwa l-qawiyyu l-ʿazīz
  trad: Et lorsque vint Notre ordre, Nous sauvâmes Ṣāliḥ et ceux qui avaient cru avec lui par une raḥma venant de Nous, et de l'opprobre (khizy) de ce jour-là — ton Rabb est certes al-Qawiyy, al-ʿAzīz.
- ref: S.11:67
  ar: وَأَخَذَ الَّذِينَ ظَلَمُوا الصَّيْحَةُ فَأَصْبَحُوا فِي دِيَارِهِمْ جَاثِمِينَ
  trl: Wa-akhadha lladhīna ẓalamū ṣ-ṣayḥatu fa-aṣbaḥū fī diyārihim jāthimīn
  trad: Et le Cri (aṣ-ṣayḥa) saisit ceux qui avaient commis l'injustice (ẓalamū), et ils se retrouvèrent, dans leurs demeures, gisant à terre, immobiles (jāthimīn).
- ref: S.11:68
  ar: كَأَنْ لَمْ يَغْنَوْا فِيهَا ۗ أَلَا إِنَّ ثَمُودَ كَفَرُوا رَبَّهُمْ ۗ أَلَا بُعْدًا لِثَمُودَ
  trl: Ka-an lam yaghnaw fīhā alā inna thamūda kafarū rabbahum alā buʿdan li-thamūd
  trad: 'Comme s''ils n''y avaient jamais demeuré (lam yaghnaw) — n''est-il pas vrai que Thamūd a renié son Rabb ? N''est-il pas vrai : éloignement pour Thamūd !'
- ref: S.11:69
  ar: وَلَقَدْ جَاءَتْ رُسُلُنَا إِبْرَاهِيمَ بِالْبُشْرَىٰ قَالُوا سَلَامًا قَالَ سَلَامٌ فَمَا لَبِثَ أَنْ جَاءَ بِعِجْلٍ حَنِيذٍ
  trl: Wa-la-qad jāʾat rusulunā ibrāhīma bi-l-bushrā qālū salāman qāla salāmun fa-mā labitha an jāʾa bi-ʿijlin ḥanīdh
  trad: 'Et Nos envoyés (rusulunā) vinrent certes à Ibrāhīm avec l''heureuse annonce (al-bushrā) : ils dirent « Salām », il dit « Salām » — et il ne tarda pas (mā labitha) à apporter un veau rôti (ʿijlin ḥanīdh).'
- ref: S.11:70
  ar: فَلَمَّا رَأَىٰ أَيْدِيَهُمْ لَا تَصِلُ إِلَيْهِ نَكِرَهُمْ وَأَوْجَسَ مِنْهُمْ خِيفَةً ۚ قَالُوا لَا تَخَفْ إِنَّا أُرْسِلْنَا إِلَىٰ قَوْمِ لُوطٍ
  trl: Fa-lammā raʾā aydiyahum lā taṣilu ilayhi nakirahum wa-awjasa minhum khīfatan qālū lā takhaf innā ursilnā ilā qawmi lūṭ
  trad: 'Mais quand il vit que leurs mains ne se portaient pas vers lui [le repas], il les trouva étranges (nakirahum) et en conçut, en lui-même, une crainte (awjasa … khīfatan) — ils dirent : « Ne crains rien : nous avons été envoyés vers le peuple de Lūṭ. »'
- ref: S.11:71
  ar: وَامْرَأَتُهُ قَائِمَةٌ فَضَحِكَتْ فَبَشَّرْنَاهَا بِإِسْحَاقَ وَمِنْ وَرَاءِ إِسْحَاقَ يَعْقُوبَ
  trl: Wa-mraʾatuhu qāʾimatun fa-ḍaḥikat fa-bashsharnāhā bi-isḥāqa wa-min warāʾi isḥāqa yaʿqūb
  trad: Et sa femme, debout, rit (ḍaḥikat) — Nous lui annonçâmes (bashsharnāhā) Isḥāq, et, après (min warāʾi) Isḥāq, Yaʿqūb.
- ref: S.11:72
  ar: قَالَتْ يَا وَيْلَتَىٰ أَأَلِدُ وَأَنَا عَجُوزٌ وَهَٰذَا بَعْلِي شَيْخًا ۖ إِنَّ هَٰذَا لَشَيْءٌ عَجِيبٌ
  trl: Qālat yā waylatā a-alidu wa-anā ʿajūzun wa-hādhā baʿlī shaykhan inna hādhā la-shayʾun ʿajīb
  trad: 'Elle dit : « Malheur à moi (yā waylatā) ! Enfanterais-je (a-alidu), alors que je suis une vieille femme (ʿajūz), et que voici mon époux (baʿlī), un vieillard (shaykhan) ? Ceci est vraiment une chose étonnante (ʿajīb) ! »'
- ref: S.11:73
  ar: قَالُوا أَتَعْجَبِينَ مِنْ أَمْرِ اللَّهِ ۖ رَحْمَتُ اللَّهِ وَبَرَكَاتُهُ عَلَيْكُمْ أَهْلَ الْبَيْتِ ۚ إِنَّهُ حَمِيدٌ مَجِيدٌ
  trl: Qālū a-taʿjabīna min amri llāhi raḥmatu llāhi wa-barakātuhu ʿalaykum ahla l-bayti innahu ḥamīdun majīd
  trad: 'Ils dirent : « T''étonnes-tu de l''ordre (amr) d''Allaah ? La raḥma d''Allaah et Ses bénédictions (barakātuhu) soient sur vous, gens de cette maison (ahla l-bayt) — Il est certes Ḥamīd, Majīd. »'
- ref: S.11:74
  ar: فَلَمَّا ذَهَبَ عَنْ إِبْرَاهِيمَ الرَّوْعُ وَجَاءَتْهُ الْبُشْرَىٰ يُجَادِلُنَا فِي قَوْمِ لُوطٍ
  trl: Fa-lammā dhahaba ʿan ibrāhīma r-rawʿu wa-jāʾathu l-bushrā yujādilunā fī qawmi lūṭ
  trad: Puis, quand la frayeur (ar-rawʿ) eut quitté Ibrāhīm et que l'heureuse annonce lui fut venue, il se mit à disputer avec Nous (yujādilunā) au sujet du peuple de Lūṭ.
- ref: S.11:75
  ar: إِنَّ إِبْرَاهِيمَ لَحَلِيمٌ أَوَّاهٌ مُنِيبٌ
  trl: Inna ibrāhīma la-ḥalīmun awwāhun munīb
  trad: Ibrāhīm est certes empreint de mansuétude (ḥalīm), enclin à la plainte suppliante (awwāh), et revenant sans cesse [à son Rabb] (munīb).
- ref: S.11:76
  ar: يَا إِبْرَاهِيمُ أَعْرِضْ عَنْ هَٰذَا ۖ إِنَّهُ قَدْ جَاءَ أَمْرُ رَبِّكَ ۖ وَإِنَّهُمْ آتِيهِمْ عَذَابٌ غَيْرُ مَرْدُودٍ
  trl: Yā ibrāhīmu aʿriḍ ʿan hādhā innahu qad jāʾa amru rabbika wa-innahum ātīhim ʿadhābun ghayru mardūd
  trad: '« Ô Ibrāhīm, détourne-toi de cela (aʿriḍ) : l''ordre de ton Rabb est déjà venu, et un châtiment qui ne peut être repoussé (ghayru mardūd) va certes les atteindre. »'
- ref: S.11:77
  ar: وَلَمَّا جَاءَتْ رُسُلُنَا لُوطًا سِيءَ بِهِمْ وَضَاقَ بِهِمْ ذَرْعًا وَقَالَ هَٰذَا يَوْمٌ عَصِيبٌ
  trl: Wa-lammā jāʾat rusulunā lūṭan sīʾa bihim wa-ḍāqa bihim dharʿan wa-qāla hādhā yawmun ʿaṣīb
  trad: 'Et lorsque Nos envoyés vinrent à Lūṭ, il fut affligé (sīʾa) à cause d''eux, et sa capacité s''en trouva resserrée (ḍāqa bihim dharʿan) — il dit : « Voici un jour rude (ʿaṣīb). »'
- ref: S.11:78
  ar: وَجَاءَهُ قَوْمُهُ يُهْرَعُونَ إِلَيْهِ وَمِنْ قَبْلُ كَانُوا يَعْمَلُونَ السَّيِّئَاتِ قَالَ يَا قَوْمِ هَٰؤُلَاءِ بَنَاتِي هُنَّ أَطْهَرُ لَكُمْ فَاتَّقُوا اللَّهَ وَلَا تُخْزُونِ فِي ضَيْفِي أَلَيْسَ مِنْكُمْ رَجُلٌ رَشِيدٌ
  trl: Wa-jāʾahu qawmuhu yuhraʿūna ilayhi wa-min qablu kānū yaʿmalūna s-sayyiʾāti qāla yā qawmi hāʾulāʾi banātī hunna aṭharu lakum fa-ttaqū llāha wa-lā tukhzūni fī ḍayfī a-laysa minkum rajulun rashīd
  trad: 'Et son peuple vint à lui en se précipitant (yuhraʿūna), et ils commettaient déjà auparavant les mauvaises actions (as-sayyiʾāt) — il dit : « Ô mon peuple, voici mes filles (banātī) : elles sont plus pures (aṭharu) pour vous — constituez-vous une taqwā d''Allaah, et ne me déshonorez pas (lā tukhzūni) devant mes hôtes (ḍayfī) : n''y a-t-il pas parmi vous un homme de rectitude (rajulun rashīd) ? »'
- ref: S.11:79
  ar: قَالُوا لَقَدْ عَلِمْتَ مَا لَنَا فِي بَنَاتِكَ مِنْ حَقٍّ وَإِنَّكَ لَتَعْلَمُ مَا نُرِيدُ
  trl: Qālū la-qad ʿalimta mā lanā fī banātika min ḥaqqin wa-innaka la-taʿlamu mā nurīd
  trad: 'Ils dirent : « Tu sais bien que nous n''avons aucun droit (ḥaqq) sur tes filles — et tu sais certes ce que nous voulons. »'
- ref: S.11:80
  ar: قَالَ لَوْ أَنَّ لِي بِكُمْ قُوَّةً أَوْ آوِي إِلَىٰ رُكْنٍ شَدِيدٍ
  trl: Qāla law anna lī bikum quwwatan aw āwī ilā ruknin shadīd
  trad: 'Il dit : « Si seulement j''avais sur vous quelque force, ou si je pouvais me réfugier (āwī) auprès d''un appui puissant (ruknin shadīd) ! »'
- ref: S.11:81
  ar: قَالُوا يَا لُوطُ إِنَّا رُسُلُ رَبِّكَ لَنْ يَصِلُوا إِلَيْكَ ۖ فَأَسْرِ بِأَهْلِكَ بِقِطْعٍ مِنَ اللَّيْلِ وَلَا يَلْتَفِتْ مِنْكُمْ أَحَدٌ إِلَّا امْرَأَتَكَ ۖ إِنَّهُ مُصِيبُهَا مَا أَصَابَهُمْ ۚ إِنَّ مَوْعِدَهُمُ الصُّبْحُ ۚ أَلَيْسَ الصُّبْحُ بِقَرِيبٍ
  trl: Qālū yā lūṭu innā rusulu rabbika lan yaṣilū ilayka fa-asri bi-ahlika bi-qiṭʿin mina l-layli wa-lā yaltafit minkum aḥadun illā mraʾataka innahu muṣībuhā mā aṣābahum inna mawʿidahumu ṣ-ṣubḥu a-laysa ṣ-ṣubḥu bi-qarīb
  trad: 'Ils dirent : « Ô Lūṭ, nous sommes les envoyés (rusul) de ton Rabb — ils ne t''atteindront (yaṣilū) jamais. Pars donc avec ta famille (ahlika) durant une partie (qiṭʿ) de la nuit, et que nul d''entre vous ne se retourne (lā yaltafit), sauf ta femme : ce qui les atteindra (aṣābahum) l''atteindra elle aussi. Leur rendez-vous (mawʿid) est le matin (aṣ-ṣubḥ) — le matin n''est-il pas proche ? »'
- ref: S.11:82–83
  ar: فَلَمَّا جَاءَ أَمْرُنَا جَعَلْنَا عَالِيَهَا سَافِلَهَا وَأَمْطَرْنَا عَلَيْهَا حِجَارَةً مِنْ سِجِّيلٍ مَنْضُودٍ مُسَوَّمَةً عِنْدَ رَبِّكَ ۖ وَمَا هِيَ مِنَ الظَّالِمِينَ بِبَعِيدٍ
  trl: Fa-lammā jāʾa amrunā jaʿalnā ʿāliyahā sāfilahā wa-amṭarnā ʿalayhā ḥijāratan min sijjīlin manḍūd — musawwamatan ʿinda rabbika wa-mā hiya mina ẓ-ẓālimīna bi-baʿīd
  trad: Et lorsque vint Notre ordre, Nous fîmes de son sommet son tréfonds (jaʿalnā ʿāliyahā sāfilahā), et Nous fîmes pleuvoir sur elle des pierres de sijjīl empilées (manḍūd), marquées (musawwamatan) ʿinda rabbika — et elle n'est pas loin des ẓālimūn.
- ref: S.11:84
  ar: ۞ وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا ۚ قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ وَلَا تَنْقُصُوا الْمِكْيَالَ وَالْمِيزَانَ ۚ إِنِّي أَرَاكُمْ بِخَيْرٍ وَإِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ مُحِيطٍ
  trl: Wa-ilā madyana akhāhum shuʿayban qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu wa-lā tanquṣū l-mikyāla wa-l-mīzāna innī arākum bi-khayrin wa-innī akhāfu ʿalaykum ʿadhāba yawmin muḥīṭ
  trad: 'Et vers Madyan, leur frère Shuʿayb — il dit : « Ô mon peuple, adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Et ne diminuez pas (*lā tanquṣū*) la mesure (*al-mikyāl*) et la pesée (*al-mīzān*) — je vous vois certes dans un état favorable (*bi-khayrin*), et je crains pour vous le châtiment d''un jour qui enveloppe tout (*muḥīṭ*). »'
- ref: S.11:85
  ar: وَيَا قَوْمِ أَوْفُوا الْمِكْيَالَ وَالْمِيزَانَ بِالْقِسْطِ ۖ وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ
  trl: Wa-yā qawmi awfū l-mikyāla wa-l-mīzāna bi-l-qisṭi wa-lā tabkhasū n-nāsa ashyāʾahum wa-lā taʿthaw fi l-arḍi mufsidīn
  trad: Et ô mon peuple, donnez pleine mesure et pleine pesée avec l'équité (*bi-l-qisṭ*) — ne lésez pas les gens dans leurs biens (*lā tabkhasū*), et ne semez pas le désordre sur la terre en corrupteurs (*lā taʿthaw … mufsidīn*).
- ref: S.11:86
  ar: بَقِيَّتُ اللَّهِ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ مُؤْمِنِينَ ۚ وَمَا أَنَا عَلَيْكُمْ بِحَفِيظٍ
  trl: Baqiyyatu llāhi khayrun lakum in kuntum muʾminīn wa-mā anā ʿalaykum bi-ḥafīẕ
  trad: Ce qui vous reste dans les limites qu'Allaah approuve (*baqiyyatu llāh*) est meilleur pour vous, si vous êtes croyants — et je ne suis pas, sur vous, un gardien (*ḥafīẕ*).
- ref: S.11:87
  ar: قَالُوا يَا شُعَيْبُ أَصَلَاتُكَ تَأْمُرُكَ أَنْ نَتْرُكَ مَا يَعْبُدُ آبَاؤُنَا أَوْ أَنْ نَفْعَلَ فِي أَمْوَالِنَا مَا نَشَاءُ ۖ إِنَّكَ لَأَنْتَ الْحَلِيمُ الرَّشِيدُ
  trl: Qālū yā shuʿaybu a-ṣalātuka taʾmuruka an natruka mā yaʿbudu ābāʾunā aw an nafʿala fī amwālinā mā nashāʾu innaka la-anta l-ḥalīmu r-rashīd
  trad: 'Ils dirent : « Ô Shuʿayb, est-ce ta *ṣalāt* qui t''ordonne que nous quittions ce qu''adoraient nos pères, ou que nous cessions de faire, de nos biens, ce que nous voulons ? Tu es certes, toi, le *ḥalīm*, le *rashīd* ! »'
- ref: S.11:88
  ar: قَالَ يَا قَوْمِ أَرَأَيْتُمْ إِنْ كُنْتُ عَلَىٰ بَيِّنَةٍ مِنْ رَبِّي وَرَزَقَنِي مِنْهُ رِزْقًا حَسَنًا ۚ وَمَا أُرِيدُ أَنْ أُخَالِفَكُمْ إِلَىٰ مَا أَنْهَاكُمْ عَنْهُ ۚ إِنْ أُرِيدُ إِلَّا الْإِصْلَاحَ مَا اسْتَطَعْتُ ۚ وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ ۚ عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ
  trl: Qāla yā qawmi a-raʾaytum in kuntu ʿalā bayyinatin min rabbī wa-razaqanī minhu rizqan ḥasanan wa-mā urīdu an ukhālifakum ilā mā anhākum ʿanhu in urīdu illā l-iṣlāḥa mā staṭaʿtu wa-mā tawfīqī illā billāhi ʿalayhi tawakkaltu wa-ilayhi unību
  trad: 'Il dit : « Ô mon peuple, avez-vous considéré ceci : si je me tiens sur une preuve manifeste (*bayyina*) venant de mon Rabb, et qu''Il m''a attribué de Sa part une subsistance excellente… Je ne veux pas vous contredire pour aller vers ce dont je vous détourne (*mā anhākum ʿanhu*) — je ne veux que la réforme (*al-iṣlāḥ*), autant que je le puis. Et ma réussite (*tawfīqī*) ne tient qu''à Allaah — c''est en Lui que je place ma confiance (*tawakkaltu*), et c''est vers Lui que je fais retour (*unību*). »'
- ref: S.11:89
  ar: وَيَا قَوْمِ لَا يَجْرِمَنَّكُمْ شِقَاقِي أَنْ يُصِيبَكُمْ مِثْلُ مَا أَصَابَ قَوْمَ نُوحٍ أَوْ قَوْمَ هُودٍ أَوْ قَوْمَ صَالِحٍ ۚ وَمَا قَوْمُ لُوطٍ مِنْكُمْ بِبَعِيدٍ
  trl: Wa-yā qawmi lā yajrimannakum shiqāqī an yuṣībakum mithlu mā aṣāba qawma nūḥin aw qawma hūdin aw qawma ṣāliḥin wa-mā qawmu lūṭin minkum bi-baʿīd
  trad: Et ô mon peuple, que mon opposition (*shiqāqī*) ne vous entraîne pas (*lā yajrimannakum*) vers ce qui vous atteindrait comme atteignit le peuple de Nūḥ, ou le peuple de Hūd, ou le peuple de Ṣāliḥ — et le peuple de Lūṭ n'est pas loin de vous.
- ref: S.11:90
  ar: وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ ۚ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ
  trl: Wa-staghfirū rabbakum thumma tūbū ilayhi inna rabbī raḥīmun wadūd
  trad: Et demandez pardon (*istaghfirū*) à votre Rabb, puis revenez à Lui (*tūbū ilayhi*) — mon Rabb est certes Raḥīm, Wadūd.
- ref: S.11:91
  ar: قَالُوا يَا شُعَيْبُ مَا نَفْقَهُ كَثِيرًا مِمَّا تَقُولُ وَإِنَّا لَنَرَاكَ فِينَا ضَعِيفًا ۖ وَلَوْلَا رَهْطُكَ لَرَجَمْنَاكَ ۖ وَمَا أَنْتَ عَلَيْنَا بِعَزِيزٍ
  trl: Qālū yā shuʿaybu mā nafqahu kathīran mimmā taqūlu wa-innā la-narāka fīnā ḍaʿīfan wa-law-lā rahṭuka la-rajamnāka wa-mā anta ʿalaynā bi-ʿazīz
  trad: 'Ils dirent : « Ô Shuʿayb, nous ne comprenons pas (*mā nafqahu*) grand-chose de ce que tu dis, et nous te voyons certes faible parmi nous — et sans ton clan (*rahṭuka*), nous t''aurions certes lapidé (*la-rajamnāka*) — et tu n''as sur nous aucune puissance (*bi-ʿazīz*). »'
- ref: S.11:92
  ar: قَالَ يَا قَوْمِ أَرَهْطِي أَعَزُّ عَلَيْكُمْ مِنَ اللَّهِ وَاتَّخَذْتُمُوهُ وَرَاءَكُمْ ظِهْرِيًّا ۖ إِنَّ رَبِّي بِمَا تَعْمَلُونَ مُحِيطٌ
  trl: Qāla yā qawmi a-rahṭī aʿazzu ʿalaykum mina llāhi wa-ttakhadhtumūhu warāʾakum ẕihriyyan inna rabbī bimā taʿmalūna muḥīṭ
  trad: 'Il dit : « Ô mon peuple, mon clan est-il plus digne d''égard (*aʿazzu*) pour vous qu''Allaah, que vous avez pris et rejeté derrière vous (*warāʾakum ẕihriyyan*), comme s''Il ne comptait plus ? Mon Rabb, de ce que vous faites, cerne tout entièrement (*muḥīṭ*). »'
- ref: S.11:93
  ar: وَيَا قَوْمِ اعْمَلُوا عَلَىٰ مَكَانَتِكُمْ إِنِّي عَامِلٌ ۖ سَوْفَ تَعْلَمُونَ مَنْ يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَمَنْ هُوَ كَاذِبٌ ۖ وَارْتَقِبُوا إِنِّي مَعَكُمْ رَقِيبٌ
  trl: Wa-yā qawmi ʿmalū ʿalā makānatikum innī ʿāmilun sawfa taʿlamūna man yaʾtīhi ʿadhābun yukhzīhi wa-man huwa kādhibun wa-rtaqibū innī maʿakum raqīb
  trad: Et ô mon peuple, agissez selon votre position (*makānatikum*) — moi, j'agis. Vous saurez bientôt qui sera atteint par un châtiment qui l'humiliera (*yukhzīhi*), et qui est menteur — et surveillez (*irtaqibū*) — moi, avec vous, je surveille (*raqīb*). »
- ref: S.11:94
  ar: وَلَمَّا جَاءَ أَمْرُنَا نَجَّيْنَا شُعَيْبًا وَالَّذِينَ آمَنُوا مَعَهُ بِرَحْمَةٍ مِنَّا وَأَخَذَتِ الَّذِينَ ظَلَمُوا الصَّيْحَةُ فَأَصْبَحُوا فِي دِيَارِهِمْ جَاثِمِينَ
  trl: Wa-lammā jāʾa amrunā najjaynā shuʿayban wa-lladhīna āmanū maʿahu bi-raḥmatin minnā wa-akhadhati lladhīna ẕalamū ṣ-ṣayḥatu fa-aṣbaḥū fī diyārihim jāthimīn
  trad: 'Et quand Notre ordre (*amrunā*) vint, Nous sauvâmes Shuʿayb et ceux qui avaient cru avec lui, par une *raḥma* venant de Nous — et le Cri (*aṣ-ṣayḥa*) saisit ceux qui avaient commis l''injustice (*ẕalamū*) : ils se retrouvèrent, dans leurs demeures, gisant à terre, immobiles (*jāthimīn*).'
- ref: S.11:95
  ar: كَأَنْ لَمْ يَغْنَوْا فِيهَا ۗ أَلَا بُعْدًا لِمَدْيَنَ كَمَا بَعِدَتْ ثَمُودُ
  trl: Ka-an lam yaghnaw fīhā alā buʿdan li-madyana kamā baʿidat thamūd
  trad: Comme s'ils n'y avaient jamais demeuré (*lam yaghnaw fīhā*). N'est-ce pas ? Éloignement (*buʿdan*) pour Madyan, comme s'éloigna (*baʿidat*) Thamūd !
- ref: S.11:96–97
  ar: وَلَقَدْ أَرْسَلْنَا مُوسَىٰ بِآيَاتِنَا وَسُلْطَانٍ مُبِينٍ إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ فَاتَّبَعُوا أَمْرَ فِرْعَوْنَ ۖ وَمَا أَمْرُ فِرْعَوْنَ بِرَشِيدٍ
  trl: Wa-la-qad arsalnā mūsā bi-āyātinā wa-sulṭānin mubīnin ilā firʿawna wa-malaʾihi fa-ttabaʿū amra firʿawna wa-mā amru firʿawna bi-rashīd
  trad: Et Nous avons certes envoyé Mūsā, avec Nos *āyāt* et une autorité manifeste (*sulṭānin mubīn*), vers Firʿawn et son assemblée (*malaʾ*) — mais ils suivirent l'ordre de Firʿawn, et l'ordre de Firʿawn n'était pas *rashīd*.
- ref: S.11:98
  ar: يَقْدُمُ قَوْمَهُ يَوْمَ الْقِيَامَةِ فَأَوْرَدَهُمُ النَّارَ ۖ وَبِئْسَ الْوِرْدُ الْمَوْرُودُ
  trl: Yaqdumu qawmahu yawma l-qiyāmati fa-awradahumu n-nāra wa-biʾsa l-wirdu l-mawrūd
  trad: Il précédera (*yaqdumu*) son peuple au Jour de la Résurrection, et les mènera au point d'accès du Feu (*fa-awradahumu n-nāra*) — et quel détestable point d'accès (*wird*) que celui qu'on atteint là (*al-mawrūd*) !
- ref: S.11:99
  ar: وَأُتْبِعُوا فِي هَٰذِهِ لَعْنَةً وَيَوْمَ الْقِيَامَةِ ۚ بِئْسَ الرِّفْدُ الْمَرْفُودُ
  trl: Wa-utbiʿū fī hādhihi laʿnatan wa-yawma l-qiyāmati biʾsa r-rifdu l-marfūd
  trad: Et ils furent poursuivis (*utbiʿū*), dans ce monde, d'une malédiction (*laʿna*), et au Jour de la Résurrection — quel détestable soutien (*rifd*) que celui qu'on leur apporte (*al-marfūd*) !
- ref: S.11:100
  ar: ذَٰلِكَ مِنْ أَنْبَاءِ الْقُرَىٰ نَقُصُّهُ عَلَيْكَ ۖ مِنْهَا قَائِمٌ وَحَصِيدٌ
  trl: Dhālika min anbāʾi l-qurā naquṣṣuhu ʿalayka minhā qāʾimun wa-ḥaṣīd
  trad: Voilà, parmi les annonces des cités (*min anbāʾi l-qurā*), ce que Nous te racontons (*naquṣṣuhu*) — certaines d'entre elles sont encore debout (*qāʾim*), d'autres moissonnées (*ḥaṣīd*).
- ref: S.11:101
  ar: وَمَا ظَلَمْنَاهُمْ وَلَٰكِنْ ظَلَمُوا أَنْفُسَهُمْ ۖ فَمَا أَغْنَتْ عَنْهُمْ آلِهَتُهُمُ الَّتِي يَدْعُونَ مِنْ دُونِ اللَّهِ مِنْ شَيْءٍ لَمَّا جَاءَ أَمْرُ رَبِّكَ ۖ وَمَا زَادُوهُمْ غَيْرَ تَتْبِيبٍ
  trl: Wa-mā ẕalamnāhum wa-lākin ẕalamū anfusahum fa-mā aghnat ʿanhum ālihatuhumu llatī yadʿūna min dūni llāhi min shayʾin lammā jāʾa amru rabbika wa-mā zādūhum ghayra tatbīb
  trad: Et Nous ne les avons pas lésés (*mā ẕalamnāhum*) — mais ils se sont lésés eux-mêmes (*ẕalamū anfusahum*) — leurs *ālihatuhum* (ceux qu'ils prenaient pour *ilāh*), qu'ils invoquaient en dehors d'Allaah, ne leur ont servi de rien, lorsque l'ordre de ton Rabb est venu — ils n'ont fait qu'accroître leur ruine (*ghayra tatbīb*).
- ref: S.11:102
  ar: وَكَذَٰلِكَ أَخْذُ رَبِّكَ إِذَا أَخَذَ الْقُرَىٰ وَهِيَ ظَالِمَةٌ ۚ إِنَّ أَخْذَهُ أَلِيمٌ شَدِيدٌ
  trl: Wa-ka-dhālika akhdhu rabbika idhā akhadha l-qurā wa-hiya ẕālimatun inna akhdhahu alīmun shadīd
  trad: Et telle est la saisie (*akhdhu*) de ton Rabb, quand Il saisit les cités alors qu'elles sont injustes (*ẕālima*) — Sa saisie est certes douloureuse, sévère.
- ref: S.11:103
  ar: إِنَّ فِي ذَٰلِكَ لَآيَةً لِمَنْ خَافَ عَذَابَ الْآخِرَةِ ۚ ذَٰلِكَ يَوْمٌ مَجْمُوعٌ لَهُ النَّاسُ وَذَٰلِكَ يَوْمٌ مَشْهُودٌ
  trl: Inna fī dhālika la-āyatan li-man khāfa ʿadhāba l-ākhirati dhālika yawmun majmūʿun lahu n-nāsu wa-dhālika yawmun mashhūd
  trad: En cela, il y a certes un signe pour qui craint le châtiment de l'Ākhira — ce jour-là est un jour où les hommes seront rassemblés (*majmūʿun lahu n-nās*), et ce jour-là est un jour attesté (*mashhūd*).
- ref: S.11:104
  ar: وَمَا نُؤَخِّرُهُ إِلَّا لِأَجَلٍ مَعْدُودٍ
  trl: Wa-mā nuʾakhkhiruhu illā li-ajalin maʿdūd
  trad: Et Nous ne le différons (*nuʾakhkhiruhu*) que pour un terme compté (*li-ajalin maʿdūd*).
- ref: S.11:105
  ar: يَوْمَ يَأْتِ لَا تَكَلَّمُ نَفْسٌ إِلَّا بِإِذْنِهِ ۚ فَمِنْهُمْ شَقِيٌّ وَسَعِيدٌ
  trl: Yawma yaʾti lā takallamu nafsun illā bi-idhnihi fa-minhum shaqiyyun wa-saʿīd
  trad: Le jour où il viendra, aucun *nafs* ne parlera sans Son *idhn* (permission) — il y aura, parmi eux, le malheureux (*shaqiyy*) et l'heureux (*saʿīd*).
- ref: S.11:106
  ar: فَأَمَّا الَّذِينَ شَقُوا فَفِي النَّارِ لَهُمْ فِيهَا زَفِيرٌ وَشَهِيقٌ
  trl: Fa-ammā lladhīna shaqū fa-fi n-nāri lahum fīhā zafīrun wa-shahīq
  trad: Quant à ceux qui furent malheureux (*shaqū*), ils seront dans le Feu — ils y auront gémissement profond (*zafīr*) et halètement (*shahīq*).
- ref: S.11:107
  ar: خَالِدِينَ فِيهَا مَا دَامَتِ السَّمَاوَاتُ وَالْأَرْضُ إِلَّا مَا شَاءَ رَبُّكَ ۚ إِنَّ رَبَّكَ فَعَّالٌ لِمَا يُرِيدُ
  trl: Khālidīna fīhā mā dāmati s-samāwātu wa-l-arḍu illā mā shāʾa rabbuka inna rabbaka faʿʿālun li-mā yurīd
  trad: …y demeurant (*khālidīna*), tant que dureront (*mā dāmat*) les cieux et la terre — sauf ce que ton Rabb voudra (*illā mā shāʾa rabbuka*). Ton Rabb, assurément, accomplit pleinement (*faʿʿālun*) ce qu'Il veut.
- ref: S.11:108
  ar: ۞ وَأَمَّا الَّذِينَ سُعِدُوا فَفِي الْجَنَّةِ خَالِدِينَ فِيهَا مَا دَامَتِ السَّمَاوَاتُ وَالْأَرْضُ إِلَّا مَا شَاءَ رَبُّكَ ۖ عَطَاءً غَيْرَ مَجْذُوذٍ
  trl: Wa-ammā lladhīna suʿidū fa-fi l-jannati khālidīna fīhā mā dāmati s-samāwātu wa-l-arḍu illā mā shāʾa rabbuka ʿaṭāʾan ghayra majdhūdh
  trad: Quant à ceux qui furent heureux (*suʿidū*), ils seront dans la Janna, y demeurant tant que dureront les cieux et la terre — sauf ce que ton Rabb voudra — un don ininterrompu (*ʿaṭāʾan ghayra majdhūdh*).
- ref: S.11:109
  ar: فَلَا تَكُ فِي مِرْيَةٍ مِمَّا يَعْبُدُ هَٰؤُلَاءِ ۚ مَا يَعْبُدُونَ إِلَّا كَمَا يَعْبُدُ آبَاؤُهُمْ مِنْ قَبْلُ ۚ وَإِنَّا لَمُوَفُّوهُمْ نَصِيبَهُمْ غَيْرَ مَنْقُوصٍ
  trl: Fa-lā taku fī miryatin mimmā yaʿbudu hāʾulāʾi mā yaʿbudūna illā kamā yaʿbudu ābāʾuhum min qablu wa-innā la-muwaffūhum naṣībahum ghayra manqūṣ
  trad: Ne sois donc pas dans le doute (*mirya*) au sujet de ce que ceux-là adorent — ils n'adorent que comme adoraient leurs pères auparavant — et Nous leur donnerons certes intégralement (*la-muwaffūhum*) leur part (*naṣīb*), sans qu'elle soit diminuée (*ghayra manqūṣ*).
- ref: S.11:110
  ar: وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ فَاخْتُلِفَ فِيهِ ۚ وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِنْ رَبِّكَ لَقُضِيَ بَيْنَهُمْ ۚ وَإِنَّهُمْ لَفِي شَكٍّ مِنْهُ مُرِيبٍ
  trl: Wa-la-qad ātaynā mūsā l-kitāba fa-khtulifa fīhi wa-lawlā kalimatun sabaqat min rabbika la-quḍiya baynahum wa-innahum la-fī shakkin minhu murīb
  trad: Et Nous avons certes donné à Mūsā le Kitāb — puis on fut en désaccord (*fa-khtulifa*) à son sujet — et sans une parole (*kalima*) déjà arrêtée de ton Rabb, il aurait déjà été tranché entre eux — et ils sont certes, à son propos, dans un doute profond qui inquiète (*shakkin murīb*).
- ref: S.11:111
  ar: وَإِنَّ كُلًّا لَمَّا لَيُوَفِّيَنَّهُمْ رَبُّكَ أَعْمَالَهُمْ ۚ إِنَّهُ بِمَا يَعْمَلُونَ خَبِيرٌ
  trl: Wa-inna kullan lammā la-yuwaffiyannahum rabbuka aʿmālahum innahu bimā yaʿmalūna khabīr
  trad: Et chacun d'eux, ton Rabb leur versera certainement et pleinement (*la-yuwaffiyannahum*) [le fruit de] leurs actes — Il est, de ce qu'ils font, parfaitement informé (*khabīr*).
- ref: S.11:112
  ar: فَاسْتَقِمْ كَمَا أُمِرْتَ وَمَنْ تَابَ مَعَكَ وَلَا تَطْغَوْا ۚ إِنَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
  trl: Fa-staqim kamā umirta wa-man tāba maʿaka wa-lā taṭghaw innahu bimā taʿmalūna baṣīr
  trad: Tiens-toi donc fermement droit (*fa-staqim*), comme il t'a été ordonné, ainsi que ceux qui sont revenus (*tāba*) avec toi — et ne dépassez pas les limites (*lā taṭghaw*) — Il est, de ce que vous faites, parfaitement voyant (*baṣīr*).
- ref: S.11:113
  ar: وَلَا تَرْكَنُوا إِلَى الَّذِينَ ظَلَمُوا فَتَمَسَّكُمُ النَّارُ وَمَا لَكُمْ مِنْ دُونِ اللَّهِ مِنْ أَوْلِيَاءَ ثُمَّ لَا تُنْصَرُونَ
  trl: Wa-lā tarkanū ilā lladhīna ẓalamū fa-tamassakumu n-nāru wa-mā lakum min dūni llāhi min awliyāʾa thumma lā tunṣarūn
  trad: Et ne vous appuyez pas (*lā tarkanū*) sur ceux qui ont commis l'injustice (*ẓalamū*), sinon le Feu vous toucherait (*fa-tamassakumu n-nāru*) — vous n'avez, en dehors d'Allaah, aucun *walī* — vous ne seriez alors plus secourus (*lā tunṣarūn*).
- ref: S.11:114
  ar: وَأَقِمِ الصَّلَاةَ طَرَفَيِ النَّهَارِ وَزُلَفًا مِنَ اللَّيْلِ ۚ إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ ۚ ذَٰلِكَ ذِكْرَىٰ لِلذَّاكِرِينَ
  trl: Wa-aqimi ṣ-ṣalāta ṭarafayi n-nahāri wa-zulafan mina l-layli inna l-ḥasanāti yudhhibna s-sayyiʾāti dhālika dhikrā li-dh-dhākirīn
  trad: Et établis la *ṣalāt* aux deux extrémités du jour (*ṭarafayi n-nahār*) et à des heures rapprochées de la nuit (*zulafan mina l-layl*) — les bonnes actions (*al-ḥasanāt*), certes, font s'en aller (*yudhhibna*) les mauvaises actions (*as-sayyiʾāt*) — voilà un rappel (*dhikrā*) pour ceux qui se rappellent (*li-dh-dhākirīn*).
- ref: S.11:115
  ar: وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ
  trl: Wa-ṣbir fa-inna llāha lā yuḍīʿu ajra l-muḥsinīn
  trad: Et patiente (*iṣbir*) — Allaah, certes, ne perd pas (*lā yuḍīʿu*) la rétribution (*ajr*) de ceux qui agissent avec excellence (*al-muḥsinīn*).
- ref: S.11:116
  ar: فَلَوْلَا كَانَ مِنَ الْقُرُونِ مِنْ قَبْلِكُمْ أُولُو بَقِيَّةٍ يَنْهَوْنَ عَنِ الْفَسَادِ فِي الْأَرْضِ إِلَّا قَلِيلًا مِمَّنْ أَنْجَيْنَا مِنْهُمْ ۗ وَاتَّبَعَ الَّذِينَ ظَلَمُوا مَا أُتْرِفُوا فِيهِ وَكَانُوا مُجْرِمِينَ
  trl: Fa-lawlā kāna mina l-qurūni min qablikum ulū baqiyyatin yanhawna ʿani l-fasādi fi l-arḍi illā qalīlan mimman anjaynā minhum wa-ttabaʿa lladhīna ẓalamū mā utrifū fīhi wa-kānū mujrimīn
  trad: Pourquoi n'y eut-il pas, parmi les générations d'avant vous, des possesseurs d'un reste [de discernement] (*ulū baqiyyatin*) interdisant la corruption (*al-fasād*) sur la terre — hormis un petit nombre parmi ceux que Nous avons sauvés ? Et ceux qui ont commis l'injustice ont suivi ce qui leur avait été donné en confort (*mā utrifū fīhi*), et ils étaient des *mujrimūn*.
- ref: S.11:117
  ar: وَمَا كَانَ رَبُّكَ لِيُهْلِكَ الْقُرَىٰ بِظُلْمٍ وَأَهْلُهَا مُصْلِحُونَ
  trl: Wa-mā kāna rabbuka li-yuhlika l-qurā bi-ẓulmin wa-ahluhā muṣliḥūn
  trad: Et ton Rabb n'est pas de nature à anéantir (*li-yuhlika*) les cités par injustice (*bi-ẓulm*), tant que leurs habitants restent des correcteurs (*muṣliḥūn*).
- ref: S.11:118
  ar: وَلَوْ شَاءَ رَبُّكَ لَجَعَلَ النَّاسَ أُمَّةً وَاحِدَةً ۖ وَلَا يَزَالُونَ مُخْتَلِفِينَ
  trl: Wa-law shāʾa rabbuka la-jaʿala n-nāsa ummatan wāḥidatan wa-lā yazālūna mukhtalifīn
  trad: Et si ton Rabb l'avait voulu, Il aurait fait de l'humanité une seule *umma* — mais elle ne cesse d'être en désaccord (*mukhtalifīn*),
- ref: S.11:119
  ar: إِلَّا مَنْ رَحِمَ رَبُّكَ ۚ وَلِذَٰلِكَ خَلَقَهُمْ ۗ وَتَمَّتْ كَلِمَةُ رَبِّكَ لَأَمْلَأَنَّ جَهَنَّمَ مِنَ الْجِنَّةِ وَالنَّاسِ أَجْمَعِينَ
  trl: Illā man raḥima rabbuka wa-li-dhālika khalaqahum wa-tammat kalimatu rabbika la-amlaʾanna jahannama mina l-jinnati wa-n-nāsi ajmaʿīn
  trad: 'sauf celui à qui ton Rabb a accordé la *raḥma* — et c''est pour cela [voir le callout ci-dessus sur les deux lectures possibles] qu''Il les a créés — et la parole de ton Rabb s''est accomplie : « J''emplirai certes *Jahannam* de *jinn* et d''humains, tous ensemble. »'
- ref: S.11:120
  ar: وَكُلًّا نَقُصُّ عَلَيْكَ مِنْ أَنْبَاءِ الرُّسُلِ مَا نُثَبِّتُ بِهِ فُؤَادَكَ ۚ وَجَاءَكَ فِي هَٰذِهِ الْحَقُّ وَمَوْعِظَةٌ وَذِكْرَىٰ لِلْمُؤْمِنِينَ
  trl: Wa-kullan naquṣṣu ʿalayka min anbāʾi r-rusuli mā nuthabbitu bihi fuʾādaka wa-jāʾaka fī hādhihi l-ḥaqqu wa-mawʿiẓatun wa-dhikrā li-l-muʾminīn
  trad: Et de chacun [de ces récits], Nous te racontons, parmi les annonces des *rusul* (*anbāʾ ar-rusul*), ce par quoi Nous affermissons ton cœur (*nuthabbitu bihi fuʾādaka*) — et t'est venu, dans ceci, le *ḥaqq*, une exhortation (*mawʿiẓa*) et un rappel (*dhikrā*) pour les croyants.
- ref: S.11:121
  ar: وَقُلْ لِلَّذِينَ لَا يُؤْمِنُونَ اعْمَلُوا عَلَىٰ مَكَانَتِكُمْ إِنَّا عَامِلُونَ
  trl: Wa-qul li-lladhīna lā yuʾminūna ʿmalū ʿalā makānatikum innā ʿāmilūn
  trad: 'Et dis à ceux qui ne croient pas : « Agissez selon votre position (*ʿalā makānatikum*) — nous, nous agissons. »'
- ref: S.11:122
  ar: وَانْتَظِرُوا إِنَّا مُنْتَظِرُونَ
  trl: Wa-ntaẓirū innā muntaẓirūn
  trad: « Et attendez (*intaẓirū*) — nous aussi, nous attendons. »
- ref: S.11:123
  ar: وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ وَإِلَيْهِ يُرْجَعُ الْأَمْرُ كُلُّهُ فَاعْبُدْهُ وَتَوَكَّلْ عَلَيْهِ ۚ وَمَا رَبُّكَ بِغَافِلٍ عَمَّا تَعْمَلُونَ
  trl: Wa-li-llāhi ghaybu s-samāwāti wa-l-arḍi wa-ilayhi yurjaʿu l-amru kulluhu fa-ʿbudhu wa-tawakkal ʿalayhi wa-mā rabbuka bi-ghāfilin ʿammā taʿmalūn
  trad: Et à Allaah appartient le *ghayb* des cieux et de la terre — et c'est vers Lui que retourne l'affaire tout entière (*yurjaʿu l-amru kulluhu*) — sers-Le donc, et place en Lui ta confiance (*tawakkal*) — et ton Rabb n'est pas insouciant (*ghāfil*) de ce que vous faites.
