- ref: 'S.31:1-2'
  ar: 'الم ۝ تِلْكَ آيَاتُ الْكِتَابِ الْحَكِيمِ'
  trl: 'Alif-Lām-Mīm — Tilka āyātu l-Kitābi l-Ḥakīm'
  trad: 'Alif. Lām. Mīm. — Voici (tilka) les āyāt du Kitāb al-Ḥakīm.'
- ref: 'S.31:3-5'
  ar: 'هُدًى وَرَحْمَةً لِلْمُحْسِنِينَ ۝ الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ بِالْآخِرَةِ هُمْ يُوقِنُونَ ۝ أُولَٰئِكَ عَلَىٰ هُدًى مِنْ رَبِّهِمْ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ'
  trl: 'Hudan wa-raḥmatan li-l-muḥsinīn — Alladhīna yuqīmūna ṣ-ṣalāta wa-yuʾtūna z-zakāta wa-hum bi-l-ākhirati hum yūqinūn — Ulāʾika ʿalā hudan min rabbihim wa-ulāʾika humu l-mufliḥūn'
  trad: 'une guidance (hudā) et une raḥma pour les muḥsinūn [ceux qui agissent avec iḥsān] — ceux qui accomplissent (yuqīmūn) la ṣalāt, donnent la zakāt, et qui, de l''Ākhira, ont la certitude absolue (yūqinūn) — ceux-là sont sur une guidance venant de leur Rabb, et ceux-là sont les mufliḥūn [ceux qui connaissent la pleine réussite].'
- ref: 'S.31:6'
  ar: 'وَمِنَ النَّاسِ مَنْ يَشْتَرِي لَهْوَ الْحَدِيثِ لِيُضِلَّ عَنْ سَبِيلِ اللَّهِ بِغَيْرِ عِلْمٍ وَيَتَّخِذَهَا هُزُوًا ۚ أُولَٰئِكَ لَهُمْ عَذَابٌ مُهِينٌ'
  trl: 'Wa-mina n-nāsi man yashtarī lahwa l-ḥadīthi li-yuḑilla ʿan sabīli llāhi bi-ghayri ʿilmin wa-yattakhidhahā huzuwan ulāʾika lahum ʿadhābun muhīn'
  trad: 'Et parmi les gens, il en est qui achètent (yashtarī) le discours de pur divertissement (lahwa l-ḥadīth), pour égarer, sans aucun ʿilm, du chemin d''Allaah, et pour le prendre en dérision (huzuwan) — ceux-là ont un châtiment humiliant (muhīn).'
- ref: 'S.31:7'
  ar: 'وَإِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا وَلَّىٰ مُسْتَكْبِرًا كَأَنْ لَمْ يَسْمَعْهَا كَأَنَّ فِي أُذُنَيْهِ وَقْرًا ۖ فَبَشِّرْهُ بِعَذَابٍ أَلِيمٍ'
  trl: 'Wa-idhā tutlā ʿalayhi āyātunā wallā mustakbiran ka-an lam yasmaʿhā ka-anna fī udhunayhi waqran fa-bashshirhu bi-ʿadhābin alīm'
  trad: 'Et quand Nos āyāt lui sont récitées (tutlā), il se détourne (wallā) avec orgueil (mustakbiran), comme s''il ne les avait pas entendues, comme s''il y avait, dans ses deux oreilles, un alourdissement (waqran) — annonce-lui donc (fa-bashshirhu) un châtiment douloureux (alīm).'
- ref: 'S.31:8-9'
  ar: 'إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتُ النَّعِيمِ ۝ خَالِدِينَ فِيهَا ۖ وَعْدَ اللَّهِ حَقًّا ۚ وَهُوَ الْعَزِيزُ الْحَكِيمُ'
  trl: 'Inna lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti lahum jannātu n-naʿīm — Khālidīna fīhā waʿda llāhi ḥaqqan wa-huwa l-ʿazīzu l-ḥakīm'
  trad: 'Ceux qui ont cru et accompli les œuvres droites (aṣ-ṣāliḥāt) — à eux les jardins (jannāt) du naʿīm [le bien-être sans aucun manque] — ils y demeureront (khālidīn) — c''est la promesse (waʿd) d''Allaah, en toute vérité (ḥaqqan) — et Il est al-ʿAzīz, al-Ḥakīm.'
- ref: 'S.31:10'
  ar: 'خَلَقَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا ۖ وَأَلْقَىٰ فِي الْأَرْضِ رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِنْ كُلِّ دَابَّةٍ ۚ وَأَنْزَلْنَا مِنَ السَّمَاءِ مَاءً فَأَنْبَتْنَا فِيهَا مِنْ كُلِّ زَوْجٍ كَرِيمٍ'
  trl: 'Khalaqa s-samāwāti bi-ghayri ʿamadin tarawnahā wa-alqā fi l-arḑi rawāsiya an tamīda bikum wa-baththa fīhā min kulli dābbatin wa-anzalnā mina s-samāʾi māʾan fa-anbatnā fīhā min kulli zawjin karīm'
  trad: 'Il a créé les cieux sans piliers (ʿamad) que vous puissiez voir, et Il a placé (alqā) sur la terre des montagnes ancrées (rawāsiya), afin qu''elle ne vacille pas avec vous (an tamīda bikum), et Il y a répandu (baththa) toute créature en mouvement (dābba) — et Nous avons fait descendre, du ciel, une eau, et Nous y avons fait pousser (anbatnā) toute espèce noble (zawj karīm).'
- ref: 'S.31:11'
  ar: 'هَٰذَا خَلْقُ اللَّهِ فَأَرُونِي مَاذَا خَلَقَ الَّذِينَ مِنْ دُونِهِ ۚ بَلِ الظَّالِمُونَ فِي ضَلَالٍ مُبِينٍ'
  trl: 'Hādhā khalqu llāhi fa-arūnī mādhā khalaqa lladhīna min dūnihi bali ẕ-ẕālimūna fī ḑalālin mubīn'
  trad: 'Voici (hādhā) la création d''Allaah — montrez-moi donc ce qu''ont créé ceux [qu''ils invoquent] en dehors de Lui (min dūnihi) ! Non — les ẕālimūn sont dans un égarement (ḑalāl) manifeste (mubīn).'
- ref: 'S.31:12'
  ar: 'وَلَقَدْ آتَيْنَا لُقْمَانَ الْحِكْمَةَ أَنِ اشْكُرْ لِلَّهِ ۚ وَمَنْ يَشْكُرْ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ ۖ وَمَنْ كَفَرَ فَإِنَّ اللَّهَ غَنِيٌّ حَمِيدٌ'
  trl: 'Wa-la-qad ātaynā luqmāna l-ḥikmata ani shkur li-llāhi wa-man yashkur fa-innamā yashkuru li-nafsihi wa-man kafara fa-inna llāha ghaniyyun ḥamīd'
  trad: 'Et Nous avons certes donné à Luqmān la ḥikma — [lui disant] : « Sois reconnaissant (ushkur) envers Allaah. » Et quiconque est reconnaissant (yashkur) ne l''est que pour lui-même (li-nafsihi) ; et quiconque rejette [cette reconnaissance] (kafara) — alors Allaah est Ghaniyy, Ḥamīd.'
- ref: 'S.31:13'
  ar: 'وَإِذْ قَالَ لُقْمَانُ لِابْنِهِ وَهُوَ يَعِظُهُ يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ ۖ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ'
  trl: 'Wa-idh qāla luqmānu li-bnihi wa-huwa yaʿiẕuhu yā bunayya lā tushrik bi-llāhi inna sh-shirka la-ẕulmun ʿaẕīm'
  trad: 'Et [rappelle] quand Luqmān dit à son fils, en l''exhortant (yaʿiẕuhu) : « Ô mon petit fils (yā bunayya), ne commets pas le shirk envers Allaah — le shirk est certes une injustice (ẕulm) immense (ʿaẕīm). »'
- ref: 'S.31:14'
  ar: 'وَوَصَّيْنَا الْإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَىٰ وَهْنٍ وَفِصَالُهُ فِي عَامَيْنِ أَنِ اشْكُرْ لِي وَلِوَالِدَيْكَ إِلَيَّ الْمَصِيرُ'
  trl: 'Wa-waṣṣaynā l-insāna bi-wālidayhi ḥamalathu ummuhu wahnan ʿalā wahnin wa-fiṣāluhu fī ʿāmayni ani shkur lī wa-li-wālidayka ilayya l-maṣīr'
  trad: 'Et Nous avons enjoint (waṣṣaynā) à l''humain, envers ses deux parents (wālidayhi) — sa mère l''a porté (ḥamalathu) dans une faiblesse (wahn) sur une faiblesse, et son sevrage (fiṣāl) a lieu en deux années — « Sois reconnaissant envers Moi et envers tes deux parents ; c''est vers Moi qu''est la destination finale (al-maṣīr). »'
- ref: 'S.31:15'
  ar: 'وَإِنْ جَاهَدَاكَ عَلَىٰ أَنْ تُشْرِكَ بِي مَا لَيْسَ لَكَ بِهِ عِلْمٌ فَلَا تُطِعْهُمَا ۖ وَصَاحِبْهُمَا فِي الدُّنْيَا مَعْرُوفًا ۖ وَاتَّبِعْ سَبِيلَ مَنْ أَنَابَ إِلَيَّ ۚ ثُمَّ إِلَيَّ مَرْجِعُكُمْ فَأُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ'
  trl: 'Wa-in jāhadāka ʿalā an tushrika bī mā laysa laka bihi ʿilmun fa-lā tuṭiʿhumā wa-ṣāḥibhumā fi d-dunyā maʿrūfan wa-ttabiʿ sabīla man anāba ilayya thumma ilayya marjiʿukum fa-unabbiʾukum bi-mā kuntum taʿmalūn'
  trad: 'Et s''ils s''évertuent contre toi (jāhadāka) pour que tu M''associes (tushrika bī) ce dont tu n''as aucun ʿilm — ne leur obéis pas, mais accompagne-les (ṣāḥibhumā), dans la vie d''ici-bas, de façon convenable (maʿrūfan), et suis le chemin de celui qui s''est tourné vers Moi (anāba ilayya) — puis c''est vers Moi qu''est votre retour (marjiʿukum), et Je vous informerai alors de ce que vous faisiez.'
- ref: 'S.31:16'
  ar: 'يَا بُنَيَّ إِنَّهَا إِنْ تَكُ مِثْقَالَ حَبَّةٍ مِنْ خَرْدَلٍ فَتَكُنْ فِي صَخْرَةٍ أَوْ فِي السَّمَاوَاتِ أَوْ فِي الْأَرْضِ يَأْتِ بِهَا اللَّهُ ۚ إِنَّ اللَّهَ لَطِيفٌ خَبِيرٌ'
  trl: 'Yā bunayya innahā in taku mithqāla ḥabbatin min khardalin fa-takun fī ṣakhratin aw fi s-samāwāti aw fi l-arḑi yaʾti bihā llāhu inna llāha laṭīfun khabīr'
  trad: 'Ô mon petit fils, si elle [l''action] est du poids d''un grain de moutarde (mithqāla ḥabbatin min khardal), qu''elle se trouve dans un rocher (ṣakhra), ou dans les cieux, ou dans la terre — Allaah l''apportera (yaʾti bihā). Allaah est certes Laṭīf, Khabīr.'
- ref: 'S.31:17'
  ar: 'يَا بُنَيَّ أَقِمِ الصَّلَاةَ وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنْكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ ۖ إِنَّ ذَٰلِكَ مِنْ عَزْمِ الْأُمُورِ'
  trl: 'Yā bunayya aqimi ṣ-ṣalāta wa-mur bi-l-maʿrūfi wa-nha ʿani l-munkari wa-ṣbir ʿalā mā aṣābaka inna dhālika min ʿazmi l-umūr'
  trad: 'Ô mon petit fils, accomplis la ṣalāt, ordonne le maʿrūf [ce qui est reconnu convenable], interdis le munkar [ce qui est reconnu blâmable], et endure (iṣbir) ce qui t''atteint — cela fait certes partie de ce qui requiert une détermination ferme (ʿazm al-umūr).'
- ref: 'S.31:18-19'
  ar: 'وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ۖ إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ ۝ وَاقْصِدْ فِي مَشْيِكَ وَاغْضُضْ مِنْ صَوْتِكَ ۚ إِنَّ أَنْكَرَ الْأَصْوَاتِ لَصَوْتُ الْحَمِيرِ'
  trl: 'Wa-lā tuṣaʿʿir khaddaka li-n-nāsi wa-lā tamshi fi l-arḑi maraḥan inna llāha lā yuḥibbu kulla mukhtālin fakhūr — Wa-qṣid fī mashyika wa-ghḑuḑ min ṣawtika inna ankara l-aṣwāti la-ṣawtu l-ḥamīr'
  trad: 'Et ne détourne pas (lā tuṣaʿʿir) ta joue (khadd) des gens [par mépris], et ne marche pas sur la terre avec insolence (maraḥan) — Allaah n''honore pas (lā yuḥibbu) tout [être] plein de vanité (mukhtāl), prétentieux (fakhūr) — et sois mesuré (iqṣid) dans ta marche, et baisse (ughḑuḑ) ta voix — la plus détestable (ankar) des voix est certes la voix des ânes (al-ḥamīr).'
- ref: 'S.31:20'
  ar: 'أَلَمْ تَرَوْا أَنَّ اللَّهَ سَخَّرَ لَكُمْ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَأَسْبَغَ عَلَيْكُمْ نِعَمَهُ ظَاهِرَةً وَبَاطِنَةً ۗ وَمِنَ النَّاسِ مَنْ يُجَادِلُ فِي اللَّهِ بِغَيْرِ عِلْمٍ وَلَا هُدًى وَلَا كِتَابٍ مُنِيرٍ'
  trl: 'A-lam tarawu anna llāha sakhkhara lakum mā fi s-samāwāti wa-mā fi l-arḑi wa-asbagha ʿalaykum niʿamahu ẕāhiratan wa-bāṭinatan wa-mina n-nāsi man yujādilu fī llāhi bi-ghayri ʿilmin wa-lā hudan wa-lā kitābin munīr'
  trad: 'Ne voyez-vous pas qu''Allaah vous a assujetti (sakhkhara) ce qui est dans les cieux et ce qui est sur la terre, et qu''Il a répandu (asbagha) sur vous Ses bienfaits (niʿam), apparents (ẕāhira) et cachés (bāṭina) ? Et parmi les gens, il en est qui disputent (yujādilu) au sujet d''Allaah sans ʿilm, sans hudā, et sans Kitāb éclairant (munīr).'
- ref: 'S.31:21'
  ar: 'وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنْزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا وَجَدْنَا عَلَيْهِ آبَاءَنَا ۚ أَوَلَوْ كَانَ الشَّيْطَانُ يَدْعُوهُمْ إِلَىٰ عَذَابِ السَّعِيرِ'
  trl: 'Wa-idhā qīla lahumu ttabiʿū mā anzala llāhu qālū bal nattabiʿu mā wajadnā ʿalayhi ābāʾanā a-wa-law kāna sh-shayṭānu yadʿūhum ilā ʿadhābi s-saʿīr'
  trad: 'Et quand il leur est dit : « Suivez ce qu''Allaah a fait descendre » — ils disent : « Non, nous suivons ce sur quoi nous avons trouvé (wajadnā) nos pères. » Est-ce donc même si le shayṭān les appelait vers le châtiment du saʿīr [le brasier] ?'
- ref: 'S.31:22'
  ar: '۞ وَمَنْ يُسْلِمْ وَجْهَهُ إِلَى اللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ ۗ وَإِلَى اللَّهِ عَاقِبَةُ الْأُمُورِ'
  trl: 'Wa-man yuslim wajhahu ila llāhi wa-huwa muḥsinun fa-qadi stamsaka bi-l-ʿurwati l-wuthqā wa-ilā llāhi ʿāqibatu l-umūr'
  trad: 'Et quiconque remet (yuslim) son wajh à Allaah, en étant muḥsin, s''est saisi (istamsaka) de la anse la plus sûre (al-ʿurwati l-wuthqā), celle qui ne se rompt pas — et c''est vers Allaah que [va] l''issue de toutes choses (ʿāqibatu l-umūr).'
- ref: 'S.31:23'
  ar: 'وَمَنْ كَفَرَ فَلَا يَحْزُنْكَ كُفْرُهُ ۚ إِلَيْنَا مَرْجِعُهُمْ فَنُنَبِّئُهُمْ بِمَا عَمِلُوا ۚ إِنَّ اللَّهَ عَلِيمٌ بِذَاتِ الصُّدُورِ'
  trl: 'Wa-man kafara fa-lā yaḥzunka kufruhu ilaynā marjiʿuhum fa-nunabbiʾuhum bi-mā ʿamilū inna llāha ʿalīmun bi-dhāti ṣ-ṣudūr'
  trad: 'Et quiconque rejette (kafara) — que son kufr ne t''attriste pas (lā yaḥzunka) ; c''est vers Nous qu''est leur retour, et Nous les informerons alors de ce qu''ils faisaient. Allaah est certes ʿAlīm de ce qui est contenu dans les poitrines (dhāti ṣ-ṣudūr).'
- ref: 'S.31:24'
  ar: 'نُمَتِّعُهُمْ قَلِيلًا ثُمَّ نَضْطَرُّهُمْ إِلَىٰ عَذَابٍ غَلِيظٍ'
  trl: 'Numattiʿuhum qalīlan thumma naḑṭarruhum ilā ʿadhābin ghalīẕ'
  trad: 'Nous les laissons jouir (numattiʿuhum) un peu, puis Nous les contraindrons (naḑṭarruhum) vers un châtiment épais (ghalīẕ).'
- ref: 'S.31:25-26'
  ar: 'وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ ۚ قُلِ الْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ۝ لِلَّهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ إِنَّ اللَّهَ هُوَ الْغَنِيُّ الْحَمِيدُ'
  trl: 'Wa-la-in saʾaltahum man khalaqa s-samāwāti wa-l-arḑa la-yaqūlunna llāhu quli l-ḥamdu li-llāhi bal aktharuhum lā yaʿlamūn — Li-llāhi mā fi s-samāwāti wa-l-arḑi inna llāha huwa l-ghaniyyu l-ḥamīd'
  trad: 'Et si tu leur demandes qui a créé les cieux et la terre, ils diront certainement : « Allaah. » Dis : « La louange (al-ḥamd) est à Allaah ! » Mais la plupart d''entre eux ne savent pas — à Allaah [appartient] ce qui est dans les cieux et la terre — Allaah est certes, Lui, al-Ghaniyy, al-Ḥamīd.'
- ref: 'S.31:27'
  ar: 'وَلَوْ أَنَّمَا فِي الْأَرْضِ مِنْ شَجَرَةٍ أَقْلَامٌ وَالْبَحْرُ يَمُدُّهُ مِنْ بَعْدِهِ سَبْعَةُ أَبْحُرٍ مَا نَفِدَتْ كَلِمَاتُ اللَّهِ ۗ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ'
  trl: 'Wa-law annamā fi l-arḑi min shajaratin aqlāmun wa-l-baḥru yamudduhu min baʿdihi sabʿatu abḥurin mā nafidat kalimātu llāhi inna llāha ʿazīzun ḥakīm'
  trad: 'Et si tout arbre qui est sur la terre devenait calames (aqlām), et que la mer [devenait encre], secondée après elle (yamudduhu) par sept mers [semblables] — les paroles (kalimāt) d''Allaah ne s''épuiseraient pas (mā nafidat). Allaah est certes ʿAzīz, Ḥakīm.'
- ref: 'S.31:28'
  ar: 'مَا خَلْقُكُمْ وَلَا بَعْثُكُمْ إِلَّا كَنَفْسٍ وَاحِدَةٍ ۗ إِنَّ اللَّهَ سَمِيعٌ بَصِيرٌ'
  trl: 'Mā khalqukum wa-lā baʿthukum illā ka-nafsin wāḥidatin inna llāha samīʿun baṣīr'
  trad: 'Votre création et votre résurrection (baʿth) ne sont, [pour Allaah], que comme [la création ou la résurrection] d''un seul être (ka-nafsin wāḥida) — Allaah est certes Samīʿ, Baṣīr.'
- ref: 'S.31:29-30'
  ar: 'أَلَمْ تَرَ أَنَّ اللَّهَ يُولِجُ اللَّيْلَ فِي النَّهَارِ وَيُولِجُ النَّهَارَ فِي اللَّيْلِ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ كُلٌّ يَجْرِي إِلَىٰ أَجَلٍ مُسَمًّى وَأَنَّ اللَّهَ بِمَا تَعْمَلُونَ خَبِيرٌ ۝ ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّ مَا يَدْعُونَ مِنْ دُونِهِ الْبَاطِلُ وَأَنَّ اللَّهَ هُوَ الْعَلِيُّ الْكَبِيرُ'
  trl: 'A-lam tara anna llāha yūliju l-layla fi n-nahāri wa-yūliju n-nahāra fi l-layli wa-sakhkhara sh-shamsa wa-l-qamara kullun yajrī ilā ajalin musamman wa-anna llāha bi-mā taʿmalūna khabīr — Dhālika bi-anna llāha huwa l-ḥaqqu wa-anna mā yadʿūna min dūnihi l-bāṭilu wa-anna llāha huwa l-ʿaliyyu l-kabīr'
  trad: 'Ne vois-tu pas qu''Allaah fait pénétrer (yūliju) la nuit dans le jour, et fait pénétrer le jour dans la nuit, et qu''Il a assujetti (sakhkhara) le soleil et la lune, chacun courant (yajrī) vers un terme fixé (ajalin musamman) — et qu''Allaah est Khabīr de ce que vous faites ? Cela, parce qu''Allaah est, Lui, al-Ḥaqq, et que ce qu''ils invoquent en dehors de Lui est al-Bāṭil, et qu''Allaah est, Lui, al-ʿAliyy, al-Kabīr.'
- ref: 'S.31:31'
  ar: 'أَلَمْ تَرَ أَنَّ الْفُلْكَ تَجْرِي فِي الْبَحْرِ بِنِعْمَتِ اللَّهِ لِيُرِيَكُمْ مِنْ آيَاتِهِ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِكُلِّ صَبَّارٍ شَكُورٍ'
  trl: 'A-lam tara anna l-fulka tajrī fi l-baḥri bi-niʿmati llāhi li-yuriyakum min āyātihi inna fī dhālika la-āyātin li-kulli ṣabbārin shakūr'
  trad: 'Ne vois-tu pas que les vaisseaux (al-fulk) voguent (tajrī) sur la mer par le bienfait (niʿma) d''Allaah, pour vous montrer de Ses āyāt ? Il y a certes là des āyāt pour tout [être] profondément endurant (ṣabbār), reconnaissant (shakūr).'
- ref: 'S.31:32'
  ar: 'وَإِذَا غَشِيَهُمْ مَوْجٌ كَالظُّلَلِ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ فَلَمَّا نَجَّاهُمْ إِلَى الْبَرِّ فَمِنْهُمْ مُقْتَصِدٌ ۚ وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا كُلُّ خَتَّارٍ كَفُورٍ'
  trl: 'Wa-idhā ghashiyahum mawjun ka-ẕ-ẕulali daʿawu llāha mukhliṣīna lahu d-dīna fa-lammā najjāhum ilā l-barri fa-minhum muqtaṣidun wa-mā yajḥadu bi-āyātinā illā kullu khattārin kafūr'
  trad: 'Et quand une vague les recouvre (ghashiyahum), semblable à des ombrages suspendus (ka-ẕ-ẕulal), ils invoquent Allaah en Lui rendant exclusif (mukhliṣīn) le dīn — puis, lorsqu''Il les a sauvés (najjāhum) vers la terre ferme (al-barr), il en est parmi eux qui demeure modéré (muqtaṣid) — et il n''y a que tout [être] perfide (khattār), ingrat (kafūr), qui renie (yajḥadu) Nos āyāt.'
- ref: 'S.31:33'
  ar: 'يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمْ وَاخْشَوْا يَوْمًا لَا يَجْزِي وَالِدٌ عَنْ وَلَدِهِ وَلَا مَوْلُودٌ هُوَ جَازٍ عَنْ وَالِدِهِ شَيْئًا ۚ إِنَّ وَعْدَ اللَّهِ حَقٌّ ۖ فَلَا تَغُرَّنَّكُمُ الْحَيَاةُ الدُّنْيَا وَلَا يَغُرَّنَّكُمْ بِاللَّهِ الْغَرُورُ'
  trl: 'Yā ayyuhā n-nāsu ttaqū rabbakum wa-khshaw yawman lā yajzī wālidun ʿan waladihi wa-lā mawlūdun huwa jāzin ʿan wālidihi shayʾan inna waʿda llāhi ḥaqqun fa-lā taghurrannakumu l-ḥayātu d-dunyā wa-lā yaghurrannakum bi-llāhi l-gharūr'
  trad: 'Ô les humains, prémunissez-vous (ittaqū) envers votre Rabb, et craignez (ikhshaw) un jour où nul père ne pourra acquitter (yajzī) quoi que ce soit pour son enfant, ni nul enfant (mawlūd) acquitter quoi que ce soit pour son père — la promesse d''Allaah est vérité (ḥaqq) — que la vie d''ici-bas ne vous trompe donc pas (lā taghurrannakum), et que ce qui trompe (al-gharūr) ne vous trompe pas au sujet d''Allaah.'
- ref: 'S.31:34'
  ar: 'إِنَّ اللَّهَ عِنْدَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ وَيَعْلَمُ مَا فِي الْأَرْحَامِ ۖ وَمَا تَدْرِي نَفْسٌ مَاذَا تَكْسِبُ غَدًا ۖ وَمَا تَدْرِي نَفْسٌ بِأَيِّ أَرْضٍ تَمُوتُ ۚ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ'
  trl: 'Inna llāha ʿindahu ʿilmu s-sāʿati wa-yunazzilu l-ghaytha wa-yaʿlamu mā fi l-arḥāmi wa-mā tadrī nafsun mādhā taksibu ghadan wa-mā tadrī nafsun bi-ayyi arḑin tamūtu inna llāha ʿalīmun khabīr'
  trad: 'Allaah — c''est auprès de Lui (ʿindahu) que se trouve la science de l''Heure ; Il fait descendre le ghayth [la pluie secourable] ; Il connaît ce qui est dans les matrices (al-arḥām) ; et nulle âme ne sait ce qu''elle acquerra (taksibu) demain ; et nulle âme ne sait en quelle terre elle mourra. Allaah est certes ʿAlīm, Khabīr.'
