- ref: 'S.30:1'
  ar: 'الم'
  trl: 'Alif-Lām-Mīm'
  trad: 'Alif. Lām. Mīm.'
- ref: 'S.30:2'
  ar: 'غُلِبَتِ الرُّومُ'
  trl: 'Ghulibati r-Rūm'
  trad: 'Les Rūm ont été vaincus (ghulibat).'
- ref: 'S.30:3'
  ar: 'فِي أَدْنَى الْأَرْضِ وَهُمْ مِنْ بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ'
  trl: 'Fī adnā l-arḑi wa-hum min baʿdi ghalabihim sa-yaghlibūn'
  trad: 'dans la terre la plus proche (adnā l-arḑ) — et eux, après leur défaite (ghalab), vaincront bientôt (sa-yaghlibūn).'
- ref: 'S.30:4'
  ar: 'فِي بِضْعِ سِنِينَ ۗ لِلَّهِ الْأَمْرُ مِنْ قَبْلُ وَمِنْ بَعْدُ ۚ وَيَوْمَئِذٍ يَفْرَحُ الْمُؤْمِنُونَ'
  trl: 'Fī biḑʿi sinīn — lillāhi l-amru min qablu wa-min baʿdu — wa-yawmaʾidhin yafraḥu l-muʾminūn'
  trad: 'en quelques années (biḑʿ sinīn) — à Allaah l''affaire (al-amr), avant et après — et ce jour-là, les croyants se réjouiront (yafraḥu).'
- ref: 'S.30:5'
  ar: 'بِنَصْرِ اللَّهِ ۚ يَنْصُرُ مَنْ يَشَاءُ ۖ وَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Bi-naṣri llāhi yanṣuru man yashāʾu wa-huwa l-ʿazīzu r-raḥīm'
  trad: 'par le secours (naṣr) d''Allaah — Il secourt qui Il veut — Il est al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.30:6'
  ar: 'وَعْدَ اللَّهِ ۖ لَا يُخْلِفُ اللَّهُ وَعْدَهُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ'
  trl: 'Waʿda llāhi lā yukhlifu llāhu waʿdahu wa-lākinna akthara n-nāsi lā yaʿlamūn'
  trad: 'C''est la promesse (waʿd) d''Allaah — Allaah ne manque jamais à Sa promesse (lā yukhlifu) — mais la plupart des gens ne savent pas.'
- ref: 'S.30:7'
  ar: 'يَعْلَمُونَ ظَاهِرًا مِنَ الْحَيَاةِ الدُّنْيَا وَهُمْ عَنِ الْآخِرَةِ هُمْ غَافِلُونَ'
  trl: 'Yaʿlamūna ẕāhiran mina l-ḥayāti d-dunyā wa-hum ʿani l-ākhirati hum ghāfilūn'
  trad: 'Ils connaissent l''apparent (ẕāhir) de la vie d''ici-bas (ad-dunyā) — tandis qu''ils sont, de l''Au-delà, totalement insouciants (ghāfilūn).'
- ref: 'S.30:8'
  ar: 'أَوَلَمْ يَتَفَكَّرُوا فِي أَنْفُسِهِمْ ۗ مَا خَلَقَ اللَّهُ السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا إِلَّا بِالْحَقِّ وَأَجَلٍ مُسَمًّى ۗ وَإِنَّ كَثِيرًا مِنَ النَّاسِ بِلِقَاءِ رَبِّهِمْ لَكَافِرُونَ'
  trl: 'A-wa-lam yatafakkarū fī anfusihim mā khalaqa llāhu s-samāwāti wa-l-arḑa wa-mā baynahumā illā bi-l-ḥaqqi wa-ajalin musamman wa-inna kathīran mina n-nāsi bi-liqāʾi rabbihim la-kāfirūn'
  trad: 'N''ont-ils donc pas réfléchi en eux-mêmes ? Allaah n''a créé les cieux et la terre, et ce qui est entre les deux, qu''avec le ḥaqq et un terme fixé (ajalin musamman) — et beaucoup de gens, de la rencontre (liqāʾ) de leur Rabb, sont certes dans le kufr (kāfirūn).'
- ref: 'S.30:9'
  ar: 'أَوَلَمْ يَسِيرُوا فِي الْأَرْضِ فَيَنْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الَّذِينَ مِنْ قَبْلِهِمْ ۚ كَانُوا أَشَدَّ مِنْهُمْ قُوَّةً وَأَثَارُوا الْأَرْضَ وَعَمَرُوهَا أَكْثَرَ مِمَّا عَمَرُوهَا وَجَاءَتْهُمْ رُسُلُهُمْ بِالْبَيِّنَاتِ ۖ فَمَا كَانَ اللَّهُ لِيَظْلِمَهُمْ وَلَٰكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ'
  trl: 'A-wa-lam yasīrū fi l-arḑi fa-yanẕurū kayfa kāna ʿāqibatu lladhīna min qablihim — kānū ashadda minhum quwwatan wa-athārū l-arḑa wa-ʿamarūhā akthara mimmā ʿamarūhā wa-jāʾathum rusuluhum bi-l-bayyināti — fa-mā kāna llāhu li-yaẕlimahum wa-lākin kānū anfusahum yaẕlimūn'
  trad: 'N''ont-ils donc pas parcouru (yasīrū) la terre, pour voir ce qu''il est advenu (ʿāqiba) de ceux d''avant eux ? Ils étaient plus forts qu''eux (ashadda … quwwatan), ils ont retourné la terre (athārū l-arḑa) et l''ont mise en valeur (ʿamarūhā) plus qu''eux ne l''ont mise en valeur — et leurs rusul leur sont venus avec les preuves manifestes (al-bayyināt). Allaah n''allait pas leur faire du tort (li-yaẕlimahum) — mais c''est eux-mêmes qui se faisaient du tort (yaẕlimūn).'
- ref: 'S.30:10'
  ar: 'ثُمَّ كَانَ عَاقِبَةَ الَّذِينَ أَسَاءُوا السُّوأَىٰ أَنْ كَذَّبُوا بِآيَاتِ اللَّهِ وَكَانُوا بِهَا يَسْتَهْزِئُونَ'
  trl: 'Thumma kāna ʿāqibata lladhīna asāʾū s-sūʾā an kadhdhabū bi-āyāti llāhi wa-kānū bihā yastahziʾūn'
  trad: 'Puis l''issue (ʿāqiba) de ceux qui ont mal agi (asāʾū) fut la pire issue (as-sūʾā) — pour avoir démenti les āyāt d''Allaah, et s''en être moqués (yastahziʾūn).'
- ref: 'S.30:11'
  ar: 'اللَّهُ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ ثُمَّ إِلَيْهِ تُرْجَعُونَ'
  trl: 'Allāhu yabdaʾu l-khalqa thumma yuʿīduhu thumma ilayhi turjaʿūn'
  trad: 'Allaah initie (yabdaʾu) la création (al-khalq), puis Il la répète (yuʿīduhu) — puis c''est vers Lui que vous serez ramenés (turjaʿūn).'
- ref: 'S.30:12'
  ar: 'وَيَوْمَ تَقُومُ السَّاعَةُ يُبْلِسُ الْمُجْرِمُونَ'
  trl: 'Wa-yawma taqūmu s-sāʿatu yublisu l-mujrimūn'
  trad: 'Et le Jour où l''Heure (as-Sāʿa) se dressera (taqūmu), les mujrimūn seront saisis d''un désespoir muet (yublisu).'
- ref: 'S.30:13'
  ar: 'وَلَمْ يَكُنْ لَهُمْ مِنْ شُرَكَائِهِمْ شُفَعَاءُ وَكَانُوا بِشُرَكَائِهِمْ كَافِرِينَ'
  trl: 'Wa-lam yakun lahum min shurakāʾihim shufaʿāʾu wa-kānū bi-shurakāʾihim kāfirīn'
  trad: 'Et ils n''auront, parmi leurs associés (shurakāʾ), aucun intercesseur (shufaʿāʾ) — et ils renieront alors leurs propres associés.'
- ref: 'S.30:14'
  ar: 'وَيَوْمَ تَقُومُ السَّاعَةُ يَوْمَئِذٍ يَتَفَرَّقُونَ'
  trl: 'Wa-yawma taqūmu s-sāʿatu yawmaʾidhin yatafarraqūn'
  trad: 'Et le Jour où l''Heure se dressera, ce jour-là, ils se sépareront (yatafarraqūn).'
- ref: 'S.30:15'
  ar: 'فَأَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ'
  trl: 'Fa-ammā lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti fa-hum fī rawḑatin yuḥbarūn'
  trad: 'Quant à ceux qui ont cru et accompli les œuvres droites (aṣ-ṣāliḥāt) — ils seront, dans un jardin luxuriant (rawḑa), accueillis avec honneur et contentement (yuḥbarūn).'
- ref: 'S.30:16'
  ar: 'وَأَمَّا الَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا وَلِقَاءِ الْآخِرَةِ فَأُولَٰئِكَ فِي الْعَذَابِ مُحْضَرُونَ'
  trl: 'Wa-ammā lladhīna kafarū wa-kadhdhabū bi-āyātinā wa-liqāʾi l-ākhirati fa-ulāʾika fi l-ʿadhābi muḥḑarūn'
  trad: 'Et quant à ceux qui ont rejeté (kafarū), et démenti Nos āyāt et la rencontre de l''Au-delà — ceux-là seront maintenus (muḥḑarūn) dans le châtiment.'
- ref: 'S.30:17–18'
  ar: 'فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ ۝ وَلَهُ الْحَمْدُ فِي السَّمَاوَاتِ وَالْأَرْضِ وَعَشِيًّا وَحِينَ تُظْهِرُونَ'
  trl: 'Fa-subḥāna llāhi ḥīna tumsūna wa-ḥīna tuṣbiḥūn — wa-lahu l-ḥamdu fi s-samāwāti wa-l-arḑi wa-ʿashiyyan wa-ḥīna tuẕhirūn'
  trad: 'Qu''Il est dégagé de toute imperfection (subḥāna llāh), au moment où vous entrez dans le soir (tumsūn) et au moment où vous entrez dans le matin (tuṣbiḥūn) — et à Lui la louange (ḥamd), dans les cieux et la terre, et au déclin de l''après-midi (ʿashiyyan) et au milieu du jour (ḥīna tuẕhirūn).'
- ref: 'S.30:19'
  ar: 'يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَيُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَيُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا ۚ وَكَذَٰلِكَ تُخْرَجُونَ'
  trl: 'Yukhriju l-ḥayya mina l-mayyiti wa-yukhriju l-mayyita mina l-ḥayyi wa-yuḥyī l-arḑa baʿda mawtihā wa-kadhālika tukhrajūn'
  trad: 'Il fait sortir le vivant (al-ḥayy) du mort (al-mayyit), et fait sortir le mort du vivant, et fait vivre (yuḥyī) la terre après sa mort — et c''est ainsi que vous serez faits sortir (tukhrajūn).'
- ref: 'S.30:20'
  ar: 'وَمِنْ آيَاتِهِ أَنْ خَلَقَكُمْ مِنْ تُرَابٍ ثُمَّ إِذَا أَنْتُمْ بَشَرٌ تَنْتَشِرُونَ'
  trl: 'Wa-min āyātihi an khalaqakum min turābin thumma idhā antum basharun tantashirūn'
  trad: 'Et parmi Ses āyāt : qu''Il vous a créés de turāb (terre sèche, poussière) — puis voici que vous êtes des bashar (êtres humains) qui se répandent (tantashirūn).'
- ref: 'S.30:21'
  ar: 'وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَتَفَكَّرُونَ'
  trl: 'Wa-min āyātihi an khalaqa lakum min anfusikum azwājan li-taskunū ilayhā wa-jaʿala baynakum mawaddatan wa-raḥmatan inna fī dhālika la-āyātin li-qawmin yatafakkarūn'
  trad: 'Et parmi Ses āyāt : qu''Il a créé pour vous, de vous-mêmes, des épouses (azwāj), pour que vous trouviez l''apaisement (taskunū) auprès d''elles — et Il a établi entre vous une affection (mawadda) et une bienveillance profonde (raḥma). Il y a certes là des āyāt pour un peuple qui réfléchit (yatafakkarūn).'
- ref: 'S.30:22'
  ar: 'وَمِنْ آيَاتِهِ خَلْقُ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافُ أَلْسِنَتِكُمْ وَأَلْوَانِكُمْ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِلْعَالِمِينَ'
  trl: 'Wa-min āyātihi khalqu s-samāwāti wa-l-arḑi wa-khtilāfu alsinatikum wa-alwānikum inna fī dhālika la-āyātin li-l-ʿālimīn'
  trad: 'Et parmi Ses āyāt : la création des cieux et de la terre, et la diversité (ikhtilāf) de vos langues et de vos couleurs. Il y a certes là des āyāt pour les ʿālimūn (ceux qui savent).'
- ref: 'S.30:23'
  ar: 'وَمِنْ آيَاتِهِ مَنَامُكُمْ بِاللَّيْلِ وَالنَّهَارِ وَابْتِغَاؤُكُمْ مِنْ فَضْلِهِ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَسْمَعُونَ'
  trl: 'Wa-min āyātihi manāmukum bi-l-layli wa-n-nahāri wa-btighāʾukum min faḑlihi inna fī dhālika la-āyātin li-qawmin yasmaʿūn'
  trad: 'Et parmi Ses āyāt : votre sommeil (manām), la nuit et le jour, et votre quête (ibtighāʾ) de Sa faḑl. Il y a certes là des āyāt pour un peuple qui entend (yasmaʿūn).'
- ref: 'S.30:24'
  ar: 'وَمِنْ آيَاتِهِ يُرِيكُمُ الْبَرْقَ خَوْفًا وَطَمَعًا وَيُنَزِّلُ مِنَ السَّمَاءِ مَاءً فَيُحْيِي بِهِ الْأَرْضَ بَعْدَ مَوْتِهَا ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَعْقِلُونَ'
  trl: 'Wa-min āyātihi yurīkumu l-barqa khawfan wa-ṭamaʿan wa-yunazzilu mina s-samāʾi māʾan fa-yuḥyī bihi l-arḑa baʿda mawtihā inna fī dhālika la-āyātin li-qawmin yaʿqilūn'
  trad: 'Et parmi Ses āyāt : qu''Il vous montre l''éclair (al-barq), suscitant crainte (khawf) et espoir (ṭamaʿ) — et qu''Il fait descendre du ciel une eau, par laquelle Il fait vivre (yuḥyī) la terre après sa mort. Il y a certes là des āyāt pour un peuple qui raisonne (yaʿqilūn).'
- ref: 'S.30:25'
  ar: 'وَمِنْ آيَاتِهِ أَنْ تَقُومَ السَّمَاءُ وَالْأَرْضُ بِأَمْرِهِ ۚ ثُمَّ إِذَا دَعَاكُمْ دَعْوَةً مِنَ الْأَرْضِ إِذَا أَنْتُمْ تَخْرُجُونَ'
  trl: 'Wa-min āyātihi an taqūma s-samāʾu wa-l-arḑu bi-amrihi thumma idhā daʿākum daʿwatan mina l-arḑi idhā antum takhrujūn'
  trad: 'Et parmi Ses āyāt : que le ciel et la terre se tiennent (taqūma) par Son amr — puis, lorsqu''Il vous appellera d''un seul appel (daʿwatan) depuis la terre, voici que vous en sortirez (takhrujūn).'
- ref: 'S.30:26'
  ar: 'وَلَهُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ كُلٌّ لَهُ قَانِتُونَ'
  trl: 'Wa-lahu man fi s-samāwāti wa-l-arḑi kullun lahu qānitūn'
  trad: 'Et à Lui appartient qui est dans les cieux et sur la terre — tous Lui sont dans la qunūt (la soumission constante).'
- ref: 'S.30:27'
  ar: 'وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ ۚ وَلَهُ الْمَثَلُ الْأَعْلَىٰ فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ وَهُوَ الْعَزِيزُ الْحَكِيمُ'
  trl: 'Wa-huwa lladhī yabdaʾu l-khalqa thumma yuʿīduhu wa-huwa ahwanu ʿalayhi wa-lahu l-mathalu l-aʿlā fi s-samāwāti wa-l-arḑi wa-huwa l-ʿazīzu l-ḥakīm'
  trad: 'Et Il est Ce qui initie la création, puis la répète — et cela Lui est plus aisé (ahwanu ʿalayhi) — et à Lui revient la comparaison sans égale (al-mathal al-aʿlā), dans les cieux et sur la terre — et Il est al-ʿAzīz, al-Ḥakīm.'
- ref: 'S.30:28'
  ar: 'ضَرَبَ لَكُمْ مَثَلًا مِنْ أَنْفُسِكُمْ ۖ هَلْ لَكُمْ مِنْ مَا مَلَكَتْ أَيْمَانُكُمْ مِنْ شُرَكَاءَ فِي مَا رَزَقْنَاكُمْ فَأَنْتُمْ فِيهِ سَوَاءٌ تَخَافُونَهُمْ كَخِيفَتِكُمْ أَنْفُسَكُمْ ۚ كَذَٰلِكَ نُفَصِّلُ الْآيَاتِ لِقَوْمٍ يَعْقِلُونَ'
  trl: 'Ḑaraba lakum mathalan min anfusikum hal lakum min mā malakat aymānukum min shurakāʾa fī mā razaqnākum fa-antum fīhi sawāʾun takhāfūnahum ka-khīfatikum anfusakum kadhālika nufaṣṣilu l-āyāti li-qawmin yaʿqilūn'
  trad: 'Il vous frappe une image (mathal) tirée de vous-mêmes : avez-vous, parmi mā malakat aymānukum, des partenaires (shurakāʾa) dans ce que Nous vous avons accordé comme rizq, de sorte que vous y soyez égaux (sawāʾ), les craignant comme vous craignez vos propres semblables ? Ainsi détaillons-Nous les āyāt pour un peuple qui raisonne (yaʿqilūn).'
- ref: 'S.30:29'
  ar: 'بَلِ اتَّبَعَ الَّذِينَ ظَلَمُوا أَهْوَاءَهُمْ بِغَيْرِ عِلْمٍ ۖ فَمَنْ يَهْدِي مَنْ أَضَلَّ اللَّهُ ۖ وَمَا لَهُمْ مِنْ نَاصِرِينَ'
  trl: 'Bali ttabaʿa lladhīna ẕalamū ahwāʾahum bi-ghayri ʿilmin fa-man yahdī man aḑalla llāhu wa-mā lahum min nāṣirīn'
  trad: 'Non — ceux qui ont commis le ẕulm ont suivi leurs penchants (ahwāʾ) sans aucun savoir (bi-ghayri ʿilmin). Qui guide alors celui qu''Allaah a laissé s''égarer (aḑalla) ? Et ils n''ont aucun secoureur (nāṣirīn).'
- ref: 'S.30:30'
  ar: 'فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا ۚ فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا ۚ لَا تَبْدِيلَ لِخَلْقِ اللَّهِ ۚ ذَٰلِكَ الدِّينُ الْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ'
  trl: 'Fa-aqim wajhaka lid-dīni ḥanīfan fiṭrata llāhi llatī faṭara n-nāsa ʿalayhā lā tabdīla li-khalqi llāhi dhālika d-dīnu l-qayyimu wa-lākinna akthara n-nāsi lā yaʿlamūn'
  trad: 'Oriente donc ton visage résolument (wajhaka … ḥanīfan) vers le dīn — [c''est] la fiṭra d''Allaah, celle selon laquelle Il a fait exister les gens (fiṭrata llāhi … faṭara n-nāsa ʿalayhā). Nulle substitution (tabdīl) au khalq d''Allaah. Voilà le dīn al-qayyim (fermement établi) — mais la plupart des gens ne savent pas.'
- ref: 'S.30:31–32'
  ar: 'مُنِيبِينَ إِلَيْهِ وَاتَّقُوهُ وَأَقِيمُوا الصَّلَاةَ وَلَا تَكُونُوا مِنَ الْمُشْرِكِينَ ۝ مِنَ الَّذِينَ فَرَّقُوا دِينَهُمْ وَكَانُوا شِيَعًا ۖ كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ'
  trl: 'Munībīna ilayhi wa-ttaqūhu wa-aqīmu ṣ-ṣalāta wa-lā takūnū mina l-mushrikīn mina lladhīna farraqū dīnahum wa-kānū shiyaʿan kullu ḥizbin bimā ladayhim fariḥūn'
  trad: '[Soyez] munībīn (en retour constant) vers Lui — prémunissez-vous de Lui (ittaqūhu), établissez la ṣalāt, et ne soyez pas parmi les mushrikūn — parmi ceux qui ont divisé (farraqū) leur dīn et sont devenus des shiyaʿ (factions) — chaque parti (ḥizb), de ce qu''il détient, est content (fariḥūn).'
- ref: 'S.30:33'
  ar: 'وَإِذَا مَسَّ النَّاسَ ضُرٌّ دَعَوْا رَبَّهُمْ مُنِيبِينَ إِلَيْهِ ثُمَّ إِذَا أَذَاقَهُمْ مِنْهُ رَحْمَةً إِذَا فَرِيقٌ مِنْهُمْ بِرَبِّهِمْ يُشْرِكُونَ'
  trl: 'Wa-idhā massa n-nāsa ḑurrun daʿaw rabbahum munībīna ilayhi thumma idhā adhāqahum minhu raḥmatan idhā farīqun minhum bi-rabbihim yushrikūn'
  trad: 'Et quand un dommage (ḑurr) touche les gens, ils invoquent leur Rabb, munībīna vers Lui — puis, quand Il leur fait goûter une raḥma venue de Lui, voici qu''un groupe d''entre eux associe des partenaires à leur Rabb (yushrikūn).'
- ref: 'S.30:34'
  ar: 'لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ ۚ فَتَمَتَّعُوا فَسَوْفَ تَعْلَمُونَ'
  trl: 'Li-yakfurū bimā ātaynāhum fa-tamattaʿū fa-sawfa taʿlamūn'
  trad: 'pour rejeter (li-yakfurū) ce que Nous leur avons donné — jouissez donc [un temps] (tamattaʿū) — vous saurez bientôt (sawfa taʿlamūn).'
- ref: 'S.30:35'
  ar: 'أَمْ أَنْزَلْنَا عَلَيْهِمْ سُلْطَانًا فَهُوَ يَتَكَلَّمُ بِمَا كَانُوا بِهِ يُشْرِكُونَ'
  trl: 'Am anzalnā ʿalayhim sulṭānan fa-huwa yatakallamu bimā kānū bihi yushrikūn'
  trad: 'Ou leur aurions-Nous fait descendre une autorité (sulṭān) qui parlerait en faveur de ce qu''ils associent (yushrikūn) ?'
- ref: 'S.30:36'
  ar: 'وَإِذَا أَذَقْنَا النَّاسَ رَحْمَةً فَرِحُوا بِهَا ۖ وَإِنْ تُصِبْهُمْ سَيِّئَةٌ بِمَا قَدَّمَتْ أَيْدِيهِمْ إِذَا هُمْ يَقْنَطُونَ'
  trl: 'Wa-idhā adhaqnā n-nāsa raḥmatan fariḥū bihā wa-in tuṣibhum sayyiʾatun bimā qaddamat aydīhim idhā hum yaqnaṭūn'
  trad: 'Et quand Nous faisons goûter aux gens une raḥma, ils s''en réjouissent (fariḥū) — et si un mal (sayyiʾa) les atteint, pour ce que leurs mains ont avancé (qaddamat aydīhim), voici qu''ils sombrent dans le désespoir (yaqnaṭūn).'
- ref: 'S.30:37'
  ar: 'أَوَلَمْ يَرَوْا أَنَّ اللَّهَ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ وَيَقْدِرُ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يُؤْمِنُونَ'
  trl: 'A-wa-lam yarawu anna llāha yabsuṭu r-rizqa li-man yashāʾu wa-yaqdiru inna fī dhālika la-āyātin li-qawmin yuʾminūn'
  trad: 'N''ont-ils donc pas vu qu''Allaah étend (yabsuṭu) le rizq pour qui Il veut, ou qu''Il le mesure strictement (yaqdiru) ? Il y a certes là des āyāt pour un peuple qui croit (yuʾminūn).'
- ref: 'S.30:38'
  ar: 'فَآتِ ذَا الْقُرْبَىٰ حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ ۚ ذَٰلِكَ خَيْرٌ لِلَّذِينَ يُرِيدُونَ وَجْهَ اللَّهِ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ'
  trl: 'Fa-āti dhā l-qurbā ḥaqqahu wa-l-miskīna wa-bna s-sabīli dhālika khayrun lilladhīna yurīdūna wajha llāhi wa-ulāʾika humu l-mufliḥūn'
  trad: 'Donne donc au proche parent (dhā l-qurbā) son dû (ḥaqq), ainsi qu''au miskīn et à l''ibn as-sabīl (littéralement « le fils de la voie », le voyageur démuni) — cela est meilleur pour ceux qui visent le wajh d''Allaah — et ceux-là sont les mufliḥūn (ceux qui réussissent pleinement).'
- ref: 'S.30:39'
  ar: 'وَمَا آتَيْتُمْ مِنْ رِبًا لِيَرْبُوَ فِي أَمْوَالِ النَّاسِ فَلَا يَرْبُو عِنْدَ اللَّهِ ۖ وَمَا آتَيْتُمْ مِنْ زَكَاةٍ تُرِيدُونَ وَجْهَ اللَّهِ فَأُولَٰئِكَ هُمُ الْمُضْعِفُونَ'
  trl: 'Wa-mā ātaytum min riban li-yarbuwa fī amwāli n-nāsi fa-lā yarbū ʿinda llāhi wa-mā ātaytum min zakātin turīdūna wajha llāhi fa-ulāʾika humu l-muḑʿifūn'
  trad: 'Et ce que vous donnez en ribā pour qu''il croisse (li-yarbuwa) dans les biens des gens — cela ne croît pas ʿinda llāh (auprès d''Allaah, dans Son registre). Et ce que vous donnez en zakāt, visant le wajh d''Allaah — ceux-là sont les muḑʿifūn (ceux dont le bien est réellement multiplié).'
- ref: 'S.30:40'
  ar: 'اللَّهُ الَّذِي خَلَقَكُمْ ثُمَّ رَزَقَكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ۖ هَلْ مِنْ شُرَكَائِكُمْ مَنْ يَفْعَلُ مِنْ ذَٰلِكُمْ مِنْ شَيْءٍ ۚ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ'
  trl: 'Allāhu lladhī khalaqakum thumma razaqakum thumma yumītukum thumma yuḥyīkum hal min shurakāʾikum man yafʿalu min dhālikum min shayʾin subḥānahu wa-taʿālā ʿammā yushrikūn'
  trad: 'Allaah est Ce qui vous a créés, puis vous a pourvus (razaqakum), puis vous donne la mort, puis vous donne la vie. Y a-t-il, parmi vos associés (shurakāʾ), quelqu''un qui accomplisse la moindre chose de tout cela ? Il est dégagé de toute imperfection et Il transcende (subḥānahu wa-taʿālā) ce qu''ils Lui associent.'
- ref: 'S.30:41'
  ar: 'ظَهَرَ الْفَسَادُ فِي الْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتْ أَيْدِي النَّاسِ لِيُذِيقَهُمْ بَعْضَ الَّذِي عَمِلُوا لَعَلَّهُمْ يَرْجِعُونَ'
  trl: 'Ẕahara l-fasādu fi l-barri wa-l-baḥri bimā kasabat aydi n-nāsi li-yudhīqahum baʿḑa lladhī ʿamilū laʿallahum yarjiʿūn'
  trad: 'Le fasād (corruption, dérèglement) est apparu (ẕahara) sur la terre et la mer, pour ce que les mains des gens ont accompli (bimā kasabat aydi n-nāsi) — afin qu''Il leur fasse goûter une part de ce qu''ils ont fait, dans l''espoir qu''ils reviennent (yarjiʿūn).'
- ref: 'S.30:42'
  ar: 'قُلْ سِيرُوا فِي الْأَرْضِ فَانْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الَّذِينَ مِنْ قَبْلُ ۚ كَانَ أَكْثَرُهُمْ مُشْرِكِينَ'
  trl: 'Qul sīrū fi l-arḑi fa-nẕurū kayfa kāna ʿāqibatu lladhīna min qablu kāna aktharuhum mushrikīn'
  trad: 'Dis : « Parcourez (sīrū) la terre, puis regardez quelle a été l''issue (ʿāqiba) de ceux d''avant — la plupart d''entre eux étaient mushrikūn. »'
- ref: 'S.30:43'
  ar: 'فَأَقِمْ وَجْهَكَ لِلدِّينِ الْقَيِّمِ مِنْ قَبْلِ أَنْ يَأْتِيَ يَوْمٌ لَا مَرَدَّ لَهُ مِنَ اللَّهِ ۖ يَوْمَئِذٍ يَصَّدَّعُونَ'
  trl: 'Fa-aqim wajhaka lid-dīni l-qayyimi min qabli an yaʾtiya yawmun lā maradda lahu mina llāhi yawmaʾidhin yaṣṣaddaʿūn'
  trad: 'Oriente donc ton visage (wajhaka) vers le dīn al-qayyim, avant que ne vienne un Jour pour lequel il n''y a nul recours (lā maradda lahu) venant d''Allaah — ce Jour-là, ils seront disloqués en groupes distincts (yaṣṣaddaʿūn).'
- ref: 'S.30:44'
  ar: 'مَنْ كَفَرَ فَعَلَيْهِ كُفْرُهُ ۖ وَمَنْ عَمِلَ صَالِحًا فَلِأَنْفُسِهِمْ يَمْهَدُونَ'
  trl: 'Man kafara fa-ʿalayhi kufruhu wa-man ʿamila ṣāliḥan fa-li-anfusihim yamhadūn'
  trad: 'Quiconque rejette (kafara) — son rejet (kufr) retombe sur lui. Et quiconque accomplit une œuvre droite (ṣāliḥan) — c''est pour eux-mêmes qu''ils se préparent (yamhadūn).'
- ref: 'S.30:45'
  ar: 'لِيَجْزِيَ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ مِنْ فَضْلِهِ ۚ إِنَّهُ لَا يُحِبُّ الْكَافِرِينَ'
  trl: 'Li-yajziya lladhīna āmanū wa-ʿamilu ṣ-ṣāliḥāti min faḑlihi innahu lā yuḥibbu l-kāfirīn'
  trad: 'afin qu''Il rétribue (li-yajziya), de Sa faḑl (bienfait surabondant), ceux qui ont cru et accompli les œuvres droites — Il n''honore pas (lā yuḥibbu) les kāfirūn.'
- ref: 'S.30:46'
  ar: 'وَمِنْ آيَاتِهِ أَنْ يُرْسِلَ الرِّيَاحَ مُبَشِّرَاتٍ وَلِيُذِيقَكُمْ مِنْ رَحْمَتِهِ وَلِتَجْرِيَ الْفُلْكُ بِأَمْرِهِ وَلِتَبْتَغُوا مِنْ فَضْلِهِ وَلَعَلَّكُمْ تَشْكُرُونَ'
  trl: 'Wa-min āyātihi an yursila r-riyāḥa mubashshirātin wa-li-yudhīqakum min raḥmatihi wa-li-tajriya l-fulku bi-amrihi wa-li-tabtaghū min faḑlihi wa-laʿallakum tashkurūn'
  trad: 'Et parmi Ses āyāt : qu''Il envoie les vents (ar-riyāḥ) en annonce (mubashshirāt), pour vous faire goûter de Sa raḥma, pour que les navires voguent (tajriya l-fulku) par Son amr, pour que vous recherchiez (tabtaghū) de Sa faḑl, et dans l''espoir que vous soyez reconnaissants (tashkurūn).'
- ref: 'S.30:47'
  ar: 'وَلَقَدْ أَرْسَلْنَا مِنْ قَبْلِكَ رُسُلًا إِلَىٰ قَوْمِهِمْ فَجَاءُوهُمْ بِالْبَيِّنَاتِ فَانْتَقَمْنَا مِنَ الَّذِينَ أَجْرَمُوا ۖ وَكَانَ حَقًّا عَلَيْنَا نَصْرُ الْمُؤْمِنِينَ'
  trl: 'Wa-la-qad arsalnā min qablika rusulan ilā qawmihim fa-jāʾūhum bi-l-bayyināti fa-ntaqamnā mina lladhīna ajramū wa-kāna ḥaqqan ʿalaynā naṣru l-muʾminīn'
  trad: 'Et Nous avons certes envoyé, avant toi, des rusul vers leurs peuples respectifs — ils leur vinrent avec les preuves manifestes (al-bayyināt) — et Nous avons pris rétribution (fa-ntaqamnā) sur ceux qui ont commis le crime (ajramū). Et le secours des croyants était, [pour Nous], une chose due (ḥaqqan ʿalaynā).'
- ref: 'S.30:48'
  ar: 'اللَّهُ الَّذِي يُرْسِلُ الرِّيَاحَ فَتُثِيرُ سَحَابًا فَيَبْسُطُهُ فِي السَّمَاءِ كَيْفَ يَشَاءُ وَيَجْعَلُهُ كِسَفًا فَتَرَى الْوَدْقَ يَخْرُجُ مِنْ خِلَالِهِ ۖ فَإِذَا أَصَابَ بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ إِذَا هُمْ يَسْتَبْشِرُونَ'
  trl: 'Allāhu lladhī yursilu r-riyāḥa fa-tuthīru saḥāban fa-yabsuṭuhu fi s-samāʾi kayfa yashāʾu wa-yajʿaluhu kisafan fa-tarā l-wadqa yakhruju min khilālihi fa-idhā aṣāba bihi man yashāʾu min ʿibādihi idhā hum yastabshirūn'
  trad: 'Allaah est Ce qui envoie les vents, qui soulèvent (tuthīru) une nuée (saḥāb) — Il l''étend (yabsuṭuhu) dans le ciel comme Il veut, et en fait des fragments (kisafan) — alors tu vois la pluie fine (al-wadq) sortir de leurs interstices (khilāl) — et quand Il en atteint qui Il veut parmi Ses ʿibād, voici qu''ils s''en réjouissent avec soulagement (yastabshirūn).'
- ref: 'S.30:49'
  ar: 'وَإِنْ كَانُوا مِنْ قَبْلِ أَنْ يُنَزَّلَ عَلَيْهِمْ مِنْ قَبْلِهِ لَمُبْلِسِينَ'
  trl: 'Wa-in kānū min qabli an yunazzala ʿalayhim min qablihi la-mublisīn'
  trad: 'Et ils étaient certes, avant que cela ne soit descendu sur eux, dans un désespoir muet (la-mublisīn).'
- ref: 'S.30:50'
  ar: 'فَانْظُرْ إِلَىٰ آثَارِ رَحْمَتِ اللَّهِ كَيْفَ يُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا ۚ إِنَّ ذَٰلِكَ لَمُحْيِي الْمَوْتَىٰ ۖ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ'
  trl: 'Fa-nẕur ilā āthāri raḥmati llāhi kayfa yuḥyi l-arḑa baʿda mawtihā inna dhālika la-muḥyi l-mawtā wa-huwa ʿalā kulli shayʾin qadīr'
  trad: 'Regarde donc les traces (āthār) de la raḥma d''Allaah — comment Il fait revivre (yuḥyī) la terre après sa mort. Cela [prouve] que c''est Ce qui fait revivre les morts (la-muḥyi l-mawtā) — et Il a pouvoir (qadīr) sur toute chose.'
- ref: 'S.30:51'
  ar: 'وَلَئِنْ أَرْسَلْنَا رِيحًا فَرَأَوْهُ مُصْفَرًّا لَظَلُّوا مِنْ بَعْدِهِ يَكْفُرُونَ'
  trl: 'Wa-la-in arsalnā rīḥan fa-raʾawhu muṣfarran la-ẕallū min baʿdihi yakfurūn'
  trad: 'Et si Nous envoyions un vent (rīḥan), et qu''ils la [la culture] voyaient jaunie (muṣfarran), ils resteraient, après cela, dans le rejet (yakfurūn).'
- ref: 'S.30:52–53'
  ar: 'فَإِنَّكَ لَا تُسْمِعُ الْمَوْتَىٰ وَلَا تُسْمِعُ الصُّمَّ الدُّعَاءَ إِذَا وَلَّوْا مُدْبِرِينَ ۝ وَمَا أَنْتَ بِهَادِ الْعُمْيِ عَنْ ضَلَالَتِهِمْ ۖ إِنْ تُسْمِعُ إِلَّا مَنْ يُؤْمِنُ بِآيَاتِنَا فَهُمْ مُسْلِمُونَ'
  trl: 'Fa-innaka lā tusmiʿu l-mawtā wa-lā tusmiʿu ṣ-ṣumma d-duʿāʾa idhā wallaw mudbirīn wa-mā anta bi-hādi l-ʿumyi ʿan ḑalālatihim in tusmiʿu illā man yuʾminu bi-āyātinā fa-hum muslimūn'
  trad: 'Tu ne fais pas entendre (lā tusmiʿu) les morts, et tu ne fais pas entendre aux sourds (aṣ-ṣumm) l''appel (ad-duʿāʾ), quand ils ont tourné le dos (wallaw mudbirīn). Et tu n''es pas ce qui guide (hādi) les aveugles (al-ʿumy) hors de leur égarement (ḑalāla) — tu ne fais entendre que ceux qui croient en Nos āyāt, et qui sont alors muslimūn.'
- ref: 'S.30:54'
  ar: 'اللَّهُ الَّذِي خَلَقَكُمْ مِنْ ضَعْفٍ ثُمَّ جَعَلَ مِنْ بَعْدِ ضَعْفٍ قُوَّةً ثُمَّ جَعَلَ مِنْ بَعْدِ قُوَّةٍ ضَعْفًا وَشَيْبَةً ۚ يَخْلُقُ مَا يَشَاءُ ۖ وَهُوَ الْعَلِيمُ الْقَدِيرُ'
  trl: 'Allāhu lladhī khalaqakum min ḑaʿfin thumma jaʿala min baʿdi ḑaʿfin quwwatan thumma jaʿala min baʿdi quwwatin ḑaʿfan wa-shaybatan yakhluqu mā yashāʾu wa-huwa l-ʿalīmu l-qadīr'
  trad: 'Allaah est Ce qui vous a créés à partir d''une faiblesse (ḑaʿf), puis a établi, après cette faiblesse, une force (quwwa), puis a établi, après cette force, une faiblesse et une vieillesse (shayba) — Il crée ce qu''Il veut, et Il est al-ʿAlīm (Ce qui détient le savoir total), al-Qadīr (Ce qui détient le pouvoir total).'
- ref: 'S.30:55'
  ar: 'وَيَوْمَ تَقُومُ السَّاعَةُ يُقْسِمُ الْمُجْرِمُونَ مَا لَبِثُوا غَيْرَ سَاعَةٍ ۚ كَذَٰلِكَ كَانُوا يُؤْفَكُونَ'
  trl: 'Wa-yawma taqūmu s-sāʿatu yuqsimu l-mujrimūna mā labithū ghayra sāʿatin kadhālika kānū yuʾfakūn'
  trad: 'Et le Jour où l''Heure se dressera, les mujrimūn jureront (yuqsimu) n''être restés (mā labithū) qu''une heure (ghayra sāʿatin) — c''est ainsi qu''ils étaient détournés [du vrai] (yuʾfakūn).'
- ref: 'S.30:56'
  ar: 'وَقَالَ الَّذِينَ أُوتُوا الْعِلْمَ وَالْإِيمَانَ لَقَدْ لَبِثْتُمْ فِي كِتَابِ اللَّهِ إِلَىٰ يَوْمِ الْبَعْثِ ۖ فَهَٰذَا يَوْمُ الْبَعْثِ وَلَٰكِنَّكُمْ كُنْتُمْ لَا تَعْلَمُونَ'
  trl: 'Wa-qāla lladhīna ūtū l-ʿilma wa-l-īmāna la-qad labithtum fī kitābi llāhi ilā yawmi l-baʿthi fa-hādhā yawmu l-baʿthi wa-lākinnakum kuntum lā taʿlamūn'
  trad: 'Et ceux à qui le savoir (al-ʿilm) et la foi (al-īmān) ont été donnés diront : « Vous êtes certes restés, dans le Kitāb d''Allaah, jusqu''au Jour de la Résurrection (yawm al-baʿth) — et voici le Jour de la Résurrection — mais vous ne saviez pas. »'
- ref: 'S.30:57'
  ar: 'فَيَوْمَئِذٍ لَا يَنْفَعُ الَّذِينَ ظَلَمُوا مَعْذِرَتُهُمْ وَلَا هُمْ يُسْتَعْتَبُونَ'
  trl: 'Fa-yawmaʾidhin lā yanfaʿu lladhīna ẕalamū maʿdhiratuhum wa-lā hum yustaʿtabūn'
  trad: 'Ce Jour-là, l''excuse (maʿdhira) de ceux qui ont commis le ẕulm ne leur sera d''aucune utilité, et il ne leur sera pas demandé de revenir [sur leur faute] (yustaʿtabūn).'
- ref: 'S.30:58'
  ar: 'وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِي هَٰذَا الْقُرْآنِ مِنْ كُلِّ مَثَلٍ ۚ وَلَئِنْ جِئْتَهُمْ بِآيَةٍ لَيَقُولَنَّ الَّذِينَ كَفَرُوا إِنْ أَنْتُمْ إِلَّا مُبْطِلُونَ'
  trl: 'Wa-la-qad ḑarabnā li-n-nāsi fī hādhā l-qurʾāni min kulli mathalin wa-la-in jiʾtahum bi-āyatin la-yaqūlanna lladhīna kafarū in antum illā mubṭilūn'
  trad: 'Et Nous avons certes frappé (ḑarabnā), pour les gens, dans ce Qurʾān, toute sorte d''image (mathal) — et si tu leur apportais une āya, ceux qui rejettent (kafarū) diraient assurément : « Vous n''êtes que des mubṭilūn (ceux qui tiennent le faux). »'
- ref: 'S.30:59'
  ar: 'كَذَٰلِكَ يَطْبَعُ اللَّهُ عَلَىٰ قُلُوبِ الَّذِينَ لَا يَعْلَمُونَ'
  trl: 'Kadhālika yaṭbaʿu llāhu ʿalā qulūbi lladhīna lā yaʿlamūn'
  trad: 'C''est ainsi qu''Allaah scelle (yaṭbaʿu) les cœurs de ceux qui ne savent pas.'
- ref: 'S.30:60'
  ar: 'فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ ۖ وَلَا يَسْتَخِفَّنَّكَ الَّذِينَ لَا يُوقِنُونَ'
  trl: 'Fa-ṣbir inna waʿda llāhi ḥaqqun wa-lā yastakhiffannaka lladhīna lā yūqinūn'
  trad: 'Prends donc patience (fa-ṣbir) — la promesse (waʿd) d''Allaah est vérité (ḥaqq) — et que ceux qui n''ont pas la certitude (lā yūqinūn) ne te rendent pas léger [dans ta détermination] (lā yastakhiffannaka).'
