- ref: S.17:1
  ar: سُبْحَانَ الَّذِي أَسْرَىٰ بِعَبْدِهِ لَيْلًا مِنَ الْمَسْجِدِ الْحَرَامِ إِلَى الْمَسْجِدِ الْأَقْصَى الَّذِي بَارَكْنَا حَوْلَهُ لِنُرِيَهُ مِنْ آيَاتِنَا ۚ إِنَّهُ هُوَ السَّمِيعُ الْبَصِيرُ
  trl: Subḥāna lladhī asrā bi-ʿabdihi laylan mina l-masjidi l-ḥarāmi ilā l-masjidi l-aqṣā lladhī bāraknā ḥawlahu li-nuriyahu min āyātinā innahu huwa s-samīʿu l-baṣīr
  trad: Il est dégagé de toute imperfection (subḥāna), Ce qui a fait voyager de nuit (asrā) Son ʿabd, du Masjid al-Ḥarām jusqu'au Masjid al-Aqṣā (le sanctuaire le plus éloigné), dont Nous avons placé la baraka alentour (bāraknā ḥawlahu), afin de lui montrer certains de Nos signes (āyātinā) — Il est, en vérité, Ce qui entend, Ce qui voit.
- ref: S.17:2
  ar: وَآتَيْنَا مُوسَى الْكِتَابَ وَجَعَلْنَاهُ هُدًى لِبَنِي إِسْرَائِيلَ أَلَّا تَتَّخِذُوا مِنْ دُونِي وَكِيلًا
  trl: Wa-ātaynā mūsā l-kitāba wa-jaʿalnāhu hudan li-banī isrāʾīla allā tattakhidhū min dūnī wakīlā
  trad: 'Et Nous avons donné à Mūsā le Kitāb, et Nous en avons fait une guidance (hudā) pour les Banū Isrāʾīl : « Ne prenez, en dehors de Moi, aucun wakīl (garant). »'
- ref: S.17:3
  ar: ذُرِّيَّةَ مَنْ حَمَلْنَا مَعَ نُوحٍ ۚ إِنَّهُ كَانَ عَبْدًا شَكُورًا
  trl: Dhurriyyata man ḥamalnā maʿa nūḥin innahu kāna ʿabdan shakūrā
  trad: '[Ô] descendance (dhurriyya) de ceux que Nous avons portés avec Nūḥ — il était certes un ʿabd empreint de gratitude (shakūrā).'
- ref: S.17:4
  ar: وَقَضَيْنَا إِلَىٰ بَنِي إِسْرَائِيلَ فِي الْكِتَابِ لَتُفْسِدُنَّ فِي الْأَرْضِ مَرَّتَيْنِ وَلَتَعْلُنَّ عُلُوًّا كَبِيرًا
  trl: Wa-qaḍaynā ilā banī isrāʾīla fi l-kitābi la-tufsidunna fi l-arḍi marratayni wa-la-taʿlunna ʿuluwwan kabīrā
  trad: 'Et Nous avons annoncé (qaḍaynā), dans le Kitāb, aux Banū Isrāʾīl : « Vous sèmerez assurément le fasād sur la terre, par deux fois, et vous vous élèverez assurément dans une arrogance immense (ʿuluwwan kabīrā). »'
- ref: S.17:5
  ar: فَإِذَا جَاءَ وَعْدُ أُولَاهُمَا بَعَثْنَا عَلَيْكُمْ عِبَادًا لَنَا أُولِي بَأْسٍ شَدِيدٍ فَجَاسُوا خِلَالَ الدِّيَارِ ۚ وَكَانَ وَعْدًا مَفْعُولًا
  trl: Fa-idhā jāʾa waʿdu ūlāhumā baʿathnā ʿalaykum ʿibādan lanā ūlī baʾsin shadīdin fa-jāsū khilāla d-diyāri wa-kāna waʿdan mafʿūlā
  trad: Puis, quand est venue la promesse (waʿd) de la première de ces deux [échéances], Nous avons envoyé contre vous des ʿibād à Nous, détenteurs d'une rigueur intense (ūlī baʾsin shadīd) — ils ont pénétré au cœur des demeures (fa-jāsū khilāla d-diyār) — et ce fut une promesse accomplie (waʿdan mafʿūlā).
- ref: S.17:6
  ar: ثُمَّ رَدَدْنَا لَكُمُ الْكَرَّةَ عَلَيْهِمْ وَأَمْدَدْنَاكُمْ بِأَمْوَالٍ وَبَنِينَ وَجَعَلْنَاكُمْ أَكْثَرَ نَفِيرًا
  trl: Thumma radadnā lakumu l-karrata ʿalayhim wa-amdadnākum bi-amwālin wa-banīna wa-jaʿalnākum akthara nafīrā
  trad: Puis Nous vous avons redonné le dessus (radadnā ... al-karrata) sur eux, et Nous vous avons soutenus (amdadnākum) par des biens et des fils, et Nous avons fait de vous un groupe plus nombreux en effectif (akthara nafīrā).
- ref: S.17:7
  ar: إِنْ أَحْسَنْتُمْ أَحْسَنْتُمْ لِأَنْفُسِكُمْ ۖ وَإِنْ أَسَأْتُمْ فَلَهَا ۚ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ لِيَسُوءُوا وُجُوهَكُمْ وَلِيَدْخُلُوا الْمَسْجِدَ كَمَا دَخَلُوهُ أَوَّلَ مَرَّةٍ وَلِيُتَبِّرُوا مَا عَلَوْا تَتْبِيرًا
  trl: In aḥsantum aḥsantum li-anfusikum wa-in asaʾtum fa-lahā fa-idhā jāʾa waʿdu l-ākhirati li-yasūʾū wujūhakum wa-li-yadkhulū l-masjida kamā dakhalūhu awwala marratin wa-li-yutabbirū mā ʿalaw tatbīrā
  trad: Si vous faites le bien, vous le faites pour vous-mêmes ; et si vous faites le mal, c'est contre elles-mêmes [vos âmes]. Puis, quand est venue la promesse de la seconde [échéance] — pour attrister vos visages, pour entrer dans la masjid comme ils y étaient entrés la première fois, et pour détruire entièrement (li-yutabbirū ... tatbīrā) ce dont ils s'étaient emparés (mā ʿalaw).
- ref: S.17:8
  ar: عَسَىٰ رَبُّكُمْ أَنْ يَرْحَمَكُمْ ۚ وَإِنْ عُدْتُمْ عُدْنَا ۘ وَجَعَلْنَا جَهَنَّمَ لِلْكَافِرِينَ حَصِيرًا
  trl: ʿAsā rabbukum an yarḥamakum wa-in ʿudtum ʿudnā wa-jaʿalnā jahannama li-l-kāfirīna ḥaṣīrā
  trad: Il se peut que votre Rabb vous fasse raḥma (yarḥamakum) — mais si vous récidivez (ʿudtum), Nous récidiverons (ʿudnā) — et Nous avons fait de Jahannam, pour les kāfirūn, un enclos qui cerne étroitement (ḥaṣīrā).
- ref: S.17:9
  ar: إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا
  trl: Inna hādhā l-qurʾāna yahdī li-llatī hiya aqwamu wa-yubashshiru l-muʾminīna lladhīna yaʿmalūna ṣ-ṣāliḥāti anna lahum ajran kabīrā
  trad: Ce Qurʾān-ci guide assurément vers ce qui est le plus droit (allatī hiya aqwam), et il annonce, aux muʾminūn qui accomplissent les œuvres justes (aṣ-ṣāliḥāt), qu'il y aura pour eux une rétribution considérable (ajran kabīrā).
- ref: S.17:10
  ar: وَأَنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًا
  trl: Wa-anna lladhīna lā yuʾminūna bi-l-ākhirati aʿtadnā lahum ʿadhāban alīmā
  trad: et que ceux qui ne croient pas en l'Ākhira, Nous leur avons préparé (aʿtadnā) un châtiment douloureux.
- ref: S.17:11
  ar: وَيَدْعُ الْإِنْسَانُ بِالشَّرِّ دُعَاءَهُ بِالْخَيْرِ ۖ وَكَانَ الْإِنْسَانُ عَجُولًا
  trl: Wa-yadʿu l-insānu bi-sh-sharri duʿāʾahu bi-l-khayri wa-kāna l-insānu ʿajūlā
  trad: Et l'humain invoque le mal avec la même promptitude qu'il invoque le bien — l'humain est porté à la hâte (ʿajūlā).
- ref: S.17:12
  ar: وَجَعَلْنَا اللَّيْلَ وَالنَّهَارَ آيَتَيْنِ ۖ فَمَحَوْنَا آيَةَ اللَّيْلِ وَجَعَلْنَا آيَةَ النَّهَارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسَابَ ۚ وَكُلَّ شَيْءٍ فَصَّلْنَاهُ تَفْصِيلًا
  trl: Wa-jaʿalnā l-layla wa-n-nahāra āyatayni fa-maḥawnā āyata l-layli wa-jaʿalnā āyata n-nahāri mubṣiratan li-tabtaghū faḍlan min rabbikum wa-li-taʿlamū ʿadada s-sinīna wa-l-ḥisāba wa-kulla shayʾin faṣṣalnāhu tafṣīlā
  trad: 'Et Nous avons fait de la nuit et du jour deux signes (āyatayn) : Nous avons effacé (maḥawnā) le signe de la nuit, et Nous avons fait du signe du jour ce qui rend visible (mubṣira), afin que vous recherchiez une faveur (faḍl) venant de votre Rabb, et que vous connaissiez le compte des années et le calcul (al-ḥisāb) — et Nous avons détaillé chaque chose en détail (faṣṣalnāhu tafṣīlā).'
- ref: S.17:13
  ar: وَكُلَّ إِنْسَانٍ أَلْزَمْنَاهُ طَائِرَهُ فِي عُنُقِهِ ۖ وَنُخْرِجُ لَهُ يَوْمَ الْقِيَامَةِ كِتَابًا يَلْقَاهُ مَنْشُورًا
  trl: Wa-kulla insānin alzamnāhu ṭāʾirahu fī ʿunuqihi wa-nukhriju lahu yawma l-qiyāmati kitāban yalqāhu manshūrā
  trad: Et à chaque humain, Nous avons attaché son ṭāʾir (son sort, l'empreinte de ses actes) à son cou (fī ʿunuqihi) — et Nous ferons sortir pour lui, au Jour de la Résurrection, un livre qu'il trouvera déployé (manshūrā).
- ref: S.17:14
  ar: اقْرَأْ كِتَابَكَ كَفَىٰ بِنَفْسِكَ الْيَوْمَ عَلَيْكَ حَسِيبًا
  trl: Iqraʾ kitābaka kafā bi-nafsika l-yawma ʿalayka ḥasībā
  trad: Lis ton livre (kitābaka) — il te suffit, aujourd'hui, d'être toi-même ton propre comptable (ḥasībā).
- ref: S.17:15
  ar: مَنِ اهْتَدَىٰ فَإِنَّمَا يَهْتَدِي لِنَفْسِهِ ۖ وَمَنْ ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا ۚ وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ ۗ وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا
  trl: Mani htadā fa-innamā yahtadī li-nafsihi wa-man ḍalla fa-innamā yaḍillu ʿalayhā wa-lā taziru wāziratun wizra ukhrā wa-mā kunnā muʿadhdhibīna ḥattā nabʿatha rasūlā
  trad: Qui se guide (ihtadā) ne se guide que pour lui-même, et qui s'égare (ḍalla) ne s'égare que contre lui-même — et nulle âme chargée (wāzira) ne porte le fardeau (wizr) d'une autre — et Nous ne châtions (muʿadhdhibīna) qu'après avoir envoyé un rasūl.
- ref: S.17:16
  ar: وَإِذَا أَرَدْنَا أَنْ نُهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا فَفَسَقُوا فِيهَا فَحَقَّ عَلَيْهَا الْقَوْلُ فَدَمَّرْنَاهَا تَدْمِيرًا
  trl: Wa-idhā aradnā an nuhlika qaryatan amarnā mutrafīhā fa-fasaqū fīhā fa-ḥaqqa ʿalayhā l-qawlu fa-dammarnāhā tadmīrā
  trad: Et quand Nous voulons faire périr une cité (qarya), Nous ordonnons à ses gens aisés (mutrafīhā) — mais ils y transgressent (fa-fasaqū) — alors la Parole (al-qawl) s'avère fondée contre elle, et Nous la détruisons alors totalement (tadmīrā).
- ref: S.17:17
  ar: وَكَمْ أَهْلَكْنَا مِنَ الْقُرُونِ مِنْ بَعْدِ نُوحٍ ۗ وَكَفَىٰ بِرَبِّكَ بِذُنُوبِ عِبَادِهِ خَبِيرًا بَصِيرًا
  trl: Wa-kam ahlaknā mina l-qurūni min baʿdi nūḥin wa-kafā bi-rabbika bi-dhunūbi ʿibādihi khabīran baṣīrā
  trad: Et combien de générations (qurūn) avons-Nous fait périr après Nūḥ ! Il suffit que ton Rabb soit, des péchés (dhunūb) de Ses ʿibād, empreint de pleine connaissance et de pleine vue (khabīran baṣīrā).
- ref: S.17:18
  ar: مَنْ كَانَ يُرِيدُ الْعَاجِلَةَ عَجَّلْنَا لَهُ فِيهَا مَا نَشَاءُ لِمَنْ نُرِيدُ ثُمَّ جَعَلْنَا لَهُ جَهَنَّمَ يَصْلَاهَا مَذْمُومًا مَدْحُورًا
  trl: Man kāna yurīdu l-ʿājilata ʿajjalnā lahu fīhā mā nashāʾu li-man nurīdu thumma jaʿalnā lahu jahannama yaṣlāhā madhmūman madḥūrā
  trad: Qui veut la [vie] immédiate (al-ʿājila), Nous lui hâtons (ʿajjalnā), dans cette vie, ce que Nous voulons pour qui Nous voulons — puis Nous lui destinons Jahannam, où il brûlera (yaṣlāhā), blâmé (madhmūmā) et repoussé (madḥūrā).
- ref: S.17:19
  ar: وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا
  trl: Wa-man arāda l-ākhirata wa-saʿā lahā saʿyahā wa-huwa muʾminun fa-ulāʾika kāna saʿyuhum mashkūrā
  trad: Et qui veut l'Ākhira et s'y efforce (saʿā ... saʿyahā) comme il se doit, tout en étant muʾmin — ceux-là, leur effort trouve reconnaissance (mashkūrā).
- ref: S.17:20
  ar: كُلًّا نُمِدُّ هَٰؤُلَاءِ وَهَٰؤُلَاءِ مِنْ عَطَاءِ رَبِّكَ ۚ وَمَا كَانَ عَطَاءُ رَبِّكَ مَحْظُورًا
  trl: Kullan numiddu hāʾulāʾi wa-hāʾulāʾi min ʿaṭāʾi rabbika wa-mā kāna ʿaṭāʾu rabbika maḥẓūrā
  trad: À tous, Nous accordons un soutien (numiddu) — à ceux-ci et à ceux-là — du don (ʿaṭāʾ) de ton Rabb ; et le don de ton Rabb n'est jamais retenu (maḥẓūrā).
- ref: S.17:21
  ar: انْظُرْ كَيْفَ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۚ وَلَلْآخِرَةُ أَكْبَرُ دَرَجَاتٍ وَأَكْبَرُ تَفْضِيلًا
  trl: Unẓur kayfa faḍḍalnā baʿḍahum ʿalā baʿḍin wa-la-l-ākhiratu akbaru darajātin wa-akbaru tafḍīlā
  trad: Regarde comment Nous avons favorisé (faḍḍalnā) certains d'entre eux par rapport à d'autres — et l'Ākhira est assurément plus grande en degrés (darajāt) et plus grande en faveur (tafḍīl).
- ref: S.17:22
  ar: لَا تَجْعَلْ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَتَقْعُدَ مَذْمُومًا مَخْذُولًا
  trl: Lā tajʿal maʿa llāhi ilāhan ākhara fa-taqʿuda madhmūman makhdhūlā
  trad: Ne place pas, avec Allaah, un autre ilāh — tu te retrouverais assis (taqʿuda), blâmé (madhmūmā) et abandonné (makhdhūlā).
- ref: S.17:23
  ar: ۞ وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا ۚ إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا
  trl: Wa-qaḍā rabbuka allā taʿbudū illā iyyāhu wa-bi-l-wālidayni iḥsānan immā yablughanna ʿindaka l-kibara aḥaduhumā aw kilāhumā fa-lā taqul lahumā uffin wa-lā tanharhumā wa-qul lahumā qawlan karīmā
  trad: Et ton Rabb a décrété (qaḍā) que vous ne rendiez votre adoration (ʿibāda) qu'à Lui seul, et [qu'il y ait], envers les deux parents (al-wālidayn), l'excellence (iḥsān) — si l'un des deux, ou tous deux, atteignent auprès de toi la vieillesse, ne leur dis pas « uff » [le moindre soupir d'agacement], ne les rabroue pas (lā tanharhumā), et adresse-leur une parole noble (qawlan karīmā).
- ref: S.17:24
  ar: وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا
  trl: Wa-khfiḍ lahumā janāḥa dh-dhulli mina r-raḥmati wa-qul rabbi rḥamhumā kamā rabbayānī ṣaghīrā
  trad: 'Et abaisse pour eux l''aile de la soumission humble (janāḥa dh-dhull), par raḥma — et dis : « Mon Rabb, fais-leur raḥma comme ils m''ont élevé (rabbayānī) tout petit. »'
- ref: S.17:25
  ar: رَبُّكُمْ أَعْلَمُ بِمَا فِي نُفُوسِكُمْ ۚ إِنْ تَكُونُوا صَالِحِينَ فَإِنَّهُ كَانَ لِلْأَوَّابِينَ غَفُورًا
  trl: Rabbukum aʿlamu bimā fī nufūsikum in takūnū ṣāliḥīna fa-innahu kāna li-l-awwābīna ghafūrā
  trad: Votre Rabb sait mieux ce qu'il y a dans vos âmes (nufūsikum) — si vous êtes intègres (ṣāliḥīn), Il est, envers ceux qui reviennent sans cesse [vers Lui] (al-awwābīn), Ce qui pardonne sans cesse (ghafūr).
- ref: S.17:26
  ar: وَآتِ ذَا الْقُرْبَىٰ حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا
  trl: Wa-āti dhā l-qurbā ḥaqqahu wa-l-miskīna wa-bna s-sabīli wa-lā tubadhdhir tabdhīrā
  trad: Et donne au proche (dhā l-qurbā) son droit (ḥaqqahu), ainsi qu'au miskīn et à l'ibn as-sabīl (le voyageur démuni) — et ne gaspille pas (lā tubadhdhir) à l'excès.
- ref: S.17:27
  ar: إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ ۖ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا
  trl: Inna l-mubadhdhirīna kānū ikhwāna sh-shayāṭīni wa-kāna sh-shayṭānu li-rabbihi kafūrā
  trad: Les gaspilleurs (al-mubadhdhirīn) sont les frères des shayāṭīn — et le shayṭān est, envers son Rabb, empreint d'un rejet obstiné (kafūrā).
- ref: S.17:28
  ar: وَإِمَّا تُعْرِضَنَّ عَنْهُمُ ابْتِغَاءَ رَحْمَةٍ مِنْ رَبِّكَ تَرْجُوهَا فَقُلْ لَهُمْ قَوْلًا مَيْسُورًا
  trl: Wa-immā tuʿriḍanna ʿanhumu btighāʾa raḥmatin min rabbika tarjūhā fa-qul lahum qawlan maysūrā
  trad: Et si tu dois t'écarter d'eux (tuʿriḍanna ʿanhum), en quête d'une raḥma venant de ton Rabb que tu espères (tarjūhā), dis-leur alors une parole aisée (qawlan maysūrā).
- ref: S.17:29
  ar: وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَحْسُورًا
  trl: Wa-lā tajʿal yadaka maghlūlatan ilā ʿunuqika wa-lā tabsuṭhā kulla l-basṭi fa-taqʿuda malūman maḥsūrā
  trad: Et ne fais pas de ta main quelque chose d'enchaîné (maghlūlatan) à ton cou, et ne l'étends pas non plus dans une extension totale (kulla l-basṭ) — tu te retrouverais alors blâmé (malūmā), dépouillé (maḥsūrā).
- ref: S.17:30
  ar: إِنَّ رَبَّكَ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ وَيَقْدِرُ ۚ إِنَّهُ كَانَ بِعِبَادِهِ خَبِيرًا بَصِيرًا
  trl: Inna rabbaka yabsuṭu r-rizqa li-man yashāʾu wa-yaqdiru innahu kāna bi-ʿibādihi khabīran baṣīrā
  trad: Ton Rabb étend (yabsuṭu) le rizq pour qui Il veut, et Il le mesure strictement (yaqdiru) — Il est, envers Ses ʿibād, empreint de pleine connaissance intime et de pleine vue (khabīran baṣīrā).
- ref: S.17:31
  ar: وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ ۖ نَحْنُ نَرْزُقُهُمْ وَإِيَّاكُمْ ۚ إِنَّ قَتْلَهُمْ كَانَ خِطْئًا كَبِيرًا
  trl: Wa-lā taqtulū awlādakum khashyata imlāqin naḥnu narzuquhum wa-iyyākum inna qatlahum kāna khiṭʾan kabīrā
  trad: Et ne tuez pas vos enfants par crainte de la pauvreté (khashyata imlāq) — c'est Nous qui les pourvoyons (narzuquhum), ainsi que vous — les tuer est assurément une faute grave (khiṭʾan kabīrā).
- ref: S.17:32
  ar: وَلَا تَقْرَبُوا الزِّنَا ۖ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا
  trl: Wa-lā taqrabū z-zinā innahu kāna fāḥishatan wa-sāʾa sabīlā
  trad: Et n'approchez pas la zinā (les rapports sexuels hors du cadre légitime) — elle est assurément une fāḥisha (une turpitude), et un mauvais chemin (sabīlā).
- ref: S.17:33
  ar: وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ ۗ وَمَنْ قُتِلَ مَظْلُومًا فَقَدْ جَعَلْنَا لِوَلِيِّهِ سُلْطَانًا فَلَا يُسْرِفْ فِي الْقَتْلِ ۖ إِنَّهُ كَانَ مَنْصُورًا
  trl: Wa-lā taqtulū n-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqqi wa-man qutila maẓlūman fa-qad jaʿalnā li-waliyyihi sulṭānan fa-lā yusrif fi l-qatli innahu kāna manṣūrā
  trad: Et ne tuez pas le nafs qu'Allaah a rendu inviolable (ḥarrama), sauf en toute légitimité (bi-l-ḥaqq) — et quiconque est tué injustement (maẓlūmā), Nous avons donné à son walī une autorité (sulṭānā) — mais qu'il ne commette pas d'excès (lā yusrif) dans la mise à mort — il est, assurément, soutenu (manṣūrā).
- ref: S.17:34
  ar: وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُ ۚ وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا
  trl: Wa-lā taqrabū māla l-yatīmi illā bi-llatī hiya aḥsanu ḥattā yablugha ashuddahu wa-awfū bi-l-ʿahdi inna l-ʿahda kāna masʾūlā
  trad: Et n'approchez le bien de l'orphelin (māl al-yatīm) que de la meilleure façon, jusqu'à ce qu'il atteigne sa pleine maturité (ashuddahu) — et tenez le pacte (al-ʿahd) — il sera assurément demandé compte du pacte (masʾūlā).
- ref: S.17:35
  ar: وَأَوْفُوا الْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ ۚ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا
  trl: Wa-awfū l-kayla idhā kiltum wa-zinū bi-l-qisṭāsi l-mustaqīmi dhālika khayrun wa-aḥsanu taʾwīlā
  trad: Et donnez pleine mesure (al-kayl) quand vous mesurez, et pesez avec la balance rigoureusement exacte (al-qisṭās al-mustaqīm) — cela est meilleur (khayr), et de plus belle issue (aḥsanu taʾwīlā).
- ref: S.17:36
  ar: وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا
  trl: Wa-lā taqfu mā laysa laka bihi ʿilmun inna s-samʿa wa-l-baṣara wa-l-fuʾāda kullu ulāʾika kāna ʿanhu masʾūlā
  trad: Et ne poursuis pas (lā taqfu) ce dont tu n'as pas de science (ʿilm) — l'ouïe, la vue et le fuʾād (le cœur, siège de l'affect), chacun d'eux sera assurément appelé à en répondre (masʾūlā).
- ref: S.17:37
  ar: وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا ۖ إِنَّكَ لَنْ تَخْرِقَ الْأَرْضَ وَلَنْ تَبْلُغَ الْجِبَالَ طُولًا
  trl: Wa-lā tamshi fi l-arḍi maraḥan innaka lan takhriqa l-arḍa wa-lan tablugha l-jibāla ṭūlā
  trad: Et ne marche pas sur la terre avec une insolence triomphante (maraḥan) — tu ne perceras (takhriqa) jamais la terre, et tu n'atteindras jamais les montagnes en hauteur (ṭūlā).
- ref: S.17:38
  ar: كُلُّ ذَٰلِكَ كَانَ سَيِّئُهُ عِنْدَ رَبِّكَ مَكْرُوهًا
  trl: Kullu dhālika kāna sayyiʾuhu ʿinda rabbika makrūhā
  trad: Tout cela, son mal (sayyiʾuhu) est, auprès de ton Rabb, chose rejetée (makrūhā).
- ref: S.17:39
  ar: ذَٰلِكَ مِمَّا أَوْحَىٰ إِلَيْكَ رَبُّكَ مِنَ الْحِكْمَةِ ۗ وَلَا تَجْعَلْ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَتُلْقَىٰ فِي جَهَنَّمَ مَلُومًا مَدْحُورًا
  trl: Dhālika mimmā awḥā ilayka rabbuka mina l-ḥikmati wa-lā tajʿal maʿa llāhi ilāhan ākhara fa-tulqā fī jahannama malūman madḥūrā
  trad: 'Cela fait partie de ce que ton Rabb t''a révélé (awḥā) comme ḥikma — et ne place pas, avec Allaah, un autre ilāh : tu serais alors jeté (tulqā) dans Jahannam, blâmé (malūmā) et repoussé (madḥūrā).'
- ref: S.17:40
  ar: أَفَأَصْفَاكُمْ رَبُّكُمْ بِالْبَنِينَ وَاتَّخَذَ مِنَ الْمَلَائِكَةِ إِنَاثًا ۚ إِنَّكُمْ لَتَقُولُونَ قَوْلًا عَظِيمًا
  trl: A-fa-aṣfākum rabbukum bi-l-banīna wa-ttakhadha mina l-malāʾikati ināthan innakum la-taqūlūna qawlan ʿaẓīmā
  trad: Votre Rabb vous aurait-Il donc préférés (aṣfākum) avec des fils, et Se serait-Il pris (ittakhadha), parmi les malāʾika, des filles ? Vous dites certes là une parole immense (qawlan ʿaẓīmā).
- ref: S.17:41
  ar: وَلَقَدْ صَرَّفْنَا فِي هَٰذَا الْقُرْآنِ لِيَذَّكَّرُوا وَمَا يَزِيدُهُمْ إِلَّا نُفُورًا
  trl: Wa-la-qad ṣarrafnā fī hādhā l-qurʾāni li-yadhdhakkarū wa-mā yazīduhum illā nufūrā
  trad: Et Nous avons certes exposé (ṣarrafnā) [le rappel], dans ce Qurʾān, sous des formes variées, pour qu'ils se rappellent — mais cela ne fait qu'accroître en eux la fuite (nufūrā).
- ref: S.17:42
  ar: قُلْ لَوْ كَانَ مَعَهُ آلِهَةٌ كَمَا يَقُولُونَ إِذًا لَابْتَغَوْا إِلَىٰ ذِي الْعَرْشِ سَبِيلًا
  trl: Qul law kāna maʿahu ālihatun ka-mā yaqūlūna idhan la-btaghaw ilā dhī l-ʿarshi sabīlā
  trad: 'Dis : « S''il y avait, avec Lui, d''autres āliha, comme ils le disent, ceux-là chercheraient alors certainement un chemin (sabīlā) vers Ce qui détient le ʿArsh (dhī l-ʿarsh). »'
- ref: S.17:43
  ar: سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يَقُولُونَ عُلُوًّا كَبِيرًا
  trl: Subḥānahu wa-taʿālā ʿammā yaqūlūna ʿuluwwan kabīrā
  trad: Il est dégagé de toute imperfection (subḥānahu), et Il transcende (taʿālā), d'une transcendance immense (ʿuluwwan kabīrā), ce qu'ils disent.
- ref: S.17:44
  ar: تُسَبِّحُ لَهُ السَّمَاوَاتُ السَّبْعُ وَالْأَرْضُ وَمَنْ فِيهِنَّ ۚ وَإِنْ مِنْ شَيْءٍ إِلَّا يُسَبِّحُ بِحَمْدِهِ وَلَٰكِنْ لَا تَفْقَهُونَ تَسْبِيحَهُمْ ۗ إِنَّهُ كَانَ حَلِيمًا غَفُورًا
  trl: Tusabbiḥu lahu s-samāwātu s-sabʿu wa-l-arḍu wa-man fīhinna wa-in min shayʾin illā yusabbiḥu bi-ḥamdihi wa-lākin lā tafqahūna tasbīḥahum innahu kāna ḥalīman ghafūrā
  trad: Les sept cieux accomplissent pour Lui la tasbīḥ, ainsi que la terre et ce qui s'y trouve — et il n'est nulle chose qui n'accomplisse la tasbīḥ dans Sa ḥamd — mais vous ne saisissez pas (lā tafqahūna) leur tasbīḥ. Il est certes Ḥalīm, Ghafūr.
- ref: S.17:45
  ar: وَإِذَا قَرَأْتَ الْقُرْآنَ جَعَلْنَا بَيْنَكَ وَبَيْنَ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ حِجَابًا مَسْتُورًا
  trl: Wa-idhā qaraʾta l-qurʾāna jaʿalnā baynaka wa-bayna lladhīna lā yuʾminūna bi-l-ākhirati ḥijāban mastūrā
  trad: Et quand tu récites le Qurʾān, Nous plaçons entre toi et ceux qui ne croient pas en l'Ākhira un voile (ḥijāb) qui se dérobe à eux (mastūrā).
- ref: S.17:46
  ar: وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَنْ يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْرًا ۚ وَإِذَا ذَكَرْتَ رَبَّكَ فِي الْقُرْآنِ وَحْدَهُ وَلَّوْا عَلَىٰ أَدْبَارِهِمْ نُفُورًا
  trl: Wa-jaʿalnā ʿalā qulūbihim akinnatan an yafqahūhu wa-fī ādhānihim waqran wa-idhā dhakarta rabbaka fi l-qurʾāni waḥdahu wallaw ʿalā adbārihim nufūrā
  trad: Et Nous avons placé sur leurs cœurs des voiles (akinnatan) qui les empêchent de le comprendre (yafqahūhu), et dans leurs oreilles un alourdissement (waqrā) — et quand tu évoques ton Rabb dans le Qurʾān, Lui seul (waḥdahu), ils tournent le dos (wallaw ʿalā adbārihim) en fuyant (nufūrā).
- ref: S.17:47
  ar: نَحْنُ أَعْلَمُ بِمَا يَسْتَمِعُونَ بِهِ إِذْ يَسْتَمِعُونَ إِلَيْكَ وَإِذْ هُمْ نَجْوَىٰ إِذْ يَقُولُ الظَّالِمُونَ إِنْ تَتَّبِعُونَ إِلَّا رَجُلًا مَسْحُورًا
  trl: Naḥnu aʿlamu bi-mā yastamiʿūna bihi idh yastamiʿūna ilayka wa-idh hum najwā idh yaqūlu ẓ-ẓālimūna in tattabiʿūna illā rajulan masḥūrā
  trad: 'Nous savons mieux (naḥnu aʿlamu) ce qu''ils écoutent, quand ils t''écoutent, et quand ils sont en concertation secrète (najwā) — quand les ẓālimūn disent : « Vous ne suivez qu''un homme ensorcelé (rajulan masḥūrā). »'
- ref: S.17:48
  ar: انْظُرْ كَيْفَ ضَرَبُوا لَكَ الْأَمْثَالَ فَضَلُّوا فَلَا يَسْتَطِيعُونَ سَبِيلًا
  trl: Unẓur kayfa ḍarabū laka l-amthāla fa-ḍallū fa-lā yastaṭīʿūna sabīlā
  trad: Regarde comment ils ont formulé (ḍarabū) des comparaisons (al-amthāl) à ton sujet — ils s'en sont ainsi égarés (ḍallū), et ne peuvent plus trouver de chemin (sabīlā).
- ref: S.17:49
  ar: وَقَالُوا أَإِذَا كُنَّا عِظَامًا وَرُفَاتًا أَإِنَّا لَمَبْعُوثُونَ خَلْقًا جَدِيدًا
  trl: Wa-qālū a-idhā kunnā ʿiẓāman wa-rufātan a-innā la-mabʿūthūna khalqan jadīdā
  trad: 'Et ils dirent : « Quand nous serons ossements (ʿiẓāmā) et débris épars (rufātā), serons-nous vraiment ressuscités (la-mabʿūthūna) en une création nouvelle ? »'
- ref: S.17:50
  ar: ۞ قُلْ كُونُوا حِجَارَةً أَوْ حَدِيدًا
  trl: Qul kūnū ḥijāratan aw ḥadīdā
  trad: 'Dis : « Fussiez-vous pierre (ḥijāra) ou fer (ḥadīd) —'
- ref: S.17:51
  ar: أَوْ خَلْقًا مِمَّا يَكْبُرُ فِي صُدُورِكُمْ ۚ فَسَيَقُولُونَ مَنْ يُعِيدُنَا ۖ قُلِ الَّذِي فَطَرَكُمْ أَوَّلَ مَرَّةٍ ۚ فَسَيُنْغِضُونَ إِلَيْكَ رُءُوسَهُمْ وَيَقُولُونَ مَتَىٰ هُوَ ۖ قُلْ عَسَىٰ أَنْ يَكُونَ قَرِيبًا
  trl: Aw khalqan mimmā yakburu fī ṣudūrikum fa-sa-yaqūlūna man yuʿīdunā quli lladhī faṭarakum awwala marratin fa-sa-yunghiḍūna ilayka ruʾūsahum wa-yaqūlūna matā huwa qul ʿasā an yakūna qarībā
  trad: '— ou toute création qui vous paraît la plus inconcevable (yakburu fī ṣudūrikum) — » ils diront alors : « Qui nous ramènera ? » Dis : « Ce qui vous a fait naître à l''existence (faṭarakum) une première fois. » Ils secoueront alors la tête vers toi (fa-sa-yunghiḍūna ilayka ruʾūsahum) et diront : « Quand cela sera-t-il ? » Dis : « Il se peut que ce soit proche. »'
- ref: S.17:52
  ar: يَوْمَ يَدْعُوكُمْ فَتَسْتَجِيبُونَ بِحَمْدِهِ وَتَظُنُّونَ إِنْ لَبِثْتُمْ إِلَّا قَلِيلًا
  trl: Yawma yadʿūkum fa-tastajībūna bi-ḥamdihi wa-taẕunnūna in labithtum illā qalīlā
  trad: Le jour où Il vous appellera, vous répondrez dans Sa ḥamd (bi-ḥamdihi) — et vous estimerez n'avoir demeuré [dans la mort] que peu de temps (illā qalīlā).
- ref: S.17:53
  ar: وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ ۚ إِنَّ الشَّيْطَانَ يَنْزَغُ بَيْنَهُمْ ۚ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنْسَانِ عَدُوًّا مُبِينًا
  trl: Wa-qul li-ʿibādī yaqūlū llatī hiya aḥsanu inna sh-shayṭāna yanzaghu baynahum inna sh-shayṭāna kāna li-l-insāni ʿaduwwan mubīnā
  trad: 'Et dis à Mes ʿibād : qu''ils disent ce qui est le meilleur (allatī hiya aḥsan) — le shayṭān sème la discorde (yanzaghu) entre eux — le shayṭān est certes, pour l''humain, un ennemi déclaré (ʿaduwwun mubīn).'
- ref: S.17:54
  ar: رَبُّكُمْ أَعْلَمُ بِكُمْ ۖ إِنْ يَشَأْ يَرْحَمْكُمْ أَوْ إِنْ يَشَأْ يُعَذِّبْكُمْ ۚ وَمَا أَرْسَلْنَاكَ عَلَيْهِمْ وَكِيلًا
  trl: Rabbukum aʿlamu bikum in yashaʾ yarḥamkum aw in yashaʾ yuʿadhdhibkum wa-mā arsalnāka ʿalayhim wakīlā
  trad: Votre Rabb vous connaît mieux [que vous-mêmes] (aʿlamu bikum) — s'Il veut, Il vous fait raḥma ; et s'Il veut, Il vous châtie. Et Nous ne t'avons pas envoyé comme wakīl sur eux.
- ref: S.17:55
  ar: وَرَبُّكَ أَعْلَمُ بِمَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ ۗ وَلَقَدْ فَضَّلْنَا بَعْضَ النَّبِيِّينَ عَلَىٰ بَعْضٍ ۖ وَآتَيْنَا دَاوُودَ زَبُورًا
  trl: Wa-rabbuka aʿlamu bi-man fi s-samāwāti wa-l-arḍi wa-la-qad faḍḍalnā baʿḍa n-nabiyyīna ʿalā baʿḍin wa-ātaynā dāwūda zabūrā
  trad: Et ton Rabb connaît mieux qui se trouve dans les cieux et la terre — et Nous avons certes favorisé (faḍḍalnā) certains nabiyyūn par rapport à d'autres — et Nous avons donné à Dāwūd le Zabūr.
- ref: S.17:56
  ar: قُلِ ادْعُوا الَّذِينَ زَعَمْتُمْ مِنْ دُونِهِ فَلَا يَمْلِكُونَ كَشْفَ الضُّرِّ عَنْكُمْ وَلَا تَحْوِيلًا
  trl: Quli dʿū lladhīna zaʿamtum min dūnihi fa-lā yamlikūna kashfa ḍ-ḍurri ʿankum wa-lā taḥwīlā
  trad: 'Dis : « Invoquez ceux que vous prétendez [être des āliha] (zaʿamtum) en dehors de Lui — ils ne détiennent (lā yamlikūna) ni le pouvoir d''écarter de vous le mal (kashfa ḍ-ḍurr), ni celui de le déplacer (taḥwīlā). »'
- ref: S.17:57
  ar: أُولَٰئِكَ الَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُ وَيَخَافُونَ عَذَابَهُ ۚ إِنَّ عَذَابَ رَبِّكَ كَانَ مَحْذُورًا
  trl: Ulāʾika lladhīna yadʿūna yabtaghūna ilā rabbihimu l-wasīlata ayyuhum aqrabu wa-yarjūna raḥmatahu wa-yakhāfūna ʿadhābahu inna ʿadhāba rabbika kāna maḥdhūrā
  trad: 'Ceux-là mêmes qu''ils invoquent recherchent activement (yabtaghūna), vers leur propre Rabb, le moyen de rapprochement (al-wasīla) — chacun d''eux cherchant à être le plus proche (aqrabu) — et espèrent Sa raḥma, et craignent Son châtiment : le châtiment de ton Rabb est certes à redouter (maḥdhūrā).'
- ref: S.17:58
  ar: وَإِنْ مِنْ قَرْيَةٍ إِلَّا نَحْنُ مُهْلِكُوهَا قَبْلَ يَوْمِ الْقِيَامَةِ أَوْ مُعَذِّبُوهَا عَذَابًا شَدِيدًا ۚ كَانَ ذَٰلِكَ فِي الْكِتَابِ مَسْطُورًا
  trl: Wa-in min qaryatin illā naḥnu muhlikūhā qabla yawmi l-qiyāmati aw muʿadhdhibūhā ʿadhāban shadīdan kāna dhālika fi l-kitābi masṭūrā
  trad: Et il n'est aucune cité (qarya) que Nous ne fassions périr (muhlikūhā) avant le Jour de la Résurrection, ou que Nous ne châtiions d'un châtiment sévère — cela est consigné (masṭūrā) dans le Kitāb.
- ref: S.17:59
  ar: وَمَا مَنَعَنَا أَنْ نُرْسِلَ بِالْآيَاتِ إِلَّا أَنْ كَذَّبَ بِهَا الْأَوَّلُونَ ۚ وَآتَيْنَا ثَمُودَ النَّاقَةَ مُبْصِرَةً فَظَلَمُوا بِهَا ۚ وَمَا نُرْسِلُ بِالْآيَاتِ إِلَّا تَخْوِيفًا
  trl: Wa-mā manaʿanā an nursila bi-l-āyāti illā an kadhdhaba bihā l-awwalūna wa-ātaynā thamūda n-nāqata mubṣiratan fa-ẕalamū bihā wa-mā nursilu bi-l-āyāti illā takhwīfā
  trad: Et rien ne Nous a empêchés (mā manaʿanā) d'envoyer les āyāt, sinon que les Anciens (al-awwalūn) les ont démenties (kadhdhaba) — et Nous avons donné à Thamūd la chamelle (an-nāqa), comme signe manifeste (mubṣiratan) — mais ils lui firent tort (ẓalamū bihā) — et Nous n'envoyons les āyāt qu'en avertissement (takhwīfā).
- ref: S.17:60
  ar: وَإِذْ قُلْنَا لَكَ إِنَّ رَبَّكَ أَحَاطَ بِالنَّاسِ ۚ وَمَا جَعَلْنَا الرُّؤْيَا الَّتِي أَرَيْنَاكَ إِلَّا فِتْنَةً لِلنَّاسِ وَالشَّجَرَةَ الْمَلْعُونَةَ فِي الْقُرْآنِ ۚ وَنُخَوِّفُهُمْ فَمَا يَزِيدُهُمْ إِلَّا طُغْيَانًا كَبِيرًا
  trl: Wa-idh qulnā laka inna rabbaka aḥāṭa bi-n-nāsi wa-mā jaʿalnā r-ruʾyā llatī araynāka illā fitnatan li-n-nāsi wa-sh-shajarata l-malʿūnata fi l-qurʾāni wa-nukhawwifuhum fa-mā yazīduhum illā ṭughyānan kabīrā
  trad: 'Et [souviens-toi] quand Nous t''avons dit : « Ton Rabb embrasse (aḥāṭa) [par Sa science] les gens » — et Nous n''avons fait de la vision (ar-ruʾyā) que Nous t''avons montrée qu''une épreuve (fitna) pour les gens, tout comme l''arbre maudit (ash-shajaratu l-malʿūna) mentionné dans ce Qurʾān — et Nous les mettons en garde (nukhawwifuhum), mais cela ne fait qu''accroître en eux une transgression immense (ṭughyānan kabīrā).'
- ref: S.17:61
  ar: وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ قَالَ أَأَسْجُدُ لِمَنْ خَلَقْتَ طِينًا
  trl: Wa-idh qulnā li-l-malāʾikati sjudū li-ādama fa-sajadū illā iblīsa qāla a-asjudu li-man khalaqta ṭīnā
  trad: 'Et [souviens-toi] quand Nous avons dit aux malāʾika : « Prosternez-vous devant Ādam » — ils se prosternèrent, sauf Iblīs : il dit : « Me prosternerais-je devant ce que Tu as créé d''argile (ṭīnā) ? »'
- ref: S.17:62
  ar: قَالَ أَرَأَيْتَكَ هَٰذَا الَّذِي كَرَّمْتَ عَلَيَّ لَئِنْ أَخَّرْتَنِ إِلَىٰ يَوْمِ الْقِيَامَةِ لَأَحْتَنِكَنَّ ذُرِّيَّتَهُ إِلَّا قَلِيلًا
  trl: Qāla a-raʾaytaka hādhā lladhī karramta ʿalayya la-in akhkhartani ilā yawmi l-qiyāmati la-aḥtanikanna dhurriyyatahu illā qalīlā
  trad: 'Il dit : « Considère (a-raʾaytaka) celui-ci que Tu as honoré (karramta) plus que moi (ʿalayya) — si Tu m''accordes un délai jusqu''au Jour de la Résurrection, j''entraînerai (la-aḥtanikanna) certes sa descendance, sauf un petit nombre. »'
- ref: S.17:63
  ar: قَالَ اذْهَبْ فَمَنْ تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَاؤُكُمْ جَزَاءً مَوْفُورًا
  trl: Qāla dhhab fa-man tabiʿaka minhum fa-inna jahannama jazāʾukum jazāʾan mawfūrā
  trad: 'Il dit : « Va — quiconque parmi eux te suivra, jahannam sera votre rétribution (jazāʾukum), une rétribution abondante (jazāʾan mawfūrā). »'
- ref: S.17:64
  ar: وَاسْتَفْزِزْ مَنِ اسْتَطَعْتَ مِنْهُمْ بِصَوْتِكَ وَأَجْلِبْ عَلَيْهِمْ بِخَيْلِكَ وَرَجِلِكَ وَشَارِكْهُمْ فِي الْأَمْوَالِ وَالْأَوْلَادِ وَعِدْهُمْ ۚ وَمَا يَعِدُهُمُ الشَّيْطَانُ إِلَّا غُرُورًا
  trl: Wa-stafziz mani staṭaʿta minhum bi-ṣawtika wa-ajlib ʿalayhim bi-khaylika wa-rajilika wa-shārikhum fi l-amwāli wa-l-awlādi wa-ʿidhum wa-mā yaʿiduhumu sh-shayṭānu illā ghurūrā
  trad: Et ébranle (istafziz) qui tu pourras d'entre eux par ta voix, rassemble (ajlib) contre eux ta cavalerie (khaylika) et ton infanterie (rajilika), associe-toi à eux (shārikhum) dans les biens et les enfants, et fais-leur des promesses — mais le shayṭān ne leur promet rien d'autre qu'un leurre (ghurūrā).
- ref: S.17:65
  ar: إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ ۚ وَكَفَىٰ بِرَبِّكَ وَكِيلًا
  trl: Inna ʿibādī laysa laka ʿalayhim sulṭānun wa-kafā bi-rabbika wakīlā
  trad: Mes ʿibād — tu n'as sur eux aucune emprise (sulṭānun) — et ton Rabb suffit comme wakīl.
- ref: S.17:66
  ar: رَبُّكُمُ الَّذِي يُزْجِي لَكُمُ الْفُلْكَ فِي الْبَحْرِ لِتَبْتَغُوا مِنْ فَضْلِهِ ۚ إِنَّهُ كَانَ بِكُمْ رَحِيمًا
  trl: Rabbukumu lladhī yuzjī lakumu l-fulka fi l-baḥri li-tabtaghū min faḍlihi innahu kāna bikum raḥīmā
  trad: Ce qui est votre Rabb fait voguer (yuzjī) pour vous les vaisseaux sur la mer, afin que vous recherchiez de Sa faveur (faḍlihi) — Il est certes, envers vous, empreint de raḥma (raḥīmā).
- ref: S.17:67
  ar: وَإِذَا مَسَّكُمُ الضُّرُّ فِي الْبَحْرِ ضَلَّ مَنْ تَدْعُونَ إِلَّا إِيَّاهُ ۖ فَلَمَّا نَجَّاكُمْ إِلَى الْبَرِّ أَعْرَضْتُمْ ۚ وَكَانَ الْإِنْسَانُ كَفُورًا
  trl: Wa-idhā massakumu ḍ-ḍurru fi l-baḥri ḍalla man tadʿūna illā iyyāhu fa-lammā najjākum ilā l-barri aʿraḍtum wa-kāna l-insānu kafūrā
  trad: Et quand le mal (aḍ-ḍurr) vous touche (massakumu) en mer, tous ceux que vous invoquez s'égarent (ḍalla), sauf Lui — puis, quand Il vous a sauvés (najjākum) vers la terre ferme, vous vous détournez (aʿraḍtum) — l'humain est certes ingrat (kafūrā).
- ref: S.17:68
  ar: أَفَأَمِنْتُمْ أَنْ يَخْسِفَ بِكُمْ جَانِبَ الْبَرِّ أَوْ يُرْسِلَ عَلَيْكُمْ حَاصِبًا ثُمَّ لَا تَجِدُوا لَكُمْ وَكِيلًا
  trl: A-fa-amintum an yakhsifa bikum jāniba l-barri aw yursila ʿalaykum ḥāṣiban thumma lā tajidū lakum wakīlā
  trad: Vous sentez-vous donc en sécurité (a-amintum) qu'Il ne vous fasse engloutir (yakhsifa bikum) [par] le flanc de la terre ferme, ou qu'Il n'envoie sur vous une tempête de pierres (ḥāṣibā), sans que vous trouviez ensuite, pour vous, aucun wakīl ?
- ref: S.17:69
  ar: أَمْ أَمِنْتُمْ أَنْ يُعِيدَكُمْ فِيهِ تَارَةً أُخْرَىٰ فَيُرْسِلَ عَلَيْكُمْ قَاصِفًا مِنَ الرِّيحِ فَيُغْرِقَكُمْ بِمَا كَفَرْتُمْ ۙ ثُمَّ لَا تَجِدُوا لَكُمْ عَلَيْنَا بِهِ تَبِيعًا
  trl: Am amintum an yuʿīdakum fīhi tāratan ukhrā fa-yursila ʿalaykum qāṣifan mina r-rīḥi fa-yughriqakum bi-mā kafartum thumma lā tajidū lakum ʿalaynā bihi tabīʿā
  trad: Ou vous sentez-vous en sécurité qu'Il ne vous y ramène (yuʿīdakum) une autre fois, et n'envoie sur vous un vent destructeur (qāṣifan mina r-rīḥ), et ne vous noie (yughriqakum) pour avoir mécru (bi-mā kafartum), sans que vous trouviez ensuite, contre Nous, quiconque pour vous en demander compte (tabīʿā) ?
- ref: S.17:70
  ar: ۞ وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا
  trl: Wa-la-qad karramnā banī ādama wa-ḥamalnāhum fi l-barri wa-l-baḥri wa-razaqnāhum mina ṭ-ṭayyibāti wa-faḍḍalnāhum ʿalā kathīrin mimman khalaqnā tafḍīlā
  trad: Et Nous avons certes honoré (karramnā) les fils d'Ādam — Nous les avons portés (ḥamalnāhum) sur la terre ferme et sur la mer, leur avons accordé comme subsistance des ṭayyibāt, et les avons favorisés (faḍḍalnāhum) sur beaucoup (kathīr) de ce que Nous avons créé, d'une préférence marquée (tafḍīlā).
- ref: S.17:71
  ar: يَوْمَ نَدْعُو كُلَّ أُنَاسٍ بِإِمَامِهِمْ ۖ فَمَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ فَأُولَٰئِكَ يَقْرَءُونَ كِتَابَهُمْ وَلَا يُظْلَمُونَ فَتِيلًا
  trl: Yawma nadʿū kulla unāsin bi-imāmihim fa-man ūtiya kitābahu bi-yamīnihi fa-ulāʾika yaqraʾūna kitābahum wa-lā yuẕlamūna fatīlā
  trad: Le jour où Nous appellerons chaque groupe humain (kulla unāsin) avec son imām — quiconque recevra son kitāb dans sa main droite (bi-yamīnihi), ceux-là liront leur kitāb, et ne subiront aucun tort, pas même d'un fatīl (fatīlā).
- ref: S.17:72
  ar: وَمَنْ كَانَ فِي هَٰذِهِ أَعْمَىٰ فَهُوَ فِي الْآخِرَةِ أَعْمَىٰ وَأَضَلُّ سَبِيلًا
  trl: Wa-man kāna fī hādhihi aʿmā fa-huwa fi l-ākhirati aʿmā wa-aḍallu sabīlā
  trad: Et quiconque est aveugle (aʿmā) en cette [vie], celui-là sera, dans l'Ākhira, aveugle, et plus égaré encore quant au chemin (aḍallu sabīlā).
- ref: S.17:73
  ar: وَإِنْ كَادُوا لَيَفْتِنُونَكَ عَنِ الَّذِي أَوْحَيْنَا إِلَيْكَ لِتَفْتَرِيَ عَلَيْنَا غَيْرَهُ ۖ وَإِذًا لَاتَّخَذُوكَ خَلِيلًا
  trl: Wa-in kādū la-yaftinūnaka ʿani lladhī awḥaynā ilayka li-taftariya ʿalaynā ghayrahu wa-idhan la-ttakhadhūka khalīlā
  trad: Et ils ont certes été bien près de te détourner (la-yaftinūnaka), par l'épreuve, de ce que Nous t'avons révélé, pour que tu inventes (li-taftariya) contre Nous autre chose que cela — et alors ils t'auraient pris comme khalīl.
- ref: S.17:74
  ar: وَلَوْلَا أَنْ ثَبَّتْنَاكَ لَقَدْ كِدْتَ تَرْكَنُ إِلَيْهِمْ شَيْئًا قَلِيلًا
  trl: Wa-lawlā an thabbatnāka la-qad kidta tarkanu ilayhim shayʾan qalīlā
  trad: Et si Nous ne t'avions pas affermi (thabbatnāka), tu aurais certes été près de t'incliner (tarkanu) vers eux, quelque peu (shayʾan qalīlā).
- ref: S.17:75
  ar: إِذًا لَأَذَقْنَاكَ ضِعْفَ الْحَيَاةِ وَضِعْفَ الْمَمَاتِ ثُمَّ لَا تَجِدُ لَكَ عَلَيْنَا نَصِيرًا
  trl: Idhan la-adhaqnāka ḏiʿfa l-ḥayāti wa-ḏiʿfa l-mamāti thumma lā tajidu laka ʿalaynā naṣīrā
  trad: Alors, Nous t'aurions certes fait goûter (la-adhaqnāka) le double [du châtiment] de cette vie, et le double [du châtiment] de la mort — puis tu n'aurais trouvé, contre Nous, aucun secours (naṣīrā).
- ref: S.17:76
  ar: وَإِنْ كَادُوا لَيَسْتَفِزُّونَكَ مِنَ الْأَرْضِ لِيُخْرِجُوكَ مِنْهَا ۖ وَإِذًا لَا يَلْبَثُونَ خِلَافَكَ إِلَّا قَلِيلًا
  trl: Wa-in kādū la-yastafizzūnaka mina l-arḍi li-yukhrijūka minhā wa-idhan lā yalbathūna khilāfaka illā qalīlā
  trad: Et ils ont certes été bien près de t'ébranler (la-yastafizzūnaka) hors de cette terre, pour t'en faire sortir — et alors, ils n'y seraient demeurés après toi (khilāfaka), qu'un peu de temps.
- ref: S.17:77
  ar: سُنَّةَ مَنْ قَدْ أَرْسَلْنَا قَبْلَكَ مِنْ رُسُلِنَا ۖ وَلَا تَجِدُ لِسُنَّتِنَا تَحْوِيلًا
  trl: Sunnata man qad arsalnā qablaka min rusulinā wa-lā tajidu li-sunnatinā taḥwīlā
  trad: '[Telle est] la sunna de ceux que Nous avons envoyés avant toi parmi Nos messagers — et tu ne trouveras, à Notre sunna, aucun changement (taḥwīlā).'
- ref: S.17:78
  ar: أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَىٰ غَسَقِ اللَّيْلِ وَقُرْآنَ الْفَجْرِ ۖ إِنَّ قُرْآنَ الْفَجْرِ كَانَ مَشْهُودًا
  trl: Aqimi ṣ-ṣalāta li-dulūki sh-shamsi ilā ghasaqi l-layli wa-qurʾāna l-fajri inna qurʾāna l-fajri kāna mashhūdā
  trad: Établis la ṣalāt depuis le déclin du soleil (dulūki sh-shams) jusqu'à l'obscurcissement de la nuit (ghasaqi l-layl), ainsi que la récitation de l'aube (qurʾāna l-fajr) — la récitation de l'aube est certes assistée (mashhūdā).
- ref: S.17:79
  ar: وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَكَ عَسَىٰ أَنْ يَبْعَثَكَ رَبُّكَ مَقَامًا مَحْمُودًا
  trl: Wa-mina l-layli fa-tahajjad bihi nāfilatan laka ʿasā an yabʿathaka rabbuka maqāman maḥmūdā
  trad: Et de la nuit, veille (tahajjad) par lui [le Qurʾān], en surcroît pour toi (nāfilatan laka) — il se peut que ton Rabb te fasse accéder à une position empreinte de ḥamd (maqāman maḥmūdā).
- ref: S.17:80
  ar: وَقُلْ رَبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَلْ لِي مِنْ لَدُنْكَ سُلْطَانًا نَصِيرًا
  trl: Wa-qul rabbi adkhilnī mudkhala ṣidqin wa-akhrijnī mukhraja ṣidqin wa-jʿal lī min ladunka sulṭānan naṣīrā
  trad: 'Et dis : « Mon Rabb, fais-moi entrer par une entrée de vérité (mudkhala ṣidq), et fais-moi sortir par une sortie de vérité (mukhraja ṣidq), et accorde-moi, de Ta part (min ladunka), un pouvoir secourable (sulṭānan naṣīrā). »'
- ref: S.17:81
  ar: وَقُلْ جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ ۚ إِنَّ الْبَاطِلَ كَانَ زَهُوقًا
  trl: Wa-qul jāʾa l-ḥaqqu wa-zahaqa l-bāṭilu inna l-bāṭila kāna zahūqā
  trad: 'Et dis : « Le ḥaqq est venu, et le bāṭil s''est dissipé (zahaqa) — le bāṭil est certes destiné à se dissiper (zahūqā). »'
- ref: S.17:82
  ar: وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ ۙ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا
  trl: Wa-nunazzilu mina l-qurʾāni mā huwa shifāʾun wa-raḥmatun li-l-muʾminīna wa-lā yazīdu ẕ-ẕālimīna illā khasārā
  trad: Et Nous faisons descendre, du Qurʾān, ce qui est shifāʾ (guérison) et raḥma pour les muʾminūn — mais cela ne fait qu'accroître les ẓālimūn en khasār (perte).
- ref: S.17:83
  ar: وَإِذَا أَنْعَمْنَا عَلَى الْإِنْسَانِ أَعْرَضَ وَنَأَىٰ بِجَانِبِهِ ۖ وَإِذَا مَسَّهُ الشَّرُّ كَانَ يَئُوسًا
  trl: Wa-idhā anʿamnā ʿalā l-insāni aʿraḍa wa-nāʾā bi-jānibihi wa-idhā massahu sh-sharru kāna yaʾūsā
  trad: Et quand Nous accordons un bienfait à l'humain, il se détourne (aʿraḍa) et s'écarte, distant (nāʾā bi-jānibihi) — et quand le mal (ash-sharr) le touche, il devient désespéré (yaʾūsā).
- ref: S.17:84
  ar: قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا
  trl: Qul kullun yaʿmalu ʿalā shākilatihi fa-rabbukum aʿlamu bi-man huwa ahdā sabīlā
  trad: 'Dis : « Chacun agit selon sa shākila (sa manière propre) — votre Rabb connaît mieux qui est le mieux guidé quant au chemin. »'
- ref: S.17:85
  ar: وَيَسْأَلُونَكَ عَنِ الرُّوحِ ۖ قُلِ الرُّوحُ مِنْ أَمْرِ رَبِّي وَمَا أُوتِيتُمْ مِنَ الْعِلْمِ إِلَّا قَلِيلًا
  trl: Wa-yasʾalūnaka ʿani r-rūḥi quli r-rūḥu min amri rabbī wa-mā ūtītum mina l-ʿilmi illā qalīlā
  trad: 'Et ils t''interrogent sur le Rūḥ — dis : « Le Rūḥ relève de l''amr (l''affaire, l''ordre propre) de mon Rabb — et vous n''avez reçu de la science que peu de chose. »'
- ref: S.17:86
  ar: وَلَئِنْ شِئْنَا لَنَذْهَبَنَّ بِالَّذِي أَوْحَيْنَا إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِ عَلَيْنَا وَكِيلًا
  trl: Wa-la-in shiʾnā la-nadhhabanna bi-lladhī awḥaynā ilayka thumma lā tajidu laka bihi ʿalaynā wakīlā
  trad: Et si Nous voulions, Nous retirerions certainement ce que Nous t'avons révélé — puis tu ne trouverais, à ce sujet, aucun wakīl contre Nous.
- ref: S.17:87
  ar: إِلَّا رَحْمَةً مِنْ رَبِّكَ ۚ إِنَّ فَضْلَهُ كَانَ عَلَيْكَ كَبِيرًا
  trl: Illā raḥmatan min rabbika inna faḏlahu kāna ʿalayka kabīrā
  trad: Si ce n'est par raḥma de ton Rabb — Sa faveur (faḍluhu) envers toi est certes immense.
- ref: S.17:88
  ar: قُلْ لَئِنِ اجْتَمَعَتِ الْإِنْسُ وَالْجِنُّ عَلَىٰ أَنْ يَأْتُوا بِمِثْلِ هَٰذَا الْقُرْآنِ لَا يَأْتُونَ بِمِثْلِهِ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍ ظَهِيرًا
  trl: Qul la-ini jtamaʿati l-insu wa-l-jinnu ʿalā an yaʾtū bi-mithli hādhā l-qurʾāni lā yaʾtūna bi-mithlihi wa-law kāna baʿḏuhum li-baʿḏin ẕahīrā
  trad: 'Dis : « Si les humains et les jinn s''unissaient pour produire l''équivalent de ce Qurʾān, ils n''en produiraient pas l''équivalent, même si les uns étaient pour les autres un soutien (ẓahīrā). »'
- ref: S.17:89
  ar: وَلَقَدْ صَرَّفْنَا لِلنَّاسِ فِي هَٰذَا الْقُرْآنِ مِنْ كُلِّ مَثَلٍ فَأَبَىٰ أَكْثَرُ النَّاسِ إِلَّا كُفُورًا
  trl: Wa-la-qad ṣarrafnā li-n-nāsi fī hādhā l-qurʾāni min kulli mathalin fa-abā aktharu n-nāsi illā kufūrā
  trad: Et Nous avons certes exposé (ṣarrafnā), pour les gens, dans ce Qurʾān, toute sorte de mathal — mais la plupart des gens n'ont persisté que dans le kufūr (le refus obstiné).
- ref: S.17:90
  ar: وَقَالُوا لَنْ نُؤْمِنَ لَكَ حَتَّىٰ تَفْجُرَ لَنَا مِنَ الْأَرْضِ يَنْبُوعًا
  trl: Wa-qālū lan nuʾmina laka ḥattā tafjura lanā mina l-arḍi yanbūʿā
  trad: 'Et ils dirent : « Nous ne croirons pas en toi, jusqu''à ce que tu fasses jaillir (tafjura), pour nous, de la terre, une source (yanbūʿā) —'
- ref: S.17:91
  ar: أَوْ تَكُونَ لَكَ جَنَّةٌ مِنْ نَخِيلٍ وَعِنَبٍ فَتُفَجِّرَ الْأَنْهَارَ خِلَالَهَا تَفْجِيرًا
  trl: Aw takūna laka jannatun min nakhīlin wa-ʿinabin fa-tufajjira l-anhāra khilālahā tafjīrā
  trad: — ou que tu aies un jardin (janna) de palmiers et de vignes, et que tu y fasses jaillir des rivières en abondance (tafjīrā) —
- ref: S.17:92
  ar: أَوْ تُسْقِطَ السَّمَاءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِيَ بِاللَّهِ وَالْمَلَائِكَةِ قَبِيلًا
  trl: Aw tusqiṭa s-samāʾa kamā zaʿamta ʿalaynā kisafan aw taʾtiya bi-llāhi wa-l-malāʾikati qabīlā
  trad: — ou que tu fasses tomber sur nous le ciel en morceaux (kisafan), comme tu l'as prétendu (zaʿamta) — ou que tu amènes Allaah et les malāʾika devant nous, face à face (qabīlā) —
- ref: S.17:93
  ar: أَوْ يَكُونَ لَكَ بَيْتٌ مِنْ زُخْرُفٍ أَوْ تَرْقَىٰ فِي السَّمَاءِ وَلَنْ نُؤْمِنَ لِرُقِيِّكَ حَتَّىٰ تُنَزِّلَ عَلَيْنَا كِتَابًا نَقْرَؤُهُ ۗ قُلْ سُبْحَانَ رَبِّي هَلْ كُنْتُ إِلَّا بَشَرًا رَسُولًا
  trl: Aw yakūna laka baytun min zukhrufin aw tarqā fi s-samāʾi wa-lan nuʾmina li-ruqiyyika ḥattā tunazzila ʿalaynā kitāban naqraʾuhu qul subḥāna rabbī hal kuntu illā basharan rasūlā
  trad: '— ou que tu aies une maison d''or (zukhruf) — ou que tu montes au ciel (tarqā fi s-samāʾ) ; et nous ne croirons pas à ta montée (ruqiyyika), jusqu''à ce que tu fasses descendre sur nous un kitāb que nous puissions lire. » Dis : « Mon Rabb est dégagé de toute imperfection (subḥāna rabbī) — suis-je autre chose qu''un être humain (basharan), un rasūl ? »'
- ref: S.17:94
  ar: وَمَا مَنَعَ النَّاسَ أَنْ يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ إِلَّا أَنْ قَالُوا أَبَعَثَ اللَّهُ بَشَرًا رَسُولًا
  trl: Wa-mā manaʿa n-nāsa an yuʾminū idh jāʾahumu l-hudā illā an qālū a-baʿatha llāhu basharan rasūlā
  trad: 'Et rien n''a empêché les gens de croire, quand la guidance (al-hudā) leur est venue, sinon qu''ils dirent : « Allaah aurait-Il envoyé un être humain (bashar), un rasūl ? »'
- ref: S.17:95
  ar: قُلْ لَوْ كَانَ فِي الْأَرْضِ مَلَائِكَةٌ يَمْشُونَ مُطْمَئِنِّينَ لَنَزَّلْنَا عَلَيْهِمْ مِنَ السَّمَاءِ مَلَكًا رَسُولًا
  trl: Qul law kāna fi l-arḏi malāʾikatun yamshūna muṭmaʾinnīna la-nazzalnā ʿalayhim mina s-samāʾi malakan rasūlā
  trad: 'Dis : « S''il y avait sur terre des anges (malāʾika) marchant en toute tranquillité (muṭmaʾinnīn), Nous aurions fait descendre sur eux, du ciel, un ange (malak), un rasūl. »'
- ref: S.17:96
  ar: قُلْ كَفَىٰ بِاللَّهِ شَهِيدًا بَيْنِي وَبَيْنَكُمْ ۚ إِنَّهُ كَانَ بِعِبَادِهِ خَبِيرًا بَصِيرًا
  trl: Qul kafā billāhi shahīdan baynī wa-baynakum innahu kāna bi-ʿibādihi khabīran baṣīrā
  trad: 'Dis : « Allaah suffit comme témoin (shahīd) entre moi et vous — Il est, envers Ses ʿibād, Khabīr (parfaitement informé), Baṣīr. »'
- ref: S.17:97
  ar: وَمَنْ يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ ۖ وَمَنْ يُضْلِلْ فَلَنْ تَجِدَ لَهُمْ أَوْلِيَاءَ مِنْ دُونِهِ ۖ وَنَحْشُرُهُمْ يَوْمَ الْقِيَامَةِ عَلَىٰ وُجُوهِهِمْ عُمْيًا وَبُكْمًا وَصُمًّا ۖ مَأْوَاهُمْ جَهَنَّمُ ۖ كُلَّمَا خَبَتْ زِدْنَاهُمْ سَعِيرًا
  trl: Wa-man yahdi llāhu fa-huwa l-muhtadi wa-man yuḏlil fa-lan tajida lahum awliyāʾa min dūnihi wa-naḥshuruhum yawma l-qiyāmati ʿalā wujūhihim ʿumyan wa-bukman wa-ṣumman maʾwāhum jahannamu kullamā khabat zidnāhum saʿīrā
  trad: Et quiconque Allaah guide, celui-là est bien guidé (al-muhtad) ; et quiconque Il égare, tu ne trouveras pour eux aucun walī en dehors de Lui — et Nous les rassemblerons, au Jour de la Résurrection, sur leurs visages (ʿalā wujūhihim), aveugles, muets et sourds — leur asile (maʾwā) sera Jahannam ; chaque fois qu'il s'apaise (khabat), Nous leur ajoutons un embrasement (saʿīr).
- ref: S.17:98
  ar: ذَٰلِكَ جَزَاؤُهُمْ بِأَنَّهُمْ كَفَرُوا بِآيَاتِنَا وَقَالُوا أَإِذَا كُنَّا عِظَامًا وَرُفَاتًا أَإِنَّا لَمَبْعُوثُونَ خَلْقًا جَدِيدًا
  trl: Dhālika jazāʾuhum bi-annahum kafarū bi-āyātinā wa-qālū a-idhā kunnā ʿiẓāman wa-rufātan a-innā la-mabʿūthūna khalqan jadīdā
  trad: 'Cela est leur rétribution (jazāʾ), parce qu''ils ont nié Nos āyāt, et dirent : « Quand nous serons ossements (ʿiẓāmā) et débris épars (rufātā), serons-nous vraiment ressuscités (la-mabʿūthūna) en une création nouvelle ? »'
- ref: S.17:99
  ar: ۞ أَوَلَمْ يَرَوْا أَنَّ اللَّهَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ قَادِرٌ عَلَىٰ أَنْ يَخْلُقَ مِثْلَهُمْ وَجَعَلَ لَهُمْ أَجَلًا لَا رَيْبَ فِيهِ فَأَبَى الظَّالِمُونَ إِلَّا كُفُورًا
  trl: A-wa-lam yaraw anna llāha lladhī khalaqa s-samāwāti wa-l-arḏa qādirun ʿalā an yakhluqa mithlahum wa-jaʿala lahum ajalan lā rayba fīhi fa-abā ẕ-ẕālimūna illā kufūrā
  trad: N'ont-ils donc pas vu qu'Allaah — Ce qui a créé les cieux et la terre — est capable (qādir) de créer leur semblable (mithlahum), et [qu'Il] leur a fixé un terme (ajal) sur lequel il n'y a aucun doute ? Mais les ẕālimūn n'ont persisté que dans le kufūr.
- ref: S.17:100
  ar: قُلْ لَوْ أَنْتُمْ تَمْلِكُونَ خَزَائِنَ رَحْمَةِ رَبِّي إِذًا لَأَمْسَكْتُمْ خَشْيَةَ الْإِنْفَاقِ ۚ وَكَانَ الْإِنْسَانُ قَتُورًا
  trl: Qul law antum tamlikūna khazāʾina raḥmati rabbī idhan la-amsaktum khashyata l-infāqi wa-kāna l-insānu qatūrā
  trad: 'Dis : « Si vous possédiez les trésors (khazāʾin) de la raḥma de mon Rabb, alors vous les retiendriez (la-amsaktum) par crainte de dépenser (khashyata l-infāq) — l''être humain est, par nature, avare (qatūr). »'
- ref: S.17:101
  ar: وَلَقَدْ آتَيْنَا مُوسَىٰ تِسْعَ آيَاتٍ بَيِّنَاتٍ ۖ فَاسْأَلْ بَنِي إِسْرَائِيلَ إِذْ جَاءَهُمْ فَقَالَ لَهُ فِرْعَوْنُ إِنِّي لَأَظُنُّكَ يَا مُوسَىٰ مَسْحُورًا
  trl: Wa-la-qad ātaynā mūsā tisʿa āyātin bayyinātin fa-sʾal banī isrāʾīla idh jāʾahum fa-qāla lahu firʿawnu innī la-aẕunnuka yā mūsā masḥūrā
  trad: 'Et Nous avons certes donné à Mūsā neuf āyāt évidentes (bayyināt) — interroge donc les Banū Isrāʾīl, lorsqu''il vint à eux — et Firʿawn lui dit : « Je pense assurément, ô Mūsā, que tu es ensorcelé (masḥūr). »'
- ref: S.17:102
  ar: قَالَ لَقَدْ عَلِمْتَ مَا أَنْزَلَ هَٰؤُلَاءِ إِلَّا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ بَصَائِرَ وَإِنِّي لَأَظُنُّكَ يَا فِرْعَوْنُ مَثْبُورًا
  trl: Qāla la-qad ʿalimta mā anzala hāʾulāʾi illā rabbu s-samāwāti wa-l-arḏi baṣāʾira wa-innī la-aẕunnuka yā firʿawnu mathbūrā
  trad: 'Il dit : « Tu sais bien que seul le Rabb des cieux et de la terre a fait descendre ceux-ci, comme preuves manifestes (baṣāʾir) — et je pense assurément, ô Firʿawn, que tu es perdu (mathbūr). »'
- ref: S.17:103
  ar: فَأَرَادَ أَنْ يَسْتَفِزَّهُمْ مِنَ الْأَرْضِ فَأَغْرَقْنَاهُ وَمَنْ مَعَهُ جَمِيعًا
  trl: Fa-arāda an yastafizzahum mina l-arḏi fa-aghraqnāhu wa-man maʿahu jamīʿā
  trad: Il voulut alors les ébranler (yastafizzahum) hors de cette terre — mais Nous le noyâmes (aghraqnāhu), lui et tous ceux qui étaient avec lui.
- ref: S.17:104
  ar: وَقُلْنَا مِنْ بَعْدِهِ لِبَنِي إِسْرَائِيلَ اسْكُنُوا الْأَرْضَ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ جِئْنَا بِكُمْ لَفِيفًا
  trl: Wa-qulnā min baʿdihi li-banī isrāʾīla skunū l-arḏa fa-idhā jāʾa waʿdu l-ākhirati jiʾnā bikum lafīfā
  trad: 'Et Nous dîmes, après lui, aux Banū Isrāʾīl : « Habitez cette terre » — puis, quand viendra la promesse de l''Ākhira, Nous vous ferons venir tous ensemble, mêlés (lafīfā).'
- ref: S.17:105
  ar: وَبِالْحَقِّ أَنْزَلْنَاهُ وَبِالْحَقِّ نَزَلَ ۗ وَمَا أَرْسَلْنَاكَ إِلَّا مُبَشِّرًا وَنَذِيرًا
  trl: Wa-bi-l-ḥaqqi anzalnāhu wa-bi-l-ḥaqqi nazala wa-mā arsalnāka illā mubashshiran wa-naẕīrā
  trad: Et par le ḥaqq Nous l'avons fait descendre, et par le ḥaqq il est descendu — et Nous ne t'avons envoyé que comme annonciateur (mubashshir) et avertisseur (naẕīr).
- ref: S.17:106
  ar: وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَىٰ مُكْثٍ وَنَزَّلْنَاهُ تَنْزِيلًا
  trl: Wa-qurʾānan faraqnāhu li-taqraʾahu ʿalā n-nāsi ʿalā mukthin wa-nazzalnāhu tanzīlā
  trad: Et [c'est] un Qurʾān que Nous avons fractionné (faraqnāhu), pour que tu le récites aux gens avec une progression mesurée (ʿalā mukth) — et Nous l'avons fait descendre par étapes successives (tanzīlā).
- ref: S.17:107
  ar: قُلْ آمِنُوا بِهِ أَوْ لَا تُؤْمِنُوا ۚ إِنَّ الَّذِينَ أُوتُوا الْعِلْمَ مِنْ قَبْلِهِ إِذَا يُتْلَىٰ عَلَيْهِمْ يَخِرُّونَ لِلْأَذْقَانِ سُجَّدًا
  trl: Qul āminū bihi aw lā tuʾminū inna lladhīna ūtū l-ʿilma min qablihi idhā yutlā ʿalayhim yakhirrūna li-l-adhqāni sujjadā
  trad: 'Dis : « Croyez-y, ou n''y croyez pas » — ceux à qui la science (al-ʿilm) fut donnée avant lui (min qablihi), quand il leur est récité, tombent sur le menton (li-l-adhqān), prosternés (sujjadā).'
- ref: S.17:108
  ar: وَيَقُولُونَ سُبْحَانَ رَبِّنَا إِنْ كَانَ وَعْدُ رَبِّنَا لَمَفْعُولًا
  trl: Wa-yaqūlūna subḥāna rabbinā in kāna waʿdu rabbinā la-mafʿūlā
  trad: 'Et ils disent : « Gloire à notre Rabb (subḥāna rabbinā) — la promesse de notre Rabb est assurément accomplie (la-mafʿūlā). »'
- ref: S.17:109
  ar: وَيَخِرُّونَ لِلْأَذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعًا ۩
  trl: Wa-yakhirrūna li-l-adhqāni yabkūna wa-yazīduhum khushūʿā
  trad: Et ils tombent sur le menton, en pleurant (yabkūna), et cela leur accroît une humilité profonde (khushūʿ).
- ref: S.17:110
  ar: قُلِ ادْعُوا اللَّهَ أَوِ ادْعُوا الرَّحْمَٰنَ ۖ أَيًّا مَا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ ۚ وَلَا تَجْهَرْ بِصَلَاتِكَ وَلَا تُخَافِتْ بِهَا وَابْتَغِ بَيْنَ ذَٰلِكَ سَبِيلًا
  trl: Quli dʿū llāha awi dʿū r-raḥmāna ayyan mā tadʿū fa-lahu l-asmāʾu l-ḥusnā wa-lā tajhar bi-ṣalātika wa-lā tukhāfit bihā wa-btaghi bayna dhālika sabīlā
  trad: 'Dis : « Invoquez Allaah, ou invoquez ar-Raḥmān — quel que soit [le Nom] par lequel vous invoquez, à Lui appartiennent les Noms de la plus grande excellence (al-asmāʾ al-ḥusnā). » Et ne sois pas retentissant (lā tajhar) dans ta ṣalāt, et ne la murmure pas (lā tukhāfit) — et cherche, entre les deux, une voie (sabīlā).'
- ref: S.17:111
  ar: وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُنْ لَهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُنْ لَهُ وَلِيٌّ مِنَ الذُّلِّ ۖ وَكَبِّرْهُ تَكْبِيرًا
  trl: Wa-quli l-ḥamdu lillāhi lladhī lam yattakhidh waladan wa-lam yakun lahu sharīkun fi l-mulki wa-lam yakun lahu waliyyun mina dh-dhulli wa-kabbirhu takbīrā
  trad: 'Et dis : « La ḥamd est à Allaah, Ce qui n''a pas pris de walad (enfant), Ce qui n''a pas de sharīk (associé) dans le mulk (la pleine souveraineté), et Ce qui n''a pas de walī [pour Le protéger] d''un abaissement (adh-dhull) » — et magnifie-Le d''une pleine magnification (kabbirhu takbīrā).'
