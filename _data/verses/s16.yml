- ref: S.16:1
  ar: أَتَىٰ أَمْرُ اللَّهِ فَلَا تَسْتَعْجِلُوهُ ۚ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ
  trl: Atā amru llāhi fa-lā tastaʿjilūhu — subḥānahu wa-taʿālā ʿammā yushrikūn
  trad: L'amr (l'ordre, ce qui doit advenir) d'Allaah vient — ne cherchez donc pas à le hâter. Il est dégagé de toute imperfection (subḥānahu), et Il transcende (taʿālā) ce qu'ils Lui associent.
- ref: S.16:2
  ar: يُنَزِّلُ الْمَلَائِكَةَ بِالرُّوحِ مِنْ أَمْرِهِ عَلَىٰ مَنْ يَشَاءُ مِنْ عِبَادِهِ أَنْ أَنْذِرُوا أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاتَّقُونِ
  trl: Yunazzilu l-malāʾikata bi-r-rūḥi min amrihi ʿalā man yashāʾu min ʿibādihi an andhirū annahu lā ilāha illā anā fa-ttaqūni
  trad: 'Il fait descendre les anges (al-malāʾika), avec le rūḥ, par Son amr, sur qui Il veut parmi Ses ʿibād (Ses serviteurs) : « Avertissez qu''il n''y a nul ilāh sinon Moi — craignez-Moi donc (fa-ttaqūni). »'
- ref: S.16:3
  ar: خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ ۚ تَعَالَىٰ عَمَّا يُشْرِكُونَ
  trl: Khalaqa s-samāwāti wa-l-arḍa bi-l-ḥaqqi — taʿālā ʿammā yushrikūn
  trad: Il a créé les cieux et la terre par le ḥaqq — Il transcende ce qu'ils Lui associent.
- ref: S.16:4
  ar: خَلَقَ الْإِنْسَانَ مِنْ نُطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُبِينٌ
  trl: Khalaqa l-insāna min nuṭfatin fa-idhā huwa khaṣīmun mubīn
  trad: Il a créé l'humain (al-insān) d'une nuṭfa (une goutte de liquide) — et le voici, disputeur (khaṣīm) manifeste.
- ref: S.16:5
  ar: وَالْأَنْعَامَ خَلَقَهَا ۗ لَكُمْ فِيهَا دِفْءٌ وَمَنَافِعُ وَمِنْهَا تَأْكُلُونَ
  trl: Wa-l-anʿāma khalaqahā — lakum fīhā difʾun wa-manāfiʿu wa-minhā taʾkulūn
  trad: Et les anʿām (les troupeaux), Il les a créés — pour vous, il y a en eux une chaleur (difʾ) et des utilités (manāfiʿ), et vous en mangez.
- ref: S.16:6
  ar: وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ
  trl: Wa-lakum fīhā jamālun ḥīna turīḥūna wa-ḥīna tasraḥūn
  trad: Et il y a pour vous, en elles, une beauté (jamāl), au moment où vous les ramenez le soir (turīḥūna) et au moment où vous les menez paître le matin (tasraḥūn).
- ref: S.16:7
  ar: وَتَحْمِلُ أَثْقَالَكُمْ إِلَىٰ بَلَدٍ لَمْ تَكُونُوا بَالِغِيهِ إِلَّا بِشِقِّ الْأَنْفُسِ ۚ إِنَّ رَبَّكُمْ لَرَءُوفٌ رَحِيمٌ
  trl: Wa-taḥmilu athqālakum ilā baladin lam takūnū bālighīhi illā bi-shiqqi l-anfusi — inna rabbakum la-raʾūfun raḥīm
  trad: Et elles portent vos charges (athqāl) vers un pays que vous n'auriez atteint qu'au prix d'une peine extrême sur vous-mêmes (bi-shiqqi l-anfus) — votre Rabb est certes Raʾūf, Raḥīm.
- ref: S.16:8
  ar: وَالْخَيْلَ وَالْبِغَالَ وَالْحَمِيرَ لِتَرْكَبُوهَا وَزِينَةً ۚ وَيَخْلُقُ مَا لَا تَعْلَمُونَ
  trl: Wa-l-khayla wa-l-bighāla wa-l-ḥamīra li-tarkabūhā wa-zīnatan — wa-yakhluqu mā lā taʿlamūn
  trad: Et les chevaux, les mulets, les ânes — pour que vous les montiez, et comme parure (zīna) — et Il crée ce que vous ne savez pas.
- ref: S.16:9
  ar: وَعَلَى اللَّهِ قَصْدُ السَّبِيلِ وَمِنْهَا جَائِرٌ ۚ وَلَوْ شَاءَ لَهَدَاكُمْ أَجْمَعِينَ
  trl: Wa-ʿalā llāhi qaṣdu s-sabīli wa-minhā jāʾirun — wa-law shāʾa la-hadākum ajmaʿīn
  trad: Et il incombe à Allaah [de montrer] la rectitude du chemin (qaṣdu s-sabīl) — et parmi [les chemins], il en est qui s'écartent (jāʾir) — et s'Il avait voulu, Il vous aurait tous guidés.
- ref: S.16:10–11
  ar: هُوَ الَّذِي أَنْزَلَ مِنَ السَّمَاءِ مَاءً ۖ لَكُمْ مِنْهُ شَرَابٌ وَمِنْهُ شَجَرٌ فِيهِ تُسِيمُونَ ۝ يُنْبِتُ لَكُمْ بِهِ الزَّرْعَ وَالزَّيْتُونَ وَالنَّخِيلَ وَالْأَعْنَابَ وَمِنْ كُلِّ الثَّمَرَاتِ ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً لِقَوْمٍ يَتَفَكَّرُونَ
  trl: Huwa lladhī anzala mina s-samāʾi māʾan — lakum minhu sharābun wa-minhu shajarun fīhi tusīmūn · Yunbitu lakum bihi z-zarʿa wa-z-zaytūna wa-n-nakhīla wa-l-aʿnāba wa-min kulli th-thamarāti — inna fī dhālika la-āyatan li-qawmin yatafakkarūn
  trad: Ce qui a fait descendre du ciel une eau — pour vous il en vient une boisson, et il en vient une végétation (shajar) où vous menez paître vos troupeaux (tusīmūn). Il fait pousser pour vous, par elle, la culture (az-zarʿ), l'olivier, le palmier, les vignes, et de tout fruit — il y a certes là un signe (āya) pour un peuple qui réfléchit.
- ref: S.16:12–13
  ar: وَسَخَّرَ لَكُمُ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ ۖ وَالنُّجُومُ مُسَخَّرَاتٌ بِأَمْرِهِ ۗ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَعْقِلُونَ ۝ وَمَا ذَرَأَ لَكُمْ فِي الْأَرْضِ مُخْتَلِفًا أَلْوَانُهُ ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً لِقَوْمٍ يَذَّكَّرُونَ
  trl: Wa-sakhkhara lakumu l-layla wa-n-nahāra wa-sh-shamsa wa-l-qamara — wa-n-nujūmu musakhkharātun bi-amrihi — inna fī dhālika la-āyātin li-qawmin yaʿqilūn · Wa-mā dharaʾa lakum fi l-arḍi mukhtalifan alwānuhu — inna fī dhālika la-āyatan li-qawmin yadhdhakkarūn
  trad: Et Il a assujetti (sakhkhara) pour vous la nuit et le jour, le soleil et la lune ; et les étoiles sont assujetties (musakhkharāt) par Son amr — il y a certes là des signes pour un peuple qui raisonne (yaʿqilūn). Et ce qu'Il a disséminé (dharaʾa) pour vous sur la terre, aux couleurs variées — il y a certes là un signe pour un peuple qui se souvient (yadhdhakkarūn).
- ref: S.16:14
  ar: وَهُوَ الَّذِي سَخَّرَ الْبَحْرَ لِتَأْكُلُوا مِنْهُ لَحْمًا طَرِيًّا وَتَسْتَخْرِجُوا مِنْهُ حِلْيَةً تَلْبَسُونَهَا وَتَرَى الْفُلْكَ مَوَاخِرَ فِيهِ وَلِتَبْتَغُوا مِنْ فَضْلِهِ وَلَعَلَّكُمْ تَشْكُرُونَ
  trl: Wa-huwa lladhī sakhkhara l-baḥra li-taʾkulū minhu laḥman ṭariyyan wa-tastakhrijū minhu ḥilyatan talbasūnahā wa-tara l-fulka mawākhira fīhi wa-li-tabtaghū min faḍlihi wa-laʿallakum tashkurūn
  trad: Et Ce qui a assujetti la mer, pour que vous en mangiez une chair fraîche (laḥman ṭariyyan), et que vous en extrayiez une parure (ḥilya) que vous portez ; et tu vois les vaisseaux (al-fulk) fendant les flots (mawākhir) en elle ; et pour que vous cherchiez de Sa faveur (faḍl) — et peut-être serez-vous reconnaissants (tashkurūn).
- ref: S.16:15–16
  ar: وَأَلْقَىٰ فِي الْأَرْضِ رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ وَأَنْهَارًا وَسُبُلًا لَعَلَّكُمْ تَهْتَدُونَ ۝ وَعَلَامَاتٍ ۚ وَبِالنَّجْمِ هُمْ يَهْتَدُونَ
  trl: Wa-alqā fi l-arḍi rawāsiya an tamīda bikum wa-anhāran wa-subulan laʿallakum tahtadūn · Wa-ʿalāmātin — wa-bi-n-najmi hum yahtadūn
  trad: Et Il a placé (alqā) sur la terre des montagnes ancrées (rawāsiya), afin qu'elle ne vacille pas avec vous (an tamīda bikum), et des rivières, et des chemins — peut-être serez-vous guidés (tahtadūn). Et des repères (ʿalāmāt) — et par l'étoile (an-najm), ils se guident.
- ref: S.16:17
  ar: أَفَمَنْ يَخْلُقُ كَمَنْ لَا يَخْلُقُ ۗ أَفَلَا تَذَكَّرُونَ
  trl: A-fa-man yakhluqu ka-man lā yakhluqu — a-fa-lā tadhakkarūn
  trad: Ce qui crée est-Il donc comparable à ce qui ne crée pas ? — Ne vous souviendrez-vous donc pas ?
- ref: S.16:18
  ar: وَإِنْ تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا ۗ إِنَّ اللَّهَ لَغَفُورٌ رَحِيمٌ
  trl: Wa-in taʿuddū niʿmata llāhi lā tuḥṣūhā — inna llāha la-ghafūrun raḥīm
  trad: Et si vous comptiez le bienfait (niʿma) d'Allaah, vous ne pourriez le dénombrer (lā tuḥṣūhā) — Allaah est certes Ghafūr, Raḥīm.
- ref: S.16:19
  ar: وَاللَّهُ يَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ
  trl: Wa-llāhu yaʿlamu mā tusirrūna wa-mā tuʿlinūn
  trad: Et Allaah sait ce que vous cachez (tusirrūn) et ce que vous divulguez (tuʿlinūn).
- ref: S.16:20–21
  ar: وَالَّذِينَ يَدْعُونَ مِنْ دُونِ اللَّهِ لَا يَخْلُقُونَ شَيْئًا وَهُمْ يُخْلَقُونَ ۝ أَمْوَاتٌ غَيْرُ أَحْيَاءٍ ۖ وَمَا يَشْعُرُونَ أَيَّانَ يُبْعَثُونَ
  trl: Wa-lladhīna yadʿūna min dūni llāhi lā yakhluqūna shayʾan wa-hum yukhlaqūn · Amwātun ghayru aḥyāʾin — wa-mā yashʿurūna ayyāna yubʿathūn
  trad: Et ceux qu'ils invoquent en dehors d'Allaah (min dūni llāh) ne créent rien — et ce sont eux-mêmes qui sont créés. [Ils sont] morts (amwāt), non vivants (ghayru aḥyāʾ) — et ils ne perçoivent (yashʿurūn) même pas quand ils seront ressuscités.
- ref: S.16:22–23
  ar: إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۚ فَالَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ قُلُوبُهُمْ مُنْكِرَةٌ وَهُمْ مُسْتَكْبِرُونَ ۝ لَا جَرَمَ أَنَّ اللَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ ۚ إِنَّهُ لَا يُحِبُّ الْمُسْتَكْبِرِينَ
  trl: Ilāhukum ilāhun wāḥid — fa-lladhīna lā yuʾminūna bi-l-ākhirati qulūbuhum munkiratun wa-hum mustakbirūn · Lā jarama anna llāha yaʿlamu mā yusirrūna wa-mā yuʿlinūn — innahu lā yuḥibbu l-mustakbirīn
  trad: Votre ilāh est un ilāh unique (wāḥid) — ceux qui ne croient pas en l'Ākhira, leurs cœurs sont dans le déni (munkira), et ils sont pleins d'orgueil (mustakbirūn). Nul doute (lā jarama) qu'Allaah sait ce qu'ils cachent et ce qu'ils divulguent — Allaah n'honore pas (lā yuḥibbu) les orgueilleux (al-mustakbirīn).
- ref: S.16:24–25
  ar: وَإِذَا قِيلَ لَهُمْ مَاذَا أَنْزَلَ رَبُّكُمْ ۙ قَالُوا أَسَاطِيرُ الْأَوَّلِينَ ۝ لِيَحْمِلُوا أَوْزَارَهُمْ كَامِلَةً يَوْمَ الْقِيَامَةِ ۙ وَمِنْ أَوْزَارِ الَّذِينَ يُضِلُّونَهُمْ بِغَيْرِ عِلْمٍ ۗ أَلَا سَاءَ مَا يَزِرُونَ
  trl: Wa-idhā qīla lahum mādhā anzala rabbukum — qālū asāṭīru l-awwalīn · Li-yaḥmilū awzārahum kāmilatan yawma l-qiyāmati — wa-min awzāri lladhīna yuḍillūnahum bi-ghayri ʿilmin — alā sāʾa mā yazirūn
  trad: 'Et quand on leur dit : « Qu''a fait descendre votre Rabb ? », ils disent : « Des légendes des anciens (asāṭīr al-awwalīn). » [Cela,] pour qu''ils portent leurs fardeaux (awzār) entiers (kāmila) au Jour de la Résurrection (yawm al-qiyāma), et une part des fardeaux de ceux qu''ils égarent (yuḍillūnahum) sans savoir (bi-ghayri ʿilm) — combien est mauvais ce qu''ils portent comme charge (yazirūn) !'
- ref: S.16:26–27
  ar: قَدْ مَكَرَ الَّذِينَ مِنْ قَبْلِهِمْ فَأَتَى اللَّهُ بُنْيَانَهُمْ مِنَ الْقَوَاعِدِ فَخَرَّ عَلَيْهِمُ السَّقْفُ مِنْ فَوْقِهِمْ وَأَتَاهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ ۝ ثُمَّ يَوْمَ الْقِيَامَةِ يُخْزِيهِمْ وَيَقُولُ أَيْنَ شُرَكَائِيَ الَّذِينَ كُنْتُمْ تُشَاقُّونَ فِيهِمْ ۚ قَالَ الَّذِينَ أُوتُوا الْعِلْمَ إِنَّ الْخِزْيَ الْيَوْمَ وَالسُّوءَ عَلَى الْكَافِرِينَ
  trl: Qad makara lladhīna min qablihim fa-atā llāhu bunyānahum mina l-qawāʿidi fa-kharra ʿalayhimu s-saqfu min fawqihim wa-atāhumu l-ʿadhābu min ḥaythu lā yashʿurūn · Thumma yawma l-qiyāmati yukhzīhim wa-yaqūlu ayna shurakāʾiya lladhīna kuntum tushāqqūna fīhim — qāla lladhīna ūtū l-ʿilma inna l-khizya l-yawma wa-s-sūʾa ʿalā l-kāfirīn
  trad: 'Ceux d''avant eux ont certes usé de manœuvre (makara) — Allaah a alors atteint leur édifice (bunyān) par ses fondations (qawāʿid) : le toit s''est effondré sur eux d''en haut, et le châtiment (al-ʿadhāb) leur est venu d''où ils ne le pressentaient pas (min ḥaythu lā yashʿurūn). Puis, au Jour de la Résurrection, Il les couvre d''ignominie (yukhzīhim) et dit : « Où sont Mes associés (shurakāʾiya), au sujet desquels vous vous opposiez (tushāqqūna) ? » Ceux à qui la connaissance (al-ʿilm) a été donnée disent : « L''ignominie (al-khizy), aujourd''hui, et le mal (as-sūʾ), sont sur les kāfirīn. »'
- ref: S.16:28
  ar: الَّذِينَ تَتَوَفَّاهُمُ الْمَلَائِكَةُ ظَالِمِي أَنْفُسِهِمْ ۖ فَأَلْقَوُا السَّلَمَ مَا كُنَّا نَعْمَلُ مِنْ سُوءٍ ۚ بَلَىٰ إِنَّ اللَّهَ عَلِيمٌ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Alladhīna tatawaffāhumu l-malāʾikatu ẓālimī anfusihim — fa-alqawi s-salama mā kunnā naʿmalu min sūʾin — balā inna llāha ʿalīmun bimā kuntum taʿmalūn
  trad: 'Ceux que les anges font mourir (tatawaffāhumu) alors qu''ils se sont fait tort à eux-mêmes (ẓālimī anfusihim) — ils offrent alors leur soumission (fa-alqawi s-salam) : « Nous ne faisions aucun mal ! » — Que si ! (balā) Allaah est certes connaissant (ʿalīm) de ce que vous faisiez.'
- ref: S.16:29
  ar: فَادْخُلُوا أَبْوَابَ جَهَنَّمَ خَالِدِينَ فِيهَا ۖ فَلَبِئْسَ مَثْوَى الْمُتَكَبِّرِينَ
  trl: Fa-dkhulū abwāba jahannama khālidīna fīhā — fa-la-biʾsa mathwā l-mutakabbirīn
  trad: Entrez donc par les portes de Jahannam, y demeurant éternellement (khālidīna fīhā) — combien est mauvais le séjour (mathwā) des orgueilleux (al-mutakabbirīn) !
- ref: S.16:30
  ar: ۞ وَقِيلَ لِلَّذِينَ اتَّقَوْا مَاذَا أَنْزَلَ رَبُّكُمْ ۚ قَالُوا خَيْرًا ۗ لِلَّذِينَ أَحْسَنُوا فِي هَٰذِهِ الدُّنْيَا حَسَنَةٌ ۚ وَلَدَارُ الْآخِرَةِ خَيْرٌ ۚ وَلَنِعْمَ دَارُ الْمُتَّقِينَ
  trl: Wa-qīla li-lladhīna ttaqaw mādhā anzala rabbukum — qālū khayran — li-lladhīna aḥsanū fī hādhihi d-dunyā ḥasanatun — wa-la-dāru l-ākhirati khayrun — wa-la-niʿma dāru l-muttaqīn
  trad: 'Et il fut dit à ceux qui ont pratiqué le taqwā (ittaqaw) : « Qu''a fait descendre votre Rabb ? » Ils dirent : « Un bien (khayran). » Pour ceux qui ont agi avec excellence (aḥsanū) dans cette vie d''ici-bas, il y a une belle part (ḥasana) — et la demeure de l''Ākhira est certes meilleure (khayr) — et combien elle est excellente, la demeure des muttaqīn !'
- ref: S.16:31
  ar: جَنَّاتُ عَدْنٍ يَدْخُلُونَهَا تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ۖ لَهُمْ فِيهَا مَا يَشَاءُونَ ۚ كَذَٰلِكَ يَجْزِي اللَّهُ الْمُتَّقِينَ
  trl: Jannātu ʿadnin yadkhulūnahā tajrī min taḥtihā l-anhāru — lahum fīhā mā yashāʾūna — kadhālika yajzī llāhu l-muttaqīn
  trad: '[Cette demeure ce sont] les jannātu ʿadn (les jardins d''ʿAdn), qu''ils entreront, sous lesquels coulent les rivières — ils y ont ce qu''ils veulent — c''est ainsi qu''Allaah rétribue (yajzī) les muttaqīn.'
- ref: S.16:32
  ar: الَّذِينَ تَتَوَفَّاهُمُ الْمَلَائِكَةُ طَيِّبِينَ ۙ يَقُولُونَ سَلَامٌ عَلَيْكُمُ ادْخُلُوا الْجَنَّةَ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Alladhīna tatawaffāhumu l-malāʾikatu ṭayyibīna — yaqūlūna salāmun ʿalaykumu dkhulū l-jannata bimā kuntum taʿmalūn
  trad: 'Ceux que les anges font mourir (tatawaffāhumu) purs (ṭayyibīn) — ils leur disent : « Paix sur vous — entrez dans la Janna pour ce que vous faisiez. »'
- ref: S.16:33
  ar: هَلْ يَنْظُرُونَ إِلَّا أَنْ تَأْتِيَهُمُ الْمَلَائِكَةُ أَوْ يَأْتِيَ أَمْرُ رَبِّكَ ۚ كَذَٰلِكَ فَعَلَ الَّذِينَ مِنْ قَبْلِهِمْ ۚ وَمَا ظَلَمَهُمُ اللَّهُ وَلَٰكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ
  trl: Hal yanẓurūna illā an taʾtiyahumu l-malāʾikatu aw yaʾtiya amru rabbika — kadhālika faʿala lladhīna min qablihim — wa-mā ẓalamahumu llāhu wa-lākin kānū anfusahum yaẓlimūn
  trad: N'attendent-ils sinon que les anges viennent à eux, ou que vienne l'amr (l'ordre) de ton Rabb ? C'est ainsi qu'ont agi ceux d'avant eux — Allaah ne leur a fait aucun tort, mais ils se faisaient tort à eux-mêmes.
- ref: S.16:34
  ar: فَأَصَابَهُمْ سَيِّئَاتُ مَا عَمِلُوا وَحَاقَ بِهِمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ
  trl: Fa-aṣābahum sayyiʾātu mā ʿamilū wa-ḥāqa bihim mā kānū bihi yastahziʾūn
  trad: Alors les méfaits (sayyiʾāt) de ce qu'ils faisaient les ont atteints, et s'est abattu sur eux (ḥāqa bihim) ce dont ils se moquaient (yastahziʾūn).
- ref: S.16:35
  ar: وَقَالَ الَّذِينَ أَشْرَكُوا لَوْ شَاءَ اللَّهُ مَا عَبَدْنَا مِنْ دُونِهِ مِنْ شَيْءٍ نَحْنُ وَلَا آبَاؤُنَا وَلَا حَرَّمْنَا مِنْ دُونِهِ مِنْ شَيْءٍ ۚ كَذَٰلِكَ فَعَلَ الَّذِينَ مِنْ قَبْلِهِمْ ۚ فَهَلْ عَلَى الرُّسُلِ إِلَّا الْبَلَاغُ الْمُبِينُ
  trl: Wa-qāla lladhīna ashrakū law shāʾa llāhu mā ʿabadnā min dūnihi min shayʾin naḥnu wa-lā ābāʾunā wa-lā ḥarramnā min dūnihi min shayʾin — kadhālika faʿala lladhīna min qablihim — fa-hal ʿalā r-rusuli illā l-balāghu l-mubīn
  trad: 'Et ceux qui ont commis le shirk ont dit : « Si Allaah avait voulu, nous n''aurions rien adoré en dehors de Lui — ni nous, ni nos pères — et nous n''aurions rien interdit en dehors de Lui. » C''est ainsi qu''ont agi ceux d''avant eux — or, qu''incombe-t-il aux rusul sinon la transmission manifeste (al-balāgh al-mubīn) ?'
- ref: S.16:36
  ar: وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ ۖ فَمِنْهُمْ مَنْ هَدَى اللَّهُ وَمِنْهُمْ مَنْ حَقَّتْ عَلَيْهِ الضَّلَالَةُ ۚ فَسِيرُوا فِي الْأَرْضِ فَانْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُكَذِّبِينَ
  trl: Wa-la-qad baʿathnā fī kulli ummatin rasūlan ani ʿbudū llāha wa-jtanibū ṭ-ṭāghūta — fa-minhum man hadā llāhu wa-minhum man ḥaqqat ʿalayhi ḍ-ḍalālatu — fa-sīrū fī l-arḍi fa-nẓurū kayfa kāna ʿāqibatu l-mukadhdhibīn
  trad: 'Et Nous avons certes envoyé, dans chaque umma, un rasūl [portant ce message] : « Adorez Allaah et évitez le ṭāghūt. » Parmi eux il en est que Allaah a guidés (hadā), et parmi eux il en est sur qui l''égarement (aḍ-ḍalāla) s''est confirmé (ḥaqqat) — parcourez donc la terre, puis regardez quelle a été la fin de ceux qui ont démenti.'
- ref: S.16:37
  ar: إِنْ تَحْرِصْ عَلَىٰ هُدَاهُمْ فَإِنَّ اللَّهَ لَا يَهْدِي مَنْ يُضِلُّ ۖ وَمَا لَهُمْ مِنْ نَاصِرِينَ
  trl: In taḥriṣ ʿalā hudāhum fa-inna llāha lā yahdī man yuḍillu — wa-mā lahum min nāṣirīn
  trad: Même si tu es ardemment désireux (taḥriṣ) de leur guidance, Allaah ne guide pas qui Il égare (lā yahdī man yuḍillu) — et il n'y a pour eux aucun secoureur (nāṣirīn).
- ref: S.16:38
  ar: وَأَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ ۙ لَا يَبْعَثُ اللَّهُ مَنْ يَمُوتُ ۚ بَلَىٰ وَعْدًا عَلَيْهِ حَقًّا وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ
  trl: Wa-aqsamū billāhi jahda aymānihim lā yabʿathu llāhu man yamūtu — balā waʿdan ʿalayhi ḥaqqan wa-lākinna akthara n-nāsi lā yaʿlamūn
  trad: Et ils ont juré par Allaah, de leurs serments les plus intenses (jahda aymānihim), qu'Allaah ne ressuscite pas celui qui meurt — Que si ! C'est une promesse qui Lui incombe, en toute vérité (ḥaqqan) — mais la plupart des humains ne savent pas.
- ref: S.16:39
  ar: لِيُبَيِّنَ لَهُمُ الَّذِي يَخْتَلِفُونَ فِيهِ وَلِيَعْلَمَ الَّذِينَ كَفَرُوا أَنَّهُمْ كَانُوا كَاذِبِينَ
  trl: Li-yubayyina lahumu lladhī yakhtalifūna fīhi wa-li-yaʿlama lladhīna kafarū annahum kānū kādhibīn
  trad: '[Il les ressuscitera] pour leur expliquer clairement (li-yubayyina) ce sur quoi ils sont en désaccord, et pour que ceux qui ont commis le kufr sachent qu''ils étaient menteurs (kādhibīn).'
- ref: S.16:40
  ar: إِنَّمَا قَوْلُنَا لِشَيْءٍ إِذَا أَرَدْنَاهُ أَنْ نَقُولَ لَهُ كُنْ فَيَكُونُ
  trl: Innamā qawlunā li-shayʾin idhā aradnāhu an naqūla lahu kun fa-yakūn
  trad: 'Notre seule parole, pour une chose que Nous voulons, est de lui dire : « Sois » — et cela est.'
- ref: S.16:41–42
  ar: وَالَّذِينَ هَاجَرُوا فِي اللَّهِ مِنْ بَعْدِ مَا ظُلِمُوا لَنُبَوِّئَنَّهُمْ فِي الدُّنْيَا حَسَنَةً ۖ وَلَأَجْرُ الْآخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا يَعْلَمُونَ ۝ الَّذِينَ صَبَرُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ
  trl: Wa-lladhīna hājarū fī llāhi min baʿdi mā ẓulimū la-nubawwiʾannahum fī d-dunyā ḥasanatan — wa-la-ajru l-ākhirati akbaru — law kānū yaʿlamūn · Alladhīna ṣabarū wa-ʿalā rabbihim yatawakkalūn
  trad: Et ceux qui ont émigré (hājarū) pour Allaah après avoir subi le tort (mā ẓulimū), Nous les installerons certainement, dans cette vie, dans une belle situation (ḥasanatan) — et la récompense de l'Ākhira est certes plus grande — s'ils savaient ! — Ceux qui ont pratiqué la patience (ṣabarū) et placent leur confiance en leur Rabb (yatawakkalūn).
- ref: S.16:43
  ar: وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ إِلَّا رِجَالًا نُوحِي إِلَيْهِمْ ۚ فَاسْأَلُوا أَهْلَ الذِّكْرِ إِنْ كُنْتُمْ لَا تَعْلَمُونَ
  trl: Wa-mā arsalnā min qablika illā rijālan nūḥī ilayhim — fa-sʾalū ahla dh-dhikri in kuntum lā taʿlamūn
  trad: Et Nous n'avons envoyé avant toi que des hommes (rijāl) à qui Nous adressions la révélation (nūḥī ilayhim) — interrogez donc les gens du dhikr (ahl adh-dhikr) si vous ne savez pas.
- ref: S.16:44
  ar: بِالْبَيِّنَاتِ وَالزُّبُرِ ۗ وَأَنْزَلْنَا إِلَيْكَ الذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ وَلَعَلَّهُمْ يَتَفَكَّرُونَ
  trl: Bi-l-bayyināti wa-z-zuburi — wa-anzalnā ilayka dh-dhikra li-tubayyina li-n-nāsi mā nuzzila ilayhim wa-laʿallahum yatafakkarūn
  trad: '[Nous les avons envoyés] avec les preuves manifestes (al-bayyināt) et les écrits (az-zubur) — et Nous avons fait descendre vers toi le Dhikr, pour que tu expliques clairement aux humains ce qui leur a été descendu, et peut-être réfléchiront-ils (yatafakkarūn).'
- ref: S.16:45
  ar: أَفَأَمِنَ الَّذِينَ مَكَرُوا السَّيِّئَاتِ أَنْ يَخْسِفَ اللَّهُ بِهِمُ الْأَرْضَ أَوْ يَأْتِيَهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ
  trl: A-fa-amina lladhīna makarū s-sayyiʾāti an yakhsifa llāhu bihimu l-arḍa aw yaʾtiyahumu l-ʿadhābu min ḥaythu lā yashʿurūn
  trad: Ceux qui ont usé de manœuvres malveillantes (makarū s-sayyiʾāt) sont-ils donc à l'abri (a-fa-amina) qu'Allaah fasse s'effondrer la terre sous eux (yakhsifa bihimu l-arḍ), ou que le châtiment leur vienne d'où ils ne le pressentent pas (min ḥaythu lā yashʿurūn) ?
- ref: S.16:46
  ar: أَوْ يَأْخُذَهُمْ فِي تَقَلُّبِهِمْ فَمَا هُمْ بِمُعْجِزِينَ
  trl: Aw yaʾkhudhahum fī taqallubihim fa-mā hum bi-muʿjizīn
  trad: Ou qu'Il les saisisse au cours de leurs allées et venues (taqallubihim), sans qu'ils puissent [Le] réduire à l'impuissance (bi-muʿjizīn) ?
- ref: S.16:47
  ar: أَوْ يَأْخُذَهُمْ عَلَىٰ تَخَوُّفٍ فَإِنَّ رَبَّكُمْ لَرَءُوفٌ رَحِيمٌ
  trl: Aw yaʾkhudhahum ʿalā takhawwufin fa-inna rabbakum la-raʾūfun raḥīm
  trad: Ou qu'Il les saisisse par une diminution progressive (ʿalā takhawwuf) ? — Votre Rabb est certes Raʾūf, Raḥīm.
- ref: S.16:48
  ar: أَوَلَمْ يَرَوْا إِلَىٰ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ يَتَفَيَّأُ ظِلَالُهُ عَنِ الْيَمِينِ وَالشَّمَائِلِ سُجَّدًا لِلَّهِ وَهُمْ دَاخِرُونَ
  trl: A-wa-lam yaraw ilā mā khalaqa llāhu min shayʾin yatafayyaʾu ẓilāluhu ʿani l-yamīni wa-sh-shamāʾili sujjadan lillāhi wa-hum dākhirūn
  trad: N'ont-ils pas vu que toute chose qu'Allaah a créée voit son ombre s'incliner (yatafayyaʾu ẓilāluhu) de la droite et de la gauche, prosternée (sujjadan) devant Allaah, en état de soumission (dākhirūn) ?
- ref: S.16:49
  ar: وَلِلَّهِ يَسْجُدُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مِنْ دَابَّةٍ وَالْمَلَائِكَةُ وَهُمْ لَا يَسْتَكْبِرُونَ
  trl: Wa-lillāhi yasjudu mā fī s-samāwāti wa-mā fī l-arḍi min dābbatin wa-l-malāʾikatu wa-hum lā yastakbirūn
  trad: Et c'est devant Allaah que se prosterne (yasjudu) tout ce qui, dans les cieux et sur la terre, est un être en mouvement (dābba), ainsi que les anges — et ils ne sont pas empreints d'orgueil (lā yastakbirūn).
- ref: S.16:50
  ar: يَخَافُونَ رَبَّهُمْ مِنْ فَوْقِهِمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ ۩
  trl: Yakhāfūna rabbahum min fawqihim wa-yafʿalūna mā yuʾmarūn
  trad: Ils craignent leur Rabb (min fawqihim) — et ils font ce qui leur est ordonné.
- ref: S.16:51
  ar: ۞ وَقَالَ اللَّهُ لَا تَتَّخِذُوا إِلَٰهَيْنِ اثْنَيْنِ ۖ إِنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ ۖ فَإِيَّايَ فَارْهَبُونِ
  trl: Wa-qāla llāhu lā tattakhidhū ilāhayni thnayni — innamā huwa ilāhun wāḥidun — fa-iyyāya fa-rhabūni
  trad: 'Et Allaah a dit : « Ne prenez pas deux ilāh — Il n''est qu''un ilāh unique (ilāhun wāḥid) — c''est Moi seul que vous devez redouter (fa-rhabūni). »'
- ref: S.16:52
  ar: وَلَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَلَهُ الدِّينُ وَاصِبًا ۚ أَفَغَيْرَ اللَّهِ تَتَّقُونَ
  trl: Wa-lahu mā fī s-samāwāti wa-l-arḍi wa-lahu d-dīnu wāṣiban — a-fa-ghayra llāhi tattaqūn
  trad: Et à Lui appartient ce qui est dans les cieux et sur la terre, et à Lui appartient le dīn constant (wāṣiban) — pratiquerez-vous donc le taqwā envers un autre qu'Allaah ?
- ref: S.16:53
  ar: وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ۖ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ
  trl: Wa-mā bikum min niʿmatin fa-mina llāhi — thumma idhā massakumu ḍ-ḍurru fa-ilayhi tajʾarūn
  trad: Et le moindre bienfait (niʿma) qui est en vous vient d'Allaah — puis, quand le tort (aḍ-ḍurr) vous touche, c'est vers Lui que vous implorez à voix haute (tajʾarūn).
- ref: S.16:54
  ar: ثُمَّ إِذَا كَشَفَ الضُّرَّ عَنْكُمْ إِذَا فَرِيقٌ مِنْكُمْ بِرَبِّهِمْ يُشْرِكُونَ
  trl: Thumma idhā kashafa ḍ-ḍurra ʿankum idhā farīqun minkum bi-rabbihim yushrikūn
  trad: Puis, quand Il écarte de vous ce tort, voici qu'une partie d'entre vous commet le shirk envers leur Rabb.
- ref: S.16:55
  ar: لِيَكْفُرُوا بِمَا آتَيْنَاهُمْ ۚ فَتَمَتَّعُوا ۖ فَسَوْفَ تَعْلَمُونَ
  trl: Li-yakfurū bimā ātaynāhum — fa-tamattaʿū fa-sawfa taʿlamūn
  trad: '[Cela,] pour qu''ils renient (li-yakfurū) ce que Nous leur avons donné — jouissez donc [de ce monde] — bientôt vous saurez.'
- ref: S.16:56
  ar: وَيَجْعَلُونَ لِمَا لَا يَعْلَمُونَ نَصِيبًا مِمَّا رَزَقْنَاهُمْ ۗ تَاللَّهِ لَتُسْأَلُنَّ عَمَّا كُنْتُمْ تَفْتَرُونَ
  trl: Wa-yajʿalūna li-mā lā yaʿlamūna naṣīban mimmā razaqnāhum — ta-llāhi la-tusʾalunna ʿammā kuntum taftarūn
  trad: Et ils assignent, à ce qu'ils ne connaissent pas, une part de ce que Nous leur avons accordé comme subsistance (razaqnāhum) — par Allaah, vous serez certainement interrogés sur ce que vous inventiez (taftarūn).
- ref: S.16:57
  ar: وَيَجْعَلُونَ لِلَّهِ الْبَنَاتِ سُبْحَانَهُ ۙ وَلَهُمْ مَا يَشْتَهُونَ
  trl: Wa-yajʿalūna lillāhi l-banāti subḥānahu wa-lahum mā yashtahūn
  trad: Et ils assignent à Allaah des filles — Il est dégagé de toute imperfection (subḥānahu) — tandis qu'à eux-mêmes revient ce qu'ils désirent (yashtahūn).
- ref: S.16:58
  ar: وَإِذَا بُشِّرَ أَحَدُهُمْ بِالْأُنْثَىٰ ظَلَّ وَجْهُهُ مُسْوَدًّا وَهُوَ كَظِيمٌ
  trl: Wa-idhā bushshira aḥaduhum bi-l-unthā ẓalla wajhuhu muswaddan wa-huwa kaẓīm
  trad: Et quand l'un d'eux reçoit l'annonce d'une fille (al-unthā), son visage demeure assombri (muswaddan), et il est plein de contrariété rentrée (kaẓīm).
- ref: S.16:59
  ar: يَتَوَارَىٰ مِنَ الْقَوْمِ مِنْ سُوءِ مَا بُشِّرَ بِهِ ۚ أَيُمْسِكُهُ عَلَىٰ هُونٍ أَمْ يَدُسُّهُ فِي التُّرَابِ ۗ أَلَا سَاءَ مَا يَحْكُمُونَ
  trl: Yatawārā mina l-qawmi min sūʾi mā bushshira bihi — a-yumsikuhu ʿalā hūnin am yadussuhu fī t-turābi — alā sāʾa mā yaḥkumūn
  trad: 'Il se dérobe aux gens (yatawārā), à cause du mal de ce dont il a été informé : la gardera-t-il malgré l''humiliation (ʿalā hūn), ou l''enfouira-t-il dans la terre (yadussuhu fī t-turāb) ? — combien est mauvais ce qu''ils décident (yaḥkumūn) !'
- ref: S.16:60
  ar: لِلَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ مَثَلُ السَّوْءِ ۖ وَلِلَّهِ الْمَثَلُ الْأَعْلَىٰ ۚ وَهُوَ الْعَزِيزُ الْحَكِيمُ
  trl: Li-lladhīna lā yuʾminūna bi-l-ākhirati mathalu s-sawʾi — wa-lillāhi l-mathalu l-aʿlā — wa-huwa l-ʿazīzu l-ḥakīm
  trad: À ceux qui ne croient pas en l'Ākhira revient la pire des images (mathalu s-sawʾ) — et à Allaah revient la comparaison sans égale (al-mathal al-aʿlā) — et Il est al-ʿAzīz, al-Ḥakīm.
- ref: S.16:61
  ar: وَلَوْ يُؤَاخِذُ اللَّهُ النَّاسَ بِظُلْمِهِمْ مَا تَرَكَ عَلَيْهَا مِنْ دَابَّةٍ وَلَٰكِنْ يُؤَخِّرُهُمْ إِلَىٰ أَجَلٍ مُسَمًّى ۖ فَإِذَا جَاءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً ۖ وَلَا يَسْتَقْدِمُونَ
  trl: Wa-law yuʾākhidhu llāhu n-nāsa bi-ẓulmihim mā taraka ʿalayhā min dābbatin wa-lākin yuʾakhkhiruhum ilā ajalin musamman — fa-idhā jāʾa ajaluhum lā yastaʾkhirūna sāʿatan wa-lā yastaqdimūn
  trad: Et si Allaah saisissait les humains pour leur injustice (bi-ẓulmihim), Il ne laisserait sur elle [la terre] aucun être en mouvement — mais Il les repousse jusqu'à un terme nommément fixé (ajalin musamman) — et quand leur terme vient, ils ne peuvent ni le retarder d'une heure, ni l'avancer.
- ref: S.16:62
  ar: وَيَجْعَلُونَ لِلَّهِ مَا يَكْرَهُونَ وَتَصِفُ أَلْسِنَتُهُمُ الْكَذِبَ أَنَّ لَهُمُ الْحُسْنَىٰ ۖ لَا جَرَمَ أَنَّ لَهُمُ النَّارَ وَأَنَّهُمْ مُفْرَطُونَ
  trl: Wa-yajʿalūna lillāhi mā yakrahūna wa-taṣifu alsinatuhumu l-kadhiba anna lahumu l-ḥusnā — lā jarama anna lahumu n-nāra wa-annahum mufraṭūn
  trad: Et ils assignent à Allaah ce qu'eux-mêmes détestent (mā yakrahūn), et leurs langues décrivent le mensonge selon lequel le meilleur (al-ḥusnā) leur reviendrait — nul doute (lā jarama) que le Feu leur revient, et qu'ils y seront précipités les tout premiers (mufraṭūn).
- ref: S.16:63
  ar: تَاللَّهِ لَقَدْ أَرْسَلْنَا إِلَىٰ أُمَمٍ مِنْ قَبْلِكَ فَزَيَّنَ لَهُمُ الشَّيْطَانُ أَعْمَالَهُمْ فَهُوَ وَلِيُّهُمُ الْيَوْمَ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Ta-llāhi la-qad arsalnā ilā umamin min qablika fa-zayyana lahumu sh-shayṭānu aʿmālahum — fa-huwa waliyyuhumu l-yawma wa-lahum ʿadhābun alīm
  trad: Par Allaah, Nous avons certes envoyé [des rusul] vers des umam avant toi — mais le shayṭān a embelli pour elles leurs actions (zayyana lahum aʿmālahum) — il est donc leur walī aujourd'hui, et pour elles un châtiment douloureux.
- ref: S.16:64
  ar: وَمَا أَنْزَلْنَا عَلَيْكَ الْكِتَابَ إِلَّا لِتُبَيِّنَ لَهُمُ الَّذِي اخْتَلَفُوا فِيهِ ۙ وَهُدًى وَرَحْمَةً لِقَوْمٍ يُؤْمِنُونَ
  trl: Wa-mā anzalnā ʿalayka l-kitāba illā li-tubayyina lahumu lladhī khtalafū fīhi — wa-hudan wa-raḥmatan li-qawmin yuʾminūn
  trad: Et Nous n'avons fait descendre sur toi le Kitāb que pour que tu leur clarifies (li-tubayyina) ce sur quoi ils sont en désaccord (ikhtalafū fīhi) — guidance (hudā) et miséricorde (raḥma) pour un peuple qui croit.
- ref: S.16:65
  ar: وَاللَّهُ أَنْزَلَ مِنَ السَّمَاءِ مَاءً فَأَحْيَا بِهِ الْأَرْضَ بَعْدَ مَوْتِهَا ۚ إِنَّ فِي ذَٰلِكَ لَآيَةً لِقَوْمٍ يَسْمَعُونَ
  trl: Wa-llāhu anzala mina s-samāʾi māʾan fa-aḥyā bihi l-arḍa baʿda mawtihā — inna fī dhālika la-āyatan li-qawmin yasmaʿūn
  trad: Et Allaah a fait descendre du ciel une eau, par laquelle Il a fait revivre la terre après sa mort — assurément là un signe (āya) pour un peuple qui écoute.
- ref: S.16:66
  ar: وَإِنَّ لَكُمْ فِي الْأَنْعَامِ لَعِبْرَةً ۖ نُسْقِيكُمْ مِمَّا فِي بُطُونِهِ مِنْ بَيْنِ فَرْثٍ وَدَمٍ لَبَنًا خَالِصًا سَائِغًا لِلشَّارِبِينَ
  trl: Wa-inna lakum fī l-anʿāmi la-ʿibratan — nusqīkum mimmā fī buṭūnihi min bayni farthin wa-damin labanan khāliṣan sāʾighan li-sh-shāribīn
  trad: 'Et vous avez certes, dans les anʿām, un enseignement (ʿibra) : Nous vous abreuvons de ce qui est dans leur ventre — d''entre le farth et le sang — un lait pur (labanan khāliṣan), agréable à avaler (sāʾighan) pour qui le boit.'
- ref: S.16:67
  ar: وَمِنْ ثَمَرَاتِ النَّخِيلِ وَالْأَعْنَابِ تَتَّخِذُونَ مِنْهُ سَكَرًا وَرِزْقًا حَسَنًا ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً لِقَوْمٍ يَعْقِلُونَ
  trl: Wa-min thamarāti n-nakhīli wa-l-aʿnābi tattakhidhūna minhu sakaran wa-rizqan ḥasanan — inna fī dhālika la-āyatan li-qawmin yaʿqilūn
  trad: Et des fruits du palmier et de la vigne, vous en tirez un sakar et une bonne subsistance (rizqan ḥasanan) — assurément là un signe pour un peuple qui raisonne.
- ref: S.16:68
  ar: وَأَوْحَىٰ رَبُّكَ إِلَى النَّحْلِ أَنِ اتَّخِذِي مِنَ الْجِبَالِ بُيُوتًا وَمِنَ الشَّجَرِ وَمِمَّا يَعْرِشُونَ
  trl: Wa-awḥā rabbuka ilā n-naḥli ani ttakhidhī mina l-jibāli buyūtan wa-mina sh-shajari wa-mimmā yaʿrishūn
  trad: 'Et ton Rabb a inspiré à l''abeille (an-naḥl) : « Prends, parmi les montagnes, des demeures, ainsi que parmi les arbres et parmi ce que [les humains] élèvent en treille (yaʿrishūn). »'
- ref: S.16:69
  ar: ثُمَّ كُلِي مِنْ كُلِّ الثَّمَرَاتِ فَاسْلُكِي سُبُلَ رَبِّكِ ذُلُلًا ۚ يَخْرُجُ مِنْ بُطُونِهَا شَرَابٌ مُخْتَلِفٌ أَلْوَانُهُ فِيهِ شِفَاءٌ لِلنَّاسِ ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً لِقَوْمٍ يَتَفَكَّرُونَ
  trl: Thumma kulī min kulli th-thamarāti fa-slukī subula rabbiki dhululan — yakhruju min buṭūnihā sharābun mukhtalifun alwānuhu fīhi shifāʾun li-n-nāsi — inna fī dhālika la-āyatan li-qawmin yatafakkarūn
  trad: « Puis mange de tous les fruits, et suis les chemins de ton Rabb, rendus faciles (dhululan). » Il sort de son ventre une boisson aux couleurs variées, dans laquelle il y a une guérison (shifāʾ) pour les humains — assurément là un signe pour un peuple qui réfléchit.
- ref: S.16:70
  ar: وَاللَّهُ خَلَقَكُمْ ثُمَّ يَتَوَفَّاكُمْ ۚ وَمِنْكُمْ مَنْ يُرَدُّ إِلَىٰ أَرْذَلِ الْعُمُرِ لِكَيْ لَا يَعْلَمَ بَعْدَ عِلْمٍ شَيْئًا ۚ إِنَّ اللَّهَ عَلِيمٌ قَدِيرٌ
  trl: Wa-llāhu khalaqakum thumma yatawaffākum — wa-minkum man yuraddu ilā ardhali l-ʿumuri li-kay lā yaʿlama baʿda ʿilmin shayʾan — inna llāha ʿAlīmun Qadīr
  trad: Et Allaah vous a créés, puis Il vous fait mourir (yatawaffākum) — et parmi vous, il en est qui sont ramenés au plus vil de l'âge (ardhali l-ʿumur), de sorte qu'ils ne savent plus rien après avoir su. Allaah est al-ʿAlīm, al-Qadīr.
- ref: S.16:71
  ar: وَاللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٍ فِي الرِّزْقِ ۚ فَمَا الَّذِينَ فُضِّلُوا بِرَادِّي رِزْقِهِمْ عَلَىٰ مَا مَلَكَتْ أَيْمَانُهُمْ فَهُمْ فِيهِ سَوَاءٌ ۚ أَفَبِنِعْمَةِ اللَّهِ يَجْحَدُونَ
  trl: Wa-llāhu faḍḍala baʿḍakum ʿalā baʿḍin fī r-rizqi — fa-mā lladhīna fuḍḍilū bi-rāddī rizqihim ʿalā mā malakat aymānuhum fa-hum fīhi sawāʾun — a-fa-bi-niʿmati llāhi yajḥadūn
  trad: Et Allaah a favorisé certains d'entre vous sur d'autres dans le rizq — or ceux qui ont été favorisés ne rétrocèdent pourtant pas leur rizq à ce que possèdent leurs mains droites (mā malakat aymānuhum), de sorte qu'ils y seraient égaux (sawāʾ) — nieraient-ils donc le bienfait d'Allaah (yajḥadūn) ?
- ref: S.16:72
  ar: وَاللَّهُ جَعَلَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا وَجَعَلَ لَكُمْ مِنْ أَزْوَاجِكُمْ بَنِينَ وَحَفَدَةً وَرَزَقَكُمْ مِنَ الطَّيِّبَاتِ ۚ أَفَبِالْبَاطِلِ يُؤْمِنُونَ وَبِنِعْمَتِ اللَّهِ هُمْ يَكْفُرُونَ
  trl: Wa-llāhu jaʿala lakum min anfusikum azwājan wa-jaʿala lakum min azwājikum banīna wa-ḥafadatan wa-razaqakum mina ṭ-ṭayyibāti — a-fa-bi-l-bāṭili yuʾminūna wa-bi-niʿmati llāhi hum yakfurūn
  trad: Et Allaah vous a fait, de vous-mêmes, des épouses ; et Il vous a fait, de vos épouses, des fils et des ḥafada ; et Il vous a accordé, comme subsistance, des bonnes choses (aṭ-ṭayyibāt) — croiraient-ils donc au faux (al-bāṭil), tout en reniant le bienfait d'Allaah ?
- ref: S.16:73
  ar: وَيَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَمْلِكُ لَهُمْ رِزْقًا مِنَ السَّمَاوَاتِ وَالْأَرْضِ شَيْئًا وَلَا يَسْتَطِيعُونَ
  trl: Wa-yaʿbudūna min dūni llāhi mā lā yamliku lahum rizqan mina s-samāwāti wa-l-arḍi shayʾan wa-lā yastaṭīʿūn
  trad: Et ils adorent, en dehors d'Allaah, ce qui ne détient pour eux aucun rizq venant des cieux ou de la terre, et qui n'en a même pas la capacité (lā yastaṭīʿūn).
- ref: S.16:74
  ar: فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ ۚ إِنَّ اللَّهَ يَعْلَمُ وَأَنْتُمْ لَا تَعْلَمُونَ
  trl: Fa-lā taḍribū lillāhi l-amthāla — inna llāha yaʿlamu wa-antum lā taʿlamūn
  trad: Ne dressez donc pas de comparaisons pour Allaah (lā taḍribū lillāhi l-amthāl) — Allaah sait, et vous ne savez pas.
- ref: S.16:75
  ar: ۞ ضَرَبَ اللَّهُ مَثَلًا عَبْدًا مَمْلُوكًا لَا يَقْدِرُ عَلَىٰ شَيْءٍ وَمَنْ رَزَقْنَاهُ مِنَّا رِزْقًا حَسَنًا فَهُوَ يُنْفِقُ مِنْهُ سِرًّا وَجَهْرًا ۖ هَلْ يَسْتَوُونَ ۚ الْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ
  trl: Ḍaraba llāhu mathalan ʿabdan mamlūkan lā yaqdiru ʿalā shayʾin wa-man razaqnāhu minnā rizqan ḥasanan fa-huwa yunfiqu minhu sirran wa-jahran — hal yastawūn — al-ḥamdu lillāh — bal aktharuhum lā yaʿlamūn
  trad: 'Allaah présente une parabole (mathalan) : un esclave, possédé (ʿabdan mamlūkan), qui n''a pouvoir sur rien, et quelqu''un que Nous avons pourvu, de Notre part, d''une bonne subsistance, dont il dépense en secret comme ouvertement — sont-ils égaux (hal yastawūn) ? La louange revient à Allaah (al-ḥamdu lillāh) ! Mais la plupart d''entre eux ne savent pas.'
- ref: S.16:76
  ar: وَضَرَبَ اللَّهُ مَثَلًا رَجُلَيْنِ أَحَدُهُمَا أَبْكَمُ لَا يَقْدِرُ عَلَىٰ شَيْءٍ وَهُوَ كَلٌّ عَلَىٰ مَوْلَاهُ أَيْنَمَا يُوَجِّهْهُ لَا يَأْتِ بِخَيْرٍ ۖ هَلْ يَسْتَوِي هُوَ وَمَنْ يَأْمُرُ بِالْعَدْلِ ۙ وَهُوَ عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Wa-ḍaraba llāhu mathalan rajulayni aḥaduhumā abkamu lā yaqdiru ʿalā shayʾin wa-huwa kallun ʿalā mawlāhu aynamā yuwajjihhu lā yaʾti bi-khayrin — hal yastawī huwa wa-man yaʾmuru bi-l-ʿadli — wa-huwa ʿalā ṣirāṭin mustaqīm
  trad: 'Et Allaah présente une parabole : deux hommes, dont l''un est muet (abkam), qui n''a pouvoir sur rien et qui est tout entier à charge (kallun) pour son mawlā — où qu''il le dirige, il n''apporte aucun bien — est-il l''égal de celui qui commande le ʿadl (la juste mesure) et qui se tient sur un chemin droit (ṣirāṭ mustaqīm) ?'
- ref: S.16:77
  ar: وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ ۚ وَمَا أَمْرُ السَّاعَةِ إِلَّا كَلَمْحِ الْبَصَرِ أَوْ هُوَ أَقْرَبُ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Wa-lillāhi ghaybu s-samāwāti wa-l-arḍi — wa-mā amru s-sāʿati illā ka-lamḥi l-baṣari aw huwa aqrabu — inna llāha ʿalā kulli shayʾin qadīr
  trad: Et à Allaah appartient le ghayb (ce qui échappe à la perception) des cieux et de la terre — et l'affaire de l'Heure (amru s-sāʿa) n'est que comme un clin d'œil (lamḥ al-baṣar), ou plus rapide (aqrab) encore — Allaah a pleine capacité sur toute chose.
- ref: S.16:78
  ar: وَاللَّهُ أَخْرَجَكُمْ مِنْ بُطُونِ أُمَّهَاتِكُمْ لَا تَعْلَمُونَ شَيْئًا وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۙ لَعَلَّكُمْ تَشْكُرُونَ
  trl: Wa-llāhu akhrajakum min buṭūni ummahātikum lā taʿlamūna shayʾan wa-jaʿala lakumu s-samʿa wa-l-abṣāra wa-l-afʾidata — laʿallakum tashkurūn
  trad: Et Allaah vous a fait sortir du ventre de vos mères sans que vous sachiez rien, et Il vous a donné l'ouïe (as-samʿ), les regards (al-abṣār) et les afʾida — peut-être serez-vous reconnaissants (tashkurūn).
- ref: S.16:79
  ar: أَلَمْ يَرَوْا إِلَى الطَّيْرِ مُسَخَّرَاتٍ فِي جَوِّ السَّمَاءِ مَا يُمْسِكُهُنَّ إِلَّا اللَّهُ ۗ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يُؤْمِنُونَ
  trl: A-lam yaraw ilā ṭ-ṭayri musakhkharātin fī jawwi s-samāʾi mā yumsikuhunna illā llāhu — inna fī dhālika la-āyātin li-qawmin yuʾminūn
  trad: N'ont-ils pas vu les oiseaux assujettis (musakhkharāt) dans l'espace du ciel (jaww as-samāʾ) ? Rien ne les retient sinon Allaah — assurément là des signes pour un peuple qui croit.
- ref: S.16:80
  ar: وَاللَّهُ جَعَلَ لَكُمْ مِنْ بُيُوتِكُمْ سَكَنًا وَجَعَلَ لَكُمْ مِنْ جُلُودِ الْأَنْعَامِ بُيُوتًا تَسْتَخِفُّونَهَا يَوْمَ ظَعْنِكُمْ وَيَوْمَ إِقَامَتِكُمْ ۙ وَمِنْ أَصْوَافِهَا وَأَوْبَارِهَا وَأَشْعَارِهَا أَثَاثًا وَمَتَاعًا إِلَىٰ حِينٍ
  trl: Wa-llāhu jaʿala lakum min buyūtikum sakanan wa-jaʿala lakum min julūdi l-anʿāmi buyūtan tastakhiffūnahā yawma ẓaʿnikum wa-yawma iqāmatikum — wa-min aṣwāfihā wa-awbārihā wa-ashʿārihā athāthan wa-matāʿan ilā ḥīn
  trad: Et Allaah vous a fait, de vos maisons, un sakan (une résidence apaisante), et Il vous a fait, des peaux des anʿām, des demeures que vous trouvez légères (tastakhiffūnahā) au jour de votre départ (ẓaʿnikum) comme au jour de votre installation (iqāmatikum) — et de leur laine (aṣwāf), de leur poil (awbār) et de leur crin (ashʿār), un mobilier (athāth) et un usage (matāʿ) jusqu'à un temps [donné].
- ref: S.16:81
  ar: وَاللَّهُ جَعَلَ لَكُمْ مِمَّا خَلَقَ ظِلَالًا وَجَعَلَ لَكُمْ مِنَ الْجِبَالِ أَكْنَانًا وَجَعَلَ لَكُمْ سَرَابِيلَ تَقِيكُمُ الْحَرَّ وَسَرَابِيلَ تَقِيكُمْ بَأْسَكُمْ ۚ كَذَٰلِكَ يُتِمُّ نِعْمَتَهُ عَلَيْكُمْ لَعَلَّكُمْ تُسْلِمُونَ
  trl: Wa-llāhu jaʿala lakum mimmā khalaqa ẓilālan wa-jaʿala lakum mina l-jibāli aknānan wa-jaʿala lakum sarābīla taqīkumu l-ḥarra wa-sarābīla taqīkum baʾsakum — kadhālika yutimmu niʿmatahu ʿalaykum laʿallakum tuslimūn
  trad: Et Allaah vous a fait, de ce qu'Il a créé, des ombres, et Il vous a fait, des montagnes, des abris (aknān), et Il vous a fait des vêtements (sarābīl) qui vous protègent de la chaleur, et des vêtements qui vous protègent de votre propre violence (baʾsakum) — c'est ainsi qu'Il parachève Son bienfait sur vous, peut-être vous soumettrez-vous entièrement (tuslimūn).
- ref: S.16:82
  ar: فَإِنْ تَوَلَّوْا فَإِنَّمَا عَلَيْكَ الْبَلَاغُ الْمُبِينُ
  trl: Fa-in tawallaw fa-innamā ʿalayka l-balāghu l-mubīn
  trad: S'ils se détournent, il ne t'incombe que la transmission manifeste (al-balāgh al-mubīn).
- ref: S.16:83
  ar: يَعْرِفُونَ نِعْمَتَ اللَّهِ ثُمَّ يُنْكِرُونَهَا وَأَكْثَرُهُمُ الْكَافِرُونَ
  trl: Yaʿrifūna niʿmata llāhi thumma yunkirūnahā wa-aktharuhumu l-kāfirūn
  trad: Ils reconnaissent le bienfait (niʿma) d'Allaah, puis ils le renient (yunkirūnahā) — et la plupart d'entre eux sont les kāfirūn.
- ref: S.16:84
  ar: وَيَوْمَ نَبْعَثُ مِنْ كُلِّ أُمَّةٍ شَهِيدًا ثُمَّ لَا يُؤْذَنُ لِلَّذِينَ كَفَرُوا وَلَا هُمْ يُسْتَعْتَبُونَ
  trl: Wa-yawma nabʿathu min kulli ummatin shahīdan thumma lā yuʾdhanu li-lladhīna kafarū wa-lā hum yustaʿtabūn
  trad: Et [rappelle] le jour où Nous susciterons, de chaque umma, un témoin (shahīd) — alors il ne sera plus permis à ceux qui ont commis le kufr [de s'excuser], et on ne leur demandera plus de fournir satisfaction (lā hum yustaʿtabūn).
- ref: S.16:85
  ar: وَإِذَا رَأَى الَّذِينَ ظَلَمُوا الْعَذَابَ فَلَا يُخَفَّفُ عَنْهُمْ وَلَا هُمْ يُنْظَرُونَ
  trl: Wa-idhā raʾā lladhīna ẓalamū l-ʿadhāba fa-lā yukhaffafu ʿanhum wa-lā hum yunẓarūn
  trad: Et quand ceux qui ont commis l'injustice (ẓalamū) verront le châtiment, il ne leur sera pas allégé, et ils ne recevront aucun délai (lā hum yunẓarūn).
- ref: S.16:86
  ar: وَإِذَا رَأَى الَّذِينَ أَشْرَكُوا شُرَكَاءَهُمْ قَالُوا رَبَّنَا هَٰؤُلَاءِ شُرَكَاؤُنَا الَّذِينَ كُنَّا نَدْعُو مِنْ دُونِكَ ۖ فَأَلْقَوْا إِلَيْهِمُ الْقَوْلَ إِنَّكُمْ لَكَاذِبُونَ
  trl: Wa-idhā raʾā lladhīna ashrakū shurakāʾahum qālū rabbanā hāʾulāʾi shurakāʾunā lladhīna kunnā nadʿū min dūnika — fa-alqaw ilayhimu l-qawla innakum la-kādhibūn
  trad: 'Et quand ceux qui ont commis le shirk verront leurs associés (shurakāʾ), ils diront : « Notre Rabb, voici nos associés, ceux que nous invoquions en dehors de Toi » — alors ceux-ci leur adresseront cette parole en retour : « Vous êtes certainement des menteurs ! »'
- ref: S.16:87
  ar: وَأَلْقَوْا إِلَى اللَّهِ يَوْمَئِذٍ السَّلَمَ ۖ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ
  trl: Wa-alqaw ilā llāhi yawmaʾidhin s-salama — wa-ḍalla ʿanhum mā kānū yaftarūn
  trad: Et ils offriront à Allaah, ce jour-là, la soumission totale (as-salam) — et se sera égaré loin d'eux ce qu'ils inventaient (yaftarūn).
- ref: S.16:88
  ar: الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ زِدْنَاهُمْ عَذَابًا فَوْقَ الْعَذَابِ بِمَا كَانُوا يُفْسِدُونَ
  trl: Alladhīna kafarū wa-ṣaddū ʿan sabīli llāhi zidnāhum ʿadhāban fawqa l-ʿadhābi bimā kānū yufsidūn
  trad: Ceux qui ont commis le kufr et qui ont fait obstacle au chemin d'Allaah (ṣaddū ʿan sabīli llāh), Nous leur ajoutons un châtiment par-dessus le châtiment (ʿadhāban fawqa l-ʿadhāb), pour le fasād qu'ils commettaient.
- ref: S.16:89
  ar: وَيَوْمَ نَبْعَثُ فِي كُلِّ أُمَّةٍ شَهِيدًا عَلَيْهِمْ مِنْ أَنْفُسِهِمْ ۖ وَجِئْنَا بِكَ شَهِيدًا عَلَىٰ هَٰؤُلَاءِ ۚ وَنَزَّلْنَا عَلَيْكَ الْكِتَابَ تِبْيَانًا لِكُلِّ شَيْءٍ وَهُدًى وَرَحْمَةً وَبُشْرَىٰ لِلْمُسْلِمِينَ
  trl: Wa-yawma nabʿathu fī kulli ummatin shahīdan ʿalayhim min anfusihim wa-jiʾnā bika shahīdan ʿalā hāʾulāʾi — wa-nazzalnā ʿalayka l-kitāba tibyānan li-kulli shayʾin wa-hudan wa-raḥmatan wa-bushrā li-l-muslimīn
  trad: Et [rappelle] le jour où Nous susciterons, dans chaque umma, un témoin (shahīd) contre elle, issu d'elle-même — et Nous t'amènerons, toi, comme témoin contre ceux-ci — et Nous avons fait descendre sur toi le Kitāb, clarification (tibyān) pour toute chose, et guidance, et miséricorde, et heureuse annonce (bushrā) pour les muslimūn.
- ref: S.16:90
  ar: ۞ إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ وَيَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ ۚ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ
  trl: Inna llāha yaʾmuru bi-l-ʿadli wa-l-iḥsāni wa-ītāʾi dhī l-qurbā wa-yanhā ʿani l-faḥshāʾi wa-l-munkari wa-l-baghyi — yaʿiẓukum laʿallakum tadhakkarūn
  trad: Allaah commande le ʿadl (la juste mesure) et l'iḥsān (l'excellence dans l'acte), et de donner à ceux de proche parenté (dhī l-qurbā) — et Il interdit le faḥshāʾ (l'excès qui outrepasse la mesure), le munkar (le blâmable) et le baghy (l'empiètement injuste) — Il vous exhorte (yaʿiẓukum), peut-être vous rappellerez-vous.
- ref: S.16:91
  ar: وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدْتُمْ وَلَا تَنْقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا ۚ إِنَّ اللَّهَ يَعْلَمُ مَا تَفْعَلُونَ
  trl: Wa-awfū bi-ʿahdi llāhi idhā ʿāhadtum wa-lā tanquḍū l-aymāna baʿda tawkīdihā wa-qad jaʿaltumu llāha ʿalaykum kafīlan — inna llāha yaʿlamu mā tafʿalūn
  trad: Et honorez le pacte d'Allaah (ʿahd Allaah) quand vous vous êtes engagés, et ne rompez pas les serments (al-aymān) après les avoir affermis — alors que vous avez fait d'Allaah, sur vous-mêmes, un garant (kafīl) — Allaah sait ce que vous faites.
- ref: S.16:92
  ar: وَلَا تَكُونُوا كَالَّتِي نَقَضَتْ غَزْلَهَا مِنْ بَعْدِ قُوَّةٍ أَنْكَاثًا تَتَّخِذُونَ أَيْمَانَكُمْ دَخَلًا بَيْنَكُمْ أَنْ تَكُونَ أُمَّةٌ هِيَ أَرْبَىٰ مِنْ أُمَّةٍ ۚ إِنَّمَا يَبْلُوكُمُ اللَّهُ بِهِ ۚ وَلَيُبَيِّنَنَّ لَكُمْ يَوْمَ الْقِيَامَةِ مَا كُنْتُمْ فِيهِ تَخْتَلِفُونَ
  trl: Wa-lā takūnū ka-llatī naqaḍat ghazlahā min baʿdi quwwatin ankāthan tattakhidhūna aymānakum dakhalan baynakum an takūna ummatun hiya arbā min ummatin — innamā yablūkumu llāhu bihi — wa-la-yubayyinanna lakum yawma l-qiyāmati mā kuntum fīhi takhtalifūn
  trad: Et ne soyez pas comme celle qui a défait son fil, après l'avoir solidement filé, en brins détordus (ankāthan) — vous prenez vos serments comme un moyen de tromperie entre vous (dakhalan baynakum), du fait qu'une umma soit plus nombreuse (arbā) qu'une autre — Allaah ne fait par cela que vous éprouver (yablūkum) — et Il vous clarifiera certainement, au Jour de la Résurrection, ce sur quoi vous étiez en désaccord.
- ref: S.16:93
  ar: وَلَوْ شَاءَ اللَّهُ لَجَعَلَكُمْ أُمَّةً وَاحِدَةً وَلَٰكِنْ يُضِلُّ مَنْ يَشَاءُ وَيَهْدِي مَنْ يَشَاءُ ۚ وَلَتُسْأَلُنَّ عَمَّا كُنْتُمْ تَعْمَلُونَ
  trl: Wa-law shāʾa llāhu la-jaʿalakum ummatan wāḥidatan wa-lākin yuḍillu man yashāʾu wa-yahdī man yashāʾu — wa-la-tusʾalunna ʿammā kuntum taʿmalūn
  trad: Et si Allaah avait voulu, Il aurait fait de vous une umma unique — mais Il égare qui Il veut, et Il guide qui Il veut — et vous serez certainement interrogés sur ce que vous faisiez.
- ref: S.16:94
  ar: وَلَا تَتَّخِذُوا أَيْمَانَكُمْ دَخَلًا بَيْنَكُمْ فَتَزِلَّ قَدَمٌ بَعْدَ ثُبُوتِهَا وَتَذُوقُوا السُّوءَ بِمَا صَدَدْتُمْ عَنْ سَبِيلِ اللَّهِ ۖ وَلَكُمْ عَذَابٌ عَظِيمٌ
  trl: Wa-lā tattakhidhū aymānakum dakhalan baynakum fa-tazilla qadamun baʿda thubūtihā wa-tadhūqū s-sūʾa bimā ṣadadtum ʿan sabīli llāhi — wa-lakum ʿadhābun ʿaẓīm
  trad: Et ne prenez pas vos serments comme un moyen de tromperie entre vous (dakhalan baynakum), sinon un pied glisserait après avoir été affermi (thabata), et vous goûteriez le mal pour avoir fait obstacle (ṣadadtum) au chemin d'Allaah — et il y aurait pour vous un châtiment immense.
- ref: S.16:95
  ar: وَلَا تَشْتَرُوا بِعَهْدِ اللَّهِ ثَمَنًا قَلِيلًا ۚ إِنَّمَا عِنْدَ اللَّهِ هُوَ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ
  trl: Wa-lā tashtarū bi-ʿahdi llāhi thamanan qalīlan — innamā ʿinda llāhi huwa khayrun lakum in kuntum taʿlamūn
  trad: Et n'échangez pas le pacte d'Allaah contre un prix dérisoire (thamanan qalīlan) — ce qui est auprès d'Allaah est meilleur pour vous, si seulement vous saviez.
- ref: S.16:96
  ar: مَا عِنْدَكُمْ يَنْفَدُ ۖ وَمَا عِنْدَ اللَّهِ بَاقٍ ۗ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ
  trl: Mā ʿindakum yanfadu wa-mā ʿinda llāhi bāqin — wa-la-najziyanna lladhīna ṣabarū ajrahum bi-aḥsani mā kānū yaʿmalūn
  trad: Ce qui est auprès de vous s'épuise (yanfadu), et ce qui est auprès d'Allaah demeure (bāqin) — et Nous rétribuerons certainement ceux qui ont pratiqué la patience (ṣabarū) selon la meilleure de leurs œuvres.
- ref: S.16:97
  ar: مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً ۖ وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ
  trl: Man ʿamila ṣāliḥan min dhakarin aw unthā wa-huwa muʾminun fa-la-nuḥyiyannahu ḥayātan ṭayyibatan — wa-la-najziyannahum ajrahum bi-aḥsani mā kānū yaʿmalūn
  trad: Quiconque agit avec droiture (ʿamila ṣāliḥan), homme ou femme, tout en étant croyant, Nous le ferons certainement vivre d'une vie bonne (ḥayātan ṭayyibatan) — et Nous les rétribuerons certainement selon la meilleure de leurs œuvres.
- ref: S.16:98
  ar: فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
  trl: Fa-idhā qaraʾta l-qurʾāna fa-staʿidh billāhi mina sh-shayṭāni r-rajīm
  trad: Quand donc tu lis le Qurʾān, cherche refuge auprès d'Allaah contre le shayṭān, ar-rajīm (l'écarté par projection).
- ref: S.16:99
  ar: إِنَّهُ لَيْسَ لَهُ سُلْطَانٌ عَلَى الَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ
  trl: Innahu laysa lahu sulṭānun ʿalā lladhīna āmanū wa-ʿalā rabbihim yatawakkalūn
  trad: Il n'a, assurément, aucun sulṭān (pouvoir de contrainte) sur ceux qui ont cru et qui s'en remettent (yatawakkalūn) à leur Rabb.
- ref: S.16:100
  ar: إِنَّمَا سُلْطَانُهُ عَلَى الَّذِينَ يَتَوَلَّوْنَهُ وَالَّذِينَ هُمْ بِهِ مُشْرِكُونَ
  trl: Innamā sulṭānuhu ʿalā lladhīna yatawallawnahu wa-lladhīna hum bihi mushrikūn
  trad: Son sulṭān ne s'exerce que sur ceux qui le prennent pour walī (protecteur, allié), et sur ceux qui, à travers lui, commettent le shirk.
- ref: S.16:101
  ar: وَإِذَا بَدَّلْنَا آيَةً مَكَانَ آيَةٍ ۙ وَاللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوا إِنَّمَا أَنْتَ مُفْتَرٍ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ
  trl: Wa-idhā baddalnā āyatan makāna āyatin — wa-llāhu aʿlamu bi-mā yunazzilu qālū innamā anta muftarin — bal aktharuhum lā yaʿlamūn
  trad: 'Et quand Nous substituons un signe à la place d''un signe (āyatan makāna āyatin) — Allaah sachant le mieux ce qu''Il fait descendre — ils disent : « Tu n''es qu''un inventeur (muftarin). » Mais la plupart d''entre eux ne savent pas.'
- ref: S.16:102
  ar: قُلْ نَزَّلَهُ رُوحُ الْقُدُسِ مِنْ رَبِّكَ بِالْحَقِّ لِيُثَبِّتَ الَّذِينَ آمَنُوا وَهُدًى وَبُشْرَىٰ لِلْمُسْلِمِينَ
  trl: Qul nazzalahu rūḥu l-qudusi min rabbika bi-l-ḥaqqi li-yuthabbita lladhīna āmanū wa-hudan wa-bushrā li-l-muslimīn
  trad: 'Dis : « C''est le Rūḥ al-Qudus qui l''a fait descendre, de la part de ton Rabb, avec le ḥaqq (la réalité établie), pour affermir ceux qui ont cru » — et guidance, et heureuse annonce (bushrā) pour les muslimūn.'
- ref: S.16:103
  ar: وَلَقَدْ نَعْلَمُ أَنَّهُمْ يَقُولُونَ إِنَّمَا يُعَلِّمُهُ بَشَرٌ ۗ لِسَانُ الَّذِي يُلْحِدُونَ إِلَيْهِ أَعْجَمِيٌّ وَهَٰذَا لِسَانٌ عَرَبِيٌّ مُبِينٌ
  trl: Wa-la-qad naʿlamu annahum yaqūlūna innamā yuʿallimuhu basharun — lisānu lladhī yulḥidūna ilayhi aʿjamiyyun wa-hādhā lisānun ʿarabiyyun mubīn
  trad: 'Et Nous savons assurément qu''ils disent : « Ce n''est qu''un humain (basharun) qui le lui enseigne. » La langue (lisān) de celui vers qui ils dévient (yulḥidūna) est étrangère (aʿjamiyy), alors que ceci est une langue arabe manifeste (ʿarabiyyun mubīn).'
- ref: S.16:104
  ar: إِنَّ الَّذِينَ لَا يُؤْمِنُونَ بِآيَاتِ اللَّهِ لَا يَهْدِيهِمُ اللَّهُ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Inna lladhīna lā yuʾminūna bi-āyāti llāhi lā yahdīhimu llāhu wa-lahum ʿadhābun alīm
  trad: Ceux qui ne croient pas aux āyāt d'Allaah, Allaah ne les guide pas — et il y a pour eux un châtiment douloureux.
- ref: S.16:105
  ar: إِنَّمَا يَفْتَرِي الْكَذِبَ الَّذِينَ لَا يُؤْمِنُونَ بِآيَاتِ اللَّهِ ۖ وَأُولَٰئِكَ هُمُ الْكَاذِبُونَ
  trl: Innamā yaftarī l-kadhiba lladhīna lā yuʾminūna bi-āyāti llāhi wa-ulāʾika humu l-kādhibūn
  trad: Ceux qui inventent le mensonge (yaftarī l-kadhib) ne sont autres que ceux qui ne croient pas aux āyāt d'Allaah — ce sont ceux-là, les menteurs.
- ref: S.16:106
  ar: مَنْ كَفَرَ بِاللَّهِ مِنْ بَعْدِ إِيمَانِهِ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ وَلَٰكِنْ مَنْ شَرَحَ بِالْكُفْرِ صَدْرًا فَعَلَيْهِمْ غَضَبٌ مِنَ اللَّهِ وَلَهُمْ عَذَابٌ عَظِيمٌ
  trl: Man kafara billāhi min baʿdi īmānihi illā man ukriha wa-qalbuhu muṭmaʾinnun bi-l-īmāni wa-lākin man sharaḥa bi-l-kufri ṣadran fa-ʿalayhim ghaḍabun mina llāhi wa-lahum ʿadhābun ʿaẓīm
  trad: Quiconque commet le kufr envers Allaah après son īmān — hormis celui qui a été contraint (ukriha) alors que son cœur demeure affermi (muṭmaʾinn) dans l'īmān — mais quiconque ouvre son for intérieur (sharaḥa … ṣadran) au kufr, sur ceux-là un ghaḍab venu d'Allaah, et pour eux un châtiment immense.
- ref: S.16:107
  ar: ذَٰلِكَ بِأَنَّهُمُ اسْتَحَبُّوا الْحَيَاةَ الدُّنْيَا عَلَى الْآخِرَةِ وَأَنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ
  trl: Dhālika bi-annahumu staḥabbū l-ḥayāta d-dunyā ʿalā l-ākhirati wa-anna llāha lā yahdī l-qawma l-kāfirīn
  trad: Cela, parce qu'ils ont préféré (istaḥabbū) la vie d'ici-bas sur l'Ākhira — et qu'Allaah ne guide pas le peuple des kāfirūn.
- ref: S.16:108
  ar: أُولَٰئِكَ الَّذِينَ طَبَعَ اللَّهُ عَلَىٰ قُلُوبِهِمْ وَسَمْعِهِمْ وَأَبْصَارِهِمْ ۖ وَأُولَٰئِكَ هُمُ الْغَافِلُونَ
  trl: Ulāʾika lladhīna ṭabaʿa llāhu ʿalā qulūbihim wa-samʿihim wa-abṣārihim wa-ulāʾika humu l-ghāfilūn
  trad: Ceux-là sont ceux dont Allaah a scellé (ṭabaʿa) les cœurs, l'ouïe et les regards — et ceux-là sont les insouciants (al-ghāfilūn).
- ref: S.16:109
  ar: لَا جَرَمَ أَنَّهُمْ فِي الْآخِرَةِ هُمُ الْخَاسِرُونَ
  trl: Lā jarama annahum fi l-ākhirati humu l-khāsirūn
  trad: 'Nul doute (lā jarama) : ce sont eux, dans l''Ākhira, les perdants (al-khāsirūn).'
- ref: S.16:110
  ar: ثُمَّ إِنَّ رَبَّكَ لِلَّذِينَ هَاجَرُوا مِنْ بَعْدِ مَا فُتِنُوا ثُمَّ جَاهَدُوا وَصَبَرُوا إِنَّ رَبَّكَ مِنْ بَعْدِهَا لَغَفُورٌ رَحِيمٌ
  trl: Thumma inna rabbaka li-lladhīna hājarū min baʿdi mā futinū thumma jāhadū wa-ṣabarū inna rabbaka min baʿdihā la-Ghafūrun Raḥīm
  trad: Puis ton Rabb, pour ceux qui ont émigré (hājarū) après avoir été éprouvés (futinū), puis se sont engagés (jāhadū) et ont pratiqué le ṣabr — ton Rabb, après cela, est assurément al-Ghafūr, ar-Raḥīm.
- ref: S.16:111
  ar: ۞ يَوْمَ تَأْتِي كُلُّ نَفْسٍ تُجَادِلُ عَنْ نَفْسِهَا وَتُوَفَّىٰ كُلُّ نَفْسٍ مَا عَمِلَتْ وَهُمْ لَا يُظْلَمُونَ
  trl: Yawma taʾtī kullu nafsin tujādilu ʿan nafsihā wa-tuwaffā kullu nafsin mā ʿamilat wa-hum lā yuẓlamūn
  trad: '[Rappelle] le jour où chaque âme viendra, plaidant pour elle-même (tujādilu ʿan nafsihā), et où chaque âme sera intégralement rétribuée (tuwaffā) de ce qu''elle a fait — et ils ne seront pas lésés (lā yuẓlamūn).'
- ref: S.16:112
  ar: وَضَرَبَ اللَّهُ مَثَلًا قَرْيَةً كَانَتْ آمِنَةً مُطْمَئِنَّةً يَأْتِيهَا رِزْقُهَا رَغَدًا مِنْ كُلِّ مَكَانٍ فَكَفَرَتْ بِأَنْعُمِ اللَّهِ فَأَذَاقَهَا اللَّهُ لِبَاسَ الْجُوعِ وَالْخَوْفِ بِمَا كَانُوا يَصْنَعُونَ
  trl: Wa-ḍaraba llāhu mathalan qaryatan kānat āminatan muṭmaʾinnatan yaʾtīhā rizquhā raghadan min kulli makānin fa-kafarat bi-anʿumi llāhi fa-adhāqahā llāhu libāsa l-jūʿi wa-l-khawfi bi-mā kānū yaṣnaʿūn
  trad: 'Et Allaah présente une parabole : une cité (qarya) qui était en sécurité (āmina), affermie (muṭmaʾinna), à qui sa subsistance venait avec abondance (raghadan) de tout lieu — puis elle renia (kafarat) les bienfaits (anʿum) d''Allaah, et Allaah lui fit goûter le vêtement (libās) de la faim et de la peur, pour ce qu''ils fabriquaient (yaṣnaʿūn).'
- ref: S.16:113
  ar: وَلَقَدْ جَاءَهُمْ رَسُولٌ مِنْهُمْ فَكَذَّبُوهُ فَأَخَذَهُمُ الْعَذَابُ وَهُمْ ظَالِمُونَ
  trl: Wa-la-qad jāʾahum rasūlun minhum fa-kadhdhabūhu fa-akhadhahumu l-ʿadhābu wa-hum ẓālimūn
  trad: Et assurément, un rasūl issu d'eux-mêmes leur est venu — ils l'ont démenti (kadhdhabūhu) — alors le châtiment les a saisis, alors qu'ils étaient injustes (ẓālimūn).
- ref: S.16:114
  ar: فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ
  trl: Fa-kulū mimmā razaqakumu llāhu ḥalālan ṭayyiban wa-shkurū niʿmata llāhi in kuntum iyyāhu taʿbudūn
  trad: Mangez donc de ce qu'Allaah vous a accordé comme subsistance, licite (ḥalāl) et bon (ṭayyib), et soyez reconnaissants (ushkurū) du bienfait d'Allaah, si c'est Lui seul que vous adorez.
- ref: S.16:115
  ar: إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنْزِيرِ وَمَا أُهِلَّ لِغَيْرِ اللَّهِ بِهِ ۖ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَإِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Innamā ḥarrama ʿalaykumu l-maytata wa-d-dama wa-laḥma l-khinzīri wa-mā uhilla li-ghayri llāhi bihi — fa-mani ḍṭurra ghayra bāghin wa-lā ʿādin fa-inna llāha Ghafūrun Raḥīm
  trad: Il ne vous a interdit que la bête morte d'elle-même (al-mayta), le sang, la chair du porc, et ce sur quoi un autre nom qu'Allaah a été invoqué (mā uhilla li-ghayri llāhi bihi) — mais quiconque y est contraint (uḍṭurra), sans être ni transgresseur (bāghin) ni excessif (ʿādin), alors Allaah est al-Ghafūr, ar-Raḥīm.
- ref: S.16:116
  ar: وَلَا تَقُولُوا لِمَا تَصِفُ أَلْسِنَتُكُمُ الْكَذِبَ هَٰذَا حَلَالٌ وَهَٰذَا حَرَامٌ لِتَفْتَرُوا عَلَى اللَّهِ الْكَذِبَ ۚ إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ لَا يُفْلِحُونَ
  trl: Wa-lā taqūlū li-mā taṣifu alsinatukumu l-kadhiba hādhā ḥalālun wa-hādhā ḥarāmun li-taftarū ʿalā llāhi l-kadhiba — inna lladhīna yaftarūna ʿalā llāhi l-kadhiba lā yufliḥūn
  trad: 'Et ne dites pas, pour ce que vos langues décrivent mensongèrement : « Ceci est ḥalāl et ceci est ḥarām », pour inventer le mensonge contre Allaah — ceux qui inventent le mensonge contre Allaah ne réussissent pas (lā yufliḥūn).'
- ref: S.16:117
  ar: مَتَاعٌ قَلِيلٌ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Matāʿun qalīlun wa-lahum ʿadhābun alīm
  trad: Une jouissance dérisoire (matāʿ qalīl) — et pour eux un châtiment douloureux.
- ref: S.16:118
  ar: وَعَلَى الَّذِينَ هَادُوا حَرَّمْنَا مَا قَصَصْنَا عَلَيْكَ مِنْ قَبْلُ ۖ وَمَا ظَلَمْنَاهُمْ وَلَٰكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ
  trl: Wa-ʿalā lladhīna hādū ḥarramnā mā qaṣaṣnā ʿalayka min qablu — wa-mā ẓalamnāhum wa-lākin kānū anfusahum yaẓlimūn
  trad: Et à ceux qui se sont judaïsés (hādū), Nous avons interdit ce que Nous t'avons déjà relaté auparavant (mā qaṣaṣnā ʿalayka min qablu) — et ce n'est pas Nous qui leur avons fait du tort, mais c'est eux-mêmes qu'ils lésaient (kānū anfusahum yaẓlimūn).
- ref: S.16:119
  ar: ثُمَّ إِنَّ رَبَّكَ لِلَّذِينَ عَمِلُوا السُّوءَ بِجَهَالَةٍ ثُمَّ تَابُوا مِنْ بَعْدِ ذَٰلِكَ وَأَصْلَحُوا إِنَّ رَبَّكَ مِنْ بَعْدِهَا لَغَفُورٌ رَحِيمٌ
  trl: Thumma inna rabbaka li-lladhīna ʿamilū s-sūʾa bi-jahālatin thumma tābū min baʿdi dhālika wa-aṣlaḥū inna rabbaka min baʿdihā la-Ghafūrun Raḥīm
  trad: Puis ton Rabb, pour ceux qui ont fait le mal (as-sūʾ) par ignorance (bi-jahāla), puis sont revenus (tābū) après cela et se sont corrigés (aṣlaḥū) — ton Rabb, après cela, est assurément al-Ghafūr, ar-Raḥīm.
- ref: S.16:120
  ar: إِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً قَانِتًا لِلَّهِ حَنِيفًا وَلَمْ يَكُ مِنَ الْمُشْرِكِينَ
  trl: Inna Ibrāhīma kāna ummatan qānitan lillāhi ḥanīfan wa-lam yaku mina l-mushrikīn
  trad: Ibrāhīm était certes, à lui seul, une umma (ummatan) — dans la qunūt (soumission constante) envers Allaah, ḥanīf — et il n'était pas parmi les mushrikūn.
- ref: S.16:121
  ar: شَاكِرًا لِأَنْعُمِهِ ۚ اجْتَبَاهُ وَهَدَاهُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Shākiran li-anʿumihi — jtabāhu wa-hadāhu ilā ṣirāṭin mustaqīm
  trad: Reconnaissant (shākiran) pour Ses bienfaits (anʿum) — Il le choisit (jtabāhu) et le guida vers un chemin droit (ṣirāṭ mustaqīm).
- ref: S.16:122
  ar: وَآتَيْنَاهُ فِي الدُّنْيَا حَسَنَةً ۖ وَإِنَّهُ فِي الْآخِرَةِ لَمِنَ الصَّالِحِينَ
  trl: Wa-ātaynāhu fi d-dunyā ḥasanatan wa-innahu fi l-ākhirati la-mina ṣ-ṣāliḥīn
  trad: Et Nous lui avons donné, dans la vie d'ici-bas, une belle chose (ḥasana) — et il est certes, dans l'Ākhira, parmi les ṣāliḥūn.
- ref: S.16:123
  ar: ثُمَّ أَوْحَيْنَا إِلَيْكَ أَنِ اتَّبِعْ مِلَّةَ إِبْرَاهِيمَ حَنِيفًا ۖ وَمَا كَانَ مِنَ الْمُشْرِكِينَ
  trl: Thumma awḥaynā ilayka ani ttabiʿ millata Ibrāhīma ḥanīfan wa-mā kāna mina l-mushrikīn
  trad: 'Puis Nous t''avons révélé (awḥaynā) : « Suis la milla (la voie) d''Ibrāhīm, ḥanīf » — et il n''était pas parmi les mushrikūn.'
- ref: S.16:124
  ar: إِنَّمَا جُعِلَ السَّبْتُ عَلَى الَّذِينَ اخْتَلَفُوا فِيهِ ۚ وَإِنَّ رَبَّكَ لَيَحْكُمُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ
  trl: Innamā juʿila s-sabtu ʿalā lladhīna khtalafū fīhi wa-inna rabbaka la-yaḥkumu baynahum yawma l-qiyāmati fīmā kānū fīhi yakhtalifūn
  trad: Le sabt n'a été institué (juʿila) qu'à l'endroit de ceux qui se sont mis en désaccord (ikhtalafū) à son sujet — et ton Rabb jugera certainement entre eux, au Jour de la Résurrection, sur ce en quoi ils étaient en désaccord.
- ref: S.16:125
  ar: ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ ۖ وَجَادِلْهُمْ بِالَّتِي هِيَ أَحْسَنُ ۚ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ ۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ
  trl: Udʿu ilā sabīli rabbika bi-l-ḥikmati wa-l-mawʿiẓati l-ḥasanati wa-jādilhum bi-llatī hiya aḥsanu — inna rabbaka huwa aʿlamu bi-man ḍalla ʿan sabīlihi wa-huwa aʿlamu bi-l-muhtadīn
  trad: Appelle vers le chemin de ton Rabb par la ḥikma (la sagesse fondée) et la belle exhortation (al-mawʿiẓa al-ḥasana), et discute avec eux (jādilhum) par ce qui est le plus beau (bi-llatī hiya aḥsan) — ton Rabb sait mieux qui s'est égaré de Son chemin, et Il sait mieux qui sont les bien-guidés.
- ref: S.16:126
  ar: وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُمْ بِهِ ۖ وَلَئِنْ صَبَرْتُمْ لَهُوَ خَيْرٌ لِلصَّابِرِينَ
  trl: Wa-in ʿāqabtum fa-ʿāqibū bi-mithli mā ʿūqibtum bihi wa-la-in ṣabartum la-huwa khayrun li-ṣ-ṣābirīn
  trad: Et si vous rétribuez (ʿāqabtum) [une offense], rétribuez alors par l'équivalent exact (bi-mithli) de ce dont vous avez été offensés — mais si vous pratiquez le ṣabr, cela est assurément meilleur pour ceux qui pratiquent le ṣabr (aṣ-ṣābirīn).
- ref: S.16:127
  ar: وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ ۚ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ
  trl: Wa-ṣbir wa-mā ṣabruka illā billāhi wa-lā taḥzan ʿalayhim wa-lā taku fī ḍayqin mimmā yamkurūn
  trad: Et pratique le ṣabr — ton ṣabr n'est possible que par Allaah — et ne t'attriste pas (lā taḥzan) à leur sujet, et ne sois pas dans l'oppression (ḍayq) à cause de ce qu'ils manigancent (yamkurūn).
- ref: S.16:128
  ar: إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوْا وَالَّذِينَ هُمْ مُحْسِنُونَ
  trl: Inna llāha maʿa lladhīna ttaqaw wa-lladhīna hum muḥsinūn
  trad: Allaah est avec ceux qui ont constitué une taqwā, et ceux qui pratiquent l'iḥsān (l'excellence dans l'acte).
