- ref: 'S.25:1'
  ar: 'تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ عَلَىٰ عَبْدِهِ لِيَكُونَ لِلْعَالَمِينَ نَذِيرًا'
  trl: 'Tabāraka lladhī nazzala l-Furqāna ʿalā ʿabdihi li-yakūna li-l-ʿālamīna nadhīrā'
  trad: 'Tabāraka — Ce qui a fait descendre (nazzala) le Furqān sur Son ʿabd, pour qu''il soit, pour les mondes (al-ʿālamīn), un nadhīr (avertisseur).'
- ref: 'S.25:2'
  ar: 'الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَلَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُنْ لَهُ شَرِيكٌ فِي الْمُلْكِ وَخَلَقَ كُلَّ شَيْءٍ فَقَدَّرَهُ تَقْدِيرًا'
  trl: 'Alladhī lahu mulku s-samāwāti wa-l-arḍi wa-lam yattakhidh waladan wa-lam yakun lahu sharīkun fi l-mulki wa-khalaqa kulla shayʾin fa-qaddarahu taqdīrā'
  trad: 'Ce à qui appartient le mulk (la royauté, la pleine disposition) des cieux et de la terre — qui n''a pris nul walad, et à qui nul sharīk (associé) n''appartient dans le mulk — et qui a créé toute chose, puis en a établi la mesure avec exactitude (fa-qaddarahu taqdīran).'
- ref: 'S.25:3'
  ar: 'وَاتَّخَذُوا مِنْ دُونِهِ آلِهَةً لَا يَخْلُقُونَ شَيْئًا وَهُمْ يُخْلَقُونَ وَلَا يَمْلِكُونَ لِأَنْفُسِهِمْ ضَرًّا وَلَا نَفْعًا وَلَا يَمْلِكُونَ مَوْتًا وَلَا حَيَاةً وَلَا نُشُورًا'
  trl: 'Wa-ttakhadhū min dūnihi ālihatan lā yakhluqūna shayʾan wa-hum yukhlaqūna wa-lā yamlikūna li-anfusihim ḍarran wa-lā nafʿan wa-lā yamlikūna mawtan wa-lā ḥayātan wa-lā nushūrā'
  trad: 'Et ils ont pris, en dehors de Lui, des ālihah (divinités) qui ne créent rien et qui sont elles-mêmes créées, qui ne détiennent pour elles-mêmes ni le pouvoir de nuire (ḍarr) ni celui d''être utiles (nafʿ), et qui ne détiennent ni la mort, ni la vie, ni la résurrection (nushūr).'
- ref: 'S.25:4'
  ar: 'وَقَالَ الَّذِينَ كَفَرُوا إِنْ هَٰذَا إِلَّا إِفْكٌ افْتَرَاهُ وَأَعَانَهُ عَلَيْهِ قَوْمٌ آخَرُونَ ۖ فَقَدْ جَاءُوا ظُلْمًا وَزُورًا'
  trl: 'Wa-qāla lladhīna kafarū in hādhā illā ifkun iftarāhu wa-aʿānahu ʿalayhi qawmun ākharūna fa-qad jāʾū ẓulman wa-zūrā'
  trad: 'Et ceux qui sont kāfirūn ont dit : « Ceci n''est qu''un ifk (mensonge forgé par inversion du vrai) qu''il a inventé (iftarāhu), et sur lequel d''autres gens l''ont assisté » — ils sont ainsi venus avec ẓulm et zūr (un faux témoignage).'
- ref: 'S.25:5'
  ar: 'وَقَالُوا أَسَاطِيرُ الْأَوَّلِينَ اكْتَتَبَهَا فَهِيَ تُمْلَىٰ عَلَيْهِ بُكْرَةً وَأَصِيلًا'
  trl: 'Wa-qālū asāṭīru l-awwalīna ktatabahā fa-hiya tumlā ʿalayhi bukratan wa-aṣīlā'
  trad: 'Et ils ont dit : « [Ce sont] des légendes des anciens (asāṭīr al-awwalīn), qu''il a fait mettre par écrit (iktatabahā), et qui lui sont dictées (tumlā) matin et soir (bukratan wa-aṣīlan). »'
- ref: 'S.25:6'
  ar: 'قُلْ أَنْزَلَهُ الَّذِي يَعْلَمُ السِّرَّ فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ إِنَّهُ كَانَ غَفُورًا رَحِيمًا'
  trl: 'Qul anzalahu lladhī yaʿlamu s-sirra fi s-samāwāti wa-l-arḍi innahu kāna ghafūran raḥīmā'
  trad: 'Dis : « L''a fait descendre Ce qui connaît le secret (as-sirr) dans les cieux et sur la terre — Il est Ghafūr, Raḥīm. »'
- ref: 'S.25:7'
  ar: 'وَقَالُوا مَالِ هَٰذَا الرَّسُولِ يَأْكُلُ الطَّعَامَ وَيَمْشِي فِي الْأَسْوَاقِ ۙ لَوْلَا أُنْزِلَ إِلَيْهِ مَلَكٌ فَيَكُونَ مَعَهُ نَذِيرًا'
  trl: 'Wa-qālū māli hādhā r-rasūli yaʾkulu ṭ-ṭaʿāma wa-yamshī fi l-aswāqi lawlā unzila ilayhi malakun fa-yakūna maʿahu nadhīrā'
  trad: 'Et ils ont dit : « Qu''a donc ce rasūl à manger la nourriture et à marcher dans les marchés (al-aswāq) ? Que n''a-t-on pas fait descendre vers lui un malak, qui serait avec lui un nadhīr ? »'
- ref: 'S.25:8'
  ar: 'أَوْ يُلْقَىٰ إِلَيْهِ كَنْزٌ أَوْ تَكُونُ لَهُ جَنَّةٌ يَأْكُلُ مِنْهَا ۚ وَقَالَ الظَّالِمُونَ إِنْ تَتَّبِعُونَ إِلَّا رَجُلًا مَسْحُورًا'
  trl: 'Aw yulqā ilayhi kanzun aw takūnu lahu jannatun yaʾkulu minhā wa-qāla ẓ-ẓālimūna in tattabiʿūna illā rajulan masḥūrā'
  trad: '« Ou que ne lui est-il pas jeté un trésor (kanz), ou que n''a-t-il pas un jardin (janna) dont il mangerait ? » Et les ẓālimūn ont dit : « Vous ne suivez qu''un homme ensorcelé (rajulan masḥūrā). »'
- ref: 'S.25:9'
  ar: 'انْظُرْ كَيْفَ ضَرَبُوا لَكَ الْأَمْثَالَ فَضَلُّوا فَلَا يَسْتَطِيعُونَ سَبِيلًا'
  trl: 'Unẓur kayfa ḍarabū laka l-amthāla fa-ḍallū fa-lā yastaṭīʿūna sabīlā'
  trad: 'Regarde comment ils ont formulé (ḍarabū) des comparaisons (al-amthāl) à ton sujet — ils s''en sont ainsi égarés (ḍallū), et ne peuvent plus trouver de chemin (sabīlan).'
- ref: 'S.25:10'
  ar: 'تَبَارَكَ الَّذِي إِنْ شَاءَ جَعَلَ لَكَ خَيْرًا مِنْ ذَٰلِكَ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ وَيَجْعَلْ لَكَ قُصُورًا'
  trl: 'Tabāraka lladhī in shāʾa jaʿala laka khayran min dhālika jannātin tajrī min taḥtihā l-anhāru wa-yajʿal laka quṣūrā'
  trad: 'Tabāraka — Ce qui, s''Il le voulait, t''accorderait mieux que cela : des jardins sous lesquels coulent les rivières, et t''accorderait des palais (quṣūr).'
- ref: 'S.25:11'
  ar: 'بَلْ كَذَّبُوا بِالسَّاعَةِ ۖ وَأَعْتَدْنَا لِمَنْ كَذَّبَ بِالسَّاعَةِ سَعِيرًا'
  trl: 'Bal kadhdhabū bi-s-sāʿati wa-aʿtadnā li-man kadhdhaba bi-s-sāʿati saʿīrā'
  trad: 'Mais ils ont démenti la Sāʿa (l''Heure) — et Nous avons préparé, pour qui dément la Sāʿa, un Saʿīr (brasier ardent).'
- ref: 'S.25:12'
  ar: 'إِذَا رَأَتْهُمْ مِنْ مَكَانٍ بَعِيدٍ سَمِعُوا لَهَا تَغَيُّظًا وَزَفِيرًا'
  trl: 'Idhā raʾathum min makānin baʿīdin samiʿū lahā taghayyuẓan wa-zafīrā'
  trad: 'Quand il (le Saʿīr) les verra d''un lieu éloigné, ils entendront, venant de lui, un grondement de fureur (taghayyuẓ) et un halètement (zafīr).'
- ref: 'S.25:13–14'
  ar: 'وَإِذَا أُلْقُوا مِنْهَا مَكَانًا ضَيِّقًا مُقَرَّنِينَ دَعَوْا هُنَالِكَ ثُبُورًا لَا تَدْعُوا الْيَوْمَ ثُبُورًا وَاحِدًا وَادْعُوا ثُبُورًا كَثِيرًا'
  trl: 'Wa-idhā ulqū minhā makānan ḍayyiqan muqarranīna daʿaw hunālika thubūrā · Lā tadʿū l-yawma thubūran wāḥidan wa-dʿū thubūran kathīrā'
  trad: 'Et quand ils y seront jetés, en un lieu étroit (ḍayyiq), enchaînés ensemble (muqarranīn), ils y invoqueront la ruine totale (thubūr). « N''invoquez pas, aujourd''hui, une seule ruine — invoquez-en beaucoup ! »'
- ref: 'S.25:15–16'
  ar: 'قُلْ أَذَٰلِكَ خَيْرٌ أَمْ جَنَّةُ الْخُلْدِ الَّتِي وُعِدَ الْمُتَّقُونَ ۚ كَانَتْ لَهُمْ جَزَاءً وَمَصِيرًا لَهُمْ فِيهَا مَا يَشَاءُونَ خَالِدِينَ ۚ كَانَ عَلَىٰ رَبِّكَ وَعْدًا مَسْئُولًا'
  trl: 'Qul adhālika khayrun am jannatu l-khuldi llatī wuʿida l-muttaqūna kānat lahum jazāʾan wa-maṣīrā · Lahum fīhā mā yashāʾūna khālidīna kāna ʿalā rabbika waʿdan masʾūlā'
  trad: 'Dis : « Cela est-il meilleur, ou la Janna du khuld (éternité), qui a été promise aux muttaqūn ? Elle sera pour eux rétribution (jazāʾ) et destination (maṣīr). » Ils y auront ce qu''ils voudront, y demeurant à jamais (khālidīn) — c''est, de la part de ton Rabb, une promesse qui sera réclamée (waʿdan masʾūlā).'
- ref: 'S.25:17'
  ar: 'وَيَوْمَ يَحْشُرُهُمْ وَمَا يَعْبُدُونَ مِنْ دُونِ اللَّهِ فَيَقُولُ أَأَنْتُمْ أَضْلَلْتُمْ عِبَادِي هَٰؤُلَاءِ أَمْ هُمْ ضَلُّوا السَّبِيلَ'
  trl: 'Wa-yawma yaḥshuruhum wa-mā yaʿbudūna min dūni llāhi fa-yaqūlu a-antum aḍlaltum ʿibādī hāʾulāʾi am hum ḍallū s-sabīla'
  trad: 'Et le jour où Il les rassemblera, eux et ce qu''ils adorent en dehors d''Allaah, Il dira : « Est-ce vous qui avez égaré Mes ʿibād que voici, ou se sont-ils égarés eux-mêmes du chemin ? »'
- ref: 'S.25:18'
  ar: 'قَالُوا سُبْحَانَكَ مَا كَانَ يَنْبَغِي لَنَا أَنْ نَتَّخِذَ مِنْ دُونِكَ مِنْ أَوْلِيَاءَ وَلَٰكِنْ مَتَّعْتَهُمْ وَآبَاءَهُمْ حَتَّىٰ نَسُوا الذِّكْرَ وَكَانُوا قَوْمًا بُورًا'
  trl: 'Qālū subḥānaka mā kāna yanbaghī lanā an nattakhidha min dūnika min awliyāʾa wa-lākin mattaʿtahum wa-ābāʾahum ḥattā nasū dh-dhikra wa-kānū qawman būrā'
  trad: 'Ils diront : « Subḥānaka ! Il ne nous convenait pas (mā kāna yanbaghī lanā) de prendre, en dehors de Toi, des awliyāʾ — mais Tu leur as accordé jouissance (mattaʿtahum), à eux et à leurs pères, jusqu''à ce qu''ils oublient le Dhikr — et ils furent un peuple perdu (qawman būrā). »'
- ref: 'S.25:19'
  ar: 'فَقَدْ كَذَّبُوكُمْ بِمَا تَقُولُونَ فَمَا تَسْتَطِيعُونَ صَرْفًا وَلَا نَصْرًا ۚ وَمَنْ يَظْلِمْ مِنْكُمْ نُذِقْهُ عَذَابًا كَبِيرًا'
  trl: 'Fa-qad kadhdhabūkum bi-mā taqūlūna fa-mā tastaṭīʿūna ṣarfan wa-lā naṣran wa-man yaẓlim minkum nudhiqhu ʿadhāban kabīrā'
  trad: '« Ils vous ont donc démentis dans ce que vous disiez — vous ne pouvez désormais ni détourner [le châtiment] (ṣarf) ni [vous] secourir (naṣr) — et quiconque, parmi vous, commet un ẓulm, Nous lui ferons goûter un grand châtiment. »'
- ref: 'S.25:20'
  ar: 'وَمَا أَرْسَلْنَا قَبْلَكَ مِنَ الْمُرْسَلِينَ إِلَّا إِنَّهُمْ لَيَأْكُلُونَ الطَّعَامَ وَيَمْشُونَ فِي الْأَسْوَاقِ ۗ وَجَعَلْنَا بَعْضَكُمْ لِبَعْضٍ فِتْنَةً أَتَصْبِرُونَ ۗ وَكَانَ رَبُّكَ بَصِيرًا'
  trl: 'Wa-mā arsalnā qablaka mina l-mursalīna illā innahum la-yaʾkulūna ṭ-ṭaʿāma wa-yamshūna fi l-aswāqi wa-jaʿalnā baʿḍakum li-baʿḍin fitnatan a-taṣbirūna wa-kāna rabbuka baṣīrā'
  trad: 'Et Nous n''avons envoyé, avant toi, aucun des mursalūn (envoyés) qui ne mangeât la nourriture et ne marchât dans les marchés — et Nous avons fait de vous, les uns pour les autres, une fitna (épreuve) : endurerez-vous (a-taṣbirūn) ? Et ton Rabb est Baṣīr.'
- ref: 'S.25:21'
  ar: '۞ وَقَالَ الَّذِينَ لَا يَرْجُونَ لِقَاءَنَا لَوْلَا أُنْزِلَ عَلَيْنَا الْمَلَائِكَةُ أَوْ نَرَىٰ رَبَّنَا ۗ لَقَدِ اسْتَكْبَرُوا فِي أَنْفُسِهِمْ وَعَتَوْا عُتُوًّا كَبِيرًا'
  trl: 'Wa-qāla lladhīna lā yarjūna liqāʾanā lawlā unzila ʿalaynā l-malāʾikatu aw narā rabbanā laqadi stakbarū fī anfusihim wa-ʿataw ʿutuwwan kabīrā'
  trad: 'Et ceux qui ne comptent pas sur Notre Rencontre (liqāʾanā) ont dit : « Que ne fait-on pas descendre sur nous les malāʾika, ou que ne voyons-nous pas notre Rabb ? » Ils se sont certes enorgueillis (istakbarū) en eux-mêmes, et ils ont transgressé d''une transgression immense (ʿutuwwan kabīrā).'
- ref: 'S.25:22'
  ar: 'يَوْمَ يَرَوْنَ الْمَلَائِكَةَ لَا بُشْرَىٰ يَوْمَئِذٍ لِلْمُجْرِمِينَ وَيَقُولُونَ حِجْرًا مَحْجُورًا'
  trl: 'Yawma yarawna l-malāʾikata lā bushrā yawmaʾidhin li-l-mujrimīna wa-yaqūlūna ḥijran maḥjūrā'
  trad: 'Le jour où ils verront les malāʾika, nulle bushrā (bonne annonce), ce jour-là, pour les mujrimūn — et ils diront : « Ḥijran maḥjūrā ! »'
- ref: 'S.25:23'
  ar: 'وَقَدِمْنَا إِلَىٰ مَا عَمِلُوا مِنْ عَمَلٍ فَجَعَلْنَاهُ هَبَاءً مَنْثُورًا'
  trl: 'Wa-qadimnā ilā mā ʿamilū min ʿamalin fa-jaʿalnāhu habāʾan manthūrā'
  trad: 'Et Nous viendrons à toute œuvre qu''ils ont accomplie, et Nous en ferons une poussière éparpillée (habāʾan manthūrā).'
- ref: 'S.25:24'
  ar: 'أَصْحَابُ الْجَنَّةِ يَوْمَئِذٍ خَيْرٌ مُسْتَقَرًّا وَأَحْسَنُ مَقِيلًا'
  trl: 'Aṣḥābu l-jannati yawmaʾidhin khayrun mustaqarran wa-aḥsanu maqīlā'
  trad: 'Les compagnons de la Janna, ce jour-là, [auront] un meilleur lieu d''établissement (mustaqarr) et un meilleur lieu de repos (maqīl).'
- ref: 'S.25:25'
  ar: 'وَيَوْمَ تَشَقَّقُ السَّمَاءُ بِالْغَمَامِ وَنُزِّلَ الْمَلَائِكَةُ تَنْزِيلًا'
  trl: 'Wa-yawma tashaqqaqu s-samāʾu bi-l-ghamāmi wa-nuzzila l-malāʾikatu tanzīlā'
  trad: 'Et le jour où le ciel se fendra par les nuées (al-ghamām), et où les malāʾika seront descendus, en une descente [continue] (tanzīlan).'
- ref: 'S.25:26'
  ar: 'الْمُلْكُ يَوْمَئِذٍ الْحَقُّ لِلرَّحْمَٰنِ ۚ وَكَانَ يَوْمًا عَلَى الْكَافِرِينَ عَسِيرًا'
  trl: 'Al-mulku yawmaʾidhin al-ḥaqqu li-r-raḥmāni wa-kāna yawman ʿalā l-kāfirīna ʿasīrā'
  trad: 'Le mulk (la royauté), ce jour-là — le véritable (al-ḥaqq) — [appartiendra] à ar-Raḥmān — et ce sera, pour les kāfirūn, un jour difficile (ʿasīr).'
- ref: 'S.25:27'
  ar: 'وَيَوْمَ يَعَضُّ الظَّالِمُ عَلَىٰ يَدَيْهِ يَقُولُ يَا لَيْتَنِي اتَّخَذْتُ مَعَ الرَّسُولِ سَبِيلًا'
  trl: 'Wa-yawma yaʿaḍḍu ẓ-ẓālimu ʿalā yadayhi yaqūlu yā laytanī ttakhadhtu maʿa r-rasūli sabīlā'
  trad: 'Et le jour où le ẓālim se mordra les mains (yaʿaḍḍu ʿalā yadayhi), disant : « Que n''ai-je pris, avec le rasūl, un chemin ! »'
- ref: 'S.25:28'
  ar: 'يَا وَيْلَتَىٰ لَيْتَنِي لَمْ أَتَّخِذْ فُلَانًا خَلِيلًا'
  trl: 'Yā waylatā laytanī lam attakhidh fulānan khalīlā'
  trad: '« Ô mon malheur (yā waylatā) ! Que n''ai-je pas pris un tel (fulānan) pour khalīl ! »'
- ref: 'S.25:29'
  ar: 'لَقَدْ أَضَلَّنِي عَنِ الذِّكْرِ بَعْدَ إِذْ جَاءَنِي ۗ وَكَانَ الشَّيْطَانُ لِلْإِنْسَانِ خَذُولًا'
  trl: 'Laqad aḍallanī ʿani dh-dhikri baʿda idh jāʾanī wa-kāna sh-shayṭānu li-l-insāni khadhūlā'
  trad: '« Il m''a certes égaré du Dhikr après qu''il me fut venu ! » — et le shayṭān est, envers l''être humain, khadhūl (celui qui abandonne sans secours).'
- ref: 'S.25:30'
  ar: 'وَقَالَ الرَّسُولُ يَا رَبِّ إِنَّ قَوْمِي اتَّخَذُوا هَٰذَا الْقُرْآنَ مَهْجُورًا'
  trl: 'Wa-qāla r-rasūlu yā rabbi inna qawmī ttakhadhū hādhā l-qurʾāna mahjūrā'
  trad: 'Et le rasūl a dit : « Ô mon Rabb, mon peuple a pris ce Qurʾān en délaissement (mahjūrā). »'
- ref: 'S.25:31'
  ar: 'وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِيٍّ عَدُوًّا مِنَ الْمُجْرِمِينَ ۗ وَكَفَىٰ بِرَبِّكَ هَادِيًا وَنَصِيرًا'
  trl: 'Wa-kadhālika jaʿalnā li-kulli nabiyyin ʿaduwwan mina l-mujrimīna wa-kafā bi-rabbika hādiyan wa-naṣīrā'
  trad: 'Et c''est ainsi que Nous avons établi, pour chaque nabī, un ennemi (ʿaduww) parmi les mujrimūn — et ton Rabb suffit comme guide (hādī) et comme secours (naṣīr).'
- ref: 'S.25:32'
  ar: 'وَقَالَ الَّذِينَ كَفَرُوا لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً ۚ كَذَٰلِكَ لِنُثَبِّتَ بِهِ فُؤَادَكَ ۖ وَرَتَّلْنَاهُ تَرْتِيلًا'
  trl: 'Wa-qāla lladhīna kafarū lawlā nuzzila ʿalayhi l-qurʾānu jumlatan wāḥidatan kadhālika li-nuthabbita bihi fuʾādaka wa-rattalnāhu tartīlā'
  trad: 'Et ceux qui sont kāfirūn ont dit : « Pourquoi ne lui a-t-on pas fait descendre le Qurʾān en une seule fois (jumlatan wāḥidatan) ? » C''est ainsi, afin d''affermir par lui ton cœur (li-nuthabbita bihi fuʾādaka) — et Nous l''avons récité avec mesure (rattalnāhu tartīlā).'
- ref: 'S.25:33'
  ar: 'وَلَا يَأْتُونَكَ بِمَثَلٍ إِلَّا جِئْنَاكَ بِالْحَقِّ وَأَحْسَنَ تَفْسِيرًا'
  trl: 'Wa-lā yaʾtūnaka bi-mathalin illā jiʾnāka bi-l-ḥaqqi wa-aḥsana tafsīrā'
  trad: 'Et ils ne t''apportent aucune comparaison (mathal) sans que Nous t''apportions le ḥaqq, et une explication meilleure (aḥsana tafsīrā).'
- ref: 'S.25:34'
  ar: 'الَّذِينَ يُحْشَرُونَ عَلَىٰ وُجُوهِهِمْ إِلَىٰ جَهَنَّمَ أُولَٰئِكَ شَرٌّ مَكَانًا وَأَضَلُّ سَبِيلًا'
  trl: 'Alladhīna yuḥsharūna ʿalā wujūhihim ilā jahannama ulāʾika sharrun makānan wa-aḍallu sabīlā'
  trad: 'Ceux qui seront rassemblés sur leurs visages (ʿalā wujūhihim) vers Jahannam — ceux-là ont la pire position (sharrun makānan), et sont les plus égarés quant au chemin (aḍallu sabīlā).'
- ref: 'S.25:35'
  ar: 'وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ وَجَعَلْنَا مَعَهُ أَخَاهُ هَارُونَ وَزِيرًا'
  trl: 'Wa-la-qad ātaynā mūsā l-kitāba wa-jaʿalnā maʿahu akhāhu hārūna wazīrā'
  trad: 'Et Nous avons certes donné à Mūsā le Kitāb, et avons établi avec lui son frère Hārūn comme wazīr.'
- ref: 'S.25:36'
  ar: 'فَقُلْنَا اذْهَبَا إِلَى الْقَوْمِ الَّذِينَ كَذَّبُوا بِآيَاتِنَا فَدَمَّرْنَاهُمْ تَدْمِيرًا'
  trl: 'Fa-qulnā dhhabā ila l-qawmi lladhīna kadhdhabū bi-āyātinā fa-dammarnāhum tadmīrā'
  trad: 'Et Nous avons dit : « Allez tous deux vers le peuple qui a démenti Nos āyāt » — et Nous les avons anéantis d''un entier anéantissement (dammarnāhum tadmīrā).'
- ref: 'S.25:37'
  ar: 'وَقَوْمَ نُوحٍ لَمَّا كَذَّبُوا الرُّسُلَ أَغْرَقْنَاهُمْ وَجَعَلْنَاهُمْ لِلنَّاسِ آيَةً ۖ وَأَعْتَدْنَا لِلظَّالِمِينَ عَذَابًا أَلِيمًا'
  trl: 'Wa-qawma nūḥin lammā kadhdhabū r-rusula aghraqnāhum wa-jaʿalnāhum li-n-nāsi āyatan wa-aʿtadnā li-ẓ-ẓālimīna ʿadhāban alīmā'
  trad: 'Et le peuple de Nūḥ — lorsqu''ils eurent démenti les rusul, Nous les avons engloutis (aghraqnāhum), et Nous avons fait d''eux un signe (āya) pour les gens — et Nous avons préparé, pour les ẓālimūn, un châtiment douloureux (ʿadhāban alīmā).'
- ref: 'S.25:38'
  ar: 'وَعَادًا وَثَمُودَ وَأَصْحَابَ الرَّسِّ وَقُرُونًا بَيْنَ ذَٰلِكَ كَثِيرًا'
  trl: 'Wa-ʿādan wa-thamūda wa-aṣḥāba r-rassi wa-qurūnan bayna dhālika kathīrā'
  trad: 'Et ʿĀd, et Thamūd, et les Compagnons d''ar-Rass (Aṣḥāb ar-Rass), et bien des générations (qurūn) entre tout cela.'
- ref: 'S.25:39'
  ar: 'وَكُلًّا ضَرَبْنَا لَهُ الْأَمْثَالَ ۖ وَكُلًّا تَبَّرْنَا تَتْبِيرًا'
  trl: 'Wa-kullan ḍarabnā lahu l-amthāla wa-kullan tabbarnā tatbīrā'
  trad: 'Et pour chacun, Nous avons formulé des comparaisons (al-amthāl) — et chacun, Nous l''avons brisé d''un entier brisement (tabbarnā tatbīrā).'
- ref: 'S.25:40'
  ar: 'وَلَقَدْ أَتَوْا عَلَى الْقَرْيَةِ الَّتِي أُمْطِرَتْ مَطَرَ السَّوْءِ ۚ أَفَلَمْ يَكُونُوا يَرَوْنَهَا ۚ بَلْ كَانُوا لَا يَرْجُونَ نُشُورًا'
  trl: 'Wa-la-qad ataw ʿala l-qaryati llatī umṭirat maṭara s-sawʾi a-fa-lam yakūnū yarawnahā bal kānū lā yarjūna nushūrā'
  trad: 'Et ils sont certes passés par la cité (al-qarya) qui fut arrosée d''une pluie de malheur (maṭara s-sawʾ) — ne la voyaient-ils donc pas ? Mais ils ne comptaient pas sur la nushūr (résurrection).'
- ref: 'S.25:41'
  ar: 'وَإِذَا رَأَوْكَ إِنْ يَتَّخِذُونَكَ إِلَّا هُزُوًا أَهَٰذَا الَّذِي بَعَثَ اللَّهُ رَسُولًا'
  trl: 'Wa-idhā raʾawka in yattakhidhūnaka illā huzuwan a-hādhā lladhī baʿatha llāhu rasūlā'
  trad: 'Et quand ils te voient, ils ne te prennent qu''en dérision (huzuwan) : « Est-ce donc celui-là qu''Allaah a envoyé (baʿatha) comme rasūl ? »'
- ref: 'S.25:42'
  ar: 'إِنْ كَادَ لَيُضِلُّنَا عَنْ آلِهَتِنَا لَوْلَا أَنْ صَبَرْنَا عَلَيْهَا ۚ وَسَوْفَ يَعْلَمُونَ حِينَ يَرَوْنَ الْعَذَابَ مَنْ أَضَلُّ سَبِيلًا'
  trl: 'In kāda la-yuḍillunā ʿan ālihatinā lawlā an ṣabarnā ʿalayhā wa-sawfa yaʿlamūna ḥīna yarawna l-ʿadhāba man aḍallu sabīlā'
  trad: '« Il a bien failli (in kāda) nous égarer de nos ālihah (divinités), si nous n''avions persévéré (ṣabarnā) en elles ! » — mais ils sauront, lorsqu''ils verront le châtiment, qui est le plus égaré quant au chemin (man aḍallu sabīlā).'
- ref: 'S.25:43'
  ar: 'أَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ أَفَأَنْتَ تَكُونُ عَلَيْهِ وَكِيلًا'
  trl: 'A-raʾayta mani ttakhadha ilāhahu hawāhu afa-anta takūnu ʿalayhi wakīlā'
  trad: 'As-tu vu celui qui a pris son hawā (son inclination propre) pour ilāh ? Est-ce donc toi qui serais, sur lui, un wakīl ?'
- ref: 'S.25:44'
  ar: 'أَمْ تَحْسَبُ أَنَّ أَكْثَرَهُمْ يَسْمَعُونَ أَوْ يَعْقِلُونَ ۚ إِنْ هُمْ إِلَّا كَالْأَنْعَامِ ۖ بَلْ هُمْ أَضَلُّ سَبِيلًا'
  trl: 'Am taḥsabu anna aktharahum yasmaʿūna aw yaʿqilūna in hum illā ka-l-anʿāmi bal hum aḍallu sabīlā'
  trad: 'Ou penses-tu que la plupart d''entre eux entendent ou raisonnent (yaʿqilūn) ? Ils ne sont que comme le bétail (ka-l-anʿām) — non, ils sont plus égarés encore quant au chemin (aḍallu sabīlā).'
- ref: 'S.25:45'
  ar: 'أَلَمْ تَرَ إِلَىٰ رَبِّكَ كَيْفَ مَدَّ الظِّلَّ وَلَوْ شَاءَ لَجَعَلَهُ سَاكِنًا ثُمَّ جَعَلْنَا الشَّمْسَ عَلَيْهِ دَلِيلًا'
  trl: 'A-lam tara ilā rabbika kayfa madda ẓ-ẓilla wa-law shāʾa la-jaʿalahu sākinan thumma jaʿalnā sh-shamsa ʿalayhi dalīlā'
  trad: 'N''as-tu pas considéré, au sujet de ton Rabb, comment Il a étendu (madda) l''ombre (aẓ-ẓill) ? Et s''Il l''avait voulu, Il l''aurait rendue immobile (sākinan) — puis Nous avons fait du soleil, sur elle, un indicateur (dalīl).'
- ref: 'S.25:46'
  ar: 'ثُمَّ قَبَضْنَاهُ إِلَيْنَا قَبْضًا يَسِيرًا'
  trl: 'Thumma qabaḍnāhu ilaynā qabḍan yasīrā'
  trad: 'Puis Nous l''avons reprise (qabaḍnāhu) vers Nous (ilaynā), d''une reprise progressive et aisée (qabḍan yasīrā).'
- ref: 'S.25:47'
  ar: 'وَهُوَ الَّذِي جَعَلَ لَكُمُ اللَّيْلَ لِبَاسًا وَالنَّوْمَ سُبَاتًا وَجَعَلَ النَّهَارَ نُشُورًا'
  trl: 'Wa-huwa lladhī jaʿala lakumu l-layla libāsan wa-n-nawma subātan wa-jaʿala n-nahāra nushūrā'
  trad: 'Et c''est Ce qui a fait, pour vous, de la nuit un vêtement (libās), du sommeil un repos suspendu (subāt), et a fait du jour un déploiement d''activité (nushūr).'
- ref: 'S.25:48'
  ar: 'وَهُوَ الَّذِي أَرْسَلَ الرِّيَاحَ بُشْرًا بَيْنَ يَدَيْ رَحْمَتِهِ ۚ وَأَنْزَلْنَا مِنَ السَّمَاءِ مَاءً طَهُورًا'
  trl: 'Wa-huwa lladhī arsala r-riyāḥa bushran bayna yaday raḥmatihi wa-anzalnā mina s-samāʾi māʾan ṭahūrā'
  trad: 'Et c''est Ce qui a envoyé les vents (ar-riyāḥ) en annonce (bushran), devant Sa raḥma (bayna yaday raḥmatihi) — et Nous avons fait descendre, du ciel, une eau purificatrice (māʾan ṭahūrā).'
- ref: 'S.25:49'
  ar: 'لِنُحْيِيَ بِهِ بَلْدَةً مَيْتًا وَنُسْقِيَهُ مِمَّا خَلَقْنَا أَنْعَامًا وَأَنَاسِيَّ كَثِيرًا'
  trl: 'Li-nuḥyiya bihi baldatan maytan wa-nusqiyahu mimmā khalaqnā anʿāman wa-anāsiyya kathīrā'
  trad: 'afin de redonner vie, par elle, à une contrée morte (baldatan maytan), et d''en abreuver une grande part de ce que Nous avons créé — bétail (anʿām) et êtres humains (anāsiyy).'
- ref: 'S.25:50'
  ar: 'وَلَقَدْ صَرَّفْنَاهُ بَيْنَهُمْ لِيَذَّكَّرُوا فَأَبَىٰ أَكْثَرُ النَّاسِ إِلَّا كُفُورًا'
  trl: 'Wa-la-qad ṣarrafnāhu baynahum li-yadhdhakkarū fa-abā aktharu n-nāsi illā kufūrā'
  trad: 'Et Nous l''avons certes diversifié (ṣarrafnāhu) parmi eux, afin qu''ils se rappellent — mais la plupart des gens n''ont rien voulu d''autre qu''un déni obstiné (kufūrā).'
- ref: 'S.25:51'
  ar: 'وَلَوْ شِئْنَا لَبَعَثْنَا فِي كُلِّ قَرْيَةٍ نَذِيرًا'
  trl: 'Wa-law shiʾnā la-baʿathnā fī kulli qaryatin nadhīrā'
  trad: 'Et si Nous l''avions voulu, Nous aurions envoyé (la-baʿathnā), dans chaque cité (qarya), un nadhīr (avertisseur).'
- ref: 'S.25:52'
  ar: 'فَلَا تُطِعِ الْكَافِرِينَ وَجَاهِدْهُمْ بِهِ جِهَادًا كَبِيرًا'
  trl: 'Fa-lā tuṭiʿi l-kāfirīna wa-jāhidhum bihi jihādan kabīrā'
  trad: 'N''obéis donc pas aux kāfirūn, et évertue-toi contre eux, par lui (bihi — ce Qurʾān), d''un effort (jihād) immense.'
- ref: 'S.25:53'
  ar: '۞ وَهُوَ الَّذِي مَرَجَ الْبَحْرَيْنِ هَٰذَا عَذْبٌ فُرَاتٌ وَهَٰذَا مِلْحٌ أُجَاجٌ وَجَعَلَ بَيْنَهُمَا بَرْزَخًا وَحِجْرًا مَحْجُورًا'
  trl: 'Wa-huwa lladhī maraja l-baḥrayni hādhā ʿadhbun furātun wa-hādhā milḥun ujājun wa-jaʿala baynahumā barzakhan wa-ḥijran maḥjūrā'
  trad: 'Et c''est Ce qui a laissé libres l''une à côté de l''autre (maraja) les deux mers (al-baḥrayn) — celle-ci douce et désaltérante (ʿadhb, furāt), celle-là salée et âcre (milḥ, ujāj) — et a placé entre elles un barzakh, et un ḥijran maḥjūrā (une séparation infranchissable).'
- ref: 'S.25:54'
  ar: 'وَهُوَ الَّذِي خَلَقَ مِنَ الْمَاءِ بَشَرًا فَجَعَلَهُ نَسَبًا وَصِهْرًا ۗ وَكَانَ رَبُّكَ قَدِيرًا'
  trl: 'Wa-huwa lladhī khalaqa mina l-māʾi basharan fa-jaʿalahu nasaban wa-ṣihran wa-kāna rabbuka qadīrā'
  trad: 'Et c''est Ce qui a créé, à partir de l''eau, un bashar (être humain) — et en a fait [un lien de] filiation (nasab) et [un lien] d''alliance par le mariage (ṣihr) — et ton Rabb est Qadīr (pleinement capable).'
- ref: 'S.25:55'
  ar: 'وَيَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُهُمْ وَلَا يَضُرُّهُمْ ۗ وَكَانَ الْكَافِرُ عَلَىٰ رَبِّهِ ظَهِيرًا'
  trl: 'Wa-yaʿbudūna min dūni llāhi mā lā yanfaʿuhum wa-lā yaḍurruhum wa-kāna l-kāfiru ʿalā rabbihi ẓahīrā'
  trad: 'Et ils adorent, en dehors d''Allaah, ce qui ne leur est d''aucun profit et ne leur nuit en rien — et le kāfir est, contre son Rabb, un soutien prêté [à la cause adverse] (ẓahīr).'
- ref: 'S.25:56'
  ar: 'وَمَا أَرْسَلْنَاكَ إِلَّا مُبَشِّرًا وَنَذِيرًا'
  trl: 'Wa-mā arsalnāka illā mubashshiran wa-nadhīrā'
  trad: 'Et Nous ne t''avons envoyé que comme annonciateur de bonne nouvelle (mubashshir) et avertisseur (nadhīr).'
- ref: 'S.25:57'
  ar: 'قُلْ مَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ إِلَّا مَنْ شَاءَ أَنْ يَتَّخِذَ إِلَىٰ رَبِّهِ سَبِيلًا'
  trl: 'Qul mā asʾalukum ʿalayhi min ajrin illā man shāʾa an yattakhidha ilā rabbihi sabīlā'
  trad: 'Dis : « Je ne vous demande, pour cela, aucun salaire (ajr) — sinon que celui qui le veut prenne, vers son Rabb, un chemin. »'
- ref: 'S.25:58'
  ar: 'وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ ۚ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا'
  trl: 'Wa-tawakkal ʿalā l-ḥayyi lladhī lā yamūtu wa-sabbiḥ bi-ḥamdihi wa-kafā bihi bi-dhunūbi ʿibādihi khabīrā'
  trad: 'Et place ta confiance (tawakkal) en al-Ḥayy, ce qui ne meurt pas — et glorifie-Le (sabbiḥ) en Le louant (bi-ḥamdihi) — et Il suffit, des péchés (dhunūb) de Ses ʿibād, comme Khabīr (pleinement informé).'
- ref: 'S.25:59'
  ar: 'الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ ۚ الرَّحْمَٰنُ فَاسْأَلْ بِهِ خَبِيرًا'
  trl: 'Alladhī khalaqa s-samāwāti wa-l-arḍa wa-mā baynahumā fī sittati ayyāmin thumma-stawā ʿalā l-ʿarshi r-raḥmānu fa-sʾal bihi khabīrā'
  trad: 'Ce qui a créé les cieux et la terre, et ce qui est entre les deux, en six jours (sittati ayyāmin), puis a pris pleinement possession (istawā) du ʿArsh — ar-Raḥmān ! Interroge donc, à Son sujet, un Khabīr (pleinement informé).'
- ref: 'S.25:60'
  ar: 'وَإِذَا قِيلَ لَهُمُ اسْجُدُوا لِلرَّحْمَٰنِ قَالُوا وَمَا الرَّحْمَٰنُ أَنَسْجُدُ لِمَا تَأْمُرُنَا وَزَادَهُمْ نُفُورًا ۩'
  trl: 'Wa-idhā qīla lahumu sjudū li-r-Raḥmāni qālū wa-mā r-Raḥmānu a-nasjudu li-mā taʾmurunā wa-zādahum nufūrā'
  trad: 'Et quand il leur est dit : « Prosternez-vous devant ar-Raḥmān » — ils disent : « Et qu''est-ce qu''ar-Raḥmān ? Nous prosternerions-nous devant ce que tu nous ordonnes ? » — et cela n''a fait qu''accroître leur aversion (nufūr).'
- ref: 'S.25:61'
  ar: 'تَبَارَكَ الَّذِي جَعَلَ فِي السَّمَاءِ بُرُوجًا وَجَعَلَ فِيهَا سِرَاجًا وَقَمَرًا مُنِيرًا'
  trl: 'Tabāraka lladhī jaʿala fi s-samāʾi burūjan wa-jaʿala fīhā sirājan wa-qamaran munīrā'
  trad: 'Tabāraka — Ce qui a placé, dans le ciel, des burūj (positions stellaires), et y a placé un sirāj (un luminaire) et une lune éclairante (qamar munīr).'
- ref: 'S.25:62'
  ar: 'وَهُوَ الَّذِي جَعَلَ اللَّيْلَ وَالنَّهَارَ خِلْفَةً لِمَنْ أَرَادَ أَنْ يَذَّكَّرَ أَوْ أَرَادَ شُكُورًا'
  trl: 'Wa-huwa lladhī jaʿala l-layla wa-n-nahāra khilfatan li-man arāda an yadhdhakkara aw arāda shukūrā'
  trad: 'Et c''est Ce qui a fait de la nuit et du jour une succession alternée (khilfa), pour qui veut se rappeler, ou qui veut la gratitude (shukūr).'
- ref: 'S.25:63'
  ar: 'وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا'
  trl: 'Wa-ʿibādu r-Raḥmāni lladhīna yamshūna ʿalā l-arḍi hawnan wa-idhā khāṭabahumu l-jāhilūna qālū salāmā'
  trad: 'Et les ʿibād d''ar-Raḥmān sont ceux qui marchent sur la terre d''un pas mesuré (hawnan), et qui, lorsque les jāhilūn les interpellent, répondent : « Salām (paix) ! »'
- ref: 'S.25:64'
  ar: 'وَالَّذِينَ يَبِيتُونَ لِرَبِّهِمْ سُجَّدًا وَقِيَامًا'
  trl: 'Wa-lladhīna yabītūna li-rabbihim sujjadan wa-qiyāmā'
  trad: 'Et ceux qui passent la nuit (yabītūna), pour leur Rabb, prosternés (sujjad) et debout (qiyām).'
- ref: 'S.25:65–66'
  ar: 'وَالَّذِينَ يَقُولُونَ رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا'
  trl: 'Wa-lladhīna yaqūlūna rabbanā-ṣrif ʿannā ʿadhāba jahannama inna ʿadhābahā kāna gharāman · innahā sāʾat mustaqarran wa-muqāmā'
  trad: 'Et ceux qui disent : « Notre Rabb, détourne de nous le châtiment de Jahannam » — son châtiment est, certes, un gharām (un mal qui s''attache sans jamais relâcher). Elle est, certes, un mauvais lieu d''établissement (mustaqarr) et de séjour (muqām).'
- ref: 'S.25:67'
  ar: 'وَالَّذِينَ إِذَا أَنْفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا'
  trl: 'Wa-lladhīna idhā anfaqū lam yusrifū wa-lam yaqturū wa-kāna bayna dhālika qawāmā'
  trad: 'Et ceux qui, lorsqu''ils dépensent, ne versent ni dans l''isrāf (l''excès), ni dans l''iqtār (l''avarice étroite), mais tiennent, entre les deux, une juste mesure (qawām).'
- ref: 'S.25:68–69'
  ar: 'وَالَّذِينَ لَا يَدْعُونَ مَعَ اللَّهِ إِلَٰهًا آخَرَ وَلَا يَقْتُلُونَ النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ وَلَا يَزْنُونَ ۚ وَمَنْ يَفْعَلْ ذَٰلِكَ يَلْقَ أَثَامًا يُضَاعَفْ لَهُ الْعَذَابُ يَوْمَ الْقِيَامَةِ وَيَخْلُدْ فِيهِ مُهَانًا'
  trl: 'Wa-lladhīna lā yadʿūna maʿa llāhi ilāhan ākhara wa-lā yaqtulūna n-nafsa llatī ḥarrama llāhu illā bi-l-ḥaqqi wa-lā yaznūna wa-man yafʿal dhālika yalqa athāmā · yuḍāʿaf lahu l-ʿadhābu yawma l-qiyāmati wa-yakhlud fīhi muhānā'
  trad: 'Et ceux qui n''invoquent, avec Allaah, nul autre ilāh, qui ne tuent pas le nafs (la vie) qu''Allaah a rendu inviolable (ḥarrama), sinon à bon droit (bi-l-ḥaqq), et qui ne commettent pas la zinā — car quiconque fait cela rencontrera un athām (un poids de faute) : le châtiment lui sera doublé au Jour de la résurrection, et il y demeurera à jamais (yakhlud), abaissé (muhān).'
- ref: 'S.25:70–71'
  ar: 'إِلَّا مَنْ تَابَ وَآمَنَ وَعَمِلَ عَمَلًا صَالِحًا فَأُولَٰئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ ۗ وَكَانَ اللَّهُ غَفُورًا رَحِيمًا وَمَنْ تَابَ وَعَمِلَ صَالِحًا فَإِنَّهُ يَتُوبُ إِلَى اللَّهِ مَتَابًا'
  trl: 'Illā man tāba wa-āmana wa-ʿamila ʿamalan ṣāliḥan fa-ulāʾika yubaddilu llāhu sayyiʾātihim ḥasanātin wa-kāna llāhu ghafūran raḥīmā · wa-man tāba wa-ʿamila ṣāliḥan fa-innahu yatūbu ilā llāhi matābā'
  trad: 'Sauf qui revient (tāba), croit et accomplit une œuvre droite — ceux-là, Allaah change leurs mauvaises actions (sayyiʾāt) en bonnes actions (ḥasanāt) ; Allaah est Ghafūr, Raḥīm. Et quiconque revient et accomplit une œuvre droite, celui-là revient vers Allaah d''un véritable retour (matāb).'
- ref: 'S.25:72'
  ar: 'وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا'
  trl: 'Wa-lladhīna lā yashhadūna z-zūra wa-idhā marrū bi-l-laghwi marrū kirāmā'
  trad: 'Et ceux qui ne témoignent pas du zūr (du faux), et qui, lorsqu''ils croisent le laghw (la parole vaine), passent en préservant leur dignité (kirām).'
- ref: 'S.25:73'
  ar: 'وَالَّذِينَ إِذَا ذُكِّرُوا بِآيَاتِ رَبِّهِمْ لَمْ يَخِرُّوا عَلَيْهَا صُمًّا وَعُمْيَانًا'
  trl: 'Wa-lladhīna idhā dhukkirū bi-āyāti rabbihim lam yakhirrū ʿalayhā ṣumman wa-ʿumyānā'
  trad: 'Et ceux qui, lorsqu''on les rappelle aux āyāt (signes) de leur Rabb, ne s''effondrent pas devant elles sourds et aveugles.'
- ref: 'S.25:74'
  ar: 'وَالَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا'
  trl: 'Wa-lladhīna yaqūlūna rabbanā hab lanā min azwājinā wa-dhurriyyātinā qurrata aʿyunin wa-jʿalnā li-l-muttaqīna imāmā'
  trad: 'Et ceux qui disent : « Notre Rabb, accorde-nous, de nos épouses et de notre descendance, ce qui apaise le regard (qurrata aʿyun), et fais de nous, pour les muttaqūn, un modèle (imām). »'
- ref: 'S.25:75–76'
  ar: 'أُولَٰئِكَ يُجْزَوْنَ الْغُرْفَةَ بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا خَالِدِينَ فِيهَا ۚ حَسُنَتْ مُسْتَقَرًّا وَمُقَامًا'
  trl: 'Ulāʾika yujzawna l-ghurfata bi-mā ṣabarū wa-yulaqqawna fīhā taḥiyyatan wa-salāmā · khālidīna fīhā ḥasunat mustaqarran wa-muqāmā'
  trad: 'Ceux-là seront rétribués de la ghurfa (la demeure élevée), pour avoir enduré avec constance (ṣabarū), et y seront accueillis par une taḥiyya (salutation) et par salām (la paix) — y demeurant à jamais (khālidīn) : quel bon lieu d''établissement et de séjour !'
- ref: 'S.25:77'
  ar: 'قُلْ مَا يَعْبَأُ بِكُمْ رَبِّي لَوْلَا دُعَاؤُكُمْ ۖ فَقَدْ كَذَّبْتُمْ فَسَوْفَ يَكُونُ لِزَامًا'
  trl: 'Qul mā yaʿbaʾu bikum rabbī lawlā duʿāʾukum fa-qad kadhdhabtum fa-sawfa yakūnu lizāmā'
  trad: 'Dis : « Que pèseriez-vous pour mon Rabb, sans votre invocation (duʿāʾ) ? Vous avez certes démenti — cela deviendra donc une conséquence inévitable (lizām). »'
