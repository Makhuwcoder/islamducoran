- ref: S.5:1
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ ۚ أُحِلَّتْ لَكُم بَهِيمَةُ الْأَنْعَامِ إِلَّا مَا يُتْلَىٰ عَلَيْكُمْ غَيْرَ مُحِلِّي الصَّيْدِ وَأَنتُمْ حُرُمٌ ۗ إِنَّ اللَّهَ يَحْكُمُ مَا يُرِيدُ
  trl: Yā ayyuhā lladhīna āmanū awfū bi-l-ʿuqūd — uḥillat lakum bahīmatu l-anʿāmi illā mā yutlā ʿalaykum ghayra muḥillī ṣ-ṣaydi wa-antum ḥurum — inna llāha yaḥkumu mā yurīd
  trad: Ô vous qui avez cru, honorez pleinement les *ʿuqūd* (les engagements contractés) — vous est rendu licite le bétail des troupeaux (*bahīmat al-anʿām*), à l'exception de ce qui vous sera récité [plus loin] — sans rendre licite la chasse alors que vous êtes en état de *ḥurum* (sacralisation). Allaah décide ce qu'Il veut.
- ref: S.5:2
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُحِلُّوا شَعَائِرَ اللَّهِ وَلَا الشَّهْرَ الْحَرَامَ وَلَا الْهَدْيَ وَلَا الْقَلَائِدَ وَلَا آمِّينَ الْبَيْتَ الْحَرَامَ يَبْتَغُونَ فَضْلًا مِّن رَّبِّهِمْ وَرِضْوَانًا ۚ وَإِذَا حَلَلْتُمْ فَاصْطَادُوا ۚ وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ أَن صَدُّوكُمْ عَنِ الْمَسْجِدِ الْحَرَامِ أَن تَعْتَدُوا ۘ وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ ۚ وَاتَّقُوا اللَّهَ ۖ إِنَّ اللَّهَ شَدِيدُ الْعِقَابِ
  trl: Yā ayyuhā lladhīna āmanū lā tuḥillū shaʿāʾira llāhi wa-lā sh-shahra l-ḥarāma wa-lā l-hadya wa-lā l-qalāʾida wa-lā āmmīna l-bayta l-ḥarāma yabtaghūna faḍlan min rabbihim wa-riḍwānā — wa-idhā ḥalaltum fa-ṣṭādū — wa-lā yajrimannakum shanaʾānu qawmin an ṣaddūkum ʿani l-masjidi l-ḥarāmi an taʿtadū — wa-taʿāwanū ʿalā l-birri wa-t-taqwā wa-lā taʿāwanū ʿalā l-ithmi wa-l-ʿudwān — wa-ttaqu llāh — inna llāha shadīdu l-ʿiqāb
  trad: Ô vous qui avez cru, ne rendez pas illicites les *shaʿāʾir* (marqueurs distinctifs) d'Allaah, ni le mois sacré, ni les offrandes destinées [au sanctuaire] (*al-hady*), ni les guirlandes qui les signalent (*al-qalāʾid*), ni ceux qui se dirigent vers la Maison sacrée en quête d'une faveur de leur *Rabb* et d'un agrément. Et une fois sortis de l'état de sacralisation, chassez [si vous le voulez]. Et que la haine envers un peuple, du fait qu'il vous a barré l'accès à la Mosquée sacrée, ne vous entraîne pas à transgresser. Entraidez-vous dans le *birr* (la droiture agissante) et la *taqwā*, et ne vous entraidez pas dans l'*ithm* (la faute) et l'*ʿudwān* (l'hostilité qui dépasse la limite). Constituez-vous une taqwā (d'Allaah) — Allaah est sévère dans la sanction.
- ref: S.5:3
  ar: حُرِّمَتْ عَلَيْكُمُ الْمَيْتَةُ وَالدَّمُ وَلَحْمُ الْخِنزِيرِ وَمَا أُهِلَّ لِغَيْرِ اللَّهِ بِهِ وَالْمُنْخَنِقَةُ وَالْمَوْقُوذَةُ وَالْمُتَرَدِّيَةُ وَالنَّطِيحَةُ وَمَا أَكَلَ السَّبُعُ إِلَّا مَا ذَكَّيْتُمْ وَمَا ذُبِحَ عَلَى النُّصُبِ وَأَن تَسْتَقْسِمُوا بِالْأَزْلَامِ ۚ ذَٰلِكُمْ فِسْقٌ ۗ الْيَوْمَ يَئِسَ الَّذِينَ كَفَرُوا مِن دِينِكُمْ فَلَا تَخْشَوْهُمْ وَاخْشَوْنِ ۚ الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا ۚ فَمَنِ اضْطُرَّ فِي مَخْمَصَةٍ غَيْرَ مُتَجَانِفٍ لِّإِثْمٍ ۙ فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Ḥurrimat ʿalaykumu l-maytatu wa-d-damu wa-laḥmu l-khinzīri wa-mā uhilla li-ghayri llāhi bihi wa-l-munkhaniqatu wa-l-mawqūdhatu wa-l-mutaraddiyatu wa-n-naṭīḥatu wa-mā akala s-sabuʿu illā mā dhakkaytum wa-mā dhubiḥa ʿalā n-nuṣubi wa-an tastaqsimū bi-l-azlām — dhālikum fisq — al-yawma yaʾisa lladhīna kafarū min dīnikum fa-lā takhshawhum wa-khshawni — al-yawma akmaltu lakum dīnakum wa-atmamtu ʿalaykum niʿmatī wa-raḍītu lakumu l-islāma dīnā — fa-mani ḍṭurra fī makhmaṣatin ghayra mutajānifin li-ithmin fa-inna llāha ghafūrun raḥīm
  trad: 'Vous sont interdits la bête morte [d''elle-même] (*al-maytata*), le sang, la chair du porc, ce sur quoi un nom autre qu''Allaah a été proclamé, la bête étranglée, la bête assommée, celle qui a fait une chute mortelle, celle qui a été encornée à mort, celle qu''une bête féroce a dévorée — sauf ce que vous avez [pu] égorger [alors qu''elle vivait encore] —, ce qui a été sacrifié sur des pierres dressées (*an-nuṣub*), et le fait de chercher une décision par les flèches divinatoires (*al-azlām*) : voilà un *[fisq](#fisq)* (un écart hors du cadre). Aujourd''hui, ceux qui ont commis le *kufr* désespèrent [de voir aboutir leurs visées contre] votre *dīn* — ne les craignez donc pas, et craignez-Moi. Aujourd''hui J''ai rendu complet pour vous votre *dīn*, J''ai parachevé sur vous Mon bienfait (*niʿma*), et J''ai agréé pour vous l''*al-islām* comme *dīn*. Quant à quiconque est contraint par la faim, sans inclination vers la faute, alors Allaah est *Ghafūr*, *Raḥīm*.'
- ref: S.5:4
  ar: يَسْأَلُونَكَ مَاذَا أُحِلَّ لَهُمْ ۖ قُلْ أُحِلَّ لَكُمُ الطَّيِّبَاتُ ۙ وَمَا عَلَّمْتُم مِّنَ الْجَوَارِحِ مُكَلِّبِينَ تُعَلِّمُونَهُنَّ مِمَّا عَلَّمَكُمُ اللَّهُ ۖ فَكُلُوا مِمَّا أَمْسَكْنَ عَلَيْكُمْ وَاذْكُرُوا اسْمَ اللَّهِ عَلَيْهِ ۖ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ
  trl: Yasʾalūnaka mādhā uḥilla lahum — qul uḥilla lakumu ṭ-ṭayyibātu wa-mā ʿallamtum mina l-jawāriḥi mukallibīna tuʿallimūnahunna mimmā ʿallamakumu llāhu fa-kulū mimmā amsakna ʿalaykum wa-dhkuru sma llāhi ʿalayhi wa-ttaqu llāh — inna llāha sarīʿu l-ḥisāb
  trad: 'Ils t''interrogent sur ce qui leur est rendu licite. Dis : « Vous sont rendues licites les *ṭayyibāt* (les bonnes choses), ainsi que ce qu''ont capturé pour vous les animaux de chasse dressés (*al-jawāriḥ*), que vous avez dressés d''après ce qu''Allaah vous a enseigné. Mangez donc de ce qu''ils retiennent pour vous, et mentionnez sur cela le nom d''Allaah — et constituez-vous une taqwā (d''Allaah). Allaah est prompt dans le compte. »'
- ref: S.5:5
  ar: الْيَوْمَ أُحِلَّ لَكُمُ الطَّيِّبَاتُ ۖ وَطَعَامُ الَّذِينَ أُوتُوا الْكِتَابَ حِلٌّ لَّكُمْ وَطَعَامُكُمْ حِلٌّ لَّهُمْ ۖ وَالْمُحْصَنَاتُ مِنَ الْمُؤْمِنَاتِ وَالْمُحْصَنَاتُ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ مِن قَبْلِكُمْ إِذَا آتَيْتُمُوهُنَّ أُجُورَهُنَّ مُحْصِنِينَ غَيْرَ مُسَافِحِينَ وَلَا مُتَّخِذِي أَخْدَانٍ ۗ وَمَن يَكْفُرْ بِالْإِيمَانِ فَقَدْ حَبِطَ عَمَلُهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ
  trl: Al-yawma uḥilla lakumu ṭ-ṭayyibātu — wa-ṭaʿāmu lladhīna ūtu l-kitāba ḥillun lakum wa-ṭaʿāmukum ḥillun lahum — wa-l-muḥṣanātu mina l-muʾmināti wa-l-muḥṣanātu mina lladhīna ūtu l-kitāba min qablikum idhā ātaytumūhunna ujūrahunna muḥṣinīna ghayra musāfiḥīna wa-lā muttakhidhī akhdān — wa-man yakfur bi-l-īmāni fa-qad ḥabiṭa ʿamaluhu wa-huwa fī l-ākhirati mina l-khāsirīn
  trad: Aujourd'hui, les *ṭayyibāt* vous sont rendues licites, et la nourriture de ceux à qui le Livre a été donné est licite pour vous, et votre nourriture est licite pour eux — et [vous sont rendues licites] les femmes *muḥṣanāt* (préservées dans la chasteté) parmi les croyantes, et les femmes *muḥṣanāt* parmi ceux à qui le Livre a été donné avant vous, dès lors que vous leur remettez leurs *[ujūr](/etudes/trad-s4-bloc2/#ujur)* (leurs dus), en [les prenant] comme *[muḥṣinīn](/etudes/trad-s4-bloc2/#muhsanat)* (dans une visée d'engagement protégé), non comme *[musāfiḥīn](/etudes/trad-s4-bloc2/#muhsanat)* (dans une visée de débauche), ni preneurs d'*[amants secrets](/etudes/trad-s4-bloc2/#akhdan)* (*akhdān*). Quiconque renie ce qui doit être cru (*yakfur bi-l-īmān*), son œuvre s'est videée, et il sera, dans l'au-delà, parmi les perdants.
- ref: S.5:6
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلَاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ ۚ وَإِن كُنتُمْ جُنُبًا فَاطَّهَّرُوا ۚ وَإِن كُنتُم مَّرْضَىٰ أَوْ عَلَىٰ سَفَرٍ أَوْ جَاءَ أَحَدٌ مِّنكُم مِّنَ الْغَائِطِ أَوْ لَامَسْتُمُ النِّسَاءَ فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُم مِّنْهُ ۚ مَا يُرِيدُ اللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ وَلَٰكِن يُرِيدُ لِيُطَهِّرَكُمْ وَلِيُتِمَّ نِعْمَتَهُ عَلَيْكُمْ لَعَلَّكُمْ تَشْكُرُونَ
  trl: Yā ayyuhā lladhīna āmanū idhā qumtum ilā ṣ-ṣalāti fa-ghsilū wujūhakum wa-aydiyakum ilā l-marāfiqi wa-msaḥū bi-ruʾūsikum wa-arjulakum ilā l-kaʿbayn — wa-in kuntum junuban fa-ṭṭahharū — wa-in kuntum marḍā aw ʿalā safarin aw jāʾa aḥadun minkum mina l-ghāʾiṭi aw lāmastumu n-nisāʾa fa-lam tajidū māʾan fa-tayammamū ṣaʿīdan ṭayyiban fa-msaḥū bi-wujūhikum wa-aydīkum minhu — mā yurīdu llāhu li-yajʿala ʿalaykum min ḥarajin wa-lākin yurīdu li-yuṭahhirakum wa-li-yutimma niʿmatahu ʿalaykum laʿallakum tashkurūn
  trad: 'Ô vous qui avez cru, lorsque vous vous levez pour la *ṣalāt*, lavez vos visages et vos mains jusqu''aux coudes, passez les mains humides sur vos têtes, et [lavez] vos pieds jusqu''aux chevilles. Si vous êtes en état de *[janāba](/etudes/trad-s4-bloc2/#junub)* (impureté majeure), purifiez-vous entièrement (*fa-ṭṭahharū*). Et si vous êtes malades, ou en voyage, ou que l''un de vous revient du *[lieu retiré](/etudes/trad-s4-bloc2/#ghait)* (*al-ghāʾiṭ*), ou que vous avez eu un contact avec les femmes, et que vous ne trouvez pas d''eau, alors recourez au *[tayammum](/etudes/trad-s4-bloc2/#tayammum)* sur une *[surface pure](/etudes/trad-s4-bloc2/#said-tayyib)* (*ṣaʿīdan ṭayyibā*) : passez-en sur vos visages et vos mains. Allaah ne veut pas vous imposer de *[gêne](/etudes/trad-s4-bloc4/#haraj)* (*ḥaraj*), mais Il veut vous purifier et parachever sur vous Son bienfait, afin que vous soyez reconnaissants.'
- ref: S.5:7
  ar: وَاذْكُرُوا نِعْمَةَ اللَّهِ عَلَيْكُمْ وَمِيثَاقَهُ الَّذِي وَاثَقَكُمْ بِهِ إِذْ قُلْتُمْ سَمِعْنَا وَأَطَعْنَا ۖ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ عَلِيمٌ بِذَاتِ الصُّدُورِ
  trl: Wa-dhkurū niʿmata llāhi ʿalaykum wa-mīthāqahu lladhī wāthaqakum bihi idh qultum samiʿnā wa-aṭaʿnā — wa-ttaqu llāh — inna llāha ʿalīmun bi-dhāti ṣ-ṣudūr
  trad: 'Et rappelez-vous le bienfait (*niʿma*) d''Allaah sur vous, et Son *mīthāq* par lequel Il vous a liés, quand vous avez dit : « Nous avons entendu et nous avons obéi » (*samiʿnā wa-aṭaʿnā*) — constituez-vous une taqwā (d''Allaah) — Allaah est *ʿAlīm* de ce qui est au fond des poitrines (*bi-dhāti ṣ-ṣudūr*).'
- ref: S.5:8
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْطِ ۖ وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا ۚ اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَىٰ ۖ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ
  trl: Yā ayyuhā lladhīna āmanū kūnū qawwāmīna li-llāhi shuhadāʾa bi-l-qisṭi — wa-lā yajrimannakum shanaʾānu qawmin ʿalā allā taʿdilū — iʿdilū huwa aqrabu li-t-taqwā — wa-ttaqu llāh — inna llāha khabīrun bimā taʿmalūn
  trad: 'Ô vous qui avez cru, soyez fermement établis (*qawwāmīn*) pour Allaah, témoins avec le *qisṭ* (l''exacte répartition) — et que la haine (*shanaʾān*) envers un peuple ne vous entraîne pas à ne plus être justes (*allā taʿdilū*). Soyez justes (*iʿdilū*) : c''est plus proche de la *taqwā*. Et constituez-vous une taqwā (d''Allaah) — Allaah est *Khabīr* de ce que vous faites.'
- ref: S.5:9–10
  ar: وَعَدَ اللَّهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ ۙ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ عَظِيمٌ ۝ وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَٰئِكَ أَصْحَابُ الْجَحِيمِ
  trl: Waʿada llāhu lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti — lahum maghfiratun wa-ajrun ʿaẓīm · Wa-lladhīna kafarū wa-kadhdhabū bi-āyātinā ulāʾika aṣḥābu l-jaḥīm
  trad: Allaah a promis à ceux qui ont cru et fait ce qui est droit — à eux un pardon (*maghfira*) et une rétribution immense. Et ceux qui ont rejeté (*kafarū*) et démenti Nos *āyāt*, ceux-là sont les compagnons du *jaḥīm*.
- ref: S.5:11
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ إِذْ هَمَّ قَوْمٌ أَنْ يَبْسُطُوا إِلَيْكُمْ أَيْدِيَهُمْ فَكَفَّ أَيْدِيَهُمْ عَنْكُمْ ۖ وَاتَّقُوا اللَّهَ ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ
  trl: Yā ayyuhā lladhīna āmanū dhkurū niʿmata llāhi ʿalaykum idh hamma qawmun an yabsuṭū ilaykum aydiyahum fa-kaffa aydiyahum ʿankum — wa-ttaqu llāh — wa-ʿalā llāhi fa-l-yatawakkali l-muʾminūn
  trad: Ô vous qui avez cru, rappelez-vous le bienfait d'Allaah sur vous, quand un peuple résolut de porter la main sur vous (*an yabsuṭū ilaykum aydiyahum*), et qu'Il a retenu leurs mains loin de vous — constituez-vous une taqwā (d'Allaah), et c'est sur Allaah que les croyants doivent s'en remettre (*fa-l-yatawakkali*).
- ref: S.5:12
  ar: ۞ وَلَقَدْ أَخَذَ اللَّهُ مِيثَاقَ بَنِي إِسْرَائِيلَ وَبَعَثْنَا مِنْهُمُ اثْنَيْ عَشَرَ نَقِيبًا ۖ وَقَالَ اللَّهُ إِنِّي مَعَكُمْ ۖ لَئِنْ أَقَمْتُمُ الصَّلَاةَ وَآتَيْتُمُ الزَّكَاةَ وَآمَنْتُمْ بِرُسُلِي وَعَزَّرْتُمُوهُمْ وَأَقْرَضْتُمُ اللَّهَ قَرْضًا حَسَنًا لَأُكَفِّرَنَّ عَنْكُمْ سَيِّئَاتِكُمْ وَلَأُدْخِلَنَّكُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ۚ فَمَنْ كَفَرَ بَعْدَ ذَٰلِكَ مِنْكُمْ فَقَدْ ضَلَّ سَوَاءَ السَّبِيلِ
  trl: Wa-la-qad akhadha llāhu mīthāqa banī isrāʾīla wa-baʿathnā minhumu thnay ʿashara naqībā — wa-qāla llāhu innī maʿakum — la-in aqamtumu ṣ-ṣalāta wa-ātaytumu z-zakāta wa-āmantum bi-rusulī wa-ʿazzartumūhum wa-aqraḍtumu llāha qarḍan ḥasanan la-ukaffiranna ʿankum sayyiʾātikum wa-la-udkhilannakum jannātin tajrī min taḥtihā l-anhāru — fa-man kafara baʿda dhālika minkum fa-qad ḍalla sawāʾa s-sabīl
  trad: 'Allaah a certes pris le *mīthāq* des Banū Isrāʾīl, et Nous avons suscité parmi eux douze *naqīb* (répondants désignés). Allaah a dit : « Je suis avec vous. Si vous établissez la *ṣalāt*, donnez la *zakāt*, croyez en Mes *rusul* et les soutenez fermement (*ʿazzartumūhum*), et faites à Allaah un beau prêt (*qarḍan ḥasanan*), J''effacerai assurément pour vous vos fautes, et Je vous ferai assurément entrer dans des jardins sous lesquels coulent les rivières. Quiconque, parmi vous, rejette après cela, s''est certes égaré loin du milieu du chemin (*ḍalla sawāʾa s-sabīl*). »'
- ref: S.5:13
  ar: فَبِمَا نَقْضِهِمْ مِيثَاقَهُمْ لَعَنَّاهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَاسِيَةً ۖ يُحَرِّفُونَ الْكَلِمَ عَنْ مَوَاضِعِهِ ۙ وَنَسُوا حَظًّا مِمَّا ذُكِّرُوا بِهِ ۚ وَلَا تَزَالُ تَطَّلِعُ عَلَىٰ خَائِنَةٍ مِنْهُمْ إِلَّا قَلِيلًا مِنْهُمْ ۖ فَاعْفُ عَنْهُمْ وَاصْفَحْ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ
  trl: Fa-bimā naqḍihim mīthāqahum laʿannāhum wa-jaʿalnā qulūbahum qāsiyatan — yuḥarrifūna l-kalima ʿan mawāḍiʿihi wa-nasū ḥaẓẓan mimmā dhukkirū bihi — wa-lā tazālu taṭṭaliʿu ʿalā khāʾinatin minhum illā qalīlan minhum — fa-ʿfu ʿanhum wa-ṣfaḥ — inna llāha yuḥibbu l-muḥsinīn
  trad: Alors, pour avoir rompu leur *mīthāq*, Nous les avons éloignés [de Notre *raḥma*] (*laʿannāhum*) et avons rendu leurs cœurs durs (*qāsiya*) — ils déplacent les mots (*yuḥarrifūna l-kalima*) hors de leurs positions [véritables], et ils ont oublié une part de ce qui leur avait été rappelé. Tu ne cesseras de découvrir chez eux une trahison (*khāʾina*), sauf un petit nombre d'entre eux — pardonne-leur donc et passe outre (*fa-ʿfu ʿanhum wa-ṣfaḥ*) — Allaah honore les *[muḥsinūn](/etudes/trad-s2-bloc4/#muhsin)*.
- ref: S.5:14
  ar: وَمِنَ الَّذِينَ قَالُوا إِنَّا نَصَارَىٰ أَخَذْنَا مِيثَاقَهُمْ فَنَسُوا حَظًّا مِمَّا ذُكِّرُوا بِهِ فَأَغْرَيْنَا بَيْنَهُمُ الْعَدَاوَةَ وَالْبَغْضَاءَ إِلَىٰ يَوْمِ الْقِيَامَةِ ۚ وَسَوْفَ يُنَبِّئُهُمُ اللَّهُ بِمَا كَانُوا يَصْنَعُونَ
  trl: Wa-mina lladhīna qālū innā naṣārā akhadhnā mīthāqahum fa-nasū ḥaẓẓan mimmā dhukkirū bihi fa-aghraynā baynahumu l-ʿadāwata wa-l-baghḍāʾa ilā yawmi l-qiyāmati — wa-sawfa yunabbiʾuhumu llāhu bimā kānū yaṣnaʿūn
  trad: 'Et parmi ceux qui ont dit : « Nous sommes *naṣārā* », Nous avons pris leur *mīthāq* — mais ils ont oublié une part de ce qui leur avait été rappelé ; Nous avons alors suscité entre eux l''inimitié (*al-ʿadāwa*) et la haine profonde (*al-baghḍāʾ*), jusqu''au Jour de la Résurrection. Allaah les informera de ce qu''ils faisaient.'
- ref: S.5:15–16
  ar: يَا أَهْلَ الْكِتَابِ قَدْ جَاءَكُمْ رَسُولُنَا يُبَيِّنُ لَكُمْ كَثِيرًا مِمَّا كُنتُمْ تُخْفُونَ مِنَ الْكِتَابِ وَيَعْفُو عَنْ كَثِيرٍ ۚ قَدْ جَاءَكُمْ مِنَ اللَّهِ نُورٌ وَكِتَابٌ مُبِينٌ ۝ يَهْدِي بِهِ اللَّهُ مَنِ اتَّبَعَ رِضْوَانَهُ سُبُلَ السَّلَامِ وَيُخْرِجُهُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ بِإِذْنِهِ وَيَهْدِيهِمْ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ
  trl: Yā ahla l-kitābi qad jāʾakum rasūlunā yubayyinu lakum kathīran mimmā kuntum tukhfūna mina l-kitābi wa-yaʿfū ʿan kathīr — qad jāʾakum mina llāhi nūrun wa-kitābun mubīn · Yahdī bihi llāhu mani ttabaʿa riḍwānahu subula s-salāmi wa-yukhrijuhum mina ẓ-ẓulumāti ilā n-nūri bi-idhnihi wa-yahdīhim ilā ṣirāṭin mustaqīm
  trad: Ô *ahl al-kitāb*, Notre *rasūl* vous est certes venu, vous clarifiant (*yubayyinu*) beaucoup de ce que vous dissimuliez (*tukhfūna*) du Livre, et passant sur beaucoup [d'autre] (*yaʿfū ʿan kathīr*) — une lumière (*nūr*) et un Livre explicite (*kitāb mubīn*) vous sont certes venus de la part d'Allaah. Par lui, Allaah guide quiconque suit Son agrément (*riḍwānahu*) vers les chemins de la paix (*subul as-salām*), les fait sortir des ténèbres (*aẓ-ẓulumāt*) vers la lumière (*an-nūr*) avec Sa permission (*bi-idhnihi*), et les guide vers un chemin droit (*ṣirāṭ mustaqīm*).
- ref: S.5:17
  ar: لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ هُوَ الْمَسِيحُ ابْنُ مَرْيَمَ ۚ قُلْ فَمَنْ يَمْلِكُ مِنَ اللَّهِ شَيْئًا إِنْ أَرَادَ أَنْ يُهْلِكَ الْمَسِيحَ ابْنَ مَرْيَمَ وَأُمَّهُ وَمَنْ فِي الْأَرْضِ جَمِيعًا ۗ وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا ۚ يَخْلُقُ مَا يَشَاءُ ۚ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: La-qad kafara lladhīna qālū inna llāha huwa l-masīḥu bnu maryama — qul fa-man yamliku mina llāhi shayʾan in arāda an yuhlika l-masīḥa bna maryama wa-ummahu wa-man fi l-arḍi jamīʿan — wa-lillāhi mulku s-samāwāti wa-l-arḍi wa-mā baynahumā — yakhluqu mā yashāʾu — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: 'Ceux qui ont dit : « Allaah, c''est Lui, al-Masīḥ fils de Maryam » ont certes commis le *kufr*. Dis : « Qui donc détiendrait quelque pouvoir contre ce qui vient d''Allaah, s''Il voulait faire périr al-Masīḥ fils de Maryam, sa mère, et tous ceux qui sont sur la terre ? » À Allaah appartient la royauté (*mulk*) des cieux et de la terre, et de ce qui est entre les deux — Il crée ce qu''Il veut — et Allaah est, sur toute chose, *Qadīr*.'
- ref: S.5:18
  ar: وَقَالَتِ الْيَهُودُ وَالنَّصَارَىٰ نَحْنُ أَبْنَاءُ اللَّهِ وَأَحِبَّاؤُهُ ۚ قُلْ فَلِمَ يُعَذِّبُكُمْ بِذُنُوبِكُمْ ۖ بَلْ أَنْتُمْ بَشَرٌ مِمَّنْ خَلَقَ ۚ يَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ ۚ وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا ۖ وَإِلَيْهِ الْمَصِيرُ
  trl: Wa-qālati l-yahūdu wa-n-naṣārā naḥnu abnāʾu llāhi wa-aḥibbāʾuhu — qul fa-lima yuʿadhdhibukum bi-dhunūbikum — bal antum basharun mimman khalaqa — yaghfiru li-man yashāʾu wa-yuʿadhdhibu man yashāʾu — wa-lillāhi mulku s-samāwāti wa-l-arḍi wa-mā baynahumā — wa-ilayhi l-maṣīr
  trad: 'Et les *yahūd* et les *naṣārā* ont dit : « Nous sommes les fils d''Allaah et ceux qu''Il honore. » Dis : « Pourquoi donc vous inflige-t-Il un châtiment pour vos fautes (*dhunūb*) ? » — vous n''êtes en réalité que des humains (*bashar*) parmi ceux qu''Il a créés : Il pardonne à qui Il veut et châtie qui Il veut. À Allaah appartient la royauté des cieux et de la terre et de ce qui est entre les deux, et c''est vers Lui qu''est l''aboutissement (*[al-maṣīr](/etudes/trad-s2-bloc13/#masir)*).'
- ref: S.5:19
  ar: يَا أَهْلَ الْكِتَابِ قَدْ جَاءَكُمْ رَسُولُنَا يُبَيِّنُ لَكُمْ عَلَىٰ فَتْرَةٍ مِنَ الرُّسُلِ أَنْ تَقُولُوا مَا جَاءَنَا مِنْ بَشِيرٍ وَلَا نَذِيرٍ ۖ فَقَدْ جَاءَكُمْ بَشِيرٌ وَنَذِيرٌ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Yā ahla l-kitābi qad jāʾakum rasūlunā yubayyinu lakum ʿalā fatratin mina r-rusuli an taqūlū mā jāʾanā min bashīrin wa-lā nadhīrin — fa-qad jāʾakum bashīrun wa-nadhīrun — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: 'Ô *ahl al-kitāb*, Notre *rasūl* vous est certes venu, vous clarifiant [le *dīn*] après un intervalle (*fatra*) sans *rusul* — afin que vous ne disiez pas : « Aucun annonciateur (*bashīr*) ni avertisseur (*nadhīr*) ne nous est venu. » Un annonciateur et un avertisseur vous sont bien venus — et Allaah est, sur toute chose, *Qadīr*.'
- ref: S.5:20
  ar: وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ يَا قَوْمِ اذْكُرُوا نِعْمَةَ اللَّهِ عَلَيْكُمْ إِذْ جَعَلَ فِيكُمْ أَنْبِيَاءَ وَجَعَلَكُمْ مُلُوكًا وَآتَاكُمْ مَا لَمْ يُؤْتِ أَحَدًا مِنَ الْعَالَمِينَ
  trl: Wa-idh qāla mūsā li-qawmihi yā qawmi dhkurū niʿmata llāhi ʿalaykum idh jaʿala fīkum anbiyāʾa wa-jaʿalakum mulūkan wa-ātākum mā lam yuʾti aḥadan mina l-ʿālamīn
  trad: 'Et quand Mūsā dit à son peuple : « Ô mon peuple, rappelez-vous le bienfait (*niʿma*) d''Allaah sur vous, quand Il a placé parmi vous des *anbiyāʾ*, a fait de vous des rois (*mulūkan*), et vous a donné ce qu''Il n''a donné à nul autre parmi les *ʿālamīn*. »'
- ref: S.5:21
  ar: يَا قَوْمِ ادْخُلُوا الْأَرْضَ الْمُقَدَّسَةَ الَّتِي كَتَبَ اللَّهُ لَكُمْ وَلَا تَرْتَدُّوا عَلَىٰ أَدْبَارِكُمْ فَتَنْقَلِبُوا خَاسِرِينَ
  trl: Yā qawmi dkhulū l-arḍa l-muqaddasata llatī kataba llāhu lakum wa-lā tartaddū ʿalā adbārikum fa-tanqalibū khāsirīn
  trad: '« Ô mon peuple, entrez dans la terre sanctifiée (*al-arḍ al-muqaddasa*) qu''Allaah a prescrite (*kataba*) pour vous, et ne rebroussez pas chemin (*lā tartaddū ʿalā adbārikum*) : vous vous retourneriez perdants (*[khāsirīn](/etudes/trad-s2-bloc1/#khasirun)*). »'
- ref: S.5:22
  ar: قَالُوا يَا مُوسَىٰ إِنَّ فِيهَا قَوْمًا جَبَّارِينَ وَإِنَّا لَنْ نَدْخُلَهَا حَتَّىٰ يَخْرُجُوا مِنْهَا فَإِنْ يَخْرُجُوا مِنْهَا فَإِنَّا دَاخِلُونَ
  trl: Qālū yā mūsā inna fīhā qawman jabbārīna wa-innā lan nadkhulahā ḥattā yakhrujū minhā fa-in yakhrujū minhā fa-innā dākhilūn
  trad: 'Ils dirent : « Ô Mūsā, il y a en elle un peuple de tyrans (*jabbārīn*), et nous n''y entrerons jamais tant qu''ils n''en seront pas sortis. S''ils en sortent, alors nous y entrerons. »'
- ref: S.5:23
  ar: قَالَ رَجُلَانِ مِنَ الَّذِينَ يَخَافُونَ أَنْعَمَ اللَّهُ عَلَيْهِمَا ادْخُلُوا عَلَيْهِمُ الْبَابَ فَإِذَا دَخَلْتُمُوهُ فَإِنَّكُمْ غَالِبُونَ ۚ وَعَلَى اللَّهِ فَتَوَكَّلُوا إِنْ كُنْتُمْ مُؤْمِنِينَ
  trl: Qāla rajulāni mina lladhīna yakhāfūna anʿama llāhu ʿalayhimā dkhulū ʿalayhimu l-bāba fa-idhā dakhaltumūhu fa-innakum ghālibūn — wa-ʿalā llāhi fa-tawakkalū in kuntum muʾminīn
  trad: 'Deux hommes, parmi ceux qui craignaient — Allaah leur avait accordé un bienfait — dirent : « Entrez sur eux par la porte : une fois que vous y serez entrés, vous serez assurément vainqueurs (*ghālibūn*). Et c''est sur Allaah qu''il faut s''en remettre (*fa-tawakkalū*), si vous êtes croyants. »'
- ref: S.5:24
  ar: قَالُوا يَا مُوسَىٰ إِنَّا لَنْ نَدْخُلَهَا أَبَدًا مَا دَامُوا فِيهَا ۖ فَاذْهَبْ أَنْتَ وَرَبُّكَ فَقَاتِلَا إِنَّا هَاهُنَا قَاعِدُونَ
  trl: Qālū yā mūsā innā lan nadkhulahā abadan mā dāmū fīhā — fa-dhhab anta wa-rabbuka fa-qātilā innā hāhunā qāʿidūn
  trad: 'Ils dirent : « Ô Mūsā, nous n''y entrerons jamais, aussi longtemps qu''ils y demeureront. Va donc, toi et ton *Rabb*, combattez tous deux — nous, ici, restons assis. »'
- ref: S.5:25
  ar: قَالَ رَبِّ إِنِّي لَا أَمْلِكُ إِلَّا نَفْسِي وَأَخِي ۖ فَافْرُقْ بَيْنَنَا وَبَيْنَ الْقَوْمِ الْفَاسِقِينَ
  trl: Qāla rabbi innī lā amliku illā nafsī wa-akhī — fa-fruq baynanā wa-bayna l-qawmi l-fāsiqīn
  trad: 'Il dit : « Mon *Rabb*, je ne détiens de pouvoir que sur moi-même (*nafsī*) et mon frère — sépare-nous donc (*[fa-fruq](/etudes/trad-s4-bloc8/#tafarruq)*) de ce peuple *fāsiq*. »'
- ref: S.5:26
  ar: قَالَ فَإِنَّهَا مُحَرَّمَةٌ عَلَيْهِمْ ۛ أَرْبَعِينَ سَنَةً ۛ يَتِيهُونَ فِي الْأَرْضِ ۚ فَلَا تَأْسَ عَلَى الْقَوْمِ الْفَاسِقِينَ
  trl: Qāla fa-innahā muḥarramatun ʿalayhim — arbaʿīna sanatan — yatīhūna fi l-arḍi — fa-lā taʾsa ʿalā l-qawmi l-fāsiqīn
  trad: 'Il dit : « Elle leur est alors interdite (*muḥarrama*) — quarante ans durant — ils erreront (*yatīhūna*) sur la terre — ne t''afflige donc pas pour ce peuple *fāsiq*. »'
- ref: S.5:27
  ar: ۞ وَاتْلُ عَلَيْهِمْ نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ أَحَدِهِمَا وَلَمْ يُتَقَبَّلْ مِنَ الْآخَرِ قَالَ لَأَقْتُلَنَّكَ ۖ قَالَ إِنَّمَا يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ
  trl: Wa-tlu ʿalayhim nabaʾa bnay ādama bi-l-ḥaqqi idh qarrabā qurbānan fa-tuqubbila min aḥadihimā wa-lam yutaqabbal mina l-ākhari qāla la-aqtulannaka — qāla innamā yataqabbalu llāhu mina l-muttaqīn
  trad: 'Et récite-leur, selon le *ḥaqq*, le récit (*nabaʾ*) des deux fils d''Ādam : tous deux présentèrent une offrande (*qurbān*), et elle fut acceptée de l''un, et ne fut pas acceptée de l''autre. [Celui dont l''offrande ne fut pas acceptée] dit : « Je te tuerai assurément. » [L''autre] dit : « Allaah n''accepte que de la part des *muttaqīn*. »'
- ref: S.5:28
  ar: لَئِنْ بَسَطْتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِبَاسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ ۖ إِنِّي أَخَافُ اللَّهَ رَبَّ الْعَالَمِينَ
  trl: Laʾin basaṭta ilayya yadaka li-taqtulanī mā anā bi-bāsiṭin yadiya ilayka li-aqtulaka — innī akhāfu llāha rabba l-ʿālamīn
  trad: '« Si tu tends ta main vers moi pour me tuer, je ne tendrai pas ma main vers toi pour te tuer : je crains Allaah, *Rabb* des *ʿālamīn*. »'
- ref: S.5:29
  ar: إِنِّي أُرِيدُ أَنْ تَبُوءَ بِإِثْمِي وَإِثْمِكَ فَتَكُونَ مِنْ أَصْحَابِ النَّارِ ۚ وَذَٰلِكَ جَزَاءُ الظَّالِمِينَ
  trl: Innī urīdu an tabūʾa bi-ithmī wa-ithmika fa-takūna min aṣḥābi n-nāri — wa-dhālika jazāʾu ẓ-ẓālimīn
  trad: « Je veux que tu retournes chargé (*tabūʾa*) de ma faute (*ithmī*) et de ta faute, et que tu sois parmi les compagnons du Feu — telle est la rétribution des *ẓālimīn*. »
- ref: S.5:30
  ar: فَطَوَّعَتْ لَهُ نَفْسُهُ قَتْلَ أَخِيهِ فَقَتَلَهُ فَأَصْبَحَ مِنَ الْخَاسِرِينَ
  trl: Fa-ṭawwaʿat lahu nafsuhu qatla akhīhi fa-qatalahu fa-aṣbaḥa mina l-khāsirīn
  trad: 'Son *nafs* le disposa alors docilement (*ṭawwaʿat*) au meurtre de son frère : il le tua, et il devint alors du nombre des perdants (*[khāsirīn](/etudes/trad-s2-bloc1/#khasirun)*).'
- ref: S.5:31
  ar: فَبَعَثَ اللَّهُ غُرَابًا يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوَارِي سَوْءَةَ أَخِيهِ ۚ قَالَ يَا وَيْلَتَا أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هَٰذَا الْغُرَابِ فَأُوَارِيَ سَوْءَةَ أَخِي ۖ فَأَصْبَحَ مِنَ النَّادِمِينَ
  trl: Fa-baʿatha llāhu ghurāban yabḥathu fi l-arḍi li-yuriyahu kayfa yuwārī sawʾata akhīhi — qāla yā waylatā a-ʿajaztu an akūna mithla hādhā l-ghurābi fa-uwāriya sawʾata akhī — fa-aṣbaḥa mina n-nādimīn
  trad: 'Allaah envoya alors un corbeau (*ghurāb*) qui grattait la terre, pour lui montrer comment recouvrir (*yuwārī*) la dépouille (*sawʾa*) de son frère. Il dit : « Malheur à moi ! Ai-je été incapable d''être comme ce corbeau, pour recouvrir la dépouille de mon frère ? » — et il devint alors du nombre de ceux qui éprouvent un remords amer (*an-nādimīn*).'
- ref: S.5:32
  ar: مِنْ أَجْلِ ذَٰلِكَ كَتَبْنَا عَلَىٰ بَنِي إِسْرَائِيلَ أَنَّهُ مَنْ قَتَلَ نَفْسًا بِغَيْرِ نَفْسٍ أَوْ فَسَادٍ فِي الْأَرْضِ فَكَأَنَّمَا قَتَلَ النَّاسَ جَمِيعًا وَمَنْ أَحْيَاهَا فَكَأَنَّمَا أَحْيَا النَّاسَ جَمِيعًا ۚ وَلَقَدْ جَاءَتْهُمْ رُسُلُنَا بِالْبَيِّنَاتِ ثُمَّ إِنَّ كَثِيرًا مِنْهُمْ بَعْدَ ذَٰلِكَ فِي الْأَرْضِ لَمُسْرِفُونَ
  trl: Min ajli dhālika katabnā ʿalā banī isrāʾīla annahu man qatala nafsan bi-ghayri nafsin aw fasādin fi l-arḍi fa-ka-annamā qatala n-nāsa jamīʿan wa-man aḥyāhā fa-ka-annamā aḥyā n-nāsa jamīʿan — wa-la-qad jāʾathum rusulunā bi-l-bayyināti thumma inna kathīran minhum baʿda dhālika fi l-arḍi la-musrifūn
  trad: 'C''est pour cela que Nous avons prescrit (*katabnā*) aux Banū Isrāʾīl : quiconque tue un *nafs* sans que ce soit [en réparation] d''un *nafs*, ou pour une corruption (*[fasād](/etudes/trad-s2-bloc8/#fasad)*) sur la terre, c''est comme s''il avait tué les gens (*an-nās*) tous ensemble ; et quiconque en préserve la vie (*aḥyāhā*), c''est comme s''il avait donné la vie aux gens tous ensemble. Nos *rusul* leur sont certes venus avec les preuves manifestes (*[al-bayyināt](/etudes/trad-s2-bloc6/#bayyinat)*) ; pourtant, beaucoup d''entre eux, après cela, ne cessent d''excéder toute mesure (*la-musrifūn*) sur la terre.'
- ref: S.5:33
  ar: إِنَّمَا جَزَاءُ الَّذِينَ يُحَارِبُونَ اللَّهَ وَرَسُولَهُ وَيَسْعَوْنَ فِي الْأَرْضِ فَسَادًا أَنْ يُقَتَّلُوا أَوْ يُصَلَّبُوا أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُمْ مِنْ خِلَافٍ أَوْ يُنْفَوْا مِنَ الْأَرْضِ ۚ ذَٰلِكَ لَهُمْ خِزْيٌ فِي الدُّنْيَا ۖ وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيمٌ
  trl: Innamā jazāʾu lladhīna yuḥāribūna llāha wa-rasūlahu wa-yasʿawna fi l-arḍi fasādan an yuqattalū aw yuṣallabū aw tuqaṭṭaʿa aydīhim wa-arjuluhum min khilāfin aw yunfaw mina l-arḍi — dhālika lahum khizyun fi d-dunyā — wa-lahum fi l-ākhirati ʿadhābun ʿaẓīm
  trad: 'La sentence (*jazāʾ*) de ceux qui font la guerre (*yuḥāribūna*) à Allaah et à Son *rasūl*, et qui se répandent activement (*yasʿawna*) sur la terre en *fasād*, est : qu''ils soient mis à mort, ou crucifiés, ou que leurs mains et leurs pieds soient coupés en opposition (*min khilāf*), ou qu''ils soient exilés de la terre. Cela est pour eux un opprobre (*khizy*) dans ce monde (*ad-dunyā*) — et pour eux, dans l''*ākhira*, un *ʿadhāb* immense.'
- ref: S.5:34
  ar: إِلَّا الَّذِينَ تَابُوا مِنْ قَبْلِ أَنْ تَقْدِرُوا عَلَيْهِمْ ۖ فَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Illā lladhīna tābū min qabli an taqdirū ʿalayhim — fa-ʿlamū anna llāha ghafūrun raḥīm
  trad: 'Sauf ceux qui reviennent (*tābū*) avant que vous n''ayez pouvoir sur eux (*an taqdirū ʿalayhim*) : sachez alors qu''Allaah est *ghafūr*, *raḥīm*.'
- ref: S.5:35
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ وَجَاهِدُوا فِي سَبِيلِهِ لَعَلَّكُمْ تُفْلِحُونَ
  trl: Yā ayyuhā lladhīna āmanū ttaqū llāha wa-btaghū ilayhi l-wasīlata wa-jāhidū fī sabīlihi laʿallakum tufliḥūn
  trad: Ô vous qui avez cru, constituez-vous une taqwā (*ittaqū*) d'Allaah, recherchez activement (*ibtaghū*) vers Lui un moyen de rapprochement (*al-wasīla*), et efforcez-vous (*jāhidū*) sur Son chemin (*fī sabīlihi*) — peut-être serez-vous de ceux qui réussissent (*tufliḥūn*).
- ref: S.5:36
  ar: إِنَّ الَّذِينَ كَفَرُوا لَوْ أَنَّ لَهُمْ مَا فِي الْأَرْضِ جَمِيعًا وَمِثْلَهُ مَعَهُ لِيَفْتَدُوا بِهِ مِنْ عَذَابِ يَوْمِ الْقِيَامَةِ مَا تُقُبِّلَ مِنْهُمْ ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Inna lladhīna kafarū law anna lahum mā fi l-arḍi jamīʿan wa-mithlahu maʿahu li-yaftadū bihi min ʿadhābi yawmi l-qiyāmati mā tuqubbila minhum — wa-lahum ʿadhābun alīm
  trad: Ceux qui ont commis le *kufr* — quand bien même ils posséderaient tout ce qui est sur la terre, et son équivalent avec cela, pour s'en racheter (*li-yaftadū*) du *ʿadhāb* du *yawm al-qiyāma* — cela ne serait pas accepté d'eux (*mā tuqubbila minhum*). Et pour eux, un *ʿadhāb* douloureux (*alīm*).
- ref: S.5:37
  ar: يُرِيدُونَ أَنْ يَخْرُجُوا مِنَ النَّارِ وَمَا هُمْ بِخَارِجِينَ مِنْهَا ۖ وَلَهُمْ عَذَابٌ مُقِيمٌ
  trl: Yurīdūna an yakhrujū mina n-nāri wa-mā hum bi-khārijīna minhā — wa-lahum ʿadhābun muqīm
  trad: Ils voudront sortir du Feu (*an-nār*), mais ils n'en seront nullement sortants (*mā hum bi-khārijīna minhā*) — et pour eux un *ʿadhāb* qui persiste (*muqīm*).
- ref: S.5:38
  ar: وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالًا مِنَ اللَّهِ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ
  trl: Wa-s-sāriqu wa-s-sāriqatu fa-qṭaʿū aydiyahumā jazāʾan bimā kasabā nakālan mina llāh — wa-llāhu ʿazīzun ḥakīm
  trad: 'Le voleur (*as-sāriq*) et la voleuse (*as-sāriqa*) : coupez-leur la main (*fa-qṭaʿū aydiyahumā*), en rétribution (*[jazāʾan](#jaza)*) de ce qu''ils ont acquis, en sanction dissuasive (*nakālan*) venant d''Allaah. Allaah est *ʿazīz*, *ḥakīm*.'
- ref: S.5:39
  ar: فَمَنْ تَابَ مِنْ بَعْدِ ظُلْمِهِ وَأَصْلَحَ فَإِنَّ اللَّهَ يَتُوبُ عَلَيْهِ ۗ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Fa-man tāba min baʿdi ẓulmihi wa-aṣlaḥa fa-inna llāha yatūbu ʿalayhi — inna llāha ghafūrun raḥīm
  trad: Quiconque revient (*tāba*) après son *ẓulm*, et se réforme (*[aṣlaḥa](/etudes/trad-s2-bloc1/#muslihun)*) — alors Allaah revient vers lui (*yatūbu ʿalayhi*). Allaah est, certes, *ghafūr*, *raḥīm*.
- ref: S.5:40
  ar: أَلَمْ تَعْلَمْ أَنَّ اللَّهَ لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يُعَذِّبُ مَنْ يَشَاءُ وَيَغْفِرُ لِمَنْ يَشَاءُ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: A-lam taʿlam anna llāha lahu mulku s-samāwāti wa-l-arḍi yuʿadhdhibu man yashāʾu wa-yaghfiru li-man yashāʾ — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: Ne sais-tu pas qu'à Allaah appartient la royauté (*mulk*) des cieux et de la terre ? Il châtie qui Il veut, et pardonne à qui Il veut — et Allaah est, sur toute chose, *Qadīr*.
- ref: S.5:41
  ar: ۞ يَا أَيُّهَا الرَّسُولُ لَا يَحْزُنْكَ الَّذِينَ يُسَارِعُونَ فِي الْكُفْرِ مِنَ الَّذِينَ قَالُوا آمَنَّا بِأَفْوَاهِهِمْ وَلَمْ تُؤْمِنْ قُلُوبُهُمْ ۛ وَمِنَ الَّذِينَ هَادُوا ۛ سَمَّاعُونَ لِلْكَذِبِ سَمَّاعُونَ لِقَوْمٍ آخَرِينَ لَمْ يَأْتُوكَ ۖ يُحَرِّفُونَ الْكَلِمَ مِنْ بَعْدِ مَوَاضِعِهِ ۖ يَقُولُونَ إِنْ أُوتِيتُمْ هَٰذَا فَخُذُوهُ وَإِنْ لَمْ تُؤْتَوْهُ فَاحْذَرُوا ۚ وَمَنْ يُرِدِ اللَّهُ فِتْنَتَهُ فَلَنْ تَمْلِكَ لَهُ مِنَ اللَّهِ شَيْئًا ۚ أُولَٰئِكَ الَّذِينَ لَمْ يُرِدِ اللَّهُ أَنْ يُطَهِّرَ قُلُوبَهُمْ ۚ لَهُمْ فِي الدُّنْيَا خِزْيٌ ۖ وَلَهُمْ فِي الْآخِرَةِ عَذَابٌ عَظِيمٌ
  trl: Yā ayyuhā r-rasūlu lā yaḥzunka lladhīna yusāriʿūna fi l-kufri mina lladhīna qālū āmannā bi-afwāhihim wa-lam tuʾmin qulūbuhum — wa-mina lladhīna hādū — sammāʿūna li-l-kadhibi sammāʿūna li-qawmin ākharīna lam yaʾtūka — yuḥarrifūna l-kalima min baʿdi mawāḍiʿihi — yaqūlūna in ūtītum hādhā fa-khudhūhu wa-in lam tuʾtawhu fa-ḥdharū — wa-man yuridi llāhu fitnatahu fa-lan tamlika lahu mina llāhi shayʾā — ulāʾika lladhīna lam yuridi llāhu an yuṭahhira qulūbahum — lahum fi d-dunyā khizyun wa-lahum fi l-ākhirati ʿadhābun ʿaẓīm
  trad: 'Ô *rasūl*, que ne t''afflige pas ceux qui se hâtent vers le *kufr*, parmi ceux qui disent « nous avons cru » de leurs bouches (*bi-afwāhihim*) sans que leurs cœurs n''aient cru — et parmi ceux qui pratiquent le judaïsme (*mina lladhīna hādū*) : de grands écouteurs du mensonge, de grands écouteurs pour un autre groupe qui n''est pas venu à toi, qui déplacent la parole après ses positions [véritables] (*min baʿdi mawāḍiʿihi*), disant : « Si cela vous est donné, prenez-le — et si cela ne vous est pas donné, méfiez-vous. » Quiconque Allaah veut sa mise à l''épreuve (*fitnatahu*), tu ne détiens rien pour lui face à Allaah. Ceux-là sont ceux dont Allaah n''a pas voulu purifier les cœurs : pour eux, dans ce monde, un opprobre (*khizy*) ; et pour eux, dans l''*ākhira*, un *ʿadhāb* immense.'
- ref: S.5:42
  ar: سَمَّاعُونَ لِلْكَذِبِ أَكَّالُونَ لِلسُّحْتِ ۚ فَإِنْ جَاءُوكَ فَاحْكُمْ بَيْنَهُمْ أَوْ أَعْرِضْ عَنْهُمْ ۖ وَإِنْ تُعْرِضْ عَنْهُمْ فَلَنْ يَضُرُّوكَ شَيْئًا ۖ وَإِنْ حَكَمْتَ فَاحْكُمْ بَيْنَهُمْ بِالْقِسْطِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ
  trl: Sammāʿūna li-l-kadhibi akkālūna li-s-suḥt — fa-in jāʾūka fa-ḥkum baynahum aw aʿriḍ ʿanhum — wa-in tuʿriḍ ʿanhum fa-lan yaḍurrūka shayʾā — wa-in ḥakamta fa-ḥkum baynahum bi-l-qisṭ — inna llāha yuḥibbu l-muqsiṭīn
  trad: 'De grands écouteurs du mensonge, de grands dévoreurs du gain illicite (*suḥt*) : s''ils viennent à toi, juge (*fa-ḥkum*) entre eux, ou détourne-toi d''eux — et si tu te détournes d''eux, ils ne te nuiront en rien. Mais si tu juges, juge entre eux avec *qisṭ* : Allaah honore les *muqsiṭūn*.'
- ref: S.5:43
  ar: وَكَيْفَ يُحَكِّمُونَكَ وَعِنْدَهُمُ التَّوْرَاةُ فِيهَا حُكْمُ اللَّهِ ثُمَّ يَتَوَلَّوْنَ مِنْ بَعْدِ ذَٰلِكَ ۚ وَمَا أُولَٰئِكَ بِالْمُؤْمِنِينَ
  trl: Wa-kayfa yuḥakkimūnaka wa-ʿindahumu t-tawrātu fīhā ḥukmu llāhi thumma yatawallawna min baʿdi dhālika — wa-mā ulāʾika bi-l-muʾminīn
  trad: Et comment te prennent-ils pour arbitre (*yuḥakkimūnaka*), alors qu'ils ont chez eux la Tawrāh, en elle le *ḥukm* d'Allaah — puis ils se détournent après cela ? Ceux-là ne sont pas des *muʾminūn*.
- ref: S.5:44
  ar: إِنَّا أَنْزَلْنَا التَّوْرَاةَ فِيهَا هُدًى وَنُورٌ ۚ يَحْكُمُ بِهَا النَّبِيُّونَ الَّذِينَ أَسْلَمُوا لِلَّذِينَ هَادُوا وَالرَّبَّانِيُّونَ وَالْأَحْبَارُ بِمَا اسْتُحْفِظُوا مِنْ كِتَابِ اللَّهِ وَكَانُوا عَلَيْهِ شُهَدَاءَ ۚ فَلَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ وَلَا تَشْتَرُوا بِآيَاتِي ثَمَنًا قَلِيلًا ۚ وَمَنْ لَمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الْكَافِرُونَ
  trl: Innā anzalnā t-tawrāta fīhā hudan wa-nūr — yaḥkumu bihā n-nabiyyūna lladhīna aslamū li-lladhīna hādū wa-r-rabbāniyyūna wa-l-aḥbāru bimā stuḥfiẓū min kitābi llāhi wa-kānū ʿalayhi shuhadāʾ — fa-lā takhshawu n-nāsa wa-khshawni wa-lā tashtarū bi-āyātī thamanan qalīlā — wa-man lam yaḥkum bimā anzala llāhu fa-ulāʾika humu l-kāfirūn
  trad: Nous avons fait descendre la Tawrāh ; en elle, guidance (*hudā*) et lumière (*nūr*). Les *nabiyyūn* qui s'étaient soumis (*aslamū*) jugeaient par elle pour ceux qui pratiquent le judaïsme, ainsi que les *rabbāniyyūn* et les *aḥbār*, en raison de ce dont la garde leur avait été confiée (*bimā stuḥfiẓū*) du *kitāb* d'Allaah, et dont ils étaient témoins (*shuhadāʾ*). Ne craignez donc pas les gens, et craignez-Moi ; et n'échangez pas Mes *āyāt* contre un prix dérisoire. Quiconque ne juge pas par ce qu'Allaah a fait descendre — ceux-là sont les *kāfirūn*.
- ref: S.5:45
  ar: وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالْأَنْفَ بِالْأَنْفِ وَالْأُذُنَ بِالْأُذُنِ وَالسِّنَّ بِالسِّنِّ وَالْجُرُوحَ قِصَاصٌ ۚ فَمَنْ تَصَدَّقَ بِهِ فَهُوَ كَفَّارَةٌ لَهُ ۚ وَمَنْ لَمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الظَّالِمُونَ
  trl: Wa-katabnā ʿalayhim fīhā anna n-nafsa bi-n-nafsi wa-l-ʿayna bi-l-ʿayni wa-l-anfa bi-l-anfi wa-l-udhuna bi-l-udhuni wa-s-sinna bi-s-sinni wa-l-jurūḥa qiṣāṣ — fa-man taṣaddaqa bihi fa-huwa kaffāratun lahu — wa-man lam yaḥkum bimā anzala llāhu fa-ulāʾika humu ẓ-ẓālimūn
  trad: 'Et Nous avons prescrit (*katabnā*) pour eux, en elle : l''âme pour l''âme, l''œil pour l''œil, le nez pour le nez, l''oreille pour l''oreille, la dent pour la dent, et pour les blessures un *qiṣāṣ* [une correspondance exacte]. Mais quiconque en fait don (*taṣaddaqa bihi*), cela est pour lui une *kaffāra* [un rachat qui couvre la faute]. Quiconque ne juge pas par ce qu''Allaah a fait descendre — ceux-là sont les *ẓālimūn*.'
- ref: S.5:46
  ar: وَقَفَّيْنَا عَلَىٰ آثَارِهِمْ بِعِيسَى ابْنِ مَرْيَمَ مُصَدِّقًا لِمَا بَيْنَ يَدَيْهِ مِنَ التَّوْرَاةِ ۖ وَآتَيْنَاهُ الْإِنْجِيلَ فِيهِ هُدًى وَنُورٌ وَمُصَدِّقًا لِمَا بَيْنَ يَدَيْهِ مِنَ التَّوْرَاةِ وَهُدًى وَمَوْعِظَةً لِلْمُتَّقِينَ
  trl: Wa-qaffaynā ʿalā āthārihim bi-ʿĪsā bni Maryama muṣaddiqan li-mā bayna yadayhi mina t-tawrāti — wa-ātaynāhu l-injīla fīhi hudan wa-nūrun wa-muṣaddiqan li-mā bayna yadayhi mina t-tawrāti wa-hudan wa-mawʿiẓatan li-l-muttaqīn
  trad: Et Nous avons fait suivre sur leurs traces (*qaffaynā ʿalā āthārihim*) par ʿĪsā fils de Maryam, confirmant ce qui le précédait (*li-mā bayna yadayhi*) de la Tawrāh — et Nous lui avons donné l'Injīl, en lui guidance et lumière, confirmant ce qui le précédait de la Tawrāh, guidance et exhortation (*mawʿiẓa*) pour les *muttaqīn*.
- ref: S.5:47
  ar: وَلْيَحْكُمْ أَهْلُ الْإِنْجِيلِ بِمَا أَنْزَلَ اللَّهُ فِيهِ ۚ وَمَنْ لَمْ يَحْكُمْ بِمَا أَنْزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الْفَاسِقُونَ
  trl: Wa-l-yaḥkum ahlu l-injīli bimā anzala llāhu fīhi — wa-man lam yaḥkum bimā anzala llāhu fa-ulāʾika humu l-fāsiqūn
  trad: Que les *ahl al-Injīl* jugent par ce qu'Allaah y a fait descendre. Quiconque ne juge pas par ce qu'Allaah a fait descendre — ceux-là sont les *fāsiqūn*.
- ref: S.5:48
  ar: وَأَنْزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ مُصَدِّقًا لِمَا بَيْنَ يَدَيْهِ مِنَ الْكِتَابِ وَمُهَيْمِنًا عَلَيْهِ ۖ فَاحْكُمْ بَيْنَهُمْ بِمَا أَنْزَلَ اللَّهُ ۖ وَلَا تَتَّبِعْ أَهْوَاءَهُمْ عَمَّا جَاءَكَ مِنَ الْحَقِّ ۚ لِكُلٍّ جَعَلْنَا مِنْكُمْ شِرْعَةً وَمِنْهَاجًا ۚ وَلَوْ شَاءَ اللَّهُ لَجَعَلَكُمْ أُمَّةً وَاحِدَةً وَلَٰكِنْ لِيَبْلُوَكُمْ فِي مَا آتَاكُمْ ۖ فَاسْتَبِقُوا الْخَيْرَاتِ ۚ إِلَى اللَّهِ مَرْجِعُكُمْ جَمِيعًا فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ فِيهِ تَخْتَلِفُونَ
  trl: Wa-anzalnā ilayka l-kitāba bi-l-ḥaqqi muṣaddiqan li-mā bayna yadayhi mina l-kitābi wa-muhayminan ʿalayhi — fa-ḥkum baynahum bimā anzala llāhu wa-lā tattabiʿ ahwāʾahum ʿammā jāʾaka mina l-ḥaqq — li-kullin jaʿalnā minkum shirʿatan wa-minhājā — wa-law shāʾa llāhu la-jaʿalakum ummatan wāḥidatan wa-lākin li-yabluwakum fī mā ātākum — fa-stabiqū l-khayrāt — ilā llāhi marjiʿukum jamīʿan fa-yunabbiʾukum bimā kuntum fīhi takhtalifūn
  trad: Et Nous avons fait descendre vers toi le *kitāb*, accompagné du *ḥaqq*, confirmant ce qui le précédait du *kitāb*, et *muhaymin* sur lui [le garantissant, veillant sur lui]. Juge donc entre eux par ce qu'Allaah a fait descendre, et ne suis pas leurs penchants (*ahwāʾahum*) en t'écartant de ce qui t'est venu du *ḥaqq*. À chacun [de vous, de vos communautés], Nous avons établi une *shirʿa* [une voie légiférée] et un *minhāj* [une méthode, un chemin tracé]. Et si Allaah avait voulu, Il aurait fait de vous une seule *umma* — mais [il en est autrement] afin de vous éprouver (*li-yabluwakum*) en ce qu'Il vous a donné. Rivalisez donc de hâte vers les *khayrāt* [les actions bonnes]. Vers Allaah est votre retour à tous, et Il vous informera alors de ce en quoi vous divergiez.
- ref: S.5:49
  ar: وَأَنِ احْكُمْ بَيْنَهُمْ بِمَا أَنْزَلَ اللَّهُ وَلَا تَتَّبِعْ أَهْوَاءَهُمْ وَاحْذَرْهُمْ أَنْ يَفْتِنُوكَ عَنْ بَعْضِ مَا أَنْزَلَ اللَّهُ إِلَيْكَ ۖ فَإِنْ تَوَلَّوْا فَاعْلَمْ أَنَّمَا يُرِيدُ اللَّهُ أَنْ يُصِيبَهُمْ بِبَعْضِ ذُنُوبِهِمْ ۗ وَإِنَّ كَثِيرًا مِنَ النَّاسِ لَفَاسِقُونَ
  trl: Wa-ani ḥkum baynahum bimā anzala llāhu wa-lā tattabiʿ ahwāʾahum wa-ḥdharhum an yaftinūka ʿan baʿḍi mā anzala llāhu ilayk — fa-in tawallaw fa-ʿlam annamā yurīdu llāhu an yuṣībahum bi-baʿḍi dhunūbihim — wa-inna kathīran mina n-nāsi la-fāsiqūn
  trad: Et juge entre eux par ce qu'Allaah a fait descendre, ne suis pas leurs *[ahwāʾ](#ahwa)*, et prends garde qu'ils ne te détournent par épreuve (*yaftinūka*) d'une partie de ce qu'Allaah a fait descendre vers toi. S'ils se détournent, sache alors qu'Allaah veut seulement les atteindre par une partie de leurs fautes (*dhunūbihim*). Beaucoup de gens, certes, sont des *fāsiqūn*.
- ref: S.5:50
  ar: أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ ۚ وَمَنْ أَحْسَنُ مِنَ اللَّهِ حُكْمًا لِقَوْمٍ يُوقِنُونَ
  trl: A-fa-ḥukma l-jāhiliyyati yabghūna — wa-man aḥsanu mina llāhi ḥukman li-qawmin yūqinūn
  trad: Est-ce le *ḥukm* de la *jāhiliyya* qu'ils recherchent avec excès (*yabghūna*) ? Et qui est meilleur qu'Allaah en *ḥukm*, pour un peuple qui a la certitude (*yūqinūn*) ?
- ref: S.5:51
  ar: ۞ يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا الْيَهُودَ وَالنَّصَارَىٰ أَوْلِيَاءَ ۘ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ وَمَنْ يَتَوَلَّهُمْ مِنْكُمْ فَإِنَّهُ مِنْهُمْ ۗ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ
  trl: Yā ayyuhā lladhīna āmanū lā tattakhidhu l-yahūda wa-n-naṣārā awliyāʾ — baʿḍuhum awliyāʾu baʿḍin — wa-man yatawallahum minkum fa-innahu minhum — inna llāha lā yahdi l-qawma ẓ-ẓālimīn
  trad: 'Ô vous qui avez cru, ne prenez pas les Juifs (*al-yahūd*) et les Chrétiens (*an-naṣārā*) comme *awliyāʾ* : ils sont *awliyāʾ* les uns des autres. Quiconque, parmi vous, se tourne vers eux comme *walī* (*yatawallahum*), fait dès lors partie d''eux (*fa-innahu minhum*). Allaah ne guide pas le peuple des *ẓālimūn*.'
- ref: S.5:52
  ar: فَتَرَى الَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ يُسَارِعُونَ فِيهِمْ يَقُولُونَ نَخْشَىٰ أَنْ تُصِيبَنَا دَائِرَةٌ ۚ فَعَسَى اللَّهُ أَنْ يَأْتِيَ بِالْفَتْحِ أَوْ أَمْرٍ مِنْ عِنْدِهِ فَيُصْبِحُوا عَلَىٰ مَا أَسَرُّوا فِي أَنْفُسِهِمْ نَادِمِينَ
  trl: Fa-tarā lladhīna fī qulūbihim maraḍun yusāriʿūna fīhim yaqūlūna nakhshā an tuṣībanā dāʾiratun — fa-ʿasā llāhu an yaʾtiya bi-l-fatḥi aw amrin min ʿindihi fa-yuṣbiḥū ʿalā mā asarrū fī anfusihim nādimīn
  trad: 'Tu vois alors ceux dans le cœur desquels il y a une *maraḍ* [une corruption interne] se hâter parmi eux, disant : « Nous craignons qu''un revers (*dāʾira*) ne nous atteigne. » Il se peut (*ʿasā*) qu''Allaah fasse venir l''ouverture décisive (*al-fatḥ*) ou quelque décision (*amr*) venant de Lui, en sorte qu''ils deviennent, sur ce qu''ils dissimulaient en eux-mêmes, du nombre de ceux qui éprouvent un remords amer (*nādimīn*).'
- ref: S.5:53
  ar: وَيَقُولُ الَّذِينَ آمَنُوا أَهَٰؤُلَاءِ الَّذِينَ أَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ ۙ إِنَّهُمْ لَمَعَكُمْ ۚ حَبِطَتْ أَعْمَالُهُمْ فَأَصْبَحُوا خَاسِرِينَ
  trl: Wa-yaqūlu lladhīna āmanū a-hāʾulāʾi lladhīna aqsamū bi-llāhi jahda aymānihim — innahum la-maʿakum — ḥabiṭat aʿmāluhum fa-aṣbaḥū khāsirīn
  trad: 'Et ceux qui ont cru diront : « Sont-ce là ceux qui juraient par Allaah, de toute la force de leurs serments (*jahda aymānihim*), qu''ils étaient assurément avec vous ? » Leurs œuvres se sont annulées (*ḥabiṭat*), et ils sont devenus du nombre des perdants (*khāsirīn*).'
- ref: S.5:54
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا مَنْ يَرْتَدَّ مِنْكُمْ عَنْ دِينِهِ فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ يُجَاهِدُونَ فِي سَبِيلِ اللَّهِ وَلَا يَخَافُونَ لَوْمَةَ لَائِمٍ ۚ ذَٰلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ ۚ وَاللَّهُ وَاسِعٌ عَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū man yartadda minkum ʿan dīnihi fa-sawfa yaʾti llāhu bi-qawmin yuḥibbuhum wa-yuḥibbūnahu adhillatin ʿalā l-muʾminīna aʿizzatin ʿalā l-kāfirīn — yujāhidūna fī sabīli llāhi wa-lā yakhāfūna lawmata lāʾim — dhālika faḍlu llāhi yuʾtīhi man yashāʾ — wa-llāhu wāsiʿun ʿalīm
  trad: Ô vous qui avez cru, quiconque, parmi vous, retourne en arrière (*yartadda*) loin de son *dīn* — Allaah fera alors venir un peuple qu'Il honore (*yuḥibbuhum*) et qui L'honore (*yuḥibbūnahu*), humbles (*adhillah*) envers les croyants, fermes (*aʿizzah*) envers les *kāfirūn*, s'efforçant (*yujāhidūna*) sur le chemin d'Allaah, et ne craignant le blâme d'aucun blâmeur (*lawmata lāʾim*). Cela est le *faḍl* d'Allaah, qu'Il donne à qui Il veut — Allaah est *Wāsiʿ*, *ʿAlīm*.
- ref: S.5:55
  ar: إِنَّمَا وَلِيُّكُمُ اللَّهُ وَرَسُولُهُ وَالَّذِينَ آمَنُوا الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ رَاكِعُونَ
  trl: Innamā walīyukumu llāhu wa-rasūluhu wa-lladhīna āmanū lladhīna yuqīmūna ṣ-ṣalāta wa-yuʾtūna z-zakāta wa-hum rākiʿūn
  trad: Votre seul *walī* est Allaah, Son *rasūl*, et ceux qui ont cru — ceux qui établissent la *ṣalāt* et donnent la *zakāt* alors qu'ils sont inclinés (*rākiʿūn*).
- ref: S.5:56
  ar: وَمَنْ يَتَوَلَّ اللَّهَ وَرَسُولَهُ وَالَّذِينَ آمَنُوا فَإِنَّ حِزْبَ اللَّهِ هُمُ الْغَالِبُونَ
  trl: Wa-man yatawalla llāha wa-rasūlahu wa-lladhīna āmanū fa-inna ḥizba llāhi humu l-ghālibūn
  trad: Et quiconque prend pour *walī* (*yatawalla*) Allaah, Son *rasūl* et ceux qui ont cru — le *ḥizb* d'Allaah, ceux-là sont les vainqueurs (*al-ghālibūn*).
- ref: S.5:57
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا الَّذِينَ اتَّخَذُوا دِينَكُمْ هُزُوًا وَلَعِبًا مِنَ الَّذِينَ أُوتُوا الْكِتَابَ مِنْ قَبْلِكُمْ وَالْكُفَّارَ أَوْلِيَاءَ ۚ وَاتَّقُوا اللَّهَ إِنْ كُنْتُمْ مُؤْمِنِينَ
  trl: Yā ayyuhā lladhīna āmanū lā tattakhidhu lladhīna ttakhadhū dīnakum huzuwan wa-laʿiban mina lladhīna ūtu l-kitāba min qablikum wa-l-kuffāra awliyāʾ — wa-ttaqu llāha in kuntum muʾminīn
  trad: Ô vous qui avez cru, ne prenez pas pour *awliyāʾ* ceux qui ont pris votre *dīn* en dérision (*huzuwan*) et en jeu (*laʿiban*) — parmi ceux à qui le *kitāb* a été donné avant vous, et les *kuffār*. Constituez-vous une taqwā d'Allaah (*ittaqu llāh*), si vous êtes des *muʾminūn*.
- ref: S.5:58
  ar: وَإِذَا نَادَيْتُمْ إِلَى الصَّلَاةِ اتَّخَذُوهَا هُزُوًا وَلَعِبًا ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌ لَا يَعْقِلُونَ
  trl: Wa-idhā nādaytum ila ṣ-ṣalāti ttakhadhūhā huzuwan wa-laʿibā — dhālika bi-annahum qawmun lā yaʿqilūn
  trad: Et quand vous appelez à la *ṣalāt*, ils la prennent en dérision et en jeu. Cela, parce qu'ils sont des gens qui ne raisonnent pas (*lā yaʿqilūn*).
- ref: S.5:59
  ar: قُلْ يَا أَهْلَ الْكِتَابِ هَلْ تَنْقِمُونَ مِنَّا إِلَّا أَنْ آمَنَّا بِاللَّهِ وَمَا أُنْزِلَ إِلَيْنَا وَمَا أُنْزِلَ مِنْ قَبْلُ وَأَنَّ أَكْثَرَكُمْ فَاسِقُونَ
  trl: Qul yā ahla l-kitābi hal tanqimūna minnā illā an āmannā bi-llāhi wa-mā unzila ilaynā wa-mā unzila min qablu wa-anna aktharakum fāsiqūn
  trad: 'Dis : « Ô *Ahl al-Kitāb*, nous reprochez-vous (*tanqimūna*) autre chose que d''avoir cru en Allaah, à ce qui nous a été descendu et à ce qui a été descendu auparavant — et que la plupart d''entre vous sont des *fāsiqūn* ? »'
- ref: S.5:60
  ar: قُلْ هَلْ أُنَبِّئُكُمْ بِشَرٍّ مِنْ ذَٰلِكَ مَثُوبَةً عِنْدَ اللَّهِ ۚ مَنْ لَعَنَهُ اللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ الْقِرَدَةَ وَالْخَنَازِيرَ وَعَبَدَ الطَّاغُوتَ ۚ أُولَٰئِكَ شَرٌّ مَكَانًا وَأَضَلُّ عَنْ سَوَاءِ السَّبِيلِ
  trl: Qul hal unabbiʾukum bi-sharrin min dhālika mathūbatan ʿinda llāh — man laʿanahu llāhu wa-ghaḍiba ʿalayhi wa-jaʿala minhumu l-qiradata wa-l-khanāzīra wa-ʿabada ṭ-ṭāghūt — ulāʾika sharrun makānan wa-aḍallu ʿan sawāʾi s-sabīl
  trad: 'Dis : « Vous informerai-je de pire que cela en rétribution (*mathūba*) auprès d''Allaah ? Celui qu''Allaah a éloigné [de la *raḥma*] (*laʿanahu*) et envers qui Il a manifesté le *ghaḍab* [une réaction de rejet, un retrait de la faveur], et dont Il a fait, parmi eux, des singes (*al-qirada*) et des porcs (*al-khanāzīr*), et qui a adoré le *ṭāghūt* — ceux-là sont pires en condition (*sharrun makānan*), et plus égarés loin du milieu du chemin (*aḍallu ʿan sawāʾi s-sabīl*). »'
- ref: S.5:61
  ar: وَإِذَا جَاءُوكُمْ قَالُوا آمَنَّا وَقَدْ دَخَلُوا بِالْكُفْرِ وَهُمْ قَدْ خَرَجُوا بِهِ ۚ وَاللَّهُ أَعْلَمُ بِمَا كَانُوا يَكْتُمُونَ
  trl: Wa-idhā jāʾūkum qālū āmannā wa-qad dakhalū bi-l-kufri wa-hum qad kharajū bihi — wa-llāhu aʿlamu bimā kānū yaktumūn
  trad: 'Et quand ils viennent à vous, ils disent : « Nous avons cru » — alors qu''ils sont entrés avec le *kufr*, et qu''ils en sont ressortis avec lui. Allaah sait mieux ce qu''ils dissimulaient (*yaktumūn*).'
- ref: S.5:62
  ar: وَتَرَىٰ كَثِيرًا مِنْهُمْ يُسَارِعُونَ فِي الْإِثْمِ وَالْعُدْوَانِ وَأَكْلِهِمُ السُّحْتَ ۚ لَبِئْسَ مَا كَانُوا يَعْمَلُونَ
  trl: Wa-tarā kathīran minhum yusāriʿūna fi l-ithmi wa-l-ʿudwāni wa-aklihimu s-suḥt — la-biʾsa mā kānū yaʿmalūn
  trad: Tu vois beaucoup d'entre eux se hâter (*yusāriʿūna*) vers le péché (*al-ithm*), la transgression (*al-ʿudwān*) et leur consommation du gain illicite (*as-suḥt*) — combien est misérable (*la-biʾsa*) ce qu'ils faisaient !
- ref: S.5:63
  ar: لَوْلَا يَنْهَاهُمُ الرَّبَّانِيُّونَ وَالْأَحْبَارُ عَنْ قَوْلِهِمُ الْإِثْمَ وَأَكْلِهِمُ السُّحْتَ ۚ لَبِئْسَ مَا كَانُوا يَصْنَعُونَ
  trl: Law-lā yanhāhumu r-rabbāniyyūna wa-l-aḥbāru ʿan qawlihimu l-ithma wa-aklihimu s-suḥt — la-biʾsa mā kānū yaṣnaʿūn
  trad: Que ne leur interdisent (*yanhāhum*) les *rabbāniyyūn* et les *aḥbār* de dire le péché et de consommer le *suḥt* ! Combien est misérable ce qu'ils fabriquaient (*yaṣnaʿūn*) !
- ref: S.5:64
  ar: وَقَالَتِ الْيَهُودُ يَدُ اللَّهِ مَغْلُولَةٌ ۚ غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا بِمَا قَالُوا ۘ بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنْفِقُ كَيْفَ يَشَاءُ ۚ وَلَيَزِيدَنَّ كَثِيرًا مِنْهُمْ مَا أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ طُغْيَانًا وَكُفْرًا ۚ وَأَلْقَيْنَا بَيْنَهُمُ الْعَدَاوَةَ وَالْبَغْضَاءَ إِلَىٰ يَوْمِ الْقِيَامَةِ ۚ كُلَّمَا أَوْقَدُوا نَارًا لِلْحَرْبِ أَطْفَأَهَا اللَّهُ ۚ وَيَسْعَوْنَ فِي الْأَرْضِ فَسَادًا ۚ وَاللَّهُ لَا يُحِبُّ الْمُفْسِدِينَ
  trl: Wa-qālati l-yahūdu yadu llāhi maghlūlah — ghullat aydīhim wa-luʿinū bimā qālū — bal yadāhu mabsūṭatāni yunfiqu kayfa yashāʾ — wa-la-yazīdanna kathīran minhum mā unzila ilayka min rabbika ṭughyānan wa-kufrā — wa-alqaynā baynahumu l-ʿadāwata wa-l-baghḍāʾa ilā yawmi l-qiyāmah — kullamā awqadū nāran li-l-ḥarbi aṭfaʾahā llāh — wa-yasʿawna fi l-arḍi fasādā — wa-llāhu lā yuḥibbu l-mufsidīn
  trad: 'Et des Juifs ont dit : « La [Yad](#yad-s5-64) d''Allaah est refermée [tenue serrée, avare] (*maghlūlah*). » Que leurs propres mains soient refermées, et qu''ils soient éloignés [de la *raḥma*] (*luʿinū*) pour ce qu''ils ont dit ! Bien au contraire, Ses deux [Yad](#yad-s5-64) sont grandes ouvertes (*mabsūṭatān*) : Il donne comme Il veut (*yunfiqu kayfa yashāʾ*). Et ce qui a été fait descendre vers toi de la part de ton Rabb ne fera assurément qu''accroître, chez beaucoup d''entre eux, débordement (*ṭughyān*) et *kufr*. Et Nous avons jeté entre eux l''hostilité (*al-ʿadāwa*) et la haine profonde (*al-baghḍāʾ*) jusqu''au *yawm al-qiyāma*. Chaque fois qu''ils allument un feu pour la guerre, Allaah l''éteint. Et ils s''appliquent sur la terre à répandre le *fasād* — Allaah n''honore pas les *mufsidūn*.'
- ref: S.5:65
  ar: وَلَوْ أَنَّ أَهْلَ الْكِتَابِ آمَنُوا وَاتَّقَوْا لَكَفَّرْنَا عَنْهُمْ سَيِّئَاتِهِمْ وَلَأَدْخَلْنَاهُمْ جَنَّاتِ النَّعِيمِ
  trl: Wa-law anna ahla l-kitābi āmanū wa-ttaqaw la-kaffarnā ʿanhum sayyiʾātihim wa-la-adkhalnāhum jannāti n-naʿīm
  trad: Et si les *Ahl al-Kitāb* avaient cru et s'étaient constitué une taqwā (*ittaqaw*), Nous aurions assurément effacé pour eux leurs fautes (*sayyiʾātihim*), et Nous les aurions assurément fait entrer dans les jardins de la plénitude comblée (*jannāti n-naʿīm*).
- ref: S.5:66
  ar: وَلَوْ أَنَّهُمْ أَقَامُوا التَّوْرَاةَ وَالْإِنْجِيلَ وَمَا أُنْزِلَ إِلَيْهِمْ مِنْ رَبِّهِمْ لَأَكَلُوا مِنْ فَوْقِهِمْ وَمِنْ تَحْتِ أَرْجُلِهِمْ ۚ مِنْهُمْ أُمَّةٌ مُقْتَصِدَةٌ ۖ وَكَثِيرٌ مِنْهُمْ سَاءَ مَا يَعْمَلُونَ
  trl: Wa-law annahum aqāmu t-tawrāta wa-l-injīla wa-mā unzila ilayhim min rabbihim la-akalū min fawqihim wa-min taḥti arjulihim — minhum ummatun muqtaṣidatun — wa-kathīrun minhum sāʾa mā yaʿmalūn
  trad: Et s'ils avaient établi (*aqāmū*) la Tawrāh et l'Injīl, et ce qui leur a été descendu de la part de leur Rabb, ils auraient assurément mangé de ce qui est au-dessus d'eux et de ce qui est sous leurs pieds. Parmi eux, une communauté se tient sur une voie médiane (*ummatun muqtaṣidah*) ; mais beaucoup d'entre eux — combien est mauvais (*sāʾa*) ce qu'ils font !
- ref: S.5:67
  ar: ۞ يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ ۖ وَإِنْ لَمْ تَفْعَلْ فَمَا بَلَّغْتَ رِسَالَتَهُ ۚ وَاللَّهُ يَعْصِمُكَ مِنَ النَّاسِ ۗ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ
  trl: Yā ayyuhā r-rasūlu balligh mā unzila ilayka min rabbika — wa-in lam tafʿal fa-mā ballaghta risālatahu — wa-llāhu yaʿṣimuka mina n-nāsi — inna llāha lā yahdi l-qawma l-kāfirīn
  trad: Ô *Rasūl*, transmets (*balligh*) ce qui t'a été descendu de la part de ton Rabb — et si tu ne le fais pas, tu n'auras pas transmis Sa mission (*risālatahu*). Allaah te préserve (*yaʿṣimuka*) des gens. Allaah ne guide pas le peuple des *kāfirūn*.
- ref: S.5:68
  ar: قُلْ يَا أَهْلَ الْكِتَابِ لَسْتُمْ عَلَىٰ شَيْءٍ حَتَّىٰ تُقِيمُوا التَّوْرَاةَ وَالْإِنْجِيلَ وَمَا أُنْزِلَ إِلَيْكُمْ مِنْ رَبِّكُمْ ۗ وَلَيَزِيدَنَّ كَثِيرًا مِنْهُمْ مَا أُنْزِلَ إِلَيْكَ مِنْ رَبِّكَ طُغْيَانًا وَكُفْرًا ۖ فَلَا تَأْسَ عَلَى الْقَوْمِ الْكَافِرِينَ
  trl: Qul yā ahla l-kitābi lastum ʿalā shayʾin ḥattā tuqīmu t-tawrāta wa-l-injīla wa-mā unzila ilaykum min rabbikum — wa-la-yazīdanna kathīran minhum mā unzila ilayka min rabbika ṭughyānan wa-kufrā — fa-lā taʾsa ʿalā l-qawmi l-kāfirīn
  trad: 'Dis : « Ô *Ahl al-Kitāb*, vous n''êtes sur rien tant que vous n''établissez pas la Tawrāh, l''Injīl, et ce qui vous a été descendu de la part de votre Rabb. » Et ce qui a été fait descendre vers toi de la part de ton Rabb ne fera assurément qu''accroître, chez beaucoup d''entre eux, débordement (*ṭughyān*) et *kufr*. Ne t''afflige donc pas (*fa-lā taʾsa*) pour le peuple des *kāfirūn*.'
- ref: S.5:69
  ar: إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالصَّابِئُونَ وَالنَّصَارَىٰ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَعَمِلَ صَالِحًا فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: Inna lladhīna āmanū wa-lladhīna hādū wa-ṣ-ṣābiʾūna wa-n-naṣārā man āmana bi-llāhi wa-l-yawmi l-ākhiri wa-ʿamila ṣāliḥan fa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: Ceux qui ont cru, ceux qui ont pratiqué le judaïsme (*hādū*), les *ṣābiʾūn* et les *naṣārā* — quiconque parmi eux a cru en Allaah et au Jour dernier, et a accompli un acte droit — nulle crainte sur eux, et ils ne seront pas attristés.
- ref: S.5:70
  ar: لَقَدْ أَخَذْنَا مِيثَاقَ بَنِي إِسْرَائِيلَ وَأَرْسَلْنَا إِلَيْهِمْ رُسُلًا ۖ كُلَّمَا جَاءَهُمْ رَسُولٌ بِمَا لَا تَهْوَىٰ أَنْفُسُهُمْ فَرِيقًا كَذَّبُوا وَفَرِيقًا يَقْتُلُونَ
  trl: La-qad akhadhnā mīthāqa banī isrāʾīla wa-arsalnā ilayhim rusulan — kullamā jāʾahum rasūlun bimā lā tahwā anfusuhum farīqan kadhdhabū wa-farīqan yaqtulūn
  trad: Nous avons certes pris le *mīthāq* des Banū Isrāʾīl, et Nous leur avons envoyé des *rusul*. Chaque fois qu'un *rasūl* leur venait avec ce qui ne correspondait pas aux désirs de leurs âmes, un groupe (*farīqan*), ils l'ont traité de menteur, et un autre groupe, ils le tuent.
- ref: S.5:71
  ar: وَحَسِبُوا أَلَّا تَكُونَ فِتْنَةٌ فَعَمُوا وَصَمُّوا ثُمَّ تَابَ اللَّهُ عَلَيْهِمْ ثُمَّ عَمُوا وَصَمُّوا كَثِيرٌ مِنْهُمْ ۚ وَاللَّهُ بَصِيرٌ بِمَا يَعْمَلُونَ
  trl: Wa-ḥasibū allā takūna fitnatun fa-ʿamū wa-ṣammū — thumma tāba llāhu ʿalayhim — thumma ʿamū wa-ṣammū kathīrun minhum — wa-llāhu baṣīrun bimā yaʿmalūn
  trad: Et ils ont estimé (*ḥasibū*) qu'il n'y aurait pas de *fitna* — alors ils sont devenus aveugles et sourds. Puis Allaah a accueilli leur retour (*tāba ʿalayhim*). Puis, de nouveau, ils sont devenus aveugles et sourds, beaucoup d'entre eux — et Allaah est *Baṣīr* de ce qu'ils font.
- ref: S.5:72
  ar: لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ هُوَ الْمَسِيحُ ابْنُ مَرْيَمَ ۖ وَقَالَ الْمَسِيحُ يَا بَنِي إِسْرَائِيلَ اعْبُدُوا اللَّهَ رَبِّي وَرَبَّكُمْ ۖ إِنَّهُ مَنْ يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّارُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنْصَارٍ
  trl: La-qad kafara lladhīna qālū inna llāha huwa l-masīḥu bnu maryama — wa-qāla l-masīḥu yā banī isrāʾīla ʿbudū llāha rabbī wa-rabbakum — innahu man yushrik bi-llāhi fa-qad ḥarrama llāhu ʿalayhi l-jannata wa-maʾwāhu n-nāru — wa-mā li-ẓ-ẓālimīna min anṣār
  trad: 'Ont commis le *kufr* ceux qui ont dit : « Allaah, c''est Lui, al-Masīḥ fils de Maryam. » Or al-Masīḥ a dit : « Ô Banū Isrāʾīl, adorez Allaah, mon *Rabb* et votre *Rabb*. » Quiconque associe (*yushrik*) à Allaah, Allaah lui interdit alors le jardin (*al-jannah*), et son refuge est le Feu — et il n''y a, pour les *ẓālimūn*, aucun secoureur (*anṣār*).'
- ref: S.5:73
  ar: لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلَاثَةٍ ۘ وَمَا مِنْ إِلَٰهٍ إِلَّا إِلَٰهٌ وَاحِدٌ ۚ وَإِنْ لَمْ يَنْتَهُوا عَمَّا يَقُولُونَ لَيَمَسَّنَّ الَّذِينَ كَفَرُوا مِنْهُمْ عَذَابٌ أَلِيمٌ
  trl: La-qad kafara lladhīna qālū inna llāha thālithu thalāthatin — wa-mā min ilāhin illā ilāhun wāḥidun — wa-in lam yantahū ʿammā yaqūlūna la-yamassanna lladhīna kafarū minhum ʿadhābun alīm
  trad: 'Ont commis le *kufr* ceux qui ont dit : « Allaah est le troisième de trois (*thālithu thalāthatin*). » Or il n''y a d''*ilāh* qu''un *ilāh* unique (*wāḥid*) — et s''ils ne cessent (*yantahū*) pas ce qu''ils disent, un châtiment douloureux touchera assurément ceux d''entre eux qui ont commis le *kufr*.'
- ref: S.5:74
  ar: أَفَلَا يَتُوبُونَ إِلَى اللَّهِ وَيَسْتَغْفِرُونَهُ ۚ وَاللَّهُ غَفُورٌ رَحِيمٌ
  trl: A-fa-lā yatūbūna ila llāhi wa-yastaghfirūnahu — wa-llāhu ghafūrun raḥīm
  trad: Ne reviendront-ils donc pas (*a-fa-lā yatūbūna*) vers Allaah, et ne Lui demanderont-ils pas pardon (*yastaghfirūnahu*) ? Allaah est *Ghafūr*, *Raḥīm*.
- ref: S.5:75
  ar: مَا الْمَسِيحُ ابْنُ مَرْيَمَ إِلَّا رَسُولٌ قَدْ خَلَتْ مِنْ قَبْلِهِ الرُّسُلُ وَأُمُّهُ صِدِّيقَةٌ ۖ كَانَا يَأْكُلَانِ الطَّعَامَ ۗ انْظُرْ كَيْفَ نُبَيِّنُ لَهُمُ الْآيَاتِ ثُمَّ انْظُرْ أَنَّىٰ يُؤْفَكُونَ
  trl: Mā l-masīḥu bnu maryama illā rasūlun qad khalat min qablihi r-rusulu wa-ummuhu ṣiddīqatun — kānā yaʾkulāni ṭ-ṭaʿāma — nẓur kayfa nubayyinu lahumu l-āyāti thumma nẓur annā yuʾfakūn
  trad: 'Al-Masīḥ fils de Maryam n''est qu''un *rasūl* : des *rusul* sont passés (*khalat*) avant lui, et sa mère était *ṣiddīqa*. Tous deux mangeaient de la nourriture (*kānā yaʾkulāni ṭ-ṭaʿāma*). Regarde comment Nous leur exposons clairement les *āyāt*, puis regarde comment ils sont détournés [de la vérité] (*yuʾfakūn*).'
- ref: S.5:76
  ar: قُلْ أَتَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَمْلِكُ لَكُمْ ضَرًّا وَلَا نَفْعًا ۚ وَاللَّهُ هُوَ السَّمِيعُ الْعَلِيمُ
  trl: Qul a-taʿbudūna min dūni llāhi mā lā yamliku lakum ḍarran wa-lā nafʿan — wa-llāhu huwa s-samīʿu l-ʿalīm
  trad: 'Dis : « Adorez-vous, en dehors d''Allaah, ce qui ne détient pour vous ni le pouvoir de nuire (*ḍarr*) ni celui d''être utile (*nafʿ*) ? » Allaah est, Lui, *as-Samīʿ*, *al-ʿAlīm*.'
- ref: S.5:77
  ar: قُلْ يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ غَيْرَ الْحَقِّ وَلَا تَتَّبِعُوا أَهْوَاءَ قَوْمٍ قَدْ ضَلُّوا مِنْ قَبْلُ وَأَضَلُّوا كَثِيرًا وَضَلُّوا عَنْ سَوَاءِ السَّبِيلِ
  trl: Qul yā ahla l-kitābi lā taghlū fī dīnikum ghayra l-ḥaqqi wa-lā tattabiʿū ahwāʾa qawmin qad ḍallū min qablu wa-aḍallū kathīran wa-ḍallū ʿan sawāʾi s-sabīl
  trad: 'Dis : « Ô *Ahl al-Kitāb*, n''excédez pas (*lā taghlū*) dans votre *dīn*, hors du *ḥaqq*, et ne suivez pas les désirs (*ahwāʾ*) d''un peuple qui s''est déjà égaré (*ḍallū*) auparavant, en a égaré beaucoup, et s''est égaré loin du milieu du chemin (*sawāʾ as-sabīl*). »'
- ref: S.5:78
  ar: لُعِنَ الَّذِينَ كَفَرُوا مِنْ بَنِي إِسْرَائِيلَ عَلَىٰ لِسَانِ دَاوُودَ وَعِيسَى ابْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوْا وَكَانُوا يَعْتَدُونَ
  trl: Luʿina lladhīna kafarū min banī isrāʾīla ʿalā lisāni dāwūda wa-ʿīsā bni maryama — dhālika bimā ʿaṣaw wa-kānū yaʿtadūn
  trad: Furent éloignés [de la *raḥma*] (*luʿina*) ceux qui ont commis le *kufr* parmi les Banū Isrāʾīl, par la langue (*ʿalā lisāni*) de Dāwūd et de ʿĪsā fils de Maryam — cela pour avoir désobéi (*ʿaṣaw*) et n'avoir cessé de transgresser (*yaʿtadūn*).
- ref: S.5:79
  ar: كَانُوا لَا يَتَنَاهَوْنَ عَنْ مُنْكَرٍ فَعَلُوهُ ۚ لَبِئْسَ مَا كَانُوا يَفْعَلُونَ
  trl: Kānū lā yatanāhawna ʿan munkarin faʿalūhu — la-biʾsa mā kānū yafʿalūn
  trad: Ils ne se retenaient pas mutuellement (*lā yatanāhawna*) du *munkar* qu'ils commettaient — combien est misérable (*la-biʾsa*) ce qu'ils faisaient !
- ref: S.5:80
  ar: تَرَىٰ كَثِيرًا مِنْهُمْ يَتَوَلَّوْنَ الَّذِينَ كَفَرُوا ۚ لَبِئْسَ مَا قَدَّمَتْ لَهُمْ أَنْفُسُهُمْ أَنْ سَخِطَ اللَّهُ عَلَيْهِمْ وَفِي الْعَذَابِ هُمْ خَالِدُونَ
  trl: Tarā kathīran minhum yatawallawna lladhīna kafarū — la-biʾsa mā qaddamat lahum anfusuhum an sakhiṭa llāhu ʿalayhim wa-fi l-ʿadhābi hum khālidūn
  trad: 'Tu vois beaucoup d''entre eux prendre pour *walī* (*yatawallawna*) ceux qui ont commis le *kufr* — combien est misérable ce que leurs *nafs* ont fait précéder pour eux : qu''Allaah ait manifesté à leur égard un *sakhaṭ* [un rejet, un retrait de la faveur] — et dans le châtiment, ils demeurent (*khālidūn*).'
- ref: S.5:81
  ar: وَلَوْ كَانُوا يُؤْمِنُونَ بِاللَّهِ وَالنَّبِيِّ وَمَا أُنْزِلَ إِلَيْهِ مَا اتَّخَذُوهُمْ أَوْلِيَاءَ وَلَٰكِنَّ كَثِيرًا مِنْهُمْ فَاسِقُونَ
  trl: Wa-law kānū yuʾminūna bi-llāhi wa-n-nabiyyi wa-mā unzila ilayhi mā ttakhadhūhum awliyāʾa wa-lākinna kathīran minhum fāsiqūn
  trad: Et s'ils croyaient en Allaah, au *nabī*, et à ce qui lui a été descendu, ils ne les auraient pas pris pour *awliyāʾ* — mais beaucoup d'entre eux sont des *fāsiqūn*.
- ref: S.5:82
  ar: ۞ لَتَجِدَنَّ أَشَدَّ النَّاسِ عَدَاوَةً لِلَّذِينَ آمَنُوا الْيَهُودَ وَالَّذِينَ أَشْرَكُوا ۖ وَلَتَجِدَنَّ أَقْرَبَهُمْ مَوَدَّةً لِلَّذِينَ آمَنُوا الَّذِينَ قَالُوا إِنَّا نَصَارَىٰ ۚ ذَٰلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَانًا وَأَنَّهُمْ لَا يَسْتَكْبِرُونَ
  trl: La-tajidanna ashadda n-nāsi ʿadāwatan li-lladhīna āmanu l-yahūda wa-lladhīna ashrakū — wa-la-tajidanna aqrabahum mawaddatan li-lladhīna āmanu lladhīna qālū innā naṣārā — dhālika bi-anna minhum qissīsīna wa-ruhbānan wa-annahum lā yastakbirūn
  trad: 'Tu trouveras assurément les plus véhéments des gens en hostilité (*ʿadāwatan*) envers ceux qui ont cru : les Yahūd, et ceux qui ont commis le *shirk*. Et tu trouveras assurément les plus proches d''eux en affection (*mawaddatan*) envers ceux qui ont cru : ceux qui ont dit « nous sommes *Naṣārā* » — cela, parce que, parmi eux (*minhum*), il y a des *qissīsūn* et des *ruhbān*, et qu''ils ne s''enorgueillissent pas (*lā yastakbirūn*).'
- ref: S.5:83
  ar: وَإِذَا سَمِعُوا مَا أُنْزِلَ إِلَى الرَّسُولِ تَرَىٰ أَعْيُنَهُمْ تَفِيضُ مِنَ الدَّمْعِ مِمَّا عَرَفُوا مِنَ الْحَقِّ ۖ يَقُولُونَ رَبَّنَا آمَنَّا فَاكْتُبْنَا مَعَ الشَّاهِدِينَ
  trl: Wa-idhā samiʿū mā unzila ila r-rasūli tarā aʿyunahum tafīḍu mina d-damʿi mimmā ʿarafū mina l-ḥaqqi — yaqūlūna rabbanā āmannā fa-ktubnā maʿa sh-shāhidīn
  trad: 'Et quand ils entendent ce qui a été fait descendre (*mā unzila*) vers le *rasūl*, tu vois leurs yeux déborder de larmes (*tafīḍu mina d-damʿi*), à cause de ce qu''ils ont reconnu (*ʿarafū*) du *ḥaqq* — ils disent : « Notre *Rabb*, nous avons cru : inscris-nous donc parmi les *shāhidūn*. »'
- ref: S.5:84
  ar: وَمَا لَنَا لَا نُؤْمِنُ بِاللَّهِ وَمَا جَاءَنَا مِنَ الْحَقِّ وَنَطْمَعُ أَنْ يُدْخِلَنَا رَبُّنَا مَعَ الْقَوْمِ الصَّالِحِينَ
  trl: Wa-mā lanā lā nuʾminu bi-llāhi wa-mā jāʾanā mina l-ḥaqqi wa-naṭmaʿu an yudkhilanā rabbunā maʿa l-qawmi ṣ-ṣāliḥīn
  trad: Et qu'aurions-nous à ne pas croire en Allaah et en ce qui nous est venu du *ḥaqq*, alors que nous aspirons (*naṭmaʿu*) à ce que notre *Rabb* nous fasse entrer avec le peuple des *ṣāliḥīn* ?
- ref: S.5:85
  ar: فَأَثَابَهُمُ اللَّهُ بِمَا قَالُوا جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا ۚ وَذَٰلِكَ جَزَاءُ الْمُحْسِنِينَ
  trl: Fa-athābahumu llāhu bimā qālū jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā — wa-dhālika jazāʾu l-muḥsinīn
  trad: Allaah les a alors rétribués (*fa-athābahum*), pour ce qu'ils ont dit, par des jardins sous lesquels coulent les rivières, où ils demeurent (*khālidīna*) — et cela est la rétribution (*jazāʾ*) des *muḥsinīn*.
- ref: S.5:86
  ar: وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَٰئِكَ أَصْحَابُ الْجَحِيمِ
  trl: Wa-lladhīna kafarū wa-kadhdhabū bi-āyātinā ulāʾika aṣḥābu l-jaḥīm
  trad: Et ceux qui ont commis le *kufr* et démenti (*kadhdhabū*) Nos *āyāt*, ceux-là sont les compagnons (*aṣḥāb*) de *al-jaḥīm*.
- ref: S.5:87
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُحَرِّمُوا طَيِّبَاتِ مَا أَحَلَّ اللَّهُ لَكُمْ وَلَا تَعْتَدُوا ۚ إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ
  trl: Yā ayyuhā lladhīna āmanū lā tuḥarrimū ṭayyibāti mā aḥalla llāhu lakum wa-lā taʿtadū — inna llāha lā yuḥibbu l-muʿtadīn
  trad: Ô vous qui avez cru, ne rendez pas interdit (*lā tuḥarrimū*) ce qu'il y a de bon (*ṭayyibāt*) parmi ce qu'Allaah a rendu licite (*aḥalla*) pour vous, et ne transgressez pas (*lā taʿtadū*) — Allaah n'honore pas (*lā yuḥibbu*) les *muʿtadīn*.
- ref: S.5:88
  ar: وَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا ۚ وَاتَّقُوا اللَّهَ الَّذِي أَنْتُمْ بِهِ مُؤْمِنُونَ
  trl: Wa-kulū mimmā razaqakumu llāhu ḥalālan ṭayyiban — wa-ttaqu llāha lladhī antum bihi muʾminūn
  trad: Et mangez de ce qu'Allaah vous a accordé comme subsistance (*razaqakum*), licite (*ḥalālan*) et bon (*ṭayyiban*) — et constituez-vous une taqwā (*wa-ttaqū*) d'Allaah, en qui vous croyez (*muʾminūn*).
- ref: S.5:89
  ar: لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِنْ يُؤَاخِذُكُمْ بِمَا عَقَّدْتُمُ الْأَيْمَانَ ۖ فَكَفَّارَتُهُ إِطْعَامُ عَشَرَةِ مَسَاكِينَ مِنْ أَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمْ أَوْ كِسْوَتُهُمْ أَوْ تَحْرِيرُ رَقَبَةٍ ۖ فَمَنْ لَمْ يَجِدْ فَصِيَامُ ثَلَاثَةِ أَيَّامٍ ۚ ذَٰلِكَ كَفَّارَةُ أَيْمَانِكُمْ إِذَا حَلَفْتُمْ ۚ وَاحْفَظُوا أَيْمَانَكُمْ ۚ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَشْكُرُونَ
  trl: Lā yuʾākhidhukumu llāhu bi-l-laghwi fī aymānikum wa-lākin yuʾākhidhukum bimā ʿaqqadtumu l-aymāna — fa-kaffāratuhu iṭʿāmu ʿasharati masākīna min awsaṭi mā tuṭʿimūna ahlīkum aw kiswatuhum aw taḥrīru raqabatin — fa-man lam yajid fa-ṣiyāmu thalāthati ayyāmin — dhālika kaffāratu aymānikum idhā ḥalaftum — wa-ḥfaẓū aymānakum — ka-dhālika yubayyinu llāhu lakum āyātihi laʿallakum tashkurūn
  trad: Allaah ne vous tient pas pour responsables (*lā yuʾākhidhukum*) du *laghw* dans vos serments (*aymānikum*), mais Il vous tient pour responsables de ce que vous avez contracté avec intention (*ʿaqqadtumu*) des serments. Son expiation (*kaffāratuhu*) est de nourrir dix pauvres (*masākīn*), de la moyenne (*min awsaṭi*) de ce que vous nourrissez vos familles, ou de les vêtir (*kiswatuhum*), ou d'affranchir un captif (*taḥrīru raqabatin*) ; quiconque n'en trouve pas les moyens, alors un jeûne (*fa-ṣiyāmu*) de trois jours. Cela est l'expiation (*kaffāra*) de vos serments quand vous avez juré (*ḥalaftum*). Et gardez vos serments. C'est ainsi qu'Allaah vous expose clairement Ses *āyāt* — peut-être serez-vous reconnaissants (*tashkurūn*).
- ref: S.5:90
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنْصَابُ وَالْأَزْلَامُ رِجْسٌ مِنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ
  trl: Yā ayyuhā lladhīna āmanū innamā l-khamru wa-l-maysiru wa-l-anṣābu wa-l-azlāmu rijsun min ʿamali sh-shayṭāni fa-jtanibūhu laʿallakum tufliḥūn
  trad: Ô vous qui avez cru, le *khamr*, le *maysir*, les *anṣāb* et les *azlām* ne sont qu'un *rijs* (une souillure), relevant de l'œuvre du *shayṭān* — écartez-vous-en donc (*fa-jtanibūhu*) ; peut-être serez-vous *tufliḥūn* (dans l'état de qui a réussi).
- ref: S.5:91
  ar: إِنَّمَا يُرِيدُ الشَّيْطَانُ أَنْ يُوقِعَ بَيْنَكُمُ الْعَدَاوَةَ وَالْبَغْضَاءَ فِي الْخَمْرِ وَالْمَيْسِرِ وَيَصُدَّكُمْ عَنْ ذِكْرِ اللَّهِ وَعَنِ الصَّلَاةِ ۖ فَهَلْ أَنْتُمْ مُنْتَهُونَ
  trl: Innamā yurīdu sh-shayṭānu an yūqiʿa baynakumu l-ʿadāwata wa-l-baghḍāʾa fi l-khamri wa-l-maysiri wa-yaṣuddakum ʿan dhikri llāhi wa-ʿani ṣ-ṣalāti — fa-hal antum muntahūn
  trad: Le *shayṭān* ne veut, par le *khamr* et le *maysir*, que jeter entre vous l'*ʿadāwa* (l'hostilité) et le *baghḍāʾ* (la haine mutuelle), et vous détourner (*yaṣuddakum*) du *dhikr* d'Allaah et de la *ṣalāt* — allez-vous donc cesser (*muntahūn*) ?
- ref: S.5:92
  ar: وَأَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَاحْذَرُوا ۚ فَإِنْ تَوَلَّيْتُمْ فَاعْلَمُوا أَنَّمَا عَلَىٰ رَسُولِنَا الْبَلَاغُ الْمُبِينُ
  trl: Wa-aṭīʿu llāha wa-aṭīʿu r-rasūla wa-ḥdharū — fa-in tawallaytum fa-ʿlamū annamā ʿalā rasūlinā l-balāghu l-mubīn
  trad: Et obéissez à Allaah, et obéissez au *rasūl*, et prenez garde (*wa-ḥdharū*) — si vous vous détournez (*tawallaytum*), sachez alors que Notre *rasūl* n'a pour charge que la communication manifeste (*al-balāgh al-mubīn*).
- ref: S.5:93
  ar: لَيْسَ عَلَى الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جُنَاحٌ فِيمَا طَعِمُوا إِذَا مَا اتَّقَوْا وَآمَنُوا وَعَمِلُوا الصَّالِحَاتِ ثُمَّ اتَّقَوْا وَآمَنُوا ثُمَّ اتَّقَوْا وَأَحْسَنُوا ۗ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ
  trl: Laysa ʿalā lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti junāḥun fīmā ṭaʿimū idhā mā ttaqaw wa-āmanū wa-ʿamilū ṣ-ṣāliḥāti thumma ttaqaw wa-āmanū thumma ttaqaw wa-aḥsanū — wa-llāhu yuḥibbu l-muḥsinīn
  trad: Nul *junāḥ* ne pèse sur ceux qui ont cru et fait les œuvres droites (*ṣāliḥāt*) pour ce qu'ils ont consommé (*fīmā ṭaʿimū*), s'ils se sont constitué une taqwā (*ittaqaw*) et ont cru et fait les œuvres droites, puis se sont constitué une taqwā et ont cru, puis se sont constitué une taqwā et ont bien agi (*aḥsanū*) — Allaah honore (*yuḥibbu*) les *muḥsinūn*.
- ref: S.5:94
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَيَبْلُوَنَّكُمُ اللَّهُ بِشَيْءٍ مِنَ الصَّيْدِ تَنَالُهُ أَيْدِيكُمْ وَرِمَاحُكُمْ لِيَعْلَمَ اللَّهُ مَنْ يَخَافُهُ بِالْغَيْبِ ۚ فَمَنِ اعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُ عَذَابٌ أَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū la-yabluwannakumu llāhu bi-shayʾin mina ṣ-ṣaydi tanāluhu aydīkum wa-rimāḥukum li-yaʿlama llāhu man yakhāfuhu bi-l-ghaybi — fa-mani ʿtadā baʿda dhālika fa-lahu ʿadhābun alīm
  trad: Ô vous qui avez cru, Allaah va assurément vous éprouver (*la-yabluwannakum*) par quelque gibier qu'atteignent vos mains et vos lances, afin qu'il devienne manifeste (*li-yaʿlama llāh*) qui Le redoute (*yakhāfuhu*) dans l'inaccessible (*bi-l-ghayb*) — quiconque transgresse (*iʿtadā*) après cela aura un châtiment douloureux.
- ref: S.5:95
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقْتُلُوا الصَّيْدَ وَأَنْتُمْ حُرُمٌ ۚ وَمَنْ قَتَلَهُ مِنْكُمْ مُتَعَمِّدًا فَجَزَاءٌ مِثْلُ مَا قَتَلَ مِنَ النَّعَمِ يَحْكُمُ بِهِ ذَوَا عَدْلٍ مِنْكُمْ هَدْيًا بَالِغَ الْكَعْبَةِ أَوْ كَفَّارَةٌ طَعَامُ مَسَاكِينَ أَوْ عَدْلُ ذَٰلِكَ صِيَامًا لِيَذُوقَ وَبَالَ أَمْرِهِ ۗ عَفَا اللَّهُ عَمَّا سَلَفَ ۚ وَمَنْ عَادَ فَيَنْتَقِمُ اللَّهُ مِنْهُ ۗ وَاللَّهُ عَزِيزٌ ذُو انْتِقَامٍ
  trl: Yā ayyuhā lladhīna āmanū lā taqtulū ṣ-ṣayda wa-antum ḥurum — wa-man qatalahu minkum mutaʿammidan fa-jazāʾun mithlu mā qatala mina n-naʿami yaḥkumu bihi dhawā ʿadlin minkum hadyan bāligha l-Kaʿbati aw kaffāratun ṭaʿāmu masākīna aw ʿadlu dhālika ṣiyāman li-yadhūqa wabāla amrihi — ʿafā llāhu ʿammā salafa — wa-man ʿāda fa-yantaqimu llāhu minhu — wa-llāhu ʿazīzun dhū ntiqām
  trad: 'Ô vous qui avez cru, ne tuez pas le gibier tant que vous êtes en état de *ḥurum*. Quiconque parmi vous le tue avec intention délibérée (*mutaʿammidan*), qu''il y ait une compensation (*jazāʾ*) équivalente à ce qu''il a tué, parmi le bétail (*naʿam*), dont décident (*yaḥkumu bihi*) deux [hommes] justes (*dhawā ʿadl*) parmi vous : une offrande (*hadyan*) parvenant à la Kaʿba, ou une expiation (*kaffāra*) : nourrir des pauvres (*masākīn*), ou l''équivalent de cela en jeûne (*ṣiyāman*), afin qu''il goûte la lourdeur (*wabāl*) de son acte. Allaah a effacé ce qui est passé (*ʿafā … ʿammā salaf*) ; quiconque récidive (*ʿāda*), Allaah Se vengera de lui (*fa-yantaqimu*) — Allaah est *ʿAzīz*, doué de vengeance (*dhū ntiqām*).'
- ref: S.5:96
  ar: أُحِلَّ لَكُمْ صَيْدُ الْبَحْرِ وَطَعَامُهُ مَتَاعًا لَكُمْ وَلِلسَّيَّارَةِ ۖ وَحُرِّمَ عَلَيْكُمْ صَيْدُ الْبَرِّ مَا دُمْتُمْ حُرُمًا ۗ وَاتَّقُوا اللَّهَ الَّذِي إِلَيْهِ تُحْشَرُونَ
  trl: Uḥilla lakum ṣaydu l-baḥri wa-ṭaʿāmuhu matāʿan lakum wa-li-s-sayyārati — wa-ḥurrima ʿalaykum ṣaydu l-barri mā dumtum ḥuruman — wa-ttaqu llāha lladhī ilayhi tuḥsharūn
  trad: Vous est rendue licite la chasse en mer et sa nourriture, comme jouissance (*matāʿan*) pour vous et pour les voyageurs (*as-sayyāra*) — et vous est rendue interdite la chasse sur terre tant que vous demeurez en état de *ḥurum*. Constituez-vous une taqwā d'Allaah, Ce vers quoi vous serez rassemblés (*tuḥsharūn*).
- ref: S.5:97
  ar: ۞ جَعَلَ اللَّهُ الْكَعْبَةَ الْبَيْتَ الْحَرَامَ قِيَامًا لِلنَّاسِ وَالشَّهْرَ الْحَرَامَ وَالْهَدْيَ وَالْقَلَائِدَ ۚ ذَٰلِكَ لِتَعْلَمُوا أَنَّ اللَّهَ يَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَأَنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Jaʿala llāhu l-Kaʿbata l-bayta l-ḥarāma qiyāman li-n-nāsi wa-sh-shahra l-ḥarāma wa-l-hadya wa-l-qalāʾida — dhālika li-taʿlamū anna llāha yaʿlamu mā fi s-samāwāti wa-mā fi l-arḍi wa-anna llāha bi-kulli shayʾin ʿalīm
  trad: Allaah a fait de la Kaʿba, la Maison sacrée, un point d'appui stable (*qiyāman*) pour les gens, ainsi que du mois sacré, de l'offrande (*al-hady*) et des guirlandes qui la signalent (*al-qalāʾid*) — cela, afin que vous sachiez qu'Allaah sait ce qui est dans les cieux et ce qui est sur la terre, et qu'Allaah est, de toute chose, connaissant (*ʿalīm*).
- ref: S.5:98
  ar: اعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ وَأَنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Iʿlamū anna llāha shadīdu l-ʿiqābi wa-anna llāha ghafūrun raḥīm
  trad: Sachez qu'Allaah est sévère dans la sanction (*shadīdu l-ʿiqāb*), et qu'Allaah est *Ghafūr*, *Raḥīm*.
- ref: S.5:99
  ar: مَا عَلَى الرَّسُولِ إِلَّا الْبَلَاغُ ۗ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَ
  trl: Mā ʿalā r-rasūli illā l-balāghu — wa-llāhu yaʿlamu mā tubdūna wa-mā taktumūn
  trad: Le *rasūl* n'a de charge que la communication (*al-balāgh*) — Allaah sait ce que vous divulguez et ce que vous dissimulez.
- ref: S.5:100
  ar: قُلْ لَا يَسْتَوِي الْخَبِيثُ وَالطَّيِّبُ وَلَوْ أَعْجَبَكَ كَثْرَةُ الْخَبِيثِ ۚ فَاتَّقُوا اللَّهَ يَا أُولِي الْأَلْبَابِ لَعَلَّكُمْ تُفْلِحُونَ
  trl: Qul lā yastawī l-khabīthu wa-ṭ-ṭayyibu wa-law aʿjabaka kathratu l-khabīthi — fa-ttaqu llāha yā ulī l-albābi laʿallakum tufliḥūn
  trad: 'Dis : « Le *khabīth* (le vicié) et le *ṭayyib* (le bon) ne s''égalent pas (*lā yastawī*), même si l''abondance du *khabīth* te séduit (*aʿjabaka*) » — constituez-vous donc une taqwā d''Allaah, ô détenteurs de raison (*ulī l-albāb*) ; peut-être serez-vous *tufliḥūn*.'
- ref: S.5:101
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِنْ تُبْدَ لَكُمْ تَسُؤْكُمْ وَإِنْ تَسْأَلُوا عَنْهَا حِينَ يُنَزَّلُ الْقُرْآنُ تُبْدَ لَكُمْ عَفَا اللَّهُ عَنْهَا ۗ وَاللَّهُ غَفُورٌ حَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū lā tasʾalū ʿan ashyāʾa in tubda lakum tasuʾkum wa-in tasʾalū ʿanhā ḥīna yunazzalu l-Qurʾānu tubda lakum — ʿafā llāhu ʿanhā — wa-llāhu ghafūrun ḥalīm
  trad: Ô vous qui avez cru, n'interrogez pas sur des choses qui, si elles vous étaient dévoilées (*tubda lakum*), vous feraient du mal (*tasuʾkum*) ; et si vous les interrogez au moment où le *Qurʾān* descend (*ḥīna yunazzalu l-Qurʾān*), elles vous seront dévoilées. Allaah a passé outre cela (*ʿafā llāhu ʿanhā*) — Allaah est *Ghafūr*, *Ḥalīm*.
- ref: S.5:102
  ar: قَدْ سَأَلَهَا قَوْمٌ مِنْ قَبْلِكُمْ ثُمَّ أَصْبَحُوا بِهَا كَافِرِينَ
  trl: Qad saʾalahā qawmun min qablikum thumma aṣbaḥū bihā kāfirīn
  trad: Un peuple avant vous les a interrogées (*saʾalahā*), puis ils en sont devenus (*aṣbaḥū bihā*), à cause d'elles, des *kāfirūn*.
- ref: S.5:103
  ar: مَا جَعَلَ اللَّهُ مِنْ بَحِيرَةٍ وَلَا سَائِبَةٍ وَلَا وَصِيلَةٍ وَلَا حَامٍ ۙ وَلَٰكِنَّ الَّذِينَ كَفَرُوا يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ ۖ وَأَكْثَرُهُمْ لَا يَعْقِلُونَ
  trl: Mā jaʿala llāhu min baḥīratin wa-lā sāʾibatin wa-lā waṣīlatin wa-lā ḥāmin — wa-lākinna lladhīna kafarū yaftarūna ʿalā llāhi l-kadhiba — wa-aktharuhum lā yaʿqilūn
  trad: Allaah n'a institué (*mā jaʿala*) ni *baḥīra*, ni *sāʾiba*, ni *waṣīla*, ni *ḥām* — mais ceux qui ont commis le *kufr* forgent (*yaftarūna*) contre Allaah le mensonge (*al-kadhib*), et la plupart d'entre eux ne raisonnent pas (*lā yaʿqilūn*).
- ref: S.5:104
  ar: وَإِذَا قِيلَ لَهُمْ تَعَالَوْا إِلَىٰ مَا أَنْزَلَ اللَّهُ وَإِلَى الرَّسُولِ قَالُوا حَسْبُنَا مَا وَجَدْنَا عَلَيْهِ آبَاءَنَا ۚ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْلَمُونَ شَيْئًا وَلَا يَهْتَدُونَ
  trl: Wa-idhā qīla lahum taʿālaw ilā mā anzala llāhu wa-ilā r-rasūli qālū ḥasbunā mā wajadnā ʿalayhi ābāʾanā — a-wa-law kāna ābāʾuhum lā yaʿlamūna shayʾan wa-lā yahtadūn
  trad: 'Et quand il leur est dit : « Venez à ce qu''Allaah a fait descendre, et au *rasūl* » — ils disent : « Il nous suffit (*ḥasbunā*) de ce sur quoi nous avons trouvé (*wajadnā*) nos pères » — même si leurs pères ne savaient rien (*lā yaʿlamūna shayʾan*) et n''étaient pas guidés (*lā yahtadūn*) ?'
- ref: S.5:105
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا عَلَيْكُمْ أَنْفُسَكُمْ ۖ لَا يَضُرُّكُمْ مَنْ ضَلَّ إِذَا اهْتَدَيْتُمْ ۚ إِلَى اللَّهِ مَرْجِعُكُمْ جَمِيعًا فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Yā ayyuhā lladhīna āmanū ʿalaykum anfusakum — lā yaḍurrukum man ḍalla idhā htadaytum — ilā llāhi marjiʿukum jamīʿan fa-yunabbiʾukum bimā kuntum taʿmalūn
  trad: Ô vous qui avez cru, [veillez] sur vous-mêmes (*ʿalaykum anfusakum*) — celui qui s'égare (*man ḍalla*) ne vous nuit pas si vous êtes guidés (*htadaytum*) — vers Allaah est votre retour (*marjiʿukum*), tous ensemble, et Il vous informera (*fa-yunabbiʾukum*) de ce que vous faisiez.
- ref: S.5:106
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا شَهَادَةُ بَيْنِكُمْ إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ حِينَ الْوَصِيَّةِ اثْنَانِ ذَوَا عَدْلٍ مِنْكُمْ أَوْ آخَرَانِ مِنْ غَيْرِكُمْ إِنْ أَنْتُمْ ضَرَبْتُمْ فِي الْأَرْضِ فَأَصَابَتْكُمْ مُصِيبَةُ الْمَوْتِ ۚ تَحْبِسُونَهُمَا مِنْ بَعْدِ الصَّلَاةِ فَيُقْسِمَانِ بِاللَّهِ إِنِ ارْتَبْتُمْ لَا نَشْتَرِي بِهِ ثَمَنًا وَلَوْ كَانَ ذَا قُرْبَىٰ ۙ وَلَا نَكْتُمُ شَهَادَةَ اللَّهِ إِنَّا إِذًا لَمِنَ الْآثِمِينَ
  trl: Yā ayyuhā lladhīna āmanū shahādatu baynikum idhā ḥaḍara aḥadakumu l-mawtu ḥīna l-waṣiyyati ithnāni dhawā ʿadlin minkum aw ākharāni min ghayrikum in antum ḍarabtum fi l-arḍi fa-aṣābatkum muṣībatu l-mawti — taḥbisūnahumā min baʿdi ṣ-ṣalāti fa-yuqsimāni bi-llāhi ini rtabtum lā nashtarī bihi thamanan wa-law kāna dhā qurbā — wa-lā naktumu shahādata llāhi innā idhan la-mina l-āthimīn
  trad: 'Ô vous qui avez cru, le témoignage (*shahāda*) entre vous, quand la mort se présente (*ḥaḍara*) à l''un de vous, au moment de la *waṣiyya* : deux [témoins] justes (*dhawā ʿadl*) parmi vous, ou deux autres, non des vôtres, si vous êtes en déplacement sur la terre et que vous atteint le malheur (*muṣība*) de la mort. Vous les retiendrez après la *ṣalāt*, et ils jureront (*yuqsimāni*) par Allaah, si vous avez un doute (*in artabtum*) : « Nous n''échangerons pas cela contre un prix (*thamanan*), même s''il s''agit d''un proche (*dhā qurbā*), et nous ne dissimulerons pas le témoignage d''Allaah — nous serions alors, certes, parmi les *āthimūn* (ceux qui portent une faute). »'
- ref: S.5:107
  ar: فَإِنْ عُثِرَ عَلَىٰ أَنَّهُمَا اسْتَحَقَّا إِثْمًا فَآخَرَانِ يَقُومَانِ مَقَامَهُمَا مِنَ الَّذِينَ اسْتَحَقَّ عَلَيْهِمُ الْأَوْلَيَانِ فَيُقْسِمَانِ بِاللَّهِ لَشَهَادَتُنَا أَحَقُّ مِنْ شَهَادَتِهِمَا وَمَا اعْتَدَيْنَا إِنَّا إِذًا لَمِنَ الظَّالِمِينَ
  trl: Fa-in ʿuthira ʿalā annahumā staḥaqqā ithman fa-ākharāni yaqūmāni maqāmahumā mina lladhīna staḥaqqa ʿalayhimu l-awlayāni fa-yuqsimāni bi-llāhi la-shahādatunā aḥaqqu min shahādatihimā wa-mā ʿtadaynā innā idhan la-mina ẓ-ẓālimīn
  trad: 'Et si l''on découvre (*ʿuthira*) que ces deux [témoins] se sont rendus coupables d''une faute (*istaḥaqqā ithman*), alors deux autres prendront leur place (*yaqūmāni maqāmahumā*), parmi ceux envers qui la faute a été commise (*mina lladhīna staḥaqqa ʿalayhimu*), les deux plus proches en droit (*al-awlayān*) — et ils jureront par Allaah : « Notre témoignage est plus digne d''être retenu (*aḥaqqu*) que le témoignage de ces deux-là, et nous n''avons pas transgressé (*mā ʿtadaynā*) — nous serions alors, certes, parmi les *ẓālimūn*. »'
- ref: S.5:108
  ar: ذَٰلِكَ أَدْنَىٰ أَنْ يَأْتُوا بِالشَّهَادَةِ عَلَىٰ وَجْهِهَا أَوْ يَخَافُوا أَنْ تُرَدَّ أَيْمَانٌ بَعْدَ أَيْمَانِهِمْ ۗ وَاتَّقُوا اللَّهَ وَاسْمَعُوا ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ
  trl: Dhālika adnā an yaʾtū bi-sh-shahādati ʿalā wajhihā aw yakhāfū an turadda aymānun baʿda aymānihim — wa-ttaqu llāha wa-smaʿū — wa-llāhu lā yahdī l-qawma l-fāsiqīn
  trad: Cela est plus proche (*adnā*) pour qu'ils apportent le témoignage sous sa forme correcte (*ʿalā wajhihā*), ou qu'ils redoutent qu'un serment soit récusé (*turadda*) après leurs serments. Constituez-vous une taqwā d'Allaah et écoutez (*wa-smaʿū*) — Allaah ne guide pas le peuple des *fāsiqūn*.
- ref: S.5:109
  ar: ۞ يَوْمَ يَجْمَعُ اللَّهُ الرُّسُلَ فَيَقُولُ مَاذَا أُجِبْتُمْ ۖ قَالُوا لَا عِلْمَ لَنَا ۖ إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ
  trl: Yawma yajmaʿu llāhu r-rusula fa-yaqūlu mādhā ujibtum — qālū lā ʿilma lanā — innaka anta ʿallāmu l-ghuyūb
  trad: 'Le jour où Allaah rassemble les *rusul*, et dit : « Quelle réponse vous a-t-on faite (*mādhā ujibtum*) ? » — ils disent : « Nous n''avons aucun savoir (*lā ʿilma lanā*) — c''est Toi, en vérité, Ce qui connaît parfaitement (*ʿallām*) les réalités inconnaissables (*al-ghuyūb*). »'
- ref: S.5:110
  ar: إِذْ قَالَ اللَّهُ يَا عِيسَى ابْنَ مَرْيَمَ اذْكُرْ نِعْمَتِي عَلَيْكَ وَعَلَىٰ وَالِدَتِكَ إِذْ أَيَّدْتُكَ بِرُوحِ الْقُدُسِ تُكَلِّمُ النَّاسَ فِي الْمَهْدِ وَكَهْلًا ۖ وَإِذْ عَلَّمْتُكَ الْكِتَابَ وَالْحِكْمَةَ وَالتَّوْرَاةَ وَالْإِنْجِيلَ ۖ وَإِذْ تَخْلُقُ مِنَ الطِّينِ كَهَيْئَةِ الطَّيْرِ بِإِذْنِي فَتَنْفُخُ فِيهَا فَتَكُونُ طَيْرًا بِإِذْنِي ۖ وَتُبْرِئُ الْأَكْمَهَ وَالْأَبْرَصَ بِإِذْنِي ۖ وَإِذْ تُخْرِجُ الْمَوْتَىٰ بِإِذْنِي ۖ وَإِذْ كَفَفْتُ بَنِي إِسْرَائِيلَ عَنْكَ إِذْ جِئْتَهُمْ بِالْبَيِّنَاتِ فَقَالَ الَّذِينَ كَفَرُوا مِنْهُمْ إِنْ هَٰذَا إِلَّا سِحْرٌ مُبِينٌ
  trl: Idh qāla llāhu yā ʿīsā bna maryama dhkur niʿmatī ʿalayka wa-ʿalā wālidatika — idh ayyadtuka bi-rūḥi l-qudusi tukallimu n-nāsa fi l-mahdi wa-kahlan — wa-idh ʿallamtuka l-kitāba wa-l-ḥikmata wa-t-tawrāta wa-l-injīla — wa-idh takhluqu mina ṭ-ṭīni ka-hayʾati ṭ-ṭayri bi-idhnī fa-tanfukhu fīhā fa-takūnu ṭayran bi-idhnī — wa-tubriʾu l-akmaha wa-l-abraṣa bi-idhnī — wa-idh tukhriju l-mawtā bi-idhnī — wa-idh kafaftu banī isrāʾīla ʿanka idh jiʾtahum bi-l-bayyināti fa-qāla lladhīna kafarū minhum in hādhā illā siḥrun mubīn
  trad: 'Quand Allaah dit : « Ô ʿĪsā fils de Maryam, rappelle-toi Mon bienfait (*niʿmatī*) sur toi et sur ta mère (*wālidatika*) — quand Je t''ai soutenu (*ayyadtuka*) par le *rūḥ al-qudus* : tu parlais aux gens depuis le berceau (*al-mahd*) et à l''âge mûr (*kahlan*) — et quand Je t''ai enseigné le *Kitāb*, la *Ḥikma*, la *Tawrāh* et l''*Injīl* — et quand tu façonnais, à partir de l''argile (*aṭ-ṭīn*), une forme d''oiseau, par Ma permission (*bi-idhnī*), puis tu soufflais en elle, et elle devenait un oiseau, par Ma permission — et tu guérissais l''aveugle-né (*al-akmah*) et le lépreux (*al-abraṣ*), par Ma permission — et quand tu faisais sortir (*tukhriju*) les morts, par Ma permission — et quand J''ai retenu (*kafaftu*) les Banū Isrāʾīl loin de toi, quand tu leur vins avec les preuves manifestes (*al-bayyināt*), et que ceux qui, parmi eux (*minhum*), commirent le *kufr*, dirent : \"Cela n''est rien d''autre qu''une magie manifeste (*siḥrun mubīn*).\" »'
- ref: S.5:111
  ar: وَإِذْ أَوْحَيْتُ إِلَى الْحَوَارِيِّينَ أَنْ آمِنُوا بِي وَبِرَسُولِي قَالُوا آمَنَّا وَاشْهَدْ بِأَنَّنَا مُسْلِمُونَ
  trl: Wa-idh awḥaytu ila l-ḥawāriyyīna an āminū bī wa-bi-rasūlī — qālū āmannā wa-shhad bi-annanā muslimūn
  trad: 'Et quand J''ai inspiré (*awḥaytu*) aux *ḥawāriyyūn* : « Croyez en Moi et en Mon *rasūl* » — ils dirent : « Nous avons cru ; sois témoin (*ishhad*) que nous sommes *muslimūn*. »'
- ref: S.5:112
  ar: إِذْ قَالَ الْحَوَارِيُّونَ يَا عِيسَى ابْنَ مَرْيَمَ هَلْ يَسْتَطِيعُ رَبُّكَ أَنْ يُنَزِّلَ عَلَيْنَا مَائِدَةً مِنَ السَّمَاءِ ۖ قَالَ اتَّقُوا اللَّهَ إِنْ كُنْتُمْ مُؤْمِنِينَ
  trl: Idh qāla l-ḥawāriyyūna yā ʿīsā bna maryama hal yastaṭīʿu rabbuka an yunazzila ʿalaynā māʾidatan mina s-samāʾi — qāla ttaqu llāha in kuntum muʾminīn
  trad: 'Quand les *ḥawāriyyūn* dirent : « Ô ʿĪsā fils de Maryam, ton Rabb (*rabbuka*) est-Il capable (*hal yastaṭīʿu*) de faire descendre sur nous une *māʾida* (une table servie) depuis le ciel ? » — il dit : « Constituez-vous une taqwā (*ittaqū*) d''Allaah, si vous êtes croyants. »'
- ref: S.5:113
  ar: قَالُوا نُرِيدُ أَنْ نَأْكُلَ مِنْهَا وَتَطْمَئِنَّ قُلُوبُنَا وَنَعْلَمَ أَنْ قَدْ صَدَقْتَنَا وَنَكُونَ عَلَيْهَا مِنَ الشَّاهِدِينَ
  trl: Qālū nurīdu an naʾkula minhā wa-taṭmaʾinna qulūbunā wa-naʿlama an qad ṣadaqtanā wa-nakūna ʿalayhā mina sh-shāhidīn
  trad: 'Ils dirent : « Nous voulons manger de cette table, que nos cœurs s''apaisent (*taṭmaʾinna qulūbunā*), que nous sachions que tu nous as dit la vérité (*ṣadaqtanā*), et que nous en soyons, parmi les témoins (*ash-shāhidīn*). »'
- ref: S.5:114
  ar: قَالَ عِيسَى ابْنُ مَرْيَمَ اللَّهُمَّ رَبَّنَا أَنْزِلْ عَلَيْنَا مَائِدَةً مِنَ السَّمَاءِ تَكُونُ لَنَا عِيدًا لِأَوَّلِنَا وَآخِرِنَا وَآيَةً مِنْكَ ۖ وَارْزُقْنَا وَأَنْتَ خَيْرُ الرَّازِقِينَ
  trl: Qāla ʿīsā bnu maryama allāhumma rabbanā anzil ʿalaynā māʾidatan mina s-samāʾi takūnu lanā ʿīdan li-awwalinā wa-ākhirinā wa-āyatan minka — wa-rzuqnā wa-anta khayru r-rāziqīn
  trad: 'ʿĪsā fils de Maryam dit : « *Allāhumma*, notre Rabb (*rabbanā*), fais descendre sur nous une *māʾida* depuis le ciel, qui soit pour nous un *ʿīd* — pour le premier d''entre nous comme pour le dernier — et un signe (*āya*) venant de Toi ; et pourvois-nous (*wa-rzuqnā*), Toi qui es, entre tous ceux qui pourvoient, le meilleur (*khayru r-rāziqīn*). »'
- ref: S.5:115
  ar: قَالَ اللَّهُ إِنِّي مُنَزِّلُهَا عَلَيْكُمْ ۖ فَمَنْ يَكْفُرْ بَعْدُ مِنْكُمْ فَإِنِّي أُعَذِّبُهُ عَذَابًا لَا أُعَذِّبُهُ أَحَدًا مِنَ الْعَالَمِينَ
  trl: Qāla llāhu innī munazziluhā ʿalaykum — fa-man yakfur baʿdu minkum fa-innī uʿadhdhibuhu ʿadhāban lā uʿadhdhibuhu aḥadan mina l-ʿālamīn
  trad: 'Allaah dit : « Je vais la faire descendre sur vous ; mais quiconque, parmi vous, commet le *kufr* par la suite (*baʿdu*), Je le châtierai d''un châtiment tel que Je n''en châtierai personne (*aḥadan*) parmi les mondes (*al-ʿālamīn*). »'
- ref: S.5:116
  ar: وَإِذْ قَالَ اللَّهُ يَا عِيسَى ابْنَ مَرْيَمَ أَأَنْتَ قُلْتَ لِلنَّاسِ اتَّخِذُونِي وَأُمِّيَ إِلَٰهَيْنِ مِنْ دُونِ اللَّهِ ۖ قَالَ سُبْحَانَكَ مَا يَكُونُ لِي أَنْ أَقُولَ مَا لَيْسَ لِي بِحَقٍّ ۚ إِنْ كُنْتُ قُلْتُهُ فَقَدْ عَلِمْتَهُ ۚ تَعْلَمُ مَا فِي نَفْسِي وَلَا أَعْلَمُ مَا فِي نَفْسِكَ ۚ إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ
  trl: Wa-idh qāla llāhu yā ʿīsā bna maryama a-anta qulta li-n-nāsi ttakhidhūnī wa-ummiya ilāhayni min dūni llāhi — qāla subḥānaka mā yakūnu lī an aqūla mā laysa lī bi-ḥaqqin — in kuntu qultuhu fa-qad ʿalimtahu — taʿlamu mā fī nafsī wa-lā aʿlamu mā fī nafsika — innaka anta ʿallāmu l-ghuyūb
  trad: 'Et quand Allaah dit : « Ô ʿĪsā fils de Maryam, est-ce toi qui as dit aux gens : \"Prenez-moi, ainsi que ma mère, comme deux *ilāh* en dehors d''Allaah\" ? » — il dit : « Gloire à Toi (*subḥānaka*) — il ne m''appartient pas (*mā yakūnu lī*) de dire ce que je n''ai aucun droit (*ḥaqq*) de dire. Si je l''avais dit, Tu l''aurais su (*fa-qad ʿalimtahu*). Tu sais ce qu''il y a en moi-même (*nafsī*), et je ne sais pas ce qu''il y a en Toi-même (*nafsika*) — c''est Toi, en vérité, Ce qui connaît parfaitement les réalités inconnaissables. »'
- ref: S.5:117
  ar: مَا قُلْتُ لَهُمْ إِلَّا مَا أَمَرْتَنِي بِهِ أَنِ اعْبُدُوا اللَّهَ رَبِّي وَرَبَّكُمْ ۚ وَكُنْتُ عَلَيْهِمْ شَهِيدًا مَا دُمْتُ فِيهِمْ ۖ فَلَمَّا تَوَفَّيْتَنِي كُنْتَ أَنْتَ الرَّقِيبَ عَلَيْهِمْ ۚ وَأَنْتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ
  trl: Mā qultu lahum illā mā amartanī bihi ani ʿbudū llāha rabbī wa-rabbakum — wa-kuntu ʿalayhim shahīdan mā dumtu fīhim — fa-lammā tawaffaytanī kunta anta r-raqība ʿalayhim — wa-anta ʿalā kulli shayʾin shahīd
  trad: 'Je ne leur ai dit que ce que Tu m''as ordonné : « Servez Allaah, mon Rabb (*rabbī*) et votre Rabb (*rabbakum*) » — et j''étais, sur eux, un témoin (*shahīdan*), tant que je restais (*mā dumtu*) parmi eux ; mais quand Tu m''as repris en pleine mesure (*tawaffaytanī*), c''est Toi qui devins, Toi, Ce qui surveille (*ar-raqīb*) sur eux — et Tu es, sur toute chose, témoin (*shahīd*).'
- ref: S.5:118
  ar: إِنْ تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ ۖ وَإِنْ تَغْفِرْ لَهُمْ فَإِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ
  trl: In tuʿadhdhibhum fa-innahum ʿibāduka — wa-in taghfir lahum fa-innaka anta l-ʿazīzu l-ḥakīm
  trad: Si Tu les châties, ils sont Tes *ʿibād* (serviteurs) ; et si Tu leur pardonnes, Tu es, Toi, *l-ʿAzīz*, *l-Ḥakīm*.
- ref: S.5:119
  ar: قَالَ اللَّهُ هَٰذَا يَوْمُ يَنْفَعُ الصَّادِقِينَ صِدْقُهُمْ ۚ لَهُمْ جَنَّاتٌ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۚ رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ۚ ذَٰلِكَ الْفَوْزُ الْعَظِيمُ
  trl: Qāla llāhu hādhā yawmu yanfaʿu ṣ-ṣādiqīna ṣidquhum — lahum jannātun tajrī min taḥtihā l-anhāru khālidīna fīhā abadan — raḍiya llāhu ʿanhum wa-raḍū ʿanhu — dhālika l-fawzu l-ʿaẓīm
  trad: 'Allaah dit : « Voici le jour où la sincérité (*ṣidq*) profite aux sincères (*aṣ-ṣādiqīn*) — à eux des jardins sous lesquels coulent les rivières, où ils demeurent (*khālidīn*) pour toujours (*abadan*) ; Allaah a agréé d''eux (*raḍiya ʿanhum*), et ils ont agréé de Lui (*raḍū ʿanhu*) — cela est le triomphe immense (*al-fawz al-ʿaẓīm*). »'
- ref: S.5:120
  ar: لِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَمَا فِيهِنَّ ۚ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Li-llāhi mulku s-samāwāti wa-l-arḍi wa-mā fīhinna — wa-huwa ʿalā kulli shayʾin qadīr
  trad: À Allaah appartient le *mulk* (la pleine souveraineté) des cieux et de la terre, et de ce qui s'y trouve — et Il est, sur toute chose, en pleine capacité (*qadīr*).
