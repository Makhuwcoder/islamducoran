- ref: S.14:1
  ar: الر ۚ كِتَابٌ أَنْزَلْنَاهُ إِلَيْكَ لِتُخْرِجَ النَّاسَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ بِإِذْنِ رَبِّهِمْ إِلَىٰ صِرَاطِ الْعَزِيزِ الْحَمِيدِ
  trl: Alif · Lām · Rāʾ — kitābun anzalnāhu ilayka li-tukhrija n-nāsa mina ẓ-ẓulumāti ilā n-nūri bi-idhni rabbihim ilā ṣirāṭi l-ʿazīzi l-ḥamīd
  trad: Alif, Lām, Rāʾ. Un Kitāb que Nous avons fait descendre vers toi, pour que tu fasses sortir les gens des ẓulumāt vers le nūr, avec la permission de leur Rabb (bi-idhni rabbihim), vers le chemin d'al-ʿAzīz, al-Ḥamīd.
- ref: S.14:2
  ar: اللَّهِ الَّذِي لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَوَيْلٌ لِلْكَافِرِينَ مِنْ عَذَابٍ شَدِيدٍ
  trl: Allāhi lladhī lahu mā fi s-samāwāti wa-mā fi l-arḍi wa-waylun li-l-kāfirīna min ʿadhābin shadīd
  trad: — Allaah, Ce qui possède ce qui est dans les cieux et ce qui est sur la terre. Et malheur (wayl) aux kāfirūn, d'un châtiment sévère.
- ref: S.14:3
  ar: الَّذِينَ يَسْتَحِبُّونَ الْحَيَاةَ الدُّنْيَا عَلَى الْآخِرَةِ وَيَصُدُّونَ عَنْ سَبِيلِ اللَّهِ وَيَبْغُونَهَا عِوَجًا ۚ أُولَٰئِكَ فِي ضَلَالٍ بَعِيدٍ
  trl: Alladhīna yastaḥibbūna l-ḥayāta d-dunyā ʿalā l-ākhirati wa-yaṣuddūna ʿan sabīli llāhi wa-yabghūnahā ʿiwajan ulāʾika fī ḍalālin baʿīd
  trad: Ceux qui préfèrent (yastaḥibbūna) la vie d'ici-bas à l'Ākhira, qui détournent (yaṣuddūna) du sabīl d'Allaah et qui cherchent à le rendre tortueux (yabghūnahā ʿiwajan) — ceux-là sont dans un égarement profond (ḍalālin baʿīd).
- ref: S.14:4
  ar: وَمَا أَرْسَلْنَا مِنْ رَسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ لِيُبَيِّنَ لَهُمْ ۖ فَيُضِلُّ اللَّهُ مَنْ يَشَاءُ وَيَهْدِي مَنْ يَشَاءُ ۚ وَهُوَ الْعَزِيزُ الْحَكِيمُ
  trl: Wa-mā arsalnā min rasūlin illā bi-lisāni qawmihi li-yubayyina lahum fa-yuḍillu llāhu man yashāʾu wa-yahdī man yashāʾu wa-huwa l-ʿazīzu l-ḥakīm
  trad: Et Nous n'avons envoyé aucun rasūl si ce n'est dans la langue de son peuple, pour qu'il leur explique clairement (li-yubayyina lahum). Allaah égare alors qui Il veut, et guide qui Il veut — et Il est al-ʿAzīz, al-Ḥakīm.
- ref: S.14:5
  ar: وَلَقَدْ أَرْسَلْنَا مُوسَىٰ بِآيَاتِنَا أَنْ أَخْرِجْ قَوْمَكَ مِنَ الظُّلُمَاتِ إِلَى النُّورِ وَذَكِّرْهُمْ بِأَيَّامِ اللَّهِ ۚ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِكُلِّ صَبَّارٍ شَكُورٍ
  trl: Wa-la-qad arsalnā mūsā bi-āyātinā an akhrij qawmaka mina ẓ-ẓulumāti ilā n-nūri wa-dhakkirhum bi-ayyāmi llāhi inna fī dhālika la-āyātin li-kulli ṣabbārin shakūr
  trad: 'Et Nous avons certes envoyé Mūsā avec Nos āyāt : « Fais sortir ton peuple des ẓulumāt vers le nūr, et rappelle-leur les jours d''Allaah (ayyāmi llāh). » Il y a certes en cela des āyāt pour quiconque est empreint d''endurance constante et de gratitude (li-kulli ṣabbārin shakūr).'
- ref: S.14:6
  ar: وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ اذْكُرُوا نِعْمَةَ اللَّهِ عَلَيْكُمْ إِذْ أَنْجَاكُمْ مِنْ آلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوءَ الْعَذَابِ وَيُذَبِّحُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ ۚ وَفِي ذَٰلِكُمْ بَلَاءٌ مِنْ رَبِّكُمْ عَظِيمٌ
  trl: Wa-idh qāla mūsā li-qawmihi dhkurū niʿmata llāhi ʿalaykum idh anjākum min āli firʿawna yasūmūnakum sūʾa l-ʿadhābi wa-yudhabbiḥūna abnāʾakum wa-yastaḥyūna nisāʾakum wa-fī dhālikum balāʾun min rabbikum ʿaẓīm
  trad: 'Et quand Mūsā dit à son peuple : « Rappelez-vous le niʿma d''Allaah sur vous, quand Il vous a sauvés de la famille de Firʿawn qui vous infligeait le pire des châtiments (sūʾa l-ʿadhāb), égorgeait vos fils et laissait vivre vos femmes — et il y avait là une épreuve immense (balāʾun ʿaẓīm) venant de votre Rabb. »'
- ref: S.14:7
  ar: وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ
  trl: Wa-idh taʾadhdhana rabbukum la-in shakartum la-azīdannakum wa-la-in kafartum inna ʿadhābī la-shadīd
  trad: 'Et quand votre Rabb fit savoir avec certitude (taʾadhdhana) : « Si vous êtes reconnaissants (shakartum), très certainement Je vous accroîtrai (la-azīdannakum) ; et si vous êtes kāfirūn, Mon châtiment est certes sévère. »'
- ref: S.14:8
  ar: وَقَالَ مُوسَىٰ إِنْ تَكْفُرُوا أَنْتُمْ وَمَنْ فِي الْأَرْضِ جَمِيعًا فَإِنَّ اللَّهَ لَغَنِيٌّ حَمِيدٌ
  trl: Wa-qāla mūsā in takfurū antum wa-man fi l-arḍi jamīʿan fa-inna llāha la-ghaniyyun ḥamīd
  trad: 'Et Mūsā dit : « Si vous commettez le kufr, vous et quiconque est sur la terre, tous ensemble — Allaah est certes Ghaniyy, Ḥamīd. »'
- ref: S.14:9
  ar: أَلَمْ يَأْتِكُمْ نَبَأُ الَّذِينَ مِنْ قَبْلِكُمْ قَوْمِ نُوحٍ وَعَادٍ وَثَمُودَ ۛ وَالَّذِينَ مِنْ بَعْدِهِمْ ۛ لَا يَعْلَمُهُمْ إِلَّا اللَّهُ ۚ جَاءَتْهُمْ رُسُلُهُمْ بِالْبَيِّنَاتِ فَرَدُّوا أَيْدِيَهُمْ فِي أَفْوَاهِهِمْ وَقَالُوا إِنَّا كَفَرْنَا بِمَا أُرْسِلْتُمْ بِهِ وَإِنَّا لَفِي شَكٍّ مِمَّا تَدْعُونَنَا إِلَيْهِ مُرِيبٍ
  trl: A-lam yaʾtikum nabaʾu lladhīna min qablikum qawmi nūḥin wa-ʿādin wa-thamūda wa-lladhīna min baʿdihim lā yaʿlamuhum illā llāhu jāʾathum rusuluhum bi-l-bayyināti fa-raddū aydiyahum fī afwāhihim wa-qālū innā kafarnā bi-mā ursiltum bihi wa-innā la-fī shakkin mimmā tadʿūnanā ilayhi murīb
  trad: 'Le récit (nabaʾ) de ceux d''avant vous ne vous est-il pas parvenu — le peuple de Nūḥ, ʿĀd et Thamūd, et ceux venus après eux, que seul Allaah connaît ? Leurs rusul leur vinrent avec les preuves manifestes (al-bayyināt), mais ils replièrent leurs mains dans leurs bouches (fa-raddū aydiyahum fī afwāhihim), et dirent : « Nous rejetons (kafarnā) ce avec quoi vous avez été envoyés, et nous sommes certes dans un doute troublant (shakkin murīb) au sujet de ce à quoi vous nous appelez. »'
- ref: S.14:10
  ar: ۞ قَالَتْ رُسُلُهُمْ أَفِي اللَّهِ شَكٌّ فَاطِرِ السَّمَاوَاتِ وَالْأَرْضِ ۖ يَدْعُوكُمْ لِيَغْفِرَ لَكُمْ مِنْ ذُنُوبِكُمْ وَيُؤَخِّرَكُمْ إِلَىٰ أَجَلٍ مُسَمًّى ۚ قَالُوا إِنْ أَنْتُمْ إِلَّا بَشَرٌ مِثْلُنَا تُرِيدُونَ أَنْ تَصُدُّونَا عَمَّا كَانَ يَعْبُدُ آبَاؤُنَا فَأْتُونَا بِسُلْطَانٍ مُبِينٍ
  trl: Qālat rusuluhum a-fi llāhi shakkun fāṭiri s-samāwāti wa-l-arḍi yadʿūkum li-yaghfira lakum min dhunūbikum wa-yuʾakhkhirakum ilā ajalin musamman qālū in antum illā basharun mithlunā turīdūna an taṣuddūnā ʿammā kāna yaʿbudu ābāʾunā fa-ʾtūnā bi-sulṭānin mubīn
  trad: 'Leurs rusul dirent : « Y aurait-il un doute au sujet d''Allaah, Ce qui a fait éclore (Fāṭir) les cieux et la terre ? Il vous appelle pour vous pardonner une part de vos fautes (li-yaghfira lakum min dhunūbikum), et vous accorder un délai jusqu''à un terme fixé (ajalin musamman). » Ils dirent : « Vous n''êtes que des humains comme nous ; vous voulez nous détourner de ce que nos pères adoraient. Apportez-nous donc une preuve manifeste (sulṭānin mubīn). »'
- ref: S.14:11
  ar: قَالَتْ لَهُمْ رُسُلُهُمْ إِنْ نَحْنُ إِلَّا بَشَرٌ مِثْلُكُمْ وَلَٰكِنَّ اللَّهَ يَمُنُّ عَلَىٰ مَنْ يَشَاءُ مِنْ عِبَادِهِ ۖ وَمَا كَانَ لَنَا أَنْ نَأْتِيَكُمْ بِسُلْطَانٍ إِلَّا بِإِذْنِ اللَّهِ ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ
  trl: Qālat lahum rusuluhum in naḥnu illā basharun mithlukum wa-lākinna llāha yamunnu ʿalā man yashāʾu min ʿibādihi wa-mā kāna lanā an naʾtiyakum bi-sulṭānin illā bi-idhni llāhi wa-ʿalā llāhi fa-l-yatawakkali l-muʾminūn
  trad: 'Leurs rusul leur dirent : « Nous ne sommes que des humains comme vous ; mais Allaah favorise (yamunnu) qui Il veut parmi Ses serviteurs. Et il ne nous appartient pas de vous apporter une preuve sans la permission d''Allaah — c''est sur Allaah que les muʾminūn doivent s''en remettre. »'
- ref: S.14:12
  ar: وَمَا لَنَا أَلَّا نَتَوَكَّلَ عَلَى اللَّهِ وَقَدْ هَدَانَا سُبُلَنَا ۚ وَلَنَصْبِرَنَّ عَلَىٰ مَا آذَيْتُمُونَا ۚ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُتَوَكِّلُونَ
  trl: Wa-mā lanā allā natawakkala ʿalā llāhi wa-qad hadānā subulanā wa-la-naṣbiranna ʿalā mā ādhaytumūnā wa-ʿalā llāhi fa-l-yatawakkali l-mutawakkilūn
  trad: Et qu'aurions-nous à ne pas nous en remettre à Allaah, alors qu'Il nous a guidés sur nos chemins ? Nous endurerons certainement (la-naṣbiranna) le tort que vous nous faites (mā ādhaytumūnā) — et c'est sur Allaah que doivent s'en remettre ceux qui s'en remettent (al-mutawakkilūn).
- ref: S.14:13
  ar: وَقَالَ الَّذِينَ كَفَرُوا لِرُسُلِهِمْ لَنُخْرِجَنَّكُمْ مِنْ أَرْضِنَا أَوْ لَتَعُودُنَّ فِي مِلَّتِنَا ۖ فَأَوْحَىٰ إِلَيْهِمْ رَبُّهُمْ لَنُهْلِكَنَّ الظَّالِمِينَ
  trl: Wa-qāla lladhīna kafarū li-rusulihim la-nukhrijannakum min arḍinā aw la-taʿūdunna fī millatinā fa-awḥā ilayhim rabbuhum la-nuhlikanna ẓ-ẓālimīn
  trad: 'Et ceux qui sont kāfirūn dirent à leurs rusul : « Nous vous expulserons assurément de notre terre, ou vous reviendrez à notre milla. » Alors leur Rabb leur révéla (fa-awḥā ilayhim) : « J''anéantirai (la-nuhlikanna) certainement les ẓālimūn. »'
- ref: S.14:14
  ar: وَلَنُسْكِنَنَّكُمُ الْأَرْضَ مِنْ بَعْدِهِمْ ۚ ذَٰلِكَ لِمَنْ خَافَ مَقَامِي وَخَافَ وَعِيدِ
  trl: Wa-la-nuskinannakumu l-arḍa min baʿdihim dhālika li-man khāfa maqāmī wa-khāfa waʿīd
  trad: « Et Nous vous ferons très certainement habiter la terre après eux. Cela est pour qui craint Ma station (maqāmī — le fait de se tenir devant Moi, non un lieu) et craint Ma menace (waʿīd). »
- ref: S.14:15
  ar: وَاسْتَفْتَحُوا وَخَابَ كُلُّ جَبَّارٍ عَنِيدٍ
  trl: Wa-staftaḥū wa-khāba kullu jabbārin ʿanīd
  trad: Et ils demandèrent l'ouverture (wa-staftaḥū) — et fut déçu (khāba) tout tyran (jabbār) récalcitrant (ʿanīd).
- ref: S.14:16
  ar: مِنْ وَرَائِهِ جَهَنَّمُ وَيُسْقَىٰ مِنْ مَاءٍ صَدِيدٍ
  trl: Min warāʾihi jahannamu wa-yusqā min māʾin ṣadīd
  trad: Derrière lui (min warāʾihi), Jahannam — et il est abreuvé d'une eau purulente (māʾin ṣadīd).
- ref: S.14:17
  ar: يَتَجَرَّعُهُ وَلَا يَكَادُ يُسِيغُهُ وَيَأْتِيهِ الْمَوْتُ مِنْ كُلِّ مَكَانٍ وَمَا هُوَ بِمَيِّتٍ ۖ وَمِنْ وَرَائِهِ عَذَابٌ غَلِيظٌ
  trl: Yatajarraʿuhu wa-lā yakādu yusīghuhu wa-yaʾtīhi l-mawtu min kulli makānin wa-mā huwa bi-mayyitin wa-min warāʾihi ʿadhābun ghalīẓ
  trad: Il l'avale à petites gorgées (yatajarraʿuhu) et peut à peine le faire descendre (lā yakādu yusīghuhu) ; la mort lui vient de partout, sans qu'il meure — et derrière lui, un châtiment épais (ʿadhābun ghalīẓ).
- ref: S.14:18
  ar: مَثَلُ الَّذِينَ كَفَرُوا بِرَبِّهِمْ ۖ أَعْمَالُهُمْ كَرَمَادٍ اشْتَدَّتْ بِهِ الرِّيحُ فِي يَوْمٍ عَاصِفٍ ۖ لَا يَقْدِرُونَ مِمَّا كَسَبُوا عَلَىٰ شَيْءٍ ۚ ذَٰلِكَ هُوَ الضَّلَالُ الْبَعِيدُ
  trl: Mathalu lladhīna kafarū bi-rabbihim aʿmāluhum ka-ramādin ishtaddat bihi r-rīḥu fī yawmin ʿāṣifin lā yaqdirūna mimmā kasabū ʿalā shayʾin dhālika huwa ḍ-ḍalālu l-baʿīd
  trad: 'L''exemple (mathal) de ceux qui sont kāfirūn envers leur Rabb : leurs œuvres sont comme une cendre (ramād) que le vent frappe avec violence (ishtaddat bihi r-rīḥu) en un jour de tempête (yawmin ʿāṣif) — ils ne retiennent rien de ce qu''ils ont acquis (lā yaqdirūna mimmā kasabū ʿalā shayʾin). Voilà l''égarement profond (aḍ-ḍalāl al-baʿīd).'
- ref: S.14:19
  ar: أَلَمْ تَرَ أَنَّ اللَّهَ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ ۚ إِنْ يَشَأْ يُذْهِبْكُمْ وَيَأْتِ بِخَلْقٍ جَدِيدٍ
  trl: A-lam tara anna llāha khalaqa s-samāwāti wa-l-arḍa bi-l-ḥaqqi in yashaʾ yudhhibkum wa-yaʾti bi-khalqin jadīd
  trad: N'as-tu pas vu qu'Allaah a créé les cieux et la terre avec le ḥaqq ? S'Il veut, Il vous fait disparaître (yudhhibkum) et fait venir une création nouvelle (khalqin jadīd).
- ref: S.14:20
  ar: وَمَا ذَٰلِكَ عَلَى اللَّهِ بِعَزِيزٍ
  trl: Wa-mā dhālika ʿalā llāhi bi-ʿazīz
  trad: Et cela n'est pas, pour Allaah, chose ardue (bi-ʿazīz).
- ref: S.14:21
  ar: وَبَرَزُوا لِلَّهِ جَمِيعًا فَقَالَ الضُّعَفَاءُ لِلَّذِينَ اسْتَكْبَرُوا إِنَّا كُنَّا لَكُمْ تَبَعًا فَهَلْ أَنْتُمْ مُغْنُونَ عَنَّا مِنْ عَذَابِ اللَّهِ مِنْ شَيْءٍ ۚ قَالُوا لَوْ هَدَانَا اللَّهُ لَهَدَيْنَاكُمْ ۖ سَوَاءٌ عَلَيْنَا أَجَزِعْنَا أَمْ صَبَرْنَا مَا لَنَا مِنْ مَحِيصٍ
  trl: Wa-barazū li-llāhi jamīʿan fa-qāla ḍ-ḍuʿafāʾu li-lladhīna stakbarū innā kunnā lakum tabaʿan fa-hal antum mughnūna ʿannā min ʿadhābi llāhi min shayʾin qālū law hadānā llāhu la-hadaynākum sawāʾun ʿalaynā a-jaziʿnā am ṣabarnā mā lanā min maḥīṣ
  trad: 'Et ils comparaîtront devant Allaah, tous ensemble — les faibles (aḍ-ḍuʿafāʾ) diront à ceux qui se sont enflés d''orgueil (istakbarū) : « Nous étions, pour vous, des suiveurs (tabaʿan) — pouvez-vous donc nous être de quelque utilité contre le châtiment d''Allaah ? » Ils diront : « Si Allaah nous avait guidés, nous vous aurions guidés. Il nous est égal (sawāʾun ʿalaynā) que nous nous impatientions ou que nous patientions — nous n''avons aucune échappée (maḥīṣ). »'
- ref: S.14:22
  ar: وَقَالَ الشَّيْطَانُ لَمَّا قُضِيَ الْأَمْرُ إِنَّ اللَّهَ وَعَدَكُمْ وَعْدَ الْحَقِّ وَوَعَدْتُكُمْ فَأَخْلَفْتُكُمْ ۖ وَمَا كَانَ لِيَ عَلَيْكُمْ مِنْ سُلْطَانٍ إِلَّا أَنْ دَعَوْتُكُمْ فَاسْتَجَبْتُمْ لِي ۖ فَلَا تَلُومُونِي وَلُومُوا أَنْفُسَكُمْ ۖ مَا أَنَا بِمُصْرِخِكُمْ وَمَا أَنْتُمْ بِمُصْرِخِيَّ ۖ إِنِّي كَفَرْتُ بِمَا أَشْرَكْتُمُونِ مِنْ قَبْلُ ۗ إِنَّ الظَّالِمِينَ لَهُمْ عَذَابٌ أَلِيمٌ
  trl: Wa-qāla sh-shayṭānu lammā quḍiya l-amru inna llāha waʿadakum waʿda l-ḥaqqi wa-waʿadtukum fa-akhlaftukum wa-mā kāna liya ʿalaykum min sulṭānin illā an daʿawtukum fa-stajabtum lī fa-lā talūmūnī wa-lūmū anfusakum mā anā bi-muṣrikhikum wa-mā antum bi-muṣrikhiyya innī kafartu bi-mā ashraktumūni min qablu inna ẓ-ẓālimīna lahum ʿadhābun alīm
  trad: 'Et le shayṭān dira, quand l''affaire aura été tranchée (qudiya l-amru) : « Allaah vous a promis une promesse de ḥaqq, et moi je vous ai promis, puis j''ai manqué à ma promesse envers vous (akhlaftukum). Je n''avais sur vous aucune autorité (sulṭān), sinon que je vous ai appelés et que vous m''avez répondu. Ne me blâmez donc pas — blâmez-vous vous-mêmes. Je ne suis pas votre secours (bi-muṣrikhikum), ni vous n''êtes mon secours (bi-muṣrikhiyya). Je renie (kafartu) ce en quoi vous m''avez associé (ashraktumūni) auparavant. » Les ẓālimūn ont certes un châtiment douloureux.'
- ref: S.14:23
  ar: وَأُدْخِلَ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا بِإِذْنِ رَبِّهِمْ ۖ تَحِيَّتُهُمْ فِيهَا سَلَامٌ
  trl: Wa-udkhila lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti jannātin tajrī min taḥtihā l-anhāru khālidīna fīhā bi-idhni rabbihim taḥiyyatuhum fīhā salām
  trad: 'Et ceux qui ont cru et accompli les œuvres droites (aṣ-ṣāliḥāt) seront introduits dans des jardins sous lesquels coulent les rivières, y demeurant à jamais avec la permission de leur Rabb — leur salutation (taḥiyyatuhum) y sera : « Salām ! »'
- ref: S.14:24
  ar: أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ
  trl: A-lam tara kayfa ḍaraba llāhu mathalan kalimatan ṭayyibatan ka-shajaratin ṭayyibatin aṣluhā thābitun wa-farʿuhā fi s-samāʾ
  trad: 'N''as-tu pas vu comment Allaah propose un exemple (ḍaraba mathalan) : une parole bonne (kalimatan ṭayyibatan) est comme un arbre bon, dont la racine (aṣluhā) est fermement fixée (thābitun), et dont la ramure (farʿuhā) est dans le ciel.'
- ref: S.14:25
  ar: تُؤْتِي أُكُلَهَا كُلَّ حِينٍ بِإِذْنِ رَبِّهَا ۗ وَيَضْرِبُ اللَّهُ الْأَمْثَالَ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ
  trl: Tuʾtī ukulahā kulla ḥīnin bi-idhni rabbihā wa-yaḍribu llāhu l-amthāla li-n-nāsi laʿallahum yatadhakkarūn
  trad: Il donne son fruit (ukulahā) à tout moment (kulla ḥīnin), avec la permission de son Rabb (bi-idhni rabbihā) — et Allaah propose les exemples aux gens, peut-être se rappelleront-ils.
- ref: S.14:26
  ar: وَمَثَلُ كَلِمَةٍ خَبِيثَةٍ كَشَجَرَةٍ خَبِيثَةٍ اجْتُثَّتْ مِنْ فَوْقِ الْأَرْضِ مَا لَهَا مِنْ قَرَارٍ
  trl: Wa-mathalu kalimatin khabīthatin ka-shajaratin khabīthatin ijtuthshat min fawqi l-arḍi mā lahā min qarār
  trad: Et l'exemple d'une parole mauvaise (kalimatin khabīthatin) est comme un arbre mauvais, arraché (ujtuthat) de la surface de la terre — il n'a aucune stabilité (mā lahā min qarārin).
- ref: S.14:27
  ar: يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ ۖ وَيُضِلُّ اللَّهُ الظَّالِمِينَ ۚ وَيَفْعَلُ اللَّهُ مَا يَشَاءُ
  trl: Yuthabbitu llāhu lladhīna āmanū bi-l-qawli th-thābiti fi l-ḥayāti d-dunyā wa-fi l-ākhirati wa-yuḍillu llāhu ẓ-ẓālimīna wa-yafʿalu llāhu mā yashāʾ
  trad: Allaah affermit (yuthabbitu) ceux qui ont cru par la parole ferme (al-qawl ath-thābit), dans la vie d'ici-bas et dans l'Ākhira — et Allaah égare (yuḍillu) les ẓālimūn — et Allaah fait ce qu'Il veut.
- ref: S.14:28
  ar: ۞ أَلَمْ تَرَ إِلَى الَّذِينَ بَدَّلُوا نِعْمَتَ اللَّهِ كُفْرًا وَأَحَلُّوا قَوْمَهُمْ دَارَ الْبَوَارِ
  trl: A-lam tara ila lladhīna baddalū niʿmata llāhi kufran wa-aḥallū qawmahum dāra l-bawār
  trad: N'as-tu pas vu ceux qui ont substitué (baddalū) le niʿma d'Allaah par le kufr, et qui ont installé (aḥallū) leur peuple dans la demeure de la ruine (dāra l-bawār) ?
- ref: S.14:29
  ar: جَهَنَّمَ يَصْلَوْنَهَا ۖ وَبِئْسَ الْقَرَارُ
  trl: Jahannama yaṣlawnahā wa-biʾsa l-qarār
  trad: Jahannam, où ils brûlent (yaṣlawnahā) — quelle détestable stabilité (bi'sa l-qarār) !
- ref: S.14:30
  ar: وَجَعَلُوا لِلَّهِ أَنْدَادًا لِيُضِلُّوا عَنْ سَبِيلِهِ ۗ قُلْ تَمَتَّعُوا فَإِنَّ مَصِيرَكُمْ إِلَى النَّارِ
  trl: Wa-jaʿalū li-llāhi andādan li-yuḍillū ʿan sabīlihi qul tamattaʿū fa-inna maṣīrakum ila n-nār
  trad: 'Et ils ont assigné à Allaah des andād (rivaux), pour égarer loin de Son sabīl. Dis : « Jouissez donc, le temps de cette vie (tamattaʿū) — votre destination (maṣīrakum) est certes vers le Feu. »'
- ref: S.14:31
  ar: قُلْ لِعِبَادِيَ الَّذِينَ آمَنُوا يُقِيمُوا الصَّلَاةَ وَيُنْفِقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً مِنْ قَبْلِ أَنْ يَأْتِيَ يَوْمٌ لَا بَيْعٌ فِيهِ وَلَا خِلَالٌ
  trl: Qul li-ʿibādiya lladhīna āmanū yuqīmū ṣ-ṣalāta wa-yunfiqū mimmā razaqnāhum sirran wa-ʿalāniyatan min qabli an yaʾtiya yawmun lā bayʿun fīhi wa-lā khilāl
  trad: 'Dis à Mes serviteurs (ʿibādī) qui ont cru : qu''ils établissent la ṣalāt, et qu''ils dépensent de ce que Nous leur avons octroyé, en secret (sirran) et ouvertement (ʿalāniyatan), avant que ne vienne un jour où il n''y a ni négoce (bayʿ) ni lien d''amitié (khilāl).'
- ref: S.14:32
  ar: اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَأَنْزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَكُمْ ۖ وَسَخَّرَ لَكُمُ الْفُلْكَ لِتَجْرِيَ فِي الْبَحْرِ بِأَمْرِهِ ۖ وَسَخَّرَ لَكُمُ الْأَنْهَارَ
  trl: Allāhu lladhī khalaqa s-samāwāti wa-l-arḍa wa-anzala mina s-samāʾi māʾan fa-akhraja bihi mina th-thamarāti rizqan lakum wa-sakhkhara lakumu l-fulka li-tajriya fi l-baḥri bi-amrihi wa-sakhkhara lakumu l-anhār
  trad: Allaah, Ce qui a créé les cieux et la terre, et a fait descendre du ciel une eau, par laquelle Il a fait sortir des fruits comme rizq pour vous — et Il a assujetti (sakhkhara) pour vous les vaisseaux (al-fulk), pour qu'ils voguent sur la mer par Son ordre — et Il a assujetti pour vous les fleuves.
- ref: S.14:33
  ar: وَسَخَّرَ لَكُمُ الشَّمْسَ وَالْقَمَرَ دَائِبَيْنِ ۖ وَسَخَّرَ لَكُمُ اللَّيْلَ وَالنَّهَارَ
  trl: Wa-sakhkhara lakumu sh-shamsa wa-l-qamara dāʾibayni wa-sakhkhara lakumu l-layla wa-n-nahār
  trad: Et Il a assujetti pour vous le soleil et la lune, poursuivant sans relâche leur course (dāʾibayni) — et Il a assujetti pour vous la nuit et le jour.
- ref: S.14:34
  ar: وَآتَاكُمْ مِنْ كُلِّ مَا سَأَلْتُمُوهُ ۚ وَإِنْ تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا ۗ إِنَّ الْإِنْسَانَ لَظَلُومٌ كَفَّارٌ
  trl: Wa-ātākum min kulli mā saʾaltumūhu wa-in taʿuddū niʿmata llāhi lā tuḥṣūhā inna l-insāna la-ẓalūmun kaffār
  trad: Et Il vous a donné de tout ce que vous Lui avez demandé. Et si vous comptiez (taʿuddū) le niʿma d'Allaah, vous ne pourriez le dénombrer (lā tuḥṣūhā) — l'humain est certes bien injuste (la-ẓalūmun), bien ingrat (kaffārun).
- ref: S.14:35
  ar: وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَنْ نَعْبُدَ الْأَصْنَامَ
  trl: Wa-idh qāla ibrāhīmu rabbi jʿal hādhā l-balada āminan wa-jnubnī wa-baniyya an naʿbuda l-aṣnām
  trad: 'Et quand Ibrāhīm dit : « Mon Rabb, fais de ce balad un lieu de sécurité (āminan), et écarte-moi (ijnubnī), moi et mes fils, du fait de rendre notre dévotion aux idoles (al-aṣnām). »'
- ref: S.14:36
  ar: رَبِّ إِنَّهُنَّ أَضْلَلْنَ كَثِيرًا مِنَ النَّاسِ ۖ فَمَنْ تَبِعَنِي فَإِنَّهُ مِنِّي ۖ وَمَنْ عَصَانِي فَإِنَّكَ غَفُورٌ رَحِيمٌ
  trl: Rabbi innahunna aḍlalna kathīran mina n-nāsi fa-man tabiʿanī fa-innahu minnī wa-man ʿaṣānī fa-innaka ghafūrun raḥīm
  trad: « Mon Rabb, elles ont égaré (aḍlalna) beaucoup de gens — quiconque me suit (tabiʿanī) est certes des miens (minnī) ; et quiconque me désobéit (ʿaṣānī) — Toi, Tu es certes Ghafūr, Raḥīm. »
- ref: S.14:37
  ar: رَبَّنَا إِنِّي أَسْكَنْتُ مِنْ ذُرِّيَّتِي بِوَادٍ غَيْرِ ذِي زَرْعٍ عِنْدَ بَيْتِكَ الْمُحَرَّمِ رَبَّنَا لِيُقِيمُوا الصَّلَاةَ فَاجْعَلْ أَفْئِدَةً مِنَ النَّاسِ تَهْوِي إِلَيْهِمْ وَارْزُقْهُمْ مِنَ الثَّمَرَاتِ لَعَلَّهُمْ يَشْكُرُونَ
  trl: Rabbanā innī askantu min dhurriyyatī bi-wādin ghayri dhī zarʿin ʿinda baytika l-muḥarrami rabbanā li-yuqīmū ṣ-ṣalāta fa-jʿal afʾidatan mina n-nāsi tahwī ilayhim wa-rzuqhum mina th-thamarāti laʿallahum yashkurūn
  trad: « Notre Rabb, j'ai installé une partie de ma descendance (min dhurriyyatī) dans une vallée dépourvue de culture (bi-wādin ghayri dhī zarʿin), auprès de Ta Maison interdite (ʿinda baytika l-muḥarram) — Notre Rabb, afin qu'ils établissent la ṣalāt. Fais donc que des cœurs (afʾidatan), parmi les gens, s'inclinent vers eux (tahwī ilayhim), et accorde-leur le rizq de fruits — peut-être seront-ils reconnaissants (yashkurūn). »
- ref: S.14:38
  ar: رَبَّنَا إِنَّكَ تَعْلَمُ مَا نُخْفِي وَمَا نُعْلِنُ ۗ وَمَا يَخْفَىٰ عَلَى اللَّهِ مِنْ شَيْءٍ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ
  trl: Rabbanā innaka taʿlamu mā nukhfī wa-mā nuʿlinu wa-mā yakhfā ʿalā llāhi min shayʾin fi l-arḍi wa-lā fi s-samāʾ
  trad: « Notre Rabb, Tu sais certes ce que nous cachons (nukhfī) et ce que nous rendons public (nuʿlinu) » — et rien n'échappe à Allaah (mā yakhfā ʿalā llāhi min shayʾin), ni sur la terre ni dans le ciel.
- ref: S.14:39
  ar: الْحَمْدُ لِلَّهِ الَّذِي وَهَبَ لِي عَلَى الْكِبَرِ إِسْمَاعِيلَ وَإِسْحَاقَ ۚ إِنَّ رَبِّي لَسَمِيعُ الدُّعَاءِ
  trl: Al-ḥamdu li-llāhi lladhī wahaba lī ʿala l-kibari ismāʿīla wa-isḥāqa inna rabbī la-samīʿu d-duʿāʾ
  trad: « Louange à Allaah, Ce qui m'a fait don (wahaba), malgré la vieillesse (ʿalā l-kibar), d'Ismāʿīl et d'Isḥāq — mon Rabb entend certes l'invocation (la-samīʿu d-duʿāʾ). »
- ref: S.14:40
  ar: رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ
  trl: Rabbi jʿalnī muqīma ṣ-ṣalāti wa-min dhurriyyatī rabbanā wa-taqabbal duʿāʾ
  trad: « Mon Rabb, fais de moi celui qui établit la ṣalāt (muqīma ṣ-ṣalāti), et de ma descendance aussi — Notre Rabb, et accepte mon invocation (taqabbal duʿāʾī). »
- ref: S.14:41
  ar: رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ
  trl: Rabbanā ghfir lī wa-li-wālidayya wa-li-l-muʾminīna yawma yaqūmu l-ḥisāb
  trad: « Notre Rabb, pardonne-moi, ainsi qu'à mes deux parents (wa-li-wālidayya) et aux croyants, le jour où se dressera le compte (yawma yaqūmu l-ḥisāb). »
- ref: S.14:42
  ar: وَلَا تَحْسَبَنَّ اللَّهَ غَافِلًا عَمَّا يَعْمَلُ الظَّالِمُونَ ۚ إِنَّمَا يُؤَخِّرُهُمْ لِيَوْمٍ تَشْخَصُ فِيهِ الْأَبْصَارُ
  trl: Wa-lā taḥsabanna llāha ghāfilan ʿammā yaʿmalu ẓ-ẓālimūna innamā yuʾakhkhiruhum li-yawmin tashkhaṣu fīhi l-abṣār
  trad: Et ne pense surtout pas qu'Allaah soit dans l'inattention (ghāfilan) de ce que font les ẓālimūn — Il ne fait que les différer (yuʾakhkhiruhum) jusqu'à un jour où les regards resteront figés (tashkhaṣu fīhi l-abṣār).
- ref: S.14:43
  ar: مُهْطِعِينَ مُقْنِعِي رُءُوسِهِمْ لَا يَرْتَدُّ إِلَيْهِمْ طَرْفُهُمْ ۖ وَأَفْئِدَتُهُمْ هَوَاءٌ
  trl: Muhṭiʿīna muqniʿī ruʾūsihim lā yartaddu ilayhim ṭarfuhum wa-afʾidatuhum hawāʾ
  trad: Courant tête levée (muhṭiʿīna muqniʿī ruʾūsihim), leur regard ne revenant plus vers eux (lā yartaddu ilayhim ṭarfuhum) — et leurs cœurs, comme de l'air (hawāʾ).
- ref: S.14:44
  ar: وَأَنْذِرِ النَّاسَ يَوْمَ يَأْتِيهِمُ الْعَذَابُ فَيَقُولُ الَّذِينَ ظَلَمُوا رَبَّنَا أَخِّرْنَا إِلَىٰ أَجَلٍ قَرِيبٍ نُجِبْ دَعْوَتَكَ وَنَتَّبِعِ الرُّسُلَ ۗ أَوَلَمْ تَكُونُوا أَقْسَمْتُمْ مِنْ قَبْلُ مَا لَكُمْ مِنْ زَوَالٍ
  trl: Wa-andhiri n-nāsa yawma yaʾtīhimu l-ʿadhābu fa-yaqūlu lladhīna ẓalamū rabbanā akhkhirnā ilā ajalin qarībin nujib daʿwataka wa-nattabiʿi r-rusula a-wa-lam takūnū aqsamtum min qablu mā lakum min zawāl
  trad: 'Et avertis les gens du jour où le châtiment leur viendra — ceux qui ont commis l''injustice (ẓalamū) diront : « Notre Rabb, accorde-nous un délai (akhkhirnā) jusqu''à un terme proche — nous répondrons à Ton appel (nujib daʿwataka) et nous suivrons les rusul. » — N''aviez-vous donc pas juré (aqsamtum), auparavant, que vous n''auriez aucun déclin (mā lakum min zawāl) ?'
- ref: S.14:45
  ar: وَسَكَنْتُمْ فِي مَسَاكِنِ الَّذِينَ ظَلَمُوا أَنْفُسَهُمْ وَتَبَيَّنَ لَكُمْ كَيْفَ فَعَلْنَا بِهِمْ وَضَرَبْنَا لَكُمُ الْأَمْثَالَ
  trl: Wa-sakantum fī masākini lladhīna ẓalamū anfusahum wa-tabayyana lakum kayfa faʿalnā bihim wa-ḍarabnā lakumu l-amthāl
  trad: Et vous avez habité (sakantum) les demeures (masākin) de ceux qui se sont fait tort à eux-mêmes (ẓalamū anfusahum), et il vous est devenu manifeste (tabayyana) comment Nous avons agi envers eux — et Nous vous avons proposé les exemples.
- ref: S.14:46
  ar: وَقَدْ مَكَرُوا مَكْرَهُمْ وَعِنْدَ اللَّهِ مَكْرُهُمْ وَإِنْ كَانَ مَكْرُهُمْ لِتَزُولَ مِنْهُ الْجِبَالُ
  trl: Wa-qad makarū makrahum wa-ʿinda llāhi makruhum wa-in kāna makruhum li-tazūla minhu l-jibāl
  trad: Ils ont certes usé de leur manœuvre (makarū makrahum), mais leur manœuvre relève d'Allaah (ʿinda llāhi makruhum — *ʿinda* ne désigne pas ici un lieu) — [même si / quand bien même] leur manœuvre eût été telle que les montagnes en auraient disparu.
- ref: S.14:47
  ar: فَلَا تَحْسَبَنَّ اللَّهَ مُخْلِفَ وَعْدِهِ رُسُلَهُ ۗ إِنَّ اللَّهَ عَزِيزٌ ذُو انْتِقَامٍ
  trl: Fa-lā taḥsabanna llāha mukhlifa waʿdihi rusulahu inna llāha ʿazīzun dhū ntiqām
  trad: Ne pense donc surtout pas qu'Allaah manque à Sa promesse (mukhlifa waʿdihi) envers Ses rusul — Allaah est certes al-ʿAzīz, Détenteur de rétribution (dhū ntiqām).
- ref: S.14:48
  ar: يَوْمَ تُبَدَّلُ الْأَرْضُ غَيْرَ الْأَرْضِ وَالسَّمَاوَاتُ ۖ وَبَرَزُوا لِلَّهِ الْوَاحِدِ الْقَهَّارِ
  trl: Yawma tubaddalu l-arḍu ghayra l-arḍi wa-s-samāwātu wa-barazū li-llāhi l-wāḥidi l-qahhār
  trad: Le jour où la terre sera changée en une autre terre, et les cieux [de même] — et ils comparaîtront devant Allaah, al-Wāḥid (l'Unique), al-Qahhār.
- ref: S.14:49
  ar: وَتَرَى الْمُجْرِمِينَ يَوْمَئِذٍ مُقَرَّنِينَ فِي الْأَصْفَادِ
  trl: Wa-tara l-mujrimīna yawmaʾidhin muqarranīna fi l-aṣfād
  trad: Et tu verras les mujrimūn, ce jour-là, liés ensemble (muqarranīna) dans les chaînes (al-aṣfād).
- ref: S.14:50
  ar: سَرَابِيلُهُمْ مِنْ قَطِرَانٍ وَتَغْشَىٰ وُجُوهَهُمُ النَّارُ
  trl: Sarābīluhum min qaṭirānin wa-taghshā wujūhahumu n-nār
  trad: Leurs vêtements (sarābīluhum) seront de goudron (qaṭirān), et le Feu recouvrira (taghshā) leurs visages.
- ref: S.14:51
  ar: لِيَجْزِيَ اللَّهُ كُلَّ نَفْسٍ مَا كَسَبَتْ ۚ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ
  trl: Li-yajziya llāhu kulla nafsin mā kasabat inna llāha sarīʿu l-ḥisāb
  trad: Afin qu'Allaah rétribue (li-yajziya) chaque âme selon ce qu'elle a acquis (mā kasabat) — Allaah est certes prompt dans le compte (sarīʿu l-ḥisāb).
- ref: S.14:52
  ar: هَٰذَا بَلَاغٌ لِلنَّاسِ وَلِيُنْذَرُوا بِهِ وَلِيَعْلَمُوا أَنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَلِيَذَّكَّرَ أُولُو الْأَلْبَابِ
  trl: Hādhā balāghun li-n-nāsi wa-li-yundharū bihi wa-li-yaʿlamū annamā huwa ilāhun wāḥidun wa-li-yadhdhakkara ulū l-albāb
  trad: Ceci est une communication (balāgh) pour les gens — afin qu'ils en soient avertis, qu'ils sachent qu'Il n'est qu'un ilāh unique (ilāhun wāḥidun), et que se rappellent ceux qui sont dotés d'un noyau d'entendement (ulū l-albāb).
