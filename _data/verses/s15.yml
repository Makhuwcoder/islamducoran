- ref: S.15:1
  ar: الر ۚ تِلْكَ آيَاتُ الْكِتَابِ وَقُرْآنٍ مُبِينٍ
  trl: Alif · Lām · Rāʾ — tilka āyātu l-kitābi wa-qurʾānin mubīn
  trad: Alif, Lām, Rāʾ. Voilà les āyāt du Kitāb, et d'une Lecture (Qurʾān) explicite (mubīn).
- ref: S.15:2
  ar: رُبَمَا يَوَدُّ الَّذِينَ كَفَرُوا لَوْ كَانُوا مُسْلِمِينَ
  trl: Rubbamā yawaddu lladhīna kafarū law kānū muslimīn
  trad: Souvent (rubbamā), ceux qui ont commis le kufr voudront avoir été muslimūn (soumis).
- ref: S.15:3
  ar: ذَرْهُمْ يَأْكُلُوا وَيَتَمَتَّعُوا وَيُلْهِهِمُ الْأَمَلُ ۖ فَسَوْفَ يَعْلَمُونَ
  trl: Dharhum yaʾkulū wa-yatamattaʿū wa-yulhihimu l-amalu fa-sawfa yaʿlamūn
  trad: 'Laisse-les manger et jouir (yatamattaʿū) — que l''espoir (al-amal) les distraie (yulhihim) : ils sauront bientôt (fa-sawfa yaʿlamūn).'
- ref: S.15:4
  ar: وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا وَلَهَا كِتَابٌ مَعْلُومٌ
  trl: Wa-mā ahlaknā min qaryatin illā wa-lahā kitābun maʿlūm
  trad: Et Nous n'avons détruit aucune cité (qarya) sans qu'elle n'ait eu un terme consigné (kitābun maʿlūm).
- ref: S.15:5
  ar: مَا تَسْبِقُ مِنْ أُمَّةٍ أَجَلَهَا وَمَا يَسْتَأْخِرُونَ
  trl: Mā tasbiqu min ummatin ajalahā wa-mā yastaʾkhirūn
  trad: Nulle communauté (umma) ne devance son terme (ajalahā), ni ne le retarde (yastaʾkhirūn).
- ref: S.15:6
  ar: وَقَالُوا يَا أَيُّهَا الَّذِي نُزِّلَ عَلَيْهِ الذِّكْرُ إِنَّكَ لَمَجْنُونٌ
  trl: Wa-qālū yā ayyuhā lladhī nuzzila ʿalayhi dh-dhikru innaka la-majnūn
  trad: 'Et ils dirent : « Ô toi sur qui le Dhikr (le Rappel) a été descendu, tu es certes fou (la-majnūn) ! »'
- ref: S.15:7
  ar: لَوْ مَا تَأْتِينَا بِالْمَلَائِكَةِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ
  trl: Law mā taʾtīnā bi-l-malāʾikati in kunta mina ṣ-ṣādiqīn
  trad: « Que ne nous amènes-tu pas les malāʾika, si tu es du nombre des véridiques (aṣ-ṣādiqīn) ! »
- ref: S.15:8
  ar: مَا نُنَزِّلُ الْمَلَائِكَةَ إِلَّا بِالْحَقِّ وَمَا كَانُوا إِذًا مُنْظَرِينَ
  trl: Mā nunazzilu l-malāʾikata illā bi-l-ḥaqqi wa-mā kānū idhan munẓarīn
  trad: Nous ne faisons descendre les malāʾika qu'avec le ḥaqq — et alors, ils n'auraient plus de délai (munẓarīn).
- ref: S.15:9
  ar: إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ
  trl: Innā naḥnu nazzalnā dh-dhikra wa-innā lahu la-ḥāfiẓūn
  trad: C'est Nous qui avons fait descendre le Dhikr, et c'est Nous qui en sommes les gardiens (la-ḥāfiẓūn).
- ref: S.15:10
  ar: وَلَقَدْ أَرْسَلْنَا مِنْ قَبْلِكَ فِي شِيَعِ الْأَوَّلِينَ
  trl: Wa-laqad arsalnā min qablika fī shiyaʿi l-awwalīn
  trad: Et Nous avons certes envoyé, avant toi, [des rusul] parmi les factions (shiyaʿ) des anciens (al-awwalīn).
- ref: S.15:11
  ar: وَمَا يَأْتِيهِمْ مِنْ رَسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ
  trl: Wa-mā yaʾtīhim min rasūlin illā kānū bihi yastahziʾūn
  trad: Et il ne leur venait aucun rasūl sans qu'ils ne s'en moquent (yastahziʾūn).
- ref: S.15:12
  ar: كَذَٰلِكَ نَسْلُكُهُ فِي قُلُوبِ الْمُجْرِمِينَ
  trl: Kadhālika naslukuhu fī qulūbi l-mujrimīn
  trad: C'est ainsi que Nous le faisons pénétrer (naslukuhu) dans les cœurs des mujrimūn (des artisans de faute).
- ref: S.15:13
  ar: لَا يُؤْمِنُونَ بِهِ ۖ وَقَدْ خَلَتْ سُنَّةُ الْأَوَّلِينَ
  trl: Lā yuʾminūna bihi wa-qad khalat sunnatu l-awwalīn
  trad: Ils n'y croient pas — alors que ce qui s'est établi comme voie constante pour les peuples qui ont précédé (sunnatu l-awwalīn) est déjà passé.
- ref: S.15:14
  ar: وَلَوْ فَتَحْنَا عَلَيْهِمْ بَابًا مِنَ السَّمَاءِ فَظَلُّوا فِيهِ يَعْرُجُونَ
  trl: Wa-law fataḥnā ʿalayhim bāban mina s-samāʾi fa-ẓallū fīhi yaʿrujūn
  trad: Et même si Nous ouvrions sur eux une porte du ciel, par laquelle ils continueraient d'y monter (yaʿrujūn),
- ref: S.15:15
  ar: لَقَالُوا إِنَّمَا سُكِّرَتْ أَبْصَارُنَا بَلْ نَحْنُ قَوْمٌ مَسْحُورُونَ
  trl: La-qālū innamā sukkirat abṣārunā bal naḥnu qawmun masḥūrūn
  trad: 'ils diraient certes : « Ce ne sont que nos regards qui ont été enivrés (sukkirat) — bien plus, nous sommes un peuple ensorcelé (masḥūrūn). »'
- ref: S.15:16
  ar: وَلَقَدْ جَعَلْنَا فِي السَّمَاءِ بُرُوجًا وَزَيَّنَّاهَا لِلنَّاظِرِينَ
  trl: Wa-laqad jaʿalnā fi s-samāʾi burūjan wa-zayyannāhā li-n-nāẓirīn
  trad: Et Nous avons certes placé, dans le ciel, des constellations (burūj), et Nous l'avons paré (zayyannāhā) pour ceux qui regardent (li-n-nāẓirīn).
- ref: S.15:17
  ar: وَحَفِظْنَاهَا مِنْ كُلِّ شَيْطَانٍ رَجِيمٍ
  trl: Wa-ḥafiẓnāhā min kulli shayṭānin rajīm
  trad: Et Nous l'avons préservé (ḥafiẓnāhā) de tout shayṭān banni (rajīm).
- ref: S.15:18
  ar: إِلَّا مَنِ اسْتَرَقَ السَّمْعَ فَأَتْبَعَهُ شِهَابٌ مُبِينٌ
  trl: Illā mani staraqa s-samʿa fa-atbaʿahu shihābun mubīn
  trad: sauf celui qui dérobe l'écoute (istaraqa s-samʿ) — un projectile manifeste (shihābun mubīn) le poursuit alors (fa-atbaʿahu).
- ref: S.15:19
  ar: وَالْأَرْضَ مَدَدْنَاهَا وَأَلْقَيْنَا فِيهَا رَوَاسِيَ وَأَنْبَتْنَا فِيهَا مِنْ كُلِّ شَيْءٍ مَوْزُونٍ
  trl: Wa-l-arḍa madadnāhā wa-alqaynā fīhā rawāsiya wa-anbatnā fīhā min kulli shayʾin mawzūn
  trad: Et la terre, Nous l'avons étendue (madadnāhā), et Nous y avons placé des ancrages fermes (rawāsiya), et Nous y avons fait pousser (anbatnā) de toute chose selon une mesure (mawzūn).
- ref: S.15:20
  ar: وَجَعَلْنَا لَكُمْ فِيهَا مَعَايِشَ وَمَنْ لَسْتُمْ لَهُ بِرَازِقِينَ
  trl: Wa-jaʿalnā lakum fīhā maʿāyisha wa-man lastum lahu bi-rāziqīn
  trad: Et Nous y avons placé pour vous des subsistances (maʿāyish), ainsi que pour ce dont vous n'êtes pas les pourvoyeurs (rāziqīn).
- ref: S.15:21
  ar: وَإِنْ مِنْ شَيْءٍ إِلَّا عِنْدَنَا خَزَائِنُهُ وَمَا نُنَزِّلُهُ إِلَّا بِقَدَرٍ مَعْلُومٍ
  trl: Wa-in min shayʾin illā ʿindanā khazāʾinuhu wa-mā nunazziluhu illā bi-qadarin maʿlūm
  trad: Et il n'est rien dont Nous n'ayons, auprès de Nous, les trésors (khazāʾinuhu) — et Nous ne le faisons descendre que selon une mesure connue (bi-qadarin maʿlūm).
- ref: S.15:22
  ar: وَأَرْسَلْنَا الرِّيَاحَ لَوَاقِحَ فَأَنْزَلْنَا مِنَ السَّمَاءِ مَاءً فَأَسْقَيْنَاكُمُوهُ وَمَا أَنْتُمْ لَهُ بِخَازِنِينَ
  trl: Wa-arsalnā r-riyāḥa lawāqiḥa fa-anzalnā mina s-samāʾi māʾan fa-asqaynākumūhu wa-mā antum lahu bi-khāzinīn
  trad: Et Nous avons envoyé les vents fécondants (riyāḥan lawāqiḥ), puis Nous avons fait descendre du ciel une eau, par laquelle Nous vous avons abreuvés (asqaynākumūhu) — et vous n'en êtes pas les dépositaires (khāzinīn).
- ref: S.15:23
  ar: وَإِنَّا لَنَحْنُ نُحْيِي وَنُمِيتُ وَنَحْنُ الْوَارِثُونَ
  trl: Wa-innā la-naḥnu nuḥyī wa-numītu wa-naḥnu l-wārithūn
  trad: Et c'est Nous, certes, qui faisons vivre (nuḥyī) et qui faisons mourir (numītu) — et c'est Nous qui sommes les héritiers (al-wārithūn).
- ref: S.15:24
  ar: وَلَقَدْ عَلِمْنَا الْمُسْتَقْدِمِينَ مِنْكُمْ وَلَقَدْ عَلِمْنَا الْمُسْتَأْخِرِينَ
  trl: Wa-laqad ʿalimnā l-mustaqdimīna minkum wa-laqad ʿalimnā l-mustaʾkhirīn
  trad: Et Nous connaissons certes ceux d'entre vous qui devancent (al-mustaqdimīn), et Nous connaissons certes ceux qui retardent (al-mustaʾkhirīn).
- ref: S.15:25
  ar: وَإِنَّ رَبَّكَ هُوَ يَحْشُرُهُمْ ۚ إِنَّهُ حَكِيمٌ عَلِيمٌ
  trl: Wa-inna rabbaka huwa yaḥshuruhum innahu ḥakīmun ʿalīm
  trad: Et ton Rabb, c'est Lui qui les rassemblera (yaḥshuruhum) — Il est certes Ḥakīm, ʿAlīm.
- ref: S.15:26
  ar: وَلَقَدْ خَلَقْنَا الْإِنْسَانَ مِنْ صَلْصَالٍ مِنْ حَمَإٍ مَسْنُونٍ
  trl: Wa-la-qad khalaqnā l-insāna min ṣalṣālin min ḥamaʾin masnūn
  trad: Et Nous avons certes créé l'humain (al-insān) à partir d'une argile sonore (ṣalṣāl), [elle-même issue] d'une boue sombre et changée (ḥamaʾin masnūn).
- ref: S.15:27
  ar: وَالْجَانَّ خَلَقْنَاهُ مِنْ قَبْلُ مِنْ نَارِ السَّمُومِ
  trl: Wa-l-jānna khalaqnāhu min qablu min nāri s-samūm
  trad: Et le jānn (al-jānn), Nous l'avons créé auparavant (min qablu), à partir du feu du samūm (nāri s-samūm).
- ref: S.15:28
  ar: وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي خَالِقٌ بَشَرًا مِنْ صَلْصَالٍ مِنْ حَمَإٍ مَسْنُونٍ
  trl: Wa-idh qāla rabbuka li-l-malāʾikati innī khāliqun basharan min ṣalṣālin min ḥamaʾin masnūn
  trad: 'Et quand ton Rabb dit aux malāʾika : « Je vais créer (khāliqun) un être humain (bashar), à partir d''une argile sonore, [elle-même issue] d''une boue sombre et changée —'
- ref: S.15:29
  ar: فَإِذَا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ
  trl: Fa-idhā sawwaytuhu wa-nafakhtu fīhi min rūḥī fa-qaʿū lahu sājidīn
  trad: — quand Je l'aurai mis en forme achevée (sawwaytuhu) et que J'aurai insufflé en lui de Mon rūḥ (min rūḥī), tombez alors devant lui, prosternés (sājidīn). »
- ref: S.15:30
  ar: فَسَجَدَ الْمَلَائِكَةُ كُلُّهُمْ أَجْمَعُونَ
  trl: Fa-sajada l-malāʾikatu kulluhum ajmaʿūn
  trad: Les malāʾika se prosternèrent alors, tous ensemble, sans exception (kulluhum ajmaʿūn).
- ref: S.15:31
  ar: إِلَّا إِبْلِيسَ أَبَىٰ أَنْ يَكُونَ مَعَ السَّاجِدِينَ
  trl: Illā iblīsa abā an yakūna maʿa s-sājidīn
  trad: 'sauf Iblīs : il refusa (abā) d''être parmi ceux qui se prosternent.'
- ref: S.15:32
  ar: قَالَ يَا إِبْلِيسُ مَا لَكَ أَلَّا تَكُونَ مَعَ السَّاجِدِينَ
  trl: Qāla yā iblīsu mā laka allā takūna maʿa s-sājidīn
  trad: 'Il dit : « Ô Iblīs, qu''as-tu à ne pas être parmi ceux qui se prosternent ? »'
- ref: S.15:33
  ar: قَالَ لَمْ أَكُنْ لِأَسْجُدَ لِبَشَرٍ خَلَقْتَهُ مِنْ صَلْصَالٍ مِنْ حَمَإٍ مَسْنُونٍ
  trl: Qāla lam akun li-asjuda li-basharin khalaqtahu min ṣalṣālin min ḥamaʾin masnūn
  trad: 'Il dit : « Il ne m''appartient pas (lam akun) de me prosterner devant un être humain que Tu as créé à partir d''une argile sonore, [elle-même issue] d''une boue sombre et changée. »'
- ref: S.15:34
  ar: قَالَ فَاخْرُجْ مِنْهَا فَإِنَّكَ رَجِيمٌ
  trl: Qāla fa-khruj minhā fa-innaka rajīm
  trad: 'Il dit : « Sors-en donc (fa-khruj minhā) — tu es certes banni (rajīm). »'
- ref: S.15:35
  ar: وَإِنَّ عَلَيْكَ اللَّعْنَةَ إِلَىٰ يَوْمِ الدِّينِ
  trl: Wa-inna ʿalayka l-laʿnata ilā yawmi d-dīn
  trad: Et sur toi pèse la malédiction (al-laʿnata), jusqu'au jour de la rétribution (yawm ad-dīn).
- ref: S.15:36
  ar: قَالَ رَبِّ فَأَنْظِرْنِي إِلَىٰ يَوْمِ يُبْعَثُونَ
  trl: Qāla rabbi fa-anẓirnī ilā yawmi yubʿathūn
  trad: 'Il dit : « Mon Rabb, accorde-moi alors un délai (fa-anẓirnī) jusqu''au jour où ils seront ressuscités (yubʿathūn). »'
- ref: S.15:37
  ar: قَالَ فَإِنَّكَ مِنَ الْمُنْظَرِينَ
  trl: Qāla fa-innaka mina l-munẓarīn
  trad: 'Il dit : « Tu es certes de ceux à qui un délai est accordé (al-munẓarīn). »'
- ref: S.15:38
  ar: إِلَىٰ يَوْمِ الْوَقْتِ الْمَعْلُومِ
  trl: Ilā yawmi l-waqti l-maʿlūm
  trad: « — jusqu'au jour du moment connu (al-waqt al-maʿlūm). »
- ref: S.15:39
  ar: قَالَ رَبِّ بِمَا أَغْوَيْتَنِي لَأُزَيِّنَنَّ لَهُمْ فِي الْأَرْضِ وَلَأُغْوِيَنَّهُمْ أَجْمَعِينَ
  trl: Qāla rabbi bimā aghwaytanī la-uzayyinanna lahum fi l-arḍi wa-la-ughwiyannahum ajmaʿīn
  trad: 'Il dit : « Mon Rabb, puisque Tu m''as égaré (bimā aghwaytanī), je parerai certes pour eux, sur terre, [ce qui séduit] (la-uzayyinanna), et je les égarerai (la-ughwiyannahum) certes tous, sans exception. »'
- ref: S.15:40
  ar: إِلَّا عِبَادَكَ مِنْهُمُ الْمُخْلَصِينَ
  trl: Illā ʿibādaka minhumu l-mukhlaṣīn
  trad: « — sauf, parmi eux, Tes serviteurs rendus purs (al-mukhlaṣīn). »
- ref: S.15:41
  ar: قَالَ هَٰذَا صِرَاطٌ عَلَيَّ مُسْتَقِيمٌ
  trl: Qāla hādhā ṣirāṭun ʿalayya mustaqīm
  trad: 'Il dit : « Cela M''incombe (ʿalayya) — un engagement (ṣirāṭ) tenu droit (mustaqīm). »'
- ref: S.15:42
  ar: إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ إِلَّا مَنِ اتَّبَعَكَ مِنَ الْغَاوِينَ
  trl: Inna ʿibādī laysa laka ʿalayhim sulṭānun illā mani ttabaʿaka mina l-ghāwīn
  trad: « Mes serviteurs (ʿibādī) — tu n'as sur eux aucune emprise (sulṭān), sauf qui te suivra parmi les égarés (al-ghāwīn). »
- ref: S.15:43
  ar: وَإِنَّ جَهَنَّمَ لَمَوْعِدُهُمْ أَجْمَعِينَ
  trl: Wa-inna jahannama la-mawʿiduhum ajmaʿīn
  trad: Et jahannam est certes le rendez-vous fixé (mawʿid) pour eux tous, sans exception.
- ref: S.15:44
  ar: لَهَا سَبْعَةُ أَبْوَابٍ لِكُلِّ بَابٍ مِنْهُمْ جُزْءٌ مَقْسُومٌ
  trl: Lahā sabʿatu abwābin li-kulli bābin minhum juzʾun maqsūm
  trad: Elle a sept portes (sabʿatu abwāb) ; à chaque porte revient, d'entre eux, une part déterminée (juzʾun maqsūm).
- ref: S.15:45
  ar: إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَعُيُونٍ
  trl: Inna l-muttaqīna fī jannātin wa-ʿuyūn
  trad: Les muttaqīn seront certes au sein de jardins (jannāt) et de sources (ʿuyūn).
- ref: S.15:46
  ar: ادْخُلُوهَا بِسَلَامٍ آمِنِينَ
  trl: Udkhulūhā bi-salāmin āminīn
  trad: « Entrez-y en paix (bi-salām), en sécurité (āminīn). »
- ref: S.15:47
  ar: وَنَزَعْنَا مَا فِي صُدُورِهِمْ مِنْ غِلٍّ إِخْوَانًا عَلَىٰ سُرُرٍ مُتَقَابِلِينَ
  trl: Wa-nazaʿnā mā fī ṣudūrihim min ghillin ikhwānan ʿalā sururin mutaqābilīn
  trad: Et Nous aurons arraché (nazaʿnā) de leurs poitrines toute rancœur latente (ghill) — [ils seront] frères, sur des lits d'apparat (surur), se faisant face (mutaqābilīn).
- ref: S.15:48
  ar: لَا يَمَسُّهُمْ فِيهَا نَصَبٌ وَمَا هُمْ مِنْهَا بِمُخْرَجِينَ
  trl: Lā yamassuhum fīhā naṣabun wa-mā hum minhā bi-mukhrajīn
  trad: Nulle fatigue (naṣab) ne les y touchera, et ils n'en seront jamais expulsés (mukhrajīn).
- ref: S.15:49
  ar: ۞ نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ
  trl: Nabbiʾ ʿibādī annī ana l-ghafūru r-raḥīm
  trad: Informe (nabbiʾ) Mes ʿibād que c'est Moi, Moi al-Ghafūr, ar-Raḥīm —
- ref: S.15:50
  ar: وَأَنَّ عَذَابِي هُوَ الْعَذَابُ الْأَلِيمُ
  trl: Wa-anna ʿadhābī huwa l-ʿadhābu l-alīm
  trad: — et que Mon châtiment (ʿadhābī) est le châtiment douloureux (al-alīm).
- ref: S.15:51
  ar: وَنَبِّئْهُمْ عَنْ ضَيْفِ إِبْرَاهِيمَ
  trl: Wa-nabbiʾhum ʿan ḍayfi ibrāhīm
  trad: Et informe-les au sujet des hôtes (ḍayf) d'Ibrāhīm.
- ref: S.15:52
  ar: إِذْ دَخَلُوا عَلَيْهِ فَقَالُوا سَلَامًا قَالَ إِنَّا مِنْكُمْ وَجِلُونَ
  trl: Idh dakhalū ʿalayhi fa-qālū salāman qāla innā minkum wajilūn
  trad: 'Quand ils entrèrent chez lui et dirent : « Paix (salāman) » — il dit : « Nous sommes, envers vous, saisis d''appréhension (wajilūn). »'
- ref: S.15:53
  ar: قَالُوا لَا تَوْجَلْ إِنَّا نُبَشِّرُكَ بِغُلَامٍ عَلِيمٍ
  trl: Qālū lā tawjal innā nubashshiruka bi-ghulāmin ʿalīm
  trad: 'Ils dirent : « Ne sois pas saisi d''appréhension (lā tawjal) — nous t''annonçons une heureuse nouvelle (nubashshiruka) : un garçon (ghulām) empreint de science (ʿalīm). »'
- ref: S.15:54
  ar: قَالَ أَبَشَّرْتُمُونِي عَلَىٰ أَنْ مَسَّنِيَ الْكِبَرُ فَبِمَ تُبَشِّرُونَ
  trl: Qāla a-bashshartumūnī ʿalā an massaniya l-kibaru fa-bima tubashshirūn
  trad: 'Il dit : « M''annoncez-vous cela alors même que la vieillesse (al-kibar) m''a atteint (massaniya) ? De quoi donc m''annoncez-vous (tubashshirūn) ? »'
- ref: S.15:55
  ar: قَالُوا بَشَّرْنَاكَ بِالْحَقِّ فَلَا تَكُنْ مِنَ الْقَانِطِينَ
  trl: Qālū bashsharnāka bi-l-ḥaqqi fa-lā takun mina l-qāniṭīn
  trad: 'Ils dirent : « Nous t''avons annoncé cela avec le ḥaqq — ne sois donc pas de ceux qui désespèrent totalement (al-qāniṭīn). »'
- ref: S.15:56
  ar: قَالَ وَمَنْ يَقْنَطُ مِنْ رَحْمَةِ رَبِّهِ إِلَّا الضَّالُّونَ
  trl: Qāla wa-man yaqnaṭu min raḥmati rabbihi illā ḍ-ḍāllūn
  trad: 'Il dit : « Et qui désespère totalement (yaqnaṭu) de la raḥma de son Rabb, sinon les égarés (aḍ-ḍāllūn) ? »'
- ref: S.15:57
  ar: قَالَ فَمَا خَطْبُكُمْ أَيُّهَا الْمُرْسَلُونَ
  trl: Qāla fa-mā khaṭbukum ayyuhā l-mursalūn
  trad: 'Il dit : « Quelle est donc votre affaire (khaṭbukum), ô les envoyés (al-mursalūn) ? »'
- ref: S.15:58
  ar: قَالُوا إِنَّا أُرْسِلْنَا إِلَىٰ قَوْمٍ مُجْرِمِينَ
  trl: Qālū innā ursilnā ilā qawmin mujrimīn
  trad: 'Ils dirent : « Nous avons été envoyés vers un peuple d''artisans de faute (mujrimīn). »'
- ref: S.15:59
  ar: إِلَّا آلَ لُوطٍ إِنَّا لَمُنَجُّوهُمْ أَجْمَعِينَ
  trl: Illā āla lūṭin innā la-munajjūhum ajmaʿīn
  trad: '« — sauf la famille de Lūṭ (āl Lūṭ) : nous les sauverons (munajjūhum) tous, sans exception. »'
- ref: S.15:60
  ar: إِلَّا امْرَأَتَهُ قَدَّرْنَا ۙ إِنَّهَا لَمِنَ الْغَابِرِينَ
  trl: Illā mraʾatahu qaddarnā innahā la-mina l-ghābirīn
  trad: '« — sauf son épouse : Nous avons décrété (qaddarnā) qu''elle serait certes du nombre de ceux qui restent en arrière (al-ghābirīn). »'
- ref: S.15:61
  ar: فَلَمَّا جَاءَ آلَ لُوطٍ الْمُرْسَلُونَ
  trl: Fa-lammā jāʾa āla lūṭin il-mursalūn
  trad: Puis, lorsque les envoyés (al-mursalūn) vinrent à la famille de Lūṭ,
- ref: S.15:62
  ar: قَالَ إِنَّكُمْ قَوْمٌ مُنْكَرُونَ
  trl: Qāla innakum qawmun munkarūn
  trad: 'il dit : « Vous êtes certes des gens que je ne reconnais pas (munkarūn). »'
- ref: S.15:63
  ar: قَالُوا بَلْ جِئْنَاكَ بِمَا كَانُوا فِيهِ يَمْتَرُونَ
  trl: Qālū bal jiʾnāka bimā kānū fīhi yamtarūn
  trad: 'Ils dirent : « Nous t''apportons plutôt ce en quoi ils doutaient (yamtarūn). »'
- ref: S.15:64
  ar: وَأَتَيْنَاكَ بِالْحَقِّ وَإِنَّا لَصَادِقُونَ
  trl: Wa-ataynāka bi-l-ḥaqqi wa-innā la-ṣādiqūn
  trad: Et nous t'avons apporté le ḥaqq — nous sommes certes véridiques (ṣādiqūn).
- ref: S.15:65
  ar: فَأَسْرِ بِأَهْلِكَ بِقِطْعٍ مِنَ اللَّيْلِ وَاتَّبِعْ أَدْبَارَهُمْ وَلَا يَلْتَفِتْ مِنْكُمْ أَحَدٌ وَامْضُوا حَيْثُ تُؤْمَرُونَ
  trl: Fa-asri bi-ahlika bi-qiṭʿin mina l-layli wa-ttabiʿ adbārahum wa-lā yaltafit minkum aḥadun wa-mḍū ḥaythu tuʾmarūn
  trad: Pars donc avec ta famille (bi-ahlika) durant une partie (qiṭʿ) de la nuit, marche à leur suite, derrière eux (wa-ttabiʿ adbārahum), et que nul d'entre vous ne se retourne (lā yaltafit) — et allez (imḍū) là où il vous est ordonné (ḥaythu tuʾmarūn).
- ref: S.15:66
  ar: وَقَضَيْنَا إِلَيْهِ ذَٰلِكَ الْأَمْرَ أَنَّ دَابِرَ هَٰؤُلَاءِ مَقْطُوعٌ مُصْبِحِينَ
  trl: Wa-qaḍaynā ilayhi dhālika l-amra anna dābira hāʾulāʾi maqṭūʿun muṣbiḥīn
  trad: 'Et Nous lui avons communiqué (qaḍaynā ilayhi) cet ordre : que le dernier vestige (dābir) de ceux-là serait retranché (maqṭūʿ) — au matin venu (muṣbiḥīn).'
- ref: S.15:67
  ar: وَجَاءَ أَهْلُ الْمَدِينَةِ يَسْتَبْشِرُونَ
  trl: Wa-jāʾa ahlu l-madīnati yastabshirūn
  trad: Et les habitants de la cité (ahl al-madīna) vinrent, exultant de la nouvelle (yastabshirūn).
- ref: S.15:68
  ar: قَالَ إِنَّ هَٰؤُلَاءِ ضَيْفِي فَلَا تَفْضَحُونِ
  trl: Qāla inna hāʾulāʾi ḍayfī fa-lā tafḍaḥūni
  trad: 'Il dit : « Ce sont là mes hôtes (ḍayfī) — ne me couvrez donc pas de honte (lā tafḍaḥūni). »'
- ref: S.15:69
  ar: وَاتَّقُوا اللَّهَ وَلَا تُخْزُونِ
  trl: Wa-ttaqu llāha wa-lā tukhzūni
  trad: Et constituez-vous une taqwā d'Allaah, et ne m'humiliez pas (lā tukhzūni).
- ref: S.15:70
  ar: قَالُوا أَوَلَمْ نَنْهَكَ عَنِ الْعَالَمِينَ
  trl: Qālū a-wa-lam nanhaka ʿani l-ʿālamīn
  trad: 'Ils dirent : « Ne t''avions-nous pas interdit [de recevoir] qui que ce soit, venu du dehors ? »'
- ref: S.15:71
  ar: قَالَ هَٰؤُلَاءِ بَنَاتِي إِنْ كُنْتُمْ فَاعِلِينَ
  trl: Qāla hāʾulāʾi banātī in kuntum fāʿilīn
  trad: 'Il dit : « Voici mes filles (banātī), si vous voulez agir [ainsi] (in kuntum fāʿilīn). »'
- ref: S.15:72
  ar: لَعَمْرُكَ إِنَّهُمْ لَفِي سَكْرَتِهِمْ يَعْمَهُونَ
  trl: La-ʿamruka innahum la-fī sakratihim yaʿmahūn
  trad: Par ta vie (la-ʿamruka) — ils sont certes plongés dans leur ivresse (sakratihim), à errer en aveugles (yaʿmahūn).
- ref: S.15:73
  ar: فَأَخَذَتْهُمُ الصَّيْحَةُ مُشْرِقِينَ
  trl: Fa-akhadhathumu ṣ-ṣayḥatu mushriqīn
  trad: Alors le Cri (aṣ-ṣayḥa) les saisit, au lever du jour (mushriqīn).
- ref: S.15:74
  ar: فَجَعَلْنَا عَالِيَهَا سَافِلَهَا وَأَمْطَرْنَا عَلَيْهِمْ حِجَارَةً مِنْ سِجِّيلٍ
  trl: Fa-jaʿalnā ʿāliyahā sāfilahā wa-amṭarnā ʿalayhim ḥijāratan min sijjīl
  trad: Et Nous fîmes de son sommet son tréfonds (jaʿalnā ʿāliyahā sāfilahā), et Nous fîmes pleuvoir sur eux des pierres de sijjīl (ḥijāratan min sijjīl).
- ref: S.15:75
  ar: إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِلْمُتَوَسِّمِينَ
  trl: Inna fī dhālika la-āyātin li-l-mutawassimīn
  trad: Il y a certes là des signes (āyāt) pour ceux qui savent discerner par les traces (al-mutawassimīn).
- ref: S.15:76
  ar: وَإِنَّهَا لَبِسَبِيلٍ مُقِيمٍ
  trl: Wa-innahā la-bi-sabīlin muqīm
  trad: Et elle est certes sur un chemin qui subsiste (bi-sabīlin muqīm).
- ref: S.15:77
  ar: إِنَّ فِي ذَٰلِكَ لَآيَةً لِلْمُؤْمِنِينَ
  trl: Inna fī dhālika la-āyatan li-l-muʾminīn
  trad: Il y a certes là un signe (āya) pour les muʾminīn.
- ref: S.15:78–79
  ar: وَإِنْ كَانَ أَصْحَابُ الْأَيْكَةِ لَظَالِمِينَ ۝ فَانْتَقَمْنَا مِنْهُمْ وَإِنَّهُمَا لَبِإِمَامٍ مُبِينٍ
  trl: Wa-in kāna aṣḥābu l-aykati la-ẓālimīn · fa-ntaqamnā minhum wa-innahumā la-bi-imāmin mubīn
  trad: Et les gens du Fourré (aṣḥāb al-Aykah) étaient certes injustes (ẓālimīn) — Nous avons donc exercé la rétribution contre eux (intaqamnā minhum) ; et les deux [cités ruinées] sont certes sur un chemin clairement tracé (imāmin mubīn).
- ref: S.15:80
  ar: وَلَقَدْ كَذَّبَ أَصْحَابُ الْحِجْرِ الْمُرْسَلِينَ
  trl: Wa-la-qad kadhdhaba aṣḥābu l-ḥijri l-mursalīn
  trad: Et les gens d'al-Ḥijr ont certes traité de menteurs (kadhdhaba) les envoyés (al-mursalīn).
- ref: S.15:81
  ar: وَآتَيْنَاهُمْ آيَاتِنَا فَكَانُوا عَنْهَا مُعْرِضِينَ
  trl: Wa-ātaynāhum āyātinā fa-kānū ʿanhā muʿriḍīn
  trad: Et Nous leur avons donné Nos āyāt (signes) — mais ils s'en détournaient (muʿriḍīn).
- ref: S.15:82
  ar: وَكَانُوا يَنْحِتُونَ مِنَ الْجِبَالِ بُيُوتًا آمِنِينَ
  trl: Wa-kānū yanḥitūna mina l-jibāli buyūtan āminīn
  trad: Et ils taillaient (yanḥitūna), dans les montagnes, des demeures — en toute sécurité (āminīn).
- ref: S.15:83
  ar: فَأَخَذَتْهُمُ الصَّيْحَةُ مُصْبِحِينَ
  trl: Fa-akhadhat-humu ṣ-ṣayḥatu muṣbiḥīn
  trad: Alors le Cri (aṣ-ṣayḥa) les saisit, au matin (muṣbiḥīn).
- ref: S.15:84
  ar: فَمَا أَغْنَىٰ عَنْهُمْ مَا كَانُوا يَكْسِبُونَ
  trl: Fa-mā aghnā ʿanhum mā kānū yaksibūn
  trad: Et ce qu'ils avaient acquis (yaksibūn) ne leur fut d'aucune utilité (mā aghnā ʿanhum).
- ref: S.15:85
  ar: وَمَا خَلَقْنَا السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا إِلَّا بِالْحَقِّ ۗ وَإِنَّ السَّاعَةَ لَآتِيَةٌ ۖ فَاصْفَحِ الصَّفْحَ الْجَمِيلَ
  trl: Wa-mā khalaqnā s-samāwāti wa-l-arḍa wa-mā baynahumā illā bi-l-ḥaqq — wa-inna s-sāʿata la-ātiyatun — fa-ṣfaḥi ṣ-ṣafḥa l-jamīl
  trad: Et Nous n'avons créé les cieux et la terre, et ce qui est entre eux, que par le ḥaqq — et l'Heure (as-sāʿa) vient très certainement — accorde donc un détournement empreint de beauté (aṣ-ṣafḥa l-jamīl).
- ref: S.15:86
  ar: إِنَّ رَبَّكَ هُوَ الْخَلَّاقُ الْعَلِيمُ
  trl: Inna rabbaka huwa l-khallāqu l-ʿalīm
  trad: Ton Rabb — Il est certes al-Khallāq, al-ʿAlīm.
- ref: S.15:87
  ar: وَلَقَدْ آتَيْنَاكَ سَبْعًا مِنَ الْمَثَانِي وَالْقُرْآنَ الْعَظِيمَ
  trl: Wa-la-qad ātaynāka sabʿan mina l-mathānī wa-l-qurʾāna l-ʿaẓīm
  trad: Et Nous t'avons certes donné sept [versets] de ce qui se répète (mathānī), et le Qurʾān immense (al-ʿaẓīm).
- ref: S.15:88
  ar: لَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِنْهُمْ وَلَا تَحْزَنْ عَلَيْهِمْ وَاخْفِضْ جَنَاحَكَ لِلْمُؤْمِنِينَ
  trl: Lā tamuddanna ʿaynayka ilā mā mattaʿnā bihi azwājan minhum wa-lā taḥzan ʿalayhim wa-khfiḍ janāḥaka li-l-muʾminīn
  trad: Ne tends pas tes deux yeux vers ce dont Nous avons pourvu, en jouissance, certaines catégories parmi eux (azwājan minhum) — ne t'afflige pas à leur sujet — et abaisse ton aile pour les croyants.
- ref: S.15:89
  ar: وَقُلْ إِنِّي أَنَا النَّذِيرُ الْمُبِينُ
  trl: Wa-qul innī ana n-nadhīru l-mubīn
  trad: 'Et dis : « Je suis, moi, l''avertisseur (an-nadhīr) manifeste (al-mubīn). »'
- ref: S.15:90–91
  ar: كَمَا أَنْزَلْنَا عَلَى الْمُقْتَسِمِينَ ۝ الَّذِينَ جَعَلُوا الْقُرْآنَ عِضِينَ
  trl: Ka-mā anzalnā ʿalā l-muqtasimīn · alladhīna jaʿalū l-qurʾāna ʿiḍīn
  trad: Comme Nous avons fait descendre [Notre parole] sur ceux qui se la sont partagée entre eux (al-muqtasimīn) — ceux qui ont fait du Qurʾān des parts séparées (ʿiḍīn).
- ref: S.15:92–93
  ar: فَوَرَبِّكَ لَنَسْأَلَنَّهُمْ أَجْمَعِينَ ۝ عَمَّا كَانُوا يَعْمَلُونَ
  trl: Fa-wa-rabbika la-nasʾalannahum ajmaʿīn · ʿammā kānū yaʿmalūn
  trad: Par ton Rabb — Nous les interrogerons très certainement, tous ensemble (ajmaʿīn), sur ce qu'ils faisaient.
- ref: S.15:94
  ar: فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ
  trl: Fa-ṣdaʿ bimā tuʾmaru wa-aʿriḍ ʿani l-mushrikīn
  trad: Proclame donc ouvertement (iṣdaʿ) ce qui t'est ordonné — et détourne-toi des associateurs (al-mushrikīn).
- ref: S.15:95
  ar: إِنَّا كَفَيْنَاكَ الْمُسْتَهْزِئِينَ
  trl: Innā kafaynāka l-mustahziʾīn
  trad: Nous t'avons certes suffi (kafaynāka) contre les moqueurs (al-mustahziʾīn).
- ref: S.15:96
  ar: الَّذِينَ يَجْعَلُونَ مَعَ اللَّهِ إِلَٰهًا آخَرَ ۚ فَسَوْفَ يَعْلَمُونَ
  trl: Alladhīna yajʿalūna maʿa llāhi ilāhan ākhar — fa-sawfa yaʿlamūn
  trad: ceux qui associent (yajʿalūna maʿa) à Allaah un autre ilāh — ils sauront bientôt (fa-sawfa yaʿlamūn).
- ref: S.15:97
  ar: وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَ
  trl: Wa-la-qad naʿlamu annaka yaḍīqu ṣadruka bimā yaqūlūn
  trad: Et Nous savons certes que ta poitrine (ṣadruka) se resserre (yaḍīqu) à cause de ce qu'ils disent —
- ref: S.15:98
  ar: فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ
  trl: Fa-sabbiḥ bi-ḥamdi rabbika wa-kun mina s-sājidīn
  trad: glorifie donc [ton Rabb] par la ḥamd (la louange) qui Lui revient — et sois de ceux qui se prosternent (as-sājidīn).
- ref: S.15:99
  ar: وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ
  trl: Wa-ʿbud rabbaka ḥattā yaʾtiyaka l-yaqīn
  trad: Et adore ton Rabb jusqu'à ce que te vienne la certitude (al-yaqīn).
