- ref: S.7:1
  ar: المص
  trl: Alif · Lām · Mīm · Ṣād
  trad: Lettres séparées (*ḥurūf muqaṭṭaʿāt*).
- ref: S.7:2
  ar: كِتَابٌ أُنْزِلَ إِلَيْكَ فَلَا يَكُنْ فِي صَدْرِكَ حَرَجٌ مِنْهُ لِتُنْذِرَ بِهِ وَذِكْرَىٰ لِلْمُؤْمِنِينَ
  trl: Kitābun unzila ilayka fa-lā yakun fī ṣadrika ḥarajun minhu li-tundhira bihi wa-dhikrā li-l-muʾminīn
  trad: Un Kitāb qui t'a été descendu (*unzila*) — que nulle gêne (*ḥaraj*) n'en habite ta poitrine — pour que tu avertisses (*tundhira*) par lui, et [qu'il soit] rappel (*dhikrā*) pour les croyants.
- ref: S.7:3
  ar: اتَّبِعُوا مَا أُنْزِلَ إِلَيْكُمْ مِنْ رَبِّكُمْ وَلَا تَتَّبِعُوا مِنْ دُونِهِ أَوْلِيَاءَ ۗ قَلِيلًا مَا تَذَكَّرُونَ
  trl: Ittabiʿū mā unzila ilaykum min rabbikum wa-lā tattabiʿū min dūnihi awliyāʾa qalīlan mā tadhakkarūn
  trad: Suivez ce qui vous a été descendu de votre Rabb, et ne suivez pas, en dehors de Lui, des *walī* — combien peu vous vous rappelez (*tadhakkarūn*) !
- ref: S.7:4
  ar: وَكَمْ مِنْ قَرْيَةٍ أَهْلَكْنَاهَا فَجَاءَهَا بَأْسُنَا بَيَاتًا أَوْ هُمْ قَائِلُونَ
  trl: Wa-kam min qaryatin ahlaknāhā fa-jāʾahā baʾsunā bayātan aw hum qāʾilūn
  trad: Et que de cités (*qarya*) Nous avons anéanties (*ahlaknāhā*) ! Notre rigueur (*baʾs*) leur est venue de nuit (*bayātan*), ou tandis qu'elles faisaient la sieste de midi (*qāʾilūn*).
- ref: S.7:5
  ar: فَمَا كَانَ دَعْوَاهُمْ إِذْ جَاءَهُمْ بَأْسُنَا إِلَّا أَنْ قَالُوا إِنَّا كُنَّا ظَالِمِينَ
  trl: Fa-mā kāna daʿwāhum idh jāʾahum baʾsunā illā an qālū innā kunnā ẓālimīn
  trad: 'Et leur seul appel (*daʿwā*), quand Notre rigueur leur vint, fut de dire : « Nous étions certes injustes (*ẓālimīn*). »'
- ref: S.7:6
  ar: فَلَنَسْأَلَنَّ الَّذِينَ أُرْسِلَ إِلَيْهِمْ وَلَنَسْأَلَنَّ الْمُرْسَلِينَ
  trl: Fa-la-nasʾalanna lladhīna ursila ilayhim wa-la-nasʾalanna l-mursalīn
  trad: Nous interrogerons certes ceux vers qui un envoi fut fait, et Nous interrogerons certes les envoyés (*al-mursalīn*).
- ref: S.7:7
  ar: فَلَنَقُصَّنَّ عَلَيْهِمْ بِعِلْمٍ ۖ وَمَا كُنَّا غَائِبِينَ
  trl: Fa-la-naquṣṣanna ʿalayhim bi-ʿilmin wa-mā kunnā ghāʾibīn
  trad: Nous leur relaterons (*naquṣṣanna*) certes [tout], en pleine connaissance (*bi-ʿilmin*) — Nous n'étions pas absents (*ghāʾibīn*).
- ref: S.7:8
  ar: وَالْوَزْنُ يَوْمَئِذٍ الْحَقُّ ۚ فَمَنْ ثَقُلَتْ مَوَازِينُهُ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ
  trl: Wa-l-waznu yawmaʾidhin al-ḥaqqu fa-man thaqulat mawāzīnuhu fa-ulāʾika humu l-mufliḥūn
  trad: Et la pesée (*al-wazn*), ce jour-là, est le *ḥaqq* [même] — quiconque a ses balances (*mawāzīnuhu*) lourdes, ceux-là sont les *mufliḥūn*.
- ref: S.7:9
  ar: وَمَنْ خَفَّتْ مَوَازِينُهُ فَأُولَٰئِكَ الَّذِينَ خَسِرُوا أَنْفُسَهُمْ بِمَا كَانُوا بِآيَاتِنَا يَظْلِمُونَ
  trl: Wa-man khaffat mawāzīnuhu fa-ulāʾika lladhīna khasirū anfusahum bi-mā kānū bi-āyātinā yaẓlimūn
  trad: Et quiconque a ses balances légères (*khaffat*), ceux-là sont ceux qui se sont perdus eux-mêmes (*khasirū anfusahum*), pour avoir été injustes (*yaẓlimūn*) envers Nos *āyāt*.
- ref: S.7:10
  ar: وَلَقَدْ مَكَّنَّاكُمْ فِي الْأَرْضِ وَجَعَلْنَا لَكُمْ فِيهَا مَعَايِشَ ۗ قَلِيلًا مَا تَشْكُرُونَ
  trl: Wa-la-qad makkannākum fi l-arḍi wa-jaʿalnā lakum fīhā maʿāyisha qalīlan mā tashkurūn
  trad: Et Nous vous avons certes établis fermement (*makkannākum*) sur la terre, et Nous y avons établi pour vous des moyens de subsistance (*maʿāyish*) — combien peu vous êtes reconnaissants (*tashkurūn*) !
- ref: S.7:11
  ar: وَلَقَدْ خَلَقْنَاكُمْ ثُمَّ صَوَّرْنَاكُمْ ثُمَّ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ لَمْ يَكُنْ مِنَ السَّاجِدِينَ
  trl: Wa-la-qad khalaqnākum thumma ṣawwarnākum thumma qulnā li-l-malāʾikati sjudū li-ādama fa-sajadū illā iblīsa lam yakun mina s-sājidīn
  trad: 'Et Nous vous avons certes créés (*khalaqnākum*), puis Nous vous avons donné forme (*ṣawwarnākum*) — puis Nous avons dit aux *malāʾika* : « Prosternez-vous devant Ādam » — ils se prosternèrent, sauf Iblīs : il ne fut pas parmi ceux qui se prosternent.'
- ref: S.7:12
  ar: قَالَ مَا مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ ۖ قَالَ أَنَا خَيْرٌ مِنْهُ خَلَقْتَنِي مِنْ نَارٍ وَخَلَقْتَهُ مِنْ طِينٍ
  trl: Qāla mā manaʿaka allā tasjuda idh amartuka qāla anā khayrun minhu khalaqtanī min nārin wa-khalaqtahu min ṭīnin
  trad: 'Il dit : « Qu''est-ce qui t''a empêché de te prosterner, quand Je te l''ai ordonné ? » Il dit : « Je suis meilleur (*khayr*) que lui — Tu m''as créé de feu (*nār*), et Tu l''as créé d''argile (*ṭīn*). »'
- ref: S.7:13
  ar: قَالَ فَاهْبِطْ مِنْهَا فَمَا يَكُونُ لَكَ أَنْ تَتَكَبَّرَ فِيهَا فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ
  trl: Qāla fa-hbiṭ minhā fa-mā yakūnu laka an tatakabbara fīhā fa-khruj innaka mina ṣ-ṣāghirīn
  trad: 'Il dit : « Descends-en (*ihbiṭ*) donc — il ne t''appartient pas de t''enorgueillir (*tatakabbara*) ici. Sors donc : tu es certes parmi les humiliés (*aṣ-ṣāghirīn*). »'
- ref: S.7:14
  ar: قَالَ أَنْظِرْنِي إِلَىٰ يَوْمِ يُبْعَثُونَ
  trl: Qāla anẓirnī ilā yawmi yubʿathūn
  trad: 'Il dit : « Accorde-moi un délai (*anẓirnī*) jusqu''au jour où ils seront ressuscités (*yubʿathūn*). »'
- ref: S.7:15
  ar: قَالَ إِنَّكَ مِنَ الْمُنْظَرِينَ
  trl: Qāla innaka mina l-munẓarīn
  trad: 'Il dit : « Tu es certes parmi ceux à qui un délai est accordé (*al-munẓarīn*). »'
- ref: S.7:16
  ar: قَالَ فَبِمَا أَغْوَيْتَنِي لَأَقْعُدَنَّ لَهُمْ صِرَاطَكَ الْمُسْتَقِيمَ
  trl: Qāla fa-bi-mā aghwaytanī la-aqʿudanna lahum ṣirāṭaka l-mustaqīm
  trad: 'Il dit : « Puisque Tu m''as égaré (*aghwaytanī*), je m''assiérai certes en embuscade (*la-aqʿudanna*) pour eux sur Ton chemin droit (*ṣirāṭaka l-mustaqīm*). »'
- ref: S.7:17
  ar: ثُمَّ لَآتِيَنَّهُمْ مِنْ بَيْنِ أَيْدِيهِمْ وَمِنْ خَلْفِهِمْ وَعَنْ أَيْمَانِهِمْ وَعَنْ شَمَائِلِهِمْ ۖ وَلَا تَجِدُ أَكْثَرَهُمْ شَاكِرِينَ
  trl: Thumma la-ātiyannahum min bayni aydīhim wa-min khalfihim wa-ʿan aymānihim wa-ʿan shamāʾilihim wa-lā tajidu aktharahum shākirīn
  trad: Puis je viendrai (*ātiyannahum*) certes à eux de devant eux et de derrière eux, de leur droite et de leur gauche — et Tu ne trouveras pas la plupart d'entre eux reconnaissants (*shākirīn*).
- ref: S.7:18
  ar: قَالَ اخْرُجْ مِنْهَا مَذْءُومًا مَدْحُورًا ۖ لَمَنْ تَبِعَكَ مِنْهُمْ لَأَمْلَأَنَّ جَهَنَّمَ مِنْكُمْ أَجْمَعِينَ
  trl: Qāla khruj minhā madhʾūman madḥūran la-man tabiʿaka minhum la-amlaʾanna jahannama minkum ajmaʿīn
  trad: 'Il dit : « Sors-en, méprisé (*madhʾūman*), rejeté (*madḥūran*) — quiconque parmi eux te suivra, J''emplirai (*la-amlaʾanna*) certes *jahannam* de vous tous. »'
- ref: S.7:19
  ar: وَيَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ فَكُلَا مِنْ حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ
  trl: Wa-yā ādamu skun anta wa-zawjuka l-jannata fa-kulā min ḥaythu shiʾtumā wa-lā taqrabā hādhihi sh-shajarata fa-takūnā mina ẓ-ẓālimīn
  trad: 'Et : « Ô Ādam, demeure (*uskun*), toi et ton épouse, dans la *janna* — mangez-en (*kulā*) d''où vous voudrez — mais n''approchez pas (*lā taqrabā*) cet arbre, sinon vous seriez du nombre des *ẓālimīn*. »'
- ref: S.7:20
  ar: فَوَسْوَسَ لَهُمَا الشَّيْطَانُ لِيُبْدِيَ لَهُمَا مَا وُورِيَ عَنْهُمَا مِنْ سَوْآتِهِمَا وَقَالَ مَا نَهَاكُمَا رَبُّكُمَا عَنْ هَٰذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونَا مَلَكَيْنِ أَوْ تَكُونَا مِنَ الْخَالِدِينَ
  trl: Fa-waswasa lahumā sh-shayṭānu li-yubdiya lahumā mā wūriya ʿanhumā min sawʾātihimā wa-qāla mā nahākumā rabbukumā ʿan hādhihi sh-shajarati illā an takūnā malakayni aw takūnā mina l-khālidīn
  trad: 'Alors le *shayṭān* leur insuffla (*waswasa*) le doute, pour leur rendre apparent ce qui leur était caché (*wūriya*) de leurs nudités (*sawʾātihimā*), et il dit : « Votre Rabb ne vous a interdit cet arbre que pour que vous ne deveniez deux *malāʾika*, ou que vous ne deveniez du nombre des immortels (*al-khālidīn*). »'
- ref: S.7:21
  ar: وَقَاسَمَهُمَا إِنِّي لَكُمَا لَمِنَ النَّاصِحِينَ
  trl: Wa-qāsamahumā innī lakumā la-mina n-nāṣiḥīn
  trad: 'Et il leur jura (*qāsamahumā*) : « Je suis certes, pour vous deux, du nombre de ceux qui conseillent sincèrement (*an-nāṣiḥīn*). »'
- ref: S.7:22
  ar: فَدَلَّاهُمَا بِغُرُورٍ ۚ فَلَمَّا ذَاقَا الشَّجَرَةَ بَدَتْ لَهُمَا سَوْآتُهُمَا وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ ۖ وَنَادَاهُمَا رَبُّهُمَا أَلَمْ أَنْهَكُمَا عَنْ تِلْكُمَا الشَّجَرَةِ وَأَقُلْ لَكُمَا إِنَّ الشَّيْطَانَ لَكُمَا عَدُوٌّ مُبِينٌ
  trl: Fa-dallāhumā bi-ghurūrin fa-lammā dhāqā sh-shajarata badat lahumā sawʾātuhumā wa-ṭafiqā yakhṣifāni ʿalayhimā min waraqi l-jannati wa-nādāhumā rabbuhumā a-lam anhakumā ʿan tilkumā sh-shajarati wa-aqul lakumā inna sh-shayṭāna lakumā ʿaduwwun mubīn
  trad: 'Il les fit ainsi tomber (*dallāhumā*) par tromperie (*ghurūr*) — quand ils eurent goûté (*dhāqā*) l''arbre, leurs nudités leur apparurent, et ils se mirent à assembler (*yakhṣifāni*) sur eux des feuilles du jardin. Et leur Rabb les appela : « Ne vous avais-Je pas interdit cet arbre, et ne vous avais-Je pas dit que le *shayṭān* est pour vous deux un ennemi déclaré ? »'
- ref: S.7:23
  ar: قَالَا رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ
  trl: Qālā rabbanā ẓalamnā anfusanā wa-in lam taghfir lanā wa-tarḥamnā la-nakūnanna mina l-khāsirīn
  trad: 'Ils dirent tous deux : « Notre Rabb, nous avons été injustes (*ẓalamnā*) envers nous-mêmes — et si Tu ne nous pardonnes (*taghfir*) pas et ne nous fais pas *raḥma*, nous serons certes du nombre des perdants (*al-khāsirīn*). »'
- ref: S.7:24
  ar: قَالَ اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ وَلَكُمْ فِي الْأَرْضِ مُسْتَقَرٌّ وَمَتَاعٌ إِلَىٰ حِينٍ
  trl: Qāla hbiṭū baʿḍukum li-baʿḍin ʿaduwwun wa-lakum fi l-arḍi mustaqarrun wa-matāʿun ilā ḥīn
  trad: 'Il dit : « Descendez (*ihbiṭū*) — vous serez ennemis les uns pour les autres — et à vous, sur la terre, une installation (*mustaqarr*) et une jouissance (*matāʿ*) jusqu''à un terme (*ilā ḥīn*). »'
- ref: S.7:25
  ar: قَالَ فِيهَا تَحْيَوْنَ وَفِيهَا تَمُوتُونَ وَمِنْهَا تُخْرَجُونَ
  trl: Qāla fīhā taḥyawna wa-fīhā tamūtūna wa-minhā tukhrajūn
  trad: 'Il dit : « C''est là que vous vivrez, c''est là que vous mourrez, et c''est de là que vous serez extraits (*tukhrajūn*). »'
- ref: S.7:26
  ar: يَا بَنِي آدَمَ قَدْ أَنْزَلْنَا عَلَيْكُمْ لِبَاسًا يُوَارِي سَوْآتِكُمْ وَرِيشًا ۖ وَلِبَاسُ التَّقْوَىٰ ذَٰلِكَ خَيْرٌ ۚ ذَٰلِكَ مِنْ آيَاتِ اللَّهِ لَعَلَّهُمْ يَذَّكَّرُونَ
  trl: Yā banī ādama qad anzalnā ʿalaykum libāsan yuwārī sawʾātikum wa-rīshan wa-libāsu t-taqwā dhālika khayrun dhālika min āyāti llāhi laʿallahum yadhdhakkarūn
  trad: Ô fils d'Ādam (*banī ādama*), Nous avons fait descendre sur vous un vêtement (*libāsan*) qui recouvre (*yuwārī*) vos nudités, et une parure (*rīshan*) — mais le vêtement de la *taqwā*, voilà qui est meilleur (*khayr*). Cela fait partie des *āyāt* d'Allaah — peut-être se rappelleront-ils (*yadhdhakkarūn*).
- ref: S.7:27
  ar: يَا بَنِي آدَمَ لَا يَفْتِنَنَّكُمُ الشَّيْطَانُ كَمَا أَخْرَجَ أَبَوَيْكُمْ مِنَ الْجَنَّةِ يَنْزِعُ عَنْهُمَا لِبَاسَهُمَا لِيُرِيَهُمَا سَوْآتِهِمَا ۗ إِنَّهُ يَرَاكُمْ هُوَ وَقَبِيلُهُ مِنْ حَيْثُ لَا تَرَوْنَهُمْ ۗ إِنَّا جَعَلْنَا الشَّيَاطِينَ أَوْلِيَاءَ لِلَّذِينَ لَا يُؤْمِنُونَ
  trl: Yā banī ādama lā yaftinannakumu sh-shayṭānu ka-mā akhraja abawaykum mina l-jannati yanziʿu ʿanhumā libāsahumā li-yuriyahumā sawʾātihimā innahu yarākum huwa wa-qabīluhu min ḥaythu lā tarawnahum innā jaʿalnā sh-shayāṭīna awliyāʾa li-lladhīna lā yuʾminūn
  trad: Ô fils d'Ādam, que le *shayṭān* ne vous mette pas à l'épreuve (*lā yaftinannakum*) comme il a fait sortir vos deux parents du jardin, leur arrachant (*yanziʿu*) leur vêtement pour leur montrer leurs nudités. Il vous voit, lui et son engeance (*qabīluhu*), d'où vous ne les voyez pas — Nous avons établi les *shayāṭīn* comme *walī* pour ceux qui ne croient pas.
- ref: S.7:28
  ar: وَإِذَا فَعَلُوا فَاحِشَةً قَالُوا وَجَدْنَا عَلَيْهَا آبَاءَنَا وَاللَّهُ أَمَرَنَا بِهَا ۗ قُلْ إِنَّ اللَّهَ لَا يَأْمُرُ بِالْفَحْشَاءِ ۖ أَتَقُولُونَ عَلَى اللَّهِ مَا لَا تَعْلَمُونَ
  trl: Wa-idhā faʿalū fāḥishatan qālū wajadnā ʿalayhā ābāʾanā wa-llāhu amaranā bihā qul inna llāha lā yaʾmuru bi-l-faḥshāʾi a-taqūlūna ʿalā llāhi mā lā taʿlamūn
  trad: 'Et quand ils commettent une *fāḥisha*, ils disent : « Nous avons trouvé nos pères sur cela, et Allaah nous l''a ordonné. » Dis : « Allaah n''ordonne pas la *faḥshāʾ* — direz-vous sur Allaah ce que vous ne savez pas ? »'
- ref: S.7:29
  ar: قُلْ أَمَرَ رَبِّي بِالْقِسْطِ ۖ وَأَقِيمُوا وُجُوهَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ ۚ كَمَا بَدَأَكُمْ تَعُودُونَ
  trl: Qul amara rabbī bi-l-qisṭi wa-aqīmū wujūhakum ʿinda kulli masjidin wa-dʿūhu mukhliṣīna lahu d-dīna ka-mā badaʾakum taʿūdūn
  trad: 'Dis : « Mon Rabb a ordonné le *qisṭ* — orientez vos visages (*aqīmū wujūhakum*) à chaque *masjid*, et invoquez-Le en Lui vouant exclusivement (*mukhliṣīna*) le *dīn*. Comme Il vous a fait naître (*badaʾakum*) une première fois, vous reviendrez (*taʿūdūn*). »'
- ref: S.7:30
  ar: فَرِيقًا هَدَىٰ وَفَرِيقًا حَقَّ عَلَيْهِمُ الضَّلَالَةُ ۗ إِنَّهُمُ اتَّخَذُوا الشَّيَاطِينَ أَوْلِيَاءَ مِنْ دُونِ اللَّهِ وَيَحْسَبُونَ أَنَّهُمْ مُهْتَدُونَ
  trl: Farīqan hadā wa-farīqan ḥaqqa ʿalayhimu ḍ-ḍalālatu innahumu ttakhadhū sh-shayāṭīna awliyāʾa min dūni llāhi wa-yaḥsabūna annahum muhtadūn
  trad: Un groupe (*farīqan*), Il l'a guidé (*hadā*) ; et un groupe, l'égarement (*aḍ-ḍalāla*) s'est avéré (*ḥaqqa*) sur eux — car ils ont pris les *shayāṭīn* comme *walī* en dehors d'Allaah, tout en estimant (*yaḥsabūna*) qu'ils sont bien-guidés.
- ref: S.7:31
  ar: ۞ يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ
  trl: Yā banī ādama khudhū zīnatakum ʿinda kulli masjidin wa-kulū wa-shrabū wa-lā tusrifū innahu lā yuḥibbu l-musrifīn
  trad: Ô fils d'Ādam, prenez votre parure (*zīnatakum*) à chaque *masjid* ; mangez et buvez, et ne commettez pas d'excès (*lā tusrifū*) — Il n'honore pas (*lā yuḥibbu*) les excessifs (*al-musrifīn*).
- ref: S.7:32
  ar: قُلْ مَنْ حَرَّمَ زِينَةَ اللَّهِ الَّتِي أَخْرَجَ لِعِبَادِهِ وَالطَّيِّبَاتِ مِنَ الرِّزْقِ ۚ قُلْ هِيَ لِلَّذِينَ آمَنُوا فِي الْحَيَاةِ الدُّنْيَا خَالِصَةً يَوْمَ الْقِيَامَةِ ۗ كَذَٰلِكَ نُفَصِّلُ الْآيَاتِ لِقَوْمٍ يَعْلَمُونَ
  trl: Qul man ḥarrama zīnata llāhi llatī akhraja li-ʿibādihi wa-ṭ-ṭayyibāti mina r-rizqi qul hiya li-lladhīna āmanū fi l-ḥayāti d-dunyā khāliṣatan yawma l-qiyāmati ka-dhālika nufaṣṣilu l-āyāti li-qawmin yaʿlamūn
  trad: 'Dis : « Qui a interdit (*ḥarrama*) la *zīna* d''Allaah, qu''Il a produite (*akhraja*) pour Ses *ʿibād*, et les *ṭayyibāt* de la subsistance ? » Dis : « Cela est [destiné], dans la vie d''ici-bas, à ceux qui ont cru — et [leur sera] exclusivement (*khāliṣatan*) [réservé] au jour de la résurrection. » Ainsi Nous détaillons (*nufaṣṣilu*) les *āyāt* pour un peuple qui sait.'
- ref: S.7:33
  ar: قُلْ إِنَّمَا حَرَّمَ رَبِّيَ الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَالْإِثْمَ وَالْبَغْيَ بِغَيْرِ الْحَقِّ وَأَنْ تُشْرِكُوا بِاللَّهِ مَا لَمْ يُنَزِّلْ بِهِ سُلْطَانًا وَأَنْ تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ
  trl: Qul innamā ḥarrama rabbiya l-fawāḥisha mā ẓahara minhā wa-mā baṭana wa-l-ithma wa-l-baghya bi-ghayri l-ḥaqqi wa-an tushrikū bi-llāhi mā lam yunazzil bihi sulṭānan wa-an taqūlū ʿalā llāhi mā lā taʿlamūn
  trad: 'Dis : « Mon Rabb n''a interdit (*innamā ḥarrama*) que les *fawāḥish*, apparentes ou cachées, l''*ithm*, le *baghy* sans droit (*bi-ghayri l-ḥaqq*), le fait d''associer (*tushrikū*) à Allaah ce sur quoi Il n''a fait descendre aucun *sulṭān*, et le fait de dire sur Allaah ce que vous ne savez pas. »'
- ref: S.7:34
  ar: وَلِكُلِّ أُمَّةٍ أَجَلٌ ۖ فَإِذَا جَاءَ أَجَلُهُمْ لَا يَسْتَأْخِرُونَ سَاعَةً ۖ وَلَا يَسْتَقْدِمُونَ
  trl: Wa-li-kulli ummatin ajalun fa-idhā jāʾa ajaluhum lā yastaʾkhirūna sāʿatan wa-lā yastaqdimūn
  trad: Et à chaque *umma* un *ajal* — et quand leur *ajal* vient, ils ne le retardent (*yastaʾkhirūna*) pas d'une heure, ni ne l'avancent (*yastaqdimūn*).
- ref: S.7:35
  ar: يَا بَنِي آدَمَ إِمَّا يَأْتِيَنَّكُمْ رُسُلٌ مِنْكُمْ يَقُصُّونَ عَلَيْكُمْ آيَاتِي ۙ فَمَنِ اتَّقَىٰ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: Yā banī ādama immā yaʾtiyannakum rusulun minkum yaquṣṣūna ʿalaykum āyātī fa-mani ttaqā wa-aṣlaḥa fa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: Ô fils d'Ādam, si des *rusul* issus de vous viennent certes à vous, vous relatant (*yaquṣṣūna*) Mes *āyāt* — quiconque se prémunit (*ittaqā*) et se réforme (*aṣlaḥa*), nulle crainte sur eux, et ils ne seront pas affligés.
- ref: S.7:36
  ar: وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا وَاسْتَكْبَرُوا عَنْهَا أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Wa-lladhīna kadhdhabū bi-āyātinā wa-stakbarū ʿanhā ulāʾika aṣḥābu n-nāri hum fīhā khālidūn
  trad: Et ceux qui ont traité Nos *āyāt* de mensonge et s'en sont détournés avec orgueil (*istakbarū*), ceux-là sont les compagnons du Feu — ils y demeurent (*khālidūn*).
- ref: S.7:37
  ar: فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا أَوْ كَذَّبَ بِآيَاتِهِ ۚ أُولَٰئِكَ يَنَالُهُمْ نَصِيبُهُمْ مِنَ الْكِتَابِ ۖ حَتَّىٰ إِذَا جَاءَتْهُمْ رُسُلُنَا يَتَوَفَّوْنَهُمْ قَالُوا أَيْنَ مَا كُنْتُمْ تَدْعُونَ مِنْ دُونِ اللَّهِ ۖ قَالُوا ضَلُّوا عَنَّا وَشَهِدُوا عَلَىٰ أَنْفُسِهِمْ أَنَّهُمْ كَانُوا كَافِرِينَ
  trl: Fa-man aẓlamu mimmani ftarā ʿalā llāhi kadhiban aw kadhdhaba bi-āyātihi ulāʾika yanāluhum naṣībuhum mina l-kitābi ḥattā idhā jāʾathum rusulunā yatawaffawnahum qālū ayna mā kuntum tadʿūna min dūni llāhi qālū ḍallū ʿannā wa-shahidū ʿalā anfusihim annahum kānū kāfirīn
  trad: 'Qui donc est plus injuste (*aẓlamu*) que celui qui invente un mensonge contre Allaah, ou traite Ses *āyāt* de mensonge ? Ceux-là recevront la part qui leur revient du Kitāb (*naṣībuhum mina l-kitāb*) — jusqu''à ce que, lorsque Nos envoyés (*rusulunā*) viennent les saisir (*yatawaffawnahum*), ils disent : « Où sont ceux que vous invoquiez en dehors d''Allaah ? » Ils disent : « Ils se sont égarés loin de nous » — et ils témoignent contre eux-mêmes qu''ils étaient *kāfirūn*.'
- ref: S.7:38
  ar: قَالَ ادْخُلُوا فِي أُمَمٍ قَدْ خَلَتْ مِنْ قَبْلِكُمْ مِنَ الْجِنِّ وَالْإِنْسِ فِي النَّارِ ۖ كُلَّمَا دَخَلَتْ أُمَّةٌ لَعَنَتْ أُخْتَهَا ۖ حَتَّىٰ إِذَا ادَّارَكُوا فِيهَا جَمِيعًا قَالَتْ أُخْرَاهُمْ لِأُولَاهُمْ رَبَّنَا هَٰؤُلَاءِ أَضَلُّونَا فَآتِهِمْ عَذَابًا ضِعْفًا مِنَ النَّارِ ۖ قَالَ لِكُلٍّ ضِعْفٌ وَلَٰكِنْ لَا تَعْلَمُونَ
  trl: Qāla dkhulū fī umamin qad khalat min qablikum mina l-jinni wa-l-insi fi n-nāri kullamā dakhalat ummatun laʿanat ukhtahā ḥattā idhā ddārakū fīhā jamīʿan qālat ukhrāhum li-ūlāhum rabbanā hāʾulāʾi aḍallūnā fa-ātihim ʿadhāban ḍiʿfan mina n-nāri qāla li-kullin ḍiʿfun wa-lākin lā taʿlamūn
  trad: 'Il dira : « Entrez dans le Feu, parmi des *umam* qui vous ont précédés (*khalat*), de *jinn* et d''humains. » Chaque fois qu''une *umma* y entre, elle maudit (*laʿanat*) sa sœur (*ukhtahā*) — jusqu''à ce que, s''y étant toutes rejointes (*iddārakū*), la dernière d''entre elles dise de la première : « Notre Rabb, ceux-là nous ont égarés (*aḍallūnā*) — donne-leur donc un châtiment double (*ḍiʿfan*) du Feu. » Il dira : « À chacune le double — mais vous ne savez pas. »'
- ref: S.7:39
  ar: وَقَالَتْ أُولَاهُمْ لِأُخْرَاهُمْ فَمَا كَانَ لَكُمْ عَلَيْنَا مِنْ فَضْلٍ فَذُوقُوا الْعَذَابَ بِمَا كُنْتُمْ تَكْسِبُونَ
  trl: Wa-qālat ūlāhum li-ukhrāhum fa-mā kāna lakum ʿalaynā min faḍlin fa-dhūqū l-ʿadhāba bi-mā kuntum taksibūn
  trad: 'Et la première d''entre elles dira à la dernière : « Vous n''aviez sur nous aucun avantage (*faḍl*) — goûtez donc le châtiment pour ce que vous acquériez (*taksibūn*). »'
- ref: S.7:40
  ar: إِنَّ الَّذِينَ كَذَّبُوا بِآيَاتِنَا وَاسْتَكْبَرُوا عَنْهَا لَا تُفَتَّحُ لَهُمْ أَبْوَابُ السَّمَاءِ وَلَا يَدْخُلُونَ الْجَنَّةَ حَتَّىٰ يَلِجَ الْجَمَلُ فِي سَمِّ الْخِيَاطِ ۚ وَكَذَٰلِكَ نَجْزِي الْمُجْرِمِينَ
  trl: Inna lladhīna kadhdhabū bi-āyātinā wa-stakbarū ʿanhā lā tufattaḥu lahum abwābu s-samāʾi wa-lā yadkhulūna l-jannata ḥattā yalija l-jamalu fī sammi l-khiyāṭi wa-ka-dhālika najzī l-mujrimīn
  trad: Ceux qui traitent Nos *āyāt* de mensonge et s'en détournent avec orgueil, les portes du ciel (*abwābu s-samāʾ*) ne s'ouvriront pas pour eux, et ils n'entreront dans la *janna* que lorsqu'un chameau (*jamal*) passera par le chas de l'aiguille (*sammi l-khiyāṭ*) — ainsi rétribuons-Nous (*najzī*) les criminels (*al-mujrimīn*).
- ref: S.7:41
  ar: لَهُمْ مِنْ جَهَنَّمَ مِهَادٌ وَمِنْ فَوْقِهِمْ غَوَاشٍ ۚ وَكَذَٰلِكَ نَجْزِي الظَّالِمِينَ
  trl: Lahum min jahannama mihādun wa-min fawqihim ghawāshin wa-ka-dhālika najzī ẓ-ẓālimīn
  trad: Pour eux, de *jahannam*, une couche (*mihād*), et au-dessus d'eux (*min fawqihim*) des voiles recouvrants (*ghawāshin*) — ainsi rétribuons-Nous les *ẓālimūn*.
- ref: S.7:42
  ar: وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَا نُكَلِّفُ نَفْسًا إِلَّا وُسْعَهَا أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Wa-lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti lā nukallifu nafsan illā wusʿahā ulāʾika aṣḥābu l-jannati hum fīhā khālidūn
  trad: Et ceux qui ont cru et fait les œuvres justes (*aṣ-ṣāliḥāt*) — Nous n'imposons à une âme que ce qu'elle peut porter (*wusʿahā*) — ceux-là sont les compagnons de la *janna*, ils y demeurent.
- ref: S.7:43
  ar: وَنَزَعْنَا مَا فِي صُدُورِهِمْ مِنْ غِلٍّ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ ۖ وَقَالُوا الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا لِهَٰذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلَا أَنْ هَدَانَا اللَّهُ ۖ لَقَدْ جَاءَتْ رُسُلُ رَبِّنَا بِالْحَقِّ ۖ وَنُودُوا أَنْ تِلْكُمُ الْجَنَّةُ أُورِثْتُمُوهَا بِمَا كُنْتُمْ تَعْمَلُونَ
  trl: Wa-nazaʿnā mā fī ṣudūrihim min ghillin tajrī min taḥtihimu l-anhāru wa-qālū l-ḥamdu li-llāhi lladhī hadānā li-hādhā wa-mā kunnā li-nahtadiya law-lā an hadānā llāhu la-qad jāʾat rusulu rabbinā bi-l-ḥaqqi wa-nūdū an tilkumu l-jannatu ūrithtumūhā bi-mā kuntum taʿmalūn
  trad: 'Et Nous aurons arraché (*nazaʿnā*) de leurs poitrines toute rancune (*ghill*) — sous eux couleront les rivières — et ils diront : « *Al-ḥamdu li-llāh*, Ce qui nous a guidés (*hadānā*) à cela — nous n''aurions pas trouvé la guidance (*li-nahtadiya*) si Allaah ne nous avait pas guidés. Les envoyés de notre Rabb sont certes venus avec le *ḥaqq*. » Et il leur sera annoncé (*nūdū*) : « Voici la *janna* qui vous est donnée en héritage (*ūrithtumūhā*) pour ce que vous faisiez. »'
- ref: S.7:44
  ar: وَنَادَىٰ أَصْحَابُ الْجَنَّةِ أَصْحَابَ النَّارِ أَنْ قَدْ وَجَدْنَا مَا وَعَدَنَا رَبُّنَا حَقًّا فَهَلْ وَجَدْتُمْ مَا وَعَدَ رَبُّكُمْ حَقًّا ۖ قَالُوا نَعَمْ ۚ فَأَذَّنَ مُؤَذِّنٌ بَيْنَهُمْ أَنْ لَعْنَةُ اللَّهِ عَلَى الظَّالِمِينَ
  trl: Wa-nādā aṣḥābu l-jannati aṣḥāba n-nāri an qad wajadnā mā waʿadanā rabbunā ḥaqqan fa-hal wajadtum mā waʿada rabbukum ḥaqqan qālū naʿam fa-adhdhana muʾadhdhinun baynahum an laʿnatu llāhi ʿalā ẓ-ẓālimīn
  trad: 'Et les compagnons de la *janna* appelleront (*nādā*) les compagnons du Feu : « Nous avons trouvé véridique (*ḥaqqan*) ce que notre Rabb nous avait promis — avez-vous trouvé véridique ce que votre Rabb vous avait promis ? » Ils diront : « Oui. » Alors un héraut (*muʾadhdhin*) proclamera entre eux : « La malédiction (*laʿnat*) d''Allaah est sur les *ẓālimūn*. »'
- ref: S.7:45
  ar: الَّذِينَ يَصُدُّونَ عَنْ سَبِيلِ اللَّهِ وَيَبْغُونَهَا عِوَجًا وَهُمْ بِالْآخِرَةِ كَافِرُونَ
  trl: Alladhīna yaṣuddūna ʿan sabīli llāhi wa-yabghūnahā ʿiwajan wa-hum bi-l-ākhirati kāfirūn
  trad: Ceux qui détournent (*yaṣuddūna*) du *sabīl* d'Allaah et cherchent à le rendre tortueux (*ʿiwajan*) — et qui, envers l'*Ākhira*, sont *kāfirūn*.
- ref: S.7:46
  ar: وَبَيْنَهُمَا حِجَابٌ ۚ وَعَلَى الْأَعْرَافِ رِجَالٌ يَعْرِفُونَ كُلًّا بِسِيمَاهُمْ ۚ وَنَادَوْا أَصْحَابَ الْجَنَّةِ أَنْ سَلَامٌ عَلَيْكُمْ ۚ لَمْ يَدْخُلُوهَا وَهُمْ يَطْمَعُونَ
  trl: Wa-baynahumā ḥijābun wa-ʿalā l-aʿrāfi rijālun yaʿrifūna kullan bi-sīmāhum wa-nādaw aṣḥāba l-jannati an salāmun ʿalaykum lam yadkhulūhā wa-hum yaṭmaʿūn
  trad: 'Et entre les deux [compagnies], un voile (*ḥijāb*) — et sur les Aʿrāf, des hommes qui reconnaissent (*yaʿrifūna*) chacun à ses marques (*sīmāhum*) — ils appelleront les compagnons de la *janna* : « *Salāmun* sur vous » — ils n''y seront pas [encore] entrés, tout en l''espérant (*yaṭmaʿūn*).'
- ref: S.7:47
  ar: ۞ وَإِذَا صُرِفَتْ أَبْصَارُهُمْ تِلْقَاءَ أَصْحَابِ النَّارِ قَالُوا رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ
  trl: Wa-idhā ṣurifat abṣāruhum tilqāʾa aṣḥābi n-nāri qālū rabbanā lā tajʿalnā maʿa l-qawmi ẓ-ẓālimīn
  trad: 'Et quand leurs regards (*abṣāruhum*) seront tournés (*ṣurifat*) vers les compagnons du Feu, ils diront : « Notre Rabb, ne nous place pas avec le peuple des *ẓālimūn* ! »'
- ref: S.7:48
  ar: وَنَادَىٰ أَصْحَابُ الْأَعْرَافِ رِجَالًا يَعْرِفُونَهُمْ بِسِيمَاهُمْ قَالُوا مَا أَغْنَىٰ عَنْكُمْ جَمْعُكُمْ وَمَا كُنْتُمْ تَسْتَكْبِرُونَ
  trl: Wa-nādā aṣḥābu l-aʿrāfi rijālan yaʿrifūnahum bi-sīmāhum qālū mā aghnā ʿankum jamʿukum wa-mā kuntum tastakbirūn
  trad: 'Et les compagnons des Aʿrāf appelleront des hommes qu''ils reconnaîtront à leurs marques, disant : « À quoi vous a servi (*mā aghnā*) votre rassemblement (*jamʿ*), et ce dont vous vous enorgueilliez (*tastakbirūn*) ? »'
- ref: S.7:49
  ar: أَهَٰؤُلَاءِ الَّذِينَ أَقْسَمْتُمْ لَا يَنَالُهُمُ اللَّهُ بِرَحْمَةٍ ۚ ادْخُلُوا الْجَنَّةَ لَا خَوْفٌ عَلَيْكُمْ وَلَا أَنْتُمْ تَحْزَنُونَ
  trl: A-hāʾulāʾi lladhīna aqsamtum lā yanāluhumu llāhu bi-raḥmatin udkhulū l-jannata lā khawfun ʿalaykum wa-lā antum taḥzanūn
  trad: '« Sont-ce là ceux au sujet desquels vous juriez (*aqsamtum*) qu''Allaah ne les atteindrait (*yanāluhum*) d''aucune *raḥma* ? » — « Entrez dans la *janna* : nulle crainte sur vous, et vous ne serez pas affligés. »'
- ref: S.7:50
  ar: وَنَادَىٰ أَصْحَابُ النَّارِ أَصْحَابَ الْجَنَّةِ أَنْ أَفِيضُوا عَلَيْنَا مِنَ الْمَاءِ أَوْ مِمَّا رَزَقَكُمُ اللَّهُ ۚ قَالُوا إِنَّ اللَّهَ حَرَّمَهُمَا عَلَى الْكَافِرِينَ
  trl: Wa-nādā aṣḥābu n-nāri aṣḥāba l-jannati an afīḍū ʿalaynā mina l-māʾi aw mimmā razaqakumu llāhu qālū inna llāha ḥarramahumā ʿalā l-kāfirīn
  trad: 'Et les compagnons du Feu appelleront les compagnons de la *janna* : « Déversez (*afīḍū*) sur nous un peu d''eau, ou de ce qu''Allaah vous a accordé comme *rizq*. » Ils diront : « Allaah a rendu ces deux choses interdites (*ḥarrama*) aux *kāfirūn*. »'
- ref: S.7:51
  ar: الَّذِينَ اتَّخَذُوا دِينَهُمْ لَهْوًا وَلَعِبًا وَغَرَّتْهُمُ الْحَيَاةُ الدُّنْيَا ۚ فَالْيَوْمَ نَنْسَاهُمْ كَمَا نَسُوا لِقَاءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُوا بِآيَاتِنَا يَجْحَدُونَ
  trl: Alladhīna ttakhadhū dīnahum lahwan wa-laʿiban wa-gharrat-humu l-ḥayātu d-dunyā fa-l-yawma nansāhum ka-mā nasū liqāʾa yawmihim hādhā wa-mā kānū bi-āyātinā yajḥadūn
  trad: Ceux qui ont pris leur *dīn* en divertissement (*lahwan*) et en jeu (*laʿiban*), et que la vie d'ici-bas a trompés (*gharrat*) — aujourd'hui, Nous les oublierons (*nansāhum*) comme ils ont oublié (*nasū*) la rencontre (*liqāʾ*) de ce jour, et parce qu'ils niaient en le sachant (*yajḥadūn*) Nos *āyāt*.
- ref: S.7:52
  ar: وَلَقَدْ جِئْنَاهُمْ بِكِتَابٍ فَصَّلْنَاهُ عَلَىٰ عِلْمٍ هُدًى وَرَحْمَةً لِقَوْمٍ يُؤْمِنُونَ
  trl: Wa-la-qad jiʾnāhum bi-kitābin faṣṣalnāhu ʿalā ʿilmin hudan wa-raḥmatan li-qawmin yuʾminūn
  trad: Et Nous leur avons certes apporté un Kitāb que Nous avons détaillé (*faṣṣalnāhu*), en pleine connaissance (*ʿalā ʿilmin*) — guidance (*hudan*) et *raḥma* pour un peuple qui croit.
- ref: S.7:53
  ar: هَلْ يَنْظُرُونَ إِلَّا تَأْوِيلَهُ ۚ يَوْمَ يَأْتِي تَأْوِيلُهُ يَقُولُ الَّذِينَ نَسُوهُ مِنْ قَبْلُ قَدْ جَاءَتْ رُسُلُ رَبِّنَا بِالْحَقِّ فَهَلْ لَنَا مِنْ شُفَعَاءَ فَيَشْفَعُوا لَنَا أَوْ نُرَدُّ فَنَعْمَلَ غَيْرَ الَّذِي كُنَّا نَعْمَلُ ۚ قَدْ خَسِرُوا أَنْفُسَهُمْ وَضَلَّ عَنْهُمْ مَا كَانُوا يَفْتَرُونَ
  trl: Hal yanẓurūna illā taʾwīlahu yawma yaʾtī taʾwīluhu yaqūlu lladhīna nasūhu min qablu qad jāʾat rusulu rabbinā bi-l-ḥaqqi fa-hal lanā min shufaʿāʾa fa-yashfaʿū lanā aw nuraddu fa-naʿmala ghayra lladhī kunnā naʿmalu qad khasirū anfusahum wa-ḍalla ʿanhum mā kānū yaftarūn
  trad: 'N''attendent-ils rien d''autre que son accomplissement (*taʾwīl*) ? Le jour où son *taʾwīl* viendra, ceux qui l''avaient oublié auparavant diront : « Les envoyés de notre Rabb sont certes venus avec le *ḥaqq* — y a-t-il pour nous des *shufaʿāʾ* qui se joindraient (*yashfaʿū*) à nous ? Ou serions-nous renvoyés (*nuraddu*), pour agir autrement que nous agissions ? » Ils se sont certes perdus eux-mêmes (*khasirū anfusahum*), et ce qu''ils inventaient (*yaftarūn*) s''est égaré loin d''eux (*ḍalla ʿanhum*).'
- ref: S.7:54
  ar: إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ يُغْشِي اللَّيْلَ النَّهَارَ يَطْلُبُهُ حَثِيثًا وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومَ مُسَخَّرَاتٍ بِأَمْرِهِ ۗ أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ ۗ تَبَارَكَ اللَّهُ رَبُّ الْعَالَمِينَ
  trl: Inna rabbakumu llāhu lladhī khalaqa s-samāwāti wa-l-arḍa fī sittati ayyāmin thumma stawā ʿalā l-ʿarshi yughshī l-layla n-nahāra yaṭlubuhu ḥathīthan wa-sh-shamsa wa-l-qamara wa-n-nujūma musakhkharātin bi-amrihi alā lahu l-khalqu wa-l-amru tabāraka llāhu rabbu l-ʿālamīn
  trad: Votre Rabb est certes Allaah, Ce qui a créé les cieux et la terre en six *ayyām* (jours/périodes), puis S'est pleinement rendu maître (*istawā*) du *ʿArsh* — Il enveloppe (*yughshī*) le jour de la nuit, celle-ci le poursuivant sans relâche (*ḥathīthan*) — et le soleil, la lune et les étoiles, soumis (*musakhkharāt*) à Son ordre. N'est-ce pas à Lui qu'appartiennent la création et l'ordre (*al-khalqu wa-l-amru*) ? *Tabāraka* Allaah, Rabb des *ʿālamīn*.
- ref: S.7:55
  ar: ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً ۚ إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ
  trl: Udʿū rabbakum taḍarruʿan wa-khufyatan innahu lā yuḥibbu l-muʿtadīn
  trad: Invoquez votre Rabb avec humilité suppliante (*taḍarruʿan*) et en secret (*khufyatan*) — Il n'honore pas (*lā yuḥibbu*) les transgresseurs (*al-muʿtadīn*).
- ref: S.7:56
  ar: وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا وَادْعُوهُ خَوْفًا وَطَمَعًا ۚ إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِنَ الْمُحْسِنِينَ
  trl: Wa-lā tufsidū fī l-arḍi baʿda iṣlāḥihā wa-dʿūhu khawfan wa-ṭamaʿan inna raḥmata llāhi qarībun mina l-muḥsinīn
  trad: Et ne répandez pas le *fasād* sur la terre après sa réforme (*iṣlāḥ*) — invoquez-Le avec crainte et espérance (*khawfan wa-ṭamaʿan*) — la *raḥma* d'Allaah est certes proche des *muḥsinīn*.
- ref: S.7:57
  ar: وَهُوَ الَّذِي يُرْسِلُ الرِّيَاحَ بُشْرًا بَيْنَ يَدَيْ رَحْمَتِهِ ۖ حَتَّىٰ إِذَا أَقَلَّتْ سَحَابًا ثِقَالًا سُقْنَاهُ لِبَلَدٍ مَيِّتٍ فَأَنْزَلْنَا بِهِ الْمَاءَ فَأَخْرَجْنَا بِهِ مِنْ كُلِّ الثَّمَرَاتِ ۚ كَذَٰلِكَ نُخْرِجُ الْمَوْتَىٰ لَعَلَّكُمْ تَذَكَّرُونَ
  trl: Wa-huwa lladhī yursilu r-riyāḥa bushran bayna yaday raḥmatihi ḥattā idhā aqallat saḥāban thiqālan suqnāhu li-baladin mayyitin fa-anzalnā bihi l-māʾa fa-akhrajnā bihi min kulli th-thamarāti ka-dhālika nukhriju l-mawtā laʿallakum tadhakkarūn
  trad: Et Ce qui envoie les vents en annonce (*bushran*), devant Sa *raḥma* (*bayna yaday raḥmatihi*) — jusqu'à ce que, chargés (*aqallat*) de nuages lourds, Nous les poussions vers une contrée morte (*baladin mayyitin*), y fassions descendre l'eau, et en fassions sortir toutes sortes de fruits — ainsi Nous ferons sortir les morts (*nukhriju l-mawtā*) — peut-être vous rappellerez-vous.
- ref: S.7:58
  ar: وَالْبَلَدُ الطَّيِّبُ يَخْرُجُ نَبَاتُهُ بِإِذْنِ رَبِّهِ ۖ وَالَّذِي خَبُثَ لَا يَخْرُجُ إِلَّا نَكِدًا ۚ كَذَٰلِكَ نُصَرِّفُ الْآيَاتِ لِقَوْمٍ يَشْكُرُونَ
  trl: Wa-l-baladu ṭ-ṭayyibu yakhruju nabātuhu bi-idhni rabbihi wa-lladhī khabutha lā yakhruju illā nakidan ka-dhālika nuṣarrifu l-āyāti li-qawmin yashkurūn
  trad: Et la bonne contrée (*al-baladu ṭ-ṭayyib*), sa végétation sort par la permission (*idhn*) de son Rabb — et celle qui est viciée (*khabutha*) ne fait sortir qu'une maigre récolte (*nakidan*) — ainsi déployons-Nous (*nuṣarrifu*) les *āyāt* pour un peuple qui est reconnaissant (*yashkurūn*).
- ref: S.7:59
  ar: لَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ فَقَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٍ
  trl: La-qad arsalnā nūḥan ilā qawmihi fa-qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu innī akhāfu ʿalaykum ʿadhāba yawmin ʿaẓīm
  trad: 'Nous avons certes envoyé Nūḥ vers son peuple. Il dit : « Ô mon peuple, adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Je crains pour vous le châtiment d''un jour immense (*ʿaẓīm*). »'
- ref: S.7:60
  ar: قَالَ الْمَلَأُ مِنْ قَوْمِهِ إِنَّا لَنَرَاكَ فِي ضَلَالٍ مُبِينٍ
  trl: Qāla l-malaʾu min qawmihi innā la-narāka fī ḍalālin mubīn
  trad: 'L''assemblée (*al-malaʾ*) de son peuple dit : « Nous te voyons certes dans un égarement manifeste. »'
- ref: S.7:61
  ar: قَالَ يَا قَوْمِ لَيْسَ بِي ضَلَالَةٌ وَلَٰكِنِّي رَسُولٌ مِنْ رَبِّ الْعَالَمِينَ
  trl: Qāla yā qawmi laysa bī ḍalālatun wa-lākinnī rasūlun min rabbi l-ʿālamīn
  trad: 'Il dit : « Ô mon peuple, nul égarement (*ḍalāla*) n''est en moi — mais je suis un *rasūl* du Rabb des *ʿālamīn*. »'
- ref: S.7:62
  ar: أُبَلِّغُكُمْ رِسَالَاتِ رَبِّي وَأَنْصَحُ لَكُمْ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ
  trl: Uballighukum risālāti rabbī wa-anṣaḥu lakum wa-aʿlamu mina llāhi mā lā taʿlamūn
  trad: Je vous transmets (*uballighukum*) les messages (*risālāt*) de mon Rabb, je vous conseille sincèrement (*anṣaḥu*), et je sais, d'Allaah, ce que vous ne savez pas.
- ref: S.7:63
  ar: أَوَعَجِبْتُمْ أَنْ جَاءَكُمْ ذِكْرٌ مِنْ رَبِّكُمْ عَلَىٰ رَجُلٍ مِنْكُمْ لِيُنْذِرَكُمْ وَلِتَتَّقُوا وَلَعَلَّكُمْ تُرْحَمُونَ
  trl: A-wa-ʿajibtum an jāʾakum dhikrun min rabbikum ʿalā rajulin minkum li-yundhirakum wa-li-tattaqū wa-laʿallakum turḥamūn
  trad: Vous étonnez-vous (*a-ʿajibtum*) qu'un rappel (*dhikr*) vous soit venu de votre Rabb, par un homme (*rajul*) parmi vous, pour qu'il vous avertisse, que vous vous prémunissiez, et que peut-être vous receviez la *raḥma* (*turḥamūn*) ?
- ref: S.7:64
  ar: فَكَذَّبُوهُ فَأَنْجَيْنَاهُ وَالَّذِينَ مَعَهُ فِي الْفُلْكِ وَأَغْرَقْنَا الَّذِينَ كَذَّبُوا بِآيَاتِنَا ۚ إِنَّهُمْ كَانُوا قَوْمًا عَمِينَ
  trl: Fa-kadhdhabūhu fa-anjaynāhu wa-lladhīna maʿahu fi l-fulki wa-aghraqnā lladhīna kadhdhabū bi-āyātinā innahum kānū qawman ʿamīn
  trad: 'Ils le traitèrent de menteur — Nous le sauvâmes (*anjaynāhu*), lui et ceux qui étaient avec lui, dans l''arche (*al-fulk*), et Nous noyâmes (*aghraqnā*) ceux qui avaient traité Nos *āyāt* de mensonge : ils étaient certes un peuple aveugle (*ʿamīn*).'
- ref: S.7:65
  ar: ۞ وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا ۗ قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۚ أَفَلَا تَتَّقُونَ
  trl: Wa-ilā ʿādin akhāhum hūdan qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu a-fa-lā tattaqūn
  trad: 'Et vers ʿĀd, leur frère (*akhāhum*) Hūd — il dit : « Ô mon peuple, adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Ne vous prémunirez-vous donc pas ? »'
- ref: S.7:66
  ar: قَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ إِنَّا لَنَرَاكَ فِي سَفَاهَةٍ وَإِنَّا لَنَظُنُّكَ مِنَ الْكَاذِبِينَ
  trl: Qāla l-malaʾu lladhīna kafarū min qawmihi innā la-narāka fī safāhatin wa-innā la-naẓunnuka mina l-kādhibīn
  trad: 'L''assemblée de son peuple, ceux qui étaient *kāfirūn*, dirent : « Nous te voyons certes dans une folie (*safāha*), et nous pensons certes que tu es du nombre des menteurs. »'
- ref: S.7:67
  ar: قَالَ يَا قَوْمِ لَيْسَ بِي سَفَاهَةٌ وَلَٰكِنِّي رَسُولٌ مِنْ رَبِّ الْعَالَمِينَ
  trl: Qāla yā qawmi laysa bī safāhatun wa-lākinnī rasūlun min rabbi l-ʿālamīn
  trad: 'Il dit : « Ô mon peuple, nulle folie n''est en moi — mais je suis un *rasūl* du Rabb des *ʿālamīn*. »'
- ref: S.7:68
  ar: أُبَلِّغُكُمْ رِسَالَاتِ رَبِّي وَأَنَا لَكُمْ نَاصِحٌ أَمِينٌ
  trl: Uballighukum risālāti rabbī wa-anā lakum nāṣiḥun amīn
  trad: Je vous transmets les messages de mon Rabb, et je suis pour vous un conseiller (*nāṣiḥ*) digne de confiance (*amīn*).
- ref: S.7:69
  ar: أَوَعَجِبْتُمْ أَنْ جَاءَكُمْ ذِكْرٌ مِنْ رَبِّكُمْ عَلَىٰ رَجُلٍ مِنْكُمْ لِيُنْذِرَكُمْ ۚ وَاذْكُرُوا إِذْ جَعَلَكُمْ خُلَفَاءَ مِنْ بَعْدِ قَوْمِ نُوحٍ وَزَادَكُمْ فِي الْخَلْقِ بَسْطَةً ۖ فَاذْكُرُوا آلَاءَ اللَّهِ لَعَلَّكُمْ تُفْلِحُونَ
  trl: A-wa-ʿajibtum an jāʾakum dhikrun min rabbikum ʿalā rajulin minkum li-yundhirakum wa-dhkurū idh jaʿalakum khulafāʾa min baʿdi qawmi nūḥin wa-zādakum fi l-khalqi basṭatan fa-dhkurū ālāʾa llāhi laʿallakum tufliḥūn
  trad: Vous étonnez-vous qu'un rappel vous soit venu de votre Rabb, par un homme parmi vous, pour qu'il vous avertisse ? Rappelez-vous qu'Il vous a établis comme successeurs (*khulafāʾ*) après le peuple de Nūḥ, et qu'Il vous a accrus, au sein de la création (*fi l-khalq*), en stature (*basṭatan*) — rappelez-vous donc les bienfaits (*ālāʾ*) d'Allaah ; peut-être serez-vous *tufliḥūn*.
- ref: S.7:70
  ar: قَالُوا أَجِئْتَنَا لِنَعْبُدَ اللَّهَ وَحْدَهُ وَنَذَرَ مَا كَانَ يَعْبُدُ آبَاؤُنَا ۖ فَأْتِنَا بِمَا تَعِدُنَا إِنْ كُنْتَ مِنَ الصَّادِقِينَ
  trl: Qālū a-jiʾtanā li-naʿbuda llāha waḥdahu wa-nadhara mā kāna yaʿbudu ābāʾunā fa-tinā bi-mā taʿidunā in kunta mina ṣ-ṣādiqīn
  trad: 'Ils dirent : « Es-tu venu à nous pour que nous adorions Allaah seul (*waḥdahu*), et que nous délaissions (*nadhara*) ce qu''adoraient nos pères ? Apporte-nous donc ce que tu nous promets, si tu es du nombre des véridiques. »'
- ref: S.7:71
  ar: قَالَ قَدْ وَقَعَ عَلَيْكُمْ مِنْ رَبِّكُمْ رِجْسٌ وَغَضَبٌ ۖ أَتُجَادِلُونَنِي فِي أَسْمَاءٍ سَمَّيْتُمُوهَا أَنْتُمْ وَآبَاؤُكُمْ مَا نَزَّلَ اللَّهُ بِهَا مِنْ سُلْطَانٍ ۚ فَانْتَظِرُوا إِنِّي مَعَكُمْ مِنَ الْمُنْتَظِرِينَ
  trl: Qāla qad waqaʿa ʿalaykum min rabbikum rijsun wa-ghaḍabun a-tujādilūnanī fī asmāʾin sammaytumūhā antum wa-ābāʾukum mā nazzala llāhu bihā min sulṭānin fa-ntaẓirū innī maʿakum mina l-muntaẓirīn
  trad: 'Il dit : « Un *rijs* et un *ghaḍab* de votre Rabb se sont déjà abattus sur vous (*waqaʿa ʿalaykum*) — disputez-vous avec moi au sujet de noms que vous avez nommés, vous et vos pères, sans qu''Allaah y ait fait descendre aucun *sulṭān* ? Attendez donc — je suis, avec vous, du nombre de ceux qui attendent. »'
- ref: S.7:72
  ar: فَأَنْجَيْنَاهُ وَالَّذِينَ مَعَهُ بِرَحْمَةٍ مِنَّا وَقَطَعْنَا دَابِرَ الَّذِينَ كَذَّبُوا بِآيَاتِنَا ۖ وَمَا كَانُوا مُؤْمِنِينَ
  trl: Fa-anjaynāhu wa-lladhīna maʿahu bi-raḥmatin minnā wa-qaṭaʿnā dābira lladhīna kadhdhabū bi-āyātinā wa-mā kānū muʾminīn
  trad: 'Nous le sauvâmes donc, lui et ceux qui étaient avec lui, par une *raḥma* venant de Nous, et Nous coupâmes jusqu''à la racine (*qaṭaʿnā dābira*) ceux qui avaient traité Nos *āyāt* de mensonge : ils n''étaient pas croyants.'
- ref: S.7:73
  ar: وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَالِحًا ۗ قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ قَدْ جَاءَتْكُمْ بَيِّنَةٌ مِنْ رَبِّكُمْ ۖ هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً ۖ فَذَرُوهَا تَأْكُلْ فِي أَرْضِ اللَّهِ ۖ وَلَا تَمَسُّوهَا بِسُوءٍ فَيَأْخُذَكُمْ عَذَابٌ أَلِيمٌ
  trl: Wa-ilā thamūda akhāhum ṣāliḥan qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu qad jāʾatkum bayyinatun min rabbikum hādhihi nāqatu llāhi lakum āyatan fa-dharūhā taʾkul fī arḍi llāhi wa-lā tamassūhā bi-sūʾin fa-yaʾkhudhakum ʿadhābun alīm
  trad: 'Et vers Thamūd, leur frère Ṣāliḥ — il dit : « Ô mon peuple, adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Une preuve manifeste (*bayyina*) vous est certes venue de votre Rabb : voici la chamelle d''Allaah (*nāqatu llāh*), un signe (*āya*) pour vous — laissez-la donc se nourrir sur la terre d''Allaah, et ne lui faites aucun mal (*sūʾ*), sinon un châtiment douloureux vous saisirait. »'
- ref: S.7:74
  ar: وَاذْكُرُوا إِذْ جَعَلَكُمْ خُلَفَاءَ مِنْ بَعْدِ عَادٍ وَبَوَّأَكُمْ فِي الْأَرْضِ تَتَّخِذُونَ مِنْ سُهُولِهَا قُصُورًا وَتَنْحِتُونَ الْجِبَالَ بُيُوتًا ۖ فَاذْكُرُوا آلَاءَ اللَّهِ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ
  trl: Wa-dhkurū idh jaʿalakum khulafāʾa min baʿdi ʿādin wa-bawwaʾakum fi l-arḍi tattakhidhūna min suhūlihā quṣūran wa-tanḥitūna l-jibāla buyūtan fa-dhkurū ālāʾa llāhi wa-lā taʿthaw fi l-arḍi mufsidīn
  trad: Et rappelez-vous qu'Il vous a établis comme successeurs après ʿĀd, et vous a installés fermement (*bawwaʾakum*) sur la terre — vous édifiez, de ses plaines, des châteaux, et vous taillez (*tanḥitūna*) les montagnes en demeures. Rappelez-vous donc les bienfaits d'Allaah, et ne semez pas le trouble (*lā taʿthaw*) sur la terre en fauteurs de *fasād* (*mufsidīn*).
- ref: S.7:75
  ar: قَالَ الْمَلَأُ الَّذِينَ اسْتَكْبَرُوا مِنْ قَوْمِهِ لِلَّذِينَ اسْتُضْعِفُوا لِمَنْ آمَنَ مِنْهُمْ أَتَعْلَمُونَ أَنَّ صَالِحًا مُرْسَلٌ مِنْ رَبِّهِ ۚ قَالُوا إِنَّا بِمَا أُرْسِلَ بِهِ مُؤْمِنُونَ
  trl: Qāla l-malaʾu lladhīna stakbarū min qawmihi li-lladhīna stuḍʿifū li-man āmana minhum a-taʿlamūna anna ṣāliḥan mursalun min rabbihi qālū innā bi-mā ursila bihi muʾminūn
  trad: 'L''assemblée de son peuple, ceux qui s''enorgueillissaient (*istakbarū*), dirent à ceux qu''on jugeait faibles (*istuḍʿifū*), à ceux d''entre eux qui avaient cru : « Savez-vous que Ṣāliḥ est envoyé (*mursal*) par son Rabb ? » Ils dirent : « Nous croyons certes en ce avec quoi il a été envoyé. »'
- ref: S.7:76
  ar: قَالَ الَّذِينَ اسْتَكْبَرُوا إِنَّا بِالَّذِي آمَنْتُمْ بِهِ كَافِرُونَ
  trl: Qāla lladhīna stakbarū innā bi-lladhī āmantum bihi kāfirūn
  trad: 'Ceux qui s''enorgueillissaient dirent : « Nous sommes, envers ce en quoi vous croyez, *kāfirūn*. »'
- ref: S.7:77
  ar: فَعَقَرُوا النَّاقَةَ وَعَتَوْا عَنْ أَمْرِ رَبِّهِمْ وَقَالُوا يَا صَالِحُ ائْتِنَا بِمَا تَعِدُنَا إِنْ كُنْتَ مِنَ الْمُرْسَلِينَ
  trl: Fa-ʿaqarū n-nāqata wa-ʿataw ʿan amri rabbihim wa-qālū yā ṣāliḥu tinā bi-mā taʿidunā in kunta mina l-mursalīn
  trad: 'Ils mutilèrent (*ʿaqarū*) la chamelle, et transgressèrent (*ʿataw*) l''ordre de leur Rabb, et dirent : « Ô Ṣāliḥ, apporte-nous ce que tu nous promets, si tu es du nombre des envoyés. »'
- ref: S.7:78
  ar: فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي دَارِهِمْ جَاثِمِينَ
  trl: Fa-akhadhathumu r-rajfatu fa-aṣbaḥū fī dārihim jāthimīn
  trad: La secousse (*ar-rajfa*) les saisit alors, et ils se retrouvèrent, dans leur demeure, gisant à terre, immobiles (*jāthimīn*).
- ref: S.7:79
  ar: فَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا قَوْمِ لَقَدْ أَبْلَغْتُكُمْ رِسَالَةَ رَبِّي وَنَصَحْتُ لَكُمْ وَلَٰكِنْ لَا تُحِبُّونَ النَّاصِحِينَ
  trl: Fa-tawallā ʿanhum wa-qāla yā qawmi la-qad ablaghtukum risālata rabbī wa-naṣaḥtu lakum wa-lākin lā tuḥibbūna n-nāṣiḥīn
  trad: 'Il se détourna d''eux et dit : « Ô mon peuple, je vous ai certes transmis le message de mon Rabb, et je vous ai conseillés sincèrement — mais vous n''appréciez pas ceux qui conseillent sincèrement. »'
- ref: S.7:80
  ar: وَلُوطًا إِذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَةَ مَا سَبَقَكُمْ بِهَا مِنْ أَحَدٍ مِنَ الْعَالَمِينَ
  trl: Wa-lūṭan idh qāla li-qawmihi a-taʾtūna l-fāḥishata mā sabaqakum bihā min aḥadin mina l-ʿālamīn
  trad: 'Et Lūṭ, quand il dit à son peuple : « Commettez-vous la *fāḥisha*, quand nul, parmi les *ʿālamīn*, ne vous a précédés en cela ? »'
- ref: S.7:81
  ar: إِنَّكُمْ لَتَأْتُونَ الرِّجَالَ شَهْوَةً مِنْ دُونِ النِّسَاءِ ۚ بَلْ أَنْتُمْ قَوْمٌ مُسْرِفُونَ
  trl: Innakum la-taʾtūna r-rijāla shahwatan min dūni n-nisāʾi bal antum qawmun musrifūn
  trad: Vous allez certes aux hommes par désir (*shahwatan*), en dehors des femmes — vous êtes plutôt un peuple qui commet l'excès (*musrifūn*).
- ref: S.7:82
  ar: وَمَا كَانَ جَوَابَ قَوْمِهِ إِلَّا أَنْ قَالُوا أَخْرِجُوهُمْ مِنْ قَرْيَتِكُمْ ۖ إِنَّهُمْ أُنَاسٌ يَتَطَهَّرُونَ
  trl: Wa-mā kāna jawāba qawmihi illā an qālū akhrijūhum min qaryatikum innahum unāsun yataṭahharūn
  trad: 'Et la seule réponse de son peuple fut de dire : « Expulsez-les de votre cité — ce sont des gens qui se donnent pour purs (*yataṭahharūn*) ! »'
- ref: S.7:83
  ar: فَأَنْجَيْنَاهُ وَأَهْلَهُ إِلَّا امْرَأَتَهُ كَانَتْ مِنَ الْغَابِرِينَ
  trl: Fa-anjaynāhu wa-ahlahu illā mraʾatahu kānat mina l-ghābirīn
  trad: 'Nous le sauvâmes, lui et sa famille (*ahlahu*), sauf son épouse : elle fut du nombre de ceux qui restèrent en arrière (*al-ghābirīn*).'
- ref: S.7:84
  ar: وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا ۖ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُجْرِمِينَ
  trl: Wa-amṭarnā ʿalayhim maṭaran fa-nẓur kayfa kāna ʿāqibatu l-mujrimīn
  trad: Et Nous fîmes pleuvoir sur eux une pluie (*maṭaran*) — regarde donc quelle fut la fin (*ʿāqiba*) des criminels (*al-mujrimīn*).
- ref: S.7:85
  ar: وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا ۗ قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُمْ مِنْ إِلَٰهٍ غَيْرُهُ ۖ قَدْ جَاءَتْكُمْ بَيِّنَةٌ مِنْ رَبِّكُمْ ۖ فَأَوْفُوا الْكَيْلَ وَالْمِيزَانَ وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا ۚ ذَٰلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ مُؤْمِنِينَ
  trl: Wa-ilā madyana akhāhum shuʿayban qāla yā qawmi ʿbudū llāha mā lakum min ilāhin ghayruhu qad jāʾatkum bayyinatun min rabbikum fa-awfū l-kayla wa-l-mīzāna wa-lā tabkhasū n-nāsa ashyāʾahum wa-lā tufsidū fi l-arḍi baʿda iṣlāḥihā dhālikum khayrun lakum in kuntum muʾminīn
  trad: 'Et vers Madyan, leur frère Shuʿayb — il dit : « Ô mon peuple, adorez Allaah — vous n''avez pas d''*ilāh* en dehors de Lui. Une preuve manifeste vous est certes venue de votre Rabb : donnez donc pleine mesure (*awfū l-kayl*) et pleine pesée (*al-mīzān*), ne lésez pas les gens dans leurs biens (*lā tabkhasū*), et ne répandez pas le *fasād* sur la terre après sa réforme (*iṣlāḥ*) — cela est meilleur pour vous, si vous êtes croyants. »'
- ref: S.7:86
  ar: وَلَا تَقْعُدُوا بِكُلِّ صِرَاطٍ تُوعِدُونَ وَتَصُدُّونَ عَنْ سَبِيلِ اللَّهِ مَنْ آمَنَ بِهِ وَتَبْغُونَهَا عِوَجًا ۚ وَاذْكُرُوا إِذْ كُنْتُمْ قَلِيلًا فَكَثَّرَكُمْ ۖ وَانْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُفْسِدِينَ
  trl: Wa-lā taqʿudū bi-kulli ṣirāṭin tūʿidūna wa-taṣuddūna ʿan sabīli llāhi man āmana bihi wa-tabghūnahā ʿiwajan wa-dhkurū idh kuntum qalīlan fa-kaththarakum wa-nẓurū kayfa kāna ʿāqibatu l-mufsidīn
  trad: Et ne vous asseyez pas sur chaque chemin (*ṣirāṭ*) à menacer (*tūʿidūn*) et à détourner (*taṣuddūn*) du *sabīl* d'Allaah quiconque croit en Lui, cherchant à le rendre tortueux (*tabghūnahā ʿiwajan*) — et rappelez-vous que vous étiez peu nombreux, et qu'Il vous a multipliés (*kaththarakum*) — et regardez quelle fut la fin de ceux qui répandaient le *fasād* (*al-mufsidīn*).
- ref: S.7:87
  ar: وَإِنْ كَانَ طَائِفَةٌ مِنْكُمْ آمَنُوا بِالَّذِي أُرْسِلْتُ بِهِ وَطَائِفَةٌ لَمْ يُؤْمِنُوا فَاصْبِرُوا حَتَّىٰ يَحْكُمَ اللَّهُ بَيْنَنَا ۚ وَهُوَ خَيْرُ الْحَاكِمِينَ
  trl: Wa-in kāna ṭāʾifatun minkum āmanū bi-lladhī ursiltu bihi wa-ṭāʾifatun lam yuʾminū fa-ṣbirū ḥattā yaḥkuma llāhu baynanā wa-huwa khayru l-ḥākimīn
  trad: Et si un groupe (*ṭāʾifa*) parmi vous a cru en ce avec quoi j'ai été envoyé, et qu'un [autre] groupe n'a pas cru, patientez donc jusqu'à ce qu'Allaah juge (*yaḥkuma*) entre nous — Il est le meilleur des juges (*khayru l-ḥākimīn*).
- ref: S.7:88
  ar: ۞ قَالَ الْمَلَأُ الَّذِينَ اسْتَكْبَرُوا مِنْ قَوْمِهِ لَنُخْرِجَنَّكَ يَا شُعَيْبُ وَالَّذِينَ آمَنُوا مَعَكَ مِنْ قَرْيَتِنَا أَوْ لَتَعُودُنَّ فِي مِلَّتِنَا ۚ قَالَ أَوَلَوْ كُنَّا كَارِهِينَ
  trl: Qāla l-malaʾu lladhīna stakbarū min qawmihi la-nukhrijannaka yā shuʿaybu wa-lladhīna āmanū maʿaka min qaryatinā aw la-taʿūdunna fī millatinā qāla a-wa-law kunnā kārihīn
  trad: 'L''assemblée de son peuple, ceux qui s''enorgueillissaient, dirent : « Nous t''expulserons certes, ô Shuʿayb, toi et ceux qui ont cru avec toi, de notre cité — ou bien vous reviendrez certes dans notre *milla* (*millatinā*). » Il dit : « Est-ce donc même si nous en avons de l''aversion (*kārihīn*) ? »'
- ref: S.7:89
  ar: قَدِ افْتَرَيْنَا عَلَى اللَّهِ كَذِبًا إِنْ عُدْنَا فِي مِلَّتِكُمْ بَعْدَ إِذْ نَجَّانَا اللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَا أَنْ نَعُودَ فِيهَا إِلَّا أَنْ يَشَاءَ اللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَيْءٍ عِلْمًا ۚ عَلَى اللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا افْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّ وَأَنْتَ خَيْرُ الْفَاتِحِينَ
  trl: Qadi ftaraynā ʿalā llāhi kadhiban in ʿudnā fī millatikum baʿda idh najjānā llāhu minhā wa-mā yakūnu lanā an naʿūda fīhā illā an yashāʾa llāhu rabbunā wasiʿa rabbunā kulla shayʾin ʿilman ʿalā llāhi tawakkalnā rabbanā ftaḥ baynanā wa-bayna qawminā bi-l-ḥaqqi wa-anta khayru l-fātiḥīn
  trad: Nous aurions certes inventé un mensonge contre Allaah, si nous revenions dans votre *milla* après qu'Allaah nous en a sauvés (*najjānā*) — il ne nous appartient pas d'y revenir, à moins qu'Allaah, notre Rabb, ne le veuille (*illā an yashāʾa*). Notre Rabb embrasse (*wasiʿa*) toute chose en connaissance (*ʿilman*) — c'est sur Allaah que nous nous en remettons (*tawakkalnā*). Notre Rabb, tranche (*iftaḥ*) entre nous et notre peuple par le *ḥaqq* — Tu es le meilleur de ceux qui tranchent (*khayru l-fātiḥīn*).
- ref: S.7:90
  ar: وَقَالَ الْمَلَأُ الَّذِينَ كَفَرُوا مِنْ قَوْمِهِ لَئِنِ اتَّبَعْتُمْ شُعَيْبًا إِنَّكُمْ إِذًا لَخَاسِرُونَ
  trl: Wa-qāla l-malaʾu lladhīna kafarū min qawmihi la-ini ttabaʿtum shuʿayban innakum idhan la-khāsirūn
  trad: 'Et l''assemblée de son peuple, ceux qui étaient *kāfirūn*, dirent : « Si vous suivez Shuʿayb, vous serez alors certes du nombre des perdants (*khāsirūn*). »'
- ref: S.7:91
  ar: فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي دَارِهِمْ جَاثِمِينَ
  trl: Fa-akhadhathumu r-rajfatu fa-aṣbaḥū fī dārihim jāthimīn
  trad: La secousse les saisit alors, et ils se retrouvèrent, dans leur demeure, gisant à terre, immobiles.
- ref: S.7:92
  ar: الَّذِينَ كَذَّبُوا شُعَيْبًا كَأَنْ لَمْ يَغْنَوْا فِيهَا ۚ الَّذِينَ كَذَّبُوا شُعَيْبًا كَانُوا هُمُ الْخَاسِرِينَ
  trl: Alladhīna kadhdhabū shuʿayban ka-an lam yaghnaw fīhā lladhīna kadhdhabū shuʿayban kānū humu l-khāsirīn
  trad: Ceux qui avaient traité Shuʿayb de menteur furent comme s'ils n'y avaient jamais demeuré (*lam yaghnaw*) — ceux qui avaient traité Shuʿayb de menteur furent, eux, les perdants.
- ref: S.7:93
  ar: فَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا قَوْمِ لَقَدْ أَبْلَغْتُكُمْ رِسَالَاتِ رَبِّي وَنَصَحْتُ لَكُمْ ۖ فَكَيْفَ آسَىٰ عَلَىٰ قَوْمٍ كَافِرِينَ
  trl: Fa-tawallā ʿanhum wa-qāla yā qawmi la-qad ablaghtukum risālāti rabbī wa-naṣaḥtu lakum fa-kayfa āsā ʿalā qawmin kāfirīn
  trad: 'Il se détourna d''eux et dit : « Ô mon peuple, je vous ai certes transmis les messages de mon Rabb, et je vous ai conseillés sincèrement — comment donc m''affligerais-je (*āsā*) pour un peuple *kāfir* ? »'
- ref: S.7:94
  ar: وَمَا أَرْسَلْنَا فِي قَرْيَةٍ مِنْ نَبِيٍّ إِلَّا أَخَذْنَا أَهْلَهَا بِالْبَأْسَاءِ وَالضَّرَّاءِ لَعَلَّهُمْ يَضَّرَّعُونَ
  trl: Wa-mā arsalnā fī qaryatin min nabiyyin illā akhadhnā ahlahā bi-l-baʾsāʾi wa-ḍ-ḍarrāʾi laʿallahum yaḍḍarraʿūn
  trad: Et Nous n'avons envoyé, dans une cité (*qarya*), aucun *nabī*, sans que Nous ayons saisi ses habitants par le malheur (*baʾsāʾ*) et le dommage (*ḍarrāʾ*), afin qu'ils s'humilient en suppliant (*yaḍḍarraʿūn*).
- ref: S.7:95
  ar: ثُمَّ بَدَّلْنَا مَكَانَ السَّيِّئَةِ الْحَسَنَةَ حَتَّىٰ عَفَوْا وَقَالُوا قَدْ مَسَّ آبَاءَنَا الضَّرَّاءُ وَالسَّرَّاءُ فَأَخَذْنَاهُمْ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ
  trl: Thumma baddalnā makāna s-sayyiʾati l-ḥasanata ḥattā ʿafaw wa-qālū qad massa ābāʾanā ḍ-ḍarrāʾu wa-s-sarrāʾu fa-akhadhnāhum baghtatan wa-hum lā yashʿurūn
  trad: 'Puis Nous avons remplacé le mal par le bien, jusqu''à ce qu''ils prospèrent (*ʿafaw*) et disent : « Le dommage et l''aisance (*sarrāʾ*) ont déjà touché nos pères » — Nous les avons alors saisis soudainement (*baghtatan*), sans qu''ils s''en aperçoivent (*lā yashʿurūn*).'
- ref: S.7:96
  ar: وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِمْ بَرَكَاتٍ مِنَ السَّمَاءِ وَالْأَرْضِ وَلَٰكِنْ كَذَّبُوا فَأَخَذْنَاهُمْ بِمَا كَانُوا يَكْسِبُونَ
  trl: Wa-law anna ahla l-qurā āmanū wa-ttaqaw la-fataḥnā ʿalayhim barakātin mina s-samāʾi wa-l-arḍi wa-lākin kadhdhabū fa-akhadhnāhum bi-mā kānū yaksibūn
  trad: Et si les habitants des cités avaient cru et s'étaient prémunis (*ittaqaw*), Nous leur aurions certes ouvert (*la-fataḥnā*) des bénédictions (*barakāt*) venant du ciel et de la terre — mais ils ont démenti, et Nous les avons saisis pour ce qu'ils s'acquéraient (*yaksibūn*).
- ref: S.7:97
  ar: أَفَأَمِنَ أَهْلُ الْقُرَىٰ أَنْ يَأْتِيَهُمْ بَأْسُنَا بَيَاتًا وَهُمْ نَائِمُونَ
  trl: A-fa-amina ahlu l-qurā an yaʾtiyahum baʾsunā bayātan wa-hum nāʾimūn
  trad: Les habitants des cités se sentent-ils donc à l'abri (*a-amina*) que Notre rigueur (*baʾs*) leur vienne de nuit (*bayātan*), alors qu'ils dorment ?
- ref: S.7:98
  ar: أَوَأَمِنَ أَهْلُ الْقُرَىٰ أَنْ يَأْتِيَهُمْ بَأْسُنَا ضُحًى وَهُمْ يَلْعَبُونَ
  trl: A-wa-amina ahlu l-qurā an yaʾtiyahum baʾsunā ḍuḥan wa-hum yalʿabūn
  trad: Ou bien se sentent-ils à l'abri que Notre rigueur leur vienne en plein jour (*ḍuḥan*), alors qu'ils s'amusent (*yalʿabūn*) ?
- ref: S.7:99
  ar: أَفَأَمِنُوا مَكْرَ اللَّهِ ۚ فَلَا يَأْمَنُ مَكْرَ اللَّهِ إِلَّا الْقَوْمُ الْخَاسِرُونَ
  trl: A-fa-aminū makra llāhi fa-lā yaʾmanu makra llāhi illā l-qawmu l-khāsirūn
  trad: Se sentent-ils donc à l'abri de la manœuvre (*makr*) d'Allaah ? Nul, hormis le peuple des perdants (*khāsirūn*), ne se sent à l'abri de la manœuvre d'Allaah.
- ref: S.7:100
  ar: أَوَلَمْ يَهْدِ لِلَّذِينَ يَرِثُونَ الْأَرْضَ مِنْ بَعْدِ أَهْلِهَا أَنْ لَوْ نَشَاءُ أَصَبْنَاهُمْ بِذُنُوبِهِمْ ۚ وَنَطْبَعُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَسْمَعُونَ
  trl: A-wa-lam yahdi li-lladhīna yarithūna l-arḍa min baʿdi ahlihā an law nashāʾu aṣabnāhum bi-dhunūbihim wa-naṭbaʿu ʿalā qulūbihim fa-hum lā yasmaʿūn
  trad: N'est-il donc pas devenu clair (*a-wa-lam yahdi*), pour ceux qui héritent la terre après ses habitants [disparus], que si Nous voulions, Nous les atteindrions pour leurs fautes (*dhunūb*) — et Nous scellons (*naṭbaʿu*) leurs cœurs, en sorte qu'ils n'entendent plus ?
- ref: S.7:101
  ar: تِلْكَ الْقُرَىٰ نَقُصُّ عَلَيْكَ مِنْ أَنْبَائِهَا ۚ وَلَقَدْ جَاءَتْهُمْ رُسُلُهُمْ بِالْبَيِّنَاتِ فَمَا كَانُوا لِيُؤْمِنُوا بِمَا كَذَّبُوا مِنْ قَبْلُ ۚ كَذَٰلِكَ يَطْبَعُ اللَّهُ عَلَىٰ قُلُوبِ الْكَافِرِينَ
  trl: Tilka l-qurā naquṣṣu ʿalayka min anbāʾihā wa-la-qad jāʾathum rusuluhum bi-l-bayyināti fa-mā kānū li-yuʾminū bi-mā kadhdhabū min qablu ka-dhālika yaṭbaʿu llāhu ʿalā qulūbi l-kāfirīn
  trad: 'Voilà les cités dont Nous te racontons (*naquṣṣu*) une part des annonces (*anbāʾ*) — leurs *rusul* leur sont certes venus avec les preuves manifestes (*bayyināt*), mais ils n''étaient pas disposés à croire en ce qu''ils avaient auparavant démenti : ainsi Allaah scelle-t-Il les cœurs de ceux qui sont *kāfirūn*.'
- ref: S.7:102
  ar: وَمَا وَجَدْنَا لِأَكْثَرِهِمْ مِنْ عَهْدٍ ۖ وَإِنْ وَجَدْنَا أَكْثَرَهُمْ لَفَاسِقِينَ
  trl: Wa-mā wajadnā li-akthirihim min ʿahdin wa-in wajadnā aktharahum la-fāsiqīn
  trad: Et Nous n'avons trouvé, chez la plupart d'entre eux, aucun engagement (*ʿahd*) [tenu] — Nous avons bien trouvé la plupart d'entre eux *fāsiqīn*.
- ref: S.7:103
  ar: ثُمَّ بَعَثْنَا مِنْ بَعْدِهِمْ مُوسَىٰ بِآيَاتِنَا إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ فَظَلَمُوا بِهَا ۖ فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُفْسِدِينَ
  trl: Thumma baʿathnā min baʿdihim mūsā bi-āyātinā ilā firʿawna wa-malaʾihi fa-ẓalamū bihā fa-nẓur kayfa kāna ʿāqibatu l-mufsidīn
  trad: Puis Nous avons envoyé après eux Mūsā, avec Nos *āyāt*, vers Firʿawn et son assemblée (*malaʾ*) — ils commirent l'injustice (*ẓalamū*) à leur égard (*bihā*) — regarde donc quelle fut la fin de ceux qui répandaient le *fasād* (*al-mufsidīn*).
- ref: S.7:104
  ar: وَقَالَ مُوسَىٰ يَا فِرْعَوْنُ إِنِّي رَسُولٌ مِنْ رَبِّ الْعَالَمِينَ
  trl: Wa-qāla mūsā yā firʿawnu innī rasūlun min rabbi l-ʿālamīn
  trad: 'Mūsā dit : « Ô Firʿawn, je suis un *rasūl* du Rabb des *ʿālamīn*. »'
- ref: S.7:105
  ar: حَقِيقٌ عَلَىٰ أَنْ لَا أَقُولَ عَلَى اللَّهِ إِلَّا الْحَقَّ ۚ قَدْ جِئْتُكُمْ بِبَيِّنَةٍ مِنْ رَبِّكُمْ فَأَرْسِلْ مَعِيَ بَنِي إِسْرَائِيلَ
  trl: Ḥaqīqun ʿalā an lā aqūla ʿalā llāhi illā l-ḥaqqa qad jiʾtukum bi-bayyinatin min rabbikum fa-arsil maʿiya banī isrāʾīl
  trad: Il m'incombe (*ḥaqīqun ʿalā*) de ne dire sur Allaah que le *ḥaqq* — je vous suis venu avec une preuve manifeste (*bayyina*) de votre Rabb — envoie donc avec moi les Banū Isrāʾīl.
- ref: S.7:106
  ar: قَالَ إِنْ كُنْتَ جِئْتَ بِآيَةٍ فَأْتِ بِهَا إِنْ كُنْتَ مِنَ الصَّادِقِينَ
  trl: Qāla in kunta jiʾta bi-āyatin fa-ti bihā in kunta mina ṣ-ṣādiqīn
  trad: 'Il [Firʿawn] dit : « Si tu es venu avec un signe (*āya*), apporte-le, si tu es du nombre des véridiques (*ṣādiqīn*). »'
- ref: S.7:107
  ar: فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُبِينٌ
  trl: Fa-alqā ʿaṣāhu fa-idhā hiya thuʿbānun mubīn
  trad: Il jeta alors son bâton (*ʿaṣā*) — et voici qu'il fut un grand serpent (*thuʿbān*) manifeste.
- ref: S.7:108
  ar: وَنَزَعَ يَدَهُ فَإِذَا هِيَ بَيْضَاءُ لِلنَّاظِرِينَ
  trl: Wa-nazaʿa yadahu fa-idhā hiya bayḍāʾu li-n-nāẓirīn
  trad: Et il retira sa main (*yad*) — et voici qu'elle était blanche (*bayḍāʾ*) pour ceux qui regardaient.
- ref: S.7:109
  ar: قَالَ الْمَلَأُ مِنْ قَوْمِ فِرْعَوْنَ إِنَّ هَٰذَا لَسَاحِرٌ عَلِيمٌ
  trl: Qāla l-malaʾu min qawmi firʿawna inna hādhā la-sāḥirun ʿalīm
  trad: 'L''assemblée (*al-malaʾ*) du peuple de Firʿawn dit : « Celui-ci est certes un magicien (*sāḥir*) savant (*ʿalīm*). »'
- ref: S.7:110
  ar: يُرِيدُ أَنْ يُخْرِجَكُمْ مِنْ أَرْضِكُمْ ۖ فَمَاذَا تَأْمُرُونَ
  trl: Yurīdu an yukhrijakum min arḍikum fa-mādhā taʾmurūn
  trad: « Il veut vous faire sortir de votre terre — que commandez-vous donc ? »
- ref: S.7:111–112
  ar: قَالُوا أَرْجِهْ وَأَخَاهُ وَأَرْسِلْ فِي الْمَدَائِنِ حَاشِرِينَ ۝ يَأْتُوكَ بِكُلِّ سَاحِرٍ عَلِيمٍ
  trl: Qālū arjih wa-akhāhu wa-arsil fi l-madāʾini ḥāshirīn — yaʾtūka bi-kulli sāḥirin ʿalīm
  trad: 'Ils dirent : « Ajourne-le (*arjih*), lui et son frère, et envoie dans les cités des rassembleurs (*ḥāshirīn*), qui t''amèneront tout magicien savant. »'
- ref: S.7:113
  ar: وَجَاءَ السَّحَرَةُ فِرْعَوْنَ قَالُوا إِنَّ لَنَا لَأَجْرًا إِنْ كُنَّا نَحْنُ الْغَالِبِينَ
  trl: Wa-jāʾa s-saḥaratu firʿawna qālū inna lanā la-ajran in kunnā naḥnu l-ghālibīn
  trad: 'Les magiciens (*saḥara*) vinrent à Firʿawn ; ils dirent : « Aurons-nous certes une récompense (*ajr*), si nous sommes les vainqueurs (*ghālibīn*) ? »'
- ref: S.7:114
  ar: قَالَ نَعَمْ وَإِنَّكُمْ لَمِنَ الْمُقَرَّبِينَ
  trl: Qāla naʿam wa-innakum la-mina l-muqarrabīn
  trad: 'Il dit : « Oui — et vous serez certes du nombre des rapprochés (*al-muqarrabīn*). »'
- ref: S.7:115
  ar: قَالُوا يَا مُوسَىٰ إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ نَحْنُ الْمُلْقِينَ
  trl: Qālū yā mūsā immā an tulqiya wa-immā an nakūna naḥnu l-mulqīn
  trad: 'Ils dirent : « Ô Mūsā, ou bien tu jettes, ou bien nous serons ceux qui jettent. »'
- ref: S.7:116
  ar: قَالَ أَلْقُوا ۖ فَلَمَّا أَلْقَوْا سَحَرُوا أَعْيُنَ النَّاسِ وَاسْتَرْهَبُوهُمْ وَجَاءُوا بِسِحْرٍ عَظِيمٍ
  trl: Qāla alqū fa-lammā alqaw saḥarū aʿyuna n-nāsi wa-starhabūhum wa-jāʾū bi-siḥrin ʿaẓīm
  trad: 'Il dit : « Jetez. » Et quand ils eurent jeté, ils ensorcelèrent (*saḥarū*) les yeux des gens, les effrayèrent puissamment (*istarhabūhum*), et vinrent avec une magie (*siḥr*) immense.'
- ref: S.7:117
  ar: ۞ وَأَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنْ أَلْقِ عَصَاكَ ۖ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ
  trl: Wa-awḥaynā ilā mūsā an alqi ʿaṣāka fa-idhā hiya talqafu mā yaʾfikūn
  trad: 'Et Nous révélâmes (*awḥaynā*) à Mūsā : « Jette ton bâton » — et voici qu''il engloutit (*talqafu*) ce qu''ils fabriquaient par artifice (*yaʾfikūn*).'
- ref: S.7:118
  ar: فَوَقَعَ الْحَقُّ وَبَطَلَ مَا كَانُوا يَعْمَلُونَ
  trl: Fa-waqaʿa l-ḥaqqu wa-baṭala mā kānū yaʿmalūn
  trad: Le *ḥaqq* s'établit alors (*waqaʿa*), et ce qu'ils faisaient devint vain (*baṭala*).
- ref: S.7:119
  ar: فَغُلِبُوا هُنَالِكَ وَانْقَلَبُوا صَاغِرِينَ
  trl: Fa-ghulibū hunālika wa-nqalabū ṣāghirīn
  trad: Ils furent vaincus (*ghulibū*) sur-le-champ, et s'en retournèrent humiliés (*ṣāghirīn*).
- ref: S.7:120
  ar: وَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ
  trl: Wa-ulqiya s-saḥaratu sājidīn
  trad: Et les magiciens furent jetés à terre, prosternés (*sājidīn*).
- ref: S.7:121–122
  ar: قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝ رَبِّ مُوسَىٰ وَهَارُونَ
  trl: Qālū āmannā bi-rabbi l-ʿālamīn — rabbi mūsā wa-hārūn
  trad: 'Ils dirent : « Nous croyons au Rabb des *ʿālamīn*, le Rabb de Mūsā et de Hārūn. »'
- ref: S.7:123
  ar: قَالَ فِرْعَوْنُ آمَنْتُمْ بِهِ قَبْلَ أَنْ آذَنَ لَكُمْ ۖ إِنَّ هَٰذَا لَمَكْرٌ مَكَرْتُمُوهُ فِي الْمَدِينَةِ لِتُخْرِجُوا مِنْهَا أَهْلَهَا ۖ فَسَوْفَ تَعْلَمُونَ
  trl: Qāla firʿawnu āmantum bihi qabla an ādhana lakum inna hādhā la-makrun makartumūhu fi l-madīnati li-tukhrijū minhā ahlahā fa-sawfa taʿlamūn
  trad: 'Firʿawn dit : « Vous avez cru en lui avant que je ne vous y autorise (*ādhana*) ! Ceci est certes une manœuvre (*makr*) que vous avez concertée dans la cité, pour en faire sortir ses habitants — vous saurez bientôt !'
- ref: S.7:124
  ar: لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُمْ مِنْ خِلَافٍ ثُمَّ لَأُصَلِّبَنَّكُمْ أَجْمَعِينَ
  trl: La-uqaṭṭiʿanna aydiyakum wa-arjulakum min khilāfin thumma la-uṣallibannakum ajmaʿīn
  trad: je vous couperai certes les mains et les pieds, en alternance (*min khilāf*), puis je vous crucifierai (*la-uṣallibannakum*) tous ensemble. »
- ref: S.7:125
  ar: قَالُوا إِنَّا إِلَىٰ رَبِّنَا مُنْقَلِبُونَ
  trl: Qālū innā ilā rabbinā munqalibūn
  trad: 'Ils dirent : « C''est vers notre Rabb que nous faisons retour (*munqalibūn*). »'
- ref: S.7:126
  ar: وَمَا تَنْقِمُ مِنَّا إِلَّا أَنْ آمَنَّا بِآيَاتِ رَبِّنَا لَمَّا جَاءَتْنَا ۚ رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ
  trl: Wa-mā tanqimu minnā illā an āmannā bi-āyāti rabbinā lammā jāʾatnā rabbanā afrigh ʿalaynā ṣabran wa-tawaffanā muslimīn
  trad: Tu ne nous reproches (*tanqimu*) rien d'autre que d'avoir cru aux *āyāt* de notre Rabb lorsqu'elles nous sont venues. Notre Rabb, déverse (*afrigh*) sur nous la patience (*ṣabr*), et reprends-nous (*tawaffanā*) *muslimīn*.
- ref: S.7:127
  ar: وَقَالَ الْمَلَأُ مِنْ قَوْمِ فِرْعَوْنَ أَتَذَرُ مُوسَىٰ وَقَوْمَهُ لِيُفْسِدُوا فِي الْأَرْضِ وَيَذَرَكَ وَآلِهَتَكَ ۚ قَالَ سَنُقَتِّلُ أَبْنَاءَهُمْ وَنَسْتَحْيِي نِسَاءَهُمْ وَإِنَّا فَوْقَهُمْ قَاهِرُونَ
  trl: Wa-qāla l-malaʾu min qawmi firʿawna a-tadharu mūsā wa-qawmahu li-yufsidū fi l-arḍi wa-yadharaka wa-ālihataka qāla sa-nuqattilu abnāʾahum wa-nastaḥyī nisāʾahum wa-innā fawqahum qāhirūn
  trad: 'Et l''assemblée du peuple de Firʿawn dit : « Laisseras-tu Mūsā et son peuple répandre le *fasād* sur la terre, et te délaisser (*yadharaka*), toi et tes objets d''adoration (*ālihataka*) ? » Il dit : « Nous tuerons (*sanuqattilu*) leurs fils et laisserons vivre (*nastaḥyī*) leurs femmes — nous sommes, au-dessus d''eux, des dominateurs (*fawqahum qāhirūn*). »'
- ref: S.7:128
  ar: قَالَ مُوسَىٰ لِقَوْمِهِ اسْتَعِينُوا بِاللَّهِ وَاصْبِرُوا ۖ إِنَّ الْأَرْضَ لِلَّهِ يُورِثُهَا مَنْ يَشَاءُ مِنْ عِبَادِهِ ۖ وَالْعَاقِبَةُ لِلْمُتَّقِينَ
  trl: Qāla mūsā li-qawmihi staʿīnū bi-llāhi wa-ṣbirū inna l-arḍa li-llāhi yūrithuhā man yashāʾu min ʿibādihi wa-l-ʿāqibatu li-l-muttaqīn
  trad: 'Mūsā dit à son peuple : « Cherchez secours (*istaʿīnū*) en Allaah, et patientez (*iṣbirū*) — la terre appartient à Allaah ; Il la donne en héritage (*yūrithuhā*) à qui Il veut parmi Ses *ʿibād* — et la fin (*al-ʿāqiba*) appartient à ceux qui se prémunissent (*al-muttaqīn*). »'
- ref: S.7:129
  ar: قَالُوا أُوذِينَا مِنْ قَبْلِ أَنْ تَأْتِيَنَا وَمِنْ بَعْدِ مَا جِئْتَنَا ۚ قَالَ عَسَىٰ رَبُّكُمْ أَنْ يُهْلِكَ عَدُوَّكُمْ وَيَسْتَخْلِفَكُمْ فِي الْأَرْضِ فَيَنْظُرَ كَيْفَ تَعْمَلُونَ
  trl: Qālū ūdhīnā min qabli an taʾtiyanā wa-min baʿdi mā jiʾtanā qāla ʿasā rabbukum an yuhlika ʿaduwwakum wa-yastakhlifakum fi l-arḍi fa-yanẓura kayfa taʿmalūn
  trad: 'Ils dirent : « Nous avons été maltraités (*ūdhīnā*) avant que tu ne viennes à nous, et après que tu es venu à nous. » Il dit : « Il se peut (*ʿasā*) que votre Rabb détruise votre ennemi et vous établisse comme successeurs (*yastakhlifakum*) sur la terre — et qu''Il considère alors comment vous agirez (*fa-yanẓura kayfa taʿmalūn*). »'
- ref: S.7:130
  ar: وَلَقَدْ أَخَذْنَا آلَ فِرْعَوْنَ بِالسِّنِينَ وَنَقْصٍ مِنَ الثَّمَرَاتِ لَعَلَّهُمْ يَذَّكَّرُونَ
  trl: Wa-la-qad akhadhnā āla firʿawna bi-s-sinīna wa-naqṣin mina th-thamarāti laʿallahum yadhdhakkarūn
  trad: Et Nous avons certes saisi (*akhadhnā*) la maison de Firʿawn (*āl firʿawn*) par les années [de disette] (*as-sinīn*) et par une diminution des récoltes, dans l'espoir qu'ils se souviennent (*yadhdhakkarūn*).
- ref: S.7:131
  ar: فَإِذَا جَاءَتْهُمُ الْحَسَنَةُ قَالُوا لَنَا هَٰذِهِ ۖ وَإِنْ تُصِبْهُمْ سَيِّئَةٌ يَطَّيَّرُوا بِمُوسَىٰ وَمَنْ مَعَهُ ۗ أَلَا إِنَّمَا طَائِرُهُمْ عِنْدَ اللَّهِ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
  trl: Fa-idhā jāʾathumu l-ḥasanatu qālū lanā hādhihi wa-in tuṣibhum sayyiʾatun yaṭṭayyarū bi-mūsā wa-man maʿahu alā innamā ṭāʾiruhum ʿinda llāhi wa-lākinna aktharahum lā yaʿlamūn
  trad: 'Or, quand le bien (*al-ḥasana*) leur venait, ils disaient : « Cela nous revient. » Et si un mal les atteignait, ils y voyaient un mauvais présage attaché à Mūsā et à ceux qui étaient avec lui (*yaṭṭayyarū bi-mūsā*). N''est-il pas vrai que leur sort (*ṭāʾiruhum*) est auprès d''Allaah seul ? Mais la plupart d''entre eux ne savent pas.'
- ref: S.7:132
  ar: وَقَالُوا مَهْمَا تَأْتِنَا بِهِ مِنْ آيَةٍ لِتَسْحَرَنَا بِهَا فَمَا نَحْنُ لَكَ بِمُؤْمِنِينَ
  trl: Wa-qālū mahmā taʾtinā bihi min āyatin li-tasḥaranā bihā fa-mā naḥnu laka bi-muʾminīn
  trad: 'Et ils dirent : « Quel que soit le signe que tu nous apportes pour nous ensorceler (*li-tasḥaranā*) par lui, nous ne sommes pas prêts à croire en toi. »'
- ref: S.7:133
  ar: فَأَرْسَلْنَا عَلَيْهِمُ الطُّوفَانَ وَالْجَرَادَ وَالْقُمَّلَ وَالضَّفَادِعَ وَالدَّمَ آيَاتٍ مُفَصَّلَاتٍ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُجْرِمِينَ
  trl: Fa-arsalnā ʿalayhimu ṭ-ṭūfāna wa-l-jarāda wa-l-qummala wa-ḍ-ḍafādiʿa wa-d-dama āyātin mufaṣṣalātin fa-stakbarū wa-kānū qawman mujrimīn
  trad: Nous avons alors envoyé sur eux le *ṭūfān*, les sauterelles, le *qummal*, les grenouilles et le sang — des signes détaillés (*āyāt mufaṣṣalāt*) — mais ils s'enflèrent d'orgueil (*istakbarū*), et ils étaient un peuple de criminels (*mujrimīn*).
- ref: S.7:134
  ar: وَلَمَّا وَقَعَ عَلَيْهِمُ الرِّجْزُ قَالُوا يَا مُوسَى ادْعُ لَنَا رَبَّكَ بِمَا عَهِدَ عِنْدَكَ ۖ لَئِنْ كَشَفْتَ عَنَّا الرِّجْزَ لَنُؤْمِنَنَّ لَكَ وَلَنُرْسِلَنَّ مَعَكَ بَنِي إِسْرَائِيلَ
  trl: Wa-lammā waqaʿa ʿalayhimu r-rijzu qālū yā mūsa dʿu lanā rabbaka bi-mā ʿahida ʿindaka la-ʾin kashafta ʿanna r-rijza la-nuʾminanna laka wa-la-nursilanna maʿaka banī isrāʾīl
  trad: 'Et lorsque le fléau (*ar-rijz*) s''abattit sur eux, ils dirent : « Ô Mūsā, invoque pour nous ton Rabb, en vertu de l''engagement (*ʿahd*) qu''Il t''a fait — si tu écartes de nous le fléau, nous croirons certes en toi, et nous laisserons certes partir avec toi les Banū Isrāʾīl. »'
- ref: S.7:135
  ar: فَلَمَّا كَشَفْنَا عَنْهُمُ الرِّجْزَ إِلَىٰ أَجَلٍ هُمْ بَالِغُوهُ إِذَا هُمْ يَنْكُثُونَ
  trl: Fa-lammā kashafnā ʿanhumu r-rijza ilā ajalin hum bālighūhu idhā hum yankuthūn
  trad: Mais quand Nous eûmes écarté d'eux le fléau, jusqu'à un terme (*ajal*) qu'ils devaient atteindre, voici qu'ils rompaient leur engagement (*yankuthūn*).
- ref: S.7:136
  ar: فَانْتَقَمْنَا مِنْهُمْ فَأَغْرَقْنَاهُمْ فِي الْيَمِّ بِأَنَّهُمْ كَذَّبُوا بِآيَاتِنَا وَكَانُوا عَنْهَا غَافِلِينَ
  trl: Fa-ntaqamnā minhum fa-aghraqnāhum fi l-yammi bi-annahum kadhdhabū bi-āyātinā wa-kānū ʿanhā ghāfilīn
  trad: Nous avons donc exercé Notre rétribution contre eux (*intaqamnā*), et Nous les avons noyés dans la mer (*al-yamm*), parce qu'ils avaient démenti Nos *āyāt* et qu'ils y étaient insouciants (*ghāfilīn*).
- ref: S.7:137
  ar: وَأَوْرَثْنَا الْقَوْمَ الَّذِينَ كَانُوا يُسْتَضْعَفُونَ مَشَارِقَ الْأَرْضِ وَمَغَارِبَهَا الَّتِي بَارَكْنَا فِيهَا ۖ وَتَمَّتْ كَلِمَتُ رَبِّكَ الْحُسْنَىٰ عَلَىٰ بَنِي إِسْرَائِيلَ بِمَا صَبَرُوا ۖ وَدَمَّرْنَا مَا كَانَ يَصْنَعُ فِرْعَوْنُ وَقَوْمُهُ وَمَا كَانُوا يَعْرِشُونَ
  trl: Wa-awrathna l-qawma lladhīna kānū yustaḍʿafūna mashāriqa l-arḍi wa-maghāribahā llatī bāraknā fīhā wa-tammat kalimatu rabbika l-ḥusnā ʿalā banī isrāʾīla bi-mā ṣabarū wa-dammarnā mā kāna yaṣnaʿu firʿawnu wa-qawmuhu wa-mā kānū yaʿrishūn
  trad: Et Nous avons fait hériter (*awrathnā*) au peuple qui était tenu pour faible (*yustaḍʿafūna*) les orients et les occidents de la terre que Nous avions bénis — et la plus belle parole (*kalimatu rabbika l-ḥusnā*) de ton Rabb s'accomplit (*tammat*) sur les Banū Isrāʾīl, pour avoir enduré avec constance (*ṣabarū*) — et Nous avons détruit ce que faisaient Firʿawn et son peuple, et ce qu'ils élevaient (*yaʿrishūn*).
- ref: S.7:138
  ar: وَجَاوَزْنَا بِبَنِي إِسْرَائِيلَ الْبَحْرَ فَأَتَوْا عَلَىٰ قَوْمٍ يَعْكُفُونَ عَلَىٰ أَصْنَامٍ لَهُمْ ۚ قَالُوا يَا مُوسَى اجْعَلْ لَنَا إِلَٰهًا كَمَا لَهُمْ آلِهَةٌ ۚ قَالَ إِنَّكُمْ قَوْمٌ تَجْهَلُونَ
  trl: Wa-jāwaznā bi-banī isrāʾīla l-baḥra fa-ataw ʿalā qawmin yaʿkufūna ʿalā aṣnāmin lahum qālū yā mūsa jʿal lanā ilāhan kamā lahum ālihatun qāla innakum qawmun tajhalūn
  trad: 'Et Nous avons fait franchir (*jāwaznā*) la mer aux Banū Isrāʾīl. Ils passèrent alors auprès d''un peuple attaché (*yaʿkufūna*) à des idoles (*aṣnām*) qui étaient les leurs. Ils dirent : « Ô Mūsā, fais-nous un *ilāh* comme ils ont des *ālihah* [objets de culte]. » Il dit : « Vous êtes certes un peuple ignorant (*tajhalūn*). »'
- ref: S.7:139
  ar: إِنَّ هَٰؤُلَاءِ مُتَبَّرٌ مَا هُمْ فِيهِ وَبَاطِلٌ مَا كَانُوا يَعْمَلُونَ
  trl: Inna hāʾulāʾi mutabbarun mā hum fīhi wa-bāṭilun mā kānū yaʿmalūn
  trad: « Ce en quoi ceux-là se trouvent est certes voué à l'anéantissement (*mutabbar*), et ce qu'ils faisaient est vain (*bāṭil*). »
- ref: S.7:140
  ar: قَالَ أَغَيْرَ اللَّهِ أَبْغِيكُمْ إِلَٰهًا وَهُوَ فَضَّلَكُمْ عَلَى الْعَالَمِينَ
  trl: Qāla a-ghayra llāhi abghīkum ilāhan wa-huwa faḍḍalakum ʿalā l-ʿālamīn
  trad: 'Il dit : « Chercherais-je (*abghīkum*) pour vous un *ilāh* autre qu''Allaah, alors que c''est Lui qui vous a favorisés (*faḍḍalakum*) sur les mondes ? »'
- ref: S.7:141
  ar: وَإِذْ أَنْجَيْنَاكُمْ مِنْ آلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوءَ الْعَذَابِ ۖ يُقَتِّلُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ ۚ وَفِي ذَٰلِكُمْ بَلَاءٌ مِنْ رَبِّكُمْ عَظِيمٌ
  trl: Wa-idh anjaynākum min āli firʿawna yasūmūnakum sūʾa l-ʿadhābi yuqattilūna abnāʾakum wa-yastaḥyūna nisāʾakum wa-fī dhālikum balāʾun min rabbikum ʿaẓīm
  trad: Et [souvenez-vous] quand Nous vous avons sauvés (*anjaynākum*) de la maison de Firʿawn, qui vous infligeait (*yasūmūnakum*) le pire des tourments — tuant vos fils et laissant vivre vos femmes — il y avait là, venant de votre Rabb, une épreuve immense (*balāʾ ʿaẓīm*).
- ref: S.7:142
  ar: ۞ وَوَاعَدْنَا مُوسَىٰ ثَلَاثِينَ لَيْلَةً وَأَتْمَمْنَاهَا بِعَشْرٍ فَتَمَّ مِيقَاتُ رَبِّهِ أَرْبَعِينَ لَيْلَةً ۚ وَقَالَ مُوسَىٰ لِأَخِيهِ هَارُونَ اخْلُفْنِي فِي قَوْمِي وَأَصْلِحْ وَلَا تَتَّبِعْ سَبِيلَ الْمُفْسِدِينَ
  trl: Wa-wāʿadnā mūsā thalāthīna laylatan wa-atmamnāhā bi-ʿashrin fa-tamma mīqātu rabbihi arbaʿīna laylatan wa-qāla mūsā li-akhīhi hārūna khlufnī fī qawmī wa-aṣliḥ wa-lā tattabiʿ sabīla l-mufsidīn
  trad: 'Et Nous avons fixé rendez-vous (*wāʿadnā*) à Mūsā pour trente nuits, que Nous avons complétées par dix — le rendez-vous fixé (*mīqāt*) par son Rabb s''accomplit ainsi en quarante nuits. Et Mūsā dit à son frère Hārūn : « Succède-moi (*ukhlufnī*) auprès de mon peuple, agis avec droiture (*aṣliḥ*), et ne suis pas le chemin des *mufsidīn*. »'
- ref: S.7:143
  ar: وَلَمَّا جَاءَ مُوسَىٰ لِمِيقَاتِنَا وَكَلَّمَهُ رَبُّهُ قَالَ رَبِّ أَرِنِي أَنْظُرْ إِلَيْكَ ۚ قَالَ لَنْ تَرَانِي وَلَٰكِنِ انْظُرْ إِلَى الْجَبَلِ فَإِنِ اسْتَقَرَّ مَكَانَهُ فَسَوْفَ تَرَانِي ۚ فَلَمَّا تَجَلَّىٰ رَبُّهُ لِلْجَبَلِ جَعَلَهُ دَكًّا وَخَرَّ مُوسَىٰ صَعِقًا ۚ فَلَمَّا أَفَاقَ قَالَ سُبْحَانَكَ تُبْتُ إِلَيْكَ وَأَنَا أَوَّلُ الْمُؤْمِنِينَ
  trl: Wa-lammā jāʾa mūsā li-mīqātinā wa-kallamahu rabbuhu qāla rabbi arinī anẓur ilayka qāla lan tarānī wa-lākini nẓur ila l-jabali fa-ini staqarra makānahu fa-sawfa tarānī fa-lammā tajallā rabbuhu li-l-jabali jaʿalahu dakkan wa-kharra mūsā ṣaʿiqan fa-lammā afāqa qāla subḥānaka tubtu ilayka wa-anā awwalu l-muʾminīn
  trad: 'Et lorsque Mūsā vint à Notre rendez-vous, et que son Rabb lui adressa la parole (*kallamahu*), il dit : « Mon Rabb, montre-Toi à moi (*arinī*), que je Te contemple (*anẓur ilayka*). » Il dit : « Tu ne Me verras jamais (*lan tarānī*) — mais regarde vers la montagne : si elle demeure en sa place, alors tu Me verras. » Et quand son Rabb Se manifesta (*tajallā*) à la montagne, Il la rendit nivelée (*dakkan*), et Mūsā tomba foudroyé (*ṣaʿiqan*). Puis, lorsqu''il reprit connaissance (*afāqa*), il dit : « Gloire à Toi (*subḥānaka*) — je me repens vers Toi (*tubtu ilayka*), et je suis le premier des croyants. »'
- ref: S.7:144
  ar: قَالَ يَا مُوسَىٰ إِنِّي اصْطَفَيْتُكَ عَلَى النَّاسِ بِرِسَالَاتِي وَبِكَلَامِي فَخُذْ مَا آتَيْتُكَ وَكُنْ مِنَ الشَّاكِرِينَ
  trl: Qāla yā mūsā innī ṣṭafaytuka ʿala n-nāsi bi-risālātī wa-bi-kalāmī fa-khudh mā ātaytuka wa-kun mina sh-shākirīn
  trad: 'Il dit : « Ô Mūsā, Je t''ai élu (*iṣṭafaytuka*) sur les gens, par Mes messages (*risālāt*) et par Ma parole (*kalāmī*) — prends donc ce que Je t''ai donné, et sois du nombre des reconnaissants (*shākirīn*). »'
- ref: S.7:145
  ar: وَكَتَبْنَا لَهُ فِي الْأَلْوَاحِ مِنْ كُلِّ شَيْءٍ مَوْعِظَةً وَتَفْصِيلًا لِكُلِّ شَيْءٍ فَخُذْهَا بِقُوَّةٍ وَأْمُرْ قَوْمَكَ يَأْخُذُوا بِأَحْسَنِهَا ۚ سَأُرِيكُمْ دَارَ الْفَاسِقِينَ
  trl: Wa-katabnā lahu fi l-alwāḥi min kulli shayʾin mawʿiẓatan wa-tafṣīlan li-kulli shayʾin fa-khudhhā bi-quwwatin wa-mur qawmaka yaʾkhudhū bi-aḥsanihā sa-urīkum dāra l-fāsiqīn
  trad: Et Nous avons écrit (*katabnā*) pour lui, sur les Tables (*al-alwāḥ*), à partir de toute chose, une exhortation (*mawʿiẓa*) et un exposé détaillé (*tafṣīl*) de toute chose — prends-les donc avec fermeté (*bi-quwwatin*), et ordonne à ton peuple d'en prendre ce qu'il y a de meilleur — Je vous montrerai la demeure des *fāsiqīn*.
- ref: S.7:146
  ar: سَأَصْرِفُ عَنْ آيَاتِيَ الَّذِينَ يَتَكَبَّرُونَ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَإِنْ يَرَوْا كُلَّ آيَةٍ لَا يُؤْمِنُوا بِهَا وَإِنْ يَرَوْا سَبِيلَ الرُّشْدِ لَا يَتَّخِذُوهُ سَبِيلًا وَإِنْ يَرَوْا سَبِيلَ الْغَيِّ يَتَّخِذُوهُ سَبِيلًا ۚ ذَٰلِكَ بِأَنَّهُمْ كَذَّبُوا بِآيَاتِنَا وَكَانُوا عَنْهَا غَافِلِينَ
  trl: Sa-aṣrifu ʿan āyātiya lladhīna yatakabbarūna fi l-arḍi bi-ghayri l-ḥaqqi wa-in yaraw kulla āyatin lā yuʾminū bihā wa-in yaraw sabīla r-rushdi lā yattakhidhūhu sabīlan wa-in yaraw sabīla l-ghayyi yattakhidhūhu sabīlan dhālika bi-annahum kadhdhabū bi-āyātinā wa-kānū ʿanhā ghāfilīn
  trad: J'écarterai (*sa-aṣrifu*) de Mes *āyāt* ceux qui s'enflent d'orgueil sur la terre sans aucun droit — s'ils voient tout *āya*, ils n'y croient pas ; et s'ils voient le chemin de la droiture (*sabīl ar-rushd*), ils ne le prennent pas pour chemin ; mais s'ils voient le chemin de l'égarement (*sabīl al-ghayy*), ils le prennent pour chemin. Cela, parce qu'ils ont démenti Nos *āyāt* et qu'ils y étaient insouciants.
- ref: S.7:147
  ar: وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا وَلِقَاءِ الْآخِرَةِ حَبِطَتْ أَعْمَالُهُمْ ۚ هَلْ يُجْزَوْنَ إِلَّا مَا كَانُوا يَعْمَلُونَ
  trl: Wa-lladhīna kadhdhabū bi-āyātinā wa-liqāʾi l-ākhirati ḥabiṭat aʿmāluhum hal yujzawna illā mā kānū yaʿmalūn
  trad: Et ceux qui ont démenti Nos *āyāt* et la rencontre de l'Ultime (*liqāʾ al-ākhira*), leurs œuvres sont devenues vaines (*ḥabiṭat*) — seraient-ils rétribués autrement que pour ce qu'ils faisaient ?
- ref: S.7:148
  ar: وَاتَّخَذَ قَوْمُ مُوسَىٰ مِنْ بَعْدِهِ مِنْ حُلِيِّهِمْ عِجْلًا جَسَدًا لَهُ خُوَارٌ ۚ أَلَمْ يَرَوْا أَنَّهُ لَا يُكَلِّمُهُمْ وَلَا يَهْدِيهِمْ سَبِيلًا ۘ اتَّخَذُوهُ وَكَانُوا ظَالِمِينَ
  trl: Wa-ttakhadha qawmu mūsā min baʿdihi min ḥuliyyihim ʿijlan jasadan lahu khuwārun a-lam yaraw annahu lā yukallimuhum wa-lā yahdīhim sabīlan ittakhadhūhu wa-kānū ẓālimīn
  trad: Et le peuple de Mūsā prit, après lui, à partir de leurs parures (*ḥulī*), un veau (*ʿijl*) — un corps [inerte] (*jasad*) ayant un meuglement (*khuwār*). N'ont-ils pas vu qu'il ne leur parlait pas (*lā yukallimuhum*), et ne les guidait vers aucun chemin ? Ils le prirent [comme objet de culte], et ils étaient injustes (*ẓālimīn*).
- ref: S.7:149
  ar: وَلَمَّا سُقِطَ فِي أَيْدِيهِمْ وَرَأَوْا أَنَّهُمْ قَدْ ضَلُّوا قَالُوا لَئِنْ لَمْ يَرْحَمْنَا رَبُّنَا وَيَغْفِرْ لَنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ
  trl: Wa-lammā suqiṭa fī aydīhim wa-raʾaw annahum qad ḍallū qālū la-ʾin lam yarḥamnā rabbunā wa-yaghfir lanā la-nakūnanna mina l-khāsirīn
  trad: 'Et quand ils furent pris de profonds regrets (*suqiṭa fī aydīhim*) et qu''ils virent qu''ils s''étaient égarés (*ḍallū*), ils dirent : « Si notre Rabb ne nous fait pas miséricorde et ne nous pardonne pas, nous serons certainement du nombre des perdants (*al-khāsirīn*). »'
- ref: S.7:150
  ar: وَلَمَّا رَجَعَ مُوسَىٰ إِلَىٰ قَوْمِهِ غَضْبَانَ أَسِفًا قَالَ بِئْسَمَا خَلَفْتُمُونِي مِنْ بَعْدِي ۖ أَعَجِلْتُمْ أَمْرَ رَبِّكُمْ ۖ وَأَلْقَى الْأَلْوَاحَ وَأَخَذَ بِرَأْسِ أَخِيهِ يَجُرُّهُ إِلَيْهِ ۚ قَالَ ابْنَ أُمَّ إِنَّ الْقَوْمَ اسْتَضْعَفُونِي وَكَادُوا يَقْتُلُونَنِي فَلَا تُشْمِتْ بِيَ الْأَعْدَاءَ وَلَا تَجْعَلْنِي مَعَ الْقَوْمِ الظَّالِمِينَ
  trl: Wa-lammā rajaʿa mūsā ilā qawmihi ghaḍbāna asifan qāla biʾsamā khalaftumūnī min baʿdī a-ʿajiltum amra rabbikum wa-alqa l-alwāḥa wa-akhadha bi-raʾsi akhīhi yajurruhu ilayhi qāla bna umma inna l-qawma staḍʿafūnī wa-kādū yaqtulūnanī fa-lā tushmit biya l-aʿdāʾa wa-lā tajʿalnī maʿa l-qawmi ẓ-ẓālimīn
  trad: 'Et lorsque Mūsā revint à son peuple, en colère et affligé de regret (*ghaḍbāna asifan*), il dit : « Comme vous m''avez mal remplacé après moi ! Avez-vous voulu devancer (*a-ʿajiltum*) l''ordre de votre Rabb ? » Et il jeta les Tables, et saisit son frère par la tête, le tirant vers lui. Celui-ci dit : « Ô fils de ma mère (*ibna umma*) ! Le peuple m''a tenu pour faible, et ils ont failli me tuer — ne réjouis donc pas les ennemis à mes dépens (*lā tushmit biya l-aʿdāʾ*), et ne me place pas avec le peuple injuste. »'
- ref: S.7:151
  ar: قَالَ رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ ۖ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ
  trl: Qāla rabbi ghfir lī wa-li-akhī wa-adkhilnā fī raḥmatika wa-anta arḥamu r-rāḥimīn
  trad: 'Il [Mūsā] dit : « Mon Rabb, pardonne-moi, ainsi qu''à mon frère, et fais-nous entrer dans Ta miséricorde (*raḥma*) — Tu es le plus miséricordieux de ceux qui font miséricorde. »'
- ref: S.7:152
  ar: إِنَّ الَّذِينَ اتَّخَذُوا الْعِجْلَ سَيَنَالُهُمْ غَضَبٌ مِنْ رَبِّهِمْ وَذِلَّةٌ فِي الْحَيَاةِ الدُّنْيَا ۚ وَكَذَٰلِكَ نَجْزِي الْمُفْتَرِينَ
  trl: Inna lladhīna ttakhadhū l-ʿijla sa-yanāluhum ghaḍabun min rabbihim wa-dhillatun fi l-ḥayāti d-dunyā wa-kadhālika najzi l-muftarīn
  trad: Certes, ceux qui ont pris le veau [pour objet de culte], une réaction de rejet, un retrait de la faveur (*ghaḍab*), venant de leur Rabb, les atteindra, ainsi qu'un avilissement (*dhilla*) dans la vie d'ici-bas — c'est ainsi que Nous rétribuons ceux qui forgent le mensonge (*al-muftarīn*).
- ref: S.7:153
  ar: وَالَّذِينَ عَمِلُوا السَّيِّئَاتِ ثُمَّ تَابُوا مِنْ بَعْدِهَا وَآمَنُوا إِنَّ رَبَّكَ مِنْ بَعْدِهَا لَغَفُورٌ رَحِيمٌ
  trl: Wa-lladhīna ʿamilu s-sayyiʾāti thumma tābū min baʿdihā wa-āmanū inna rabbaka min baʿdihā la-ghafūrun raḥīm
  trad: Et ceux qui ont commis de mauvaises actions, puis se sont repentis (*tābū*) après cela et ont cru — ton Rabb, après cela, est certes *Ghafūr*, *Raḥīm*.
- ref: S.7:154
  ar: وَلَمَّا سَكَتَ عَنْ مُوسَى الْغَضَبُ أَخَذَ الْأَلْوَاحَ ۖ وَفِي نُسْخَتِهَا هُدًى وَرَحْمَةٌ لِلَّذِينَ هُمْ لِرَبِّهِمْ يَرْهَبُونَ
  trl: Wa-lammā sakata ʿan mūsa l-ghaḍabu akhadha l-alwāḥa wa-fī nuskhatihā hudan wa-raḥmatun li-lladhīna hum li-rabbihim yarhabūn
  trad: Et quand la colère se tut en Mūsā (*sakata ʿan mūsa l-ghaḍab*), il reprit les Tables — et dans leur transcription (*nuskha*) se trouvaient guidance et miséricorde pour ceux qui redoutent (*yarhabūn*) leur Rabb.
- ref: S.7:155
  ar: وَاخْتَارَ مُوسَىٰ قَوْمَهُ سَبْعِينَ رَجُلًا لِمِيقَاتِنَا ۖ فَلَمَّا أَخَذَتْهُمُ الرَّجْفَةُ قَالَ رَبِّ لَوْ شِئْتَ أَهْلَكْتَهُمْ مِنْ قَبْلُ وَإِيَّايَ ۖ أَتُهْلِكُنَا بِمَا فَعَلَ السُّفَهَاءُ مِنَّا ۖ إِنْ هِيَ إِلَّا فِتْنَتُكَ تُضِلُّ بِهَا مَنْ تَشَاءُ وَتَهْدِي مَنْ تَشَاءُ ۖ أَنْتَ وَلِيُّنَا فَاغْفِرْ لَنَا وَارْحَمْنَا ۖ وَأَنْتَ خَيْرُ الْغَافِرِينَ
  trl: Wa-khtāra mūsā qawmahu sabʿīna rajulan li-mīqātinā fa-lammā akhadhathumu r-rajfatu qāla rabbi law shiʾta ahlaktahum min qablu wa-iyyāya a-tuhlikunā bi-mā faʿala s-sufahāʾu minnā in hiya illā fitnatuka tuḍillu bihā man tashāʾu wa-tahdī man tashāʾu anta waliyyunā fa-ghfir lanā wa-rḥamnā wa-anta khayru l-ghāfirīn
  trad: 'Et Mūsā choisit, parmi son peuple, soixante-dix hommes pour Notre rendez-vous. Puis, quand le tremblement (*ar-rajfa*) les saisit, il dit : « Mon Rabb, si Tu avais voulu, Tu les aurais anéantis auparavant, ainsi que moi. Nous anéantirais-Tu pour ce qu''ont fait les insensés (*as-sufahāʾ*) parmi nous ? Ce n''est là que Ton épreuve (*fitnatuka*) : Tu égares par elle qui Tu veux, et Tu guides qui Tu veux — Tu es notre *walī*, pardonne-nous donc et fais-nous miséricorde — Tu es le meilleur de ceux qui pardonnent. »'
- ref: S.7:156
  ar: ۞ وَاكْتُبْ لَنَا فِي هَٰذِهِ الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ إِنَّا هُدْنَا إِلَيْكَ ۚ قَالَ عَذَابِي أُصِيبُ بِهِ مَنْ أَشَاءُ ۖ وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ ۚ فَسَأَكْتُبُهَا لِلَّذِينَ يَتَّقُونَ وَيُؤْتُونَ الزَّكَاةَ وَالَّذِينَ هُمْ بِآيَاتِنَا يُؤْمِنُونَ
  trl: Wa-ktub lanā fī hādhihi d-dunyā ḥasanatan wa-fi l-ākhirati innā hudnā ilayka qāla ʿadhābī uṣību bihi man ashāʾu wa-raḥmatī wasiʿat kulla shayʾin fa-sa-aktubuhā li-lladhīna yattaqūna wa-yuʾtūna z-zakāta wa-lladhīna hum bi-āyātinā yuʾminūn
  trad: '« Et inscris pour nous, dans cette vie d''ici-bas, le bien (*ḥasana*), ainsi que dans l''Ultime — nous voici revenus à Toi (*hudnā ilayka*). » Il dit : « Mon châtiment (*ʿadhābī*), J''en atteins qui Je veux ; mais Ma miséricorde (*raḥmatī*) a tout embrassé (*wasiʿat kulla shayʾ*) — Je l''inscrirai donc pour ceux qui se prémunissent (*yattaqūn*), qui s''acquittent de la *zakāt*, et pour ceux qui croient en Nos *āyāt*. »'
- ref: S.7:157
  ar: الَّذِينَ يَتَّبِعُونَ الرَّسُولَ النَّبِيَّ الْأُمِّيَّ الَّذِي يَجِدُونَهُ مَكْتُوبًا عِنْدَهُمْ فِي التَّوْرَاةِ وَالْإِنْجِيلِ يَأْمُرُهُمْ بِالْمَعْرُوفِ وَيَنْهَاهُمْ عَنِ الْمُنْكَرِ وَيُحِلُّ لَهُمُ الطَّيِّبَاتِ وَيُحَرِّمُ عَلَيْهِمُ الْخَبَائِثَ وَيَضَعُ عَنْهُمْ إِصْرَهُمْ وَالْأَغْلَالَ الَّتِي كَانَتْ عَلَيْهِمْ ۚ فَالَّذِينَ آمَنُوا بِهِ وَعَزَّرُوهُ وَنَصَرُوهُ وَاتَّبَعُوا النُّورَ الَّذِي أُنْزِلَ مَعَهُ ۙ أُولَٰئِكَ هُمُ الْمُفْلِحُونَ
  trl: Alladhīna yattabiʿūna r-rasūla n-nabiyya l-ummiyya lladhī yajidūnahu maktūban ʿindahum fi t-tawrāti wa-l-injīli yaʾmuruhum bi-l-maʿrūfi wa-yanhāhum ʿani l-munkari wa-yuḥillu lahumu ṭ-ṭayyibāti wa-yuḥarrimu ʿalayhimu l-khabāʾitha wa-yaḍaʿu ʿanhum iṣrahum wa-l-aghlāla llatī kānat ʿalayhim fa-lladhīna āmanū bihi wa-ʿazzarūhu wa-naṣarūhu wa-ttabaʿu n-nūra lladhī unzila maʿahu ulāʾika humu l-mufliḥūn
  trad: 'Ceux qui suivent le *rasūl*, le *nabī ummī* — celui qu''ils trouvent consigné par écrit (*maktūban*) auprès d''eux, dans la *Tawrāt* et l''*Injīl* — qui leur ordonne le *maʿrūf* et leur interdit le *munkar*, qui rend licites pour eux les bonnes choses (*ṭayyibāt*) et leur rend illicites les choses malsaines (*khabāʾith*), et qui ôte d''eux leur charge contraignante (*iṣr*) ainsi que les entraves (*aghlāl*) qui pesaient sur eux — ceux qui croient en lui, le soutiennent avec force (*ʿazzarūhu*), viennent à son secours (*naṣarūhu*) et suivent la lumière (*nūr*) descendue avec lui : ceux-là sont les *mufliḥūn*.'
- ref: S.7:158
  ar: قُلْ يَا أَيُّهَا النَّاسُ إِنِّي رَسُولُ اللَّهِ إِلَيْكُمْ جَمِيعًا الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۖ لَا إِلَٰهَ إِلَّا هُوَ يُحْيِي وَيُمِيتُ ۖ فَآمِنُوا بِاللَّهِ وَرَسُولِهِ النَّبِيِّ الْأُمِّيِّ الَّذِي يُؤْمِنُ بِاللَّهِ وَكَلِمَاتِهِ وَاتَّبِعُوهُ لَعَلَّكُمْ تَهْتَدُونَ
  trl: Qul yā ayyuhā n-nāsu innī rasūlu llāhi ilaykum jamīʿan alladhī lahu mulku s-samāwāti wa-l-arḍi lā ilāha illā huwa yuḥyī wa-yumītu fa-āminū bi-llāhi wa-rasūlihi n-nabiyyi l-ummiyyi lladhī yuʾminu bi-llāhi wa-kalimātihi wa-ttabiʿūhu laʿallakum tahtadūn
  trad: 'Dis : « Ô les humains, je suis pour vous tous le *rasūl* d''Allaah — Ce à qui appartient la royauté (*mulk*) des cieux et de la terre. Il n''est de *ilāh* que Lui — Il fait vivre et Il fait mourir. Croyez donc en Allaah et en Son *rasūl*, le *nabī ummī*, qui croit en Allaah et en Ses paroles (*kalimātihi*) — et suivez-le, peut-être serez-vous guidés (*tahtadūn*). »'
- ref: S.7:159
  ar: وَمِنْ قَوْمِ مُوسَىٰ أُمَّةٌ يَهْدُونَ بِالْحَقِّ وَبِهِ يَعْدِلُونَ
  trl: Wa-min qawmi mūsā ummatun yahdūna bi-l-ḥaqqi wa-bihi yaʿdilūn
  trad: Et parmi le peuple de Mūsā, il est une *umma* (communauté) qui guide par le *ḥaqq*, et c'est par lui qu'elle établit la justice (*yaʿdilūn*).
- ref: S.7:160
  ar: وَقَطَّعْنَاهُمُ اثْنَتَيْ عَشْرَةَ أَسْبَاطًا أُمَمًا ۚ وَأَوْحَيْنَا إِلَىٰ مُوسَىٰ إِذِ اسْتَسْقَاهُ قَوْمُهُ أَنِ اضْرِبْ بِعَصَاكَ الْحَجَرَ ۖ فَانْبَجَسَتْ مِنْهُ اثْنَتَا عَشْرَةَ عَيْنًا ۖ قَدْ عَلِمَ كُلُّ أُنَاسٍ مَشْرَبَهُمْ ۚ وَظَلَّلْنَا عَلَيْهِمُ الْغَمَامَ وَأَنْزَلْنَا عَلَيْهِمُ الْمَنَّ وَالسَّلْوَىٰ ۖ كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ ۚ وَمَا ظَلَمُونَا وَلَٰكِنْ كَانُوا أَنْفُسَهُمْ يَظْلِمُونَ
  trl: Wa-qaṭṭaʿnāhumu thnatay ʿashrata asbāṭan umaman wa-awḥaynā ilā mūsā idhi-stasqāhu qawmuhu ani-ḍrib bi-ʿaṣāka l-ḥajara fa-nbajasat minhu thnatā ʿashrata ʿaynan qad ʿalima kullu unāsin mashrabahum wa-ẓallalnā ʿalayhimu l-ghamāma wa-anzalnā ʿalayhimu l-manna wa-s-salwā kulū min ṭayyibāti mā razaqnākum wa-mā ẓalamūnā wa-lākin kānū anfusahum yaẓlimūn
  trad: 'Et Nous les avons partagés en douze branches (*asbāṭ*), en *umam* (communautés) — et Nous avons révélé à Mūsā, quand son peuple lui demanda de l''eau : « Frappe le rocher de ton bâton » — et douze sources en jaillirent, chaque groupe de gens connaissant son point d''abreuvement (*mashrab*). Nous avons étendu sur eux le nuage comme ombrage, et Nous avons fait descendre sur eux le *mann* et la *salwā* — « Mangez des bonnes choses (*ṭayyibāt*) dont Nous vous avons pourvus. » — et ils ne Nous ont pas causé de *ẓulm* : c''est à eux-mêmes qu''ils causaient le *ẓulm*.'
- ref: S.7:161
  ar: وَإِذْ قِيلَ لَهُمُ اسْكُنُوا هَٰذِهِ الْقَرْيَةَ وَكُلُوا مِنْهَا حَيْثُ شِئْتُمْ وَقُولُوا حِطَّةٌ وَادْخُلُوا الْبَابَ سُجَّدًا نَغْفِرْ لَكُمْ خَطِيئَاتِكُمْ ۚ سَنَزِيدُ الْمُحْسِنِينَ
  trl: Wa-idh qīla lahumu-skunū hādhihi l-qaryata wa-kulū minhā ḥaythu shiʾtum wa-qūlū ḥiṭṭatun wa-dkhulū l-bāba sujjadan naghfir lakum khaṭīʾātikum sa-nazīdu l-muḥsinīn
  trad: 'Et quand il leur fut dit : « Établissez-vous dans cette cité, mangez-en où vous voulez, dites *ḥiṭṭa*, et entrez par la porte en vous prosternant (*sujjadan*) — Nous vous pardonnerons vos fautes (*khaṭīʾāt*), et Nous accroîtrons [la part] des *muḥsinīn*. »'
- ref: S.7:162
  ar: فَبَدَّلَ الَّذِينَ ظَلَمُوا مِنْهُمْ قَوْلًا غَيْرَ الَّذِي قِيلَ لَهُمْ فَأَرْسَلْنَا عَلَيْهِمْ رِجْزًا مِنَ السَّمَاءِ بِمَا كَانُوا يَظْلِمُونَ
  trl: Fa-baddala lladhīna ẓalamū minhum qawlan ghayra lladhī qīla lahum fa-arsalnā ʿalayhim rijzan mina s-samāʾi bi-mā kānū yaẓlimūn
  trad: Mais ceux d'entre eux qui commirent le *ẓulm* substituèrent une autre parole à celle qui leur avait été dite — Nous avons alors envoyé sur eux un fléau (*rijz*) venu du ciel, pour le *ẓulm* qu'ils commettaient.
- ref: S.7:163
  ar: وَاسْأَلْهُمْ عَنِ الْقَرْيَةِ الَّتِي كَانَتْ حَاضِرَةَ الْبَحْرِ إِذْ يَعْدُونَ فِي السَّبْتِ إِذْ تَأْتِيهِمْ حِيتَانُهُمْ يَوْمَ سَبْتِهِمْ شُرَّعًا وَيَوْمَ لَا يَسْبِتُونَ ۙ لَا تَأْتِيهِمْ ۚ كَذَٰلِكَ نَبْلُوهُمْ بِمَا كَانُوا يَفْسُقُونَ
  trl: Wa-sʾalhum ʿani l-qaryati llatī kānat ḥāḍirata l-baḥri idh yaʿdūna fi s-sabti idh taʾtīhim ḥītānuhum yawma sabtihim shurraʿan wa-yawma lā yasbitūna lā taʾtīhim kadhālika nablūhum bi-mā kānū yafsuqūn
  trad: Et interroge-les sur la cité qui se trouvait au bord de la mer, quand ils transgressaient à propos du sabbat (*as-sabt*) — quand leurs poissons leur venaient, le jour de leur sabbat, en surface et à découvert (*shurraʿan*), et que le jour où ils ne gardaient pas le sabbat, ils ne leur venaient pas. C'est ainsi que Nous les éprouvions pour le *fisq* qu'ils commettaient.
- ref: S.7:164
  ar: وَإِذْ قَالَتْ أُمَّةٌ مِنْهُمْ لِمَ تَعِظُونَ قَوْمًا ۙ اللَّهُ مُهْلِكُهُمْ أَوْ مُعَذِّبُهُمْ عَذَابًا شَدِيدًا ۖ قَالُوا مَعْذِرَةً إِلَىٰ رَبِّكُمْ وَلَعَلَّهُمْ يَتَّقُونَ
  trl: Wa-idh qālat ummatun minhum lima taʿiẓūna qawman allāhu muhlikuhum aw muʿadhdhibuhum ʿadhāban shadīdan qālū maʿdhiratan ilā rabbikum wa-laʿallahum yattaqūn
  trad: 'Et quand une *umma* (communauté) parmi eux dit [à ceux qui avertissaient] : « Pourquoi exhortez-vous un peuple qu''Allaah va anéantir, ou tourmenter d''un tourment sévère ? » — ils répondirent : « Pour une excuse (*maʿdhira*) devant votre *Rabb* — et peut-être se prémuniront-ils (*yattaqūn*). »'
- ref: S.7:165
  ar: فَلَمَّا نَسُوا مَا ذُكِّرُوا بِهِ أَنْجَيْنَا الَّذِينَ يَنْهَوْنَ عَنِ السُّوءِ وَأَخَذْنَا الَّذِينَ ظَلَمُوا بِعَذَابٍ بَئِيسٍ بِمَا كَانُوا يَفْسُقُونَ
  trl: Fa-lammā nasū mā dhukkirū bihi anjaynā lladhīna yanhawna ʿani s-sūʾi wa-akhadhnā lladhīna ẓalamū bi-ʿadhābin baʾīsin bi-mā kānū yafsuqūn
  trad: Puis, lorsqu'ils oublièrent ce qui leur avait été rappelé, Nous avons sauvé ceux qui interdisaient le mal, et Nous avons saisi ceux qui commettaient le *ẓulm* d'un tourment rigoureux (*baʾīs*), pour le *fisq* qu'ils commettaient.
- ref: S.7:166
  ar: فَلَمَّا عَتَوْا عَنْ مَا نُهُوا عَنْهُ قُلْنَا لَهُمْ كُونُوا قِرَدَةً خَاسِئِينَ
  trl: Fa-lammā ʿataw ʿan mā nuhū ʿanhu qulnā lahum kūnū qiradatan khāsiʾīn
  trad: 'Puis, lorsqu''ils persistèrent avec insolence (*ʿataw*) dans ce qui leur avait été interdit, Nous leur avons dit : « Soyez des singes (*qiradatan*) réprouvés (*khāsiʾīn*). »'
- ref: S.7:167
  ar: وَإِذْ تَأَذَّنَ رَبُّكَ لَيَبْعَثَنَّ عَلَيْهِمْ إِلَىٰ يَوْمِ الْقِيَامَةِ مَنْ يَسُومُهُمْ سُوءَ الْعَذَابِ ۗ إِنَّ رَبَّكَ لَسَرِيعُ الْعِقَابِ ۖ وَإِنَّهُ لَغَفُورٌ رَحِيمٌ
  trl: Wa-idh taʾadhdhana rabbuka la-yabʿathanna ʿalayhim ilā yawmi l-qiyāmati man yasūmuhum sūʾa l-ʿadhābi inna rabbaka la-sarīʿu l-ʿiqābi wa-innahu la-ghafūrun raḥīm
  trad: Et quand ton *Rabb* annonça (*taʾadhdhana*) qu'Il susciterait certainement contre eux, jusqu'au jour de la résurrection, qui leur infligerait le pire des tourments — ton *Rabb* est certes prompt dans la rétribution (*sarīʿu l-ʿiqāb*), et Il est certes *Ghafūr*, *Raḥīm*.
- ref: S.7:168
  ar: وَقَطَّعْنَاهُمْ فِي الْأَرْضِ أُمَمًا ۖ مِنْهُمُ الصَّالِحُونَ وَمِنْهُمْ دُونَ ذَٰلِكَ ۖ وَبَلَوْنَاهُمْ بِالْحَسَنَاتِ وَالسَّيِّئَاتِ لَعَلَّهُمْ يَرْجِعُونَ
  trl: Wa-qaṭṭaʿnāhum fi l-arḍi umaman minhumu ṣ-ṣāliḥūna wa-minhum dūna dhālika wa-balawnāhum bi-l-ḥasanāti wa-s-sayyiʾāti laʿallahum yarjiʿūn
  trad: Et Nous les avons dispersés sur la terre en *umam* (communautés) — parmi eux les *ṣāliḥūn* (ceux qui agissent avec droiture), et parmi eux d'autres qui restent en deçà — et Nous les avons éprouvés par le bien et le mal (*al-ḥasanāt wa-s-sayyiʾāt*), peut-être reviendraient-ils (*yarjiʿūn*).
- ref: S.7:169
  ar: فَخَلَفَ مِنْ بَعْدِهِمْ خَلْفٌ وَرِثُوا الْكِتَابَ يَأْخُذُونَ عَرَضَ هَٰذَا الْأَدْنَىٰ وَيَقُولُونَ سَيُغْفَرُ لَنَا وَإِنْ يَأْتِهِمْ عَرَضٌ مِثْلُهُ يَأْخُذُوهُ ۚ أَلَمْ يُؤْخَذْ عَلَيْهِمْ مِيثَاقُ الْكِتَابِ أَنْ لَا يَقُولُوا عَلَى اللَّهِ إِلَّا الْحَقَّ وَدَرَسُوا مَا فِيهِ ۗ وَالدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ ۗ أَفَلَا تَعْقِلُونَ
  trl: Fa-khalafa min baʿdihim khalfun warithu l-kitāba yaʾkhudhūna ʿaraḍa hādhā l-adnā wa-yaqūlūna sa-yughfaru lanā wa-in yaʾtihim ʿaraḍun mithluhu yaʾkhudhūhu a-lam yuʾkhadh ʿalayhim mīthāqu l-kitābi an lā yaqūlū ʿalā llāhi illā l-ḥaqqa wa-darasū mā fīhi wa-d-dāru l-ākhiratu khayrun li-lladhīna yattaqūna a-fa-lā taʿqilūn
  trad: 'Puis leur succéda, après eux, une succession (*khalf*) qui hérita du Kitāb — ils prennent ce qui s''offre (*ʿaraḍ*) de ce bas monde, et disent : « Cela nous sera pardonné » — et si un bien semblable s''offre à nouveau à eux, ils le prennent encore. Ne leur a-t-il pas été pris un engagement (*mīthāq*) au sujet du Kitāb, qu''ils ne diraient sur Allaah que le *ḥaqq* ? Et ils en ont pourtant étudié le contenu (*darasū mā fīhi*). Or la demeure de l''Ultime est meilleure pour ceux qui se prémunissent (*yattaqūn*) — ne raisonnez-vous donc pas ?'
- ref: S.7:170
  ar: وَالَّذِينَ يُمَسِّكُونَ بِالْكِتَابِ وَأَقَامُوا الصَّلَاةَ إِنَّا لَا نُضِيعُ أَجْرَ الْمُصْلِحِينَ
  trl: Wa-lladhīna yumassikūna bi-l-kitābi wa-aqāmu ṣ-ṣalāta innā lā nuḍīʿu ajra l-muṣliḥīn
  trad: Et ceux qui s'attachent fermement (*yumassikūna*) au Kitāb et établissent la *ṣalāt* — Nous ne laissons pas se perdre la rétribution des *muṣliḥīn* (ceux qui œuvrent avec droiture).
- ref: S.7:171
  ar: ۞ وَإِذْ نَتَقْنَا الْجَبَلَ فَوْقَهُمْ كَأَنَّهُ ظُلَّةٌ وَظَنُّوا أَنَّهُ وَاقِعٌ بِهِمْ خُذُوا مَا آتَيْنَاكُمْ بِقُوَّةٍ وَاذْكُرُوا مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ
  trl: Wa-idh nataqna l-jabala fawqahum ka-annahu ẓullatun wa-ẓannū annahu wāqiʿun bihim khudhū mā ātaynākum bi-quwwatin wa-dhkurū mā fīhi laʿallakum tattaqūn
  trad: 'Et quand Nous avons soulevé (*nataqnā*) la montagne au-dessus d''eux, comme si elle était un dais (*ẓulla*), et qu''ils pensèrent qu''elle allait s''abattre sur eux : « Saisissez avec force ce que Nous vous avons donné, et rappelez-vous ce qui s''y trouve — peut-être vous prémunirez-vous (*tattaqūn*). »'
- ref: S.7:172
  ar: وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلَىٰ أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ ۖ قَالُوا بَلَىٰ ۛ شَهِدْنَا ۛ أَنْ تَقُولُوا يَوْمَ الْقِيَامَةِ إِنَّا كُنَّا عَنْ هَٰذَا غَافِلِينَ
  trl: Wa-idh akhadha rabbuka min banī ādama min ẓuhūrihim dhurriyyatahum wa-ashhadahum ʿalā anfusihim a-lastu bi-rabbikum qālū balā shahidnā an taqūlū yawma l-qiyāmati innā kunnā ʿan hādhā ghāfilīn
  trad: 'Et quand ton *Rabb* prit, des fils d''Ādam, de leurs reins, leur descendance (*dhurriyya*), et les fit témoigner contre eux-mêmes : « Ne suis-Je pas votre *Rabb* ? » — ils dirent : « Si, nous en témoignons » — afin que vous ne disiez pas, au jour de la résurrection : « Nous étions inattentifs (*ghāfilīn*) à cela. »'
- ref: S.7:173
  ar: أَوْ تَقُولُوا إِنَّمَا أَشْرَكَ آبَاؤُنَا مِنْ قَبْلُ وَكُنَّا ذُرِّيَّةً مِنْ بَعْدِهِمْ ۖ أَفَتُهْلِكُنَا بِمَا فَعَلَ الْمُبْطِلُونَ
  trl: Aw taqūlū innamā ashraka ābāʾunā min qablu wa-kunnā dhurriyyatan min baʿdihim a-fa-tuhlikunā bi-mā faʿala l-mubṭilūn
  trad: 'Ou que vous disiez : « Ce sont nos pères, avant nous, qui ont pratiqué le *shirk* — et nous n''étions qu''une descendance venue après eux. Vas-Tu donc nous anéantir pour ce qu''ont fait ceux qui tenaient le faux (*al-mubṭilūn*) ? »'
- ref: S.7:174
  ar: وَكَذَٰلِكَ نُفَصِّلُ الْآيَاتِ وَلَعَلَّهُمْ يَرْجِعُونَ
  trl: Wa-kadhālika nufaṣṣilu l-āyāti wa-laʿallahum yarjiʿūn
  trad: Et c'est ainsi que Nous détaillons (*nufaṣṣilu*) les *āyāt* — peut-être reviendraient-ils (*yarjiʿūn*).
- ref: S.7:175
  ar: وَاتْلُ عَلَيْهِمْ نَبَأَ الَّذِي آتَيْنَاهُ آيَاتِنَا فَانْسَلَخَ مِنْهَا فَأَتْبَعَهُ الشَّيْطَانُ فَكَانَ مِنَ الْغَاوِينَ
  trl: Wa-tlu ʿalayhim nabaʾa lladhī ātaynāhu āyātinā fa-nsalakha minhā fa-atbaʿahu sh-shayṭānu fa-kāna mina l-ghāwīn
  trad: Et récite-leur la nouvelle (*nabaʾ*) de celui à qui Nous avions donné Nos *āyāt*, et qui s'en dépouilla (*fa-nsalakha minhā*) — le *shayṭān* le prit alors en filature (*atbaʿahu*), et il fut du nombre des égarés (*al-ghāwīn*).
- ref: S.7:176
  ar: وَلَوْ شِئْنَا لَرَفَعْنَاهُ بِهَا وَلَٰكِنَّهُ أَخْلَدَ إِلَى الْأَرْضِ وَاتَّبَعَ هَوَاهُ ۚ فَمَثَلُهُ كَمَثَلِ الْكَلْبِ إِنْ تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ يَلْهَثْ ۚ ذَٰلِكَ مَثَلُ الْقَوْمِ الَّذِينَ كَذَّبُوا بِآيَاتِنَا ۚ فَاقْصُصِ الْقَصَصَ لَعَلَّهُمْ يَتَفَكَّرُونَ
  trl: Wa-law shiʾnā la-rafaʿnāhu bihā wa-lākinnahu akhlada ila l-arḍi wa-ttabaʿa hawāhu fa-mathaluhu ka-mathali l-kalbi in taḥmil ʿalayhi yalhath aw tatrukhu yalhath dhālika mathalu l-qawmi lladhīna kadhdhabū bi-āyātinā fa-qṣuṣi l-qaṣaṣa laʿallahum yatafakkarūn
  trad: 'Et si Nous avions voulu, Nous l''aurions élevé par elles (les *āyāt*) — mais il s''attacha à la terre (*akhlada ila l-arḍi*) et suivit son penchant (*hawāhu*). Il ressemble donc au chien : que tu le charges, il halète (*yalhath*) ; que tu le laisses, il halète encore. Telle est la parabole du peuple qui a démenti Nos *āyāt* — raconte donc ces récits (*aqṣuṣi l-qaṣaṣ*), peut-être réfléchiront-ils (*yatafakkarūn*).'
- ref: S.7:177
  ar: سَاءَ مَثَلًا الْقَوْمُ الَّذِينَ كَذَّبُوا بِآيَاتِنَا وَأَنْفُسَهُمْ كَانُوا يَظْلِمُونَ
  trl: Sāʾa mathalan l-qawmu lladhīna kadhdhabū bi-āyātinā wa-anfusahum kānū yaẓlimūn
  trad: Combien est mauvaise cette parabole (*sāʾa mathalan*) — le peuple qui a démenti Nos *āyāt*, et c'est envers eux-mêmes qu'ils commettaient le *ẓulm*.
- ref: S.7:178
  ar: مَنْ يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِي ۖ وَمَنْ يُضْلِلْ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ
  trl: Man yahdi llāhu fa-huwa l-muhtadī wa-man yuḍlil fa-ulāʾika humu l-khāsirūn
  trad: Quiconque Allaah guide, celui-là est bien guidé (*al-muhtadī*) — et quiconque Il égare, ceux-là sont les perdants (*al-khāsirūn*).
- ref: S.7:179
  ar: وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًا مِنَ الْجِنِّ وَالْإِنْسِ ۖ لَهُمْ قُلُوبٌ لَا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌ لَا يُبْصِرُونَ بِهَا وَلَهُمْ آذَانٌ لَا يَسْمَعُونَ بِهَا ۚ أُولَٰئِكَ كَالْأَنْعَامِ بَلْ هُمْ أَضَلُّ ۚ أُولَٰئِكَ هُمُ الْغَافِلُونَ
  trl: Wa-laqad dharaʾnā li-jahannama kathīran mina l-jinni wa-l-insi lahum qulūbun lā yafqahūna bihā wa-lahum aʿyunun lā yubṣirūna bihā wa-lahum ādhānun lā yasmaʿūna bihā ulāʾika ka-l-anʿāmi bal hum aḍallu ulāʾika humu l-ghāfilūn
  trad: Et Nous avons certes créé, en les multipliant (*dharaʾnā*), beaucoup de jinn et d'humains pour *jahannam* — ils ont des cœurs avec lesquels ils ne comprennent pas (*lā yafqahūna bihā*), des yeux avec lesquels ils ne voient pas, des oreilles avec lesquelles ils n'entendent pas. Ceux-là sont comme le bétail (*al-anʿām*) — non, ils sont plus égarés encore. Ceux-là sont les insouciants (*al-ghāfilūn*).
- ref: S.7:180
  ar: وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا ۖ وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ ۚ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ
  trl: Wa-lillāhi l-asmāʾu l-ḥusnā fa-dʿūhu bihā wa-dharū lladhīna yulḥidūna fī asmāʾihi sa-yujzawna mā kānū yaʿmalūn
  trad: 'Et à Allaah appartiennent les Noms de la plus grande excellence (*al-asmāʾ al-ḥusnā*) — invoquez-Le donc par eux — et laissez ceux qui dévient (*yulḥidūna*) au sujet de Ses Noms : ils seront rétribués pour ce qu''ils faisaient.'
- ref: S.7:181
  ar: وَمِمَّنْ خَلَقْنَا أُمَّةٌ يَهْدُونَ بِالْحَقِّ وَبِهِ يَعْدِلُونَ
  trl: Wa-mimman khalaqnā ummatun yahdūna bi-l-ḥaqqi wa-bihi yaʿdilūn
  trad: Et parmi ceux que Nous avons créés, il est une *umma* (communauté) qui guide par le *ḥaqq*, et c'est par lui qu'elle établit la justice (*yaʿdilūn*).
- ref: S.7:182
  ar: وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا سَنَسْتَدْرِجُهُمْ مِنْ حَيْثُ لَا يَعْلَمُونَ
  trl: Wa-lladhīna kadhdhabū bi-āyātinā sa-nastadrijuhum min ḥaythu lā yaʿlamūn
  trad: Et ceux qui ont démenti Nos *āyāt*, Nous les mènerons degré par degré (*sa-nastadrijuhum*) vers leur perte, par où ils ne savent pas.
- ref: S.7:183
  ar: وَأُمْلِي لَهُمْ ۚ إِنَّ كَيْدِي مَتِينٌ
  trl: Wa-umlī lahum inna kaydī matīn
  trad: Et Je leur accorde un délai (*umlī*) — Ma manœuvre (*kaydī*) est d'une fermeté inébranlable (*matīn*).
- ref: S.7:184
  ar: أَوَلَمْ يَتَفَكَّرُوا ۗ مَا بِصَاحِبِهِمْ مِنْ جِنَّةٍ ۚ إِنْ هُوَ إِلَّا نَذِيرٌ مُبِينٌ
  trl: A-wa-lam yatafakkarū mā bi-ṣāḥibihim min jinnatin in huwa illā nadhīrun mubīn
  trad: Est-ce qu'ils n'ont pas réfléchi (*a-wa-lam yatafakkarū*) ? Il n'y a, chez leur compagnon (*ṣāḥibihim*), nulle *jinna* (folie, possession) — il n'est qu'un avertisseur clair (*nadhīrun mubīn*).
- ref: S.7:185
  ar: أَوَلَمْ يَنْظُرُوا فِي مَلَكُوتِ السَّمَاوَاتِ وَالْأَرْضِ وَمَا خَلَقَ اللَّهُ مِنْ شَيْءٍ وَأَنْ عَسَىٰ أَنْ يَكُونَ قَدِ اقْتَرَبَ أَجَلُهُمْ ۖ فَبِأَيِّ حَدِيثٍ بَعْدَهُ يُؤْمِنُونَ
  trl: A-wa-lam yanẓurū fī malakūti s-samāwāti wa-l-arḍi wa-mā khalaqa llāhu min shayʾin wa-an ʿasā an yakūna qadi-qtaraba ajaluhum fa-bi-ayyi ḥadīthin baʿdahu yuʾminūn
  trad: Est-ce qu'ils n'ont pas observé le *malakūt* des cieux et de la terre, et tout ce qu'Allaah a créé, et [envisagé] qu'il se peut que leur terme se soit approché ? En quel discours (*ḥadīth*), après lui (ce Qurʾān), croiront-ils donc ?
- ref: S.7:186
  ar: مَنْ يُضْلِلِ اللَّهُ فَلَا هَادِيَ لَهُ ۚ وَيَذَرُهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ
  trl: Man yuḍlili llāhu fa-lā hādiya lahu wa-yadharuhum fī ṭughyānihim yaʿmahūn
  trad: Quiconque Allaah égare n'a pas de guide — et Il les laisse, dans leur transgression (*ṭughyān*), errer aveuglément (*yaʿmahūn*).
- ref: S.7:187
  ar: يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِنْدَ رَبِّي ۖ لَا يُجَلِّيهَا لِوَقْتِهَا إِلَّا هُوَ ۚ ثَقُلَتْ فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ لَا تَأْتِيكُمْ إِلَّا بَغْتَةً ۗ يَسْأَلُونَكَ كَأَنَّكَ حَفِيٌّ عَنْهَا ۖ قُلْ إِنَّمَا عِلْمُهَا عِنْدَ اللَّهِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ
  trl: Yasʾalūnaka ʿani s-sāʿati ayyāna mursāhā qul innamā ʿilmuhā ʿinda rabbī lā yujallīhā li-waqtihā illā huwa thaqulat fi s-samāwāti wa-l-arḍi lā taʾtīkum illā baghtatan yasʾalūnaka ka-annaka ḥafiyyun ʿanhā qul innamā ʿilmuhā ʿinda llāhi wa-lākinna akthara n-nāsi lā yaʿlamūn
  trad: 'Ils t''interrogent sur l''Heure : quand accostera-t-elle (*ayyāna mursāhā*) ? Dis : « Sa connaissance est seulement auprès de mon *Rabb* (*ʿinda rabbī*) — nul ne la dévoilera en son temps, sinon Lui. Elle pèse lourdement (*thaqulat*) dans les cieux et sur la terre — elle ne vous viendra qu''à l''improviste (*baghtatan*). » Ils t''interrogent comme si tu en étais profondément instruit (*ḥafiyyun ʿanhā*) — dis : « Sa connaissance est seulement auprès d''Allaah, mais la plupart des humains ne savent pas. »'
- ref: S.7:188
  ar: قُلْ لَا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا إِلَّا مَا شَاءَ اللَّهُ ۚ وَلَوْ كُنْتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ ۚ إِنْ أَنَا إِلَّا نَذِيرٌ وَبَشِيرٌ لِقَوْمٍ يُؤْمِنُونَ
  trl: Qul lā amliku li-nafsī nafʿan wa-lā ḍarran illā mā shāʾa llāhu wa-law kuntu aʿlamu l-ghayba la-stakthartu mina l-khayri wa-mā massaniya s-sūʾu in anā illā nadhīrun wa-bashīrun li-qawmin yuʾminūn
  trad: 'Dis : « Je ne détiens pour moi-même ni profit ni dommage, sauf ce qu''Allaah veut (*illā mā shāʾa llāh*). Et si je connaissais le *ghayb*, j''en aurais accumulé du bien, et le mal ne m''aurait pas touché. Je ne suis qu''un avertisseur et un annonciateur pour un peuple qui croit. »'
- ref: S.7:189
  ar: ۞ هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَجَعَلَ مِنْهَا زَوْجَهَا لِيَسْكُنَ إِلَيْهَا ۖ فَلَمَّا تَغَشَّاهَا حَمَلَتْ حَمْلًا خَفِيفًا فَمَرَّتْ بِهِ ۖ فَلَمَّا أَثْقَلَتْ دَعَوَا اللَّهَ رَبَّهُمَا لَئِنْ آتَيْتَنَا صَالِحًا لَنَكُونَنَّ مِنَ الشَّاكِرِينَ
  trl: Huwa lladhī khalaqakum min nafsin wāḥidatin wa-jaʿala minhā zawjahā li-yaskuna ilayhā fa-lammā taghashshāhā ḥamalat ḥamlan khafīfan fa-marrat bihi fa-lammā athqalat daʿawa llāha rabbahumā laʾin ātaytanā ṣāliḥan la-nakūnanna mina sh-shākirīn
  trad: 'Ce qui vous a créés d''un *nafs* unique, et a fait de lui son conjoint (*zawj*), pour qu''il trouve auprès d''elle l''apaisement (*li-yaskuna ilayhā*) — puis, quand il l''eut recouverte (*taghashshāhā*), elle porta une charge légère et circula avec elle ; puis, quand elle s''alourdit, tous deux invoquèrent Allaah, leur *Rabb* : « Si Tu nous donnes un [enfant] intègre (*ṣāliḥan*), nous serons certainement du nombre des reconnaissants (*ash-shākirīn*). »'
- ref: S.7:190
  ar: فَلَمَّا آتَاهُمَا صَالِحًا جَعَلَا لَهُ شُرَكَاءَ فِيمَا آتَاهُمَا ۚ فَتَعَالَى اللَّهُ عَمَّا يُشْرِكُونَ
  trl: Fa-lammā ātāhumā ṣāliḥan jaʿalā lahu shurakāʾa fīmā ātāhumā fa-taʿālā llāhu ʿammā yushrikūn
  trad: Puis, quand Il leur eut donné un [enfant] intègre, tous deux Lui attribuèrent des associés (*shurakāʾa*) dans ce qu'Il leur avait donné — mais Allaah transcende (*taʿālā*) ce qu'ils Lui associent.
- ref: S.7:191
  ar: أَيُشْرِكُونَ مَا لَا يَخْلُقُ شَيْئًا وَهُمْ يُخْلَقُونَ
  trl: A-yushrikūna mā lā yakhluqu shayʾan wa-hum yukhlaqūn
  trad: Lui associent-ils ce qui ne crée rien, et qui est lui-même créé ?
- ref: S.7:192
  ar: وَلَا يَسْتَطِيعُونَ لَهُمْ نَصْرًا وَلَا أَنْفُسَهُمْ يَنْصُرُونَ
  trl: Wa-lā yastaṭīʿūna lahum naṣran wa-lā anfusahum yanṣurūn
  trad: Et [ces associés] ne sont capables ni de leur porter secours, ni de se porter secours à eux-mêmes.
- ref: S.7:193
  ar: وَإِنْ تَدْعُوهُمْ إِلَى الْهُدَىٰ لَا يَتَّبِعُوكُمْ ۚ سَوَاءٌ عَلَيْكُمْ أَدَعَوْتُمُوهُمْ أَمْ أَنْتُمْ صَامِتُونَ
  trl: Wa-in tadʿūhum ila l-hudā lā yattabiʿūkum sawāʾun ʿalaykum a-daʿawtumūhum am antum ṣāmitūn
  trad: Et si vous les appelez vers la guidance, ils ne vous suivront pas — il est égal pour vous que vous les appeliez ou que vous restiez silencieux.
- ref: S.7:194
  ar: إِنَّ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللَّهِ عِبَادٌ أَمْثَالُكُمْ ۖ فَادْعُوهُمْ فَلْيَسْتَجِيبُوا لَكُمْ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Inna lladhīna tadʿūna min dūni llāhi ʿibādun amthālukum fa-dʿūhum fa-l-yastajībū lakum in kuntum ṣādiqīn
  trad: Ceux que vous invoquez en dehors d'Allaah sont des serviteurs (*ʿibādun*) semblables à vous — appelez-les donc, qu'ils vous répondent, si vous êtes véridiques !
- ref: S.7:195
  ar: أَلَهُمْ أَرْجُلٌ يَمْشُونَ بِهَا ۖ أَمْ لَهُمْ أَيْدٍ يَبْطِشُونَ بِهَا ۖ أَمْ لَهُمْ أَعْيُنٌ يُبْصِرُونَ بِهَا ۖ أَمْ لَهُمْ آذَانٌ يَسْمَعُونَ بِهَا ۗ قُلِ ادْعُوا شُرَكَاءَكُمْ ثُمَّ كِيدُونِ فَلَا تُنْظِرُونِ
  trl: A-lahum arjulun yamshūna bihā am lahum aydin yabṭishūna bihā am lahum aʿyunun yubṣirūna bihā am lahum ādhānun yasmaʿūna bihā quli-dʿū shurakāʾakum thumma kīdūni fa-lā tunẓirūn
  trad: 'Ont-ils des jambes avec lesquelles ils marchent ? Ou ont-ils des mains avec lesquelles ils saisissent avec force (*yabṭishūna*) ? Ou ont-ils des yeux avec lesquels ils voient ? Ou ont-ils des oreilles avec lesquelles ils entendent ? Dis : « Appelez vos associés, puis manœuvrez (*kīdūni*) contre moi, et ne m''accordez aucun répit ! »'
- ref: S.7:196
  ar: إِنَّ وَلِيِّيَ اللَّهُ الَّذِي نَزَّلَ الْكِتَابَ ۖ وَهُوَ يَتَوَلَّى الصَّالِحِينَ
  trl: Inna waliyyiya llāhu lladhī nazzala l-kitāba wa-huwa yatawallā ṣ-ṣāliḥīn
  trad: Mon *walī*, c'est Allaah, qui a fait descendre le Kitāb — et c'est Lui qui prend en charge (*yatawallā*) les *ṣāliḥūn*.
- ref: S.7:197
  ar: وَالَّذِينَ تَدْعُونَ مِنْ دُونِهِ لَا يَسْتَطِيعُونَ نَصْرَكُمْ وَلَا أَنْفُسَهُمْ يَنْصُرُونَ
  trl: Wa-lladhīna tadʿūna min dūnihi lā yastaṭīʿūna naṣrakum wa-lā anfusahum yanṣurūn
  trad: Et ceux que vous invoquez en dehors de Lui ne peuvent ni vous secourir, ni se secourir eux-mêmes.
- ref: S.7:198
  ar: وَإِنْ تَدْعُوهُمْ إِلَى الْهُدَىٰ لَا يَسْمَعُوا ۖ وَتَرَاهُمْ يَنْظُرُونَ إِلَيْكَ وَهُمْ لَا يُبْصِرُونَ
  trl: Wa-in tadʿūhum ila l-hudā lā yasmaʿū wa-tarāhum yanẓurūna ilayka wa-hum lā yubṣirūn
  trad: Et si vous les appelez vers la guidance, ils n'entendent pas — et tu les vois qui te regardent (*yanẓurūna ilayka*), alors qu'ils ne voient pas (*lā yubṣirūn*).
- ref: S.7:199
  ar: خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ
  trl: Khudhi l-ʿafwa wa-ʾmur bi-l-ʿurfi wa-aʿriḍ ʿani l-jāhilīn
  trad: Prends ce qui est aisément donné (*al-ʿafw*), ordonne ce qui est reconnu comme convenable (*al-ʿurf*), et détourne-toi des *jāhilūn* (les ignorants).
- ref: S.7:200
  ar: وَإِمَّا يَنْزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ ۚ إِنَّهُ سَمِيعٌ عَلِيمٌ
  trl: Wa-immā yanzaghannaka mina sh-shayṭāni nazghun fa-staʿidh billāhi innahu samīʿun ʿalīm
  trad: Et si jamais une incitation (*nazghun*) du *shayṭān* venait à te pousser (*yanzaghannaka*), cherche refuge (*fa-staʿidh*) auprès d'Allaah — Il est *Samīʿ*, *ʿAlīm*.
- ref: S.7:201
  ar: إِنَّ الَّذِينَ اتَّقَوْا إِذَا مَسَّهُمْ طَائِفٌ مِنَ الشَّيْطَانِ تَذَكَّرُوا فَإِذَا هُمْ مُبْصِرُونَ
  trl: Inna lladhīna-ttaqaw idhā massahum ṭāʾifun mina sh-shayṭāni tadhakkarū fa-idhā hum mubṣirūn
  trad: Ceux qui se prémunissent (*ittaqaw*), quand un attouchement (*ṭāʾifun*) du *shayṭān* les touche, se souviennent (*tadhakkarū*) — et alors les voilà clairvoyants (*mubṣirūn*).
- ref: S.7:202
  ar: وَإِخْوَانُهُمْ يَمُدُّونَهُمْ فِي الْغَيِّ ثُمَّ لَا يُقْصِرُونَ
  trl: Wa-ikhwānuhum yamuddūnahum fi l-ghayyi thumma lā yuqṣirūn
  trad: Et leurs frères ([les *shayāṭīn*], *ikhwānuhum*) les entraînent (*yamuddūnahum*) plus avant dans l'égarement (*al-ghayy*), sans jamais s'arrêter (*lā yuqṣirūn*).
- ref: S.7:203
  ar: وَإِذَا لَمْ تَأْتِهِمْ بِآيَةٍ قَالُوا لَوْلَا اجْتَبَيْتَهَا ۚ قُلْ إِنَّمَا أَتَّبِعُ مَا يُوحَىٰ إِلَيَّ مِنْ رَبِّي ۚ هَٰذَا بَصَائِرُ مِنْ رَبِّكُمْ وَهُدًى وَرَحْمَةٌ لِقَوْمٍ يُؤْمِنُونَ
  trl: Wa-idhā lam taʾtihim bi-āyatin qālū lawlā-jtabaytahā qul innamā attabiʿu mā yūḥā ilayya min rabbī hādhā baṣāʾiru min rabbikum wa-hudan wa-raḥmatun li-qawmin yuʾminūn
  trad: 'Et quand tu ne leur apportes pas de *āya*, ils disent : « Pourquoi ne l''as-tu pas choisie toi-même (*lawlā-jtabaytahā*) ? » Dis : « Je ne fais que suivre ce qui m''est révélé de mon *Rabb* — ceci sont des clartés (*baṣāʾiru*) venant de votre *Rabb*, une guidance et une *raḥma* pour un peuple qui croit. »'
- ref: S.7:204
  ar: وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ
  trl: Wa-idhā quriʾa l-qurʾānu fa-stamiʿū lahu wa-anṣitū laʿallakum turḥamūn
  trad: Et quand le Qurʾān est récité, écoutez-le, et gardez le silence (*anṣitū*) — peut-être bénéficierez-vous de la *raḥma* (*turḥamūn*).
- ref: S.7:205
  ar: وَاذْكُرْ رَبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ بِالْغُدُوِّ وَالْآصَالِ وَلَا تَكُنْ مِنَ الْغَافِلِينَ
  trl: Wa-dhkur rabbaka fī nafsika taḍarruʿan wa-khīfatan wa-dūna l-jahri mina l-qawli bi-l-ghuduwwi wa-l-āṣāli wa-lā takun mina l-ghāfilīn
  trad: Et rappelle-toi ton *Rabb* en toi-même (*fī nafsika*), avec une humilité insistante (*taḍarruʿan*) et par crainte (*khīfatan*), sans élever la voix dans la parole, au matin et en fin de jour (*bi-l-ghuduwwi wa-l-āṣāl*) — et ne sois pas du nombre des insouciants (*al-ghāfilīn*).
- ref: S.7:206
  ar: إِنَّ الَّذِينَ عِنْدَ رَبِّكَ لَا يَسْتَكْبِرُونَ عَنْ عِبَادَتِهِ وَيُسَبِّحُونَهُ وَلَهُ يَسْجُدُونَ ۩
  trl: Inna lladhīna ʿinda rabbika lā yastakbirūna ʿan ʿibādatihi wa-yusabbiḥūnahu wa-lahu yasjudūn
  trad: Certes, ceux qui sont auprès de ton *Rabb* (*ʿinda rabbika*) ne dédaignent pas de L'adorer (*lā yastakbirūna ʿan ʿibādatihi*), Le glorifient (*yusabbiḥūnahu*), et c'est à Lui qu'ils se prosternent (*yasjudūn*).
