- ref: 'S.26:1'
  ar: 'طسم'
  trl: 'Ṭā-Sīn-Mīm'
  trad: 'Ṭā. Sīn. Mīm.'
- ref: 'S.26:2'
  ar: 'تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ'
  trl: 'Tilka āyātu l-kitābi l-mubīn'
  trad: 'Voilà les *āyāt* du Kitāb explicite (*al-mubīn*).'
- ref: 'S.26:3'
  ar: 'لَعَلَّكَ بَاخِعٌ نَفْسَكَ أَلَّا يَكُونُوا مُؤْمِنِينَ'
  trl: 'Laʿallaka bākhiʿun nafsaka allā yakūnū muʾminīn'
  trad: 'Peut-être vas-tu te consumer toi-même (*bākhiʿun nafsaka*), parce qu''ils ne sont pas *muʾminūn*.'
- ref: 'S.26:4'
  ar: 'إِنْ نَشَأْ نُنَزِّلْ عَلَيْهِمْ مِنَ السَّمَاءِ آيَةً فَظَلَّتْ أَعْنَاقُهُمْ لَهَا خَاضِعِينَ'
  trl: 'In nashaʾ nunazzil ʿalayhim mina s-samāʾi āyatan fa-ẕallat aʿnāquhum lahā khāḑiʿīn'
  trad: 'Si Nous voulions, Nous ferions descendre sur eux, du ciel, un signe (*āya*) devant lequel leurs cous resteraient (*fa-ẕallat*) en pleine soumission (*khāḑiʿīn*).'
- ref: 'S.26:5'
  ar: 'وَمَا يَأْتِيهِمْ مِنْ ذِكْرٍ مِنَ الرَّحْمَٰنِ مُحْدَثٍ إِلَّا كَانُوا عَنْهُ مُعْرِضِينَ'
  trl: 'Wa-mā yaʾtīhim min dhikrin mina r-raḥmāni muḥdathin illā kānū ʿanhu muʿriḑīn'
  trad: 'Or, pas un *dhikr* (rappel), nouvellement reçu (*muḥdath*) d''*ar-Raḥmān*, ne leur vient sans qu''ils ne s''en détournent (*muʿriḑīn*).'
- ref: 'S.26:6'
  ar: 'فَقَدْ كَذَّبُوا فَسَيَأْتِيهِمْ أَنْبَاءُ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ'
  trl: 'Fa-qad kadhdhabū fa-sayaʾtīhim anbāʾu mā kānū bihi yastahziʾūn'
  trad: 'Ils ont donc démenti — les nouvelles (*anbāʾ*) de ce dont ils se sont moqués leur parviendront bientôt.'
- ref: 'S.26:7'
  ar: 'أَوَلَمْ يَرَوْا إِلَى الْأَرْضِ كَمْ أَنْبَتْنَا فِيهَا مِنْ كُلِّ زَوْجٍ كَرِيمٍ'
  trl: 'Awalam yarawā ilā l-arḑi kam anbatnā fīhā min kulli zawjin karīm'
  trad: 'N''ont-ils donc pas vu la terre — combien Nous y avons fait germer, de toute espèce (*zawj*) noble (*karīm*) ?'
- ref: 'S.26:8–9'
  ar: 'إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ ۝ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'En cela, assurément, un signe (*āya*) — mais la plupart d''entre eux ne sont pas *muʾminūn*. Et ton Rabb est assurément, Lui, *al-ʿAzīz*, *ar-Raḥīm*.'
- ref: 'S.26:10–11'
  ar: 'وَإِذْ نَادَىٰ رَبُّكَ مُوسَىٰ أَنِ ائْتِ الْقَوْمَ الظَّالِمِينَ ۝ قَوْمَ فِرْعَوْنَ ۚ أَلَا يَتَّقُونَ'
  trl: 'Wa-idh nādā rabbuka mūsā ani ʾti l-qawma ẕ-ẕālimīn — qawma firʿawna alā yataqqūn'
  trad: 'Et quand ton Rabb appela (*nādā*) Mūsā : « Va vers le peuple injuste (*aẕ-ẕālimīn*) — le peuple de Firʿawn. Ne vont-ils donc pas se prémunir (*yataqqūn*) ? »'
- ref: 'S.26:12–14'
  ar: 'قَالَ رَبِّ إِنِّي أَخَافُ أَنْ يُكَذِّبُونِ ۝ وَيَضِيقُ صَدْرِي وَلَا يَنْطَلِقُ لِسَانِي فَأَرْسِلْ إِلَىٰ هَارُونَ ۝ وَلَهُمْ عَلَيَّ ذَنْبٌ فَأَخَافُ أَنْ يَقْتُلُونِ'
  trl: 'Qāla rabbi innī akhāfu an yukadhdhibūn — wa-yaḑīqu ṣadrī wa-lā yanṭaliqu lisānī fa-arsil ilā hārūn — wa-lahum ʿalayya dhanbun fa-akhāfu an yaqtulūn'
  trad: 'Il dit : « Mon Rabb, je crains qu''ils ne me démentent (*an yukadhdhibūni*), que ma poitrine ne se resserre (*yaḑīqu ṣadrī*), que ma langue ne se délie pas (*lā yanṭaliqu lisānī*) — envoie donc [quelqu''un] vers Hārūn. Et il y a, sur moi, une faute (*dhanb*) qui les concerne — je crains donc qu''ils ne me tuent. »'
- ref: 'S.26:15–17'
  ar: 'قَالَ كَلَّا ۖ فَاذْهَبَا بِآيَاتِنَا ۖ إِنَّا مَعَكُمْ مُسْتَمِعُونَ ۝ فَأْتِيَا فِرْعَوْنَ فَقُولَا إِنَّا رَسُولُ رَبِّ الْعَالَمِينَ ۝ أَنْ أَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ'
  trl: 'Qāla kallā — fa-dhhabā bi-āyātinā innā maʿakum mustamiʿūn — fa-ʾtiyā firʿawna fa-qūlā innā rasūlu rabbi l-ʿālamīn — an arsil maʿanā banī isrāʾīl'
  trad: 'Il dit : « Non, pas du tout. Allez-y donc tous deux, avec Nos *āyāt* — Nous sommes, avec vous, à l''écoute (*mustamiʿūn*). Allez donc tous deux vers Firʿawn, et dites : “Nous sommes le *rasūl* du Rabb des *ʿālamīn* — renvoie avec nous les Banū Isrāʾīl.” »'
- ref: 'S.26:18–19'
  ar: 'قَالَ أَلَمْ نُرَبِّكَ فِينَا وَلِيدًا وَلَبِثْتَ فِينَا مِنْ عُمُرِكَ سِنِينَ ۝ وَفَعَلْتَ فَعْلَتَكَ الَّتِي فَعَلْتَ وَأَنْتَ مِنَ الْكَافِرِينَ'
  trl: 'Qāla alam nurabbika fīnā walīdan wa-labithta fīnā min ʿumurika sinīn — wa-faʿalta faʿlataka llatī faʿalta wa-anta mina l-kāfirīn'
  trad: 'Il [Firʿawn] dit : « Ne t''avons-Nous pas élevé (*nurabbika*) parmi nous, tout enfant (*walīdan*), et n''as-tu pas demeuré parmi nous des années de ta vie ? Puis tu as fait le fait que tu as fait (*faʿalta faʿlataka llatī faʿalta*), et tu es du nombre des *kāfirīn*. »'
- ref: 'S.26:20–22'
  ar: 'قَالَ فَعَلْتُهَا إِذًا وَأَنَا مِنَ الضَّالِّينَ ۝ فَفَرَرْتُ مِنْكُمْ لَمَّا خِفْتُكُمْ فَوَهَبَ لِي رَبِّي حُكْمًا وَجَعَلَنِي مِنَ الْمُرْسَلِينَ ۝ وَتِلْكَ نِعْمَةٌ تَمُنُّهَا عَلَيَّ أَنْ عَبَّدْتَ بَنِي إِسْرَائِيلَ'
  trl: 'Qāla faʿaltuhā idhan wa-anā mina ḑ-ḑāllīn — fa-fararttu minkum lammā khiftukum fa-wahaba lī rabbī ḥukman wa-jaʿalanī mina l-mursalīn — wa-tilka niʿmatun tamunnuhā ʿalayya an ʿabbadta banī isrāʾīl'
  trad: 'Il [Mūsā] dit : « Je l''ai faite, alors, étant du nombre des égarés (*aḑ-ḑāllīn*). Puis j''ai fui, loin de vous, quand je vous ai craints — et mon Rabb m''a fait don (*wahaba*) d''un *ḥukm*, et m''a établi parmi les *mursalūn*. Et ce bienfait (*niʿma*) dont tu me fais grief (*tamunnuhā*) — [tu me le rappelles] alors que tu as asservi (*ʿabbadta*) les Banū Isrāʾīl ! »'
- ref: 'S.26:23'
  ar: 'قَالَ فِرْعَوْنُ وَمَا رَبُّ الْعَالَمِينَ'
  trl: 'Qāla firʿawnu wa-mā rabbu l-ʿālamīn'
  trad: 'Firʿawn dit : « Et qu''est-ce donc que le Rabb des *ʿālamīn* ? »'
- ref: 'S.26:24'
  ar: 'قَالَ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا ۖ إِنْ كُنْتُمْ مُوقِنِينَ'
  trl: 'Qāla rabbu s-samāwāti wa-l-arḑi wa-mā baynahumā in kuntum mūqinīn'
  trad: 'Il [Mūsā] dit : « Le Rabb des cieux et de la terre, et de ce qui est entre les deux — si vous [cherchez à] être de ceux qui savent avec certitude (*mūqinīn*). »'
- ref: 'S.26:25'
  ar: 'قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ'
  trl: 'Qāla li-man ḥawlahu alā tastamiʿūn'
  trad: 'Il [Firʿawn] dit à ceux qui l''entouraient : « N''écoutez-vous donc pas ? »'
- ref: 'S.26:26'
  ar: 'قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ'
  trl: 'Qāla rabbukum wa-rabbu ābāʾikumu l-awwalīn'
  trad: 'Il [Mūsā] dit : « Votre Rabb, et le Rabb de vos pères, les tout premiers (*al-awwalīn*). »'
- ref: 'S.26:27'
  ar: 'قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٌ'
  trl: 'Qāla inna rasūlakumu lladhī ursila ilaykum la-majnūn'
  trad: 'Il [Firʿawn] dit : « Votre *rasūl*, celui qui vous a été envoyé, est assurément atteint de folie (*la-majnūn*). »'
- ref: 'S.26:28'
  ar: 'قَالَ رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ وَمَا بَيْنَهُمَا ۖ إِنْ كُنْتُمْ تَعْقِلُونَ'
  trl: 'Qāla rabbu l-mashriqi wa-l-maghribi wa-mā baynahumā in kuntum taʿqilūn'
  trad: 'Il [Mūsā] dit : « Le Rabb de l''orient (*al-mashriq*) et de l''occident (*al-maghrib*), et de ce qui est entre les deux — si vous raisonnez (*taʿqilūn*). »'
- ref: 'S.26:29'
  ar: 'قَالَ لَئِنِ اتَّخَذْتَ إِلَٰهًا غَيْرِي لَأَجْعَلَنَّكَ مِنَ الْمَسْجُونِينَ'
  trl: 'Qāla la-ini ttakhadhta ilāhan ghayrī la-ajʿalannaka mina l-masjūnīn'
  trad: 'Il [Firʿawn] dit : « Si tu prends un *ilāh* autre que moi, je te mettrai assurément parmi les emprisonnés (*al-masjūnīn*). »'
- ref: 'S.26:30'
  ar: 'قَالَ أَوَلَوْ جِئْتُكَ بِشَيْءٍ مُبِينٍ'
  trl: 'Qāla awalaw jiʾtuka bi-shayʾin mubīn'
  trad: 'Il [Mūsā] dit : « Même si je t''apportais quelque chose de manifeste (*mubīn*) ? »'
- ref: 'S.26:31'
  ar: 'قَالَ فَأْتِ بِهِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ'
  trl: 'Qāla fa-ʾti bihi in kunta mina ṣ-ṣādiqīn'
  trad: 'Il [Firʿawn] dit : « Apporte-le donc, si tu es du nombre des véridiques (*aṣ-ṣādiqīn*). »'
- ref: 'S.26:32'
  ar: 'فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُبِينٌ'
  trl: 'Fa-alqā ʿaṣāhu fa-idhā hiya thuʿbānun mubīn'
  trad: 'Il jeta alors son bâton (*ʿaṣā*) — et voici qu''il fut un grand serpent (*thuʿbān*) manifeste (*mubīn*).'
- ref: 'S.26:33'
  ar: 'وَنَزَعَ يَدَهُ فَإِذَا هِيَ بَيْضَاءُ لِلنَّاظِرِينَ'
  trl: 'Wa-nazaʿa yadahu fa-idhā hiya bayḑāʾu li-n-nāẕirīn'
  trad: 'Et il retira sa main (*yad*) — et voici qu''elle était blanche (*bayḑāʾ*) pour ceux qui regardaient (*li-n-nāẕirīn*).'
- ref: 'S.26:34'
  ar: 'قَالَ لِلْمَلَإِ حَوْلَهُ إِنَّ هَٰذَا لَسَاحِرٌ عَلِيمٌ'
  trl: 'Qāla li-l-malaʾi ḥawlahu inna hādhā la-sāḥirun ʿalīm'
  trad: 'Il [Firʿawn] dit à l''assemblée des notables (*al-malaʾ*) qui l''entourait : « Celui-ci est assurément un *sāḥir* savant (*ʿalīm*). »'
- ref: 'S.26:35'
  ar: 'يُرِيدُ أَنْ يُخْرِجَكُمْ مِنْ أَرْضِكُمْ بِسِحْرِهِ فَمَاذَا تَأْمُرُونَ'
  trl: 'Yurīdu an yukhrijakum min arḑikum bi-siḥrihi fa-mādhā taʾmurūn'
  trad: '« Il veut vous faire sortir de votre terre par son *siḥr* — que commandez-vous donc (*taʾmurūn*) ? »'
- ref: 'S.26:36–37'
  ar: 'قَالُوا أَرْجِهْ وَأَخَاهُ وَابْعَثْ فِي الْمَدَائِنِ حَاشِرِينَ ۝ يَأْتُوكَ بِكُلِّ سَحَّارٍ عَلِيمٍ'
  trl: 'Qālū arjih wa-akhāhu wa-bʿath fi l-madāʾini ḥāshirīn — yaʾtūka bi-kulli saḥḥārin ʿalīm'
  trad: 'Ils dirent : « Accorde-lui un délai (*arjih*) — à lui et à son frère — et envoie, dans les cités, des rassembleurs (*ḥāshirīn*) : qu''ils t''amènent tout *saḥḥār* savant. »'
- ref: 'S.26:38–39'
  ar: 'فَجُمِعَ السَّحَرَةُ لِمِيقَاتِ يَوْمٍ مَعْلُومٍ ۝ وَقِيلَ لِلنَّاسِ هَلْ أَنْتُمْ مُجْتَمِعُونَ'
  trl: 'Fa-jumiʿa s-saḥaratu li-mīqāti yawmin maʿlūm — wa-qīla li-n-nāsi hal antum mujtamiʿūn'
  trad: 'Les *saḥara* furent donc rassemblés pour le rendez-vous (*mīqāt*) d''un jour fixé (*maʿlūm*) — et il fut dit aux gens (*an-nās*) : « Vous rassemblerez-vous ? »'
- ref: 'S.26:40'
  ar: 'لَعَلَّنَا نَتَّبِعُ السَّحَرَةَ إِنْ كَانُوا هُمُ الْغَالِبِينَ'
  trl: 'Laʿallanā nattabiʿu s-saḥarata in kānū humu l-ghālibīn'
  trad: '— peut-être suivrons-nous les *saḥara*, s''ils sont, eux, les vainqueurs (*al-ghālibīn*) ?'
- ref: 'S.26:41–42'
  ar: 'فَلَمَّا جَاءَ السَّحَرَةُ قَالُوا لِفِرْعَوْنَ أَئِنَّ لَنَا لَأَجْرًا إِنْ كُنَّا نَحْنُ الْغَالِبِينَ ۝ قَالَ نَعَمْ وَإِنَّكُمْ إِذًا لَمِنَ الْمُقَرَّبِينَ'
  trl: 'Fa-lammā jāʾa s-saḥaratu qālū li-firʿawna aʾinna lanā la-ajran in kunnā naḥnu l-ghālibīn — qāla naʿam wa-innakum idhan la-mina l-muqarrabīn'
  trad: 'Quand les *saḥara* vinrent, ils dirent à Firʿawn : « Y aura-t-il, assurément, pour nous, une rétribution (*ajr*), si c''est nous qui sommes les vainqueurs ? » Il dit : « Oui — et vous serez alors, assurément, du nombre des rapprochés (*al-muqarrabīn*). »'
- ref: 'S.26:43'
  ar: 'قَالَ لَهُمْ مُوسَىٰ أَلْقُوا مَا أَنْتُمْ مُلْقُونَ'
  trl: 'Qāla lahum mūsā alqū mā antum mulqūn'
  trad: 'Mūsā leur dit : « Jetez ce que vous avez à jeter. »'
- ref: 'S.26:44'
  ar: 'فَأَلْقَوْا حِبَالَهُمْ وَعِصِيَّهُمْ وَقَالُوا بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ الْغَالِبُونَ'
  trl: 'Fa-alqaw ḥibālahum wa-ʿiṣiyyahum wa-qālū bi-ʿizzati firʿawna innā la-naḥnu l-ghālibūn'
  trad: 'Ils jetèrent alors leurs cordes (*ḥibāl*) et leurs bâtons (*ʿiṣiyy*), et dirent : « Par la force (*ʿizza*) de Firʿawn, c''est nous, assurément, qui sommes les vainqueurs ! »'
- ref: 'S.26:45'
  ar: 'فَأَلْقَىٰ مُوسَىٰ عَصَاهُ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ'
  trl: 'Fa-alqā mūsā ʿaṣāhu fa-idhā hiya talqafu mā yaʾfikūn'
  trad: 'Mūsā jeta alors son bâton (*ʿaṣā*) — et voici qu''il engloutissait (*talqafu*) ce qu''ils avaient fabriqué par artifice (*mā yaʾfikūn*).'
- ref: 'S.26:46'
  ar: 'فَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ'
  trl: 'Fa-ulqiya s-saḥaratu sājidīn'
  trad: 'Les *saḥara* furent alors jetés (*ulqiya*) — prosternés (*sājidīn*).'
- ref: 'S.26:47–48'
  ar: 'قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝ رَبِّ مُوسَىٰ وَهَارُونَ'
  trl: 'Qālū āmannā bi-rabbi l-ʿālamīn — rabbi mūsā wa-hārūn'
  trad: 'Ils dirent : « Nous reconnaissons comme véridique (*āmannā*) le Rabb des *ʿālamīn* — le Rabb de Mūsā et de Hārūn. »'
- ref: 'S.26:49'
  ar: 'قَالَ آمَنْتُمْ لَهُ قَبْلَ أَنْ آذَنَ لَكُمْ ۖ إِنَّهُ لَكَبِيرُكُمُ الَّذِي عَلَّمَكُمُ السِّحْرَ فَلَسَوْفَ تَعْلَمُونَ ۚ لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُمْ مِنْ خِلَافٍ وَلَأُصَلِّبَنَّكُمْ أَجْمَعِينَ'
  trl: 'Qāla āmantum lahu qabla an ādhana lakum — innahu la-kabīrukumu lladhī ʿallamakumu s-siḥra fa-la-sawfa taʿlamūn — la-uqaṭṭiʿanna aydiyakum wa-arjulakum min khilāfin wa-la-uṣallibannakum ajmaʿīn'
  trad: 'Il dit : « Vous lui avez accordé foi avant que je ne vous l''autorise ? C''est assurément lui votre maître (*kabīrukum*), celui qui vous a enseigné le *siḥr* — vous saurez bientôt ! Je vous couperai assurément les mains et les pieds en opposition (*min khilāf*), et je vous crucifierai assurément, vous tous ensemble. »'
- ref: 'S.26:50–51'
  ar: 'قَالُوا لَا ضَيْرَ ۖ إِنَّا إِلَىٰ رَبِّنَا مُنْقَلِبُونَ ۝ إِنَّا نَطْمَعُ أَنْ يَغْفِرَ لَنَا رَبُّنَا خَطَايَانَا أَنْ كُنَّا أَوَّلَ الْمُؤْمِنِينَ'
  trl: 'Qālū lā ḑayra — innā ilā rabbinā munqalibūn — innā naṭmaʿu an yaghfira lanā rabbunā khaṭāyānā an kunnā awwala l-muʾminīn'
  trad: 'Ils dirent : « Il n''y a aucun mal (*lā ḑayra*) ! C''est vers notre Rabb que nous retournons (*munqalibūn*). Nous espérons ardemment (*naṭmaʿu*) que notre Rabb nous pardonne nos fautes (*khaṭāyānā*), pour avoir été les tout premiers des *muʾminūn*. »'
- ref: 'S.26:52'
  ar: '۞ وَأَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنْ أَسْرِ بِعِبَادِي إِنَّكُمْ مُتَّبَعُونَ'
  trl: 'Wa-awḥaynā ilā mūsā an asri bi-ʿibādī innakum muttabaʿūn'
  trad: 'Et Nous avons révélé (*awḥaynā*) à Mūsā : « Pars de nuit (*asri*) avec Mes *ʿibād* — vous serez assurément poursuivis (*muttabaʿūn*). »'
- ref: 'S.26:53'
  ar: 'فَأَرْسَلَ فِرْعَوْنُ فِي الْمَدَائِنِ حَاشِرِينَ'
  trl: 'Fa-arsala firʿawnu fi l-madāʾini ḥāshirīn'
  trad: 'Firʿawn envoya alors, dans les cités, des rassembleurs (*ḥāshirīn*).'
- ref: 'S.26:54–56'
  ar: 'إِنَّ هَٰؤُلَاءِ لَشِرْذِمَةٌ قَلِيلُونَ ۝ وَإِنَّهُمْ لَنَا لَغَائِظُونَ ۝ وَإِنَّا لَجَمِيعٌ حَاذِرُونَ'
  trl: 'Inna hāʾulāʾi la-shirdhimatun qalīlūn — wa-innahum lanā la-ghāʾiẓūn — wa-innā la-jamīʿun ḥādhirūn'
  trad: '« Ceux-là sont assurément une bande (*shirdhima*) dérisoire, peu nombreux — et ils sont, pour nous, assurément une source d''irritation (*ghāʾiẓūn*) — et nous sommes, tous ensemble, assurément sur nos gardes (*ḥādhirūn*). »'
- ref: 'S.26:57–59'
  ar: 'فَأَخْرَجْنَاهُمْ مِنْ جَنَّاتٍ وَعُيُونٍ ۝ وَكُنُوزٍ وَمَقَامٍ كَرِيمٍ ۝ كَذَٰلِكَ وَأَوْرَثْنَاهَا بَنِي إِسْرَائِيلَ'
  trl: 'Fa-akhrajnāhum min jannātin wa-ʿuyūn — wa-kunūzin wa-maqāmin karīm — kadhālika wa-awrathnāhā banī isrāʾīl'
  trad: 'Nous les avons donc fait sortir de jardins (*jannāt*) et de sources (*ʿuyūn*), et de trésors (*kunūz*), et d''un séjour (*maqām*) noble (*karīm*) — ainsi [en fut-il] — et Nous en avons fait hériter (*awrathnāhā*) les Banū Isrāʾīl.'
- ref: 'S.26:60'
  ar: 'فَأَتْبَعُوهُمْ مُشْرِقِينَ'
  trl: 'Fa-atbaʿūhum mushriqīn'
  trad: 'Ils les poursuivirent (*atbaʿūhum*) donc, au lever du soleil (*mushriqīn*).'
- ref: 'S.26:61'
  ar: 'فَلَمَّا تَرَاءَى الْجَمْعَانِ قَالَ أَصْحَابُ مُوسَىٰ إِنَّا لَمُدْرَكُونَ'
  trl: 'Fa-lammā tarāʾā l-jamʿāni qāla aṣḥābu mūsā innā la-mudrakūn'
  trad: 'Quand les deux groupes (*al-jamʿān*) se virent l''un l''autre, les compagnons de Mūsā dirent : « Nous allons assurément être rattrapés (*mudrakūn*) ! »'
- ref: 'S.26:62'
  ar: 'قَالَ كَلَّا ۖ إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ'
  trl: 'Qāla kallā — inna maʿiya rabbī sa-yahdīni'
  trad: 'Il [Mūsā] dit : « Absolument pas ! Mon Rabb est avec moi (*maʿiya*) — Il me guidera. »'
- ref: 'S.26:63–64'
  ar: 'فَأَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنِ اضْرِبْ بِعَصَاكَ الْبَحْرَ ۖ فَانْفَلَقَ فَكَانَ كُلُّ فِرْقٍ كَالطَّوْدِ الْعَظِيمِ ۝ وَأَزْلَفْنَا ثَمَّ الْآخَرِينَ'
  trl: 'Fa-awḥaynā ilā mūsā ani-ḑrib bi-ʿaṣāka l-baḥra fa-nfalaqa fa-kāna kullu firqin ka-ṭ-ṭawdi l-ʿaẕīm — wa-azlafnā thamma l-ākharīn'
  trad: 'Nous révélâmes alors à Mūsā : « Frappe la mer de ton bâton » — elle se fendit (*fa-nfalaqa*) alors, et chaque partie (*firq*) fut comme une montagne (*ṭawd*) immense — et Nous fîmes approcher (*azlafnā*), là, les autres.'
- ref: 'S.26:65–66'
  ar: 'وَأَنْجَيْنَا مُوسَىٰ وَمَنْ مَعَهُ أَجْمَعِينَ ۝ ثُمَّ أَغْرَقْنَا الْآخَرِينَ'
  trl: 'Wa-anjaynā mūsā wa-man maʿahu ajmaʿīn — thumma aghraqnā l-ākharīn'
  trad: 'Et Nous sauvâmes (*anjaynā*) Mūsā et tous ceux qui étaient avec lui, ensemble — puis Nous noyâmes (*aghraqnā*) les autres.'
- ref: 'S.26:67–68'
  ar: 'إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ ۝ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'En cela, assurément, un signe (*āya*) — mais la plupart d''entre eux ne sont pas *muʾminūn*. Et ton Rabb est assurément, Lui, *al-ʿAzīz*, *ar-Raḥīm*.'
- ref: 'S.26:69'
  ar: 'وَاتْلُ عَلَيْهِمْ نَبَأَ إِبْرَاهِيمَ'
  trl: 'Wa-tlu ʿalayhim nabaʾa ibrāhīm'
  trad: 'Et récite-leur le récit (nabaʾ) d''Ibrāhīm.'
- ref: 'S.26:70'
  ar: 'إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَا تَعْبُدُونَ'
  trl: 'Idh qāla li-abīhi wa-qawmihi mā taʿbudūn'
  trad: 'Quand il dit à son père et à son peuple : « Qu''adorez-vous ? »'
- ref: 'S.26:71'
  ar: 'قَالُوا نَعْبُدُ أَصْنَامًا فَنَظَلُّ لَهَا عَاكِفِينَ'
  trl: 'Qālū naʿbudu aṣnāman fa-naẓallu lahā ʿākifīn'
  trad: 'Ils dirent : « Nous adorons des idoles (aṣnām), et nous demeurons attachés à elles avec assiduité (ʿākifīn). »'
- ref: 'S.26:72–73'
  ar: 'قَالَ هَلْ يَسْمَعُونَكُمْ إِذْ تَدْعُونَ أَوْ يَنْفَعُونَكُمْ أَوْ يَضُرُّونَ'
  trl: 'Qāla hal yasmaʿūnakum idh tadʿūn aw yanfaʿūnakum aw yaḑurrūn'
  trad: 'Il dit : « Vous entendent-elles (yasmaʿūnakum) quand vous les invoquez ? Ou vous profitent-elles, ou vous nuisent-elles ? »'
- ref: 'S.26:74'
  ar: 'قَالُوا بَلْ وَجَدْنَا آبَاءَنَا كَذَٰلِكَ يَفْعَلُونَ'
  trl: 'Qālū bal wajadnā ābāʾanā ka-dhālika yafʿalūn'
  trad: 'Ils dirent : « Non, mais nous avons trouvé (wajadnā) nos pères agissant ainsi. »'
- ref: 'S.26:75–77'
  ar: 'قَالَ أَفَرَأَيْتُمْ مَا كُنْتُمْ تَعْبُدُونَ أَنْتُمْ وَآبَاؤُكُمُ الْأَقْدَمُونَ فَإِنَّهُمْ عَدُوٌّ لِي إِلَّا رَبَّ الْعَالَمِينَ'
  trl: 'Qāla a-fa-raʾaytum mā kuntum taʿbudūn — antum wa-ābāʾukumu l-aqdamūn — fa-innahum ʿaduwwun lī illā rabba l-ʿālamīn'
  trad: 'Il dit : « Avez-vous donc vu ce que vous adoriez, vous et vos ancêtres les plus reculés (al-aqdamūn) ? Ils sont pour moi un ennemi (ʿaduww) — sauf le Rabb des ʿālamīn, »'
- ref: 'S.26:78–79'
  ar: 'الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ'
  trl: 'Alladhī khalaqanī fa-huwa yahdīn — wa-lladhī huwa yuṭʿimunī wa-yasqīn'
  trad: 'Ce qui m''a créé — et c''est Lui qui me guide ; et Ce qui me nourrit et m''abreuve ;'
- ref: 'S.26:80–82'
  ar: 'وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ وَالَّذِي يُمِيتُنِي ثُمَّ يُحْيِينِ وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ'
  trl: 'Wa-idhā mariḑtu fa-huwa yashfīn — wa-lladhī yumītunī thumma yuḥyīn — wa-lladhī aṭmaʿu an yaghfira lī khaṭīʾatī yawma d-dīn'
  trad: 'et quand je suis malade (mariḑtu), c''est Lui qui me guérit (yashfīn) ; et Ce qui me fait mourir, puis me fait revivre ; et Ce qui, je l''espère ardemment (aṭmaʿu), me pardonnera ma faute (khaṭīʾa) au jour du dīn.'
- ref: 'S.26:83'
  ar: 'رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ'
  trl: 'Rabbi hab lī ḥukman wa-alḥiqnī bi-ṣ-ṣāliḥīn'
  trad: 'Mon Rabb, accorde-moi un ḥukm, et fais-moi rejoindre (alḥiqnī) les ṣāliḥīn.'
- ref: 'S.26:84'
  ar: 'وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ'
  trl: 'Wa-jʿal lī lisāna ṣidqin fi l-ākhirīn'
  trad: 'Et accorde-moi une renommée de vérité (lisān ṣidq) parmi ceux qui viendront après (al-ākhirīn).'
- ref: 'S.26:85'
  ar: 'وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ'
  trl: 'Wa-jʿalnī min warathati jannati n-naʿīm'
  trad: 'Et fais de moi un héritier (min warathati) du jardin (janna) du naʿīm.'
- ref: 'S.26:86'
  ar: 'وَاغْفِرْ لِأَبِي إِنَّهُ كَانَ مِنَ الضَّالِّينَ'
  trl: 'Wa-ghfir li-abī innahu kāna mina ḑ-ḑāllīn'
  trad: 'Et pardonne à mon père — il était du nombre des égarés (aḑ-ḑāllīn).'
- ref: 'S.26:87'
  ar: 'وَلَا تُخْزِنِي يَوْمَ يُبْعَثُونَ'
  trl: 'Wa-lā tukhzinī yawma yubʿathūn'
  trad: 'Et ne m''humilie pas (lā tukhzinī) le jour où ils seront ressuscités (yubʿathūn).'
- ref: 'S.26:88–89'
  ar: 'يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ'
  trl: 'Yawma lā yanfaʿu mālun wa-lā banūn — illā man atā llāha bi-qalbin salīm'
  trad: 'le jour où ni richesse (māl) ni fils (banūn) ne profiteront — sauf à qui vient à Allaah avec un cœur intact (qalb salīm).'
- ref: 'S.26:90–91'
  ar: 'وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ وَبُرِّزَتِ الْجَحِيمُ لِلْغَاوِينَ'
  trl: 'Wa-uzlifati l-jannatu li-l-muttaqīn — wa-burrizati l-jaḥīmu li-l-ghāwīn'
  trad: 'Et le jardin (janna) sera rapproché (uzlifat) pour les muttaqīn — et la fournaise (jaḥīm) sera exposée à découvert (burrizat) pour les égarés (al-ghāwīn).'
- ref: 'S.26:92–93'
  ar: 'وَقِيلَ لَهُمْ أَيْنَ مَا كُنْتُمْ تَعْبُدُونَ مِنْ دُونِ اللَّهِ هَلْ يَنْصُرُونَكُمْ أَوْ يَنْتَصِرُونَ'
  trl: 'Wa-qīla lahum ayna mā kuntum taʿbudūn — min dūni llāhi hal yanṣurūnakum aw yantaṣirūn'
  trad: 'Et il leur sera dit : « Où est ce que vous adoriez en dehors d''Allaah ? Vous secourent-ils, ou se secourent-ils eux-mêmes ? »'
- ref: 'S.26:94–95'
  ar: 'فَكُبْكِبُوا فِيهَا هُمْ وَالْغَاوُونَ وَجُنُودُ إِبْلِيسَ أَجْمَعُونَ'
  trl: 'Fa-kubkibū fīhā hum wa-l-ghāwūn — wa-junūdu iblīsa ajmaʿūn'
  trad: 'Ils y seront alors culbutés (kubkibū) — eux [ce qu''ils adoraient], et les égarés, et les troupes (junūd) d''Iblīs, tous ensemble.'
- ref: 'S.26:96–98'
  ar: 'قَالُوا وَهُمْ فِيهَا يَخْتَصِمُونَ تَاللَّهِ إِنْ كُنَّا لَفِي ضَلَالٍ مُبِينٍ إِذْ نُسَوِّيكُمْ بِرَبِّ الْعَالَمِينَ'
  trl: 'Qālū wa-hum fīhā yakhtaṣimūn — ta-llāhi in kunnā la-fī ḑalālin mubīn — idh nusawwīkum bi-rabbi l-ʿālamīn'
  trad: 'Ils diront, tandis qu''ils s''y disputeront (yakhtaṣimūn) : « Par Allaah, nous étions assurément dans un égarement manifeste, quand nous vous égalions (nusawwīkum) au Rabb des ʿālamīn,'
- ref: 'S.26:99–101'
  ar: 'وَمَا أَضَلَّنَا إِلَّا الْمُجْرِمُونَ فَمَا لَنَا مِنْ شَافِعِينَ وَلَا صَدِيقٍ حَمِيمٍ'
  trl: 'Wa-mā aḑallanā illā l-mujrimūn — fa-mā lanā min shāfiʿīn — wa-lā ṣadīqin ḥamīm'
  trad: 'et seuls les coupables (al-mujrimūn) nous ont égarés — nous n''avons donc ni shāfiʿīn, ni ami chaleureux (ṣadīq ḥamīm). »'
- ref: 'S.26:102'
  ar: 'فَلَوْ أَنَّ لَنَا كَرَّةً فَنَكُونَ مِنَ الْمُؤْمِنِينَ'
  trl: 'Fa-law anna lanā karratan fa-nakūna mina l-muʾminīn'
  trad: 'Si seulement nous avions un retour (karra), nous serions du nombre des muʾminūn !'
- ref: 'S.26:103–104'
  ar: 'إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'En cela, assurément, un signe (āya) — mais la plupart d''entre eux ne sont pas muʾminūn. Et ton Rabb est assurément, Lui, al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.26:105'
  ar: 'كَذَّبَتْ قَوْمُ نُوحٍ الْمُرْسَلِينَ'
  trl: 'Kadhdhabat qawmu nūḥin al-mursalīn'
  trad: 'Le peuple de Nūḥ traita de menteurs les envoyés (al-mursalīn).'
- ref: 'S.26:106–107'
  ar: 'إِذْ قَالَ لَهُمْ أَخُوهُمْ نُوحٌ أَلَا تَتَّقُونَ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ'
  trl: 'Idh qāla lahum akhūhum nūḥun alā tattaqūn — innī lakum rasūlun amīn'
  trad: 'Quand leur frère (akhūhum) Nūḥ leur dit : « Ne vous prémunirez-vous donc pas ? Je suis pour vous un rasūl digne de confiance (amīn). »'
- ref: 'S.26:108–110'
  ar: 'فَاتَّقُوا اللَّهَ وَأَطِيعُونِ وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ فَاتَّقُوا اللَّهَ وَأَطِيعُونِ'
  trl: 'Fa-ttaqū llāha wa-aṭīʿūn — wa-mā asʾalukum ʿalayhi min ajrin in ajriya illā ʿalā rabbi l-ʿālamīn — fa-ttaqū llāha wa-aṭīʿūn'
  trad: '« Prémunissez-vous donc d''Allaah, et obéissez-moi. Et je ne vous demande, pour cela, aucune rémunération (ajr) — ma rémunération n''incombe qu''au Rabb des ʿālamīn. Prémunissez-vous donc d''Allaah, et obéissez-moi. »'
- ref: 'S.26:111'
  ar: '۞ قَالُوا أَنُؤْمِنُ لَكَ وَاتَّبَعَكَ الْأَرْذَلُونَ'
  trl: 'Qālū a-nuʾminu laka wa-ttabaʿaka l-arḏalūn'
  trad: '۞ Ils dirent : « Croirions-nous en toi, alors que t''ont suivi les plus vils (al-arḏalūn) ? »'
- ref: 'S.26:112–115'
  ar: 'قَالَ وَمَا عِلْمِي بِمَا كَانُوا يَعْمَلُونَ إِنْ حِسَابُهُمْ إِلَّا عَلَىٰ رَبِّي ۖ لَوْ تَشْعُرُونَ وَمَا أَنَا بِطَارِدِ الْمُؤْمِنِينَ إِنْ أَنَا إِلَّا نَذِيرٌ مُبِينٌ'
  trl: 'Qāla wa-mā ʿilmī bimā kānū yaʿmalūn — in ḥisābuhum illā ʿalā rabbī law tashʿurūn — wa-mā anā bi-ṭāridi l-muʾminīn — in anā illā nadhīrun mubīn'
  trad: 'Il dit : « Et que sais-je de ce qu''ils faisaient ? Leur compte (ḥisāb) n''incombe qu''à mon Rabb — si seulement vous perceviez ! Et je ne suis pas de ceux qui chassent (ṭārid) les muʾminūn. Je ne suis qu''un avertisseur clair (nadhīrun mubīn). »'
- ref: 'S.26:116'
  ar: 'قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا نُوحُ لَتَكُونَنَّ مِنَ الْمَرْجُومِينَ'
  trl: 'Qālū la-in lam tantahi yā nūḥu la-takūnanna mina l-marjūmīn'
  trad: 'Ils dirent : « Si tu ne cesses pas, ô Nūḥ, tu seras assurément du nombre des lapidés (al-marjūmīn). »'
- ref: 'S.26:117–118'
  ar: 'قَالَ رَبِّ إِنَّ قَوْمِي كَذَّبُونِ فَافْتَحْ بَيْنِي وَبَيْنَهُمْ فَتْحًا وَنَجِّنِي وَمَنْ مَعِيَ مِنَ الْمُؤْمِنِينَ'
  trl: 'Qāla rabbi inna qawmī kadhdhabūn — fa-ftaḥ baynī wa-baynahum fatḥan wa-najjinī wa-man maʿiya mina l-muʾminīn'
  trad: 'Il dit : « Mon Rabb, mon peuple m''a traité de menteur. Tranche (fa-ftaḥ) donc entre moi et eux par une décision ouverte et sans appel (fatḥan), et sauve-moi, et qui est avec moi parmi les muʾminūn. »'
- ref: 'S.26:119–120'
  ar: 'فَأَنْجَيْنَاهُ وَمَنْ مَعَهُ فِي الْفُلْكِ الْمَشْحُونِ ثُمَّ أَغْرَقْنَا بَعْدُ الْبَاقِينَ'
  trl: 'Fa-anjaynāhu wa-man maʿahu fi l-fulki l-mashḥūn — thumma aghraqnā baʿdu l-bāqīn'
  trad: 'Nous le sauvâmes alors, lui et qui était avec lui, dans l''arche chargée (al-fulk al-mashḥūn) — puis Nous noyâmes, après cela, ceux qui restaient (al-bāqīn).'
- ref: 'S.26:121–122'
  ar: 'إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'En cela, assurément, un signe (āya) — mais la plupart d''entre eux ne sont pas muʾminūn. Et ton Rabb est assurément, Lui, al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.26:123'
  ar: 'كَذَّبَتْ عَادٌ الْمُرْسَلِينَ'
  trl: 'Kadhdhabat ʿādun al-mursalīn'
  trad: 'ʿĀd traita de menteurs les envoyés (al-mursalīn).'
- ref: 'S.26:124–127'
  ar: 'إِذْ قَالَ لَهُمْ أَخُوهُمْ هُودٌ أَلَا تَتَّقُونَ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ فَاتَّقُوا اللَّهَ وَأَطِيعُونِ وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ'
  trl: 'Idh qāla lahum akhūhum hūdun alā tattaqūn — innī lakum rasūlun amīn — fa-ttaqū llāha wa-aṭīʿūn — wa-mā asʾalukum ʿalayhi min ajrin in ajriya illā ʿalā rabbi l-ʿālamīn'
  trad: 'Quand leur frère Hūd leur dit : « Ne vous prémunirez-vous donc pas ? Je suis pour vous un rasūl digne de confiance. Prémunissez-vous donc d''Allaah, et obéissez-moi. Et je ne vous demande, pour cela, aucune rémunération — ma rémunération n''incombe qu''au Rabb des ʿālamīn. »'
- ref: 'S.26:128–129'
  ar: 'أَتَبْنُونَ بِكُلِّ رِيعٍ آيَةً تَعْبَثُونَ وَتَتَّخِذُونَ مَصَانِعَ لَعَلَّكُمْ تَخْلُدُونَ'
  trl: 'A-tabnūna bi-kulli rīʿin āyatan taʿbathūn — wa-tattakhidhūna maṣāniʿa laʿallakum takhludūn'
  trad: '« Bâtissez-vous, sur chaque hauteur (rīʿ), un monument (āya), par pur divertissement (taʿbathūn) ? Et vous édifiez des forteresses (maṣāniʿ), espérant peut-être y demeurer indéfiniment (takhludūn) ? »'
- ref: 'S.26:130'
  ar: 'وَإِذَا بَطَشْتُمْ بَطَشْتُمْ جَبَّارِينَ'
  trl: 'Wa-idhā baṭashtum baṭashtum jabbārīn'
  trad: '« Et quand vous frappez (baṭashtum), vous frappez en tyrans (jabbārīn). »'
- ref: 'S.26:131'
  ar: 'فَاتَّقُوا اللَّهَ وَأَطِيعُونِ'
  trl: 'Fa-ttaqū llāha wa-aṭīʿūn'
  trad: '« Prémunissez-vous donc d''Allaah, et obéissez-moi. »'
- ref: 'S.26:132–134'
  ar: 'وَاتَّقُوا الَّذِي أَمَدَّكُمْ بِمَا تَعْلَمُونَ أَمَدَّكُمْ بِأَنْعَامٍ وَبَنِينَ وَجَنَّاتٍ وَعُيُونٍ'
  trl: 'Wa-ttaqū lladhī amaddakum bimā taʿlamūn — amaddakum bi-anʿāmin wa-banīn — wa-jannātin wa-ʿuyūn'
  trad: '« Et prémunissez-vous de Ce qui vous a pourvus (amaddakum) de ce que vous savez — vous a pourvus de bestiaux (anʿām) et de fils, et de jardins (jannāt) et de sources (ʿuyūn). »'
- ref: 'S.26:135'
  ar: 'إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٍ'
  trl: 'Innī akhāfu ʿalaykum ʿadhāba yawmin ʿaẕīm'
  trad: '« Je crains pour vous le châtiment d''un jour immense (ʿaẕīm). »'
- ref: 'S.26:136–138'
  ar: 'قَالُوا سَوَاءٌ عَلَيْنَا أَوَعَظْتَ أَمْ لَمْ تَكُنْ مِنَ الْوَاعِظِينَ إِنْ هَٰذَا إِلَّا خُلُقُ الْأَوَّلِينَ وَمَا نَحْنُ بِمُعَذَّبِينَ'
  trl: 'Qālū sawāʾun ʿalaynā a-waʿaẕta am lam takun mina l-wāʿiẕīn — in hādhā illā khuluqu l-awwalīn — wa-mā naḥnu bi-muʿadhdhabīn'
  trad: 'Ils dirent : « Qu''importe pour nous que tu nous exhortes (a-waʿaẕta), ou que tu ne sois pas de ceux qui exhortent (al-wāʿiẕīn) — ceci n''est rien d''autre que la coutume (khuluq) des tout premiers (al-awwalīn), et nous ne serons pas châtiés. »'
- ref: 'S.26:139–140'
  ar: 'فَكَذَّبُوهُ فَأَهْلَكْنَاهُمْ ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Fa-kadhdhabūhu fa-ahlaknāhum — inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'Ils le traitèrent donc de menteur, et Nous les détruisîmes (ahlaknāhum). En cela, assurément, un signe — mais la plupart d''entre eux ne sont pas muʾminūn. Et ton Rabb est assurément, Lui, al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.26:141'
  ar: 'كَذَّبَتْ ثَمُودُ الْمُرْسَلِينَ'
  trl: 'Kadhdhabat thamūdu l-mursalīn'
  trad: 'Thamūd traita de menteurs les envoyés (al-mursalīn).'
- ref: 'S.26:142–143'
  ar: 'إِذْ قَالَ لَهُمْ أَخُوهُمْ صَالِحٌ أَلَا تَتَّقُونَ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ'
  trl: 'Idh qāla lahum akhūhum ṣāliḥun alā tattaqūn — innī lakum rasūlun amīn'
  trad: 'Quand leur frère (akhūhum) Ṣāliḥ leur dit : « Ne vous prémunirez-vous donc pas ? Je suis pour vous un rasūl digne de confiance (amīn). »'
- ref: 'S.26:144–145'
  ar: 'فَاتَّقُوا اللَّهَ وَأَطِيعُونِ وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ'
  trl: 'Fa-ttaqū llāha wa-aṭīʿūn — wa-mā asʾalukum ʿalayhi min ajrin in ajriya illā ʿalā rabbi l-ʿālamīn'
  trad: '« Prémunissez-vous donc d''Allaah, et obéissez-moi. Et je ne vous demande, pour cela, aucune rémunération (ajr) — ma rémunération n''incombe qu''au Rabb des ʿālamīn. »'
- ref: 'S.26:146–149'
  ar: 'أَتُتْرَكُونَ فِي مَا هَاهُنَا آمِنِينَ فِي جَنَّاتٍ وَعُيُونٍ وَزُرُوعٍ وَنَخْلٍ طَلْعُهَا هَضِيمٌ وَتَنْحِتُونَ مِنَ الْجِبَالِ بُيُوتًا فَارِهِينَ'
  trl: 'A-tutrakūna fī mā hāhunā āminīn — fī jannātin wa-ʿuyūn — wa-zurūʿin wa-nakhlin ṭalʿuhā haḍīm — wa-tanḥitūna mina l-jibāli buyūtan fārihīn'
  trad: '« Serez-vous laissés (a-tutrakūna), dans ce qui est ici, en toute sécurité (āminīn) — dans des jardins (jannāt) et des sources (ʿuyūn), et des cultures (zurūʿ) et des palmiers (nakhl) dont la spadice (ṭalʿ) est tendre (haḍīm) ? Et vous taillez (tanḥitūna), dans les montagnes, des demeures, avec habileté (fārihīn) ? »'
- ref: 'S.26:150–152'
  ar: 'فَاتَّقُوا اللَّهَ وَأَطِيعُونِ وَلَا تُطِيعُوا أَمْرَ الْمُسْرِفِينَ الَّذِينَ يُفْسِدُونَ فِي الْأَرْضِ وَلَا يُصْلِحُونَ'
  trl: 'Fa-ttaqū llāha wa-aṭīʿūn — wa-lā tuṭīʿū amra l-musrifīn — alladhīna yufsidūna fi l-arḍi wa-lā yuṣliḥūn'
  trad: '« Prémunissez-vous donc d''Allaah, et obéissez-moi — et n''obéissez pas à l''ordre des excessifs (al-musrifīn), qui répandent le désordre (yufsidūna) sur la terre et ne le réforment pas (lā yuṣliḥūn). »'
- ref: 'S.26:153–154'
  ar: 'قَالُوا إِنَّمَا أَنْتَ مِنَ الْمُسَحَّرِينَ مَا أَنْتَ إِلَّا بَشَرٌ مِثْلُنَا فَأْتِ بِآيَةٍ إِنْ كُنْتَ مِنَ الصَّادِقِينَ'
  trl: 'Qālū innamā anta mina l-musaḥḥarīn — mā anta illā basharun mithlunā fa-ti bi-āyatin in kunta mina ṣ-ṣādiqīn'
  trad: 'Ils dirent : « Tu n''es rien d''autre que du nombre des musaḥḥarīn — tu n''es qu''un être humain (bashar) comme nous : apporte donc un signe (āya), si tu es du nombre des véridiques (ṣādiqīn). »'
- ref: 'S.26:155–156'
  ar: 'قَالَ هَٰذِهِ نَاقَةٌ لَهَا شِرْبٌ وَلَكُمْ شِرْبُ يَوْمٍ مَعْلُومٍ وَلَا تَمَسُّوهَا بِسُوءٍ فَيَأْخُذَكُمْ عَذَابُ يَوْمٍ عَظِيمٍ'
  trl: 'Qāla hādhihi nāqatun lahā shirbun wa-lakum shirbu yawmin maʿlūmin — wa-lā tamassūhā bi-sūʾin fa-yaʾkhudhakum ʿadhābu yawmin ʿaẕīm'
  trad: 'Il dit : « Voici une chamelle (nāqa) : à elle un tour de boire (shirb), et à vous un tour de boire, en un jour déterminé (maʿlūm) — et ne lui faites aucun mal (sūʾ), sinon le châtiment d''un jour immense vous saisirait. »'
- ref: 'S.26:157–158'
  ar: 'فَعَقَرُوهَا فَأَصْبَحُوا نَادِمِينَ فَأَخَذَهُمُ الْعَذَابُ ۗ إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ'
  trl: 'Fa-ʿaqarūhā fa-aṣbaḥū nādimīn — fa-akhadhahumu l-ʿadhābu inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn'
  trad: 'Ils la mutilèrent (ʿaqarūhā) donc, et devinrent repentants (nādimīn) — le châtiment les saisit alors (akhadhahumu l-ʿadhāb). En cela, assurément, un signe (āya) — mais la plupart d''entre eux ne sont pas muʾminūn.'
- ref: 'S.26:159'
  ar: 'وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'Et ton Rabb est assurément, Lui, al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.26:160'
  ar: 'كَذَّبَتْ قَوْمُ لُوطٍ الْمُرْسَلِينَ'
  trl: 'Kadhdhabat qawmu lūṭin al-mursalīn'
  trad: 'Le peuple de Lūṭ traita de menteurs les envoyés (al-mursalīn).'
- ref: 'S.26:161–163'
  ar: 'إِذْ قَالَ لَهُمْ أَخُوهُمْ لُوطٌ أَلَا تَتَّقُونَ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ فَاتَّقُوا اللَّهَ وَأَطِيعُونِ'
  trl: 'Idh qāla lahum akhūhum lūṭun alā tattaqūn — innī lakum rasūlun amīn — fa-ttaqū llāha wa-aṭīʿūn'
  trad: 'Quand leur frère (akhūhum) Lūṭ leur dit : « Ne vous prémunirez-vous donc pas ? Je suis pour vous un rasūl digne de confiance (amīn). Prémunissez-vous donc d''Allaah, et obéissez-moi. »'
- ref: 'S.26:164'
  ar: 'وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ'
  trl: 'Wa-mā asʾalukum ʿalayhi min ajrin in ajriya illā ʿalā rabbi l-ʿālamīn'
  trad: '« Et je ne vous demande, pour cela, aucune rémunération (ajr) — ma rémunération n''incombe qu''au Rabb des ʿālamīn. »'
- ref: 'S.26:165–166'
  ar: 'أَتَأْتُونَ الذُّكْرَانَ مِنَ الْعَالَمِينَ وَتَذَرُونَ مَا خَلَقَ لَكُمْ رَبُّكُمْ مِنْ أَزْوَاجِكُمْ ۚ بَلْ أَنْتُمْ قَوْمٌ عَادُونَ'
  trl: 'A-taʾtūna dh-dhukrāna mina l-ʿālamīn — wa-tadharūna mā khalaqa lakum rabbukum min azwājikum bal antum qawmun ʿādūn'
  trad: '« Allez-vous aux mâles (adh-dhukrān), parmi les créatures (al-ʿālamīn), et délaissez-vous (tadharūna) ce que votre Rabb a créé pour vous de vos épouses (azwājikum) ? Vous êtes bien plutôt un peuple qui transgresse (ʿādūn). »'
- ref: 'S.26:167'
  ar: 'قَالُوا لَئِنْ لَمْ تَنْتَهِ يَا لُوطُ لَتَكُونَنَّ مِنَ الْمُخْرَجِينَ'
  trl: 'Qālū la-in lam tantahi yā lūṭu la-takūnanna mina l-mukhrajīn'
  trad: 'Ils dirent : « Si tu ne cesses pas (lam tantahi), ô Lūṭ, tu seras certainement du nombre de ceux qu''on expulse (al-mukhrajīn). »'
- ref: 'S.26:168–169'
  ar: 'قَالَ إِنِّي لِعَمَلِكُمْ مِنَ الْقَالِينَ رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ'
  trl: 'Qāla innī li-ʿamalikum mina l-qālīn — rabbi najjinī wa-ahlī mimmā yaʿmalūn'
  trad: 'Il dit : « Je suis, envers votre agissement (ʿamalikum), du nombre de ceux qui le détestent (al-qālīn). Mon Rabb, sauve-moi (najjinī), moi et ma famille (ahlī), de ce qu''ils font. »'
- ref: 'S.26:170–171'
  ar: 'فَنَجَّيْنَاهُ وَأَهْلَهُ أَجْمَعِينَ إِلَّا عَجُوزًا فِي الْغَابِرِينَ'
  trl: 'Fa-najjaynāhu wa-ahlahu ajmaʿīn — illā ʿajūzan fi l-ghābirīn'
  trad: 'Nous le sauvâmes donc, lui et sa famille, tous ensemble (ajmaʿīn) — sauf une vieille femme (ʿajūzan), qui fut du nombre de ceux qui restèrent en arrière (al-ghābirīn).'
- ref: 'S.26:172–173'
  ar: 'ثُمَّ دَمَّرْنَا الْآخَرِينَ وَأَمْطَرْنَا عَلَيْهِمْ مَطَرًا ۖ فَسَاءَ مَطَرُ الْمُنْذَرِينَ'
  trl: 'Thumma dammarnā l-ākharīn — wa-amṭarnā ʿalayhim maṭaran fa-sāʾa maṭaru l-munẕarīn'
  trad: 'Puis Nous détruisîmes entièrement (dammarnā) les autres — et Nous fîmes pleuvoir sur eux une pluie (maṭaran) : combien funeste (sāʾa) fut la pluie de ceux qui avaient été avertis (al-munẕarīn) !'
- ref: 'S.26:174–175'
  ar: 'إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'En cela, assurément, un signe (āya) — mais la plupart d''entre eux ne sont pas muʾminūn. Et ton Rabb est assurément, Lui, al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.26:176'
  ar: 'كَذَّبَ أَصْحَابُ الْأَيْكَةِ الْمُرْسَلِينَ'
  trl: 'Kadhdhaba aṣḥābu l-aykati l-mursalīn'
  trad: 'Les gens du Fourré (aṣḥābu l-Aykah) traitèrent de menteurs les envoyés.'
- ref: 'S.26:177–178'
  ar: 'إِذْ قَالَ لَهُمْ شُعَيْبٌ أَلَا تَتَّقُونَ إِنِّي لَكُمْ رَسُولٌ أَمِينٌ'
  trl: 'Idh qāla lahum shuʿaybun alā tattaqūn — innī lakum rasūlun amīn'
  trad: 'Quand Shuʿayb leur dit : « Ne vous prémunirez-vous donc pas ? Je suis pour vous un rasūl digne de confiance. »'
- ref: 'S.26:179–180'
  ar: 'فَاتَّقُوا اللَّهَ وَأَطِيعُونِ وَمَا أَسْأَلُكُمْ عَلَيْهِ مِنْ أَجْرٍ ۖ إِنْ أَجْرِيَ إِلَّا عَلَىٰ رَبِّ الْعَالَمِينَ'
  trl: 'Fa-ttaqū llāha wa-aṭīʿūn — wa-mā asʾalukum ʿalayhi min ajrin in ajriya illā ʿalā rabbi l-ʿālamīn'
  trad: '« Prémunissez-vous donc d''Allaah, et obéissez-moi. Et je ne vous demande, pour cela, aucune rémunération — ma rémunération n''incombe qu''au Rabb des ʿālamīn. »'
- ref: 'S.26:181–184'
  ar: '۞ أَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ وَلَا تَبْخَسُوا النَّاسَ أَشْيَاءَهُمْ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ وَاتَّقُوا الَّذِي خَلَقَكُمْ وَالْجِبِلَّةَ الْأَوَّلِينَ'
  trl: 'Awfū l-kayla wa-lā takūnū mina l-mukhsirīn — wa-zinū bi-l-qisṭāsi l-mustaqīm — wa-lā tabkhasū n-nāsa ashyāʾahum wa-lā taʿthaw fi l-arḍi mufsidīn — wa-ttaqū lladhī khalaqakum wa-l-jibillata l-awwalīn'
  trad: '« Donnez pleine mesure (al-kayl), et ne soyez pas de ceux qui font perdre (al-mukhsirīn). Pesez avec la balance exacte (al-qisṭās al-mustaqīm). Et ne lésez pas les gens dans leurs biens (lā tabkhasū), et ne semez pas le désordre sur la terre en corrupteurs (lā taʿthaw … mufsidīn). Et prémunissez-vous de Ce qui vous a créés, vous et la multitude des générations anciennes (al-jibilla l-awwalīn). »'
- ref: 'S.26:185–186'
  ar: 'قَالُوا إِنَّمَا أَنْتَ مِنَ الْمُسَحَّرِينَ وَمَا أَنْتَ إِلَّا بَشَرٌ مِثْلُنَا وَإِنْ نَظُنُّكَ لَمِنَ الْكَاذِبِينَ'
  trl: 'Qālū innamā anta mina l-musaḥḥarīn — wa-mā anta illā basharun mithlunā wa-in naẕunnuka la-mina l-kādhibīn'
  trad: 'Ils dirent : « Tu n''es rien d''autre que du nombre des musaḥḥarīn. Tu n''es qu''un être humain (bashar) comme nous, et nous pensons bien (naẕunnuka) que tu es du nombre des menteurs (al-kādhibīn). »'
- ref: 'S.26:187'
  ar: 'فَأَسْقِطْ عَلَيْنَا كِسَفًا مِنَ السَّمَاءِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ'
  trl: 'Fa-asqiṭ ʿalaynā kisafan mina s-samāʾi in kunta mina ṣ-ṣādiqīn'
  trad: '« Fais donc tomber sur nous un fragment (kisafan) du ciel, si tu es du nombre des véridiques (aṣ-ṣādiqīn). »'
- ref: 'S.26:188'
  ar: 'قَالَ رَبِّي أَعْلَمُ بِمَا تَعْمَلُونَ'
  trl: 'Qāla rabbī aʿlamu bimā taʿmalūn'
  trad: 'Il dit : « Mon Rabb sait mieux (aʿlamu) ce que vous faites. »'
- ref: 'S.26:189'
  ar: 'فَكَذَّبُوهُ فَأَخَذَهُمْ عَذَابُ يَوْمِ الظُّلَّةِ ۚ إِنَّهُ كَانَ عَذَابَ يَوْمٍ عَظِيمٍ'
  trl: 'Fa-kadhdhabūhu fa-akhadhahum ʿadhābu yawmi ẕ-ẕullati innahu kāna ʿadhāba yawmin ʿaẕīm'
  trad: 'Ils le traitèrent de menteur — le châtiment du jour de l''ombre (yawm aẕ-ẕulla) les saisit alors : ce fut certes le châtiment d''un jour immense.'
- ref: 'S.26:190–191'
  ar: 'إِنَّ فِي ذَٰلِكَ لَآيَةً ۖ وَمَا كَانَ أَكْثَرُهُمْ مُؤْمِنِينَ وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ'
  trl: 'Inna fī dhālika la-āyatan wa-mā kāna aktharuhum muʾminīn — wa-inna rabbaka la-huwa l-ʿazīzu r-raḥīm'
  trad: 'En cela, assurément, un signe — mais la plupart d''entre eux ne sont pas muʾminūn. Et ton Rabb est assurément, Lui, al-ʿAzīz, ar-Raḥīm.'
- ref: 'S.26:192'
  ar: 'وَإِنَّهُ لَتَنْزِيلُ رَبِّ الْعَالَمِينَ'
  trl: 'Wa-innahu la-tanzīlu rabbi l-ʿālamīn'
  trad: 'Et ceci est assurément un tanzīl (une descente) du Rabb des ʿālamīn.'
- ref: 'S.26:193–195'
  ar: 'نَزَلَ بِهِ الرُّوحُ الْأَمِينُ عَلَىٰ قَلْبِكَ لِتَكُونَ مِنَ الْمُنْذِرِينَ بِلِسَانٍ عَرَبِيٍّ مُبِينٍ'
  trl: 'Nazala bihi r-rūḥu l-amīn — ʿalā qalbika li-takūna mina l-munẕirīn — bi-lisānin ʿarabiyyin mubīn'
  trad: 'Ar-Rūḥ al-Amīn (le Rūḥ digne de confiance) l''a fait descendre — sur ton cœur (qalbika), pour que tu sois du nombre de ceux qui avertissent (al-munẕirīn) — en langue arabe manifeste (bi-lisānin ʿarabiyyin mubīn).'
- ref: 'S.26:196'
  ar: 'وَإِنَّهُ لَفِي زُبُرِ الْأَوَّلِينَ'
  trl: 'Wa-innahu la-fī zuburi l-awwalīn'
  trad: 'Et ceci est assurément dans les zubur (les écrits) des anciens (al-awwalīn).'
- ref: 'S.26:197'
  ar: 'أَوَلَمْ يَكُنْ لَهُمْ آيَةً أَنْ يَعْلَمَهُ عُلَمَاءُ بَنِي إِسْرَائِيلَ'
  trl: 'A-wa-lam yakun lahum āyatan an yaʿlamahu ʿulamāʾu banī isrāʾīl'
  trad: 'N''est-ce donc pas pour eux un signe (āya), que les savants des Banī Isrāʾīl le sachent (yaʿlamahu) ?'
- ref: 'S.26:198–199'
  ar: 'وَلَوْ نَزَّلْنَاهُ عَلَىٰ بَعْضِ الْأَعْجَمِينَ فَقَرَأَهُ عَلَيْهِمْ مَا كَانُوا بِهِ مُؤْمِنِينَ'
  trl: 'Wa-law nazzalnāhu ʿalā baʿḍi l-aʿjamīna fa-qaraʾahu ʿalayhim mā kānū bihi muʾminīn'
  trad: 'Et si Nous l''avions fait descendre sur quelqu''un des non-arabophones (al-aʿjamīn), et qu''il le leur eût récité, ils n''y auraient pas cru.'
- ref: 'S.26:200–201'
  ar: 'كَذَٰلِكَ سَلَكْنَاهُ فِي قُلُوبِ الْمُجْرِمِينَ لَا يُؤْمِنُونَ بِهِ حَتَّىٰ يَرَوُا الْعَذَابَ الْأَلِيمَ'
  trl: 'Ka-dhālika salaknāhu fī qulūbi l-mujrimīn — lā yuʾminūna bihi ḥattā yarawu l-ʿadhāba l-alīm'
  trad: 'C''est ainsi que Nous l''avons fait pénétrer (salaknāhu) dans les cœurs des mujrimūn — ils n''y croiront pas avant de voir le châtiment douloureux.'
- ref: 'S.26:202–204'
  ar: 'فَيَأْتِيَهُمْ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ فَيَقُولُوا هَلْ نَحْنُ مُنْظَرُونَ أَفَبِعَذَابِنَا يَسْتَعْجِلُونَ'
  trl: 'Fa-yaʾtiyahum baghtatan wa-hum lā yashʿurūn — fa-yaqūlū hal naḥnu munẕarūn — a-fa-bi-ʿadhābinā yastaʿjilūn'
  trad: 'Alors il leur viendra soudainement (baghtatan), sans qu''ils en aient conscience (lā yashʿurūn) — et ils diront : « Sommes-nous dans un délai (munẕarūn) ? » Est-ce donc Notre châtiment qu''ils cherchent à hâter (yastaʿjilūn) ?'
- ref: 'S.26:205–207'
  ar: 'أَفَرَأَيْتَ إِنْ مَتَّعْنَاهُمْ سِنِينَ ثُمَّ جَاءَهُمْ مَا كَانُوا يُوعَدُونَ مَا أَغْنَىٰ عَنْهُمْ مَا كَانُوا يُمَتَّعُونَ'
  trl: 'A-fa-raʾayta in mattaʿnāhum sinīn — thumma jāʾahum mā kānū yūʿadūn — mā aghnā ʿanhum mā kānū yumattaʿūn'
  trad: 'Ne vois-tu donc pas que, si Nous leur accordions la jouissance (mattaʿnāhum) des années, puis que leur vînt ce qui leur était promis — cela ne leur servirait à rien (mā aghnā), ce dont ils jouissaient (yumattaʿūn) ?'
- ref: 'S.26:208–209'
  ar: 'وَمَا أَهْلَكْنَا مِنْ قَرْيَةٍ إِلَّا لَهَا مُنْذِرُونَ ذِكْرَىٰ وَمَا كُنَّا ظَالِمِينَ'
  trl: 'Wa-mā ahlaknā min qaryatin illā lahā munẕirūn — dhikrā wa-mā kunnā ẕālimīn'
  trad: 'Et Nous n''avons détruit aucune cité (qarya) sans qu''elle n''ait eu des avertisseurs (munẕirūn) — un rappel (dhikrā) — et Nous n''avons jamais été injustes.'
- ref: 'S.26:210–212'
  ar: 'وَمَا تَنَزَّلَتْ بِهِ الشَّيَاطِينُ وَمَا يَنْبَغِي لَهُمْ وَمَا يَسْتَطِيعُونَ إِنَّهُمْ عَنِ السَّمْعِ لَمَعْزُولُونَ'
  trl: 'Wa-mā tanazzalat bihi sh-shayāṭīn — wa-mā yanbaghī lahum wa-mā yastaṭīʿūn — innahum ʿani s-samʿi la-maʿzūlūn'
  trad: 'Et ce ne sont pas les shayāṭīn qui sont descendus avec cela — cela ne leur convient pas (mā yanbaghī lahum), et ils n''en ont pas la capacité (mā yastaṭīʿūn) — ils sont assurément écartés de l''écoute (ʿani s-samʿi la-maʿzūlūn).'
- ref: 'S.26:213'
  ar: 'فَلَا تَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَتَكُونَ مِنَ الْمُعَذَّبِينَ'
  trl: 'Fa-lā tadʿu maʿa llāhi ilāhan ākhara fa-takūna mina l-muʿadhdhabīn'
  trad: 'N''invoque donc pas, avec Allaah, un autre ilāh — tu serais alors du nombre de ceux qui subissent le châtiment (al-muʿadhdhabīn).'
- ref: 'S.26:214'
  ar: 'وَأَنْذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ'
  trl: 'Wa-anẕir ʿashīrataka l-aqrabīn'
  trad: 'Et avertis ton clan (ʿashīratak), les plus proches (al-aqrabīn).'
- ref: 'S.26:215'
  ar: 'وَاخْفِضْ جَنَاحَكَ لِمَنِ اتَّبَعَكَ مِنَ الْمُؤْمِنِينَ'
  trl: 'Wa-khfiḍ janāḥaka li-mani ttabaʿaka mina l-muʾminīn'
  trad: 'Et abaisse ton aile (janāḥaka) pour qui te suit parmi les muʾminūn.'
- ref: 'S.26:216'
  ar: 'فَإِنْ عَصَوْكَ فَقُلْ إِنِّي بَرِيءٌ مِمَّا تَعْمَلُونَ'
  trl: 'Fa-in ʿaṣawka fa-qul innī barīʾun mimmā taʿmalūn'
  trad: 'Et s''ils te désobéissent (ʿaṣawka), dis : « Je suis innocent (barīʾ) de ce que vous faites. »'
- ref: 'S.26:217–220'
  ar: 'وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ الَّذِي يَرَاكَ حِينَ تَقُومُ وَتَقَلُّبَكَ فِي السَّاجِدِينَ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ'
  trl: 'Wa-tawakkal ʿalā l-ʿazīzi r-raḥīm — alladhī yarāka ḥīna taqūm — wa-taqallubaka fi s-sājidīn — innahu huwa s-samīʿu l-ʿalīm'
  trad: 'Et repose-toi (tawakkal) sur al-ʿAzīz, ar-Raḥīm — Ce qui te voit (yarāka) quand tu te lèves (taqūm) — et [qui voit] ton mouvement (taqallubaka) parmi ceux qui se prosternent (as-sājidīn) — Il est, Lui, as-Samīʿ, al-ʿAlīm.'
- ref: 'S.26:221–223'
  ar: 'هَلْ أُنَبِّئُكُمْ عَلَىٰ مَنْ تَنَزَّلُ الشَّيَاطِينُ تَنَزَّلُ عَلَىٰ كُلِّ أَفَّاكٍ أَثِيمٍ يُلْقُونَ السَّمْعَ وَأَكْثَرُهُمْ كَاذِبُونَ'
  trl: 'Hal unabbiʾukum ʿalā man tanazzalu sh-shayāṭīn — tanazzalu ʿalā kulli affākin athīm — yulqūna s-samʿa wa-aktharuhum kādhibūn'
  trad: 'Vous informerai-Je (unabbiʾukum) sur qui descendent les shayāṭīn ? — ils descendent sur tout menteur invétéré (affāk) et pécheur (athīm) — ils déversent (yulqūna) ce qu''ils entendent, et la plupart d''entre eux sont menteurs (kādhibūn).'
- ref: 'S.26:224–226'
  ar: 'وَالشُّعَرَاءُ يَتَّبِعُهُمُ الْغَاوُونَ أَلَمْ تَرَ أَنَّهُمْ فِي كُلِّ وَادٍ يَهِيمُونَ وَأَنَّهُمْ يَقُولُونَ مَا لَا يَفْعَلُونَ'
  trl: 'Wa-sh-shuʿarāʾu yattabiʿuhumu l-ghāwūn — a-lam tara annahum fī kulli wādin yahīmūn — wa-annahum yaqūlūna mā lā yafʿalūn'
  trad: 'Et les poètes (ash-shuʿarāʾ) — ce sont les égarés (al-ghāwūn) qui les suivent. Ne vois-tu pas qu''ils errent (yahīmūn) dans chaque vallée (wādin) ? Et qu''ils disent ce qu''ils ne font pas ?'
- ref: 'S.26:227'
  ar: 'إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَذَكَرُوا اللَّهَ كَثِيرًا وَانْتَصَرُوا مِنْ بَعْدِ مَا ظُلِمُوا ۗ وَسَيَعْلَمُ الَّذِينَ ظَلَمُوا أَيَّ مُنْقَلَبٍ يَنْقَلِبُونَ'
  trl: 'Illā lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti wa-dhakarū llāha kathīran wa-ntaṣarū min baʿdi mā ẕulimū — wa-sa-yaʿlamu lladhīna ẕalamū ayya munqalabin yanqalibūn'
  trad: 'Sauf ceux qui ont cru, et accompli les œuvres justes, et invoqué (dhakarū) Allaah abondamment, et qui se sont défendus (intaṣarū) après avoir été lésés (ẕulimū) — et ceux qui ont commis le ẕulm sauront bientôt (sa-yaʿlamu) vers quel retournement (munqalab) ils retourneront (yanqalibūn).'
