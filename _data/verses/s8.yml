- ref: S.8:1
  ar: يَسْأَلُونَكَ عَنِ الْأَنْفَالِ ۖ قُلِ الْأَنْفَالُ لِلَّهِ وَالرَّسُولِ ۖ فَاتَّقُوا اللَّهَ وَأَصْلِحُوا ذَاتَ بَيْنِكُمْ ۖ وَأَطِيعُوا اللَّهَ وَرَسُولَهُ إِنْ كُنْتُمْ مُؤْمِنِينَ
  trl: Yasʾalūnaka ʿani l-anfāl — quli l-anfālu lillāhi wa-r-rasūl — fa-ttaqū llāha wa-aṣliḥū dhāta baynikum — wa-aṭīʿū llāha wa-rasūlahu in kuntum muʾminīn
  trad: 'Ils t''interrogent au sujet des *anfāl*. Dis : « Les *anfāl* reviennent à Allaah et au *rasūl*. » Prémunissez-vous donc d''Allaah, remettez en bon état ce qui est entre vous, et obéissez à Allaah et à Son *rasūl*, si vous êtes des *muʾminūn*.'
- ref: S.8:2–4
  ar: إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ ۝ الَّذِينَ يُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ ۝ أُولَٰئِكَ هُمُ الْمُؤْمِنُونَ حَقًّا ۚ لَهُمْ دَرَجَاتٌ عِنْدَ رَبِّهِمْ وَمَغْفِرَةٌ وَرِزْقٌ كَرِيمٌ
  trl: Innamā l-muʾminūna lladhīna idhā dhukira llāhu wajilat qulūbuhum wa-idhā tuliyat ʿalayhim āyātuhu zādathum īmānan wa-ʿalā rabbihim yatawakkalūn — alladhīna yuqīmūna ṣ-ṣalāta wa-mimmā razaqnāhum yunfiqūn — ulāʾika humu l-muʾminūna ḥaqqan — lahum darajātun ʿinda rabbihim wa-maghfiratun wa-rizqun karīm
  trad: 'Les *muʾminūn* ne sont que ceux dont le cœur tressaille au rappel d''Allaah, et dont la foi s''accroît quand Ses versets leur sont récités, et qui placent leur confiance en leur Seigneur — ceux qui accomplissent la *ṣalāt*, et dépensent de ce que Nous leur avons attribué. Ceux-là sont, en toute vérité, les *muʾminūn* : à eux des degrés auprès de leur Seigneur, un pardon et une attribution généreuse.'
- ref: S.8:5
  ar: كَمَا أَخْرَجَكَ رَبُّكَ مِنْ بَيْتِكَ بِالْحَقِّ وَإِنَّ فَرِيقًا مِنَ الْمُؤْمِنِينَ لَكَارِهُونَ
  trl: Kamā akhrajaka rabbuka min baytika bi-l-ḥaqqi wa-inna farīqan mina l-muʾminīna la-kārihūn
  trad: De même que ton Rabb t'a fait sortir de ta maison en toute vérité, alors qu'un groupe des *muʾminūn* y répugnait manifestement.
- ref: S.8:6
  ar: يُجَادِلُونَكَ فِي الْحَقِّ بَعْدَمَا تَبَيَّنَ كَأَنَّمَا يُسَاقُونَ إِلَى الْمَوْتِ وَهُمْ يَنْظُرُونَ
  trl: Yujādilūnaka fī l-ḥaqqi baʿdamā tabayyana ka-annamā yusāqūna ilā l-mawti wa-hum yanẓurūn
  trad: Ils contestent avec toi au sujet du vrai après qu'il s'est manifesté clairement — comme si on les poussait vers la mort, sous leurs propres yeux.
- ref: S.8:7–8
  ar: وَإِذْ يَعِدُكُمُ اللَّهُ إِحْدَى الطَّائِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ الشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ اللَّهُ أَنْ يُحِقَّ الْحَقَّ بِكَلِمَاتِهِ وَيَقْطَعَ دَابِرَ الْكَافِرِينَ ۝ لِيُحِقَّ الْحَقَّ وَيُبْطِلَ الْبَاطِلَ وَلَوْ كَرِهَ الْمُجْرِمُونَ
  trl: Wa-idh yaʿidukumu llāhu iḥdā ṭ-ṭāʾifatayni annahā lakum wa-tawaddūna anna ghayra dhāti sh-shawkati takūnu lakum wa-yurīdu llāhu an yuḥiqqa l-ḥaqqa bi-kalimātihi wa-yaqṭaʿa dābira l-kāfirīn — li-yuḥiqqa l-ḥaqqa wa-yubṭila l-bāṭila wa-law kariha l-mujrimūn
  trad: 'Et quand Allaah vous promettait que l''un des deux groupes serait pour vous, et que vous auriez souhaité que ce soit celui qui est sans la force [litt. « sans l''épine »] qui échoie à vous — alors qu''Allaah voulait faire prévaloir le vrai par Ses paroles, et retrancher les *kāfirūn* jusqu''à leur dernier retranchement : pour faire prévaloir le vrai et anéantir le faux, même si cela répugnait aux *mujrimūn*.'
- ref: S.8:9
  ar: إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمْ أَنِّي مُمِدُّكُمْ بِأَلْفٍ مِنَ الْمَلَائِكَةِ مُرْدِفِينَ
  trl: Idh tastaghīthūna rabbakum fa-stajāba lakum annī mumiddukum bi-alfin mina l-malāʾikati murdifīn
  trad: 'Quand vous imploriez le secours de votre Rabb, et qu''Il vous répondit : « Je vous assisterai d''un millier de *malāʾika* se succédant les uns aux autres. »'
- ref: S.8:10
  ar: وَمَا جَعَلَهُ اللَّهُ إِلَّا بُشْرَىٰ وَلِتَطْمَئِنَّ بِهِ قُلُوبُكُمْ ۚ وَمَا النَّصْرُ إِلَّا مِنْ عِنْدِ اللَّهِ ۚ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ
  trl: Wa-mā jaʿalahu llāhu illā bushrā wa-li-taṭmaʾinna bihi qulūbukum — wa-mā n-naṣru illā min ʿindi llāh — inna llāha ʿazīzun ḥakīm
  trad: 'Allaah n''a fait cela que comme une bonne annonce, et pour que vos cœurs s''apaisent par elle — le secours ne vient que d''auprès d''Allaah : Allaah est *ʿAzīz*, *Ḥakīm*.'
- ref: S.8:11
  ar: إِذْ يُغَشِّيكُمُ النُّعَاسَ أَمَنَةً مِنْهُ وَيُنَزِّلُ عَلَيْكُمْ مِنَ السَّمَاءِ مَاءً لِيُطَهِّرَكُمْ بِهِ وَيُذْهِبَ عَنْكُمْ رِجْزَ الشَّيْطَانِ وَلِيَرْبِطَ عَلَىٰ قُلُوبِكُمْ وَيُثَبِّتَ بِهِ الْأَقْدَامَ
  trl: Idh yughashshīkumu n-nuʿāsa amanatan minhu wa-yunazzilu ʿalaykum mina s-samāʾi māʾan li-yuṭahhirakum bihi wa-yudhhiba ʿankum rijza sh-shayṭāni wa-li-yarbiṭa ʿalā qulūbikum wa-yuthabbita bihi l-aqdām
  trad: Quand Il vous enveloppait de sommeil, une sécurité venue de Lui, et faisait descendre sur vous, du ciel, une eau pour vous purifier par elle, écarter de vous le trouble impur du *shayṭān*, affermir vos cœurs, et raffermir par elle vos pas.
- ref: S.8:12
  ar: إِذْ يُوحِي رَبُّكَ إِلَى الْمَلَائِكَةِ أَنِّي مَعَكُمْ فَثَبِّتُوا الَّذِينَ آمَنُوا ۚ سَأُلْقِي فِي قُلُوبِ الَّذِينَ كَفَرُوا الرُّعْبَ فَاضْرِبُوا فَوْقَ الْأَعْنَاقِ وَاضْرِبُوا مِنْهُمْ كُلَّ بَنَانٍ
  trl: Idh yūḥī rabbuka ilā l-malāʾikati annī maʿakum fa-thabbitū lladhīna āmanū — sa-ulqī fī qulūbi lladhīna kafarū r-ruʿba fa-ḍribū fawqa l-aʿnāqi wa-ḍribū minhum kulla banān
  trad: 'Quand ton Rabb inspirait aux *malāʾika* : « Je suis avec vous — raffermissez donc ceux qui ont cru. Je vais jeter l''effroi dans les cœurs de ceux qui sont *kāfirūn* : frappez donc au-dessus des nuques, et frappez chez eux chaque extrémité. »'
- ref: S.8:13–14
  ar: ذَٰلِكَ بِأَنَّهُمْ شَاقُّوا اللَّهَ وَرَسُولَهُ ۚ وَمَنْ يُشَاقِقِ اللَّهَ وَرَسُولَهُ فَإِنَّ اللَّهَ شَدِيدُ الْعِقَابِ ۝ ذَٰلِكُمْ فَذُوقُوهُ وَأَنَّ لِلْكَافِرِينَ عَذَابَ النَّارِ
  trl: Dhālika bi-annahum shāqqū llāha wa-rasūlahu — wa-man yushāqiqi llāha wa-rasūlahu fa-inna llāha shadīdu l-ʿiqāb — dhālikum fa-dhūqūhu wa-anna li-l-kāfirīna ʿadhāba n-nār
  trad: 'Cela, parce qu''ils se sont mis en opposition avec Allaah et Son *rasūl* — et quiconque se met en opposition avec Allaah et Son *rasūl*, alors Allaah est sévère dans la sanction. Voilà pour vous : goûtez-le donc — et pour les *kāfirūn*, le châtiment du Feu.'
- ref: S.8:15
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا لَقِيتُمُ الَّذِينَ كَفَرُوا زَحْفًا فَلَا تُوَلُّوهُمُ الْأَدْبَارَ
  trl: Yā ayyuhā lladhīna āmanū idhā laqītumu lladhīna kafarū zaḥfan fa-lā tuwallūhumu l-adbār
  trad: Ô vous qui avez cru, quand vous rencontrez ceux qui sont *kāfirūn* avançant en force, ne leur tournez pas le dos.
- ref: S.8:16
  ar: وَمَنْ يُوَلِّهِمْ يَوْمَئِذٍ دُبُرَهُ إِلَّا مُتَحَرِّفًا لِقِتَالٍ أَوْ مُتَحَيِّزًا إِلَىٰ فِئَةٍ فَقَدْ بَاءَ بِغَضَبٍ مِنَ اللَّهِ وَمَأْوَاهُ جَهَنَّمُ ۖ وَبِئْسَ الْمَصِيرُ
  trl: Wa-man yuwallihim yawmaʾidhin duburahu illā mutaḥarrifan li-qitālin aw mutaḥayyizan ilā fiʾatin fa-qad bāʾa bi-ghaḍabin mina llāhi wa-maʾwāhu jahannam — wa-biʾsa l-maṣīr
  trad: 'Et quiconque, ce jour-là, leur tourne le dos — sauf en manœuvre tactique pour combattre, ou en repli vers un autre groupe — encourt un *ghaḍab* d''Allaah, et son refuge est Jahannam : quelle détestable destination.'
- ref: S.8:17
  ar: فَلَمْ تَقْتُلُوهُمْ وَلَٰكِنَّ اللَّهَ قَتَلَهُمْ ۚ وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَٰكِنَّ اللَّهَ رَمَىٰ ۚ وَلِيُبْلِيَ الْمُؤْمِنِينَ مِنْهُ بَلَاءً حَسَنًا ۚ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ
  trl: Fa-lam taqtulūhum wa-lākinna llāha qatalahum — wa-mā ramayta idh ramayta wa-lākinna llāha ramā — wa-li-yubliya l-muʾminīna minhu balāʾan ḥasanā — inna llāha samīʿun ʿalīm
  trad: 'Vous ne les avez donc pas tués — c''est Allaah qui les a tués. Et tu n''as pas jeté quand tu as jeté — c''est Allaah qui a jeté. Et cela, pour éprouver les *muʾminūn* d''une belle épreuve venue de Lui : Allaah est *Samīʿ*, *ʿAlīm*.'
- ref: S.8:18
  ar: ذَٰلِكُمْ وَأَنَّ اللَّهَ مُوهِنُ كَيْدِ الْكَافِرِينَ
  trl: Dhālikum wa-anna llāha mūhinu kaydi l-kāfirīn
  trad: Voilà pour vous — et sachez qu'Allaah est ce qui affaiblit la manœuvre des *kāfirūn*.
- ref: S.8:19
  ar: إِنْ تَسْتَفْتِحُوا فَقَدْ جَاءَكُمُ الْفَتْحُ ۖ وَإِنْ تَنْتَهُوا فَهُوَ خَيْرٌ لَكُمْ ۖ وَإِنْ تَعُودُوا نَعُدْ وَلَنْ تُغْنِيَ عَنْكُمْ فِئَتُكُمْ شَيْئًا وَلَوْ كَثُرَتْ وَأَنَّ اللَّهَ مَعَ الْمُؤْمِنِينَ
  trl: In tastaftiḥū fa-qad jāʾakumu l-fatḥ — wa-in tantahū fa-huwa khayrun lakum — wa-in taʿūdū naʿud wa-lan tughniya ʿankum fiʾatukum shayʾan wa-law kathurat — wa-anna llāha maʿa l-muʾminīn
  trad: 'Si vous cherchiez une décision, la décision vous est certes venue. Et si vous cessez, c''est meilleur pour vous ; mais si vous revenez, Nous reviendrons — et votre groupe ne vous sera d''aucune utilité, si nombreux soit-il : Allaah est avec les *muʾminūn*.'
- ref: S.8:20–21
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَوَلَّوْا عَنْهُ وَأَنْتُمْ تَسْمَعُونَ ۝ وَلَا تَكُونُوا كَالَّذِينَ قَالُوا سَمِعْنَا وَهُمْ لَا يَسْمَعُونَ
  trl: Yā ayyuhā lladhīna āmanū aṭīʿū llāha wa-rasūlahu wa-lā tawallaw ʿanhu wa-antum tasmaʿūn — wa-lā takūnū ka-lladhīna qālū samiʿnā wa-hum lā yasmaʿūn
  trad: 'Ô vous qui avez cru, obéissez à Allaah et à Son rasūl, et ne vous détournez pas de lui, alors que vous entendez. Et ne soyez pas comme ceux qui ont dit : « Nous avons entendu », alors qu''ils n''entendent pas.'
- ref: S.8:22–23
  ar: ۞ إِنَّ شَرَّ الدَّوَابِّ عِنْدَ اللَّهِ الصُّمُّ الْبُكْمُ الَّذِينَ لَا يَعْقِلُونَ ۝ وَلَوْ عَلِمَ اللَّهُ فِيهِمْ خَيْرًا لَأَسْمَعَهُمْ ۖ وَلَوْ أَسْمَعَهُمْ لَتَوَلَّوْا وَهُمْ مُعْرِضُونَ
  trl: Inna sharra d-dawābbi ʿinda llāhi ṣ-ṣummu l-bukmu lladhīna lā yaʿqilūn — wa-law ʿalima llāhu fīhim khayran la-asmaʿahum — wa-law asmaʿahum la-tawallaw wa-hum muʿriḍūn
  trad: Les pires des créatures qui se meuvent, auprès d'Allaah, sont les sourds, les muets — ceux qui ne raisonnent pas. Et si Allaah avait su en eux un bien, Il leur aurait fait entendre ; et même s'Il leur avait fait entendre, ils se seraient détournés, en pleine dérobade.
- ref: S.8:24
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَجِيبُوا لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْ ۖ وَاعْلَمُوا أَنَّ اللَّهَ يَحُولُ بَيْنَ الْمَرْءِ وَقَلْبِهِ وَأَنَّهُ إِلَيْهِ تُحْشَرُونَ
  trl: Yā ayyuhā lladhīna āmanū stajībū lillāhi wa-li-r-rasūli idhā daʿākum li-mā yuḥyīkum — wa-ʿlamū anna llāha yaḥūlu bayna l-marʾi wa-qalbihi wa-annahu ilayhi tuḥsharūn
  trad: Ô vous qui avez cru, répondez à Allaah et au rasūl quand il vous appelle vers ce qui vous fait vivre — et sachez qu'Allaah s'interpose entre l'homme et son cœur, et que c'est vers Lui que vous serez rassemblés.
- ref: S.8:25
  ar: وَاتَّقُوا فِتْنَةً لَا تُصِيبَنَّ الَّذِينَ ظَلَمُوا مِنْكُمْ خَاصَّةً ۖ وَاعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ
  trl: Wa-ttaqū fitnatan lā tuṣībanna lladhīna ẓalamū minkum khāṣṣatan — wa-ʿlamū anna llāha shadīdu l-ʿiqāb
  trad: Et prémunissez-vous d'une fitna qui n'atteindra pas exclusivement ceux d'entre vous qui ont commis l'injustice — et sachez qu'Allaah est sévère dans la sanction.
- ref: S.8:26
  ar: وَاذْكُرُوا إِذْ أَنْتُمْ قَلِيلٌ مُسْتَضْعَفُونَ فِي الْأَرْضِ تَخَافُونَ أَنْ يَتَخَطَّفَكُمُ النَّاسُ فَآوَاكُمْ وَأَيَّدَكُمْ بِنَصْرِهِ وَرَزَقَكُمْ مِنَ الطَّيِّبَاتِ لَعَلَّكُمْ تَشْكُرُونَ
  trl: Wa-dhkurū idh antum qalīlun mustaḍʿafūna fi l-arḍi takhāfūna an yatakhaṭṭafakumu n-nāsu fa-āwākum wa-ayyadakum bi-naṣrihi wa-razaqakum mina ṭ-ṭayyibāti laʿallakum tashkurūn
  trad: Et rappelez-vous quand vous étiez peu nombreux, rendus faibles sur la terre, craignant que les gens ne vous arrachent d'un coup — Il vous a donné refuge, vous a soutenus de Son secours, et vous a attribué des ṭayyibāt, afin que vous soyez reconnaissants.
- ref: S.8:27
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَخُونُوا اللَّهَ وَالرَّسُولَ وَتَخُونُوا أَمَانَاتِكُمْ وَأَنْتُمْ تَعْلَمُونَ
  trl: Yā ayyuhā lladhīna āmanū lā takhūnū llāha wa-r-rasūla wa-takhūnū amānātikum wa-antum taʿlamūn
  trad: Ô vous qui avez cru, ne trahissez pas Allaah et le rasūl, et ne trahissez pas vos amānāt, alors que vous savez.
- ref: S.8:28
  ar: وَاعْلَمُوا أَنَّمَا أَمْوَالُكُمْ وَأَوْلَادُكُمْ فِتْنَةٌ وَأَنَّ اللَّهَ عِنْدَهُ أَجْرٌ عَظِيمٌ
  trl: Wa-ʿlamū annamā amwālukum wa-awlādukum fitnatun wa-anna llāha ʿindahu ajrun ʿaẓīm
  trad: Et sachez que vos biens et vos enfants ne sont qu'une fitna, et qu'auprès d'Allaah se trouve une rétribution immense.
- ref: S.8:29
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَتَّقُوا اللَّهَ يَجْعَلْ لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمْ ۗ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ
  trl: Yā ayyuhā lladhīna āmanū in tattaqū llāha yajʿal lakum furqānan wa-yukaffir ʿankum sayyiʾātikum wa-yaghfir lakum — wa-llāhu dhū l-faḍli l-ʿaẓīm
  trad: Ô vous qui avez cru, si vous vous prémunissez d'Allaah, Il vous accordera un furqān, effacera vos méfaits et vous pardonnera — Allaah détient la faveur immense.
- ref: S.8:30
  ar: وَإِذْ يَمْكُرُ بِكَ الَّذِينَ كَفَرُوا لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ ۚ وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ ۖ وَاللَّهُ خَيْرُ الْمَاكِرِينَ
  trl: Wa-idh yamkuru bika lladhīna kafarū li-yuthbitūka aw yaqtulūka aw yukhrijūka — wa-yamkurūna wa-yamkuru llāhu — wa-llāhu khayru l-mākirīn
  trad: 'Et quand ceux qui sont kāfirūn te tenaient une manœuvre, pour t''immobiliser, te tuer ou te faire sortir — ils manœuvraient, et Allaah manœuvrait : Allaah est le meilleur en matière de manœuvre.'
- ref: S.8:31
  ar: وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا قَالُوا قَدْ سَمِعْنَا لَوْ نَشَاءُ لَقُلْنَا مِثْلَ هَٰذَا ۙ إِنْ هَٰذَا إِلَّا أَسَاطِيرُ الْأَوَّلِينَ
  trl: Wa-idhā tutlā ʿalayhim āyātunā qālū qad samiʿnā law nashāʾu la-qulnā mithla hādhā — in hādhā illā asāṭīru l-awwalīn
  trad: 'Et quand Nos āyāt leur sont récitées, ils disent : « Nous avons bien entendu — si nous voulions, nous dirions quelque chose de semblable ; ceci n''est rien d''autre que les légendes des anciens. »'
- ref: S.8:32
  ar: وَإِذْ قَالُوا اللَّهُمَّ إِنْ كَانَ هَٰذَا هُوَ الْحَقَّ مِنْ عِنْدِكَ فَأَمْطِرْ عَلَيْنَا حِجَارَةً مِنَ السَّمَاءِ أَوِ ائْتِنَا بِعَذَابٍ أَلِيمٍ
  trl: Wa-idh qālū llāhumma in kāna hādhā huwa l-ḥaqqa min ʿindika fa-amṭir ʿalaynā ḥijāratan mina s-samāʾi awi ʾtinā bi-ʿadhābin alīm
  trad: 'Et quand ils disaient : « Ô Allaah, si ceci est bien le ḥaqq venu d''auprès de Toi, alors fais pleuvoir sur nous des pierres du ciel, ou apporte-nous un châtiment douloureux. »'
- ref: S.8:33
  ar: وَمَا كَانَ اللَّهُ لِيُعَذِّبَهُمْ وَأَنْتَ فِيهِمْ ۚ وَمَا كَانَ اللَّهُ مُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَ
  trl: Wa-mā kāna llāhu li-yuʿadhdhibahum wa-anta fīhim — wa-mā kāna llāhu muʿadhdhibahum wa-hum yastaghfirūn
  trad: Et Allaah n'était pas de nature à les tourmenter alors que tu te trouvais parmi eux ; et Allaah n'était pas de nature à les tourmenter tant qu'ils demandaient pardon.
- ref: S.8:34
  ar: وَمَا لَهُمْ أَلَّا يُعَذِّبَهُمُ اللَّهُ وَهُمْ يَصُدُّونَ عَنِ الْمَسْجِدِ الْحَرَامِ وَمَا كَانُوا أَوْلِيَاءَهُ ۚ إِنْ أَوْلِيَاؤُهُ إِلَّا الْمُتَّقُونَ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ
  trl: Wa-mā lahum allā yuʿadhdhibahumu llāhu wa-hum yaṣuddūna ʿani l-masjidi l-ḥarāmi wa-mā kānū awliyāʾahu — in awliyāʾuhu illā l-muttaqūn wa-lākinna aktharahum lā yaʿlamūn
  trad: Et qu'ont-ils donc, pour qu'Allaah ne les tourmente pas, alors qu'ils détournent de la Masjid al-Ḥarām, sans en être les awliyāʾ légitimes ? Ses awliyāʾ ne sont que les muttaqūn — mais la plupart d'entre eux ne savent pas.
- ref: S.8:35
  ar: وَمَا كَانَ صَلَاتُهُمْ عِنْدَ الْبَيْتِ إِلَّا مُكَاءً وَتَصْدِيَةً ۚ فَذُوقُوا الْعَذَابَ بِمَا كُنْتُمْ تَكْفُرُونَ
  trl: Wa-mā kāna ṣalātuhum ʿinda l-bayti illā mukāʾan wa-taṣdiyatan — fa-dhūqu l-ʿadhāba bimā kuntum takfurūn
  trad: Et ce qui tenait lieu de ṣalāt pour eux, auprès de la Bayt, n'était que sifflement et battement de mains — goûtez donc le châtiment, pour le kufr que vous commettiez.
- ref: S.8:36
  ar: إِنَّ الَّذِينَ كَفَرُوا يُنْفِقُونَ أَمْوَالَهُمْ لِيَصُدُّوا عَنْ سَبِيلِ اللَّهِ ۚ فَسَيُنْفِقُونَهَا ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةً ثُمَّ يُغْلَبُونَ ۗ وَالَّذِينَ كَفَرُوا إِلَىٰ جَهَنَّمَ يُحْشَرُونَ
  trl: Inna lladhīna kafarū yunfiqūna amwālahum li-yaṣuddū ʿan sabīli llāhi — fa-sa-yunfiqūnahā thumma takūnu ʿalayhim ḥasratan thumma yughlabūn — wa-lladhīna kafarū ilā jahannama yuḥsharūn
  trad: Ceux qui sont kāfirūn dépensent leurs biens pour détourner du sabīl d'Allaah — ils continueront de les dépenser, puis cela deviendra pour eux un regret, puis ils seront vaincus — et ceux qui sont kāfirūn seront rassemblés vers Jahannam.
- ref: S.8:37
  ar: لِيَمِيزَ اللَّهُ الْخَبِيثَ مِنَ الطَّيِّبِ وَيَجْعَلَ الْخَبِيثَ بَعْضَهُ عَلَىٰ بَعْضٍ فَيَرْكُمَهُ جَمِيعًا فَيَجْعَلَهُ فِي جَهَنَّمَ ۚ أُولَٰئِكَ هُمُ الْخَاسِرُونَ
  trl: Li-yamīza llāhu l-khabītha mina ṭ-ṭayyibi wa-yajʿala l-khabītha baʿḍahu ʿalā baʿḍin fa-yarkumahu jamīʿan fa-yajʿalahu fī jahannama — ulāʾika humu l-khāsirūn
  trad: Pour qu'Allaah distingue le vicié du bon, et fasse du vicié un amoncellement, l'entassant en totalité, puis le place dans Jahannam — ceux-là sont les perdants.
- ref: S.8:38
  ar: قُلْ لِلَّذِينَ كَفَرُوا إِنْ يَنْتَهُوا يُغْفَرْ لَهُمْ مَا قَدْ سَلَفَ وَإِنْ يَعُودُوا فَقَدْ مَضَتْ سُنَّتُ الْأَوَّلِينَ
  trl: Qul li-lladhīna kafarū in yantahū yughfar lahum mā qad salafa wa-in yaʿūdū fa-qad maḍat sunnatu l-awwalīn
  trad: 'Dis à ceux qui sont kāfirūn : s''ils cessent, il leur sera pardonné ce qui est déjà passé ; mais s''ils reviennent, alors la sunna des anciens a déjà eu lieu.'
- ref: S.8:39
  ar: وَقَاتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّينُ كُلُّهُ لِلَّهِ ۚ فَإِنِ انْتَهَوْا فَإِنَّ اللَّهَ بِمَا يَعْمَلُونَ بَصِيرٌ
  trl: Wa-qātilūhum ḥattā lā takūna fitnatun wa-yakūna d-dīnu kulluhu lillāhi — fa-ini ntahaw fa-inna llāha bimā yaʿmalūna baṣīr
  trad: Et combattez-les jusqu'à ce qu'il n'y ait plus de fitna et que le dīn soit, dans sa totalité, à Allaah — mais s'ils cessent, Allaah est, de ce qu'ils font, Baṣīr.
- ref: S.8:40
  ar: وَإِنْ تَوَلَّوْا فَاعْلَمُوا أَنَّ اللَّهَ مَوْلَاكُمْ ۚ نِعْمَ الْمَوْلَىٰ وَنِعْمَ النَّصِيرُ
  trl: Wa-in tawallaw fa-ʿlamū anna llāha mawlākum — niʿma l-mawlā wa-niʿma n-naṣīr
  trad: Et s'ils se détournent, sachez qu'Allaah est votre mawlā — quel excellent mawlā, quel excellent naṣīr.
- ref: S.8:41
  ar: ۞ وَاعْلَمُوا أَنَّمَا غَنِمْتُمْ مِنْ شَيْءٍ فَأَنَّ لِلَّهِ خُمُسَهُ وَلِلرَّسُولِ وَلِذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَابْنِ السَّبِيلِ إِنْ كُنْتُمْ آمَنْتُمْ بِاللَّهِ وَمَا أَنْزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ الْفُرْقَانِ يَوْمَ الْتَقَى الْجَمْعَانِ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Wa-ʿlamū annamā ghanimtum min shayʾin fa-anna lillāhi khumusahu wa-li-r-rasūli wa-li-dhī l-qurbā wa-l-yatāmā wa-l-masākīni wa-bni s-sabīli in kuntum āmantum billāhi wa-mā anzalnā ʿalā ʿabdinā yawma l-furqāni yawma ltaqā l-jamʿān — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: Et sachez que, de tout ce que vous prenez comme butin, un cinquième revient à Allaah, au rasūl, aux proches, aux orphelins, aux indigents et au voyageur — si vous croyez en Allaah et en ce que Nous avons fait descendre sur Notre ʿabd, au jour du Furqān, le jour où les deux troupes se rencontrèrent. Allaah a pouvoir sur toute chose.
- ref: S.8:42
  ar: إِذْ أَنْتُمْ بِالْعُدْوَةِ الدُّنْيَا وَهُمْ بِالْعُدْوَةِ الْقُصْوَىٰ وَالرَّكْبُ أَسْفَلَ مِنْكُمْ ۚ وَلَوْ تَوَاعَدْتُمْ لَاخْتَلَفْتُمْ فِي الْمِيعَادِ ۙ وَلَٰكِنْ لِيَقْضِيَ اللَّهُ أَمْرًا كَانَ مَفْعُولًا لِيَهْلِكَ مَنْ هَلَكَ عَنْ بَيِّنَةٍ وَيَحْيَىٰ مَنْ حَيَّ عَنْ بَيِّنَةٍ ۗ وَإِنَّ اللَّهَ لَسَمِيعٌ عَلِيمٌ
  trl: Idh antum bi-l-ʿudwati d-dunyā wa-hum bi-l-ʿudwati l-quṣwā wa-r-rakbu asfala minkum — wa-law tawāʿadtum la-khtalaftum fi l-mīʿādi — wa-lākin li-yaqḍiya llāhu amran kāna mafʿūlan li-yahlika man halaka ʿan bayyinatin wa-yaḥyā man ḥayya ʿan bayyinah — wa-inna llāha la-samīʿun ʿalīm
  trad: 'Quand vous étiez sur le versant le plus proche, et eux sur le versant le plus éloigné, et la caravane plus bas que vous — si vous vous étiez donné rendez-vous, vous vous seriez trouvés en désaccord sur ce rendez-vous ; mais il en fut ainsi pour qu''Allaah décide d''une affaire qui devait s''accomplir : que périsse qui devait périr sur une preuve manifeste, et que vive qui devait vivre sur une preuve manifeste. Allaah est, assurément, Samīʿ, ʿAlīm.'
- ref: S.8:43
  ar: إِذْ يُرِيكَهُمُ اللَّهُ فِي مَنَامِكَ قَلِيلًا ۖ وَلَوْ أَرَاكَهُمْ كَثِيرًا لَفَشِلْتُمْ وَلَتَنَازَعْتُمْ فِي الْأَمْرِ وَلَٰكِنَّ اللَّهَ سَلَّمَ ۗ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ
  trl: Idh yurīkahumu llāhu fī manāmika qalīlan — wa-law arākahum kathīran la-fashiltum wa-la-tanāzaʿtum fi l-amri wa-lākinna llāha sallam — innahu ʿalīmun bi-dhāti ṣ-ṣudūr
  trad: Quand Allaah te les montrait, dans ton sommeil, peu nombreux — et s'Il te les avait montrés nombreux, vous auriez failli et vous vous seriez disputés au sujet de l'affaire ; mais Allaah a préservé. Il connaît parfaitement ce qui est dans les poitrines.
- ref: S.8:44
  ar: وَإِذْ يُرِيكُمُوهُمْ إِذِ الْتَقَيْتُمْ فِي أَعْيُنِكُمْ قَلِيلًا وَيُقَلِّلُكُمْ فِي أَعْيُنِهِمْ لِيَقْضِيَ اللَّهُ أَمْرًا كَانَ مَفْعُولًا ۗ وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ
  trl: Wa-idh yurīkumūhum idhi ltaqaytum fī aʿyunikum qalīlan wa-yuqallilukum fī aʿyunihim li-yaqḍiya llāhu amran kāna mafʿūlan — wa-ilā llāhi turjaʿu l-umūr
  trad: Et quand Il vous les montrait, au moment où vous vous rencontriez, peu nombreux à vos yeux, et vous réduisait à leurs yeux — pour qu'Allaah décide d'une affaire qui devait s'accomplir. Et c'est vers Allaah que les affaires font retour.
- ref: S.8:45–46
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا لَقِيتُمْ فِئَةً فَاثْبُتُوا وَاذْكُرُوا اللَّهَ كَثِيرًا لَعَلَّكُمْ تُفْلِحُونَ ۝ وَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ ۖ وَاصْبِرُوا ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ
  trl: Yā ayyuhā lladhīna āmanū idhā laqītum fiʾatan fa-thbutū wa-dhkurū llāha kathīran laʿallakum tufliḥūn — wa-aṭīʿū llāha wa-rasūlahu wa-lā tanāzaʿū fa-tafshalū wa-tadhhaba rīḥukum wa-ṣbirū — inna llāha maʿa ṣ-ṣābirīn
  trad: 'Ô vous qui avez cru, quand vous rencontrez une troupe, tenez bon et invoquez Allaah abondamment, dans l''espoir de réussir. Et obéissez à Allaah et à Son rasūl, et ne vous disputez pas — vous faillirez et votre élan s''en ira. Soyez patients : Allaah est avec les ṣābirūn.'
- ref: S.8:47
  ar: وَلَا تَكُونُوا كَالَّذِينَ خَرَجُوا مِنْ دِيَارِهِمْ بَطَرًا وَرِئَاءَ النَّاسِ وَيَصُدُّونَ عَنْ سَبِيلِ اللَّهِ ۚ وَاللَّهُ بِمَا يَعْمَلُونَ مُحِيطٌ
  trl: Wa-lā takūnū ka-lladhīna kharajū min diyārihim baṭaran wa-riʾāʾa n-nāsi wa-yaṣuddūna ʿan sabīli llāhi — wa-llāhu bimā yaʿmalūna muḥīṭ
  trad: Et ne soyez pas comme ceux qui sont sortis de leurs demeures par bravade et par ostentation devant les gens, détournant du sabīl d'Allaah — Allaah cerne parfaitement ce qu'ils font.
- ref: S.8:48
  ar: وَإِذْ زَيَّنَ لَهُمُ الشَّيْطَانُ أَعْمَالَهُمْ وَقَالَ لَا غَالِبَ لَكُمُ الْيَوْمَ مِنَ النَّاسِ وَإِنِّي جَارٌ لَكُمْ ۖ فَلَمَّا تَرَاءَتِ الْفِئَتَانِ نَكَصَ عَلَىٰ عَقِبَيْهِ وَقَالَ إِنِّي بَرِيءٌ مِنْكُمْ إِنِّي أَرَىٰ مَا لَا تَرَوْنَ إِنِّي أَخَافُ اللَّهَ ۚ وَاللَّهُ شَدِيدُ الْعِقَابِ
  trl: Wa-idh zayyana lahumu sh-shayṭānu aʿmālahum wa-qāla lā ghāliba lakumu l-yawma mina n-nāsi wa-innī jārun lakum — fa-lammā tarāʾati l-fiʾatāni nakaṣa ʿalā ʿaqibayhi wa-qāla innī barīʾun minkum innī arā mā lā tarawna innī akhāfu llāh — wa-llāhu shadīdu l-ʿiqāb
  trad: 'Et quand le shayṭān leur a embelli leurs actions et a dit : « Nul, aujourd''hui, parmi les gens, ne peut vous vaincre, et je suis pour vous un protecteur » — puis, lorsque les deux troupes se virent l''une l''autre, il recula sur ses talons et dit : « Je suis dégagé de vous ; je vois ce que vous ne voyez pas ; je crains Allaah » — Allaah est sévère dans la sanction.'
- ref: S.8:49
  ar: إِذْ يَقُولُ الْمُنَافِقُونَ وَالَّذِينَ فِي قُلُوبِهِمْ مَرَضٌ غَرَّ هَٰؤُلَاءِ دِينُهُمْ ۗ وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَإِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ
  trl: Idh yaqūlu l-munāfiqūna wa-lladhīna fī qulūbihim maraḍun gharra hāʾulāʾi dīnuhum — wa-man yatawakkal ʿalā llāhi fa-inna llāha ʿazīzun ḥakīm
  trad: 'Quand les munāfiqūn, et ceux dans le cœur desquels il y a une maladie, disaient : « Leur dīn a leurré ces gens-là. » Or quiconque place sa confiance en Allaah — Allaah est, assurément, ʿAzīz, Ḥakīm.'
- ref: S.8:50–51
  ar: وَلَوْ تَرَىٰ إِذْ يَتَوَفَّى الَّذِينَ كَفَرُوا ۙ الْمَلَائِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَارَهُمْ وَذُوقُوا عَذَابَ الْحَرِيقِ ۝ ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ اللَّهَ لَيْسَ بِظَلَّامٍ لِلْعَبِيدِ
  trl: Wa-law tarā idh yatawaffā lladhīna kafarū l-malāʾikatu yaḍribūna wujūhahum wa-adbārahum wa-dhūqū ʿadhāba l-ḥarīq — dhālika bi-mā qaddamat aydīkum wa-anna llāha laysa bi-ẓallāmin li-l-ʿabīd
  trad: 'Et si tu voyais, quand les malāʾika font passer ceux qui sont kāfirūn, les frappant au visage et de dos : « Goûtez le châtiment de l''embrasement — cela, à cause de ce que vos mains ont avancé, et parce qu''Allaah n''est en rien injuste envers les serviteurs. »'
- ref: S.8:52
  ar: كَدَأْبِ آلِ فِرْعَوْنَ ۙ وَالَّذِينَ مِنْ قَبْلِهِمْ ۚ كَفَرُوا بِآيَاتِ اللَّهِ فَأَخَذَهُمُ اللَّهُ بِذُنُوبِهِمْ ۗ إِنَّ اللَّهَ قَوِيٌّ شَدِيدُ الْعِقَابِ
  trl: Ka-daʾbi āli firʿawna wa-lladhīna min qablihim — kafarū bi-āyāti llāhi fa-akhadhahumu llāhu bi-dhunūbihim — inna llāha qawiyyun shadīdu l-ʿiqāb
  trad: À l'image du comportement d'Āl Firʿawn et de ceux d'avant eux — ils ont été kāfirūn envers les āyāt d'Allaah, et Allaah les a saisis pour leurs fautes. Allaah est, assurément, Qawiyy, sévère dans la sanction.
- ref: S.8:53
  ar: ذَٰلِكَ بِأَنَّ اللَّهَ لَمْ يَكُ مُغَيِّرًا نِعْمَةً أَنْعَمَهَا عَلَىٰ قَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنْفُسِهِمْ ۙ وَأَنَّ اللَّهَ سَمِيعٌ عَلِيمٌ
  trl: Dhālika bi-anna llāha lam yaku mughayyiran niʿmatan anʿamahā ʿalā qawmin ḥattā yughayyirū mā bi-anfusihim — wa-anna llāha samīʿun ʿalīm
  trad: Cela, parce qu'Allaah n'est pas de nature à changer un bienfait qu'Il a accordé à un peuple, tant que ce peuple n'a pas changé ce qui est en lui-même. Allaah est, assurément, Samīʿ, ʿAlīm.
- ref: S.8:54
  ar: كَدَأْبِ آلِ فِرْعَوْنَ ۙ وَالَّذِينَ مِنْ قَبْلِهِمْ ۚ كَذَّبُوا بِآيَاتِ رَبِّهِمْ فَأَهْلَكْنَاهُمْ بِذُنُوبِهِمْ وَأَغْرَقْنَا آلَ فِرْعَوْنَ ۚ وَكُلٌّ كَانُوا ظَالِمِينَ
  trl: Ka-daʾbi āli firʿawna wa-lladhīna min qablihim — kadhdhabū bi-āyāti rabbihim fa-ahlaknāhum bi-dhunūbihim wa-aghraqnā āla firʿawna — wa-kullun kānū ẓālimīn
  trad: À l'image du comportement d'Āl Firʿawn et de ceux d'avant eux — ils ont traité de mensonge les āyāt de leur Rabb ; Nous les avons alors anéantis pour leurs fautes, et Nous avons noyé Āl Firʿawn. Tous, sans exception, étaient des ẓālimūn.
- ref: S.8:55–56
  ar: إِنَّ شَرَّ الدَّوَابِّ عِنْدَ اللَّهِ الَّذِينَ كَفَرُوا فَهُمْ لَا يُؤْمِنُونَ ۝ الَّذِينَ عَاهَدْتَ مِنْهُمْ ثُمَّ يَنْقُضُونَ عَهْدَهُمْ فِي كُلِّ مَرَّةٍ وَهُمْ لَا يَتَّقُونَ
  trl: Inna sharra d-dawābbi ʿinda llāhi lladhīna kafarū fa-hum lā yuʾminūn — alladhīna ʿāhadta minhum thumma yanquḍūna ʿahdahum fī kulli marratin wa-hum lā yattaqūn
  trad: Les pires des créatures qui se meuvent, auprès d'Allaah, sont ceux qui sont kāfirūn et qui, de ce fait, ne croient pas — ceux avec qui tu as conclu un ʿahd, et qui rompent leur ʿahd à chaque fois, sans se prémunir d'Allaah.
- ref: S.8:57–58
  ar: فَإِمَّا تَثْقَفَنَّهُمْ فِي الْحَرْبِ فَشَرِّدْ بِهِمْ مَنْ خَلْفَهُمْ لَعَلَّهُمْ يَذَّكَّرُونَ ۝ وَإِمَّا تَخَافَنَّ مِنْ قَوْمٍ خِيَانَةً فَانْبِذْ إِلَيْهِمْ عَلَىٰ سَوَاءٍ ۚ إِنَّ اللَّهَ لَا يُحِبُّ الْخَائِنِينَ
  trl: Fa-immā tathqafannahum fi l-ḥarbi fa-sharrid bihim man khalfahum laʿallahum yadhdhakkarūn — wa-immā takhāfanna min qawmin khiyānatan fa-nbidh ilayhim ʿalā sawāʾin — inna llāha lā yuḥibbu l-khāʾinīn
  trad: Si donc tu les surprends au combat, disperse par leur sort ceux qui sont derrière eux, dans l'espoir qu'ils se rappellent. Et si tu crains d'un peuple une trahison, dénonce-leur le pacte sur un pied d'égalité — Allaah n'honore pas les khāʾinūn.
- ref: S.8:59
  ar: وَلَا يَحْسَبَنَّ الَّذِينَ كَفَرُوا سَبَقُوا ۚ إِنَّهُمْ لَا يُعْجِزُونَ
  trl: Wa-lā yaḥsabanna lladhīna kafarū sabaqū — innahum lā yuʿjizūn
  trad: Que ceux qui sont kāfirūn ne pensent surtout pas avoir pris l'avance — ils ne réduiront personne à l'impuissance.
- ref: S.8:60
  ar: وَأَعِدُّوا لَهُمْ مَا اسْتَطَعْتُمْ مِنْ قُوَّةٍ وَمِنْ رِبَاطِ الْخَيْلِ تُرْهِبُونَ بِهِ عَدُوَّ اللَّهِ وَعَدُوَّكُمْ وَآخَرِينَ مِنْ دُونِهِمْ لَا تَعْلَمُونَهُمُ اللَّهُ يَعْلَمُهُمْ ۚ وَمَا تُنْفِقُوا مِنْ شَيْءٍ فِي سَبِيلِ اللَّهِ يُوَفَّ إِلَيْكُمْ وَأَنْتُمْ لَا تُظْلَمُونَ
  trl: Wa-aʿiddū lahum mā staṭaʿtum min quwwatin wa-min ribāṭi l-khayli turhibūna bihi ʿaduwwa llāhi wa-ʿaduwwakum wa-ākharīna min dūnihim lā taʿlamūnahumu llāhu yaʿlamuhum — wa-mā tunfiqū min shayʾin fī sabīli llāhi yuwaffa ilaykum wa-antum lā tuẓlamūn
  trad: Et préparez, contre eux, tout ce que vous pouvez de force et de cavalerie tenue prête — ce par quoi vous inspirez la crainte à l'ennemi d'Allaah et à votre ennemi, ainsi qu'à d'autres, en dehors d'eux, que vous ne connaissez pas — Allaah les connaît. Et tout ce que vous dépenserez sur le sabīl d'Allaah vous sera restitué en plein, sans que vous soyez lésés.
- ref: S.8:61–62
  ar: ۞ وَإِنْ جَنَحُوا لِلسَّلْمِ فَاجْنَحْ لَهَا وَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ ۝ وَإِنْ يُرِيدُوا أَنْ يَخْدَعُوكَ فَإِنَّ حَسْبَكَ اللَّهُ ۚ هُوَ الَّذِي أَيَّدَكَ بِنَصْرِهِ وَبِالْمُؤْمِنِينَ
  trl: Wa-in janaḥū li-s-salmi fa-jnaḥ lahā wa-tawakkal ʿalā llāhi — innahu huwa s-samīʿu l-ʿalīm — wa-in yurīdū an yakhdaʿūka fa-inna ḥasbaka llāhu — huwa lladhī ayyadaka bi-naṣrihi wa-bi-l-muʾminīn
  trad: Et s'ils s'inclinent vers le salm, incline-toi vers lui, et place ta confiance en Allaah — Il est, Lui, as-Samīʿ, al-ʿAlīm. Et s'ils veulent te tromper, Allaah te suffit — c'est Ce qui t'a soutenu de Son secours et par les muʾminūn.
- ref: S.8:63
  ar: وَأَلَّفَ بَيْنَ قُلُوبِهِمْ ۚ لَوْ أَنْفَقْتَ مَا فِي الْأَرْضِ جَمِيعًا مَا أَلَّفْتَ بَيْنَ قُلُوبِهِمْ وَلَٰكِنَّ اللَّهَ أَلَّفَ بَيْنَهُمْ ۚ إِنَّهُ عَزِيزٌ حَكِيمٌ
  trl: Wa-allafa bayna qulūbihim — law anfaqta mā fi l-arḍi jamīʿan mā allafta bayna qulūbihim wa-lākinna llāha allafa baynahum — innahu ʿazīzun ḥakīm
  trad: Et Il a uni leurs cœurs — si tu avais dépensé tout ce qui est sur la terre, tu n'aurais pas uni leurs cœurs ; mais Allaah a uni leurs cœurs. Il est, assurément, ʿAzīz, Ḥakīm.
- ref: S.8:64
  ar: يَا أَيُّهَا النَّبِيُّ حَسْبُكَ اللَّهُ وَمَنِ اتَّبَعَكَ مِنَ الْمُؤْمِنِينَ
  trl: Yā ayyuhā n-nabiyyu ḥasbuka llāhu wa-mani ttabaʿaka mina l-muʾminīn
  trad: Ô nabī, Allaah te suffit, ainsi qu'à qui t'a suivi parmi les muʾminūn.
- ref: S.8:65–66
  ar: يَا أَيُّهَا النَّبِيُّ حَرِّضِ الْمُؤْمِنِينَ عَلَى الْقِتَالِ ۚ إِنْ يَكُنْ مِنْكُمْ عِشْرُونَ صَابِرُونَ يَغْلِبُوا مِائَتَيْنِ ۚ وَإِنْ يَكُنْ مِنْكُمْ مِائَةٌ يَغْلِبُوا أَلْفًا مِنَ الَّذِينَ كَفَرُوا بِأَنَّهُمْ قَوْمٌ لَا يَفْقَهُونَ ۝ الْآنَ خَفَّفَ اللَّهُ عَنْكُمْ وَعَلِمَ أَنَّ فِيكُمْ ضَعْفًا ۚ فَإِنْ يَكُنْ مِنْكُمْ مِائَةٌ صَابِرَةٌ يَغْلِبُوا مِائَتَيْنِ ۚ وَإِنْ يَكُنْ مِنْكُمْ أَلْفٌ يَغْلِبُوا أَلْفَيْنِ بِإِذْنِ اللَّهِ ۗ وَاللَّهُ مَعَ الصَّابِرِينَ
  trl: Yā ayyuhā n-nabiyyu ḥarriḍi l-muʾminīna ʿalā l-qitāl — in yakun minkum ʿishrūna ṣābirūna yaghlibū miʾatayni — wa-in yakun minkum miʾatun yaghlibū alfan mina lladhīna kafarū bi-annahum qawmun lā yafqahūn — al-āna khaffafa llāhu ʿankum wa-ʿalima anna fīkum ḍaʿfan — fa-in yakun minkum miʾatun ṣābiratun yaghlibū miʾatayni — wa-in yakun minkum alfun yaghlibū alfayni bi-idhni llāhi — wa-llāhu maʿa ṣ-ṣābirīn
  trad: 'Ô nabī, encourage les muʾminūn au combat. S''il se trouve parmi vous vingt qui tiennent bon, ils vaincront deux cents ; et s''il s''en trouve cent, ils vaincront mille de ceux qui sont kāfirūn, parce que ce sont des gens qui ne comprennent pas en profondeur. Maintenant, Allaah a allégé pour vous, sachant qu''il y a en vous une faiblesse : s''il se trouve parmi vous cent qui tiennent bon, ils vaincront deux cents ; et s''il s''en trouve mille, ils vaincront deux mille, avec la permission d''Allaah. Allaah est avec les ṣābirūn.'
- ref: S.8:67–68
  ar: مَا كَانَ لِنَبِيٍّ أَنْ يَكُونَ لَهُ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِي الْأَرْضِ ۚ تُرِيدُونَ عَرَضَ الدُّنْيَا وَاللَّهُ يُرِيدُ الْآخِرَةَ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ ۝ لَوْلَا كِتَابٌ مِنَ اللَّهِ سَبَقَ لَمَسَّكُمْ فِيمَا أَخَذْتُمْ عَذَابٌ عَظِيمٌ
  trl: Mā kāna li-nabiyyin an yakūna lahu asrā ḥattā yuthkhina fi l-arḍi — turīdūna ʿaraḍa d-dunyā wa-llāhu yurīdu l-ākhirata — wa-llāhu ʿazīzun ḥakīm — law-lā kitābun mina llāhi sabaqa la-massakum fīmā akhadhtum ʿadhābun ʿaẓīm
  trad: Il n'appartenait pas à un nabī d'avoir des asrā, avant d'avoir pleinement subjugué sur la terre. Vous voulez le bien passager d'ici-bas, et Allaah veut l'ākhira — Allaah est, assurément, ʿAzīz, Ḥakīm. N'eût été une décision déjà consignée par Allaah, un châtiment immense vous aurait certes touchés pour ce que vous avez pris.
- ref: S.8:69
  ar: فَكُلُوا مِمَّا غَنِمْتُمْ حَلَالًا طَيِّبًا ۚ وَاتَّقُوا اللَّهَ ۚ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ
  trl: Fa-kulū mimmā ghanimtum ḥalālan ṭayyiban wa-ttaqū llāha — inna llāha ghafūrun raḥīm
  trad: Mangez donc de ce que vous avez pris comme butin, licite et bon — et prémunissez-vous d'Allaah. Allaah est, assurément, Ghafūr, Raḥīm.
- ref: S.8:70
  ar: يَا أَيُّهَا النَّبِيُّ قُلْ لِمَنْ فِي أَيْدِيكُمْ مِنَ الْأَسْرَىٰ إِنْ يَعْلَمِ اللَّهُ فِي قُلُوبِكُمْ خَيْرًا يُؤْتِكُمْ خَيْرًا مِمَّا أُخِذَ مِنْكُمْ وَيَغْفِرْ لَكُمْ ۗ وَاللَّهُ غَفُورٌ رَحِيمٌ
  trl: Yā ayyuhā n-nabiyyu qul li-man fī aydīkum mina l-asrā in yaʿlami llāhu fī qulūbikum khayran yuʾtikum khayran mimmā ukhidha minkum wa-yaghfir lakum — wa-llāhu ghafūrun raḥīm
  trad: 'Ô nabī, dis à ceux qui, parmi les asrā, se trouvent entre vos mains : « Si Allaah sait en vos cœurs un bien, Il vous donnera meilleur que ce qui vous a été pris, et vous pardonnera. » Allaah est, assurément, Ghafūr, Raḥīm.'
- ref: S.8:71
  ar: وَإِنْ يُرِيدُوا خِيَانَتَكَ فَقَدْ خَانُوا اللَّهَ مِنْ قَبْلُ فَأَمْكَنَ مِنْهُمْ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ
  trl: Wa-in yurīdū khiyānataka fa-qad khānū llāha min qablu fa-amkana minhum — wa-llāhu ʿalīmun ḥakīm
  trad: Et s'ils veulent te trahir, ils ont déjà trahi Allaah auparavant, et Il a donné prise sur eux. Allaah est, assurément, ʿAlīm, Ḥakīm.
- ref: S.8:72
  ar: إِنَّ الَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنْفُسِهِمْ فِي سَبِيلِ اللَّهِ وَالَّذِينَ آوَوْا وَنَصَرُوا أُولَٰئِكَ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ وَالَّذِينَ آمَنُوا وَلَمْ يُهَاجِرُوا مَا لَكُمْ مِنْ وَلَايَتِهِمْ مِنْ شَيْءٍ حَتَّىٰ يُهَاجِرُوا ۚ وَإِنِ اسْتَنْصَرُوكُمْ فِي الدِّينِ فَعَلَيْكُمُ النَّصْرُ إِلَّا عَلَىٰ قَوْمٍ بَيْنَكُمْ وَبَيْنَهُمْ مِيثَاقٌ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
  trl: Inna lladhīna āmanū wa-hājarū wa-jāhadū bi-amwālihim wa-anfusihim fī sabīli llāhi wa-lladhīna āwaw wa-naṣarū ulāʾika baʿḍuhum awliyāʾu baʿḍin — wa-lladhīna āmanū wa-lam yuhājirū mā lakum min walāyatihim min shayʾin ḥattā yuhājirū — wa-ini stanṣarūkum fi d-dīni fa-ʿalaykumu n-naṣru illā ʿalā qawmin baynakum wa-baynahum mīthāqun — wa-llāhu bimā taʿmalūna baṣīr
  trad: Ceux qui ont cru, ont émigré et se sont engagés de leurs biens et d'eux-mêmes sur le sabīl d'Allaah, et ceux qui ont donné refuge et ont secouru — ceux-là sont awliyāʾ les uns des autres. Et ceux qui ont cru sans avoir émigré, vous n'avez aucune walāya envers eux, en rien, jusqu'à ce qu'ils émigrent ; mais s'ils vous demandent secours dans le dīn, le secours vous incombe, sauf contre un peuple avec lequel vous êtes liés par un mīthāq. Allaah, de ce que vous faites, est Baṣīr.
- ref: S.8:73
  ar: وَالَّذِينَ كَفَرُوا بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ إِلَّا تَفْعَلُوهُ تَكُنْ فِتْنَةٌ فِي الْأَرْضِ وَفَسَادٌ كَبِيرٌ
  trl: Wa-lladhīna kafarū baʿḍuhum awliyāʾu baʿḍin — illā tafʿalūhu takun fitnatun fi l-arḍi wa-fasādun kabīr
  trad: Et ceux qui sont kāfirūn sont awliyāʾ les uns des autres — si vous n'agissez pas ainsi, il y aura une fitna sur la terre et un fasād immense.
- ref: S.8:74
  ar: وَالَّذِينَ آمَنُوا وَهَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ وَالَّذِينَ آوَوْا وَنَصَرُوا أُولَٰئِكَ هُمُ الْمُؤْمِنُونَ حَقًّا ۚ لَهُمْ مَغْفِرَةٌ وَرِزْقٌ كَرِيمٌ
  trl: Wa-lladhīna āmanū wa-hājarū wa-jāhadū fī sabīli llāhi wa-lladhīna āwaw wa-naṣarū ulāʾika humu l-muʾminūna ḥaqqan — lahum maghfiratun wa-rizqun karīm
  trad: 'Ceux qui ont cru, ont émigré et se sont engagés sur le sabīl d''Allaah, et ceux qui ont donné refuge et ont secouru — ceux-là sont, en toute vérité, les muʾminūn : à eux un pardon et une attribution généreuse.'
- ref: S.8:75
  ar: وَالَّذِينَ آمَنُوا مِنْ بَعْدُ وَهَاجَرُوا وَجَاهَدُوا مَعَكُمْ فَأُولَٰئِكَ مِنْكُمْ ۚ وَأُولُو الْأَرْحَامِ بَعْضُهُمْ أَوْلَىٰ بِبَعْضٍ فِي كِتَابِ اللَّهِ ۗ إِنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Wa-lladhīna āmanū min baʿdu wa-hājarū wa-jāhadū maʿakum fa-ulāʾika minkum — wa-ulū l-arḥāmi baʿḍuhum awlā bi-baʿḍin fī kitābi llāhi — inna llāha bi-kulli shayʾin ʿalīm
  trad: Et ceux qui ont cru par la suite, ont émigré et se sont engagés avec vous — ceux-là sont des vôtres. Et les ulū l-arḥām, les uns par rapport aux autres, sont plus proches dans le Kitāb d'Allaah. Allaah, de toute chose, est ʿAlīm.
