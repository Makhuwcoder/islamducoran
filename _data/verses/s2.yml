- ref: S.2:1
  ar: الٓمٓ
  trl: '*Alif · Lām · Mīm*'
  trad: Lettres séparées — *ḥurūf muqaṭṭaʿāt*.
- ref: S.2:2
  ar: ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِّلْمُتَّقِينَ
  trl: '*Dhālika l-kitābu lā rayba fīhi — hudan li-l-muttaqīn*'
  trad: Ce Livre — nul doute en lui — est un guide pour les *muttaqīn*.
- ref: S.2:3
  ar: الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ
  trl: '*Alladhīna yuʾminūna bi-l-ghaybi wa-yuqīmūna ṣ-ṣalāta wa-mimmā razaqnāhum yunfiqūn*'
  trad: Ceux qui croient au *ghayb*, établissent la *ṣalāt*, et dépensent de ce dont Nous les avons pourvus.
- ref: S.2:4
  ar: وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ
  trl: '*Wa-lladhīna yuʾminūna bi-mā unzila ilayka wa-mā unzila min qablika wa-bi-l-ākhirati hum yūqinūn*'
  trad: Et ceux qui croient en ce qui t'a été révélé et en ce qui a été révélé avant toi, et qui ont la certitude de l'*ākhira*.
- ref: S.2:5
  ar: أُولَٰئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ ۖ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ
  trl: '*Ulāʾika ʿalā hudan min rabbihim wa-ulāʾika humu l-mufliḥūn*'
  trad: Ceux-là sont sur une guidance venant de leur Rabb, et ceux-là sont les *mufliḥūn*.
- ref: S.2:6
  ar: إِنَّ الَّذِينَ كَفَرُوا سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ
  trl: '*Inna lladhīna kafarū sawāʾun ʿalayhim a-andhartahum am lam tundhirhum lā yuʾminūn*'
  trad: 'Ceux qui ont commis le *kufr* : qu''importe pour eux que tu les aies avertis ou non — ils ne croiront pas.'
- ref: S.2:7
  ar: خَتَمَ اللَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْ ۖ وَعَلَىٰ أَبْصَارِهِمْ غِشَاوَةٌ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌ
  trl: '*Khatama llāhu ʿalā qulūbihim wa-ʿalā samʿihim wa-ʿalā abṣārihim ghishāwatun wa-lahum ʿadhābun ʿaẓīm*'
  trad: Allaah a scellé leurs cœurs et leur ouïe ; et sur leurs regards, un voile — à eux un châtiment immense.
- ref: S.2:8
  ar: وَمِنَ النَّاسِ مَن يَقُولُ آمَنَّا بِاللَّهِ وَبِالْيَوْمِ الْآخِرِ وَمَا هُم بِمُؤْمِنِينَ
  trl: '*Wa-mina n-nāsi man yaqūlu āmannā bi-llāhi wa-bi-l-yawmi l-ākhiri wa-mā hum bi-muʾminīn*'
  trad: 'Parmi les gens, certains disent : « Nous croyons en Allaah et au Jour dernier » — alors qu''ils ne sont pas croyants.'
- ref: S.2:9
  ar: يُخَادِعُونَ اللَّهَ وَالَّذِينَ آمَنُوا وَمَا يَخْدَعُونَ إِلَّا أَنفُسَهُمْ وَمَا يَشْعُرُونَ
  trl: '*Yukhādiʿūna llāha wa-lladhīna āmanū wa-mā yakhḍaʿūna illā anfusahum wa-mā yashʿurūn*'
  trad: Ils s'ingénient à tromper Allaah et ceux qui croient — mais c'est eux-mêmes qu'ils trompent, sans en avoir conscience.
- ref: S.2:10
  ar: فِي قُلُوبِهِم مَّرَضٌ فَزَادَهُمُ اللَّهُ مَرَضًا ۖ وَلَهُمْ عَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْذِبُونَ
  trl: '*Fī qulūbihim maraḍun fa-zādahumu llāhu maraḍan wa-lahum ʿadhābun alīmun bi-mā kānū yakdhibūn*'
  trad: Il y a dans leurs cœurs une maladie, et Allaah leur a accru en maladie — à eux un châtiment douloureux pour les mensonges qu'ils proféraient.
- ref: S.2:11–12
  ar: وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُوا فِي الْأَرْضِ قَالُوا إِنَّمَا نَحْنُ مُصْلِحُونَ ۝ أَلَا إِنَّهُمْ هُمُ الْمُفْسِدُونَ وَلَٰكِن لَّا يَشْعُرُونَ
  trl: '*Wa-idhā qīla lahum lā tufsidū fi l-arḍi qālū innamā naḥnu muṣliḥūn · Alā innahum humu l-mufsidūna wa-lākin lā yashʿurūn*'
  trad: 'Et lorsqu''on leur dit : « Ne semez pas la corruption sur la terre », ils disent : « Nous ne sommes que des *muṣliḥūn*. » — Assurément, ce sont eux les *mufsidūn* — mais ils n''en ont pas conscience.'
- ref: S.2:13
  ar: وَإِذَا قِيلَ لَهُمْ آمِنُوا كَمَا آمَنَ النَّاسُ قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ ۗ أَلَا إِنَّهُمْ هُمُ السُّفَهَاءُ وَلَٰكِن لَّا يَعْلَمُونَ
  trl: '*Wa-idhā qīla lahum āminū kamā āmana n-nāsu qālū a-nuʾminu kamā āmana s-sufahāʾu — alā innahum humu s-sufahāʾu wa-lākin lā yaʿlamūn*'
  trad: 'Quand on leur dit : « Croyez comme *al-nās* ont cru », ils disent : « Allons-nous croire comme ont cru les *sufahāʾ* ? » — Assurément, ce sont eux les *sufahāʾ* — mais ils ne savent pas.'
- ref: S.2:14–16
  ar: وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَوْا إِلَىٰ شَيَاطِينِهِمْ قَالُوا إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِئُونَ ۝ اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ ۝ أُولَٰئِكَ الَّذِينَ اشْتَرَوُا الضَّلَالَةَ بِالْهُدَىٰ فَمَا رَبِحَت تِّجَارَتُهُمْ وَمَا كَانُوا مُهْتَدِينَ
  trl: '*Wa-idhā laqū lladhīna āmanū qālū āmannā wa-idhā khalaw ilā shayāṭīnihim qālū innā maʿakum innamā naḥnu mustahziʾūn · Allāhu yastahziʾu bihim wa-yamadduhum fī ṭughyānihim yaʿmahūn · Ulāʾika lladhīna shtarawu ḍ-ḍalālata bi-l-hudā fa-mā rabiḥat tijāratuhum wa-mā kānū muhtadīn*'
  trad: 'Quand ils rencontrent ceux qui ont cru, ils disent : « Nous croyons » ; et quand ils se retrouvent seuls avec leurs *shayāṭīn*, ils disent : « Nous sommes avec vous — nous les raillons. » — Allaah les rend dérisoires et les prolonge dans leur *ṭughyān* — égarés sans repère. — Voilà ceux qui ont troqué le *hudā* contre la *ḍalāla* : leur commerce n''a fait aucun profit.'
- ref: S.2:17–18
  ar: مَثَلُهُمْ كَمَثَلِ الَّذِي اسْتَوْقَدَ نَارًا فَلَمَّا أَضَاءَتْ مَا حَوْلَهُ ذَهَبَ اللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِي ظُلُمَاتٍ لَّا يُبْصِرُونَ ۝ صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ
  trl: '*Mathaluhum ka-mathali lladhī stawqada nāran fa-lammā aḍāʾat mā ḥawlahu dhahaba llāhu bi-nūrihim wa-tarakahum fī ẓulumātin lā yubṣirūn · Ṣummun bukmun ʿumyun fa-hum lā yarjiʿūn*'
  trad: 'Leur comparaison est celle de quelqu''un qui a allumé un feu : quand il a illuminé ce qui l''entourait, Allaah a emporté leur lumière et les a laissés dans des ténèbres sans qu''ils puissent voir. — Sourds, muets, aveugles — ils ne reviendront donc pas.'
- ref: S.2:19–20
  ar: أَوْ كَصَيِّبٍ مِّنَ السَّمَاءِ فِيهِ ظُلُمَاتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَابِعَهُمْ فِي آذَانِهِم مِّنَ الصَّوَاعِقِ حَذَرَ الْمَوْتِ ۚ وَاللَّهُ مُحِيطٌ بِالْكَافِرِينَ ۝ يَكَادُ الْبَرْقُ يَخْطَفُ أَبْصَارَهُمْ ۖ كُلَّمَا أَضَاءَ لَهُم مَّشَوْا فِيهِ وَإِذَا أَظْلَمَ عَلَيْهِمْ قَامُوا ۚ وَلَوْ شَاءَ اللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَارِهِمْ ۚ إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: '*Aw ka-ṣayyibin mina s-samāʾi fīhi ẓulumātun wa-raʿdun wa-barqun yajʿalūna aṣābiʿahum fī ādhānihim mina ṣ-ṣawāʿiqi ḥadhara l-mawti wa-llāhu muḥīṭun bi-l-kāfirīn · Yakādu l-barqu yakhṭafu abṣārahum kullamā aḍāʾa lahum mashaw fīhi wa-idhā aẓlama ʿalayhim qāmū wa-law shāʾa llāhu la-dhahaba bi-samʿihim wa-abṣārihim inna llāha ʿalā kulli shayʾin qadīr*'
  trad: 'Ou encore comme une averse du ciel chargée de ténèbres, de tonnerre et d''éclair : ils mettent leurs doigts dans leurs oreilles contre la foudre, par crainte de la mort — et Allaah *muḥīṭ* les *kāfirīn*. L''éclair est sur le point d''emporter leurs regards : chaque fois qu''il illumine, ils marchent ; et quand l''obscurité s''étend sur eux, ils s''immobilisent. Si Allaah le voulait, Il emporterait leur ouïe et leurs regards — Allaah est capable de toute chose.'
- ref: S.2:21
  ar: يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ
  trl: '*Yā ayyuhā n-nāsu ʿbudū rabbakumu lladhī khalaqakum wa-lladhīna min qablikum laʿallakum tattaqūn*'
  trad: Ô *al-nās* ! Adorez votre *Rabb*, Ce qui vous a créés, vous et ceux d'avant vous — afin que vous atteigniez la *taqwā*.
- ref: S.2:22
  ar: الَّذِي جَعَلَ لَكُمُ الْأَرْضَ فِرَاشًا وَالسَّمَاءَ بِنَاءً وَأَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَّكُمْ ۖ فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ
  trl: '*Alladhī jaʿala lakumu l-arḍa firāshan wa-s-samāʾa binīʾan wa-anzala mina s-samāʾi māʾan fa-akhraja bihi mina th-thamarāti rizqan lakum — fa-lā tajʿalū li-llāhi andādan wa-antum taʿlamūn*'
  trad: Ce qui a fait de la terre un *firāsh* pour vous et du ciel un *bināʾ* ; Ce qui a fait descendre du ciel une eau et par elle a fait sortir des *thamarāt* comme *rizq* pour vous — n'assignez donc pas à Allaah des *andād*, alors que vous savez.
- ref: S.2:23
  ar: وَإِن كُنتُمْ فِي رَيْبٍ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا بِسُورَةٍ مِّن مِّثْلِهِ وَادْعُوا شُهَدَاءَكُم مِّن دُونِ اللَّهِ إِن كُنتُمْ صَادِقِينَ
  trl: '*Wa-in kuntum fī raybin mimmā nazzalnā ʿalā ʿabdinā fa-ʾtū bi-sūratin min mithlihi wa-dʿū shuhadāʾakum min dūni llāhi in kuntum ṣādiqīn*'
  trad: Si vous êtes dans le doute de ce que Nous avons révélé à Notre serviteur, apportez une *sūra* comparable et invoquez vos témoins en dehors d'Allaah — si vous êtes véridiques.
- ref: S.2:24
  ar: فَإِن لَّمْ تَفْعَلُوا وَلَن تَفْعَلُوا فَاتَّقُوا النَّارَ الَّتِي وَقُودُهَا النَّاسُ وَالْحِجَارَةُ ۖ أُعِدَّتْ لِلْكَافِرِينَ
  trl: '*Fa-in lam tafʿalū wa-lan tafʿalū fa-ttaqū n-nāra llatī waqūduhā n-nāsu wa-l-ḥijāra — uʿiddat li-l-kāfirīn*'
  trad: Si vous ne le faites pas — et vous ne le ferez jamais — gardez-vous du feu dont le combustible est les hommes et les pierres, préparé pour les *kāfirīn*.
- ref: S.2:25
  ar: وَبَشِّرِ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أَنَّ لَهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ۖ كُلَّمَا رُزِقُوا مِنْهَا مِن ثَمَرَةٍ رِّزْقًا ۙ قَالُوا هَٰذَا الَّذِي رُزِقْنَا مِن قَبْلُ ۖ وَأُتُوا بِهِ مُتَشَابِهًا ۖ وَلَهُمْ فِيهَا أَزْوَاجٌ مُّطَهَّرَةٌ ۖ وَهُمْ فِيهَا خَالِدُونَ
  trl: '*Wa-bashshiri lladhīna āmanū wa-ʿamilū ṣ-ṣāliḥāti anna lahum jannātin tajrī min taḥtihā l-anhāru — kullamā ruziqū minhā min thamaratin rizqan qālū hādhā lladhī ruziqnā min qablu wa-utū bihi mutashābihan wa-lahum fīhā azwājun muṭahharatun wa-hum fīhā khālidūn*'
  trad: 'Annonce la bonne nouvelle à ceux qui ont cru et accompli les actes droits : à eux des *jannāt* sous lesquelles coulent des fleuves — chaque fois qu''on leur accordera un fruit comme *rizq*, ils diront : « C''est ce dont on nous a pourvus auparavant » — et on leur en donnera de similaires. À eux des épouses purifiées, et ils y demeureront éternellement.'
- ref: S.2:26
  ar: إِنَّ اللَّهَ لَا يَسْتَحْيِي أَن يَضْرِبَ مَثَلًا مَّا بَعُوضَةً فَمَا فَوْقَهَا ۚ فَأَمَّا الَّذِينَ آمَنُوا فَيَعْلَمُونَ أَنَّهُ الْحَقُّ مِن رَّبِّهِمْ ۖ وَأَمَّا الَّذِينَ كَفَرُوا فَيَقُولُونَ مَاذَا أَرَادَ اللَّهُ بِهَٰذَا مَثَلًا ۘ يُضِلُّ بِهِ كَثِيرًا وَيَهْدِي بِهِ كَثِيرًا ۚ وَمَا يُضِلُّ بِهِ إِلَّا الْفَاسِقِينَ
  trl: '*Inna llāha lā yastaḥyī an yaḍriba mathalan mā baʿūḍatan fa-mā fawqahā — fa-ammā lladhīna āmanū fa-yaʿlamūna annahu l-ḥaqqu min rabbihim wa-ammā lladhīna kafarū fa-yaqūlūna mādhā arāda llāhu bi-hādhā mathalan — yuḍillu bihi kathīran wa-yahdī bihi kathīran wa-mā yuḍillu bihi illā l-fāsiqīn*'
  trad: 'Certes Allaah ne se prive pas de prendre en exemple un moustique ou ce qui le dépasse. Ceux qui ont cru savent que c''est le *ḥaqq* venant de leur *Rabb*. Quant à ceux qui ont commis le *kufr*, ils disent : « Qu''a voulu Allaah par cet exemple ? » — Par cela Il en égare beaucoup et en guide beaucoup, et Il n''égare par cela que les *fāsiqīn*.'
- ref: S.2:27
  ar: الَّذِينَ يَنقُضُونَ عَهْدَ اللَّهِ مِن بَعْدِ مِيثَاقِهِ وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَن يُوصَلَ وَيُفْسِدُونَ فِي الْأَرْضِ ۚ أُولَٰئِكَ هُمُ الْخَاسِرُونَ
  trl: '*Alladhīna yanquḍūna ʿahda llāhi min baʿdi mīthāqihi wa-yaqṭaʿūna mā amara llāhu bihi an yūṣala wa-yufsidūna fī l-arḍi — ulāʾika humu l-khāsirūn*'
  trad: Ceux qui rompent le pacte d'Allaah après l'avoir solidement scellé, qui rompent ce qu'Allaah a ordonné de relier, et qui sèment la corruption sur la terre — ceux-là sont les *khāsirūn*.
- ref: S.2:28
  ar: كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنتُمْ أَمْوَاتًا فَأَحْيَاكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ
  trl: '*Kayfa takfurūna bi-llāhi wa-kuntum amwātan fa-aḥyākum thumma yumītukum thumma yuḥyīkum thumma ilayhi turjaʿūn*'
  trad: Comment pouvez-vous commettre le *kufr* envers Allaah alors que vous étiez morts et qu'Il vous a fait vivre, puis Il vous fera mourir, puis Il vous fera vivre à nouveau, puis c'est vers Lui que vous serez ramenés ?
- ref: S.2:29
  ar: هُوَ الَّذِي خَلَقَ لَكُم مَّا فِي الْأَرْضِ جَمِيعًا ثُمَّ اسْتَوَىٰ إِلَى السَّمَاءِ فَسَوَّاهُنَّ سَبْعَ سَمَاوَاتٍ ۚ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: '*Huwa lladhī khalaqa lakum mā fī l-arḍi jamīʿan thumma stawā ilā s-samāʾi fa-sawwāhunna sabʿa samāwātin wa-huwa bi-kulli shayʾin ʿalīm*'
  trad: C'est Ce qui a créé pour vous tout ce qui est dans la terre, en totalité ; puis *stawā* vers le *samāʾ* et en a égalisé sept *samāwāt* — et Il est de toute chose savant.
- ref: S.2:30
  ar: وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً ۖ قَالُوا أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّي أَعْلَمُ مَا لَا تَعْلَمُونَ
  trl: '*Wa-idh qāla rabbuka li-l-malāʾikati innī jāʿilun fī l-arḍi khalīfatan · qālū a-tajʿalu fīhā man yufsidu fīhā wa-yasfiku d-dimāʾa wa-naḥnu nusabbiḥu bi-ḥamdika wa-nuqaddisu laka · qāla innī aʿlamu mā lā taʿlamūn*'
  trad: 'Et quand ton *Rabb* dit aux *malāʾika* : « Je vais établir sur la terre un *khalīfa* » — ils dirent : « Vas-Tu y établir des êtres qui y répandront la corruption et verseront le sang, alors que nous accomplissons le *tasbīḥ* en Ta *ḥamd* et Te sanctifions ? » — Il dit : « Je sais ce que vous ne savez pas. »'
- ref: S.2:31
  ar: وَعَلَّمَ آدَمَ الْأَسْمَاءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى الْمَلَائِكَةِ فَقَالَ أَنبِئُونِي بِأَسْمَاءِ هَٰؤُلَاءِ إِن كُنتُمْ صَادِقِينَ
  trl: '*Wa-ʿallama Ādama l-asmāʾa kullahā thumma ʿaraḍahum ʿalā l-malāʾikati fa-qāla anbiʾūnī bi-asmāʾi hāʾulāʾi in kuntum ṣādiqīn*'
  trad: 'Et Il enseigna à Ādam tous les noms ; puis Il les présenta aux *malāʾika* et dit : « Informez-moi des noms de ceux-là, si vous êtes véridiques. »'
- ref: S.2:32
  ar: قَالُوا سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنتَ الْعَلِيمُ الْحَكِيمُ
  trl: '*Qālū subḥānaka lā ʿilma lanā illā mā ʿallamtanā innaka anta l-ʿalīmu l-ḥakīm*'
  trad: 'Ils dirent : « *Subḥānaka* — nulle connaissance pour nous sinon ce que Tu nous as enseigné — Tu es *al-ʿalīmu l-ḥakīm*. »'
- ref: S.2:33
  ar: قَالَ يَا آدَمُ أَنبِئْهُم بِأَسْمَائِهِمْ ۖ فَلَمَّا أَنبَأَهُم بِأَسْمَائِهِمْ قَالَ أَلَمْ أَقُل لَّكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَمَا كُنتُمْ تَكْتُمُونَ
  trl: '*Qāla yā Ādamu anbiʾhum bi-asmāʾihim · fa-lammā anbaʾahum bi-asmāʾihim qāla a-lam aqul lakum innī aʿlamu ghayba s-samāwāti wa-l-arḍi wa-aʿlamu mā tubdūna wa-mā kuntum taktumūn*'
  trad: 'Il dit : « Ô Ādam, informe-les de leurs noms. » Quand il les eut informés de leurs noms, Il dit : « Ne vous ai-Je pas dit que Je connais le *ghayb* des cieux et de la terre, et que Je sais ce que vous exprimez et ce que vous dissimuliez ? »'
- ref: S.2:34
  ar: وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ أَبَىٰ وَاسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ
  trl: '*Wa-idh qulnā li-l-malāʾikati sjudū li-Ādama fa-sajadū illā Iblīsa abā wa-stakbara wa-kāna mina l-kāfirīn*'
  trad: 'Et quand Nous dîmes aux *malāʾika* : « Prosternez-vous devant Ādam » — ils se prosternèrent, sauf Iblīs : il refusa, s''enorgueillit, et il fut parmi les *kāfirīn*.'
- ref: S.2:35
  ar: وَقُلْنَا يَا آدَمُ اسْكُنْ أَنتَ وَزَوْجُكَ الْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَٰذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ
  trl: '*Wa-qulnā yā Ādamu skun anta wa-zawjuka l-jannata wa-kulā minhā raghadam ḥaythu shiʾtumā wa-lā taqrabā hādhihi sh-shajarata fa-takūnā mina ẓ-ẓālimīn*'
  trad: 'Nous dîmes : « Ô Ādam, demeure toi et ton épouse dans la *janna* et mangez-en librement où vous voudrez — mais n''approchez pas cet arbre, autrement vous seriez des *ẓālimīn*. »'
- ref: S.2:36
  ar: فَأَزَلَّهُمَا الشَّيْطَانُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِ ۖ وَقُلْنَا اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ وَلَكُمْ فِي الْأَرْضِ مُسْتَقَرٌّ وَمَتَاعٌ إِلَىٰ حِينٍ
  trl: '*Fa-azallahumā sh-shayṭānu ʿanhā fa-akhrajahumā mimmā kānā fīhi wa-qulnā hbiṭū baʿḍukum li-baʿḍin ʿaduwwun wa-lakum fī l-arḍi mustaqarrun wa-matāʿun ilā ḥīn*'
  trad: 'Alors le *shayṭān* les fit glisser hors d''elle et les fit sortir de là où ils se trouvaient. Nous dîmes : « Descendez — vous serez mutuellement ennemis. À vous sur la terre une demeure et une jouissance jusqu''à un terme fixé. »'
- ref: S.2:37
  ar: فَتَلَقَّىٰ آدَمُ مِن رَّبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ
  trl: '*Fa-talaqqā Ādamu min rabbihi kalimātin fa-tāba ʿalayhi innahu huwa t-tawwābu r-raḥīm*'
  trad: Alors Ādam reçut de son *Rabb* des *kalimāt*, et Il (*Allaah*) accueillit son retour — Il est *at-Tawwāb*, le *raḥīm*.
- ref: S.2:38–39
  ar: قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا ۖ فَإِمَّا يَأْتِيَنَّكُم مِّنِّي هُدًى فَمَن تَبِعَ هُدَايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ ۝ وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: '*Qulnā hbiṭū minhā jamīʿan fa-immā yaʾtiyannakum minnī hudan fa-man tabiʿa hudāya fa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn · Wa-lladhīna kafarū wa-kadhdhabū bi-āyātinā ulāʾika aṣḥābu n-nār hum fīhā khālidūn*'
  trad: 'Nous dîmes : « Descendez-en tous — si un guide venant de Moi vous parvient, ceux qui suivront Mon guide n''auront nulle crainte et ne seront pas attristés. » — Et ceux qui ont commis le *kufr* et démenti Nos *āyāt* — ceux-là sont les compagnons du feu, ils y demeureront en permanence.'
- ref: S.2:40–41
  ar: يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا بِعَهْدِي أُوفِ بِعَهْدِكُمْ وَإِيَّايَ فَارْهَبُونِ ۝ وَآمِنُوا بِمَا أَنزَلْتُ مُصَدِّقًا لِّمَا مَعَكُمْ وَلَا تَكُونُوا أَوَّلَ كَافِرٍ بِهِ ۖ وَلَا تَشْتَرُوا بِآيَاتِي ثَمَنًا قَلِيلًا وَإِيَّايَ فَاتَّقُونِ
  trl: '*Yā banī Isrāʾīla dhkurū niʿmatiya llatī anʿamtu ʿalaykum wa-awfū bi-ʿahdī ūfi bi-ʿahdikum wa-iyyāya fa-rhbūn · Wa-āminū bi-mā anzaltu muṣaddiqan li-mā maʿakum wa-lā takūnū awwala kāfirin bihi wa-lā tashtarū bi-āyātī thamanan qalīlan wa-iyyāya fa-ttaqūn*'
  trad: 'Ô descendants d''Isrāʾīl, rappelez-vous Mon bienfait dont Je vous ai comblés : respectez Mon pacte, Je respecterai votre pacte — et ne redoutez que Moi. — Et croyez en ce que J''ai révélé, confirmant ce qui est avec vous — ne soyez pas les premiers à le renier — et ne vendez pas Mes *āyāt* pour un prix dérisoire — et ne craignez que Moi.'
- ref: S.2:42–44
  ar: وَلَا تَلْبِسُوا الْحَقَّ بِالْبَاطِلِ وَتَكْتُمُوا الْحَقَّ وَأَنتُمْ تَعْلَمُونَ ۝ وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ ۝ أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنسَوْنَ أَنفُسَكُمْ وَأَنتُمْ تَتْلُونَ الْكِتَابَ ۚ أَفَلَا تَعْقِلُونَ
  trl: '*Wa-lā talbisū l-ḥaqqa bi-l-bāṭili wa-taktumū l-ḥaqqa wa-antum taʿlamūn · Wa-aqīmū ṣ-ṣalāta wa-ātū z-zakāta wa-rkaʿū maʿa r-rākiʿīn · A-taʾmurūna n-nāsa bi-l-birri wa-tansawna anfusakum wa-antum tatlūna l-kitāba a-fa-lā taʿqilūn*'
  trad: Et ne recouvrez pas le *ḥaqq* de *bāṭil* et ne dissimulez pas le *ḥaqq* alors que vous savez. — Établissez la *ṣalāt*, faites parvenir la *zakāt*, et inclinez-vous avec ceux qui s'inclinent. — Commandez-vous aux gens le *birr* tout en vous oubliant vous-mêmes, alors que vous récitez le Livre ? Ne raisonnez-vous pas ?
- ref: S.2:45–48
  ar: وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِينَ ۝ الَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَاقُو رَبِّهِمْ وَأَنَّهُمْ إِلَيْهِ رَاجِعُونَ ۝ يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَنِّي فَضَّلْتُكُمْ عَلَى الْعَالَمِينَ ۝ وَاتَّقُوا يَوْمًا لَّا تَجْزِي نَفْسٌ عَن نَّفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا شَفَاعَةٌ وَلَا يُؤْخَذُ مِنْهَا عَدْلٌ وَلَا هُمْ يُنصَرُونَ
  trl: '*Wa-staʿīnū bi-ṣ-ṣabri wa-ṣ-ṣalāti wa-innahā la-kabīratun illā ʿalā l-khāshiʿīn · Alladhīna yaẓunnūna annahum mulāqū rabbihim wa-annahum ilayhi rājiʿūn · Yā banī Isrāʾīla dhkurū niʿmatiya llatī anʿamtu ʿalaykum wa-annī faḍḍaltukum ʿalā l-ʿālamīn · Wa-ttaqū yawman lā tajzī nafsun ʿan nafsin shayʾan wa-lā yuqbalu minhā shafāʿatun wa-lā yuʾkhadhu minhā ʿadlun wa-lā hum yunṣarūn*'
  trad: 'Et cherchez appui dans le *ṣabr* et la *ṣalāt* — c''est certes lourd, sauf pour les *khāshiʿīn* : ceux qui ont la certitude intérieure qu''ils rencontreront leur *Rabb* et que c''est vers Lui qu''ils retourneront. — Ô descendants d''Isrāʾīl, rappelez-vous Mon bienfait dont Je vous ai comblés et que Je vous ai distingués au-dessus des *ʿālamīn*. — Et constituez-vous une taqwā en vue d''un Jour où nulle âme ne s''acquittera pour une autre de quoi que ce soit, nulle *shafāʿa* ne sera acceptée, nulle rançon ne sera prise, et ils ne seront pas secourus.'
- ref: S.2:49–50
  ar: وَإِذْ نَجَّيْنَاكُم مِّنْ آلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوءَ الْعَذَابِ يُذَبِّحُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ ۚ وَفِي ذَٰلِكُم بَلَاءٌ مِّن رَّبِّكُمْ عَظِيمٌ ۝ وَإِذْ فَرَقْنَا بِكُمُ الْبَحْرَ فَأَنجَيْنَاكُمْ وَأَغْرَقْنَا آلَ فِرْعَوْنَ وَأَنتُمْ تَنظُرُونَ
  trl: '*Wa-idh najjaynākum min āli Firʿawna yasūmūnakum sūʾa l-ʿadhābi yudhabbihūna abnāʾakum wa-yastaḥyūna nisāʾakum wa-fī dhālikum balāʾun min rabbikum ʿaẓīm · Wa-idh faraqnā bi-kumu l-baḥra fa-anjaynākum wa-aghraqnā āla Firʿawna wa-antum tanẓurūn*'
  trad: Et quand Nous vous avons sauvés de l'entourage de Firʿawn qui vous infligeaient le pire du châtiment — égorgeant vos fils et laissant vivre vos femmes — en cela il y avait une épreuve immense de votre *Rabb*. — Et quand Nous avons fendu la mer pour vous, Nous vous avons sauvés et avons noyé l'entourage de Firʿawn sous vos regards.
- ref: S.2:51–53
  ar: وَإِذْ وَاعَدْنَا مُوسَىٰ أَرْبَعِينَ لَيْلَةً ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِن بَعْدِهِ وَأَنتُمْ ظَالِمُونَ ۝ ثُمَّ عَفَوْنَا عَنكُم مِّن بَعْدِ ذَٰلِكَ لَعَلَّكُمْ تَشْكُرُونَ ۝ وَإِذْ آتَيْنَا مُوسَى الْكِتَابَ وَالْفُرْقَانَ لَعَلَّكُمْ تَهْتَدُونَ
  trl: '*Wa-idh wāʿadnā Mūsā arbaʿīna laylatan thumma ttakhadhtumu l-ʿijla min baʿdihi wa-antum ẓālimūn · Thumma ʿafawnā ʿankum min baʿdi dhālika laʿallakum tashkurūn · Wa-idh ātaynā Mūsā l-kitāba wa-l-furqāna laʿallakum tahtadūn*'
  trad: Et quand Nous avons accordé rendez-vous à Mūsā quarante nuits — vous avez pris le *ʿijl* après lui, et vous étiez des *ẓālimīn*. — Puis Nous vous avons pardonné après cela — afin que vous soyez reconnaissants. — Et quand Nous avons donné à Mūsā le Livre et le *furqān* — afin que vous soyez guidés.
- ref: S.2:54–56
  ar: وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ يَا قَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِاتِّخَاذِكُمُ الْعِجْلَ فَتُوبُوا إِلَىٰ بَارِئِكُمْ فَاقْتُلُوا أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌ لَّكُمْ عِندَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ
  trl: '*Wa-idh qāla Mūsā li-qawmihi yā qawmi innakum ẓalamtum anfusakum bi-ttikhadhikumu l-ʿijla fa-tūbū ilā bāriʾikum fa-qtulū anfusakum dhālikum khayrun lakum ʿinda bāriʾikum fa-tāba ʿalaykum innahu huwa t-tawwābu r-raḥīm*'
  trad: 'Et quand Mūsā dit à son peuple : « Ô mon peuple, vous vous êtes causé le *ẓulm* à vous-mêmes en prenant le *ʿijl* — revenez vers votre *Bāriʾ* et tuez-vous les uns les autres — cela est meilleur pour vous auprès de votre *Bāriʾ* » — et Il accueillit votre retour — Il est *at-Tawwāb*, le *raḥīm*.'
- ref: S.2:57–61
  ar: وَظَلَّلْنَا عَلَيْكُمُ الْغَمَامَ وَأَنزَلْنَا عَلَيْكُمُ الْمَنَّ وَالسَّلْوَىٰ ۖ كُلُوا مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ ۖ وَمَا ظَلَمُونَا وَلَٰكِن كَانُوا أَنفُسَهُمْ يَظْلِمُونَ
  trl: '*Wa-ẓallalnā ʿalaykumu l-ghamāma wa-anzalnā ʿalaykumu l-manna wa-s-salwā kulū min ṭayyibāti mā razaqnākum wa-mā ẓalamanā wa-lākin kānū anfusahum yaẓlimūn*'
  trad: Nous avons étendu sur vous le nuage comme ombrage, Nous avons fait descendre sur vous le *mann* et la *salwā* — mangez des bonnes choses dont Nous vous avons pourvus — et ils ne Nous ont pas causé de *ẓulm*, mais c'est à eux-mêmes qu'ils causaient le *ẓulm*.
- ref: S.2:62
  ar: إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَادُوا وَالنَّصَارَىٰ وَالصَّابِئِينَ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَعَمِلَ صَالِحًا فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: '*Inna lladhīna āmanū wa-lladhīna hādū wa-n-naṣārā wa-ṣ-ṣābiʾīna man āmana bi-llāhi wa-l-yawmi l-ākhiri wa-ʿamila ṣāliḥan fa-lahum ajruhum ʿinda rabbihim wa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn*'
  trad: 'Ceux qui ont cru, ceux qui ont pratiqué le judaïsme, les *naṣārā* et les *ṣābiʾūn* — quiconque parmi eux a cru en Allaah et au Jour dernier et a accompli des actes droits — à eux leur rétribution auprès de leur *Rabb* : nulle crainte sur eux, et ils ne seront pas attristés.'
- ref: S.2:63–66
  ar: وَإِذْ أَخَذْنَا مِيثَاقَكُمْ وَرَفَعْنَا فَوْقَكُمُ الطُّورَ خُذُوا مَا آتَيْنَاكُم بِقُوَّةٍ وَاذْكُرُوا مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَ ۝ ثُمَّ تَوَلَّيْتُم مِّن بَعْدِ ذَٰلِكَ ۖ فَلَوْلَا فَضْلُ اللَّهِ عَلَيْكُمْ وَرَحْمَتُهُ لَكُنتُم مِّنَ الْخَاسِرِينَ
  trl: '*Wa-idh akhadhnā mīthāqakum wa-rafaʿnā fawqakumu ṭ-ṭūra khudhū mā ātaynākum bi-quwwatin wa-dhkurū mā fīhi laʿallakum tattaqūn · Thumma tawallaytum min baʿdi dhālika fa-lawlā faḍlu llāhi ʿalaykum wa-raḥmatuhu la-kuntum mina l-khāsirīn*'
  trad: 'Et quand Nous avons pris votre *mīthāq* et avons élevé le *Ṭūr* au-dessus de vous : « Saisissez ce que Nous vous avons donné avec force, et rappelez-vous ce qui s''y trouve — afin que vous vous constituiez une *taqwā*. » — Puis vous avez tourné le dos après cela — sans le *faḍl* d''Allaah sur vous et Sa *raḥma*, vous auriez été parmi les *khāsirīn*.'
- ref: S.2:67–71
  ar: وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تَذْبَحُوا بَقَرَةً ۖ قَالُوا أَتَتَّخِذُنَا هُزُوًا ۖ قَالَ أَعُوذُ بِاللَّهِ أَنْ أَكُونَ مِنَ الْجَاهِلِينَ
  trl: '*Wa-idh qāla Mūsā li-qawmihi inna llāha yaʾmurukum an tadhbaḥū baqaratan · qālū a-tattakhidhu-nā huzuwan · qāla aʿūdhu bi-llāhi an akūna mina l-jāhilīn*'
  trad: 'Et quand Mūsā dit à son peuple : « Allaah vous ordonne d''égorger une vache » — ils dirent : « Nous prends-tu en moquerie ? » — Il dit : « Je cherche refuge en Allaah pour n''être point du nombre des *jāhilīn*. » — Ils demandèrent qu''elle soit précisée : ni trop vieille ni génisse, *ʿawān* entre les deux, d''un jaune pur réjouissant. — Ils faillirent ne pas la sacrifier.'
- ref: S.2:72–74
  ar: وَإِذْ قَتَلْتُمْ نَفْسًا فَادَّارَأْتُمْ فِيهَا ۖ وَاللَّهُ مُخْرِجٌ مَّا كُنتُمْ تَكْتُمُونَ ۝ فَقُلْنَا اضْرِبُوهُ بِبَعْضِهَا ۚ كَذَٰلِكَ يُحْيِي اللَّهُ الْمَوْتَىٰ وَيُرِيكُمْ آيَاتِهِ لَعَلَّكُمْ تَعْقِلُونَ ۝ ثُمَّ قَسَتْ قُلُوبُكُم مِّن بَعْدِ ذَٰلِكَ فَهِيَ كَالْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً
  trl: '*Wa-idh qataltum nafsan fa-ddāraʾtum fīhā wa-llāhu mukhrijun mā kuntum taktumūn · Fa-qulnā iḍribūhu bi-baʿḍihā ka-dhālika yuḥyī llāhu l-mawtā wa-yurīkum āyātihi laʿallakum taʿqilūn · Thumma qasat qulūbukum min baʿdi dhālika fa-hiya ka-l-ḥijārati aw ashaddu qaswatan*'
  trad: 'Et quand vous avez tué une âme et vous en êtes rejeté la responsabilité — Allaah fait sortir ce que vous dissimuliez. — Nous avons dit : « Frappez-le avec une partie d''elle. » Ainsi Allaah redonne vie aux morts et vous montre Ses *āyāt* — peut-être raisonnerez-vous. — Puis vos cœurs se sont durcis après cela — ils sont comme les pierres ou encore plus durs en dureté. Or parmi les pierres il en est d''où jaillissent les fleuves, il en est qui se fendent et d''où sort l''eau, et il en est qui s''effondrent par *khashya* d''Allaah — et Allaah n''est pas inattentif à ce que vous faites.'
- ref: S.2:75
  ar: أَفَتَطْمَعُونَ أَن يُؤْمِنُوا لَكُمْ وَقَدْ كَانَ فَرِيقٌ مِّنْهُمْ يَسْمَعُونَ كَلَامَ اللَّهِ ثُمَّ يُحَرِّفُونَهُ مِن بَعْدِ مَا عَقَلُوهُ وَهُمْ يَعْلَمُونَ
  trl: '*A-fa-taṭmaʿūna an yuʾminū lakum wa-qad kāna farīqun minhum yasmaʿūna kalāma llāhi thumma yuḥarrifūnahu min baʿdi mā ʿaqalūhu wa-hum yaʿlamūn*'
  trad: Espérez-vous qu'ils vous croient alors qu'un groupe d'entre eux entendait la parole d'Allaah puis la déformait après l'avoir pleinement intégré par leur raison, en pleine conscience ?
- ref: S.2:76–77
  ar: وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَا بَعْضُهُمْ إِلَىٰ بَعْضٍ قَالُوا أَتُحَدِّثُونَهُم بِمَا فَتَحَ اللَّهُ عَلَيْكُمْ لِيُحَاجُّوكُم بِهِ عِندَ رَبِّكُمْ ۚ أَفَلَا تَعْقِلُونَ ۝ أَوَلَا يَعْلَمُونَ أَنَّ اللَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ
  trl: '*Wa-idhā laqū lladhīna āmanū qālū āmannā wa-idhā khalā baʿḍuhum ilā baʿḍin qālū a-tuḥaddithūnahum bi-mā fataḥa llāhu ʿalaykum li-yuḥājjūkum bihi ʿinda rabbikum a-fa-lā taʿqilūn · A-wa-lā yaʿlamūna anna llāha yaʿlamu mā yusirrūna wa-mā yuʿlinūn*'
  trad: 'Quand ils rencontrent ceux qui croient, ils disent : « Nous croyons » ; mais quand certains se retirent avec d''autres, ils disent : « Leur parlez-vous de ce qu''Allaah a ouvert sur vous, pour qu''ils vous en fassent argument auprès de votre *Rabb* ? Ne raisonnez-vous pas ! » — Ne savent-ils pas qu''Allaah sait ce qu''ils taisent et ce qu''ils proclament ?'
- ref: S.2:78–79
  ar: وَمِنْهُمْ أُمِّيُّونَ لَا يَعْلَمُونَ الْكِتَابَ إِلَّا أَمَانِيَّ وَإِن هُمْ إِلَّا يَظُنُّونَ ۝ فَوَيْلٌ لِّلَّذِينَ يَكْتُبُونَ الْكِتَابَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَٰذَا مِنْ عِندِ اللَّهِ لِيَشْتَرُوا بِهِ ثَمَنًا قَلِيلًا
  trl: '*Wa-minhum ummiyyūna lā yaʿlamūna l-kitāba illā amāniyya wa-in hum illā yaẓunnūn · Fa-waylun li-lladhīna yaktubūna l-kitāba bi-aydīhim thumma yaqūlūna hādhā min ʿindi llāhi li-yashtarū bihi thamanan qalīlan*'
  trad: 'Parmi eux des *ummiyyūn* qui ne connaissent le Livre que par des *amānī* — ils ne font que conjecturer. — *Waylun* à ceux qui écrivent le Livre de leurs propres mains puis disent : « Ceci vient d''Allaah Lui-même » pour en tirer un prix dérisoire.'
- ref: S.2:80–82
  ar: وَقَالُوا لَن تَمَسَّنَا النَّارُ إِلَّا أَيَّامًا مَّعْدُودَةً ۚ قُلْ أَتَّخَذْتُمْ عِندَ اللَّهِ عَهْدًا فَلَن يُخْلِفَ اللَّهُ عَهْدَهُ ۖ أَمْ تَقُولُونَ عَلَى اللَّهِ مَا لَا تَعْلَمُونَ
  trl: '*Wa-qālū lan tamassanā n-nāru illā ayyāman maʿdūdatan · Qul a-ttakhadhtum ʿinda llāhi ʿahdan fa-lan yukhlifa llāhu ʿahdahu am taqūlūna ʿalā llāhi mā lā taʿlamūn*'
  trad: 'Et ils dirent : « Le feu ne nous touchera que quelques jours comptés. » — Dis : « Avez-vous pris auprès d''Allaah un *ʿahd* — car Allaah ne manquera pas à Son *ʿahd* — ou dites-vous sur Allaah ce que vous ne savez pas ? » — Bien au contraire : quiconque acquiert une mauvaise action et que sa *khaṭīʾa* l''a encerclé — ceux-là sont les gens du feu, ils y demeureront éternellement. Ceux qui ont cru et accompli des actes droits — ceux-là sont les gens de la *janna*, ils y demeureront éternellement.'
- ref: S.2:83–86
  ar: وَإِذْ أَخَذْنَا مِيثَاقَ بَنِي إِسْرَائِيلَ لَا تَعْبُدُونَ إِلَّا اللَّهَ وَبِالْوَالِدَيْنِ إِحْسَانًا وَذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَقُولُوا لِلنَّاسِ حُسْنًا وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ
  trl: '*Wa-idh akhadhnā mīthāqa banī Isrāʾīla lā taʿbudūna illā llāha wa-bi-l-wālidayni iḥsānan wa-dhī l-qurbā wa-l-yatāmā wa-l-masākīni wa-qūlū li-n-nāsi ḥusnan wa-aqīmū ṣ-ṣalāta wa-ātū z-zakāta*'
  trad: 'Et quand Nous avons pris le *mīthāq* des fils d''Isrāʾīl : vous ne servirez qu''Allaah — et envers les deux parents de l''*iḥsān*, et envers les proches, les *yatāmā* et les *masākīn* — dites aux gens de belles paroles — établissez la *ṣalāt*, faites parvenir la *zakāt*. — Puis vous avez tourné le dos — sauf un petit nombre. — Voilà que vous vous entretuez et expulsez un groupe de vos demeures : croyez-vous donc en une partie du Livre et rejetez-vous l''autre ?'
- ref: S.2:87–88
  ar: وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ وَقَفَّيْنَا مِن بَعْدِهِ بِالرُّسُلِ ۖ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ ۗ أَفَكُلَّمَا جَاءَكُمْ رَسُولٌ بِمَا لَا تَهْوَىٰ أَنفُسُكُمُ اسْتَكْبَرْتُمْ فَفَرِيقًا كَذَّبْتُمْ وَفَرِيقًا تَقْتُلُونَ
  trl: '*Wa-laqad ātaynā Mūsā l-kitāba wa-qaffaynā min baʿdihi bi-r-rusuli wa-ātaynā ʿĪsā bna Maryama l-bayyināti wa-ayyadnāhu bi-rūḥi l-qudusi · A-fa-kullamā jāʾakum rasūlun bi-mā lā tahwā anfusakum istakbartum fa-farīqan kadhdhabtum wa-farīqan taqtulūn*'
  trad: Et assurément Nous avons donné à Mūsā le Livre et fait suivre après lui des *rusul* ; et Nous avons donné à ʿĪsā fils de Maryam les preuves manifestes et l'avons soutenu par le *rūḥ al-qudus*. — Et c'est ainsi que, chaque fois qu'un *rasūl* vous est venu avec ce qui ne correspondait pas aux désirs de vos âmes, vous vous êtes montrés arrogants — traitant de menteurs un groupe, et en tuant un autre ?
- ref: S.2:89–93
  ar: وَلَمَّا جَاءَهُمْ كِتَابٌ مِّنْ عِندِ اللَّهِ مُصَدِّقٌ لِّمَا مَعَهُمْ وَكَانُوا مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى الَّذِينَ كَفَرُوا فَلَمَّا جَاءَهُم مَّا عَرَفُوا كَفَرُوا بِهِ ۚ فَلَعْنَةُ اللَّهِ عَلَى الْكَافِرِينَ
  trl: '*Wa-lammā jāʾahum kitābun min ʿindi llāhi muṣaddiqun li-mā maʿahum wa-kānū min qablu yastaftiḥūna ʿalā lladhīna kafarū fa-lammā jāʾahum mā ʿarafū kafarū bihi fa-laʿnatu llāhi ʿalā l-kāfirīn*'
  trad: Et quand leur est venu un Livre de chez Allaah, confirmant ce qu'ils avaient avec eux — alors qu'auparavant ils demandaient l'ouverture contre ceux qui refusaient — quand ce qu'ils reconnaissaient leur est venu, ils l'ont refusé. La malédiction d'Allaah est sur les *kāfirīn*.
- ref: S.2:94–96
  ar: قُلْ إِن كَانَتْ لَكُمُ الدَّارُ الْآخِرَةُ عِندَ اللَّهِ خَالِصَةً مِّن دُونِ النَّاسِ فَتَمَنَّوُا الْمَوْتَ إِن كُنتُمْ صَادِقِينَ ۝ وَلَن يَتَمَنَّوْهُ أَبَدًا بِمَا قَدَّمَتْ أَيْدِيهِمْ ۗ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ
  trl: '*Qul in kānat lakumu d-dāru l-ākhiratu ʿinda llāhi khāliṣatan min dūni n-nāsi fa-tamannawu l-mawta in kuntum ṣādiqīn · Wa-lan yatamannawhu abadan bi-mā qaddimat aydīhim wa-llāhu ʿalīmun bi-ẓ-ẓālimīn*'
  trad: 'Dis : « Si la demeure de l''*ākhira* auprès d''Allaah vous appartient en exclusivité à l''exclusion des autres gens — souhaitez la mort, si vous êtes véridiques. » — Ils ne la souhaiteront jamais, à cause de ce que leurs mains ont avancé — et Allaah est savant des *ẓālimīn*.'
- ref: S.2:97–99
  ar: قُلْ مَن كَانَ عَدُوًّا لِّجِبْرِيلَ فَإِنَّهُ نَزَّلَهُ عَلَىٰ قَلْبِكَ بِإِذْنِ اللَّهِ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ وَهُدًى وَبُشْرَىٰ لِلْمُؤْمِنِينَ ۝ مَن كَانَ عَدُوًّا لِّلَّهِ وَمَلَائِكَتِهِ وَرُسُلِهِ وَجِبْرِيلَ وَمِيكَالَ فَإِنَّ اللَّهَ عَدُوٌّ لِّلْكَافِرِينَ
  trl: '*Qul man kāna ʿaduwwan li-Jibrīla fa-innahu nazzalahu ʿalā qalbika bi-idhni llāhi muṣaddiqan li-mā bayna yadayhi wa-hudan wa-bushrā li-l-muʾminīn · Man kāna ʿaduwwan li-llāhi wa-malāʾikatihi wa-rusulihi wa-Jibrīla wa-Mīkāla fa-inna llāha ʿaduwwun li-l-kāfirīn*'
  trad: 'Dis : « Quiconque est ennemi de Jibrīl — c''est lui qui l''a fait descendre sur ton cœur avec la permission d''Allaah, confirmant ce qui est devant lui, et guidance et annonce heureuse pour les croyants. » — Quiconque est ennemi d''Allaah, de Ses *malāʾika*, de Ses envoyés, de Jibrīl et de Mīkāl — Allaah est ennemi des *kāfirīn*.'
- ref: S.2:100–101
  ar: أَوَكُلَّمَا عَاهَدُوا عَهْدًا نَّبَذَهُ فَرِيقٌ مِّنْهُمْ ۚ بَلْ أَكْثَرُهُمْ لَا يُؤْمِنُونَ ۝ وَلَمَّا جَاءَهُمْ رَسُولٌ مِّنْ عِندِ اللَّهِ مُصَدِّقٌ لِّمَا مَعَهُمْ نَبَذَ فَرِيقٌ مِّنَ الَّذِينَ أُوتُوا الْكِتَابَ كِتَابَ اللَّهِ وَرَاءَ ظُهُورِهِمْ كَأَنَّهُمْ لَا يَعْلَمُونَ
  trl: '*A-wa-kullamā ʿāhadū ʿahdan nabadha-hu farīqun minhum bal aktharuhum lā yuʾminūn · Wa-lammā jāʾahum rasūlun min ʿindi llāhi muṣaddiqun li-mā maʿahum nabadha farīqun mina lladhīna ūtū l-kitāba kitāba llāhi warāʾa ẓuhūrihim ka-annahum lā yaʿlamūn*'
  trad: Chaque fois qu'ils concluaient un *ʿahd*, un groupe d'entre eux le jetait — non, la plupart d'entre eux ne croient pas. — Quand leur est venu un *rasūl* de chez Allaah confirmant ce qui était avec eux, un groupe parmi ceux à qui le Livre avait été donné a jeté le Livre d'Allaah derrière leur dos — comme s'ils ne savaient pas.
- ref: S.2:102
  ar: وَاتَّبَعُوا مَا تَتْلُو الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ ۖ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ ۚ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَا إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ
  trl: '*Wa-ttabaʿū mā tatlū sh-shayāṭīnu ʿalā mulki Sulaymāna · wa-mā kafara Sulaymānu wa-lākinna sh-shayāṭīna kafarū yuʿallimūna n-nāsa s-siḥra wa-mā unzila ʿalā l-malakayni bi-Bābila Hārūta wa-Mārūta · wa-mā yuʿallimāni min aḥadin ḥattā yaqūlā innamā naḥnu fitnatun fa-lā takfur*'
  trad: 'Ils ont suivi ce que les *shayāṭīn* récitaient sur le règne de Sulaymān — Sulaymān n''avait pas commis le *kufr*, mais les *shayāṭīn* ont commis le *kufr* en enseignant aux gens le *siḥr* et ce qui est descendu sur les deux *malaks* à Bābil, Hārūt et Mārūt. Ces deux-là n''enseignaient à personne sans dire : « Nous ne sommes qu''une *fitna* — ne commets pas le *kufr*. » Ils apprenaient ce par quoi ils séparaient l''homme de son épouse — mais ils ne sont nullement en mesure de nuire par cela à quiconque sinon avec la permission d''Allaah. Ils apprenaient ce qui leur nuisait et ne leur profitait pas. Ils savaient bien que celui qui acquiert cela n''a aucun *khalāq* dans l''*ākhira*.'
- ref: S.2:103
  ar: وَلَوْ أَنَّهُمْ آمَنُوا وَاتَّقَوْا لَمَثُوبَةٌ مِّنْ عِندِ اللَّهِ خَيْرٌ ۖ لَّوْ كَانُوا يَعْلَمُونَ
  trl: '*Wa-law annahum āmanū wa-ttaqaw la-mathūbatun min ʿindi llāhi khayrun law kānū yaʿlamūn*'
  trad: S'ils avaient cru et s'étaient constitués une *taqwā*, une *mathūba* venant d'Allaah aurait été meilleure — s'ils savaient.
- ref: S.2:104–105
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقُولُوا رَاعِنَا وَقُولُوا انظُرْنَا وَاسْمَعُوا ۗ وَلِلْكَافِرِينَ عَذَابٌ أَلِيمٌ ۝ مَّا يَوَدُّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَلَا الْمُشْرِكِينَ أَن يُنَزَّلَ عَلَيْكُم مِّنْ خَيْرٍ مِّن رَّبِّكُمْ
  trl: '*Yā ayyuhā lladhīna āmanū lā taqūlū rāʿinā wa-qūlū unẓurnā wa-smaʿū · Mā yawaddu lladhīna kafarū min ahli l-kitābi wa-lā l-mushrikīna an yunazzala ʿalaykum min khayrin min rabbikum*'
  trad: Ô vous qui avez cru, ne dites pas *rāʿinā* — dites *unẓurnā* et écoutez. Aux *kāfirīn* un châtiment douloureux. — Ceux qui ont commis le *kufr* parmi les gens du Livre, ni les *mushrikīn*, ne souhaitent que descende sur vous le moindre bien de la part de votre *Rabb* — Allaah réserve Sa *raḥma* à qui Il veut, et Allaah est le Détenteur de la faveur immense.
- ref: S.2:106–107
  ar: مَا نَنسَخْ مِنْ آيَةٍ أَوْ نُنسِهَا نَأْتِ بِخَيْرٍ مِّنْهَا أَوْ مِثْلِهَا ۗ أَلَمْ تَعْلَمْ أَنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ۝ أَلَمْ تَعْلَمْ أَنَّ اللَّهَ لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۗ وَمَا لَكُم مِّن دُونِ اللَّهِ مِن وَلِيٍّ وَلَا نَصِيرٍ
  trl: '*Mā nansakh min āyatin aw nunsihā naʾti bi-khayrin minhā aw mithlihā a-lam taʿlam anna llāha ʿalā kulli shayʾin qadīr · A-lam taʿlam anna llāha lahu mulku s-samāwāti wa-l-arḍi wa-mā lakum min dūni llāhi min walīyin wa-lā naṣīr*'
  trad: Toute *āya* que Nous *nansakh* ou que Nous faisons oublier, Nous en apportons une meilleure ou une semblable — ne sais-tu pas qu'Allaah est capable de toute chose ? — Ne sais-tu pas qu'à Allaah appartient le *mulk* des cieux et de la terre ? Vous n'avez en dehors d'Allaah ni *walī* ni *naṣīr*.
- ref: S.2:108–110
  ar: أَمْ تُرِيدُونَ أَن تَسْأَلُوا رَسُولَكُمْ كَمَا سُئِلَ مُوسَىٰ مِن قَبْلُ ۗ وَمَن يَتَبَدَّلِ الْكُفْرَ بِالْإِيمَانِ فَقَدْ ضَلَّ سَوَاءَ السَّبِيلِ ۝ وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ ۚ وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ
  trl: '*Am turīdūna an tasʾalū rasūlakum kamā suʾila Mūsā min qablu · wa-man yatabaddali l-kufra bi-l-īmāni fa-qad ḍalla sawāʾa s-sabīli · Wa-aqīmū ṣ-ṣalāta wa-ātū z-zakāta wa-mā tuqaddimū li-anfusikum min khayrin tajidūhu ʿinda llāhi*'
  trad: Voulez-vous interroger votre *rasūl* comme Mūsā fut interrogé auparavant ? Quiconque substitue le *kufr* à la foi s'est égaré loin du milieu du chemin. — Établissez la *ṣalāt* et faites parvenir la *zakāt* — tout bien que vous avancez pour vous-mêmes vous le trouverez auprès d'Allaah.
- ref: S.2:111–113
  ar: وَقَالُوا لَن يَدْخُلَ الْجَنَّةَ إِلَّا مَن كَانَ هُودًا أَوْ نَصَارَىٰ ۗ تِلْكَ أَمَانِيُّهُمْ ۗ قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ ۝ بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُ لِلَّهِ وَهُوَ مُحْسِنٌ فَلَهُ أَجْرُهُ عِندَ رَبِّهِ
  trl: '*Wa-qālū lan yadkhula l-jannata illā man kāna hūdan aw naṣārā tilka amāniyyuhum qul hātū burhānakum in kuntum ṣādiqīn · Balā man aslama wajhahu li-llāhi wa-huwa muḥsinun fa-lahu ajruhu ʿinda rabbihi*'
  trad: 'Et ils dirent : « Seul entrera dans la *janna* celui qui est Juif ou *naṣrānī*. » Ce sont là leurs *amānī*. Dis : « Apportez votre preuve si vous êtes véridiques. » — Bien au contraire : quiconque remet son *wajh* à Allaah tout en étant *muḥsin* — à lui sa rétribution auprès de son *Rabb* : nulle crainte sur eux et ils ne seront pas attristés.'
- ref: S.2:114
  ar: وَمَنْ أَظْلَمُ مِمَّن مَّنَعَ مَسَاجِدَ اللَّهِ أَن يُذْكَرَ فِيهَا اسْمُهُ وَسَعَىٰ فِي خَرَابِهَا
  trl: '*Wa-man aẓlamu mimman manaʿa masājida llāhi an yudhkara fīha smuhu wa-saʿā fī kharābihā*'
  trad: Qui est plus *ẓālim* que celui qui prive les *masājid* d'Allaah de l'invocation de Son nom et qui s'emploie activement à les désoler ? Ceux-là n'avaient pas à y entrer sinon dans la crainte — à eux dans cette vie une humiliation, et pour eux dans l'*ākhira* un châtiment immense.
- ref: S.2:115
  ar: وَلِلَّهِ الْمَشْرِقُ وَالْمَغْرِبُ ۚ فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ ۚ إِنَّ اللَّهَ وَاسِعٌ عَلِيمٌ
  trl: '*Wa-li-llāhi l-mashriqu wa-l-maghribu fa-ayynamā tuwallū fa-thamma wajhu llāhi inna llāha wāsiʿun ʿalīm*'
  trad: À Allaah appartient le *mashriq* et le *maghrib* — en quelque direction que vous vous tourniez, le *wajhu llāh* est là — Allaah est *wāsiʿ*, *ʿalīm*.
- ref: S.2:116–117
  ar: وَقَالُوا اتَّخَذَ اللَّهُ وَلَدًا ۗ سُبْحَانَهُ ۖ بَل لَّهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ كُلٌّ لَهُ قَانِتُونَ ۝ بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ ۖ وَإِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُن فَيَكُونُ
  trl: '*Wa-qālū ttakhadha llāhu waladan subḥānahu bal lahu mā fī s-samāwāti wa-l-arḍi kullun lahu qānitūn · Badīʿu s-samāwāti wa-l-arḍi wa-idhā qaḍā amran fa-innamā yaqūlu lahu kun fa-yakūn*'
  trad: 'Et ils ont dit : « Allaah s''est donné un fils. » *Subḥānahu* — non, à Lui appartient ce qui est dans les cieux et la terre — tout est *qānit* devant Lui. — *Badīʿ* des cieux et de la terre — quand Il décrète une chose Il dit seulement : « Sois » — et cela est.'
- ref: S.2:118–121
  ar: وَقَالَ الَّذِينَ لَا يَعْلَمُونَ لَوْلَا يُكَلِّمُنَا اللَّهُ أَوْ تَأْتِينَا آيَةٌ ۗ كَذَٰلِكَ قَالَ الَّذِينَ مِن قَبْلِهِم مِّثْلَ قَوْلِهِمْ ۘ تَشَابَهَتْ قُلُوبُهُمْ
  trl: '*Wa-qāla lladhīna lā yaʿlamūna lawlā yukallimunā llāhu aw taʾtīnā āyatun ka-dhālika qāla lladhīna min qablihim mithla qawlihim tashābahati qulūbuhum*'
  trad: 'Et ceux qui ne savent pas ont dit : « Que ne nous parle Allaah directement, ou qu''une *āya* nous vienne ! » — De la même manière, ceux d''avant eux avaient prononcé des paroles identiques — leurs cœurs se ressemblent. — Nous avons exposé les *āyāt* pour des gens qui ont la *yaqīn*. — Nous t''avons envoyé avec le *ḥaqq*, *bashīr* et *nadhīr* — et tu ne seras pas interrogé sur les gens du *jaḥīm*.'
- ref: S.2:120–121
  ar: وَلَن تَرْضَىٰ عَنكَ الْيَهُودُ وَلَا النَّصَارَىٰ حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْ ۗ قُلْ إِنَّ هُدَى اللَّهِ هُوَ الْهُدَىٰ ۝ الَّذِينَ آتَيْنَاهُمُ الْكِتَابَ يَتْلُونَهُ حَقَّ تِلَاوَتِهِ أُولَٰئِكَ يُؤْمِنُونَ بِهِ
  trl: '*Wa-lan tarḍā ʿanka l-yahūdu wa-lā n-naṣārā ḥattā tattabiʿa millatahum qul inna hudā llāhi huwa l-hudā · Alladhīna ātaynāhumu l-kitāba yatlūnahu ḥaqqa tilāwatihi ulāʾika yuʾminūna bihi*'
  trad: 'Les Juifs et les *naṣārā* ne seront jamais satisfaits de toi jusqu''à ce que tu suives leur *milla*. Dis : « Le guide d''Allaah est le seul guide. » — Ceux à qui Nous avons donné le Livre le récitent comme il mérite d''être récité — ceux-là croient en lui. Ceux qui en commettent le *kufr* — ceux-là sont les *khāsirūn*.'
- ref: S.2:122–123
  ar: يَا بَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَنِّي فَضَّلْتُكُمْ عَلَى الْعَالَمِينَ ۝ وَاتَّقُوا يَوْمًا لَّا تَجْزِي نَفْسٌ عَن نَّفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا عَدْلٌ وَلَا تَنفَعُهَا شَفَاعَةٌ وَلَا هُمْ يُنصَرُونَ
  trl: '*Yā banī Isrāʾīla dhkurū niʿmatiya llatī anʿamtu ʿalaykum wa-annī faḍḍaltukum ʿalā l-ʿālamīn · Wa-ttaqū yawman lā tajzī nafsun ʿan nafsin shayʾan wa-lā yuqbalu minhā ʿadlun wa-lā tanfaʿuhā shafāʿatun wa-lā hum yunṣarūn*'
  trad: Ô descendants d'Isrāʾīl, rappelez-vous Mon bienfait dont Je vous ai comblés et que Je vous ai distingués au-dessus des *ʿālamīn*. — Et constituez-vous une taqwā en vue d'un Jour où nulle âme ne s'acquittera pour une autre de quoi que ce soit — nulle rançon ne sera acceptée, nulle *shafāʿa* ne lui profitera — et ils ne seront pas secourus.
- ref: S.2:124
  ar: وَإِذِ ابْتَلَىٰ إِبْرَاهِيمَ رَبُّهُ بِكَلِمَاتٍ فَأَتَمَّهُنَّ ۖ قَالَ إِنِّي جَاعِلُكَ لِلنَّاسِ إِمَامًا ۖ قَالَ وَمِن ذُرِّيَّتِي ۖ قَالَ لَا يَنَالُ عَهْدِي الظَّالِمِينَ
  trl: '*Wa-idhi btalā Ibrāhīma rabbuhu bi-kalimātin fa-atammahunna qāla innī jāʿiluka li-n-nāsi imāman qāla wa-min dhurriyyatī qāla lā yanālu ʿahdī ẓ-ẓālimīn*'
  trad: 'Et quand son *Rabb* éprouva Ibrāhīm par des *kalimāt* et qu''il les accomplit toutes — Il dit : « Je vais faire de toi un *imām* pour les gens. » — Il dit : « Et parmi ma descendance ? » — Il dit : « Mon *ʿahd* n''atteint pas les *ẓālimīn*. »'
- ref: S.2:125
  ar: وَإِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِّلنَّاسِ وَأَمْنًا وَاتَّخِذُوا مِن مَّقَامِ إِبْرَاهِيمَ مُصَلًّى ۖ وَعَهِدْنَا إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ أَن طَهِّرَا بَيْتِيَ لِلطَّائِفِينَ وَالْعَاكِفِينَ وَالرُّكَّعِ السُّجُودِ
  trl: '*Wa-idh jaʿalnā l-bayta mathābatan li-n-nāsi wa-amnan wa-ttakhidhū min maqāmi Ibrāhīma muṣallan wa-ʿahidnā ilā Ibrāhīma wa-Ismāʿīla an ṭahhirā baytiya li-ṭ-ṭāʾifīna wa-l-ʿākifīna wa-r-rukkaʿi s-sujūd*'
  trad: Et quand Nous avons fait de la Maison une *mathāba* pour les gens et un espace de sécurité — et prenez le *maqām* d'Ibrāhīm comme *muṣallā* — et Nous avons chargé Ibrāhīm et Ismāʿīl de purifier Ma Maison pour les *ṭāʾifīn*, les *ʿākifīn*, et ceux qui font les *rukūʿ* et les *sujūd*.
- ref: S.2:126–127
  ar: وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ اجْعَلْ هَٰذَا بَلَدًا آمِنًا وَارْزُقْ أَهْلَهُ مِنَ الثَّمَرَاتِ مَنْ آمَنَ مِنْهُم بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۖ قَالَ وَمَن كَفَرَ فَأُمَتِّعُهُ قَلِيلًا ثُمَّ أَضْطَرُّهُ إِلَىٰ عَذَابِ النَّارِ ۝ وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ
  trl: '*Wa-idh qāla Ibrāhīmu rabbi jʿal hādhā baladan āminan wa-rzuq ahlahu mina th-thamarāti man āmana minhum bi-llāhi wa-l-yawmi l-ākhir · Qāla wa-man kafara fa-umattiʿuhu qalīlan thumma aḍṭarruhu ilā ʿadhābi n-nār · Wa-idh yarfaʿu Ibrāhīmu l-qawāʿida mina l-bayti wa-Ismāʿīlu rabbanā taqabbal minnā innaka anta s-samīʿu l-ʿalīm*'
  trad: 'Et quand Ibrāhīm dit : « Mon *Rabb*, fais de ceci un *balad* en sécurité et pourvois ses habitants en fruits — ceux d''entre eux qui croient en Allaah et au Jour Dernier. » — Il dit : « Et quiconque aura commis le *kufr* — Je lui accorderai une jouissance brève puis Je l''aculerai vers le châtiment du feu — et quelle mauvaise destination ! » — Et quand Ibrāhīm élevait les *qawāʿid* de la Maison avec Ismāʿīl : « Notre *Rabb*, accepte cela de nous — Tu es *as-samīʿu l-ʿalīm*. »'
- ref: S.2:128–129
  ar: رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا ۖ إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ ۝ رَبَّنَا وَابْعَثْ فِيهِمْ رَسُولًا مِّنْهُمْ يَتْلُو عَلَيْهِمْ آيَاتِكَ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَيُزَكِّيهِمْ ۚ إِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ
  trl: '*Rabbanā wa-jʿalnā muslimayni laka wa-min dhurriyyatīnā ummatan muslimatan laka wa-arinā manāsikanā wa-tub ʿalaynā innaka anta t-tawwābu r-raḥīm · Rabbanā wa-bʿath fīhim rasūlan minhum yatlū ʿalayhim āyātika wa-yuʿallimuhumu l-kitāba wa-l-ḥikmata wa-yuzakkīhim innaka anta l-ʿazīzu l-ḥakīm*'
  trad: '« Notre *Rabb*, fais de nous deux des *muslims* pour Toi et de notre descendance une *umma muslima* pour Toi — et montre-nous nos *manāsik* — et accueille notre retour : Tu es *at-Tawwāb*, le *raḥīm*. » — « Notre *Rabb*, envoie parmi eux un *rasūl* venu d''eux qui leur récite Tes *āyāt*, leur enseigne le Livre et la *ḥikma*, et les purifie — Tu es *al-ʿazīzu l-ḥakīm*. »'
- ref: S.2:130
  ar: وَمَن يَرْغَبُ عَن مِّلَّةِ إِبْرَٰهِيمَ إِلَّا مَن سَفِهَ نَفْسَهُۥ ۚ وَلَقَدِ ٱصْطَفَيْنَٰهُ فِى ٱلدُّنْيَا ۖ وَإِنَّهُۥ فِى ٱلْءَاخِرَةِ لَمِنَ ٱلصَّٰلِحِينَ
  trl: Wa-man yarghabu ʿan millati Ibrāhīma illā man safiha nafsahu — wa-la-qadi ṣṭafaynāhu fī l-dunyā wa-innahu fī l-ākhirati la-mina l-ṣāliḥīn
  trad: Et qui se détourne de la milla d'Ibrāhīm, sinon celui qui s'est montré insensé à l'égard de lui-même ? Nous l'avons certes élu en ce monde, et il est assurément, dans l'ākhira, au nombre des ṣāliḥīn.
- ref: S.2:131
  ar: إِذْ قَالَ لَهُۥ رَبُّهُۥٓ أَسْلِمْ ۖ قَالَ أَسْلَمْتُ لِرَبِّ ٱلْعَٰلَمِينَ
  trl: Idh qāla lahu rabbuhu aslim — qāla aslamtu li-rabbi l-ʿālamīn
  trad: 'Quand son Rabb lui dit : « Soumets-toi » — il dit : « Je me suis soumis au Rabb des ʿālamīn. »'
- ref: S.2:132
  ar: وَوَصَّىٰ بِهَآ إِبْرَٰهِيمُ بَنِيهِ وَيَعْقُوبُ يَٰبَنِىَّ إِنَّ ٱللَّهَ ٱصْطَفَىٰ لَكُمُ ٱلدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ
  trl: Wa-waṣṣā bihā Ibrāhīmu banīhi wa-Yaʿqūb — yā-baniyya inna llāha ṣṭafā lakumu l-dīna fa-lā tamūtunna illā wa-antum muslimūn
  trad: 'Et Ibrāhīm en fit la waṣiyya à ses fils, et Yaʿqūb aussi : « Ô mes fils, Allaah a élu pour vous le dīn — ne mourez donc qu''en étant muslimūn. »'
- ref: S.2:133
  ar: أَمْ كُنتُمْ شُهَدَآءَ إِذْ حَضَرَ يَعْقُوبَ ٱلْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنۢ بَعْدِى قَالُوا۟ نَعْبُدُ إِلَٰهَكَ وَ إِلَٰهَ ءَابَآئِكَ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ إِلَٰهًا وَٰحِدًا وَنَحْنُ لَهُۥ مُسْلِمُونَ
  trl: Am kuntum shuhadāʾa idh ḥaḍara Yaʿqūba l-mawtu idh qāla li-banīhi mā taʿbudūna min baʿdī qālū naʿbudu ilāhaka wa-ilāha ābāʾika Ibrāhīma wa-Ismāʿīla wa-Isḥāqa ilāhan wāḥidan wa-naḥnu lahu muslimūn
  trad: 'Étiez-vous témoins quand la mort se présenta à Yaʿqūb, quand il dit à ses fils : « Qu''adorerez-vous après moi ? » Ils dirent : « Nous adorons ton ilāh et l''ilāh de tes pères, Ibrāhīm, Ismāʿīl et Isḥāq — un ilāh unique — et nous Lui sommes soumis. »'
- ref: S.2:134
  ar: تِلْكَ أُمَّةٌ قَدْ خَلَتْ ۖ لَهَا مَا كَسَبَتْ وَلَكُم مَّا كَسَبْتُمْ ۖ وَلَا تُسْـَٔلُونَ عَمَّا كَانُوا۟ يَعْمَلُونَ
  trl: Tilka ummatun qad khalat — lahā mā kasabat wa-lakum mā kasabtum — wa-lā tusʾalūna ʿammā kānū yaʿmalūn
  trad: Voilà une communauté qui est passée — à elle ce qu'elle a acquis, à vous ce que vous avez acquis — et vous ne serez pas interrogés sur ce qu'ils faisaient.
- ref: S.2:135
  ar: وَقَالُوا۟ كُونُوا۟ هُودًا أَوْ نَصَٰرَىٰ تَهْتَدُوا۟ ۗ قُلْ بَلْ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًا ۖ وَمَا كَانَ مِنَ ٱلْمُشْرِكِينَ
  trl: Wa-qālū kūnū hūdan aw naṣārā tahtadū — qul bal millata Ibrāhīma ḥanīfan — wa-mā kāna mina l-mushrikīn
  trad: 'Ils ont dit : « Soyez juifs ou nazaréens, vous serez guidés » — dis : « Non — la milla d''Ibrāhīm, ḥanīf » — et il n''était pas au nombre des mushrikīn.'
- ref: S.2:136
  ar: قُولُوٓا۟ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ إِلَيْنَا وَمَآ أُنزِلَ إِلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَٱلْأَسْبَاطِ وَمَآ أُوتِىَ مُوسَىٰ وَعِيسَىٰ وَمَآ أُوتِىَ ٱلنَّبِيُّونَ مِن رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْهُمْ وَنَحْنُ لَهُۥ مُسْلِمُونَ
  trl: Qūlū āmannā bi-llāhi wa-mā unzila ilaynā wa-mā unzila ilā Ibrāhīma wa-Ismāʿīla wa-Isḥāqa wa-Yaʿqūba wa-l-asbāṭi wa-mā ūtiya Mūsā wa-ʿĪsā wa-mā ūtiya l-nabiyyūna min rabbihim lā nufarriqu bayna aḥadin minhum wa-naḥnu lahu muslimūn
  trad: 'Dites : « Nous croyons en Allaah, en ce qui a été fait descendre vers nous, en ce qui a été fait descendre vers Ibrāhīm, Ismāʿīl, Isḥāq, Yaʿqūb et les asbāṭ, en ce qui a été donné à Mūsā et à ʿĪsā, et en ce qui a été donné aux nabiyyūn de la part de leur Rabb — nous ne faisons pas de différence entre l''un quelconque d''entre eux, et nous Lui sommes soumis. »'
- ref: S.2:137
  ar: فَإِنْ ءَامَنُوا۟ بِمِثْلِ مَآ ءَامَنتُم بِهِۦ فَقَدِ ٱهْتَدَوا۟ ۖ وَإِن تَوَلَّوْا۟ فَإِنَّمَا هُمْ فِى شِقَاقٍ ۖ فَسَيَكْفِيكَهُمُ ٱللَّهُ ۚ وَهُوَ ٱلسَّمِيعُ ٱلْعَلِيمُ
  trl: Fa-in āmanū bi-mithli mā āmantum bihi fa-qadi htadaw — wa-in tawallaw fa-innamā hum fī shiqāq — fa-sa-yakfīkahumu llāhu wa-huwa l-Samīʿu l-ʿAlīm
  trad: S'ils croient à l'instar de ce en quoi vous croyez, ils auront été guidés. Et s'ils se détournent, ils ne sont qu'en shiqāq. Allaah te suffira contre eux — et Il est al-Samīʿ, al-ʿAlīm.
- ref: S.2:138
  ar: صِبْغَةَ ٱللَّهِ ۖ وَمَنْ أَحْسَنُ مِنَ ٱللَّهِ صِبْغَةً ۖ وَنَحْنُ لَهُۥ عَٰبِدُونَ
  trl: Ṣibghata llāh — wa-man aḥsanu mina llāhi ṣibghatan — wa-naḥnu lahu ʿābidūn
  trad: La ṣibgha d'Allaah — et qui teindrait mieux qu'Allaah en ṣibgha ? — et nous Lui sommes dévoués.
- ref: S.2:139
  ar: قُلْ أَتُحَآجُّونَنَا فِى ٱللَّهِ وَهُوَ رَبُّنَا وَرَبُّكُمْ وَلَنَآ أَعْمَٰلُنَا وَلَكُمْ أَعْمَٰلُكُمْ وَنَحْنُ لَهُۥ مُخْلِصُونَ
  trl: Qul a-tuḥājjūnanā fī llāhi wa-huwa rabbunā wa-rabbukum — wa-lanā aʿmālunā wa-lakum aʿmālukum — wa-naḥnu lahu mukhliṣūn
  trad: 'Dis : « Nous disputez-vous au sujet d''Allaah, alors qu''Il est notre Rabb et votre Rabb ? À nous nos actes et à vous vos actes — et nous Lui sommes sincèrement dévoués. »'
- ref: S.2:140
  ar: أَمْ تَقُولُونَ إِنَّ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَٱلْأَسْبَاطَ كَانُوا۟ هُودًا أَوْ نَصَٰرَىٰ ۗ قُلْ ءَأَنتُمْ أَعْلَمُ أَمِ ٱللَّهُ ۗ وَمَنْ أَظْلَمُ مِمَّن كَتَمَ شَهَٰدَةً عِندَهُۥ مِنَ ٱللَّهِ ۗ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ
  trl: Am taqūlūna inna Ibrāhīma wa-Ismāʿīla wa-Isḥāqa wa-Yaʿqūba wa-l-asbāṭa kānū hūdan aw naṣārā — qul a-antum aʿlamu ami llāhu — wa-man aẓlamu mimman katama shahādatan ʿindahu mina llāhi — wa-mā llāhu bi-ghāfilin ʿammā taʿmalūn
  trad: 'Dites-vous qu''Ibrāhīm, Ismāʿīl, Isḥāq, Yaʿqūb et les asbāṭ étaient juifs ou nazaréens ? Dis : « Êtes-vous plus savants qu''Allaah ? » Et qui est plus injuste que celui qui dissimule un témoignage qu''il détient d''Allaah ? Et Allaah n''est pas inattentif à ce que vous faites.'
- ref: S.2:141
  ar: تِلْكَ أُمَّةٌ قَدْ خَلَتْ ۖ لَهَا مَا كَسَبَتْ وَلَكُم مَّا كَسَبْتُمْ ۖ وَلَا تُسْـَٔلُونَ عَمَّا كَانُوا۟ يَعْمَلُونَ
  trl: Tilka ummatun qad khalat — lahā mā kasabat wa-lakum mā kasabtum — wa-lā tusʾalūna ʿammā kānū yaʿmalūn
  trad: Voilà une communauté qui est passée — à elle ce qu'elle a acquis, à vous ce que vous avez acquis — et vous ne serez pas interrogés sur ce qu'ils faisaient.
- ref: S.2:142
  ar: سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍ مُّسْتَقِيمٍ
  trl: Sa-yaqūlu l-sufahāʾu mina l-nāsi mā wallāhum ʿan qiblatihimi llatī kānū ʿalayhā — qul li-llāhi l-mashriqu wa-l-maghrib — yahdī man yashāʾu ilā ṣirāṭin mustaqīm
  trad: 'Les sufahāʾ parmi les gens vont dire : « Qu''est-ce qui les a détournés de leur qibla sur laquelle ils étaient ? » Dis : « À Allaah appartiennent l''orient et l''occident — Il guide qui Il veut vers un ṣirāṭ droit. »'
- ref: S.2:143
  ar: وَكَذَٰلِكَ جَعَلْنَٰكُمْ أُمَّةً وَسَطًا لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ وَيَكُونَ ٱلرَّسُولُ عَلَيْكُمْ شَهِيدًا ۗ وَمَا جَعَلْنَا ٱلْقِبْلَةَ ٱلَّتِى كُنتَ عَلَيْهَآ إِلَّا لِنَعْلَمَ مَن يَتَّبِعُ ٱلرَّسُولَ مِمَّن يَنقَلِبُ عَلَىٰ عَقِبَيْهِ
  trl: Wa-ka-dhālika jaʿalnākum ummatan wasaṭan li-takūnū shuhadāʾa ʿalā l-nāsi wa-yakūna l-rasūlu ʿalaykum shahīdan — wa-mā jaʿalnā l-qiblata llatī kunta ʿalayhā illā li-naʿlama man yattabiʿu l-rasūla mimman yanqalibu ʿalā ʿaqibayh
  trad: C'est ainsi que Nous vous avons établis communauté wasaṭ, pour que vous soyez shuhadāʾ sur les gens, et que le rasūl soit sur vous shahīd — et Nous n'avons établi la qibla sur laquelle tu étais que pour savoir qui suit le rasūl de qui retourne sur ses talons.
- ref: S.2:144
  ar: قَدْ نَرَىٰ تَقَلُّبَ وَجْهِكَ فِى ٱلسَّمَآءِ ۖ فَلَنُوَلِّيَنَّكَ قِبْلَةً تَرْضَىٰهَا ۚ فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ ۚ وَحَيْثُ مَا كُنتُمْ فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ ۗ وَإِنَّ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ لَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ ۗ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا يَعْمَلُونَ
  trl: Qad narā taqalluba wajhika fī l-samāʾ — fa-la-nuwalliyannaka qiblatan tarḍāhā — fa-walli wajhaka shaṭra l-masjidi l-ḥarām — wa-ḥaythu mā kuntum fa-wallū wujūhakum shaṭrahu — wa-inna lladhīna ūtū l-kitāba la-yaʿlamūna annahu l-ḥaqqu min rabbihim — wa-mā llāhu bi-ghāfilin ʿammā yaʿmalūn
  trad: Nous voyons bien le tournoiement de ton visage vers le ciel — Nous t'orienterons certes vers une qibla qui te satisfasse — oriente donc ton visage vers le côté du Masjid Ḥarām — et où que vous soyez, orientez vos visages vers son côté — et ceux à qui le Kitāb a été donné savent bien que c'est al-ḥaqq venant de leur Rabb — et Allaah n'est pas inattentif à ce qu'ils font.
- ref: S.2:145
  ar: وَلَئِن أَتَيْتَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ بِكُلِّ ءَايَةٍ مَّا تَبِعُوا۟ قِبْلَتَكَ ۚ وَمَآ أَنتَ بِتَابِعٍ قِبْلَتَهُمْ ۚ وَمَا بَعْضُهُم بِتَابِعٍ قِبْلَةَ بَعْضٍ ۚ وَلَئِنِ ٱتَّبَعْتَ أَهْوَآءَهُم مِّنۢ بَعْدِ مَا جَآءَكَ مِنَ ٱلْعِلْمِ إِنَّكَ إِذًا لَّمِنَ ٱلظَّٰلِمِينَ
  trl: Wa-la-in atayta lladhīna ūtū l-kitāba bi-kulli āyatin mā tabiʿū qiblatak — wa-mā anta bi-tābiʿin qiblatahum wa-mā baʿḍuhum bi-tābiʿin qiblata baʿḍ — wa-la-ini ttabaʿta ahwāʾahum min baʿdi mā jāʾaka mina l-ʿilmi innaka idhan la-mina l-ẓālimīn
  trad: Même si tu apportais à ceux à qui le Kitāb a été donné toute āya, ils ne suivraient pas ta qibla — et tu ne suis pas leur qibla, et les uns ne suivent pas la qibla des autres — et si tu suivais leurs ahwāʾ après que la connaissance te soit venue, tu serais alors assurément parmi les ẓālimūn.
- ref: S.2:146
  ar: ٱلَّذِينَ ءَاتَيْنَٰهُمُ ٱلْكِتَٰبَ يَعْرِفُونَهُۥ كَمَا يَعْرِفُونَ أَبْنَآءَهُمْ ۖ وَإِنَّ فَرِيقًا مِّنْهُمْ لَيَكْتُمُونَ ٱلْحَقَّ وَهُمْ يَعْلَمُونَ
  trl: Alladhīna ātaynāhumu l-kitāba yaʿrifūnahu ka-mā yaʿrifūna abnāʾahum — wa-inna farīqan minhum la-yaktumūna l-ḥaqqa wa-hum yaʿlamūn
  trad: Ceux à qui Nous avons donné le Kitāb le reconnaissent comme ils reconnaissent leurs propres fils — et un groupe d'entre eux dissimule certes al-ḥaqq, tout en sachant.
- ref: S.2:147
  ar: ٱلْحَقُّ مِن رَّبِّكَ ۖ فَلَا تَكُونَنَّ مِنَ ٱلْمُمْتَرِينَ
  trl: Al-ḥaqqu min rabbika — fa-lā takūnanna mina l-mumtarīn
  trad: Al-ḥaqq vient de ton Rabb — ne sois donc en aucun cas parmi les mumtarīn.
- ref: S.2:148
  ar: وَلِكُلٍّ وِجْهَةٌ هُوَ مُوَلِّيهَا ۖ فَٱسْتَبِقُوا۟ ٱلْخَيْرَٰتِ ۚ أَيْنَ مَا تَكُونُوا۟ يَأْتِ بِكُمُ ٱللَّهُ جَمِيعًا ۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ
  trl: Wa-li-kullin wijhatun huwa muwallīhā — fa-stabiqū l-khayrāti — ayna mā takūnū yaʾti bikumu llāhu jamīʿan — inna llāha ʿalā kulli shayʾin qadīr
  trad: Et à chacun une wijha vers laquelle il se tourne — rivalisez donc dans les khayrāt — où que vous soyez, Allaah vous rassemblera tous — Allaah est capable de toute chose.
- ref: S.2:149
  ar: وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ ۖ وَإِنَّهُۥ لَلْحَقُّ مِن رَّبِّكَ ۗ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ
  trl: Wa-min ḥaythu kharajta fa-walli wajhaka shaṭra l-masjidi l-ḥarām — wa-innahu la-l-ḥaqqu min rabbik — wa-mā llāhu bi-ghāfilin ʿammā taʿmalūn
  trad: Et d'où que tu sortes, oriente ton visage vers le côté du Masjid Ḥarām — c'est assurément al-ḥaqq venant de ton Rabb — et Allaah n'est pas inattentif à ce que vous faites.
- ref: S.2:150
  ar: وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ ٱلْمَسْجِدِ ٱلْحَرَامِ ۚ وَحَيْثُ مَا كُنتُمْ فَوَلُّوا۟ وُجُوهَكُمْ شَطْرَهُۥ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَيْكُمْ حُجَّةٌ إِلَّا ٱلَّذِينَ ظَلَمُوا۟ مِنْهُمْ فَلَا تَخْشَوْهُمْ وَٱخْشَوْنِى وَلِأُتِمَّ نِعْمَتِى عَلَيْكُمْ وَلَعَلَّكُمْ تَهْتَدُونَ
  trl: Wa-min ḥaythu kharajta fa-walli wajhaka shaṭra l-masjidi l-ḥarām — wa-ḥaythu mā kuntum fa-wallū wujūhakum shaṭrahu li-ʾallā yakūna li-l-nāsi ʿalaykum ḥujjatun illā lladhīna ẓalamū minhum — fa-lā takhshawhum wa-khshawnī — wa-li-utimma niʿmatī ʿalaykum wa-laʿallakum tahtadūn
  trad: Et d'où que tu sortes, oriente ton visage vers le côté du Masjid Ḥarām — et où que vous soyez, orientez vos visages vers son côté, afin qu'il n'y ait pas d'argument des gens contre vous, sauf ceux d'entre eux qui ont commis le ẓulm — ne les craignez donc pas, et craignez-Moi — et afin que Je complète Mon bienfait sur vous, et afin que vous soyez guidés.
- ref: S.2:151
  ar: كَمَآ أَرْسَلْنَا فِيكُمْ رَسُولًا مِّنكُمْ يَتْلُوا۟ عَلَيْكُمْ ءَايَٰتِنَا وَيُزَكِّيكُمْ وَيُعَلِّمُكُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَيُعَلِّمُكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ
  trl: Ka-mā arsalnā fīkum rasūlan minkum yatlū ʿalaykum āyātinā wa-yuzakkīkum wa-yuʿallimukumu l-kitāba wa-l-ḥikmata wa-yuʿallimukum mā lam takūnū taʿlamūn
  trad: Tout comme Nous avons envoyé parmi vous un rasūl issu de vous, qui récite sur vous Nos āyāt, vous purifie-et-fait-croître, vous enseigne le Kitāb et la ḥikma, et vous enseigne ce que vous ne saviez pas.
- ref: S.2:152
  ar: فَٱذْكُرُونِى أَذْكُرْكُمْ وَٱشْكُرُوا۟ لِى وَلَا تَكْفُرُونِ
  trl: Fa-dhkurūnī adhkurkum — wa-shkurū lī wa-lā takfurūn
  trad: Faites donc dhikr de Moi, Je ferai dhikr de vous — et soyez reconnaissants envers Moi, et ne faites pas kufr envers Moi.
- ref: S.2:153
  ar: يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ ۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ
  trl: Yā ayyuhā lladhīna āmanū staʿīnū bi-l-ṣabri wa-l-ṣalāti — inna llāha maʿa l-ṣābirīn
  trad: Ô vous qui avez cru, cherchez soutien dans le ṣabr et la ṣalāt — Allaah est avec les ṣābirīn.
- ref: S.2:154
  ar: وَلَا تَقُولُوا۟ لِمَن يُقْتَلُ فِى سَبِيلِ ٱللَّهِ أَمْوَٰتٌ ۚ بَلْ أَحْيَآءٌ وَلَٰكِن لَّا تَشْعُرُونَ
  trl: Wa-lā taqūlū li-man yuqtalu fī sabīli llāhi amwāt — bal aḥyāʾun wa-lākin lā tashʿurūn
  trad: 'Et ne dites pas de ceux qui sont tués dans la voie d''Allaah : « ils sont amwāt » — au contraire, ils sont aḥyāʾ, mais vous ne percevez pas.'
- ref: S.2:155
  ar: وَلَنَبْلُوَنَّكُم بِشَىْءٍ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ ۗ وَبَشِّرِ ٱلصَّٰبِرِينَ
  trl: Wa-la-nabluwannakum bi-shayʾin mina l-khawfi wa-l-jūʿi wa-naqṣin mina l-amwāli wa-l-anfusi wa-l-thamarāti — wa-bashshiri l-ṣābirīn
  trad: Nous vous éprouverons assurément par une part de peur et de faim, et une perte de biens, d'êtres et de fruits — annonce la bonne nouvelle aux ṣābirīn.
- ref: S.2:156
  ar: ٱلَّذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٌ قَالُوٓا۟ إِنَّا لِلَّهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَ
  trl: Alladhīna idhā aṣābathum muṣībatun qālū innā li-llāhi wa-innā ilayhi rājiʿūn
  trad: 'Ceux qu''une muṣība atteint disent : « Nous appartenons à Allaah et c''est vers Lui que nous revenons. »'
- ref: S.2:157
  ar: أُو۟لَٰٓئِكَ عَلَيْهِمْ صَلَوَٰتٌ مِّن رَّبِّهِمْ وَرَحْمَةٌ ۖ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُهْتَدُونَ
  trl: Ulāʾika ʿalayhim ṣalawātun min rabbihim wa-raḥmatun — wa-ulāʾika humu l-muhtadūn
  trad: 'Sur ceux-là : des ṣalawāt de leur Rabb et une raḥma — et ce sont eux les muhtadūn.'
- ref: S.2:158
  ar: إِنَّ ٱلصَّفَا وَٱلْمَرْوَةَ مِن شَعَآئِرِ ٱللَّهِ ۖ فَمَنْ حَجَّ ٱلْبَيْتَ أَوِ ٱعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَن يَطَّوَّفَ بِهِمَا ۚ وَمَن تَطَوَّعَ خَيْرًا فَإِنَّ ٱللَّهَ شَاكِرٌ عَلِيمٌ
  trl: Inna l-Ṣafā wa-l-Marwata min shaʿāʾiri llāh — fa-man ḥajja l-bayta aw iʿtamara fa-lā junāḥa ʿalayhi an yaṭṭawwafa bihimā — wa-man taṭawwaʿa khayran fa-inna llāha Shākirun ʿAlīm
  trad: Al-Ṣafā et al-Marwa font partie des shaʿāʾir d'Allaah — quiconque fait le ḥajj vers la Maison ou accomplit la ʿumra, il n'y a pas de faute sur lui à accomplir le ṭawāf autour d'elles deux — et quiconque accomplit un surplus de bien, Allaah est al-Shākir, al-ʿAlīm.
- ref: S.2:159
  ar: إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ
  trl: Inna lladhīna yaktumūna mā anzalnā mina l-bayyināti wa-l-hudā min baʿdi mā bayyannāhu li-l-nāsi fī l-kitāb — ulāʾika yalʿanuhumu llāhu wa-yalʿanuhumu l-lāʿinūn
  trad: Ceux qui dissimulent ce que Nous avons fait descendre parmi les bayyināt et le guidage, après que Nous l'avons explicité pour les gens dans le Kitāb — sur ceux-là Allaah prononce la laʿna, et les lāʿinūn la prononcent aussi.
- ref: S.2:160
  ar: إِلَّا ٱلَّذِينَ تَابُوا۟ وَأَصْلَحُوا۟ وَبَيَّنُوا۟ فَأُو۟لَٰٓئِكَ أَتُوبُ عَلَيْهِمْ ۚ وَأَنَا۟ ٱلتَّوَّابُ ٱلرَّحِيمُ
  trl: Illā lladhīna tābū wa-aṣlaḥū wa-bayyanū — fa-ulāʾika atūbu ʿalayhim — wa-anā l-Tawwābu l-Raḥīm
  trad: Sauf ceux qui sont revenus, ont rectifié, et ont explicité — sur ceux-là J'accueille le retour. Et Je suis al-Tawwāb, al-Raḥīm.
- ref: S.2:161
  ar: إِنَّ ٱلَّذِينَ كَفَرُوا۟ وَمَاتُوا۟ وَهُمْ كُفَّارٌ أُو۟لَٰٓئِكَ عَلَيْهِمْ لَعْنَةُ ٱللَّهِ وَٱلْمَلَٰٓئِكَةِ وَٱلنَّاسِ أَجْمَعِينَ
  trl: Inna lladhīna kafarū wa-mātū wa-hum kuffārun — ulāʾika ʿalayhim laʿnatu llāhi wa-l-malāʾikati wa-l-nāsi ajmaʿīn
  trad: Ceux qui ont fait kufr et sont morts en état de kuffār — sur ceux-là repose la laʿna d'Allaah, des malāʾika et des gens, tous ensemble.
- ref: S.2:162
  ar: خَٰلِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ ٱلْعَذَابُ وَلَا هُمْ يُنظَرُونَ
  trl: Khālidīna fīhā — lā yukhaffafu ʿanhumu l-ʿadhābu wa-lā hum yunẓarūn
  trad: Demeurant pour toujours en elle — le ʿadhāb ne leur sera pas allégé, et il ne leur sera pas accordé de délai.
- ref: S.2:163
  ar: وَإِلَٰهُكُمْ إِلَٰهٌ وَٰحِدٌ ۖ لَّآ إِلَٰهَ إِلَّا هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ
  trl: Wa-ilāhukum ilāhun wāḥid — lā ilāha illā huwa l-Raḥmānu l-Raḥīm
  trad: Et votre ilāh est un ilāh unique — il n'est pas d'ilāh hormis Lui, al-Raḥmān, al-Raḥīm.
- ref: S.2:164
  ar: إِنَّ فِى خَلْقِ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَٰفِ ٱلَّيْلِ وَٱلنَّهَارِ وَٱلْفُلْكِ ٱلَّتِى تَجْرِى فِى ٱلْبَحْرِ بِمَا يَنفَعُ ٱلنَّاسَ وَمَآ أَنزَلَ ٱللَّهُ مِنَ ٱلسَّمَآءِ مِن مَّآءٍ فَأَحْيَا بِهِ ٱلْأَرْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٍ وَتَصْرِيفِ ٱلرِّيَٰحِ وَٱلسَّحَابِ ٱلْمُسَخَّرِ بَيْنَ ٱلسَّمَآءِ وَٱلْأَرْضِ لَءَايَٰتٍ لِّقَوْمٍ يَعْقِلُونَ
  trl: Inna fī khalqi l-samāwāti wa-l-arḍi wa-khtilāfi l-layli wa-l-nahāri wa-l-fulki llatī tajrī fī l-baḥri bi-mā yanfaʿu l-nāsa wa-mā anzala llāhu mina l-samāʾi min māʾin fa-aḥyā bihi l-arḍa baʿda mawtihā wa-baththa fīhā min kulli dābbatin wa-taṣrīfi l-riyāḥi wa-l-saḥābi l-musakhkhari bayna l-samāʾi wa-l-arḍi la-āyātin li-qawmin yaʿqilūn
  trad: 'Dans la création des cieux et de la terre, l''alternance de la nuit et du jour, les embarcations qui voguent sur la mer avec ce qui profite aux gens, ce qu''Allaah a fait descendre du ciel comme eau — par laquelle Il fait revivre la terre après sa mort et y répand toute espèce de dābba — et la circulation des vents et les nuages assujettis entre le ciel et la terre : assurément des āyāt pour un peuple qui raisonne.'
- ref: S.2:165
  ar: وَمِنَ ٱلنَّاسِ مَن يَتَّخِذُ مِن دُونِ ٱللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ ٱللَّهِ ۖ وَٱلَّذِينَ ءَامَنُوٓا۟ أَشَدُّ حُبًّا لِّلَّهِ ۗ وَلَوْ يَرَى ٱلَّذِينَ ظَلَمُوٓا۟ إِذْ يَرَوْنَ ٱلْعَذَابَ أَنَّ ٱلْقُوَّةَ لِلَّهِ جَمِيعًا وَأَنَّ ٱللَّهَ شَدِيدُ ٱلْعَذَابِ
  trl: Wa-mina l-nāsi man yattakhidhu min dūni llāhi andādan yuḥibbūnahum ka-ḥubbi llāh — wa-lladhīna āmanū ashaddu ḥubban li-llāh — wa-law yarā lladhīna ẓalamū idh yarawna l-ʿadhāba anna l-quwwata li-llāhi jamīʿan wa-anna llāha shadīdu l-ʿadhāb
  trad: Et parmi les gens, certains se donnent en dehors d'Allaah des andād qu'ils aiment à la mesure de l'amour [dû] à Allaah — mais ceux qui ont cru sont plus intenses dans leur amour pour Allaah. Et si seulement ceux qui ont commis le ẓulm voyaient, lorsqu'ils verront le ʿadhāb, que la force appartient à Allaah tout entière, et qu'Allaah est intense dans le ʿadhāb.
- ref: S.2:166
  ar: إِذْ تَبَرَّأَ ٱلَّذِينَ ٱتُّبِعُوا۟ مِنَ ٱلَّذِينَ ٱتَّبَعُوا۟ وَرَأَوُا۟ ٱلْعَذَابَ وَتَقَطَّعَتْ بِهِمُ ٱلْأَسْبَابُ
  trl: Idh tabarraʾa lladhīna uttubiʿū mina lladhīna ttabaʿū wa-raʾawu l-ʿadhāba wa-taqaṭṭaʿat bihimu l-asbāb
  trad: Quand ceux qui ont été suivis se dissocient de ceux qui les ont suivis, et qu'ils voient le ʿadhāb, et que les asbāb se sectionnent entièrement entre eux.
- ref: S.2:167
  ar: وَقَالَ ٱلَّذِينَ ٱتَّبَعُوا۟ لَوْ أَنَّ لَنَا كَرَّةً فَنَتَبَرَّأَ مِنْهُمْ كَمَا تَبَرَّءُوا۟ مِنَّا ۗ كَذَٰلِكَ يُرِيهِمُ ٱللَّهُ أَعْمَٰلَهُمْ حَسَرَٰتٍ عَلَيْهِمْ ۖ وَمَا هُم مِّنَ ٱلنَّارِ بِخَٰرِجِينَ
  trl: Wa-qāla lladhīna ttabaʿū law anna lanā karratan fa-natabarraʾa minhum kamā tabarraʾū minnā — ka-dhālika yurīhimu llāhu aʿmālahum ḥasarātin ʿalayhim — wa-mā hum mina l-nāri bi-khārijīn
  trad: 'Ceux qui ont suivi disent : « Si seulement nous avions un retour, pour nous dissocier d''eux comme ils se sont dissociés de nous ! » — c''est ainsi qu''Allaah leur montre leurs actes en regrets sur eux — et ils ne sont pas de ceux qui sortiront du feu.'
- ref: S.2:168
  ar: يَٰٓأَيُّهَا ٱلنَّاسُ كُلُوا۟ مِمَّا فِى ٱلْأَرْضِ حَلَٰلًا طَيِّبًا وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ ٱلشَّيْطَٰنِ ۚ إِنَّهُۥ لَكُمْ عَدُوٌّ مُّبِينٌ
  trl: Yā ayyuhā l-nāsu kulū mimmā fī l-arḍi ḥalālan ṭayyiban wa-lā tattabiʿū khuṭuwāti l-shayṭān — innahu lakum ʿaduwwun mubīn
  trad: 'Ô vous les nās, mangez de ce qui est dans la terre — ḥalāl et ṭayyib — et ne suivez pas les pas du shayṭān : il est pour vous un ennemi déclaré.'
- ref: S.2:169
  ar: إِنَّمَا يَأْمُرُكُم بِٱلسُّوٓءِ وَٱلْفَحْشَآءِ وَأَن تَقُولُوا۟ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ
  trl: Innamā yaʾmurukum bi-l-sūʾi wa-l-faḥshāʾi wa-an taqūlū ʿalā llāhi mā lā taʿlamūn
  trad: Il ne vous commande que le sūʾ et la faḥshāʾ, et de dire sur Allaah ce que vous ne savez pas.
- ref: S.2:170
  ar: وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ
  trl: Wa-idhā qīla lahumu ttabiʿū mā anzala llāhu qālū bal nattabiʿu mā alfaynā ʿalayhi ābāʾanā — a-wa-law kāna ābāʾuhum lā yaʿqilūna shayʾan wa-lā yahtadūn
  trad: 'Et quand il leur est dit : « Suivez ce qu''Allaah a fait descendre » — ils disent : « Non, nous suivons ce sur quoi nous avons trouvé nos pères » — même si leurs pères ne raisonnaient rien et n''étaient pas guidés ?'
- ref: S.2:171
  ar: وَمَثَلُ الَّذِينَ كَفَرُوا كَمَثَلِ الَّذِي يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَاءً وَنِدَاءً صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَعْقِلُونَ
  trl: Wa-mathalu lladhīna kafarū ka-mathali lladhī yanʿiqu bi-mā lā yasmaʿu illā duʿāʾan wa-nidāʾan — ṣummun bukmun ʿumyun fa-hum lā yaʿqilūn
  trad: Et la comparaison de ceux qui ont fait kufr est comme la comparaison de celui qui crie vers ce qui n'entend qu'un appel et une clameur — sourds, muets, aveugles, ils ne raisonnent donc pas.
- ref: S.2:172
  ar: يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَٱشْكُرُوا۟ لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ
  trl: Yā ayyuhā lladhīna āmanū kulū min ṭayyibāti mā razaqnākum wa-shkurū li-llāhi in kuntum iyyāhu taʿbudūn
  trad: Ô vous qui avez cru, mangez parmi les ṭayyibāt de ce dont Nous vous avons pourvus, et soyez reconnaissants envers Allaah, si c'est Lui que vous servez.
- ref: S.2:173
  ar: إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنزِيرِ وَمَا أُهِلَّ بِهِ لِغَيْرِ اللَّهِ فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Innamā ḥarrama ʿalaykumu l-maytata wa-l-dama wa-laḥma l-khinzīri wa-mā uhilla bihi li-ghayri llāh — fa-mani ḍṭurra ghayra bāghin wa-lā ʿādin fa-lā ithma ʿalayhi — inna llāha Ghafūrun Raḥīm
  trad: Il n'a interdit sur vous que la bête morte, le sang, la chair du porc, et ce sur quoi on a proclamé autre qu'Allaah — mais quiconque y est contraint, sans être chercheur ni transgresseur, aucune faute ne pèse sur lui. Allaah est al-Ghafūr, al-Raḥīm.
- ref: S.2:174
  ar: إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلَ ٱللَّهُ مِنَ ٱلْكِتَٰبِ وَيَشْتَرُونَ بِهِۦ ثَمَنًا قَلِيلًا ۙ أُو۟لَٰٓئِكَ مَا يَأْكُلُونَ فِى بُطُونِهِمْ إِلَّا ٱلنَّارَ وَلَا يُكَلِّمُهُمُ ٱللَّهُ يَوْمَ ٱلْقِيَٰمَةِ وَلَا يُزَكِّيهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌ
  trl: Inna lladhīna yaktumūna mā anzala llāhu mina l-kitābi wa-yashtarūna bihi thamanan qalīlan — ulāʾika mā yaʾkulūna fī buṭūnihim illā l-nāra wa-lā yukallimuhumu llāhu yawma l-qiyāmati wa-lā yuzakkīhim wa-lahum ʿadhābun alīm
  trad: Ceux qui dissimulent ce qu'Allaah a fait descendre du Kitāb, et en font commerce pour un prix dérisoire — ceux-là ne mangent dans leurs ventres que le feu, et Allaah ne leur parlera pas au Jour de la résurrection, ne les purifiera pas, et pour eux un ʿadhāb douloureux.
- ref: S.2:175
  ar: أُو۟لَٰٓئِكَ ٱلَّذِينَ ٱشْتَرَوُا۟ ٱلضَّلَٰلَةَ بِٱلْهُدَىٰ وَٱلْعَذَابَ بِٱلْمَغْفِرَةِ ۚ فَمَآ أَصْبَرَهُمْ عَلَى ٱلنَّارِ
  trl: Ulāʾika lladhīna shtarawu l-ḍalālata bi-l-hudā wa-l-ʿadhāba bi-l-maghfirati — fa-mā aṣbarahum ʿalā l-nār
  trad: Ce sont eux qui ont acheté l'égarement contre la hudā, et le ʿadhāb contre la maghfira — qu'est-ce qui les rend donc si insensibles face au feu !
- ref: S.2:176
  ar: ذَٰلِكَ بِأَنَّ ٱللَّهَ نَزَّلَ ٱلْكِتَٰبَ بِٱلْحَقِّ ۗ وَإِنَّ ٱلَّذِينَ ٱخْتَلَفُوا۟ فِى ٱلْكِتَٰبِ لَفِى شِقَاقٍ بَعِيدٍ
  trl: Dhālika bi-anna llāha nazzala l-kitāba bi-l-ḥaqq — wa-inna lladhīna khtalafū fī l-kitābi la-fī shiqāqin baʿīd
  trad: Cela du fait qu'Allaah a fait descendre le Kitāb avec al-ḥaqq — et ceux qui ont introduit la divergence dans le Kitāb sont assurément dans un shiqāq qui s'est éloigné.
- ref: S.2:177
  ar: لَّيْسَ ٱلْبِرَّ أَن تُوَلُّوا۟ وُجُوهَكُمْ قِبَلَ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ وَلَٰكِنَّ ٱلْبِرَّ مَنْ ءَامَنَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ وَٱلْمَلَٰٓئِكَةِ وَٱلْكِتَٰبِ وَٱلنَّبِيِّۦنَ وَءَاتَى ٱلْمَالَ عَلَىٰ حُبِّهِۦ ذَوِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينَ وَٱبْنَ ٱلسَّبِيلِ وَٱلسَّآئِلِينَ وَفِى ٱلرِّقَابِ وَأَقَامَ ٱلصَّلَوٰةَ وَءَاتَى ٱلزَّكَوٰةَ وَٱلْمُوفُونَ بِعَهْدِهِمْ إِذَا عَٰهَدُوا۟ ۖ وَٱلصَّٰبِرِينَ فِى ٱلْبَأْسَآءِ وَٱلضَّرَّآءِ وَحِينَ ٱلْبَأْسِ ۗ أُو۟لَٰٓئِكَ ٱلَّذِينَ صَدَقُوا۟ ۖ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُتَّقُونَ
  trl: Laysa l-birra an tuwallū wujūhakum qibala l-mashriqi wa-l-maghribi wa-lākinna l-birra man āmana bi-llāhi wa-l-yawmi l-ākhiri wa-l-malāʾikati wa-l-kitābi wa-l-nabiyyīn — wa-ātā l-māla ʿalā ḥubbihi dhawī l-qurbā wa-l-yatāmā wa-l-masākīna wa-bna l-sabīli wa-l-sāʾilīna wa-fī l-riqābi wa-aqāma l-ṣalāta wa-ātā l-zakāta wa-l-mūfūna bi-ʿahdihim idhā ʿāhadū wa-l-ṣābirīna fī l-baʾsāʾi wa-l-ḍarrāʾi wa-ḥīna l-baʾs — ulāʾika lladhīna ṣadaqū wa-ulāʾika humu l-muttaqūn
  trad: Le birr n'est pas que vous orientiez vos visages vers l'orient et l'occident — mais le birr, c'est celui qui a cru en Allaah, au Dernier Jour, aux malāʾika, au Kitāb et aux nabiyyūn — et qui donne le bien, malgré son attachement à lui, aux proches, aux orphelins, aux miskīn, au voyageur sans ressources, à ceux qui demandent, et pour l'affranchissement des captifs — et qui tient la ṣalāt et donne la zakāt — et ceux qui remplissent leur engagement quand ils se sont engagés, et ceux qui tiennent dans le dénuement, l'épreuve et l'instant du combat. Ceux-là sont ceux qui ont été véridiques, et ceux-là sont les muttaqūn.
- ref: S.2:178
  ar: يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلْقِصَاصُ فِى ٱلْقَتْلَى ۖ ٱلْحُرُّ بِٱلْحُرِّ وَٱلْعَبْدُ بِٱلْعَبْدِ وَٱلْأُنثَىٰ بِٱلْأُنثَىٰ ۚ فَمَنْ عُفِىَ لَهُۥ مِنْ أَخِيهِ شَىْءٌ فَٱتِّبَاعٌ بِٱلْمَعْرُوفِ وَأَدَآءٌ إِلَيْهِ بِإِحْسَٰنٍ ۗ ذَٰلِكَ تَخْفِيفٌ مِّن رَّبِّكُمْ وَرَحْمَةٌ ۗ وَمَنِ ٱعْتَدَىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ أَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū kutiba ʿalaykumu l-qiṣāṣu fī l-qatlā — al-ḥurru bi-l-ḥurri wa-l-ʿabdu bi-l-ʿabdi wa-l-unthā bi-l-unthā — fa-man ʿufiya lahu min akhīhi shayʾun fa-ttibāʿun bi-l-maʿrūfi wa-adāʾun ilayhi bi-iḥsān — dhālika takhfīfun min rabbikum wa-raḥma — wa-mani ʿtadā baʿda dhālika fa-lahu ʿadhābun alīm
  trad: Ô vous qui avez cru, il vous a été prescrit le qiṣāṣ concernant les tués — le libre pour le libre, l'esclave pour l'esclave, la femme pour la femme. Mais quiconque se voit accorder un pardon par son frère, alors suivi selon le maʿrūf et acquittement envers lui avec iḥsān. Cela est un allégement de la part de votre Rabb, et une miséricorde. Et quiconque transgresse après cela, pour lui un ʿadhāb douloureux.
- ref: S.2:179
  ar: وَلَكُمْ فِى ٱلْقِصَاصِ حَيَوٰةٌ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ لَعَلَّكُمْ تَتَّقُونَ
  trl: Wa-lakum fī l-qiṣāṣi ḥayātun yā ulī l-albābi laʿallakum tattaqūn
  trad: Et il y a pour vous dans le qiṣāṣ une vie — ô détenteurs du noyau de discernement — afin que vous vous constituiez une taqwā.
- ref: S.2:180
  ar: كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ إِن تَرَكَ خَيْرًا الْوَصِيَّةُ لِلْوَالِدَيْنِ وَالْأَقْرَبِينَ بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُتَّقِينَ
  trl: Kutiba ʿalaykum idhā ḥaḍara aḥadakumu l-mawtu in taraka khayran — al-waṣiyyatu li-l-wālidayni wa-l-aqrabīna bi-l-maʿrūf — ḥaqqan ʿalā l-muttaqīn
  trad: 'Il vous a été prescrit, quand la mort se présente à l''un de vous, s''il laisse un bien : la waṣiyya pour les deux parents et les proches, bi-l-maʿrūf — un ḥaqq engageant les muttaqīn.'
- ref: S.2:181
  ar: فَمَن بَدَّلَهُ بَعْدَ مَا سَمِعَهُ فَإِنَّمَا إِثْمُهُ عَلَى الَّذِينَ يُبَدِّلُونَهُ ۚ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ
  trl: Fa-man baddalahu baʿda mā samiʿahu fa-innamā ithmuhu ʿalā lladhīna yubaddilūnahu — inna llāha Samīʿun ʿAlīm
  trad: Quiconque la modifie après l'avoir entendue, son ithm ne pèse que sur ceux qui la modifient — Allaah est al-Samīʿ, al-ʿAlīm.
- ref: S.2:182
  ar: فَمَنْ خَافَ مِن مُّوصٍ جَنَفًا أَوْ إِثْمًا فَأَصْلَحَ بَيْنَهُمْ فَلَا إِثْمَ عَلَيْهِ ۚ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Fa-man khāfa min mūṣin janafan aw ithman fa-aṣlaḥa baynahum fa-lā ithma ʿalayhi — inna llāha Ghafūrun Raḥīm
  trad: Mais quiconque craint, de la part de celui qui fait la waṣiyya, un janaf ou un ithm, et rétablit l'accord entre eux — nul ithm sur lui. Allaah est al-Ghafūr, al-Raḥīm.
- ref: S.2:183
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ
  trl: Yā ayyuhā lladhīna āmanū kutiba ʿalaykumu ṣ-ṣiyāmu kamā kutiba ʿalā lladhīna min qablikum laʿallakum tattaqūn
  trad: Ô vous qui avez cru, le ṣiyām vous a été prescrit comme il avait été prescrit à ceux qui vous ont précédés — afin que vous atteigniez la taqwā.
- ref: S.2:184
  ar: أَيَّامًا مَّعْدُودَاتٍ ۚ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ ۚ وَعَلَى الَّذِينَ يُطِيقُونَهُ فِدْيَةٌ طَعَامُ مِسْكِينٍ ۖ فَمَن تَطَوَّعَ خَيْرًا فَهُوَ خَيْرٌ لَّهُ ۚ وَأَن تَصُومُوا خَيْرٌ لَّكُمْ ۖ إِن كُنتُمْ تَعْلَمُونَ
  trl: Ayyāman maʿdūdāt — fa-man kāna minkum marīḍan aw ʿalā safarin fa-ʿiddatun min ayyāmin ukhar — wa-ʿalā lladhīna yuṭīqūnahu fidyatun ṭaʿāmu miskīn — fa-man taṭawwaʿa khayran fa-huwa khayrun lahu — wa-an taṣūmū khayrun lakum in kuntum taʿlamūn
  trad: 'Des jours comptés — quiconque parmi vous est malade ou en voyage, un décompte d''autres jours. Et pour ceux qui en ont la capacité, une fidya : nourrir un pauvre. Quiconque accomplit volontairement un surplus de bien, cela est meilleur pour lui — et que vous fassiez le ṣiyām est meilleur pour vous, si vous saviez.'
- ref: S.2:185
  ar: شَهْرُ رَمَضَانَ الَّذِي أُنزِلَ فِيهِ الْقُرْآنُ هُدًى لِّلنَّاسِ وَبَيِّنَاتٍ مِّنَ الْهُدَىٰ وَالْفُرْقَانِ ۚ فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ ۖ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ ۗ يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ
  trl: Shahru ramaḍāna lladhī unzila fīhi l-Qurʾānu hudan li-l-nāsi wa-bayyinātin mina l-hudā wa-l-furqān — fa-man shahida minkumu l-shahra fa-l-yaṣumhu — wa-man kāna marīḍan aw ʿalā safarin fa-ʿiddatun min ayyāmin ukhar — yurīdu llāhu bikumu l-yusra wa-lā yurīdu bikumu l-ʿusra wa-li-tukmilū l-ʿiddata wa-li-tukabbirū llāha ʿalā mā hadākum wa-laʿallakum tashkurūn
  trad: Le mois de Ramaḍān, celui dans lequel le Qurʾān a été fait descendre, guide pour les gens et preuves manifestes du hudā et du furqān — quiconque parmi vous est témoin du mois, qu'il le jeûne. Quiconque est malade ou en voyage, un décompte d'autres jours. Allaah veut pour vous l'aisance et ne veut pas pour vous la contrainte — et pour que vous complétiez le décompte, et proclamiez la grandeur d'Allaah pour vous avoir guidés — afin que vous soyez reconnaissants.
- ref: S.2:186
  ar: وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ ۖ فَلْيَسْتَجِيبُوا لِي وَلْيُؤْمِنُوا بِي لَعَلَّهُمْ يَرْشُدُونَ
  trl: Wa-idhā saʾalaka ʿibādī ʿannī fa-innī qarīb — ujību daʿwata l-dāʿi idhā daʿān — fa-l-yastajībū lī wa-l-yuʾminū bī laʿallahum yarshudūn
  trad: 'Et quand Mes serviteurs t''interrogent à Mon sujet — Je suis proche : Je réponds à l''appel de celui qui appelle quand il M''appelle. Qu''ils Me répondent donc et croient en Moi — afin qu''ils atteignent le rushd.'
- ref: S.2:187
  ar: أُحِلَّ لَكُمْ لَيْلَةَ الصِّيَامِ الرَّفَثُ إِلَىٰ نِسَائِكُمْ ۚ هُنَّ لِبَاسٌ لَّكُمْ وَأَنتُمْ لِبَاسٌ لَّهُنَّ ۗ عَلِمَ اللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ ۖ فَالْآنَ بَاشِرُوهُنَّ وَابْتَغُوا مَا كَتَبَ اللَّهُ لَكُمْ ۚ وَكُلُوا وَاشْرَبُوا حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ ۖ ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ ۚ وَلَا تُبَاشِرُوهُنَّ وَأَنتُمْ عَاكِفُونَ فِي الْمَسَاجِدِ ۗ تِلْكَ حُدُودُ اللَّهِ فَلَا تَقْرَبُوهَا ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ آيَاتِهِ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَ
  trl: Uḥilla lakum laylata l-ṣiyāmi l-rafathu ilā nisāʾikum — hunna libāsun lakum wa-antum libāsun lahunna — ʿalima llāhu annakum kuntum takhtānūna anfusakum fa-tāba ʿalaykum wa-ʿafā ʿankum — fa-l-āna bāshirūhunna wa-btaghū mā kataba llāhu lakum — wa-kulū wa-shrabū ḥattā yatabayyana lakumu l-khayṭu l-abyaḍu mina l-khayṭi l-aswadi mina l-fajri — thumma atimmū l-ṣiyāma ilā l-layli — wa-lā tubāshirūhunna wa-antum ʿākifūna fī l-masājidi — tilka ḥudūdu llāhi fa-lā taqrabūhā — ka-dhālika yubayyinu llāhu āyātihi li-l-nāsi laʿallahum yattaqūn
  trad: Vous a été rendu ḥalāl, la nuit du ṣiyām, le rafath vers vos épouses — elles sont un vêtement pour vous et vous êtes un vêtement pour elles. Allaah a su que vous vous trahissiez vous-mêmes — Il a accueilli votre retour et vous a graciés. Approchez-les donc maintenant, et recherchez ce qu'Allaah a prescrit pour vous. Mangez et buvez jusqu'à ce que se distingue pour vous le fil blanc du fil noir de l'aube — puis accomplissez le ṣiyām jusqu'à la nuit. Et ne les approchez pas alors que vous êtes ʿākifūn dans les masājid. Voilà les ḥudūd d'Allaah — ne vous en approchez pas. C'est ainsi qu'Allaah expose Ses āyāt aux gens — afin qu'ils se constituent une taqwā.
- ref: S.2:188
  ar: وَلَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ وَتُدْلُوا بِهَا إِلَى الْحُكَّامِ لِتَأْكُلُوا فَرِيقًا مِّنْ أَمْوَالِ النَّاسِ بِالْإِثْمِ وَأَنتُمْ تَعْلَمُونَ
  trl: Wa-lā taʾkulū amwālakum baynakum bi-l-bāṭili wa-tudlū bihā ilā l-ḥukkāmi li-taʾkulū farīqan min amwāli l-nāsi bi-l-ithmi wa-antum taʿlamūn
  trad: Et ne consommez pas vos biens entre vous par le bāṭil, et n'en usez pas auprès des ḥukkām pour consommer une partie des biens des gens par l'ithm, alors que vous savez.
- ref: S.2:189
  ar: يَسْأَلُونَكَ عَنِ الْأَهِلَّةِ ۖ قُلْ هِيَ مَوَاقِيتُ لِلنَّاسِ وَالْحَجِّ ۗ وَلَيْسَ الْبِرُّ بِأَن تَأْتُوا الْبُيُوتَ مِن ظُهُورِهَا وَلَٰكِنَّ الْبِرَّ مَنِ اتَّقَىٰ ۗ وَأْتُوا الْبُيُوتَ مِنْ أَبْوَابِهَا ۚ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ
  trl: Yasʾalūnaka ʿani l-ahillati qul hiya mawāqītu li-l-nāsi wa-l-ḥajji — wa-laysa l-birru bi-an taʾtū l-buyūta min ẓuhūrihā wa-lākinna l-birra mani ttaqā — wa-tū l-buyūta min abwābihā wa-ttaqū llāha laʿallakum tufliḥūn
  trad: 'Ils t''interrogent au sujet des ahilla — dis : « Ce sont des mawāqīt pour les gens et pour le ḥajj. » Et le birr n''est pas d''entrer dans les maisons par leurs dos — mais le birr, c''est celui qui se constitue une taqwā. Entrez dans les maisons par leurs portes, et constituez-vous une taqwā d''Allaah — afin que vous atteigniez le falāḥ.'
- ref: S.2:190
  ar: وَقَاتِلُوا فِي سَبِيلِ اللَّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلَا تَعْتَدُوا ۚ إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ
  trl: Wa-qātilū fī sabīli llāhi lladhīna yuqātilūnakum wa-lā taʿtadū — inna llāha lā yuḥibbu l-muʿtadīn
  trad: Et combattez dans le sabīl d'Allaah ceux qui vous combattent, et ne transgressez pas — Allaah n'aime pas les muʿtadīn.
- ref: S.2:191
  ar: وَاقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم مِّنْ حَيْثُ أَخْرَجُوكُمْ ۚ وَالْفِتْنَةُ أَشَدُّ مِنَ الْقَتْلِ ۚ وَلَا تُقَاتِلُوهُمْ عِندَ الْمَسْجِدِ الْحَرَامِ حَتَّىٰ يُقَاتِلُوكُمْ فِيهِ ۖ فَإِن قَاتَلُوكُمْ فَاقْتُلُوهُمْ ۗ كَذَٰلِكَ جَزَاءُ الْكَافِرِينَ
  trl: Wa-qtulūhum ḥaythu thaqiftumūhum wa-akhrijūhum min ḥaythu akhrajūkum — wa-l-fitnatu ashaddu mina l-qatli — wa-lā tuqātilūhum ʿinda l-masjidi l-ḥarāmi ḥattā yuqātilūkum fīhi — fa-in qātalūkum fa-qtulūhum — ka-dhālika jazāʾu l-kāfirīn
  trad: Tuez-les où que vous les ayez trouvés, et expulsez-les d'où ils vous ont expulsés — la fitna est plus grave que le fait de tuer. Et ne les combattez pas près du Masjid al-Ḥarām, avant qu'ils ne vous y combattent. S'ils vous combattent, alors tuez-les — telle est la rétribution des kāfirīn.
- ref: S.2:192
  ar: فَإِنِ انتَهَوْا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Fa-ini ntahaw fa-inna llāha Ghafūrun Raḥīm
  trad: Mais s'ils cessent, Allaah est al-Ghafūr, al-Raḥīm.
- ref: S.2:193
  ar: وَقَاتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌ وَيَكُونَ الدِّينُ لِلَّهِ ۖ فَإِنِ انتَهَوْا فَلَا عُدْوَانَ إِلَّا عَلَى الظَّالِمِينَ
  trl: Wa-qātilūhum ḥattā lā takūna fitnatun wa-yakūna l-dīnu li-llāhi — fa-ini ntahaw fa-lā ʿudwāna illā ʿalā l-ẓālimīn
  trad: Et combattez-les jusqu'à ce qu'il n'y ait plus de fitna et que le dīn soit à Allaah — mais s'ils cessent, nulle ʿudwān sinon envers les ẓālimūn.
- ref: S.2:194
  ar: الشَّهْرُ الْحَرَامُ بِالشَّهْرِ الْحَرَامِ وَالْحُرُمَاتُ قِصَاصٌ ۚ فَمَنِ اعْتَدَىٰ عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَىٰ عَلَيْكُمْ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ
  trl: Al-shahru l-ḥarāmu bi-l-shahri l-ḥarāmi wa-l-ḥurumātu qiṣāṣ — fa-mani ʿtadā ʿalaykum fa-ʿtadū ʿalayhi bi-mithli mā ʿtadā ʿalaykum — wa-ttaqū llāha wa-ʿlamū anna llāha maʿa l-muttaqīn
  trad: Le mois ḥarām répond au mois ḥarām, et les ḥurumāt relèvent du qiṣāṣ — quiconque a transgressé contre vous, répondez-lui par l'équivalent exact de ce dont il a transgressé contre vous. Constituez-vous une taqwā d'Allaah et sachez qu'Allaah est avec les muttaqīn.
- ref: S.2:195
  ar: وَأَنفِقُوا فِي سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ ۛ وَأَحْسِنُوا ۛ إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ
  trl: Wa-anfiqū fī sabīli llāhi wa-lā tulqū bi-aydīkum ilā l-tahlukati — wa-aḥsinū — inna llāha yuḥibbu l-muḥsinīn
  trad: 'Et dépensez dans le sabīl d''Allaah, et ne vous jetez pas de vos propres mains vers la tahluka — et accomplissez l''iḥsān : Allaah aime les muḥsinūn.'
- ref: S.2:196
  ar: وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ ۚ فَإِنْ أُحْصِرْتُمْ فَمَا اسْتَيْسَرَ مِنَ الْهَدْيِ ۖ وَلَا تَحْلِقُوا رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ الْهَدْيُ مَحِلَّهُ ۚ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِ أَذًى مِّن رَّأْسِهِ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ ۚ فَإِذَا أَمِنتُمْ فَمَن تَمَتَّعَ بِالْعُمْرَةِ إِلَى الْحَجِّ فَمَا اسْتَيْسَرَ مِنَ الْهَدْيِ ۚ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَاثَةِ أَيَّامٍ فِي الْحَجِّ وَسَبْعَةٍ إِذَا رَجَعْتُمْ ۗ تِلْكَ عَشَرَةٌ كَامِلَةٌ ۗ ذَٰلِكَ لِمَن لَّمْ يَكُنْ أَهْلُهُ حَاضِرِي الْمَسْجِدِ الْحَرَامِ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ شَدِيدُ الْعِقَابِ
  trl: Wa-atimmū l-ḥajja wa-l-ʿumrata li-llāh — fa-in uḥṣirtum fa-mā staysara mina l-hady — wa-lā taḥliqū ruʾūsakum ḥattā yablugha l-hadyu maḥillahu — fa-man kāna minkum marīḍan aw bihi adhan min raʾsihi fa-fidyatun min ṣiyāmin aw ṣadaqatin aw nusuk — fa-idhā amintum fa-man tamattaʿa bi-l-ʿumrati ilā l-ḥajji fa-mā staysara mina l-hady — fa-man lam yajid fa-ṣiyāmu thalāthati ayyāmin fī l-ḥajji wa-sabʿatin idhā rajaʿtum — tilka ʿasharatun kāmilatun — dhālika li-man lam yakun ahluhu ḥāḍiri l-masjidi l-ḥarāmi — wa-ttaqū llāha wa-ʿlamū anna llāha shadīdu l-ʿiqāb
  trad: 'Et accomplissez pleinement le ḥajj et la ʿumra pour Allaah. Si vous en êtes empêchés, alors ce qui s''obtient aisément comme hady. Et ne rasez pas vos têtes avant que le hady n''atteigne son terme. Quiconque parmi vous est malade ou souffre d''une atteinte à la tête, une fidya : ṣiyām, ṣadaqa, ou nusuk. Une fois en sécurité, quiconque conjugue la ʿumra au ḥajj, alors ce qui s''obtient aisément comme hady ; quiconque n''en trouve pas, trois jours de ṣiyām pendant le ḥajj et sept à votre retour — dix jours complets. Cela pour quiconque n''a pas sa famille présente au Masjid al-Ḥarām. Constituez-vous une taqwā d''Allaah et sachez qu''Allaah est intense dans le châtiment.'
- ref: S.2:197
  ar: الْحَجُّ أَشْهُرٌ مَّعْلُومَاتٌ ۚ فَمَن فَرَضَ فِيهِنَّ الْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِي الْحَجِّ ۗ وَمَا تَفْعَلُوا مِنْ خَيْرٍ يَعْلَمْهُ اللَّهُ ۗ وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ ۚ وَاتَّقُونِ يَا أُولِي الْأَلْبَابِ
  trl: Al-ḥajju ashhurun maʿlūmāt — fa-man faraḍa fīhinna l-ḥajja fa-lā rafatha wa-lā fusūqa wa-lā jidāla fī l-ḥajji — wa-mā tafʿalū min khayrin yaʿlamhu llāh — wa-tazawwadū fa-inna khayra l-zādi l-taqwā — wa-ttaqūni yā ulī l-albāb
  trad: Le ḥajj se tient sur des mois connus — quiconque s'y engage fermement pour le ḥajj, alors point de rafath, point de fusūq, point de jidāl dans le ḥajj. Et quel que soit le bien que vous accomplissiez, Allaah le sait. Munissez-vous de provisions — la meilleure provision est la taqwā — et constituez-vous une taqwā envers Moi, ô détenteurs de l'albāb.
- ref: S.2:198
  ar: لَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَبْتَغُوا فَضْلًا مِّن رَّبِّكُمْ ۚ فَإِذَا أَفَضْتُم مِّنْ عَرَفَاتٍ فَاذْكُرُوا اللَّهَ عِندَ الْمَشْعَرِ الْحَرَامِ ۖ وَاذْكُرُوهُ كَمَا هَدَاكُمْ وَإِن كُنتُم مِّن قَبْلِهِ لَمِنَ الضَّالِّينَ
  trl: Laysa ʿalaykum junāḥun an tabtaghū faḍlan min rabbikum — fa-idhā afaḍtum min ʿArafātin fa-dhkurū llāha ʿinda l-mashʿari l-ḥarāmi — wa-dhkurūhu kamā hadākum wa-in kuntum min qablihi la-mina l-ḍāllīn
  trad: Nul jināḥ sur vous à rechercher un faḍl venant de votre Rabb. Et quand vous vous répandez depuis ʿArafāt, faites le dhikr d'Allaah près du Mashʿar al-Ḥarām — faites Son dhikr comme Il vous a guidés, alors qu'auparavant vous étiez certes parmi les ḍāllīn.
- ref: S.2:199
  ar: ثُمَّ أَفِيضُوا مِنْ حَيْثُ أَفَاضَ النَّاسُ وَاسْتَغْفِرُوا اللَّهَ ۚ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Thumma afīḍū min ḥaythu afāḍa l-nāsu wa-staghfirū llāha — inna llāha Ghafūrun Raḥīm
  trad: Puis répandez-vous d'où les gens se sont répandus, et demandez le ghufrān d'Allaah — Allaah est al-Ghafūr, al-Raḥīm.
- ref: S.2:200
  ar: فَإِذَا قَضَيْتُم مَّنَاسِكَكُمْ فَاذْكُرُوا اللَّهَ كَذِكْرِكُمْ آبَاءَكُمْ أَوْ أَشَدَّ ذِكْرًا ۗ فَمِنَ النَّاسِ مَن يَقُولُ رَبَّنَا آتِنَا فِي الدُّنْيَا وَمَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ
  trl: Fa-idhā qaḍaytum manāsikakum fa-dhkurū llāha ka-dhikrikum ābāʾakum aw ashadda dhikrā — fa-mina l-nāsi man yaqūlu rabbanā ātinā fī l-dunyā wa-mā lahu fī l-ākhirati min khalāq
  trad: 'Lorsque vous vous êtes acquittés de vos manāsik, convoquez Allaah dans le dhikr comme vous convoquez vos pères, ou d''un dhikr plus intense encore. Or parmi les gens, il en est qui dit : « Notre Rabb, accorde-nous en ce bas monde » — et il n''a, dans l''au-delà, aucune part.'
- ref: S.2:201
  ar: وَمِنْهُم مَّن يَقُولُ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ
  trl: Wa-minhum man yaqūlu rabbanā ātinā fī l-dunyā ḥasanatan wa-fī l-ākhirati ḥasanatan wa-qinā ʿadhāba l-nār
  trad: 'Et parmi eux, il en est qui dit : « Notre Rabb, accorde-nous une ḥasana en ce bas monde et une ḥasana dans l''au-delà, et préserve-nous du châtiment du Feu ».'
- ref: S.2:202
  ar: أُولَٰئِكَ لَهُمْ نَصِيبٌ مِّمَّا كَسَبُوا ۚ وَاللَّهُ سَرِيعُ الْحِسَابِ
  trl: Ulāʾika lahum naṣībun mimmā kasabū — wa-llāhu Sarīʿu l-ḥisāb
  trad: Ceux-là ont une part de ce qu'ils ont acquis. Et Allaah est Sarīʿ al-Ḥisāb.
- ref: S.2:203
  ar: وَاذْكُرُوا اللَّهَ فِي أَيَّامٍ مَّعْدُودَاتٍ ۚ فَمَن تَعَجَّلَ فِي يَوْمَيْنِ فَلَا إِثْمَ عَلَيْهِ وَمَن تَأَخَّرَ فَلَا إِثْمَ عَلَيْهِ ۙ لِمَنِ اتَّقَىٰ ۗ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّكُمْ إِلَيْهِ تُحْشَرُونَ
  trl: Wa-dhkurū llāha fī ayyāmin maʿdūdāt — fa-man taʿajjala fī yawmayni fa-lā ithma ʿalayhi wa-man taʾakhkhara fa-lā ithma ʿalayhi li-mani ttaqā — wa-ttaqū llāha wa-ʿlamū annakum ilayhi tuḥsharūn
  trad: Et convoquez Allaah durant des jours comptés. Quiconque se hâte en deux jours, nulle faute sur lui ; quiconque retarde, nulle faute sur lui non plus — pour qui s'est constitué une taqwā. Constituez-vous une taqwā envers Allaah, et sachez que c'est vers Lui que vous serez rassemblés.
- ref: S.2:204
  ar: وَمِنَ النَّاسِ مَن يُعْجِبُكَ قَوْلُهُ فِي الْحَيَاةِ الدُّنْيَا وَيُشْهِدُ اللَّهَ عَلَىٰ مَا فِي قَلْبِهِ وَهُوَ أَلَدُّ الْخِصَامِ
  trl: Wa-mina l-nāsi man yuʿjibuka qawluhu fī l-ḥayāti l-dunyā wa-yushhidu llāha ʿalā mā fī qalbihi wa-huwa aladdu l-khiṣām
  trad: Et parmi les gens, il en est dont la parole te séduit dans la vie de ce bas monde, et qui prend Allaah à témoin de ce qu'il y a dans son cœur — alors qu'il est le plus âpre des contradicteurs.
- ref: S.2:205
  ar: وَإِذَا تَوَلَّىٰ سَعَىٰ فِي الْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ الْحَرْثَ وَالنَّسْلَ ۗ وَاللَّهُ لَا يُحِبُّ الْفَسَادَ
  trl: Wa-idhā tawallā saʿā fī l-arḍi li-yufsida fīhā wa-yuhlika l-ḥartha wa-l-nasl — wa-llāhu lā yuḥibbu l-fasād
  trad: Et lorsqu'il se détourne, il s'active sur la terre pour y corrompre l'ordre, et anéantir la culture et la descendance. Or Allaah n'aime pas la corruption de l'ordre.
- ref: S.2:206
  ar: وَإِذَا قِيلَ لَهُ اتَّقِ اللَّهَ أَخَذَتْهُ الْعِزَّةُ بِالْإِثْمِ ۚ فَحَسْبُهُ جَهَنَّمُ ۚ وَلَبِئْسَ الْمِهَادُ
  trl: Wa-idhā qīla lahu ttaqi llāha akhadhathu l-ʿizzatu bi-l-ithm — fa-ḥasbuhu jahannam — wa-la-biʾsa l-mihād
  trad: 'Et quand on lui dit : « Constitue-toi une taqwā envers Allaah », l''obstination le saisit dans la faute — alors jahannam lui suffit, et quelle détestable couche.'
- ref: S.2:207
  ar: وَمِنَ النَّاسِ مَن يَشْرِي نَفْسَهُ ابْتِغَاءَ مَرْضَاتِ اللَّهِ ۗ وَاللَّهُ رَءُوفٌ بِالْعِبَادِ
  trl: Wa-mina l-nāsi man yashrī nafsahu btighāʾa marḍāti llāh — wa-llāhu Raʾūfun bi-l-ʿibād
  trad: Et parmi les gens, il en est qui se donne tout entier, en quête de l'agrément d'Allaah. Et Allaah est al-Raʾūf envers les serviteurs.
- ref: S.2:208
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا ادْخُلُوا فِي السِّلْمِ كَافَّةً وَلَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ ۚ إِنَّهُ لَكُمْ عَدُوٌّ مُّبِينٌ
  trl: Yā ayyuhā lladhīna āmanū dkhulū fī l-silmi kāffatan wa-lā tattabiʿū khuṭuwāti l-shayṭān — innahu lakum ʿaduwwun mubīn
  trad: Ô vous qui avez cru, entrez dans al-silm dans sa totalité, et ne suivez pas les pas du shayṭān — il est pour vous un ennemi manifeste.
- ref: S.2:209
  ar: فَإِن زَلَلْتُم مِّن بَعْدِ مَا جَاءَتْكُمُ الْبَيِّنَاتُ فَاعْلَمُوا أَنَّ اللَّهَ عَزِيزٌ حَكِيمٌ
  trl: Fa-in zalaltum min baʿdi mā jāʾatkumu l-bayyināt fa-ʿlamū anna llāha ʿAzīzun Ḥakīm
  trad: Et si vous trébuchez après que les bayyināt vous sont venues, sachez qu'Allaah est al-ʿAzīz, al-Ḥakīm.
- ref: S.2:210
  ar: هَلْ يَنظُرُونَ إِلَّا أَن يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِّنَ الْغَمَامِ وَالْمَلَائِكَةُ وَقُضِيَ الْأَمْرُ ۚ وَإِلَى اللَّهِ تُرْجَعُ الْأُمُورُ
  trl: Hal yanẓurūna illā an yaʾtiyahumu llāhu fī ẓulalin mina l-ghamāmi wa-l-malāʾikatu wa-quḍiya l-amr — wa-ilā llāhi turjaʿu l-umūr
  trad: N'attendent-ils sinon qu'Allaah leur vienne dans des ombres de nuées, avec les malāʾika, et que l'affaire soit tranchée ? Et c'est vers Allaah que les affaires font retour.
- ref: S.2:211
  ar: سَلْ بَنِي إِسْرَائِيلَ كَمْ آتَيْنَاهُم مِّنْ آيَةٍ بَيِّنَةٍ ۗ وَمَن يُبَدِّلْ نِعْمَةَ اللَّهِ مِن بَعْدِ مَا جَاءَتْهُ فَإِنَّ اللَّهَ شَدِيدُ الْعِقَابِ
  trl: Sal banī isrāʾīla kam ātaynāhum min āyatin bayyinah — wa-man yubaddil niʿmata llāhi min baʿdi mā jāʾathu fa-inna llāha shadīdu l-ʿiqāb
  trad: 'Interroge les Banī Isrāʾīl : combien Nous leur avons donné d''āyāt bayyina ! Et quiconque substitue au bienfait d''Allaah, après qu''il lui est venu, alors Allaah est shadīd al-ʿiqāb.'
- ref: S.2:212
  ar: زُيِّنَ لِلَّذِينَ كَفَرُوا الْحَيَاةُ الدُّنْيَا وَيَسْخَرُونَ مِنَ الَّذِينَ آمَنُوا ۘ وَالَّذِينَ اتَّقَوْا فَوْقَهُمْ يَوْمَ الْقِيَامَةِ ۗ وَاللَّهُ يَرْزُقُ مَن يَشَاءُ بِغَيْرِ حِسَابٍ
  trl: Zuyyina li-lladhīna kafarū l-ḥayātu l-dunyā wa-yaskharūna mina lladhīna āmanū — wa-lladhīna ttaqaw fawqahum yawma l-qiyāmah — wa-llāhu yarzuqu man yashāʾu bi-ghayri ḥisāb
  trad: La vie de ce bas monde a été parée pour ceux qui sont kāfirūn, et ils tournent en dérision ceux qui ont cru — alors que ceux qui se sont constitué une taqwā seront au-dessus d'eux, au Jour de la Station. Et Allaah pourvoit qui Il veut, sans compte.
- ref: S.2:213
  ar: كَانَ النَّاسُ أُمَّةً وَاحِدَةً فَبَعَثَ اللَّهُ النَّبِيِّينَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ الْكِتَابَ بِالْحَقِّ لِيَحْكُمَ بَيْنَ النَّاسِ فِيمَا اخْتَلَفُوا فِيهِ ۚ وَمَا اخْتَلَفَ فِيهِ إِلَّا الَّذِينَ أُوتُوهُ مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَاتُ بَغْيًا بَيْنَهُمْ ۖ فَهَدَى اللَّهُ الَّذِينَ آمَنُوا لِمَا اخْتَلَفُوا فِيهِ مِنَ الْحَقِّ بِإِذْنِهِ ۗ وَاللَّهُ يَهْدِي مَن يَشَاءُ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ
  trl: Kāna l-nāsu ummatan wāḥidah — fa-baʿatha llāhu l-nabiyyīna mubashshirīna wa-mundhirīn — wa-anzala maʿahumu l-kitāba bi-l-ḥaqqi li-yaḥkuma bayna l-nāsi fīmā khtalafū fīh — wa-mā khtalafa fīhi illā lladhīna ūtūhu min baʿdi mā jāʾathumu l-bayyināt baghyan baynahum — fa-hadā llāhu lladhīna āmanū li-mā khtalafū fīhi mina l-ḥaqqi bi-idhnih — wa-llāhu yahdī man yashāʾu ilā ṣirāṭin mustaqīm
  trad: Les gens formaient une ummah unique. Puis Allaah a suscité les nabī-s, porteurs de bonne annonce et avertisseurs, et Il a fait descendre avec eux le Kitāb, porteur du ḥaqq, pour trancher entre les gens ce en quoi ils divergeaient. Or ne divergèrent à ce sujet que ceux à qui il avait été donné, après que les bayyināt leur furent venues — par convoitise rivale entre eux. Alors Allaah a guidé ceux qui ont cru vers ce dont ils divergeaient, du ḥaqq, par Sa permission. Et Allaah guide qui Il veut vers un ṣirāṭ droit.
- ref: S.2:214
  ar: أَمْ حَسِبْتُمْ أَن تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَأْتِكُم مَّثَلُ الَّذِينَ خَلَوْا مِن قَبْلِكُم ۖ مَّسَّتْهُمُ الْبَأْسَاءُ وَالضَّرَّاءُ وَزُلْزِلُوا حَتَّىٰ يَقُولَ الرَّسُولُ وَالَّذِينَ آمَنُوا مَعَهُ مَتَىٰ نَصْرُ اللَّهِ ۗ أَلَا إِنَّ نَصْرَ اللَّهِ قَرِيبٌ
  trl: Am ḥasibtum an tadkhulū l-jannata wa-lammā yaʾtikum mathalu lladhīna khalaw min qablikum — massathumu l-baʾsāʾu wa-l-ḍarrāʾu wa-zulzilū ḥattā yaqūla l-rasūlu wa-lladhīna āmanū maʿahu matā naṣru llāh — alā inna naṣra llāhi qarīb
  trad: 'Ou bien avez-vous estimé que vous entreriez dans la janna sans que ne vous vienne l''équivalent de ce qu''ont connu ceux qui sont passés avant vous ? La détresse et le dommage les ont atteints, et ils ont été ébranlés — jusqu''à ce que le rasūl et ceux qui avaient cru avec lui disent : « Quand donc le secours d''Allaah ? » — En vérité, le secours d''Allaah est proche.'
- ref: S.2:215
  ar: يَسْأَلُونَكَ مَاذَا يُنفِقُونَ ۖ قُلْ مَا أَنفَقْتُم مِّنْ خَيْرٍ فَلِلْوَالِدَيْنِ وَالْأَقْرَبِينَ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَابْنِ السَّبِيلِ ۗ وَمَا تَفْعَلُوا مِنْ خَيْرٍ فَإِنَّ اللَّهَ بِهِ عَلِيمٌ
  trl: Yasʾalūnaka mādhā yunfiqūn — qul mā anfaqtum min khayrin fa-li-l-wālidayni wa-l-aqrabīna wa-l-yatāmā wa-l-masākīni wa-bni l-sabīl — wa-mā tafʿalū min khayrin fa-inna llāha bihi ʿalīm
  trad: 'Ils t''interrogent : que faut-il dépenser ? Dis : ce que vous dépensez de bien va aux deux parents, aux proches, aux yatāmā, aux masākīn et au fils de la route. Et quel que soit le bien que vous fassiez, Allaah en est connaissant.'
- ref: S.2:216
  ar: كُتِبَ عَلَيْكُمُ الْقِتَالُ وَهُوَ كُرْهٌ لَّكُمْ ۖ وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ
  trl: Kutiba ʿalaykumu l-qitālu wa-huwa kurhun lakum — wa-ʿasā an takrahū shayʾan wa-huwa khayrun lakum — wa-ʿasā an tuḥibbū shayʾan wa-huwa sharrun lakum — wa-llāhu yaʿlamu wa-antum lā taʿlamūn
  trad: Le qitāl vous a été prescrit, alors qu'il est répulsion pour vous. Or il se peut que vous répugniez à une chose alors qu'elle est un bien pour vous, et il se peut que vous aimiez une chose alors qu'elle est un mal pour vous. Et Allaah sait, alors que vous ne savez pas.
- ref: S.2:217
  ar: يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيهِ ۖ قُلْ قِتَالٌ فِيهِ كَبِيرٌ ۖ وَصَدٌّ عَن سَبِيلِ اللَّهِ وَكُفْرٌ بِهِ وَالْمَسْجِدِ الْحَرَامِ وَإِخْرَاجُ أَهْلِهِ مِنْهُ أَكْبَرُ عِندَ اللَّهِ ۚ وَالْفِتْنَةُ أَكْبَرُ مِنَ الْقَتْلِ ۗ وَلَا يَزَالُونَ يُقَاتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ اسْتَطَاعُوا ۚ وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِ فَيَمُتْ وَهُوَ كَافِرٌ فَأُولَٰئِكَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ ۖ وَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Yasʾalūnaka ʿani l-shahri l-ḥarāmi qitālin fīh — qul qitālun fīhi kabīr — wa-ṣaddun ʿan sabīli llāhi wa-kufrun bihi wa-l-masjidi l-ḥarāmi wa-ikhrāju ahlihi minhu akbaru ʿinda llāh — wa-l-fitnatu akbaru mina l-qatl — wa-lā yazālūna yuqātilūnakum ḥattā yaruddūkum ʿan dīnikum ini staṭāʿū — wa-man yartadid minkum ʿan dīnihi fa-yamut wa-huwa kāfirun fa-ulāʾika ḥabiṭat aʿmāluhum fī l-dunyā wa-l-ākhirah — wa-ulāʾika aṣḥābu l-nār — hum fīhā khālidūn
  trad: 'Ils t''interrogent sur le mois sacré, sur le qitāl en lui. Dis : un qitāl en lui est grave — mais barrer la voie d''Allaah, le kufr envers Lui, barrer al-masjid al-ḥarām, et en expulser ses habitants, est plus grave encore auprès d''Allaah. Et la fitna est plus grave que le fait de tuer. Et ils ne cesseront de vous combattre jusqu''à vous faire revenir de votre dīn, s''ils le peuvent. Et quiconque parmi vous fait retour hors de son dīn et meurt alors qu''il est kāfir — ceux-là, leurs œuvres s''annulent en ce bas monde et dans l''au-delà, et ceux-là sont les compagnons du Feu, ils y demeurent fixement.'
- ref: S.2:218
  ar: إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ ۚ وَاللَّهُ غَفُورٌ رَّحِيمٌ
  trl: Inna lladhīna āmanū wa-lladhīna hājarū wa-jāhadū fī sabīli llāhi ulāʾika yarjūna raḥmata llāh — wa-llāhu Ghafūrun Raḥīm
  trad: Ceux qui ont cru, et ceux qui ont émigré et déployé leur jahd sur la voie d'Allaah — ceux-là espèrent la raḥma d'Allaah. Et Allaah est al-Ghafūr, al-Raḥīm.
- ref: S.2:219
  ar: يَسْأَلُونَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِ ۖ قُلْ فِيهِمَا إِثْمٌ كَبِيرٌ وَمَنَافِعُ لِلنَّاسِ وَإِثْمُهُمَا أَكْبَرُ مِن نَّفْعِهِمَا ۗ وَيَسْأَلُونَكَ مَاذَا يُنفِقُونَ قُلِ الْعَفْوَ ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ لَعَلَّكُمْ تَتَفَكَّرُونَ
  trl: Yasʾalūnaka ʿani l-khamri wa-l-maysir — qul fīhimā ithmun kabīrun wa-manāfiʿu li-l-nāsi wa-ithmuhumā akbaru min nafʿihimā — wa-yasʾalūnaka mādhā yunfiqūn — qul al-ʿafw — ka-dhālika yubayyinu llāhu lakumu l-āyāti laʿallakum tatafakkarūn
  trad: 'Ils t''interrogent sur le khamr et le maysir. Dis : en eux deux, il y a une faute grave et des bénéfices pour les gens, mais leur faute est plus grave que leur bénéfice. Et ils t''interrogent : que faut-il dépenser ? Dis : le surplus. Ainsi Allaah vous explicite les āyāt, afin que vous réfléchissiez.'
- ref: S.2:220
  ar: فِي الدُّنْيَا وَالْآخِرَةِ ۗ وَيَسْأَلُونَكَ عَنِ الْيَتَامَىٰ ۖ قُلْ إِصْلَاحٌ لَّهُمْ خَيْرٌ ۖ وَإِن تُخَالِطُوهُمْ فَإِخْوَانُكُمْ ۚ وَاللَّهُ يَعْلَمُ الْمُفْسِدَ مِنَ الْمُصْلِحِ ۚ وَلَوْ شَاءَ اللَّهُ لَأَعْنَتَكُمْ ۚ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ
  trl: Fī l-dunyā wa-l-ākhirah — wa-yasʾalūnaka ʿani l-yatāmā — qul iṣlāḥun lahum khayr — wa-in tukhāliṭūhum fa-ikhwānukum — wa-llāhu yaʿlamu l-mufsida mina l-muṣliḥ — wa-law shāʾa llāhu la-aʿnatakum — inna llāha ʿAzīzun Ḥakīm
  trad: 'Sur ce bas monde et l''au-delà. Et ils t''interrogent sur les yatāmā. Dis : rectifier leur condition est un bien. Et si vous mêlez vos affaires aux leurs, ils sont vos frères — Allaah distingue celui qui corrompt l''ordre de celui qui le rectifie. Et si Allaah avait voulu, Il vous aurait mis en épreuve jusqu''à la rupture. En vérité, Allaah est al-ʿAzīz, al-Ḥakīm.'
- ref: S.2:221
  ar: وَلَا تَنكِحُوا الْمُشْرِكَاتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌ مُّؤْمِنَةٌ خَيْرٌ مِّن مُّشْرِكَةٍ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا تُنكِحُوا الْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا ۚ وَلَعَبْدٌ مُّؤْمِنٌ خَيْرٌ مِّن مُّشْرِكٍ وَلَوْ أَعْجَبَكُمْ ۗ أُولَٰئِكَ يَدْعُونَ إِلَى النَّارِ ۖ وَاللَّهُ يَدْعُو إِلَى الْجَنَّةِ وَالْمَغْفِرَةِ بِإِذْنِهِ ۖ وَيُبَيِّنُ آيَاتِهِ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ
  trl: Wa-lā tankiḥū l-mushrikāti ḥattā yuʾminn — wa-la-amatun muʾminatun khayrun min mushrikatin wa-law aʿjabatkum — wa-lā tunkiḥū l-mushrikīna ḥattā yuʾminū — wa-la-ʿabdun muʾminun khayrun min mushrikin wa-law aʿjabakum — ulāʾika yadʿūna ilā l-nār — wa-llāhu yadʿū ilā l-jannati wa-l-maghfirati bi-idhnih — wa-yubayyinu āyātihi li-l-nāsi laʿallahum yatadhakkarūn
  trad: N'épousez pas les femmes mushrikāt tant qu'elles n'ont pas cru — une servante croyante vaut mieux qu'une femme mushrika, même si celle-ci vous séduit. Et ne faites pas épouser les hommes mushrikīn tant qu'ils n'ont pas cru — un serviteur croyant vaut mieux qu'un homme mushrik, même s'il vous séduit. Ceux-là appellent vers le Feu, alors qu'Allaah appelle vers la janna et la maghfira, par Sa permission — et Il explicite Ses āyāt aux gens, afin qu'ils se souviennent.
- ref: S.2:222
  ar: وَيَسْأَلُونَكَ عَنِ الْمَحِيضِ ۖ قُلْ هُوَ أَذًى فَاعْتَزِلُوا النِّسَاءَ فِي الْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اللَّهُ ۚ إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ
  trl: Wa-yasʾalūnaka ʿani l-maḥīḍ — qul huwa adhan fa-ʿtazilū l-nisāʾa fī l-maḥīḍ — wa-lā taqrabūhunna ḥattā yaṭhurn — fa-idhā taṭahharna fa-ʾtūhunna min ḥaythu amarakumu llāh — inna llāha yuḥibbu l-tawwābīna wa-yuḥibbu l-mutaṭahhirīn
  trad: 'Et ils t''interrogent sur le maḥīḍ. Dis : c''est une gêne — tenez-vous à l''écart des femmes durant le maḥīḍ, et ne les approchez pas tant qu''elles n''ont pas cessé le flux. Puis lorsqu''elles se sont purifiées, venez à elles par où Allaah vous l''a ordonné. Allaah aime ceux qui reviennent constamment, et Il aime ceux qui se purifient.'
- ref: S.2:223
  ar: نِسَاؤُكُمْ حَرْثٌ لَّكُمْ فَأْتُوا حَرْثَكُمْ أَنَّىٰ شِئْتُمْ ۖ وَقَدِّمُوا لِأَنفُسِكُمْ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّكُم مُّلَاقُوهُ ۗ وَبَشِّرِ الْمُؤْمِنِينَ
  trl: Nisāʾukum ḥarthun lakum fa-ʾtū ḥarthakum annā shiʾtum — wa-qaddimū li-anfusikum — wa-ttaqū llāha wa-ʿlamū annakum mulāqūh — wa-bashshiri l-muʾminīn
  trad: Vos femmes sont un ḥarth pour vous — venez donc à votre ḥarth comme vous le voulez, et avancez pour vous-mêmes. Constituez-vous une taqwā envers Allaah, et sachez que vous Le rencontrerez. Et annonce aux muʾminīn.
- ref: S.2:224
  ar: وَلَا تَجْعَلُوا اللَّهَ عُرْضَةً لِّأَيْمَانِكُمْ أَن تَبَرُّوا وَتَتَّقُوا وَتُصْلِحُوا بَيْنَ النَّاسِ ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Wa-lā tajʿalū llāha ʿurḍatan li-aymānikum an tabarrū wa-tattaqū wa-tuṣliḥū bayna l-nās — wa-llāhu Samīʿun ʿAlīm
  trad: Et ne faites pas d'Allaah un obstacle interposé à vos serments, pour vous dispenser de tenir votre birr, de vous constituer une taqwā, et de rectifier l'ordre entre les gens. Allaah est al-Samīʿ, al-ʿAlīm.
- ref: S.2:225
  ar: لَّا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا كَسَبَتْ قُلُوبُكُمْ ۗ وَاللَّهُ غَفُورٌ حَلِيمٌ
  trl: Lā yuʾākhidhukumu llāhu bi-l-laghwi fī aymānikum wa-lākin yuʾākhidhukum bi-mā kasabat qulūbukum — wa-llāhu Ghafūrun Ḥalīm
  trad: Allaah ne vous tient pas pour responsables du laghw dans vos serments, mais Il vous tient pour responsables de ce que vos cœurs ont acquis. Allaah est al-Ghafūr, al-Ḥalīm.
- ref: S.2:226
  ar: لِّلَّذِينَ يُؤْلُونَ مِن نِّسَائِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍ ۖ فَإِن فَاءُوا فَإِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ
  trl: Li-lladhīna yuʾlūna min nisāʾihim tarabbuṣu arbaʿati ashhur — fa-in fāʾū fa-inna llāha Ghafūrun Raḥīm
  trad: Pour ceux qui font le vœu de s'écarter de leurs femmes, une attente de quatre mois. S'ils reviennent sur leur vœu, alors Allaah est al-Ghafūr, al-Raḥīm.
- ref: S.2:227
  ar: وَإِنْ عَزَمُوا الطَّلَاقَ فَإِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ
  trl: Wa-in ʿazamū l-ṭalāqa fa-inna llāha Samīʿun ʿAlīm
  trad: Et s'ils résolvent fermement le ṭalāq, alors Allaah est al-Samīʿ, al-ʿAlīm.
- ref: S.2:228
  ar: وَالْمُطَلَّقَاتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَاثَةَ قُرُوءٍ ۚ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ اللَّهُ فِي أَرْحَامِهِنَّ إِن كُنَّ يُؤْمِنَّ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۚ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِي ذَٰلِكَ إِنْ أَرَادُوا إِصْلَاحًا ۚ وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ
  trl: Wa-l-muṭallaqātu yatarabbaṣna bi-anfusihinna thalāthata qurūʾ — wa-lā yaḥillu lahunna an yaktumna mā khalaqa llāhu fī arḥāmihinna in kunna yuʾminna bi-llāhi wa-l-yawmi l-ākhir — wa-buʿūlatuhunna aḥaqqu bi-raddihinna fī dhālika in arādū iṣlāḥā — wa-lahunna mithlu lladhī ʿalayhinna bi-l-maʿrūf — wa-li-l-rijāli ʿalayhinna darajah — wa-llāhu ʿAzīzun Ḥakīm
  trad: Les femmes répudiées observent une attente de trois qurūʾ — il ne leur est pas licite de dissimuler ce qu'Allaah a créé dans leurs matrices, si elles croient en Allaah et au Jour dernier. Leurs époux ont, dans cet intervalle, un droit plus fondé à les reprendre s'ils veulent rectifier l'ordre. Elles ont un droit égal à leur devoir, selon ce que la raison droite reconnaît comme juste — les hommes ayant sur elles un degré. Allaah est al-ʿAzīz, al-Ḥakīm.
- ref: S.2:229
  ar: الطَّلَاقُ مَرَّتَانِ ۖ فَإِمْسَاكٌ بِمَعْرُوفٍ أَوْ تَسْرِيحٌ بِإِحْسَانٍ ۗ وَلَا يَحِلُّ لَكُمْ أَن تَأْخُذُوا مِمَّا آتَيْتُمُوهُنَّ شَيْئًا إِلَّا أَن يَخَافَا أَلَّا يُقِيمَا حُدُودَ اللَّهِ ۖ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ اللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا افْتَدَتْ بِهِ ۗ تِلْكَ حُدُودُ اللَّهِ فَلَا تَعْتَدُوهَا ۚ وَمَن يَتَعَدَّ حُدُودَ اللَّهِ فَأُولَٰئِكَ هُمُ الظَّالِمُونَ
  trl: Al-ṭalāqu marratān — fa-imsākun bi-maʿrūfin aw tasrīḥun bi-iḥsān — wa-lā yaḥillu lakum an taʾkhudhū mimmā ātaytumūhunna shayʾan illā an yakhāfā allā yuqīmā ḥudūda llāh — fa-in khiftum allā yuqīmā ḥudūda llāhi fa-lā junāḥa ʿalayhimā fīmā ftadat bih — tilka ḥudūdu llāhi fa-lā taʿtadūhā — wa-man yataʿadda ḥudūda llāhi fa-ulāʾika humu l-ẓālimūn
  trad: Le ṭalāq se répète deux fois — puis c'est retenue selon ce que la raison droite reconnaît comme juste, ou libération accomplie avec iḥsān. Il ne vous est pas licite de reprendre quoi que ce soit de ce que vous leur avez donné, sauf si tous deux craignent de ne pas tenir les limites d'Allaah. Et si vous craignez qu'ils ne tiennent pas les limites d'Allaah, nulle faute sur eux dans ce dont elle se rachète. Voilà les limites d'Allaah — ne les transgressez pas. Et quiconque transgresse les limites d'Allaah, ceux-là sont les ẓālimūn.
- ref: S.2:230
  ar: فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُ مِن بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُ ۗ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَا أَن يَتَرَاجَعَا إِن ظَنَّا أَن يُقِيمَا حُدُودَ اللَّهِ ۗ وَتِلْكَ حُدُودُ اللَّهِ يُبَيِّنُهَا لِقَوْمٍ يَعْلَمُونَ
  trl: Fa-in ṭallaqahā fa-lā taḥillu lahu min baʿdu ḥattā tankiḥa zawjan ghayrah — fa-in ṭallaqahā fa-lā junāḥa ʿalayhimā an yatarājaʿā in ẓannā an yuqīmā ḥudūda llāh — wa-tilka ḥudūdu llāhi yubayyinuhā li-qawmin yaʿlamūn
  trad: S'il la répudie une troisième fois, elle ne lui est plus licite ensuite, jusqu'à ce qu'elle épouse un autre époux qu'elle. Si celui-ci la répudie à son tour, nulle faute sur eux deux à se reprendre mutuellement, s'ils estiment tenir les limites d'Allaah. Voilà les limites d'Allaah — Il les explicite pour un peuple qui sait.
- ref: S.2:231
  ar: وَإِذَا طَلَّقْتُمُ النِّسَاءَ فَبَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ سَرِّحُوهُنَّ بِمَعْرُوفٍ ۚ وَلَا تُمْسِكُوهُنَّ ضِرَارًا لِّتَعْتَدُوا ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَقَدْ ظَلَمَ نَفْسَهُ ۚ وَلَا تَتَّخِذُوا آيَاتِ اللَّهِ هُزُوًا ۚ وَاذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ وَمَا أَنزَلَ عَلَيْكُم مِّنَ الْكِتَابِ وَالْحِكْمَةِ يَعِظُكُم بِهِ ۚ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Wa-idhā ṭallaqtumu l-nisāʾa fa-balaghna ajalahunna fa-amsikūhunna bi-maʿrūfin aw sarriḥūhunna bi-maʿrūf — wa-lā tumsikūhunna ḍirāran li-taʿtadū — wa-man yafʿal dhālika fa-qad ẓalama nafsah — wa-lā tattakhidhū āyāti llāhi huzuwā — wa-dhkurū niʿmata llāhi ʿalaykum wa-mā anzala ʿalaykum mina l-kitābi wa-l-ḥikmati yaʿiẓukum bih — wa-ttaqū llāha wa-ʿlamū anna llāha bi-kulli shayʾin ʿalīm
  trad: Et quand vous répudiez les femmes et qu'elles atteignent leur terme, retenez-les selon le maʿrūf ou libérez-les selon le maʿrūf. Ne les retenez pas pour leur nuire, en transgression — quiconque agit ainsi place son âme hors de sa juste place. Ne prenez pas les āyāt d'Allaah en dérision. Convoquez le bienfait d'Allaah sur vous, et ce qu'Il a fait descendre sur vous de Kitāb et de ḥikma, par quoi Il vous exhorte. Constituez-vous une taqwā envers Allaah, et sachez qu'Allaah est connaissant de toute chose.
- ref: S.2:232
  ar: وَإِذَا طَلَّقْتُمُ النِّسَاءَ فَبَلَغْنَ أَجَلَهُنَّ فَلَا تَعْضُلُوهُنَّ أَن يَنكِحْنَ أَزْوَاجَهُنَّ إِذَا تَرَاضَوْا بَيْنَهُم بِالْمَعْرُوفِ ۗ ذَٰلِكَ يُوعَظُ بِهِ مَن كَانَ مِنكُمْ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۗ ذَٰلِكُمْ أَزْكَىٰ لَكُمْ وَأَطْهَرُ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ
  trl: Wa-idhā ṭallaqtumu l-nisāʾa fa-balaghna ajalahunna fa-lā taʿḍulūhunna an yankiḥna azwājahunna idhā tarāḍaw baynahum bi-l-maʿrūf — dhālika yūʿaẓu bihi man kāna minkum yuʾminu bi-llāhi wa-l-yawmi l-ākhir — dhālikum azkā lakum wa-aṭhar — wa-llāhu yaʿlamu wa-antum lā taʿlamūn
  trad: Et quand vous répudiez les femmes et qu'elles atteignent leur terme, ne leur faites pas obstacle à épouser leurs [anciens] époux, dès lors qu'ils s'accordent mutuellement selon le maʿrūf. Voilà ce par quoi est exhorté quiconque parmi vous croit en Allaah et au Jour dernier — c'est plus pur et plus intègre pour vous. Allaah sait, alors que vous ne savez pas.
- ref: S.2:233
  ar: وَالْوَالِدَاتُ يُرْضِعْنَ أَوْلَادَهُنَّ حَوْلَيْنِ كَامِلَيْنِ ۖ لِمَنْ أَرَادَ أَن يُتِمَّ الرَّضَاعَةَ ۚ وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ ۚ لَا تُكَلَّفُ نَفْسٌ إِلَّا وُسْعَهَا ۚ لَا تُضَارَّ وَالِدَةٌ بِوَلَدِهَا وَلَا مَوْلُودٌ لَّهُ بِوَلَدِهِ ۚ وَعَلَى الْوَارِثِ مِثْلُ ذَٰلِكَ ۗ فَإِنْ أَرَادَا فِصَالًا عَن تَرَاضٍ مِّنْهُمَا وَتَشَاوُرٍ فَلَا جُنَاحَ عَلَيْهِمَا ۗ وَإِنْ أَرَدتُّمْ أَن تَسْتَرْضِعُوا أَوْلَادَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُم مَّا آتَيْتُم بِالْمَعْرُوفِ ۗ وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ
  trl: Wa-l-wālidātu yurḍiʿna awlādahunna ḥawlayni kāmilayn — li-man arāda an yutimma l-raḍāʿah — wa-ʿalā l-mawlūdi lahu rizquhunna wa-kiswatuhunna bi-l-maʿrūf — lā tukallafu nafsun illā wusʿahā — lā tuḍārra wālidatun bi-waladihā wa-lā mawlūdun lahu bi-waladih — wa-ʿalā l-wārithi mithlu dhālik — fa-in arādā fiṣālan ʿan tarāḍin minhumā wa-tashāwurin fa-lā junāḥa ʿalayhimā — wa-in aradtum an tastarḍiʿū awlādakum fa-lā junāḥa ʿalaykum idhā sallamtum mā ātaytum bi-l-maʿrūf — wa-ttaqū llāha wa-ʿlamū anna llāha bi-mā taʿmalūna baṣīr
  trad: Les mères allaitent leurs enfants deux années pleines, pour qui veut mener l'allaitement à son terme. Et il incombe à celui à qui l'enfant est né leur subsistance et leur habillement selon le maʿrūf. Nulle âme n'est chargée au-delà de sa capacité. Qu'aucune mère ne soit lésée à cause de son enfant, ni celui à qui l'enfant est né à cause du sien. Et sur l'héritier incombe de même. S'ils veulent tous deux un sevrage par accord mutuel et consultation, nulle faute sur eux. Et si vous voulez faire allaiter vos enfants par une nourrice, nulle faute sur vous si vous remettez ce que vous deviez selon le maʿrūf. Constituez-vous une taqwā envers Allaah, et sachez qu'Allaah est voyant de ce que vous faites.
- ref: S.2:234
  ar: وَالَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَاجًا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍ وَعَشْرًا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِي أَنفُسِهِنَّ بِالْمَعْرُوفِ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ
  trl: Wa-lladhīna yutawaffawna minkum wa-yadharūna azwājan yatarabbaṣna bi-anfusihinna arbaʿata ashhurin wa-ʿashrā — fa-idhā balaghna ajalahunna fa-lā junāḥa ʿalaykum fīmā faʿalna fī anfusihinna bi-l-maʿrūf — wa-llāhu bi-mā taʿmalūna khabīr
  trad: Et ceux d'entre vous qui sont rappelés à leur terme et laissent des épouses — celles-ci observent une attente de quatre mois et dix jours. Puis lorsqu'elles atteignent leur terme, nulle faute sur vous en ce qu'elles font pour elles-mêmes selon le maʿrūf. Allaah est informé de ce que vous faites.
- ref: S.2:235
  ar: وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِ مِنْ خِطْبَةِ النِّسَاءِ أَوْ أَكْنَنتُمْ فِي أَنفُسِكُمْ ۚ عَلِمَ اللَّهُ أَنَّكُمْ سَتَذْكُرُونَهُنَّ وَلَٰكِن لَّا تُوَاعِدُوهُنَّ سِرًّا إِلَّا أَن تَقُولُوا قَوْلًا مَّعْرُوفًا ۚ وَلَا تَعْزِمُوا عُقْدَةَ النِّكَاحِ حَتَّىٰ يَبْلُغَ الْكِتَابُ أَجَلَهُ ۚ وَاعْلَمُوا أَنَّ اللَّهَ يَعْلَمُ مَا فِي أَنفُسِكُمْ فَاحْذَرُوهُ ۚ وَاعْلَمُوا أَنَّ اللَّهَ غَفُورٌ حَلِيمٌ
  trl: Wa-lā junāḥa ʿalaykum fīmā ʿarraḍtum bihi min khiṭbati l-nisāʾi aw aknantum fī anfusikum — ʿalima llāhu annakum sa-tadhkurūnahunna wa-lākin lā tuwāʿidūhunna sirran illā an taqūlū qawlan maʿrūfā — wa-lā taʿzimū ʿuqdata l-nikāḥi ḥattā yablugha l-kitābu ajalah — wa-ʿlamū anna llāha yaʿlamu mā fī anfusikum fa-ḥdharūh — wa-ʿlamū anna llāha Ghafūrun Ḥalīm
  trad: Nulle faute sur vous dans ce que vous suggérez indirectement comme demande en mariage, ou ce que vous tenez caché en vous-mêmes. Allaah sait que vous allez vous souvenir d'elles — mais ne leur promettez rien en secret, sinon de tenir un propos que la raison droite reconnaît comme juste. Et ne résolvez pas le nœud du mariage avant que le terme prescrit n'atteigne son échéance. Sachez qu'Allaah connaît ce qu'il y a en vous-mêmes — prémunissez-vous-en. Et sachez qu'Allaah est al-Ghafūr, al-Ḥalīm.
- ref: S.2:236
  ar: لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ النِّسَاءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا لَهُنَّ فَرِيضَةً ۚ وَمَتِّعُوهُنَّ عَلَى الْمُوسِعِ قَدَرُهُ وَعَلَى الْمُقْتِرِ قَدَرُهُ مَتَاعًا بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُحْسِنِينَ
  trl: Lā junāḥa ʿalaykum in ṭallaqtumu l-nisāʾa mā lam tamassūhunna aw tafriḍū lahunna farīḍah — wa-mattiʿūhunna ʿalā l-mūsiʿi qadaruhu wa-ʿalā l-muqtiri qadaruhu matāʿan bi-l-maʿrūf — ḥaqqan ʿalā l-muḥsinīn
  trad: Nulle faute sur vous si vous répudiez les femmes avant de les avoir touchées ou de leur avoir fixé une farīḍa. Mais accordez-leur un don — à l'aisé selon sa mesure, à celui aux moyens resserrés selon sa mesure — un don selon le maʿrūf, un dû pour les muḥsinīn.
- ref: S.2:237
  ar: وَإِن طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةً فَنِصْفُ مَا فَرَضْتُمْ إِلَّا أَن يَعْفُونَ أَوْ يَعْفُوَ الَّذِي بِيَدِهِ عُقْدَةُ النِّكَاحِ ۚ وَأَن تَعْفُوا أَقْرَبُ لِلتَّقْوَىٰ ۚ وَلَا تَنسَوُا الْفَضْلَ بَيْنَكُمْ ۚ إِنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ
  trl: Wa-in ṭallaqtumūhunna min qabli an tamassūhunna wa-qad faraḍtum lahunna farīḍatan fa-niṣfu mā faraḍtum illā an yaʿfūna aw yaʿfuwa lladhī bi-yadihi ʿuqdatu l-nikāḥ — wa-an taʿfū aqrabu li-l-taqwā — wa-lā tansawu l-faḍla baynakum — inna llāha bi-mā taʿmalūna baṣīr
  trad: Et si vous les répudiez avant de les avoir touchées, alors que vous leur aviez fixé une farīḍa, la moitié de ce que vous avez fixé — sauf si elles y renoncent, ou si celui entre les mains de qui est le nœud du mariage y renonce. Et que vous renonciez est plus proche de la taqwā. N'oubliez pas le faḍl entre vous. Allaah est voyant de ce que vous faites.
- ref: S.2:238
  ar: حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ
  trl: Ḥāfiẓū ʿalā l-ṣalawāti wa-l-ṣalāti l-wusṭā wa-qūmū li-llāhi qānitīn
  trad: Gardez avec constance les ṣalawāt, et la ṣalāt médiane, et tenez-vous devant Allaah dans la qunūt.
- ref: S.2:239
  ar: فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًا ۖ فَإِذَا أَمِنتُمْ فَاذْكُرُوا اللَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُوا تَعْلَمُونَ
  trl: Fa-in khiftum fa-rijālan aw rukbānā — fa-idhā amintum fa-dhkurū llāha kamā ʿallamakum mā lam takūnū taʿlamūn
  trad: Et si vous craignez, alors debout ou en chevauchant — puis lorsque vous êtes en sécurité, convoquez Allaah comme Il vous a enseigné ce que vous ne saviez pas.
- ref: S.2:240
  ar: وَالَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَاجًا وَصِيَّةً لِّأَزْوَاجِهِم مَّتَاعًا إِلَى الْحَوْلِ غَيْرَ إِخْرَاجٍ ۚ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِي مَا فَعَلْنَ فِي أَنفُسِهِنَّ مِن مَّعْرُوفٍ ۗ وَاللَّهُ عَزِيزٌ حَكِيمٌ
  trl: Wa-lladhīna yutawaffawna minkum wa-yadharūna azwājan waṣiyyatan li-azwājihim matāʿan ilā l-ḥawli ghayra ikhrāj — fa-in kharajna fa-lā junāḥa ʿalaykum fī mā faʿalna fī anfusihinna min maʿrūf — wa-llāhu ʿAzīzun Ḥakīm
  trad: 'Et ceux d''entre vous qui sont rappelés à leur terme et laissent des épouses — une waṣiyya en faveur de leurs épouses : un don jusqu''à l''année pleine, sans les faire sortir. Si elles sortent d''elles-mêmes, nulle faute sur vous en ce qu''elles font pour elles-mêmes selon le maʿrūf. Allaah est al-ʿAzīz, al-Ḥakīm.'
- ref: S.2:241
  ar: وَلِلْمُطَلَّقَاتِ مَتَاعٌ بِالْمَعْرُوفِ ۖ حَقًّا عَلَى الْمُتَّقِينَ
  trl: Wa-li-l-muṭallaqāti matāʿun bi-l-maʿrūf — ḥaqqan ʿalā l-muttaqīn
  trad: Et pour les femmes répudiées, un don selon le maʿrūf — un dû pour les muttaqīn.
- ref: S.2:242
  ar: كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَعْقِلُونَ
  trl: Ka-dhālika yubayyinu llāhu lakum āyātihi laʿallakum taʿqilūn
  trad: Ainsi Allaah vous explicite Ses āyāt, afin que vous exerciez votre ʿaql.
- ref: S.2:243
  ar: أَلَمْ تَرَ إِلَى الَّذِينَ خَرَجُوا مِن دِيَارِهِمْ وَهُمْ أُلُوفٌ حَذَرَ الْمَوْتِ فَقَالَ لَهُمُ اللَّهُ مُوتُوا ثُمَّ أَحْيَاهُمْ ۚ إِنَّ اللَّهَ لَذُو فَضْلٍ عَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَشْكُرُونَ
  trl: A-lam tara ilā lladhīna kharajū min diyārihim wa-hum ulūfun ḥadhara l-mawti fa-qāla lahumu llāhu mūtū thumma aḥyāhum — inna llāha la-dhū faḍlin ʿalā l-nāsi wa-lākinna akthara l-nāsi lā yashkurūn
  trad: 'N''as-tu pas considéré ceux qui sont sortis de leurs demeures — ils étaient des milliers — par crainte de la mort ? Allaah leur dit : « Mourez » — puis Il les a fait revivre. Allaah est certes pourvu de faḍl envers les gens, mais la plupart des gens ne reconnaissent pas le bienfait.'
- ref: S.2:244
  ar: وَقَاتِلُوا فِي سَبِيلِ اللَّهِ وَاعْلَمُوا أَنَّ اللَّهَ سَمِيعٌ عَلِيمٌ
  trl: Wa-qātilū fī sabīli llāhi wa-ʿlamū anna llāha Samīʿun ʿAlīm
  trad: Combattez sur la voie d'Allaah, et sachez qu'Allaah est al-Samīʿ, al-ʿAlīm.
- ref: S.2:245
  ar: مَّن ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً ۚ وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ
  trl: Man dhā lladhī yuqriḍu llāha qarḍan ḥasanan fa-yuḍāʿifahu lahu aḍʿāfan kathīrah — wa-llāhu yaqbiḍu wa-yabsuṭu wa-ilayhi turjaʿūn
  trad: Qui est celui qui fait à Allaah un prêt bon, qu'Il lui multiplie en maints multiples ? Allaah resserre et déploie, et c'est vers Lui que vous ferez retour.
- ref: S.2:246
  ar: أَلَمْ تَرَ إِلَى الْمَلَإِ مِن بَنِي إِسْرَائِيلَ مِن بَعْدِ مُوسَىٰ إِذْ قَالُوا لِنَبِيٍّ لَّهُمُ ابْعَثْ لَنَا مَلِكًا نُّقَاتِلْ فِي سَبِيلِ اللَّهِ ۖ قَالَ هَلْ عَسَيْتُمْ إِن كُتِبَ عَلَيْكُمُ الْقِتَالُ أَلَّا تُقَاتِلُوا ۖ قَالُوا وَمَا لَنَا أَلَّا نُقَاتِلَ فِي سَبِيلِ اللَّهِ وَقَدْ أُخْرِجْنَا مِن دِيَارِنَا وَأَبْنَائِنَا ۖ فَلَمَّا كُتِبَ عَلَيْهِمُ الْقِتَالُ تَوَلَّوْا إِلَّا قَلِيلًا مِّنْهُمْ ۗ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ
  trl: A-lam tara ilā l-malaʾi min banī isrāʾīla min baʿdi mūsā idh qālū li-nabiyyin lahumu bʿath lanā malikan nuqātil fī sabīli llāh — qāla hal ʿasaytum in kutiba ʿalaykumu l-qitālu allā tuqātilū — qālū wa-mā lanā allā nuqātila fī sabīli llāhi wa-qad ukhrijnā min diyārinā wa-abnāʾinā — fa-lammā kutiba ʿalayhimu l-qitālu tawallaw illā qalīlan minhum — wa-llāhu ʿalīmun bi-l-ẓālimīn
  trad: 'N''as-tu pas considéré les notables des Banī Isrāʾīl, après Mūsā, quand ils dirent à un nabī qui était le leur : « Suscite-nous un roi, nous combattrons sur la voie d''Allaah » ? Il dit : « Se pourrait-il, si le qitāl vous est prescrit, que vous ne combattiez pas ? » Ils dirent : « Et pourquoi ne combattrions-nous pas sur la voie d''Allaah, alors que nous avons été expulsés de nos demeures et séparés de nos enfants ? » Puis, quand le qitāl leur fut prescrit, ils se détournèrent, sauf un petit nombre d''entre eux. Allaah est connaissant des ẓālimīn.'
- ref: S.2:247
  ar: وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ اللَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكًا ۚ قَالُوا أَنَّىٰ يَكُونُ لَهُ الْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِالْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةً مِّنَ الْمَالِ ۚ قَالَ إِنَّ اللَّهَ اصْطَفَاهُ عَلَيْكُمْ وَزَادَهُ بَسْطَةً فِي الْعِلْمِ وَالْجِسْمِ ۖ وَاللَّهُ يُؤْتِي مُلْكَهُ مَن يَشَاءُ ۚ وَاللَّهُ وَاسِعٌ عَلِيمٌ
  trl: Wa-qāla lahum nabiyyuhum inna llāha qad baʿatha lakum ṭālūta malikā — qālū annā yakūnu lahu l-mulku ʿalaynā wa-naḥnu aḥaqqu bi-l-mulki minhu wa-lam yuʾta saʿatan mina l-māl — qāla inna llāha ṣṭafāhu ʿalaykum wa-zādahu basṭatan fī l-ʿilmi wa-l-jism — wa-llāhu yuʾtī mulkahu man yashāʾ — wa-llāhu Wāsiʿun ʿAlīm
  trad: 'Et leur nabī leur dit : « Allaah a suscité pour vous Ṭālūt comme roi. » Ils dirent : « Comment aurait-il la royauté sur nous, alors que nous sommes plus fondés qu''lui à la royauté, et qu''il ne lui a pas été donné d''ampleur dans les biens ? » Il dit : « Allaah l''a élu sur vous, et Il lui a accru un surcroît dans le savoir et la constitution. Allaah donne Sa royauté à qui Il veut. Allaah est al-Wāsiʿ, al-ʿAlīm. »'
- ref: S.2:248
  ar: وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ آيَةَ مُلْكِهِ أَن يَأْتِيَكُمُ التَّابُوتُ فِيهِ سَكِينَةٌ مِّن رَّبِّكُمْ وَبَقِيَّةٌ مِّمَّا تَرَكَ آلُ مُوسَىٰ وَآلُ هَارُونَ تَحْمِلُهُ الْمَلَائِكَةُ ۚ إِنَّ فِي ذَٰلِكَ لَآيَةً لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ
  trl: Wa-qāla lahum nabiyyuhum inna āyata mulkihi an yaʾtiyakumu l-tābūtu fīhi sakīnatun min rabbikum wa-baqiyyatun mimmā taraka ālu mūsā wa-ālu hārūna taḥmiluhu l-malāʾikah — inna fī dhālika la-āyatan lakum in kuntum muʾminīn
  trad: 'Et leur nabī leur dit : « Le signe de sa royauté est que le tābūt vous viendra, contenant une sakīna venue de votre Rabb, et un reste de ce qu''ont laissé la famille de Mūsā et la famille de Hārūn, porté par les malāʾika. En cela il y a certes un signe pour vous, si vous êtes croyants. »'
- ref: S.2:249
  ar: فَلَمَّا فَصَلَ طَالُوتُ بِالْجُنُودِ قَالَ إِنَّ اللَّهَ مُبْتَلِيكُم بِنَهَرٍ فَمَن شَرِبَ مِنْهُ فَلَيْسَ مِنِّي وَمَن لَّمْ يَطْعَمْهُ فَإِنَّهُ مِنِّي إِلَّا مَنِ اغْتَرَفَ غُرْفَةً بِيَدِهِ ۚ فَشَرِبُوا مِنْهُ إِلَّا قَلِيلًا مِّنْهُمْ ۚ فَلَمَّا جَاوَزَهُ هُوَ وَالَّذِينَ آمَنُوا مَعَهُ قَالُوا لَا طَاقَةَ لَنَا الْيَوْمَ بِجَالُوتَ وَجُنُودِهِ ۚ قَالَ الَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَاقُو اللَّهِ كَم مِّن فِئَةٍ قَلِيلَةٍ غَلَبَتْ فِئَةً كَثِيرَةً بِإِذْنِ اللَّهِ ۗ وَاللَّهُ مَعَ الصَّابِرِينَ
  trl: Fa-lammā faṣala ṭālūtu bi-l-junūdi qāla inna llāha mubtalīkum bi-naharin fa-man shariba minhu fa-laysa minnī wa-man lam yaṭʿamhu fa-innahu minnī illā mani ghtarafa ghurfatan bi-yadih — fa-sharibū minhu illā qalīlan minhum — fa-lammā jāwazahu huwa wa-lladhīna āmanū maʿahu qālū lā ṭāqata lana l-yawma bi-jālūta wa-junūdih — qāla lladhīna yaẓunnūna annahum mulāqū llāhi kam min fiʾatin qalīlatin ghalabat fiʾatan kathīratan bi-idhni llāh — wa-llāhu maʿa l-ṣābirīn
  trad: 'Et lorsque Ṭālūt se sépara avec les troupes, il dit : « Allaah va vous éprouver par une rivière. Quiconque en boit n''est pas des miens ; quiconque n''y goûte pas est des miens — sauf celui qui en puise une poignée de sa main. » Ils en burent, sauf un petit nombre d''entre eux. Puis, lorsqu''ils l''eurent franchie, lui et ceux qui avaient cru avec lui, ils dirent : « Nulle capacité n''est nôtre aujourd''hui face à Jālūt et ses troupes. » Ceux qui pensaient avec certitude qu''ils rencontreraient Allaah dirent : « Que de fois une petite fiʾa l''a emporté sur une grande fiʾa, par la permission d''Allaah ! » Allaah est avec les ṣābirīn.'
- ref: S.2:250
  ar: وَلَمَّا بَرَزُوا لِجَالُوتَ وَجُنُودِهِ قَالُوا رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ
  trl: Wa-lammā barazū li-jālūta wa-junūdihi qālū rabbanā afrigh ʿalaynā ṣabran wa-thabbit aqdāmanā wa-nṣurnā ʿalā l-qawmi l-kāfirīn
  trad: 'Et lorsqu''ils se présentèrent à découvert face à Jālūt et ses troupes, ils dirent : « Notre Rabb, déverse sur nous du ṣabr, affermis nos pas, et secours-nous contre le peuple kāfir. »'
- ref: S.2:251
  ar: فَهَزَمُوهُم بِإِذْنِ اللَّهِ وَقَتَلَ دَاوُودُ جَالُوتَ وَآتَاهُ اللَّهُ الْمُلْكَ وَالْحِكْمَةَ وَعَلَّمَهُ مِمَّا يَشَاءُ ۗ وَلَوْلَا دَفْعُ اللَّهِ النَّاسَ بَعْضَهُم بِبَعْضٍ لَّفَسَدَتِ الْأَرْضُ وَلَٰكِنَّ اللَّهَ ذُو فَضْلٍ عَلَى الْعَالَمِينَ
  trl: Fa-hazamūhum bi-idhni llāhi wa-qatala dāwūdu jālūta wa-ātāhu llāhu l-mulka wa-l-ḥikmata wa-ʿallamahu mimmā yashāʾ — wa-lawlā dafʿu llāhi l-nāsa baʿḍahum bi-baʿḍin la-fasadati l-arḍu wa-lākinna llāha dhū faḍlin ʿalā l-ʿālamīn
  trad: Ils les mirent en déroute par la permission d'Allaah, et Dāwūd tua Jālūt. Allaah lui donna la royauté et la ḥikma, et lui enseigna de ce qu'Il voulut. Et si Allaah ne repoussait pas les gens les uns par les autres, la terre se serait dérèglée — mais Allaah est pourvu de faḍl envers les mondes.
- ref: S.2:252
  ar: تِلْكَ آيَاتُ اللَّهِ نَتْلُوهَا عَلَيْكَ بِالْحَقِّ ۚ وَإِنَّكَ لَمِنَ الْمُرْسَلِينَ
  trl: Tilka āyātu llāhi natlūhā ʿalayka bi-l-ḥaqq — wa-innaka la-mina l-mursalīn
  trad: Voilà les āyāt d'Allaah — Nous te les récitons porteuses du ḥaqq. Et tu es certes parmi les mursalūn.
- ref: S.2:253
  ar: تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۘ مِّنْهُم مَّن كَلَّمَ اللَّهُ ۖ وَرَفَعَ بَعْضَهُمْ دَرَجَاتٍ ۚ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ ۗ وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلَ الَّذِينَ مِن بَعْدِهِم مِّن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَاتُ وَلَٰكِنِ اخْتَلَفُوا فَمِنْهُم مَّنْ آمَنَ وَمِنْهُم مَّن كَفَرَ ۚ وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلُوا وَلَٰكِنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ
  trl: Tilka l-rusulu faḍḍalnā baʿḍahum ʿalā baʿḍ — minhum man kallama llāh — wa-rafaʿa baʿḍahum darajāt — wa-ātaynā ʿīsā bna maryama l-bayyināti wa-ayyadnāhu bi-rūḥi l-qudus — wa-law shāʾa llāhu mā qtatala lladhīna min baʿdihim min baʿdi mā jāʾathumu l-bayyinātu wa-lākini khtalafū fa-minhum man āmana wa-minhum man kafar — wa-law shāʾa llāhu mā qtatalū wa-lākinna llāha yafʿalu mā yurīd
  trad: 'Ces rusul, Nous en avons favorisé certains sur d''autres. Parmi eux, il en est à qui Allaah a adressé la parole ; et Il en a élevé d''autres en degrés. Nous avons donné à ʿĪsā fils de Maryam les bayyināt, et Nous l''avons appuyé par rūḥ al-qudus. Et si Allaah avait voulu, ceux venus après eux ne se seraient pas combattus entre eux après que les bayyināt leur furent venues — mais ils divergèrent : parmi eux, il en est qui crurent, et parmi eux, il en est qui furent kāfirūn. Et si Allaah avait voulu, ils ne se seraient pas combattus — mais Allaah fait ce qu''Il veut.'
- ref: S.2:254
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا أَنفِقُوا مِمَّا رَزَقْنَاكُم مِّن قَبْلِ أَن يَأْتِيَ يَوْمٌ لَّا بَيْعٌ فِيهِ وَلَا خُلَّةٌ وَلَا شَفَاعَةٌ ۗ وَالْكَافِرُونَ هُمُ الظَّالِمُونَ
  trl: Yā ayyuhā lladhīna āmanū anfiqū mimmā razaqnākum min qabli an yaʾtiya yawmun lā bayʿun fīhi wa-lā khullatun wa-lā shafāʿah — wa-l-kāfirūna humu l-ẓālimūn
  trad: Ô vous qui avez cru, dépensez de ce que Nous vous avons octroyé, avant que ne vienne un jour où il n'y a ni négoce, ni lien d'amitié, ni shafāʿa. Et les kāfirūn sont eux les ẓālimūn.
- ref: S.2:255
  ar: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ
  trl: Allāhu lā ilāha illā huwa l-Ḥayyu l-Qayyūm — lā taʾkhudhuhu sinatun wa-lā nawm — lahu mā fī l-samāwāti wa-mā fī l-arḍ — man dhā lladhī yashfaʿu ʿindahu illā bi-idhnih — yaʿlamu mā bayna aydīhim wa-mā khalfahum — wa-lā yuḥīṭūna bi-shayʾin min ʿilmihi illā bi-mā shāʾ — wasiʿa kursiyyuhu l-samāwāti wa-l-arḍ — wa-lā yaʾūduhu ḥifẓuhumā — wa-huwa l-ʿAliyyu l-ʿAẓīm
  trad: Allaah — nul ilāh que Lui, al-Ḥayy, al-Qayyūm. Ni somnolence ni sommeil ne Le saisissent. À Lui ce qui est dans les cieux et ce qui est sur la terre. Qui est celui qui intercède auprès de Lui, sinon par Sa permission ? Il connaît ce qui est devant eux et ce qui est derrière eux. Et ils n'embrassent rien de Sa connaissance, sinon ce qu'Il a voulu. Son kursī s'étend sur les cieux et la terre, et leur préservation ne Lui pèse pas. Et Il est al-ʿAliyy, al-ʿAẓīm.
- ref: S.2:256
  ar: لَا إِكْرَاهَ فِي الدِّينِ ۖ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ۚ فَمَن يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِن بِاللَّهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ لَا انفِصَامَ لَهَا ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ
  trl: Lā ikrāha fī l-dīn — qad tabayyana l-rushdu mina l-ghayy — fa-man yakfur bi-l-ṭāghūti wa-yuʾmin bi-llāhi fa-qadi stamsaka bi-l-ʿurwati l-wuthqā lā nfiṣāma lahā — wa-llāhu Samīʿun ʿAlīm
  trad: Nulle contrainte en dīn. Le rushd s'est distingué de l'égarement. Quiconque renie le ṭāghūt et croit en Allaah s'est saisi de la anse la plus sûre, celle qui ne se rompt pas. Allaah est al-Samīʿ, al-ʿAlīm.
- ref: S.2:257
  ar: اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا يُخْرِجُهُم مِّنَ الظُّلُمَاتِ إِلَى النُّورِ ۖ وَالَّذِينَ كَفَرُوا أَوْلِيَاؤُهُمُ الطَّاغُوتُ يُخْرِجُونَهُم مِّنَ النُّورِ إِلَى الظُّلُمَاتِ ۗ أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Allāhu Walīyu lladhīna āmanū yukhrijuhum mina l-ẓulumāti ilā l-nūr — wa-lladhīna kafarū awliyāʾuhumu l-ṭāghūtu yukhrijūnahum mina l-nūri ilā l-ẓulumāt — ulāʾika aṣḥābu l-nār — hum fīhā khālidūn
  trad: Allaah est al-Walī de ceux qui ont cru — Il les fait sortir des ẓulumāt vers le nūr. Et ceux qui sont kāfirūn, leurs awliyāʾ sont le ṭāghūt — ils les font sortir du nūr vers les ẓulumāt. Ceux-là sont les compagnons du Feu, ils y demeurent fixement.
- ref: S.2:258
  ar: أَلَمْ تَرَ إِلَى الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ إِذْ قَالَ إِبْرَاهِيمُ رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ قَالَ أَنَا أُحْيِي وَأُمِيتُ ۖ قَالَ إِبْرَاهِيمُ فَإِنَّ اللَّهَ يَأْتِي بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ فَبُهِتَ الَّذِي كَفَرَ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ
  trl: A-lam tara ilā lladhī ḥājja ibrāhīma fī rabbihi an ātāhu llāhu l-mulka idh qāla ibrāhīmu rabbiya lladhī yuḥyī wa-yumīt — qāla anā uḥyī wa-umīt — qāla ibrāhīmu fa-inna llāha yaʾtī bi-l-shamsi mina l-mashriqi fa-ʾti bihā mina l-maghrib — fa-buhita lladhī kafar — wa-llāhu lā yahdī l-qawma l-ẓālimīn
  trad: 'N''as-tu pas considéré celui qui disputa avec Ibrāhīm au sujet de son Rabb, parce qu''Allaah lui avait donné la royauté ? Quand Ibrāhīm dit : « Mon Rabb est Ce qui donne la vie et donne la mort » — il dit : « Moi je donne la vie et je donne la mort. » Ibrāhīm dit : « Allaah fait venir le soleil de l''orient, fais-le donc venir de l''occident. » Alors celui qui était kāfir fut réduit au silence. Et Allaah ne guide pas le peuple des ẓālimīn.'
- ref: S.2:259
  ar: أَوْ كَالَّذِي مَرَّ عَلَىٰ قَرْيَةٍ وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْيِي هَٰذِهِ اللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ اللَّهُ مِائَةَ عَامٍ ثُمَّ بَعَثَهُ ۖ قَالَ كَمْ لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍ ۖ قَالَ بَل لَّبِثْتَ مِائَةَ عَامٍ فَانظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَانظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ آيَةً لِّلنَّاسِ ۖ وَانظُرْ إِلَى الْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًا ۚ فَلَمَّا تَبَيَّنَ لَهُ قَالَ أَعْلَمُ أَنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Aw ka-lladhī marra ʿalā qaryatin wa-hiya khāwiyatun ʿalā ʿurūshihā qāla annā yuḥyī hādhihi llāhu baʿda mawtihā — fa-amātahu llāhu miʾata ʿāmin thumma baʿathah — qāla kam labith — qāla labithtu yawman aw baʿḍa yawm — qāla bal labithta miʾata ʿāmin fa-nẓur ilā ṭaʿāmika wa-sharābika lam yatasannah — wa-nẓur ilā ḥimārika wa-li-najʿalaka āyatan li-l-nās — wa-nẓur ilā l-ʿiẓāmi kayfa nunshizuhā thumma naksūhā laḥmā — fa-lammā tabayyana lahu qāla aʿlamu anna llāha ʿalā kulli shayʾin qadīr
  trad: 'Ou tel celui qui passa par une cité, alors qu''elle était vide, effondrée sur ses charpentes. Il dit : « Comment Allaah va-t-il faire revivre celle-ci, après sa mort ? » Alors Allaah le fit mourir cent années, puis le fit revenir. Il dit : « Combien de temps es-tu resté ? » — il dit : « Je suis resté un jour, ou une partie d''un jour. » Il dit : « Non — tu es resté cent années. Regarde ta nourriture et ta boisson, elles n''ont pas été altérées par le temps ; et regarde ton âne — afin que Nous fassions de toi un signe pour les gens — et regarde les ossements, comment Nous les redressons, puis Nous les revêtons de chair. » Puis, lorsque cela lui fut devenu manifeste, il dit : « Je sais qu''Allaah est, sur toute chose, qadīr. »'
- ref: S.2:260
  ar: وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ أَرِنِي كَيْفَ تُحْيِي الْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِي ۖ قَالَ فَخُذْ أَرْبَعَةً مِّنَ الطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ اجْعَلْ عَلَىٰ كُلِّ جَبَلٍ مِّنْهُنَّ جُزْءًا ثُمَّ ادْعُهُنَّ يَأْتِينَكَ سَعْيًا ۚ وَاعْلَمْ أَنَّ اللَّهَ عَزِيزٌ حَكِيمٌ
  trl: Wa-idh qāla ibrāhīmu rabbi arinī kayfa tuḥyī l-mawtā — qāla a-wa-lam tuʾmin — qāla balā wa-lākin li-yaṭmaʾinna qalbī — qāla fa-khudh arbaʿatan mina l-ṭayri fa-ṣurhunna ilayka thumma jʿal ʿalā kulli jabalin minhunna juzʾan thumma dʿuhunna yaʾtīnaka saʿyā — wa-ʿlam anna llāha ʿAzīzun Ḥakīm
  trad: 'Et quand Ibrāhīm dit : « Mon Rabb, montre-moi comment Tu fais revivre les morts » — Il dit : « N''as-tu donc pas cru ? » — il dit : « Si — mais pour que mon cœur trouve son assise. » Il dit : « Prends quatre oiseaux, apprivoise-les vers toi, puis place sur chaque montagne une part d''entre eux, puis appelle-les — ils te viendront avec empressement. Et sache qu''Allaah est al-ʿAzīz, al-Ḥakīm. »'
- ref: S.2:261
  ar: مَّثَلُ الَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنبُلَةٍ مِّائَةُ حَبَّةٍ ۗ وَاللَّهُ يُضَاعِفُ لِمَن يَشَاءُ ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ
  trl: Mathalu lladhīna yunfiqūna amwālahum fī sabīli llāhi ka-mathali ḥabbatin anbatat sabʿa sanābila fī kulli sunbulatin miʾatu ḥabbah — wa-llāhu yuḍāʿifu li-man yashāʾ — wa-llāhu Wāsiʿun ʿAlīm
  trad: L'exemple de ceux qui dépensent leurs biens sur la voie d'Allaah est celui d'un grain qui fait pousser sept épis, chaque épi portant cent grains. Allaah multiplie pour qui Il veut. Allaah est al-Wāsiʿ, al-ʿAlīm.
- ref: S.2:262
  ar: الَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ ثُمَّ لَا يُتْبِعُونَ مَا أَنفَقُوا مَنًّا وَلَا أَذًى ۙ لَّهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: Alladhīna yunfiqūna amwālahum fī sabīli llāhi thumma lā yutbiʿūna mā anfaqū mannan wa-lā adhā — lahum ajruhum ʿinda rabbihim wa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: Ceux qui dépensent leurs biens sur la voie d'Allaah, puis ne font suivre leur dépense ni de mann ni de tort — pour eux leur ajr auprès de leur Rabb, nulle crainte sur eux et ils ne seront pas affligés.
- ref: S.2:263
  ar: قَوْلٌ مَّعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِّن صَدَقَةٍ يَتْبَعُهَا أَذًى ۗ وَاللَّهُ غَنِيٌّ حَلِيمٌ
  trl: Qawlun maʿrūfun wa-maghfiratun khayrun min ṣadaqatin yatbaʿuhā adhā — wa-llāhu Ghaniyyun Ḥalīm
  trad: Une parole que la raison droite reconnaît comme juste, et un pardon, valent mieux qu'une ṣadaqa suivie d'un tort. Allaah est al-Ghanī, al-Ḥalīm.
- ref: S.2:264
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُبْطِلُوا صَدَقَاتِكُم بِالْمَنِّ وَالْأَذَىٰ كَالَّذِي يُنفِقُ مَالَهُ رِئَاءَ النَّاسِ وَلَا يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۖ فَمَثَلُهُ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٌ فَأَصَابَهُ وَابِلٌ فَتَرَكَهُ صَلْدًا ۖ لَّا يَقْدِرُونَ عَلَىٰ شَيْءٍ مِّمَّا كَسَبُوا ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْكَافِرِينَ
  trl: Yā ayyuhā lladhīna āmanū lā tubṭilū ṣadaqātikum bi-l-manni wa-l-adhā ka-lladhī yunfiqu mālahu riʾāʾa l-nāsi wa-lā yuʾminu bi-llāhi wa-l-yawmi l-ākhir — fa-mathaluhu ka-mathali ṣafwānin ʿalayhi turābun fa-aṣābahu wābilun fa-tarakahu ṣaldā — lā yaqdirūna ʿalā shayʾin mimmā kasabū — wa-llāhu lā yahdī l-qawma l-kāfirīn
  trad: 'Ô vous qui avez cru, n''annulez pas vos ṣadaqāt par le mann et le tort, comme celui qui dépense son bien par ostentation devant les gens sans croire en Allaah et au Jour dernier. Son exemple est celui d''un roc lisse recouvert de poussière : une pluie battante l''atteint et le laisse nu. Ils ne peuvent rien de ce qu''ils ont acquis. Allaah ne guide pas le peuple kāfir.'
- ref: S.2:265
  ar: وَمَثَلُ الَّذِينَ يُنفِقُونَ أَمْوَالَهُمُ ابْتِغَاءَ مَرْضَاتِ اللَّهِ وَتَثْبِيتًا مِّنْ أَنفُسِهِمْ كَمَثَلِ جَنَّةٍ بِرَبْوَةٍ أَصَابَهَا وَابِلٌ فَآتَتْ أُكُلَهَا ضِعْفَيْنِ فَإِن لَّمْ يُصِبْهَا وَابِلٌ فَطَلٌّ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ
  trl: Wa-mathalu lladhīna yunfiqūna amwālahumu btighāʾa marḍāti llāhi wa-tathbītan min anfusihim ka-mathali jannatin bi-rabwatin aṣābahā wābilun fa-ātat ukulahā ḍiʿfayni fa-in lam yuṣibhā wābilun fa-ṭall — wa-llāhu bi-mā taʿmalūna baṣīr
  trad: 'Et l''exemple de ceux qui dépensent leurs biens en quête de l''agrément d''Allaah, et par affermissement venu d''eux-mêmes, est celui d''un jardin sur une hauteur : une pluie battante l''atteint, et il donne son fruit doublé ; et si une pluie battante ne l''atteint pas, une pluie fine suffit. Allaah est voyant de ce que vous faites.'
- ref: S.2:266
  ar: أَيَوَدُّ أَحَدُكُمْ أَن تَكُونَ لَهُ جَنَّةٌ مِّن نَّخِيلٍ وَأَعْنَابٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ لَهُ فِيهَا مِن كُلِّ الثَّمَرَاتِ وَأَصَابَهُ الْكِبَرُ وَلَهُ ذُرِّيَّةٌ ضُعَفَاءُ فَأَصَابَهَا إِعْصَارٌ فِيهِ نَارٌ فَاحْتَرَقَتْ ۗ كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمُ الْآيَاتِ لَعَلَّكُمْ تَتَفَكَّرُونَ
  trl: A-yawaddu aḥadukum an takūna lahu jannatun min nakhīlin wa-aʿnābin tajrī min taḥtihā l-anhāru lahu fīhā min kulli l-thamarāti wa-aṣābahu l-kibaru wa-lahu dhurriyyatun ḍuʿafāʾu fa-aṣābahā iʿṣārun fīhi nārun fa-ḥtaraqat — ka-dhālika yubayyinu llāhu lakumu l-āyāti laʿallakum tatafakkarūn
  trad: L'un de vous aimerait-il avoir un jardin de palmiers et de vignes, sous lequel coulent les rivières, où il a de tout fruit — et que la vieillesse l'atteigne, alors qu'il a une descendance affaiblie, et qu'un tourbillon porteur de feu atteigne ce jardin et le consume ? Ainsi Allaah vous explicite les āyāt, afin que vous réfléchissiez.
- ref: S.2:267
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا أَنفِقُوا مِن طَيِّبَاتِ مَا كَسَبْتُمْ وَمِمَّا أَخْرَجْنَا لَكُم مِّنَ الْأَرْضِ ۖ وَلَا تَيَمَّمُوا الْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِآخِذِيهِ إِلَّا أَن تُغْمِضُوا فِيهِ ۚ وَاعْلَمُوا أَنَّ اللَّهَ غَنِيٌّ حَمِيدٌ
  trl: Yā ayyuhā lladhīna āmanū — anfiqū min ṭayyibāti mā kasabtum wa-mimmā akhrajnā lakum mina l-arḍ — wa-lā tayammamū l-khabītha minhu tunfiqūna wa-lastum bi-ākhidhīhi illā an tughmiḍū fīh — wa-ʿlamū anna llāha Ghaniyyun Ḥamīd
  trad: O vous qui croyez — dépensez de ce qu'il y a de bon (ṭayyib) dans ce que vous avez acquis, et de ce que Nous avons fait sortir pour vous de la terre — et ne visez pas délibérément ce qu'il y a de vicié (khabīth) pour le dépenser, alors que vous-mêmes ne l'accepteriez qu'en fermant les yeux dessus — et sachez qu'Allaah est Ghaniyy, Ḥamīd.
- ref: S.2:268
  ar: الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُم بِالْفَحْشَاءِ ۖ وَاللَّهُ يَعِدُكُم مَّغْفِرَةً مِّنْهُ وَفَضْلًا ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ
  trl: Al-shayṭānu yaʿidukumu l-faqra wa-yaʾmurukum bi-l-faḥshāʾ — wa-llāhu yaʿidukum maghfiratan minhu wa-faḍlan — wa-llāhu Wāsiʿun ʿAlīm
  trad: Le shayṭān vous promet la pauvreté et vous ordonne le faḥshāʾ — tandis qu'Allaah vous promet, de Sa part, maghfira et faḍl. Allaah est Wāsiʿ, ʿAlīm.
- ref: S.2:269
  ar: يُؤْتِي الْحِكْمَةَ مَن يَشَاءُ ۚ وَمَن يُؤْتَ الْحِكْمَةَ فَقَدْ أُوتِيَ خَيْرًا كَثِيرًا ۗ وَمَا يَذَّكَّرُ إِلَّا أُولُو الْأَلْبَابِ
  trl: Yuʾti l-ḥikmata man yashāʾ — wa-man yuʾta l-ḥikmata fa-qad ūtiya khayran kathīrā — wa-mā yadhdhakkaru illā ulū l-albāb
  trad: Il donne la ḥikma à qui Il veut. Et quiconque reçoit la ḥikma a certes reçu un bien abondant. Mais seuls s'en souviennent ceux qui possèdent l'ulū l-albāb.
- ref: S.2:270
  ar: وَمَا أَنفَقْتُم مِّن نَّفَقَةٍ أَوْ نَذَرْتُم مِّن نَّذْرٍ فَإِنَّ اللَّهَ يَعْلَمُهُ ۗ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ
  trl: Wa-mā anfaqtum min nafaqatin aw nadhartum min nadhrin fa-inna llāha yaʿlamuh — wa-mā li-l-ẓālimīna min anṣār
  trad: Et quelle que soit la dépense que vous dépensez, ou le nadhr que vous formulez, Allaah le sait. Et il n'y a pour les ẓālimūn aucun secoureur.
- ref: S.2:271
  ar: إِن تُبْدُوا الصَّدَقَاتِ فَنِعِمَّا هِيَ ۖ وَإِن تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَّكُمْ ۚ وَيُكَفِّرُ عَنكُم مِّن سَيِّئَاتِكُمْ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ
  trl: In tubdū l-ṣadaqāti fa-niʿimmā hiy — wa-in tukhfūhā wa-tuʾtūhā l-fuqarāʾa fa-huwa khayrun lakum — wa-yukaffiru ʿankum min sayyiʾātikum — wa-llāhu bi-mā taʿmalūna khabīr
  trad: Si vous rendez visibles les ṣadaqāt, combien c'est bon ! Et si vous les dissimulez et les donnez aux fuqarāʾ, c'est encore meilleur pour vous, et Il efface pour vous une partie de vos sayyiʾāt. Allaah, de ce que vous faites, est Khabīr.
- ref: S.2:272
  ar: لَّيْسَ عَلَيْكَ هُدَاهُمْ وَلَٰكِنَّ اللَّهَ يَهْدِي مَن يَشَاءُ ۗ وَمَا تُنفِقُوا مِنْ خَيْرٍ فَلِأَنفُسِكُمْ ۚ وَمَا تُنفِقُونَ إِلَّا ابْتِغَاءَ وَجْهِ اللَّهِ ۚ وَمَا تُنفِقُوا مِنْ خَيْرٍ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَ
  trl: Laysa ʿalayka hudāhum wa-lākinna llāha yahdī man yashāʾ — wa-mā tunfiqū min khayrin fa-li-anfusikum — wa-mā tunfiqūna illā btighāʾa wajhi llāh — wa-mā tunfiqū min khayrin yuwaffa ilaykum wa-antum lā tuẓlamūn
  trad: Leur hudā ne t'incombe pas — c'est Allaah qui guide qui Il veut. Et tout bien que vous dépensez est pour vous-mêmes ; et vous ne dépensez que dans la recherche du wajh d'Allaah. Et tout bien que vous dépensez vous sera restitué intégralement, et vous ne serez pas lésés.
- ref: S.2:273
  ar: لِلْفُقَرَاءِ الَّذِينَ أُحْصِرُوا فِي سَبِيلِ اللَّهِ لَا يَسْتَطِيعُونَ ضَرْبًا فِي الْأَرْضِ يَحْسَبُهُمُ الْجَاهِلُ أَغْنِيَاءَ مِنَ التَّعَفُّفِ تَعْرِفُهُم بِسِيمَاهُمْ لَا يَسْأَلُونَ النَّاسَ إِلْحَافًا ۗ وَمَا تُنفِقُوا مِنْ خَيْرٍ فَإِنَّ اللَّهَ بِهِ عَلِيمٌ
  trl: Li-l-fuqarāʾi lladhīna uḥṣirū fī sabīli llāhi lā yastaṭīʿūna ḍarban fī l-arḍ — yaḥsabuhumu l-jāhilu aghniyāʾa mina l-taʿaffuf — taʿrifuhum bi-sīmāhum — lā yasʾalūna l-nāsa ilḥāfā — wa-mā tunfiqū min khayrin fa-inna llāha bihi ʿalīm
  trad: Aux fuqarāʾ qui sont retenus sur la voie d'Allaah, sans pouvoir mener une activité sur la terre — le jāhil les croirait aghniyāʾ à cause de leur retenue (taʿaffuf) — tu les reconnais à leur sīmā — ils ne sollicitent pas les gens avec insistance. Et tout bien que vous dépensez, Allaah en est certes ʿAlīm.
- ref: S.2:274
  ar: الَّذِينَ يُنفِقُونَ أَمْوَالَهُم بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: Alladhīna yunfiqūna amwālahum bi-l-layli wa-l-nahāri sirran wa-ʿalāniyatan fa-lahum ajruhum ʿinda rabbihim wa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: Ceux qui dépensent leurs biens de nuit et de jour, en secret et publiquement, ont leur récompense auprès de leur Rabb ; nulle crainte sur eux, et ils n'auront pas à se désoler.
- ref: S.2:275
  ar: الَّذِينَ يَأْكُلُونَ الرِّبَا لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ الَّذِي يَتَخَبَّطُهُ الشَّيْطَانُ مِنَ الْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ قَالُوا إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَا ۗ وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا ۚ فَمَن جَاءَهُ مَوْعِظَةٌ مِّن رَّبِّهِ فَانتَهَىٰ فَلَهُ مَا سَلَفَ وَأَمْرُهُ إِلَى اللَّهِ ۖ وَمَنْ عَادَ فَأُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ
  trl: Alladhīna yaʾkulūna l-ribā lā yaqūmūna illā ka-mā yaqūmu lladhī yatakhabbaṭuhu l-shayṭānu mina l-mass — dhālika bi-annahum qālū innamā l-bayʿu mithlu l-ribā — wa-aḥalla llāhu l-bayʿa wa-ḥarrama l-ribā — fa-man jāʾahu mawʿiẓatun min rabbihi fa-ntahā fa-lahu mā salaf wa-amruhu ila llāh — wa-man ʿāda fa-ulāʾika aṣḥābu l-nār — hum fīhā khālidūn
  trad: 'Ceux qui dévorent le ribā ne se lèveront pas autrement que comme se lève celui que le shayṭān a abattu par son toucher — cela parce qu''ils ont dit : « Le commerce n''est que comme le ribā » — alors qu''Allaah a rendu licite le commerce et a interdit le ribā. Quiconque, une exhortation de son Rabb lui étant parvenue, cesse alors, gardera ce qui est passé, et son affaire revient à Allaah. Quiconque récidive — ceux-là sont les gens du feu, où ils demeurent.'
- ref: S.2:276
  ar: يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ ۗ وَاللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ
  trl: Yamḥaqu llāhu l-ribā wa-yurbi l-ṣadaqāt — wa-llāhu lā yuḥibbu kulla kaffārin athīm
  trad: Allaah efface le ribā et fait croître les ṣadaqāt. Allaah n'honore pas tout kaffār, chargé de faute.
- ref: S.2:277
  ar: إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ
  trl: Inna lladhīna āmanū wa-ʿamilū l-ṣāliḥāti wa-aqāmū l-ṣalāta wa-ātawu l-zakāta lahum ajruhum ʿinda rabbihim wa-lā khawfun ʿalayhim wa-lā hum yaḥzanūn
  trad: Ceux qui ont cru, ont œuvré dans les ṣāliḥāt, ont accompli la ṣalāt et donné la zakāt, ont leur récompense auprès de leur Rabb ; nulle crainte sur eux, et ils n'auront pas à se désoler.
- ref: S.2:278
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَذَرُوا مَا بَقِيَ مِنَ الرِّبَا إِن كُنتُم مُّؤْمِنِينَ
  trl: Yā ayyuhā lladhīna āmanū ttaqu llāha wa-dharū mā baqiya mina l-ribā in kuntum muʾminīn
  trad: O vous qui croyez — constituez-vous une taqwā d'Allaah et abandonnez ce qui vous reste du ribā, si vous êtes croyants.
- ref: S.2:279
  ar: فَإِن لَّمْ تَفْعَلُوا فَأْذَنُوا بِحَرْبٍ مِّنَ اللَّهِ وَرَسُولِهِ ۖ وَإِن تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَالِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ
  trl: Fa-in lam tafʿalū fa-ʾdhanū bi-ḥarbin mina llāhi wa-rasūlih — wa-in tubtum fa-lakum ruʾūsu amwālikum — lā taẓlimūna wa-lā tuẓlamūn
  trad: 'Si vous ne le faites pas, soyez avertis d''une guerre venant d''Allaah et de Son rasūl. Et si vous revenez, vos capitaux principaux vous appartiennent : vous ne lésez pas, et vous n''êtes pas lésés.'
- ref: S.2:280
  ar: وَإِن كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ ۚ وَأَن تَصَدَّقُوا خَيْرٌ لَّكُمْ ۖ إِن كُنتُمْ تَعْلَمُونَ
  trl: Wa-in kāna dhū ʿusratin fa-naẓiratun ilā maysarah — wa-an taṣaddaqū khayrun lakum — in kuntum taʿlamūn
  trad: Et si quelqu'un est dans l'aisance manquante (ʿusra), qu'il y ait attente jusqu'à l'aisance (maysara). Et que vous fassiez ṣadaqa est meilleur pour vous, si vous saviez.
- ref: S.2:281
  ar: وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ۖ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ
  trl: Wa-ttaqū yawman turjaʿūna fīhi ila llāh — thumma tuwaffā kullu nafsin mā kasabat wa-hum lā yuẓlamūn
  trad: Et constituez-vous une taqwā en vue d'un jour où vous serez ramenés vers Allaah — puis chaque nafs recevra intégralement ce qu'elle a acquis, et ils ne seront pas lésés.
- ref: S.2:282
  ar: يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰ أَجَلٍ مُّسَمًّى فَاكْتُبُوهُ ۚ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌ بِالْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ اللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ الَّذِي عَلَيْهِ الْحَقُّ وَلْيَتَّقِ اللَّهَ رَبَّهُ وَلَا يَبْخَسْ مِنْهُ شَيْئًا ۚ فَإِن كَانَ الَّذِي عَلَيْهِ الْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُ بِالْعَدْلِ ۚ وَاسْتَشْهِدُوا شَهِيدَيْنِ مِن رِّجَالِكُمْ ۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌ وَامْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ الشُّهَدَاءِ أَن تَضِلَّ إِحْدَاهُمَا فَتُذَكِّرَ إِحْدَاهُمَا الْأُخْرَىٰ ۚ وَلَا يَأْبَ الشُّهَدَاءُ إِذَا مَا دُعُوا ۚ وَلَا تَسْأَمُوا أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰ أَجَلِهِ ۚ ذَٰلِكُمْ أَقْسَطُ عِندَ اللَّهِ وَأَقْوَمُ لِلشَّهَادَةِ وَأَدْنَىٰ أَلَّا تَرْتَابُوا ۖ إِلَّا أَن تَكُونَ تِجَارَةً حَاضِرَةً تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوا إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَارَّ كَاتِبٌ وَلَا شَهِيدٌ ۚ وَإِن تَفْعَلُوا فَإِنَّهُ فُسُوقٌ بِكُمْ ۗ وَاتَّقُوا اللَّهَ ۖ وَيُعَلِّمُكُمُ اللَّهُ ۗ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ
  trl: Yā ayyuhā lladhīna āmanū idhā tadāyantum bi-daynin ilā ajalin musamman fa-ktubūh — wa-l-yaktub baynakum kātibun bi-l-ʿadl — wa-lā yaʾba kātibun an yaktuba ka-mā ʿallamahu llāh — fa-l-yaktub wa-l-yumlili lladhī ʿalayhi l-ḥaqqu wa-l-yattaqi llāha rabbahu wa-lā yabkhas minhu shayʾā — fa-in kāna lladhī ʿalayhi l-ḥaqqu safīhan aw ḍaʿīfan aw lā yastaṭīʿu an yumilla huwa fa-l-yumlil waliyyuhu bi-l-ʿadl — wa-stashhidū shahīdayni min rijālikum — fa-in lam yakūnā rajulayni fa-rajulun wa-mraʾatāni mimman tarḍawna mina l-shuhadāʾi an taḍilla iḥdāhumā fa-tudhakkira iḥdāhumā l-ukhrā — wa-lā yaʾba l-shuhadāʾu idhā mā duʿū — wa-lā tasʾamū an taktubūhu ṣaghīran aw kabīran ilā ajalih — dhālikum aqsaṭu ʿinda llāhi wa-aqwamu li-l-shahādati wa-adnā allā tartābū — illā an takūna tijāratan ḥāḍiratan tudīrūnahā baynakum fa-laysa ʿalaykum junāḥun allā taktubūhā — wa-ashhidū idhā tabāyaʿtum — wa-lā yuḍārra kātibun wa-lā shahīd — wa-in tafʿalū fa-innahu fusūqun bikum — wa-ttaqu llāh — wa-yuʿallimukumu llāh — wa-llāhu bi-kulli shayʾin ʿalīm
  trad: 'O vous qui croyez — lorsque vous contractez une dette entre vous pour un terme fixé, mettez-la par écrit. Qu''un scribe l''écrive entre vous avec justice (ʿadl) ; et qu''un scribe ne refuse pas d''écrire selon ce qu''Allaah lui a enseigné : qu''il écrive, et que dicte celui sur qui pèse la dette (al-ḥaqq), et qu''il se constitue une taqwā d''Allaah, son Rabb, et n''en diminue rien. Si celui sur qui pèse la dette est safīh (dépourvu de discernement), ou faible, ou incapable de dicter lui-même, que son walī dicte alors avec justice. Et faites témoigner deux témoins parmi vos hommes ; à défaut de deux hommes, un homme et deux femmes parmi ceux que vous agréez comme témoins, de sorte que si l''une des deux s''égare, l''autre la fasse se souvenir. Que les témoins ne refusent pas lorsqu''ils sont appelés. Et ne vous lassez pas d''écrire la dette, petite ou grande, jusqu''à son terme : cela est plus équitable auprès d''Allaah, plus droit pour le témoignage, et plus proche pour que vous ne doutiez pas — sauf s''il s''agit d''un commerce immédiat que vous faites circuler entre vous : il n''y a alors sur vous nul grief à ne pas l''écrire. Prenez des témoins lorsque vous concluez un échange entre vous. Que ni le scribe ni le témoin ne subissent de préjudice ; et si vous le faites, ce sera une transgression (fusūq) de votre part. Constituez-vous une taqwā d''Allaah — Allaah vous enseigne — et Allaah, de toute chose, est ʿAlīm.'
- ref: S.2:283
  ar: وَإِن كُنتُمْ عَلَىٰ سَفَرٍ وَلَمْ تَجِدُوا كَاتِبًا فَرِهَانٌ مَّقْبُوضَةٌ ۖ فَإِنْ أَمِنَ بَعْضُكُم بَعْضًا فَلْيُؤَدِّ الَّذِي اؤْتُمِنَ أَمَانَتَهُ وَلْيَتَّقِ اللَّهَ رَبَّهُ ۗ وَلَا تَكْتُمُوا الشَّهَادَةَ ۚ وَمَن يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ ۗ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌ
  trl: Wa-in kuntum ʿalā safarin wa-lam tajidū kātiban fa-rihānun maqbūḍah — fa-in amina baʿḍukum baʿḍan fa-l-yuʾaddi lladhi ʾtumina amānatahu wa-l-yattaqi llāha rabbah — wa-lā taktumu l-shahādah — wa-man yaktumhā fa-innahu āthimun qalbuh — wa-llāhu bi-mā taʿmalūna ʿalīm
  trad: 'Et si vous êtes en voyage et ne trouvez pas de scribe, un gage saisi (rihān maqbūḍa) suffit. Et si l''un de vous fait confiance à un autre, que celui à qui la confiance a été faite s''acquitte de son amāna, et qu''il se constitue une taqwā d''Allaah, son Rabb. Ne dissimulez pas le témoignage : quiconque le dissimule, son cœur est certes chargé de faute (āthim). Allaah, de ce que vous faites, est ʿAlīm.'
- ref: S.2:284
  ar: لِّلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ وَإِن تُبْدُوا مَا فِي أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ اللَّهُ ۖ فَيَغْفِرُ لِمَن يَشَاءُ وَيُعَذِّبُ مَن يَشَاءُ ۗ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ
  trl: Li-llāhi mā fi l-samāwāti wa-mā fi l-arḍ — wa-in tubdū mā fī anfusikum aw tukhfūhu yuḥāsibkum bihi llāh — fa-yaghfiru li-man yashāʾu wa-yuʿadhdhibu man yashāʾ — wa-llāhu ʿalā kulli shayʾin qadīr
  trad: A Allaah appartient ce qui est dans les cieux et ce qui est sur la terre. Que vous rendiez visible ce qui est en vous-mêmes ou que vous le dissimuliez, Allaah vous en demandera compte — Il pardonne à qui Il veut et châtie qui Il veut. Allaah, sur toute chose, est Qadīr.
- ref: S.2:285
  ar: آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ
  trl: Āmana l-rasūlu bi-mā unzila ilayhi min rabbihi wa-l-muʾminūn — kullun āmana bi-llāhi wa-malāʾikatihi wa-kutubihi wa-rusulih — lā nufarriqu bayna aḥadin min rusulih — wa-qālū samiʿnā wa-aṭaʿnā — ghufrānaka rabbanā wa-ilayka l-maṣīr
  trad: 'Le rasūl a cru en ce qui lui a été fait descendre de son Rabb, et les muʾminūn de même. Chacun a cru en Allaah, en Ses malāʾika, en Ses kutub et en Ses rusul — « Nous ne faisons de distinction entre aucun de Ses rusul » — et ils ont dit : « Nous avons entendu et nous avons obéi. Ton ghufrān, notre Rabb, et vers Toi est le devenir. »'
- ref: S.2:286
  ar: لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ
  trl: Lā yukallifu llāhu nafsan illā wusʿahā — lahā mā kasabat wa-ʿalayhā mā ktasabat — rabbanā lā tuʾākhidhnā in nasīnā aw akhṭaʾnā — rabbanā wa-lā taḥmil ʿalaynā iṣran ka-mā ḥamaltahu ʿala lladhīna min qablinā — rabbanā wa-lā tuḥammilnā mā lā ṭāqata lanā bih — wa-ʿfu ʿannā wa-ghfir lanā wa-rḥamnā — anta mawlānā fa-nṣurnā ʿala l-qawmi l-kāfirīn
  trad: Allaah n'impose à une nafs que ce qu'elle peut porter (wusʿ). A elle ce qu'elle a acquis (kasabat), et sur elle ce qu'elle s'est chargée d'acquérir (iktasabat). Notre Rabb, ne nous saisis pas si nous oublions ou si nous commettons une erreur. Notre Rabb, ne fais pas peser sur nous une charge lourde (iṣr) comme Tu l'as fait peser sur ceux d'avant nous. Notre Rabb, ne nous fais pas porter ce pour quoi nous n'avons pas de capacité (ṭāqa). Efface pour nous, pardonne-nous, fais-nous miséricorde (irḥamnā). Tu es notre mawlā — alors secours-nous contre le peuple kāfir.
