- ref: S.21:1
  ar: اقْتَرَبَ لِلنَّاسِ حِسَابُهُمْ وَهُمْ فِي غَفْلَةٍ مُعْرِضُونَ
  trl: Iqtaraba li-n-nāsi ḥisābuhum wa-hum fī ghaflatin muʿriḍūn
  trad: Le Compte (*ḥisāb*) des gens s'est approché (*iqtaraba*), tandis qu'ils demeurent dans l'insouciance (*ghafla*), s'en détournant.
- ref: S.21:2
  ar: مَا يَأْتِيهِمْ مِنْ ذِكْرٍ مِنْ رَبِّهِمْ مُحْدَثٍ إِلَّا اسْتَمَعُوهُ وَهُمْ يَلْعَبُونَ
  trl: Mā yaʾtīhim min dhikrin min rabbihim muḥdathin illā stamaʿūhu wa-hum yalʿabūn
  trad: Il ne leur vient aucun *dhikr*, nouvellement reçu (*muḥdath*) de leur Rabb, sans qu'ils ne l'écoutent en se jouant (*yalʿabūn*).
- ref: S.21:3
  ar: لَاهِيَةً قُلُوبُهُمْ ۗ وَأَسَرُّوا النَّجْوَى الَّذِينَ ظَلَمُوا هَلْ هَٰذَا إِلَّا بَشَرٌ مِثْلُكُمْ ۖ أَفَتَأْتُونَ السِّحْرَ وَأَنْتُمْ تُبْصِرُونَ
  trl: Lāhiyatan qulūbuhum — wa-asarrū n-najwā lladhīna ẓalamū hal hādhā illā basharun mithlukum — a-fa-taʾtūna s-siḥra wa-antum tubṣirūn
  trad: 'leurs cœurs distraits (*lāhiya*) — et ceux qui ont commis l''injustice (*ẓalamū*) tinrent secret leur conciliabule (*najwā*) : « Celui-ci n''est-il qu''un être humain (*bashar*) comme vous ? Alliez-vous donc à la magie (*siḥr*), alors que vous voyez clairement (*tubṣirūn*) ? »'
- ref: S.21:4
  ar: قَالَ رَبِّي يَعْلَمُ الْقَوْلَ فِي السَّمَاءِ وَالْأَرْضِ ۖ وَهُوَ السَّمِيعُ الْعَلِيمُ
  trl: Qāla rabbī yaʿlamu l-qawla fi s-samāʾi wa-l-arḍi wa-huwa s-Samīʿu l-ʿAlīm
  trad: 'Il dit : « Mon Rabb connaît la parole (*al-qawl*), dans le ciel comme sur la terre » — et Il est as-Samīʿ, al-ʿAlīm.'
- ref: S.21:5
  ar: بَلْ قَالُوا أَضْغَاثُ أَحْلَامٍ بَلِ افْتَرَاهُ بَلْ هُوَ شَاعِرٌ فَلْيَأْتِنَا بِآيَةٍ كَمَا أُرْسِلَ الْأَوَّلُونَ
  trl: Bal qālū aḍghāthu aḥlāmin bali ftarāhu bal huwa shāʿirun fa-l-yaʾtinā bi-āyatin kamā ursila l-awwalūn
  trad: 'Bien plus, ils dirent : « Ce sont des songes confus (*aḍghāthu aḥlām*) ! » — ou plutôt : « Il l''a inventé (*iftarāhu*) ! » — ou plutôt : « C''est un poète (*shāʿir*) ! Qu''il nous apporte donc un signe (*āya*), comme furent envoyés les premiers (*al-awwalūn*) ! »'
- ref: S.21:6
  ar: مَا آمَنَتْ قَبْلَهُمْ مِنْ قَرْيَةٍ أَهْلَكْنَاهَا ۖ أَفَهُمْ يُؤْمِنُونَ
  trl: Mā āmanat qablahum min qaryatin ahlaknāhā a-fa-hum yuʾminūn
  trad: Nulle cité que Nous avons anéantie n'a cru, avant eux — vont-ils donc croire, eux ?
- ref: S.21:7
  ar: وَمَا أَرْسَلْنَا قَبْلَكَ إِلَّا رِجَالًا نُوحِي إِلَيْهِمْ ۖ فَاسْأَلُوا أَهْلَ الذِّكْرِ إِنْ كُنْتُمْ لَا تَعْلَمُونَ
  trl: Wa-mā arsalnā qablaka illā rijālan nūḥī ilayhim fa-saʾalū ahla dh-dhikri in kuntum lā taʿlamūn
  trad: Et Nous n'avons envoyé, avant toi, que des hommes (*rijāl*) auxquels Nous faisions parvenir la révélation (*nūḥī*) — interrogez donc les gens du *dhikr* (*ahl adh-dhikr*), si vous ne savez pas.
- ref: S.21:8
  ar: وَمَا جَعَلْنَاهُمْ جَسَدًا لَا يَأْكُلُونَ الطَّعَامَ وَمَا كَانُوا خَالِدِينَ
  trl: Wa-mā jaʿalnāhum jasadan lā yaʾkulūna ṭ-ṭaʿāma wa-mā kānū khālidīn
  trad: Et Nous n'avons pas fait d'eux des corps (*jasad*) qui ne mangent pas de nourriture, et ils n'étaient pas immortels (*khālidīn*).
- ref: S.21:9
  ar: ثُمَّ صَدَقْنَاهُمُ الْوَعْدَ فَأَنْجَيْنَاهُمْ وَمَنْ نَشَاءُ وَأَهْلَكْنَا الْمُسْرِفِينَ
  trl: Thumma ṣadaqnāhumu l-waʿda fa-anjaynāhum wa-man nashāʾu wa-ahlaknā l-musrifīn
  trad: 'Puis Nous avons tenu véridique (*ṣadaqnāhumu*) la promesse (*al-waʿd*) : Nous les avons sauvés, eux et qui Nous avons voulu, et Nous avons anéanti ceux qui outrepassent la mesure (*al-musrifīn*).'
- ref: S.21:10
  ar: لَقَدْ أَنْزَلْنَا إِلَيْكُمْ كِتَابًا فِيهِ ذِكْرُكُمْ ۖ أَفَلَا تَعْقِلُونَ
  trl: Laqad anzalnā ilaykum kitāban fīhi dhikrukum a-fa-lā taʿqilūn
  trad: Nous avons certes fait descendre vers vous un Kitāb où se trouve votre *dhikr* — ne raisonnez-vous donc pas (*a-fa-lā taʿqilūn*) ?
- ref: S.21:11
  ar: وَكَمْ قَصَمْنَا مِنْ قَرْيَةٍ كَانَتْ ظَالِمَةً وَأَنْشَأْنَا بَعْدَهَا قَوْمًا آخَرِينَ
  trl: Wa-kam qaṣamnā min qaryatin kānat ẓālimatan wa-anshaʾnā baʿdahā qawman ākharīn
  trad: Et que de cités (*qarya*), injustes (*ẓālima*), Nous avons brisées (*qaṣamnā*) — et Nous avons fait naître après elles un autre peuple !
- ref: S.21:12
  ar: فَلَمَّا أَحَسُّوا بَأْسَنَا إِذَا هُمْ مِنْهَا يَرْكُضُونَ
  trl: Fa-lammā aḥassū baʾsanā idhā hum minhā yarkuḍūn
  trad: Puis, lorsqu'ils perçurent (*aḥassū*) Notre rigueur (*baʾsanā*), voilà qu'ils s'enfuyaient en courant (*yarkuḍūn*) loin d'elle.
- ref: S.21:13
  ar: لَا تَرْكُضُوا وَارْجِعُوا إِلَىٰ مَا أُتْرِفْتُمْ فِيهِ وَمَسَاكِنِكُمْ لَعَلَّكُمْ تُسْأَلُونَ
  trl: Lā tarkuḍū wa-rjiʿū ilā mā utriftum fīhi wa-masākinikum laʿallakum tusʾalūn
  trad: « Ne fuyez pas en courant, et revenez à l'aisance où vous étiez (*mā utriftum fīhi*), et à vos demeures — peut-être vous interrogera-t-on ! »
- ref: S.21:14
  ar: قَالُوا يَا وَيْلَنَا إِنَّا كُنَّا ظَالِمِينَ
  trl: Qālū yā waylanā innā kunnā ẓālimīn
  trad: 'Ils dirent : « Malheur à nous (*yā waylanā*) ! Nous avons certes été injustes ! »'
- ref: S.21:15
  ar: فَمَا زَالَتْ تِلْكَ دَعْوَاهُمْ حَتَّىٰ جَعَلْنَاهُمْ حَصِيدًا خَامِدِينَ
  trl: Fa-mā zālat tilka daʿwāhum ḥattā jaʿalnāhum ḥaṣīdan khāmidīn
  trad: Cet appel ne cessa de se répéter (*daʿwāhum*), jusqu'à ce que Nous les ayons rendus semblables à une moisson fauchée (*ḥaṣīd*), éteints (*khāmidīn*).
- ref: S.21:16
  ar: وَمَا خَلَقْنَا السَّمَاءَ وَالْأَرْضَ وَمَا بَيْنَهُمَا لَاعِبِينَ
  trl: Wa-mā khalaqnā s-samāʾa wa-l-arḍa wa-mā baynahumā lāʿibīn
  trad: Et Nous n'avons pas créé le ciel et la terre, et ce qui est entre eux, en jouant (*lāʿibīn*).
- ref: S.21:17
  ar: لَوْ أَرَدْنَا أَنْ نَتَّخِذَ لَهْوًا لَاتَّخَذْنَاهُ مِنْ لَدُنَّا إِنْ كُنَّا فَاعِلِينَ
  trl: Law aradnā an nattakhidha lahwan la-ttakhadhnāhu min ladunnā in kunnā fāʿilīn
  trad: Si Nous avions voulu prendre une distraction (*lahwan*), Nous l'aurions prise de par Nous-mêmes (*min ladunnā*) — si Nous l'avions fait.
- ref: S.21:18
  ar: بَلْ نَقْذِفُ بِالْحَقِّ عَلَى الْبَاطِلِ فَيَدْمَغُهُ فَإِذَا هُوَ زَاهِقٌ ۚ وَلَكُمُ الْوَيْلُ مِمَّا تَصِفُونَ
  trl: Bal naqdhifu bi-l-ḥaqqi ʿalā l-bāṭili fa-yadmaghuhu fa-idhā huwa zāhiqun wa-lakumu l-waylu mimmā taṣifūn
  trad: Bien plus, Nous lançons (*naqdhifu*) le *ḥaqq* contre le *bāṭil*, qui lui fracasse la tête (*fa-yadmaghuhu*), et le voilà anéanti (*zāhiq*) — malheur à vous pour ce que vous décrivez (*taṣifūn*) !
- ref: S.21:19
  ar: وَلَهُ مَنْ فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ وَمَنْ عِنْدَهُ لَا يَسْتَكْبِرُونَ عَنْ عِبَادَتِهِ وَلَا يَسْتَحْسِرُونَ
  trl: Wa-lahu man fi s-samāwāti wa-l-arḍi wa-man ʿindahu lā yastakbirūna ʿan ʿibādatihi wa-lā yastaḥsirūn
  trad: À Lui appartient quiconque est dans les cieux et sur la terre — et ceux qui sont auprès de Lui (*man ʿindahu*) ne s'enorgueillissent pas (*lā yastakbirūna*) de Son *ʿibāda*, et ne se lassent pas (*lā yastaḥsirūn*).
- ref: S.21:20
  ar: يُسَبِّحُونَ اللَّيْلَ وَالنَّهَارَ لَا يَفْتُرُونَ
  trl: Yusabbiḥūna l-layla wa-n-nahāra lā yafturūn
  trad: Ils glorifient (*yusabbiḥūna*) la nuit et le jour, sans fléchir (*lā yafturūn*).
- ref: S.21:21
  ar: أَمِ اتَّخَذُوا آلِهَةً مِنَ الْأَرْضِ هُمْ يُنْشِرُونَ
  trl: Ami ttakhadhū ālihatan mina l-arḍi hum yunshirūn
  trad: Ou bien ont-ils pris des dieux (*āliha*) de la terre, qui redonnent la vie (*yunshirūn*) ?
- ref: S.21:22
  ar: لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا ۚ فَسُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ
  trl: Law kāna fīhimā ālihatun illā llāhu la-fasadatā fa-subḥāna llāhi rabbi l-ʿarshi ʿammā yaṣifūn
  trad: S'il y avait, dans les deux [le ciel et la terre], des dieux autres qu'Allaah, tous deux seraient corrompus (*la-fasadatā*) — gloire donc à Allaah, Rabb du *ʿArsh*, au-delà de ce qu'ils décrivent !
- ref: S.21:23
  ar: لَا يُسْأَلُ عَمَّا يَفْعَلُ وَهُمْ يُسْأَلُونَ
  trl: Lā yusʾalu ʿammā yafʿalu wa-hum yusʾalūn
  trad: Il n'est pas interrogé (*lā yusʾalu*) sur ce qu'Il fait, alors qu'eux sont interrogés (*yusʾalūn*).
- ref: S.21:24
  ar: أَمِ اتَّخَذُوا مِنْ دُونِهِ آلِهَةً ۖ قُلْ هَاتُوا بُرْهَانَكُمْ ۖ هَٰذَا ذِكْرُ مَنْ مَعِيَ وَذِكْرُ مَنْ قَبْلِي ۗ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ الْحَقَّ ۖ فَهُمْ مُعْرِضُونَ
  trl: Ami ttakhadhū min dūnihi ālihatan qul hātū burhānakum hādhā dhikru man maʿiya wa-dhikru man qablī bal aktharuhum lā yaʿlamūna l-ḥaqqa fa-hum muʿriḍūn
  trad: 'Ou bien ont-ils pris, en dehors de Lui, des dieux ? Dis : « Apportez votre preuve (*hātū burhānakum*) ! » Ceci est le *dhikr* de qui est avec moi, et le *dhikr* de qui m''a précédé — mais la plupart d''entre eux ne connaissent pas le *ḥaqq*, et s''en détournent (*muʿriḍūn*).'
- ref: S.21:25
  ar: وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ مِنْ رَسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ
  trl: Wa-mā arsalnā min qablika min rasūlin illā nūḥī ilayhi annahu lā ilāha illā anā fa-ʿbudūni
  trad: 'Et Nous n''avons envoyé, avant toi, aucun *rasūl* sans lui révéler ceci : « Il n''y a nul *ilāh* que Moi — adorez-Moi donc (*fa-ʿbudūni*) ! »'
- ref: S.21:26
  ar: وَقَالُوا اتَّخَذَ الرَّحْمَٰنُ وَلَدًا ۗ سُبْحَانَهُ ۚ بَلْ عِبَادٌ مُكْرَمُونَ
  trl: Wa-qālū ttakhadha r-raḥmānu waladan subḥānahu bal ʿibādun mukramūn
  trad: 'Et ils dirent : « Ar-Raḥmān a pris un *walad* » — gloire à Lui (*subḥānahu*) ! Bien plutôt, ce sont des serviteurs honorés (*ʿibādun mukramūn*).'
- ref: S.21:27
  ar: لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُمْ بِأَمْرِهِ يَعْمَلُونَ
  trl: Lā yasbiqūnahu bi-l-qawli wa-hum bi-amrihi yaʿmalūn
  trad: Ils ne devancent pas Sa parole (*lā yasbiqūnahu bi-l-qawl*), et ils agissent selon Son ordre (*bi-amrihi yaʿmalūn*).
- ref: S.21:28
  ar: يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَىٰ وَهُمْ مِنْ خَشْيَتِهِ مُشْفِقُونَ
  trl: Yaʿlamu mā bayna aydīhim wa-mā khalfahum wa-lā yashfaʿūna illā li-mani rtaḍā wa-hum min khashyatihi mushfiqūn
  trad: Il connaît ce qui est devant eux et ce qui est derrière eux — et ils ne se joignent qu'à celui que Lui-même ne repousse pas (*illā li-mani rtaḍā*) — et ils sont, de Sa crainte (*khashyatihi*), pleins d'appréhension (*mushfiqūn*).
- ref: S.21:29
  ar: ۞ وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلَٰهٌ مِنْ دُونِهِ فَذَٰلِكَ نَجْزِيهِ جَهَنَّمَ ۚ كَذَٰلِكَ نَجْزِي الظَّالِمِينَ
  trl: Wa-man yaqul minhum innī ilāhun min dūnihi fa-dhālika najzīhi jahannama kadhālika najzi ẓ-ẓālimīn
  trad: 'Et quiconque d''entre eux dirait : « Je suis un *ilāh* en dehors de Lui » — celui-là, Nous le rétribuerions de Jahannam : c''est ainsi que Nous rétribuons les injustes (*aẓ-ẓālimīn*).'
- ref: S.21:30
  ar: أَوَلَمْ يَرَ الَّذِينَ كَفَرُوا أَنَّ السَّمَاوَاتِ وَالْأَرْضَ كَانَتَا رَتْقًا فَفَتَقْنَاهُمَا ۖ وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ ۖ أَفَلَا يُؤْمِنُونَ
  trl: Awalam yara lladhīna kafarū anna s-samāwāti wa-l-arḍa kānatā ratqan fa-fataqnāhumā — wa-jaʿalnā mina l-māʾi kulla shayʾin ḥayyin — a-fa-lā yuʾminūn
  trad: Ceux qui sont kāfirūn n'ont-ils donc pas vu que les cieux et la terre formaient une masse jointe et fermée (ratqan), et que Nous les avons disjoints (fataqnāhumā) ? Et Nous avons fait, à partir de l'eau, toute chose vivante — ne croiront-ils donc pas ?
- ref: S.21:31
  ar: وَجَعَلْنَا فِي الْأَرْضِ رَوَاسِيَ أَنْ تَمِيدَ بِهِمْ وَجَعَلْنَا فِيهَا فِجَاجًا سُبُلًا لَعَلَّهُمْ يَهْتَدُونَ
  trl: Wa-jaʿalnā fi l-arḍi rawāsiya an tamīda bihim wa-jaʿalnā fīhā fijājan subulan laʿallahum yahtadūn
  trad: Et Nous avons placé sur la terre des ancrages fermes (rawāsiya), afin qu'elle ne vacille pas avec eux (an tamīda bihim), et Nous y avons placé des passages, des chemins (fijājan subulan) — peut-être seront-ils guidés.
- ref: S.21:32
  ar: وَجَعَلْنَا السَّمَاءَ سَقْفًا مَحْفُوظًا ۖ وَهُمْ عَنْ آيَاتِهَا مُعْرِضُونَ
  trl: Wa-jaʿalnā s-samāʾa saqfan maḥfūẓan wa-hum ʿan āyātihā muʿriḍūn
  trad: Et Nous avons fait du ciel un toit protégé (saqfan maḥfūẓan) — et eux, de ses signes, se détournent (muʿriḍūn).
- ref: S.21:33
  ar: وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ ۖ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ
  trl: Wa-huwa lladhī khalaqa l-layla wa-n-nahāra wa-sh-shamsa wa-l-qamara kullun fī falakin yasbaḥūn
  trad: Et Ce qui a créé la nuit et le jour, le soleil et la lune — chacun vogue (yasbaḥūn) dans une orbite (falak).
- ref: S.21:34
  ar: وَمَا جَعَلْنَا لِبَشَرٍ مِنْ قَبْلِكَ الْخُلْدَ ۖ أَفَإِنْ مِتَّ فَهُمُ الْخَالِدُونَ
  trl: Wa-mā jaʿalnā li-basharin min qablika l-khulda a-fa-in mitta fa-humu l-khālidūn
  trad: Et Nous n'avons attribué l'immortalité (al-khuld) à aucun être humain (bashar) avant toi — si donc tu meurs, seront-ils, eux, immortels (al-khālidūn) ?
- ref: S.21:35
  ar: كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ۗ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً ۖ وَإِلَيْنَا تُرْجَعُونَ
  trl: Kullu nafsin dhāʾiqatu l-mawti — wa-nabluwkum bi-sh-sharri wa-l-khayri fitnatan — wa-ilaynā turjaʿūn
  trad: Toute âme goûte la mort — et Nous vous éprouvons (nabluwkum) par le mal et par le bien, comme épreuve (fitnatan) — et c'est vers Nous que vous serez ramenés.
- ref: S.21:36
  ar: وَإِذَا رَآكَ الَّذِينَ كَفَرُوا إِنْ يَتَّخِذُونَكَ إِلَّا هُزُوًا أَهَٰذَا الَّذِي يَذْكُرُ آلِهَتَكُمْ وَهُمْ بِذِكْرِ الرَّحْمَٰنِ هُمْ كَافِرُونَ
  trl: Wa-idhā raʾāka lladhīna kafarū in yattakhidhūnaka illā huzuwan a-hādhā lladhī yadhkuru ālihatakum wa-hum bi-dhikri r-raḥmāni hum kāfirūn
  trad: 'Et quand ceux qui sont kāfirūn te voient, ils ne te prennent qu''en dérision (huzuwan) : « Est-ce donc celui-ci qui évoque vos dieux (ālihatakum) ? » — alors qu''eux-mêmes, envers le rappel (dhikr) d''ar-Raḥmān, sont kāfirūn.'
- ref: S.21:37
  ar: خُلِقَ الْإِنْسَانُ مِنْ عَجَلٍ ۚ سَأُرِيكُمْ آيَاتِي فَلَا تَسْتَعْجِلُونِ
  trl: Khuliqa l-insānu min ʿajalin sa-urīkum āyātī fa-lā tastaʿjilūni
  trad: L'être humain (al-insān) a été créé d'empressement (ʿajal) — Je vous montrerai Mes signes ; ne Me demandez donc pas de hâter (lā tastaʿjilūni) !
- ref: S.21:38
  ar: وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ
  trl: Wa-yaqūlūna matā hādhā l-waʿdu in kuntum ṣādiqīn
  trad: 'Et ils disent : « À quand cette promesse (al-waʿd), si vous êtes véridiques ? »'
- ref: S.21:39
  ar: لَوْ يَعْلَمُ الَّذِينَ كَفَرُوا حِينَ لَا يَكُفُّونَ عَنْ وُجُوهِهِمُ النَّارَ وَلَا عَنْ ظُهُورِهِمْ وَلَا هُمْ يُنْصَرُونَ
  trl: Law yaʿlamu lladhīna kafarū ḥīna lā yakuffūna ʿan wujūhihimu n-nāra wa-lā ʿan ẓuhūrihim wa-lā hum yunṣarūn
  trad: Si seulement ceux qui sont kāfirūn savaient le moment où ils ne pourront écarter le Feu ni de leurs visages ni de leurs dos, et où ils ne seront pas secourus !
- ref: S.21:40
  ar: بَلْ تَأْتِيهِمْ بَغْتَةً فَتَبْهَتُهُمْ فَلَا يَسْتَطِيعُونَ رَدَّهَا وَلَا هُمْ يُنْظَرُونَ
  trl: Bal taʾtīhim baghtatan fa-tabhatuhum fa-lā yastaṭīʿūna raddahā wa-lā hum yunẓarūn
  trad: Bien plutôt, elle leur viendra à l'improviste (baghtatan) et les stupéfiera (fa-tabhatuhum) — ils ne pourront la repousser, et aucun délai ne leur sera accordé (lā hum yunẓarūn).
- ref: S.21:41
  ar: وَلَقَدِ اسْتُهْزِئَ بِرُسُلٍ مِنْ قَبْلِكَ فَحَاقَ بِالَّذِينَ سَخِرُوا مِنْهُمْ مَا كَانُوا بِهِ يَسْتَهْزِئُونَ
  trl: Wa-la-qadi stuhziʾa bi-rusulin min qablika fa-ḥāqa bi-lladhīna sakhirū minhum mā kānū bihi yastahziʾūn
  trad: Et certes, on s'est moqué (istuhziʾa) d'envoyés (rusul) avant toi — et ce dont ils se moquaient a fini par envelopper (ḥāqa) ceux d'entre eux qui raillaient (sakhirū).
- ref: S.21:42
  ar: قُلْ مَنْ يَكْلَؤُكُمْ بِاللَّيْلِ وَالنَّهَارِ مِنَ الرَّحْمَٰنِ ۗ بَلْ هُمْ عَنْ ذِكْرِ رَبِّهِمْ مُعْرِضُونَ
  trl: Qul man yakalaʾukum bi-l-layli wa-n-nahāri mina r-raḥmāni bal hum ʿan dhikri rabbihim muʿriḍūn
  trad: 'Dis : « Qui vous protège (yakalaʾukum), de nuit et de jour, contre ar-Raḥmān ? » — mais eux, du rappel de leur Rabb, se détournent (muʿriḍūn).'
- ref: S.21:43
  ar: أَمْ لَهُمْ آلِهَةٌ تَمْنَعُهُمْ مِنْ دُونِنَا ۚ لَا يَسْتَطِيعُونَ نَصْرَ أَنْفُسِهِمْ وَلَا هُمْ مِنَّا يُصْحَبُونَ
  trl: Am lahum ālihatun tamnaʿuhum min dūninā lā yastaṭīʿūna naṣra anfusihim wa-lā hum minnā yuṣḥabūn
  trad: Ou bien ont-ils des dieux (āliha) qui les protègent (tamnaʿuhum) en dehors de Nous ? Elles ne peuvent même pas se secourir elles-mêmes (naṣra anfusihim), et nul, parmi elles, ne trouve escorte (yuṣḥabūn) contre Nous.
- ref: S.21:44
  ar: بَلْ مَتَّعْنَا هَٰؤُلَاءِ وَآبَاءَهُمْ حَتَّىٰ طَالَ عَلَيْهِمُ الْعُمُرُ ۗ أَفَلَا يَرَوْنَ أَنَّا نَأْتِي الْأَرْضَ نَنْقُصُهَا مِنْ أَطْرَافِهَا ۚ أَفَهُمُ الْغَالِبُونَ
  trl: Bal mattaʿnā hāʾulāʾi wa-ābāʾahum ḥattā ṭāla ʿalayhimu l-ʿumuru — a-fa-lā yarawna annā naʾti l-arḍa nanquṣuhā min aṭrāfihā — a-fa-humu l-ghālibūn
  trad: Bien plutôt, Nous avons accordé une jouissance (mattaʿnā) à ceux-ci et à leurs pères, au point que la durée (al-ʿumur) s'est prolongée pour eux — ne voient-ils donc pas que Nous venons à la terre, la réduisant par ses extrémités (nanquṣuhā min aṭrāfihā) ? Sont-ce donc eux les vainqueurs (al-ghālibūn) ?
- ref: S.21:45
  ar: قُلْ إِنَّمَا أُنْذِرُكُمْ بِالْوَحْيِ ۚ وَلَا يَسْمَعُ الصُّمُّ الدُّعَاءَ إِذَا مَا يُنْذَرُونَ
  trl: Qul innamā undhirukum bi-l-waḥyi wa-lā yasmaʿu ṣ-ṣummu d-duʿāʾa idhā mā yundharūn
  trad: 'Dis : « Je ne vous avertis que par la waḥy » — mais les sourds (aṣ-ṣumm) n''entendent pas l''appel (ad-duʿāʾ), quand ils sont avertis.'
- ref: S.21:46
  ar: وَلَئِنْ مَسَّتْهُمْ نَفْحَةٌ مِنْ عَذَابِ رَبِّكَ لَيَقُولُنَّ يَا وَيْلَنَا إِنَّا كُنَّا ظَالِمِينَ
  trl: Wa-la-in massathum nafḥatun min ʿadhābi rabbika la-yaqūlunna yā waylanā innā kunnā ẓālimīn
  trad: 'Et si un souffle (nafḥa) seulement du châtiment de ton Rabb les atteint, ils diront assurément : « Malheur à nous (yā waylanā) ! Nous avons certes été injustes (ẓālimīn) ! »'
- ref: S.21:47
  ar: وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا ۖ وَإِنْ كَانَ مِثْقَالَ حَبَّةٍ مِنْ خَرْدَلٍ أَتَيْنَا بِهَا ۗ وَكَفَىٰ بِنَا حَاسِبِينَ
  trl: Wa-naḍaʿu l-mawāzīna l-qisṭa li-yawmi l-qiyāmati fa-lā tuẓlamu nafsun shayʾan — wa-in kāna mithqāla ḥabbatin min khardalin ataynā bihā — wa-kafā binā ḥāsibīn
  trad: Et Nous placerons les balances de l'exacte pesée (al-mawāzīn al-qisṭ) pour le Jour de la Résurrection — aucune âme ne sera lésée en rien (lā tuẓlamu nafsun shayʾan) ; et fût-ce le poids (mithqāl) d'un grain de moutarde (ḥabbatin min khardalin), Nous l'apporterions — et il Nous suffit comme comptables (ḥāsibīn).
- ref: S.21:48
  ar: وَلَقَدْ آتَيْنَا مُوسَىٰ وَهَارُونَ الْفُرْقَانَ وَضِيَاءً وَذِكْرًا لِلْمُتَّقِينَ
  trl: Wa-la-qad ātaynā mūsā wa-hārūna l-furqāna wa-ḍiyāʾan wa-dhikran li-l-muttaqīn
  trad: Et Nous avons certes donné à Mūsā et à Hārūn le Furqān (al-furqān), une clarté (ḍiyāʾ) et un rappel (dhikr) pour les muttaqīn —
- ref: S.21:49
  ar: الَّذِينَ يَخْشَوْنَ رَبَّهُمْ بِالْغَيْبِ وَهُمْ مِنَ السَّاعَةِ مُشْفِقُونَ
  trl: Alladhīna yakhshawna rabbahum bi-l-ghaybi wa-hum mina s-sāʿati mushfiqūn
  trad: ceux qui éprouvent la khashya envers leur Rabb dans le non-vu (bi-l-ghayb), et qui sont, de l'Heure, pleins d'appréhension (mushfiqūn).
- ref: S.21:50
  ar: وَهَٰذَا ذِكْرٌ مُبَارَكٌ أَنْزَلْنَاهُ ۚ أَفَأَنْتُمْ لَهُ مُنْكِرُونَ
  trl: Wa-hādhā dhikrun mubārakun anzalnāhu a-fa-antum lahu munkirūn
  trad: Et ceci est un rappel (dhikr) mubārak que Nous avons fait descendre — le renierez-vous donc (a-fa-antum lahu munkirūn) ?
- ref: S.21:51
  ar: ۞ وَلَقَدْ آتَيْنَا إِبْرَاهِيمَ رُشْدَهُ مِنْ قَبْلُ وَكُنَّا بِهِ عَالِمِينَ
  trl: Wa-la-qad ātaynā ibrāhīma rushdahu min qablu wa-kunnā bihi ʿālimīn
  trad: Et Nous avons certes donné à Ibrāhīm son *rushd* dès auparavant — et Nous étions, à son sujet, pleinement savants (*ʿālimīn*).
- ref: S.21:52
  ar: إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِ مَا هَٰذِهِ التَّمَاثِيلُ الَّتِي أَنْتُمْ لَهَا عَاكِفُونَ
  trl: Idh qāla li-abīhi wa-qawmihi mā hādhihi t-tamāthīlu llatī antum lahā ʿākifūn
  trad: 'Quand il dit à son père et à son peuple : « Que sont ces représentations (*tamāthīl*) auxquelles vous vous attachez avec constance (*ʿākifūn*) ? »'
- ref: S.21:53
  ar: قَالُوا وَجَدْنَا آبَاءَنَا لَهَا عَابِدِينَ
  trl: Qālū wajadnā ābāʾanā lahā ʿābidīn
  trad: 'Ils dirent : « Nous avons trouvé nos pères leur rendant un culte (*ʿābidīn*). »'
- ref: S.21:54
  ar: قَالَ لَقَدْ كُنْتُمْ أَنْتُمْ وَآبَاؤُكُمْ فِي ضَلَالٍ مُبِينٍ
  trl: Qāla la-qad kuntum antum wa-ābāʾukum fī ḍalālin mubīn
  trad: 'Il dit : « Vous avez certes été, vous et vos pères, dans un égarement manifeste (*ḍalālin mubīn*). »'
- ref: S.21:55
  ar: قَالُوا أَجِئْتَنَا بِالْحَقِّ أَمْ أَنْتَ مِنَ اللَّاعِبِينَ
  trl: Qālū a-jiʾtanā bi-l-ḥaqqi am anta mina l-lāʿibīn
  trad: 'Ils dirent : « Es-tu venu à nous avec le *ḥaqq*, ou es-tu de ceux qui jouent (*al-lāʿibīn*) ? »'
- ref: S.21:56
  ar: قَالَ بَلْ رَبُّكُمْ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ الَّذِي فَطَرَهُنَّ وَأَنَا عَلَىٰ ذَٰلِكُمْ مِنَ الشَّاهِدِينَ
  trl: Qāla bal rabbukum rabbu s-samāwāti wa-l-arḍi lladhī faṭarahunna wa-anā ʿalā dhālikum mina sh-shāhidīn
  trad: 'Il dit : « Bien plutôt, votre Rabb est le Rabb des cieux et de la terre, Ce qui les a fait exister (*faṭarahunna*) — et je suis, de cela, du nombre des témoins. »'
- ref: S.21:57
  ar: وَتَاللَّهِ لَأَكِيدَنَّ أَصْنَامَكُمْ بَعْدَ أَنْ تُوَلُّوا مُدْبِرِينَ
  trl: Wa-ta-llāhi la-akīdanna aṣnāmakum baʿda an tuwallū mudbirīn
  trad: Et, par Allaah (*ta-llāhi*), je ruserai certainement (*la-akīdanna*) contre vos idoles (*aṣnāmakum*), une fois que vous aurez tourné le dos (*tuwallū mudbirīn*) !
- ref: S.21:58
  ar: فَجَعَلَهُمْ جُذَاذًا إِلَّا كَبِيرًا لَهُمْ لَعَلَّهُمْ إِلَيْهِ يَرْجِعُونَ
  trl: Fa-jaʿalahum judhādhan illā kabīran lahum laʿallahum ilayhi yarjiʿūn
  trad: Il les mit alors en fragments (*judhādhan*), sauf la plus grande d'entre elles — peut-être reviendraient-ils vers elle [pour l'interroger].
- ref: S.21:59
  ar: قَالُوا مَنْ فَعَلَ هَٰذَا بِآلِهَتِنَا إِنَّهُ لَمِنَ الظَّالِمِينَ
  trl: Qālū man faʿala hādhā bi-ālihatinā innahu la-mina ẓ-ẓālimīn
  trad: 'Ils dirent : « Qui a fait cela à nos dieux (*ālihatinā*) ? Il est certes du nombre des *ẓālimūn*. »'
- ref: S.21:60
  ar: قَالُوا سَمِعْنَا فَتًى يَذْكُرُهُمْ يُقَالُ لَهُ إِبْرَاهِيمُ
  trl: Qālū samiʿnā fatan yadhkuruhum yuqālu lahu ibrāhīm
  trad: 'Ils dirent : « Nous avons entendu un jeune homme (*fatan*) les évoquer [en mal] ; on l''appelle Ibrāhīm. »'
- ref: S.21:61
  ar: قَالُوا فَأْتُوا بِهِ عَلَىٰ أَعْيُنِ النَّاسِ لَعَلَّهُمْ يَشْهَدُونَ
  trl: Qālū fa-ʾtū bihi ʿalā aʿyuni n-nāsi laʿallahum yashhadūn
  trad: 'Ils dirent : « Amenez-le donc sous les yeux (*aʿyun*) des gens — peut-être témoigneront-ils. »'
- ref: S.21:62
  ar: قَالُوا أَأَنْتَ فَعَلْتَ هَٰذَا بِآلِهَتِنَا يَا إِبْرَاهِيمُ
  trl: Qālū a-anta faʿalta hādhā bi-ālihatinā yā ibrāhīm
  trad: 'Ils dirent : « Est-ce toi qui as fait cela à nos dieux, ô Ibrāhīm ? »'
- ref: S.21:63
  ar: قَالَ بَلْ فَعَلَهُ كَبِيرُهُمْ هَٰذَا فَاسْأَلُوهُمْ إِنْ كَانُوا يَنْطِقُونَ
  trl: Qāla bal faʿalahu kabīruhum hādhā fa-saʾalūhum in kānū yanṭiqūn
  trad: 'Il dit : « C''est plutôt celle-ci, la plus grande d''entre elles, qui l''a fait — interrogez-les donc, si elles savent s''exprimer (*yanṭiqūn*) ! »'
- ref: S.21:64
  ar: فَرَجَعُوا إِلَىٰ أَنْفُسِهِمْ فَقَالُوا إِنَّكُمْ أَنْتُمُ الظَّالِمُونَ
  trl: Fa-rajaʿū ilā anfusihim fa-qālū innakum antumu ẓ-ẓālimūn
  trad: 'Ils se retournèrent alors sur eux-mêmes (*rajaʿū ilā anfusihim*) et dirent [entre eux] : « C''est vous, assurément, les *ẓālimūn*. »'
- ref: S.21:65
  ar: ثُمَّ نُكِسُوا عَلَىٰ رُءُوسِهِمْ لَقَدْ عَلِمْتَ مَا هَٰؤُلَاءِ يَنْطِقُونَ
  trl: Thumma nukisū ʿalā ruʾūsihim la-qad ʿalimta mā hāʾulāʾi yanṭiqūn
  trad: 'Puis ils furent retournés sur leurs têtes (*nukisū ʿalā ruʾūsihim*) : « Tu sais bien que celles-ci ne s''expriment pas ! »'
- ref: S.21:66
  ar: قَالَ أَفَتَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَنْفَعُكُمْ شَيْئًا وَلَا يَضُرُّكُمْ
  trl: Qāla a-fa-taʿbudūna min dūni llāhi mā lā yanfaʿukum shayʾan wa-lā yaḍurrukum
  trad: 'Il dit : « Rendez-vous donc un culte, en dehors d''Allaah, à ce qui ne vous est d''aucune utilité (*lā yanfaʿukum*) et ne vous nuit (*lā yaḍurrukum*) en rien ? »'
- ref: S.21:67
  ar: أُفٍّ لَكُمْ وَلِمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ ۖ أَفَلَا تَعْقِلُونَ
  trl: Uffin lakum wa-li-mā taʿbudūna min dūni llāhi a-fa-lā taʿqilūn
  trad: Fi (*uffin*) de vous, et de ce à quoi vous rendez un culte en dehors d'Allaah ! Ne raisonnez-vous donc pas (*a-fa-lā taʿqilūn*) ?
- ref: S.21:68
  ar: قَالُوا حَرِّقُوهُ وَانْصُرُوا آلِهَتَكُمْ إِنْ كُنْتُمْ فَاعِلِينَ
  trl: Qālū ḥarriqūhu wa-nṣurū ālihatakum in kuntum fāʿilīn
  trad: 'Ils dirent : « Brûlez-le (*ḥarriqūhu*), et portez secours à vos dieux, si vous voulez agir ! »'
- ref: S.21:69
  ar: قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ
  trl: Qulnā yā nāru kūnī bardan wa-salāman ʿalā ibrāhīm
  trad: 'Nous avons dit : « Ô feu, sois fraîcheur (*bardan*) et paix (*salāman*) pour Ibrāhīm ! »'
- ref: S.21:70
  ar: وَأَرَادُوا بِهِ كَيْدًا فَجَعَلْنَاهُمُ الْأَخْسَرِينَ
  trl: Wa-arādū bihi kaydan fa-jaʿalnāhumu l-akhsarīn
  trad: Et ils voulurent, contre lui, un stratagème (*kaydan*) — mais Nous avons fait d'eux les plus grands perdants (*al-akhsarīn*).
- ref: S.21:71
  ar: وَنَجَّيْنَاهُ وَلُوطًا إِلَى الْأَرْضِ الَّتِي بَارَكْنَا فِيهَا لِلْعَالَمِينَ
  trl: Wa-najjaynāhu wa-lūṭan ila l-arḍi llatī bāraknā fīhā li-l-ʿālamīn
  trad: Et Nous l'avons sauvé, lui et Lūṭ, vers la terre dans laquelle Nous avons placé la *baraka* (*bāraknā fīhā*) pour les mondes.
- ref: S.21:72
  ar: وَوَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ نَافِلَةً ۖ وَكُلًّا جَعَلْنَا صَالِحِينَ
  trl: Wa-wahabnā lahu isḥāqa wa-yaʿqūba nāfilatan wa-kullan jaʿalnā ṣāliḥīn
  trad: Et Nous lui avons fait don (*wahabnā*) d'Isḥāq, et de Yaʿqūb en surcroît (*nāfilatan*) — et de chacun Nous avons fait un homme droit (*ṣāliḥīn*).
- ref: S.21:73
  ar: وَجَعَلْنَاهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا وَأَوْحَيْنَا إِلَيْهِمْ فِعْلَ الْخَيْرَاتِ وَإِقَامَ الصَّلَاةِ وَإِيتَاءَ الزَّكَاةِ ۖ وَكَانُوا لَنَا عَابِدِينَ
  trl: Wa-jaʿalnāhum aʾimmatan yahdūna bi-amrinā wa-awḥaynā ilayhim fiʿla l-khayrāti wa-iqāma ṣ-ṣalāti wa-ītāʾa z-zakāti wa-kānū lanā ʿābidīn
  trad: Et Nous avons fait d'eux des imams (*aʾimma*) qui guident par Notre ordre, et Nous leur avons inspiré par *waḥy* (*awḥaynā*) l'accomplissement des œuvres bonnes (*fiʿl al-khayrāt*), l'accomplissement de la *ṣalāt* et le don de la *zakāt* — et ils étaient, pour Nous, dans l'adoration (*ʿābidīn*).
- ref: S.21:74
  ar: وَلُوطًا آتَيْنَاهُ حُكْمًا وَعِلْمًا وَنَجَّيْنَاهُ مِنَ الْقَرْيَةِ الَّتِي كَانَتْ تَعْمَلُ الْخَبَائِثَ ۗ إِنَّهُمْ كَانُوا قَوْمَ سَوْءٍ فَاسِقِينَ
  trl: Wa-lūṭan ātaynāhu ḥukman wa-ʿilman wa-najjaynāhu mina l-qaryati llatī kānat taʿmalu l-khabāʾitha innahum kānū qawma sawʾin fāsiqīn
  trad: Et Lūṭ — Nous lui avons donné *ḥukm* et *ʿilm*, et Nous l'avons sauvé de la cité (*al-qarya*) qui commettait les *khabāʾith* (les actes viciés) ; ils étaient certes un peuple de malfaisance (*sawʾ*), des *fāsiqūn* (transgresseurs).
- ref: S.21:75
  ar: وَأَدْخَلْنَاهُ فِي رَحْمَتِنَا ۖ إِنَّهُ مِنَ الصَّالِحِينَ
  trl: Wa-adkhalnāhu fī raḥmatinā innahu mina ṣ-ṣāliḥīn
  trad: Et Nous l'avons fait entrer dans Notre *raḥma* — il est certes du nombre des *ṣāliḥīn*.
- ref: S.21:76
  ar: وَنُوحًا إِذْ نَادَىٰ مِنْ قَبْلُ فَاسْتَجَبْنَا لَهُ فَنَجَّيْنَاهُ وَأَهْلَهُ مِنَ الْكَرْبِ الْعَظِيمِ
  trl: Wa-nūḥan idh nādā min qablu fa-stajabnā lahu fa-najjaynāhu wa-ahlahu mina l-karbi l-ʿaẓīm
  trad: Et Nūḥ — quand il appela, auparavant (*min qablu*), Nous avons répondu à son appel et Nous l'avons sauvé, lui et les siens (*ahlahu*), de la détresse immense (*al-karb al-ʿaẓīm*).
- ref: S.21:77
  ar: وَنَصَرْنَاهُ مِنَ الْقَوْمِ الَّذِينَ كَذَّبُوا بِآيَاتِنَا ۚ إِنَّهُمْ كَانُوا قَوْمَ سَوْءٍ فَأَغْرَقْنَاهُمْ أَجْمَعِينَ
  trl: Wa-naṣarnāhu mina l-qawmi lladhīna kadhdhabū bi-āyātinā innahum kānū qawma sawʾin fa-aghraqnāhum ajmaʿīn
  trad: Et Nous l'avons secouru contre le peuple qui avait traité Nos signes de mensonge (*kadhdhabū bi-āyātinā*) — ils étaient certes un peuple de malfaisance (*qawma sawʾ*) — Nous les avons donc noyés tous ensemble (*ajmaʿīn*).
- ref: S.21:78
  ar: وَدَاوُودَ وَسُلَيْمَانَ إِذْ يَحْكُمَانِ فِي الْحَرْثِ إِذْ نَفَشَتْ فِيهِ غَنَمُ الْقَوْمِ وَكُنَّا لِحُكْمِهِمْ شَاهِدِينَ
  trl: Wa-dāwūda wa-sulaymāna idh yaḥkumāni fi l-ḥarthi idh nafashat fīhi ghanamu l-qawmi wa-kunnā li-ḥukmihim shāhidīn
  trad: Et Dāwūd et Sulaymān — quand tous deux rendaient un jugement (*yaḥkumāni*) au sujet du champ cultivé (*al-ḥarth*), lorsque les moutons du peuple s'y étaient répandus de nuit (*nafashat*) — et Nous étions, de leur jugement, témoins (*shāhidīn*).
- ref: S.21:79
  ar: فَفَهَّمْنَاهَا سُلَيْمَانَ ۚ وَكُلًّا آتَيْنَا حُكْمًا وَعِلْمًا ۚ وَسَخَّرْنَا مَعَ دَاوُودَ الْجِبَالَ يُسَبِّحْنَ وَالطَّيْرَ ۚ وَكُنَّا فَاعِلِينَ
  trl: Fa-fahhamnāhā sulaymāna wa-kullan ātaynā ḥukman wa-ʿilman wa-sakhkharnā maʿa dāwūda l-jibāla yusabbiḥna wa-ṭ-ṭayra wa-kunnā fāʿilīn
  trad: 'Nous en avons donné la compréhension exacte (*fahhamnāhā*) à Sulaymān — et à chacun des deux Nous avons donné *ḥukm* et *ʿilm*. Et Nous avons assujetti (*sakhkharnā*), avec Dāwūd, les montagnes — qui disent le *tasbīḥ* — et les oiseaux : et c''était Nous qui agissions ainsi (*fāʿilīn*).'
- ref: S.21:80
  ar: وَعَلَّمْنَاهُ صَنْعَةَ لَبُوسٍ لَكُمْ لِتُحْصِنَكُمْ مِنْ بَأْسِكُمْ ۖ فَهَلْ أَنْتُمْ شَاكِرُونَ
  trl: Wa-ʿallamnāhu ṣanʿata labūsin lakum li-tuḥṣinakum min baʾsikum fa-hal antum shākirūn
  trad: Et Nous lui avons enseigné la façon de confectionner un revêtement protecteur (*ṣanʿat labūs*) pour vous, afin qu'il vous protège (*li-tuḥṣinakum*) de votre propre violence (*baʾsikum*) — êtes-vous donc reconnaissants (*shākirūn*) ?
- ref: S.21:81
  ar: وَلِسُلَيْمَانَ الرِّيحَ عَاصِفَةً تَجْرِي بِأَمْرِهِ إِلَى الْأَرْضِ الَّتِي بَارَكْنَا فِيهَا ۚ وَكُنَّا بِكُلِّ شَيْءٍ عَالِمِينَ
  trl: Wa-li-sulaymāna r-rīḥa ʿāṣifatan tajrī bi-amrihi ila l-arḍi llatī bāraknā fīhā wa-kunnā bi-kulli shayʾin ʿālimīn
  trad: Et à Sulaymān [Nous avons assujetti] le vent, impétueux (*ʿāṣifatan*), qui courait par son ordre (*bi-amrihi*) vers la terre dans laquelle Nous avons placé la *baraka* — et Nous étions, de toute chose, pleinement savants.
- ref: S.21:82
  ar: وَمِنَ الشَّيَاطِينِ مَنْ يَغُوصُونَ لَهُ وَيَعْمَلُونَ عَمَلًا دُونَ ذَٰلِكَ ۖ وَكُنَّا لَهُمْ حَافِظِينَ
  trl: Wa-mina sh-shayāṭīni man yaghūṣūna lahu wa-yaʿmalūna ʿamalan dūna dhālika wa-kunnā lahum ḥāfiẓīn
  trad: Et parmi les *shayāṭīn*, il en était qui plongeaient (*yaghūṣūn*) pour lui et accomplissaient, en plus de cela, un autre travail (*ʿamalan dūna dhālika*) — et Nous étions, sur eux, gardiens (*ḥāfiẓīn*).
- ref: S.21:83
  ar: ۞ وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ
  trl: Wa-ayyūba idh nādā rabbahu annī massaniya ḍ-ḍurru wa-anta arḥamu r-rāḥimīn
  trad: 'Et Ayyūb — quand il appela son *Rabb* : « Le mal m''a touché (*massaniya ḍ-ḍurr*), et nul, parmi ceux qui disposent de *raḥma*, n''en dispose plus que Toi. »'
- ref: S.21:84
  ar: فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِنْ ضُرٍّ ۖ وَآتَيْنَاهُ أَهْلَهُ وَمِثْلَهُمْ مَعَهُمْ رَحْمَةً مِنْ عِنْدِنَا وَذِكْرَىٰ لِلْعَابِدِينَ
  trl: Fa-stajabnā lahu fa-kashafnā mā bihi min ḍurrin wa-ātaynāhu ahlahu wa-mithlahum maʿahum raḥmatan min ʿindinā wa-dhikrā lil-ʿābidīn
  trad: Nous avons alors répondu à son appel et avons dissipé (*kashafnā*) le mal qui était en lui — et Nous lui avons rendu les siens, et leur pareil avec eux, comme *raḥma* venant de Nous et comme rappel (*dhikrā*) pour les *ʿābidīn* (ceux qui rendent un culte).
- ref: S.21:85
  ar: وَإِسْمَاعِيلَ وَإِدْرِيسَ وَذَا الْكِفْلِ ۖ كُلٌّ مِنَ الصَّابِرِينَ
  trl: Wa-ismāʿīla wa-idrīsa wa-dhā l-kifli kullun mina ṣ-ṣābirīn
  trad: Et Ismāʿīl, et Idrīs, et Dhū l-Kifl — chacun d'eux était du nombre des *ṣābirīn* (ceux qui tiennent dans l'endurance patiente).
- ref: S.21:86
  ar: وَأَدْخَلْنَاهُمْ فِي رَحْمَتِنَا ۖ إِنَّهُمْ مِنَ الصَّالِحِينَ
  trl: Wa-adkhalnāhum fī raḥmatinā innahum mina ṣ-ṣāliḥīn
  trad: Et Nous les avons fait entrer dans Notre *raḥma* — ils sont certes du nombre des *ṣāliḥīn*.
- ref: S.21:87
  ar: وَذَا النُّونِ إِذْ ذَهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَنْ نَقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ
  trl: Wa-dhā n-nūni idh dhahaba mughāḍiban fa-ẓanna an lan naqdira ʿalayhi fa-nādā fi ẓ-ẓulumāti an lā ilāha illā anta subḥānaka innī kuntu mina ẓ-ẓālimīn
  trad: 'Et Dhū n-Nūn (« celui du poisson ») — quand il partit en colère (*mughāḍiban*) et supposa que Nous n''aurions pas prise sur lui (*lan naqdira ʿalayhi*) — puis il appela, dans les ténèbres (*fi ẓ-ẓulumāt*) : « Nul *ilāh* que Toi — exaltation à Toi (*subḥānaka*) — j''ai certes été du nombre des *ẓālimūn* ! »'
- ref: S.21:88
  ar: فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ ۚ وَكَذَٰلِكَ نُنْجِي الْمُؤْمِنِينَ
  trl: Fa-stajabnā lahu wa-najjaynāhu mina l-ghammi wa-ka-dhālika nunjī l-muʾminīn
  trad: Nous avons alors répondu à son appel et l'avons sauvé de l'affliction qui enveloppe (*al-ghamm*) — et c'est ainsi que Nous sauvons les *muʾminūn*.
- ref: S.21:89
  ar: وَزَكَرِيَّا إِذْ نَادَىٰ رَبَّهُ رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنْتَ خَيْرُ الْوَارِثِينَ
  trl: Wa-zakariyyā idh nādā rabbahu rabbi lā tadharnī fardan wa-anta khayru l-wārithīn
  trad: 'Et Zakariyyā — quand il appela son *Rabb* : « *Rabbi*, ne me laisse pas seul (*fardan*), alors que Tu es le meilleur des héritiers (*khayru l-wārithīn*) ! »'
- ref: S.21:90
  ar: فَاسْتَجَبْنَا لَهُ وَوَهَبْنَا لَهُ يَحْيَىٰ وَأَصْلَحْنَا لَهُ زَوْجَهُ ۚ إِنَّهُمْ كَانُوا يُسَارِعُونَ فِي الْخَيْرَاتِ وَيَدْعُونَنَا رَغَبًا وَرَهَبًا ۖ وَكَانُوا لَنَا خَاشِعِينَ
  trl: Fa-stajabnā lahu wa-wahabnā lahu yaḥyā wa-aṣlaḥnā lahu zawjahu innahum kānū yusāriʿūna fi l-khayrāti wa-yadʿūnanā raghaban wa-rahaban wa-kānū lanā khāshiʿīn
  trad: 'Nous avons répondu à son appel : Nous lui avons fait don de Yaḥyā, et Nous avons remis en état (*aṣlaḥnā*) son épouse — ils s''empressaient (*yusāriʿūna*) vers les œuvres bonnes (*al-khayrāt*) et Nous invoquaient dans le désir ardent et la crainte (*raghaban wa-rahaban*), et ils étaient, envers Nous, *khāshiʿīn*.'
- ref: S.21:91
  ar: وَالَّتِي أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهَا مِنْ رُوحِنَا وَجَعَلْنَاهَا وَابْنَهَا آيَةً لِلْعَالَمِينَ
  trl: Wa-llatī aḥṣanat farjahā fa-nafakhnā fīhā min rūḥinā wa-jaʿalnāhā wa-bnahā āyatan lil-ʿālamīn
  trad: Et celle qui a préservé intacte sa pudeur (*aḥṣanat farjahā*) — Nous avons insufflé en elle de Notre *rūḥ*, et Nous avons fait d'elle, et de son fils, un signe (*āya*) pour les mondes (*al-ʿālamīn*).
- ref: S.21:92
  ar: إِنَّ هَٰذِهِ أُمَّتُكُمْ أُمَّةً وَاحِدَةً وَأَنَا رَبُّكُمْ فَاعْبُدُونِ
  trl: Inna hādhihi ummatukum ummatan wāḥidatan wa-anā rabbukum fa-ʿbudūn
  trad: 'Ceci est votre communauté (*ummatukum*), une communauté unique (*ummatan wāḥidatan*) — et Je suis votre *Rabb* : adorez-Moi donc (*fa-ʿbudūn*).'
- ref: S.21:93
  ar: وَتَقَطَّعُوا أَمْرَهُمْ بَيْنَهُمْ ۖ كُلٌّ إِلَيْنَا رَاجِعُونَ
  trl: Wa-taqaṭṭaʿū amrahum baynahum kullun ilaynā rājiʿūn
  trad: Et ils se sont divisés (*taqaṭṭaʿū*), entre eux, quant à leur affaire (*amrahum*) — chacun, c'est vers Nous qu'il retourne (*rājiʿūn*).
- ref: S.21:94
  ar: فَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ وَهُوَ مُؤْمِنٌ فَلَا كُفْرَانَ لِسَعْيِهِ وَإِنَّا لَهُ كَاتِبُونَ
  trl: Fa-man yaʿmal mina ṣ-ṣāliḥāti wa-huwa muʾminun fa-lā kufrāna li-saʿyihi wa-innā lahu kātibūn
  trad: Et quiconque accomplit une œuvre droite (*min aṣ-ṣāliḥāt*) tout en étant *muʾmin* — nul déni (*kufrān*) ne sera opposé à son effort (*saʿyihi*), et Nous en sommes certes les inscripteurs (*kātibūn*).
- ref: S.21:95
  ar: وَحَرَامٌ عَلَىٰ قَرْيَةٍ أَهْلَكْنَاهَا أَنَّهُمْ لَا يَرْجِعُونَ
  trl: Wa-ḥarāmun ʿalā qaryatin ahlaknāhā annahum lā yarjiʿūn
  trad: Et il est exclu (*ḥarām*), pour une cité (*qarya*) que Nous avons détruite, qu'ils [ses habitants] reviennent (*lā yarjiʿūn*).
- ref: S.21:96
  ar: حَتَّىٰ إِذَا فُتِحَتْ يَأْجُوجُ وَمَأْجُوجُ وَهُمْ مِنْ كُلِّ حَدَبٍ يَنْسِلُونَ
  trl: Ḥattā idhā futiḥat yaʾjūju wa-maʾjūju wa-hum min kulli ḥadabin yansilūn
  trad: — jusqu'à ce que Yaʾjūj et Maʾjūj soient ouverts (*futiḥat*), et qu'ils se précipitent (*yansilūn*) depuis chaque hauteur (*ḥadab*) —
- ref: S.21:97
  ar: وَاقْتَرَبَ الْوَعْدُ الْحَقُّ فَإِذَا هِيَ شَاخِصَةٌ أَبْصَارُ الَّذِينَ كَفَرُوا يَا وَيْلَنَا قَدْ كُنَّا فِي غَفْلَةٍ مِنْ هَٰذَا بَلْ كُنَّا ظَالِمِينَ
  trl: Wa-qtaraba l-waʿdu l-ḥaqqu fa-idhā hiya shākhiṣatun abṣāru lladhīna kafarū yā waylanā qad kunnā fī ghaflatin min hādhā bal kunnā ẓālimīn
  trad: '— et que la promesse vraie (*al-waʿd al-ḥaqq*) se sera approchée : voici que les regards (*abṣār*) de ceux qui ont mécru resteront figés de frayeur (*shākhiṣa*) : « Malheur à nous (*yā waylanā*) ! Nous étions certes dans l''insouciance (*ghafla*) à l''égard de ceci — bien plus, nous étions des *ẓālimūn* ! »'
- ref: S.21:98
  ar: إِنَّكُمْ وَمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ حَصَبُ جَهَنَّمَ أَنْتُمْ لَهَا وَارِدُونَ
  trl: Innakum wa-mā taʿbudūna min dūni llāhi ḥaṣabu jahannama antum lahā wāridūn
  trad: 'Vous, et ce à quoi vous rendez un culte (*taʿbudūna*) en dehors d''Allaah, êtes le combustible (*ḥaṣab*) de Jahannam : vous y parviendrez (*wāridūn*).'
- ref: S.21:99
  ar: لَوْ كَانَ هَٰؤُلَاءِ آلِهَةً مَا وَرَدُوهَا ۖ وَكُلٌّ فِيهَا خَالِدُونَ
  trl: Law kāna hāʾulāʾi ālihatan mā waradūhā wa-kullun fīhā khālidūn
  trad: Si celles-là avaient été des *ālihah* (ce que l'on prend pour *ilāh*), elles n'y seraient pas parvenues (*mā waradūhā*) — et tous y demeurent à jamais (*khālidūn*).
- ref: S.21:100
  ar: لَهُمْ فِيهَا زَفِيرٌ وَهُمْ فِيهَا لَا يَسْمَعُونَ
  trl: Lahum fīhā zafīrun wa-hum fīhā lā yasmaʿūn
  trad: Il y a pour eux, en elle, un gémissement rauque (*zafīr*), et ils n'y entendent rien.
- ref: S.21:101
  ar: إِنَّ الَّذِينَ سَبَقَتْ لَهُمْ مِنَّا الْحُسْنَىٰ أُولَٰئِكَ عَنْهَا مُبْعَدُونَ
  trl: Inna lladhīna sabaqat lahum minnā l-ḥusnā ulāʾika ʿanhā mubʿadūn
  trad: Ceux pour qui, de Notre part, *al-ḥusnā* a déjà précédé (*sabaqat*) — ceux-là en sont tenus à l'écart (*mubʿadūn*).
- ref: S.21:102
  ar: لَا يَسْمَعُونَ حَسِيسَهَا ۖ وَهُمْ فِي مَا اشْتَهَتْ أَنْفُسُهُمْ خَالِدُونَ
  trl: Lā yasmaʿūna ḥasīsahā wa-hum fī mā shtahat anfusuhum khālidūn
  trad: Ils n'en entendent pas le moindre bruissement (*ḥasīs*), et ils demeurent à jamais dans ce que leurs âmes désirent (*mā shtahat anfusuhum*).
- ref: S.21:103
  ar: لَا يَحْزُنُهُمُ الْفَزَعُ الْأَكْبَرُ وَتَتَلَقَّاهُمُ الْمَلَائِكَةُ هَٰذَا يَوْمُكُمُ الَّذِي كُنْتُمْ تُوعَدُونَ
  trl: Lā yaḥzunuhumu l-fazaʿu l-akbaru wa-tatalaqqāhumu l-malāʾikatu hādhā yawmukumu lladhī kuntum tūʿadūn
  trad: 'La plus grande frayeur (*al-fazaʿ al-akbar*) ne les afflige pas, et les *malāʾika* les accueillent (*tatalaqqāhum*) : « Voici votre jour, celui qui vous était promis (*tūʿadūn*) ! »'
- ref: S.21:104
  ar: يَوْمَ نَطْوِي السَّمَاءَ كَطَيِّ السِّجِلِّ لِلْكُتُبِ ۚ كَمَا بَدَأْنَا أَوَّلَ خَلْقٍ نُعِيدُهُ ۚ وَعْدًا عَلَيْنَا ۚ إِنَّا كُنَّا فَاعِلِينَ
  trl: Yawma naṭwi s-samāʾa ka-ṭayyi s-sijilli li-l-kutubi kamā badaʾnā awwala khalqin nuʿīduhu waʿdan ʿalaynā innā kunnā fāʿilīn
  trad: 'Le jour où Nous enroulerons (*naṭwi*) le ciel comme s''enroule le *sijill* sur les écrits (*ka-ṭayyi s-sijilli li-l-kutub*) — de même que Nous avons commencé la première création, Nous la referons : c''est une promesse qui Nous engage (*waʿdan ʿalaynā*) — Nous en sommes certes les auteurs (*fāʿilīn*).'
- ref: S.21:105
  ar: وَلَقَدْ كَتَبْنَا فِي الزَّبُورِ مِنْ بَعْدِ الذِّكْرِ أَنَّ الْأَرْضَ يَرِثُهَا عِبَادِيَ الصَّالِحُونَ
  trl: Wa-la-qad katabnā fi z-zabūri min baʿdi dh-dhikri anna l-arḍa yarithuhā ʿibādiya ṣ-ṣāliḥūn
  trad: Et Nous avons certes consigné (*katabnā*), dans le *Zabūr*, après le *Dhikr*, que la terre, ce sont Mes *ʿibād ṣāliḥūn* (serviteurs droits) qui en hériteront (*yarithuhā*).
- ref: S.21:106
  ar: إِنَّ فِي هَٰذَا لَبَلَاغًا لِقَوْمٍ عَابِدِينَ
  trl: Inna fī hādhā la-balāghan li-qawmin ʿābidīn
  trad: En cela se trouve certes une communication suffisante (*balāgh*) pour un peuple qui rend un culte (*ʿābidīn*).
- ref: S.21:107
  ar: وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ
  trl: Wa-mā arsalnāka illā raḥmatan li-l-ʿālamīn
  trad: Et Nous ne t'avons envoyé que comme *raḥma* pour les mondes (*lil-ʿālamīn*).
- ref: S.21:108
  ar: قُلْ إِنَّمَا يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ ۖ فَهَلْ أَنْتُمْ مُسْلِمُونَ
  trl: Qul innamā yūḥā ilayya annamā ilāhukum ilāhun wāḥidun fa-hal antum muslimūn
  trad: 'Dis : « Il m''est seulement révélé (*yūḥā ilayya*) que votre *ilāh* est un *ilāh* unique — êtes-vous donc *muslimūn* ? »'
- ref: S.21:109
  ar: فَإِنْ تَوَلَّوْا فَقُلْ آذَنْتُكُمْ عَلَىٰ سَوَاءٍ ۖ وَإِنْ أَدْرِي أَقَرِيبٌ أَمْ بَعِيدٌ مَا تُوعَدُونَ
  trl: Fa-in tawallaw fa-qul ādhantukum ʿalā sawāʾin wa-in adrī a-qarībun am baʿīdun mā tūʿadūn
  trad: 'S''ils se détournent, dis alors : « Je vous ai avertis à parts égales (*ʿalā sawāʾin*) — et je ne sais si ce qui vous est promis est proche ou lointain. »'
- ref: S.21:110
  ar: إِنَّهُ يَعْلَمُ الْجَهْرَ مِنَ الْقَوْلِ وَيَعْلَمُ مَا تَكْتُمُونَ
  trl: Innahu yaʿlamu l-jahra mina l-qawli wa-yaʿlamu mā taktumūn
  trad: Il connaît certes le discours ouvert (*al-jahr*) comme Il connaît ce que vous dissimulez (*taktumūn*).
- ref: S.21:111
  ar: وَإِنْ أَدْرِي لَعَلَّهُ فِتْنَةٌ لَكُمْ وَمَتَاعٌ إِلَىٰ حِينٍ
  trl: Wa-in adrī laʿallahu fitnatun lakum wa-matāʿun ilā ḥīn
  trad: Et je ne sais — peut-être est-ce une épreuve (*fitna*) pour vous, et une jouissance (*matāʿ*) pour un temps (*ilā ḥīn*).
- ref: S.21:112
  ar: قَالَ رَبِّ احْكُمْ بِالْحَقِّ ۗ وَرَبُّنَا الرَّحْمَٰنُ الْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَ
  trl: Qāla rabbi-ḥkum bi-l-ḥaqqi wa-rabbunā r-raḥmānu l-mustaʿānu ʿalā mā taṣifūn
  trad: 'Il dit : « Mon Rabb, juge en toute vérité (*iḥkum bi-l-ḥaqq*) ! » — et notre Rabb est ar-Raḥmān, dont le secours est imploré (*al-mustaʿān*) contre ce que vous décrivez (*taṣifūn*).'
