- ref: S.12:1
  ar: الر ۚ تِلْكَ آيَاتُ الْكِتَابِ الْمُبِينِ
  trl: Alif-Lām-Rāʾ tilka āyātu l-kitābi l-mubīn
  trad: Alif-Lām-Rāʾ. Voici les āyāt du Kitāb manifeste (*al-mubīn*).
- ref: S.12:2
  ar: إِنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَعَلَّكُمْ تَعْقِلُونَ
  trl: Innā anzalnāhu qurʾānan ʿarabiyyan laʿallakum taʿqilūn
  trad: Nous l'avons fait descendre — une Lecture (*qurʾān*) en langue arabe — afin que vous raisonniez (*taʿqilūn*).
- ref: S.12:3
  ar: نَحْنُ نَقُصُّ عَلَيْكَ أَحْسَنَ الْقَصَصِ بِمَا أَوْحَيْنَا إِلَيْكَ هَٰذَا الْقُرْآنَ وَإِنْ كُنْتَ مِنْ قَبْلِهِ لَمِنَ الْغَافِلِينَ
  trl: Naḥnu naquṣṣu ʿalayka aḥsana l-qaṣaṣi bimā awḥaynā ilayka hādhā l-qurʾāna wa-in kunta min qablihi la-mina l-ghāfilīn
  trad: Nous te racontons (*naquṣṣu*) le plus beau des récits (*aḥsana l-qaṣaṣ*), en te révélant cette Lecture — et tu étais certes, avant elle, parmi ceux qui n'en savaient rien (*al-ghāfilīn*).
- ref: S.12:4
  ar: إِذْ قَالَ يُوسُفُ لِأَبِيهِ يَا أَبَتِ إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ رَأَيْتُهُمْ لِي سَاجِدِينَ
  trl: Idh qāla yūsufu li-abīhi yā abati innī raʾaytu aḥada ʿashara kawkaban wa-sh-shamsa wa-l-qamara raʾaytuhum lī sājidīn
  trad: 'Quand Yūsuf dit à son père : « Ô mon père, j''ai vu onze étoiles (*kawkaban*), ainsi que le soleil et la lune — je les ai vus prosternés (*sājidīn*) devant moi. »'
- ref: S.12:5
  ar: قَالَ يَا بُنَيَّ لَا تَقْصُصْ رُؤْيَاكَ عَلَىٰ إِخْوَتِكَ فَيَكِيدُوا لَكَ كَيْدًا ۖ إِنَّ الشَّيْطَانَ لِلْإِنْسَانِ عَدُوٌّ مُبِينٌ
  trl: Qāla yā bunayya lā taqṣuṣ ruʾyāka ʿalā ikhwatika fa-yakīdū laka kaydan inna sh-shayṭāna li-l-insāni ʿaduwwun mubīn
  trad: 'Il dit : « Ô mon petit, ne raconte pas ton songe (*ruʾyā*) à tes frères, sinon ils manœuvreraient contre toi d''une manœuvre (*kaydan*) — le *shayṭān* est certes, pour l''être humain, un ennemi manifeste (*ʿaduwwun mubīn*). »'
- ref: S.12:6
  ar: وَكَذَٰلِكَ يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِنْ تَأْوِيلِ الْأَحَادِيثِ وَيُتِمُّ نِعْمَتَهُ عَلَيْكَ وَعَلَىٰ آلِ يَعْقُوبَ كَمَا أَتَمَّهَا عَلَىٰ أَبَوَيْكَ مِنْ قَبْلُ إِبْرَاهِيمَ وَإِسْحَاقَ ۚ إِنَّ رَبَّكَ عَلِيمٌ حَكِيمٌ
  trl: Wa-kadhālika yajtabīka rabbuka wa-yuʿallimuka min taʾwīli l-aḥādīthi wa-yutimmu niʿmatahu ʿalayka wa-ʿalā āli yaʿqūba kamā atammahā ʿalā abawayka min qablu ibrāhīma wa-isḥāqa inna rabbaka ʿalīmun ḥakīm
  trad: Ainsi ton Rabb te choisira (*yajtabīka*), et t'enseignera une part de l'aboutissement des récits (*taʾwīl al-aḥādīth*), et parachèvera Son bienfait (*niʿmatahu*) sur toi et sur la famille de Yaʿqūb, comme Il l'a parachevé auparavant sur tes deux ancêtres (*abawayka*), Ibrāhīm et Isḥāq — ton Rabb est certes ʿAlīm, Ḥakīm.
- ref: S.12:7
  ar: ۞ لَقَدْ كَانَ فِي يُوسُفَ وَإِخْوَتِهِ آيَاتٌ لِلسَّائِلِينَ
  trl: Laqad kāna fī yūsufa wa-ikhwatihi āyātun li-s-sāʾilīn
  trad: Il y avait certes, dans [l'histoire de] Yūsuf et de ses frères, des āyāt pour ceux qui interrogent (*as-sāʾilīn*).
- ref: S.12:8
  ar: إِذْ قَالُوا لَيُوسُفُ وَأَخُوهُ أَحَبُّ إِلَىٰ أَبِينَا مِنَّا وَنَحْنُ عُصْبَةٌ إِنَّ أَبَانَا لَفِي ضَلَالٍ مُبِينٍ
  trl: Idh qālū la-yūsufu wa-akhūhu aḥabbu ilā abīnā minnā wa-naḥnu ʿuṣbatun inna abānā la-fī ḍalālin mubīn
  trad: 'Quand ils dirent : « Yūsuf et son frère sont plus chers (*aḥabbu*) à notre père que nous, alors que nous sommes un groupe soudé (*ʿuṣbatun*) — notre père est certes dans un égarement manifeste (*ḍalālin mubīn*). »'
- ref: S.12:9
  ar: اقْتُلُوا يُوسُفَ أَوِ اطْرَحُوهُ أَرْضًا يَخْلُ لَكُمْ وَجْهُ أَبِيكُمْ وَتَكُونُوا مِنْ بَعْدِهِ قَوْمًا صَالِحِينَ
  trl: Uqtulū yūsufa awi ṭraḥūhu arḍan yakhlu lakum wajhu abīkum wa-takūnū min baʿdihi qawman ṣāliḥīn
  trad: '« Tuez Yūsuf, ou jetez-le en quelque terre : le visage de votre père se libérera alors, pour vous seuls (*yakhlu lakum wajhu abīkum*) — et vous serez, après cela, des gens droits (*qawman ṣāliḥīn*). »'
- ref: S.12:10
  ar: قَالَ قَائِلٌ مِنْهُمْ لَا تَقْتُلُوا يُوسُفَ وَأَلْقُوهُ فِي غَيَابَتِ الْجُبِّ يَلْتَقِطْهُ بَعْضُ السَّيَّارَةِ إِنْ كُنْتُمْ فَاعِلِينَ
  trl: Qāla qāʾilun minhum lā taqtulū yūsufa wa-alqūhu fī ghayābati l-jubbi yaltaqiṭhu baʿḍu s-sayyārati in kuntum fāʿilīn
  trad: 'L''un d''eux dit : « Ne tuez pas Yūsuf, mais jetez-le dans les profondeurs cachées du puits (*ghayābati l-jubb*) : une caravane le recueillera (*yaltaqiṭhu*), si vous devez agir. »'
- ref: S.12:11
  ar: قَالُوا يَا أَبَانَا مَا لَكَ لَا تَأْمَنَّا عَلَىٰ يُوسُفَ وَإِنَّا لَهُ لَنَاصِحُونَ
  trl: Qālū yā abānā mā laka lā taʾmannā ʿalā yūsufa wa-innā lahu la-nāṣiḥūn
  trad: 'Ils dirent : « Ô notre père, qu''as-tu à ne pas nous faire confiance (*lā taʾmannā*) au sujet de Yūsuf, alors que nous lui voulons certes du bien (*la-nāṣiḥūn*) ? »'
- ref: S.12:12
  ar: أَرْسِلْهُ مَعَنَا غَدًا يَرْتَعْ وَيَلْعَبْ وَإِنَّا لَهُ لَحَافِظُونَ
  trl: Arsilhu maʿanā ghadan yartaʿ wa-yalʿab wa-innā lahu la-ḥāfiẓūn
  trad: '« Envoie-le avec nous demain : qu''il se détende et joue (*yartaʿ wa-yalʿab*) — nous en serons certes les gardiens (*la-ḥāfiẓūn*). »'
- ref: S.12:13
  ar: قَالَ إِنِّي لَيَحْزُنُنِي أَنْ تَذْهَبُوا بِهِ وَأَخَافُ أَنْ يَأْكُلَهُ الذِّئْبُ وَأَنْتُمْ عَنْهُ غَافِلُونَ
  trl: Qāla innī la-yaḥzununī an tadhhabū bihi wa-akhāfu an yaʾkulahu dh-dhiʾbu wa-antum ʿanhu ghāfilūn
  trad: 'Il dit : « Il m''attriste (*la-yaḥzununī*) certes que vous l''emmeniez, et je crains que le loup (*adh-dhiʾb*) ne le dévore pendant que vous êtes inattentifs à lui (*ghāfilūn*). »'
- ref: S.12:14
  ar: قَالُوا لَئِنْ أَكَلَهُ الذِّئْبُ وَنَحْنُ عُصْبَةٌ إِنَّا إِذًا لَخَاسِرُونَ
  trl: Qālū la-in akalahu dh-dhiʾbu wa-naḥnu ʿuṣbatun innā idhan la-khāsirūn
  trad: 'Ils dirent : « Si le loup le dévorait alors que nous sommes un groupe soudé, nous serions alors certes perdants (*la-khāsirūn*). »'
- ref: S.12:15
  ar: فَلَمَّا ذَهَبُوا بِهِ وَأَجْمَعُوا أَنْ يَجْعَلُوهُ فِي غَيَابَتِ الْجُبِّ ۚ وَأَوْحَيْنَا إِلَيْهِ لَتُنَبِّئَنَّهُمْ بِأَمْرِهِمْ هَٰذَا وَهُمْ لَا يَشْعُرُونَ
  trl: Fa-lammā dhahabū bihi wa-ajmaʿū an yajʿalūhu fī ghayābati l-jubbi wa-awḥaynā ilayhi la-tunabbiʾannahum bi-amrihim hādhā wa-hum lā yashʿurūn
  trad: 'Puis, quand ils l''eurent emmené et se furent tous accordés (*ajmaʿū*) à le mettre dans les profondeurs cachées du puits — Nous lui révélâmes (*awḥaynā ilayhi*) : « Tu les informeras certainement, un jour, de cette affaire qui est la leur, sans qu''ils s''en doutent (*wa-hum lā yashʿurūn*). »'
- ref: S.12:16
  ar: وَجَاءُوا أَبَاهُمْ عِشَاءً يَبْكُونَ
  trl: Wa-jāʾū abāhum ʿishāʾan yabkūn
  trad: Et ils vinrent à leur père, à la tombée du soir (*ʿishāʾan*), en pleurant.
- ref: S.12:17
  ar: قَالُوا يَا أَبَانَا إِنَّا ذَهَبْنَا نَسْتَبِقُ وَتَرَكْنَا يُوسُفَ عِنْدَ مَتَاعِنَا فَأَكَلَهُ الذِّئْبُ ۖ وَمَا أَنْتَ بِمُؤْمِنٍ لَنَا وَلَوْ كُنَّا صَادِقِينَ
  trl: Qālū yā abānā innā dhahabnā nastabiqu wa-taraknā yūsufa ʿinda matāʿinā fa-akalahu dh-dhiʾbu wa-mā anta bi-muʾminin lanā wa-law kunnā ṣādiqīn
  trad: 'Ils dirent : « Ô notre père, nous sommes partis courir (*nastabiqu*), et nous avons laissé Yūsuf auprès de nos affaires (*matāʿinā*) — le loup l''a dévoré. Et tu ne nous croirais pas (*bi-muʾminin lanā*), même si nous disions vrai (*ṣādiqīn*). »'
- ref: S.12:18
  ar: وَجَاءُوا عَلَىٰ قَمِيصِهِ بِدَمٍ كَذِبٍ ۚ قَالَ بَلْ سَوَّلَتْ لَكُمْ أَنْفُسُكُمْ أَمْرًا ۖ فَصَبْرٌ جَمِيلٌ ۖ وَاللَّهُ الْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَ
  trl: Wa-jāʾū ʿalā qamīṣihi bi-damin kadhibin qāla bal sawwalat lakum anfusukum amran fa-ṣabrun jamīlun wa-llāhu l-mustaʿānu ʿalā mā taṣifūn
  trad: 'Et ils apportèrent, sur sa chemise (*qamīṣihi*), un sang mensonger (*bi-damin kadhibin*). Il dit : « Non — vos âmes (*anfusukum*) vous ont enjolivé (*sawwalat*) une affaire — patience belle (*ṣabrun jamīl*), donc ! Et c''est Allaah dont le secours est demandé (*al-mustaʿān*) contre ce que vous décrivez. »'
- ref: S.12:19
  ar: وَجَاءَتْ سَيَّارَةٌ فَأَرْسَلُوا وَارِدَهُمْ فَأَدْلَىٰ دَلْوَهُ ۖ قَالَ يَا بُشْرَىٰ هَٰذَا غُلَامٌ ۚ وَأَسَرُّوهُ بِضَاعَةً ۚ وَاللَّهُ عَلِيمٌ بِمَا يَعْمَلُونَ
  trl: Wa-jāʾat sayyāratun fa-arsalū wāridahum fa-adlā dalwahu qāla yā bushrā hādhā ghulāmun wa-asarrūhu biḍāʿatan wa-llāhu ʿalīmun bimā yaʿmalūn
  trad: 'Une caravane (*sayyāra*) vint, et ils envoyèrent leur porteur d''eau (*wāridahum*), qui laissa descendre son seau (*adlā dalwahu*). Il dit : « Bonne nouvelle (*yā bushrā*) ! Voici un jeune homme (*ghulām*) ! » Et ils le dissimulèrent comme marchandise (*biḍāʿatan*) — et Allaah est connaissant (*ʿalīm*) de ce qu''ils font.'
- ref: S.12:20
  ar: وَشَرَوْهُ بِثَمَنٍ بَخْسٍ دَرَاهِمَ مَعْدُودَةٍ وَكَانُوا فِيهِ مِنَ الزَّاهِدِينَ
  trl: Wa-sharawhu bi-thamanin bakhsin darāhima maʿdūdatin wa-kānū fīhi mina z-zāhidīn
  trad: Et ils le vendirent (*sharawhu*) à un prix dérisoire (*thamanin bakhsin*), quelques dirhams comptés (*darāhima maʿdūdah*) — ils y attachaient peu de valeur (*mina z-zāhidīn*).
- ref: S.12:21
  ar: وَقَالَ الَّذِي اشْتَرَاهُ مِنْ مِصْرَ لِامْرَأَتِهِ أَكْرِمِي مَثْوَاهُ عَسَىٰ أَنْ يَنْفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا ۚ وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ وَلِنُعَلِّمَهُ مِنْ تَأْوِيلِ الْأَحَادِيثِ ۚ وَاللَّهُ غَالِبٌ عَلَىٰ أَمْرِهِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ
  trl: Wa-qāla lladhī shtarāhu min miṣra li-mraʾatihi akrimī mathwāhu ʿasā an yanfaʿanā aw nattakhidhahu waladan wa-kadhālika makkannā li-yūsufa fi l-arḍi wa-li-nuʿallimahu min taʾwīli l-aḥādīthi wa-llāhu ghālibun ʿalā amrihi wa-lākinna akthara n-nāsi lā yaʿlamūn
  trad: 'Et celui qui l''acheta, d''Égypte (*miṣra*), dit à sa femme : « Réserve-lui un séjour digne (*akrimī mathwāhu*) — peut-être nous sera-t-il utile, ou le prendrons-nous pour enfant (*waladan*). » Ainsi avons-Nous affermi (*makkannā*) Yūsuf sur cette terre, et pour lui enseigner une part de l''aboutissement des récits — Allaah a pleine maîtrise de Son dessein (*ghālibun ʿalā amrihi*), mais la plupart des gens ne savent pas.'
- ref: S.12:22
  ar: وَلَمَّا بَلَغَ أَشُدَّهُ آتَيْنَاهُ حُكْمًا وَعِلْمًا ۚ وَكَذَٰلِكَ نَجْزِي الْمُحْسِنِينَ
  trl: Wa-lammā balagha ashuddahu ātaynāhu ḥukman wa-ʿilman wa-kadhālika najzī l-muḥsinīn
  trad: Et quand il eut atteint sa pleine maturité (*ashuddahu*), Nous lui avons donné un *ḥukm* et un *ʿilm* — ainsi rétribuons-Nous les *muḥsinūn*.
- ref: S.12:23
  ar: وَرَاوَدَتْهُ الَّتِي هُوَ فِي بَيْتِهَا عَنْ نَفْسِهِ وَغَلَّقَتِ الْأَبْوَابَ وَقَالَتْ هَيْتَ لَكَ ۚ قَالَ مَعَاذَ اللَّهِ ۖ إِنَّهُ رَبِّي أَحْسَنَ مَثْوَايَ ۖ إِنَّهُ لَا يُفْلِحُ الظَّالِمُونَ
  trl: Wa-rāwadathu llatī huwa fī baytihā ʿan nafsihi wa-ghallaqati l-abwāba wa-qālat hayta laka qāla maʿādha llāhi innahu rabbī aḥsana mathwāya innahu lā yufliḥu ẓ-ẓālimūn
  trad: 'Et celle dans la maison de qui il se trouvait chercha à le détourner de lui-même (*rāwadathu ... ʿan nafsihi*) ; elle verrouilla les portes et dit : « Viens, toi ! » (*hayta laka*). Il dit : « Refuge en Allaah ! Il a rendu digne mon séjour (*aḥsana mathwāya*) — les injustes ne réussissent jamais. »'
- ref: S.12:24
  ar: وَلَقَدْ هَمَّتْ بِهِ ۖ وَهَمَّ بِهَا لَوْلَا أَنْ رَأَىٰ بُرْهَانَ رَبِّهِ ۚ كَذَٰلِكَ لِنَصْرِفَ عَنْهُ السُّوءَ وَالْفَحْشَاءَ ۚ إِنَّهُ مِنْ عِبَادِنَا الْمُخْلَصِينَ
  trl: Wa-laqad hammat bihi wa-hamma bihā lawlā an raʾā burhāna rabbihi kadhālika li-naṣrifa ʿanhu s-sūʾa wa-l-faḥshāʾa innahu min ʿibādinā l-mukhlaṣīn
  trad: 'Et elle le désira certes — et lui l''aurait désirée, n''eût été qu''il vit la preuve de son Rabb (*burhāna rabbihi*) — il en fut ainsi pour que Nous détournions de lui le mal et la turpitude (*as-sūʾ wa-l-faḥshāʾ*) : il est certes du nombre de Nos ʿibād rendus purs (*al-mukhlaṣīn*).'
- ref: S.12:25
  ar: وَاسْتَبَقَا الْبَابَ وَقَدَّتْ قَمِيصَهُ مِنْ دُبُرٍ وَأَلْفَيَا سَيِّدَهَا لَدَى الْبَابِ ۚ قَالَتْ مَا جَزَاءُ مَنْ أَرَادَ بِأَهْلِكَ سُوءًا إِلَّا أَنْ يُسْجَنَ أَوْ عَذَابٌ أَلِيمٌ
  trl: Wa-stabaqā l-bāba wa-qaddat qamīṣahu min duburin wa-alfayā sayyidahā ladā l-bābi qālat mā jazāʾu man arāda bi-ahlika sūʾan illā an yusjana aw ʿadhābun alīm
  trad: 'Et ils coururent tous deux vers la porte, et elle déchira sa chemise (*qamīṣahu*) par-derrière (*min dubur*), et ils trouvèrent son maître (*sayyidahā*) devant la porte. Elle dit : « Quelle est la rétribution de qui a voulu du mal à ta famille, sinon d''être emprisonné (*yusjana*), ou un châtiment douloureux ? »'
- ref: S.12:26–27
  ar: قَالَ هِيَ رَاوَدَتْنِي عَنْ نَفْسِي ۚ وَشَهِدَ شَاهِدٌ مِنْ أَهْلِهَا إِنْ كَانَ قَمِيصُهُ قُدَّ مِنْ قُبُلٍ فَصَدَقَتْ وَهُوَ مِنَ الْكَاذِبِينَ ۝ وَإِنْ كَانَ قَمِيصُهُ قُدَّ مِنْ دُبُرٍ فَكَذَبَتْ وَهُوَ مِنَ الصَّادِقِينَ
  trl: Qāla hiya rāwadatnī ʿan nafsī wa-shahida shāhidun min ahlihā in kāna qamīṣuhu qudda min qubulin fa-ṣadaqat wa-huwa mina l-kādhibīn — wa-in kāna qamīṣuhu qudda min duburin fa-kadhabat wa-huwa mina ṣ-ṣādiqīn
  trad: 'Il dit : « C''est elle qui a cherché à me détourner de moi-même. » Et un témoin (*shāhid*) de la famille de celle-ci témoigna : « Si sa chemise à lui est déchirée par-devant (*min qubul*), alors elle a dit vrai et il est du nombre des menteurs — et si sa chemise est déchirée par-derrière (*min dubur*), alors elle a menti et il est du nombre des véridiques. »'
- ref: S.12:28–29
  ar: فَلَمَّا رَأَىٰ قَمِيصَهُ قُدَّ مِنْ دُبُرٍ قَالَ إِنَّهُ مِنْ كَيْدِكُنَّ ۖ إِنَّ كَيْدَكُنَّ عَظِيمٌ ۝ يُوسُفُ أَعْرِضْ عَنْ هَٰذَا ۚ وَاسْتَغْفِرِي لِذَنْبِكِ ۖ إِنَّكِ كُنْتِ مِنَ الْخَاطِئِينَ
  trl: Fa-lammā raʾā qamīṣahu qudda min duburin qāla innahu min kaydikunna inna kaydakunna ʿaẓīm — yūsufu aʿriḍ ʿan hādhā wa-staghfirī li-dhanbiki innaki kunti mina l-khāṭiʾīn
  trad: 'Puis, quand il vit que sa chemise était déchirée par-derrière, il dit : « Cela relève de votre manœuvre (*kaydikunna*) — votre manœuvre est certes immense. Yūsuf, détourne-toi de cela (*aʿriḍ ʿan hādhā*) ; et toi, implore le pardon pour ta faute (*istaghfirī li-dhanbiki*) — tu es certes du nombre de celles qui ont fauté (*al-khāṭiʾīn*). »'
- ref: S.12:30
  ar: ۞ وَقَالَ نِسْوَةٌ فِي الْمَدِينَةِ امْرَأَتُ الْعَزِيزِ تُرَاوِدُ فَتَاهَا عَنْ نَفْسِهِ ۖ قَدْ شَغَفَهَا حُبًّا ۖ إِنَّا لَنَرَاهَا فِي ضَلَالٍ مُبِينٍ
  trl: Wa-qāla niswatun fi l-madīnati mraʾatu l-ʿazīzi turāwidu fatāhā ʿan nafsihi qad shaghafahā ḥubban innā lanarāhā fī ḍalālin mubīn
  trad: 'Des femmes dirent, dans la cité : « La femme d''al-ʿAzīz cherche à détourner son jeune serviteur (*fatāhā*) de lui-même — il l''a saisie d''un amour profond (*shaghafahā ḥubban*) — nous la voyons certes dans un égarement manifeste. »'
- ref: S.12:31
  ar: فَلَمَّا سَمِعَتْ بِمَكْرِهِنَّ أَرْسَلَتْ إِلَيْهِنَّ وَأَعْتَدَتْ لَهُنَّ مُتَّكَأً وَآتَتْ كُلَّ وَاحِدَةٍ مِنْهُنَّ سِكِّينًا وَقَالَتِ اخْرُجْ عَلَيْهِنَّ ۖ فَلَمَّا رَأَيْنَهُ أَكْبَرْنَهُ وَقَطَّعْنَ أَيْدِيَهُنَّ وَقُلْنَ حَاشَ لِلَّهِ مَا هَٰذَا بَشَرًا إِنْ هَٰذَا إِلَّا مَلَكٌ كَرِيمٌ
  trl: Fa-lammā samiʿat bi-makrihinna arsalat ilayhinna wa-aʿtadat lahunna muttakaʾan wa-ātat kulla wāḥidatin minhunna sikkīnan wa-qālati khruj ʿalayhinna fa-lammā raʾaynahu akbarnahu wa-qaṭṭaʿna aydiyahunna wa-qulna ḥāsha li-llāhi mā hādhā basharan in hādhā illā malakun karīm
  trad: 'Puis, quand elle entendit parler de leur manœuvre (*bi-makrihinna*), elle les invita, leur prépara un lieu où s''accouder (*muttakaʾan*) et donna à chacune d''elles un couteau (*sikkīnan*), et dit [à Yūsuf] : « Sors devant elles. » Puis, quand elles le virent, elles le trouvèrent si grand (*akbarnahu*) qu''elles se coupèrent les mains, et dirent : « Perfection à Allaah (*ḥāsha li-llāh*) ! Ce n''est pas là un être humain — ce n''est là qu''un ange noble (*malakun karīm*) ! »'
- ref: S.12:32
  ar: قَالَتْ فَذَٰلِكُنَّ الَّذِي لُمْتُنَّنِي فِيهِ ۖ وَلَقَدْ رَاوَدْتُهُ عَنْ نَفْسِهِ فَاسْتَعْصَمَ ۖ وَلَئِنْ لَمْ يَفْعَلْ مَا آمُرُهُ لَيُسْجَنَنَّ وَلَيَكُونًا مِنَ الصَّاغِرِينَ
  trl: Qālat fa-dhālikunna lladhī lumtunnanī fīhi wa-laqad rāwadtuhu ʿan nafsihi fa-staʿṣama wa-la-in lam yafʿal mā āmuruhu la-yusjananna wa-la-yakūnan mina ṣ-ṣāghirīn
  trad: 'Elle dit : « Voilà donc celui pour qui vous m''avez blâmée (*lumtunnanī fīhi*) ! Je l''ai certes cherché à le détourner de lui-même, mais il s''est fermement préservé (*fa-staʿṣama*) — et s''il ne fait pas ce que je lui ordonne, il sera assurément emprisonné et sera certes du nombre des humiliés (*aṣ-ṣāghirīn*). »'
- ref: S.12:33
  ar: قَالَ رَبِّ السِّجْنُ أَحَبُّ إِلَيَّ مِمَّا يَدْعُونَنِي إِلَيْهِ ۖ وَإِلَّا تَصْرِفْ عَنِّي كَيْدَهُنَّ أَصْبُ إِلَيْهِنَّ وَأَكُنْ مِنَ الْجَاهِلِينَ
  trl: Qāla rabbi s-sijnu aḥabbu ilayya mimmā yadʿūnanī ilayhi wa-illā taṣrif ʿannī kaydahunna aṣbu ilayhinna wa-akun mina l-jāhilīn
  trad: 'Il dit : « Mon Rabb, la prison m''est plus chère (*aḥabbu ilayya*) que ce vers quoi elles m''appellent — et si Tu ne détournes pas de moi leur manœuvre (*kaydahunna*), je m''inclinerai vers elles (*aṣbu ilayhinna*) et je serai du nombre des *jāhilīn*. »'
- ref: S.12:34
  ar: فَاسْتَجَابَ لَهُ رَبُّهُ فَصَرَفَ عَنْهُ كَيْدَهُنَّ ۚ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ
  trl: Fa-staǰāba lahu rabbuhu fa-ṣarafa ʿanhu kaydahunna innahu huwa s-samīʿu l-ʿalīm
  trad: Son Rabb lui répondit alors, et détourna de lui leur manœuvre — Il est, Lui, as-Samīʿ, al-ʿAlīm.
- ref: S.12:35
  ar: ثُمَّ بَدَا لَهُمْ مِنْ بَعْدِ مَا رَأَوُا الْآيَاتِ لَيَسْجُنُنَّهُ حَتَّىٰ حِينٍ
  trl: Thumma badā lahum min baʿdi mā raʾawu l-āyāti la-yasjununnahu ḥattā ḥīn
  trad: Puis, après avoir vu les *āyāt*, il leur parut bon (*badā lahum*) de l'emprisonner pour un temps (*ḥattā ḥīn*).
- ref: S.12:36
  ar: وَدَخَلَ مَعَهُ السِّجْنَ فَتَيَانِ ۖ قَالَ أَحَدُهُمَا إِنِّي أَرَانِي أَعْصِرُ خَمْرًا ۖ وَقَالَ الْآخَرُ إِنِّي أَرَانِي أَحْمِلُ فَوْقَ رَأْسِي خُبْزًا تَأْكُلُ الطَّيْرُ مِنْهُ ۖ نَبِّئْنَا بِتَأْوِيلِهِ ۖ إِنَّا نَرَاكَ مِنَ الْمُحْسِنِينَ
  trl: Wa-dakhala maʿahu s-sijna fatayāni qāla aḥaduhumā innī arānī aʿṣiru khamran wa-qāla l-ākharu innī arānī aḥmilu fawqa raʾsī khubzan taʾkulu ṭ-ṭayru minhu nabbiʾnā bi-taʾwīlihi innā narāka mina l-muḥsinīn
  trad: 'Et deux jeunes gens (*fatayān*) entrèrent en prison avec lui. L''un d''eux dit : « Je me vois (*innī arānī*) pressant du vin (*aʿṣiru khamran*). » Et l''autre dit : « Je me vois portant sur ma tête du pain, dont les oiseaux mangent. Informe-nous de son aboutissement (*bi-taʾwīlihi*) — nous te voyons certes du nombre des *muḥsinūn*. »'
- ref: S.12:37
  ar: قَالَ لَا يَأْتِيكُمَا طَعَامٌ تُرْزَقَانِهِ إِلَّا نَبَّأْتُكُمَا بِتَأْوِيلِهِ قَبْلَ أَنْ يَأْتِيَكُمَا ۚ ذَٰلِكُمَا مِمَّا عَلَّمَنِي رَبِّي ۚ إِنِّي تَرَكْتُ مِلَّةَ قَوْمٍ لَا يُؤْمِنُونَ بِاللَّهِ وَهُمْ بِالْآخِرَةِ هُمْ كَافِرُونَ
  trl: Qāla lā yaʾtīkumā ṭaʿāmun turzaqānihi illā nabbaʾtukumā bi-taʾwīlihi qabla an yaʾtiyakumā dhālikumā mimmā ʿallamanī rabbī innī taraktu millata qawmin lā yuʾminūna bi-llāhi wa-hum bi-l-ākhirati hum kāfirūn
  trad: 'Il dit : « Ne vous parviendra aucune nourriture qui vous est attribuée (*turzaqānihi*) sans que je vous en informe de l''aboutissement avant qu''elle ne vous parvienne — voilà ce que mon Rabb m''a enseigné. J''ai délaissé (*taraktu*) la voie (*milla*) d''un peuple qui ne croit pas en Allaah et qui, de l''Ākhira, est *kāfir*. »'
- ref: S.12:38
  ar: وَاتَّبَعْتُ مِلَّةَ آبَائِي إِبْرَاهِيمَ وَإِسْحَاقَ وَيَعْقُوبَ ۚ مَا كَانَ لَنَا أَنْ نُشْرِكَ بِاللَّهِ مِنْ شَيْءٍ ۚ ذَٰلِكَ مِنْ فَضْلِ اللَّهِ عَلَيْنَا وَعَلَى النَّاسِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَشْكُرُونَ
  trl: Wa-ttabaʿtu millata ābāʾī ibrāhīma wa-isḥāqa wa-yaʿqūba mā kāna lanā an nushrika bi-llāhi min shayʾin dhālika min faḍli llāhi ʿalaynā wa-ʿalā n-nāsi wa-lākinna akthara n-nāsi lā yashkurūn
  trad: '« Et j''ai suivi la voie de mes pères (*ābāʾī*), Ibrāhīm, Isḥāq et Yaʿqūb — il ne nous convenait pas d''associer (*nushrika*) quoi que ce soit à Allaah : cela relève de la faveur (*faḍl*) d''Allaah sur nous et sur les gens, mais la plupart des gens ne sont pas reconnaissants (*lā yashkurūn*). »'
- ref: S.12:39
  ar: يَا صَاحِبَيِ السِّجْنِ أَأَرْبَابٌ مُتَفَرِّقُونَ خَيْرٌ أَمِ اللَّهُ الْوَاحِدُ الْقَهَّارُ
  trl: Yā ṣāḥibayi s-sijni a-arbābun mutafarriqūna khayrun ami llāhu l-Wāḥidu l-Qahhār
  trad: « Ô mes deux compagnons de prison (*ṣāḥibayi s-sijn*), des seigneurs (*arbāb*) disparates (*mutafarriqūn*) sont-ils meilleurs, ou Allaah, l'Unique (*al-Wāḥid*), *al-Qahhār* ? »
- ref: S.12:40
  ar: مَا تَعْبُدُونَ مِنْ دُونِهِ إِلَّا أَسْمَاءً سَمَّيْتُمُوهَا أَنْتُمْ وَآبَاؤُكُمْ مَا أَنْزَلَ اللَّهُ بِهَا مِنْ سُلْطَانٍ ۚ إِنِ الْحُكْمُ إِلَّا لِلَّهِ ۚ أَمَرَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ ۚ ذَٰلِكَ الدِّينُ الْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ
  trl: Mā taʿbudūna min dūnihi illā asmāʾan sammaytumūhā antum wa-ābāʾukum mā anzala llāhu bihā min sulṭānin ini l-ḥukmu illā li-llāhi amara allā taʿbudū illā iyyāhu dhālika d-dīnu l-qayyimu wa-lākinna akthara n-nāsi lā yaʿlamūn
  trad: '« Vous ne servez, en dehors de Lui, que des noms que vous avez nommés (*asmāʾan sammaytumūhā*), vous et vos pères — Allaah n''a fait descendre là-dessus aucun *sulṭān*. Le *ḥukm* n''appartient qu''à Allaah : Il a ordonné que vous ne serviez que Lui — tel est le *dīn qayyim*. Mais la plupart des gens ne savent pas. »'
- ref: S.12:41
  ar: يَا صَاحِبَيِ السِّجْنِ أَمَّا أَحَدُكُمَا فَيَسْقِي رَبَّهُ خَمْرًا ۖ وَأَمَّا الْآخَرُ فَيُصْلَبُ فَتَأْكُلُ الطَّيْرُ مِنْ رَأْسِهِ ۚ قُضِيَ الْأَمْرُ الَّذِي فِيهِ تَسْتَفْتِيَانِ
  trl: Yā ṣāḥibayi s-sijni ammā aḥadukumā fa-yasqī rabbahu khamran wa-ammā l-ākharu fa-yuṣlabu fa-taʾkulu ṭ-ṭayru min raʾsihi quḍiya l-amru lladhī fīhi tastaftiyān
  trad: « Ô mes deux compagnons de prison, quant à l'un de vous, il servira du vin à son maître (*rabbahu*) ; et quant à l'autre, il sera crucifié (*yuṣlabu*), et les oiseaux mangeront de sa tête — l'affaire sur laquelle vous demandiez clarification (*tastaftiyān*) est tranchée (*quḍiya*). »
- ref: S.12:42
  ar: وَقَالَ لِلَّذِي ظَنَّ أَنَّهُ نَاجٍ مِنْهُمَا اذْكُرْنِي عِنْدَ رَبِّكَ فَأَنْسَاهُ الشَّيْطَانُ ذِكْرَ رَبِّهِ فَلَبِثَ فِي السِّجْنِ بِضْعَ سِنِينَ
  trl: Wa-qāla li-lladhī ẓanna annahu nājin minhumā dhkurnī ʿinda rabbika fa-ansāhu sh-shayṭānu dhikra rabbihi fa-labitha fi s-sijni biḍʿa sinīn
  trad: 'Et il dit à celui des deux dont il pensait qu''il serait sauvé (*nājin*) : « Mentionne-moi auprès de ton maître (*rabbika*). » Mais le *shayṭān* lui fit oublier (*fa-ansāhu*) de le mentionner auprès de son maître (*rabbihi*) — et il resta en prison quelques années (*biḍʿa sinīn*).'
- ref: S.12:43
  ar: وَقَالَ الْمَلِكُ إِنِّي أَرَىٰ سَبْعَ بَقَرَاتٍ سِمَانٍ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌ وَسَبْعَ سُنْبُلَاتٍ خُضْرٍ وَأُخَرَ يَابِسَاتٍ ۖ يَا أَيُّهَا الْمَلَأُ أَفْتُونِي فِي رُؤْيَايَ إِنْ كُنْتُمْ لِلرُّؤْيَا تَعْبُرُونَ
  trl: Wa-qāla l-maliku innī arā sabʿa baqarātin simānin yaʾkuluhunna sabʿun ʿijāfun wa-sabʿa sunbulātin khuḍrin wa-ukhara yābisātin yā ayyuha l-malaʾu aftūnī fī ruʾyāya in kuntum li-r-ruʾyā taʿburūn
  trad: 'Et le roi (*al-malik*) dit : « Je vois sept vaches grasses (*simān*) que dévorent sept [vaches] maigres (*ʿijāf*), et sept épis verts et d''autres desséchés — ô assemblée (*al-malaʾ*), éclairez-moi (*aftūnī*) sur mon songe, si vous savez interpréter les songes (*li-r-ruʾyā taʿburūn*). »'
- ref: S.12:44
  ar: قَالُوا أَضْغَاثُ أَحْلَامٍ ۖ وَمَا نَحْنُ بِتَأْوِيلِ الْأَحْلَامِ بِعَالِمِينَ
  trl: Qālū aḍghāthu aḥlāmin wa-mā naḥnu bi-taʾwīli l-aḥlāmi bi-ʿālimīn
  trad: 'Ils dirent : « Des songes confus (*aḍghāthu aḥlām*) — et nous ne sommes pas savants de l''aboutissement de tels songes. »'
- ref: S.12:45
  ar: وَقَالَ الَّذِي نَجَا مِنْهُمَا وَادَّكَرَ بَعْدَ أُمَّةٍ أَنَا أُنَبِّئُكُمْ بِتَأْوِيلِهِ فَأَرْسِلُونِ
  trl: Wa-qāla lladhī najā minhumā wa-ddakara baʿda ummatin anā unabbiʾukum bi-taʾwīlihi fa-arsilūn
  trad: 'Et celui des deux qui avait été sauvé (*najā*), se souvenant (*wa-ddakara*) après un long moment (*baʿda ummatin*), dit : « Moi, je vous informerai de son aboutissement — envoyez-moi donc [auprès de lui]. »'
- ref: S.12:46
  ar: يُوسُفُ أَيُّهَا الصِّدِّيقُ أَفْتِنَا فِي سَبْعِ بَقَرَاتٍ سِمَانٍ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌ وَسَبْعِ سُنْبُلَاتٍ خُضْرٍ وَأُخَرَ يَابِسَاتٍ لَعَلِّي أَرْجِعُ إِلَى النَّاسِ لَعَلَّهُمْ يَعْلَمُونَ
  trl: Yūsufu ayyuha ṣ-ṣiddīqu aftinā fī sabʿi baqarātin simānin yaʾkuluhunna sabʿun ʿijāfun wa-sabʿi sunbulātin khuḍrin wa-ukhara yābisātin laʿallī arjiʿu ilā n-nāsi laʿallahum yaʿlamūn
  trad: « Yūsuf, ô toi le véridique (*aṣ-ṣiddīq*), éclaire-nous (*aftinā*) sur sept vaches grasses que dévorent sept maigres, et sept épis verts et d'autres desséchés, afin que je retourne vers les gens, afin qu'ils sachent. »
- ref: S.12:47–49
  ar: قَالَ تَزْرَعُونَ سَبْعَ سِنِينَ دَأَبًا فَمَا حَصَدْتُمْ فَذَرُوهُ فِي سُنْبُلِهِ إِلَّا قَلِيلًا مِمَّا تَأْكُلُونَ ۝ ثُمَّ يَأْتِي مِنْ بَعْدِ ذَٰلِكَ سَبْعٌ شِدَادٌ يَأْكُلْنَ مَا قَدَّمْتُمْ لَهُنَّ إِلَّا قَلِيلًا مِمَّا تُحْصِنُونَ ۝ ثُمَّ يَأْتِي مِنْ بَعْدِ ذَٰلِكَ عَامٌ فِيهِ يُغَاثُ النَّاسُ وَفِيهِ يَعْصِرُونَ
  trl: Qāla tazraʿūna sabʿa sinīna daʾaban fa-mā ḥaṣadtum fa-dharūhu fī sunbulihi illā qalīlan mimmā taʾkulūn — thumma yaʾtī min baʿdi dhālika sabʿun shidādun yaʾkulna mā qaddamtum lahunna illā qalīlan mimmā tuḥṣinūn — thumma yaʾtī min baʿdi dhālika ʿāmun fīhi yughāthu n-nāsu wa-fīhi yaʿṣirūn
  trad: 'Il dit : « Vous cultiverez sept années durant, assidûment (*daʾaban*) ; et ce que vous aurez moissonné (*ḥaṣadtum*), laissez-le dans son épi (*sunbulihi*), sauf le peu que vous mangerez. Puis viendront, après cela, sept [années] rudes (*shidād*) qui dévoreront ce que vous aurez préparé pour elles, sauf le peu que vous aurez mis à l''abri (*tuḥṣinūn*). Puis viendra, après cela, une année où les gens seront secourus par la pluie (*yughāthu*), et où ils presseront (*yaʿṣirūn*). »'
- ref: S.12:50
  ar: وَقَالَ الْمَلِكُ ائْتُونِي بِهِ ۖ فَلَمَّا جَاءَهُ الرَّسُولُ قَالَ ارْجِعْ إِلَىٰ رَبِّكَ فَاسْأَلْهُ مَا بَالُ النِّسْوَةِ اللَّاتِي قَطَّعْنَ أَيْدِيَهُنَّ ۚ إِنَّ رَبِّي بِكَيْدِهِنَّ عَلِيمٌ
  trl: Wa-qāla l-maliku ʾtūnī bihi fa-lammā jāʾahu r-rasūlu qāla rjiʿ ilā rabbika fa-sʾalhu mā bālu n-niswati llātī qaṭṭaʿna aydiyahunna inna rabbī bi-kaydihinna ʿalīm
  trad: 'Et le roi dit : « Amenez-le-moi. » Puis, quand le messager (*ar-rasūl*) vint à lui, il [Yūsuf] dit : « Retourne vers ton maître (*rabbika*), et interroge-le sur l''état (*mā bālu*) des femmes qui se sont coupé les mains — mon Rabb (*rabbī*) est certes connaissant de leur manœuvre (*kaydihinna*). »'
- ref: S.12:51
  ar: قَالَ مَا خَطْبُكُنَّ إِذْ رَاوَدْتُنَّ يُوسُفَ عَنْ نَفْسِهِ ۚ قُلْنَ حَاشَ لِلَّهِ مَا عَلِمْنَا عَلَيْهِ مِنْ سُوءٍ ۚ قَالَتِ امْرَأَتُ الْعَزِيزِ الْآنَ حَصْحَصَ الْحَقُّ أَنَا رَاوَدْتُهُ عَنْ نَفْسِهِ وَإِنَّهُ لَمِنَ الصَّادِقِينَ
  trl: Qāla mā khaṭbukunna idh rāwadtunna yūsufa ʿan nafsihi qulna ḥāsha li-llāhi mā ʿalimnā ʿalayhi min sūʾin qālati mraʾatu l-ʿazīzi l-āna ḥaṣḥaṣa l-ḥaqqu anā rāwadtuhu ʿan nafsihi wa-innahu la-mina ṣ-ṣādiqīn
  trad: 'Il [le roi] dit : « Quelle était votre affaire (*khaṭbukunna*), quand vous avez cherché à détourner Yūsuf de lui-même ? » Elles dirent : « Perfection à Allaah ! Nous ne lui connaissons aucun mal. » La femme d''al-ʿAzīz dit : « Maintenant le vrai s''est manifesté clairement (*al-āna ḥaṣḥaṣa l-ḥaqqu*) : c''est moi qui ai cherché à le détourner de lui-même — il est certes du nombre des véridiques. »'
- ref: S.12:52
  ar: ذَٰلِكَ لِيَعْلَمَ أَنِّي لَمْ أَخُنْهُ بِالْغَيْبِ وَأَنَّ اللَّهَ لَا يَهْدِي كَيْدَ الْخَائِنِينَ
  trl: Dhālika li-yaʿlama annī lam akhunhu bi-l-ghaybi wa-anna llāha lā yahdī kayda l-khāʾinīn
  trad: « Cela, pour qu'il sache que je ne l'ai pas trahi en son absence (*bi-l-ghayb*), et qu'Allaah ne guide pas la manœuvre des traîtres. »
- ref: S.12:53
  ar: ۞ وَمَا أُبَرِّئُ نَفْسِي ۚ إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي ۚ إِنَّ رَبِّي غَفُورٌ رَحِيمٌ
  trl: Wa-mā ubarriʾu nafsī inna n-nafsa la-ammāratun bi-s-sūʾi illā mā raḥima rabbī inna rabbī Ghafūrun Raḥīm
  trad: « Et je ne m'exonère pas moi-même (*mā ubarriʾu nafsī*) — la *nafs* est assurément instigatrice du mal (*la-ammāratun bi-s-sūʾ*), sauf ce à quoi mon Rabb accorde Sa *raḥma* — mon Rabb est certes Ghafūr, Raḥīm. »
- ref: S.12:54
  ar: وَقَالَ الْمَلِكُ ائْتُونِي بِهِ أَسْتَخْلِصْهُ لِنَفْسِي ۖ فَلَمَّا كَلَّمَهُ قَالَ إِنَّكَ الْيَوْمَ لَدَيْنَا مَكِينٌ أَمِينٌ
  trl: Wa-qāla l-maliku ʾtūnī bihi astakhliṣhu li-nafsī fa-lammā kallamahu qāla innaka l-yawma ladaynā makīnun amīn
  trad: 'Et le roi dit : « Amenez-le-moi, je me l''attacherai en propre (*astakhliṣhu li-nafsī*). » Puis, quand il lui eut parlé, il dit : « Tu es aujourd''hui, auprès de nous, en position d''assise et de confiance (*makīnun amīn*). »'
- ref: S.12:55
  ar: قَالَ اجْعَلْنِي عَلَىٰ خَزَائِنِ الْأَرْضِ ۖ إِنِّي حَفِيظٌ عَلِيمٌ
  trl: Qāla jʿalnī ʿalā khazāʾini l-arḍi innī ḥafīẓun ʿalīm
  trad: 'Il dit : « Place-moi à la tête des trésors de la terre (*khazāʾini l-arḍ*) — je suis certes gardien (*ḥafīẓ*), connaissant (*ʿalīm*). »'
- ref: S.12:56
  ar: وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَاءُ ۚ نُصِيبُ بِرَحْمَتِنَا مَنْ نَشَاءُ ۖ وَلَا نُضِيعُ أَجْرَ الْمُحْسِنِينَ
  trl: Wa-kadhālika makkannā li-yūsufa fi l-arḍi yatabawwaʾu minhā ḥaythu yashāʾu nuṣību bi-raḥmatinā man nashāʾu wa-lā nuḍīʿu ajra l-muḥsinīn
  trad: 'Ainsi avons-Nous affermi (*makkannā*) Yūsuf sur cette terre : il s''y établissait (*yatabawwaʾu*) où il le voulait — Nous atteignons de Notre *raḥma* qui Nous voulons, et Nous ne laissons pas se perdre la rétribution des *muḥsinūn*.'
- ref: S.12:57
  ar: وَلَأَجْرُ الْآخِرَةِ خَيْرٌ لِلَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ
  trl: Wa-la-ajru l-ākhirati khayrun li-lladhīna āmanū wa-kānū yattaqūn
  trad: Et la rétribution de l'Ākhira est certes meilleure pour ceux qui ont cru et qui craignaient avec constance (*kānū yattaqūn*).
- ref: S.12:58
  ar: وَجَاءَ إِخْوَةُ يُوسُفَ فَدَخَلُوا عَلَيْهِ فَعَرَفَهُمْ وَهُمْ لَهُ مُنْكِرُونَ
  trl: Wa-jāʾa ikhwatu yūsufa fa-dakhalū ʿalayhi fa-ʿarafahum wa-hum lahu munkirūn
  trad: Et les frères (*ikhwa*) de Yūsuf vinrent et entrèrent auprès de lui ; il les reconnut (*ʿarafahum*), alors qu'eux ne le reconnaissaient pas (*munkirūn*).
- ref: S.12:59–60
  ar: وَلَمَّا جَهَّزَهُمْ بِجَهَازِهِمْ قَالَ ائْتُونِي بِأَخٍ لَكُمْ مِنْ أَبِيكُمْ ۚ أَلَا تَرَوْنَ أَنِّي أُوفِي الْكَيْلَ وَأَنَا خَيْرُ الْمُنْزِلِينَ ۝ فَإِنْ لَمْ تَأْتُونِي بِهِ فَلَا كَيْلَ لَكُمْ عِنْدِي وَلَا تَقْرَبُونِ
  trl: Wa-lammā jahhazahum bi-jahāzihim qāla ʾtūnī bi-akhin lakum min abīkum a-lā tarawna annī ūfī l-kayla wa-anā khayru l-munzilīn — fa-in lam taʾtūnī bihi falā kayla lakum ʿindī wa-lā taqrabūn
  trad: 'Et lorsqu''il les eut pourvus de leurs provisions (*jahhazahum bi-jahāzihim*), il dit : « Amenez-moi un frère à vous, de votre père (*min abīkum*) — ne voyez-vous pas que je donne pleine mesure (*ūfī l-kayl*) et que je suis le meilleur des hôtes (*khayru l-munzilīn*) ? Si vous ne me l''amenez pas, nulle mesure pour vous auprès de moi, et n''approchez plus de moi. »'
- ref: S.12:61
  ar: قَالُوا سَنُرَاوِدُ عَنْهُ أَبَاهُ وَإِنَّا لَفَاعِلُونَ
  trl: Qālū sa-nurāwidu ʿanhu abāhu wa-innā la-fāʿilūn
  trad: 'Ils dirent : « Nous chercherons à l''obtenir de son père (*sa-nurāwidu ʿanhu abāhu*), et nous le ferons certainement. »'
- ref: S.12:62
  ar: وَقَالَ لِفِتْيَانِهِ اجْعَلُوا بِضَاعَتَهُمْ فِي رِحَالِهِمْ لَعَلَّهُمْ يَعْرِفُونَهَا إِذَا انْقَلَبُوا إِلَىٰ أَهْلِهِمْ لَعَلَّهُمْ يَرْجِعُونَ
  trl: Wa-qāla li-fityānihi jʿalū biḍāʿatahum fī riḥālihim laʿallahum yaʿrifūnahā idhā nqalabū ilā ahlihim laʿallahum yarjiʿūn
  trad: 'Et il dit à ses jeunes serviteurs (*fityān*) : « Remettez leur marchandise (*biḍāʿa*) dans leurs bagages (*riḥāl*), afin qu''ils la reconnaissent lorsqu''ils seront retournés vers les leurs — afin qu''ils reviennent. »'
- ref: S.12:63
  ar: فَلَمَّا رَجَعُوا إِلَىٰ أَبِيهِمْ قَالُوا يَا أَبَانَا مُنِعَ مِنَّا الْكَيْلُ فَأَرْسِلْ مَعَنَا أَخَانَا نَكْتَلْ وَإِنَّا لَهُ لَحَافِظُونَ
  trl: Fa-lammā rajaʿū ilā abīhim qālū yā abānā muniʿa minnā l-kaylu fa-arsil maʿanā akhānā naktal wa-innā lahu la-ḥāfiẓūn
  trad: 'Puis, lorsqu''ils furent retournés vers leur père, ils dirent : « Ô notre père, la mesure nous a été refusée (*muniʿa minnā l-kayl*) ; envoie donc notre frère avec nous, nous obtiendrons notre mesure (*naktal*) — nous en sommes certes gardiens (*la-ḥāfiẓūn*). »'
- ref: S.12:64
  ar: قَالَ هَلْ آمَنُكُمْ عَلَيْهِ إِلَّا كَمَا أَمِنْتُكُمْ عَلَىٰ أَخِيهِ مِنْ قَبْلُ ۖ فَاللَّهُ خَيْرٌ حَافِظًا ۖ وَهُوَ أَرْحَمُ الرَّاحِمِينَ
  trl: Qāla hal āmanukum ʿalayhi illā kamā amintukum ʿalā akhīhi min qablu fa-llāhu khayrun ḥāfiẓan wa-huwa arḥamu r-rāḥimīn
  trad: 'Il dit : « Vous ferai-je confiance (*āmanukum*) à son sujet, autrement que je vous ai fait confiance au sujet de son frère auparavant ? Allaah est meilleur gardien (*khayrun ḥāfiẓan*), et Il surpasse en raḥma tout ce qui peut en témoigner (*arḥamu r-rāḥimīn*). »'
- ref: S.12:65
  ar: وَلَمَّا فَتَحُوا مَتَاعَهُمْ وَجَدُوا بِضَاعَتَهُمْ رُدَّتْ إِلَيْهِمْ ۖ قَالُوا يَا أَبَانَا مَا نَبْغِي ۖ هَٰذِهِ بِضَاعَتُنَا رُدَّتْ إِلَيْنَا ۖ وَنَمِيرُ أَهْلَنَا وَنَحْفَظُ أَخَانَا وَنَزْدَادُ كَيْلَ بَعِيرٍ ۖ ذَٰلِكَ كَيْلٌ يَسِيرٌ
  trl: Wa-lammā fataḥū matāʿahum wajadū biḍāʿatahum ruddat ilayhim qālū yā abānā mā nabghī hādhihi biḍāʿatunā ruddat ilaynā wa-namīru ahlanā wa-naḥfaẓu akhānā wa-nazdādu kayla baʿīrin dhālika kaylun yasīr
  trad: 'Et lorsqu''ils ouvrirent leurs affaires (*matāʿ*), ils trouvèrent que leur marchandise leur avait été rendue. Ils dirent : « Ô notre père, que pourrions-nous désirer de plus (*mā nabghī*) ? Voici notre marchandise, elle nous a été rendue ; nous approvisionnerons (*namīru*) notre famille, nous garderons notre frère, et nous obtiendrons une mesure de chameau supplémentaire (*kayla baʿīr*) — voilà une mesure aisée. »'
- ref: S.12:66
  ar: قَالَ لَنْ أُرْسِلَهُ مَعَكُمْ حَتَّىٰ تُؤْتُونِ مَوْثِقًا مِنَ اللَّهِ لَتَأْتُنَّنِي بِهِ إِلَّا أَنْ يُحَاطَ بِكُمْ ۖ فَلَمَّا آتَوْهُ مَوْثِقَهُمْ قَالَ اللَّهُ عَلَىٰ مَا نَقُولُ وَكِيلٌ
  trl: Qāla lan ursilahu maʿakum ḥattā tuʾtūni mawthiqan mina llāhi la-taʾtunnanī bihi illā an yuḥāṭa bikum fa-lammā ātawhu mawthiqahum qāla llāhu ʿalā mā naqūlu wakīl
  trad: 'Il dit : « Je ne l''enverrai pas avec vous, jusqu''à ce que vous me donniez un engagement solennel (*mawthiq*) devant Allaah, [par lequel] vous me l''amènerez à coup sûr — à moins que vous ne soyez cernés (*illā an yuḥāṭa bikum*). » Puis, lorsqu''ils lui eurent donné leur engagement, il dit : « Allaah est garant (*wakīl*) de ce que nous disons. »'
- ref: S.12:67
  ar: وَقَالَ يَا بَنِيَّ لَا تَدْخُلُوا مِنْ بَابٍ وَاحِدٍ وَادْخُلُوا مِنْ أَبْوَابٍ مُتَفَرِّقَةٍ ۖ وَمَا أُغْنِي عَنْكُمْ مِنَ اللَّهِ مِنْ شَيْءٍ ۖ إِنِ الْحُكْمُ إِلَّا لِلَّهِ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَعَلَيْهِ فَلْيَتَوَكَّلِ الْمُتَوَكِّلُونَ
  trl: Wa-qāla yā baniyya lā tadkhulū min bābin wāḥidin wa-dkhulū min abwābin mutafarriqatin wa-mā ughnī ʿankum mina llāhi min shayʾin ini l-ḥukmu illā li-llāhi ʿalayhi tawakkaltu wa-ʿalayhi fal-yatawakkali l-mutawakkilūn
  trad: 'Et il dit : « Ô mes fils (*yā baniyya*), n''entrez pas par une seule porte, mais entrez par des portes séparées (*abwābin mutafarriqatin*) — et je ne puis rien pour vous (*mā ughnī ʿankum*) face à Allaah, en quoi que ce soit. Le *ḥukm* n''appartient qu''à Allaah : c''est en Lui que je place ma confiance (*tawakkaltu*), et c''est en Lui que doivent placer leur confiance ceux qui placent leur confiance. »'
- ref: S.12:68
  ar: وَلَمَّا دَخَلُوا مِنْ حَيْثُ أَمَرَهُمْ أَبُوهُمْ مَا كَانَ يُغْنِي عَنْهُمْ مِنَ اللَّهِ مِنْ شَيْءٍ إِلَّا حَاجَةً فِي نَفْسِ يَعْقُوبَ قَضَاهَا ۚ وَإِنَّهُ لَذُو عِلْمٍ لِمَا عَلَّمْنَاهُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ
  trl: Wa-lammā dakhalū min ḥaythu amarahum abūhum mā kāna yughnī ʿanhum mina llāhi min shayʾin illā ḥājatan fī nafsi yaʿqūba qaḍāhā wa-innahu la-dhū ʿilmin li-mā ʿallamnāhu wa-lākinna akthara n-nāsi lā yaʿlamūn
  trad: Et lorsqu'ils furent entrés comme leur père le leur avait ordonné, cela ne leur servait en rien (*mā kāna yughnī ʿanhum*) face à Allaah — si ce n'est un besoin dans l'âme de Yaʿqūb, qu'il satisfit ainsi (*ḥājatan fī nafsihi qaḍāhā*) ; et il était certes détenteur d'une science pour ce que Nous lui avions enseigné — mais la plupart des gens ne savent pas.
- ref: S.12:69
  ar: وَلَمَّا دَخَلُوا عَلَىٰ يُوسُفَ آوَىٰ إِلَيْهِ أَخَاهُ ۖ قَالَ إِنِّي أَنَا أَخُوكَ فَلَا تَبْتَئِسْ بِمَا كَانُوا يَعْمَلُونَ
  trl: Wa-lammā dakhalū ʿalā yūsufa āwā ilayhi akhāhu qāla innī anā akhūka fa-lā tabtaʾis bi-mā kānū yaʿmalūn
  trad: 'Et lorsqu''ils furent entrés auprès de Yūsuf, il accueillit son frère auprès de lui (*āwā ilayhi akhāhu*) ; il dit : « C''est moi, moi ton frère — ne t''afflige donc pas (*fa-lā tabtaʾis*) pour ce qu''ils faisaient. »'
- ref: S.12:70
  ar: فَلَمَّا جَهَّزَهُمْ بِجَهَازِهِمْ جَعَلَ السِّقَايَةَ فِي رَحْلِ أَخِيهِ ثُمَّ أَذَّنَ مُؤَذِّنٌ أَيَّتُهَا الْعِيرُ إِنَّكُمْ لَسَارِقُونَ
  trl: Fa-lammā jahhazahum bi-jahāzihim jaʿala s-siqāyata fī raḥli akhīhi thumma adhdhana muʾadhdhinun ayyatuha l-ʿīru innakum la-sāriqūn
  trad: 'Puis, lorsqu''il les eut pourvus de leurs provisions, il plaça la coupe (*as-siqāya*) dans le bagage de son frère. Puis un héraut annonça (*adhdhana muʾadhdhinun*) : « Ô caravane (*al-ʿīr*), vous êtes assurément des voleurs (*sāriqūn*) ! »'
- ref: S.12:71–72
  ar: قَالُوا وَأَقْبَلُوا عَلَيْهِمْ مَاذَا تَفْقِدُونَ ۝ قَالُوا نَفْقِدُ صُوَاعَ الْمَلِكِ وَلِمَنْ جَاءَ بِهِ حِمْلُ بَعِيرٍ وَأَنَا بِهِ زَعِيمٌ
  trl: Qālū wa-aqbalū ʿalayhim mādhā tafqidūn — qālū nafqidu ṣuwāʿa l-maliki wa-li-man jāʾa bihi ḥimlu baʿīrin wa-anā bihi zaʿīm
  trad: 'Ils dirent, se tournant vers eux (*wa-aqbalū ʿalayhim*) : « Que cherchez-vous, que vous avez perdu (*mādhā tafqidūn*) ? » Ils dirent : « Nous cherchons la coupe du roi (*ṣuwāʿ al-malik*) ; à qui l''apportera, une charge de chameau [comme récompense] — et j''en suis le garant (*zaʿīm*). »'
- ref: S.12:73
  ar: قَالُوا تَاللَّهِ لَقَدْ عَلِمْتُمْ مَا جِئْنَا لِنُفْسِدَ فِي الْأَرْضِ وَمَا كُنَّا سَارِقِينَ
  trl: Qālū ta-llāhi laqad ʿalimtum mā jiʾnā li-nufsida fi l-arḍi wa-mā kunnā sāriqīn
  trad: 'Ils dirent : « Par Allaah (*ta-llāhi*), vous savez bien que nous ne sommes pas venus pour semer la corruption (*li-nufsida*) sur la terre, et que nous ne sommes pas des voleurs. »'
- ref: S.12:74–75
  ar: قَالُوا فَمَا جَزَاؤُهُ إِنْ كُنْتُمْ كَاذِبِينَ ۝ قَالُوا جَزَاؤُهُ مَنْ وُجِدَ فِي رَحْلِهِ فَهُوَ جَزَاؤُهُ ۚ كَذَٰلِكَ نَجْزِي الظَّالِمِينَ
  trl: Qālū fa-mā jazāʾuhu in kuntum kādhibīn — qālū jazāʾuhu man wujida fī raḥlihi fa-huwa jazāʾuhu kadhālika najzi ẓ-ẓālimīn
  trad: 'Ils [les Égyptiens] dirent : « Quelle sera donc sa rétribution (*jazāʾ*), si vous êtes menteurs ? » Ils [les frères] dirent : « Sa rétribution : celui dans le bagage de qui elle sera trouvée — lui-même sera cette rétribution. C''est ainsi que nous rétribuons les injustes (*aẓ-ẓālimīn*). »'
- ref: S.12:76
  ar: فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَاءِ أَخِيهِ ثُمَّ اسْتَخْرَجَهَا مِنْ وِعَاءِ أَخِيهِ ۚ كَذَٰلِكَ كِدْنَا لِيُوسُفَ ۖ مَا كَانَ لِيَأْخُذَ أَخَاهُ فِي دِينِ الْمَلِكِ إِلَّا أَنْ يَشَاءَ اللَّهُ ۚ نَرْفَعُ دَرَجَاتٍ مَنْ نَشَاءُ ۗ وَفَوْقَ كُلِّ ذِي عِلْمٍ عَلِيمٌ
  trl: Fa-badaʾa bi-awʿiyatihim qabla wiʿāʾi akhīhi thumma-stakhrajahā min wiʿāʾi akhīhi kadhālika kidnā li-yūsufa mā kāna li-yaʾkhudha akhāhu fī dīni l-maliki illā an yashāʾa llāhu narfaʿu darajātin man nashāʾu wa-fawqa kulli dhī ʿilmin ʿalīm
  trad: 'Il commença par leurs bagages (*awʿiya*) avant le bagage de son frère, puis il l''extirpa du bagage de son frère — ainsi avons-Nous manœuvré (*kidnā*) en faveur de Yūsuf : il ne lui était pas possible de retenir son frère selon le *dīn* du roi, à moins qu''Allaah ne l''ait voulu. Nous élevons en degrés (*narfaʿu darajātin*) qui Nous voulons, et au-dessus (*fawqa*) de tout détenteur de science, il en est un qui connaît davantage.'
- ref: S.12:77
  ar: ۞ قَالُوا إِنْ يَسْرِقْ فَقَدْ سَرَقَ أَخٌ لَهُ مِنْ قَبْلُ ۚ فَأَسَرَّهَا يُوسُفُ فِي نَفْسِهِ وَلَمْ يُبْدِهَا لَهُمْ ۚ قَالَ أَنْتُمْ شَرٌّ مَكَانًا ۖ وَاللَّهُ أَعْلَمُ بِمَا تَصِفُونَ
  trl: Qālū in yasriq fa-qad saraqa akhun lahu min qablu fa-asarrahā yūsufu fī nafsihi wa-lam yubdihā lahum qāla antum sharrun makānan wa-llāhu aʿlamu bi-mā taṣifūn
  trad: 'Ils dirent : « S''il a volé, un frère à lui a volé auparavant. » Mais Yūsuf tint cela secret en lui-même (*fa-asarrahā fī nafsihi*) et ne le leur révéla pas (*wa-lam yubdihā lahum*) ; il dit [en lui-même] : « Vous êtes les pires quant à la position (*sharrun makānan*) — et Allaah connaît mieux ce que vous décrivez (*taṣifūn*). »'
- ref: S.12:78
  ar: قَالُوا يَا أَيُّهَا الْعَزِيزُ إِنَّ لَهُ أَبًا شَيْخًا كَبِيرًا فَخُذْ أَحَدَنَا مَكَانَهُ ۖ إِنَّا نَرَاكَ مِنَ الْمُحْسِنِينَ
  trl: Qālū yā ayyuha l-ʿazīzu inna lahu aban shaykhan kabīran fa-khudh aḥadanā makānahu innā narāka mina l-muḥsinīn
  trad: 'Ils dirent : « Ô al-ʿAzīz, il a un père, un vieillard âgé (*shaykhan kabīran*) — prends l''un de nous à sa place. Nous te voyons certes du nombre des *muḥsinūn*. »'
- ref: S.12:79
  ar: قَالَ مَعَاذَ اللَّهِ أَنْ نَأْخُذَ إِلَّا مَنْ وَجَدْنَا مَتَاعَنَا عِنْدَهُ إِنَّا إِذًا لَظَالِمُونَ
  trl: Qāla maʿādha llāhi an naʾkhudha illā man wajadnā matāʿanā ʿindahu innā idhan la-ẓālimūn
  trad: 'Il dit : « Qu''Allaah nous en préserve (*maʿādha llāh*) que nous prenions un autre que celui chez qui nous avons trouvé notre bien — nous serions alors assurément du nombre des injustes (*la-ẓālimūn*). »'
- ref: S.12:80
  ar: فَلَمَّا اسْتَيْأَسُوا مِنْهُ خَلَصُوا نَجِيًّا ۖ قَالَ كَبِيرُهُمْ أَلَمْ تَعْلَمُوا أَنَّ أَبَاكُمْ قَدْ أَخَذَ عَلَيْكُمْ مَوْثِقًا مِنَ اللَّهِ وَمِنْ قَبْلُ مَا فَرَّطْتُمْ فِي يُوسُفَ ۖ فَلَنْ أَبْرَحَ الْأَرْضَ حَتَّىٰ يَأْذَنَ لِي أَبِي أَوْ يَحْكُمَ اللَّهُ لِي ۖ وَهُوَ خَيْرُ الْحَاكِمِينَ
  trl: Fa-lammā stayʾasū minhu khalaṣū najiyyan qāla kabīruhum a-lam taʿlamū anna abākum qad akhadha ʿalaykum mawthiqan mina llāhi wa-min qablu mā farraṭtum fī yūsufa fa-lan abraḥa l-arḍa ḥattā yaʾdhana lī abī aw yaḥkuma llāhu lī wa-huwa khayru l-ḥākimīn
  trad: 'Puis, lorsqu''ils eurent perdu tout espoir (*istayʾasū*) à son sujet, ils se retirèrent à l''écart pour se concerter (*khalaṣū najiyyan*). L''aîné d''entre eux (*kabīruhum*) dit : « Ne savez-vous pas que votre père a pris de vous un engagement solennel (*mawthiqan*) devant Allaah, et qu''auparavant déjà vous avez manqué à votre devoir (*farraṭtum*) au sujet de Yūsuf ? Je ne quitterai donc pas cette terre (*lan abraḥa l-arḍa*), jusqu''à ce que mon père me l''autorise, ou qu''Allaah juge (*yaḥkuma*) en ma faveur — Il est le meilleur des juges. »'
- ref: S.12:81–82
  ar: ارْجِعُوا إِلَىٰ أَبِيكُمْ فَقُولُوا يَا أَبَانَا إِنَّ ابْنَكَ سَرَقَ وَمَا شَهِدْنَا إِلَّا بِمَا عَلِمْنَا وَمَا كُنَّا لِلْغَيْبِ حَافِظِينَ ۝ وَاسْأَلِ الْقَرْيَةَ الَّتِي كُنَّا فِيهَا وَالْعِيرَ الَّتِي أَقْبَلْنَا فِيهَا ۖ وَإِنَّا لَصَادِقُونَ
  trl: Irjiʿū ilā abīkum fa-qūlū yā abānā inna bnaka saraqa wa-mā shahidnā illā bi-mā ʿalimnā wa-mā kunnā li-l-ghaybi ḥāfiẓīn — wa-sʾali l-qaryata llatī kunnā fīhā wa-l-ʿīra llatī aqbalnā fīhā wa-innā la-ṣādiqūn
  trad: '« Retournez vers votre père, et dites-lui : Ô notre père, ton fils a volé ; nous n''avons témoigné que de ce que nous avons su (*bi-mā ʿalimnā*), et nous n''étions pas gardiens du *ghayb* (*li-l-ghaybi ḥāfiẓīn*). Interroge la cité (*al-qarya*) où nous étions, ainsi que la caravane (*al-ʿīr*) avec laquelle nous sommes arrivés — nous disons certes vrai. »'
- ref: S.12:83
  ar: قَالَ بَلْ سَوَّلَتْ لَكُمْ أَنْفُسُكُمْ أَمْرًا ۖ فَصَبْرٌ جَمِيلٌ ۖ عَسَى اللَّهُ أَنْ يَأْتِيَنِي بِهِمْ جَمِيعًا ۚ إِنَّهُ هُوَ الْعَلِيمُ الْحَكِيمُ
  trl: Qāla bal sawwalat lakum anfusukum amran fa-ṣabrun jamīlun ʿasā llāhu an yaʾtiyanī bihim jamīʿan innahu huwa l-ʿalīmu l-ḥakīm
  trad: 'Il dit : « Non — vos âmes vous ont enjolivé (*sawwalat*) une affaire. Patience belle (*ṣabrun jamīl*), donc ! Il se peut qu''Allaah me les ramène tous ensemble (*jamīʿan*) — Il est *al-ʿAlīm*, *al-Ḥakīm*. »'
- ref: S.12:84
  ar: وَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا أَسَفَىٰ عَلَىٰ يُوسُفَ وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ
  trl: Wa-tawallā ʿanhum wa-qāla yā asafā ʿalā yūsufa wa-btaḍḍat ʿaynāhu mina l-ḥuzni fa-huwa kaẓīm
  trad: 'Et il se détourna d''eux (*tawallā ʿanhum*), et dit : « Ô, quel regret (*yā asafā*) pour Yūsuf ! » — et ses yeux blanchirent (*ibyaḍḍat*) sous l''effet du chagrin (*ḥuzn*), tant il retenait sa peine en lui sans l''extérioriser (*kaẓīm*).'
- ref: S.12:85–86
  ar: قَالُوا تَاللَّهِ تَفْتَأُ تَذْكُرُ يُوسُفَ حَتَّىٰ تَكُونَ حَرَضًا أَوْ تَكُونَ مِنَ الْهَالِكِينَ ۝ قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ
  trl: Qālū ta-llāhi tafta'u tadhkuru yūsufa ḥattā takūna ḥaraḍan aw takūna mina l-hālikīn — qāla innamā ashkū baththī wa-ḥuznī ilā llāhi wa-aʿlamu mina llāhi mā lā taʿlamūn
  trad: 'Ils dirent : « Par Allaah, tu ne cesseras (*tafta''u*) de mentionner Yūsuf, jusqu''à ce que tu deviennes exténué de langueur (*ḥaraḍan*), ou que tu sois du nombre de ceux qui périssent. » Il dit : « Je ne me plains (*ashkū*) de mon tourment intérieur (*baththī*) et de mon chagrin (*ḥuznī*) qu''à Allaah seul (*innamā ... ilā llāh*) — et je sais, de la part d''Allaah, ce que vous ne savez pas. »'
- ref: S.12:87
  ar: يَا بَنِيَّ اذْهَبُوا فَتَحَسَّسُوا مِنْ يُوسُفَ وَأَخِيهِ وَلَا تَيْأَسُوا مِنْ رَوْحِ اللَّهِ ۖ إِنَّهُ لَا يَيْأَسُ مِنْ رَوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ
  trl: Yā baniyya dhhabū fa-taḥassasū min yūsufa wa-akhīhi wa-lā tayʾasū min rawḥi llāhi innahu lā yayʾasu min rawḥi llāhi illā l-qawmu l-kāfirūn
  trad: « Ô mes fils, partez et enquérez-vous avec attention (*taḥassasū*) de Yūsuf et de son frère, et ne désespérez pas de l'issue favorable qui vient d'Allaah (*rawḥ Allaah*) — nul ne désespère de l'issue favorable qui vient d'Allaah, sinon le peuple des *kāfirūn*. »
- ref: S.12:88
  ar: فَلَمَّا دَخَلُوا عَلَيْهِ قَالُوا يَا أَيُّهَا الْعَزِيزُ مَسَّنَا وَأَهْلَنَا الضُّرُّ وَجِئْنَا بِبِضَاعَةٍ مُزْجَاةٍ فَأَوْفِ لَنَا الْكَيْلَ وَتَصَدَّقْ عَلَيْنَا ۖ إِنَّ اللَّهَ يَجْزِي الْمُتَصَدِّقِينَ
  trl: Fa-lammā dakhalū ʿalayhi qālū yā ayyuha l-ʿazīzu massanā wa-ahlanā ḍ-ḍurru wa-jiʾnā bi-biḍāʿatin muzjātin fa-awfi lanā l-kayla wa-taṣaddaq ʿalaynā inna llāha yajzī l-mutaṣaddiqīn
  trad: 'Puis, lorsqu''ils furent entrés auprès de lui, ils dirent : « Ô al-ʿAzīz, le malheur (*aḍ-ḍurr*) nous a touchés, nous et notre famille, et nous sommes venus avec une marchandise de peu de valeur (*biḍāʿatin muzjātin*) — donne-nous donc pleine mesure, et fais-nous la charité (*taṣaddaq ʿalaynā*) — Allaah rétribue certes ceux qui font la charité (*al-mutaṣaddiqīn*). »'
- ref: S.12:89
  ar: قَالَ هَلْ عَلِمْتُمْ مَا فَعَلْتُمْ بِيُوسُفَ وَأَخِيهِ إِذْ أَنْتُمْ جَاهِلُونَ
  trl: Qāla hal ʿalimtum mā faʿaltum bi-yūsufa wa-akhīhi idh antum jāhilūn
  trad: 'Il dit : « Savez-vous ce que vous avez fait à Yūsuf et à son frère, alors que vous étiez ignorants (*jāhilūn*) ? »'
- ref: S.12:90
  ar: قَالُوا أَإِنَّكَ لَأَنْتَ يُوسُفُ ۖ قَالَ أَنَا يُوسُفُ وَهَٰذَا أَخِي ۖ قَدْ مَنَّ اللَّهُ عَلَيْنَا ۖ إِنَّهُ مَنْ يَتَّقِ وَيَصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ
  trl: Qālū a-innaka la-anta yūsufu qāla anā yūsufu wa-hādhā akhī qad manna llāhu ʿalaynā innahu man yattaqi wa-yaṣbir fa-inna llāha lā yuḍīʿu ajra l-muḥsinīn
  trad: 'Ils dirent : « Serais-tu, toi, Yūsuf ? » Il dit : « Je suis Yūsuf, et voici mon frère — Allaah nous a certes accordé Sa faveur (*manna*) — quiconque a la *taqwā* et patiente (*yattaqi wa-yaṣbir*), Allaah ne laisse pas se perdre la rétribution des *muḥsinīn*. »'
- ref: S.12:91
  ar: قَالُوا تَاللَّهِ لَقَدْ آثَرَكَ اللَّهُ عَلَيْنَا وَإِنْ كُنَّا لَخَاطِئِينَ
  trl: Qālū ta-llāhi laqad ātharaka llāhu ʿalaynā wa-in kunnā la-khāṭiʾīn
  trad: 'Ils dirent : « Par Allaah, Allaah t''a certes préféré (*ātharaka*) à nous, et nous étions certes fautifs (*khāṭiʾīn*). »'
- ref: S.12:92
  ar: قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ ۖ يَغْفِرُ اللَّهُ لَكُمْ ۖ وَهُوَ أَرْحَمُ الرَّاحِمِينَ
  trl: Qāla lā tathrība ʿalaykumu l-yawma yaghfiru llāhu lakum wa-huwa arḥamu r-rāḥimīn
  trad: 'Il dit : « Nul reproche (*tathrīb*) sur vous aujourd''hui — qu''Allaah vous pardonne (*yaghfiru*) — et Il surpasse en *raḥma* tout ce qui peut en témoigner (*arḥamu r-rāḥimīn*). »'
- ref: S.12:93
  ar: اذْهَبُوا بِقَمِيصِي هَٰذَا فَأَلْقُوهُ عَلَىٰ وَجْهِ أَبِي يَأْتِ بَصِيرًا وَأْتُونِي بِأَهْلِكُمْ أَجْمَعِينَ
  trl: Idhhabū bi-qamīṣī hādhā fa-alqūhu ʿalā wajhi abī yaʾti baṣīran wa-ʾtūnī bi-ahlikum ajmaʿīn
  trad: « Partez avec cette chemise (*qamīṣī*) qui est mienne, et jetez-la sur le visage de mon père — il recouvrera la vue (*yaʾti baṣīran*). Et amenez-moi votre famille tout entière. »
- ref: S.12:94
  ar: وَلَمَّا فَصَلَتِ الْعِيرُ قَالَ أَبُوهُمْ إِنِّي لَأَجِدُ رِيحَ يُوسُفَ ۖ لَوْلَا أَنْ تُفَنِّدُونِ
  trl: Wa-lammā faṣalati l-ʿīru qāla abūhum innī la-ajidu rīḥa yūsufa lawlā an tufannidūn
  trad: 'Et lorsque la caravane (*al-ʿīr*) se fut séparée [de la cité], leur père dit : « Je perçois certes le parfum (*rīḥ*) de Yūsuf — n''était que vous alliez me tenir pour affaibli d''esprit (*tufannidūn*)... »'
- ref: S.12:95
  ar: قَالُوا تَاللَّهِ إِنَّكَ لَفِي ضَلَالِكَ الْقَدِيمِ
  trl: Qālū ta-llāhi innaka la-fī ḍalālika l-qadīm
  trad: 'Ils dirent : « Par Allaah, tu es certes encore dans ton ancien égarement (*ḍalālika l-qadīm*). »'
- ref: S.12:96
  ar: فَلَمَّا أَنْ جَاءَ الْبَشِيرُ أَلْقَاهُ عَلَىٰ وَجْهِهِ فَارْتَدَّ بَصِيرًا ۖ قَالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ
  trl: Fa-lammā an jāʾa l-bashīru alqāhu ʿalā wajhihi fa-rtadda baṣīran qāla a-lam aqul lakum innī aʿlamu mina llāhi mā lā taʿlamūn
  trad: 'Puis, lorsque le porteur de bonne nouvelle (*al-bashīr*) fut arrivé, il la jeta sur son visage, et il recouvra la vue (*irtadda baṣīran*). Il dit : « Ne vous avais-je pas dit que je sais, de la part d''Allaah, ce que vous ne savez pas ? »'
- ref: S.12:97–98
  ar: قَالُوا يَا أَبَانَا اسْتَغْفِرْ لَنَا ذُنُوبَنَا إِنَّا كُنَّا خَاطِئِينَ ۝ قَالَ سَوْفَ أَسْتَغْفِرُ لَكُمْ رَبِّي ۖ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ
  trl: Qālū yā abānā staghfir lanā dhunūbanā innā kunnā khāṭiʾīn — qāla sawfa astaghfiru lakum rabbī innahu huwa l-ghafūru r-raḥīm
  trad: 'Ils dirent : « Ô notre père, demande le pardon (*istaghfir*) pour nos fautes (*dhunūbanā*) — nous étions certes fautifs (*khāṭiʾīn*). » Il dit : « Je demanderai (*sawfa astaghfiru*) le pardon pour vous à mon Rabb — Il est *al-Ghafūr*, *ar-Raḥīm*. »'
- ref: S.12:99
  ar: فَلَمَّا دَخَلُوا عَلَىٰ يُوسُفَ آوَىٰ إِلَيْهِ أَبَوَيْهِ وَقَالَ ادْخُلُوا مِصْرَ إِنْ شَاءَ اللَّهُ آمِنِينَ
  trl: Fa-lammā dakhalū ʿalā yūsufa āwā ilayhi abawayhi wa-qāla dkhulū miṣra in shāʾa llāhu āminīn
  trad: 'Puis, lorsqu''ils furent entrés auprès de Yūsuf, il accueillit auprès de lui ses deux parents (*āwā ilayhi abawayhi*), et dit : « Entrez en Égypte, si Allaah le veut, en sécurité (*āminīn*). »'
- ref: S.12:100
  ar: وَرَفَعَ أَبَوَيْهِ عَلَى الْعَرْشِ وَخَرُّوا لَهُ سُجَّدًا ۖ وَقَالَ يَا أَبَتِ هَٰذَا تَأْوِيلُ رُؤْيَايَ مِنْ قَبْلُ قَدْ جَعَلَهَا رَبِّي حَقًّا ۖ وَقَدْ أَحْسَنَ بِي إِذْ أَخْرَجَنِي مِنَ السِّجْنِ وَجَاءَ بِكُمْ مِنَ الْبَدْوِ مِنْ بَعْدِ أَنْ نَزَغَ الشَّيْطَانُ بَيْنِي وَبَيْنَ إِخْوَتِي ۚ إِنَّ رَبِّي لَطِيفٌ لِمَا يَشَاءُ ۚ إِنَّهُ هُوَ الْعَلِيمُ الْحَكِيمُ
  trl: Wa-rafaʿa abawayhi ʿala l-ʿarshi wa-kharrū lahu sujjadan wa-qāla yā abati hādhā taʾwīlu ruʾyāya min qablu qad jaʿalahā rabbī ḥaqqan wa-qad aḥsana bī idh akhrajanī mina s-sijni wa-jāʾa bikum mina l-badwi min baʿdi an nazagha sh-shayṭānu baynī wa-bayna ikhwatī inna rabbī laṭīfun li-mā yashāʾu innahu huwa l-ʿalīmu l-ḥakīm
  trad: 'Et il éleva ses deux parents sur le trône (*al-ʿarsh*), et ils tombèrent devant lui, prosternés (*sujjadan*). Et il dit : « Ô mon père, voici l''aboutissement (*taʾwīl*) de mon songe d''autrefois — mon Rabb l''a rendu vrai (*ḥaqqan*). Il a bien agi envers moi (*aḥsana bī*) lorsqu''Il m''a fait sortir de la prison, et qu''Il vous a fait venir du désert (*al-badw*), après que le *shayṭān* eut semé la discorde (*nazagha*) entre moi et mes frères. Mon Rabb agit avec une précision imperceptible en ce qu''Il veut (*laṭīf*) — Il est *al-ʿAlīm*, *al-Ḥakīm*. »'
- ref: S.12:101
  ar: ۞ رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِنْ تَأْوِيلِ الْأَحَادِيثِ ۚ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنْتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ ۖ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ
  trl: Rabbi qad ātaytanī mina l-mulki wa-ʿallamtanī min taʾwīli l-aḥādīthi fāṭira s-samāwāti wa-l-arḍi anta waliyyī fi d-dunyā wa-l-ākhirati tawaffanī musliman wa-alḥiqnī bi-ṣ-ṣāliḥīn
  trad: « Mon Rabb, Tu m'as donné une part de la royauté (*mina l-mulk*), et Tu m'as enseigné une part de l'aboutissement des récits (*min taʾwīli l-aḥādīth*) — Ce qui a fait éclore (*Fāṭir*) les cieux et la terre, Tu es mon *walī* en ce bas monde et dans l'Ākhira. Fais-moi mourir soumis (*musliman*), et fais-moi rejoindre les justes (*aṣ-ṣāliḥīn*). »
- ref: S.12:102–103
  ar: ذَٰلِكَ مِنْ أَنْبَاءِ الْغَيْبِ نُوحِيهِ إِلَيْكَ ۖ وَمَا كُنْتَ لَدَيْهِمْ إِذْ أَجْمَعُوا أَمْرَهُمْ وَهُمْ يَمْكُرُونَ ۝ وَمَا أَكْثَرُ النَّاسِ وَلَوْ حَرَصْتَ بِمُؤْمِنِينَ
  trl: Dhālika min anbāʾi l-ghaybi nūḥīhi ilayka wa-mā kunta ladayhim idh ajmaʿū amrahum wa-hum yamkurūn — wa-mā aktharu n-nāsi wa-law ḥaraṣta bi-muʾminīn
  trad: Cela fait partie des annonces du *ghayb* (*anbāʾ al-ghayb*) que Nous te révélons — tu n'étais pas auprès d'eux quand ils arrêtèrent leur affaire (*ajmaʿū amrahum*), en train de manœuvrer (*yamkurūn*). Et la plupart des gens, même si tu le désirais ardemment (*ḥaraṣta*), ne sont pas croyants.
- ref: S.12:104
  ar: وَمَا تَسْأَلُهُمْ عَلَيْهِ مِنْ أَجْرٍ ۚ إِنْ هُوَ إِلَّا ذِكْرٌ لِلْعَالَمِينَ
  trl: Wa-mā tasʾaluhum ʿalayhi min ajrin in huwa illā dhikrun li-l-ʿālamīn
  trad: Et tu ne leur demandes, pour cela, aucun salaire (*ajr*) — ce n'est qu'un rappel (*dhikr*) pour les mondes (*al-ʿālamīn*).
- ref: S.12:105–106
  ar: وَكَأَيِّنْ مِنْ آيَةٍ فِي السَّمَاوَاتِ وَالْأَرْضِ يَمُرُّونَ عَلَيْهَا وَهُمْ عَنْهَا مُعْرِضُونَ ۝ وَمَا يُؤْمِنُ أَكْثَرُهُمْ بِاللَّهِ إِلَّا وَهُمْ مُشْرِكُونَ
  trl: Wa-kaʾayyin min āyatin fi s-samāwāti wa-l-arḍi yamurrūna ʿalayhā wa-hum ʿanhā muʿriḍūn — wa-mā yuʾminu aktharuhum bi-llāhi illā wa-hum mushrikūn
  trad: Et combien d'*āyāt*, dans les cieux et sur la terre, ils croisent (*yamurrūna ʿalayhā*), en s'en détournant (*muʿriḍūn*) ! Et la plupart d'entre eux ne croient en Allaah qu'en Lui associant [autre chose] (*illā wa-hum mushrikūn*).
- ref: S.12:107
  ar: أَفَأَمِنُوا أَنْ تَأْتِيَهُمْ غَاشِيَةٌ مِنْ عَذَابِ اللَّهِ أَوْ تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ
  trl: A-fa-aminū an taʾtiyahum ghāshiyatun min ʿadhābi llāhi aw taʾtiyahumu s-sāʿatu baghtatan wa-hum lā yashʿurūn
  trad: Se sentent-ils donc à l'abri (*a-fa-aminū*) qu'un châtiment enveloppant (*ghāshiya*) d'Allaah ne les atteigne, ou que l'Heure (*as-sāʿa*) ne leur vienne subitement (*baghtatan*), sans qu'ils s'en rendent compte ?
- ref: S.12:108
  ar: قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ ۚ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي ۖ وَسُبْحَانَ اللَّهِ وَمَا أَنَا مِنَ الْمُشْرِكِينَ
  trl: Qul hādhihi sabīlī adʿū ilā llāhi ʿalā baṣīratin anā wa-mani ttabaʿanī wa-subḥāna llāhi wa-mā anā mina l-mushrikīn
  trad: 'Dis : « Voici mon *sabīl* : j''appelle vers Allaah sur une clairvoyance (*ʿalā baṣīra*) — moi, et quiconque me suit. Gloire à Allaah (*subḥāna llāh*) — et je ne suis pas du nombre des *mushrikūn*. »'
- ref: S.12:109
  ar: وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ إِلَّا رِجَالًا نُوحِي إِلَيْهِمْ مِنْ أَهْلِ الْقُرَىٰ ۗ أَفَلَمْ يَسِيرُوا فِي الْأَرْضِ فَيَنْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الَّذِينَ مِنْ قَبْلِهِمْ ۗ وَلَدَارُ الْآخِرَةِ خَيْرٌ لِلَّذِينَ اتَّقَوْا ۗ أَفَلَا تَعْقِلُونَ
  trl: Wa-mā arsalnā min qablika illā rijālan nūḥī ilayhim min ahli l-qurā a-fa-lam yasīrū fi l-arḍi fa-yanẓurū kayfa kāna ʿāqibatu lladhīna min qablihim wa-la-dāru l-ākhirati khayrun li-lladhīna ttaqaw a-fa-lā taʿqilūn
  trad: Et Nous n'avons envoyé, avant toi, que des hommes (*rijāl*) auxquels Nous révélions, parmi les gens des cités (*min ahli l-qurā*) — n'ont-ils donc pas parcouru la terre, pour regarder ce qu'il est advenu de ceux d'avant eux ? Et la demeure de l'Ākhira (*dāru l-ākhira*) est certes meilleure pour ceux qui ont la *taqwā* — ne raisonnerez-vous donc pas ?
- ref: S.12:110
  ar: حَتَّىٰ إِذَا اسْتَيْأَسَ الرُّسُلُ وَظَنُّوا أَنَّهُمْ قَدْ كُذِبُوا جَاءَهُمْ نَصْرُنَا فَنُجِّيَ مَنْ نَشَاءُ ۖ وَلَا يُرَدُّ بَأْسُنَا عَنِ الْقَوْمِ الْمُجْرِمِينَ
  trl: Ḥattā idhā stayʾasa r-rusulu wa-ẓannū annahum qad kudhibū jāʾahum naṣrunā fa-nujjiya man nashāʾu wa-lā yuraddu baʾsunā ʿani l-qawmi l-mujrimīn
  trad: Jusqu'à ce que, lorsque les *rusul* désespérèrent (*istayʾasa*), et qu'ils pensèrent qu'on leur avait menti (*qad kudhibū*), Notre secours (*naṣrunā*) leur vint — et fut sauvé qui Nous avons voulu, et Notre rigueur (*baʾsunā*) ne se détourne pas du peuple des *mujrimūn*.
- ref: S.12:111
  ar: لَقَدْ كَانَ فِي قَصَصِهِمْ عِبْرَةٌ لِأُولِي الْأَلْبَابِ ۗ مَا كَانَ حَدِيثًا يُفْتَرَىٰ وَلَٰكِنْ تَصْدِيقَ الَّذِي بَيْنَ يَدَيْهِ وَتَفْصِيلَ كُلِّ شَيْءٍ وَهُدًى وَرَحْمَةً لِقَوْمٍ يُؤْمِنُونَ
  trl: La-qad kāna fī qaṣaṣihim ʿibratun li-ulī l-albābi mā kāna ḥadīthan yuftarā wa-lākin taṣdīqa lladhī bayna yadayhi wa-tafṣīla kulli shayʾin wa-hudan wa-raḥmatan li-qawmin yuʾminūn
  trad: Il y avait certes, dans leur récit (*qaṣaṣihim*), une leçon qui fait franchir un seuil (*ʿibra*) pour ceux qui sont dotés d'un noyau d'entendement (*ulī l-albāb*). Ce n'était pas un *ḥadīth* forgé (*yuftarā*), mais la confirmation de ce qui le précède (*taṣdīqa lladhī bayna yadayhi*), le détail de toute chose (*tafṣīl*), une guidance (*hudā*) et une *raḥma* pour un peuple qui croit.
