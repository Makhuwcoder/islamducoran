- ref: S.20:1
  ar: طه
  trl: Ṭā-Hā
  trad: Ṭā-Hā.
- ref: S.20:2
  ar: مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ
  trl: Mā anzalnā ʿalayka l-qurʾāna li-tashqā
  trad: Nous n'avons pas fait descendre sur toi le Qurʾān pour que tu sois affligé (*li-tashqā*),
- ref: S.20:3
  ar: إِلَّا تَذْكِرَةً لِمَنْ يَخْشَىٰ
  trl: Illā tadhkiratan li-man yakhshā
  trad: si ce n'est comme un rappel (*tadhkira*) pour qui redoute (*yakhshā*).
- ref: S.20:4
  ar: تَنْزِيلًا مِمَّنْ خَلَقَ الْأَرْضَ وَالسَّمَاوَاتِ الْعُلَى
  trl: Tanzīlan mimman khalaqa l-arḍa wa-s-samāwāti l-ʿulā
  trad: une descente (*tanzīl*) venant de Ce qui a créé la terre et les cieux élevés (*as-samāwāti l-ʿulā*).
- ref: S.20:5
  ar: الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ
  trl: Ar-Raḥmānu ʿalā l-ʿarshi stawā
  trad: Ar-Raḥmān a pris pleinement possession (*istawā*) du ʿArsh.
- ref: S.20:6
  ar: لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَمَا بَيْنَهُمَا وَمَا تَحْتَ الثَّرَىٰ
  trl: Lahu mā fi s-samāwāti wa-mā fi l-arḍi wa-mā baynahumā wa-mā taḥta th-tharā
  trad: À Lui appartient ce qui est dans les cieux, ce qui est sur la terre, ce qui est entre les deux, et ce qui est sous le sol humide (*ath-tharā*).
- ref: S.20:7
  ar: وَإِنْ تَجْهَرْ بِالْقَوْلِ فَإِنَّهُ يَعْلَمُ السِّرَّ وَأَخْفَى
  trl: Wa-in tajhar bi-l-qawli fa-innahu yaʿlamu s-sirra wa-akhfā
  trad: Et que tu élèves la voix (*tajhar*) ou non, Il connaît le secret (*as-sirr*) et ce qui est plus caché encore (*akhfā*).
- ref: S.20:8
  ar: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ
  trl: Allāhu lā ilāha illā huwa lahu l-asmāʾu l-ḥusnā
  trad: Allaah, nul *ilāh* que Lui — à Lui les Noms de la plus grande excellence (*al-asmāʾu l-ḥusnā*).
- ref: S.20:9
  ar: وَهَلْ أَتَاكَ حَدِيثُ مُوسَىٰ
  trl: Wa-hal atāka ḥadīthu mūsā
  trad: Et t'est-il parvenu le récit (*ḥadīth*) de Mūsā ?
- ref: S.20:10
  ar: إِذْ رَأَىٰ نَارًا فَقَالَ لِأَهْلِهِ امْكُثُوا إِنِّي آنَسْتُ نَارًا لَعَلِّي آتِيكُمْ مِنْهَا بِقَبَسٍ أَوْ أَجِدُ عَلَى النَّارِ هُدًى
  trl: Idh raʾā nāran fa-qāla li-ahlihi mkuthū innī ānastu nāran laʿallī ātīkum minhā bi-qabasin aw ajidu ʿalā n-nāri hudan
  trad: 'Quand il vit un feu et dit aux siens : « Demeurez [ici] — j''ai distinctement perçu (*ānastu*) un feu ; peut-être vous en apporterai-je un tison (*qabas*), ou trouverai-je, près de ce feu, une orientation (*hudan*). »'
- ref: S.20:11
  ar: فَلَمَّا أَتَاهَا نُودِيَ يَا مُوسَىٰ
  trl: Fa-lammā atāhā nūdiya yā mūsā
  trad: 'Puis, quand il y parvint, il fut appelé (*nūdiya*) : « Ô Mūsā ! »'
- ref: S.20:12
  ar: إِنِّي أَنَا رَبُّكَ فَاخْلَعْ نَعْلَيْكَ ۖ إِنَّكَ بِالْوَادِ الْمُقَدَّسِ طُوًى
  trl: Innī anā rabbuka fa-khlaʿ naʿlayka innaka bi-l-wādi l-muqaddasi ṭuwan
  trad: '« Je suis ton Rabb — retire donc tes deux sandales (*naʿlayka*) : tu es dans la vallée sanctifiée (*al-wādi l-muqaddas*), Ṭuwā. »'
- ref: S.20:13
  ar: وَأَنَا اخْتَرْتُكَ فَاسْتَمِعْ لِمَا يُوحَىٰ
  trl: Wa-ana khtartuka fa-stamiʿ li-mā yūḥā
  trad: « Et Moi, Je t'ai choisi (*ikhtartuka*) — écoute donc ce qui est révélé (*yūḥā*). »
- ref: S.20:14
  ar: إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي
  trl: Innanī anā llāhu lā ilāha illā anā fa-ʿbudnī wa-aqimi ṣ-ṣalāta li-dhikrī
  trad: '« Moi, en vérité, Je suis Allaah — nul *ilāh* que Moi : voue-Moi donc le culte, et accomplis la *ṣalāt* pour Mon rappel (*li-dhikrī*). »'
- ref: S.20:15
  ar: إِنَّ السَّاعَةَ آتِيَةٌ أَكَادُ أُخْفِيهَا لِتُجْزَىٰ كُلُّ نَفْسٍ بِمَا تَسْعَىٰ
  trl: Inna s-sāʿata ātiyatun akādu ukhfīhā li-tujzā kullu nafsin bi-mā tasʿā
  trad: « L'Heure vient certes — Je la tiens presque cachée (*akādu ukhfīhā*) — afin que chaque âme soit rétribuée selon ce qu'elle se sera efforcée de faire (*tasʿā*). »
- ref: S.20:16
  ar: فَلَا يَصُدَّنَّكَ عَنْهَا مَنْ لَا يُؤْمِنُ بِهَا وَاتَّبَعَ هَوَاهُ فَتَرْدَىٰ
  trl: Fa-lā yaṣuddannaka ʿanhā man lā yuʾminu bihā wa-ttabaʿa hawāhu fa-tardā
  trad: « Que ne te détourne donc pas de [croire en] elle qui n'y croit pas et suit son inclination (*hawāhu*) — tu serais alors perdu (*fa-tardā*). »
- ref: S.20:17
  ar: وَمَا تِلْكَ بِيَمِينِكَ يَا مُوسَىٰ
  trl: Wa-mā tilka bi-yamīnika yā mūsā
  trad: « Et qu'est-ce donc que cela, dans ta main droite, ô Mūsā ? »
- ref: S.20:18
  ar: قَالَ هِيَ عَصَايَ أَتَوَكَّأُ عَلَيْهَا وَأَهُشُّ بِهَا عَلَىٰ غَنَمِي وَلِيَ فِيهَا مَآرِبُ أُخْرَىٰ
  trl: Qāla hiya ʿaṣāya atawakkaʾu ʿalayhā wa-ahushshu bihā ʿalā ghanamī wa-liya fīhā maʾāribu ukhrā
  trad: 'Il dit : « C''est mon bâton (*ʿaṣāya*) — je m''appuie sur lui, j''en fais tomber le feuillage (*ahushshu*) pour mes brebis, et j''y trouve d''autres usages (*maʾārib*). »'
- ref: S.20:19
  ar: قَالَ أَلْقِهَا يَا مُوسَىٰ
  trl: Qāla alqihā yā mūsā
  trad: 'Il dit : « Jette-le, ô Mūsā. »'
- ref: S.20:20
  ar: فَأَلْقَاهَا فَإِذَا هِيَ حَيَّةٌ تَسْعَىٰ
  trl: Fa-alqāhā fa-idhā hiya ḥayyatun tasʿā
  trad: Il le jeta, et voici que c'était un serpent (*ḥayya*) qui se mouvait rapidement (*tasʿā*).
- ref: S.20:21
  ar: قَالَ خُذْهَا وَلَا تَخَفْ ۖ سَنُعِيدُهَا سِيرَتَهَا الْأُولَىٰ
  trl: Qāla khudhhā wa-lā takhaf sa-nuʿīduhā sīratahā l-ūlā
  trad: 'Il dit : « Saisis-le, et ne crains rien — Nous le ramènerons à son premier état (*sīratahā l-ūlā*). »'
- ref: S.20:22
  ar: وَاضْمُمْ يَدَكَ إِلَىٰ جَنَاحِكَ تَخْرُجْ بَيْضَاءَ مِنْ غَيْرِ سُوءٍ آيَةً أُخْرَىٰ
  trl: Wa-ḍmum yadaka ilā janāḥika takhruj bayḍāʾa min ghayri sūʾin āyatan ukhrā
  trad: '« Et serre ta main contre ton flanc (*janāḥika*) — elle en sortira blanche, sans mal aucun : un autre signe (*āya*). »'
- ref: S.20:23
  ar: لِنُرِيَكَ مِنْ آيَاتِنَا الْكُبْرَى
  trl: Li-nuriyaka min āyātinā l-kubrā
  trad: « Afin de te faire voir certains de Nos signes les plus grands (*āyātinā l-kubrā*). »
- ref: S.20:24
  ar: اذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ
  trl: Idhhab ilā firʿawna innahu ṭaghā
  trad: « Va vers Firʿawn — il a certes transgressé (*ṭaghā*). »
- ref: S.20:25
  ar: قَالَ رَبِّ اشْرَحْ لِي صَدْرِي
  trl: Qāla rabbi shraḥ lī ṣadrī
  trad: 'Il dit : « Mon Rabb, donne de l''ampleur à ma poitrine (*ishraḥ lī ṣadrī*),'
- ref: S.20:26
  ar: وَيَسِّرْ لِي أَمْرِي
  trl: Wa-yassir lī amrī
  trad: et facilite-moi ma tâche (*yassir lī amrī*),
- ref: S.20:27
  ar: وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي
  trl: Wa-ḥlul ʿuqdatan min lisānī
  trad: et dénoue un nœud (*ʿuqda*) de ma langue,
- ref: S.20:28
  ar: يَفْقَهُوا قَوْلِي
  trl: Yafqahū qawlī
  trad: afin qu'ils comprennent en profondeur (*yafqahū*) ma parole. »
- ref: S.20:29
  ar: وَاجْعَلْ لِي وَزِيرًا مِنْ أَهْلِي
  trl: Wa-jʿal lī wazīran min ahlī
  trad: « Et établis pour moi un *wazīr* issu des miens,
- ref: S.20:30
  ar: هَارُونَ أَخِي
  trl: Hārūna akhī
  trad: Hārūn, mon frère,
- ref: S.20:31
  ar: اشْدُدْ بِهِ أَزْرِي
  trl: Shdud bihi azrī
  trad: affermis par lui ma force (*azrī*),
- ref: S.20:32
  ar: وَأَشْرِكْهُ فِي أَمْرِي
  trl: Wa-ashrikhu fī amrī
  trad: et associe-le (*ashrikhu*) à ma tâche,
- ref: S.20:33
  ar: كَيْ نُسَبِّحَكَ كَثِيرًا
  trl: Kay nusabbiḥaka kathīrā
  trad: afin que nous Te glorifions (*nusabbiḥaka*) beaucoup,
- ref: S.20:34
  ar: وَنَذْكُرَكَ كَثِيرًا
  trl: Wa-nadhkuraka kathīrā
  trad: et que nous fassions beaucoup Ton rappel (*nadhkuraka*),
- ref: S.20:35
  ar: إِنَّكَ كُنْتَ بِنَا بَصِيرًا
  trl: Innaka kunta binā baṣīrā
  trad: Tu es, en vérité, *Baṣīr* à notre égard. »
- ref: S.20:36
  ar: قَالَ قَدْ أُوتِيتَ سُؤْلَكَ يَا مُوسَىٰ
  trl: Qāla qad ūtīta suʾlaka yā mūsā
  trad: 'Il dit : « Ta demande (*suʾlaka*) t''est accordée, ô Mūsā. »'
- ref: S.20:37
  ar: وَلَقَدْ مَنَنَّا عَلَيْكَ مَرَّةً أُخْرَىٰ
  trl: Wa-la-qad manannā ʿalayka marratan ukhrā
  trad: « Et Nous t'avons déjà comblé d'un bienfait (*mananna ʿalayka*) une autre fois,
- ref: S.20:38
  ar: إِذْ أَوْحَيْنَا إِلَىٰ أُمِّكَ مَا يُوحَىٰ
  trl: Idh awḥaynā ilā ummika mā yūḥā
  trad: quand Nous avons inspiré (*awḥaynā*) à ta mère ce qui fut inspiré. »
- ref: S.20:39
  ar: أَنِ اقْذِفِيهِ فِي التَّابُوتِ فَاقْذِفِيهِ فِي الْيَمِّ فَلْيُلْقِهِ الْيَمُّ بِالسَّاحِلِ يَأْخُذْهُ عَدُوٌّ لِي وَعَدُوٌّ لَهُ ۚ وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةً مِنِّي وَلِتُصْنَعَ عَلَىٰ عَيْنِي
  trl: Ani qdhifīhi fi t-tābūti fa-qdhifīhi fi l-yammi fal-yulqihi l-yammu bi-s-sāḥili yaʾkhudhhu ʿaduwwun lī wa-ʿaduwwun lahu wa-alqaytu ʿalayka maḥabbatan minnī wa-li-tuṣnaʿa ʿalā ʿaynī
  trad: '« [Nous avons inspiré à ta mère] : ‹Dépose-le (*iqdhifīhi*) dans le coffre (*at-tābūt*), puis jette-le (*fa-qdhifīhi*) dans le fleuve (*al-yamm*) — que le fleuve le rejette sur la rive (*as-sāḥil*), un ennemi à Moi et un ennemi à lui le recueillera.› Et J''ai déposé sur toi un honneur (*maḥabba*) venant de Moi, et [J''ai voulu] que tu sois élevé sous Mon *ʿayn* (*ʿalā ʿaynī*).'
- ref: S.20:40
  ar: إِذْ تَمْشِي أُخْتُكَ فَتَقُولُ هَلْ أَدُلُّكُمْ عَلَىٰ مَنْ يَكْفُلُهُ ۖ فَرَجَعْنَاكَ إِلَىٰ أُمِّكَ كَيْ تَقَرَّ عَيْنُهَا وَلَا تَحْزَنَ ۚ وَقَتَلْتَ نَفْسًا فَنَجَّيْنَاكَ مِنَ الْغَمِّ وَفَتَنَّاكَ فُتُونًا ۚ فَلَبِثْتَ سِنِينَ فِي أَهْلِ مَدْيَنَ ثُمَّ جِئْتَ عَلَىٰ قَدَرٍ يَا مُوسَىٰ
  trl: Idh tamshī ukhtuka fa-taqūlu hal adullukum ʿalā man yakfuluh fa-rajaʿnāka ilā ummika kay taqarra ʿaynuhā wa-lā taḥzan wa-qataltā nafsan fa-najjaynāka mina l-ghammi wa-fatannāka futūnan fa-labithta sinīna fī ahli madyana thumma jiʾta ʿalā qadarin yā mūsā
  trad: '« [Souviens-toi] quand ta sœur marchait [derrière le coffre] et disait : ‹Puis-je vous indiquer qui se chargera de lui (*man yakfuluh*) ?› — ainsi Nous t''avons ramené à ta mère, afin que son œil se rafraîchisse (*taqarra ʿaynuhā*) et qu''elle ne s''afflige pas. Et tu as tué une âme (*qataltā nafsan*) — Nous t''avons alors sauvé de l''angoisse (*al-ghamm*), et Nous t''avons éprouvé d''une rude épreuve (*fatannāka futūnan*). Tu es resté des années (*sinīna*) parmi les gens de Madyan, puis tu es venu selon une mesure déterminée (*ʿalā qadarin*), ô Mūsā. »'
- ref: S.20:41
  ar: وَاصْطَنَعْتُكَ لِنَفْسِي
  trl: Wa-ṣṭanaʿtuka li-nafsī
  trad: « Et Je t'ai façonné (*iṣṭanaʿtuka*) pour Moi-même (*li-nafsī*). »
- ref: S.20:42
  ar: اذْهَبْ أَنْتَ وَأَخُوكَ بِآيَاتِي وَلَا تَنِيَا فِي ذِكْرِي
  trl: Idhhab anta wa-akhūka bi-āyātī wa-lā taniyā fī dhikrī
  trad: « Va, toi et ton frère, avec Mes signes (*āyātī*), et ne faiblissez pas (*lā taniyā*) dans Mon rappel. »
- ref: S.20:43
  ar: اذْهَبَا إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ
  trl: Idhhabā ilā firʿawna innahu ṭaghā
  trad: « Allez tous deux vers Firʿawn — il a certes transgressé (*ṭaghā*),
- ref: S.20:44
  ar: فَقُولَا لَهُ قَوْلًا لَيِّنًا لَعَلَّهُ يَتَذَكَّرُ أَوْ يَخْشَىٰ
  trl: Fa-qūlā lahu qawlan layyinan laʿallahu yatadhakkaru aw yakhshā
  trad: et adressez-lui une parole douce (*qawlan layyinan*) — peut-être se rappellera-t-il, ou redoutera-t-il. »
- ref: S.20:45
  ar: قَالَا رَبَّنَا إِنَّنَا نَخَافُ أَنْ يَفْرُطَ عَلَيْنَا أَوْ أَنْ يَطْغَىٰ
  trl: Qālā rabbanā innanā nakhāfu an yafruṭa ʿalaynā aw an yaṭghā
  trad: 'Tous deux dirent : « Notre Rabb, nous craignons qu''il ne se précipite contre nous (*yafruṭa ʿalaynā*), ou qu''il ne transgresse davantage. »'
- ref: S.20:46
  ar: قَالَ لَا تَخَافَا ۖ إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ
  trl: Qāla lā takhāfā innanī maʿakumā asmaʿu wa-arā
  trad: 'Il dit : « Ne craignez rien — Je suis avec vous deux : J''entends et Je vois (*asmaʿu wa-arā*). »'
- ref: S.20:47
  ar: فَأْتِيَاهُ فَقُولَا إِنَّا رَسُولَا رَبِّكَ فَأَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ وَلَا تُعَذِّبْهُمْ ۖ قَدْ جِئْنَاكَ بِآيَةٍ مِنْ رَبِّكَ ۖ وَالسَّلَامُ عَلَىٰ مَنِ اتَّبَعَ الْهُدَىٰ
  trl: Fa-ʾtiyāhu fa-qūlā innā rasūlā rabbika fa-arsil maʿanā banī isrāʾīla wa-lā tuʿadhdhibhum qad jiʾnāka bi-āyatin min rabbika wa-s-salāmu ʿalā mani ttabaʿa l-hudā
  trad: '« Allez donc à lui, et dites-lui : ‹Nous sommes tous deux les envoyés (*rasūlā*) de ton Rabb — laisse donc partir avec nous les Banī Isrāʾīl, et ne les tourmente plus. Nous t''avons apporté un signe (*āya*) venant de ton Rabb — et que la paix (*as-salām*) soit sur quiconque suit la guidance (*man ittabaʿa l-hudā*).› »'
- ref: S.20:48
  ar: إِنَّا قَدْ أُوحِيَ إِلَيْنَا أَنَّ الْعَذَابَ عَلَىٰ مَنْ كَذَّبَ وَتَوَلَّىٰ
  trl: Innā qad ūḥiya ilaynā anna l-ʿadhāba ʿalā man kadhdhaba wa-tawallā
  trad: « Il nous a été révélé qu'en vérité le châtiment frappe quiconque dément (*kadhdhaba*) et se détourne (*tawallā*). »
- ref: S.20:49
  ar: قَالَ فَمَنْ رَبُّكُمَا يَا مُوسَىٰ
  trl: Qāla fa-man rabbukumā yā mūsā
  trad: 'Il dit : « Qui donc est votre Rabb, ô Mūsā ? »'
- ref: S.20:50
  ar: قَالَ رَبُّنَا الَّذِي أَعْطَىٰ كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَىٰ
  trl: Qāla rabbunā lladhī aʿṭā kulla shayʾin khalqahu thumma hadā
  trad: 'Il dit : « Notre Rabb est Ce qui a donné à chaque chose sa forme propre (*khalqahu*), puis [l''a] guidée (*hadā*). »'
- ref: S.20:51
  ar: قَالَ فَمَا بَالُ الْقُرُونِ الْأُولَىٰ
  trl: Qāla fa-mā bālu l-qurūni l-ūlā
  trad: 'Il dit : « Qu''en est-il donc de la condition (*bālu*) des générations anciennes (*al-qurūni l-ūlā*) ? »'
- ref: S.20:52
  ar: قَالَ عِلْمُهَا عِنْدَ رَبِّي فِي كِتَابٍ ۖ لَا يَضِلُّ رَبِّي وَلَا يَنْسَى
  trl: Qāla ʿilmuhā ʿinda rabbī fī kitābin lā yaḍillu rabbī wa-lā yansā
  trad: 'Il dit : « La connaissance (*ʿilm*) qui les concerne est auprès de mon Rabb, dans un écrit (*kitāb*) — mon Rabb ne s''égare pas (*lā yaḍillu*) et n''oublie pas (*lā yansā*). »'
- ref: S.20:53
  ar: الَّذِي جَعَلَ لَكُمُ الْأَرْضَ مَهْدًا وَسَلَكَ لَكُمْ فِيهَا سُبُلًا وَأَنْزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجْنَا بِهِ أَزْوَاجًا مِنْ نَبَاتٍ شَتَّىٰ
  trl: Alladhī jaʿala lakumu l-arḍa mahdan wa-salaka lakum fīhā subulan wa-anzala mina s-samāʾi māʾan fa-akhrajnā bihi azwājan min nabātin shattā
  trad: « [Ce qui] a fait pour vous de la terre un berceau (*mahdan*), a tracé (*salaka*) pour vous, à travers elle, des chemins (*subulan*), et a fait descendre du ciel une eau — par laquelle Nous avons fait sortir des couples de végétation variée (*azwājan min nabātin shattā*).
- ref: S.20:54
  ar: كُلُوا وَارْعَوْا أَنْعَامَكُمْ ۗ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِأُولِي النُّهَىٰ
  trl: Kulū wa-rʿaw anʿāmakum inna fī dhālika la-āyātin li-ulī n-nuhā
  trad: Mangez, et faites paître votre bétail (*anʿāmakum*) — il y a certes en cela des signes pour les détenteurs de raison (*ulī n-nuhā*). »
- ref: S.20:55
  ar: ۞ مِنْهَا خَلَقْنَاكُمْ وَفِيهَا نُعِيدُكُمْ وَمِنْهَا نُخْرِجُكُمْ تَارَةً أُخْرَىٰ
  trl: Minhā khalaqnākum wa-fīhā nuʿīdukum wa-minhā nukhrijukum tāratan ukhrā
  trad: C'est d'elle [la terre] que Nous vous avons créés, en elle que Nous vous ramènerons, et d'elle que Nous vous ferons sortir une autre fois (*tāratan ukhrā*).
- ref: S.20:56
  ar: وَلَقَدْ أَرَيْنَاهُ آيَاتِنَا كُلَّهَا فَكَذَّبَ وَأَبَىٰ
  trl: Wa-la-qad araynāhu āyātinā kullahā fa-kadhdhaba wa-abā
  trad: Et Nous lui avons certes fait voir Nos signes, tous, mais il a démenti (*kadhdhaba*) et refusé (*abā*).
- ref: S.20:57
  ar: قَالَ أَجِئْتَنَا لِتُخْرِجَنَا مِنْ أَرْضِنَا بِسِحْرِكَ يَا مُوسَىٰ
  trl: Qāla a-jiʾtanā li-tukhrijanā min arḍinā bi-siḥrika yā mūsā
  trad: 'Il dit : « Es-tu venu à nous pour nous faire sortir de notre terre par ton *siḥr*, ô Mūsā ?'
- ref: S.20:58
  ar: فَلَنَأْتِيَنَّكَ بِسِحْرٍ مِثْلِهِ فَاجْعَلْ بَيْنَنَا وَبَيْنَكَ مَوْعِدًا لَا نُخْلِفُهُ نَحْنُ وَلَا أَنْتَ مَكَانًا سُوًى
  trl: Fa-la-naʾtiyannaka bi-siḥrin mithlihi fa-jʿal baynanā wa-baynaka mawʿidan lā nukhlifuhu naḥnu wa-lā anta makānan suwā
  trad: Nous t'apporterons certainement un *siḥr* semblable au tien. Fixe donc entre nous et toi un rendez-vous (*mawʿid*) que ni nous ni toi ne manquerons, en un lieu de partage équitable (*makānan suwā*). »
- ref: S.20:59
  ar: قَالَ مَوْعِدُكُمْ يَوْمُ الزِّينَةِ وَأَنْ يُحْشَرَ النَّاسُ ضُحًى
  trl: Qāla mawʿidukum yawmu z-zīnati wa-an yuḥshara n-nāsu ḍuḥā
  trad: 'Il dit : « Votre rendez-vous est le jour de la parure (*yawm az-zīna*), et que les gens soient rassemblés en fin de matinée (*ḍuḥā*). »'
- ref: S.20:60
  ar: فَتَوَلَّىٰ فِرْعَوْنُ فَجَمَعَ كَيْدَهُ ثُمَّ أَتَىٰ
  trl: Fa-tawallā firʿawnu fa-jamaʿa kaydahu thumma atā
  trad: Firʿawn se détourna, réunit sa ruse (*kaydahu*), puis vint [au rendez-vous].
- ref: S.20:61
  ar: قَالَ لَهُمْ مُوسَىٰ وَيْلَكُمْ لَا تَفْتَرُوا عَلَى اللَّهِ كَذِبًا فَيُسْحِتَكُمْ بِعَذَابٍ ۖ وَقَدْ خَابَ مَنِ افْتَرَىٰ
  trl: Qāla lahum mūsā waylakum lā taftarū ʿalā llāhi kadhiban fa-yusḥitakum bi-ʿadhābin wa-qad khāba mani ftarā
  trad: 'Mūsā leur dit : « Malheur à vous (*waylakum*) ! Ne fabriquez pas de mensonge (*lā taftarū kadhiban*) contre Allaah, car Il vous anéantirait (*fa-yusḥitakum*) par un châtiment — et celui qui fabrique un mensonge est déjà voué à l''échec (*khāba*). »'
- ref: S.20:62
  ar: فَتَنَازَعُوا أَمْرَهُمْ بَيْنَهُمْ وَأَسَرُّوا النَّجْوَىٰ
  trl: Fa-tanāzaʿū amrahum baynahum wa-asarrū n-najwā
  trad: Ils se disputèrent alors leur affaire entre eux, et tinrent secret leur conciliabule (*najwā*).
- ref: S.20:63
  ar: قَالُوا إِنْ هَٰذَانِ لَسَاحِرَانِ يُرِيدَانِ أَنْ يُخْرِجَاكُمْ مِنْ أَرْضِكُمْ بِسِحْرِهِمَا وَيَذْهَبَا بِطَرِيقَتِكُمُ الْمُثْلَىٰ
  trl: Qālū in hādhāni la-sāḥirāni yurīdāni an yukhrijākum min arḍikum bi-siḥrihimā wa-yadhhabā bi-ṭarīqatikumu l-muthlā
  trad: 'Ils dirent : « Ces deux-là sont assurément deux magiciens (*sāḥirāni*) qui veulent vous faire sortir de votre terre par leur *siḥr*, et emporter votre voie exemplaire (*ṭarīqatikumu l-muthlā*).'
- ref: S.20:64
  ar: فَأَجْمِعُوا كَيْدَكُمْ ثُمَّ ائْتُوا صَفًّا ۚ وَقَدْ أَفْلَحَ الْيَوْمَ مَنِ اسْتَعْلَىٰ
  trl: Fa-ajmiʿū kaydakum thumma ītū ṣaffan wa-qad aflaḥa l-yawma mani staʿlā
  trad: Réunissez donc votre ruse, puis venez en rang serré (*ṣaffan*) — aujourd'hui, réussira celui qui aura le dessus (*mani staʿlā*). »
- ref: S.20:65
  ar: قَالُوا يَا مُوسَىٰ إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ أَوَّلَ مَنْ أَلْقَىٰ
  trl: Qālū yā mūsā immā an tulqiya wa-immā an nakūna awwala man alqā
  trad: 'Ils dirent : « Ô Mūsā, soit tu jettes [le premier], soit c''est nous qui serons les premiers à jeter. »'
- ref: S.20:66
  ar: قَالَ بَلْ أَلْقُوا ۖ فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِنْ سِحْرِهِمْ أَنَّهَا تَسْعَىٰ
  trl: Qāla bal alqū fa-idhā ḥibāluhum wa-ʿiṣiyyuhum yukhayyalu ilayhi min siḥrihim annahā tasʿā
  trad: 'Il dit : « Non, jetez plutôt [vous-mêmes]. » Voici que leurs cordes (*ḥibāluhum*) et leurs bâtons (*ʿiṣiyyuhum*), par leur *siḥr*, donnaient à Mūsā l''illusion (*yukhayyalu ilayhi*) qu''ils se mettaient à courir (*tasʿā*).'
- ref: S.20:67
  ar: فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُوسَىٰ
  trl: Fa-awjasa fī nafsihi khīfatan mūsā
  trad: Mūsā ressentit alors en lui-même une crainte (*khīfatan*).
- ref: S.20:68
  ar: قُلْنَا لَا تَخَفْ إِنَّكَ أَنْتَ الْأَعْلَىٰ
  trl: Qulnā lā takhaf innaka anta l-aʿlā
  trad: 'Nous avons dit : « Ne crains rien — c''est toi qui auras le dessus (*al-aʿlā*). »'
- ref: S.20:69
  ar: وَأَلْقِ مَا فِي يَمِينِكَ تَلْقَفْ مَا صَنَعُوا ۖ إِنَّمَا صَنَعُوا كَيْدُ سَاحِرٍ ۖ وَلَا يُفْلِحُ السَّاحِرُ حَيْثُ أَتَىٰ
  trl: Wa-alqi mā fī yamīnika talqaf mā ṣanaʿū innamā ṣanaʿū kaydu sāḥirin wa-lā yufliḥu s-sāḥiru ḥaythu atā
  trad: '« Et jette ce qui est dans ta main droite (*yamīnika*) : cela happera (*talqaf*) ce qu''ils ont fabriqué. Ce qu''ils ont fabriqué n''est que la ruse d''un magicien (*kaydu sāḥir*) — et le magicien ne réussit pas, où qu''il aille (*ḥaythu atā*). »'
- ref: S.20:70
  ar: فَأُلْقِيَ السَّحَرَةُ سُجَّدًا قَالُوا آمَنَّا بِرَبِّ هَارُونَ وَمُوسَىٰ
  trl: Fa-ulqiya s-saḥaratu sujjadan qālū āmannā bi-rabbi hārūna wa-mūsā
  trad: 'Les magiciens furent jetés à terre, prosternés (*sujjadan*) ; ils dirent : « Nous croyons au Rabb de Hārūn et de Mūsā. »'
- ref: S.20:71
  ar: قَالَ آمَنْتُمْ لَهُ قَبْلَ أَنْ آذَنَ لَكُمْ ۖ إِنَّهُ لَكَبِيرُكُمُ الَّذِي عَلَّمَكُمُ السِّحْرَ ۖ فَلَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُمْ مِنْ خِلَافٍ وَلَأُصَلِّبَنَّكُمْ فِي جُذُوعِ النَّخْلِ وَلَتَعْلَمُنَّ أَيُّنَا أَشَدُّ عَذَابًا وَأَبْقَىٰ
  trl: Qāla āmantum lahu qabla an ādhana lakum innahu la-kabīrukumu lladhī ʿallamakumu s-siḥra fa-la-uqaṭṭiʿanna aydiyakum wa-arjulakum min khilāfin wa-la-uṣallibannakum fī judhūʿi n-nakhli wa-la-taʿlamunna ayyunā ashaddu ʿadhāban wa-abqā
  trad: 'Il dit : « Avez-vous cru en lui avant que je vous en donne la permission (*ādhana lakum*) ? Il est sans doute votre maître (*kabīrukum*), celui qui vous a enseigné le *siḥr*. Je vous couperai certainement les mains et les pieds, de façon croisée (*min khilāf*), et je vous crucifierai certainement sur des troncs de palmier (*judhūʿi n-nakhl*) — et vous saurez alors lequel de nous deux inflige le châtiment le plus sévère et le plus durable (*ashaddu ʿadhāban wa-abqā*). »'
- ref: S.20:72
  ar: قَالُوا لَنْ نُؤْثِرَكَ عَلَىٰ مَا جَاءَنَا مِنَ الْبَيِّنَاتِ وَالَّذِي فَطَرَنَا ۖ فَاقْضِ مَا أَنْتَ قَاضٍ ۖ إِنَّمَا تَقْضِي هَٰذِهِ الْحَيَاةَ الدُّنْيَا
  trl: Qālū lan nuʾthiraka ʿalā mā jāʾanā mina l-bayyināti wa-lladhī faṭaranā fa-qḍi mā anta qāḍin innamā taqḍī hādhihi l-ḥayāta d-dunyā
  trad: 'Ils dirent : « Nous ne te préférerons (*nuʾthiraka*) jamais à ce qui nous est venu comme preuves manifestes (*bayyināt*), ni à Ce qui nous a façonnés (*faṭaranā*). Décide donc ce que tu as à décider : tu ne décides que de cette vie d''ici-bas. »'
- ref: S.20:73
  ar: إِنَّا آمَنَّا بِرَبِّنَا لِيَغْفِرَ لَنَا خَطَايَانَا وَمَا أَكْرَهْتَنَا عَلَيْهِ مِنَ السِّحْرِ ۗ وَاللَّهُ خَيْرٌ وَأَبْقَىٰ
  trl: Innā āmannā bi-rabbinā li-yaghfira lanā khaṭāyānā wa-mā akrahtanā ʿalayhi mina s-siḥri wa-llāhu khayrun wa-abqā
  trad: « Nous croyons en notre Rabb, afin qu'Il nous pardonne nos fautes (*khaṭāyānā*) et ce à quoi tu nous as contraints (*akrahtanā*) du *siḥr* — et Allaah est meilleur (*khayr*) et plus durable (*abqā*). »
- ref: S.20:74
  ar: إِنَّهُ مَنْ يَأْتِ رَبَّهُ مُجْرِمًا فَإِنَّ لَهُ جَهَنَّمَ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ
  trl: Innahu man yaʾti rabbahu mujriman fa-inna lahu jahannama lā yamūtu fīhā wa-lā yaḥyā
  trad: 'En vérité, quiconque vient à son Rabb en criminel (*mujriman*) aura Jahannam : il n''y meurt pas et n''y vit pas.'
- ref: S.20:75
  ar: وَمَنْ يَأْتِهِ مُؤْمِنًا قَدْ عَمِلَ الصَّالِحَاتِ فَأُولَٰئِكَ لَهُمُ الدَّرَجَاتُ الْعُلَىٰ
  trl: Wa-man yaʾtihi muʾminan qad ʿamila ṣ-ṣāliḥāti fa-ulāʾika lahumu d-darajātu l-ʿulā
  trad: Et quiconque vient à Lui en croyant (*muʾminan*), ayant accompli les œuvres droites (*ṣ-ṣāliḥāt*) — ceux-là ont les rangs les plus élevés (*ad-darajātu l-ʿulā*).
- ref: S.20:76
  ar: جَنَّاتُ عَدْنٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا ۚ وَذَٰلِكَ جَزَاءُ مَنْ تَزَكَّىٰ
  trl: Jannātu ʿadnin tajrī min taḥtihā l-anhāru khālidīna fīhā wa-dhālika jazāʾu man tazakkā
  trad: '[Ce sont] les jardins d''ʿAdn (*jannātu ʿadn*), sous lesquels courent les rivières, où ils demeureront — telle est la rétribution (*jazāʾ*) de quiconque se purifie (*tazakkā*).'
- ref: S.20:77
  ar: وَلَقَدْ أَوْحَيْنَا إِلَىٰ مُوسَىٰ أَنْ أَسْرِ بِعِبَادِي فَاضْرِبْ لَهُمْ طَرِيقًا فِي الْبَحْرِ يَبَسًا لَا تَخَافُ دَرَكًا وَلَا تَخْشَىٰ
  trl: Wa-laqad awḥaynā ilā mūsā an asri bi-ʿibādī fa-ḍrib lahum ṭarīqan fi l-baḥri yabasan lā takhāfu darakan wa-lā takhshā
  trad: 'Et Nous avons certes révélé à Mūsā : « Pars de nuit (*asri*) avec Mes *ʿibād*, et trace-leur (*fa-ḍrib*) un chemin sec (*yabasan*) dans la mer — tu ne craindras pas d''être rattrapé (*darakan*), et tu ne redouteras rien. »'
- ref: S.20:78
  ar: فَأَتْبَعَهُمْ فِرْعَوْنُ بِجُنُودِهِ فَغَشِيَهُمْ مِنَ الْيَمِّ مَا غَشِيَهُمْ
  trl: Fa-atbaʿahum firʿawnu bi-junūdihi fa-ghashiyahum mina l-yammi mā ghashiyahum
  trad: Firʿawn les poursuivit avec ses armées (*junūdihi*) — et les couvrit, de la mer (*al-yamm*), ce qui les couvrit (*mā ghashiyahum*).
- ref: S.20:79
  ar: وَأَضَلَّ فِرْعَوْنُ قَوْمَهُ وَمَا هَدَىٰ
  trl: Wa-aḍalla firʿawnu qawmahu wa-mā hadā
  trad: Et Firʿawn égara (*aḍalla*) son peuple, et ne guida (*hadā*) pas.
- ref: S.20:80
  ar: يَا بَنِي إِسْرَائِيلَ قَدْ أَنْجَيْنَاكُمْ مِنْ عَدُوِّكُمْ وَوَاعَدْنَاكُمْ جَانِبَ الطُّورِ الْأَيْمَنَ وَنَزَّلْنَا عَلَيْكُمُ الْمَنَّ وَالسَّلْوَىٰ
  trl: Yā banī isrāʾīla qad anjaynākum min ʿaduwwikum wa-wāʿadnākum jāniba ṭ-ṭūri l-aymana wa-nazzalnā ʿalaykumu l-manna wa-s-salwā
  trad: « Ô Banū Isrāʾīl, Nous vous avons certes sauvés de votre ennemi (*ʿaduwwikum*), Nous vous avons donné rendez-vous (*wāʿadnākum*) sur le flanc droit du Ṭūr (*jāniba ṭ-ṭūri l-aymana*), et Nous avons fait descendre sur vous le *mann* et la *salwā*. »
- ref: S.20:81
  ar: كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُمْ وَلَا تَطْغَوْا فِيهِ فَيَحِلَّ عَلَيْكُمْ غَضَبِي ۖ وَمَنْ يَحْلِلْ عَلَيْهِ غَضَبِي فَقَدْ هَوَىٰ
  trl: Kulū min ṭayyibāti mā razaqnākum wa-lā taṭghaw fīhi fa-yaḥilla ʿalaykum ghaḍabī wa-man yaḥlil ʿalayhi ghaḍabī fa-qad hawā
  trad: « Mangez des bonnes choses (*ṭayyibāt*) dont Nous vous avons pourvus, et ne transgressez pas (*lā taṭghaw*) en cela — sinon Mon *ghaḍab* descendra sur vous ; et quiconque est atteint par Mon *ghaḍab* est déjà tombé (*hawā*). »
- ref: S.20:82
  ar: وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ
  trl: Wa-innī la-ghaffārun li-man tāba wa-āmana wa-ʿamila ṣāliḥan thumma-htadā
  trad: « Et Je suis certes Ce qui pardonne sans relâche (*ghaffār*), pour quiconque revient (*tāba*), croit, accomplit une œuvre droite, puis se maintient dans la guidance (*ihtadā*). »
- ref: S.20:83
  ar: ۞ وَمَا أَعْجَلَكَ عَنْ قَوْمِكَ يَا مُوسَىٰ
  trl: Wa-mā aʿjalaka ʿan qawmika yā mūsā
  trad: « Et qu'est-ce qui t'a fait te hâter (*aʿjalaka*), loin de ton peuple, ô Mūsā ? »
- ref: S.20:84
  ar: قَالَ هُمْ أُولَاءِ عَلَىٰ أَثَرِي وَعَجِلْتُ إِلَيْكَ رَبِّ لِتَرْضَىٰ
  trl: Qāla hum ulāʾi ʿalā atharī wa-ʿajiltu ilayka rabbi li-tarḍā
  trad: 'Il dit : « Les voici sur mes traces (*atharī*) — et je me suis hâté vers Toi, mon Rabb, afin que Tu agrées (*li-tarḍā*). »'
- ref: S.20:85
  ar: قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنْ بَعْدِكَ وَأَضَلَّهُمُ السَّامِرِيُّ
  trl: Qāla fa-innā qad fatannā qawmaka min baʿdika wa-aḍallahumu s-sāmiriyyu
  trad: 'Il dit : « Nous avons certes éprouvé (*fatannā*) ton peuple après toi, et as-Sāmirī les a égarés (*aḍallahum*). »'
- ref: S.20:86
  ar: فَرَجَعَ مُوسَىٰ إِلَىٰ قَوْمِهِ غَضْبَانَ أَسِفًا ۚ قَالَ يَا قَوْمِ أَلَمْ يَعِدْكُمْ رَبُّكُمْ وَعْدًا حَسَنًا ۚ أَفَطَالَ عَلَيْكُمُ الْعَهْدُ أَمْ أَرَدْتُمْ أَنْ يَحِلَّ عَلَيْكُمْ غَضَبٌ مِنْ رَبِّكُمْ فَأَخْلَفْتُمْ مَوْعِدِي
  trl: Fa-rajaʿa mūsā ilā qawmihi ghaḍbāna asifan qāla yā qawmi a-lam yaʿidkum rabbukum waʿdan ḥasanan a-fa-ṭāla ʿalaykumu l-ʿahdu am aradtum an yaḥilla ʿalaykum ghaḍabun min rabbikum fa-akhlaftum mawʿidī
  trad: 'Mūsā retourna alors vers son peuple, en colère (*ghaḍbāna*) et affligé (*asifan*). Il dit : « Ô mon peuple, votre Rabb ne vous avait-Il pas fait une belle promesse (*waʿdan ḥasanan*) ? Le temps (*al-ʿahd*) vous a-t-il donc paru long, ou avez-vous voulu qu''un *ghaḍab* de votre Rabb s''abatte sur vous, pour avoir ainsi manqué à votre rendez-vous avec moi (*fa-akhlaftum mawʿidī*) ? »'
- ref: S.20:87
  ar: قَالُوا مَا أَخْلَفْنَا مَوْعِدَكَ بِمَلْكِنَا وَلَٰكِنَّا حُمِّلْنَا أَوْزَارًا مِنْ زِينَةِ الْقَوْمِ فَقَذَفْنَاهَا فَكَذَٰلِكَ أَلْقَى السَّامِرِيُّ
  trl: Qālū mā akhlafnā mawʿidaka bi-malkinā wa-lākinnā ḥummilnā awzāran min zīnati l-qawmi fa-qadhafnāhā fa-kadhālika alqā s-sāmiriyyu
  trad: 'Ils dirent : « Nous n''avons pas manqué à notre rendez-vous avec toi de notre propre gré (*bi-malkinā*) — mais on nous a fait porter des charges (*awzāran*) provenant des parures du peuple (*zīnati l-qawmi*), et nous les avons jetées (*fa-qadhafnāhā*) — ainsi as-Sāmirī a-t-il jeté [lui aussi]. »'
- ref: S.20:88
  ar: فَأَخْرَجَ لَهُمْ عِجْلًا جَسَدًا لَهُ خُوَارٌ فَقَالُوا هَٰذَا إِلَٰهُكُمْ وَإِلَٰهُ مُوسَىٰ فَنَسِيَ
  trl: Fa-akhraja lahum ʿijlan jasadan lahu khuwārun fa-qālū hādhā ilāhukum wa-ilāhu mūsā fa-nasiya
  trad: 'Il fit alors sortir pour eux un *ʿijl* — un corps [inerte] (*jasadan*) ayant un meuglement (*khuwārun*) — et ils dirent : « Voici votre *ilāh*, et l''*ilāh* de Mūsā » ; mais il oublia (*fa-nasiya*).'
- ref: S.20:89
  ar: أَفَلَا يَرَوْنَ أَلَّا يَرْجِعُ إِلَيْهِمْ قَوْلًا وَلَا يَمْلِكُ لَهُمْ ضَرًّا وَلَا نَفْعًا
  trl: A-fa-lā yarawna allā yarjiʿu ilayhim qawlan wa-lā yamliku lahum ḍarran wa-lā nafʿā
  trad: Ne voyaient-ils donc pas qu'il ne leur rendait aucune parole, et ne détenait (*yamliku*) pour eux ni nuisance (*ḍarr*) ni profit (*nafʿ*) ?
- ref: S.20:90
  ar: وَلَقَدْ قَالَ لَهُمْ هَارُونُ مِنْ قَبْلُ يَا قَوْمِ إِنَّمَا فُتِنْتُمْ بِهِ ۖ وَإِنَّ رَبَّكُمُ الرَّحْمَٰنُ فَاتَّبِعُونِي وَأَطِيعُوا أَمْرِي
  trl: Wa-laqad qāla lahum hārūnu min qablu yā qawmi innamā futintum bihi wa-inna rabbakumu r-raḥmānu fa-ttabiʿūnī wa-aṭīʿū amrī
  trad: 'Et Hārūn leur avait certes dit auparavant : « Ô mon peuple, vous n''êtes éprouvés (*futintum*) que par cela — votre Rabb est ar-Raḥmān — suivez-moi donc, et obéissez à mon ordre. »'
- ref: S.20:91
  ar: قَالُوا لَنْ نَبْرَحَ عَلَيْهِ عَاكِفِينَ حَتَّىٰ يَرْجِعَ إِلَيْنَا مُوسَىٰ
  trl: Qālū lan nabraḥa ʿalayhi ʿākifīna ḥattā yarjiʿa ilaynā mūsā
  trad: 'Ils dirent : « Nous ne cesserons pas de lui rester attachés (*ʿākifīna*), jusqu''à ce que Mūsā revienne vers nous. »'
- ref: S.20:92
  ar: قَالَ يَا هَارُونُ مَا مَنَعَكَ إِذْ رَأَيْتَهُمْ ضَلُّوا
  trl: Qāla yā hārūnu mā manaʿaka idh raʾaytahum ḍallū
  trad: 'Il dit : « Ô Hārūn, qu''est-ce qui t''a empêché (*manaʿaka*), quand tu les as vus s''égarer,'
- ref: S.20:93
  ar: أَلَّا تَتَّبِعَنِ ۖ أَفَعَصَيْتَ أَمْرِي
  trl: Allā tattabiʿani a-fa-ʿaṣayta amrī
  trad: de me suivre ? As-tu donc désobéi à mon ordre (*ʿaṣayta amrī*) ? »
- ref: S.20:94
  ar: قَالَ يَا ابْنَ أُمَّ لَا تَأْخُذْ بِلِحْيَتِي وَلَا بِرَأْسِي ۖ إِنِّي خَشِيتُ أَنْ تَقُولَ فَرَّقْتَ بَيْنَ بَنِي إِسْرَائِيلَ وَلَمْ تَرْقُبْ قَوْلِي
  trl: Qāla yā-bna umma lā taʾkhudh bi-liḥyatī wa-lā bi-raʾsī innī khashītu an taqūla farraqta bayna banī isrāʾīla wa-lam tarqub qawlī
  trad: 'Il dit : « Ô fils de ma mère (*yā-bna umma*), ne me saisis ni par ma barbe (*liḥyatī*) ni par ma tête — j''ai craint (*khashītu*) que tu ne dises : \"Tu as divisé (*farraqta*) les Banū Isrāʾīl\", et que tu n''aies pas surveillé ma parole (*wa-lam tarqub qawlī*). »'
- ref: S.20:95
  ar: قَالَ فَمَا خَطْبُكَ يَا سَامِرِيُّ
  trl: Qāla fa-mā khaṭbuka yā sāmiriyyu
  trad: 'Il dit : « Quelle est donc ton affaire (*khaṭbuka*), ô Sāmirī ? »'
- ref: S.20:96
  ar: قَالَ بَصُرْتُ بِمَا لَمْ يَبْصُرُوا بِهِ فَقَبَضْتُ قَبْضَةً مِنْ أَثَرِ الرَّسُولِ فَنَبَذْتُهَا وَكَذَٰلِكَ سَوَّلَتْ لِي نَفْسِي
  trl: Qāla baṣurtu bi-mā lam yabṣurū bihi fa-qabaḍtu qabḍatan min athari r-rasūli fa-nabadhtuhā wa-kadhālika sawwalat lī nafsī
  trad: 'Il dit : « J''ai perçu (*baṣurtu*) ce qu''ils n''ont pas perçu ; j''ai donc pris une poignée (*qabḍatan*) de la trace du *rasūl* (*athari r-rasūli*), puis je l''ai jetée (*nabadhtuhā*) — ainsi mon âme (*nafsī*) me l''a-t-elle enjolivée (*sawwalat*). »'
- ref: S.20:97
  ar: قَالَ فَاذْهَبْ فَإِنَّ لَكَ فِي الْحَيَاةِ أَنْ تَقُولَ لَا مِسَاسَ ۖ وَإِنَّ لَكَ مَوْعِدًا لَنْ تُخْلَفَهُ ۖ وَانْظُرْ إِلَىٰ إِلَٰهِكَ الَّذِي ظَلْتَ عَلَيْهِ عَاكِفًا ۖ لَنُحَرِّقَنَّهُ ثُمَّ لَنَنْسِفَنَّهُ فِي الْيَمِّ نَسْفًا
  trl: Qāla fa-dhhab fa-inna laka fi l-ḥayāti an taqūla lā misāsa wa-inna laka mawʿidan lan tukhlafahu wa-nẓur ilā ilāhika lladhī ẓalta ʿalayhi ʿākifan la-nuḥarriqannahu thumma la-nansifannahu fi l-yammi nasfā
  trad: 'Il dit : « Va-t''en donc ! Il t''appartient, dans la vie, de dire \"Nul contact\" (*lā misāsa*) — et il est pour toi un rendez-vous (*mawʿidan*) auquel il ne sera pas manqué — et regarde ton *ilāh* auquel tu es demeuré attaché (*ẓalta ʿalayhi ʿākifan*) : nous le brûlerons assurément (*la-nuḥarriqannahu*), puis nous le disperserons assurément dans la mer (*al-yamm*), d''une dispersion totale (*nasfan*). »'
- ref: S.20:98
  ar: إِنَّمَا إِلَٰهُكُمُ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۚ وَسِعَ كُلَّ شَيْءٍ عِلْمًا
  trl: Innamā ilāhukumu llāhu lladhī lā ilāha illā huwa wasiʿa kulla shayʾin ʿilmā
  trad: Votre *ilāh* n'est autre qu'Allaah — nul *ilāh* que Lui — Ce qui embrasse (*wasiʿa*) toute chose en connaissance (*ʿilman*).
- ref: S.20:99
  ar: كَذَٰلِكَ نَقُصُّ عَلَيْكَ مِنْ أَنْبَاءِ مَا قَدْ سَبَقَ ۚ وَقَدْ آتَيْنَاكَ مِنْ لَدُنَّا ذِكْرًا
  trl: Kadhālika naquṣṣu ʿalayka min anbāʾi mā qad sabaqa — wa-qad ātaynāka min ladunnā dhikrā
  trad: Ainsi te racontons-Nous certains des récits (*anbāʾ*) de ce qui a déjà eu lieu — et Nous t'avons certes donné, venant proprement de Nous (*min ladunnā*), un *dhikr*.
- ref: S.20:100
  ar: مَنْ أَعْرَضَ عَنْهُ فَإِنَّهُ يَحْمِلُ يَوْمَ الْقِيَامَةِ وِزْرًا
  trl: Man aʿraḍa ʿanhu fa-innahu yaḥmilu yawma l-qiyāmati wizrā
  trad: Quiconque s'en détourne (*aʿraḍa*) portera, au Jour de la Résurrection (*yawma l-qiyāma*), un fardeau (*wizr*).
- ref: S.20:101
  ar: خَالِدِينَ فِيهِ ۖ وَسَاءَ لَهُمْ يَوْمَ الْقِيَامَةِ حِمْلًا
  trl: Khālidīna fīhi — wa-sāʾa lahum yawma l-qiyāmati ḥimlā
  trad: Ils y demeureront en permanence (*khālidīn*) — et quelle mauvaise charge (*ḥiml*) ce sera pour eux, au Jour de la Résurrection !
- ref: S.20:102
  ar: يَوْمَ يُنْفَخُ فِي الصُّورِ ۚ وَنَحْشُرُ الْمُجْرِمِينَ يَوْمَئِذٍ زُرْقًا
  trl: Yawma yunfakhu fi ṣ-ṣūri — wa-naḥshuru l-mujrimīna yawmaʾidhin zurqā
  trad: Le jour où il sera soufflé dans le *Ṣūr* — et Nous rassemblerons les *mujrimīn*, ce jour-là, *zurqan* (le regard bleui, hagard).
- ref: S.20:103
  ar: يَتَخَافَتُونَ بَيْنَهُمْ إِنْ لَبِثْتُمْ إِلَّا عَشْرًا
  trl: Yatakhāfatūna baynahum in labithtum illā ʿasharā
  trad: 'Ils se murmureront entre eux : « Vous n''êtes restés que dix. »'
- ref: S.20:104
  ar: نَحْنُ أَعْلَمُ بِمَا يَقُولُونَ إِذْ يَقُولُ أَمْثَلُهُمْ طَرِيقَةً إِنْ لَبِثْتُمْ إِلَّا يَوْمًا
  trl: Naḥnu aʿlamu bi-mā yaqūlūna idh yaqūlu amthaluhum ṭarīqatan in labithtum illā yawmā
  trad: 'Nous savons mieux ce qu''ils diront, lorsque le plus mesuré d''entre eux dans sa conduite (*amthaluhum ṭarīqatan*) dira : « Vous n''êtes restés qu''un jour. »'
- ref: S.20:105
  ar: وَيَسْأَلُونَكَ عَنِ الْجِبَالِ فَقُلْ يَنْسِفُهَا رَبِّي نَسْفًا
  trl: Wa-yasʾalūnaka ʿani l-jibāli fa-qul yansifuhā rabbī nasfā
  trad: 'Et ils t''interrogent au sujet des montagnes — dis : « Mon *Rabb* les dispersera d''une dispersion totale (*nasfan*). »'
- ref: S.20:106
  ar: فَيَذَرُهَا قَاعًا صَفْصَفًا
  trl: Fa-yadharuhā qāʿan ṣafṣafā
  trad: Il les laissera alors [la terre] comme une plaine nue et unie (*qāʿan ṣafṣafā*).
- ref: S.20:107
  ar: لَا تَرَىٰ فِيهَا عِوَجًا وَلَا أَمْتًا
  trl: Lā tarā fīhā ʿiwajan wa-lā amtā
  trad: Tu n'y verras ni creux (*ʿiwaj*) ni bosse (*amt*).
- ref: S.20:108
  ar: يَوْمَئِذٍ يَتَّبِعُونَ الدَّاعِيَ لَا عِوَجَ لَهُ ۖ وَخَشَعَتِ الْأَصْوَاتُ لِلرَّحْمَٰنِ فَلَا تَسْمَعُ إِلَّا هَمْسًا
  trl: Yawmaʾidhin yattabiʿūna d-dāʿiya lā ʿiwaja lahu — wa-khashaʿati l-aṣwātu li-r-raḥmāni fa-lā tasmaʿu illā hamsā
  trad: Ce jour-là, ils suivront l'Appelant (*ad-dāʿī*) sans qu'aucun détour ne lui soit possible — et les voix s'humilieront (*khashaʿat*) devant ar-Raḥmān — tu n'entendras qu'un chuchotement (*hams*).
- ref: S.20:109
  ar: يَوْمَئِذٍ لَا تَنْفَعُ الشَّفَاعَةُ إِلَّا مَنْ أَذِنَ لَهُ الرَّحْمَٰنُ وَرَضِيَ لَهُ قَوْلًا
  trl: Yawmaʾidhin lā tanfaʿu sh-shafāʿatu illā man adhina lahu r-raḥmānu wa-raḍiya lahu qawlā
  trad: Ce jour-là, la *shafāʿa* ne profitera pas — sinon à celui à qui le Raḥmān aura accordé Sa permission et dont Il n'aura pas repoussé la parole.
- ref: S.20:110
  ar: يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِهِ عِلْمًا
  trl: Yaʿlamu mā bayna aydīhim wa-mā khalfahum wa-lā yuḥīṭūna bihi ʿilmā
  trad: Il connaît ce qui est devant eux et ce qui est derrière eux, alors qu'eux-mêmes n'embrassent rien de Lui en connaissance.
- ref: S.20:111
  ar: ۞ وَعَنَتِ الْوُجُوهُ لِلْحَيِّ الْقَيُّومِ ۖ وَقَدْ خَابَ مَنْ حَمَلَ ظُلْمًا
  trl: Wa-ʿanati l-wujūhu li-l-ḥayyi l-qayyūmi — wa-qad khāba man ḥamala ẓulmā
  trad: Et les visages se courberont (*ʿanat*) devant al-Ḥayy, al-Qayyūm — et celui qui aura porté une injustice (*ẓulm*) aura certes échoué (*khāba*).
- ref: S.20:112
  ar: وَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ وَهُوَ مُؤْمِنٌ فَلَا يَخَافُ ظُلْمًا وَلَا هَضْمًا
  trl: Wa-man yaʿmal mina ṣ-ṣāliḥāti wa-huwa muʾminun fa-lā yakhāfu ẓulman wa-lā haḍmā
  trad: Et quiconque accomplit des œuvres justes (*ṣāliḥāt*), tout en étant croyant (*muʾmin*), ne craindra ni injustice (*ẓulm*) ni diminution (*haḍm*).
- ref: S.20:113
  ar: وَكَذَٰلِكَ أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا وَصَرَّفْنَا فِيهِ مِنَ الْوَعِيدِ لَعَلَّهُمْ يَتَّقُونَ أَوْ يُحْدِثُ لَهُمْ ذِكْرًا
  trl: Wa-kadhālika anzalnāhu qurʾānan ʿarabiyyan wa-ṣarrafnā fīhi mina l-waʿīdi laʿallahum yattaqūna aw yuḥdithu lahum dhikrā
  trad: Et c'est ainsi que Nous l'avons fait descendre — une Lecture (*qurʾān*) en langue arabe — et Nous y avons exposé, sous des formes variées (*ṣarrafnā*), de la mise en garde (*waʿīd*), afin qu'ils se prémunissent (*yattaqūn*), ou que cela suscite en eux un rappel nouveau.
- ref: S.20:114
  ar: فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ ۗ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ ۖ وَقُلْ رَبِّ زِدْنِي عِلْمًا
  trl: Fa-taʿālā llāhu l-maliku l-ḥaqqu — wa-lā taʿjal bi-l-qurʾāni min qabli an yuqḍā ilayka waḥyuhu — wa-qul rabbi zidnī ʿilmā
  trad: '*Taʿālā* Allaah, al-Malik, al-Ḥaqq — et ne te hâte pas avec le Qurʾān avant que sa révélation (*waḥy*) ne te soit menée à son terme (*yuqḍā*) — et dis : « Mon *Rabb*, accrois-moi en science (*ʿilm*). »'
- ref: S.20:115
  ar: وَلَقَدْ عَهِدْنَا إِلَىٰ آدَمَ مِنْ قَبْلُ فَنَسِيَ وَلَمْ نَجِدْ لَهُ عَزْمًا
  trl: Wa-laqad ʿahidnā ilā Ādama min qablu fa-nasiya wa-lam najid lahu ʿazmā
  trad: Et Nous avions certes confié à Ādam un engagement (*ʿahidnā*), auparavant — mais il l'oublia (*fa-nasiya*), et Nous ne trouvâmes en lui aucune résolution ferme (*ʿazm*).
- ref: S.20:116
  ar: وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ أَبَىٰ
  trl: Wa-idh qulnā li-l-malāʾikati sjudū li-Ādama fa-sajadū illā Iblīsa abā
  trad: 'Et [rappelle] quand Nous dîmes aux *malāʾika* : « Prosternez-vous devant Ādam » — ils se prosternèrent, sauf Iblīs : il refusa (*abā*).'
- ref: S.20:117
  ar: فَقُلْنَا يَا آدَمُ إِنَّ هَٰذَا عَدُوٌّ لَكَ وَلِزَوْجِكَ فَلَا يُخْرِجَنَّكُمَا مِنَ الْجَنَّةِ فَتَشْقَىٰ
  trl: Fa-qulnā yā Ādamu inna hādhā ʿaduwwun laka wa-li-zawjika fa-lā yukhrijannakumā mina l-jannati fa-tashqā
  trad: 'Nous dîmes alors : « Ô Ādam, celui-ci est certes un ennemi pour toi et pour ton épouse — qu''il ne vous fasse donc pas sortir de la *janna*, ce qui te rendrait malheureux (*tashqā*). »'
- ref: S.20:118
  ar: إِنَّ لَكَ أَلَّا تَجُوعَ فِيهَا وَلَا تَعْرَىٰ
  trl: Inna laka allā tajūʿa fīhā wa-lā taʿrā
  trad: Il t'est garanti là de n'avoir pas faim ni d'être dévêtu (*taʿrā*),
- ref: S.20:119
  ar: وَأَنَّكَ لَا تَظْمَأُ فِيهَا وَلَا تَضْحَىٰ
  trl: Wa-annaka lā taẓmaʾu fīhā wa-lā taḍḥā
  trad: et de n'avoir pas soif là ni de souffrir de l'ardeur du jour (*taḍḥā*).
- ref: S.20:120
  ar: فَوَسْوَسَ إِلَيْهِ الشَّيْطَانُ قَالَ يَا آدَمُ هَلْ أَدُلُّكَ عَلَىٰ شَجَرَةِ الْخُلْدِ وَمُلْكٍ لَا يَبْلَىٰ
  trl: Fa-waswasa ilayhi sh-shayṭānu qāla yā Ādamu hal adulluka ʿalā shajarati l-khuldi wa-mulkin lā yablā
  trad: 'Le *shayṭān* lui insuffla alors le doute (*waswasa*) ; il dit : « Ô Ādam, veux-tu que je te montre (*adulluka*) l''arbre de l''éternité (*shajarat al-khuld*) et un royaume qui ne s''use jamais (*mulkin lā yablā*) ? »'
- ref: S.20:121
  ar: فَأَكَلَا مِنْهَا فَبَدَتْ لَهُمَا سَوْآتُهُمَا وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ ۚ وَعَصَىٰ آدَمُ رَبَّهُ فَغَوَىٰ
  trl: Fa-akalā minhā fa-badat lahumā sawʾātuhumā wa-ṭafiqā yakhṣifāni ʿalayhimā min waraqi l-jannati — wa-ʿaṣā Ādamu rabbahu fa-ghawā
  trad: Ils mangèrent alors de cet arbre, et leurs nudités (*sawʾātuhumā*) leur apparurent ; ils se mirent à assembler (*yakhṣifāni*) sur eux des feuilles de la *janna* — Ādam désobéit (*ʿaṣā*) à son Rabb, et il erra (*ghawā*).
- ref: S.20:122
  ar: ثُمَّ اجْتَبَاهُ رَبُّهُ فَتَابَ عَلَيْهِ وَهَدَىٰ
  trl: Thumma jtabāhu rabbuhu fa-tāba ʿalayhi wa-hadā
  trad: Puis son Rabb le choisit (*ijtabāhu*), accueillit son retour (*tāba ʿalayhi*), et le guida (*hadā*).
- ref: S.20:123
  ar: قَالَ اهْبِطَا مِنْهَا جَمِيعًا ۖ بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ ۖ فَإِمَّا يَأْتِيَنَّكُمْ مِنِّي هُدًى فَمَنِ اتَّبَعَ هُدَايَ فَلَا يَضِلُّ وَلَا يَشْقَىٰ
  trl: Qāla-hbiṭā minhā jamīʿan — baʿḍukum li-baʿḍin ʿaduwwun — fa-immā yaʾtiyannakum minnī hudan fa-mani ttabaʿa hudāya fa-lā yaḍillu wa-lā yashqā
  trad: 'Il dit : « Descendez-en tous deux, ensemble — vous serez, les uns pour les autres, ennemis — si un guide (*hudan*) venant de Moi vous parvient, quiconque suivra Mon guide ne s''égarera pas et ne sera pas malheureux (*yashqā*). »'
- ref: S.20:124
  ar: وَمَنْ أَعْرَضَ عَنْ ذِكْرِي فَإِنَّ لَهُ مَعِيشَةً ضَنْكًا وَنَحْشُرُهُ يَوْمَ الْقِيَامَةِ أَعْمَىٰ
  trl: Wa-man aʿraḍa ʿan dhikrī fa-inna lahu maʿīshatan ḍankā wa-naḥshuruhu yawma l-qiyāmati aʿmā
  trad: Et quiconque se détourne (*aʿraḍa*) de Mon *dhikr* aura une existence resserrée (*maʿīshatan ḍankā*), et Nous le rassemblerons, au Jour de la Résurrection, aveugle.
- ref: S.20:125
  ar: قَالَ رَبِّ لِمَ حَشَرْتَنِي أَعْمَىٰ وَقَدْ كُنْتُ بَصِيرًا
  trl: Qāla rabbi lima ḥashartanī aʿmā wa-qad kuntu baṣīrā
  trad: 'Il dira : « Mon Rabb, pourquoi m''as-Tu rassemblé aveugle, alors que j''étais voyant (*baṣīran*) ? »'
- ref: S.20:126
  ar: قَالَ كَذَٰلِكَ أَتَتْكَ آيَاتُنَا فَنَسِيتَهَا ۖ وَكَذَٰلِكَ الْيَوْمَ تُنْسَىٰ
  trl: Qāla kadhālika atatka āyātunā fa-nasītahā — wa-kadhālika l-yawma tunsā
  trad: 'Il dira : « Ainsi — Nos *āyāt* te sont venues, et tu les as oubliées (*fa-nasītahā*) — ainsi, aujourd''hui, tu es oublié (*tunsā*) à ton tour. »'
- ref: S.20:127
  ar: وَكَذَٰلِكَ نَجْزِي مَنْ أَسْرَفَ وَلَمْ يُؤْمِنْ بِآيَاتِ رَبِّهِ ۚ وَلَعَذَابُ الْآخِرَةِ أَشَدُّ وَأَبْقَىٰ
  trl: Wa-kadhālika najzī man asrafa wa-lam yuʾmin bi-āyāti rabbihi — wa-la-ʿadhābu l-ākhirati ashaddu wa-abqā
  trad: Et c'est ainsi que Nous rétribuons quiconque outrepasse la mesure (*asrafa*) et ne croit pas aux *āyāt* de son Rabb — et le châtiment de l'Ākhira est certes plus sévère et plus durable (*abqā*).
- ref: S.20:128
  ar: أَفَلَمْ يَهْدِ لَهُمْ كَمْ أَهْلَكْنَا قَبْلَهُمْ مِنَ الْقُرُونِ يَمْشُونَ فِي مَسَاكِنِهِمْ ۗ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِأُولِي النُّهَىٰ
  trl: A-fa-lam yahdi lahum kam ahlaknā qablahum mina l-qurūni yamshūna fī masākinihim — inna fī dhālika la-āyātin li-ulī n-nuhā
  trad: Cela ne leur a-t-il donc pas montré combien de générations (*qurūn*) Nous avons anéanties avant eux, dans les demeures desquelles ils marchent ? En cela il y a certes des *āyāt* pour les gens de raison retenue (*ulī n-nuhā*).
- ref: S.20:129
  ar: وَلَوْلَا كَلِمَةٌ سَبَقَتْ مِنْ رَبِّكَ لَكَانَ لِزَامًا وَأَجَلٌ مُسَمًّى
  trl: Wa-lawlā kalimatun sabaqat min rabbika la-kāna lizāman wa-ajalun musammā
  trad: Et n'était une parole déjà écoulée (*kalimatun sabaqat*) de ton Rabb, et un terme fixé (*ajalun musammā*), cela serait déjà inéluctable (*lizāmā*).
- ref: S.20:130
  ar: فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا ۖ وَمِنْ آنَاءِ اللَّيْلِ فَسَبِّحْ وَأَطْرَافَ النَّهَارِ لَعَلَّكَ تَرْضَىٰ
  trl: Fa-ṣbir ʿalā mā yaqūlūna wa-sabbiḥ bi-ḥamdi rabbika qabla ṭulūʿi sh-shamsi wa-qabla ghurūbihā — wa-min ānāʾi l-layli fa-sabbiḥ wa-aṭrāfa n-nahāri laʿallaka tarḍā
  trad: Prends donc patience (*ṣbir*) devant ce qu'ils disent, et accomplis le *tasbīḥ* en la *ḥamd* de ton Rabb avant le lever du soleil et avant son coucher — et pendant les heures de la nuit (*ānāʾ al-layl*), accomplis le *tasbīḥ*, ainsi qu'aux extrémités du jour (*aṭrāf an-nahār*) — peut-être seras-tu satisfait (*tarḍā*).
- ref: S.20:131
  ar: وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِنْهُمْ زَهْرَةَ الْحَيَاةِ الدُّنْيَا لِنَفْتِنَهُمْ فِيهِ ۚ وَرِزْقُ رَبِّكَ خَيْرٌ وَأَبْقَىٰ
  trl: Wa-lā tamuddanna ʿaynayka ilā mā mattaʿnā bihi azwājan minhum zahrata l-ḥayāti d-dunyā li-naftinahum fīhi — wa-rizqu rabbika khayrun wa-abqā
  trad: 'Et n''étends pas tes yeux vers ce dont Nous avons fait jouir certains groupes (*azwājan*) parmi eux — l''éclat de la vie d''ici-bas (*zahrat al-ḥayāti d-dunyā*) — pour les y mettre à l''épreuve (*li-naftinahum*) : le *rizq* de ton Rabb est meilleur et plus durable (*abqā*).'
- ref: S.20:132
  ar: وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا ۖ لَا نَسْأَلُكَ رِزْقًا ۖ نَحْنُ نَرْزُقُكَ ۗ وَالْعَاقِبَةُ لِلتَّقْوَىٰ
  trl: Wa-mur ahlaka bi-ṣ-ṣalāti wa-ṣṭabir ʿalayhā — lā nasʾaluka rizqan naḥnu narzuquka — wa-l-ʿāqibatu li-t-taqwā
  trad: Et ordonne à ta famille la *ṣalāt*, et sois-y assidu avec constance (*iṣṭabir*) — Nous ne te demandons pas de *rizq*, c'est Nous qui te pourvoyons — et l'issue finale (*al-ʿāqiba*) revient à la *taqwā*.
- ref: S.20:133
  ar: وَقَالُوا لَوْلَا يَأْتِينَا بِآيَةٍ مِنْ رَبِّهِ ۚ أَوَلَمْ تَأْتِهِمْ بَيِّنَةُ مَا فِي الصُّحُفِ الْأُولَىٰ
  trl: Wa-qālū lawlā yaʾtīnā bi-āyatin min rabbihi — a-wa-lam taʾtihim bayyinatu mā fi ṣ-ṣuḥufi l-ūlā
  trad: 'Et ils dirent : « Que ne nous apporte-t-il un signe (*āya*) de son Rabb ? » — La preuve manifeste (*bayyina*) de ce qui est dans les Écrits antérieurs (*aṣ-ṣuḥuf al-ūlā*) ne leur est-elle donc pas venue ?'
- ref: S.20:134
  ar: وَلَوْ أَنَّا أَهْلَكْنَاهُمْ بِعَذَابٍ مِنْ قَبْلِهِ لَقَالُوا رَبَّنَا لَوْلَا أَرْسَلْتَ إِلَيْنَا رَسُولًا فَنَتَّبِعَ آيَاتِكَ مِنْ قَبْلِ أَنْ نَذِلَّ وَنَخْزَىٰ
  trl: Wa-law annā ahlaknāhum bi-ʿadhābin min qablihi la-qālū rabbanā lawlā arsalta ilaynā rasūlan fa-nattabiʿa āyātika min qabli an nadhilla wa-nakhzā
  trad: 'Et si Nous les avions anéantis par un châtiment avant lui [ce Qurʾān], ils auraient dit : « Notre Rabb, que ne nous as-Tu envoyé un *rasūl*, pour que nous suivions Tes *āyāt* avant d''être humiliés (*nadhilla*) et déshonorés (*nakhzā*) ? »'
- ref: S.20:135
  ar: قُلْ كُلٌّ مُتَرَبِّصٌ فَتَرَبَّصُوا ۖ فَسَتَعْلَمُونَ مَنْ أَصْحَابُ الصِّرَاطِ السَّوِيِّ وَمَنِ اهْتَدَىٰ
  trl: Qul kullun mutarabbiṣun fa-tarabbaṣū — fa-sa-taʿlamūna man aṣḥābu ṣ-ṣirāṭi s-sawiyyi wa-mani htadā
  trad: 'Dis : « Chacun demeure dans l''attente (*mutarabbiṣ*) — attendez donc — vous saurez bientôt qui sont les compagnons du chemin égal (*aṣ-ṣirāṭ as-sawiyy*) et qui a trouvé la guidance (*ihtadā*). »'
